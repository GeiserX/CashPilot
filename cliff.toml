# git-cliff configuration — https://git-cliff.org
#
# WHY THIS EXISTS
# ---------------
# ~200 tags over ~430 commits is roughly two commits per release. GitHub already
# renders per-release notes (release.yml sets generate_release_notes: true, and
# it works), but there was no AGGREGATE: upgrading 1.10.1 -> 1.13.0 meant opening
# thirty release pages that each contained one PR title. This produces the single
# file that answers "what changed between the version I run and the one I want".
#
# WHY git-cliff AND NOT THE ALTERNATIVES
# --------------------------------------
# It renders notes without taking over version bumping: `--tag` only LABELS a
# section, it never creates a ref, so the bump logic in release.yml is untouched.
# release-please and semantic-release both replace that workflow; standard-version
# is deprecated; GitHub's own .github/release.yml groups by PR LABEL rather than
# commit type and cannot write a file.
#
# WHAT THIS FILE CANNOT TELL YOU
# ------------------------------
# Exactly ONE commit in the entire history carries a `!` breaking marker. A
# generated changelog will therefore show almost no breaking changes, and that is
# NOT the same as there having been none. Anything a user must ACT on before
# upgrading belongs in the hand-written UPGRADING.md, which is why that file is
# maintained by hand and linked from the header below.

[changelog]
header = """
# Changelog

Every release, grouped by what changed. Generated from commit history.

> **Upgrading?** Read [UPGRADING.md](UPGRADING.md) first. This file lists what
> changed; that one lists what you have to *do*. They are not the same, and this
> file cannot be trusted to flag breaking changes — only one commit in the
> project's history carries a breaking-change marker.

Releases before `1.0.0` were recorded by hand and are kept verbatim in
[docs/changelog-0.x-handwritten.md](docs/changelog-0.x-handwritten.md).

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""

trim = true

footer = """
<!-- Generated by git-cliff. Do not edit by hand: `git cliff -o CHANGELOG.md`. -->
"""

[git]
conventional_commits = true
# Non-conventional subjects are KEPT, not dropped. ~40% of this history predates
# the convention ("Switch to self-hosted runner", and two compound types such as
# `fix+refactor:`). Discarding them would make the file quietly incomplete, which
# is worse than a slightly untidy "Other" section.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "newest"

commit_parsers = [
  # Ordered: the first match wins, so the specific patterns precede the generic.
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^security", group = "Security" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^docker", group = "Packaging" },
  # Dependency bumps are the single largest source of noise (25 by prefix, plus
  # most Dependabot subjects). Grouped rather than skipped: a user auditing a CVE
  # needs to see the bump, and this project has shipped fixes that were only a
  # dependency bump.
  { message = "^deps", group = "Dependencies" },
  { message = "^(build|chore)\\(deps", group = "Dependencies" },
  { message = "^[Bb]ump ", group = "Dependencies" },
  { message = "^ci", group = "CI" },
  { message = "^(chore|style|build)", group = "Maintenance" },
  # Release commits are pure bookkeeping and say nothing a reader needs.
  { message = "^(chore\\(release\\)|Release v?[0-9])", skip = true },
  # Merge commits restate a PR title that already appears as its own entry.
  { message = "^Merge (pull request|branch|remote)", skip = true },

  # --- pre-convention history -------------------------------------------
  # Roughly 40% of this project predates conventional commits, and those
  # subjects were all landing in one undifferentiated "Other" heap — 174
  # entries, which is not a changelog section, it is a pile. These rules were
  # written against the ACTUAL subjects and measured: together they classify
  # 123 of the 174. The remaining ~58 are genuinely mixed ("Security +
  # reliability + docs: whole-repo audit follow-ups") and stay in Other, which
  # is the honest place for them.
  #
  # Case matters: the conventional rules above are lowercase, so a capitalised
  # "Fix ..." falls through to here rather than being caught twice.
  { message = "^Switch to self-hosted runner", group = "CI" },
  { message = "^(Add|Support|Enable|Show|Implement) ", group = "Features" },
  { message = "^(Update|Fix|Remove|Improve|Pin|Clean up) ", group = "Fixes" },
  { message = ".*", group = "Other" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
