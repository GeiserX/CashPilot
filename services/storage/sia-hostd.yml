name: Sia (hostd)
slug: sia-hostd
category: storage
status: active
website: https://sia.tech
description: >
  Sia is a decentralized storage marketplace run by the Sia Foundation (a Swiss
  non-profit) that has operated since 2015. Run the Foundation's official hostd
  node to rent out spare disk space and earn Siacoin from storage and bandwidth
  contracts. hostd ships an official Docker image and a built-in web UI. Hosts
  lock a small collateral per stored TB that is returned when contracts complete
  successfully, so a stable, always-on machine is required. Earnings depend on
  how much data renters actually store on the node; storage prices hover around
  $0.4-1.5 per TB per month, so it suits machines with large spare disks rather
  than small VPS slices.
short_description: Sia Foundation storage node - official Docker image, earn Siacoin

docker:
  image: ghcr.io/siafoundation/hostd:latest
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "2g"
    # A storage node the network dials back into; keep it weighted above the
    # default so a contended host does not make it answer slowly (see the
    # cpu_shares note in _schema.yml).
    cpu_shares: 4096
  env:
    - key: HOSTD_WALLET_SEED
      label: "Wallet seed phrase"
      required: true
      secret: true
      description: "BIP-39 seed phrase that controls the host's Siacoin wallet. Generate one with `docker run --rm ghcr.io/siafoundation/hostd:latest seed` and back it up -- it is the ONLY way to reach the earnings"
    - key: HOSTD_API_PASSWORD
      label: "Dashboard password"
      required: true
      secret: true
      description: "Password for the hostd web UI and local API (BasicAuth). Any long passphrase"
    - key: SIA_STORAGE_DIR
      label: "Storage directory"
      required: true
      secret: false
      description: "Host path on your largest disk where renter data is stored (e.g. /srv/sia). Needs at least 256GB free"
  ports:
    # Dashboard/API. Every endpoint sits behind BasicAuth with the API
    # password, but Sia's own Docker guide binds this port to 127.0.0.1 --
    # a restriction CashPilot's port format cannot express -- so restrict
    # it at your firewall when the machine has a public address (see the
    # guide).
    - "9980:9980"
    # RHP4 (TCP) must be reachable so renters can form contracts.
    - "9981:9981"
    # RHP4 over QUIC: TCP and UDP, matching Sia's official compose guide.
    - "9984:9984/tcp"
    - "9984:9984/udp"
  volumes:
    # Consensus + host databases (named volume; recreated nodes re-sync).
    - "sia-hostd-data:/data"
    # Where renter data is actually stored. Point it at the largest disk.
    - "${SIA_STORAGE_DIR}:/storage"
  critical_volumes:
    - target: "/data"
      holds: >-
        Wallet database, host settings and contract state. Losing it loses the
        node's identity and contract revenue tracking; the seed phrase remains
        the only recovery path for funds.
    - target: "/storage"
      holds: >-
        Stored renter data. Losing it fails storage proofs and forfeits the
        collateral locked against those contracts.
  command: ""
  network_mode: ""
  health_signals:
    # hostd logs "failed to" lines from its contract manager when the network
    # cannot reach it (port not forwarded, wrong address). Only a pattern
    # actually observed in hostd logs should ship; this entry documents the
    # mechanism pending a live deployment log capture.
    - pattern: "failed to"
      means: >-
        hostd reported an operational failure in its logs. Read the surrounding
        log lines: contract and network errors usually mean the RHP4 ports
        (9981, 9984 TCP+UDP) are not reachable from the internet at this
        machine's address.
      state: failing
  setup: >
    Before first run, generate a seed and write the config:
    `docker run --rm -it ghcr.io/siafoundation/hostd:latest seed`
    then `docker compose run --rm -it hostd config` (official Sia Docs
    procedure). Alternatively pass HOSTD_WALLET_SEED and HOSTD_API_PASSWORD as
    environment variables and start directly.

requirements:
  residential_ip: false
  vps_ip: true
  min_storage: "256GB"
  gpu: false
  note: "A stable public address with ports 9981 and 9984 (TCP; 9984 also UDP) forwarded is required for contract formation. Datacenter/VPS hosting is common on Sia."

payment:
  methods: [crypto]
  crypto_token: "SC"
  minimum_payout: "$0"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 10
  currency: USD
  per: "TB"
  notes: >
    Sia storage prices are set by a free market; recent typical pricing is
    roughly $0.4-1.5 per TB stored per month (Sia Central pricing history), so
    income scales with how much renter data lands on the node. Collateral of a
    similar size to the storage price is locked per contract and returned on
    successful completion.

cashout:
  method: manual
  dashboard_url: "http://localhost:9980"
  min_amount: 0
  currency: USD
  notes: >
    Earnings accrue in the host's own Siacoin wallet (seed-controlled). Convert
    SC on an exchange and withdraw to bank/card from there; there is no
    provider-side payout request.

platforms: [docker, linux, windows, macos]

collector:
  type: manual
  notes: >
    hostd exposes a local REST API on port 9980 (BasicAuth with the API
    password): GET /wallet returns the wallet balance, GET /metrics and
    GET /settings return host revenue and configuration. A future collector can
    read those endpoints the same way the Storj collector reads the local
    storagenode API -- but adding it requires an app-side change
    (app/collectors), so it is proposed upstream rather than shipped here.

payout:
  model: external
  chain: sia
  address_source: app
  notes: >
    Funds live in the seed-controlled Sia wallet inside the node. CashPilot
    never holds the key; the seed phrase is the only recovery path and must be
    backed up before first deploy.

disclosure:
  sells: >-
    Disk space and the bandwidth to serve it.
  third_party_traffic: >-
    No. Renters store encrypted file fragments on your disk and fetch them
    back. Other people do not route arbitrary traffic through your IP.
  data_collected: >-
    Your Sia wallet address, host public key, and the public IP:port the node
    announces so renters can reach it.
  isp_risk: >-
    Sustained upload/download traffic on the line, similar to running any
    storage server; no anonymised third-party web traffic is attributed to you.
  account_rules: >-
    Permissionless: no signup or account. One wallet per seed; running several
    hosts from one /24 subnet splits renter demand between them.
