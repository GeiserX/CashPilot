name: Storj
slug: storj
category: storage
status: active
website: https://www.storj.io
description: >
  Storj is a decentralized cloud storage network where you earn by renting out
  your unused disk space. Run the storage node via Docker and get paid approximately
  $1.50/TB stored per month plus $2/TB egress. Payments are in STORJ token or via
  zkSync L2. Requires at least 550GB of available disk space and a stable internet
  connection. One of the most mature and truly passive storage income services.
  No account or signup needed -- nodes are permissionless since mid-2025.
short_description: Decentralized storage node - ~$1.50/TB stored + $2/TB egress

referral:
  signup_url: "https://storj.dev/node/get-started/setup"

docker:
  image: storjlabs/storagenode
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "2g"
    oom_score_adj: -100
  env:
    - key: WALLET
      label: "Wallet address"
      required: true
      secret: false
      description: "ERC-20 wallet address for STORJ token payouts (e.g. 0x1234...abcd). Must be self-custodial (MetaMask, Ledger, etc.) -- never use an exchange address"
    - key: EMAIL
      label: "Email"
      required: true
      secret: false
      description: "Email address for operator notifications"
    - key: ADDRESS
      label: "External address"
      required: true
      secret: false
      description: "DDNS hostname with port (e.g. mynode.ddns.net:28967) -- strongly preferred over a literal IP, which strands the node the day your ISP silently re-provisions it. Port 28967 must be forwarded (TCP+UDP)"
    - key: STORAGE
      label: "Storage allocation"
      required: true
      secret: false
      description: "Maximum disk space to allocate (e.g. 2TB). Use spinning disks (HDD), not SSD"
      default: "1TB"
    - key: IDENTITY_DIR
      label: "Identity directory"
      required: true
      secret: false
      description: "Host path where identity files are stored (must contain ca.cert, ca.key, identity.cert, identity.key)"
    - key: STORAGE_DIR
      label: "Storage directory"
      required: true
      secret: false
      description: "Host path on a spinning disk (HDD) for Storj data storage. Needs at least 550GB free"
  ports: ["28967:28967/tcp", "28967:28967/udp", "14002:14002"]
  volumes:
    - "${IDENTITY_DIR}:/app/identity"
    - "${STORAGE_DIR}:/app/config"
  critical_volumes:
    - target: "/app/identity"
      holds: >-
        Node identity. Its ID is proof-of-work bound and takes hours to
        regenerate, and it cannot be recreated from a backup of anything else.
        Losing it forfeits the held payout balance.
    - target: "/app/config"
      holds: >-
        Stored customer data and the node's held amount. Losing it disqualifies
        the node and forfeits the held balance.
  command: "--operator.wallet-features=zksync-era"
  network_mode: ""
  # Satellites dial the node at exactly this env var's value, so the worker
  # reports it and the UI cross-checks it against the machine's current
  # egress IP — the check that catches a stale advertised IP the day it goes
  # stale instead of days later via provider email.
  advertised_address_env: ADDRESS
  health_signals:
    # Seen live (Aug 2026): ~40x/hour for days while the container looked
    # perfectly healthy -- the node advertised a stale IP after an ISP
    # re-provision, and every satellite dial-back timed out. The line is the
    # node relaying the satellite's own error, so it names the MECHANISM
    # (the network cannot dial the node back), not one cause: a refused
    # connection or an unresolvable hostname produces the same match.
    - pattern: "ping satellite.*failed to dial storage node"
      means: >-
        The Storj network cannot dial your node back at its advertised
        ADDRESS, so satellites count it offline: new data stops arriving,
        egress income stalls, and sustained offline time leads to suspension.
        Check that ADDRESS matches your CURRENT public IP (use a DDNS
        hostname, not a literal IP, so an ISP re-provision cannot strand the
        node) and that port 28967 TCP+UDP is forwarded to this machine.
      state: failing
  stop_timeout: 300
  setup: >
    Before first run, initialize the storage node config:
    docker run --rm -e SETUP="true"
    --user $(id -u):$(id -g)
    --mount type=bind,source="<IDENTITY_DIR>",destination=/app/identity
    --mount type=bind,source="<STORAGE_DIR>",destination=/app/config
    --name storagenode storjlabs/storagenode:latest
  notes: >
    Image is storjlabs/storagenode (not storj/storagenode).
    A one-time setup step (SETUP=true) must be run before deploying the main container.
    Identity must be pre-generated using the identity binary (proof-of-work to difficulty 36, takes hours).
    Use spinning disks for storage. Port 28967 TCP+UDP must be forwarded.
    Dashboard at port 14002 — use your server's LAN IP (not localhost) for the collector API URL.

requirements:
  residential_ip: false
  note: "Storj nodes on the same /24 subnet share data allocation, reducing per-node earnings."
  note_column: devices_per_ip
  min_bandwidth: "5 Mbps upload"
  gpu: false
  min_storage: "550GB"

payment:
  methods: [crypto]
  minimum_payout: "$4"
  currency: STORJ
  frequency: "Monthly"

earnings:
  monthly_low: 0
  monthly_high: 15
  currency: USD
  per: "TB"
  notes: "~$1.50/TB stored + $2/TB egress + $2.74/TB audit/repair. Earnings scale with disk allocated and node age. First 9 months have held-back escrow. Port 28967 must be forwarded."

cashout:
  method: redirect
  dashboard_url: "http://localhost:14002"
  min_amount: 4.0
  currency: USD
  notes: "Payouts sent monthly in STORJ tokens to configured wallet address. Dashboard at port 14002."

platforms: [docker, windows, linux]

collector:
  type: api
  notes: "Local dashboard at port 14002. API at /api/sno for node stats, earnings, bandwidth. No auth needed on local interface."

# What this service does with the user's machine (CashPilot-66x).
# Written to be read by someone deciding whether to trust it.
disclosure:
  sells: >-
    Disk space and the bandwidth to serve it.
  third_party_traffic: >-
    No. You store encrypted, erasure-coded fragments of customer data. Other
    people do not route their own traffic through your IP.
  data_collected: >-
    Node identity, your wallet address, the email address the node requires for
    operator notifications, and your IP and port, which must be reachable for
    the node to serve data.
  isp_risk: >-
    Mainly a data-cap question rather than a liability one: a node serves and
    ingests customer data continuously, which is real sustained traffic on your
    line. Unlike a proxy or a relay, though, it is not anonymised third-party
    traffic attributed to you as its origin, so it does not attract the abuse
    complaints those do.
  account_rules: >-
    Unlimited nodes, but nodes on the same /24 subnet share allocation, so
    several on one connection earn less each.

payout:
  model: external
  chain: ethereum
  address_env: WALLET
  address_source: env
  notes: "Paid monthly in STORJ (ERC-20) to the address in WALLET."
