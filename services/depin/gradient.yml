  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: GRADIENT
  frequency: "Token airdrop (TBA)"

earnings:
  monthly_low: 0
  monthly_high: 8
  currency: USD
  per: "device"
  notes: "Earns Gradient Points pre-token launch. Web-based node runs in browser tab. Backed by Pantera Capital, which may indicate stronger token value at launch."

cashout:
  method: redirect
  dashboard_url: "https://app.gradient.network/dashboard"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: GRADIENT
  notes: "Points-based system. Token conversion TBD."

platforms: [browser-extension]

collector:
  type: scrape
  notes: "Points visible at app.gradient.network dashboard. No public API documented."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

