name: Gradient Network
slug: gradient
category: depin
status: active
website: https://gradient.network
description: >
  Gradient Network is a decentralized compute and bandwidth sharing platform
  backed by Pantera Capital. Users earn Gradient Points by running a browser-based
  node that contributes idle resources to the network. The project focuses on
  building open AI infrastructure through distributed edge computing.
short_description: DePIN network backed by Pantera Capital - browser-based node

referral:
  signup_url: "https://app.gradient.network/signup?referralCode=YSKMY7"
  code: "YSKMY7"

