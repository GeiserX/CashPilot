name: Nodepay
slug: nodepay
category: depin
status: active
website: https://nodepay.ai
description: >
  Nodepay is a DePIN network that rewards users for sharing bandwidth through
  a browser extension. The platform is behind Cloudflare protection which can
  complicate automated access. Users earn Nodepay Points by keeping the extension
  active. The network focuses on providing AI training data infrastructure.
short_description: DePIN bandwidth sharing for AI - browser extension

referral:
  signup_url: "https://app.nodepay.ai/register?ref=0wzzyznen64j9zx"

docker:
  image: ""
  platforms: [browser-extension]
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: NC
  frequency: "Token airdrop (TBA)"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Earns Nodepay Points pre-token launch. Cloudflare protection may block automated collection. Browser extension required."

cashout:
  method: redirect
  dashboard_url: "https://app.nodepay.ai/dashboard"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: NC
  notes: "Points-based system. Token conversion TBD."

platforms: [browser-extension]

collector:
  type: scrape
  notes: "Behind Cloudflare. API access may require browser session cookies. Dashboard at app.nodepay.ai."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."
