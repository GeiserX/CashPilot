name: Nodepay
slug: nodepay
category: depin
status: active
website: https://nodepay.ai
description: >
  Nodepay is a DePIN network that rewards users for sharing bandwidth through
  a browser extension. The platform is behind Cloudflare protection which can
  complicate automated access. Users earn Nodepay Points by keeping the extension
  active. The network focuses on providing AI training data infrastructure.
short_description: DePIN bandwidth sharing for AI - browser extension

referral:
  signup_url: "https://app.nodepay.ai/register?ref=0wzzyznen64j9zx"
  code: "0wzzyznen64j9zx"

docker:
  image: ""
  platforms: [browser-extension]
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: NC
  frequency: "Token airdrop (TBA)"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Earns Nodepay Points pre-token launch. Cloudflare protection may block automated collection. Browser extension required."

cashout:
  method: redirect
  dashboard_url: "https://app.nodepay.ai/dashboard"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: NC
  notes: "Points-based system. Token conversion TBD."

platforms: [browser-extension]

collector:
  type: scrape
  notes: "Behind Cloudflare. API access may require browser session cookies. Dashboard at app.nodepay.ai."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: unknown
    account_safety: fair
    terms_fit: good
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: fair
    support: unknown
    earnings_realism: poor
    longevity: unknown
  notes:
    payout_record: The NC token launched in January 2025; we found no pattern of reports about claims
      either way.
    payout_terms: Sources disagree on whether earning now requires staking NC; not confirmed on Nodepay's
      own pages.
    traffic_transparency: Not documented on pages we read.
    privacy: Not reviewed.
    support: No pattern found.
    longevity: We did not confirm the company behind Nodepay.
  cons:
  - text: In its first season review Nodepay removed more than 300,000 accounts it judged to be bots and
      cancelled 17 billion points.
    criterion: account_safety
    kind: press
    source: https://coinmarketcap.com/academy/article/nodepay-airdrop-guide-everything-you-need-to-know
    checked_on: "2026-11-04"
  - text: Eligibility needed a Solana wallet plus verified email, Discord and X accounts.
    criterion: identity_checks
    kind: press
    source: https://coinmarketcap.com/academy/article/nodepay-airdrop-guide-everything-you-need-to-know
    checked_on: "2026-11-04"
  - text: Rewards are points converted to the NC token, so their value rests on the token.
    criterion: earnings_realism
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/depin/nodepay.yml
    checked_on: "2026-11-04"
  pros:
  - text: 'CashPilot does not run Nodepay: you use the provider''s own browser extension, so there is
      no container for its terms to forbid.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/depin/nodepay.yml
    checked_on: "2026-11-04"
