name: Sentinel dVPN
slug: sentinel-dvpn
category: depin
status: active
website: https://sentinel.co
description: >
  Sentinel is a Layer 1 Cosmos blockchain for decentralized VPN. Node operators
  sell bandwidth to VPN users with flexible pricing (per-GB or hourly). Official
  Docker deployment guide available. Long-running project with active community.
short_description: Decentralized VPN on Cosmos - node operators sell bandwidth

referral:
  signup_url: "https://sentinel.co"
  program: false

docker:
  image: ""
  platforms: []
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: false
  min_bandwidth: "10 Mbps"
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: DVPN
  frequency: "Per session"

earnings:
  monthly_low: 0
  monthly_high: 30
  currency: USD
  per: "node"
  notes: "Operators set own pricing per-GB or hourly. Earnings depend on VPN user demand in your region."

cashout:
  method: manual
  dashboard_url: "https://sentinel.co"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: DVPN

platforms: [linux]

collector:
  type: manual
  notes: "Cosmos blockchain-based. Earnings tracked on-chain. Node Spawner tool available for automated setup."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: fair
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: good
    identity_checks: unknown
    support: unknown
    earnings_realism: unknown
    longevity: fair
  notes:
    payout_record: Payments are on-chain per session or per hour; we have no node of our own to report.
    payout_terms: Paid in P2P token, 20% of each payment goes to stakers
    account_safety: There is no account to ban; nodes are permissionless.
    terms_fit: Own node software, CashPilot cannot deploy or update it
    traffic_transparency: VPN users route their traffic through your node; the protocol does not vet them.
    privacy: Node source code published under its own licence
    identity_checks: Not documented beyond a wallet.
    support: No pattern found.
    earnings_realism: Hosts set their own prices; we found no published earnings figures to compare.
    longevity: Token renamed SENT to DVPN in 2021, then P2P in 2025
  cons:
  - text: Payments are in the P2P token, and 20% of every bandwidth payment goes to stakers rather than
      the node host.
    criterion: payout_terms
    kind: terms
    source: https://docs.sentinel.co/dvpn-nodes/earnings
    checked_on: "2026-11-04"
  - text: The token was renamed from SENT to DVPN in 2021 and from DVPN to P2P in 2025.
    criterion: longevity
    kind: terms
    source: https://medium.com/sentinel/sentinel-is-changing-its-ticker-from-dvpn-to-p2p-with-its-ai-data-layer-launch-e5fde9443e6b
    checked_on: "2026-11-04"
  - text: 'CashPilot does not run Sentinel: you use the provider''s own node software, so CashPilot cannot
      deploy or update it for you. Its terms were not checked for containers.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/depin/sentinel-dvpn.yml
    checked_on: "2026-11-04"
  pros:
  - text: Sentinel publishes its node source code under its own open source licence.
    criterion: privacy
    kind: terms
    source: https://github.com/sentinel-official/sentinel-dvpnx
    checked_on: "2026-11-04"
