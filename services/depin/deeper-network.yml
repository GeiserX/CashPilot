name: Deeper Network
slug: deeper-network
category: depin
status: active
website: https://deeper.network
description: >
  Deeper Network is a decentralized VPN and web3 infrastructure project.
  Primarily requires proprietary Deeper Connect hardware devices. Moken is
  a related mining/staking platform. Not software-only.
short_description: Decentralized VPN - requires proprietary hardware device

referral:
  # Deeper pays referrers on the device sale (UpPromote affiliate), not on node earnings;
  # a node needs the Deeper Connect box, so the shop is the one paid step on the way in.
  signup_url: "https://shop.deeper.network?sca_ref=12020100.q8Vxm3SliA"
  code: "12020100.q8Vxm3SliA"
  program: true
  bonus:
    referrer: "Commission on the device sale"
    referee: "5% off the Deeper Connect device with coupon SERGIO"

docker:
  image: ""
  platforms: []
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: DPR
  frequency: "Continuous"

earnings:
  monthly_low: 0
  monthly_high: 30
  currency: USD
  per: "device"
  notes: "Requires Deeper Connect hardware ($200-500). Moken platform for mining/staking. Not software-only."

cashout:
  method: manual
  dashboard_url: "https://device.deeper.network"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: DPR

platforms: []

collector:
  type: manual
  notes: "Hardware device dashboard. Requires Deeper Connect device."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

