name: Grass
slug: grass
category: depin
status: active
website: https://www.grass.io
description: >
  Grass is a decentralized network that lets you sell your unused bandwidth for
  AI training data. It operates as a browser extension and desktop app, routing
  web scraping requests through your connection to build structured datasets.
  With 8.5M+ users, it is one of the largest DePIN bandwidth networks. Earns
  GRASS tokens on the Solana blockchain.
short_description: DePIN bandwidth sharing for AI data - earns GRASS tokens

referral:
  signup_url: "https://app.grass.io/register?referralCode=kn8FNEPnUr2tMqE"
  code: "kn8FNEPnUr2tMqE"
  bonus:
    referrer: "20% of direct referrals' uptime points, 10% at the second level, 5% at the third"

docker:
  image: ""
  platforms: [browser-extension, windows, macos, android, ios]
  env:
    - key: GRASS_ACCESS_TOKEN
      label: "Access Token"
      required: true
      secret: true
      description: "Log in at <a href=\"https://app.grass.io\">app.grass.io</a>, press F12 → Application → Local Storage → click <code>https://app.grass.io</code> → copy the <code>token</code> value"
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: GRASS
  frequency: "Epoch-based airdrop"

earnings:
  monthly_low: 0
  monthly_high: 10
  currency: USD
  per: "device"
  notes: "Earns Grass Points convertible to GRASS tokens via airdrops. Actual USD value depends on token price. Browser extension or desktop app required."

cashout:
  method: redirect
  dashboard_url: "https://app.grass.io/dashboard"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: GRASS
  notes: "GRASS token airdrop-based. Claim from dashboard when eligible."

platforms: [browser-extension, windows, macos, android, ios]

collector:
  type: api
  # Days the balance can stand still while this works normally.
  # Points settle per epoch rather than continuously, so the balance can
  # stand still for days between settlements.
  quiet_days: 10
  notes: "Dashboard API at app.grass.io. Auth via session token. Points visible in dashboard."
  credential_hint: "Log in at <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, press F12 → Application → Local Storage, copy the <b>accessToken</b> value."

payout:
  model: internal
  notes: "Accrues POINTS; GRASS is claimed from the Grass dashboard during periodic airdrops."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: good
    payout_terms: poor
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: poor
    longevity: unknown
  notes:
    account_safety: We found no repeated reports of banned accounts.
    traffic_transparency: Grass sells web data scraped through your connection; we did not find how its
      buyers are checked.
    privacy: Not reviewed.
    identity_checks: Claims go to a wallet; we did not find what else a claim asks for.
    support: No pattern found.
    longevity: Grass is built by Wynd Network, a named and funded company; we did not confirm how long
      it has run.
  cons:
  - text: Rewards come only through airdrop seasons. Long-running node operators reported season 2 estimates
      in the single to low double-digit dollar range.
    criterion: earnings_realism
    kind: press
    source: https://www.coingabbar.com/en/crypto-currency-news/grass-airdrop-season-2-claim-date-wallet-launch-price
    checked_on: "2026-11-04"
  - text: Season 2 rewards not claimed by 22 January 2027 are lost for good.
    criterion: payout_terms
    kind: press
    source: https://www.coingabbar.com/en/crypto-currency-news/grass-airdrop-season-2-claim-date-wallet-launch-price
    checked_on: "2026-11-04"
  - text: The first airdrop drew a backlash over small rewards per point, diluted across more than two
      million users.
    criterion: earnings_realism
    kind: press
    source: https://beincrypto.com/grass-airdrop-sparks-outrage/
    checked_on: "2026-11-04"
  - text: 'CashPilot does not run Grass: you use the provider''s own app or extension, so CashPilot cannot
      deploy or update it for you. Its terms were not checked for containers.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/depin/grass.yml
    checked_on: "2026-11-04"
  pros:
  - text: The first airdrop reached nearly 1.5 million claiming addresses.
    criterion: payout_record
    kind: press
    source: https://www.theblock.co/post/323805/grass-becomes-most-distributed-solana-airdrop-as-nearly-1-5-million-addresses-claim-tokens
    checked_on: "2026-11-04"
