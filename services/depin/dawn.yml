name: Dawn Internet
slug: dawn
category: depin
status: active
website: https://infrastructure.finance/validator-extension
description: >
  DAWN runs a validator network that checks bandwidth and coverage for the AI
  infrastructure financed through the DAWN protocol. The DAWN Validator browser
  extension takes part in these proof-of-bandwidth and coverage checks and earns
  DAWN rewards while it runs. The rewards have no settled cash value yet. Create the
  account in the extension and enter referral code 2QLQV97F when it asks.
short_description: DePIN validator - browser extension earns DAWN points

referral:
  signup_url: "https://infrastructure.finance/validator-extension?code=2QLQV97F"
  code: "2QLQV97F"
  code_entry: "2QLQV97F"

docker:
  image: ""
  platforms: []
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: DAWN
  frequency: "Token airdrop (TBA)"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Earns Dawn Points pre-token launch. Actual value depends on future token price. Hardware box earns more than browser extension."

cashout:
  method: manual
  dashboard_url: "https://dashboard.dawninternet.com"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: DAWN
  notes: "Extension works but half-baked. Black Box hardware announced. Check future."

platforms: [browser-extension]

collector:
  type: scrape
  notes: "Points visible in extension popup and web dashboard. No public API documented."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

