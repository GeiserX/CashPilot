name: Dawn Internet
slug: dawn
category: depin
status: active
website: https://dawninternet.com
description: >
  Dawn Internet is a decentralized wireless network that rewards users for sharing
  their internet connection. Available as a browser extension and a dedicated
  hardware box (Dawn Node). The extension passively earns Dawn Points while you
  browse. The network aims to build a decentralized ISP layer for underserved areas.
short_description: DePIN wireless network - browser extension and hardware box

