name: Anyone Protocol
slug: anyone-protocol
category: depin
status: active
website: https://anyone.io
description: >
  Anyone Protocol (formerly ATOR) is a decentralized onion-routing privacy
  network. Node operators run relay nodes and earn ANYONE tokens for bandwidth
  contributed. Think "incentivized Tor." Official Docker images available for
  amd64 and arm64 including Raspberry Pi. Configuration is file-based via an
  anonrc file mounted into the container (Nickname, ContactInfo, ORPort, etc.).
short_description: Decentralized onion routing - incentivized Tor relay nodes

referral:
  signup_url: "https://anyone.io"
  program: false

docker:
  image: ghcr.io/anyone-protocol/ator-protocol
  tag: latest
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "1536m"
    oom_score_adj: -100
  env: []
  ports: ["9001:9001"]
  volumes:
    - "anon-data:/var/lib/anon"
    - "anon-config:/etc/anon"
    - "anon-run:/run/anon"
  critical_volumes:
    - target: "/var/lib/anon"
      holds: >-
        Relay ed25519 identity key. Destroying it retires the relay's reputation
        and restarts its earning history from zero.
  command: ""
  network_mode: ""
  notes: >
    Requires an anonrc config file mounted at /etc/anon/anonrc with AgreeToTerms 1.
    The config dir must be writable (chown 100:101) for notices.log.
    Port 9001 is the ORPort for relay traffic.

requirements:
  residential_ip: false
  min_bandwidth: "10 Mbps"
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: ANYONE
  frequency: "Epoch-based"

earnings:
  monthly_low: 0
  monthly_high: 50
  currency: USD
  per: "relay"
  notes: "Earnings based on bandwidth contributed and uptime. Open source project with active development."

cashout:
  method: manual
  dashboard_url: "https://anyone.io"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: ANYONE

platforms: [docker, linux]

collector:
  type: auto
  # Under credential_hint, which is the field the UI actually reads
  # (app/main.py: `(svc.get("collector") or {}).get("credential_hint")`) and the
  # one services/_schema.yml documents. This text previously sat in a
  # `credentials:` list that nothing anywhere reads, so the ONE credential in the
  # catalog that cannot be found in a provider dashboard — it needs a shell
  # command against the running container — was the one credential with no
  # guidance on screen.
  credential_hint: >
    Comma-separated relay fingerprints. This one is not in a web dashboard:
    run <b>docker exec cashpilot-anyone-protocol anon --list-fingerprint</b> on
    the host running the relay, or look the relay up at
    <a href="https://api.ec.anyone.tech/relays/">api.ec.anyone.tech/relays/</a>.
  notes: "Queries AO relay-rewards contract by fingerprint, converts ANYONE tokens to USD via CoinGecko."

# What this service does with the user's machine (CashPilot-66x).
# Written to be read by someone deciding whether to trust it.
disclosure:
  sells: >-
    Bandwidth, as a relay in the Anyone network (a Tor fork).
  third_party_traffic: >-
    Yes. It relays other people's traffic. Whether your IP is the final hop
    depends on whether the relay is configured as an exit.
  data_collected: >-
    The relay's public identity key, your IP and port, and uptime statistics,
    all published to the network directory by design. If you set ContactInfo in
    your anonrc it is published there too and is permanently, publicly
    indexed — it is usually an email address, so leave it empty unless you want
    it public.
  isp_risk: >-
    Real. Relay traffic is attributed to your connection. Exit relays in
    particular attract abuse complaints; many consumer ISPs prohibit them.
  account_rules: >-
    No account is needed at all, so there is nothing to limit per account. The
    project does not publish a per-IP relay limit, and the catalog does not
    declare one.

payout:
  model: external
  chain: ethereum
  address_source: manual
  notes: "Set as ContactInfo in anonrc, prefixed '@anon:0x...'."
