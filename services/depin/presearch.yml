name: Presearch
slug: presearch
category: depin
status: dead
website: https://presearch.com
description: >
  Presearch was a decentralized search engine where node operators ran Docker
  containers to process search queries and earn PRE tokens. The company
  announced its permanent shutdown on July 24, 2026 (effective July 28, 2026):
  the search platform and the node program are gone, backend infrastructure
  was decommissioned, and operators were told to withdraw their staked PRE
  before the deadline. The PRE token contract still trades residually on
  DEXes, but no node can earn anything anymore.
short_description: Decentralized search engine - SHUT DOWN July 2026

referral:
  signup_url: "https://presearch.com/signup?rid=4872322"
  code: "4872322"

docker:
  image: presearch/node
  platforms: [linux/amd64, linux/arm64]
  env:
    - key: REGISTRATION_CODE
      label: "Registration Code"
      required: true
      secret: true
      description: "Your Presearch node registration code from the dashboard"
  ports: []
  volumes:
    - "/data/presearch-node:/app/node"
  command: ""
  network_mode: ""

requirements:
  residential_ip: false
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: PRE
  frequency: "Daily"

earnings:
  monthly_low: 0
  monthly_high: 30
  currency: USD
  per: "node"
  notes: "Requires 4,000 PRE stake (~$100-200). Earnings depend on search query volume routed to your node. Fast internet and low latency prioritized."

cashout:
  method: redirect
  dashboard_url: "https://nodes.presearch.com/dashboard"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: PRE

platforms: [docker, linux]

collector:
  type: api
  notes: "Node dashboard at nodes.presearch.com. Shows earnings, uptime, and reliability score."

payout:
  model: external
  chain: ethereum
  address_source: app
  notes: "Requires staking 4,000 PRE from the user's own wallet. Staking lives entirely on presearch.com and is out of reach of the container."
