name: Teneo Protocol
slug: teneo
category: depin
status: active
website: https://teneo.pro
description: >
  Teneo Protocol is a DePIN network that rewards users for sharing bandwidth
  via a browser extension. It operates a community node system where users earn
  Teneo Points by keeping the extension active. Referrals grant 2000 points each.
  The protocol focuses on building decentralized data infrastructure.
short_description: DePIN browser extension - 2000 pts per referral

referral:
  signup_url: "https://dashboard.teneo.pro/?code=CAqef"
  code: "CAqef"

docker:
  image: ""
  platforms: [browser-extension]
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: TENEO
  frequency: "Token airdrop (TBA)"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Earns Teneo Points pre-token launch. Browser extension must remain active. Actual USD value depends on future token conversion."

cashout:
  method: redirect
  dashboard_url: "https://dashboard.teneo.pro"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: TENEO
  notes: "Points convert to tokens. Claim from dashboard."

platforms: [browser-extension]

collector:
  type: scrape
  notes: "Points visible in dashboard.teneo.pro. Websocket-based connection tracking."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: poor
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: poor
    longevity: unknown
  notes:
    payout_record: No transferable token has been paid out yet.
    payout_terms: Points become non-transferable $AGENTIC, not $TENEO
    account_safety: No reports found.
    terms_fit: Browser extension, CashPilot cannot deploy or update it
    traffic_transparency: Not documented on pages we read.
    privacy: Not reviewed.
    identity_checks: Not documented.
    support: No pattern found.
    earnings_realism: No $TENEO launch date confirmed, Q2 2026 target passed
    longevity: We did not confirm the company behind Teneo.
  cons:
  - text: Teneo says points will be consolidated into $AGENTIC, a non-transferable reward token, not the
      $TENEO token.
    criterion: payout_terms
    kind: terms
    source: https://teneo-protocol.ai/blog/the-first-step-towards-future-teneo-rewards
    checked_on: "2026-11-04"
  - text: No $TENEO launch date, allocation or claim process had been confirmed by November 2026, after
      an earlier target of the second quarter of 2026 passed.
    criterion: earnings_realism
    kind: press
    source: https://blog.mexc.com/crypto-knowledge/teneo-airdrop-guide/
    checked_on: "2026-11-04"
  - text: 'CashPilot does not run Teneo: you use the provider''s own browser extension, so CashPilot cannot
      deploy or update it for you. Its terms were not checked for containers.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/depin/teneo.yml
    checked_on: "2026-11-04"
