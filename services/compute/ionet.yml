name: io.net
slug: ionet
category: compute
status: active
website: https://io.net
description: >
  io.net is a decentralized GPU network for AI/ML workloads. Aggregates idle
  GPUs from consumers and data centers. Requires NVIDIA GPU with 8GB+ VRAM
  for meaningful earnings. Container-based deployments supported.
short_description: Decentralized GPU network for AI - NVIDIA GPU required

referral:
  signup_url: "https://io.net"

docker:
  image: ""
  platforms: []
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: false
  min_bandwidth: ""
  gpu: true
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: IO
  frequency: "Epoch-based"

earnings:
  monthly_low: 0
  monthly_high: 500
  currency: USD
  per: "GPU"
  notes: "Requires NVIDIA GPU with 8GB+ VRAM. RTX 4090 claims of $500-1000/mo (likely lower in practice)."

cashout:
  method: manual
  dashboard_url: "https://cloud.io.net"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: IO

platforms: [linux]

collector:
  type: manual
  notes: "Dashboard at cloud.io.net. GPU provider signup process unclear."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: fair
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: poor
    longevity: fair
  notes:
    payout_record: We found no documented pattern of late or withheld supplier payouts.
    payout_terms: Paid in IO token, payout model changed in 2026
    account_safety: io.net removed virtual GPU workers from rewards in 2024; we found no pattern affecting
      real hardware.
    terms_fit: Own worker software, CashPilot cannot deploy or update it
    traffic_transparency: Not documented on pages we read.
    privacy: Not reviewed.
    identity_checks: Not documented.
    support: No pattern found.
    earnings_realism: Rewards came from emissions, GPUs sit idle most of the time
    longevity: About 1.8 million fake GPUs in April 2024, CEO stepped down
  cons:
  - text: Supplier rewards were paid from token emissions regardless of paid jobs, and GPU owners report
      sitting idle most of the time.
    criterion: earnings_realism
    kind: press
    source: https://ownyourmind.ai/projects/io-net/
    checked_on: "2026-11-04"
  - text: Rewards are in the IO token and the payout model changed in 2026 to a dollar-pegged engine.
    criterion: payout_terms
    kind: press
    source: https://ownyourmind.ai/projects/io-net/
    checked_on: "2026-11-04"
  - text: In April 2024 about 1.8 million fake GPUs tried to join through a leaked authentication token,
      and the CEO later stepped down before the token launch.
    criterion: longevity
    kind: press
    source: https://www.theblock.co/news/defi/2024-04-28-solana-based-depin-io-net-ceo-claims-network-was-attacked-in-detailed-postmortem-291315
    checked_on: "2026-11-04"
  - text: 'CashPilot does not run io.net: you use the provider''s own worker software, so CashPilot cannot
      deploy or update it for you. Its terms were not checked for containers.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/compute/ionet.yml
    checked_on: "2026-11-04"
