name: Vast.ai
slug: vast-ai
category: compute
status: active
website: https://vast.ai
description: >
  Vast.ai is a GPU cloud marketplace where you rent out your NVIDIA GPU to
  AI/ML researchers and developers. Docker-native platform where you set your
  own hourly prices. An RTX 3090 typically earns $0.20-0.40/hr when rented.
  Requires an NVIDIA GPU with recent drivers and a stable internet connection.
  Revenue depends heavily on GPU model, pricing strategy, and market demand.
short_description: GPU marketplace - set your own prices, RTX 3090 ~$0.20-0.40/hr

referral:
  signup_url: "https://cloud.vast.ai/?ref_id=452772"
  code: "452772"

docker:
  image: ""
  platforms: [linux/amd64]
  env:
    - key: VAST_API_KEY
      label: "API Key"
      required: true
      secret: true
      description: "Vast.ai host API key from dashboard"
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: false
  min_bandwidth: "100 Mbps"
  gpu: true
  min_storage: "100GB"

payment:
  methods: [crypto, bank]
  minimum_payout: "$25"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 300
  currency: USD
  per: "GPU-hour"
  notes: "RTX 3090 ~$0.20-0.40/hr, RTX 4090 ~$0.40-0.80/hr when rented. Utilization varies. Requires NVIDIA GPU, Linux host, Docker, and nvidia-container-toolkit. Set your own pricing."

cashout:
  method: redirect
  dashboard_url: "https://cloud.vast.ai/host/earnings"
  min_amount: 25.0
  currency: USD
  notes: "Earnings accumulate in Vast.ai balance. Withdraw via PayPal or crypto."

platforms: [linux]

collector:
  type: api
  notes: "REST API at https://console.vast.ai/api/v0/. API key auth. Endpoints for machine stats and earnings."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: good
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: fair
    longevity: unknown
  notes:
    payout_record: We found no host complaint threads either way.
    account_safety: No reports found.
    traffic_transparency: Renters run their own containers on your machine; we did not find how they are
      checked.
    privacy: Not reviewed.
    identity_checks: A competitor's summary says hosts must complete identity, tax or business checks
      before choosing a payout method; we did not confirm it on Vast's own pages.
    support: No pattern found.
    longevity: Not checked on a primary source.
  cons:
  - text: 'CashPilot does not run Vast.ai: you install Vast''s host software on your own GPU machine, so
      CashPilot cannot deploy or update it for you. Vast builds hosting around Docker on a Linux host.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/compute/vast-ai.yml
    checked_on: "2026-11-04"
  - text: A host earns only while rented, and Vast's own figures for a consumer GPU depend on rental type
      and reliability score.
    criterion: earnings_realism
    kind: terms
    source: https://vast.ai/article/how-much-money-can-you-earn-renting-out-your-gpu-on-vast-ai
    checked_on: "2026-11-04"
  pros:
  - text: Vast says the rate a host sets is the rate it receives, with no fee deducted.
    criterion: payout_terms
    kind: terms
    source: https://vast.ai/hosting
    checked_on: "2026-11-04"
