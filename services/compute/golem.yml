name: Golem Network
slug: golem
category: compute
status: active
website: https://golem.network
description: >
  Golem Network is a decentralized compute marketplace where you share CPU and
  GPU resources in exchange for GLM tokens. Providers run the Yagna agent which
  manages workload execution in sandboxed environments. One of the oldest
  decentralized compute projects (founded 2016). Supports CPU tasks, GPU
  rendering, and general-purpose compute. Payments via Polygon L2.
short_description: Decentralized compute marketplace - GLM tokens via Yagna agent

referral:
  signup_url: "https://golem.network"
  program: false

docker:
  image: ""
  platforms: [linux/amd64]
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: false
  min_bandwidth: "10 Mbps"
  gpu: false
  min_storage: "20GB"

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: GLM
  frequency: "Per task completion"

earnings:
  monthly_low: 0
  monthly_high: 50
  currency: USD
  per: "device"
  notes: "Earnings depend on hardware, pricing, and task demand. CPU-only nodes earn less. GPU nodes earn more but require NVIDIA. Run the Yagna provider agent (not Docker image). Payments on Polygon in GLM tokens."

cashout:
  method: redirect
  dashboard_url: "https://stats.golem.network"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: GLM
  notes: "GLM tokens earned. Configure payout wallet in provider setup."

platforms: [linux]

collector:
  type: api
  notes: "Yagna REST API at localhost:7465. Provider earnings queryable via /payment/invoices. GLM on Polygon for on-chain tracking."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: unknown
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: good
    identity_checks: good
    support: unknown
    earnings_realism: poor
    longevity: good
  notes:
    payout_record: Payments are on-chain per task; we have no provider of our own to report.
    payout_terms: Payments are in GLM on Polygon; we did not find fees worth grading.
    account_safety: There is no account to ban.
    terms_fit: You install the agent yourself, CashPilot cannot update it
    traffic_transparency: Requestors run tasks on your machine; we did not find how they are checked.
    privacy: Open-source provider agent, yagna (GPL-3.0)
    identity_checks: No account, just a payout wallet
    support: No pattern found.
    earnings_realism: No protocol revenue and low demand, paid in GLM
    longevity: Network running for about ten years
  cons:
  - text: A 2026 review finds Golem with no protocol revenue and low demand, so providers earn little
      and are paid in GLM.
    criterion: earnings_realism
    kind: press
    source: https://ownyourmind.ai/projects/golem/
    checked_on: "2026-11-04"
  - text: 'CashPilot does not run Golem: you install the provider agent yourself, so CashPilot cannot deploy
      or update it for you. Golem documents running the provider in its own Docker image.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/compute/golem.yml
    checked_on: "2026-11-04"
  pros:
  - text: The provider agent, yagna, is open source under the GPL-3.0.
    criterion: privacy
    kind: terms
    source: https://github.com/golemfactory/yagna
    checked_on: "2026-11-04"
  - text: 'No account: you set a payout wallet in the provider setup.'
    criterion: identity_checks
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/compute/golem.yml
    checked_on: "2026-11-04"
  - text: The network has run for about ten years.
    criterion: longevity
    kind: press
    source: https://ownyourmind.ai/tokenomics/akash-vs-golem/
    checked_on: "2026-11-04"
