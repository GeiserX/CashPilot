name: Salad
slug: salad
category: compute
status: active
website: https://salad.io
description: >
  Salad.io lets you share your GPU for distributed AI workloads and earn Salad
  balance redeemable for gift cards, games, or cash. Windows only with a native
  desktop application. Requires a dedicated GPU (NVIDIA or AMD). The platform
  routes AI inference, rendering, and other compute tasks to your machine when
  idle. One of the more user-friendly GPU sharing platforms.
short_description: GPU sharing for AI - Windows only, gift card or cash payout

referral:
  signup_url: "https://salad.io"
  # Checked logged in on 2026-10-15: the account has no referral section, the referrals URL
  # answers "page doesn't exist", the old support article and the affiliate page redirect
  # away, and the docs never mention referrals. The programme is gone.
  program: false

docker:
  image: ""
  platforms: []
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: true
  min_storage: ""

payment:
  methods: [paypal, giftcard]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 100
  currency: USD
  per: "GPU-hour"
  notes: "Earnings depend on GPU model and availability of work. RTX 3060 ~$1-3/day. Windows only. Native app, no Docker support. Redeemable for gift cards, games, or PayPal."

cashout:
  method: redirect
  dashboard_url: "https://app.salad.io/earn/summary"
  min_amount: 5.0
  currency: USD
  notes: "PayPal or gift cards via Salad storefront."

platforms: [windows]

collector:
  type: api
  notes: "API at app-api.salad.com/api/v1/profile/balance. Auth via 'auth' cookie + X-XSRF-TOKEN header (double-submit). Returns currentBalance (USD) and lifetimeBalance."
  credential_hint: "Log in at <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, press F12 → Application → Cookies, copy the <b>auth</b> cookie value."

payout:
  model: internal
  chain: none
  notes: "PayPal and gift cards ONLY -- no crypto whatsoever. Has no on-chain surface for tier 2 to reconcile."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: good
    payout_terms: unknown
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: unknown
    longevity: unknown
  notes:
    payout_record: Late-2026 reviews report quick PayPal cash-outs, one failed
    payout_terms: Rewards go through Salad's own storefront to PayPal or gift cards, with no crypto. Trustpilot's
      summary mentions regional payment problems, and two reviewers describe two different ones; that is
      below our user-reports threshold.
    account_safety: No pattern found.
    terms_fit: Own desktop app, CashPilot cannot deploy or update it
    traffic_transparency: Salad rents your GPU to its cloud customers; we did not find how they are checked.
    privacy: Not reviewed.
    identity_checks: Not documented on pages we read.
    support: No pattern found.
    earnings_realism: Trustpilot's own summary says some reviewers find earnings low, and one October 2026
      reviewer says an RTX 3090 barely covered its electricity. That is one site, below our user-reports
      threshold, and we found no second source.
    longevity: Not checked on a primary source.
  cons:
  - text: 'CashPilot does not run Salad: you use the provider''s own desktop app, so CashPilot cannot deploy
      or update it for you. Its terms were not checked for containers.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/compute/salad.yml
    checked_on: "2026-11-04"
  pros:
  - text: Several Trustpilot reviewers in October and November 2026 report PayPal cash-outs arriving
      quickly, some more than once; one reviewer in the same period says repeated cash-out attempts failed.
    criterion: payout_record
    kind: user_reports
    source: https://www.trustpilot.com/review/salad.com
    checked_on: "2026-11-04"
