name: Flux
slug: flux
category: compute
status: active
website: https://runonflux.io
description: >
  Flux is a globally distributed compute infrastructure. Node operators stake
  FLUX tokens and provide server resources. Three tiers: Cumulus (1,000 FLUX),
  Nimbus (12,500 FLUX), Stratus (40,000 FLUX). Official Docker images available.
short_description: Decentralized compute - requires FLUX token stake

referral:
  signup_url: "https://runonflux.io"

docker:
  image: ""
  platforms: []
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: false
  min_bandwidth: "25 Mbps"
  gpu: false
  min_storage: "220GB"

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: FLUX
  frequency: "Block rewards"

earnings:
  monthly_low: 0
  monthly_high: 100
  currency: USD
  per: "node"
  notes: "Requires 1,000+ FLUX stake (~$50-500 depending on price). Higher tiers need more collateral but earn more."

cashout:
  method: manual
  dashboard_url: "https://home.runonflux.io"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: FLUX

platforms: [linux]

collector:
  type: manual
  notes: "FluxOS dashboard. On-chain earnings."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: fair
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: good
    identity_checks: unknown
    support: unknown
    earnings_realism: fair
    longevity: unknown
  notes:
    payout_record: Rewards are paid per block on-chain; we have no node of our own to report.
    payout_terms: Smallest node tier locks 1,000 FLUX as collateral
    account_safety: Nodes that fail Flux benchmarks stop earning; we found no pattern of disputes.
    terms_fit: Own node software, CashPilot cannot deploy or update it
    traffic_transparency: Not documented on pages we read.
    privacy: Open-source daemon (MIT)
    identity_checks: Not documented.
    support: No pattern found.
    earnings_realism: Block reward drops 10% a year, small tiers weak in dollars
    longevity: Not checked on a primary source.
  cons:
  - text: The smallest node tier needs 1,000 FLUX locked as collateral.
    criterion: payout_terms
    kind: terms
    source: https://runonflux.com/fluxnodes/
    checked_on: "2026-11-04"
  - text: The block reward drops 10% every year, and a 2026 guide found small-tier rewards weak in dollar
      terms.
    criterion: earnings_realism
    kind: press
    source: https://www.depinrun.com/guides/fluxnode-operator-guide
    checked_on: "2026-11-04"
  - text: 'CashPilot does not run Flux: you use the provider''s own node software, so CashPilot cannot deploy
      or update it for you. Its terms were not checked for containers.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/compute/flux.yml
    checked_on: "2026-11-04"
  pros:
  - text: The Flux daemon is open source under the MIT licence.
    criterion: privacy
    kind: terms
    source: https://github.com/RunOnFlux/fluxd
    checked_on: "2026-11-04"
