name: Nosana
slug: nosana
category: compute
status: active
website: https://nosana.io
description: >
  Nosana is a decentralized GPU compute marketplace built on Solana. It connects
  GPU owners with AI workload demand, paying in NOS tokens. An RTX 3060 earns
  approximately $0.048/hr. The platform focuses on AI inference workloads and
  uses the Solana blockchain for job scheduling and payment settlement. Nodes
  run containerized workloads via the Nosana CLI.
short_description: GPU compute on Solana - NOS tokens, RTX 3060 ~$0.048/hr

referral:
  signup_url: "https://nosana.io"

docker:
  image: ""
  platforms: [linux/amd64]
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: false
  min_bandwidth: "50 Mbps"
  gpu: true
  min_storage: "50GB"

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: NOS
  frequency: "Per job completion"

earnings:
  monthly_low: 0
  monthly_high: 100
  currency: USD
  per: "GPU-hour"
  notes: "RTX 3060 ~$0.048/hr, higher-end GPUs earn more. Earnings depend on job availability and GPU model. Requires NVIDIA GPU, Linux, Docker, and Nosana CLI. Payments in NOS token on Solana."

cashout:
  method: redirect
  dashboard_url: "https://app.nosana.io/dashboard"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: NOS
  notes: "NOS tokens earned on Solana. Payout to configured wallet."

platforms: [linux]

collector:
  type: api
  notes: "Nosana explorer API on Solana. Node earnings queryable via Solana RPC and Nosana dashboard."

payout:
  model: minted
  chain: solana
  notes: "Mints a Solana wallet by default. The user has typically never seen the address. See tier 3."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: fair
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: fair
    longevity: unknown
  notes:
    payout_record: We found no host reports either way.
    payout_terms: Each host locks a NOS stake sized to its GPU price
    account_safety: No reports found.
    terms_fit: Own host software, CashPilot cannot deploy or update it
    traffic_transparency: Not documented on pages we read.
    privacy: Not reviewed.
    identity_checks: Payouts go to a Solana wallet; we did not find other requirements.
    support: No pattern found.
    earnings_realism: Paid in NOS, dollar value moves with token and demand
    longevity: Not checked on a primary source.
  cons:
