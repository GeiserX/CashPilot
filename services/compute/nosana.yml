    criterion: payout_terms
    kind: terms
    source: https://github.com/nosana-ci/network-proposals/blob/main/nnp/NNP-0001-tokenomics.md
    checked_on: "2026-11-04"
  - text: Hosts are paid in NOS, so dollar earnings move with the token and with demand for their card.
    criterion: earnings_realism
    kind: press
    source: https://solanacompass.com/projects/nosana
    checked_on: "2026-11-04"
  - text: 'CashPilot does not run Nosana: you use the provider''s own host software, so CashPilot cannot
      deploy or update it for you. Its terms were not checked for containers.'
    criterion: terms_fit
    kind: our_experience
