# CashPilot Service Definition Schema
# Each YAML file in services/ defines one income service.
# This is the SINGLE SOURCE OF TRUTH — README, web UI, and guides all derive from these files.

# name: Human-readable service name
# slug: URL/container-safe identifier (lowercase, hyphens)
# category: bandwidth | depin | storage | compute
# status: active | beta | broken | dead | dropped
#   - dropped: evaluated then removed; hidden from catalog (alongside broken/dead)
# website: Main URL
# description: One paragraph description
# short_description: One line (for tables)

# referral:
#   signup_url: Full signup URL with referral code already embedded
#   code: The referral code itself, ALWAYS QUOTED -- unquoted, "0071234" parses
#         as an octal int and "no"/"yes"/"on" as booleans (YAML 1.1).
#         scripts/referral_check.py proves it stays anchored in signup_url
#         (query value, bare query key, or path segment), so a domain
#         migration cannot silently strip the attribution.
#   program: Whether the PROVIDER runs a referral program. Three-valued, and
#            absent is not "no":
#              true    verified to run one (true + no code = actionable gap)
#              false   verified NOT to run one (a bare signup_url is correct)
#              absent  nobody has checked yet (reported, never failed)
#   bonus: (optional) what each side gets, shown on the service detail page:
#     referrer: "20% of referral traffic earnings"
#     referee: "$1 welcome bonus"

# docker:
#   image: Docker Hub image
#   platforms: [linux/amd64, linux/arm64]
#   resources: (optional, durable Docker resource limits applied at container create)
#     mem_limit: "768m"        # hard memory ceiling (str: <number><b|k|m|g>, e.g. "512m", "2g")
#     mem_reservation: "512m"  # (optional) soft memory reservation, same format as mem_limit
#     oom_score_adj: -100      # kernel OOM-killer bias, int -1000..1000 (lower = sacrificed last)
#   env:
#     - key: ENV_VAR_NAME
#       label: "Human label"
#       required: true/false
#       secret: true/false
#       description: "Help text"
#       default: "" (optional)
#   ports: ["port:port"]
#   volumes: ["host:container"]
#   critical_volumes:          (optional) mounts holding state that CANNOT be recovered
#     - target: "/container/path"   must match the container-side path in `volumes`
#       holds: "what is lost, in one or two sentences shown to the operator"
#     Declaring a mount here makes the worker REFUSE to delete that volume unless
#     the caller passes an explicit override (owner role required).
#     NOTE: redeploy protection — refusing a redeploy that would drop or retype a
#     critical mount — is NOT implemented yet; only the delete guard is.
#     Use it only for genuinely irreplaceable state — node identities,
#     keystores, generated wallets — not for caches or re-downloadable data.
#   command: "" (optional override)
#   network_mode: "" (optional, e.g. "host")
#   cap_add: [] (optional)
#   health_signals: [] (optional) log patterns that say whether the service is EARNING,
#     which container health cannot see. The only signal available for the services with
#     no collector.
#       - pattern: "login failed"       regex, matched case-insensitively against logs
#         means:   "The service rejected the stored credentials."   shown to the user
#         state:   failing              failing (default) | idle
#     Only add a pattern you have actually seen in that service's logs. A guessed regex
#     that never matches is dead weight; one that matches the wrong line tells the user
#     something false.
#   devices: [] (optional) host devices to map in, e.g. ["/dev/net/tun"]
#     Only devices on the worker's allow-list may be requested, and only by the
#     service whose own YAML declares them. A device is a direct line to the
#     kernel, so the catalog cannot widen that ceiling on its own.
#   privileged: false (optional, security-sensitive — grants the container full host device access)
#   stop_timeout: 30 (optional, seconds to wait before SIGKILL on stop — default 30)
#   setup: "" (optional, one-time setup instructions/commands to run before first deploy)

# disclosure: (optional but strongly encouraged) what this service does with the
#   user's machine. "Is this malware?" is a fair question about closed-source
#   containers that route traffic through someone's home connection, and an
#   earnings range does not answer it.
#     sells:                what is actually sold (bandwidth / disk / compute / attention)
#     third_party_traffic:  do strangers route traffic through the user's IP? The value
#                           must OPEN with a standalone yes / no / unknown followed by
#                           punctuation, so it can be read programmatically:
#                             third_party_traffic: >-
#                               Yes. Buyers route their traffic through your connection.
#                           Use a >- block (as above) or quote the string. A BARE `yes`/`no`
#                           is parsed by YAML as a boolean, not text.
#                           "No longer - they route traffic now" does NOT parse as a verdict
#                           and is reported as undocumented, which is deliberate: a phrase
#                           beginning with "no" that means "yes" is the worst possible
#                           silent answer, so anything ambiguous falls back to unknown.
#     data_collected:       what identifying data leaves the machine
#     isp_risk:             what this could mean for their ISP contract, in plain words
#     account_rules:        account and multi-account rules
#   Write it honestly, including where the answer is unflattering. "unknown - the
#   provider does not say" is a legitimate and useful entry. Do NOT guess: an absent
#   block is reported as undocumented, which is safer than a confident wrong answer.

# requirements:
#   residential_ip: true/false
#   vps_ip: true/false  (default: opposite of residential_ip)
#   devices_per_account: 0  (0 = unlimited)
#   devices_per_ip: 1  (0 = unlimited)
#
#   devices_per_ip drives the egress-conflict warning (app/egress.py), so the
#   distinction between OMITTING it and setting it to 0 is load-bearing:
#     - omitted -> "nobody has documented this", and the user is told to check
#       the provider's terms before running a second instance behind one IP;
#     - 0       -> a verified statement that the provider imposes no per-IP
#       limit. The "check the terms" warning is then replaced by a milder note
#       that two instances still share one connection, so the pair earns roughly
#       what one does. It is downgraded, NOT silenced -- shared bandwidth is a
#       real effect regardless of what the provider permits.
#   Only write 0 when the provider actually says so. Writing it to quieten a
#   warning turns a cautious message into a wrong one.
#   container_prohibited: true/false  (default false)
#     Set ONLY when the provider explicitly forbids containers/VMs/servers for
#     its own software. This is the strongest verdict the preflight can give:
#     the outcome is a terminated account with the pending balance cancelled,
#     and CashPilot deploying the service as a container IS the violation.
#     Requires a first-party source; never infer it from a residential-IP rule.
#   note: ""  (footnote text for special cases in README table)
#   note_column: ""  (which column footnote applies to: vps_ip, devices_per_ip)
#   min_bandwidth: ""
#   gpu: false
#   min_storage: ""

# payment:
#   methods: [paypal, crypto, bank, giftcard]
#   crypto_token: ""  (specific token if different from currency, e.g. "SOL", "USDT")
#   minimum_payout: "$20"
#   currency: USD
#   frequency: "On request" | "Monthly" | "Weekly"

# earnings:
#   monthly_low: 2
#   monthly_high: 5
#   currency: USD
#   per: "device" | "TB" | "GPU-hour"
#   notes: ""

# cashout:
#   method: redirect | api | manual | auto
#     - redirect: user clicks through to service dashboard to request payout
#     - api: CashPilot can trigger payout via API (rare)
#     - manual: instructions only (e.g. crypto claim, no dashboard)
#     - auto: payouts happen automatically; no user action needed
#   dashboard_url: "https://service.com/dashboard/earnings"
#   min_amount: 20 (numeric, derived from payment.minimum_payout)
#   currency: USD
#   notes: "Additional cashout instructions or caveats"

# payout:
#   WHERE THE MONEY ACTUALLY GOES. `cashout` says how to WITHDRAW; this says
#   where the funds live and whether there is an address at all (CashPilot-luj).
#
#   model: external | internal | minted | unknown        (REQUIRED)
#     - external: the USER supplies an address they already own. CashPilot never
#         holds a key. There IS an address to show.
#     - internal: the service keeps an off-chain balance and pays out on
#         request. There is NO address to register, and no chain to watch, until
#         the user withdraws. Showing a blank address field here would read as
#         "you forgot to configure this" when nothing is configurable — which is
#         exactly why the model is a first-class field rather than an empty slot.
#     - minted:   the container generates its own wallet on first run and
#         accrues to it. The user has typically never seen the address, let
#         alone backed up the seed.
#     - unknown:  not yet determined. A DELIBERATE value, not a placeholder: the
#         registry must flag what it does not know rather than render a blank
#         that reads as "nothing to see here".
#
#   chain: ethereum | polygon | solana | none | ...
#     `none` means NO on-chain surface exists at all, ever — Salad pays PayPal
#     and gift cards only. Tier 2 (on-chain reconciliation) must skip these
#     rather than fail to find an address for them.
#     Omit entirely when the chain is chosen per-withdrawal and there is no
#     persistent on-chain identity (Traffmonetizer picks Arbitrum/Tron/Solana/TON
#     at withdrawal time).
#
#   address_env: WALLET
#     `external` only, and only when the address is carried by an env var on the
#     container — so the registry can read it from the deployed spec instead of
#     asking the user to retype it.
#
#   address_source: env | manual | app
#     Where the address is actually set. `manual` covers post-deploy
#     configuration (Mysterium's beneficiary via TequilAPI, Anyone's anonrc);
#     `app` covers a wallet linked inside the provider's own site.
#
#   notes: "Caveats worth showing the user."
#     e.g. URnetwork forfeits payout after 30 days with no wallet linked.
#
#   NO PRIVATE KEYS. This block is a registry of PUBLIC addresses and payout
#   mechanics, and nothing else. That is precisely why it comes first: it
#   delivers most of the "where is my money" answer at zero custody risk.

# platforms: [windows, macos, linux, android, ios, docker, browser_extension]

# collector:
#   type: api | scrape | manual | auto
#     - auto: earnings accrue/settle automatically; no active collection needed
#   notes: "Implementation hints for the earnings collector" (for developers)
#   per_node_earnings: true|false
#     The collector can break earnings down per node/machine, not just an
#     account total. Declared here rather than branched on in app/ so adding a
#     second such service is one line of YAML, not an edit to a route handler.
#   credential_hint: |
#     Where the USER finds the credential in the provider's own UI, shown next
#     to the input in Settings. A different audience from `notes`: this is the
#     sentence someone reads while looking at a provider dashboard they have
#     never seen before. Limited HTML (<a>, <b>) is allowed and is escaped-safe
#     because the UI inserts it as markup deliberately. Optional; omit it when
#     the credential is just the account email and password.
