name: Earn.fm
slug: earnfm
category: bandwidth
status: active
priority: 5
website: https://earn.fm
description: >
  Earn.fm pays you for sharing your internet bandwidth. Earnings collector
  uses email/password auth via Supabase. Lightweight Docker image with
  straightforward deployment (Docker client uses separate UUID token).
short_description: Bandwidth sharing - email/password auth, lightweight client

referral:
  signup_url: "https://earn.fm/ref/GEISYB91"
  code: "GEISYB91"

docker:
  image: earnfm/earnfm-client
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  resources:
    mem_limit: "128m"
    oom_score_adj: 200
  env:
    - key: EARNFM_TOKEN
      label: "API Key"
      required: true
      secret: true
      description: "Log in at <a href=\"https://app.earn.fm\">app.earn.fm</a> → click your profile icon (top right) → Account Settings → copy the API Key (UUID format)"
  ports: []
  volumes: []
  command: ""
  network_mode: ""
  privileged: false

requirements:
  residential_ip: true
  vps_ip: true
  devices_per_ip: 1
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto, paypal, giftcard, bank]
  minimum_payout: "$15"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 3
  currency: USD
  per: "device"
  notes: "Relatively new platform. Earnings vary by location and bandwidth availability."

cashout:
  method: redirect
  dashboard_url: "https://app.earn.fm/#/payout"
  min_amount: 15.0
  currency: USD
  notes: >-
    Minimum $15. Methods: USDT on BEP20 or Polygon ($1 fee) or TRC20 ($3
    fee), PayPal, Amazon or Starbucks gift cards from $15, or a bank wire from
    $1,000 with transfer fees deducted. Before the first payout you fill in a
    billing profile (legal name and address), used for the payout receipts.

platforms: [docker, linux]

collector:
  type: api
  notes: "Supabase email/password auth. Docker client uses separate EARNFM_TOKEN (UUID) for bandwidth sharing only."
  credential_hint: "Use your Earn.fm account email and password (same as <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a> login)."

payout:
  model: internal
  notes: "Balance held by Earn.fm; withdrawn on request."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: fair
    account_safety: unknown
    terms_fit: good
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: fair
    support: fair
    earnings_realism: unknown
    longevity: unknown
  notes:
    payout_record: Two Trustpilot reviewers report a late or missing payout and others report fast
      payouts; neither side reaches our user-reports threshold.
    account_safety: One Trustpilot reviewer alleges bans for criticism; one report is not a pattern.
    traffic_transparency: Earn.fm's terms page leads to the business terms of InfiniteProxies; we found
      no page that says how buyers are vetted.
    privacy: The client is closed source. One reviewer says a deleted account stayed in the database;
      one report is not a pattern.
    earnings_realism: Not measured.
    longevity: We could not find the legal entity behind Earn.fm on its own pages.
  cons:
  - text: A $15 minimum, a $1 to $3 fee on USDT, and a bank wire only from $1,000.
    criterion: payout_terms
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/earnfm.yml
    checked_on: "2026-11-04"
  - text: Before the first payout you fill in a billing profile with your legal name and address.
    criterion: identity_checks
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/earnfm.yml
    checked_on: "2026-11-04"
  - text: Reviewers in 2025 report support on email and Discord not answering; Trustpilot notes Earn.fm
      has not replied to negative reviews.
    criterion: support
    kind: user_reports
    source: https://www.trustpilot.com/review/earn.fm
    checked_on: "2026-11-04"
  pros:
  - text: Earn.fm publishes its own Docker image, earnfm/earnfm-client.
    criterion: terms_fit
    kind: terms
    source: https://hub.docker.com/r/earnfm/earnfm-client
    checked_on: "2026-11-04"
