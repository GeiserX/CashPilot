name: Ebesucher
slug: ebesucher
category: bandwidth
status: active
website: https://www.ebesucher.com
description: >
  Ebesucher is a traffic exchange platform where you earn credits by visiting
  websites through an automated surfbar. Runs as a browser extension/addon.
  Not a traditional bandwidth-sharing service — it generates traffic by
  browsing websites automatically.
short_description: Traffic exchange surfbar - browser extension

referral:
  signup_url: "https://www.ebesucher.com/?ref=geiserx"
  code: "geiserx"

docker:
  image: ""
  platforms: []
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  vps_ip: false
  devices_per_ip: 1
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal]
  minimum_payout: "$2"
  currency: EUR
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 2
  currency: EUR
  per: "device"
  notes: "Earnings in BTP points convertible to EUR. Browser extension only."

cashout:
  method: redirect
  dashboard_url: "https://www.ebesucher.com/account"
  min_amount: 2.0
  currency: USD
  notes: "Euro payout via PayPal or bank transfer."

platforms: [browser-extension]

collector:
  type: manual
  notes: "Browser extension only. No API. Earnings visible in Ebesucher dashboard only."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: good
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: unknown
    longevity: good
  notes:
    payout_record: eBesucher says it has paid out over one million euros; we found no recent independent
      reports either way.
    account_safety: No reports found.
    traffic_transparency: The surfbar shows advertisers' pages; we did not find how advertisers are checked.
    privacy: Not reviewed.
    identity_checks: Not documented on pages we read.
    support: No reports found.
    earnings_realism: Not measured.
  cons:
  - text: 'CashPilot does not run eBesucher: it is a browser extension, so CashPilot cannot deploy or update
      it for you. Its terms were not checked for containers.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/ebesucher.yml
    checked_on: "2026-11-04"
  pros:
  - text: Payouts from 2 euros by PayPal or SEPA, at least weekly, with no fee.
    criterion: payout_terms
    kind: terms
    source: https://www.ebesucher.com/earn-money/get-paid-to-surf
    checked_on: "2026-11-04"
  - text: eBesucher has run since 2002.
    criterion: longevity
    kind: terms
    source: https://www.ebesucher.com/earn-money/beermoney
    checked_on: "2026-11-04"
