name: EarnApp
slug: earnapp
category: bandwidth
status: active
priority: 7
website: https://earnapp.com
description: >
  EarnApp by Bright Data lets you sell your unused bandwidth for passive income.
  Bright Data is the world's largest proxy network, powering data collection for
  Fortune 500 companies. CashPilot runs it from its own image, which downloads the
  pinned EarnApp build from Bright Data's CDN at first start, checks its sha256 and
  runs it in lite mode with only a UUID.
short_description: Bandwidth sharing - backed by Bright Data

referral:
  signup_url: "https://earnapp.com/i/TSMD9wSm"
  code: "TSMD9wSm"
  bonus:
    referrer: "10% of their earnings for life, paid on top of theirs"

docker:
  # CashPilot's own image (images/earnapp/). It carries no Bright Data code: the
  # pinned build is fetched at first start and checked against SHA256SUMS. The old
  # default, fazalfarhan01/earnapp:lite, froze the 2022 client 1.294.218.
  image: drumsergio/cashpilot-earnapp:1.665.73-r2
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  resources:
    mem_limit: "256m"
    oom_score_adj: 300
  env:
    - key: EARNAPP_UUID
      per_device: true
      label: "Node UUID"
      required: true
      secret: false
      description: "Your EarnApp node ID: sdk-node- followed by 32 lowercase hex characters, as 'earnapp showid' prints it. After deploying, link it once by opening https://earnapp.com/r/<this UUID> while signed in to EarnApp; an unlinked node earns, but nothing reaches your balance"
      # The image refuses any other form at start, so check it here instead of
      # letting a typo deploy and then exit on every restart.
      pattern: 'sdk-node-[0-9a-f]{32}'
  ports: []
  volumes:
    - "earnapp-data:/etc/earnapp"
  command: ""
  network_mode: ""
  privileged: false
  health_signals:
    # Seen live (Nov 2026) for four days on one box: the client exited with
    # "Error: Handshake timeout" every 100 seconds or so, the container restarted
    # it, and Docker's health check stayed healthy throughout.
    - pattern: "Error: Handshake timeout"
      window_hours: 1
      min_matches: 10
      means: >-
        EarnApp keeps failing to reach its servers and restarting, so it earns
        little or nothing. Restart this copy; if it keeps happening, check this
        box's internet connection.
      state: failing

device_link:
  id_env: EARNAPP_UUID
  url: "https://earnapp.com/r/${EARNAPP_UUID}"
  steps: >-
    Open this link while signed in to EarnApp to add the node to your account.
    Until you do, the node earns but nothing reaches your balance.

requirements:
  residential_ip: true
  vps_ip: false
  container_prohibited: true
  devices_per_account: 15
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal, amazon_giftcard, wise]
  minimum_payout: "$10"
  currency: USD
  frequency: "On request (auto-redeem available: PayPal $10 min, Wise $10 min, Amazon $50 min)"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Highly location-dependent. US/EU IPs earn the most. Earnings scale with bandwidth consumed."

cashout:
  method: redirect
  dashboard_url: "https://earnapp.com/dashboard/cashout"
  min_amount: 10.0
  currency: USD
  notes: >-
    Turn on auto-redeem once and EarnApp pays by itself whenever the balance
    reaches the method's minimum: PayPal $10, Wise $10, Amazon $50. PayPal
    payments arrive from Bright Data Ltd. In October 2026 a PayPal payment
    arrived about 2% below the redeemed balance.

platforms: [docker, windows, macos, linux, android]

collector:
  type: api
  notes: "Dashboard API at /dashboard/api/money/. Auth via OAuth refresh token cookie. Returns balance in USD."
  credential_hint: "Log in at <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, press F12 → Application → Cookies, copy the <b>oauth-refresh-token</b> value."

payout:
  model: internal
  notes: "Balance held by EarnApp; redeemed to Amazon/Wise/PayPal."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: good
    payout_terms: good
    account_safety: fair
    terms_fit: poor
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: unknown
    longevity: good
  notes:
    payout_record: Our $37.54 PayPal payout arrived as $36.81 in October 2026
    payout_terms: $10 minimum for PayPal and Wise, with auto-redeem
    account_safety: We found no repeated pattern of accounts banned at cash-out with the balance kept.
      Trustpilot withholds EarnApp's rating for a breach of its guidelines and says it removed fake reviews,
      so we did not count its reviews either way.
    terms_fit: Help centre strictly prohibits Docker, VMs and home servers
    traffic_transparency: EarnApp is run by Bright Data; we did not find an EarnApp page that says how
      the buyers of the traffic are vetted.
    privacy: The client is closed source; we did not review the privacy policy in depth.
    identity_checks: We found no EarnApp page that lists what a payout asks for, and our own notes do
      not record it.
    support: One Trustpilot review says a ticket was closed without a reply; one is not a pattern, and
      we have no ticket of our own.
    earnings_realism: We have not measured EarnApp's earnings per IP against any figure the provider publishes.
    longevity: Owned by Bright Data, payments from Bright Data Ltd.
  cons:
  - text: EarnApp's help centre says installing it in Docker containers, virtual machines, hosting services
      or home servers is strictly prohibited, which is how CashPilot runs it.
    criterion: terms_fit
    kind: terms
    source: https://help.earnapp.com/hc/en-us/articles/10199416541969--Can-I-install-EarnApp-on-Hosting-Services-Virtual-Machines-or-Dockers
    checked_on: "2026-11-04"
  - text: The same help article says an account found running that way is terminated without notice and
      its pending payments are cancelled.
    criterion: account_safety
    kind: terms
    source: https://help.earnapp.com/hc/en-us/articles/10199416541969--Can-I-install-EarnApp-on-Hosting-Services-Virtual-Machines-or-Dockers
    checked_on: "2026-11-04"
  pros:
  - text: 'Our PayPal payout arrived in October 2026, about 2% below the redeemed balance.'
    criterion: payout_record
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/docs/guides/earnapp.md
    checked_on: "2026-11-04"
  - text: A $10 minimum for PayPal and Wise, with auto-redeem that pays out by itself.
    criterion: payout_terms
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/earnapp.yml
    checked_on: "2026-11-04"
  - text: EarnApp belongs to Bright Data, and its PayPal payments arrive from Bright Data Ltd., a named
      company.
    criterion: longevity
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/earnapp.yml
    checked_on: "2026-11-04"
