name: EarnApp
slug: earnapp
category: bandwidth
status: active
priority: 7
website: https://earnapp.com
description: >
  EarnApp by Bright Data lets you sell your unused bandwidth for passive income.
  Bright Data is the world's largest proxy network, powering data collection for
  Fortune 500 companies. CashPilot runs it from its own image, which downloads the
  pinned EarnApp build from Bright Data's CDN at first start, checks its sha256 and
  runs it in lite mode with only a UUID.
short_description: Bandwidth sharing - backed by Bright Data

referral:
  signup_url: "https://earnapp.com/i/TSMD9wSm"
  code: "TSMD9wSm"

docker:
  # CashPilot's own image (images/earnapp/). It carries no Bright Data code: the
  # pinned build is fetched at first start and checked against SHA256SUMS. The old
  # default, fazalfarhan01/earnapp:lite, froze the 2022 client 1.294.218.
  image: drumsergio/cashpilot-earnapp:1.665.73-r1
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  resources:
    mem_limit: "256m"
    oom_score_adj: 300
  env:
    - key: EARNAPP_UUID
      label: "Node UUID"
      required: true
      secret: false
      description: "Your EarnApp node ID: sdk-node- followed by 32 lowercase hex characters, as 'earnapp showid' prints it. After deploying, link it once by opening https://earnapp.com/r/<this UUID> while signed in to EarnApp; an unlinked node earns, but nothing reaches your balance"
      # The image refuses any other form at start, so check it here instead of
      # letting a typo deploy and then exit on every restart.
      pattern: 'sdk-node-[0-9a-f]{32}'
  ports: []
  volumes:
    - "earnapp-data:/etc/earnapp"
  command: ""
  network_mode: ""
  privileged: false

device_link:
  id_env: EARNAPP_UUID
  url: "https://earnapp.com/r/${EARNAPP_UUID}"
  steps: >-
    Open this link while signed in to EarnApp to add the node to your account.
    Until you do, the node earns but nothing reaches your balance.

requirements:
  residential_ip: true
  vps_ip: false
  container_prohibited: true
  devices_per_account: 15
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal, amazon_giftcard, wise]
  minimum_payout: "$10"
  currency: USD
  frequency: "On request (auto-redeem available: PayPal $10 min, Wise $10 min, Amazon $50 min)"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Highly location-dependent. US/EU IPs earn the most. Earnings scale with bandwidth consumed."

cashout:
  method: redirect
  dashboard_url: "https://earnapp.com/dashboard/cashout"
  min_amount: 10.0
  currency: USD

platforms: [docker, windows, macos, linux, android]

collector:
  type: api
  notes: "Dashboard API at /dashboard/api/money/. Auth via OAuth refresh token cookie. Returns balance in USD."
  credential_hint: "Log in at <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, press F12 → Application → Cookies, copy the <b>oauth-refresh-token</b> value."

payout:
  model: internal
  notes: "Balance held by EarnApp; redeemed to Amazon/Wise/PayPal."
