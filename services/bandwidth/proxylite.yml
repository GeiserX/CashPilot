name: ProxyLite
slug: proxylite
category: bandwidth
status: active
priority: 4
website: https://proxylite.ru
description: >
  ProxyLite monetizes your internet traffic by sharing bandwidth with verified
  organizations. Works on both residential and VPS/datacenter connections. Simple
  setup requiring only a user ID from the dashboard. Offers a generous 15% lifetime
  referral commission.
short_description: Bandwidth sharing - 15% lifetime referral, works on VPS

referral:
  signup_url: "https://proxylite.ru/?r=KMUPRZIZ"
  code: "KMUPRZIZ"

docker:
  image: proxylite/proxyservice
  platforms: [linux/amd64]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: USER_ID
      label: "User ID"
      required: true
      secret: false
      description: "Log in at <a href=\"https://lk.proxylite.ru\">lk.proxylite.ru</a> → your User ID is shown on the main dashboard page next to your email"
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: false
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto, paypal]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 3
  currency: USD
  per: "device"
  notes: "Residential IPs earn more. VPS/datacenter connections accepted at lower rates."

cashout:
  method: redirect
  dashboard_url: "https://proxylite.ru/dashboard"
  min_amount: 5.0
  currency: USD

platforms: [docker, windows, linux]

collector:
  type: api
  notes: "Dashboard at lk.proxylite.ru. User ID based authentication."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: good
    account_safety: unknown
    terms_fit: good
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: unknown
    longevity: poor
  notes:
    payout_record: We found no user reports in a language we could check, and no payout of our own.
    payout_terms: $5 minimum, by crypto or PayPal
    account_safety: No reports found.
    terms_fit: Own Docker image, accepts datacentre connections
    traffic_transparency: 'The author of a widely used installer for it warns that some of the traffic
      is used to send spam; one source, so not graded, but read it before running ProxyLite: https://github.com/spiritLHLS/proxylite-one-click-command-installation'
    privacy: The client is closed source.
    identity_checks: Not documented on pages we read.
    support: No reports found.
    earnings_realism: Not measured.
    longevity: Owner hidden in domain records, no named company found
  cons:
  - text: The site's owner is hidden in its domain records, and we found no named company behind it.
    criterion: longevity
    kind: press
    source: https://www.scamadviser.com/check-website/proxylite.ru
    checked_on: "2026-11-04"
  pros:
  - text: A $5 minimum, by crypto or PayPal.
    criterion: payout_terms
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/proxylite.yml
    checked_on: "2026-11-04"
  - text: ProxyLite publishes a Docker image, proxylite/proxyservice, and accepts datacentre connections
      at a lower rate.
    criterion: terms_fit
    kind: terms
    source: https://hub.docker.com/r/proxylite/proxyservice
    checked_on: "2026-11-04"
