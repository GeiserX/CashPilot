name: PacketStream
slug: packetstream
category: bandwidth
status: active
website: https://packetstream.io
description: >
  PacketStream is a peer-to-peer bandwidth marketplace where you can sell your
  unused bandwidth. It powers a residential proxy network used for market research,
  SEO monitoring, and ad verification. Simple Docker setup with just a CID
  (Client ID) required. Note that CAPTCHA-protected login can make automated
  earnings collection challenging.
short_description: Bandwidth sharing - simple CID-based setup

referral:
  signup_url: "https://packetstream.io/?psr=7xgZ"
  code: "7xgZ"

docker:
  image: packetstream/psclient
  platforms: [linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: CID
      label: "Client ID"
      required: true
      secret: false
      description: "Log in at <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> → click Setup in the sidebar → your CID is displayed in the Docker command"
  ports: []
  volumes: []
  command: ""
  network_mode: ""
  privileged: false
  health_signals:
    # Seen live (Nov 2026): a copy whose egress IP PacketStream classes as a
    # datacenter logged this every few minutes for days, never "PacketStream is
    # running", and earned nothing while its container stayed healthy.
    - pattern: "Non-residential IPs are currently unsupported"
      unless: "PacketStream is running"
      window_hours: 2
      min_matches: 10
      means: >-
        PacketStream refuses this copy's IP address as not residential, so it
        earns nothing. Run it on a box whose internet connection is a home line,
        or remove this copy.
      state: failing
    # Seen live (Nov 2026) a few times a day on a healthy copy, each time
    # followed by "PacketStream is running"; only a copy that never recovers
    # inside the window is flagged.
    - pattern: "allows packeting from 1 client per IP address"
      unless: "PacketStream is running"
      window_hours: 2
      min_matches: 10
      means: >-
        PacketStream already has another client on this IP address, and it pays
        only one per IP. Remove this copy, or the other one that shares its IP.
      state: idle

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 4
  currency: USD
  per: "device"
  notes: "Pays $0.10/GB for bandwidth shared. Earnings depend heavily on demand for your IP's location."

cashout:
  method: redirect
  dashboard_url: "https://app.packetstream.io/dashboard/payouts"
  min_amount: 5.0
  currency: USD
  notes: >-
    PayPal only, minimum $5, 3% fee shown before you confirm. The first
    withdrawal saves your PayPal email; changing it later needs an email
    confirmation and a 7-day wait, so check the address before you confirm.
    Requests are reviewed and sent within 7 days; you can cancel one while it
    waits, and a new one can only be made once it is paid.

platforms: [docker, windows, linux, android]

collector:
  type: scrape
  notes: "Dashboard is CAPTCHA-protected. May need manual JWT from browser session for API access."
  credential_hint: "Log in at <a href='https://packetstream.io' target='_blank'>packetstream.io</a>, press F12 → Application → Cookies, copy the <b>auth</b> cookie value (it’s a JWT)."

payout:
  model: internal
  notes: "Balance held by PacketStream; withdrawn on request."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: fair
    payout_terms: fair
    account_safety: fair
    terms_fit: good
    traffic_transparency: fair
    privacy: unknown
    identity_checks: good
    support: poor
    earnings_realism: unknown
    longevity: good
  notes:
    payout_record: Late or missing payouts reported in 2025 and 2026, others paid
    payout_terms: PayPal only, 3% cashout fee
    account_safety: Earnings tied to fraud can be withheld or reversed
    terms_fit: Own Docker image, packetstream/psclient
    traffic_transparency: Proxy customers route traffic, no vetting described
    privacy: The client is closed source; we did not review the privacy policy in depth.
    identity_checks: No identity check, a PayPal address is enough
    support: No replies to negative reviews, unanswered emails
    earnings_realism: Two Trustpilot reviewers report close to a year to reach the $5 minimum; two is
      below our user-reports threshold and we found no second source.
    longevity: Named company under California law, running since 2018
  cons:
  - text: Trustpilot reviewers in 2025 and 2026 report payouts arriving late or not at all, and one long-time
      user says payouts slowed and then stopped; others in 2026 report being paid.
    criterion: payout_record
    kind: user_reports
    source: https://www.trustpilot.com/review/packetstream.io
    checked_on: "2026-11-04"
  - text: PayPal only, with a 3% cashout fee; users in countries PayPal does not serve have no other method.
    criterion: payout_terms
    kind: terms
    source: https://packetstream.io/terms-of-service/
    checked_on: "2026-11-04"
  - text: The terms let PacketStream withhold, reverse or invalidate earnings it ties to fraud, manipulation
      or prohibited activity.
    criterion: account_safety
    kind: terms
    source: https://packetstream.io/terms-of-service/
    checked_on: "2026-11-04"
  - text: The terms say proxy customers and PacketStream itself route traffic through your connection;
      they describe no vetting of ordinary buyers.
    criterion: traffic_transparency
    kind: terms
    source: https://packetstream.io/terms-of-service/
    checked_on: "2026-11-04"
  - text: Trustpilot notes PacketStream has not replied to negative reviews; reviewers report unanswered
      emails.
    criterion: support
    kind: user_reports
    source: https://www.trustpilot.com/review/packetstream.io
    checked_on: "2026-11-04"
  pros:
  - text: PacketStream publishes its own Docker image, packetstream/psclient.
    criterion: terms_fit
    kind: terms
    source: https://hub.docker.com/r/packetstream/psclient
    checked_on: "2026-11-06"
  - text: The terms only require a device and connection you own or may use.
    criterion: terms_fit
    kind: terms
    source: https://packetstream.io/terms-of-service/
    checked_on: "2026-11-04"
  - text: The terms describe no identity check; a payout needs a PayPal address.
    criterion: identity_checks
    kind: terms
    source: https://packetstream.io/terms-of-service/
    checked_on: "2026-11-04"
  - text: The terms name PacketStream Inc. under California law.
    criterion: longevity
    kind: terms
    source: https://packetstream.io/terms-of-service/
    checked_on: "2026-11-04"
  - text: PacketStream has run since 2018.
    criterion: longevity
    kind: press
    source: https://proxyway.com/reviews/packetstream-proxies
    checked_on: "2026-11-04"
