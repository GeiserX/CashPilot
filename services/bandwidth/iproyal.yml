name: IPRoyal Pawns
slug: iproyal
category: bandwidth
status: active
priority: 9
website: https://pawns.app
support_url: https://pawns.app/contact-us/
description: >
  IPRoyal Pawns lets you earn by sharing your unused bandwidth. IPRoyal is a
  well-established proxy provider, and Pawns is their residential bandwidth-sharing
  arm. The CLI Docker image accepts credentials via command-line flags. Offers a
  generous 10% lifetime referral commission and $3 bonus for new signups with code
  EARN3.
short_description: Bandwidth sharing - 10% lifetime referral, $3 signup bonus

referral:
  signup_url: "https://pawns.app?r=19266874"
  code: "19266874"
  bonus:
    referrer: "10% of their payouts for life, plus $1 on each of their first three payouts"
    referee: "$3: $1 on joining, then $1 on each of the first two payouts"

docker:
  image: iproyal/pawns-cli
  platforms: [linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: IPROYALPAWNS_EMAIL
      label: "Email"
      required: true
      secret: false
      description: "Your IPRoyal Pawns account email (passed as -email flag)"
    - key: IPROYALPAWNS_PASSWORD
      label: "Password"
      required: true
      secret: true
      description: "Your IPRoyal Pawns account password (passed as -password flag)"
    - key: IPROYALPAWNS_DEVICE_NAME
      identifier: true
      label: "Device name"
      required: false
      secret: false
      description: "Name shown in your Pawns dashboard (passed as -device-name flag)"
      default: "cashpilot-{hostname}"
    - key: IPROYALPAWNS_DEVICE_ID
      identifier: true
      label: "Device ID"
      required: false
      secret: false
      description: "Unique device identifier (passed as -device-id flag)"
      default: "cashpilot-{hostname}"
  ports: []
  volumes: []
  command: "-email ${IPROYALPAWNS_EMAIL} -password ${IPROYALPAWNS_PASSWORD} -device-name ${IPROYALPAWNS_DEVICE_NAME} -device-id ${IPROYALPAWNS_DEVICE_ID} -accept-tos"
  network_mode: ""
  privileged: false
  health_signals:
    # Seen live (Oct 2026) on three boxes after Pawns deactivated the account:
    # pawns-cli prints this, with no newline, and exits 1 on every start.
    - pattern: "user is disabled"
      means: "IPRoyal Pawns has disabled this account."
      state: account_disabled

requirements:
  residential_ip: true
  vps_ip: false
  devices_per_ip: 1
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal, crypto, giftcard]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Earnings depend on location and bandwidth usage. US/EU residential IPs earn more."

cashout:
  method: redirect
  dashboard_url: "https://dashboard.pawns.app/cashout"
  min_amount: 5.0
  currency: USD
  notes: >-
    Minimum $5. Select your country first; the methods depend on it. From
    Spain (October 2026): PayPal 4% with a $0.25 minimum fee, paid through
    Tremendous, which emails a link where you enter your name and PayPal
    address; USDT (BEP20, ERC20, TRC20) or USDC (BEP20, ERC20) with a $1
    network fee; Bitcoin with a $2 minimum fee; gift cards with no fee. The
    first payout needs a one-time SMS check of your phone number: Withdraw
    opens it, and the number goes in with its country code. Every payout
    then asks for a code sent to your account email and is reviewed for up
    to 72 hours before it is sent.

platforms: [docker, windows, macos, linux, android, ios]

collector:
  type: api
  notes: "JWT auth via POST /api/v1/users/tokens (email+password), then GET /api/v1/users/me/balance-dashboard"
  credential_hint: "Use your IPRoyal Pawns account email and password (same as <a href='https://pawns.app' target='_blank'>pawns.app</a>)."

payout:
  model: internal
  notes: "Balance held by IPRoyal Pawns; withdrawn on request."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: fair
    account_safety: fair
    terms_fit: poor
    traffic_transparency: fair
    privacy: unknown
    identity_checks: fair
    support: unknown
    earnings_realism: unknown
    longevity: fair
  notes:
    payout_record: Trustpilot withholds the rating of pawns.app for a breach of its guidelines and says
      it removed fake reviews, so its payout reviews cannot be taken at face value. We have not yet published
      a completed payout of our own.
    payout_terms: PayPal 4% fee via Tremendous, payouts reviewed up to 72 hours
    account_safety: One Trustpilot reviewer says an account was blocked during a withdrawal after a phone
      number was mistyped; we could not confirm a wider pattern on the page.
    terms_fit: No servers, VPNs or proxies, one device per IP
    traffic_transparency: Business clients route traffic, you cannot see which
    privacy: The client is closed source; we did not review the privacy policy in depth.
    identity_checks: SMS phone check first, email code every payout
    support: No repeated support complaint found and no ticket of our own.
    earnings_realism: We have not measured Pawns earnings per IP against a provider figure.
    longevity: Pawns.App Ltd, incorporated in England and Wales on 28 October 2024
  cons:
  - text: The terms say an account can be blocked without prior notice for abuse of withdrawal conditions
      or multiple accounts, and its earnings may then not be paid out.
    criterion: account_safety
    kind: terms
    source: https://pawns.app/terms-of-use/
    checked_on: "2026-11-04"
  - text: The terms say Pawns does not allow any servers, VPNs or proxy services for traffic sharing,
      and only one device per IP.
    criterion: terms_fit
    kind: terms
    source: https://pawns.app/terms-of-use/
    checked_on: "2026-11-04"
  - text: PayPal costs 4% (at least $0.25) through Tremendous, and every payout is reviewed for up to
      72 hours.
    criterion: payout_terms
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/iproyal.yml
    checked_on: "2026-11-04"
  - text: The first payout needs an SMS check of your phone number, and every payout a code sent by email.
    criterion: identity_checks
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/iproyal.yml
    checked_on: "2026-11-04"
  - text: The privacy policy names the operator, Pawns.App Ltd (company 16043795 in England and Wales),
      which Companies House shows was incorporated on 28 October 2024, under three years ago.
    criterion: longevity
    kind: terms
    source: https://pawns.app/privacy-policy/
    checked_on: "2026-11-06"
  - text: The terms say Pawns and its business clients route traffic through your device, and that you
      cannot identify which client uses it.
    criterion: traffic_transparency
    kind: terms
    source: https://pawns.app/terms-of-use/
    checked_on: "2026-11-04"
  pros:
  - text: A $5 minimum, with gift cards at no fee.
    criterion: payout_terms
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/iproyal.yml
    checked_on: "2026-11-04"
