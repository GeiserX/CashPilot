name: ProxyRack
slug: proxyrack
category: bandwidth
status: active
priority: 13
website: https://peer.proxyrack.com
description: >
  ProxyRack's Peer program lets you earn by sharing your bandwidth as part of
  their proxy network. Each device requires a unique 64-character hex UUID and
  optionally an API key to auto-register the device. Works on both residential
  and VPS/datacenter connections. Dashboard is behind Cloudflare, which may
  require manual browser-based API key retrieval.
short_description: Bandwidth sharing - UUID per device, works on VPS

referral:
  signup_url: "https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn"
  code: "mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn"

docker:
  image: proxyrack/pop
  platforms: [linux/amd64]
  resources:
    mem_limit: "256m"
    oom_score_adj: 300
  env:
    - key: UUID
      per_device: true
      label: "Device UUID"
      required: true
      secret: false
      description: "Unique 64-character hex ID per device. Generate with: cat /dev/urandom | tr -dc 'a-f0-9' | fold -w 64 | head -n 1"
    - key: API_KEY
      label: "API Key"
      required: false
      secret: true
      description: "Log in at <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → API Key is shown on the main dashboard page (auto-registers device if provided). Need an account? Sign up with <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
    - key: DEVICE_NAME
      identifier: true
      label: "Device name"
      required: false
      secret: false
      description: "Friendly name for the device in dashboard"
      default: "Device-${UUID}"
  ports: []
  volumes: []
  command: ""
  network_mode: ""
  # The image's own start (/app/run.sh) deletes the client (/app/script.js)
  # and downloads it again from app-updates.sock.sh, once, with no retry. When
  # that host is down, every start gives a copy that stays up and earns nothing,
  # and a restart deletes the client a working copy already had (both seen on
  # 2026-11-27, when the host refused connections). The client also needs that
  # host at every start: it asks it for the version of its Go program
  # (/app/PoP_go), and with no answer it truncates that file to 0 bytes, logs
  # "could not get app path. exiting" and exits. Once the host is back it sees
  # the same version number, runs the empty file and exits again ("child
  # exited"), for good. Both were seen the same day on a copy restarted during
  # the outage.
  #
  # So this start runs the client only when the host answers version.txt, and
  # otherwise waits and asks again every 5 minutes, so a copy heals by itself
  # once the host is back. It replaces script.js only with a download that
  # is not empty and passes `node --check`, deletes an empty PoP_go (and its version file) so
  # the client downloads it again, and starts the client again 5 minutes after
  # it exits. It keeps run.sh's node arguments and its API_KEY registration
  # that writes /app/api.cfg, with two fixes: the payload is JSON-encoded, so a
  # quote in DEVICE_NAME cannot break it, and a request that fails or returns
  # nothing is retried, where run.sh took it as success. It cannot exec run.sh,
  # as the schema prefers, because run.sh is where the client gets deleted.
  entrypoint:
    - /bin/bash
    - -c
    - |
      cd /app || exit 1
      if [ -z "$UUID" ]; then echo "Please set the UUID environment variable."; exit 1; fi
      url=https://app-updates.sock.sh/peerclient/script
      if [ -n "$API_KEY" ] && [ ! -f /app/api.cfg ]; then
        (
          export device_name=${DEVICE_NAME:-"Device-$UUID"}
          payload=$(node -e 'process.stdout.write(JSON.stringify({device_id: process.env.UUID, device_name: process.env.device_name}))')
          echo "Adding device to dashboard..."
          while true; do
            if response=$(curl -sS -X POST https://peer.proxyrack.com/api/device/add -H "Api-Key: $API_KEY" -H 'Content-Type: application/json' -H 'Accept: application/json' -d "$payload") &&
              [ -n "$response" ] && ! echo "$response" | grep -q '"status": "error"'; then
              echo "Device added successfully!"
              touch /app/api.cfg
              break
            fi
            echo "Device not found yet, retrying in 1 minute..."
            sleep 60
          done
        ) &
      fi
      while true; do
        echo "Updating Proxyrack..."
        if wget -nv -T 30 -t 1 -O script.new.js "$url/script.js" && [ -s script.new.js ] && node --check script.new.js; then
          mv -f script.new.js script.js
          echo "Update done!"
        else
          rm -f script.new.js
        fi
        version=$(curl -fsS -m 30 "$url/version.txt")
        case "$version" in ''|*[!0-9]*) version= ;; esac
        if [ -s script.js ] && [ -n "$version" ]; then
          if [ -f PoP_go ] && [ ! -s PoP_go ]; then rm -f PoP_go go_version.txt; fi
          node script.js --homeIp point-of-presence.sock.sh --homePort 443 --id "$UUID" --version "$version" --clientKey proxyrack-pop-client --clientType PoP
          echo "[CashPilot] ProxyRack's client stopped. Starting it again in 5 minutes."
        else
          echo "[CashPilot] ProxyRack's update server cannot be reached, and ProxyRack's client cannot start without it. Trying again in 5 minutes."
        fi
        sleep 300
      done
    - proxyrack-start
  health_signals:
    # Copies started by CashPilot (the entrypoint above) log one of these lines
    # while they wait for the update host, and never the missing-module error
    # below. A client that connects again logs "connected to server".
    - pattern: "\\[CashPilot\\] ProxyRack's (update server cannot be reached|client stopped)"
      unless: "connected to server"
      window_hours: 1
      means: >-
        ProxyRack's client cannot run on this copy, so it earns nothing. The
        usual cause is that ProxyRack's update server is not answering, and
        the client cannot start without it. The copy tries again every 5
        minutes and starts by itself once the server answers. There is
        nothing to fix on your side.
    # Copies made before CashPilot had its own start run the image's run.sh.
    # When its one download fails, node logs "Cannot find module
    # '/app/script.js'" and the container stays up and earns nothing (seen
    # live in Nov 2026 on several copies). The line only shows on a copy that
    # has no client, so a restart deletes nothing that works. It does not help
    # while the update host is down (2026-11-27: two restarts, both dead), but
    # it clears the copy once the host is back (2026-11-24: "connected to
    # server" within 4 seconds). The window outlasts the 6-hour restart
    # cooldown, so a failed restart is tried again.
    - pattern: "Cannot find module .?/app/script\\.js"
      unless: "connected to server"
      window_hours: 12
      restart: true
      means: >-
        ProxyRack's client did not download when this copy started, because
        ProxyRack's update server could not be reached, so the copy runs but
        earns nothing. CashPilot restarts it every 6 hours to try again.
        Redeploy it to give it CashPilot's own start, which keeps the client
        and tries again every 5 minutes by itself.
  privileged: false

device_link:
  id_env: UUID
  url: "https://peer.proxyrack.com"
  id_shape: '[0-9a-f]{64}'
  steps: >-
    Sign in to ProxyRack, open Devices, choose Add device and paste this UUID.
    Until the device is on your account it earns for nobody. If you entered an
    API key, the container registers itself: check the device is listed there.

requirements:
  residential_ip: false
  devices_per_account: 500
  note: "Proxyrack documents a 500-device limit per ACCOUNT and no per-IP limit. Datacentre IPs are accepted but reclassified to a lower rate."
  note_column: devices_per_ip
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal, giftcard, bank]
  minimum_payout: "$20"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 4
  currency: USD
  per: "device"
  notes: "Residential IPs earn more than datacenter. Dashboard behind Cloudflare may complicate automated access."

cashout:
  method: redirect
  dashboard_url: "https://peer.proxyrack.com/dashboard"
  min_amount: 20.0
  currency: USD
  notes: >-
    Request the payout on the dashboard. ProxyRack reviews it within 72 hours,
    then Tremendous emails you a reward to redeem as PayPal, a gift card or a
    wire transfer. There is no crypto option.

platforms: [docker, windows, macos, linux]

collector:
  type: api
  notes: "Dashboard behind Cloudflare. May need API key from browser session. Per-device earnings visible."
  credential_hint: "Log in at <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, press F12 → Network, find any API request and copy the <b>Api-Key</b> header value. Need an account? Sign up with <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."

payout:
  model: internal
  notes: "Balance held by ProxyRack; withdrawn on request."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: unknown
    account_safety: fair
    terms_fit: good
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: unknown
    longevity: unknown
  notes:
    payout_record: ProxyRack's Trustpilot reviews are mostly from proxy buyers; one peer reports payouts
      within three days and warns against deleting devices while a payout is pending. Not enough to judge.
    payout_terms: Third-party reviews disagree on the minimum ($5 or $20) and the help page did not load
      for us.
    account_safety: Removing a device takes its earnings off your account
    terms_fit: Own Docker image, proxyrack/pop, datacentre IPs accepted
    traffic_transparency: We could not load the peer program's terms.
    privacy: The client is closed source; we could not load the privacy terms.
    identity_checks: Not documented on pages we could load.
    support: No peer-program pattern found.
    earnings_realism: Not measured.
    longevity: We could not confirm the legal entity on a page that loaded.
  cons:
  - text: ProxyRack's help centre says removing a device takes that device's earnings off your account,
      and they come back only if the same device is added again.
    criterion: account_safety
    kind: terms
    source: https://help.proxyrack.com/en/articles/6532814-my-earnings-were-removed
    checked_on: "2026-11-04"
  pros:
  - text: ProxyRack publishes its own Docker image, proxyrack/pop, and accepts datacentre IPs at a lower
      rate.
    criterion: terms_fit
    kind: terms
    source: https://hub.docker.com/r/proxyrack/pop
    checked_on: "2026-11-04"
