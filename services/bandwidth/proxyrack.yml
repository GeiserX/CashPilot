name: ProxyRack
slug: proxyrack
category: bandwidth
status: active
website: https://peer.proxyrack.com
description: >
  ProxyRack's Peer program lets you earn by sharing your bandwidth as part of
  their proxy network. Each device requires a unique 64-character hex UUID and
  optionally an API key to auto-register the device. Works on both residential
  and VPS/datacenter connections. Dashboard is behind Cloudflare, which may
  require manual browser-based API key retrieval.
short_description: Bandwidth sharing - UUID per device, works on VPS

referral:
  signup_url: "https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn"
  code: "mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn"

docker:
  image: proxyrack/pop
  platforms: [linux/amd64]
  resources:
    mem_limit: "256m"
    oom_score_adj: 300
  env:
    - key: UUID
      label: "Device UUID"
      required: true
      secret: false
      description: "Unique 64-character hex ID per device. Generate with: cat /dev/urandom | tr -dc 'a-f0-9' | fold -w 64 | head -n 1"
    - key: API_KEY
      label: "API Key"
      required: false
      secret: true
      description: "Log in at <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → API Key is shown on the main dashboard page (auto-registers device if provided)"
    - key: DEVICE_NAME
      label: "Device name"
      required: false
      secret: false
      description: "Friendly name for the device in dashboard"
      default: "Device-${UUID}"
  ports: []
  volumes: []
  command: ""
  network_mode: ""
  privileged: false

device_link:
  id_env: UUID
  url: "https://peer.proxyrack.com"
  steps: >-
    Sign in to ProxyRack, open Devices, choose Add device and paste this UUID.
    Until the device is on your account it earns for nobody. If you entered an
    API key, the container registers itself: check the device is listed there.

requirements:
  residential_ip: false
  devices_per_account: 500
  note: "Proxyrack documents a 500-device limit per ACCOUNT and no per-IP limit. Datacentre IPs are accepted but reclassified to a lower rate."
  note_column: devices_per_ip
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal, crypto]
  minimum_payout: "$20"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 4
  currency: USD
  per: "device"
  notes: "Residential IPs earn more than datacenter. Dashboard behind Cloudflare may complicate automated access."

cashout:
  method: redirect
  dashboard_url: "https://peer.proxyrack.com/dashboard"
  min_amount: 20.0
  currency: USD

platforms: [docker, windows, macos, linux]

collector:
  type: api
  notes: "Dashboard behind Cloudflare. May need API key from browser session. Per-device earnings visible."
  credential_hint: "Log in at <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, press F12 → Network, find any API request and copy the <b>Api-Key</b> header value."

payout:
  model: internal
  notes: "Balance held by ProxyRack; withdrawn on request."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: unknown
    account_safety: fair
    terms_fit: good
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: unknown
    longevity: unknown
  notes:
    payout_record: ProxyRack's Trustpilot reviews are mostly from proxy buyers; one peer reports payouts
      within three days and warns against deleting devices while a payout is pending. Not enough to judge.
    payout_terms: Third-party reviews disagree on the minimum ($5 or $20) and the help page did not load
      for us.
    traffic_transparency: We could not load the peer program's terms.
    privacy: The client is closed source; we could not load the privacy terms.
    identity_checks: Not documented on pages we could load.
    support: No peer-program pattern found.
    earnings_realism: Not measured.
    longevity: We could not confirm the legal entity on a page that loaded.
  cons:
  - text: ProxyRack's help centre says removing a device takes that device's earnings off your account,
      and they come back only if the same device is added again.
    criterion: account_safety
    kind: terms
    source: https://help.proxyrack.com/en/articles/6532814-my-earnings-were-removed
    checked_on: "2026-11-04"
  pros:
  - text: ProxyRack publishes its own Docker image, proxyrack/pop, and accepts datacentre IPs at a lower
      rate.
    criterion: terms_fit
    kind: terms
    source: https://hub.docker.com/r/proxyrack/pop
    checked_on: "2026-11-04"
