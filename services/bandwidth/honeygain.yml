name: Honeygain
slug: honeygain
category: bandwidth
status: active
priority: 1
website: https://www.honeygain.com
description: >
  Share your unused internet bandwidth and earn passive income. Honeygain routes
  web intelligence, content delivery, and market research traffic through your
  connection. One of the most established bandwidth-sharing platforms with 12M+
  users and over 1M payouts completed.
short_description: Bandwidth sharing - most established platform

referral:
  signup_url: "https://dashboard.honeygain.com/ref/SERGIB4014"
  code: "SERGIB4014"

docker:
  image: honeygain/honeygain
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  resources:
    mem_limit: "256m"
    oom_score_adj: 200
  env:
    - key: HONEYGAIN_EMAIL
      label: "Email"
      required: true
      secret: false
      description: "Your Honeygain account email"
    - key: HONEYGAIN_PASSWORD
      label: "Password"
      required: true
      secret: true
      description: "Your Honeygain account password"
    - key: HONEYGAIN_DEVICE_NAME
      identifier: true
      label: "Device name"
      required: false
      secret: false
      description: "Name shown in your Honeygain dashboard"
      default: "cashpilot-{hostname}"
  ports: []
  volumes: []
  command: "-tou-accept -email ${HONEYGAIN_EMAIL} -pass ${HONEYGAIN_PASSWORD} -device ${HONEYGAIN_DEVICE_NAME}"
  network_mode: ""
  privileged: false

requirements:
  residential_ip: true
  vps_ip: false
  devices_per_account: 10
  devices_per_ip: 1
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal, crypto]
  minimum_payout: "$20"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Varies by location. US/EU IPs earn more. Max 10 devices per account."

cashout:
  method: redirect
  dashboard_url: "https://dashboard.honeygain.com/payout/request"
  min_amount: 20.0
  currency: USD
  notes: >-
    Minimum $20 (20,000 credits). Two options: PayPal through Tipalti, about
    15% fee, or JumpTask credits with no fee, paid into a JumpTask wallet.
    A request needs a 6-digit code sent by email. The first PayPal payout
    stays "waiting for details" until you register on Tipalti from the link
    they email. That link works only once, so open it when you can finish in
    one sitting and have your phone at hand: after setting a password,
    Tipalti makes you confirm a mobile number by SMS (the codes expire within
    minutes), then asks for your name, address, country and date of birth,
    and your PayPal address. Tipalti charges $2.02 per payment; choose USD to
    avoid its 1.9-3% currency conversion fee. Payment follows within 2
    business days. The balance leaves your account as soon as you request,
    even while the payout waits for Tipalti. Each later Tipalti login sends
    a new SMS code unless you tick the option to remember the device for 30
    days. In October 2026 Tipalti did not ask a payee in Spain for a tax
    form.

platforms: [docker, windows, macos, linux, android]

collector:
  type: api
  notes: "JWT auth via /v1/users/me and /v2/earnings endpoints"
  credential_hint: "Use your Honeygain account email and password (same as <a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a>)."

payout:
  model: internal
  notes: "Balance held by Honeygain; withdrawn on request."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: poor
    account_safety: fair
    terms_fit: good
    traffic_transparency: fair
    privacy: unknown
    identity_checks: fair
    support: unknown
    earnings_realism: fair
    longevity: good
  notes:
    payout_record: Trustpilot withholds Honeygain's rating for a breach of its guidelines and says it
      removed fake reviews, so its review pages cannot show a payout record either way. We have not yet
      published a completed Honeygain payout of our own.
    payout_terms: Unpaid earnings can be written off after 24 months
    account_safety: Can suspend accounts and withhold or write off earnings
    terms_fit: Own Docker image, honeygain/honeygain
    traffic_transparency: Traffic serves business clients, none named
    privacy: The client is closed source. We did not find a published list of what the client collects
      beyond the privacy policy's general terms.
    identity_checks: Tipalti needs SMS, name, address and date of birth before PayPal
    support: Two recent Trustpilot reviews say support did not answer; two is not a pattern, and we have
      no ticket of our own.
    earnings_realism: Earnings depend on demand and location, slow to reach $20
    longevity: Run by Honeygain UAB (Lithuania), founded 2019
  cons:
  - text: The terms let Honeygain write off earnings that reached the $20 threshold and were not paid
      out within 24 months, and treat earnings as expired after six months without use.
    criterion: payout_terms
    kind: terms
    source: https://www.honeygain.com/terms-of-use/
    checked_on: "2026-11-04"
  - text: The minimum is $20, and PayPal payouts go through Tipalti, which charges $2.02 per payment.
    criterion: payout_terms
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/honeygain.yml
    checked_on: "2026-11-04"
  - text: The terms let Honeygain suspend an account and withhold or write off earnings it considers accumulated
      under false pretenses.
    criterion: account_safety
    kind: terms
    source: https://www.honeygain.com/terms-of-use/
    checked_on: "2026-11-04"
  - text: Before the first PayPal payout, Tipalti makes you confirm a mobile number by SMS and give your
      name, address and date of birth.
    criterion: identity_checks
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/honeygain.yml
    checked_on: "2026-11-04"
  - text: The terms say business clients use the traffic to gather publicly available web data, but name
      no client, and you cannot know which client uses your connection.
    criterion: traffic_transparency
    kind: terms
    source: https://www.honeygain.com/terms-of-use/
    checked_on: "2026-11-04"
  - text: Honeygain's own replies to low-earnings reviews say earnings depend on network demand and location;
      reviewers report taking a very long time to reach the $20 minimum.
    criterion: earnings_realism
    kind: provider_reply
    source: https://www.trustpilot.com/review/honeygain.com
    checked_on: "2026-11-04"
  pros:
  - text: Honeygain publishes its own Docker image, honeygain/honeygain.
    criterion: terms_fit
    kind: terms
    source: https://hub.docker.com/r/honeygain/honeygain
    checked_on: "2026-11-04"
  - text: The terms name the operator, Honeygain UAB, registered in Vilnius, Lithuania.
    criterion: longevity
    kind: terms
    source: https://www.honeygain.com/terms-of-use/
    checked_on: "2026-11-04"
  - text: Honeygain's press page says it was founded in 2019.
    criterion: longevity
    kind: terms
    source: https://www.honeygain.com/press-area/
    checked_on: "2026-11-04"
