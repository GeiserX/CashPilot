name: Spide
slug: spide
category: bandwidth
status: active
website: https://spide.network
description: >
  Spide is a bandwidth-sharing service that lets you monetize unused internet
  bandwidth. Uses an optional machine ID for device tracking. Available through
  community Docker images from the income-generator project.
short_description: Bandwidth sharing - machine ID based

referral:
  signup_url: "https://spide.network/register.html?f3bc51"
  code: "f3bc51"
  bonus:
    referrer: "10% of their earnings"
    referee: "$5 sign-up bonus"

docker:
  image: ""
  platforms: []
  env:
    - key: SPIDE_MACHINE_ID
      label: "Machine ID"
      required: false
      secret: false
      description: "Machine ID for existing device already registered (auto-generated if empty)"
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  vps_ip: false
  devices_per_ip: 1
  note: "Traffic through one public IP is split between the devices sharing it, so a second device on the same connection adds nothing."
  note_column: devices_per_ip
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 3
  currency: USD
  per: "device"
  notes: "Limited information available. Earnings depend on location."

cashout:
  method: redirect
  dashboard_url: "https://spide.network/dashboard"
  min_amount: 5.0
  currency: USD

platforms: [windows, linux]

collector:
  type: manual
  notes: "No official Docker image or public API found."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: unknown
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: unknown
    longevity: unknown
  notes:
    payout_record: We found no user reports or payout proof.
    payout_terms: Our catalog lists crypto from $5; a third-party listing says Litecoin from $10. Not
      confirmed on Spide's own pages.
    account_safety: No reports found.
    traffic_transparency: Spide calls itself a proxy network; it does not say who the buyers are.
    privacy: Not reviewed.
    identity_checks: Not documented.
    support: No reports found.
    earnings_realism: Spide's homepage calculator shows an example of about $45 a month. We found no
      user reports or measured figures to compare it with.
    longevity: We did not find the company behind Spide.
  cons:
  - text: 'CashPilot does not run Spide: you use the provider''s own app, so CashPilot cannot deploy or
      update it for you. Its terms were not checked for containers.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/spide.yml
    checked_on: "2026-11-04"
