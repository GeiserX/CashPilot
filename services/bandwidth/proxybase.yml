name: ProxyBase
slug: proxybase
category: bandwidth
status: active
website: https://proxybase.org
description: >
  ProxyBase is a bandwidth-sharing platform that pays users in cryptocurrency for
  sharing their unused internet connection. You authenticate the peer client with an
  Access Token from your dashboard. Residential IPs earn the most, but datacenter IPs
  are also supported. Official multi-arch Docker image (amd64/arm64/armv7).
short_description: proxybase.org - bandwidth sharing, crypto payout, Access Token auth. No wallet is generated

referral:
  signup_url: "https://peer.proxybase.org?referral=nXzS3c6iTO"
  code: "nXzS3c6iTO"

docker:
  # Index digest of tag v2.0.3 (their v2.0.x tags re-package the same client, which
  # still reports itself as 1.0.4 — verified against ghcr 2026-08-19).
  image: "ghcr.io/proxybaseorg/peer-cli@sha256:b78dda3969019eb9e0d3ba0aeba0929148337898b00d99cf780f4d8c99b31b0e"
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: ID
      label: "Access Token"
      required: true
      secret: true
      description: "Log in at <a href=\"https://peer.proxybase.org/dashboard\">peer.proxybase.org/dashboard</a> → copy your Access Token (shown in the Docker command on the setup page)"
    - key: NAME
      label: "Device Name"
      required: true
      secret: false
      description: "Any name (no spaces) to identify this device in your ProxyBase dashboard"
      default: "cashpilot-{hostname}"
  ports: []
  volumes: []
  # The peer client reads its credentials ONLY as positional arguments. Its own
  # error text offers "environment variables ID and NAME" as an alternative, but
  # no published image honors them — verified live 2026-08-19 on both the pinned
  # digest and tag v2.0.3: env-only containers loop on "Missing ID and NAME"
  # while argument-style containers connect (issue #343). The ${VAR} placeholders
  # are filled from the form values at deploy time.
  command: "${ID} ${NAME}"
  network_mode: ""

requirements:
  residential_ip: false
  vps_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: "$1"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Crypto payouts. Earnings depend on location and bandwidth usage."

cashout:
  method: redirect
  dashboard_url: "https://peer.proxybase.org/dashboard"
  min_amount: 1.0
  currency: USD

platforms: [docker, windows, linux]

collector:
  type: manual
  notes: "No known public API for earnings."

payout:
  model: internal
  notes: >-
    Earnings accrue to the ProxyBase ACCOUNT the Access Token belongs to, and
    are withdrawn from the dashboard on request. The peer client holds no
    wallet and the container keeps no state -- docker.volumes is empty.
    Not to be confused with proxybase-xyz (ProxyBase Markets, same org), which
    genuinely does mint a local wallet and declares it a critical volume.
