name: ProxyBase
slug: proxybase
category: bandwidth
status: active
website: https://proxybase.org
description: >
  ProxyBase is a bandwidth-sharing platform that pays users in cryptocurrency for
  sharing their unused internet connection. You authenticate the peer client with an
  Access Token from your dashboard. Residential IPs earn the most, but datacenter IPs
  are also supported. Official multi-arch Docker image (amd64/arm64/armv7).
short_description: proxybase.org - bandwidth sharing, crypto payout, Access Token auth. No wallet is generated

referral:
  signup_url: "https://peer.proxybase.org?referral=nXzS3c6iTO"
  code: "nXzS3c6iTO"

docker:
  # Index digest of tag v2.0.3 (their v2.0.x tags re-package the same client, which
  # still reports itself as 1.0.4 — verified against ghcr 2026-08-19).
  image: "ghcr.io/proxybaseorg/peer-cli@sha256:b78dda3969019eb9e0d3ba0aeba0929148337898b00d99cf780f4d8c99b31b0e"
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: ID
      label: "Access Token"
      required: true
      secret: true
      description: "Log in at <a href=\"https://peer.proxybase.org/dashboard\">peer.proxybase.org/dashboard</a> → copy your Access Token (shown in the Docker command on the setup page)"
    - key: NAME
      label: "Device Name"
      required: true
      secret: false
      description: "Any name (no spaces) to identify this device in your ProxyBase dashboard"
      default: "cashpilot-{hostname}"
  ports: []
  volumes: []
  # The peer client reads its credentials ONLY as positional arguments. Its own
  # error text offers "environment variables ID and NAME" as an alternative, but
  # no published image honors them — verified live 2026-08-19 on both the pinned
  # digest and tag v2.0.3: env-only containers loop on "Missing ID and NAME"
  # while argument-style containers connect (issue #343). The ${VAR} placeholders
  # are filled from the form values at deploy time.
  command: "${ID} ${NAME}"
  network_mode: ""

requirements:
  residential_ip: false
  vps_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: "$0.20"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Crypto payouts. Earnings depend on location and bandwidth usage."

cashout:
  method: redirect
  dashboard_url: "https://peer.proxybase.org/dashboard/withdraw"
  min_amount: 0.2
  currency: USD
  notes: >-
    The site lists a $0.20 minimum, and a request under $1 went through in
    October 2026. A request always withdraws the full balance, as USDC on
    Polygon, POL or Litecoin, to an address you type in. ProxyBase covers the
    network fee.

platforms: [docker, windows, linux]

collector:
  type: manual
  notes: "No known public API for earnings."

payout:
  model: internal
  notes: >-
    Earnings accrue to the ProxyBase ACCOUNT the Access Token belongs to, and
    are withdrawn from the dashboard on request. The peer client holds no
    wallet and the container keeps no state -- docker.volumes is empty.
    Not to be confused with proxybase-xyz (ProxyBase Markets, same org), which
    genuinely does mint a local wallet and declares it a critical volume.

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: good
    payout_terms: fair
    account_safety: unknown
    terms_fit: good
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: good
    support: unknown
    earnings_realism: fair
    longevity: fair
  notes:
    account_safety: No reports found.
    traffic_transparency: We did not find who buys the traffic or how buyers are checked.
    privacy: The peer client is closed source.
    support: No reports found.
  cons:
  - text: ProxyBase itself wrote in August 2025 that it is new and not yet the place to maximise earnings.
    criterion: earnings_realism
    kind: provider_reply
    source: https://github.com/engageub/InternetIncome/discussions/239
    checked_on: "2026-11-04"
  - text: ProxyBase switched peer clients in 2026 and shut the old backend, so containers on the old image
      kept running and stopped earning.
    criterion: longevity
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/docs/guides/proxybase.md
    checked_on: "2026-11-04"
  - text: Crypto only, as USDC on Polygon, POL or Litecoin, with no fiat method. The minimum is $0.20 and
      ProxyBase pays the network fee.
    criterion: payout_terms
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/docs/guides/proxybase.md
    checked_on: "2026-11-04"
  pros:
  - text: Our $0.75 withdrawal went through in October 2026.
    criterion: payout_record
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/docs/guides/proxybase.md
    checked_on: "2026-11-04"
  - text: A withdrawal needs only an address typed into the request.
    criterion: identity_checks
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/proxybase.yml
    checked_on: "2026-11-04"
  - text: ProxyBase publishes its own peer client image and supports datacentre IPs.
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/proxybase.yml
    checked_on: "2026-11-04"
