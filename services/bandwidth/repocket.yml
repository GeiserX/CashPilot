name: Repocket
slug: repocket
category: bandwidth
status: active
priority: 8
website: https://repocket.com
description: >
  Repocket lets you earn passive income by sharing your unused internet bandwidth.
  Residential IPs earn the most; VPS/datacenter IPs are accepted at lower rates.
  Max 5 devices and 5 active sessions per account. The Docker container
  authenticates with your account email and an API key from the Repocket
  dashboard (not your password).
short_description: Bandwidth sharing - max 5 devices, API key auth

referral:
  signup_url: "https://link.repocket.com/b1zM"
  code: "b1zM"
  program: true
  bonus:
    referrer: "$2 once the referee has earned $7, then 5% of their earnings for life"
    referee: "$2 wallet bonus on sign-up"

docker:
  image: repocket/repocket
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: RP_EMAIL
      label: "Email"
      required: true
      secret: false
      description: "Your Repocket account email"
    - key: RP_API_KEY
      label: "API Key (UUIDv4, not your password)"
      required: true
      secret: true
      pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}'
      description: "Your Repocket API key — log in at <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> and copy the API key shown on the bandwidth-earnings page (this is NOT your account password)"
  ports: []
  volumes: []
  command: ""
  network_mode: ""
  privileged: false

requirements:
  residential_ip: true
  devices_per_account: 5
  note: "Repocket documents a five-device limit per ACCOUNT but publishes no per-IP device limit. The '2 devices per IP' figure repeated on review sites has no provider source, so CashPilot does not assert it."
  note_column: devices_per_ip
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal, crypto]
  minimum_payout: "$4 ($2 after the first payout)"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 4
  currency: USD
  per: "device"
  notes: "Residential IPs earn more. VPS/datacenter IPs accepted but at lower rates."

cashout:
  method: redirect
  dashboard_url: "https://repocket.com/dashboard/wallet"
  min_amount: 4.0
  currency: USD
  notes: >-
    Repocket sets the minimum per account: $4 before the first payout and $2
    after it in October 2026, far below the $20 it used to advertise. Methods:
    Tremendous (to your email) or USDT on Polygon. Each request is confirmed
    from an emailed link within 2 hours, and only one request can be pending
    at a time. In October 2026 Repocket refused a Tremendous request with
    "Please, message support", while USDT on Polygon went through.

platforms: [docker, windows, macos, linux, android]

collector:
  type: api
  notes: "Earnings collector authenticates separately via Firebase (account email/password) to read the balance — distinct from the container's RP_API_KEY. Per-device earnings visible."
  credential_hint: "Use your Repocket account email and password (same as <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>)."

payout:
  model: internal
  notes: "Balance held by Repocket; withdrawn on request."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: poor
    payout_terms: poor
    account_safety: poor
    terms_fit: good
    traffic_transparency: fair
    privacy: unknown
    identity_checks: fair
    support: fair
    earnings_realism: unknown
    longevity: fair
  notes:
    privacy: The client is closed source; we did not review the privacy policy in depth.
    earnings_realism: Reviewers report very small amounts, but we have not measured Repocket's earnings
      against a provider figure.
  cons:
  - text: Several Trustpilot reviewers report cancelled payouts and balances reset to zero; one says support
      cited irregular bandwidth earnings. The page rates Repocket 2.7 and notes it has not replied to
      negative reviews.
    criterion: account_safety
    kind: user_reports
    source: https://www.trustpilot.com/review/repocket.com
    checked_on: "2026-11-04"
  - text: Reviewers report rejected withdrawals and having to chase payment.
    criterion: payout_record
    kind: user_reports
    source: https://www.trustpilot.com/review/repocket.com
    checked_on: "2026-11-04"
  - text: Repocket's payment policy lets it reverse, cancel or permanently forfeit earnings whenever it
      suspects they are invalid, and forfeit the unpaid earnings of a dormant account.
    criterion: payout_terms
    kind: terms
    source: https://repocket.com/payment-and-rewards-policy
    checked_on: "2026-11-04"
  - text: The same policy lets Repocket add, remove or replace payout methods at any time without notice;
      PayPal was removed.
    criterion: payout_terms
    kind: terms
    source: https://repocket.com/payment-and-rewards-policy
    checked_on: "2026-11-04"
  - text: The terms say Repocket may require identity or account verification at any time, and payout
      eligibility depends on it.
    criterion: identity_checks
    kind: terms
    source: https://repocket.com/terms-and-conditions
    checked_on: "2026-11-04"
  - text: The terms say Repocket and its partners use the network capacity, but do not say who the partners
      are or how they are vetted.
    criterion: traffic_transparency
    kind: terms
    source: https://repocket.com/terms-and-conditions
    checked_on: "2026-11-04"
  - text: Trustpilot notes Repocket has not replied to negative reviews, and reviewers say messages are
      ignored.
    criterion: support
    kind: user_reports
    source: https://www.trustpilot.com/review/repocket.com
    checked_on: "2026-11-04"
  - text: The current terms name Repocket Pte. Ltd. in Singapore; older terms named no company.
    criterion: longevity
    kind: terms
    source: https://repocket.com/terms-and-conditions
    checked_on: "2026-11-04"
  pros:
  - text: Repocket publishes its own Docker image, repocket/repocket, and its terms allow containers you
      own.
    criterion: terms_fit
    kind: terms
    source: https://repocket.com/terms-and-conditions
    checked_on: "2026-11-04"
  - text: 'The minimum is low: $4 before the first payout and $2 after it.'
    criterion: payout_terms
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/repocket.yml
    checked_on: "2026-11-04"
