name: ProxyBase Markets
slug: proxybase-xyz
category: bandwidth
status: active
website: https://proxybase.xyz
description: >
  ProxyBase Markets is a SOCKS5 proxy marketplace built for AI agents. Sellers run
  a lightweight Rust CLI daemon that connects via WebSocket to relay buyer traffic
  through their internet connection, earning USDC on Tempo Chain per GB sold. Supports
  both direct (own bandwidth) and upstream (resell external proxies) modes with
  auto-reconnect. Buyers purchase proxy sessions by country, ISP, and bandwidth.
  Payments flow through the Machine Payments Protocol (MPP) on Tempo Chain.
short_description: proxybase.xyz - SOCKS5 marketplace for AI agents, USDC payout. Generates a wallet whose volume holds the only copy of the key

referral:
  signup_url: "https://proxybase.xyz?referral=nXzS3c6iTO"
  code: "nXzS3c6iTO"

docker:
  image: "ghcr.io/proxybasehq/proxybase-cli@sha256:007e2be8087e6926230ac69de9b23b4b9d7d195f63e0d87fd8626916c91cc268"
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: PROXYBASE_BACKEND
      label: "Backend API URL"
      required: false
      secret: false
      description: "Override the backend API URL (defaults to https://api.proxybase.xyz)"
      default: "https://api.proxybase.xyz"
  ports: []
  volumes:
    - "proxybase-data:/home/proxybase/.proxybase"
  critical_volumes:
    - target: "/home/proxybase/.proxybase"
      holds: >-
        The generated wallet keyfile. This volume IS the money: there is no
        server-side copy, so deleting it destroys the funds with it.
  command: "proxybase-cli seller start --foreground"
  network_mode: ""
  setup: >
    The container auto-bootstraps on first start: generates a secp256k1 wallet (BIP-39),
    authenticates via ECDSA challenge-response, and starts selling bandwidth in direct-only
    mode. All state (wallet, session token, seller config) is persisted in the
    <code>proxybase-data</code> volume. Check container logs on first run for the wallet
    address. Use <code>--upstream</code> to add external proxy resell paths.

requirements:
  residential_ip: false
  vps_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  crypto_token: "USDC"
  minimum_payout: "$1"
  currency: USDC
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 15
  currency: USD
  per: "device"
  notes: "Earnings based on GB sold at market rates. VPS/datacenter IPs earn less than residential. Multi-upstream mode can combine your own bandwidth with external proxies."

cashout:
  method: manual
  dashboard_url: "https://proxybase.xyz"
  min_amount: 1.0
  currency: USD
  notes: "Lock earnings via <code>proxybase-cli seller payout create</code>, received as USDC on Tempo Chain (Tempo MPP). Pays to any EVM address whose key you hold (Tempo is an EVM chain), with nothing to sign; add the Tempo network to the wallet to see the USDC."

platforms: [docker, linux, macos, windows]

collector:
  type: manual
  notes: "REST API at api.proxybase.xyz (GET /v2/seller/status, GET /v2/wallet/balance). Auth uses ECDSA challenge-response with secp256k1 wallet — feasible to automate but non-trivial."

# What this service does with the user's machine (CashPilot-66x).
# Written to be read by someone deciding whether to trust it.
disclosure:
  sells: >-
    Bandwidth, as a SOCKS5 proxy sold to buyers on the ProxyBase marketplace.
  third_party_traffic: >-
    Yes. Buyers route their traffic through your connection — that is exactly
    what is being sold.
  data_collected: >-
    A wallet address generated on your machine, plus the traffic volume you
    relay.
  isp_risk: >-
    Real, and it applies directly to home connections. Proxy traffic from
    unknown buyers exits under your IP, so abuse complaints arrive at your
    door. Nothing in this catalog restricts the service to datacentre
    addresses, and residential IPs earn more, so the incentive points the
    wrong way here: read your ISP's terms before running it at home.
  account_rules: >-
    unknown - the provider does not publish a per-account or per-IP device
    limit, and the catalog does not declare one.

payout:
  model: minted
  notes: "The client mints its own wallet on first run. See tier 3."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: fair
    account_safety: unknown
    terms_fit: good
    traffic_transparency: fair
    privacy: unknown
    identity_checks: good
    support: unknown
    earnings_realism: unknown
    longevity: unknown
  notes:
    payout_record: We found no independent payout reports and have no payout of our own.
    payout_terms: USDC on Tempo Chain, to an EVM address whose key you hold
    account_safety: There is no account in the usual sense; the client mints its own wallet.
    terms_fit: Own client image, accepts datacentre connections
    traffic_transparency: Sold as a SOCKS5 proxy, no buyer checks described
    privacy: Not reviewed beyond our own disclosure notes.
    identity_checks: Earn page says no KYC, $1 payout
    support: No reports found.
    earnings_realism: Search summaries of its marketing pages quote $1.80 per GB and $54 to $90 a month
      for one device, far above our catalog estimate of $0 to $15, but the pages did not load for us to
      check.
    longevity: We could not confirm the company behind ProxyBase Markets or how long it has run.
  cons:
  - text: Payouts are USDC on Tempo Chain, to any EVM address whose key you hold.
    criterion: payout_terms
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/proxybase-xyz.yml
    checked_on: "2026-11-04"
  - text: Your connection is sold as a SOCKS5 proxy to marketplace buyers; we found no description of
      how buyers are checked.
    criterion: traffic_transparency
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/proxybase-xyz.yml
    checked_on: "2026-11-04"
  pros:
  - text: Its own earn page is titled as needing no KYC, with a $1 payout.
    criterion: identity_checks
    kind: terms
    source: https://proxybase.xyz/earn/sell-internet
    checked_on: "2026-11-04"
  - text: ProxyBase publishes its own client image and accepts datacentre connections.
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/proxybase-xyz.yml
    checked_on: "2026-11-04"
