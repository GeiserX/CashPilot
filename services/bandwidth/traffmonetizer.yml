name: Traffmonetizer
slug: traffmonetizer
category: bandwidth
status: active
priority: 6
website: https://traffmonetizer.io
description: >
  Traffmonetizer lets you monetize your internet traffic by sharing bandwidth with
  verified businesses. One of the few bandwidth-sharing services that works well on
  VPS and datacenter IPs in addition to residential connections. Uses a simple
  token-based authentication passed via command-line arguments. Supports ARM
  architectures for Raspberry Pi and similar devices.
short_description: Bandwidth sharing - works on VPS, token-based auth

referral:
  signup_url: "https://traffmonetizer.io/?aff=2111758"
  code: "2111758"

docker:
  image: traffmonetizer/cli_v2
  # Docker Hub labels every tag of this image linux/amd64, including the two
  # real ARM builds, so Docker cannot pick them itself. CashPilot chooses the
  # tag from the architecture the worker reports.
  image_by_arch:
    arm64: traffmonetizer/cli_v2:arm64v8
    arm: traffmonetizer/cli_v2:arm32v7
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: TRAFFMONETIZER_TOKEN
      label: "Token"
      required: true
      secret: true
      description: "Log in at <a href=\"https://app.traffmonetizer.io\">app.traffmonetizer.io</a>, press F12 → Application → Local Storage → click <code>https://app.traffmonetizer.io</code> → copy the <code>authToken</code> value (about 54 characters, digits, a <code>|</code>, then letters and digits)"
    - key: TRAFFMONETIZER_DEVICE_NAME
      label: "Device name"
      required: false
      secret: false
      description: "Name displayed in dashboard for device management"
      default: "cashpilot-{hostname}"
  ports: []
  volumes: []
  command: "start accept --token ${TRAFFMONETIZER_TOKEN} --device-name ${TRAFFMONETIZER_DEVICE_NAME}"
  network_mode: ""
  privileged: false

requirements:
  residential_ip: false
  devices_per_ip: 0
  note: "Traffmonetizer ToS requires residential IP, but VPS nodes are accepted in practice."
  note_column: vps_ip
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto, bank]
  crypto_token: USDT
  minimum_payout: "$10"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 4
  currency: USD
  per: "device"
  notes: "VPS and datacenter IPs earn less than residential. US/EU locations earn more. Multiple IPs supported via Docker networks."

cashout:
  method: redirect
  dashboard_url: "https://app.traffmonetizer.io/dashboard"
  min_amount: 10.0
  currency: USD
  notes: >-
    Minimum $10. PayPal is no longer offered. Save one payout method in the
    profile first: USDT on Solana or TON (lowest fees), Arbitrum (low fees) or
    Tron TRC20 (high network fees), or a bank transfer from $1,000. The first
    address you save applies at once; changing it later needs an email
    confirmation. The dashboard may ask for a messenger contact (WhatsApp,
    Telegram or Skype) before the first withdrawal. A request pays whole
    dollars and the cents stay in the balance.

platforms: [docker, windows, macos, android]

collector:
  type: api
  notes: "reCAPTCHA blocks programmatic login. Token extracted from browser Local Storage at app.traffmonetizer.io (same as deployment token)."
  credential_hint: "Log in at <a href='https://app.traffmonetizer.io' target='_blank'>app.traffmonetizer.io</a>, press F12 → Application → Local Storage → <b>authToken</b> value (about 54 characters, digits, a <code>|</code>, then letters and digits)."

payout:
  model: internal
  notes: "USDT on the chain saved in the profile's payout settings (Solana, TON, Arbitrum or Tron), or a bank transfer. The address lives in Traffmonetizer's settings, not on the container."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: poor
    payout_terms: fair
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: good
    support: poor
    earnings_realism: fair
    longevity: unknown
  notes:
    payout_record: Trustpilot 1.9, payouts pending for weeks or missing
    payout_terms: Crypto, or bank wire from $1,000, PayPal gone
    account_safety: We found no repeated reports of banned accounts and could not read the current terms
      on suspension.
    terms_fit: Terms require a residential IP, hosting is outside them
    traffic_transparency: We could not find a page that says who buys the traffic or how buyers are checked.
    privacy: The client is closed source; we did not review the privacy policy in depth.
    identity_checks: Only a crypto address confirmed by email
    support: Live chat and email not answering, sometimes for weeks
    earnings_realism: Four reviewers from 2023 to 2025 report very slow earnings
    longevity: A third-party summary names Bytemarket OU in Estonia as the operator; we could not confirm
      it on Traffmonetizer's own pages.
  cons:
  - text: Trustpilot rates it 1.9; reviewers from 2023 to November 2026 report payouts pending for weeks,
      or marked completed with no matching transaction.
    criterion: payout_record
    kind: user_reports
    source: https://www.trustpilot.com/review/traffmonetizer.com
    checked_on: "2026-11-04"
  - text: The same reviewers report live chat and email support not answering, sometimes for weeks.
    criterion: support
    kind: user_reports
    source: https://www.trustpilot.com/review/traffmonetizer.com
    checked_on: "2026-11-04"
  - text: Crypto or a bank wire from $1,000 only; PayPal is gone, and a request pays whole dollars only.
    criterion: payout_terms
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/traffmonetizer.yml
    checked_on: "2026-11-04"
  - text: Traffmonetizer's terms require a residential IP, so a server on a hosting connection is outside
      them.
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/traffmonetizer.yml
    checked_on: "2026-11-04"
  - text: Four Trustpilot reviewers from 2023 to 2025 report very slow earnings, such as one cent a
      day across four devices, or almost two years to reach $10.
    criterion: earnings_realism
    kind: user_reports
    source: https://www.trustpilot.com/review/traffmonetizer.com
    checked_on: "2026-11-04"
  pros:
  - text: A payout needs only a saved crypto address confirmed by email; the dashboard may ask for a messenger
      contact.
    criterion: identity_checks
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/traffmonetizer.yml
    checked_on: "2026-11-04"
  - text: Traffmonetizer publishes its own Docker image, traffmonetizer/cli_v2.
    criterion: terms_fit
    kind: terms
    source: https://hub.docker.com/r/traffmonetizer/cli_v2
    checked_on: "2026-11-04"
