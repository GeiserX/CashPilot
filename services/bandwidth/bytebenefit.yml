# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: unknown
    account_safety: unknown
    terms_fit: fair
    traffic_transparency: fair
    privacy: unknown
    identity_checks: unknown
    support: unknown
    earnings_realism: unknown
    longevity: fair
  notes:
    payout_record: Trustpilot has four reviews. Two say the PayPal and Stripe payout pages return a 404
      and the money never arrived, and one says it was paid. Two matching reports is under our threshold
      for a pattern, so we could not grade it either way.
    payout_terms: The catalog records a $5 minimum paid by PayPal, but two reviewers say the PayPal and
      Stripe payout pages return a 404, so we cannot say the route works.
    account_safety: No reports either way.
    terms_fit: Own app only, CashPilot cannot deploy or update it
    traffic_transparency: Serves Infatica's clients, who are not named
    privacy: The client is closed source; we did not review the privacy policy.
    identity_checks: Not documented on pages we read.
    support: One Trustpilot reviewer says ByteBenefit support did not reply and Infatica's support sent
      them back to it; one is not a pattern.
    earnings_realism: Not measured.
    longevity: Android app left Google Play in April 2026 after 17 months
  cons:
  - text: The app's Google Play listing says your traffic serves web-intelligence requests by Infatica's
      clients, without saying who they are or how they are checked.
    criterion: traffic_transparency
    kind: terms
    source: https://play.google.com/store/apps/details?id=io.bytebenefit.app
    checked_on: "2026-11-04"
  - text: The Android app left Google Play in April 2026 after 17 months.
    criterion: longevity
    kind: press
    source: https://www.appbrain.com/app/bytebenefit/io.bytebenefit.app
    checked_on: "2026-11-04"
  - text: 'CashPilot does not run ByteBenefit: you use the provider''s own app, so CashPilot cannot deploy
      or update it for you. Its terms were not checked for containers.'
    criterion: terms_fit
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/bytebenefit.yml
    checked_on: "2026-11-04"
