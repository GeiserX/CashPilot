name: Bitping
slug: bitping
category: bandwidth
status: active
website: https://app.bitping.com
description: >
  Bitping is a decentralized network monitoring platform that pays you for running
  a node. Your node performs website monitoring, latency testing, and network
  quality checks for Bitping's customers. Works on both residential and VPS
  connections. The Docker image logs in with the BITPING_EMAIL and BITPING_PASSWORD
  environment variables on first start ("Attempting login with environment
  variables" in its own log), then persists the session in the volume mount so
  restarts do not re-authenticate.
short_description: Bandwidth sharing - decentralized network monitoring, works on VPS

referral:
  signup_url: "https://app.bitping.com"

docker:
  image: bitping/bitpingd
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "192m"
    oom_score_adj: 200
  # These two were dropped in the 2026-03-28 catalog rewrite while the image kept
  # supporting them, which left every deploy since with NO credentials at all: the
  # container sat at "No active session" forever and earned nothing (issue #341).
  # Verified live 2026-08-19 on bitpingd 26.8.17-1: with both set, the daemon logs
  # "Attempting login with environment variables" and writes a session to disk.
  env:
    - key: BITPING_EMAIL
      label: "Email"
      required: true
      secret: false
      description: "Your Bitping account email (same login as <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
    - key: BITPING_PASSWORD
      label: "Password"
      required: true
      secret: true
      description: "Your Bitping account password. Used once to create the node session, which then persists in the data volume."
  ports: []
  volumes:
    - "bitping-data:/root/.bitping"
  command: ""
  network_mode: ""
  privileged: false
  # Containers run with cap_drop: ALL, which also drops NET_RAW — one of the
  # capabilities Docker grants by default. This service earns by running network
  # probes, and raw-socket probes (traceroute-style) need NET_RAW. Measured: plain
  # ICMP echo still works without it, because Docker sets a permissive
  # ping_group_range, so this is not proven to be load-bearing for every probe
  # type. It is declared to restore exactly what this container had before the
  # hardening, rather than risk a probe silently failing and earning nothing.
  # Scoped per-slug, so it grants nothing to any other service.
  cap_add: [NET_RAW]
  notes: >
    Authentication is fully non-interactive: the daemon reads BITPING_EMAIL and
    BITPING_PASSWORD at startup and stores the resulting session in the
    /root/.bitping volume mount.

requirements:
  residential_ip: false
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  crypto_token: SOL
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Earnings depend on network quality and demand for monitoring from your location. VPS nodes accepted."

cashout:
  method: redirect
  dashboard_url: "https://nodes.bitping.com/dashboard"
  min_amount: 5.0
  currency: USD
  notes: >-
    Node earnings live on nodes.bitping.com; app.bitping.com is the API
    customer dashboard. Withdrawals are SOL only: type the Solana address into
    the request, processed within 24 hours.

platforms: [docker, windows, macos, linux]

collector:
  type: api
  notes: "Dashboard at app.bitping.com. Credentials persisted in /root/.bitping volume."
  credential_hint: "Use your Bitping account email and password (same as <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."

payout:
  model: internal
  chain: solana
  address_source: app
  notes: "Solana-only now, and the address is typed in AT WITHDRAWAL TIME rather than stored."

# Provider rating: the verdicts behind the grade (method: services/_ratings.yml,
# published at docs/ratings.md). The grade itself is computed, never written here.
rating:
  reviewed_on: "2026-11-04"
  verdicts:
    payout_record: unknown
    payout_terms: fair
    account_safety: unknown
    terms_fit: good
    traffic_transparency: unknown
    privacy: unknown
    identity_checks: good
    support: unknown
    earnings_realism: unknown
    longevity: unknown
  notes:
    payout_record: We found no repeated user reports either way and have not published a payout of our
      own.
    account_safety: We found no Bitping terms page or reports of bans.
    traffic_transparency: Bitping sells network monitoring from your connection; we found no page on who
      the customers are or how they are checked.
    privacy: The node is closed source; we did not find a privacy page specific to node runners.
    support: No repeated reports found either way.
    earnings_realism: Not measured against a provider figure.
    longevity: We did not find the legal entity behind Bitping.
  cons:
  - text: Payouts are in Solana (SOL) only since Bitping dropped its other chains, and a withdrawal to
      a new wallet can fail until that wallet holds enough SOL.
    criterion: payout_terms
    kind: terms
    source: https://bitping.com/help/nodes/troubleshooting-solana-payouts
    checked_on: "2026-11-04"
  pros:
  - text: Bitping's help says servers and Docker containers are supported.
    criterion: terms_fit
    kind: terms
    source: https://bitping.com/help/nodes/installing-the-node
    checked_on: "2026-11-04"
  - text: A withdrawal needs only a Solana address typed into the request.
    criterion: identity_checks
    kind: our_experience
    source: https://github.com/GeiserX/CashPilot/blob/main/services/bandwidth/bitping.yml
    checked_on: "2026-11-04"
