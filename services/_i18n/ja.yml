proxybase-xyz.description:
  text: "ProxyBase Markets は、AI エージェント向けに作られた SOCKS5 プロキシのマーケットプレイスです。販売者は軽量な Rust 製 CLI デーモンを動かし、デーモンが WebSocket で接続して購入者のトラフィックを自分のインターネット回線経由で中継し、販売した GB ごとに Tempo Chain 上の USDC を獲得します。direct(自分の帯域)と upstream(外部プロキシの再販)の両方のモードに対応し、自動再接続もあります。購入者は国、ISP、帯域を指定してプロキシセッションを購入します。支払いは Tempo Chain 上の Machine Payments Protocol(MPP)で行われます。紹介リンクは購入者向けです。リンクからコンソールを開いた購入者は、初回入金に 10% が上乗せされます。\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - AI エージェント向け SOCKS5 マーケットプレイス、USDC で支払い。ウォレットを生成し、そのボリュームにキーの唯一のコピーが保存されます"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "バックエンド API URL"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "バックエンド API の URL を上書きします(既定は https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "コンテナは初回起動時に自動でセットアップされます。secp256k1 ウォレット(BIP-39)を生成し、ECDSA のチャレンジ・レスポンスで認証して、direct のみのモードで帯域の販売を始めます。すべての状態(ウォレット、セッショントークン、販売者の設定)は <code>proxybase-data</code> ボリュームに保存されます。初回起動時にコンテナのログでウォレットアドレスを確認してください。外部プロキシの再販経路を追加するには <code>--upstream</code> を使います。\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "生成されたウォレットのキーファイルです。このボリュームこそがお金です。サーバー側にコピーはないため、削除すると資金も一緒に失われます。"
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "収益は、市場価格で販売した GB に基づきます。VPS/データセンターの IP は住宅用 IP より収益が少なくなります。マルチ upstream モードでは、自分の帯域と外部プロキシを組み合わせられます。"
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "申請時"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "<code>proxybase-cli seller payout create</code> で収益を確定させると、Tempo Chain 上の USDC(Tempo MPP)として受け取れます。キーを保有している任意の EVM アドレスに支払われ(Tempo は EVM チェーンです)、署名は不要です。USDC を表示するには、ウォレットに Tempo ネットワークを追加してください。それでも表示されないウォレットでは、Tempo の USDC トークンを手動で追加する必要があります。Proxybase が示すコントラクトアドレスでインポートし、残高を信用する前にそのアドレスを確認してください。"
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "クライアントは初回起動時に自分のウォレットを生成します。"
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "紹介した購入者の入金ごとに 15% を、ご自身のプロキシセッション用のクレジットとして"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "購入者の初回入金に +10%"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "帯域です。ProxyBase マーケットプレイスの購入者に SOCKS5 プロキシとして販売されます。"
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "はい。購入者があなたの回線経由でトラフィックを送ります — それがまさに販売されているものです。"
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "あなたのマシンで生成されたウォレットアドレスと、中継したトラフィックの量です。"
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "現実的なリスクで、家庭用回線に直接当てはまります。見知らぬ購入者のプロキシトラフィックがあなたの IP から出ていくため、不正利用の苦情はあなたのもとに届きます。このカタログにはサービスをデータセンターのアドレスに限定する仕組みがなく、住宅用 IP のほうが多く稼ぐため、ここでは誘因が逆方向に働きます。自宅で実行する前に ISP の規約を読んでください。"
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "不明 - プロバイダーはアカウントごとや IP ごとのデバイス数の上限を公表しておらず、カタログにも記載はありません。"
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
