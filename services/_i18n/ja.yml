proxybase.payout.notes:
  text: "収益は Access Token が属する ProxyBase のアカウントに貯まり、申請に応じてダッシュボードから出金されます。ピアクライアントはウォレットを持たず、コンテナは状態を保存しません -- docker.volumes は空です。proxybase-xyz(ProxyBase Markets、同じ組織)と混同しないでください。こちらは実際にローカルのウォレットを生成し、それを重要なボリュームとして宣言しています。"
