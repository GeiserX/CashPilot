  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149 により、2026 年 7 月 6 日に Proof-of-Coverage の報酬は廃止されました。IoT ホットスポットは現在、運んだデータに対してのみ収益を得ており、114,000 台を超えるホットスポットは何も運んでいませんでした。"
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Helium の報酬モデルは投票で何度も変更され、CEO は退任し、HNT は約 96% 下落しました。"
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot は Helium を実行しません。プロバイダー独自のホットスポットのハードウェアを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "4828f2a97494"
helium.rating.pros.0.text:
