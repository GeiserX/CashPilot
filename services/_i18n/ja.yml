  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "マイナーが HeroMiners で使っている公開 Kaspa 支払いアドレスを完全な形で入力してください。<b>kaspa:</b> の接頭辞を含め、ワーカー名は省いてください。\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "HeroMiners に接続した Kaspa マイナーが必要です"
  source: "898e36e7a701"
herominers-kas.disclosure.sells:
  text: "コンピュート"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "いいえ。マイナーはマイニング作業をプールに送信します。"
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
