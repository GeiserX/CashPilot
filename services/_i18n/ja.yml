herominers-kas.rating.cons.0.text:
  text: "プールは 0.9% の手数料を取り、しきい値に達するまで支払いを保留します。"
  source: "7eb2950589fa"
honeygain.description:
  text: "使っていないインターネット帯域を共有して不労所得を得られます。Honeygain は、ウェブインテリジェンス、コンテンツ配信、市場調査のトラフィックをあなたの回線経由で送ります。12M+ のユーザーと 1M を超える支払い実績を持つ、最も定評のある帯域共有プラットフォームの 1 つです。\n"
  source: "b219f969ba34"
honeygain.short_description:
  text: "帯域共有 - 最も定評のあるプラットフォーム"
  source: "c0542c471f29"
honeygain.docker.env.HONEYGAIN_EMAIL.label:
  text: "メールアドレス"
  source: "969ccbd3cf63"
honeygain.docker.env.HONEYGAIN_PASSWORD.label:
  text: "パスワード"
  source: "e7cf3ef4f17c"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.label:
  text: "デバイス名"
  source: "155106be1173"
honeygain.docker.env.HONEYGAIN_EMAIL.description:
  text: "Honeygain アカウントのメールアドレス"
  source: "482869cea18f"
honeygain.docker.env.HONEYGAIN_PASSWORD.description:
  text: "Honeygain アカウントのパスワード"
  source: "f3ba1584b384"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.description:
  text: "Honeygain のダッシュボードに表示される名前"
  source: "a3ba173cae35"
honeygain.earnings.notes:
  text: "所在地によって異なります。米国/EU の IP のほうが多く稼ぎます。1 アカウントあたり最大 10 デバイスです。"
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "申請時"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "最低 $20(20,000 クレジット)です。選択肢は 2 つあります: Tipalti 経由の PayPal(手数料約 15%)、または手数料なしの JumpTask クレジット(JumpTask ウォレットに支払い)。申請には、メールで送られる 6 桁のコードが必要です。初回の PayPal の支払いは、メールで届くリンクから Tipalti に登録するまで \"waiting for details\" のままです。このリンクは一度しか使えないので、一度に最後まで済ませられ、スマートフォンが手元にあるときに開いてください。パスワードを設定すると、Tipalti は SMS で携帯電話番号の確認を求め(コードは数分で期限切れになります)、続いて氏名、住所、国、生年月日、PayPal のアドレスを尋ねます。Tipalti は支払い 1 回につき $2.02 を請求します。1.9-3% の通貨換算手数料を避けるには USD を選んでください。支払いは 2 営業日以内に行われます。残高は、支払いが Tipalti を待っている間でも、申請した時点でアカウントから引かれます。以降の Tipalti へのログインでは毎回新しい SMS コードが送られますが、デバイスを 30 日間記憶するオプションにチェックを入れれば省略できます。2026 年 10 月には、Tipalti はスペインの受取人に税務フォームを求めませんでした。"
  source: "553463d96535"
honeygain.payout.notes:
  text: "残高は Honeygain が保有し、申請時に出金されます。"
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Honeygain アカウントのメールアドレスとパスワードを使用してください(<a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a> と同じです)。"
  source: "fd0be22aeb14"
honeygain.referral.bonus.referrer:
  text: "Honeygain モードで、紹介した友だちそれぞれの収益の最大 25%"
  source: "30385153a66b"
honeygain.referral.bonus.referee:
  text: "このリンクで $3 の登録ボーナス"
  source: "9ee5d2215305"
honeygain.obligations.withdraw-before-24-month-write-off.title:
  text: "Honeygain の残高を出金してください"
  source: "0868662c5a12"
honeygain.obligations.keep-active-6-months.title:
  text: "Honeygain のデバイスで共有を続けるか、支払いを受けてください"
  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "収益は、最低額の $20 に達してから 24 か月間有効です。その後、支払われていない分は Honeygain によって帳消しにされることがあります。"
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
  text: "アプリを 6 か月を超えて使わないと、$20 未満であっても、Honeygain は未払い残高を失効したものとして扱います。"
  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "デバイスで共有を続けるか、支払いを申請してください。JumpTask モードでは残高が変わらないのは正常なので、対象外 を選んでください。"
  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "利用規約では、$20 のしきい値に達してから 24 か月以内に支払われなかった収益を Honeygain が帳消しにでき、6 か月使われなかった収益を失効扱いにできるとされています。"
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "最低額は $20 で、PayPal の支払いは Tipalti 経由となり、支払い 1 回につき $2.02 がかかります。"
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "利用規約では、虚偽の口実で貯めたと Honeygain が判断した収益について、アカウントを停止し、収益を保留または帳消しにできるとされています。"
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "初回の PayPal の支払い前に、Tipalti で SMS による携帯電話番号の確認と、氏名、住所、生年月日の入力が必要です。"
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "利用規約によると、法人顧客がトラフィックを使って公開されているウェブデータを収集しますが、顧客の名前は挙げられておらず、どの顧客があなたの回線を使っているかを知ることはできません。"
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "収益が少ないというレビューに対する Honeygain 自身の返信では、収益はネットワークの需要と所在地によって決まるとされています。レビューでは、最低額の $20 に達するまで非常に長くかかったと報告されています。"
  source: "634fb331e65b"
honeygain.rating.pros.0.text:
  text: "Honeygain は独自の Docker イメージ honeygain/honeygain を公開しています。"
  source: "ea44bd3c855c"
honeygain.rating.pros.1.text:
  text: "利用規約には、リトアニア・ビリニュスで登記された運営者 Honeygain UAB の名前があります。"
  source: "579a169fcf35"
honeygain.rating.pros.2.text:
  text: "Honeygain のプレスページによると、2019 年に設立されました。"
  source: "a3bfbdb33f54"
ionet.description:
  text: "io.net は、AI/ML ワークロード向けの分散型 GPU ネットワークです。個人とデータセンターの遊休 GPU を集約します。意味のある収益を得るには、8GB+ VRAM の NVIDIA GPU が必要です。コンテナベースのデプロイに対応しています。\n"
  source: "5d017f77f0ac"
ionet.short_description:
  text: "AI 向け分散型 GPU ネットワーク - NVIDIA GPU が必要"
  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "8GB+ VRAM の NVIDIA GPU が必要です。RTX 4090 で $500-1000/月とされています(実際にはおそらくもっと少ないです)。"
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "エポックごと"
  source: "75743e03bad2"
ionet.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "供給者への報酬は、有料のジョブとは関係なくトークンの発行から支払われており、GPU の所有者はほとんどの時間アイドル状態だと報告しています。"
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "報酬は IO トークンで、2026 年に支払いモデルがドルに連動する仕組みに変わりました。"
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "2024 年 4 月には、漏洩した認証トークンを使って約 180 万の偽の GPU が参加しようとし、その後 CEO はトークンのローンチ前に退任しました。"
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "CashPilot は io.net を実行しません。プロバイダー独自のワーカーソフトウェアを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "1cac289c99ad"
iproyal.description:
  text: "IPRoyal Pawns では、使っていない帯域を共有して収益を得られます。IPRoyal は定評のあるプロキシプロバイダーで、Pawns はその住宅用帯域の共有部門です。CLI の Docker イメージは、認証情報をコマンドラインフラグで受け取ります。紹介リンクから登録した新しいユーザーは、最初の 3 回の支払いでそれぞれ $1、最大 $3 を受け取ります。各支払いは、所在地によって決まる 1 週間から 3 週間の期間内に行う必要があります。期間は登録時に始まり、支払いのたびに改めて始まります。先に期間が終わると、残りのボーナスは失われます。\n"
  source: "b12878d5917a"
iproyal.short_description:
  text: "帯域共有 - 最初の支払いで最大 $3 のボーナス"
  source: "20091c7b26ed"
