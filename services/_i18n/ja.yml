proxyrack.docker.env.UUID.description:
  text: "デバイスごとに一意の 64 文字の 16 進数 ID です。生成コマンド: cat /dev/urandom | tr -dc 'a-f0-9' | fold -w 64 | head -n 1"
  source: "5de5d7264318"
proxyrack.docker.env.API_KEY.description:
  text: "<a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> にログイン → ダッシュボードのメインページに API Key が表示されます(入力するとデバイスが自動登録されます)。アカウントをお持ちでない場合は、<a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a> から登録してください"
  source: "96df71a6ca26"
proxyrack.docker.env.DEVICE_NAME.description:
  text: "ダッシュボードに表示するデバイスのわかりやすい名前"
  source: "df01af60b81c"
proxyrack.docker.health_signals.0.means:
  text: "ProxyRack のクライアントがこのコピーで動作できないため、収益はありません。よくある原因は ProxyRack の更新サーバーが応答していないことで、クライアントはこのサーバーなしでは起動できません。コピーは 5 分ごとに再試行し、サーバーが応答するとすぐに自動で起動します。修正の必要はありません。"
  source: "0df8b8cfac10"
proxyrack.docker.health_signals.1.means:
  text: "このコピーの起動時に、ProxyRack の更新サーバーに接続できなかったため、ProxyRack のクライアントがダウンロードされませんでした。そのため、コピーは動作していますが収益はありません。CashPilot は再試行のため 6 時間ごとにこのコピーを再起動します。再デプロイすると CashPilot 独自の起動方式になり、クライアントを保持したまま 5 分ごとに自動で再試行します。"
  source: "0a2ee4b478b2"
proxyrack.device_link.steps:
  text: "ProxyRack にサインインし、Devices を開いて Add device を選び、この UUID を貼り付けてください。デバイスがアカウントに追加されるまで、誰の収益にもなりません。API キーを入力した場合はコンテナが自分で登録するので、デバイスが一覧に表示されているか確認してください。"
  source: "54c4041903b5"
proxyrack.earnings.notes:
  text: "住宅用 IP はデータセンターより多く稼ぎます。ダッシュボードが Cloudflare の背後にあるため、自動アクセスが難しくなることがあります。"
  source: "b6e36d751afd"
proxyrack.payment.frequency:
  text: "申請時"
  source: "be820103712e"
proxyrack.cashout.notes:
  text: "ダッシュボードで支払いを申請します。ProxyRack が 72 時間以内に審査し、その後 Tremendous から、PayPal、ギフトカード、銀行送金として交換できる報酬がメールで届きます。暗号資産の選択肢はありません。"
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "残高は ProxyRack が保有し、申請時に出金されます。"
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "<a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a> にログインし、F12 → Network を開いて、任意の API リクエストの <b>Api-Key</b> ヘッダーの値をコピーしてください。アカウントをお持ちでない場合は、<a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a> から登録してください。"
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "Proxyrack は、アカウントごとに 500 デバイスの上限があり、IP ごとの上限はないと文書化しています。データセンターの IP も受け付けられますが、低い料率に再分類されます。"
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "ProxyRack のヘルプセンターによると、デバイスを削除するとそのデバイスの収益がアカウントから差し引かれ、同じデバイスを再び追加した場合にのみ戻ります。"
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack は独自の Docker イメージ proxyrack/pop を公開しており、データセンターの IP も低い料率で受け付けています。"
  source: "278541f81053"
repocket.description:
  text: "Repocket では、使っていないインターネット帯域を共有して不労所得を得られます。住宅用 IP が最も稼ぎ、VPS/データセンターの IP は低い料率で受け付けられます。1 アカウントあたり最大 5 デバイス、同時に 5 セッションまでです。Docker コンテナは、アカウントのメールアドレスと Repocket のダッシュボードの API キー(パスワードではありません)で認証します。\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "帯域共有 - 最大 5 デバイス、API キーで認証"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "メールアドレス"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "API キー(UUIDv4、パスワードではありません)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "Repocket アカウントのメールアドレス"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Repocket の API キーです — <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> にログインし、bandwidth-earnings ページに表示される API キーをコピーしてください(これはアカウントのパスワードではありません)。アカウントをお持ちでない場合は、<a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a> から登録してください"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "住宅用 IP のほうが多く稼ぎます。VPS/データセンターの IP も受け付けられますが、料率は低くなります。"
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4(初回の支払い後は $2)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "申請時"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket は最低額をアカウントごとに設定しています。2026 年 10 月には、初回の支払い前は $4、その後は $2 で、以前うたっていた $20 よりずっと低くなっています。方法: Tremendous(メールアドレス宛て)または Polygon 上の USDT。申請はそれぞれ、メールで届くリンクから 2 時間以内に確認する必要があり、保留中にできる申請は一度に 1 件だけです。2026 年 10 月には、Repocket は Tremendous の申請を \"Please, message support\" として拒否しましたが、Polygon 上の USDT は通りました。"
  source: "4257bc89db22"
repocket.payout.notes:
  text: "残高は Repocket が保有し、申請時に出金されます。"
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Repocket アカウントのメールアドレスとパスワードを使用してください(<a href='https://app.repocket.com' target='_blank'>app.repocket.com</a> と同じです)。アカウントをお持ちでない場合は、<a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a> から登録してください。"
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "紹介された人が $7 稼いだ時点で $2、その後はその人の収益の 5% を生涯にわたって"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "登録時に $2 のウォレットボーナス"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket はアカウントごとに 5 デバイスの上限を文書化していますが、IP ごとのデバイス数の上限は公表していません。レビューサイトで繰り返される「IP ごとに 2 デバイス」という数字にはプロバイダー側の出典がないため、CashPilot はこれを主張しません。"
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Repocket のデバイスで共有を続けるか、残高を出金してください"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "ログイン、支払い、帯域の共有のいずれもないまま 12 か月が経つと、Repocket が未払い残高を没収することがあります。"
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "デバイスで共有を続けるか、サインインするか、出金してください。Repocket の利用をやめる場合は、先に出金してください。"
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Trustpilot の複数のレビューで、支払いが取り消され、残高がゼロにリセットされたと報告されています。あるレビューでは、サポートが帯域収益の異常を理由に挙げたと書かれています。このページは Repocket を 2.7 と評価し、否定的なレビューに返信していないと記載しています。"
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "レビューでは、出金を拒否された、支払いを催促しなければならなかったと報告されています。"
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Repocket の支払いポリシーでは、収益が無効だと疑われる場合はいつでも取り消し、キャンセル、永久没収ができ、休眠アカウントの未払い収益も没収できるとされています。"
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "同じポリシーでは、Repocket が予告なくいつでも支払い方法を追加、削除、変更できるとされています。PayPal は削除されました。"
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "利用規約によると、Repocket はいつでも本人確認またはアカウント確認を求めることができ、支払いを受けられるかどうかはその確認次第です。"
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "利用規約によると、Repocket とそのパートナーがネットワークの容量を使いますが、パートナーが誰で、どう審査されているかは書かれていません。"
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot は Repocket が否定的なレビューに返信していないと記載しており、レビューではメッセージが無視されると書かれています。"
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "現在の利用規約にはシンガポールの Repocket Pte. Ltd. の名前がありますが、以前の規約には会社名がありませんでした。"
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket は独自の Docker イメージ repocket/repocket を公開しており、利用規約ではご自身が所有するコンテナが認められています。"
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "最低額は低く、初回の支払い前は $4、その後は $2 です。"
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io では、分散型の AI ワークロードに GPU を共有して、ギフトカード、ゲーム、現金に交換できる Salad 残高を獲得できます。Windows のみで、ネイティブのデスクトップアプリケーションを使います。専用の GPU(NVIDIA または AMD)が必要です。プラットフォームは、マシンがアイドル状態のときに AI 推論、レンダリング、その他の計算タスクを送ります。比較的使いやすい GPU 共有プラットフォームの 1 つです。\n"
  source: "09335baccea6"
salad.short_description:
  text: "AI 向け GPU 共有 - Windows のみ、ギフトカードまたは現金で支払い"
  source: "4665796e0965"
salad.earnings.notes:
  text: "収益は GPU のモデルと仕事の有無によって決まります。RTX 3060 で ~$1-3/日です。Windows のみです。ネイティブアプリで、Docker には対応していません。ギフトカード、ゲーム、PayPal に交換できます。"
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "申請時"
  source: "be820103712e"
salad.cashout.notes:
  text: "Salad ストアから PayPal またはギフトカードで受け取ります。"
  source: "5128232e4f57"
salad.payout.notes:
  text: "PayPal とギフトカードのみで、暗号資産は一切ありません。ウォレットアドレスが存在しないため、CashPilot が表示できるオンチェーンの残高はありません。"
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "<a href='https://app.salad.io' target='_blank'>app.salad.io</a> にログインし、F12 → Application → Cookies を開いて、<b>auth</b> Cookie の値をコピーしてください。"
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Salad Reward Points を獲得するか、残高を使ってください"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "アカウントが 12 か月続けて Reward Points を獲得しないと、交換されていない残高が失効することがあります。"
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "収益が出るまで Salad アプリを動かすか、Salad Storefront で残高を全額使ってください。一部だけ使っても 12 か月の期間はリセットされません。"
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot は Salad を実行しません。プロバイダー独自のデスクトップアプリを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "2026 年 10 月と 11 月の Trustpilot の複数のレビューで、PayPal への出金がすぐに届いたと報告されており、複数回届いた人もいます。同じ時期に、出金を何度試しても失敗したというレビューも 1 件あります。"
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel は、分散型 VPN のための Cosmos のレイヤー 1 ブロックチェーンです。ノード運営者は柔軟な価格設定(GB ごとまたは時間ごと)で VPN ユーザーに帯域を販売します。Docker でのデプロイについて公式ガイドがあります。長く続いているプロジェクトで、コミュニティも活発です。\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "Cosmos 上の分散型 VPN - ノード運営者が帯域を販売"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "運営者は GB ごとまたは時間ごとに自分で価格を設定します。収益は、あなたの地域での VPN ユーザーの需要によって決まります。"
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "セッションごと"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "支払いは P2P トークンで、帯域の支払いごとに 20% がノードのホストではなくステーカーに渡ります。"
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "トークンは 2021 年に SENT から DVPN へ、2025 年に DVPN から P2P へ名前が変わりました。"
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot は Sentinel を実行しません。プロバイダー独自のノードソフトウェアを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel は、ノードのソースコードを独自のオープンソースライセンスで公開しています。"
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia は、Sia Foundation(スイスの非営利団体)が運営する分散型ストレージのマーケットプレイスで、2015 年から稼働しています。Foundation 公式の hostd ノードを動かして空きディスク容量を貸し出し、ストレージと帯域の契約から Siacoin を獲得します。ノードが収益を得る前に、Siacoin を購入する必要があります。ホストは契約ごとに担保をロックし、ストレージ証明ごとに手数料を支払うためです。担保は契約が完了すると戻りますが、ノードがオフラインになったりデータを失ったりすると焼却されます。そのため、常時稼働のマシンが必要です(Sia によると稼働率 95% 以上)。収益は借り手が実際に保存するデータ量によって決まります。Sia はストレージの価格を 1 TB あたり月 $1 にすることを推奨しているため、小さな VPS よりも、大きな空きディスクを持つマシンに向いています。\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Sia Foundation のストレージノード - 公式 Docker イメージ、Siacoin を獲得"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "ウォレットのシードフレーズ"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "ダッシュボードのパスワード"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "ストレージディレクトリ"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "ホストの Siacoin ウォレットを管理する BIP-39 のシードフレーズです。`docker run --rm ghcr.io/siafoundation/hostd seed` で生成し、バックアップしてください -- 収益にアクセスする唯一の手段です"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "hostd のウェブ UI とローカル API(BasicAuth)のパスワードです。長いパスフレーズなら何でもかまいません"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "借り手のデータを保存する、最も大きいディスク上のホストパス(例: /srv/sia)です。256GB 以上の空きが必要です"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "デプロイ時に、CashPilot はノードを動かすマシン上に新しいウォレットを作成し、そのシードフレーズを一度だけ表示します。必ず書き留めてください。すでにお持ちのウォレットを使う場合は、代わりにそのシードフレーズを貼り付けてください。デプロイ後、担保と手数料のためにノードのウォレットに Siacoin を送り、ダッシュボードでストレージフォルダ(/storage)を追加し、価格を設定して、ホストを告知してください。\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "ウォレットのシードフレーズ(hostd.yml)、ウォレットのデータベース、ホストの設定、契約の状態です。失うと、ノードの識別情報と契約収益の追跡が失われます。その場合、資金を復元する唯一の手段は、書き留めたシードフレーズです。"
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "保存されている借り手のデータです。失うとストレージ証明が失敗し、その契約に対してロックした担保が没収されます。"
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "ホストは自分で価格を設定します。Sia は、保存 1 TB あたり月 $1、ダウンロード 1 TB あたり $5 超を推奨しており、契約の支払いごとに 3.9% が Siafund の保有者に渡ります。収入は、ノードに保存される借り手のデータ量に比例します。データ量はゼロから始まり、稼働時間と価格に応じて増えていきます。担保(Sia はストレージ価格の 2x を推奨)は契約ごとにロックされ、契約が正常に完了すると返却されます。\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "申請時"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "収益は、ホスト自身の Siacoin ウォレット(シードで管理)に貯まります。取引所で SC を換金し、そこから銀行口座やカードに出金してください。プロバイダー側への支払い申請はありません。\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "資金は、ノード内のシードで管理される Sia ウォレットにあります。シードフレーズは、ノードを動かすマシン上の hostd のデータボリュームにのみ存在し、CashPilot が保存することはありません。ウォレットの作成時に書き留めたフレーズが、唯一の復元手段です。\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "ポート 9981(TCP、コンセンサス)と 9984(TCP と UDP、借り手との契約)を転送した、安定した公開アドレスが必要です。Sia ではデータセンター/VPS でのホスティングが一般的です。ノードが契約を受けるには、ウォレットに Siacoin が必要です。"
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "ディスク容量と、それを提供するための帯域です。"
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "いいえ。借り手は暗号化されたファイルの断片をあなたのディスクに保存し、取り出します。他人が任意のトラフィックをあなたの IP 経由で送ることはありません。"
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Sia のウォレットアドレス、ホストの公開鍵、そして借り手が接続できるようにノードが告知する公開 IP:ポートです。"
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "一般的なストレージサーバーと同様に、回線に継続的なアップロード/ダウンロードのトラフィックが発生します。匿名化された第三者のウェブトラフィックがあなたによるものと見なされることはありません。"
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "パーミッションレスです: 登録もアカウントも不要です。オフラインになったりデータを失ったりしてノードがストレージ証明に失敗すると、担保は焼却されます。"
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "収益はご自身のウォレットの Siacoin です。銀行への支払いはないため、ご自身で取引所で売却します。"
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "担保は契約ごとにロックされ、オフラインになったりデータを失ったりしてホストがストレージ証明に失敗すると焼却されます。"
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "ネットワークで提供されているストレージのうち、使われているのは約 30% だけなので、新しいホストは少ない需要を奪い合うことになります。"
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "借り手は暗号化されたファイルの断片を保存し、誰もあなたの IP 経由でトラフィックを送りませんが、借り手が誰で、どう審査されているかについての Sia の説明は見つかりませんでした。"
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd は 2022 年から Sia Foundation によって公開開発されています。"
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd は MIT ライセンスのオープンソースです。"
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Sia Foundation は hostd をコンテナイメージとして公開しています。"
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "パーミッションレスです: 登録もアカウントも不要です。"
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide は、使っていないインターネット帯域を収益化できる帯域共有サービスです。デバイスの追跡には任意のマシン ID を使います。income-generator プロジェクトのコミュニティ製 Docker イメージで利用できます。\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "帯域共有 - マシン ID ベース"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "マシン ID"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "すでに登録済みのデバイスのマシン ID(空欄の場合は自動生成されます)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "得られる情報は限られています。収益は所在地によって決まります。"
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "申請時"
  source: "be820103712e"
spide.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "紹介した人の収益の 10%"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "$5 の登録ボーナス"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "1 つの公開 IP を通るトラフィックは、それを共有するデバイスの間で分けられるため、同じ回線に 2 台目のデバイスを置いても何も増えません。"
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot は Spide を実行しません。プロバイダー独自のアプリを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "NVIDIA GPU 1 枚で Pearl、Zano、Ravencoin をマイニングします。CashPilot は初回起動時に公式の SRBMiner-Multi のリリースをダウンロードし、SHA-256 を確認します。選んだプールが、あなたの公開支払いアドレスに支払います。SRBMiner-Multi はハッシュ時間のうち、Pearl では 2%、他の 2 つでは 0.85% を手数料として使います。電気代が獲得したコインを上回ることがあります。"
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "NVIDIA GPU で Pearl などの GPU コインをマイニング"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "支払いアドレス"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "ワーカー名"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "アルゴリズム"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "プール(host:port)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "プール接続を暗号化(TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "公開 Pearl アドレス(prl1...)です。Zano または Ravencoin の場合は、そのコインのアドレスと、そのコイン用のプールを入力してください。"
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "Pearl は pearlhash、Zano は progpow_zano、Ravencoin は kawpow です。"
  source: "31c8ee0aa660"
srbminer-multi.earnings.notes:
  text: "電気代を引く前の総額の見積もりです。2026-11-25 に hashrate.no は、消費電力約 142 W の RTX 4070 で、Pearl なら 1 日約 $2.45 と見積もっていました。私たちは測定していません。Pearl は新しいコインで、価格と難易度は急速に変わります。採算が取れるか判断するには、GPU の消費電力と電気料金を確認してください。"
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL(HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "プールのしきい値に達したとき"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "残高がしきい値に達すると、プールがあなたのアドレスに支払います。支払いまでは、プールが残高を保有します。"
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64、NVIDIA GPU、NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "このマシンはホスティング回線と報告されています。マイニングを始める前に、プロバイダーの利用規約を確認してください。Hetzner Cloud など、マイニングを禁止しているプロバイダーもあります。利益の見積もりを当てにする前に、実際の電気代を確認してください。"
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "2% のマイナー手数料は pearlhash のものです。progpow_zano と kawpow では、SRBMiner-Multi の取り分は 0.85% です。既定の Pearl プールである HeroMiners は 1% のプール手数料を取ります。支払いは 1 時間ごとに確認され、1 PRL から支払われます。他のプールは独自の料率としきい値を設定しています。"
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "コンピュート"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "いいえ。マイナーは選んだプールに作業を送信します。"
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "支払いアドレス、ワーカー名、IP アドレスがプールに送られます。初回起動時に、マイナーが GitHub からダウンロードされます。"
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "一部のネットワークや DNS リゾルバーは、マイニングプールへの接続をブロックします。"
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "ほとんどのプールは、公開支払いアドレスであなたを識別します。"
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "マイナーはハッシュ時間のうち、Pearl では 2%、Zano と Ravencoin では 0.85% を取ります。"
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "一部のホスティングプロバイダーは、暗号資産のマイニングを禁止しています。"
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "マイナーはクローズドソースのため、開発者以外は誰も、何を実行しているかを監査できません。"
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "GPU の電気代が獲得したコインを上回ることがあり、Pearl の価格は急速に変動します。"
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "マイナーはプールに作業を送るだけで、他人のトラフィックを中継しません。"
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "公開アドレスだけで、アカウントなしで HeroMiners で Pearl をマイニングできます。"
  source: "1844ccbbc00a"
storj.description:
  text: "Storj は、使っていないディスク容量を貸し出して収益を得る分散型のクラウドストレージネットワークです。Docker でストレージノードを動かすと、保存 1 TB あたり月 $1.35、さらにエグレス 1 TB あたり $1 が支払われます(2026 年 9 月 1 日からの料率)。支払いは毎月、米ドル連動のステーブルコインである USDC で、Ethereum メインネット上のご自身が管理するウォレットに行われます。残高が手数料に基づく最低額を超えた場合に支払われます(2026 年 9 月の支払いまでは STORJ トークン)。550GB 以上の空きディスク容量と安定したインターネット接続が必要です。アカウントや登録は不要です -- 2025 年半ばからノードはパーミッションレスです。注意(2026 年 10 月): Storj Labs は、過去の債務を再編するため、2026 年 7 月 26 日に Chapter 11 を申請しました(米国破産裁判所、ウェストバージニア州北部地区、事件番号 5:26-bk-00512)。ネットワークは稼働を続けており、Storj はアクティブなノードへの支払いを続けていますが、申請前のノードの収益は、裁判所が判断を下すまで凍結されています。STORJ トークンは 2021 年の最高値から約 98% 下落しています。Binance は 2026 年 9 月 3 日に上場を廃止し、Coinbase は 2026 年 9 月 28 日に取引を停止しました。新しいノードは最初の 9 か月間、収益の一部が保留され、顧客の需要に応じてしか容量が埋まりません。そのため、今ノードを始めると、長い回収期間を、まだ清算される可能性のある再建中の企業に預けることになります。\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "分散型ストレージノード - 保存 $1.35/TB + エグレス $1/TB"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "ウォレットアドレス"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "メールアドレス"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "外部アドレス"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "割り当て容量"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "識別情報ディレクトリ"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "ストレージディレクトリ"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "USDC の支払いを受け取る Ethereum のウォレットアドレス(例: 0x1234...abcd)です。セルフカストディのウォレット(MetaMask、Ledger など)である必要があります -- 取引所のアドレスは絶対に使わないでください"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "運営者への通知を受け取るメールアドレス"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "ポート付きの DDNS ホスト名(例: mynode.ddns.net:28967)です -- IP をそのまま書くより強くお勧めします。IP だと、ISP が知らないうちに IP を割り当て直した日にノードに到達できなくなります。ポート 28967 を転送する必要があります(TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "割り当てるディスク容量の上限(例: 2TB)です。SSD ではなく、回転ディスク(HDD)を使ってください"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "識別情報ファイルを保存するホストパスです(ca.cert、ca.key、identity.cert、identity.key を含む必要があります)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Storj のデータを保存する、回転ディスク(HDD)上のホストパスです。550GB 以上の空きが必要です"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "初回起動の前に、ストレージノードの設定を初期化してください: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "ノードの識別情報です。その ID はプルーフ・オブ・ワークに結び付いており、再生成には何時間もかかります。また、他の何かのバックアップから作り直すことはできません。失うと、保留中の支払い残高が没収されます。"
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "保存されている顧客データと、ノードの保留額です。失うとノードは失格となり、保留中の残高は没収されます。"
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Storj ネットワークが、告知された ADDRESS でノードに接続し返せないため、サテライトはノードをオフラインとして数えています。新しいデータが届かなくなり、エグレスの収入が止まり、オフラインが続くと停止処分になります。ADDRESS が現在の公開 IP と一致しているか(ISP による割り当て直しでノードに到達できなくならないよう、IP ではなく DDNS ホスト名を使ってください)、そしてポート 28967 の TCP+UDP がこのマシンに転送されているかを確認してください。"
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "2026 年 9 月 1 日から、保存 $1.35/TB + エグレス $1/TB + 監査/修復 $1/TB です。収益は保存データ量とノードの稼働期間に応じて増えます。最初の 9 か月間は、収益の 75%、次に 50%、次に 25% が保留されます。保留額の半分は 16 か月目に戻り、残りはグレースフルイグジット(正常な退出)時に戻ります。ポート 28967 を転送する必要があります。"
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "Ethereum のトランザクション手数料の 4x。それ未満の残高は繰り越されます"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "毎月"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "ウォレットの残高が現在のトランザクション手数料の 4 倍以上になると、毎月 Ethereum メインネット上の USDC で支払われます。それ未満の残高は翌月に繰り越されます。2026 年 9 月の支払いまでは STORJ トークンでした。ダッシュボードはポート 14002 です。"
  source: "6208f04947d2"
storj.payout.notes:
  text: "残高が手数料に基づく最低額を超えると、毎月 Ethereum メインネット上の USDC で、WALLET のアドレスに支払われます。2026 年 9 月の支払いまでは STORJ トークンでした。zkSync Era での支払いは 2026 年 9 月 1 日に終了しました。"
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "ポート 14002 のノードダッシュボードの URL です。localhost ではなくサーバーの LAN IP を使ってください。例: <b>http://192.168.1.10:14002</b>。複数のノードがある場合は、URL をカンマ区切りで並べてください。CashPilot が合計します。"
  source: "e582f1e74baa"
storj.requirements.note:
  text: "同じ /24 サブネット上の Storj ノードはデータの割り当てを共有するため、ノードごとの収益が減ります。"
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "アップロード 5 Mbps"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "ディスク容量と、それを提供するための帯域です。"
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "いいえ。暗号化され、イレイジャーコーディングされた顧客データの断片を保存します。他人が自分のトラフィックをあなたの IP 経由で送ることはありません。"
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "ノードの識別情報、ウォレットアドレス、運営者への通知のためにノードが必要とするメールアドレス、そしてノードがデータを提供するために到達可能でなければならない IP とポートです。"
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "法的責任よりも、主にデータ通信量の上限の問題です。ノードは顧客データを常に送受信するため、回線に継続的な実トラフィックが発生します。ただし、プロキシやリレーと違い、あなたが発信元と見なされる匿名化された第三者のトラフィックではないため、それらのような不正利用の苦情は招きません。"
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "ノード数に制限はありませんが、同じ /24 サブネット上のノードは割り当てを共有するため、1 つの回線に複数置くと、それぞれの収益は少なくなります。"
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk は 2026 年 7 月 27 日、Storj Labs が Chapter 11 による破産保護を申請したと報じました。"
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "申請前のノード運営者への支払いは、破産債権の手続きに組み込まれました。"
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "新しいノードは最初の 9 か月間、収益の 75%、次に 50%、次に 25% が保留されます。半分は 16 か月目に戻り、残りはグレースフルイグジット(正常な退出)時にのみ戻ります。"
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "顧客は暗号化されたファイルの断片を保存し、誰もあなたの IP 経由でトラフィックを送りませんが、顧客が誰で、どう審査されているかについての Storj の説明は見つかりませんでした。"
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "ストレージノードのソフトウェアは AGPL-3.0 のオープンソースです。"
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj は独自の Docker イメージ storjlabs/storagenode を公開しています。"
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "アカウントは不要です。必要なのはウォレットアドレスと、運営者への通知用のメールアドレスだけです。"
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "申請後も、アクティブなノードへの支払いは続きました。"
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR はアカウント不要の Monero マイニングプールです。マイナーは Monero アドレスをユーザー名としてログインし、プールはそのアドレスに支払います。ここでは CashPilot はマイナーを実行しません。SupportXMR があなたのアドレスに対して保有している残高を読み取り、CPU マイナーが稼いだ額を他の収入と並べて表示します。残高は獲得済みですが、まだ受け取っていません。支払いしきい値を超えると、プールが支払います。\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Monero マイニングプール、支払いアドレスで追跡"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR(自動)、申請時は 0.01 XMR"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "残高がしきい値を超えたとき、または申請時"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "残高がしきい値(既定は 0.1 XMR)に達すると、SupportXMR があなたのアドレスに支払います。サイトでは、0.01 XMR から即時の支払いを申請することもでき、手数料は 0.001 XMR です。"
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "残高は獲得済みですが、SupportXMR がこのアドレスに支払うまでは受け取っていません。Monero の残高はプライベートビューキーなしではオンチェーンで読み取れず、CashPilot がそれを求めることはないため、支払いはご自身で確認していただきます。"
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Monero の支払いアドレスです。マイナーが SupportXMR で使っているユーザー名から、<b>.workername</b> や <b>+difficulty</b> の部分を除いたものです。公開情報であり、これで資金を動かすことはできません。"
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "pool.supportxmr.com に接続した Monero マイナー(XMRig)が必要です"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "コンピュート"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "いいえ。マイナーはハッシュをプールに送信するだけで、誰もあなたの回線経由でトラフィックを送りません。"
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Monero アドレス、選んだワーカー名、ハッシュレート、プールから見たマイナーの IP アドレスです。"
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "マイナーはプールへの接続を 1 本開いたままにするだけで、帯域はほとんど使いません。気をつけるべきコストは ISP ではなく電気代です。"
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "アカウントはありません。アドレスが識別情報で、誰でも supportxmr.com でその統計を見られます。"
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "支払いは Monero のみで、プール手数料は 0.6%、自動支払いの既定のしきい値は 0.1 XMR です。"
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot は SupportXMR 用のマイナーを実行しません。ご自身のマイナーをプールに接続し、CashPilot は残高を読み取るだけです。"
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol は、Beacon のネットワークを通じて AI エージェントにライブのウェブへのアクセスを提供します。Teneo Beacon は Teneo 独自のアプリで、Android、iOS、macOS、Windows、Linux に対応し、サーバーや Raspberry Pi 向けのコマンドライン版もあります。同意画面で承諾すると使っていない帯域を共有し、オンラインの間 Teneo Protocol Points と Fragments を獲得します。Fragments は、USDC で賞金が支払われるシーズンごとの抽選(Beacon Drop)の対象になります。Teneo によると、Beacon は以前のブラウザ拡張機能の 2 倍のポイントを獲得します。収益を得られる Beacon は、インターネット回線 1 つにつき 1 台です。同じ回線の他のデバイスは待機状態になります。紹介リンクまたはコード PSA3BHPJ で Expedition Hub に登録し、それから Beacon にサインインしてください。\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "DePIN 帯域アプリ(Beacon) - シーズンごとの USDC 抽選に向けて Fragments を獲得、紹介リンクで +100 Fragments"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Teneo Points と Fragments を獲得します。Fragments はシーズンごとの USDC 抽選の対象になるため、シーズンで支払われるのは決まった料率ではなく賞金です。Teneo によると、Beacon はブラウザ拡張機能の 2 倍のポイントを獲得します。8 時間ごとにブーストを受け取ると、最大 3x の Fragments になります。受け取りの時間枠を逃すと倍率が下がります。"
  source: "7a9714079893"
teneo.payment.frequency:
  text: "シーズンごとの抽選(Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Beacon Drop の賞金は、Expedition Hub で連携したウォレットに USDC で支払われます。Hub には、ウォレットを連携するまでの残り日数が表示されます。期限内にウォレットが連携されなかった賞金は没収されます。"
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "シーズンの賞金が支払われる前に、Expedition Hub でウォレットを連携してください。期限内にウォレットが連携されていない賞金は、Hub によって没収されます。"
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "紹介した友だちそれぞれの Fragments の 8% と、その人が紹介した人の Fragments の 2%。友だちが 7 日以内に登録し、480 Fragments を獲得した場合"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "登録時に +100 Fragments、480 Fragments に達するとさらに +150"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "収益を得られる Beacon は、インターネット回線 1 つにつき 1 台です。データセンターのマシンは、Teneo が有効にしたホスティングプロバイダーでのみ収益を得られ、Fragments は半分で、ポイントや紹介ボーナスはありません。VPN 接続では一切収益を得られません。"
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Beacon の Fragments が USDC になるのはシーズンごとの抽選の賞金としてだけなので、動かしていても決まった額は得られません。"
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo によると、ポイントは $TENEO トークンではなく、譲渡できない報酬トークン $AGENTIC に統合されます。"
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "以前の目標だった 2026 年第 2 四半期が過ぎた後も、2026 年 11 月の時点で、$TENEO のローンチ日、割り当て、受け取り手続きはいずれも確認されていませんでした。"
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot は Teneo を実行しません。プロバイダー独自の Beacon アプリをインストールするため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo は、トラフィックは審査済みの法人顧客からのもので、プライベートアドレスと不正利用されやすいポートはブロックしていると述べていますが、それらの顧客をどう審査しているかは述べていません。"
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network は、定評のある分散型の動画配信および AI コンピュートネットワークです(2018 年から)。ユーザーは Edge Node を動かし、帯域、ストレージ、計算能力を共有します。大手コンテンツ企業と提携しています。TFUEL トークンを獲得します。\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "分散型 CDN + AI コンピュート - TFUEL の報酬、定評のあるプロジェクト"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "デスクトップアプリのみです。収益はリソースと所在地によって決まります。大手と提携しており、すべての取引所に上場しています。"
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "継続的"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot は Theta Edge を実行しません。プロバイダー独自のデスクトップアプリを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "893de938ed14"
titan.description:
  text: "Titan Network は、IP アドレス、ストレージ、帯域を共有して TNT トークンの報酬を得る DePIN プラットフォームです。Windows、Mac、Android で利用できます。ノードは分散型の CDN とストレージ層に貢献します。一般的な収益は、共有するリソースと地理的な所在地に応じて $5-30/月です。\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "IP、ストレージ、帯域を共有する DePIN - $5-30/月"
  source: "799e68401067"
titan.earnings.notes:
  text: "IP、ストレージ、帯域を共有します。収益は提供したリソースと地域によって決まります。割り当てるストレージが多いほど報酬も多くなります。"
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "エポックごと"
  source: "75743e03bad2"
titan.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Titan 自身のヘルプによると、ノードが動いていても収益は保証されません。タスクが割り当てられなければ何も稼がず、報酬は TNT トークンです。"
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot は Titan を実行しません。プロバイダー独自のアプリまたは拡張機能を使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer では、審査済みの企業と帯域を共有して、インターネットトラフィックを収益化できます。家庭用回線に加えて、VPS やデータセンターの IP でもうまく動作する数少ない帯域共有サービスの 1 つです。コマンドライン引数で渡すシンプルなトークン認証を使います。Raspberry Pi などのデバイス向けに ARM アーキテクチャに対応しています。\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "帯域共有 - VPS で動作、トークンで認証"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "トークン"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "デバイス名"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "<a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a> にログインし、F12 → Application → Local Storage → <code>https://app.traffmonetizer.io</code> をクリック → <code>authToken</code> の値をコピーします(約 54 文字で、数字、<code>|</code>、その後に英字と数字が続きます)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "デバイス管理のためにダッシュボードに表示される名前"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "VPS やデータセンターの IP は住宅用 IP より収益が少なくなります。米国/EU の所在地のほうが多く稼ぎます。Docker ネットワークで複数の IP に対応しています。"
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "申請時"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "最低 $10 です。PayPal は提供されなくなりました。まずプロフィールに支払い方法を 1 つ保存してください: Solana または TON 上の USDT(手数料が最も低い)、Arbitrum(手数料が低い)、Tron TRC20(ネットワーク手数料が高い)、または $1,000 からの銀行送金。最初に保存したアドレスはすぐに有効になりますが、後で変更するにはメールでの確認が必要です。初回の出金前に、ダッシュボードがメッセンジャーの連絡先(WhatsApp、Telegram、Skype)を求めることがあります。申請ではドル単位でのみ支払われ、セントは残高に残ります。"
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "プロフィールの支払い設定に保存したチェーン(Solana、TON、Arbitrum、Tron)上の USDT、または銀行送金です。アドレスはコンテナではなく、Traffmonetizer の設定に保存されます。"
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "<a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a> にログインし、F12 → Application → Local Storage → <b>authToken</b> の値です(約 54 文字で、数字、<code>|</code>、その後に英字と数字が続きます)。"
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "紹介した人が申請するすべての支払いの 10%"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Traffmonetizer の利用規約では住宅用 IP が必要とされていますが、実際には VPS のノードも受け付けられています。"
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot の評価は 1.9 です。2023 年から 2026 年 11 月までのレビューで、支払いが何週間も保留される、または完了と表示されても該当するトランザクションがないと報告されています。"
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "同じレビューで、ライブチャットとメールのサポートが、ときには何週間も応答しないと報告されています。"
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "暗号資産か、$1,000 からの銀行送金のみです。PayPal はなくなり、申請ではドル単位でしか支払われません。"
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Traffmonetizer の利用規約では住宅用 IP が必要とされているため、ホスティング回線上のサーバーは規約の対象外です。"
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "2023 年から 2025 年の Trustpilot のレビュー 4 件で、4 台のデバイスで 1 日 1 セント、$10 に達するまで 2 年近くといった、非常に遅い収益が報告されています。"
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "支払いに必要なのは、メールで確認した保存済みの暗号資産アドレスだけです。ダッシュボードがメッセンジャーの連絡先を求めることがあります。"
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer は独自の Docker イメージ traffmonetizer/cli_v2 を公開しています。"
  source: "007cb0d9fa02"
unmineable.description:
  text: "CPU でマイニングし、SHIB、DOGE、XMR など、選んだコインで支払いを受けられます。CashPilot は unMineable の RandomX プールに向けて XMRig を実行し、unMineable は CPU がマイニングした Monero を選んだコインに換えます。残高がそのコインの支払いしきい値に達すると、あなたの公開アドレスに支払われます。CashPilot がデプロイするすべてのワーカーには CashPilot の unMineable 紹介コードが付いており、プラットフォーム手数料が 1% から 0.75% に下がります。電気代が収益を上回ることがあります。"
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "CPU でマイニングし、選んだコインで支払いを受ける"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "支払いコイン"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "支払いアドレス"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "ワーカー名"
