proxybase.description:
  text: "ProxyBase は、使っていないインターネット回線を共有したユーザーに暗号資産で支払う帯域共有プラットフォームです。ピアクライアントは、ダッシュボードの Access Token で認証します。住宅用 IP が最も稼ぎますが、データセンターの IP にも対応しています。公式のマルチアーキテクチャ Docker イメージがあります(amd64/arm64/armv7)。\n"
