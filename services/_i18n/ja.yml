  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "アカウントは不要です。支払い先のウォレットはプロバイダーのセットアップで設定します。"
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "ネットワークは約 10 年間運営されています。"
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Golem のプライバシーポリシーには、運営者としてスイス・ツークの Golem Factory GmbH の名前があります。"
  source: "bae79b651923"
grass.description:
  text: "Grass は、使っていない帯域を AI の学習データ用に売れる分散型ネットワークです。ブラウザ拡張機能とデスクトップアプリとして動作し、ウェブスクレイピングのリクエストをあなたの回線経由で送り、構造化データセットを構築します。8.5M+ のユーザーを抱え、最大級の DePIN 帯域ネットワークの 1 つです。Solana ブロックチェーン上の GRASS トークンを獲得します。\n"
  source: "046951d812f9"
grass.short_description:
  text: "AI データ向けの DePIN 帯域共有 - GRASS トークンを獲得"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "アクセストークン"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "<a href=\"https://app.grass.io\">app.grass.io</a> にログインし、F12 → Application → Local Storage → <code>https://app.grass.io</code> をクリック → <code>token</code> の値をコピーします"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "エアドロップで GRASS トークンに換えられる Grass Points を獲得します。実際の USD 価値はトークン価格によって決まります。ブラウザ拡張機能またはデスクトップアプリが必要です。"
  source: "da61137319f8"
grass.payment.frequency:
  text: "エポックごとのエアドロップ"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "報酬は定期的な配布として届き、Grass のダッシュボードで受け取ります。Stage 2 の配布(2024 年 10 月から 2026 年 6 月までの活動分)は USDC で支払われます。app.grass.io/dashboard で 2027 年 1 月 22 日までに受け取ってください。すべての割り当てが先に受け取られた場合は、それより早く締め切られます。受け取られなかった報酬は Grass のものになります。"
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "ポイントが貯まります。GRASS は定期的なエアドロップの際に Grass のダッシュボードから受け取ります。"
  source: "14879f750890"
grass.collector.credential_hint:
  text: "<a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a> にログインし、F12 → Application → Local Storage を開いて、<b>accessToken</b> の値をコピーしてください。"
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "直接紹介した人の稼働ポイントの 20%、2 段目は 10%、3 段目は 5%"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Grass の Stage 2 の USDC を受け取ってください"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "2027 年 1 月 22 日までに受け取られなかった Stage 2 の割り当てはすべて Grass のものになります。すべての割り当てが受け取られると、期間はそれより早く終わることがあります。"
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Stage 2 で使ったアカウントで app.grass.io にサインインし、Grass Wallet を有効にして、Allocation タブを開いて確定します。受け取りは app.grass.io でのみ行ってください。Stage 2 のポイントがない場合は、対象外 を選んでください。"
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "報酬はエアドロップのシーズンでしか届きません。長期のノード運営者は、シーズン 2 の見込み額を 1 桁から 2 桁前半のドルと報告しています。"
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "2027 年 1 月 22 日までに受け取らなかったシーズン 2 の報酬は永久に失われます。"
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "最初のエアドロップは、200 万人を超えるユーザーに分散されたことでポイントあたりの報酬が少なく、反発を招きました。"
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot は Grass を実行しません。プロバイダー独自のアプリまたは拡張機能を使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "最初のエアドロップでは、受け取りを行ったアドレスが 150 万近くに達しました。"
  source: "a4c55e10affa"
helium.description:
  text: "Helium は定評のある分散型ワイヤレスネットワークです。当初は LoRaWAN ホットスポットでしたが、現在は 5G にも広がっています。専用のハードウェア($500+)が必要です。HNT/MOBILE トークンを獲得します。ROI は大きく下がっており、一般的には $4-8/月です。\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "分散型ワイヤレスネットワーク - ハードウェアが必要、HNT トークン"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "$500+ のハードウェアの購入が必要です。ROI は大きく下がっています。新しい運営者には承認手続きがあります。"
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "エポックごと"
  source: "75743e03bad2"
helium.payout.notes:
