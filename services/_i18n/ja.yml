  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "利用規約では、不正、操作、禁止行為と結び付けた収益について、PacketStream が保留、取り消し、無効化できるとされています。"
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
  text: "利用規約によると、プロキシの顧客と PacketStream 自身があなたの回線経由でトラフィックを送ります。一般の購入者の審査については何も書かれていません。"
  source: "fd4707690d2b"
packetstream.rating.cons.4.text:
