  source: "0bfd3d74c093"
herominers-kas.description:
  text: "公開支払いアドレスに対して HeroMiners が保有している未払いの Kaspa 残高を追跡します。ご自身の Kaspa マイナーを動かし、このプールに接続してください。CashPilot はプールの残高を読み取り、残高が減ったときに支払いの確認をお願いします。\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
  text: "Kaspa マイニングプール、支払いアドレスで追跡"
  source: "92c5784dcf30"
herominers-kas.payment.minimum_payout:
