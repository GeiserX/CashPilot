  text: "RandomX モード"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "unMineable が支払うコインのティッカー(SHIB、DOGE、XMR など)"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "そのコインの公開アドレスです。メモやタグが必要なコインには対応していません。"
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "電気代を引く前の総額の見積もりで、unMineable の換算レートで選んだコインで支払われます。2026-11-25 時点で、RandomX の 1 kH/s は月約 $1 相当でした。デスクトップ CPU でスレッドの半分を使うと、消費電力が 30 から 50 W 増えることがあります。採算が取れるか判断するには、実際の使用量と電気料金を確認してください。"
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "unMineable がコインごとに設定(2026-11-26 時点で 0.03 XMR)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "コインの支払いしきい値に達したとき"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "残高がそのコインの支払いしきい値に達すると、unMineable があなたのアドレスに支払います。しきい値はコインとネットワークによって異なります。CashPilot は、unMineable があなたのアドレスについて報告するしきい値を読み取ります。"
  source: "119caa81a181"
unmineable.payout.notes:
  text: "残高は獲得済みですが、unMineable がこのアドレスに支払うまでは受け取っていません。チェーンは選んだコインによって決まります。"
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "マイナーをデプロイしたときと同じ支払いアドレスとコインのティッカーです(例: <b>XMR</b>)。アドレスだけを入力し、コイン、ワーカー名、紹介コードは含めないでください。公開情報であり、これで資金を動かすことはできません。"
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "紹介したマイナーそれぞれのマイニング報酬の 0.25%"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "プラットフォーム手数料が 1% から 0.75% に下がります"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "このマシンはホスティング回線と報告されています。マイニングを始める前に、プロバイダーの利用規約を確認してください。Hetzner Cloud など、マイニングを禁止しているプロバイダーもあります。利益の見積もりを当てにする前に、実際の電気代を確認してください。"
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable は 1% のプラットフォーム手数料を取ります。CashPilot はすべてのワーカー名の後ろに紹介コード(#awk6-j1z0)を付けるため、手数料は 0.75% に下がります。その後、unMineable はあなたのマイニング報酬の 0.25% を CashPilot のメンテナーに支払い、あなたは 99.25% を受け取ります。コインごとに支払いしきい値があり、たとえば 0.03 XMR です。"
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "コンピュート"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "いいえ。マイナーは unMineable のプールに作業を送信します。"
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "支払いアドレス、コイン、ワーカー名、ハッシュレート、IP アドレスが unMineable に送られます。"
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "一部のネットワークや DNS リゾルバーは、マイニングプールへの接続をブロックします。"
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "アカウントは不要です。アドレスとコインが識別情報で、誰でも unmineable.com でその統計を見られます。"
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "紹介コードを使っても unMineable は 0.75% のプラットフォーム手数料を取り、各コインのしきい値からしか支払いません。"
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "一部のホスティングプロバイダーは、暗号資産のマイニングを禁止しています。"
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "増えた電気代が、獲得したコインを上回ることがあります。"
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "残高を含むアドレスの統計は、アドレスを知っている人なら誰でも見られます。"
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "マイナーはハッシュをプールに送るだけで、他人のトラフィックを中継しません。"
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "アカウントを作らずに、選んだコインの公開アドレス宛てにマイニングできます。"
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock は、インターネット回線を共有して暗号資産を獲得できる DePIN(Decentralized Physical Infrastructure Network)プラットフォームです。より広い Web3 エコシステムの一部です。コミュニティ製の Docker イメージはありますが、公式のイメージはありません。主なインターフェースはブラウザ拡張機能です。\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "DePIN インターネット共有 - 暗号資産で支払い、主にブラウザ拡張機能"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "収益は暗号資産/トークンベースです。公式の Docker イメージはありません — 主なクライアントはブラウザ拡張機能です。"
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "申請時"
  source: "be820103712e"
uprock.cashout.notes:
  text: "UPT トークンを、2 要素認証をオンにしたうえで、250 UPT から Solana ウォレットに出金します。出金手数料がかかります。"
  source: "9a70ab978908"
uprock.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "UpRock のヘルプセンターによると、出金は Solana ウォレットへの UPT トークンで、最低額は 250 UPT です。"
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "報酬は UPT トークンで、レビューや第三者によるレビュー記事では、その価値は非常に低いとされています。"
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot は UpRock を実行しません。プロバイダー独自のアプリまたは拡張機能を使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork は、分散型の VPN および帯域共有ネットワークです。コミュニティプロバイダーとして帯域を提供して収益を得ます。プロバイダーのバイナリは、アカウントのメールアドレスとパスワードで自分自身を認証し(auth-provide サブコマンド)、得られたセッション JWT をデータボリュームに保存します。BringYour, Inc. による公式の Docker イメージです。\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "分散型 VPN/帯域 - メールアドレス+パスワードで認証、JWT セッションをボリュームに保存"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "メールアドレス"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "パスワード"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "URnetwork アカウントのメールアドレス(<a href=\"https://ur.io\" target=\"_blank\">ur.io</a> で使うログイン)です。Google/Apple のサインインで作成したアカウントは、先にパスワードを設定する必要があります。アカウントをお持ちでない場合は、<a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a> から登録してください"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "URnetwork アカウントのパスワード(スペースなし)です。プロバイダーの auth-provide ログインで使われ、その後セッションはデータボリュームに保存されます。"
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "VPS でも住宅用回線でも動作します。2026-10-06 からは、週ごとのエポックごとに SN25α(Bittensor サブネット 25)で支払われます。複数 IP の構成向けにプロキシモードに対応しています。"
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "エポックごと"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "ur.io/app/account/earnings で Bittensor のコールドキーを設定し(Talisman、TAO.com、または WalletConnect のウォレットで署名)、確定したエポックごとに受け取ります。受け取りには、EVM のガスキーから TAO でガス代を支払います。受け取られなかったエポックは失効します。また、以前の USDC の支払いは、30 日以内にウォレットが連携されなかった場合に取り消されました。"
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "友だち 1 人につき 1 日 3 GiB の無料 UR データ、最大 20 人まで(お金ではなくデータ)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "参加から 90 日以内に、2 日間アプリで 10 MiB 以上使うと、1 日 3 GiB の無料 UR データ。そうでない場合、紹介は終了します"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "受け取られなかったエポックは失効し、以前の USDC の支払いは、30 日以内にウォレットが連携されなかったネットワークについて取り消されました。"
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "2026 年 10 月から、報酬は Bittensor サブネットのトークンである SN25α で支払われ、受け取りのたびに TAO でガス代がかかります。"
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork の旧名は BringYour で、アーカイブされたホワイトペーパーには旧名が記載されています。"
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork は、プロバイダークライアントのソースコードを公開しています。"
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork は独自の Docker イメージ bringyour/community-provider を公開しており、VPS でも住宅用回線でも動作します。"
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "受け取りに必要なのは、ご自身が管理する Bittensor ウォレットだけです。"
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai は、NVIDIA GPU を AI/ML の研究者や開発者に貸し出す GPU クラウドのマーケットプレイスです。Docker ネイティブのプラットフォームで、時間単価は自分で設定します。RTX 3090 は貸し出されたとき、通常 $0.20-0.40/時間を稼ぎます。最新ドライバーを入れた NVIDIA GPU と、安定したインターネット接続が必要です。収益は GPU のモデル、価格戦略、市場の需要に大きく左右されます。\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "GPU マーケットプレイス - 価格は自分で設定、RTX 3090 ~$0.20-0.40/時間"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "API キー"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "ダッシュボードで取得する Vast.ai のホスト API キー"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "貸し出されたとき、RTX 3090 は ~$0.20-0.40/時間、RTX 4090 は ~$0.40-0.80/時間です。稼働率は変動します。NVIDIA GPU、Linux ホスト、Docker、nvidia-container-toolkit が必要です。価格は自分で設定します。"
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "毎週(金曜日)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "収益は Vast.ai の残高に貯まります。Wise、PayPal、Stripe で出金します。"
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "紹介した借り手の支出の 3% を、そのアカウントが続く限り紹介クレジットとして受け取れます。専用の紹介アカウントから最大 75% を出金できます"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "ホストが稼ぐのは貸し出されている間だけで、一般向け GPU についての Vast 自身の数値は、レンタルの種類と信頼性スコアによって変わります。"
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot は Vast.ai を実行しません。ご自身の GPU マシンに Vast のホストソフトウェアをインストールするため、CashPilot がデプロイや更新を代わりに行うことはできません。Vast のホスティングは、Linux ホスト上の Docker を基盤にしています。"
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Vast によると、ホストが設定した料率がそのまま受け取る料率で、手数料は差し引かれません。"
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "支払いは Wise、PayPal、Stripe で最低 $20 から、毎週請求されます。それ未満の残高は翌週に繰り越されます。"
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter は、Windows、Mac、Linux、Android で利用できる帯域共有プラットフォームです。共有した帯域に対して最大 $1/GB を支払うとしており、最低支払額は $20 です。従来の帯域共有アプリと同様に、正当なトラフィックを家庭用回線経由で送ります。\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "帯域共有 - 最大 $1/GB とうたう、最低支払額 $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "最大 $1/GB とうたっていますが、実際の収益はそれより少ないです。最低支払額は $20 です。収益は所在地と需要によって大きく変わります。"
  source: "2be529de3995"
wipter.payment.frequency:
  text: "申請時"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter にはウェブのダッシュボードがありません。Wipter のデスクトップアプリまたはスマートフォンアプリを開いてサインインし、残高が $20 に達したらそこで支払いを申請してください。Wipter は BNB Smart Chain(BEP20)上の USDT でのみ、アプリの Payments セクションで設定したウォレットに支払います。PayPal の選択肢はありません。"
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "紹介した人が最低支払額に達した後、その人のトラフィック収益の 10%。紹介できる友だちの人数に制限はありません"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "$5 の登録ボーナス"
  source: "ed267fc12fb2"
