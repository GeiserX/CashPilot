proxybase.cashout.notes:
  text: "サイトには最低 $0.20 と書かれており、2026 年 10 月には $1 未満の申請も通りました。申請では常に残高の全額が、Polygon 上の USDC、POL、または Litecoin として、入力したアドレスに出金されます。ネットワーク手数料は ProxyBase が負担します。"
