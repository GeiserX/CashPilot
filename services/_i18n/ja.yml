  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "2025 年と 2026 年の Trustpilot のレビューでは、支払いが遅れる、またはまったく届かないと報告されており、長年のユーザーの 1 人は支払いが遅くなり、やがて止まったと述べています。一方、2026 年に支払いを受けたという報告もあります。"
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
