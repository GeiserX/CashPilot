iproyal.docker.health_signals.0.means:
  text: "IPRoyal Pawns がこのアカウントを無効にしました。"
  source: "a3a68b67f1aa"
iproyal.docker.health_signals.1.means:
  text: "Pawns はこの IP アドレスで稼働中の別のデバイスを検出しており、IP ごとに 1 台にしか支払いません。そのため、このコピーは動作していますが、何も共有せず、何も稼いでいません。この IP にある他の Pawns アプリ(別のマシン、PC、スマートフォン上のもの)を停止してください。見当たらない場合は、Pawns が古いデバイスを外すのを待つか、Pawns のサポートに解除を依頼してください。"
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "収益は所在地と帯域の使用量によって決まります。米国/EU の住宅用 IP のほうが多く稼ぎます。"
  source: "424261bf08d4"
iproyal.payment.frequency:
  text: "申請時"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "最低 $5 です。まず国を選んでください。利用できる方法は国によって異なります。スペインからの場合(2026 年 10 月): PayPal は 4%(最低手数料 $0.25)で、Tremendous 経由で支払われ、氏名と PayPal のアドレスを入力するリンクがメールで届きます。USDT(BEP20、ERC20、TRC20)または USDC(BEP20、ERC20)はネットワーク手数料 $1、Bitcoin は最低手数料 $2、ギフトカードは手数料なしです。初回の支払いには、電話番号の SMS による一度限りの確認が必要です。Withdraw を押すと確認が始まり、番号は国番号付きで入力します。以降の支払いでは毎回、アカウントのメールアドレスに送られるコードを求められ、送金前に最大 72 時間の審査があります。"
  source: "0430fae34eb5"
iproyal.payout.notes:
  text: "残高は IPRoyal Pawns が保有し、申請時に出金されます。"
  source: "e11da90d5216"
iproyal.collector.credential_hint:
  text: "IPRoyal Pawns アカウントのメールアドレスとパスワードを使用してください(<a href='https://pawns.app' target='_blank'>pawns.app</a> と同じです)。"
  source: "b9dcb3a01d17"
iproyal.referral.bonus.referrer:
  text: "紹介した人の最初の 3 回の支払いでそれぞれ $1、最大 $3。各支払いがそれぞれの 1-3 週間の期間内に行われた場合"
  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "最初の 3 回の支払いでそれぞれ $1、最大 $3。1-3 週間の期間を逃すと残りは失効します"
  source: "619d5960686c"
iproyal.rating.cons.0.text:
  text: "利用規約によると、出金条件の悪用や複数アカウントがあった場合、アカウントは予告なくブロックされることがあり、その場合は収益が支払われないことがあります。"
  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "利用規約によると、Pawns はトラフィック共有にサーバー、VPN、プロキシサービスを一切認めておらず、IP ごとに 1 デバイスまでです。"
  source: "449c1cdf793f"
iproyal.rating.cons.2.text:
  text: "PayPal は Tremendous 経由で 4%(最低 $0.25)かかり、すべての支払いに最大 72 時間の審査があります。"
  source: "56449f2db6ce"
iproyal.rating.cons.3.text:
  text: "初回の支払いには電話番号の SMS による確認が、すべての支払いにはメールで送られるコードが必要です。"
  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "プライバシーポリシーには運営者として Pawns.App Ltd(イングランドおよびウェールズの会社番号 16043795)の名前があり、Companies House によると 2024 年 10 月 28 日に設立されたばかりで、設立から 3 年未満です。"
  source: "a7fcb7aea980"
iproyal.rating.cons.5.text:
  text: "利用規約によると、Pawns とその法人顧客はあなたのデバイス経由でトラフィックを送り、どの顧客が使っているかをあなたが特定することはできません。"
  source: "ca979ac10720"
iproyal.rating.pros.0.text:
  text: "最低額は $5 で、ギフトカードは手数料なしです。"
  source: "0fa4f89bbd63"
