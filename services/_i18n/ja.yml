packetstream.payment.frequency:
  text: "申請時"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "PayPal のみで、最低 $5、確定前に 3% の手数料が表示されます。初回の出金で PayPal のメールアドレスが保存され、後で変更するにはメールでの確認と 7 日間の待機が必要なので、確定前にアドレスを確認してください。申請は審査を経て 7 日以内に送金されます。待機中の申請は取り消せますが、新しい申請はその申請の支払いが終わってからでないと出せません。"
