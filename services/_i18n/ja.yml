  source: "bde1b5ad5a6a"
packetstream.rating.pros.2.text:
  text: "利用規約には本人確認の記載がなく、支払いに必要なのは PayPal のアドレスです。"
  source: "a05886b55edc"
packetstream.rating.pros.3.text:
  text: "利用規約には、カリフォルニア州法に基づく PacketStream Inc. の名前があります。"
  source: "7966bde559dd"
packetstream.rating.pros.4.text:
