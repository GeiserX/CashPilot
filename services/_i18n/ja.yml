mysterium.description:
  text: "MystNodes(Mysterium Network)は、ブロックチェーン技術で構築された分散型の VPN およびプロキシネットワークです。ユーザーに VPN、プロキシ、データスクレイピングのサービスを提供するノードを動かして、MYST トークンを獲得します。NET_ADMIN、SETUID、SETGID のケーパビリティと TUN デバイスが必要で、TUN デバイスは、フェンスで囲まれた収益アプリ用ブリッジ上の、ノード自身のネットワーク名前空間の中で使われます。ノード管理用のウェブ UI が組み込まれています。家庭用回線でも VPS でも動作しますが、紹介ボーナスは住宅用 IP のノードにのみ支払われます。\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "分散型 VPN ノード - ブロックチェーンベース、VPS で動作"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "WebUI アドレス"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "UDP ポート範囲"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "ノードの WebUI(ポート 4449)を公開するホストアドレスです。127.0.0.1 にすると、このマシン内だけになります。リバースプロキシ経由でアクセスするには、プロキシが接続するアドレスを、スペースなしのカンマ区切りで追加します: 127.0.0.1,172.18.0.1。"
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "ノードが VPN セッションに使う UDP ポートで、start:end の形式です。ルーターでもまったく同じ範囲を転送してください。1 セッションで約 2 ポートを使うので、既定の 30 ポートで同時に約 15 セッションを扱えます。これは家庭のノードに来るセッション数より多い数です。範囲を広げても何も解決せず、コストが増えるだけです。公開するポートが増えるほどノードの起動と削除が遅くなり(300 ポートでは起動に約 12 秒)、CashPilot が受け付けるのは最大 300 ポートです。さらに Docker 既定のユーザーランドプロキシでは、1 ポートごとに約 2.5 MB のメモリを使います。セッションがすべて失敗するのはルーターの問題で、ポート不足ではありません。Mysterium ガイドの \"Routers that rewrite UDP source ports\" を参照してください。32768 未満にしてください。ポート 32768-60999 は Linux のエフェメラル範囲で、ホスト上のどのプログラムも一時的にポートを使うことがあり、1 つでも使われているとノードの起動が失敗します。すでに範囲が設定されているノードは、その範囲を維持します。"
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "ノードの識別情報のキーストアです。削除するとまったく新しい識別情報が作られ、ノードは評判と、古い識別情報に対して保留中の収益をすべて失います。"
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "ノードがコンテナ内で sudo を実行できないため、VPN インターフェースやファイアウォールを設定できず、すべてのセッションがセットアップで失敗しています。オンラインに見えても何も稼いでいません。コンテナが SETUID と SETGID のケーパビリティなしで作成されています。CashPilot とこのノードを動かしているワーカーを更新し、ダッシュボードから Mysterium を再デプロイしてください。ノードの識別情報はデータボリュームにあり、保持されます。"
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "過去 6 時間、このノードに直接到達した VPN セッションはありません。すべてホールパンチングに切り替わっており、多くの購入者はこの方法では接続できないため、ノードの収益が減っています。ノードの UDP ポートがインターネットから到達できません。ルーターで、UDP ポート範囲 ${UDP_PORTS}(start:end、両側で同じ範囲)を ${HOST_ADDRESS} に転送してください。セッションが直接接続すると、この表示は自動的に消えます。"
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Mysterium のモニタリングが ${WORKER_NAME} 上のノードを失敗と判定しているため、ノード自身のチェックではすべてのポートに到達できると出ていても、多くの購入者が選ぶノード一覧から外されています。まず、ノードに /dev/net/tun と SETUID/SETGID があることを確認してください。これらがないと同じように失敗します: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 これらが揃っている場合、よくある原因は、${WORKER_NAME} の前にあるルーターが、外部からのパケットがそのポートに届いた後、ノードの応答の UDP 送信元ポートを書き換えることです。ガイドのテストを参照してください: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "${WORKER_NAME} 上のノードの直近 5 回の VPN セッションは、いずれもデータを送らないまま約 1 分で終了しました。そのため、オンラインに見えても何も稼いでいません。考えられる原因は ${WORKER_NAME} の前にあるルーターです。外部からのパケットがあるポートに届くと、ルーターはそのポートからのノードの以降の応答の送信元ポートを書き換えます。どのセッションもそうしたパケット(ノード自身のポートチェック)から始まるため、購入者はノードの応答を破棄してしまいます。ポート範囲を広げても効果はありません。ガイドのテストと対処法を参照してください: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports セッションがデータを運ぶと、この表示は消えます。"
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "収益は MYST トークンです。住宅用 IP のほうがかなり多く稼ぎます。管理用のノード WebUI はポート 4449 で、既定では動作しているマシン内(127.0.0.1)にのみ公開されます。別のマシンからは、先に SSH トンネルを開いてください(ssh -L 14449:127.0.0.1:4449 の後にノードのマシンのアドレスを付けて実行し、ブラウザで http://127.0.0.1:14449 を開きます。ローカルポートを 14449 にすると、自分のマシン上のノードと競合しません)。または UI_ADDRESS にアドレスを追加してください(Mysterium ガイドの WebUI address を参照)。VPS も利用できます。UDP 23000-23029(UDP_PORTS の既定値)のポート転送を強くお勧めします -- これがないとノードは Strict NAT の状態になり、多くの VPN セッションが失敗して、収入が大きく減ります。重要: 初回起動後、ノードの WebUI または CLI で、mystnodes.com アカウントと一致する受取人(精算)ウォレットを設定してください -- これにより、オンチェーンの収益がクラウドのダッシュボードと結び付きます。"
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "ノードが未精算の 5 MYST を保有するたびに、オンチェーンで自動精算"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "押すボタンはありません。各ノードは未精算の 5 MYST を保有すると、Polygon 上で自動的に精算します。約 21% は手数料(Hermes の手数料 20% と少額のトランザクション手数料)に消えるため、精算 1 回あたり受取人ウォレットに届くのは約 3.9 MYST です。各ノードの TequilAPI では、精算の一覧を /transactor/settle/history で確認できます。MystNodes の \"total earnings\" の数値は過去 30 日間だけを対象としたもので、残高でも累計でもありません。MystNodes の報酬プログラムによるボーナス MYST は自動では精算されません。MystNodes のヘルプセンターによると、配布から 30 日以内に Rewards ページで受け取る必要があります。"
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "受取人ウォレットはデプロイの後に、TequilAPI またはノードの WebUI で設定します -- 環境変数ではないため、コンテナの仕様からは読み取れません。"
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "MystNodes アカウントのメールアドレスとパスワードを使用してください(<a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a> と同じです)。"
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "ノードが 5 MYST を稼いだ友だち 1 人につき 5 MYST(住宅用 IP のみ)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "あなたのノードが最初の 5 MYST を稼いだ時点で 5 MYST(住宅用 IP、mystnodes.com でノードを登録済み)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "先月の MystNodes 報酬を受け取ってください"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "毎月の配布から 30 日以内に受け取られなかった報酬は没収され、翌月のプールに戻されます。"
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Rewards ページを開き、ポイントを MYST に交換してください。"
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "帯域です。あなたの回線は Mysterium ネットワークの出口ノードとして使われ、このネットワークは VPN、プロキシ、そしてデータスクレイピングのサービスを販売しています。住宅用 IP から出ていくスクレイピングのトラフィックは最も苦情を招きやすい用途で、ノードがこの 3 つのどれを運ぶかは選べません。"
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "はい。見知らぬ人があなたの IP アドレス経由でトラフィックを送ります — それが商品そのものです。"
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "ノードの識別情報(ブロックチェーンアドレス)、あなたの IP、おおよその所在地(国/都市/ISP)です。購入者がノードを選べるよう、ノードがネットワークに公開します。"
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "現実的なリスクで、理解しておく価値があります。他人のトラフィックがあなたによるものとしてあなたの回線から出ていくため、その人たちの行為はすべてあなたの回線から発信されたように見えます。一般向け ISP の契約の多くはこれを禁止しています。実行する前に、ご自身の契約を確認してください。"
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "アカウントごと、IP ごとのデバイス数に制限はありません。"
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "毎回の精算の約 21% が手数料(Hermes の手数料 20% とトランザクション手数料)に消え、収益は MYST トークンで支払われます。"
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "あなたのノードは Mysterium の VPN、プロキシ、データスクレイピングの顧客の出口になり、そのうちどれを運ぶかは選べません。"
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "ノードソフトウェアは GPL-3.0 のオープンソースです。"
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium は独自の Docker イメージ mysteriumnetwork/myst を公開しています。"
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "精算はご自身が所有するウォレットに行われ、電話番号や身分証は不要です。"
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "ノードのプロジェクトは 2017 年から運営されています。"
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Mysterium のサイトによると、ネットワークはスイス・ツークの Blockdev AG が開発しています。"
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay は、ブラウザ拡張機能で帯域を共有したユーザーに報酬を与える DePIN ネットワークです。プラットフォームは Cloudflare の保護の背後にあり、自動アクセスが難しくなることがあります。ユーザーは拡張機能を有効にしておくことで Nodepay Points を獲得します。このネットワークは AI の学習データのインフラを提供することに注力しています。\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "AI 向け DePIN 帯域共有 - ブラウザ拡張機能"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Nodepay Points を獲得します。Nodepay の資格審査に通ったユーザーのポイントは NC トークンに換算されます。Cloudflare の保護により自動収集がブロックされることがあります。ブラウザ拡張機能が必要です。"
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "NC トークンのエアドロップ(時期は未確認)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "ポイント制です。Nodepay の資格審査に通ったユーザーのポイントは、2025 年 1 月にローンチされた NC トークンに換算されます。"
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "最初のシーズンの審査で、Nodepay はボットと判断した 300,000 を超えるアカウントを削除し、170 億ポイントを無効にしました。"
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "報酬は NC トークンに換算されるポイントなので、その価値はトークン次第です。"
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot は Nodepay を実行しません。プロバイダー独自のブラウザ拡張機能を使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes は、Base L2 上の DeFi プロジェクト Noderr Protocol の無料の入門ティアです。マイクロノードは、使っていない Android スマートフォン、Windows PC、Mac、または Chromium ブラウザ上で動く小さなエージェントです。Android ではスマートフォンのモバイル回線を共有します。Noderr の他のトラフィックがスマートフォンの通信事業者の IP から出ていくため、モバイルデータ付きの SIM が必要です。PC やブラウザでは、余っている計算資源でプロトコルの自動化タスクを実行します。報酬は、オンチェーンの稼働時間と信頼性のスコアに応じて NODR で支払われる設計ですが、ネットワークはベータ期間中 Base Sepolia テストネット上にあります。ノードの報酬には資金が用意されておらず、まだ何も支払われていません。\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "無料のマイクロノード(Android の回線共有、Windows、Mac、ブラウザ) - テストネット、報酬の資金はこれまで未用意"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "テストネットのベータです: ノードの報酬には資金が用意されておらず、まだ何も支払われていません。サイトに書かれた 5-10% APY は設計上の目標です。ネットワークが Base Sepolia を離れたら、改めて確認してください。"
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "申請時"
  source: "be820103712e"
noderr.cashout.notes:
  text: "報酬はノード自身のウォレットに貯まり、アプリまたは dApp から受け取ります。ベータ期間中は、市場価値のない Base Sepolia テストネットのトークンです。"
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "アプリは初回起動時にノードのウォレットを作成し、そこに譲渡できない(soulbound)無料の Utility NFT をミントします。アプリからウォレットをバックアップしてください。デバイスを失うと、ノードの識別情報も失われます。ベータ期間中、報酬は Base Sepolia(テストネット)上にあります。"
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android にはモバイルデータ付きの SIM が必要です。デスクトップとブラウザのクライアントについては、IP の要件は公開されていません。"
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "デバイスによって異なります。Android スマートフォンはモバイル回線を販売します: Noderr の他のトラフィックがスマートフォンの通信事業者の IP アドレスから出ていき、データプランの容量を消費します。Windows PC、Mac、ブラウザは、プロバイダーがソーシャルメディアやコンテンツの自動化タスクと呼ぶものに、余っている計算資源を販売します。"
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "はい。Android では、Noderr の他のトラフィックがスマートフォンのモバイル IP アドレスから出ていきます。アプリは開始前に記録される同意を求め、同じ画面から共有を止められます。Windows、Mac、ブラウザのクライアントについて、プロバイダーは自動化タスクと説明しており、それが他人のトラフィックを運ぶかどうかは書かれていません。"
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "ノードのウォレットアドレスと、稼働時間およびタスク完了の数値が、評判スコア(TrustFingerprint)としてオンチェーンに記録されます。プロバイダーによると、タスクは匿名化され、サンドボックスで実行され、ウォレットのキーがデバイスの外に出ることはありません。これ以上具体的な情報は公開されていません。"
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Android で共有する回線は通信事業者のモバイルプランです。プロバイダー自身のドキュメントでも、一部の通信事業者の利用規定では共有が認められていない場合があると警告しており、共有したトラフィックはプランの容量を消費します。デスクトップとブラウザのクライアントについて、プロバイダーは ISP の規約に何も触れていません。"
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "1 デバイスにつき 1 ノードで、それぞれに専用の soulbound Utility NFT があります。複数のデバイスを動かすことは認められており、推奨もされています。IP ごとの上限は公開されていません。通常の意味でのアカウントはなく、識別情報はアプリが初回起動時に生成するウォレットです。"
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "ノードの報酬は、資金が用意されていない市場価値のないテストネットのトークンで、何も支払われていません。サイトの 5 から 10% APY は設計上の目標です。"
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "デスクトップとブラウザのクライアントについて、Noderr は自動化タスクと説明しており、それが他人のトラフィックを運ぶかどうかは書かれていません。"
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "プロバイダーはタスクが匿名化され、サンドボックス化されていると述べていますが、それ以上具体的なことは公開していません。"
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "まだ Base Sepolia 上のテストネットのベータです。"
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot は Noderr を実行しません。プロバイダー独自のアプリまたは拡張機能を使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "アカウントは不要です。アプリが初回起動時にウォレットを生成します。"
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle はスマートフォンの Bluetooth を使って IoT インフラを構築します。アプリは近くの IoT デバイスを受動的に検出してそのデータを中継し、NODL トークンを獲得します。Forbes で紹介され、Vivendi や Hayden AI と企業提携しています。モバイルのみです(iOS と Android)。\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Bluetooth IoT 中継 - モバイルアプリ、NODL トークンの報酬"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "収益は非常に少ないです。Bluetooth を使うバックグラウンドのスマートフォンアプリです。ウォレットの接続が不安定なことがあります。"
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "継続的"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL は ZKsync Era 上のアプリ自身のウォレットにあります。アプリ内、または ZKsync Era のブロックエクスプローラーで確認してください。Nodle は Polkadot のパラチェーンを離れ、Polkadot から ZKsync へのブリッジは 2025 年 12 月 31 日に閉鎖されました。そのため、Polkadot 側に残っている NODL は ZKsync に移せなくなっています。"
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "NODL は ZKsync Era 上の Nodle アプリ独自のウォレットにあります。CashPilot はそのウォレットのアドレスを確認できません。"
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "招待から参加した新しいアクティブユーザー 1 人ごとに NODL の報酬(Nodle は金額を公表していません)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "あるレビューでは、3 年から 4 年で約 $3 の収益だったと報告されています。日々の収益が大きく減ったという報告もあります。"
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot は Nodle を実行しません。プロバイダー独自のスマートフォンアプリを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana は Solana 上に構築された分散型の GPU コンピュートマーケットプレイスです。GPU の所有者と AI ワークロードの需要を結び付け、NOS トークンで支払います。RTX 3060 の収益は約 $0.048/時間です。このプラットフォームは AI 推論のワークロードに注力しており、ジョブのスケジューリングと支払いの精算に Solana ブロックチェーンを使います。ノードは Nosana CLI でコンテナ化されたワークロードを実行します。\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Solana 上の GPU コンピュート - NOS トークン、RTX 3060 ~$0.048/時間"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/時間で、上位の GPU ほど多く稼ぎます。収益はジョブの有無と GPU のモデルによって決まります。NVIDIA GPU、Linux、Docker、Nosana CLI が必要です。支払いは Solana 上の NOS トークンです。"
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "ジョブ完了ごと"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Solana 上で NOS トークンを獲得します。設定したウォレットに支払われます。"
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Nosana は既定で Solana ウォレットを生成するため、ほとんどのユーザーはそのアドレスを一度も見たことがありません。"
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "各ホストは、GPU の時間単価に見合った額の NOS をステークとしてロックする必要があります。"
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "ホストへの支払いは NOS なので、ドル換算の収益はトークンとカードの需要に応じて変動します。"
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot は Nosana を実行しません。プロバイダー独自のホストソフトウェアを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN はアカウント不要の Bitcoin マイニングプールです。マイナーは Bitcoin アドレスをユーザー名としてログインし、プールはそのアドレスに支払います。ここでは CashPilot はマイナーを実行しません。OCEAN があなたのアドレスに対して保有している未払い残高を読み取り、ASIC(Bitaxe、Antminer など)が稼いだ額を他の収入と並べて表示します。未払い残高は獲得済みですが、まだ受け取っていません。支払いしきい値を超えると、OCEAN がオンチェーンで支払います。\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Bitcoin マイニングプール、支払いアドレスで追跡"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "ブロックによって残高がしきい値を超えたとき"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "未払い残高がしきい値に達すると、OCEAN がオンチェーンであなたのアドレスに支払います。Lightning での支払い(オプトイン、BOLT12)は CashPilot では検出されません。"
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "未払い分は獲得済みですが、OCEAN がこのアドレスにオンチェーンで支払うまでは受け取っていません。Lightning での支払いをオンにした場合は除きます。"
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "BTC の支払いアドレスです。マイナーが OCEAN で使っているユーザー名から、<b>.workername</b> の部分を除いたものです。公開情報であり、これで資金を動かすことはできません。"
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "mine.ocean.xyz:3334 に接続した Bitcoin ASIC マイナー(Bitaxe、Antminer など)が必要です"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "コンピュート"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
  text: "いいえ。マイナーはハッシュをプールに送信するだけで、誰もあなたの回線経由でトラフィックを送りません。"
  source: "7239118f749a"
ocean.disclosure.data_collected:
  text: "Bitcoin アドレス、選んだワーカー名、ハッシュレート、プールから見たマイナーの IP アドレスです。"
  source: "22282404721c"
ocean.disclosure.isp_risk:
  text: "マイナーはプールへの接続を 1 本開いたままにするだけで、帯域はほとんど使いません。気をつけるべきコストは ISP ではなく電気代です。"
  source: "7bf5f9f6b028"
ocean.disclosure.account_rules:
  text: "アカウントはありません。アドレスが識別情報で、誰でも ocean.xyz でその統計を見られます。"
  source: "e3c8fd5863c1"
ocean.rating.cons.0.text:
  text: "支払いは Bitcoin のみで、残高が 0.01048576 BTC に達するまでオンチェーンでは何も支払われません。"
  source: "9c9981f2fbd5"
ocean.rating.cons.1.text:
  text: "プール手数料は 2% で、DATUM で自分のブロックテンプレートを作る場合は 1% です。"
  source: "497f4f1ec62e"
ocean.rating.cons.2.text:
  text: "CashPilot は OCEAN 用のマイナーを実行しません。ご自身のハードウェアをプールに接続し、CashPilot は残高を読み取るだけです。"
  source: "eccc0b4b47ae"
ocean.rating.pros.0.text:
  text: "アカウントも本人確認もありません。OCEAN が求めるのは支払い先の Bitcoin アドレスだけです。"
  source: "38c4a7764846"
packetstream.description:
  text: "PacketStream は、使っていない帯域を販売できる P2P の帯域マーケットプレイスです。市場調査、SEO 監視、広告検証に使われる住宅用プロキシネットワークを支えています。Docker のセットアップは簡単で、必要なのは CID(Client ID)だけです。なお、ログインが CAPTCHA で保護されているため、収益の自動収集が難しくなることがあります。\n"
