  text: "Monero アドレス、ワーカー名、IP アドレスがプールに送られます。"
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "一部のネットワークや DNS リゾルバーは、マイニングプールへの接続をブロックします。"
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "ほとんどの Monero プールは、公開支払いアドレスであなたを識別します。"
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "支払いを受けるには、プールのしきい値に届くだけの XMR が必要です。"
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "一部のホスティングプロバイダーは、暗号資産のマイニングを禁止しています。"
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "増えた電気代が、獲得した XMR を上回ることがあります。"
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "マイナーはハッシュをプールに送るだけで、他人のトラフィックを中継しません。"
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "マイナーはオープンソースで、イメージは署名付きのアップストリームのリリースに固定されています。"
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "名前で身元を明かさずに、公開 Monero アドレスでマイニングできます。"
  source: "752cbb728aac"
