# Japanese translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/ja.yml --restamp '<key>'
2miners-etc.description:
  text: "公開 ETC 支払いアドレスに対して 2Miners が保有している未払いの Ethereum Classic 残高を追跡します。ご自身のマイナーを動かし、このプールに接続してください。CashPilot は残高を読み取り、残高が減ったときに支払いの確認をお願いします。\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Ethereum Classic マイニングプール、支払いアドレスで追跡"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC(変更可能)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "プールは 2 時間ごとに支払いしきい値を確認します"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "選んだしきい値に達すると、2Miners が自動的にアドレスへ支払います。ETC の支払いしきい値の最低値は 0.1 ETC です。\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "未払い残高は 2Miners に蓄積されます。ウォレット残高は Ethereum Classic から別途読み取ります。CashPilot で支払いを確認する前に、受け取った金額をウォレットで確認してください。\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "マイナーが 2Miners で使っている公開 Ethereum Classic 支払いアドレスを入力してください。アドレスは <b>0x</b> で始まります。ワーカー名は含めないでください。\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "2Miners に接続した ETCHash マイナーが必要です"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "コンピュート"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "いいえ。マイナーはマイニング作業をプールに送信します。"
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "プールは支払いアドレス、選んだワーカー名、マイナーの IP アドレスを使用します。"
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "支払いアドレスがわかれば誰でも統計を閲覧できます。しきい値を変更するには、プールがワーカーの IP の確認を求めます。"
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "プールは 1% の手数料を取り、しきい値に達するまで支払いを保留します。"
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol(旧 ATOR)は、オニオンルーティングによる分散型のプライバシーネットワークです。ノード運営者はリレーノードを動かし、提供した帯域に応じて ANYONE トークンを獲得します。「報酬付きの Tor」と考えてください。CashPilot は、プロジェクトの署名付き Debian パッケージからビルドした独自のイメージで、amd64 と arm64 向けに実行します。設定は、コンテナにマウントする anonrc ファイルで行います(Nickname、ContactInfo、ORPort など)。リレーは、100 ANYONE を 180 日以上ロックするまで何も獲得せず、報酬はウォレットで署名して受け取ります。また、リレーはあなたの公開 IP をネットワークのリレーディレクトリに掲載します。これにより、住宅用 IP の帯域アプリが対価を払う IP の評判が下がるおそれがあります。\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "分散型オニオンルーティング - 報酬付き Tor リレーノード"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "リレーの ed25519 識別キーです。削除するとリレーの評判は失われ、収益の履歴はゼロからやり直しになります。"
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "リレーごとに 100 ANYONE を 180 日以上ロックし、ウォレットで報酬の受け取りに署名した場合にのみ支払われます。ステークがなければリレーは何も獲得しません。ステークがある場合、収益は提供した帯域と稼働時間によって決まります。"
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "エポックごと"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "anonrc の ContactInfo に、先頭に '@anon:0x...' を付けて設定します。"
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "カンマ区切りのリレーフィンガープリントです。この値はウェブのダッシュボードにはありません。リレーを動かしているホストで <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> を実行してください。\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "帯域です。Anyone ネットワーク(Tor のフォーク)のリレーとして提供します。"
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "はい。他人のトラフィックを中継します。あなたの IP が最後のホップになるかどうかは、リレーが出口として設定されているかどうかによります。"
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "リレーの公開識別キー、あなたの IP とポート、稼働時間の統計です。これらは仕組み上すべてネットワークディレクトリに公開されます。anonrc に ContactInfo を設定すると、それもディレクトリに公開され、永久に公開状態でインデックスされます。通常はメールアドレスなので、公開したい場合以外は空欄のままにしてください。"
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "現実的なリスクがあります。リレーのトラフィックはあなたの回線によるものと見なされます。特に出口リレーは不正利用の苦情を招きやすく、多くの一般向け ISP は出口リレーを禁止しています。"
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "登録するアカウントがないため、アカウントごとの制限もありません。それでも収益を得るには、リレーごとに 100 ANYONE を 180 日以上ロックした Ethereum ウォレットが必要で、CashPilot が報酬を読み取るにはリレーフィンガープリントが必要です。プロジェクトは IP ごとのリレー数の上限を公表しておらず、カタログにも記載はありません。"
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "100 ANYONE を 180 日以上ロックしない限りリレーは何も獲得せず、報酬の受け取りのたびにウォレットで署名が必要です。"
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "仕組み上、相手が誰かを確認せずに他人のトラフィックを中継します。出口リレーは不正利用の苦情を招きやすいです。"
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "リレーの識別情報、IP、稼働時間はネットワークディレクトリに公開され、設定した ContactInfo は永久に公開されます。"
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "登録するアカウントはありません。リレーに必要なのはウォレットだけで、本人確認はありません。"
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "リレーソフトウェアは公開された Tor のフォークで、Tor のライセンスに従います。"
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot は、アカウント不要で公開されている Anyone のリレーソフトウェアから独自のイメージをビルドします。"
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping は、ノードを動かすと報酬が支払われる分散型のネットワーク監視プラットフォームです。あなたのノードは、Bitping の顧客のためにウェブサイトの監視、レイテンシのテスト、ネットワーク品質のチェックを行います。家庭用回線でも VPS でも動作します。Docker イメージは初回起動時に BITPING_EMAIL と BITPING_PASSWORD の環境変数でログインし(自身のログに \"Attempting login with environment variables\" と表示されます)、その後はセッションをマウントしたボリュームに保存するため、再起動しても再認証は不要です。\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "帯域共有 - 分散型ネットワーク監視、VPS で動作"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "メールアドレス"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "パスワード"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "Bitping アカウントのメールアドレス(<a href='https://app.bitping.com' target='_blank'>app.bitping.com</a> と同じログイン)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Bitping アカウントのパスワードです。ノードのセッションを作成するために一度だけ使われ、その後セッションはデータボリュームに保存されます。"
  source: "acb49b137850"
bitping.earnings.notes:
  text: "収益は、ネットワーク品質と、あなたの所在地からの監視の需要によって決まります。VPS のノードも利用できます。"
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "申請時"
  source: "be820103712e"
bitping.cashout.notes:
  text: "ノードの収益は nodes.bitping.com にあります。app.bitping.com は API 顧客向けのダッシュボードです。出金は SOL のみです。未払い残高が $0.05 を超えたら、申請に Solana アドレスを入力します。申請は 24 時間以内に処理されます。新規または空の Solana ウォレットには、ネットワークのレント最低額として、先に約 0.001 SOL を入れておく必要があります。"
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "現在は Solana のみで、アドレスは保存されず、出金のたびに入力します。"
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Bitping アカウントのメールアドレスとパスワードを使用してください(<a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a> と同じです)。"
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Bitping の残高を出金してください"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "12 か月を超えて受け取られていない収益は、メールで 30 日前に通知されたうえで、Bitping によって没収されることがあります。"
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "nodes.bitping.com で SOL の出金を申請し、申請に Solana アドレスを入力してください。"
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "出金は Solana(SOL)で、申請のたびに入力するアドレスに支払われます。"
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Bitping のヘルプによると、新しい空の Solana ウォレットへの出金は、そのウォレットにご自身で少額の SOL を入れるまで失敗することがあります。"
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Bitping のヘルプによると、サーバーと Docker コンテナがサポートされています。"
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "出金に必要なのは、申請に入力する Solana アドレスだけです。"
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit は、PayPal と Stripe で支払う帯域共有サービスです。公式の Docker イメージはなく、クライアントは Windows のデスクトップアプリと Android アプリです。サービスは bytebenefit.io で運営されています。旧ドメインの bytebenefit.com は手放され、マーケットプレイスでパーキングされています。そのため、以前ここでは終了扱いになっていました。\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "帯域共有 - PayPal/Stripe で支払い、デスクトップ/Android アプリ"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Docker イメージはありません。Windows のデスクトップアプリと Android アプリのみです。"
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "申請時"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "紹介した人のトラフィック収益の 20%"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "$1(10,000 Coins)のウェルカムボーナス"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "アプリの Google Play の掲載情報によると、あなたのトラフィックは Infatica の顧客によるウェブインテリジェンスのリクエストに使われますが、顧客が誰で、どう審査されているかは書かれていません。"
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Android アプリは、17 か月後の 2026 年 4 月に Google Play から姿を消しました。"
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot は ByteBenefit を実行しません。プロバイダー独自のアプリを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir では、使っていないインターネット帯域を共有して不労所得を得られます。対応は Windows と Android のみです。公式 FAQ によると、Linux や Docker のクライアントは予定されておらず、iOS は非対応で、macOS 版も提供されていません。収益は所在地に大きく左右されます。収益の確認には dash.bytelixir.com のウェブダッシュボードを使います。Docker イメージはありません。\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "帯域共有 - Windows + Android のみ"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "セッション Cookie"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Remember Web Cookie"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "XSRF トークン"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "<a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a> にログインし、F12 → Application → 左のサイドバーで <b>Cookies</b> を展開 → サブ項目 <code>https://dash.bytelixir.com</code> をクリック → 右側の Cookie 一覧で <code>bytelixir_session</code> を探す → その Value(eyJ で始まる長い JWT)をコピーします"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "同じ場所(Cookies → <code>https://dash.bytelixir.com</code>)→ <code>remember_web_...</code> という名前の Cookie を探す → その Value をコピーします(任意。セッションの有効期間が延びます)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "同じ場所 → <code>XSRF-TOKEN</code> を探す → その Value をコピーします(任意)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "収益は所在地によって異なります($2-50/月)。Docker イメージはありません。デスクトップアプリまたは Android アプリが必要です。"
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "申請時"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "暗号資産のみです。最低額はコインによって異なります: USDT $5、USDC $5、TON $8、LTC $10、ETH $40、BTC $250。申請のたびにアドレスを入力します。申請は営業時間内に、24 時間以内に処理されます。"
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "残高は Bytelixir が保有します。ウォレットアドレスは支払い申請のたびに入力し、コンテナには一切保存されません。"
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "<a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> に <b>Remember Me にチェックを入れて</b>ログインし、F12 → Application → 左のサイドバーで <b>Cookies</b> を展開 → <code>https://dash.bytelixir.com</code> をクリックし、次の 3 つの値をコピーします: <b>bytelixir_session</b>、<b>remember_web_…</b>(その接頭辞で始まる長いもの)、<b>XSRF-TOKEN</b>。セッション Cookie だけだとコピーしてから約 2 時間で期限が切れ、その日の午後には収集が止まります。remember_web Cookie は 1 年間有効で、これがあれば動作し続けます。"
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "紹介した人の利益の 50% を生涯にわたって"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "$1 の歓迎ボーナス"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "暗号資産のみで、最低額はコインによって異なり、USDT の $5 から Bitcoin の $250 までです。"
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot は Bytelixir を実行しません。プロバイダー独自のアプリを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Trustpilot では 283 件のレビューで 4.6 と評価され、その多くが暗号資産での支払いを評価しています。支払いが届かないという報告も少数あります。"
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "支払いに必要なのは、申請に入力する暗号資産アドレスだけです。"
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai は P2P の GPU マーケットプレイスです。NVIDIA GPU を搭載した Linux マシンを出品し、スポット価格とオンデマンド価格を自分で設定すると、借り手がその上で自分の Docker コンテナを実行します。支払いは貸し出された分数に対してのみで、CLORE、BTC、USDT、USDC のいずれかで受け取ります。ホスティングには、Ubuntu 22.04 以降(または HiveOS)の x86_64 マシン、正常に動作する NVIDIA ドライバー、上り下りとも 100 Mbps 以上の回線が必要です。AMD GPU には対応していません。\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "GPU マーケットプレイス - NVIDIA GPU を貸し出し、CLORE、BTC、USD ステーブルコインで支払い"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "支払いは貸し出された分数に対してのみで、価格は自分で設定します。範囲の上限である $490 は、分単位で出品した RTX 4090 1 枚について Clore 自身が示す上限です('up to ~$490/month')。それより小さいカードは収益が少なく、使われていないカードは何も稼ぎません。Clore は各レンタルの 5%(オンデマンド)または 1.25%(スポット)を取り、借り手が CLORE ではなく BTC、USDT、USDC で支払う場合はさらに 15% を取ります。"
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "申請時"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Account > Billing から自分のウォレットに出金します: CLORE(ERC-20、最低 200、手数料は約 $0.50)、BTC(最低 0.0001、手数料 0.00005 BTC)、または Ethereum か BNB Chain 上の USDT/USDC(最低 $10、手数料 $1)。"
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "出金するまで、Clore が残高(CLORE、BTC、USDT/USDC 用の USD 残高 1 つ)を保有します。チェーンは出金のたびに選びます: CLORE は Ethereum、BTC は Bitcoin、USDT/USDC は Ethereum または BNB Chain です。"
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "紹介したホストと借り手が支払うプラットフォーム手数料の 15%(標準ティア)を、すべてのレンタルで受け取れます。コードの有効期限はありません。支払いはレンタルの通貨(CLORE、BTC、USD)で行われます"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "上り下りとも 100 Mbps"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "あなたのマシンの GPU 計算時間です。"
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "はい。借り手はあなたのマシンで自分の Docker コンテナを実行し、そのトラフィックはあなたの回線から出ていきます。SSH とアプリケーションのポートはインターネットに転送されます。"
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Clore のプライバシーポリシーの対象は、アカウントデータと、おおよその位置情報を含む IP アドレスです。身分証明書は、Clore が KYC を求めた場合にのみ対象になります。"
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "受信ポートがインターネットから到達できる必要があり(既定では 22、8080、3000-4000)、見知らぬ人のワークロードがあなたの回線で動きます。Clore 自身のネットワークガイドには、一部の ISP がホスティングをブロックすると書かれています。"
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "18 歳以上で、制裁対象国にいないことが条件です。Clore は独自の判断でアカウントを停止または閉鎖でき、禁止された用途に使うと資金を失うことがあります。"
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "利用規約にもプライバシーポリシーにも法人名の記載がなく、利用規約は準拠法を将来の版に委ねています。"
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore は独自の判断でアカウントを停止または閉鎖でき、禁止された用途に使うと資金を没収されることがあります。"
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "支払いは暗号資産のみ(CLORE、BTC、USDT、USDC)です。借り手が BTC、USDT、USDC で支払ったレンタルについて、Clore はさらに 15% を取ります。ホストが CLORE をロックすればこれを減らせます。"
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "ホストに支払われるのは貸し出された分数だけで、RTX 4090 について Clore が示す金額は、カード 1 枚あたりの上限(\"up to ~$490/month\")です。"
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "通常の利用に KYC は不要ですが、高額の出金やコンプライアンス上の理由で、Clore が本人確認を求めることがあります。"
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "借り手は任意の公開 Docker イメージをあなたのマシンで実行します。利用規約には禁止用途(マルウェア、DDoS、CSAM など)が挙げられていますが、借り手の審査方法の説明は見つかりませんでした。"
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot は Clore.ai を実行しません。ご自身の GPU マシン(Ubuntu 22.04 以降、または HiveOS)に Clore のホスティングエージェントをインストールするため、CashPilot がデプロイや更新を代わりに行うことはできません。"
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "借り手が CLORE で支払う場合、Clore が取るのはオンデマンドのレンタルの 5%(スポットは 1.25%)だけで、追加の手数料はありません。"
  source: "699adf0a2179"
dawn.description:
  text: "DAWN は、DAWN プロトコルで資金調達された AI インフラ向けに、帯域とカバレッジを確認するバリデーターネットワークを運営しています。DAWN Validator ブラウザ拡張機能は、こうした帯域証明とカバレッジのチェックに参加し、動作中に DAWN 報酬を獲得します。報酬の換金価値はまだ確定していません。拡張機能でアカウントを作成し、求められたら紹介コード 2QLQV97F を入力してください。\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "DePIN バリデーター - ブラウザ拡張機能で DAWN ポイントを獲得"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "トークンのローンチ前に Dawn Points を獲得します。実際の価値は将来のトークン価格によって決まります。ハードウェア機器のほうがブラウザ拡張機能より多く稼ぎます。"
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "トークンのエアドロップ(未定)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "拡張機能は動作しますが、完成度は低いです。Black Box ハードウェアが発表されています。今後の状況を確認してください。"
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "拡張機能が獲得するのはポイントです。2026 年 10 月の時点で、ノード運営者へのトークン配布は確認されていませんでした。"
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "トークンがローンチされ、換算方法が発表されるまで、ポイントの価値は確定しません。"
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot は Dawn を実行しません。プロバイダー独自のブラウザ拡張機能を使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network は、分散型 VPN と Web3 インフラのプロジェクトです。主に独自の Deeper Connect ハードウェア機器が必要です。Moken は関連するマイニング/ステーキングのプラットフォームです。ソフトウェアだけでは利用できません。\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "分散型 VPN - 独自のハードウェア機器が必要"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Deeper Connect ハードウェア($200-500)が必要です。マイニング/ステーキングには Moken プラットフォームを使います。ソフトウェアだけでは利用できません。"
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "継続的"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "機器の販売に対するコミッション"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "クーポン SERGIO で Deeper Connect 機器が 5% オフ"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "マイニング報酬は DPR で、ゆっくり、または DPR のステーキングによって上がるクレジットスコアに左右されます。"
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot は Deeper Network を実行しません。プロバイダー独自のルーターハードウェアを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "b1ba1636070f"
earnapp.description:
  text: "Bright Data の EarnApp では、使っていない帯域を売って不労所得を得られます。Bright Data は世界最大のプロキシネットワークで、Fortune 500 企業のデータ収集を支えています。CashPilot は独自のイメージで実行します。このイメージは初回起動時に、固定された EarnApp のビルドを Bright Data の CDN からダウンロードし、sha256 を確認したうえで、UUID だけを使うライトモードで実行します。\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "帯域共有 - Bright Data が運営"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "ノード UUID"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "EarnApp のノード ID です。'earnapp showid' が表示するとおり、sdk-node- の後に小文字の 16 進数 32 文字が続きます。デプロイ後、EarnApp にサインインした状態で https://earnapp.com/r/ の後にこの UUID を付けたアドレスを開いて一度リンクしてください。リンクされていないノードも収益を得ますが、残高には何も反映されません"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp がサーバーへの接続に何度も失敗して再起動しているため、収益はほとんど、またはまったくありません。このコピーを再起動してください。繰り返し起きる場合は、このマシンのインターネット接続を確認してください。"
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "EarnApp にサインインした状態でこのリンクを開き、ノードをアカウントに追加してください。追加するまで、ノードは収益を得ますが残高には何も反映されません。"
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "所在地による差が非常に大きいです。米国/EU の IP が最も稼ぎます。収益は使用された帯域に比例します。"
  source: "460beb388888"
earnapp.payment.frequency:
  text: "申請時(自動交換あり: PayPal 最低 $10、Wise 最低 $10、Amazon 最低 $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "自動交換を一度オンにすると、残高が各方法の最低額に達するたびに EarnApp が自動で支払います: PayPal $10、Wise $10、Amazon $50。PayPal の支払いは Bright Data Ltd. から届きます。2026 年 10 月には、PayPal の支払いが交換した残高より約 2% 少なく届きました。"
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "残高は EarnApp が保有し、Amazon/Wise/PayPal に交換されます。"
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "<a href='https://earnapp.com' target='_blank'>earnapp.com</a> にログインし、F12 → Application → Cookies を開いて、<b>oauth-refresh-token</b> の値をコピーしてください。"
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "紹介した人の収益の 10% を生涯にわたって、その人の収益とは別に支払い"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "EarnApp のヘルプセンターでは、Docker コンテナ、仮想マシン、ホスティングサービス、ホームサーバーへのインストールは固く禁じられていると書かれています。CashPilot はまさにその方法で実行します。"
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "同じヘルプ記事では、その方法で実行していると判明したアカウントは予告なく解約され、保留中の支払いは取り消されると書かれています。"
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "私たちの PayPal の支払いは 2026 年 10 月に届き、交換した残高より約 2% 少ない額でした。"
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "PayPal と Wise は最低 $10 で、自動で支払われる自動交換があります。"
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp は Bright Data の傘下で、PayPal の支払いは社名のわかる企業である Bright Data Ltd. から届きます。"
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm は、インターネット帯域の共有に対して支払います。収益コレクターは Supabase 経由でメールアドレス/パスワードで認証します。軽量な Docker イメージで、デプロイも簡単です(Docker クライアントは別の UUID トークンを使います)。\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "帯域共有 - メールアドレス/パスワード認証、軽量クライアント"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "API キー"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "<a href=\"https://app.earn.fm\">app.earn.fm</a> にログイン → プロフィールアイコン(右上)をクリック → Account Settings → API Key(UUID 形式)をコピーします"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "比較的新しいプラットフォームです。収益は所在地と利用可能な帯域によって異なります。"
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "申請時"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "最低 $15 です。方法: BEP20 または Polygon 上の USDT(手数料 $1)、TRC20(手数料 $3)、PayPal、$15 からの Amazon または Starbucks ギフトカード、または振込手数料を差し引いた $1,000 からの銀行送金。初回の支払い前に請求先プロフィール(法的氏名と住所)を入力します。これは支払いの領収書に使われます。"
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "残高は Earn.fm が保有し、申請時に出金されます。"
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Earn.fm アカウントのメールアドレスとパスワードを使用してください(<a href='https://app.earn.fm' target='_blank'>app.earn.fm</a> のログインと同じです)。"
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "紹介した人の収益の 10% を生涯にわたって"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "$5 の初期残高"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "最低額は $15、USDT には $1 から $3 の手数料がかかり、銀行送金は $1,000 からです。"
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "初回の支払い前に、法的氏名と住所を含む請求先プロフィールを入力します。"
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "2025 年のレビューでは、メールと Discord のサポートが応答しないと報告されています。Trustpilot は、Earn.fm が否定的なレビューに返信していないと記載しています。"
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Earn.fm は独自の Docker イメージ earnfm/earnfm-client を公開しています。"
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher は、自動のサーフバーでウェブサイトを訪問してクレジットを獲得するトラフィック交換プラットフォームです。ブラウザ拡張機能/アドオンとして動作します。一般的な帯域共有サービスではなく、ウェブサイトを自動で閲覧してトラフィックを生み出します。\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "トラフィック交換サーフバー - ブラウザ拡張機能"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "収益は EUR に換算できる BTP ポイントです。ブラウザ拡張機能のみです。"
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "申請時"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "PayPal または銀行振込でユーロで支払われます。"
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "CashPilot は eBesucher を実行しません。ブラウザ拡張機能のため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "支払いは 2 ユーロから、PayPal または SEPA で、少なくとも毎週、手数料なしで行われます。"
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "eBesucher は 2002 年から運営されています。"
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "インプリント(運営者情報)には、ベルリン・シャルロッテンブルクで登記された運営者 TurboAd GmbH(HRB 160730 B)の名前があります。"
  source: "84cbddd4330b"
flux.description:
  text: "Flux は、世界中に分散したコンピュートインフラです。ノード運営者は FLUX トークンをステークし、サーバーリソースを提供します。3 つのティアがあります: Cumulus(1,000 FLUX)、Nimbus(12,500 FLUX)、Stratus(40,000 FLUX)。公式の Docker イメージがあります。\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "分散型コンピュート - FLUX トークンのステークが必要"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "1,000+ FLUX のステーク(価格に応じて ~$50-500)が必要です。上位のティアほど多くの担保が必要ですが、収益も多くなります。"
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "ブロック報酬"
  source: "590433237f8a"
flux.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "最小のノードティアでも、担保として 1,000 FLUX をロックする必要があります。"
  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "ブロック報酬は毎年 10% 減少し、2026 年のガイドでは、小さいティアの報酬はドル換算で少ないとされています。"
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "CashPilot は Flux を実行しません。プロバイダー独自のノードソフトウェアを使うため、CashPilot がデプロイや更新を代わりに行うことはできません。利用規約はコンテナについて確認していません。"
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "Flux デーモンは MIT ライセンスのオープンソースです。"
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network は分散型のコンピュートマーケットプレイスで、CPU と GPU のリソースを共有して GLM トークンを受け取ります。プロバイダーは Yagna エージェントを動かし、エージェントがサンドボックス環境でワークロードの実行を管理します。最も歴史のある分散型コンピュートプロジェクトの 1 つです(2016 年設立)。CPU タスク、GPU レンダリング、汎用コンピュートに対応しています。支払いは Polygon L2 経由です。\n"
  source: "9a6843f56459"
golem.short_description:
  text: "分散型コンピュートマーケットプレイス - Yagna エージェントで GLM トークン"
  source: "88f817c25848"
golem.earnings.notes:
  text: "収益はハードウェア、価格設定、タスクの需要によって決まります。CPU のみのノードは収益が少なめです。GPU ノードは収益が多いですが、NVIDIA が必要です。Yagna プロバイダーエージェントを動かします(Docker イメージではありません)。支払いは Polygon 上の GLM トークンです。"
  source: "07287d437d51"
golem.payment.frequency:
  text: "タスク完了ごと"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "GLM トークンを獲得します。支払い先のウォレットはプロバイダーのセットアップで設定します。"
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "まだ確定していません。このサービスが収益をどこで保管しているかを、CashPilot はまだ確認していません。"
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot は Golem を実行しません。プロバイダーエージェントをご自身でインストールするため、CashPilot がデプロイや更新を代わりに行うことはできません。Golem は、独自の Docker イメージでプロバイダーを実行する方法を文書化しています。"
  source: "f3276e47b782"
golem.rating.pros.0.text:
