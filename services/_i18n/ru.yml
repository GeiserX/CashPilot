  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "Макс. потоков CPU (%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "Режим RandomX"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "Валовая оценка без учёта электричества. На 2026-11-25 1 kH/s приносил около $1 в месяц при наблюдаемой цене XMR и сложности сети. Настольный CPU на половине потоков может потреблять дополнительно 30-50 W. Проверьте своё реальное потребление и цену электричества, чтобы понять, окупится ли это."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, после того как вы его снизите)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Когда достигнут порог пула"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "Пул платит на ваш адрес Monero, когда баланс достигает вашего порога. До выплаты баланс хранится у пула."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Эта машина сообщает о подключении через хостинг. Прежде чем майнить, проверьте условия своего провайдера. Некоторые провайдеры, в том числе Hetzner Cloud, это запрещают. Прежде чем полагаться на оценку прибыли, проверьте свои реальные расходы на электричество."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "MoneroOcean, пул по умолчанию, берёт 0% комиссии за майнинг. Порог выплаты по умолчанию — 0.3 XMR, и его можно снизить до 0.003 XMR. Выплаты меньше 4 XMR могут стоить до 0.0004 XMR. Другие пулы устанавливают свои ставки и пороги."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "вычисления"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "Нет. Майнер отправляет результаты работы в майнинг-пулы."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Ваш адрес Monero, имя воркера и IP-адрес передаются пулу."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "Некоторые сети и DNS-резолверы блокируют подключения к майнинг-пулам."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "Большинство пулов Monero идентифицирует вас по публичному адресу выплат."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Для выплаты нужно накопить достаточно XMR, чтобы достичь порога пула."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "Некоторые хостинг-провайдеры запрещают майнинг криптовалют."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "Дополнительное электричество может стоить больше заработанных XMR."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "Майнер отправляет хеши в пулы и не передаёт чужой трафик."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "Майнер — открытое ПО, а образ закрепляет подписанный релиз из основного репозитория."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Можно майнить с публичным адресом Monero, не называя своего имени."
  source: "752cbb728aac"
