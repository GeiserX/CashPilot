proxybase.docker.health_signals.0.means:
  text: "ProxyBase не может связаться со своим ретранслятором как минимум полчаса, поэтому ничего не зарабатывает. Перезапуск это исправляет; если после перезапуска проблема остаётся, проверьте, есть ли у этой машины доступ в интернет."
  source: "cbe6b5ef771f"
proxybase.earnings.notes:
  text: "Выплаты в криптовалюте. Заработок зависит от местоположения и использования трафика."
  source: "39229c292994"
proxybase.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
proxybase.cashout.notes:
  text: "На сайте указан минимум $0.20, а в октябре 2026 года запрос меньше $1 прошёл успешно. Запрос всегда выводит весь баланс — в USDC в Polygon, POL или Litecoin, на адрес, который вы вводите. Сетевую комиссию оплачивает ProxyBase."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "Заработок начисляется на АККАУНТ ProxyBase, которому принадлежит Access Token, и выводится из панели по запросу. Клиент не хранит кошелька, а контейнер не хранит состояния — docker.volumes пуст. Не путайте с proxybase-xyz (ProxyBase Markets, та же организация), который действительно создаёт локальный кошелёк и объявляет его критически важным томом."
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
  text: "Сам ProxyBase в августе 2025 года писал, что он новый и пока не лучшее место, чтобы зарабатывать по максимуму."
  source: "9f5177f749d7"
proxybase.rating.cons.1.text:
  text: "В 2026 году ProxyBase сменил клиент и отключил старый бэкенд, поэтому контейнеры на старом образе продолжали работать, но перестали зарабатывать."
  source: "452b38e35357"
proxybase.rating.cons.2.text:
  text: "Только криптовалюта — USDC в Polygon, POL или Litecoin, без фиатных способов. Минимум $0.20, сетевую комиссию оплачивает ProxyBase."
  source: "2f15ff41b14c"
proxybase.rating.pros.0.text:
  text: "Наш вывод на сумму меньше $1 прошёл в октябре 2026 года."
  source: "00e8781a2252"
proxybase.rating.pros.1.text:
  text: "Для вывода нужен только адрес, введённый в запросе."
  source: "985d03ae1755"
proxybase.rating.pros.2.text:
  text: "ProxyBase публикует собственный образ клиента и поддерживает IP дата-центров."
  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets — площадка SOCKS5-прокси для ИИ-агентов. Продавцы запускают лёгкий демон на Rust (CLI), который подключается по WebSocket и передаёт трафик покупателей через их интернет-подключение, зарабатывая USDC в Tempo Chain за каждый проданный GB. Поддерживаются режимы direct (собственный трафик) и upstream (перепродажа внешних прокси) с автоматическим переподключением. Покупатели приобретают прокси-сессии по стране, интернет-провайдеру и объёму трафика. Платежи проходят через Machine Payments Protocol (MPP) в Tempo Chain. Реферальная ссылка предназначена для покупателей: покупатель, открывший по ней консоль, получает 10% сверху к первому пополнению.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz — площадка SOCKS5 для ИИ-агентов, выплаты в USDC. Создаёт кошелёк, единственная копия ключа которого хранится в томе"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "URL API бэкенда"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "Переопределяет URL API бэкенда (по умолчанию https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "При первом запуске контейнер настраивается сам: создаёт кошелёк secp256k1 (BIP-39), проходит аутентификацию по схеме ECDSA challenge-response и начинает продавать трафик в режиме direct-only. Всё состояние (кошелёк, токен сессии, настройки продавца) сохраняется в томе <code>proxybase-data</code>. При первом запуске посмотрите адрес кошелька в логах контейнера. Используйте <code>--upstream</code>, чтобы добавить пути перепродажи внешних прокси.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "Файл ключа созданного кошелька. Этот том — и есть деньги: копии на сервере нет, поэтому, удалив его, вы уничтожите и средства."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Заработок зависит от проданных GB по рыночным ставкам. IP VPS и дата-центров зарабатывают меньше домашних. Режим multi-upstream позволяет совмещать собственный трафик с внешними прокси."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Зафиксируйте заработок командой <code>proxybase-cli seller payout create</code>; он приходит в USDC в Tempo Chain (Tempo MPP). Выплата возможна на любой EVM-адрес, ключом от которого вы владеете (Tempo — EVM-сеть), подписывать ничего не нужно; чтобы увидеть USDC, добавьте сеть Tempo в кошелёк. Если кошелёк всё равно его не показывает, добавьте токен Tempo USDC вручную: импортируйте его по адресу контракта, который даёт Proxybase, и проверьте этот адрес, прежде чем доверять балансу."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "При первом запуске клиент сам создаёт кошелёк."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "15% от каждого пополнения приглашённого покупателя в виде кредита на ваши собственные прокси-сессии"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "+10% к первому пополнению покупателя"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "Трафик: в виде SOCKS5-прокси, который продаётся покупателям на площадке ProxyBase."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Да. Покупатели пропускают свой трафик через ваше подключение — именно это и продаётся."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Адрес кошелька, созданный на вашей машине, и объём передаваемого вами трафика."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Реальный, и он напрямую касается домашних подключений. Прокси-трафик неизвестных покупателей выходит под вашим IP, поэтому жалобы на злоупотребления придут к вам. В этом каталоге ничто не ограничивает сервис адресами дата-центров, а домашние IP зарабатывают больше, так что стимулы здесь работают против вас: прочитайте условия своего интернет-провайдера, прежде чем запускать его дома."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "неизвестно — провайдер не публикует лимит устройств на аккаунт или на IP, и в каталоге он тоже не указан."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "Выплаты в USDC в Tempo Chain на любой EVM-адрес, ключом от которого вы владеете."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "Ваше подключение продаётся покупателям на площадке как SOCKS5-прокси; описания того, как проверяют покупателей, мы не нашли."
  source: "2dec55ca610f"
proxybase-xyz.rating.pros.0.text:
  text: "Собственная страница заработка в заголовке обещает отсутствие KYC и выплату от $1."
  source: "25b6dc3b4608"
proxybase-xyz.rating.pros.1.text:
  text: "ProxyBase публикует собственный образ клиента и принимает подключения из дата-центров."
  source: "ae81d006093f"
proxylite.description:
  text: "ProxyLite монетизирует ваш интернет-трафик, делясь им с проверенными организациями. Работает и на домашних подключениях, и на VPS или в дата-центрах. Простая настройка: нужен только ID пользователя из панели. Предлагает щедрую пожизненную реферальную комиссию 15%.\n"
