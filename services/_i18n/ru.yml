2miners-etc.description:
  text: "Отслеживайте невыплаченный баланс Ethereum Classic, который 2Miners хранит для вашего публичного адреса выплат ETC. Запустите собственный майнер и направьте его на пул. CashPilot считывает баланс и просит вас подтвердить выплаты, когда баланс уменьшается.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Майнинг-пул Ethereum Classic, отслеживается по адресу выплат"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (настраивается)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "Пул проверяет ваш порог выплаты каждые два часа"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners автоматически платит на ваш адрес, как только вы достигнете выбранного порога. Минимальный порог для выплат ETC — 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Невыплаченный баланс накапливается на 2Miners. Баланс кошелька считывается отдельно из сети Ethereum Classic. Прежде чем подтвердить выплату в CashPilot, проверьте в кошельке полученную сумму.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Введите публичный адрес выплат Ethereum Classic, который ваш майнер использует на 2Miners; он начинается с <b>0x</b>. Имя воркера не указывайте.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Нужен майнер ETCHash, направленный на 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "вычисления"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Нет. Ваш майнер отправляет пулу результаты майнинга."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "Пул использует ваш адрес выплат, выбранные вами имена воркеров и IP-адрес вашего майнера."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Статистику по адресу выплат может посмотреть кто угодно. Чтобы изменить порог, пул просит подтвердить IP воркера."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "Пул берёт комиссию 1% и не выплачивает средства, пока не достигнут ваш порог."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (ранее ATOR) — децентрализованная приватная сеть с луковой маршрутизацией. Операторы узлов запускают ретрансляторы и получают токены ANYONE за предоставленный трафик. По сути, это «Tor с вознаграждением». CashPilot запускает его из собственного образа, собранного из подписанного Debian-пакета проекта, для amd64 и arm64. Настройка задаётся файлом anonrc, который монтируется в контейнер (Nickname, ContactInfo, ORPort и т. д.). Ретранслятор ничего не зарабатывает, пока за ним не заблокировано 100 ANYONE как минимум на 180 дней, а вознаграждения получают, подписав транзакцию в кошельке. Кроме того, ретранслятор вносит ваш публичный IP в каталог ретрансляторов сети, что может испортить репутацию IP, за которую платят приложения для заработка на домашнем трафике.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Децентрализованная луковая маршрутизация — ретрансляторы Tor с вознаграждением"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Ключ идентификатора ed25519 ретранслятора. Если его уничтожить, репутация ретранслятора пропадёт, а история заработка начнётся с нуля."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Платит, только если за каждым ретранслятором заблокировано 100 ANYONE как минимум на 180 дней и запрос на вознаграждение подписан в вашем кошельке. Без стейка ретранслятор ничего не зарабатывает. Со стейком заработок зависит от предоставленного трафика и времени работы."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "По эпохам"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Указывается как ContactInfo в anonrc с префиксом '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Отпечатки ретрансляторов через запятую. Ни одна онлайн-панель их не показывает. Для ретранслятора, который запускает CashPilot, выполните <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> на хосте, где он работает. Для аппаратного ретранслятора откройте его Relay Control Panel по адресу <b>http://relayup.local</b> и посмотрите Fingerprint на странице Home.\n"
  source: "ffa5be0d4953"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Трафик: в роли ретранслятора в сети Anyone (форк Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Да. Он передаёт трафик других людей. Будет ли ваш IP последним узлом, зависит от того, настроен ли ретранслятор как выходной."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "Публичный ключ идентификатора ретранслятора, ваш IP и порт, а также статистика времени работы — всё это по замыслу публикуется в каталоге сети. Если вы укажете ContactInfo в anonrc, он тоже будет опубликован там и навсегда останется в открытом индексе. Обычно это адрес электронной почты, поэтому оставьте поле пустым, если не хотите, чтобы он стал публичным."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Реальный. Трафик ретранслятора приписывается вашему подключению. Выходные ретрансляторы особенно часто вызывают жалобы на злоупотребления; многие домашние интернет-провайдеры их запрещают."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Регистрировать аккаунт не нужно, поэтому и ограничивать на аккаунт нечего. Но чтобы зарабатывать, вам всё равно нужен Ethereum-кошелёк, в котором за каждым ретранслятором заблокировано 100 ANYONE как минимум на 180 дней, а CashPilot нужны отпечатки ретрансляторов, чтобы считывать вознаграждения. Проект не публикует лимит ретрансляторов на один IP, и в каталоге он тоже не указан."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Ретранслятор ничего не зарабатывает, пока за ним не заблокировано 100 ANYONE как минимум на 180 дней, а каждый запрос на вознаграждение подписывается в вашем кошельке."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Он по замыслу передаёт трафик других людей и никак не проверяет, кто они; выходные ретрансляторы вызывают жалобы на злоупотребления."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "Идентификатор, IP и время работы ретранслятора публикуются в каталоге сети, а любой указанный вами ContactInfo становится публичным навсегда."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Регистрировать аккаунт не нужно. Ретранслятору нужен только кошелёк, без проверки личности."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "Программа ретранслятора — опубликованный форк Tor под лицензией Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot собирает собственный образ из опубликованной программы ретранслятора Anyone, для которой не нужен аккаунт."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping — децентрализованная платформа мониторинга сетей, которая платит вам за работу узла. Ваш узел выполняет мониторинг сайтов, измерение задержек и проверку качества сети для клиентов Bitping. Работает и на домашних подключениях, и на VPS. При первом запуске Docker-образ входит в аккаунт с помощью переменных окружения BITPING_EMAIL и BITPING_PASSWORD («Attempting login with environment variables» в его собственном логе), а затем сохраняет сессию в смонтированном томе, поэтому после перезапуска повторный вход не нужен.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Обмен трафиком — децентрализованный мониторинг сетей, работает на VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "Эл. почта"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Пароль"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "Эл. почта вашего аккаунта Bitping (тот же логин, что и на <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Пароль вашего аккаунта Bitping. Используется один раз для создания сессии узла, которая затем сохраняется в томе данных."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Заработок зависит от качества сети и спроса на мониторинг из вашего региона. Узлы на VPS принимаются."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Заработок узлов находится на nodes.bitping.com; app.bitping.com — это панель для клиентов API. Вывод возможен только в SOL: когда невыплаченный баланс превысит $0.05, введите в запросе адрес Solana; запрос обрабатывается в течение 24 часов. На новом или пустом кошельке Solana сначала должно быть около 0.001 SOL — это минимальная рента сети."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Теперь только Solana, и адрес вводится В МОМЕНТ ВЫВОДА, а не хранится."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Используйте эл. почту и пароль аккаунта Bitping (те же, что и на <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Выведите баланс Bitping"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping может аннулировать заработок, не выведенный более 12 месяцев, предупредив по эл. почте за 30 дней."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Запросите вывод в SOL на nodes.bitping.com и введите в запросе свой адрес Solana."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Вывод выплачивается в Solana (SOL) на адрес, который вы вводите в каждом запросе."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "В справке Bitping сказано, что вывод на новый пустой кошелёк Solana может не пройти, пока вы сами не пополните этот кошелёк небольшим количеством SOL."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "В справке Bitping сказано, что серверы и Docker-контейнеры поддерживаются."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Для вывода нужен только адрес Solana, введённый в запросе."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit — сервис обмена трафиком с выплатами через PayPal и Stripe. Официального Docker-образа нет; клиентами служат десктопное приложение для Windows и приложение для Android. Сервис работает на bytebenefit.io — старый домен bytebenefit.com заброшен и выставлен на продажу на торговой площадке, поэтому когда-то он был отмечен здесь как неработающий.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Обмен трафиком — выплаты через PayPal/Stripe, приложение для ПК/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Docker-образа нет. Только десктопное приложение для Windows и приложение для Android."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% заработка с трафика рефералов"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "Приветственный бонус $1 (10 000 Coins)"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "В описании приложения в Google Play сказано, что ваш трафик обслуживает запросы веб-аналитики клиентов Infatica, но не сказано, кто они и как их проверяют."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Приложение для Android исчезло из Google Play в апреле 2026 года, пробыв там 17 месяцев."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot не запускает ByteBenefit: вы пользуетесь собственным приложением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir позволяет получать пассивный доход, делясь неиспользуемым интернет-трафиком. Поддерживаются только Windows и Android — в официальном FAQ сказано, что клиент для Linux или Docker не планируется, iOS не поддерживается, а для macOS приложения нет. Заработок сильно зависит от местоположения. Для отслеживания есть веб-панель на dash.bytelixir.com. Docker-образа нет.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Обмен трафиком — только Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Cookie сессии"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Cookie Remember Web"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "Токен XSRF"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Войдите на <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, нажмите F12 → Application → разверните <b>Cookies</b> на левой боковой панели → нажмите на подпункт <code>https://dash.bytelixir.com</code> → в списке cookie справа найдите <code>bytelixir_session</code> → скопируйте его Value (длинный JWT, начинающийся с eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Там же (Cookies → <code>https://dash.bytelixir.com</code>) → найдите cookie с именем <code>remember_web_...</code> → скопируйте его Value (необязательно, продлевает срок жизни сессии)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Там же → найдите <code>XSRF-TOKEN</code> → скопируйте его Value (необязательно)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Заработок зависит от местоположения ($2-50 в месяц). Docker-образа нет. Нужно десктопное приложение или приложение для Android."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Только криптовалюта. Минимум зависит от монеты: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Адрес вы вводите в каждом запросе. Запросы обрабатываются в рабочее время, в течение 24 часов."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Баланс хранится у Bytelixir; адрес кошелька вводится в каждом запросе на выплату и никогда не хранится в контейнере."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Войдите на <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a>, <b>отметив Remember Me</b>, нажмите F12 → Application → разверните <b>Cookies</b> на левой боковой панели → нажмите <code>https://dash.bytelixir.com</code>, затем скопируйте три значения: <b>bytelixir_session</b>, <b>remember_web_…</b> (длинное, начинающееся с этого префикса) и <b>XSRF-TOKEN</b>. Один только cookie сессии истекает примерно через два часа после копирования, и сбор данных прекращается в тот же день; cookie remember_web действует год, и именно он обеспечивает работу."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50% их прибыли пожизненно"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "Приветственный бонус $1"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Только криптовалюта, и минимум зависит от монеты: от $5 для USDT до $250 для Bitcoin."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot не запускает Bytelixir: вы пользуетесь собственным приложением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "На Trustpilot у него оценка 4.6 по 283 отзывам; большинство хвалит криптовыплаты, несколько человек сообщают, что выплаты не пришли."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Для выплаты нужен только криптоадрес, введённый в запросе."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai — одноранговая площадка аренды GPU. Вы размещаете Linux-машину с GPU NVIDIA, сами задаёте спотовую цену и цену по запросу, а арендаторы запускают на ней собственные Docker-контейнеры. Вам платят только за минуты аренды, в CLORE, BTC, USDT или USDC. Для хостинга нужна машина x86_64 на Ubuntu 22.04 или новее (или HiveOS), рабочий драйвер NVIDIA и не менее 100 Mbps на загрузку и отдачу. GPU AMD не поддерживаются.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "Площадка GPU — сдавайте в аренду GPU NVIDIA с оплатой в CLORE, BTC или долларовых стейблкоинах"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Оплачиваются только минуты аренды по цене, которую вы назначили. Верхняя граница диапазона, $490, — собственный потолок Clore для одной RTX 4090 с поминутной арендой («до ~$490/месяц»); карты попроще зарабатывают меньше, а простаивающая карта не зарабатывает ничего. Clore оставляет себе 5% (по запросу) или 1.25% (спот) от каждой аренды, плюс ещё 15%, если арендатор платит в BTC, USDT или USDC, а не в CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Выводите в разделе Account > Billing на собственный кошелёк: CLORE (ERC-20, минимум 200, комиссия около $0.50), BTC (минимум 0.0001, комиссия 0.00005 BTC) или USDT/USDC в Ethereum или BNB Chain (минимум $10, комиссия $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore хранит баланс (CLORE, BTC и один долларовый баланс для USDT/USDC), пока вы его не выведете. Сеть выбирается при каждом выводе: Ethereum для CLORE, Bitcoin для BTC, Ethereum или BNB Chain для USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (стандартный уровень) от комиссий платформы, которые платят приглашённые вами хосты и арендаторы, с каждой аренды; код бессрочный; выплачивается в валюте аренды (CLORE, BTC или USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps на загрузку и отдачу"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "Время вычислений на GPU вашей машины."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Да. Арендаторы запускают на вашей машине собственные Docker-контейнеры, и их трафик выходит через ваше подключение; порты SSH и приложений пробрасываются в интернет."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Политика конфиденциальности Clore охватывает данные аккаунта и ваш IP-адрес с приблизительным местоположением; документы, удостоверяющие личность, — только если Clore запросит KYC."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Входящие порты должны быть доступны из интернета (по умолчанию 22, 8080 и 3000-4000), а на вашей линии работают задачи посторонних людей. В собственном руководстве Clore по сети сказано, что некоторые интернет-провайдеры блокируют хостинг."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "Возраст от 18 лет, страна не под санкциями. Clore может приостановить или закрыть аккаунт исключительно по своему усмотрению, а запрещённое использование может стоить вам средств."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Ни в условиях, ни в политике конфиденциальности не указано юридическое лицо, а применимая юрисдикция в условиях отложена до следующей версии."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore может приостановить или закрыть аккаунт исключительно по своему усмотрению, а запрещённое использование может привести к конфискации средств."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Выплаты только в криптовалюте (CLORE, BTC, USDT или USDC), и Clore берёт дополнительные 15% с аренды, оплаченной арендатором в BTC, USDT или USDC, если только хост не заблокирует CLORE, чтобы снизить эту комиссию."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Хосту платят только за минуты аренды, а цифра Clore для RTX 4090 — это потолок («до ~$490/месяц») для одной карты."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "Для обычного использования KYC не нужен, но при крупных выводах или проверках на соответствие требованиям Clore может запросить подтверждение личности."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Арендаторы запускают на вашей машине любой публичный Docker-образ. В условиях перечислены запрещённые виды использования (вредоносное ПО, DDoS, CSAM и другие), но описания того, как проверяют арендаторов, мы не нашли."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot не запускает Clore.ai: вы устанавливаете агент хостинга Clore на собственную машину с GPU (Ubuntu 22.04 или новее, или HiveOS), поэтому CashPilot не может развернуть или обновить его за вас."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Если арендатор платит в CLORE, Clore оставляет себе 5% от аренды по запросу (1.25% на споте) без дополнительной комиссии."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN управляет сетью валидаторов, которая проверяет трафик и покрытие для ИИ-инфраструктуры, финансируемой через протокол DAWN. Браузерное расширение DAWN Validator участвует в этих проверках трафика (proof-of-bandwidth) и покрытия и, пока работает, зарабатывает вознаграждения DAWN. У этих вознаграждений пока нет устоявшейся денежной стоимости. Создайте аккаунт в расширении и, когда оно попросит, введите реферальный код 2QLQV97F.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "Валидатор DePIN — браузерное расширение зарабатывает очки DAWN"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "До запуска токена начисляются Dawn Points. Реальная стоимость зависит от будущей цены токена. Аппаратное устройство зарабатывает больше, чем браузерное расширение."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Аирдроп токенов (дата будет объявлена)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "Расширение работает, но сырое. Анонсировано устройство Black Box. Проверьте позже."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "Расширение зарабатывает очки; к октябрю 2026 года распределение токенов операторам узлов подтверждено не было."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "У очков нет устоявшейся стоимости, пока не запущен токен и не объявлен курс их обмена."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot не запускает Dawn: вы пользуетесь собственным браузерным расширением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network — проект децентрализованного VPN и web3-инфраструктуры. В основном требует фирменных аппаратных устройств Deeper Connect. Moken — связанная с ним платформа для майнинга и стейкинга. Работать только программно нельзя.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "Децентрализованный VPN — нужно фирменное устройство"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Нужно устройство Deeper Connect ($200-500). Платформа Moken для майнинга и стейкинга. Работать только программно нельзя."
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "Непрерывно"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "Комиссия с продажи устройства"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "Скидка 5% на устройство Deeper Connect по купону SERGIO"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "Вознаграждения за майнинг начисляются в DPR и зависят от кредитного рейтинга, который растёт медленно или за счёт стейкинга DPR."
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot не запускает Deeper Network: вы пользуетесь собственным роутером провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "b1ba1636070f"
earnapp.description:
  text: "EarnApp от Bright Data позволяет продавать неиспользуемый трафик и получать пассивный доход. Bright Data — крупнейшая в мире прокси-сеть, которая обеспечивает сбор данных для компаний из Fortune 500. CashPilot запускает его из собственного образа: при первом запуске тот скачивает закреплённую сборку EarnApp с CDN Bright Data, проверяет её sha256 и запускает в облегчённом режиме, которому нужен только UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Обмен трафиком — при поддержке Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "UUID узла"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "ID вашего узла EarnApp: sdk-node- и затем 32 шестнадцатеричных символа в нижнем регистре, как его выводит 'earnapp showid'. После развёртывания один раз привяжите его, открыв https://earnapp.com/r/ и добавив к нему этот UUID, под своим аккаунтом EarnApp; непривязанный узел зарабатывает, но на ваш баланс ничего не поступает"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp постоянно не может связаться со своими серверами и перезапускается, поэтому зарабатывает мало или ничего. Перезапустите эту копию; если это повторяется, проверьте интернет-подключение этой машины."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Откройте эту ссылку под своим аккаунтом EarnApp, чтобы добавить узел в аккаунт. Пока вы этого не сделаете, узел зарабатывает, но на ваш баланс ничего не поступает."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Сильно зависит от местоположения. Больше всего зарабатывают IP из США и ЕС. Заработок растёт с объёмом использованного трафика."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "По запросу (доступен автовывод: PayPal от $10, Wise от $10, Amazon от $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Один раз включите автовывод, и EarnApp будет сам платить каждый раз, когда баланс достигает минимума для выбранного способа: PayPal $10, Wise $10, Amazon $50. Платежи PayPal приходят от Bright Data Ltd. В октябре 2026 года платёж PayPal пришёл примерно на 2% меньше выведенного баланса."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Баланс хранится у EarnApp; выводится на Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Войдите на <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, нажмите F12 → Application → Cookies и скопируйте значение <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% их заработка пожизненно, сверх их собственного"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "В справочном центре EarnApp сказано, что устанавливать его в Docker-контейнерах, виртуальных машинах, на хостинге или домашних серверах строго запрещено, а CashPilot запускает его именно так."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "В той же статье справки сказано, что аккаунт, замеченный в такой работе, закрывается без предупреждения, а его ожидающие выплаты отменяются."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Наша выплата через PayPal пришла в октябре 2026 года, примерно на 2% меньше выведенного баланса."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "Минимум $10 для PayPal и Wise, есть автовывод, который выплачивает сам."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp принадлежит Bright Data, и его платежи PayPal приходят от Bright Data Ltd., названной компании."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm платит вам за то, что вы делитесь интернет-трафиком. Сборщик заработка входит по эл. почте и паролю через Supabase. Лёгкий Docker-образ и простое развёртывание (Docker-клиент использует отдельный UUID-токен).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "Обмен трафиком — вход по эл. почте и паролю, лёгкий клиент"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "API-ключ"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "Войдите на <a href=\"https://app.earn.fm\">app.earn.fm</a> → нажмите на значок профиля (справа вверху) → Account Settings → скопируйте API Key (в формате UUID)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "Относительно новая платформа. Заработок зависит от местоположения и доступности трафика."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "Минимум $15. Способы: USDT в BEP20 или Polygon (комиссия $1) или TRC20 (комиссия $3), PayPal, подарочные карты Amazon или Starbucks от $15 или банковский перевод от $1 000 за вычетом комиссий за перевод. Перед первой выплатой вы заполняете платёжный профиль (полное имя и адрес), который используется для квитанций о выплатах."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "Баланс хранится у Earn.fm; выводится по запросу."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Используйте эл. почту и пароль аккаунта Earn.fm (те же, что для входа на <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10% их заработка пожизненно"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "Стартовый баланс $5"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "Минимум $15, комиссия от $1 до $3 на USDT, а банковский перевод — только от $1 000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Перед первой выплатой вы заполняете платёжный профиль, указав полное имя и адрес."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Обозреватели в 2025 году сообщают, что поддержка по эл. почте и в Discord не отвечает; на Trustpilot отмечено, что Earn.fm не отвечает на негативные отзывы."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Earn.fm публикует собственный Docker-образ, earnfm/earnfm-client."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher — платформа обмена трафиком, где вы зарабатываете кредиты, посещая сайты через автоматический сёрфбар. Работает как браузерное расширение (аддон). Это не обычный сервис обмена трафиком (bandwidth sharing): он создаёт трафик, автоматически просматривая сайты.\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "Сёрфбар для обмена трафиком — браузерное расширение"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "Заработок начисляется в очках BTP, которые можно обменять на EUR. Только браузерное расширение."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "Выплата в евро через PayPal или банковский перевод."
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "CashPilot не запускает eBesucher: это браузерное расширение, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "Выплаты от 2 евро через PayPal или SEPA, не реже раза в неделю, без комиссии."
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "eBesucher работает с 2002 года."
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "В выходных данных (Impressum) указан оператор — TurboAd GmbH, зарегистрированная в Berlin-Charlottenburg (HRB 160730 B)."
  source: "84cbddd4330b"
flux.description:
  text: "Flux — глобально распределённая вычислительная инфраструктура. Операторы узлов стейкают токены FLUX и предоставляют ресурсы серверов. Три уровня: Cumulus (1 000 FLUX), Nimbus (12 500 FLUX), Stratus (40 000 FLUX). Есть официальные Docker-образы.\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "Децентрализованные вычисления — нужен стейк токенов FLUX"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "Нужен стейк от 1 000 FLUX (~$50-500 в зависимости от цены). Более высоким уровням нужен больший залог, но и зарабатывают они больше."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "Вознаграждения за блоки"
  source: "590433237f8a"
flux.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "Самому маленькому уровню узла нужно 1 000 FLUX, заблокированных в качестве залога."
  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "Вознаграждение за блок каждый год снижается на 10%, а в руководстве 2026 года вознаграждения на младшем уровне в долларах названы слабыми."
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "CashPilot не запускает Flux: вы пользуетесь собственной программой узла от провайдера, поэтому CashPilot не может развернуть или обновить её за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "Демон Flux — открытое ПО под лицензией MIT."
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network — децентрализованная площадка вычислений, где вы делитесь ресурсами CPU и GPU в обмен на токены GLM. Провайдеры запускают агент Yagna, который выполняет задачи в изолированных средах (песочницах). Один из старейших проектов децентрализованных вычислений (основан в 2016 году). Поддерживает задачи на CPU, рендеринг на GPU и вычисления общего назначения. Платежи через Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Децентрализованная площадка вычислений — токены GLM через агент Yagna"
  source: "88f817c25848"
golem.earnings.notes:
  text: "Заработок зависит от оборудования, цен и спроса на задачи. Узлы только с CPU зарабатывают меньше. Узлы с GPU зарабатывают больше, но им нужна NVIDIA. Запускайте агент провайдера Yagna (не Docker-образ). Платежи в Polygon в токенах GLM."
  source: "07287d437d51"
golem.payment.frequency:
  text: "По завершении каждой задачи"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "Начисляются токены GLM. Кошелёк для выплат настраивается при настройке провайдера."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot не запускает Golem: вы сами устанавливаете агент провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Golem описывает запуск провайдера в собственном Docker-образе."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "Агент провайдера, yagna, — открытое ПО под лицензией GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Аккаунт не нужен: кошелёк для выплат указывается при настройке провайдера."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "Сеть работает около десяти лет."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "В политике конфиденциальности Golem указан оператор — Golem Factory GmbH в Цуге, Швейцария."
  source: "bae79b651923"
grass.description:
  text: "Grass — децентрализованная сеть, через которую вы продаёте неиспользуемый трафик для данных обучения ИИ. Работает как браузерное расширение и десктопное приложение, пропуская через ваше подключение запросы веб-скрейпинга для сбора структурированных датасетов. С 8.5M+ пользователей это одна из крупнейших DePIN-сетей обмена трафиком. Зарабатывает токены GRASS в блокчейне Solana.\n"
  source: "046951d812f9"
grass.short_description:
  text: "DePIN-обмен трафиком для данных ИИ — зарабатывает токены GRASS"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Токен доступа"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Войдите на <a href=\"https://app.grass.io\">app.grass.io</a>, нажмите F12 → Application → Local Storage → нажмите <code>https://app.grass.io</code> → скопируйте значение <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Начисляются Grass Points, которые обмениваются на токены GRASS через аирдропы. Реальная стоимость в USD зависит от цены токена. Нужно браузерное расширение или десктопное приложение."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Аирдроп по эпохам"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Вознаграждения приходят периодическими распределениями, которые нужно получить в панели Grass. Распределение Stage 2 (активность с октября 2024 по июнь 2026 года) выплачивается в USDC: получите его на app.grass.io/dashboard не позднее 22 января 2027 года или раньше, если все доли будут разобраны до этого срока. Неполученные вознаграждения Grass оставляет себе."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "Начисляются ОЧКИ; GRASS получают в панели Grass во время периодических аирдропов."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Войдите на <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, нажмите F12 → Application → Local Storage и скопируйте значение <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% очков за время работы от прямых рефералов, 10% на втором уровне, 5% на третьем"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Получите свои USDC за Grass Stage 2"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Grass оставляет себе каждую долю Stage 2, не полученную не позднее 22 янв. 2027 года, а окно может закрыться и раньше, если все доли будут разобраны."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Войдите на app.grass.io под аккаунтом, который вы использовали в Stage 2, активируйте Grass Wallet, откройте вкладку Allocation и подтвердите. Получайте только на app.grass.io. Нет очков Stage 2? Выберите «Не для меня»."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Вознаграждения приходят только через сезоны аирдропов. Давние операторы узлов сообщали, что оценки за второй сезон составляли от нескольких долларов до пары десятков."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "Вознаграждения второго сезона, не полученные не позднее 22 января 2027 года, теряются навсегда."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "Первый аирдроп вызвал волну недовольства из-за маленьких вознаграждений за очко, размытых между более чем двумя миллионами пользователей."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot не запускает Grass: вы пользуетесь собственным приложением или расширением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "В первом аирдропе награду получили почти 1.5 миллиона адресов."
  source: "a4c55e10affa"
helium.description:
  text: "Helium — давно существующая децентрализованная беспроводная сеть. Изначально это были хотспоты LoRaWAN, теперь сеть расширилась до 5G. Нужно специальное оборудование ($500+). Зарабатывает токены HNT/MOBILE. Окупаемость сильно упала — обычно $4-8 в месяц.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "Децентрализованная беспроводная сеть — нужно оборудование, токены HNT"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "Нужно купить оборудование за $500+. Окупаемость сильно упала. Для новых операторов есть процедура одобрения."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "По эпохам"
  source: "75743e03bad2"
helium.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149 отменил вознаграждения Proof-of-Coverage 6 июля 2026 года; IoT-хотспоты теперь зарабатывают только за передаваемые данные, а более 114 000 из них не передали ничего."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Модель вознаграждений Helium несколько раз менялась голосованием, его CEO ушёл в отставку, а HNT упал примерно на 96%."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot не запускает Helium: вы пользуетесь собственным хотспотом провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "Программа шлюза хотспота — открытое ПО под лицензией Apache-2.0."
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "Отслеживайте невыплаченный баланс Kaspa, который HeroMiners хранит для вашего публичного адреса выплат. Запустите собственный майнер Kaspa и направьте его на пул. CashPilot считывает баланс пула и просит вас подтвердить выплаты, когда баланс уменьшается.\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
  text: "Майнинг-пул Kaspa, отслеживается по адресу выплат"
  source: "92c5784dcf30"
herominers-kas.payment.minimum_payout:
  text: "1 KAS (настраивается)"
  source: "d33ca7065ff9"
herominers-kas.payment.frequency:
  text: "Пул проверяет ваш порог выплаты каждый час"
  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "HeroMiners автоматически платит на ваш адрес, как только вы достигнете выбранного порога. Минимальный порог — 1 KAS.\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "Баланс накапливается на HeroMiners. Прежде чем подтвердить выплату в CashPilot, проверьте в кошельке полученную сумму.\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "Введите полный публичный адрес выплат Kaspa, который ваш майнер использует на HeroMiners. Укажите префикс <b>kaspa:</b> и не указывайте имя воркера.\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "Нужен майнер Kaspa, направленный на HeroMiners"
  source: "898e36e7a701"
herominers-kas.disclosure.sells:
  text: "вычисления"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "Нет. Ваш майнер отправляет пулу результаты майнинга."
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "В публичной статистике пула видны все адреса выплат и их майнинговая активность."
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "Вместо аккаунта пул использует ваш адрес выплат."
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "Пул берёт комиссию 0.9% и не выплачивает средства, пока не достигнут ваш порог."
  source: "7eb2950589fa"
honeygain.description:
  text: "Делитесь неиспользуемым интернет-трафиком и получайте пассивный доход. Honeygain пропускает через ваше подключение трафик веб-аналитики, доставки контента и маркетинговых исследований. Одна из самых давних платформ обмена трафиком: 12M+ пользователей и более 1M проведённых выплат.\n"
  source: "b219f969ba34"
honeygain.short_description:
  text: "Обмен трафиком — самая давняя платформа"
  source: "c0542c471f29"
honeygain.docker.env.HONEYGAIN_EMAIL.label:
  text: "Эл. почта"
  source: "969ccbd3cf63"
honeygain.docker.env.HONEYGAIN_PASSWORD.label:
  text: "Пароль"
  source: "e7cf3ef4f17c"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.label:
  text: "Имя устройства"
  source: "155106be1173"
honeygain.docker.env.HONEYGAIN_EMAIL.description:
  text: "Эл. почта вашего аккаунта Honeygain"
  source: "482869cea18f"
honeygain.docker.env.HONEYGAIN_PASSWORD.description:
  text: "Пароль вашего аккаунта Honeygain"
  source: "f3ba1584b384"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.description:
  text: "Имя, которое отображается в вашей панели Honeygain"
  source: "a3ba173cae35"
honeygain.earnings.notes:
  text: "Зависит от местоположения. IP из США и ЕС зарабатывают больше. Не более 10 устройств на аккаунт."
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "Минимум $20 (20 000 кредитов). Два варианта: PayPal через Tipalti с комиссией около 15% или кредиты JumpTask без комиссии, которые зачисляются на кошелёк JumpTask. Для запроса нужен 6-значный код, отправленный по эл. почте. Первая выплата через PayPal остаётся в статусе «waiting for details», пока вы не зарегистрируетесь в Tipalti по ссылке из их письма. Ссылка срабатывает только один раз, поэтому открывайте её, когда сможете закончить за один подход и телефон будет под рукой: после установки пароля Tipalti попросит подтвердить номер мобильного по SMS (коды истекают за несколько минут), затем запросит имя, адрес, страну, дату рождения и ваш адрес PayPal. Tipalti берёт $2.02 за каждый платёж; выберите USD, чтобы избежать комиссии за конвертацию валюты 1.9-3%. Платёж поступает в течение 2 рабочих дней. Баланс списывается с вашего аккаунта сразу после запроса, даже пока выплата ждёт Tipalti. При каждом следующем входе в Tipalti приходит новый SMS-код, если вы не отметите опцию запомнить устройство на 30 дней. В октябре 2026 года Tipalti не запросил налоговую форму у получателя в Испании."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Баланс хранится у Honeygain; выводится по запросу."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Используйте эл. почту и пароль аккаунта Honeygain (те же, что и на <a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a>)."
  source: "fd0be22aeb14"
honeygain.referral.bonus.referrer:
  text: "До 25% заработка каждого приглашённого друга в режиме Honeygain"
  source: "30385153a66b"
honeygain.referral.bonus.referee:
  text: "Бонус за регистрацию $3 по этой ссылке"
  source: "9ee5d2215305"
honeygain.obligations.withdraw-before-24-month-write-off.title:
  text: "Выведите баланс Honeygain"
  source: "0868662c5a12"
honeygain.obligations.keep-active-6-months.title:
  text: "Держите устройство Honeygain в работе или сделайте выплату"
  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "Заработок остаётся действительным 24 месяца после того, как достигнет минимума $20. После этого Honeygain может списать то, что не было выплачено."
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
  text: "Если приложение не используется более 6 месяцев, Honeygain считает невыплаченный баланс просроченным, даже если он меньше $20."
  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "Держите устройство в работе или запросите выплату. В режиме JumpTask баланс, который не меняется, — это нормально, поэтому выберите «Не для меня»."
  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "Условия позволяют Honeygain списывать заработок, который достиг порога $20 и не был выплачен в течение 24 месяцев, и считать заработок просроченным после шести месяцев без использования."
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "Минимум — $20, а выплаты PayPal идут через Tipalti, который берёт $2.02 за каждый платёж."
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "Условия позволяют Honeygain заблокировать аккаунт и удержать или списать заработок, который, по его мнению, накоплен обманным путём."
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "Перед первой выплатой через PayPal Tipalti просит подтвердить номер мобильного по SMS и указать имя, адрес и дату рождения."
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "В условиях сказано, что бизнес-клиенты используют трафик для сбора общедоступных веб-данных, но ни один клиент не назван, и вы не можете знать, какой клиент использует ваше подключение."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "В собственных ответах Honeygain на отзывы о низком заработке сказано, что заработок зависит от спроса в сети и местоположения; авторы отзывов сообщают, что минимума $20 приходится достигать очень долго."
  source: "634fb331e65b"
honeygain.rating.pros.0.text:
  text: "Honeygain публикует собственный Docker-образ, honeygain/honeygain."
  source: "ea44bd3c855c"
honeygain.rating.pros.1.text:
  text: "В условиях указан оператор — Honeygain UAB, зарегистрированная в Вильнюсе, Литва."
  source: "579a169fcf35"
honeygain.rating.pros.2.text:
  text: "На странице для прессы Honeygain сказано, что компания основана в 2019 году."
  source: "a3bfbdb33f54"
ionet.description:
  text: "io.net — децентрализованная сеть GPU для задач ИИ/ML. Объединяет простаивающие GPU пользователей и дата-центров. Для заметного заработка нужен GPU NVIDIA с 8GB+ VRAM. Поддерживается развёртывание в контейнерах.\n"
  source: "5d017f77f0ac"
ionet.short_description:
  text: "Децентрализованная сеть GPU для ИИ — нужен GPU NVIDIA"
  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "Нужен GPU NVIDIA с 8GB+ VRAM. Для RTX 4090 заявляют $500-1000 в месяц (на практике, скорее всего, меньше)."
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "По эпохам"
  source: "75743e03bad2"
ionet.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "Вознаграждения поставщикам выплачивались из эмиссии токенов независимо от оплаченных задач, а владельцы GPU сообщают, что их карты большую часть времени простаивают."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "Вознаграждения начисляются в токене IO, а в 2026 году модель выплат сменилась на механизм с привязкой к доллару."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "В апреле 2024 года около 1.8 миллиона поддельных GPU пытались подключиться через утёкший токен аутентификации, а позже, перед запуском токена, CEO ушёл в отставку."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "CashPilot не запускает io.net: вы пользуетесь собственной программой воркера от провайдера, поэтому CashPilot не может развернуть или обновить её за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "1cac289c99ad"
iproyal.description:
  text: "IPRoyal Pawns позволяет зарабатывать, делясь неиспользуемым трафиком. IPRoyal — давно известный прокси-провайдер, а Pawns — его подразделение по обмену домашним трафиком. CLI Docker-образ принимает учётные данные через флаги командной строки. Новый пользователь, зарегистрировавшийся по реферальной ссылке, получает по $1 к каждой из первых трёх выплат, всего до $3. Каждая выплата должна произойти в пределах окна от одной до трёх недель, которое зависит от местоположения. Окно начинается при регистрации и начинается заново после каждой выплаты. Если окно закроется раньше, оставшиеся бонусы пропадают.\n"
  source: "b12878d5917a"
iproyal.short_description:
  text: "Обмен трафиком — бонус до $3 к первым выплатам"
  source: "20091c7b26ed"
