passiveapp.description:
  text: "PassiveApp — DePIN-платформа, на которой можно получать вознаграждения в криптовалюте и через PayPal, делясь неиспользуемым трафиком и вычислительными ресурсами. На практике только Windows: на собственной странице загрузки разработчика Android, iOS и Linux значатся как «coming soon» без изменений как минимум с февраля 2025 года, а версии для macOS нет — хотя рекламные тексты на том же сайте заявляют более широкую поддержку. Docker-образа нет.\n"
