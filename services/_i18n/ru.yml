iproyal.docker.health_signals.1.means:
  text: "Pawns видит на этом IP-адресе другое активное устройство и платит только за одно на IP, поэтому эта копия работает, но ничего не передаёт и ничего не зарабатывает. Остановите все остальные приложения Pawns на этом IP — на другой машине, ПК или телефоне. Если таких нет, подождите, пока Pawns отключит старое устройство, или попросите поддержку Pawns освободить его."
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "Заработок зависит от местоположения и использования трафика. Домашние IP из США и ЕС зарабатывают больше."
