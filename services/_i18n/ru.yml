mysterium.description:
  text: "MystNodes (Mysterium Network) — децентрализованная сеть VPN и прокси на основе технологии блокчейн. Вы зарабатываете токены MYST, запуская узел, который предоставляет пользователям услуги VPN, прокси и сбора данных. Нужны возможности (capabilities) NET_ADMIN, SETUID и SETGID и устройство TUN, которое он использует внутри собственного сетевого пространства имён на огороженном барьером мосту приложений для заработка. Есть встроенный веб-интерфейс для управления узлом. Работает и на домашних подключениях, и на VPS, но реферальный бонус выплачивается только за узлы на домашнем IP.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Узел децентрализованного VPN — на основе блокчейна, работает на VPS"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "Адрес WebUI"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "Диапазон портов UDP"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "Адреса хоста, на которых публикуется WebUI узла (порт 4449). 127.0.0.1 оставляет его доступным только на этой машине. Чтобы открывать его через обратный прокси, добавьте адрес, к которому подключается прокси, через запятую без пробелов: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "UDP-порты, которые узел использует для VPN-сессий, в формате start:end. Пробросьте на роутере этот же диапазон. Каждая сессия занимает около двух портов, поэтому 30 портов по умолчанию выдерживают около 15 сессий одновременно — больше, чем получает домашний узел. Более широкий диапазон ничего не исправит и обойдётся дороже: каждый опубликованный порт замедляет запуск и удаление узла (300 портов запускаются около 12 с), CashPilot принимает не более 300, а со стандартным userland proxy Docker каждый порт ещё и занимает около 2.5 MB памяти. Если все сессии завершаются ошибкой, дело в роутере, а не в нехватке портов: см. «Routers that rewrite UDP source ports» в руководстве по Mysterium. Держите диапазон ниже 32768: порты 32768-60999 — это эфемерный диапазон Linux, где любая программа на хосте может ненадолго занять порт, а один занятый порт срывает запуск узла. Узел, у которого диапазон уже задан, сохраняет его."
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "Хранилище ключей идентификатора узла. Если его уничтожить, будет создан совершенно новый идентификатор: узел потеряет репутацию и весь заработок, который ещё числится за старым."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "Узел не может выполнить sudo внутри своего контейнера, поэтому не может настроить VPN-интерфейс и файрвол, и каждая сессия срывается на этапе настройки: узел выглядит работающим, но ничего не зарабатывает. Контейнер был создан без возможностей SETUID и SETGID. Обновите CashPilot и воркер, на котором работает этот узел, затем переразверните Mysterium из панели; идентификатор узла хранится в его томе данных и сохранится."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "За последние 6 часов ни одна VPN-сессия не подключилась к этому узлу напрямую. Все перешли на hole punching, а многим покупателям так подключиться не удаётся, поэтому узел зарабатывает меньше. Его UDP-порты недоступны из интернета. На роутере пробросьте диапазон UDP-портов ${UDP_PORTS} (start:end, один и тот же диапазон с обеих сторон) на ${HOST_ADDRESS}. Предупреждение исчезнет само, как только какая-нибудь сессия подключится напрямую."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Мониторинг Mysterium помечает узел на ${WORKER_NAME} как неработающий, поэтому его нет в списке узлов, из которого выбирает большинство покупателей, даже если собственная проверка узла говорит, что все порты доступны. Сначала убедитесь, что у узла есть /dev/net/tun и SETUID/SETGID: без них он ломается так же: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Если с этим всё в порядке, частая причина — роутер перед ${WORKER_NAME}, который переписывает UDP-порт источника в ответах узла, как только на этот порт пришёл пакет извне. См. тест в руководстве: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "Каждая из последних пяти VPN-сессий узла на ${WORKER_NAME} завершилась примерно через минуту, не передав данных, поэтому узел ничего не зарабатывает, хотя выглядит работающим. Вероятная причина — роутер перед ${WORKER_NAME}: как только пакет извне доходит до порта, роутер переписывает порт источника в последующих ответах узла с этого порта, а каждая сессия начинается именно с такого пакета (собственной проверки портов узла), поэтому покупатели отбрасывают ответы узла. Более широкий диапазон портов не поможет. См. тест и способы исправления в руководстве: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Предупреждение исчезнет, когда какая-нибудь сессия передаст данные."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Заработок в токенах MYST. Домашние IP зарабатывают значительно больше. Для управления есть WebUI узла на порту 4449; по умолчанию он опубликован только на той машине, где работает узел (127.0.0.1). С другой машины сначала откройте SSH-туннель (ssh -L 14449:127.0.0.1:4449 и адрес машины узла, затем откройте в браузере http://127.0.0.1:14449; локальный порт 14449 выбран, чтобы не конфликтовать с узлом на вашей собственной машине) или добавьте адрес в UI_ADDRESS (см. «WebUI address» в руководстве по Mysterium). VPS принимаются. Настоятельно рекомендуется проброс портов UDP 23000-23029 (значение UDP_PORTS по умолчанию) — без него узлы получают статус Strict NAT, и многие VPN-сессии срываются, что сильно снижает доход. Важно: после первого запуска укажите через WebUI узла или CLI кошелёк получателя (для расчётов), совпадающий с вашим аккаунтом mystnodes.com, — так ончейн-заработок будет привязан к вашей облачной панели."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Автоматический ончейн-расчёт каждый раз, когда у узла накапливается 5 MYST без расчёта"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Нажимать ничего не нужно. Каждый узел сам проводит расчёт в Polygon, как только у него накапливается 5 MYST без расчёта, и около 21% уходит на комиссии (комиссия Hermes 20% плюс небольшая комиссия за транзакцию), так что за один расчёт на кошелёк получателя приходит примерно 3.9 MYST. TequilAPI каждого узла показывает его расчёты по адресу /transactor/settle/history. Цифра «total earnings» на MystNodes охватывает только последние 30 дней; это не баланс и не заработок за всё время. Бонусные MYST из программы вознаграждений MystNodes сами не зачисляются: получите их на странице Rewards в течение 30 дней после распределения, как сказано в справочном центре MystNodes."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "Кошелёк получателя указывается ПОСЛЕ развёртывания, через TequilAPI или WebUI узла, — не через переменную окружения, поэтому его нельзя прочитать из спецификации контейнера."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Используйте эл. почту и пароль аккаунта MystNodes (те же, что и на <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST за каждого друга, чей узел заработает 5 MYST (только домашние IP)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST, когда ваш узел заработает первые 5 MYST (домашний IP, узел привязан на mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Получите вознаграждения MystNodes за прошлый месяц"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Вознаграждения, не полученные в течение 30 дней после ежемесячного распределения, сгорают и возвращаются в пул следующего месяца."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Откройте страницу Rewards и обменяйте свои очки на MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Трафик. Ваше подключение используется как выходной узел сети Mysterium, которая продаёт услуги VPN, прокси И сбора данных (скрейпинга). Трафик скрейпинга с домашнего IP чаще всего вызывает жалобы, и вы не можете выбрать, какой из трёх видов трафика проходит через ваш узел."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Да. Посторонние люди пропускают свой трафик через ваш IP-адрес — в этом и состоит продукт."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "Идентификатор узла (адрес в блокчейне), ваш IP и приблизительное местоположение (страна/город/интернет-провайдер), которые узел публикует в сети, чтобы покупатели могли его выбрать."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Реальный, и его стоит понимать. Трафик других людей выходит через ваше подключение и приписывается вам, поэтому всё, что они делают, выглядит так, будто исходит с вашей линии. Многие договоры с домашними интернет-провайдерами это запрещают. Проверьте свой, прежде чем запускать."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Без ограничения числа устройств на аккаунт и на IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Около 21% каждого расчёта уходит на комиссии (комиссия Hermes 20% плюс комиссия за транзакцию), а заработок выплачивается в токене MYST."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Ваш узел служит выходом для клиентов Mysterium, покупающих VPN, прокси и сбор данных, и вы не можете выбрать, чей трафик он передаёт."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "Программа узла — открытое ПО под лицензией GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium публикует собственный Docker-образ, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "Расчёты идут на ваш собственный кошелёк; номер телефона или документы не нужны."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "Проект узла работает с 2017 года."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "На сайте Mysterium сказано, что сеть разрабатывает Blockdev AG, Цуг, Швейцария."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay — DePIN-сеть, которая вознаграждает пользователей за обмен трафиком через браузерное расширение. Платформа защищена Cloudflare, что может затруднять автоматический доступ. Пользователи зарабатывают Nodepay Points, пока расширение активно. Сеть ориентирована на инфраструктуру данных для обучения ИИ.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "DePIN-обмен трафиком для ИИ — браузерное расширение"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Начисляются Nodepay Points; очки пользователей, прошедших проверки соответствия Nodepay, конвертируются в токен NC. Защита Cloudflare может блокировать автоматический сбор. Нужно браузерное расширение."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Аирдроп токена NC (сроки не подтверждены)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Система на очках. Очки пользователей, прошедших проверки соответствия Nodepay, конвертируются в токен NC, запущенный в январе 2025 года."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "По итогам первого сезона Nodepay удалил более 300 000 аккаунтов, которые счёл ботами, и аннулировал 17 миллиардов очков."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Вознаграждения — это очки, конвертируемые в токен NC, поэтому их стоимость зависит от токена."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot не запускает Nodepay: вы пользуетесь собственным браузерным расширением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes — бесплатный начальный уровень Noderr Protocol, DeFi-проекта в Base L2. Микроузел — это небольшой агент на запасном телефоне Android, ПК с Windows, Mac или в браузере Chromium. На Android он делится мобильным подключением телефона: чужой трафик Noderr выходит через IP мобильного оператора, поэтому нужна SIM-карта с мобильным интернетом. На ПК или в браузере он выполняет задачи автоматизации для протокола, используя свободные вычислительные ресурсы. По замыслу вознаграждения выплачиваются в NODR с учётом ончейн-оценки времени работы и надёжности, но на время беты сеть работает в тестнете Base Sepolia: вознаграждения узлам не обеспечены средствами, и пока ни одно не выплачено.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Бесплатный микроузел (обмен подключением на Android, Windows, Mac, браузер) — тестнет, вознаграждения пока не обеспечены"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Бета в тестнете: вознаграждения узлам не обеспечены средствами, и пока ни одно не выплачено. 5-10% APY на сайте — это целевой показатель по замыслу. Вернитесь к этому, когда сеть уйдёт из Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Вознаграждения начисляются на собственный кошелёк узла, и их получают в приложении или dApp. Во время беты это тестовые токены Base Sepolia без рыночной стоимости."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "При первом запуске приложение создаёт кошелёк узла и выпускает на него бесплатный soulbound Utility NFT. Сделайте резервную копию кошелька в приложении: потеряв устройство, вы потеряете идентификатор узла. Во время беты вознаграждения начисляются в Base Sepolia (тестнет)."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Для Android нужна SIM-карта с мобильным интернетом; для десктопного и браузерного клиентов требования к IP не опубликованы."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Зависит от устройства. Телефон Android продаёт своё мобильное подключение: чужой трафик Noderr выходит через IP-адрес мобильного оператора телефона и расходует его тарифный пакет. ПК с Windows, Mac или браузер продают свободные вычислительные ресурсы для задач, которые провайдер называет автоматизацией соцсетей и контента."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Да. На Android чужой трафик Noderr выходит через мобильный IP-адрес вашего телефона; перед запуском приложение запрашивает согласие и сохраняет его, а прекратить обмен можно на том же экране. Для клиентов Windows, Mac и браузера провайдер описывает задачи автоматизации и не говорит, передают ли они трафик других людей."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "Адрес кошелька узла и показатели времени работы и выполнения задач записываются в блокчейн как оценка репутации (TrustFingerprint). Провайдер утверждает, что задачи анонимизированы и выполняются в песочнице, а ключи кошелька никогда не покидают устройство. Ничего более конкретного не опубликовано."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "На Android общим подключением служит мобильный тариф оператора: в собственной документации провайдера предупреждается, что правила допустимого использования некоторых операторов могут запрещать обмен, а передаваемый трафик расходует пакет тарифа. О условиях интернет-провайдеров для десктопного и браузерного клиентов провайдер ничего не говорит."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Один узел на устройство, у каждого свой soulbound Utility NFT; запускать несколько устройств разрешено и даже поощряется. Лимит на IP не опубликован. Аккаунта в обычном смысле нет: идентификатор — это кошелёк, который приложение создаёт при первом запуске."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Вознаграждения узлам — тестовые токены без обеспечения и без рыночной стоимости, и ни одно ещё не выплачено; 5-10% APY на сайте — это целевой показатель по замыслу."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Для десктопного и браузерного клиентов Noderr описывает задачи автоматизации и не говорит, передают ли они трафик других людей."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Провайдер утверждает, что задачи анонимизированы и выполняются в песочнице, но ничего более конкретного не публикует."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Всё ещё бета в тестнете Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot не запускает Noderr: вы пользуетесь собственным приложением или расширением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Аккаунт не нужен: приложение создаёт кошелёк при первом запуске."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle использует Bluetooth смартфона для создания IoT-инфраструктуры. Приложение в фоне обнаруживает ближайшие IoT-устройства и передаёт их данные, зарабатывая токены NODL. О нём писал Forbes, есть корпоративные партнёрства с Vivendi и Hayden AI. Только для мобильных (iOS и Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Ретранслятор Bluetooth IoT — мобильное приложение, вознаграждения в токенах NODL"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Очень низкий заработок. Фоновое приложение для телефона, использующее Bluetooth. Подключение кошелька может работать нестабильно."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Непрерывно"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL хранятся в собственном кошельке приложения в ZKsync Era; проверить их можно в приложении или в обозревателе блоков ZKsync Era. Nodle ушёл со своего парачейна Polkadot, а мост Polkadot-ZKsync закрылся 31 декабря 2025 года, поэтому NODL, оставшиеся на стороне Polkadot, больше нельзя перевести в ZKsync."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "Ваши NODL хранятся в собственном кошельке приложения Nodle в ZKsync Era. CashPilot не видит адрес этого кошелька."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "Вознаграждение в NODL за каждого нового активного пользователя, присоединившегося по приглашению (Nodle не публикует сумму)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Один из авторов отзывов сообщает, что заработал около $3 за три-четыре года; другие сообщают о резком падении дневного заработка."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot не запускает Nodle: вы пользуетесь собственным мобильным приложением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana — децентрализованная площадка вычислений на GPU, построенная на Solana. Она связывает владельцев GPU со спросом на задачи ИИ и платит в токенах NOS. RTX 3060 зарабатывает примерно $0.048/ч. Платформа ориентирована на задачи инференса ИИ и использует блокчейн Solana для планирования задач и расчётов по платежам. Узлы выполняют задачи в контейнерах через Nosana CLI.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Вычисления на GPU в Solana — токены NOS, RTX 3060 ~$0.048/ч"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/ч, более мощные GPU зарабатывают больше. Заработок зависит от наличия задач и модели GPU. Нужны GPU NVIDIA, Linux, Docker и Nosana CLI. Платежи в токене NOS в Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "По завершении каждой задачи"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Заработанные токены NOS в Solana. Выплата на настроенный кошелёк."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "По умолчанию Nosana создаёт кошелёк Solana, поэтому большинство пользователей ни разу не видели его адреса."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Каждый хост должен заблокировать стейк NOS, размер которого зависит от почасовой цены его GPU."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Хостам платят в NOS, поэтому заработок в долларах меняется вместе с токеном и спросом на их карту."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot не запускает Nosana: вы пользуетесь собственной программой хоста от провайдера, поэтому CashPilot не может развернуть или обновить её за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN — майнинг-пул Bitcoin без аккаунта: ваш майнер входит, указывая ваш адрес Bitcoin в качестве имени пользователя, и пул платит на этот адрес. CashPilot здесь не запускает майнер. Он считывает невыплаченный баланс, который OCEAN хранит для вашего адреса, чтобы вы видели заработок своего ASIC (Bitaxe, Antminer) рядом с другими доходами. Невыплаченный баланс заработан, но не получен: OCEAN выплачивает его ончейн, как только он превысит порог выплаты.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Майнинг-пул Bitcoin, отслеживается по адресу выплат"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Когда очередной блок поднимает ваш баланс выше порога"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN платит ончейн на ваш адрес, как только невыплаченный баланс достигает порога. Выплаты через Lightning (включаются по желанию, BOLT12) CashPilot не обнаруживает."
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "Невыплаченное заработано, но не получено, пока OCEAN не выплатит его ончейн на этот адрес, если только вы не включили выплаты через Lightning."
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "Ваш адрес выплат BTC: имя пользователя, которое ваш майнер использует на OCEAN, без части <b>.workername</b>. Он публичный и не даёт доступа к средствам."
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "Нужен ASIC-майнер Bitcoin (Bitaxe, Antminer), направленный на mine.ocean.xyz:3334"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "вычисления"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
