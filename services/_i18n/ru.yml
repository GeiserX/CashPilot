  text: "Майните Monero на CPU. CashPilot запускает XMRig, а выбранный вами пул платит Monero на ваш публичный адрес выплат. XMRig отдаёт 1% времени хеширования на поддержку своих разработчиков. Электричество может стоить больше, чем XMR, которые вы заработаете."
