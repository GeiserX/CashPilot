iproyal.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "Минимум $5. Сначала выберите страну: от неё зависят способы вывода. Из Испании (октябрь 2026 года): PayPal 4% с минимальной комиссией $0.25, выплата через Tremendous, который присылает по эл. почте ссылку, где вы вводите имя и адрес PayPal; USDT (BEP20, ERC20, TRC20) или USDC (BEP20, ERC20) с сетевой комиссией $1; Bitcoin с минимальной комиссией $2; подарочные карты без комиссии. Для первой выплаты нужна разовая проверка номера телефона по SMS: её открывает кнопка Withdraw, а номер вводится с кодом страны. После этого каждая выплата запрашивает код, отправленный на эл. почту аккаунта, и до 72 часов проходит проверку перед отправкой."
  source: "0430fae34eb5"
iproyal.payout.notes:
