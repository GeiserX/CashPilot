iproyal.rating.cons.0.text:
  text: "В условиях сказано, что аккаунт могут заблокировать без предупреждения за злоупотребление условиями вывода или несколько аккаунтов, и тогда его заработок могут не выплатить."
  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "В условиях сказано, что Pawns не разрешает использовать для обмена трафиком любые серверы, VPN или прокси-сервисы и допускает только одно устройство на IP."
