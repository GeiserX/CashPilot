proxybase.description:
  text: "ProxyBase — платформа обмена трафиком, которая платит пользователям криптовалютой за неиспользуемое интернет-подключение. Вы входите в клиент с помощью Access Token из своей панели. Больше всего зарабатывают домашние IP, но IP дата-центров тоже поддерживаются. Официальный мультиархитектурный Docker-образ (amd64/arm64/armv7).\n"
  source: "7a558682be11"
proxybase.short_description:
