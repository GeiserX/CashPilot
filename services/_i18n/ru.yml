  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
proxylite.referral.bonus.referrer:
  text: "15% их заработка пожизненно"
  source: "3168431b6644"
proxylite.rating.cons.0.text:
  text: "Владелец сайта скрыт в записях домена, и компании, которая стоит за ним, мы не нашли."
  source: "7aa89b3713f9"
proxylite.rating.pros.0.text:
  text: "Минимум $5, в криптовалюте или через PayPal."
  source: "62a28acac77c"
proxylite.rating.pros.1.text:
  text: "ProxyLite публикует Docker-образ, proxylite/proxyservice, и принимает подключения из дата-центров по более низкой ставке."
  source: "0d8c6faf88af"
proxyrack.description:
  text: "Программа Peer от ProxyRack позволяет зарабатывать, делясь трафиком в составе их прокси-сети. Каждому устройству нужен уникальный 64-символьный шестнадцатеричный UUID и, по желанию, API-ключ для автоматической регистрации устройства. Работает и на домашних подключениях, и на VPS или в дата-центрах. Панель защищена Cloudflare, поэтому API-ключ может понадобиться получать вручную через браузер.\n"
  source: "16b74380bb2a"
proxyrack.short_description:
  text: "Обмен трафиком — UUID на каждое устройство, работает на VPS"
  source: "7c899dc1ba2d"
proxyrack.docker.env.UUID.label:
  text: "UUID устройства"
  source: "dff993a2511b"
proxyrack.docker.env.API_KEY.label:
  text: "API-ключ"
  source: "23189d55f697"
proxyrack.docker.env.DEVICE_NAME.label:
  text: "Имя устройства"
  source: "155106be1173"
proxyrack.docker.env.UUID.description:
  text: "Уникальный 64-символьный шестнадцатеричный ID для каждого устройства. Сгенерировать: cat /dev/urandom | tr -dc 'a-f0-9' | fold -w 64 | head -n 1"
  source: "5de5d7264318"
proxyrack.docker.env.API_KEY.description:
  text: "Войдите на <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → API-ключ показан на главной странице панели (если он указан, устройство регистрируется автоматически). Нужен аккаунт? Зарегистрируйтесь по ссылке <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
  source: "96df71a6ca26"
proxyrack.docker.env.DEVICE_NAME.description:
  text: "Понятное имя устройства в панели"
  source: "df01af60b81c"
proxyrack.docker.health_signals.0.means:
  text: "Клиент ProxyRack не может работать в этой копии, поэтому она ничего не зарабатывает. Обычно причина в том, что сервер обновлений ProxyRack не отвечает, а без него клиент не запускается. Копия повторяет попытку каждые 5 минут и запускается сама, как только сервер ответит. Вам ничего не нужно исправлять."
  source: "0df8b8cfac10"
proxyrack.docker.health_signals.1.means:
  text: "Клиент ProxyRack не скачался при запуске этой копии, потому что сервер обновлений ProxyRack был недоступен, поэтому копия работает, но ничего не зарабатывает. CashPilot перезапускает её каждые 6 часов, чтобы попробовать снова. Переразверните её, чтобы она получила собственный запуск CashPilot: он сохраняет клиент и сам повторяет попытку каждые 5 минут."
  source: "0a2ee4b478b2"
proxyrack.device_link.steps:
  text: "Войдите в ProxyRack, откройте Devices, выберите Add device и вставьте этот UUID. Пока устройство не добавлено в ваш аккаунт, оно ни для кого не зарабатывает. Если вы указали API-ключ, контейнер регистрируется сам: проверьте, что устройство есть в списке."
  source: "54c4041903b5"
proxyrack.earnings.notes:
  text: "Домашние IP зарабатывают больше, чем IP дата-центров. Панель за Cloudflare может затруднять автоматический доступ."
  source: "b6e36d751afd"
proxyrack.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
proxyrack.cashout.notes:
  text: "Запросите выплату в панели. ProxyRack проверяет её в течение 72 часов, затем Tremendous присылает вам по эл. почте вознаграждение, которое можно получить через PayPal, подарочной картой или банковским переводом. Варианта с криптовалютой нет."
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "Баланс хранится у ProxyRack; выводится по запросу."
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "Войдите на <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, нажмите F12 → Network, найдите любой запрос к API и скопируйте значение заголовка <b>Api-Key</b>. Нужен аккаунт? Зарегистрируйтесь по ссылке <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "Proxyrack указывает лимит в 500 устройств на АККАУНТ и не указывает лимит на IP. IP дата-центров принимаются, но переводятся на более низкую ставку."
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "В справочном центре ProxyRack сказано, что при удалении устройства его заработок списывается с вашего аккаунта и возвращается, только если то же устройство добавят снова."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack публикует собственный Docker-образ, proxyrack/pop, и принимает IP дата-центров по более низкой ставке."
  source: "278541f81053"
repocket.description:
  text: "Repocket позволяет получать пассивный доход, делясь неиспользуемым интернет-трафиком. Больше всего зарабатывают домашние IP; IP VPS и дата-центров принимаются по более низким ставкам. Не более 5 устройств и 5 активных сессий на аккаунт. Docker-контейнер проходит аутентификацию по эл. почте аккаунта и API-ключу из панели Repocket (не по паролю).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Обмен трафиком — не более 5 устройств, вход по API-ключу"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "Эл. почта"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "API-ключ (UUIDv4, не пароль)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "Эл. почта вашего аккаунта Repocket"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Ваш API-ключ Repocket — войдите на <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> и скопируйте API-ключ со страницы bandwidth-earnings (это НЕ пароль от аккаунта). Нужен аккаунт? Зарегистрируйтесь по ссылке <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "Домашние IP зарабатывают больше. IP VPS и дата-центров принимаются, но по более низким ставкам."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 после первой выплаты)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket устанавливает минимум для каждого аккаунта: в октябре 2026 года это было $4 до первой выплаты и $2 после неё, намного меньше прежде рекламируемых $20. Способы: Tremendous (на вашу эл. почту) или USDT в Polygon. Каждый запрос подтверждается по ссылке из письма в течение 2 часов, и одновременно может ожидать только один запрос. В октябре 2026 года Repocket отклонил запрос через Tremendous с сообщением «Please, message support», а USDT в Polygon прошёл."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Баланс хранится у Repocket; выводится по запросу."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Используйте эл. почту и пароль аккаунта Repocket (те же, что и на <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Нужен аккаунт? Зарегистрируйтесь по ссылке <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2, когда приглашённый заработает $7, затем 5% его заработка пожизненно"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "Бонус $2 на кошелёк при регистрации"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket указывает лимит в пять устройств на АККАУНТ, но не публикует лимит устройств на IP. Цифра «2 устройства на IP», которую повторяют сайты с обзорами, не подтверждена провайдером, поэтому CashPilot её не утверждает."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Держите устройство Repocket в работе или выведите баланс"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "После 12 месяцев без входа, выплат или обмена трафиком Repocket может аннулировать невыплаченный баланс."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Держите устройство в работе, войдите в аккаунт или выведите средства. Если перестаёте пользоваться Repocket, сначала выведите баланс."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Несколько авторов отзывов на Trustpilot сообщают об отменённых выплатах и обнулённых балансах; один пишет, что поддержка сослалась на нерегулярный заработок на трафике. Страница даёт Repocket оценку 2.7 и отмечает, что он не отвечает на негативные отзывы."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Авторы отзывов сообщают об отклонённых выводах и о том, что за выплатой приходится побегать."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Платёжная политика Repocket позволяет ему отменять, аннулировать или навсегда изымать заработок всякий раз, когда он подозревает, что заработок недействителен, а также изымать невыплаченный заработок неактивного аккаунта."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "Та же политика позволяет Repocket в любое время без предупреждения добавлять, убирать или заменять способы выплаты; PayPal уже убран."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "В условиях сказано, что Repocket может в любой момент потребовать подтверждения личности или аккаунта, и от этого зависит право на выплату."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "В условиях сказано, что Repocket и его партнёры используют сетевые ресурсы, но не сказано, кто эти партнёры и как их проверяют."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "На Trustpilot отмечено, что Repocket не отвечает на негативные отзывы, а авторы отзывов пишут, что их сообщения игнорируют."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "В текущих условиях указана компания Repocket Pte. Ltd. в Сингапуре; в прежних условиях компания не указывалась."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket публикует собственный Docker-образ, repocket/repocket, и его условия разрешают контейнеры, которые принадлежат вам."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Минимум низкий: $4 до первой выплаты и $2 после неё."
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io позволяет предоставлять ваш GPU для распределённых задач ИИ и зарабатывать баланс Salad, который можно обменять на подарочные карты, игры или деньги. Только Windows, с нативным десктопным приложением. Нужен дискретный GPU (NVIDIA или AMD). Когда машина простаивает, платформа направляет на неё задачи инференса ИИ, рендеринга и другие вычисления. Одна из самых удобных для пользователя платформ обмена ресурсами GPU.\n"
  source: "09335baccea6"
salad.short_description:
  text: "Обмен ресурсами GPU для ИИ — только Windows, выплаты подарочными картами или деньгами"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Заработок зависит от модели GPU и наличия задач. RTX 3060 ~$1-3 в день. Только Windows. Нативное приложение, Docker не поддерживается. Можно обменять на подарочные карты, игры или PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal или подарочные карты через магазин Salad."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Только PayPal и подарочные карты, никогда не криптовалюта. Адреса кошелька нет, поэтому у CashPilot нет ончейн-баланса для отображения."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Войдите на <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, нажмите F12 → Application → Cookies и скопируйте значение cookie <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Заработайте немного Salad Reward Points или потратьте баланс"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Если аккаунт 12 месяцев подряд не зарабатывает Reward Points, его неиспользованный баланс может сгореть."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Запустите приложение Salad, чтобы оно что-нибудь заработало, или потратьте весь баланс в Salad Storefront. Если потратить только часть, отсчёт 12 месяцев не сбрасывается."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot не запускает Salad: вы пользуетесь собственным десктопным приложением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Несколько авторов отзывов на Trustpilot в октябре и ноябре 2026 года сообщают, что выводы через PayPal приходят быстро, у некоторых — не один раз; один автор за тот же период пишет, что повторные попытки вывода не удались."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel — блокчейн первого уровня (Layer 1) на Cosmos для децентрализованного VPN. Операторы узлов продают трафик пользователям VPN по гибким ценам (за GB или почасово). Есть официальное руководство по развёртыванию в Docker. Давний проект с активным сообществом.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "Децентрализованный VPN на Cosmos — операторы узлов продают трафик"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Операторы сами назначают цену за GB или почасовую. Заработок зависит от спроса пользователей VPN в вашем регионе."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "За каждую сессию"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Платежи идут в токене P2P, и 20% каждого платежа за трафик достаётся стейкерам, а не хосту узла."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "Токен переименовали из SENT в DVPN в 2021 году и из DVPN в P2P в 2025 году."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot не запускает Sentinel: вы пользуетесь собственной программой узла от провайдера, поэтому CashPilot не может развернуть или обновить её за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel публикует исходный код узла под собственной открытой лицензией."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia — децентрализованная площадка хранения данных, которой управляет Sia Foundation (швейцарская некоммерческая организация); она работает с 2015 года. Запустите официальный узел hostd от Foundation, чтобы сдавать в аренду свободное место на диске и зарабатывать Siacoin по контрактам на хранение и трафик. Прежде чем узел сможет зарабатывать, вам нужно купить немного Siacoin: хосты блокируют залог под каждый контракт и платят комиссию за каждое доказательство хранения. Залог возвращается, когда контракт завершён, и сжигается, если узел уходит офлайн или теряет данные, поэтому нужна машина, работающая без перерывов (Sia говорит как минимум о 95% времени работы). Заработок зависит от того, сколько данных арендаторы действительно хранят; Sia рекомендует цену хранения $1 за TB в месяц, поэтому сервис подходит машинам с большими свободными дисками, а не маленьким VPS.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Узел хранения Sia Foundation — официальный Docker-образ, заработок в Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Сид-фраза кошелька"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Пароль панели"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Каталог хранилища"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "Сид-фраза BIP-39, которая управляет кошельком Siacoin хоста. Сгенерируйте её командой `docker run --rm ghcr.io/siafoundation/hostd seed` и сделайте резервную копию — это ЕДИНСТВЕННЫЙ способ получить доступ к заработку"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Пароль для веб-интерфейса hostd и локального API (BasicAuth). Любая длинная парольная фраза"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Путь на хосте, на вашем самом большом диске, где хранятся данные арендаторов (например, /srv/sia). Нужно не менее 256GB свободного места"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "При развёртывании CashPilot создаёт новый кошелёк на машине, где работает узел, и один раз показывает его сид-фразу: запишите её. Чтобы использовать уже имеющийся кошелёк, вставьте вместо этого его сид-фразу. После развёртывания отправьте немного Siacoin на кошелёк узла для залога и комиссий, затем в панели добавьте папку хранилища (/storage), задайте цены и объявите хост.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "Сид-фраза кошелька (hostd.yml), база данных кошелька, настройки хоста и состояние контрактов. Потеряв их, вы потеряете идентификатор узла и учёт доходов по контрактам; тогда единственным способом восстановить средства останется записанная вами сид-фраза."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Хранимые данные арендаторов. Если их потерять, доказательства хранения не пройдут, и залог, заблокированный под эти контракты, будет потерян."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Хосты сами назначают цены. Sia рекомендует $1 за TB хранения в месяц и более $5 за скачанный TB, а 3.9% каждой выплаты по контракту достаётся держателям Siafund. Доход растёт с объёмом данных арендаторов на узле: он начинается с нуля и растёт вместе со временем работы и в зависимости от цены. Залог (Sia советует 2x от цены хранения) блокируется под каждый контракт и возвращается при успешном завершении.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Заработок начисляется на собственный кошелёк Siacoin хоста (управляется сид-фразой). Обменяйте SC на бирже и выводите оттуда на банковский счёт или карту; запроса на выплату у провайдера нет.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Средства хранятся в кошельке Sia внутри узла, которым управляет сид-фраза. Сид-фраза хранится только в томе данных hostd на машине, где он работает; CashPilot её никогда не сохраняет. Фраза, которую вы записываете при создании кошелька, — единственный способ восстановления.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Стабильный публичный адрес с проброшенными портами 9981 (TCP, консенсус) и 9984 (TCP и UDP, контракты арендаторов). Хостинг в дата-центрах и на VPS для Sia — обычное дело. Прежде чем узел сможет брать контракты, на кошельке должны быть Siacoin."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Место на диске и трафик для его обслуживания."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Нет. Арендаторы хранят на вашем диске зашифрованные фрагменты файлов и скачивают их обратно. Посторонние люди не пропускают произвольный трафик через ваш IP."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Адрес вашего кошелька Sia, публичный ключ хоста и публичный IP:порт, который узел объявляет, чтобы арендаторы могли к нему подключиться."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Постоянный трафик загрузки и отдачи на линии, как у любого сервера хранения; анонимизированный чужой веб-трафик вам не приписывается."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Без разрешений: ни регистрации, ни аккаунта. Залог сжигается, если узел пропускает доказательства хранения, уходя офлайн или теряя данные."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Заработок — это Siacoin на вашем собственном кошельке: выплаты на банковский счёт нет, продавать на бирже вы будете сами."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "Залог блокируется под каждый контракт и сжигается, если хост пропускает доказательства хранения, уходя офлайн или теряя данные."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Используется лишь около 30% места, предлагаемого в сети, поэтому новому хосту приходится бороться за небольшой спрос."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Арендаторы хранят зашифрованные фрагменты файлов, и никто не пропускает трафик через ваш IP, но мы не нашли, где Sia сообщает, кто такие арендаторы и как их проверяют."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd открыто разрабатывается Sia Foundation с 2022 года."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd — открытое ПО под лицензией MIT."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Sia Foundation публикует hostd в виде образа контейнера."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Без разрешений: ни регистрации, ни аккаунта."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide — сервис обмена трафиком, позволяющий монетизировать неиспользуемый интернет-трафик. Для учёта устройств использует необязательный ID машины. Доступен через Docker-образы сообщества из проекта income-generator.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Обмен трафиком — на основе ID машины"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "ID машины"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "ID машины для уже зарегистрированного устройства (если пусто, создаётся автоматически)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Информации мало. Заработок зависит от местоположения."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
spide.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% их заработка"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "Бонус за регистрацию $5"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "Трафик через один публичный IP делится между устройствами, которые его используют, поэтому второе устройство на том же подключении ничего не добавляет."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot не запускает Spide: вы пользуетесь собственным приложением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Майните Pearl, Zano или Ravencoin на одном GPU NVIDIA. При первом запуске CashPilot скачивает официальный релиз SRBMiner-Multi и проверяет его SHA-256. Выбранный вами пул платит на ваш публичный адрес выплат. SRBMiner-Multi оставляет себе 2% времени хеширования на Pearl и 0.85% на двух других монетах. Электричество может стоить больше, чем монеты, которые вы заработаете."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Майнинг Pearl и других GPU-монет на GPU NVIDIA"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Адрес выплат"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "Имя воркера"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "Алгоритм"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "Пул (host:port)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "Шифровать подключение к пулу (TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "Ваш публичный адрес Pearl (prl1...). Для Zano или Ravencoin введите адрес этой монеты и пул для неё."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash для Pearl, progpow_zano для Zano, kawpow для Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.earnings.notes:
  text: "Валовая оценка без учёта электричества. 2026-11-25 hashrate.no оценивал заработок на Pearl для RTX 4070, потребляющей около 142 W, примерно в $2.45 в день. Мы это не измеряли. Pearl — новая монета, её цена и сложность быстро меняются. Проверьте энергопотребление своего GPU и цену электричества, чтобы понять, окупится ли это."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Когда достигнут порог пула"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "Пул платит на ваш адрес, когда баланс достигает вашего порога. До выплаты баланс хранится у пула."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, GPU NVIDIA и NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Эта машина сообщает о подключении через хостинг. Прежде чем майнить, проверьте условия своего провайдера. Некоторые провайдеры, в том числе Hetzner Cloud, это запрещают. Прежде чем полагаться на оценку прибыли, проверьте свои реальные расходы на электричество."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "Комиссия майнера 2% относится к pearlhash. На progpow_zano и kawpow SRBMiner-Multi оставляет себе 0.85%. HeroMiners, пул Pearl по умолчанию, берёт комиссию пула 1%. Он проверяет выплаты каждый час и платит от 1 PRL. Другие пулы устанавливают свои ставки и пороги."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "вычисления"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "Нет. Майнер отправляет результаты работы в выбранный вами пул."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Ваш адрес выплат, имя воркера и IP-адрес передаются пулу. При первом запуске майнер скачивается с GitHub."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Некоторые сети и DNS-резолверы блокируют подключения к майнинг-пулам."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "Большинство пулов идентифицирует вас по публичному адресу выплат."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "Майнер оставляет себе 2% времени хеширования на Pearl и 0.85% на Zano и Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Некоторые хостинг-провайдеры запрещают майнинг криптовалют."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "У майнера закрытый исходный код, поэтому никто, кроме его разработчика, не может проверить, что он выполняет."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "Электричество для GPU может стоить больше заработанных монет, а цена Pearl быстро меняется."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "Майнер отправляет результаты работы в пул и не передаёт чужой трафик."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Майнить Pearl на HeroMiners можно с публичным адресом и без аккаунта."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj — децентрализованная сеть облачного хранения, где вы зарабатываете, сдавая в аренду неиспользуемое место на диске. Запустите узел хранения через Docker и получайте $1.35/TB за хранение в месяц плюс $1/TB за исходящий трафик (ставки с 1 сентября 2026 года). Выплаты ежемесячные, в USDC (стейблкоин, привязанный к доллару США), в основной сети Ethereum на кошелёк, которым вы управляете, как только баланс превысит минимум, зависящий от комиссий (до выплаты за сентябрь 2026 года — в токене STORJ). Нужно не менее 550GB свободного места на диске и стабильное интернет-подключение. Аккаунт и регистрация не нужны — с середины 2025 года узлы работают без разрешений. ВНИМАНИЕ (октябрь 2026 года): 26 июля 2026 года Storj Labs подала заявление о банкротстве по главе 11 (Chapter 11; Суд по делам о банкротстве США, Северный округ Западной Вирджинии, дело 5:26-bk-00512), чтобы реструктурировать старые долги. Сеть продолжает работать, и Storj продолжает платить активным узлам, но заработок узлов до подачи заявления заморожен, пока суд не вынесет по нему решение. Токен STORJ упал примерно на 98% от пика 2021 года. Binance исключила его из листинга 3 сентября 2026 года, а Coinbase приостановила торги им 28 сентября 2026 года. Новый узел удерживает часть заработка в первые девять месяцев и заполняется только по мере спроса клиентов, поэтому, запуская его сейчас, вы привязываете долгую окупаемость к компании в процессе реструктуризации, которая ещё может прекратить работу.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Децентрализованный узел хранения — $1.35/TB хранения + $1/TB исходящего трафика"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Адрес кошелька"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "Эл. почта"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "Внешний адрес"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Выделенное место"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Каталог идентификатора"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Каталог хранилища"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Адрес кошелька Ethereum для выплат в USDC (например, 0x1234...abcd). Кошелёк должен быть некастодиальным (MetaMask, Ledger и т. п.) — никогда не используйте адрес на бирже"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "Адрес эл. почты для уведомлений оператору"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "Имя хоста DDNS с портом (например, mynode.ddns.net:28967) — гораздо лучше, чем IP-адрес, с которым узел окажется недоступен в тот день, когда интернет-провайдер без предупреждения сменит вам IP. Порт 28967 должен быть проброшен (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Максимальный объём выделяемого места на диске (например, 2TB). Используйте жёсткие диски (HDD), а не SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Путь на хосте, где хранятся файлы идентификатора (должен содержать ca.cert, ca.key, identity.cert, identity.key)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Путь на хосте на жёстком диске (HDD) для хранения данных Storj. Нужно не менее 550GB свободного места"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Перед первым запуском инициализируйте конфигурацию узла хранения: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Идентификатор узла. Его ID привязан к proof-of-work, на его повторное создание уходят часы, и его нельзя воссоздать из резервной копии чего-либо другого. Потеряв его, вы потеряете удерживаемый баланс выплат."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Хранимые данные клиентов и удерживаемая сумма узла. Если их потерять, узел будет дисквалифицирован, а удерживаемый баланс пропадёт."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Сеть Storj не может подключиться к вашему узлу по объявленному ADDRESS, поэтому сателлиты считают его офлайн: новые данные перестают поступать, доход от исходящего трафика замирает, а длительное время офлайн приводит к приостановке узла. Проверьте, что ADDRESS соответствует вашему ТЕКУЩЕМУ публичному IP (используйте имя хоста DDNS, а не IP-адрес, чтобы смена IP у провайдера не сделала узел недоступным) и что порт 28967 TCP+UDP проброшен на эту машину."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB хранения + $1/TB исходящего трафика + $1/TB аудита/восстановления с 1 сентября 2026 года. Заработок растёт с объёмом хранимых данных и возрастом узла. В первые 9 месяцев удерживается 75%, затем 50%, затем 25% заработка; половина удержанной суммы возвращается на 16-й месяц, остальное — при корректном выходе из сети (graceful exit). Порт 28967 должен быть проброшен."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4x комиссии за транзакцию Ethereum, меньшие балансы переносятся"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Ежемесячно"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Выплачивается ежемесячно в USDC в основной сети Ethereum, как только баланс кошелька составит не менее четырёх текущих комиссий за транзакцию; меньшие балансы переносятся на следующий месяц. До выплаты за сентябрь 2026 года — в токене STORJ. Панель на порту 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Выплачивается ежемесячно в USDC в основной сети Ethereum на адрес из WALLET, как только баланс превысит минимум, зависящий от комиссий. До выплаты за сентябрь 2026 года — в токене STORJ; выплаты в zkSync Era прекращены 1 сентября 2026 года."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "URL панели узла на порту 14002, с LAN IP сервера, а не localhost, например <b>http://192.168.1.10:14002</b>. Для нескольких узлов перечислите их URL через запятую: CashPilot их суммирует."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Узлы Storj в одной подсети /24 делят между собой выделяемые данные, что снижает заработок каждого узла."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps на отдачу"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Место на диске и трафик для его обслуживания."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Нет. Вы храните зашифрованные фрагменты данных клиентов с кодированием стирания (erasure coding). Посторонние люди не пропускают свой трафик через ваш IP."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "Идентификатор узла, адрес вашего кошелька, адрес эл. почты, который узел требует для уведомлений оператору, а также ваш IP и порт, которые должны быть доступны, чтобы узел мог отдавать данные."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "В основном это вопрос лимита трафика, а не ответственности: узел постоянно отдаёт и принимает данные клиентов, а это реальный длительный трафик на вашей линии. Но, в отличие от прокси или ретранслятора, это не анонимизированный чужой трафик, источником которого считаетесь вы, поэтому он не вызывает таких жалоб на злоупотребления."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Без ограничения числа узлов, но узлы в одной подсети /24 делят выделяемые данные, поэтому несколько узлов на одном подключении зарабатывают меньше каждый."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk 27 июля 2026 года сообщил, что Storj Labs подала заявление о защите от банкротства по главе 11 (Chapter 11)."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Платежи операторам узлов за период до подачи заявления попали в процедуру требований кредиторов в рамках банкротства."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "У нового узла в первые девять месяцев удерживается 75%, затем 50%, затем 25% заработка; половина возвращается на 16-й месяц, а остальное — только при корректном выходе из сети."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Клиенты хранят зашифрованные фрагменты файлов, и никто не пропускает трафик через ваш IP, но мы не нашли, где Storj сообщает, кто такие клиенты и как их проверяют."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "Программа узла хранения — открытое ПО под лицензией AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj публикует собственный Docker-образ, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Аккаунт не нужен: только адрес кошелька и эл. почта для уведомлений оператору."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Активным узлам продолжали платить и после подачи заявления."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR — майнинг-пул Monero без аккаунта: ваш майнер входит, указывая ваш адрес Monero в качестве имени пользователя, и пул платит на этот адрес. CashPilot здесь не запускает майнер. Он считывает баланс, который SupportXMR хранит для вашего адреса, чтобы вы видели заработок своего CPU-майнера рядом с другими доходами. Баланс заработан, но не получен: пул выплачивает его, как только он превысит ваш порог выплаты.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Майнинг-пул Monero, отслеживается по адресу выплат"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (автоматически), 0.01 XMR по запросу"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Когда баланс превышает ваш порог или по запросу"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR платит на ваш адрес, как только баланс достигает вашего порога (по умолчанию 0.1 XMR). На его сайте можно также запросить мгновенную выплату от 0.01 XMR с комиссией 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Баланс заработан, но не получен, пока SupportXMR не выплатит его на этот адрес. Балансы Monero нельзя прочитать ончейн без приватного ключа просмотра (view key), а CashPilot его никогда не запрашивает, поэтому каждую выплату вы подтверждаете сами."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Ваш адрес выплат Monero: имя пользователя, которое ваш майнер использует на SupportXMR, без частей <b>.workername</b> или <b>+difficulty</b>. Он публичный и не даёт доступа к средствам."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Нужен майнер Monero (XMRig), направленный на pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "вычисления"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Нет. Ваш майнер отправляет хеши в пул; никто не пропускает трафик через ваше подключение."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Ваш адрес Monero, выбранные вами имена воркеров, ваш хешрейт и IP-адрес майнера, каким его видит пул."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Майнер держит одно открытое подключение к пулу и расходует мало трафика. Следить стоит за расходами на электричество, а не за интернет-провайдером."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Аккаунта нет. Идентификатором служит адрес, и его статистику на supportxmr.com может посмотреть кто угодно."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Выплаты только в Monero, комиссия пула 0.6%, а порог автоматической выплаты по умолчанию — 0.1 XMR."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot не запускает майнер для SupportXMR: вы сами направляете свой майнер на пул, а CashPilot только считывает баланс."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol даёт ИИ-агентам доступ к живому вебу через сеть Beacon-узлов. Teneo Beacon — собственное приложение Teneo для Android, iOS, macOS, Windows и Linux, с версией для командной строки для серверов и Raspberry Pi. Оно делится вашим неиспользуемым трафиком после того, как вы примете экран согласия, и, пока находится в сети, зарабатывает Teneo Protocol Points и Fragments. Fragments учитываются в сезонных розыгрышах с призами в USDC (Beacon Drop). Teneo утверждает, что Beacon зарабатывает вдвое больше очков, чем его прежнее браузерное расширение. На одно интернет-подключение зарабатывает один Beacon. Остальные устройства на том же подключении находятся в режиме ожидания. Зарегистрируйтесь в Expedition Hub по реферальной ссылке или с кодом PSA3BHPJ, затем войдите в Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "DePIN-приложение для обмена трафиком (Beacon) — Fragments для сезонных розыгрышей USDC, +100 Fragments по реферальной ссылке"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Начисляются Teneo Points и Fragments. Fragments учитываются в сезонных розыгрышах USDC, поэтому сезон приносит приз, а не фиксированную ставку. Teneo утверждает, что Beacon зарабатывает вдвое больше очков, чем браузерное расширение. Каждые 8 часов забирайте буст, чтобы получать до 3x Fragments; пропущенное окно снижает множитель."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Сезонный розыгрыш (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Призы Beacon Drop выплачиваются в USDC на кошелёк, который вы привязываете в Expedition Hub. Hub показывает, сколько дней у вас есть, чтобы его привязать; приз, к которому кошелёк не привязан вовремя, сгорает."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Привяжите кошелёк в Expedition Hub до того, как будут выплачены призы сезона; Hub аннулирует приз, если кошелёк не привязан вовремя."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% Fragments каждого приглашённого друга и 2% Fragments его рефералов, если друг зарегистрируется в течение 7 дней и заработает 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments при регистрации и ещё +150, когда вы наберёте 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "На одно интернет-подключение зарабатывает один Beacon. Машины в дата-центрах зарабатывают только у хостинг-провайдеров, которых включила Teneo, — вдвое меньше Fragments и без очков и реферального бонуса. Подключения через VPN не зарабатывают никогда."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Fragments от Beacon приносят USDC только в виде призов в сезонных розыгрышах, поэтому его работа не даёт фиксированного заработка."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo говорит, что очки будут объединены в $AGENTIC — непереводимый токен вознаграждения, а не в токен $TENEO."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "К ноябрю 2026 года не были подтверждены ни дата запуска $TENEO, ни распределение, ни порядок получения, а прежний ориентир — второй квартал 2026 года — уже прошёл."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot не запускает Teneo: вы устанавливаете собственное приложение Beacon от провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo утверждает, что трафик поступает от проверенных бизнес-клиентов, и блокирует частные адреса и порты, склонные к злоупотреблениям, но не говорит, как проверяет этих клиентов."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network — давно существующая децентрализованная сеть доставки видео и вычислений для ИИ (с 2018 года). Пользователи запускают Edge Nodes, предоставляя трафик, хранилище и вычислительные мощности. Крупные партнёрства с владельцами контента. Зарабатывает токены TFUEL.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "Децентрализованная CDN + вычисления для ИИ — вознаграждения в TFUEL, давний проект"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Только десктопное приложение. Заработок зависит от ресурсов и местоположения. Крупные партнёрства, торгуется на всех биржах."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Непрерывно"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot не запускает Theta Edge: вы пользуетесь собственным десктопным приложением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "893de938ed14"
titan.description:
  text: "Titan Network — DePIN-платформа, которая предоставляет ваш IP-адрес, хранилище и трафик в обмен на вознаграждения в токенах TNT. Доступна для Windows, Mac и Android. Узлы участвуют в децентрализованной CDN и слое хранения. Типичный заработок — $5-30 в месяц в зависимости от предоставленных ресурсов и географического местоположения.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN: IP, хранилище, трафик — $5-30 в месяц"
  source: "799e68401067"
titan.earnings.notes:
  text: "Предоставляет IP, хранилище и трафик. Заработок зависит от предоставленных ресурсов и региона. Чем больше выделено места для хранения, тем выше вознаграждения."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "По эпохам"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "В собственной справке Titan сказано, что работающий узел не гарантирует заработка: без назначенной задачи он ничего не зарабатывает, а вознаграждения начисляются в токене TNT."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot не запускает Titan: вы пользуетесь собственным приложением или расширением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer позволяет монетизировать интернет-трафик, делясь им с проверенными компаниями. Один из немногих сервисов обмена трафиком, который хорошо работает не только на домашних подключениях, но и на IP VPS и дата-центров. Использует простую аутентификацию по токену, который передаётся в аргументах командной строки. Поддерживает архитектуры ARM для Raspberry Pi и подобных устройств.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Обмен трафиком — работает на VPS, вход по токену"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Токен"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Имя устройства"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Войдите на <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, нажмите F12 → Application → Local Storage → нажмите <code>https://app.traffmonetizer.io</code> → скопируйте значение <code>authToken</code> (около 54 символов: цифры, затем <code>|</code>, затем буквы и цифры)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Имя, которое отображается в панели для управления устройствами"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "IP VPS и дата-центров зарабатывают меньше домашних. Местоположения в США и ЕС зарабатывают больше. Несколько IP поддерживаются через сети Docker."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Минимум $10. PayPal больше не предлагается. Сначала сохраните в профиле один способ выплаты: USDT в Solana или TON (самые низкие комиссии), Arbitrum (низкие комиссии) или Tron TRC20 (высокие сетевые комиссии) либо банковский перевод от $1 000. Первый сохранённый адрес начинает действовать сразу; чтобы изменить его позже, нужно подтверждение по эл. почте. Перед первым выводом панель может запросить контакт в мессенджере (WhatsApp, Telegram или Skype). Запрос выплачивает целые доллары, а центы остаются на балансе."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT в сети, сохранённой в настройках выплат профиля (Solana, TON, Arbitrum или Tron), или банковский перевод. Адрес хранится в настройках Traffmonetizer, а не в контейнере."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Войдите на <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, нажмите F12 → Application → Local Storage → значение <b>authToken</b> (около 54 символов: цифры, затем <code>|</code>, затем буквы и цифры)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% от каждой запрошенной ими выплаты"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Условия Traffmonetizer требуют домашний IP, но на практике узлы на VPS принимаются."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "На Trustpilot у него оценка 1.9; авторы отзывов с 2023 по ноябрь 2026 года сообщают, что выплаты неделями висят в ожидании или помечаются как выполненные без соответствующей транзакции."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Те же авторы отзывов сообщают, что поддержка в чате и по эл. почте не отвечает, иногда неделями."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Только криптовалюта или банковский перевод от $1 000; PayPal больше нет, а запрос выплачивает только целые доллары."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Условия Traffmonetizer требуют домашний IP, поэтому сервер на хостинговом подключении им не соответствует."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Четыре автора отзывов на Trustpilot с 2023 по 2025 год сообщают об очень медленном заработке, например один цент в день на четырёх устройствах или почти два года до $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Для выплаты нужен только сохранённый криптоадрес, подтверждённый по эл. почте; панель может запросить контакт в мессенджере."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer публикует собственный Docker-образ, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Майните на CPU и получайте оплату в выбранной монете, например SHIB, DOGE или XMR. CashPilot запускает XMRig на пуле RandomX от unMineable, а unMineable конвертирует добытые вашим CPU Monero в вашу монету. Он платит на ваш публичный адрес, как только баланс достигает порога выплаты для этой монеты. Каждый воркер, который разворачивает CashPilot, содержит реферальный код CashPilot для unMineable, который снижает вашу комиссию платформы с 1% до 0.75%. Электричество может стоить больше, чем вы заработаете."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Майните на CPU и получайте оплату в выбранной монете"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "Монета выплаты"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "Адрес выплат"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "Имя воркера"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "Макс. потоков CPU (%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "Режим RandomX"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "Тикер монеты, в которой платит unMineable, например SHIB, DOGE или XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "Ваш публичный адрес для этой монеты. Монеты, которым нужен memo или тег, не поддерживаются."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Валовая оценка без учёта электричества, выплата в вашей монете по курсу конвертации unMineable. На 2026-11-25 1 kH/s на RandomX приносил около $1 в месяц. Настольный CPU на половине потоков может потреблять дополнительно 30-50 W. Проверьте своё реальное потребление и цену электричества, чтобы понять, окупится ли это."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "Устанавливается unMineable для каждой монеты (0.03 XMR на 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Когда достигнут порог выплаты для монеты"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable платит на ваш адрес, как только баланс достигает порога выплаты для монеты. Пороги зависят от монеты и сети; CashPilot считывает тот, который unMineable сообщает для вашего адреса."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Баланс заработан, но не получен, пока unMineable не выплатит его на этот адрес. Сеть зависит от выбранной монеты."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "Тот же адрес выплат и тикер монеты, с которыми вы развернули майнер, например <b>XMR</b>. Введите только адрес, без монеты, имени воркера или реферального кода. Он публичный и не даёт доступа к средствам."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% вознаграждений за майнинг каждого приглашённого майнера"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Комиссия платформы снижена с 1% до 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Эта машина сообщает о подключении через хостинг. Прежде чем майнить, проверьте условия своего провайдера. Некоторые провайдеры, в том числе Hetzner Cloud, это запрещают. Прежде чем полагаться на оценку прибыли, проверьте свои реальные расходы на электричество."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable берёт комиссию платформы 1%. CashPilot добавляет свой реферальный код (#awk6-j1z0) после имени каждого воркера, что снижает вашу комиссию до 0.75%. Затем unMineable платит мейнтейнеру CashPilot 0.25% ваших вознаграждений за майнинг; вы сохраняете 99.25%. У каждой монеты свой порог выплаты, например 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "вычисления"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "Нет. Майнер отправляет результаты работы в пул unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "Ваш адрес выплат, монета, имя воркера, хешрейт и IP-адрес передаются unMineable."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "Некоторые сети и DNS-резолверы блокируют подключения к майнинг-пулам."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "Аккаунт не нужен. Идентификатором служат адрес и монета, и их статистику на unmineable.com может посмотреть кто угодно."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "С реферальным кодом unMineable берёт комиссию платформы 0.75% и платит только начиная с порога каждой монеты."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "Некоторые хостинг-провайдеры запрещают майнинг криптовалют."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "Дополнительное электричество может стоить больше заработанных монет."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "Статистика адреса, включая баланс, открыта любому, кто знает адрес."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "Майнер отправляет хеши в пул и не передаёт чужой трафик."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Можно майнить на публичный адрес в выбранной монете, не создавая аккаунт."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock — DePIN-платформа (Decentralized Physical Infrastructure Network, децентрализованная сеть физической инфраструктуры), которая позволяет зарабатывать криптовалюту, делясь интернет-подключением. Часть более широкой экосистемы Web3. Есть Docker-образы сообщества, но официального образа нет. Основной интерфейс — браузерное расширение.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "DePIN-обмен интернет-подключением — выплаты в криптовалюте, в основном браузерное расширение"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Заработок в криптовалюте/токенах. Официального Docker-образа нет — основной клиент браузерное расширение."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
uprock.cashout.notes:
  text: "Токены UPT, вывод на кошелёк Solana от 250 UPT при включённой двухфакторной аутентификации. Взимается комиссия за вывод."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "В справочном центре UpRock сказано, что вывод производится в токенах UPT на кошелёк Solana, минимум 250 UPT."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "Вознаграждения — токены UPT; авторы отзывов и сторонний обзор говорят, что их стоимость очень низкая."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot не запускает UpRock: вы пользуетесь собственным приложением или расширением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork — децентрализованная сеть VPN и обмена трафиком. Вы зарабатываете, предоставляя трафик в роли провайдера сообщества. Бинарный файл провайдера сам проходит аутентификацию по эл. почте и паролю вашего аккаунта (подкоманда auth-provide) и сохраняет полученный JWT сессии в томе данных. Официальный Docker-образ от BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "Децентрализованный VPN/трафик — вход по эл. почте и паролю, JWT сессии в томе"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "Эл. почта"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Пароль"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "Эл. почта вашего аккаунта URnetwork (логин, который вы используете на <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Для аккаунтов, созданных через вход Google/Apple, сначала нужно задать пароль. Нужен аккаунт? Зарегистрируйтесь по ссылке <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "Пароль вашего аккаунта URnetwork (без пробелов). Используется для входа провайдера через auth-provide; затем сессия сохраняется в томе данных."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Работает на VPS и домашних подключениях. С 2026-10-06 выплаты в SN25α (подсеть Bittensor 25) за каждую недельную эпоху. Поддерживает режим прокси для конфигураций с несколькими IP."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "По эпохам"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Укажите coldkey Bittensor на ur.io/app/account/earnings (подписав в Talisman, TAO.com или кошельке через WalletConnect), затем получайте вознаграждение за каждую завершённую эпоху. Получение оплачивает газ в TAO с EVM-ключа для газа. НЕПОЛУЧЕННЫЕ ЭПОХИ СГОРАЮТ, а старые выплаты в USDC отменялись, если кошелёк не был привязан в течение 30 дней."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB бесплатных данных UR в день за каждого друга, до 20 друзей (данные, а не деньги)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB бесплатных данных UR в день, если в течение 90 дней после регистрации вы в 2 разных дня используете через приложение не менее 10 MiB; иначе реферальная программа для вас заканчивается"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Неполученные эпохи сгорают, а старые выплаты в USDC были отменены для сетей, к которым кошелёк не был привязан в течение 30 дней."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "С октября 2026 года вознаграждения выплачиваются в SN25α, токене подсети Bittensor, и каждое получение стоит газа в TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "Раньше URnetwork назывался BringYour; в его архивном whitepaper указано старое название."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork публикует исходный код своего клиента провайдера."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork публикует собственный Docker-образ, bringyour/community-provider, и работает на VPS и домашних подключениях."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Для получения нужен только кошелёк Bittensor, которым вы управляете."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai — облачная площадка GPU, где вы сдаёте в аренду свой GPU NVIDIA исследователям и разработчикам в области ИИ/ML. Платформа изначально построена на Docker, и почасовые цены вы задаёте сами. RTX 3090 при аренде обычно зарабатывает $0.20-0.40/ч. Нужен GPU NVIDIA со свежими драйверами и стабильное интернет-подключение. Доход сильно зависит от модели GPU, ценовой стратегии и рыночного спроса.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "Площадка GPU — цены задаёте сами, RTX 3090 ~$0.20-0.40/ч"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "API-ключ"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "API-ключ хоста Vast.ai из панели"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/ч, RTX 4090 ~$0.40-0.80/ч при аренде. Загрузка бывает разной. Нужны GPU NVIDIA, хост на Linux, Docker и nvidia-container-toolkit. Цены задаёте сами."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Еженедельно (по пятницам)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "Заработок накапливается на балансе Vast.ai. Вывод через Wise, PayPal или Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% от трат приглашённых арендаторов на всё время существования их аккаунта, в виде реферальных кредитов; до 75% можно вывести с отдельного реферального аккаунта"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Хост зарабатывает только во время аренды, а собственные цифры Vast для потребительского GPU зависят от типа аренды и оценки надёжности."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot не запускает Vast.ai: вы устанавливаете программу хоста Vast на собственную машину с GPU, поэтому CashPilot не может развернуть или обновить её за вас. Хостинг у Vast построен на Docker на хосте с Linux."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Vast утверждает, что хост получает ровно ту ставку, которую назначил, без вычета комиссии."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "Выплаты через Wise, PayPal или Stripe от минимума $20, счёт выставляется еженедельно; меньший баланс переносится на следующую неделю."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter — платформа обмена трафиком для Windows, Mac, Linux и Android. Она заявляет, что платит до $1/GB переданного трафика, с минимальным порогом выплаты $20. Платформа работает так же, как обычные приложения для обмена трафиком, пропуская легитимный трафик через домашние подключения.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Обмен трафиком — заявлено до $1/GB, минимальная выплата $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Заявлено до $1/GB, но реальный заработок ниже. Минимальная выплата $20. Заработок сильно зависит от местоположения и спроса."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "По запросу"
  source: "be820103712e"
wipter.cashout.notes:
  text: "У Wipter нет веб-панели. Откройте десктопное или мобильное приложение Wipter, войдите и запросите выплату там, когда баланс достигнет $20. Wipter платит только в USDT в BNB Smart Chain (BEP20) на кошелёк, указанный в разделе Payments приложения; варианта с PayPal нет."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Пока не определено: CashPilot ещё не проверил, где этот сервис хранит ваш заработок."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% их заработка на трафике после того, как они достигнут минимальной выплаты, за любое число приглашённых друзей"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "Бонус за регистрацию $5"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot не запускает Wipter: вы пользуетесь собственным десктопным или мобильным приложением провайдера, поэтому CashPilot не может развернуть или обновить его за вас. Условия сервиса на предмет контейнеров не проверялись."
  source: "fa32942c6b4f"
