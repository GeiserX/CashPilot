iproyal.rating.cons.3.text:
  text: "Для первой выплаты нужна проверка номера телефона по SMS, а для каждой выплаты — код, отправленный по эл. почте."
  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "В политике конфиденциальности указан оператор — Pawns.App Ltd (компания 16043795 в Англии и Уэльсе); по данным Companies House, она зарегистрирована 28 октября 2024 года, то есть менее трёх лет назад."
  source: "a7fcb7aea980"
iproyal.rating.cons.5.text:
