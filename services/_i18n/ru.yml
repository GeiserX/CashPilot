packetstream.rating.cons.0.text:
  text: "Авторы отзывов на Trustpilot в 2025 и 2026 годах сообщают, что выплаты приходят с опозданием или не приходят вовсе, а один давний пользователь пишет, что выплаты сначала замедлились, а потом прекратились; другие в 2026 году сообщают, что получили деньги."
