packetstream.cashout.notes:
  text: "Только PayPal, минимум $5, комиссия 3% показывается перед подтверждением. Первый вывод сохраняет ваш адрес эл. почты PayPal; чтобы потом изменить его, нужно подтверждение по эл. почте и ожидание 7 дней, поэтому проверьте адрес перед подтверждением. Запросы проверяются и отправляются в течение 7 дней; пока запрос ждёт, его можно отменить, а новый можно создать только после того, как предыдущий выплачен."
