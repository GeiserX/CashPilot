  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "Електронна пошта вашого акаунта Repocket"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Ваш API-ключ Repocket — увійдіть на <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> і скопіюйте API-ключ, показаний на сторінці bandwidth-earnings (це НЕ пароль від вашого акаунта). Потрібен акаунт? Зареєструйтеся за посиланням <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "Домашні IP заробляють більше. IP VPS і дата-центрів приймаються, але за нижчими ставками."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 після першої виплати)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket встановлює мінімум для кожного акаунта окремо: у жовтні 2026 року це $4 до першої виплати і $2 після неї, набагато менше за $20, які раніше рекламувалися. Способи: Tremendous (на вашу електронну пошту) або USDT у Polygon. Кожен запит підтверджується за посиланням із листа протягом 2 годин, і одночасно може очікувати лише один запит. У жовтні 2026 року Repocket відхилив запит через Tremendous з повідомленням «Please, message support», а USDT у Polygon пройшов."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Баланс зберігає Repocket; виводиться за запитом."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Використайте електронну пошту й пароль свого акаунта Repocket (ті самі, що на <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Потрібен акаунт? Зареєструйтеся за посиланням <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2, коли реферал заробить $7, а потім 5% його заробітку довічно"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "Бонус $2 на гаманець за реєстрацію"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket документує обмеження в п'ять пристроїв на АКАУНТ, але не публікує обмеження кількості пристроїв на IP. Цифра «2 пристрої на IP», яку повторюють сайти з оглядами, не має джерела від провайдера, тому CashPilot її не стверджує."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Тримайте пристрій Repocket активним або виведіть баланс"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Після 12 місяців без входу, виплат чи обміну трафіком Repocket може анулювати невиплачений баланс."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Тримайте пристрій, що ділиться трафіком, увімкненим, увійдіть в акаунт або виведіть кошти. Якщо ви припиняєте користуватися Repocket, спершу виведіть кошти."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Кілька авторів відгуків на Trustpilot повідомляють про скасовані виплати й обнулені баланси; один каже, що підтримка послалася на нерегулярний заробіток із трафіку. Сторінка оцінює Repocket на 2.7 і зазначає, що він не відповідає на негативні відгуки."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Автори відгуків повідомляють про відхилені виведення та про те, що оплату доводилося вибивати."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Платіжна політика Repocket дозволяє йому сторнувати, скасовувати або остаточно анулювати заробіток щоразу, коли він підозрює, що той недійсний, а також анулювати невиплачений заробіток неактивного акаунта."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "Та сама політика дозволяє Repocket будь-коли без попередження додавати, прибирати або замінювати способи виплати; PayPal прибрали."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Умови кажуть, що Repocket будь-коли може вимагати підтвердження особи чи акаунта, і від цього залежить право на виплату."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Умови кажуть, що Repocket і його партнери використовують ресурси мережі, але не кажуть, хто ці партнери і як їх перевіряють."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot зазначає, що Repocket не відповідає на негативні відгуки, а автори відгуків кажуть, що повідомлення ігноруються."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "Чинні умови називають Repocket Pte. Ltd. у Сінгапурі; старіші умови не називали жодної компанії."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket публікує власний Docker-образ, repocket/repocket, а його умови дозволяють контейнери, якими ви володієте."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Мінімум низький: $4 до першої виплати і $2 після неї."
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io дає змогу ділитися своїм GPU для розподілених ШІ-навантажень і заробляти баланс Salad, який можна обміняти на подарункові картки, ігри або гроші. Лише Windows, з нативним застосунком для ПК. Потрібен дискретний GPU (NVIDIA або AMD). Коли ваша машина простоює, платформа спрямовує на неї ШІ-інференс, рендеринг та інші обчислювальні завдання. Одна з найзручніших для користувача платформ для обміну GPU.\n"
  source: "09335baccea6"
salad.short_description:
  text: "Обмін GPU для ШІ — лише Windows, виплати подарунковими картками або грошима"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Заробіток залежить від моделі GPU та наявності роботи. RTX 3060 ~$1-3 на день. Лише Windows. Нативний застосунок, без підтримки Docker. Можна обміняти на подарункові картки, ігри або PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal або подарункові картки через магазин Salad."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Лише PayPal і подарункові картки, ніколи не криптовалюта. Адреси гаманця немає, тому CashPilot не має ончейн-балансу для показу."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Увійдіть на <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, натисніть F12 → Application → Cookies і скопіюйте значення cookie <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Заробіть трохи Salad Reward Points або витратьте баланс"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Якщо акаунт не заробляє Reward Points 12 місяців поспіль, його невикористаний баланс може згоріти."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Запустіть застосунок Salad і дочекайтеся заробітку або витратьте весь баланс у Salad Storefront. Якщо витратити лише частину, відлік 12 місяців не почнеться заново."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot не запускає Salad: ви користуєтеся власним застосунком провайдера для ПК, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Кілька авторів відгуків на Trustpilot у жовтні та листопаді 2026 року повідомляють, що виведення через PayPal надходили швидко, у деяких — не один раз; один автор відгуку за той самий період каже, що повторні спроби виведення не вдалися."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel — блокчейн Layer 1 на Cosmos для децентралізованого VPN. Оператори вузлів продають трафік користувачам VPN за гнучкими цінами (за GB або погодинно). Є офіційний посібник із розгортання в Docker. Давній проєкт з активною спільнотою.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "Децентралізований VPN на Cosmos — оператори вузлів продають трафік"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Оператори самі встановлюють ціни за GB або погодинно. Заробіток залежить від попиту користувачів VPN у вашому регіоні."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "За сесію"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Оплата в токені P2P, і 20% кожного платежу за трафік отримують стейкери, а не хост вузла."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "Токен перейменовували з SENT на DVPN у 2021 році та з DVPN на P2P у 2025 році."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot не запускає Sentinel: ви користуєтеся власним ПЗ вузла від провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel публікує вихідний код вузла під власною ліцензією з відкритим кодом."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia — децентралізований маркетплейс сховища, яким керує Sia Foundation (швейцарська некомерційна організація) і який працює з 2015 року. Запустіть офіційний вузол hostd від Foundation, щоб здавати в оренду вільне місце на диску й заробляти Siacoin за контракти на зберігання та трафік. Перш ніж вузол зможе заробляти, вам потрібно купити трохи Siacoin: хости блокують заставу під кожен контракт і платять комісію за кожен доказ зберігання. Застава повертається, коли контракт завершується, і спалюється, якщо вузол виходить з мережі або втрачає дані, тому потрібна машина, що працює постійно (Sia називає щонайменше 95% часу безперервної роботи). Заробіток залежить від того, скільки даних орендарі справді зберігають; Sia рекомендує ціну на зберігання $1 за TB на місяць, тож це підходить машинам із великими вільними дисками, а не маленьким VPS.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Вузол сховища Sia Foundation — офіційний Docker-образ, заробіток у Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Сід-фраза гаманця"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Пароль панелі"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Каталог сховища"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "Сід-фраза BIP-39, яка керує гаманцем Siacoin хоста. Створіть її командою `docker run --rm ghcr.io/siafoundation/hostd seed` і збережіть резервну копію — це ЄДИНИЙ спосіб дістатися до заробітку"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Пароль для вебінтерфейсу hostd і локального API (BasicAuth). Будь-яка довга парольна фраза"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Шлях на хості на вашому найбільшому диску, де зберігаються дані орендарів (наприклад, /srv/sia). Потрібно щонайменше 256GB вільного місця"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Під час розгортання CashPilot створює новий гаманець на машині, де працює вузол, і один раз показує його сід-фразу: запишіть її. Щоб використати гаманець, який у вас уже є, натомість вставте його сід-фразу. Після розгортання надішліть трохи Siacoin на гаманець вузла для застави та комісій, потім додайте папку сховища (/storage), встановіть ціни й оголосіть хост на панелі.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "Сід-фраза гаманця (hostd.yml), база даних гаманця, налаштування хоста та стан контрактів. Якщо його втратити, буде втрачено ідентифікатор вузла й облік доходів за контрактами; тоді записана вами сід-фраза — єдиний спосіб відновити кошти."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Збережені дані орендарів. Якщо їх утратити, докази зберігання не пройдуть, і застава, заблокована під ці контракти, буде втрачена."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Хости самі встановлюють ціни. Sia рекомендує $1 за TB збережених даних на місяць і понад $5 за TB завантажених, а 3.9% кожної виплати за контрактом отримують власники Siafund. Дохід зростає разом з обсягом даних орендарів на вузлі, який починається з нуля й зростає залежно від часу безперервної роботи та ціни. Застава (Sia радить 2x від ціни зберігання) блокується під кожен контракт і повертається після його успішного завершення.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Заробіток накопичується у власному гаманці Siacoin хоста (під керуванням сід-фрази). Обміняйте SC на біржі й виведіть звідти на банківський рахунок або картку; запиту на виплату з боку провайдера немає.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Кошти зберігаються в гаманці Sia всередині вузла, яким керує сід-фраза. Сід-фраза зберігається лише в томі даних hostd на машині, де він працює; CashPilot ніколи її не зберігає. Фраза, яку ви записуєте під час створення гаманця, — єдиний спосіб відновлення.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Стабільна публічна адреса з перенаправленими портами 9981 (TCP, консенсус) і 9984 (TCP і UDP, контракти з орендарями). Хостинг у дата-центрах і на VPS у Sia поширений. Перш ніж вузол зможе брати контракти, на гаманці має бути Siacoin."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Місце на диску й трафік для його обслуговування."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Ні. Орендарі зберігають на вашому диску зашифровані фрагменти файлів і забирають їх назад. Інші люди не пропускають через вашу IP довільний трафік."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Адреса вашого гаманця Sia, публічний ключ хоста та публічні IP:порт, які вузол оголошує, щоб орендарі могли до нього підключитися."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Постійний трафік вивантаження й завантаження на лінії, як у будь-якого сервера зберігання; анонімізований вебтрафік третіх осіб вам не приписується."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Без дозволів: ні реєстрації, ні акаунта. Застава спалюється, якщо вузол пропускає докази зберігання, вийшовши з мережі або втративши дані."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Заробіток — це Siacoin у вашому власному гаманці: виплати на банківський рахунок немає, тож продавати на біржі доводиться самостійно."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "Застава блокується під кожен контракт і спалюється, якщо хост пропускає докази зберігання, вийшовши з мережі або втративши дані."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Використовується лише близько 30% сховища, яке пропонують у мережі, тож новий хост конкурує за невеликий попит."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Орендарі зберігають зашифровані фрагменти файлів, і ніхто не пропускає трафік через вашу IP, але ми не знайшли, де Sia каже, хто такі орендарі і як їх перевіряють."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd відкрито розробляє Sia Foundation з 2022 року."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd має відкритий код під ліцензією MIT."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Sia Foundation публікує hostd як образ контейнера."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Без дозволів: ні реєстрації, ні акаунта."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide — сервіс обміну трафіком, який дає змогу монетизувати невикористаний інтернет-трафік. Використовує необов'язковий ID машини для відстеження пристроїв. Доступний через спільнотні Docker-образи з проєкту income-generator.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Обмін трафіком — на основі ID машини"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "ID машини"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "ID машини для вже зареєстрованого пристрою (створюється автоматично, якщо поле порожнє)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Інформації мало. Заробіток залежить від місця розташування."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
spide.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% їхнього заробітку"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "Бонус $5 за реєстрацію"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "Трафік через одну публічну IP розподіляється між пристроями, які її спільно використовують, тож другий пристрій на тому самому підключенні нічого не додає."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot не запускає Spide: ви користуєтеся власним застосунком провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Майніть Pearl, Zano або Ravencoin на одному GPU NVIDIA. Під час першого запуску CashPilot завантажує офіційний реліз SRBMiner-Multi і перевіряє його SHA-256. Обраний вами пул платить на вашу публічну адресу виплат. SRBMiner-Multi залишає собі 2% часу хешування на Pearl і 0.85% на двох інших монетах. Електроенергія може коштувати більше, ніж монети, які ви заробляєте."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Майнінг Pearl та інших GPU-монет на GPU NVIDIA"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Адреса виплат"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "Назва воркера"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "Алгоритм"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "Пул (host:port)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "Шифрувати з'єднання з пулом (TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "Ваша публічна адреса Pearl (prl1...). Для Zano або Ravencoin введіть адресу цієї монети та пул для неї."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash для Pearl, progpow_zano для Zano, kawpow для Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.docker.runtime_reason:
  text: "gVisor не може передати йому GPU."
  source: "302a2b5c988f"
srbminer-multi.earnings.notes:
  text: "Валова оцінка без урахування електроенергії. 2026-11-25 hashrate.no оцінив заробіток на Pearl для RTX 4070, що споживає близько 142 W, приблизно в $2.45 на день. Ми цього не вимірювали. Pearl — нова монета, і її ціна та складність швидко змінюються. Перевірте споживання свого GPU і ціну на електроенергію, щоб зрозуміти, чи це окупається."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Коли досягнуто порогу пулу"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "Пул платить на вашу адресу, коли ваш баланс досягає вашого порогу. Доти пул зберігає баланс у себе."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, GPU NVIDIA і NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Ця машина повідомляє про підключення хостингу. Перш ніж майнити, перевірте умови свого провайдера. Деякі провайдери, зокрема Hetzner Cloud, це забороняють. Перш ніж покладатися на оцінку прибутку, перевірте свої реальні витрати на електроенергію."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "Комісія майнера 2% стосується pearlhash. На progpow_zano і kawpow SRBMiner-Multi залишає собі 0.85%. HeroMiners, стандартний пул для Pearl, бере комісію пулу 1%. Він перевіряє виплати щогодини й платить від 1 PRL. Інші пули встановлюють власні ставки та пороги."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "обчислення"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "Ні. Майнер надсилає результати роботи обраному вами пулу."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Ваша адреса виплат, назва воркера та IP-адреса надходять до пулу. Під час першого запуску майнер завантажується з GitHub."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Деякі мережі та DNS-резолвери блокують підключення до майнінгових пулів."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "Більшість пулів ідентифікують вас за публічною адресою виплат."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "Майнер залишає собі 2% часу хешування на Pearl і 0.85% на Zano та Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Деякі хостинг-провайдери забороняють майнінг криптовалют."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "Майнер має закритий код, тож ніхто, крім його розробника, не може перевірити, що він виконує."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "Електроенергія для GPU може коштувати більше, ніж зароблені монети, а ціна Pearl швидко змінюється."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "Майнер надсилає результати роботи пулу й не ретранслює нічийого іншого трафіку."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Ви можете майнити Pearl на HeroMiners з публічною адресою і без акаунта."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj — децентралізована мережа хмарного сховища, де ви заробляєте, здаючи в оренду невикористане місце на диску. Запустіть вузол сховища через Docker і отримуйте $1.35/TB за збережені дані на місяць плюс $1/TB за вихідний трафік (ставки з 1 вересня 2026 року). Виплати щомісячні в USDC, стейблкоїні, прив'язаному до долара США, в основній мережі Ethereum на гаманець, яким керуєте ви, щойно баланс перевищить мінімум, що залежить від комісії (до виплати за вересень 2026 року — у токені STORJ). Потрібно щонайменше 550GB вільного місця на диску й стабільне інтернет-підключення. Акаунт чи реєстрація не потрібні — з середини 2025 року вузли працюють без дозволів. УВАГА (жовтень 2026 року): 26 липня 2026 року Storj Labs подала заяву за Chapter 11 (Суд у справах про банкрутство США, Північний округ Західної Вірджинії, справа 5:26-bk-00512), щоб реструктуризувати старі борги. Мережа продовжує працювати, і Storj продовжує платити активним вузлам, але заробіток вузлів до подання заяви заморожено, доки суд не ухвалить щодо нього рішення. Токен STORJ упав приблизно на 98% від свого піку 2021 року. Binance виключила його з лістингу 3 вересня 2026 року, а Coinbase призупинила торгівлю ним 28 вересня 2026 року. Новий вузол утримує частину свого заробітку протягом перших дев'яти місяців і заповнюється лише настільки, наскільки дозволяє попит клієнтів, тож запуск вузла зараз пов'язує довгий термін окупності з компанією в процесі реструктуризації, яка ще може припинити діяльність.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Вузол децентралізованого сховища — $1.35/TB за зберігання + $1/TB за вихідний трафік"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Адреса гаманця"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "Електронна пошта"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "Зовнішня адреса"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Виділене місце"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Каталог ідентифікатора"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Каталог сховища"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Адреса гаманця Ethereum для виплат у USDC (наприклад, 0x1234...abcd). Гаманець має бути некастодіальним (MetaMask, Ledger тощо) — ніколи не використовуйте адресу біржі"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "Адреса електронної пошти для сповіщень оператора"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "Ім'я хоста DDNS з портом (наприклад, mynode.ddns.net:28967) — це значно краще, ніж конкретна IP, через яку вузол залишиться недоступним того дня, коли ваш інтернет-провайдер непомітно змінить її. Порт 28967 має бути перенаправлено (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Максимальний обсяг диска для виділення (наприклад, 2TB). Використовуйте жорсткі диски (HDD), а не SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Шлях на хості, де зберігаються файли ідентифікатора (має містити ca.cert, ca.key, identity.cert, identity.key)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Шлях на хості на жорсткому диску (HDD) для зберігання даних Storj. Потрібно щонайменше 550GB вільного місця"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Перед першим запуском ініціалізуйте конфігурацію вузла сховища: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Ідентифікатор вузла. Його ID прив'язаний до proof-of-work, на його повторне створення йдуть години, і його неможливо відтворити з резервної копії чогось іншого. Якщо його втратити, утримуваний баланс виплат буде анульовано."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Збережені дані клієнтів і утримувана сума вузла. Якщо їх утратити, вузол буде дискваліфіковано, а утримуваний баланс анульовано."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Мережа Storj не може підключитися до вашого вузла за оголошеною адресою ADDRESS, тому сателіти вважають його офлайн: нові дані перестають надходити, дохід від вихідного трафіку зупиняється, а тривалий час офлайн призводить до призупинення. Перевірте, що ADDRESS збігається з вашою ПОТОЧНОЮ публічною IP (використовуйте ім'я хоста DDNS, а не конкретну IP, щоб зміна IP інтернет-провайдером не зробила вузол недоступним) і що порт 28967 TCP+UDP перенаправлено на цю машину."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB за зберігання + $1/TB за вихідний трафік + $1/TB за аудит/відновлення з 1 вересня 2026 року. Заробіток зростає разом з обсягом збережених даних і віком вузла. Протягом перших 9 місяців утримується 75%, потім 50%, потім 25% заробітку; половина утримуваної суми повертається на 16-й місяць, а решта — під час коректного виходу з мережі (graceful exit). Порт 28967 має бути перенаправлено."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4x комісії за транзакцію Ethereum, менші баланси переносяться"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Щомісяця"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Виплачується щомісяця в USDC в основній мережі Ethereum, щойно баланс гаманця щонайменше вчетверо перевищить поточну комісію за транзакцію; менші баланси переносяться на наступний місяць. До виплати за вересень 2026 року — у токені STORJ. Панель на порту 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Виплачується щомісяця в USDC в основній мережі Ethereum на адресу з WALLET, щойно баланс перевищить мінімум, що залежить від комісії. До виплати за вересень 2026 року — у токені STORJ; виплати в zkSync Era припинилися 1 вересня 2026 року."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "URL панелі вузла на порту 14002 з LAN-IP сервера, а не localhost, наприклад <b>http://192.168.1.10:14002</b>. Для кількох вузлів перелічіть їхні URL через кому: CashPilot підсумує їх."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Вузли Storj в одній підмережі /24 ділять між собою розподіл даних, що зменшує заробіток кожного вузла."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps на вивантаження"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Місце на диску й трафік для його обслуговування."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Ні. Ви зберігаєте зашифровані фрагменти даних клієнтів, закодовані з надлишковістю (erasure coding). Інші люди не пропускають свій трафік через вашу IP."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "Ідентифікатор вузла, адреса вашого гаманця, адреса електронної пошти, яку вузол вимагає для сповіщень оператора, а також ваші IP і порт, які мають бути доступні, щоб вузол міг віддавати дані."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "Здебільшого це питання ліміту трафіку, а не відповідальності: вузол постійно віддає й приймає дані клієнтів, і це реальний тривалий трафік на вашій лінії. Але на відміну від проксі чи ретранслятора, це не анонімізований трафік третіх осіб, джерелом якого вважають вас, тож він не викликає таких скарг на зловживання."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Необмежена кількість вузлів, але вузли в одній підмережі /24 ділять розподіл даних, тож кілька вузлів на одному підключенні заробляють кожен менше."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk повідомив 27 липня 2026 року, що Storj Labs подала заяву про захист від банкрутства за Chapter 11."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Платежі операторам вузлів, належні до подання заяви, потрапили в процедуру вимог кредиторів у справі про банкрутство."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "У нового вузла протягом перших дев'яти місяців утримується 75%, потім 50%, потім 25% заробітку; половина повертається на 16-й місяць, а решта — лише під час коректного виходу з мережі."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Клієнти зберігають зашифровані фрагменти файлів, і ніхто не пропускає трафік через вашу IP, але ми не знайшли, де Storj каже, хто такі клієнти і як їх перевіряють."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "ПЗ вузла сховища має відкритий код під ліцензією AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj публікує власний Docker-образ, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Без акаунта: адреса гаманця й електронна пошта для сповіщень оператора."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Активні вузли й далі отримували оплату після подання заяви."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR — пул для майнінгу Monero без акаунта: ваш майнер входить, використовуючи вашу адресу Monero як ім'я користувача, і пул платить на цю адресу. CashPilot тут не запускає майнер. Він зчитує баланс, який SupportXMR зберігає для вашої адреси, тож ви бачите, скільки заробив ваш CPU-майнер, поруч з іншими доходами. Баланс зароблено, але ще не отримано: пул виплачує його, щойно він перевищить ваш поріг виплати.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Пул для майнінгу Monero, відстеження за адресою виплат"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (автоматично), 0.01 XMR за запитом"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Коли баланс перевищить ваш поріг або за запитом"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR платить на вашу адресу, щойно баланс досягне вашого порогу (за замовчуванням 0.1 XMR). На його сайті також можна запросити миттєву виплату від 0.01 XMR з комісією 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Баланс зароблено, але не отримано, доки SupportXMR не виплатить його на цю адресу. Баланси Monero неможливо прочитати ончейн без приватного ключа перегляду (view key), якого CashPilot ніколи не просить, тому кожну виплату ви підтверджуєте самі."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Ваша адреса виплат Monero: ім'я користувача, яке ваш майнер використовує на SupportXMR, без частин <b>.workername</b> чи <b>+difficulty</b>. Вона публічна й не дає доступу до коштів."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Потрібен майнер Monero (XMRig), направлений на pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "обчислення"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Ні. Ваш майнер надсилає хеші пулу; ніхто не пропускає трафік через ваше підключення."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Ваша адреса Monero, обрані вами назви воркерів, ваш хешрейт та IP-адреса вашого майнера, як її бачить пул."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Майнер тримає одне відкрите з'єднання з пулом і використовує мало трафіку. Стежити варто за витратами на електроенергію, а не за інтернет-провайдером."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Акаунта немає. Ідентифікатором є адреса, і будь-хто може переглянути її статистику на supportxmr.com."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Оплата лише в Monero, з комісією пулу 0.6% і стандартним порогом 0.1 XMR для автоматичної виплати."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot не запускає майнер для SupportXMR: ви самі направляєте свій майнер на пул, а CashPilot лише зчитує баланс."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol дає ШІ-агентам доступ до живого вебу через мережу Beacons. Teneo Beacon — власний застосунок Teneo для Android, iOS, macOS, Windows і Linux, з версією командного рядка для серверів і Raspberry Pi. Він ділиться вашим невикористаним трафіком після того, як ви приймете екран згоди, і заробляє Teneo Protocol Points і Fragments, поки працює онлайн. Fragments зараховуються до сезонних розіграшів із призами в USDC (Beacon Drop). Teneo каже, що Beacon заробляє вдвічі більше балів, ніж його старіше розширення для браузера. На одне інтернет-підключення заробляє один Beacon. Інші пристрої на тому самому підключенні перебувають у режимі очікування. Зареєструйтеся в Expedition Hub за реферальним посиланням або з кодом PSA3BHPJ, а потім увійдіть у Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "Застосунок трафіку DePIN (Beacon) — Fragments для сезонних розіграшів USDC, +100 Fragments за реферальним посиланням"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Заробляє Teneo Points і Fragments. Fragments зараховуються до сезонних розіграшів USDC, тож сезон дає приз, а не фіксовану ставку. Teneo каже, що Beacon заробляє вдвічі більше балів, ніж розширення для браузера. Активуйте буст кожні 8 годин, щоб отримувати до 3x Fragments; пропущене вікно знижує множник."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Сезонний розіграш (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Призи Beacon Drop виплачуються в USDC на гаманець, який ви прив'язуєте в Expedition Hub. Hub показує, скільки днів у вас є, щоб прив'язати гаманець; приз, до якого вчасно не прив'язано гаманець, анулюється."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Прив'яжіть гаманець в Expedition Hub до виплати призів сезону; Hub анулює приз, якщо гаманець не прив'язано вчасно."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% Fragments кожного запрошеного друга і 2% Fragments його рефералів, якщо друг зареєструється протягом 7 днів і заробить 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments під час реєстрації і ще +150, коли ви досягнете 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "На одне інтернет-підключення заробляє один Beacon. Машини в дата-центрах заробляють лише в тих хостинг-провайдерів, яких Teneo дозволив, — з половиною Fragments і без балів та реферального бонусу. VPN-підключення ніколи не заробляють."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Fragments від Beacon дають USDC лише як призи в сезонних розіграшах, тож його робота не приносить фіксованої суми."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo каже, що бали буде об'єднано в $AGENTIC — непередаваний токен винагород, а не токен $TENEO."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "Станом на листопад 2026 року не було підтверджено ні дати запуску $TENEO, ні розподілу, ні процедури отримання, а попередня ціль — другий квартал 2026 року — минула."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot не запускає Teneo: ви встановлюєте власний застосунок Beacon від провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo каже, що трафік надходить від перевірених бізнес-клієнтів, і блокує приватні адреси та порти, схильні до зловживань, але не каже, як перевіряє цих клієнтів."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network — усталена децентралізована мережа доставки відео та ШІ-обчислень (з 2018 року). Користувачі запускають Edge Nodes, які надають трафік, сховище та обчислювальну потужність. Великі контентні партнерства. Заробляє токени TFUEL.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "Децентралізована CDN + ШІ-обчислення — винагороди в TFUEL, усталений проєкт"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Лише застосунок для ПК. Заробіток залежить від ресурсів і місця розташування. Великі партнерства, токен є на всіх біржах."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Безперервно"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot не запускає Theta Edge: ви користуєтеся власним застосунком провайдера для ПК, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "893de938ed14"
titan.description:
  text: "Titan Network — платформа DePIN, яка надає вашу IP-адресу, сховище й трафік в обмін на винагороди в токенах TNT. Доступна для Windows, Mac і Android. Вузли беруть участь у децентралізованій CDN і шарі зберігання. Типовий заробіток — $5-30 на місяць залежно від наданих ресурсів і географічного розташування.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN: надання IP, сховища, трафіку — $5-30 на місяць"
  source: "799e68401067"
titan.earnings.notes:
  text: "Надає IP, сховище й трафік. Заробіток залежить від наданих ресурсів і регіону. Більший обсяг виділеного сховища дає більші винагороди."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "За епохами"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Власна довідка Titan каже, що працюючий вузол не гарантує заробітку: без призначеного завдання він нічого не заробляє, а винагороди нараховуються в токені TNT."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot не запускає Titan: ви користуєтеся власним застосунком або розширенням провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer дає змогу монетизувати ваш інтернет-трафік, ділячись ним із перевіреними компаніями. Один із небагатьох сервісів обміну трафіком, який добре працює не лише на домашніх підключеннях, а й на IP VPS і дата-центрів. Використовує просту автентифікацію за токеном, що передається через аргументи командного рядка. Підтримує архітектури ARM для Raspberry Pi та подібних пристроїв.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Обмін трафіком — працює на VPS, автентифікація за токеном"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Токен"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Назва пристрою"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Увійдіть на <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, натисніть F12 → Application → Local Storage → клацніть <code>https://app.traffmonetizer.io</code> → скопіюйте значення <code>authToken</code> (близько 54 символів: цифри, <code>|</code>, потім літери й цифри)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Назва, що відображається на панелі для керування пристроями"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "IP VPS і дата-центрів заробляють менше, ніж домашні. Розташування в США та ЄС заробляють більше. Кілька IP підтримуються через мережі Docker."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Мінімум $10. PayPal більше не пропонується. Спершу збережіть у профілі один спосіб виплати: USDT у Solana або TON (найнижчі комісії), Arbitrum (низькі комісії) чи Tron TRC20 (високі мережеві комісії), або банківський переказ від $1,000. Перша збережена адреса діє одразу; щоб змінити її пізніше, потрібне підтвердження електронною поштою. Перед першим виведенням панель може попросити контакт у месенджері (WhatsApp, Telegram або Skype). Запит виплачує цілі долари, а центи залишаються на балансі."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT у мережі, збереженій у налаштуваннях виплат профілю (Solana, TON, Arbitrum або Tron), або банківський переказ. Адреса зберігається в налаштуваннях Traffmonetizer, а не в контейнері."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Увійдіть на <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, натисніть F12 → Application → Local Storage → значення <b>authToken</b> (близько 54 символів: цифри, <code>|</code>, потім літери й цифри)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% від кожної виплати, яку вони запитують"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Умови використання Traffmonetizer вимагають домашньої IP, але на практиці вузли на VPS приймаються."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "На Trustpilot рейтинг 1.9; автори відгуків з 2023 по листопад 2026 року повідомляють про виплати, що тижнями перебувають в очікуванні або позначені як виконані без відповідної транзакції."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Ті самі автори відгуків повідомляють, що підтримка в онлайн-чаті та електронною поштою не відповідає, іноді тижнями."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Лише криптовалюта або банківський переказ від $1,000; PayPal більше немає, а запит виплачує лише цілі долари."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Умови Traffmonetizer вимагають домашньої IP, тож сервер на підключенні хостингу їм не відповідає."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Четверо авторів відгуків на Trustpilot з 2023 по 2025 рік повідомляють про дуже повільний заробіток: наприклад, один цент на день на чотирьох пристроях або майже два роки, щоб досягти $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Для виплати потрібна лише збережена криптоадреса, підтверджена електронною поштою; панель може попросити контакт у месенджері."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer публікує власний Docker-образ, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Майніть на своєму CPU й отримуйте оплату в обраній монеті, наприклад SHIB, DOGE або XMR. CashPilot запускає XMRig на пулі RandomX від unMineable, а unMineable конвертує Monero, який намайнив ваш CPU, у вашу монету. Він платить на вашу публічну адресу, щойно баланс досягне порогу виплати для цієї монети. Кожен воркер, який розгортає CashPilot, містить реферальний код CashPilot для unMineable, що знижує вашу комісію платформи з 1% до 0.75%. Електроенергія може коштувати більше, ніж ви заробляєте."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Майніть на CPU й отримуйте оплату в обраній монеті"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "Монета для виплат"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "Адреса виплат"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "Назва воркера"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "Макс. потоків CPU (%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "Режим RandomX"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "Тікер монети, якою платить unMineable, наприклад SHIB, DOGE або XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "Ваша публічна адреса для цієї монети. Монети, яким потрібен memo або tag, не підтримуються."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Валова оцінка без урахування електроенергії, оплата у вашій монеті за курсом конвертації unMineable. Станом на 2026-11-25 1 kH/s на RandomX приносив приблизно $1 на місяць. Настільний CPU, що використовує половину своїх потоків, може додатково споживати від 30 до 50 W. Перевірте своє реальне споживання і ціну на електроенергію, щоб зрозуміти, чи це окупається."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "Встановлює unMineable для кожної монети (0.03 XMR станом на 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Коли досягнуто порогу виплати для монети"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable платить на вашу адресу, щойно баланс досягне порогу виплати для монети. Пороги різняться залежно від монети й мережі; CashPilot зчитує той, який unMineable повідомляє для вашої адреси."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Баланс зароблено, але не отримано, доки unMineable не виплатить його на цю адресу. Мережа залежить від обраної вами монети."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "Та сама адреса виплат і тікер монети, з якими ви розгорнули майнер, наприклад <b>XMR</b>. Введіть лише адресу, без монети, назви воркера чи реферального коду. Вона публічна й не дає доступу до коштів."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
