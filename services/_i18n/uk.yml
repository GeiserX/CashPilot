  text: "Адреса WebUI"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "Діапазон портів UDP"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "Адреси хоста, на яких публікується WebUI вузла (порт 4449). 127.0.0.1 залишає його доступним лише на цій машині. Щоб відкривати його через зворотний проксі, додайте адресу, до якої підключається проксі, через кому без пробілів: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "Порти UDP, які вузол використовує для VPN-сесій, у форматі start:end. Перенаправте той самий діапазон на своєму роутері. Кожна сесія займає приблизно два порти, тож стандартні 30 портів обслуговують близько 15 сесій одночасно — більше, ніж отримує домашній вузол. Ширший діапазон нічого не виправляє і коштує дорожче: кожен опублікований порт сповільнює запуск і видалення вузла (300 портів запускаються приблизно 12 s), CashPilot приймає не більше 300, а зі стандартним userland proxy Docker кожен порт ще й займає приблизно 2.5 MB пам'яті. Якщо всі сесії завершуються помилкою, проблема в роутері, а не в нестачі портів: див. розділ «Routers that rewrite UDP source ports» у посібнику Mysterium. Тримайте діапазон нижче 32768: порти 32768-60999 — це ефемерний діапазон Linux, де будь-яка програма на хості може на мить зайняти порт, а один зайнятий порт зриває запуск вузла. Вузол, який уже має діапазон, зберігає його."
  source: "530524e2e718"
mysterium.docker.runtime_reason:
  text: "gVisor не дає йому ні iptables-nft, ні WireGuard ядра, а вони потрібні йому для передавання трафіку."
  source: "d8a72a275579"
mysterium.docker.critical_volumes.0.holds:
  text: "Сховище ключів ідентифікатора вузла. Якщо його знищити, буде створено зовсім новий ідентифікатор: вузол утратить репутацію і весь заробіток, що ще утримується за старим."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "Вузол не може виконати sudo у своєму контейнері, тому не може налаштувати свій VPN-інтерфейс чи файрвол, і кожна сесія завершується помилкою ще на етапі налаштування: він виглядає онлайн, але нічого не заробляє. Контейнер створено без можливостей SETUID і SETGID. Оновіть CashPilot і воркер, на якому працює цей вузол, а потім перерозгорніть Mysterium з панелі; ідентифікатор вузла зберігається в його томі даних і не втрачається."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "За останні 6 годин жодна VPN-сесія не дійшла до цього вузла напряму. Усі вони перейшли на hole punching, а багатьом покупцям так підключитися не вдається, тому вузол заробляє менше. Його порти UDP недоступні з інтернету. На своєму роутері перенаправте діапазон портів UDP ${UDP_PORTS} (start:end, однаковий діапазон з обох боків) на ${HOST_ADDRESS}. Це зникне саме, щойно якась сесія підключиться напряму."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Моніторинг Mysterium позначає вузол на ${WORKER_NAME} як несправний, тому його немає в списку вузлів, з якого обирає більшість покупців, навіть коли його власна перевірка показує, що всі порти доступні. Спершу переконайтеся, що вузол має /dev/net/tun і SETUID/SETGID: без них він так само отримує позначку несправного: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Якщо все це на місці, поширена причина — роутер перед ${WORKER_NAME}, який переписує вихідний порт UDP у відповідях вузла, щойно пакет ззовні досягне цього порту. Див. тест у посібнику: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "Останні п'ять VPN-сесій вузла на ${WORKER_NAME} завершилися приблизно через хвилину, не передавши жодних даних, тож він нічого не заробляє, хоча виглядає онлайн. Імовірна причина — роутер перед ${WORKER_NAME}: щойно пакет ззовні досягає порту, роутер переписує вихідний порт у наступних відповідях вузла з цього порту, а кожна сесія починається саме з такого пакета (власної перевірки портів вузла), тому покупці відкидають відповіді вузла. Ширший діапазон портів не допоможе. Див. тест і способи виправлення в посібнику: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Це зникне, щойно якась сесія передасть дані."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Заробіток у токенах MYST. Домашні IP заробляють значно більше. WebUI вузла для керування працює на порту 4449 і за замовчуванням публікується лише на машині, де працює вузол (127.0.0.1); з іншої машини спершу відкрийте SSH-тунель (ssh -L 14449:127.0.0.1:4449 і адреса машини вузла, потім відкрийте в браузері http://127.0.0.1:14449; локальний порт 14449, щоб він не конфліктував із вузлом на вашій власній машині) або додайте адресу до UI_ADDRESS (див. «Адреса WebUI» в посібнику Mysterium). VPS приймаються. Наполегливо рекомендується перенаправити порти UDP 23000-23029 (стандартне значення UDP_PORTS) — без цього вузли отримують статус Strict NAT, і багато VPN-сесій завершуються помилкою, що суттєво зменшує дохід. Важливо: після першого запуску вкажіть гаманець бенефіціара (для розрахунків) через WebUI вузла або CLI так, щоб він збігався з вашим акаунтом на mystnodes.com, — це пов'язує ончейн-заробіток із вашою хмарною панеллю."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Автоматичний ончейн-розрахунок щоразу, коли на вузлі накопичується 5 MYST без розрахунку"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Натискати нічого не потрібно. Кожен вузол сам проводить розрахунок у Polygon, щойно на ньому накопичиться 5 MYST без розрахунку, і близько 21% іде на комісії (20% комісія Hermes плюс невелика комісія за транзакцію), тож за кожен розрахунок на гаманець бенефіціара надходить приблизно 3.9 MYST. TequilAPI кожного вузла показує його розрахунки за адресою /transactor/settle/history. Цифра «total earnings» на MystNodes охоплює лише останні 30 днів; це не баланс і не загальна сума за весь час. Бонусні MYST із програми винагород MystNodes самі не розраховуються: отримайте їх на сторінці Rewards протягом 30 днів після розподілу, як сказано в довідковому центрі MystNodes."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "Гаманець бенефіціара вказується ПІСЛЯ розгортання, через TequilAPI або WebUI вузла, — а не через змінну середовища, тому його неможливо прочитати зі специфікації контейнера."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Використайте електронну пошту й пароль свого акаунта MystNodes (ті самі, що на <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST за кожного друга, чий вузол заробить 5 MYST (лише домашні IP)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST, щойно ваш вузол заробить перші 5 MYST (домашня IP, вузол прив'язано на mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Отримайте винагороди MystNodes за минулий місяць"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Винагороди, не отримані протягом 30 днів після щомісячного розподілу, анулюються й повертаються в пул наступного місяця."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Відкрийте сторінку Rewards і обміняйте свої бали на MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Трафік. Ваше підключення використовується як вихідний вузол мережі Mysterium, яка продає послуги VPN, проксі ТА збирання даних (скрейпінгу). Трафік скрейпінгу, що виходить із домашньої IP, найімовірніше викликає скарги, і ви не можете обрати, який із трьох видів трафіку передає ваш вузол."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Так. Сторонні люди пропускають свій трафік через вашу IP-адресу — у цьому й полягає продукт."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "Ідентифікатор вузла (блокчейн-адреса), ваша IP і приблизне місце розташування (країна/місто/інтернет-провайдер), які вузол публікує в мережі, щоб покупці могли його обрати."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Реальний, і його варто розуміти. Трафік інших людей виходить із вашого підключення й приписується вам, тож усе, що вони роблять, виглядає так, ніби походить із вашої лінії. Багато договорів домашніх інтернет-провайдерів це забороняють. Перевірте свій, перш ніж запускати."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Необмежена кількість пристроїв на акаунт і на IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Близько 21% кожного розрахунку йде на комісії — 20% комісія Hermes плюс комісія за транзакцію, — а заробіток виплачується в токені MYST."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Ваш вузол є вихідним для клієнтів Mysterium, які купують VPN, проксі та збирання даних, і ви не можете обрати, чий трафік він передає."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "ПЗ вузла має відкритий код під ліцензією GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium публікує власний Docker-образ, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "Розрахунок надходить на гаманець, яким володієте ви; не потрібні ні номер телефону, ні документ."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "Проєкт вузла працює з 2017 року."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "На сайті Mysterium сказано, що мережу розробляє Blockdev AG, Цуг, Швейцарія."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay — мережа DePIN, яка винагороджує користувачів за обмін трафіком через розширення для браузера. Платформа працює під захистом Cloudflare, що може ускладнювати автоматизований доступ. Користувачі заробляють Nodepay Points, тримаючи розширення активним. Мережа зосереджена на створенні інфраструктури даних для навчання ШІ.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "Обмін трафіком DePIN для ШІ — розширення для браузера"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Заробляє Nodepay Points; бали користувачів, які проходять перевірки відповідності Nodepay, конвертуються в токен NC. Захист Cloudflare може блокувати автоматизоване збирання даних. Потрібне розширення для браузера."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Аірдроп токена NC (терміни не підтверджено)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Система на основі балів. Бали користувачів, які проходять перевірки відповідності Nodepay, конвертуються в токен NC, запущений у січні 2025 року."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "Під час огляду першого сезону Nodepay видалив понад 300,000 акаунтів, які вважав ботами, і анулював 17 мільярдів балів."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Винагороди — це бали, що конвертуються в токен NC, тож їхня вартість залежить від токена."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot не запускає Nodepay: ви користуєтеся власним розширенням для браузера від провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes — безплатний початковий рівень Noderr Protocol, DeFi-проєкту на Base L2. Мікровузол — це невеликий агент на вільному телефоні Android, ПК з Windows, Mac або в браузері Chromium. На Android він ділиться мобільним підключенням телефону: інший трафік Noderr виходить через IP мобільного оператора телефону, тому потрібна SIM-картка з мобільним інтернетом. На ПК або в браузері він виконує для протоколу завдання автоматизації, використовуючи вільні обчислювальні ресурси. За задумом винагороди мають виплачуватися в NODR залежно від ончейн-оцінки часу безперервної роботи та надійності, але під час бета-тестування мережа працює в тестовій мережі Base Sepolia: винагороди вузлам не мають фінансування, і жодної ще не виплачено.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Безплатний мікровузол (обмін підключенням на Android, Windows, Mac, браузер) — тестова мережа, винагороди поки без фінансування"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Бета в тестовій мережі: винагороди вузлам не мають фінансування, і жодної ще не виплачено. APY 5-10% на сайті — це цільовий показник за задумом. Перегляньте, коли мережа вийде з Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Винагороди накопичуються на власному гаманці вузла, і їх отримують у застосунку або в dApp. Під час бета-тестування це токени тестової мережі Base Sepolia без ринкової вартості."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "Під час першого запуску застосунок створює гаманець вузла й безплатно випускає на нього soulbound Utility NFT. Створіть резервну копію гаманця із застосунку: якщо втратите пристрій, утратите й ідентифікатор вузла. Під час бета-тестування винагороди нараховуються в Base Sepolia (тестова мережа)."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Для Android потрібна SIM-картка з мобільним інтернетом; для клієнтів для ПК і браузера вимог до IP не опубліковано."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Залежить від пристрою. Телефон Android продає своє мобільне підключення: інший трафік Noderr виходить через IP-адресу мобільного оператора телефону і зараховується до його тарифного плану. ПК з Windows, Mac або браузер продають вільні обчислювальні ресурси для завдань, які провайдер називає автоматизацією соцмереж і контенту."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Так. На Android інший трафік Noderr виходить через мобільну IP-адресу вашого телефону; перед початком застосунок просить записану згоду, і на тому самому екрані ви можете припинити обмін. Для клієнтів для Windows, Mac і браузера провайдер описує завдання автоматизації й не каже, чи передають вони трафік інших людей."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "Адреса гаманця вузла та показники часу безперервної роботи й виконання завдань записуються в блокчейн як оцінка репутації (TrustFingerprint). Провайдер каже, що завдання анонімізовано, вони виконуються в пісочниці, а ключі гаманця ніколи не залишають пристрій. Нічого конкретнішого не опубліковано."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "На Android спільним підключенням є мобільний тариф оператора: власна документація провайдера попереджає, що правила допустимого використання деяких операторів можуть забороняти такий обмін, а спільний трафік витрачає ліміт тарифу. Щодо клієнтів для ПК і браузера провайдер нічого не каже про умови інтернет-провайдерів."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Один вузол на пристрій, кожен зі своїм soulbound Utility NFT; запускати кілька пристроїв дозволено й заохочується. Обмеження на IP не опубліковано. Акаунта у звичному розумінні немає: ідентифікатором є гаманець, який застосунок створює під час першого запуску."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Винагороди вузлам — це токени тестової мережі без фінансування й ринкової вартості, і жодної ще не виплачено; APY від 5 до 10% на сайті — це цільовий показник за задумом."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Для клієнтів для ПК і браузера Noderr описує завдання автоматизації й не каже, чи передають вони трафік інших людей."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Провайдер каже, що завдання анонімізовано й виконуються в пісочниці, але нічого конкретнішого не публікує."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Досі бета в тестовій мережі Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot не запускає Noderr: ви користуєтеся власним застосунком або розширенням провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Без акаунта: застосунок створює гаманець під час першого запуску."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle використовує Bluetooth смартфонів для створення інфраструктури IoT. Застосунок пасивно виявляє дані від IoT-пристроїв поблизу й передає їх далі, заробляючи токени NODL. Згадувався у Forbes, має корпоративні партнерства з Vivendi та Hayden AI. Лише для мобільних пристроїв (iOS і Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Ретрансляція IoT через Bluetooth — мобільний застосунок, винагороди в токенах NODL"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Дуже низький заробіток. Фоновий застосунок для телефону, що використовує Bluetooth. Підключення гаманця може працювати нестабільно."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Безперервно"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL зберігаються у власному гаманці застосунку в ZKsync Era; перевіряйте їх у застосунку або в оглядачі блоків ZKsync Era. Nodle покинув свій парачейн Polkadot, а міст Polkadot-ZKsync закрився 31 грудня 2025 року, тож NODL, які залишилися на боці Polkadot, більше не можна перенести в ZKsync."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
nodle.referral.bonus.referrer:
  text: "Винагорода в NODL за кожного нового активного користувача, який приєднався за запрошенням (Nodle не публікує суму)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Один автор відгуку повідомляє, що заробив близько $3 за три-чотири роки; інші повідомляють про різке падіння щоденного заробітку."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot не запускає Nodle: ви користуєтеся власним застосунком провайдера для телефону, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana — децентралізований маркетплейс обчислень на GPU, побудований на Solana. Він з'єднує власників GPU з попитом на ШІ-навантаження й платить токенами NOS. RTX 3060 заробляє приблизно $0.048/hr. Платформа зосереджена на навантаженнях ШІ-інференсу й використовує блокчейн Solana для планування завдань і розрахунків за оплату. Вузли виконують контейнеризовані навантаження через Nosana CLI.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Обчислення на GPU в Solana — токени NOS, RTX 3060 ~$0.048/hr"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/hr, потужніші GPU заробляють більше. Заробіток залежить від наявності завдань і моделі GPU. Потрібні GPU NVIDIA, Linux, Docker і Nosana CLI. Оплата в токені NOS у Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "За кожне виконане завдання"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Заробляються токени NOS у Solana. Виплата на налаштований гаманець."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "За замовчуванням Nosana створює гаманець Solana, тому більшість користувачів ніколи не бачили його адреси."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Кожен хост має заблокувати стейк NOS, розмір якого залежить від погодинної ціни його GPU."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Хостам платять у NOS, тож заробіток у доларах змінюється разом із токеном і з попитом на їхню карту."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot не запускає Nosana: ви користуєтеся власним ПЗ хоста від провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN — пул для майнінгу Bitcoin без акаунта: ваш майнер входить, використовуючи вашу адресу Bitcoin як ім'я користувача, і пул платить на цю адресу. CashPilot тут не запускає майнер. Він зчитує невиплачений баланс, який OCEAN зберігає для вашої адреси, тож ви бачите, скільки заробив ваш ASIC (Bitaxe, Antminer), поруч з іншими доходами. Невиплачений баланс зароблено, але ще не отримано: OCEAN виплачує його ончейн, щойно він перевищить поріг виплати.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Пул для майнінгу Bitcoin, відстеження за адресою виплат"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Коли блок підніме ваш баланс вище порогу"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN платить ончейн на вашу адресу, щойно невиплачений баланс досягне порогу. Виплати через Lightning (вмикаються за бажанням, BOLT12) CashPilot не виявляє."
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "Невиплачене зароблено, але не отримано, доки OCEAN не виплатить його ончейн на цю адресу, якщо тільки ви не ввімкнули виплати через Lightning."
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "Ваша адреса виплат BTC: ім'я користувача, яке ваш майнер використовує на OCEAN, без частини <b>.workername</b>. Вона публічна й не дає доступу до коштів."
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "Потрібен ASIC-майнер Bitcoin (Bitaxe, Antminer), направлений на mine.ocean.xyz:3334"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "обчислення"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
  text: "Ні. Ваш майнер надсилає хеші пулу; ніхто не пропускає трафік через ваше підключення."
  source: "7239118f749a"
ocean.disclosure.data_collected:
  text: "Ваша адреса Bitcoin, обрані вами назви воркерів, ваш хешрейт та IP-адреса вашого майнера, як її бачить пул."
  source: "22282404721c"
ocean.disclosure.isp_risk:
  text: "Майнер тримає одне відкрите з'єднання з пулом і використовує мало трафіку. Стежити варто за витратами на електроенергію, а не за інтернет-провайдером."
  source: "7bf5f9f6b028"
ocean.disclosure.account_rules:
  text: "Акаунта немає. Ідентифікатором є адреса, і будь-хто може переглянути її статистику на ocean.xyz."
  source: "e3c8fd5863c1"
ocean.rating.cons.0.text:
  text: "Оплата лише в Bitcoin, і ончейн нічого не виплачується, доки ваш баланс не досягне 0.01048576 BTC."
  source: "9c9981f2fbd5"
ocean.rating.cons.1.text:
  text: "Комісія пулу 2% або 1%, якщо ви створюєте власні шаблони блоків за допомогою DATUM."
  source: "497f4f1ec62e"
ocean.rating.cons.2.text:
  text: "CashPilot не запускає майнер для OCEAN: ви самі направляєте своє обладнання на пул, а CashPilot лише зчитує баланс."
  source: "eccc0b4b47ae"
ocean.rating.pros.0.text:
  text: "Без акаунта й без перевірки особи. OCEAN просить лише адресу Bitcoin, на яку платить."
  source: "38c4a7764846"
packetstream.description:
  text: "PacketStream — маркетплейс трафіку за принципом peer-to-peer, де можна продавати невикористаний трафік. Він забезпечує роботу мережі домашніх проксі, яку використовують для маркетингових досліджень, SEO-моніторингу та перевірки реклами. Просте налаштування Docker, потрібен лише CID (Client ID). Зауважте, що вхід із захистом CAPTCHA може ускладнити автоматизоване збирання заробітку.\n"
  source: "ee363f486228"
packetstream.short_description:
  text: "Обмін трафіком — просте налаштування на основі CID"
  source: "583d6cb0e210"
packetstream.docker.env.CID.label:
  text: "Client ID"
  source: "8726db013948"
packetstream.docker.env.CID.description:
  text: "Увійдіть на <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> → клацніть Setup на бічній панелі → ваш CID показано в команді Docker"
  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream відхиляє IP-адресу цієї копії як не домашню, тому вона нічого не заробляє. Запустіть її на машині, підключеній до домашньої лінії, або видаліть цю копію."
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "У PacketStream уже є інший клієнт на цій IP-адресі, а платить він лише за одного на IP. Видаліть цю копію або іншу, яка має ту саму IP."
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "Платить $0.10/GB за наданий трафік. Заробіток дуже залежить від попиту на місце розташування вашої IP."
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "Лише PayPal, мінімум $5, комісію 3% показують перед підтвердженням. Перше виведення зберігає вашу адресу PayPal; щоб змінити її пізніше, потрібне підтвердження електронною поштою й очікування 7 днів, тож перевірте адресу, перш ніж підтверджувати. Запити перевіряються й надсилаються протягом 7 днів; запит можна скасувати, поки він очікує, а новий можна створити лише після того, як попередній виплачено."
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "Баланс зберігає PacketStream; виводиться за запитом."
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "Увійдіть на <a href='https://packetstream.io' target='_blank'>packetstream.io</a>, натисніть F12 → Application → Cookies і скопіюйте значення cookie <b>auth</b> (це JWT)."
  source: "15bae9d455f5"
packetstream.referral.bonus.referrer:
  text: "20% їхнього заробітку з трафіку (тимчасовий бонус Packeter)"
  source: "964a44bb9e65"
packetstream.referral.bonus.referee:
  text: "Бонус 10% на перше поповнення карткою або через PayPal (для клієнтів проксі)"
  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "Автори відгуків на Trustpilot у 2025 і 2026 роках повідомляють, що виплати надходять із запізненням або не надходять зовсім, а один давній користувач каже, що виплати сповільнилися, а потім припинилися; інші у 2026 році повідомляють, що отримали оплату."
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "Лише PayPal, з комісією 3% за виведення; користувачі в країнах, де PayPal не працює, не мають іншого способу."
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "Умови дозволяють PacketStream утримувати, сторнувати або анулювати заробіток, який він пов'язує з шахрайством, маніпуляціями чи забороненою діяльністю."
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
  text: "Умови кажуть, що клієнти проксі та сам PacketStream пропускають трафік через ваше підключення; жодної перевірки звичайних покупців вони не описують."
  source: "fd4707690d2b"
packetstream.rating.cons.4.text:
  text: "Trustpilot зазначає, що PacketStream не відповідає на негативні відгуки; автори відгуків повідомляють про листи без відповіді."
  source: "4885bceb8df9"
packetstream.rating.pros.0.text:
  text: "PacketStream публікує власний Docker-образ, packetstream/psclient."
  source: "b358af0b3419"
packetstream.rating.pros.1.text:
  text: "Умови вимагають лише пристрій і підключення, якими ви володієте або маєте право користуватися."
  source: "bde1b5ad5a6a"
packetstream.rating.pros.2.text:
  text: "Умови не описують перевірки особи; для виплати потрібна адреса PayPal."
  source: "a05886b55edc"
packetstream.rating.pros.3.text:
  text: "Умови називають PacketStream Inc. відповідно до законодавства Каліфорнії."
  source: "7966bde559dd"
packetstream.rating.pros.4.text:
  text: "PacketStream працює з 2018 року."
  source: "70db8167d5bc"
passiveapp.description:
  text: "PassiveApp — платформа DePIN, яка дає змогу заробляти криптовалюту та винагороди в PayPal, ділячись невикористаним трафіком і обчислювальними ресурсами. На практиці лише Windows: на власній сторінці завантаження постачальника Android, iOS і Linux позначено як «coming soon» без змін щонайменше з лютого 2025 року, а версії для macOS не існує — попри рекламні тексти на тому самому сайті, які заявляють ширшу підтримку. Docker-образу немає.\n"
  source: "e0f069b6b6e0"
passiveapp.short_description:
  text: "Трафік/обчислення DePIN — лише Windows, виплати в криптовалюті та PayPal"
  source: "e23871afdcd9"
passiveapp.earnings.notes:
  text: "Лише застосунок для Windows (v1.0.x); Android/iOS/Linux постачальник анонсує як 'coming soon' з початку 2025 року, і вони так і не вийшли. Офіційного Docker-образу немає."
  source: "57f5891e1772"
passiveapp.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
passiveapp.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
passiveapp.referral.bonus.referrer:
  text: "10% їхнього заробітку довічно"
  source: "f0262d54b65c"
passiveapp.rating.cons.0.text:
  text: "CashPilot не запускає PassiveApp: ви користуєтеся власним застосунком провайдера для ПК, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "2b27df807548"
passiveapp.rating.pros.0.text:
  text: "Сайт PassiveApp указує PayPal, криптовалюту та подарункові картки з мінімумом від $3."
  source: "5fb04eb0efdc"
proxybase.description:
  text: "ProxyBase — платформа обміну трафіком, яка платить користувачам криптовалютою за спільне використання невикористаного інтернет-підключення. Клієнт автентифікується за допомогою Access Token із вашої панелі. Найбільше заробляють домашні IP, але IP дата-центрів теж підтримуються. Офіційний мультиархітектурний Docker-образ (amd64/arm64/armv7).\n"
  source: "7a558682be11"
proxybase.short_description:
  text: "proxybase.org — обмін трафіком, виплати в криптовалюті, автентифікація через Access Token. Гаманець не створюється"
  source: "5224bb16fee4"
proxybase.docker.env.ID.label:
  text: "Access Token"
  source: "f9db72ced1ee"
proxybase.docker.env.NAME.label:
  text: "Назва пристрою"
  source: "6415f86bc24f"
proxybase.docker.env.ID.description:
  text: "Увійдіть на <a href=\"https://peer.proxybase.org/dashboard/login?referral=nXzS3c6iTO\">peer.proxybase.org/dashboard</a> → скопіюйте свій Access Token (він показаний у команді Docker на сторінці налаштування)"
  source: "3571c2e99729"
proxybase.docker.env.NAME.description:
  text: "Будь-яка назва (без пробілів), щоб розпізнавати цей пристрій на вашій панелі ProxyBase"
  source: "906ebedecbc7"
proxybase.docker.health_signals.0.means:
  text: "ProxyBase щонайменше пів години не може зв'язатися зі своїм ретранслятором, тому нічого не заробляє. Перезапуск це виправляє; якщо після перезапуску проблема залишається, перевірте, чи має ця машина доступ до інтернету."
  source: "cbe6b5ef771f"
proxybase.earnings.notes:
  text: "Виплати в криптовалюті. Заробіток залежить від місця розташування та використаного трафіку."
  source: "39229c292994"
proxybase.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
proxybase.cashout.notes:
  text: "Сайт указує мінімум $0.20, а запит на суму менше $1 пройшов у жовтні 2026 року. Запит завжди виводить увесь баланс у USDC в Polygon, POL або Litecoin на адресу, яку ви вводите. Мережеву комісію сплачує ProxyBase."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "Заробіток накопичується на АКАУНТІ ProxyBase, якому належить Access Token, і виводиться з панелі за запитом. Клієнт не має гаманця, а контейнер не зберігає стану — docker.volumes порожній. Не плутайте з proxybase-xyz (ProxyBase Markets, та сама організація), який справді створює локальний гаманець і оголошує його критичним томом."
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
  text: "Сам ProxyBase у серпні 2025 року написав, що він новий і поки не є місцем, де можна заробити максимум."
  source: "9f5177f749d7"
proxybase.rating.cons.1.text:
  text: "У 2026 році ProxyBase змінив клієнт і вимкнув старий бекенд, тож контейнери зі старим образом продовжували працювати, але перестали заробляти."
  source: "452b38e35357"
proxybase.rating.cons.2.text:
  text: "Лише криптовалюта, у USDC в Polygon, POL або Litecoin, без фіатних способів. Мінімум $0.20, мережеву комісію сплачує ProxyBase."
  source: "2f15ff41b14c"
proxybase.rating.pros.0.text:
  text: "Наше виведення на суму менше $1 пройшло в жовтні 2026 року."
  source: "00e8781a2252"
proxybase.rating.pros.1.text:
  text: "Для виведення потрібна лише адреса, введена в запит."
  source: "985d03ae1755"
proxybase.rating.pros.2.text:
  text: "ProxyBase публікує власний образ клієнта й підтримує IP дата-центрів."
  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets — маркетплейс проксі SOCKS5, створений для ШІ-агентів. Продавці запускають легкий демон CLI на Rust, який підключається через WebSocket і пропускає трафік покупців через їхнє інтернет-підключення, заробляючи USDC у Tempo Chain за кожен проданий GB. Підтримує прямий режим (власний трафік) і режим upstream (перепродаж зовнішніх проксі) з автоматичним перепідключенням. Покупці купують проксі-сесії за країною, інтернет-провайдером і обсягом трафіку. Платежі проходять через Machine Payments Protocol (MPP) у Tempo Chain. Реферальне посилання призначене для покупців: покупець, який відкриє через нього консоль, отримає на 10% більше під час першого поповнення.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz — маркетплейс SOCKS5 для ШІ-агентів, виплати в USDC. Створює гаманець, єдина копія ключа якого зберігається в його томі"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "URL API бекенду"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "Перевизначити URL API бекенду (за замовчуванням https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "Під час першого запуску контейнер налаштовується автоматично: створює гаманець secp256k1 (BIP-39), проходить автентифікацію через ECDSA challenge-response і починає продавати трафік у режимі лише прямого підключення. Увесь стан (гаманець, токен сесії, налаштування продавця) зберігається в томі <code>proxybase-data</code>. Під час першого запуску знайдіть адресу гаманця в журналах контейнера. Використайте <code>--upstream</code>, щоб додати шляхи перепродажу зовнішніх проксі.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "Файл ключа створеного гаманця. Цей том І Є гроші: копії на сервері немає, тож якщо його видалити, разом із ним зникнуть і кошти."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Заробіток залежить від проданих GB за ринковими цінами. IP VPS і дата-центрів заробляють менше, ніж домашні. Режим із кількома upstream може поєднувати ваш власний трафік із зовнішніми проксі."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Фіксуйте заробіток командою <code>proxybase-cli seller payout create</code>; він надходить як USDC у Tempo Chain (Tempo MPP). Платить на будь-яку EVM-адресу, ключ від якої у вас є (Tempo — EVM-мережа), нічого підписувати не потрібно; додайте мережу Tempo в гаманець, щоб бачити USDC. Якщо гаманець і далі його не показує, додайте токен Tempo USDC вручну: імпортуйте його за адресою контракту, яку дає Proxybase, і перевірте цю адресу, перш ніж довіряти балансу."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "Клієнт створює власний гаманець під час першого запуску."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "15% від кожного поповнення запрошеного покупця у вигляді кредиту на ваші власні проксі-сесії"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "+10% до першого поповнення покупця"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "Трафік, як проксі SOCKS5, що продається покупцям на маркетплейсі ProxyBase."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Так. Покупці пропускають свій трафік через ваше підключення — саме це й продається."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Адреса гаманця, створена на вашій машині, а також обсяг трафіку, який ви ретранслюєте."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Реальний, і він прямо стосується домашніх підключень. Проксі-трафік невідомих покупців виходить під вашою IP, тож скарги на зловживання надходять саме вам. Ніщо в цьому каталозі не обмежує сервіс адресами дата-центрів, а домашні IP заробляють більше, тож стимул тут спрямований не в той бік: прочитайте умови свого інтернет-провайдера, перш ніж запускати його вдома."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "невідомо — провайдер не публікує обмеження кількості пристроїв на акаунт чи на IP, і каталог його не вказує."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "Виплати в USDC у Tempo Chain на будь-яку EVM-адресу, ключ від якої у вас є."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "Ваше підключення продається покупцям маркетплейсу як проксі SOCKS5; ми не знайшли опису того, як перевіряють покупців."
  source: "2dec55ca610f"
proxybase-xyz.rating.pros.0.text:
  text: "Його власна сторінка заробітку в заголовку обіцяє роботу без KYC і виплату від $1."
  source: "25b6dc3b4608"
proxybase-xyz.rating.pros.1.text:
  text: "ProxyBase публікує власний образ клієнта й приймає підключення з дата-центрів."
  source: "ae81d006093f"
proxylite.description:
  text: "ProxyLite монетизує ваш інтернет-трафік, ділячись ним із перевіреними організаціями. Працює як на домашніх підключеннях, так і на VPS та в дата-центрах. Просте налаштування: потрібен лише User ID з панелі. Пропонує щедру довічну реферальну комісію 15%.\n"
  source: "9d0fe8c60b32"
proxylite.short_description:
  text: "Обмін трафіком — довічні 15% за рефералів, працює на VPS"
  source: "25e7184f582e"
proxylite.docker.env.USER_ID.label:
  text: "User ID"
  source: "7967e089a7b9"
proxylite.docker.env.USER_ID.description:
  text: "Увійдіть на <a href=\"https://lk.proxylite.ru\">lk.proxylite.ru</a> → ваш User ID показано на головній сторінці панелі поруч з електронною поштою. Потрібен акаунт? Зареєструйтеся за посиланням <a href=\"https://proxylite.ru/?r=KMUPRZIZ\">proxylite.ru/?r=KMUPRZIZ</a>"
  source: "e6a7e1aa42c4"
proxylite.earnings.notes:
  text: "Домашні IP заробляють більше. Підключення VPS і дата-центрів приймаються за нижчими ставками."
  source: "d4c0149d1143"
proxylite.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
proxylite.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
proxylite.referral.bonus.referrer:
  text: "15% їхнього заробітку довічно"
  source: "3168431b6644"
proxylite.rating.cons.0.text:
  text: "Власника сайту приховано в записах домену, і ми не знайшли за ним жодної названої компанії."
  source: "7aa89b3713f9"
proxylite.rating.pros.0.text:
  text: "Мінімум $5, у криптовалюті або через PayPal."
  source: "62a28acac77c"
proxylite.rating.pros.1.text:
  text: "ProxyLite публікує Docker-образ proxylite/proxyservice і приймає підключення з дата-центрів за нижчою ставкою."
  source: "0d8c6faf88af"
proxyrack.description:
  text: "Програма Peer від ProxyRack дає змогу заробляти, ділячись трафіком як частина їхньої проксі-мережі. Кожному пристрою потрібен унікальний 64-символьний шістнадцятковий UUID і, за бажанням, API-ключ для автоматичної реєстрації пристрою. Працює як на домашніх підключеннях, так і на VPS та в дата-центрах. Панель працює за Cloudflare, тож API-ключ, можливо, доведеться отримати вручну через браузер.\n"
  source: "16b74380bb2a"
proxyrack.short_description:
  text: "Обмін трафіком — UUID для кожного пристрою, працює на VPS"
  source: "7c899dc1ba2d"
proxyrack.docker.env.UUID.label:
  text: "UUID пристрою"
  source: "dff993a2511b"
proxyrack.docker.env.API_KEY.label:
  text: "API-ключ"
  source: "23189d55f697"
proxyrack.docker.env.DEVICE_NAME.label:
  text: "Назва пристрою"
  source: "155106be1173"
proxyrack.docker.env.UUID.description:
  text: "Унікальний 64-символьний шістнадцятковий ID для кожного пристрою. Створіть його командою: cat /dev/urandom | tr -dc 'a-f0-9' | fold -w 64 | head -n 1"
  source: "5de5d7264318"
proxyrack.docker.env.API_KEY.description:
  text: "Увійдіть на <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → API Key показано на головній сторінці панелі (якщо його вказати, пристрій реєструється автоматично). Потрібен акаунт? Зареєструйтеся за посиланням <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
  source: "96df71a6ca26"
proxyrack.docker.env.DEVICE_NAME.description:
  text: "Зрозуміла назва пристрою на панелі"
  source: "df01af60b81c"
proxyrack.docker.health_signals.0.means:
  text: "Клієнт Proxyrack не завантажився під час запуску контейнера, тож контейнер працює, але нічого не заробляє. Перезапуск завантажить його знову; якщо після перезапуску проблема залишається, перевірте, чи має ця машина доступ до інтернету."
  source: "b5143d72ce35"
proxyrack.device_link.steps:
  text: "Увійдіть у ProxyRack, відкрийте Devices, оберіть Add device і вставте цей UUID. Доки пристрій не додано до вашого акаунта, він ні для кого не заробляє. Якщо ви ввели API-ключ, контейнер реєструється сам: перевірте, чи є там цей пристрій у списку."
  source: "54c4041903b5"
proxyrack.earnings.notes:
  text: "Домашні IP заробляють більше, ніж IP дата-центрів. Панель за Cloudflare може ускладнювати автоматизований доступ."
  source: "b6e36d751afd"
proxyrack.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
proxyrack.cashout.notes:
  text: "Надішліть запит на виплату на панелі. ProxyRack перевіряє його протягом 72 годин, а потім Tremendous надсилає вам електронною поштою винагороду, яку можна отримати через PayPal, подарунковою карткою або банківським переказом. Варіанта з криптовалютою немає."
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "Баланс зберігає ProxyRack; виводиться за запитом."
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "Увійдіть на <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, натисніть F12 → Network, знайдіть будь-який запит до API і скопіюйте значення заголовка <b>Api-Key</b>. Потрібен акаунт? Зареєструйтеся за посиланням <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "Proxyrack документує обмеження в 500 пристроїв на АКАУНТ і жодного обмеження на IP. IP дата-центрів приймаються, але переводяться на нижчу ставку."
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "Довідковий центр ProxyRack каже, що видалення пристрою знімає заробіток цього пристрою з вашого акаунта, і він повертається, лише якщо той самий пристрій додати знову."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack публікує власний Docker-образ, proxyrack/pop, і приймає IP дата-центрів за нижчою ставкою."
  source: "278541f81053"
repocket.description:
  text: "Repocket дає змогу отримувати пасивний дохід, ділячись невикористаним інтернет-трафіком. Найбільше заробляють домашні IP; IP VPS і дата-центрів приймаються за нижчими ставками. Максимум 5 пристроїв і 5 активних сесій на акаунт. Docker-контейнер автентифікується за допомогою електронної пошти вашого акаунта та API-ключа з панелі Repocket (а не пароля).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Обмін трафіком — до 5 пристроїв, автентифікація через API-ключ"
  source: "5851a7eb5769"
