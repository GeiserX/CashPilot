vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Хост заробляє лише тоді, коли його орендують, а власні цифри Vast для споживчого GPU залежать від типу оренди й оцінки надійності."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot не запускає Vast.ai: ви встановлюєте ПЗ хоста Vast на власну машину з GPU, тому CashPilot не може розгорнути чи оновити його за вас. Vast будує хостинг на Docker на хості з Linux."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
