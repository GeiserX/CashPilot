unmineable.referral.bonus.referee:
  text: "Комісія платформи знижена з 1% до 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Ця машина повідомляє про підключення хостингу. Перш ніж майнити, перевірте умови свого провайдера. Деякі провайдери, зокрема Hetzner Cloud, це забороняють. Перш ніж покладатися на оцінку прибутку, перевірте свої реальні витрати на електроенергію."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable бере комісію платформи 1%. CashPilot додає свій реферальний код (#awk6-j1z0) після кожної назви воркера, що знижує вашу комісію до 0.75%. Тоді unMineable платить супровідникові CashPilot 0.25% від ваших винагород за майнінг; ви зберігаєте 99.25%. Кожна монета має власний поріг виплати, наприклад 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "обчислення"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
