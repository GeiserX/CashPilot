  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "З реферальним кодом unMineable залишає собі комісію платформи 0.75% і платить лише від порогу кожної монети."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "Деякі хостинг-провайдери забороняють майнінг криптовалют."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "Додаткова електроенергія може коштувати більше, ніж зароблені монети."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "Статистика адреси, зокрема баланс, публічна для будь-кого, хто знає адресу."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "Майнер надсилає хеші пулу й не ретранслює нічийого іншого трафіку."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Ви можете майнити на публічну адресу в обраній монеті без створення акаунта."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock — платформа DePIN (Decentralized Physical Infrastructure Network, децентралізована мережа фізичної інфраструктури), яка дає змогу заробляти криптовалюту, ділячись інтернет-підключенням. Частина ширшої екосистеми Web3. Є спільнотні Docker-образи, але офіційного образу немає. Основний інтерфейс — розширення для браузера.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "Обмін інтернетом DePIN — виплати в криптовалюті, основне — розширення для браузера"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Заробіток у криптовалюті/токенах. Офіційного Docker-образу немає — основний клієнт — розширення для браузера."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
uprock.cashout.notes:
  text: "Токени UPT виводяться на гаманець Solana від 250 UPT за ввімкненої двофакторної автентифікації. Стягується комісія за виведення."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "Довідковий центр UpRock каже, що виведення відбувається в токенах UPT на гаманець Solana з мінімумом 250 UPT."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "Винагороди — це токени UPT; автори відгуків і сторонній огляд кажуть, що їхня вартість дуже низька."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot не запускає UpRock: ви користуєтеся власним застосунком або розширенням провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork — децентралізована мережа VPN та обміну трафіком. Ви заробляєте, надаючи трафік як провайдер спільноти. Бінарний файл провайдера сам автентифікується за допомогою електронної пошти й пароля вашого акаунта (підкоманда auth-provide) і зберігає отриманий JWT сесії в томі даних. Офіційний Docker-образ від BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "Децентралізований VPN/трафік — автентифікація поштою+паролем, сесія JWT у томі"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "Електронна пошта"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Пароль"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "Електронна пошта вашого акаунта URnetwork (логін, з яким ви входите на <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Для акаунтів, створених через вхід Google/Apple, спершу потрібно встановити пароль. Потрібен акаунт? Зареєструйтеся за посиланням <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "Пароль вашого акаунта URnetwork (без пробілів). Використовується для входу провайдера через auth-provide; після цього сесія зберігається в томі даних."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Працює на VPS і домашніх підключеннях. З 2026-10-06 оплата в SN25α (підмережа Bittensor 25) за кожну щотижневу епоху. Підтримує режим проксі для конфігурацій із кількома IP."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "За епохами"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Вкажіть coldkey Bittensor на ur.io/app/account/earnings (підписавши в Talisman, TAO.com або гаманці з WalletConnect), а потім отримуйте кожну завершену епоху. Отримання оплачує gas у TAO з gas-ключа EVM. НЕОТРИМАНІ ЕПОХИ СПЛИВАЮТЬ, а старі виплати в USDC скасовано, якщо протягом 30 днів не було прив'язано гаманця."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB безплатних даних UR на день за кожного друга, до 20 друзів (дані, а не гроші)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB безплатних даних UR на день, якщо ви використаєте щонайменше 10 MiB через застосунок протягом 2 днів у перші 90 днів після реєстрації; інакше реферальна програма для вас завершується"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Неотримані епохи спливають, а старі виплати в USDC скасовано для мереж, у яких протягом 30 днів не було прив'язано гаманця."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "З жовтня 2026 року винагороди виплачуються в SN25α, токені підмережі Bittensor, і кожне отримання коштує gas у TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "Раніше URnetwork називався BringYour; його архівний whitepaper має стару назву."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork публікує вихідний код свого клієнта провайдера."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork публікує власний Docker-образ, bringyour/community-provider, і працює на VPS та домашніх підключеннях."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Для отримання потрібен лише гаманець Bittensor, яким керуєте ви."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai — маркетплейс хмарних GPU, де ви здаєте в оренду свій GPU NVIDIA дослідникам і розробникам ШІ/ML. Платформа, побудована на Docker, де ви самі встановлюєте погодинні ціни. RTX 3090 в оренді зазвичай заробляє $0.20-0.40/hr. Потрібні GPU NVIDIA з актуальними драйверами та стабільне інтернет-підключення. Дохід дуже залежить від моделі GPU, цінової стратегії та ринкового попиту.\n"
  source: "27599d9c6362"
vast-ai.short_description:
