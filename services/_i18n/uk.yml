vast-ai.rating.pros.1.text:
  text: "Виплати через Wise, PayPal або Stripe від мінімуму $20, рахунки виставляються щотижня; менший баланс переноситься на наступний тиждень."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter — платформа обміну трафіком для Windows, Mac, Linux і Android. Вона заявляє, що платить до $1/GB наданого трафіку з мінімальним порогом виплати $20. Платформа працює подібно до класичних застосунків для обміну трафіком і пропускає легітимний трафік через домашні підключення.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Обмін трафіком — заявляє до $1/GB, мінімальна виплата $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Заявляє до $1/GB, але реальний заробіток нижчий. Мінімальна виплата $20. Заробіток дуже залежить від місця розташування та попиту."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter не має вебпанелі. Відкрийте застосунок Wipter для ПК або телефону, увійдіть і надішліть там запит на виплату, щойно баланс досягне $20. Wipter платить лише в USDT у BNB Smart Chain (BEP20) на гаманець, указаний у розділі Payments застосунку; варіанта з PayPal немає."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% їхнього заробітку з трафіку, щойно вони досягнуть мінімальної виплати, за будь-яку кількість запрошених друзів"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "Бонус $5 за реєстрацію"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot не запускає Wipter: ви користуєтеся власним застосунком провайдера для ПК або телефону, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "fa32942c6b4f"
xmrig.description:
  text: "Майніть Monero на своєму CPU. CashPilot запускає XMRig, а обраний вами пул платить Monero на вашу публічну адресу виплат. XMRig використовує 1% часу хешування на підтримку своїх розробників. Електроенергія може коштувати більше, ніж XMR, який ви заробляєте."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "Майнінг Monero на CPU з пулом на ваш вибір"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Адреса Monero"
  source: "a888ebb3ae9b"
xmrig.docker.env.POOL_URL.label:
  text: "Пул"
  source: "f13024272c38"
xmrig.docker.env.WORKER_NAME.label:
  text: "Назва воркера"
  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "Макс. потоків CPU (%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "Режим RandomX"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "Валова оцінка без урахування електроенергії. Станом на 2026-11-25 1 kH/s приносив приблизно $1 на місяць за спостережуваної ціни XMR і складності мережі. Настільний CPU, що використовує половину своїх потоків, може додатково споживати від 30 до 50 W. Перевірте своє реальне споживання і ціну на електроенергію, щоб зрозуміти, чи це окупається."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, якщо ви його знизите)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Коли досягнуто порогу пулу"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "Пул платить на вашу адресу Monero, коли ваш баланс досягає вашого порогу. Доти пул зберігає баланс у себе."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Ця машина повідомляє про підключення хостингу. Перш ніж майнити, перевірте умови свого провайдера. Деякі провайдери, зокрема Hetzner Cloud, це забороняють. Перш ніж покладатися на оцінку прибутку, перевірте свої реальні витрати на електроенергію."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "MoneroOcean, стандартний пул, бере комісію за майнінг 0%. Стандартний поріг виплати — 0.3 XMR, і його можна знизити до 0.003 XMR. Виплати менше 4 XMR можуть коштувати до 0.0004 XMR. Інші пули встановлюють власні ставки та пороги."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "обчислення"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "Ні. Майнер надсилає результати роботи майнінговим пулам."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Ваша адреса Monero, назва воркера та IP-адреса надходять до пулу."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "Деякі мережі та DNS-резолвери блокують підключення до майнінгових пулів."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "Більшість пулів Monero ідентифікують вас за публічною адресою виплат."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Для виплати потрібно достатньо XMR, щоб досягти порогу вашого пулу."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "Деякі хостинг-провайдери забороняють майнінг криптовалют."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "Додаткова електроенергія може коштувати більше, ніж зароблені XMR."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "Майнер надсилає хеші пулам і не ретранслює нічийого іншого трафіку."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "Майнер має відкритий код, а образ закріплює підписаний реліз від розробників."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Ви можете майнити з публічною адресою Monero, не називаючи свого імені."
  source: "752cbb728aac"
