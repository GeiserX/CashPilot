# Ukrainian translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/uk.yml --restamp '<key>'
2miners-etc.description:
  text: "Відстежуйте невиплачений баланс Ethereum Classic, який 2Miners зберігає для вашої публічної адреси виплат ETC. Запустіть власний майнер і направте його на пул. CashPilot зчитує баланс і просить вас підтвердити виплати, коли баланс зменшується.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Пул для майнінгу Ethereum Classic, відстеження за адресою виплат"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (можна змінити)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "Пул перевіряє ваш поріг виплати кожні дві години"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners автоматично платить на вашу адресу, щойно ви досягнете обраного порогу. Найнижчий поріг для виплат ETC — 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Невиплачений баланс накопичується на 2Miners. Баланс гаманця зчитується окремо з мережі Ethereum Classic. Перш ніж підтвердити виплату в CashPilot, перевірте в гаманці, яку суму ви отримали.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Введіть публічну адресу виплат Ethereum Classic, яку ваш майнер використовує на 2Miners; вона починається з <b>0x</b>. Не додавайте назву воркера.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Потрібен майнер ETCHash, направлений на 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "обчислення"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Ні. Ваш майнер надсилає пулу результати майнінгу."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "Пул використовує вашу адресу виплат, обрані вами назви воркерів та IP-адресу вашого майнера."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Будь-хто може переглянути статистику за адресою виплат. Щоб змінити поріг, пул просить підтвердити IP воркера."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "Пул бере комісію 1% і затримує виплати, доки не буде досягнуто вашого порогу."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (раніше ATOR) — це децентралізована мережа конфіденційності з цибулевою маршрутизацією. Оператори запускають вузли-ретранслятори й отримують токени ANYONE за наданий трафік. По суті, це «Tor із винагородою». CashPilot запускає його з власного образу, зібраного з підписаного Debian-пакета проєкту, для amd64 та arm64. Налаштування задаються у файлі anonrc, який монтується в контейнер (Nickname, ContactInfo, ORPort тощо). Ретранслятор нічого не заробляє, доки для нього не заблоковано 100 ANYONE щонайменше на 180 днів, а винагороди отримують, підписавши транзакцію у своєму гаманці. Ретранслятор також публікує вашу публічну IP у каталозі ретрансляторів мережі, що може погіршити репутацію IP, за яку платять застосунки для обміну домашнім трафіком.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Децентралізована цибулева маршрутизація — вузли-ретранслятори Tor із винагородою"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Ключ ідентифікатора ed25519 ретранслятора. Якщо його знищити, репутація ретранслятора зникне, а історія заробітку почнеться з нуля."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Платить лише тоді, коли для кожного ретранслятора заблоковано 100 ANYONE щонайменше на 180 днів і запит на винагороду підписано у вашому гаманці. Без стейку ретранслятор нічого не заробляє. Зі стейком заробіток залежить від наданого трафіку та часу безперервної роботи."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "За епохами"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Вказується як ContactInfo в anonrc з префіксом '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Відбитки ретрансляторів через кому. Їх немає у вебпанелі: виконайте <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> на хості, де працює ретранслятор.\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Трафік, як ретранслятор у мережі Anyone (форк Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Так. Він ретранслює трафік інших людей. Чи буде ваша IP останнім вузлом, залежить від того, чи налаштовано ретранслятор як вихідний."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "Публічний ключ ідентифікатора ретранслятора, ваша IP і порт, а також статистика безперервної роботи — усе це навмисно публікується в каталозі мережі. Якщо ви вкажете ContactInfo у своєму anonrc, його теж буде опубліковано й назавжди публічно проіндексовано. Зазвичай це адреса електронної пошти, тому залишайте поле порожнім, якщо не хочете, щоб вона стала публічною."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Реальний. Трафік ретранслятора приписується вашому підключенню. Особливо вихідні ретранслятори притягують скарги на зловживання; багато домашніх інтернет-провайдерів їх забороняють."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Акаунта, на який треба реєструватися, немає, тож немає й обмежень на акаунт. Щоб заробляти, вам усе одно потрібен гаманець Ethereum, у якому для кожного ретранслятора заблоковано 100 ANYONE щонайменше на 180 днів, а CashPilot потрібні відбитки ретрансляторів, щоб зчитувати винагороди. Проєкт не публікує обмеження кількості ретрансляторів на IP, і каталог його не вказує."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Ретранслятор нічого не заробляє, доки для нього не заблоковано 100 ANYONE щонайменше на 180 днів, а кожен запит на винагороду підписується у вашому гаманці."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Він за задумом ретранслює трафік інших людей, ніяк не перевіряючи, хто вони; вихідні ретранслятори притягують скарги на зловживання."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "Ідентифікатор, IP і час роботи ретранслятора публікуються в каталозі мережі, а будь-який вказаний вами ContactInfo стає публічним назавжди."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Акаунта, на який треба реєструватися, немає. Ретранслятору потрібен лише гаманець, без перевірки особи."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "Програмне забезпечення ретранслятора — опублікований форк Tor під ліцензією Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot збирає власний образ з опублікованого ПЗ ретранслятора Anyone, якому не потрібен акаунт."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping — децентралізована платформа моніторингу мережі, яка платить вам за роботу вузла. Ваш вузол виконує моніторинг вебсайтів, тести затримки та перевірки якості мережі для клієнтів Bitping. Працює як на домашніх підключеннях, так і на VPS. Під час першого запуску Docker-образ входить в акаунт за допомогою змінних середовища BITPING_EMAIL і BITPING_PASSWORD (у його власному журналі з'являється «Attempting login with environment variables»), а потім зберігає сесію в змонтованому томі, тож після перезапусків повторна автентифікація не потрібна.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Обмін трафіком — децентралізований моніторинг мережі, працює на VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "Електронна пошта"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Пароль"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "Електронна пошта вашого акаунта Bitping (той самий вхід, що й на <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Пароль вашого акаунта Bitping. Використовується один раз, щоб створити сесію вузла, яка потім зберігається в томі даних."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Заробіток залежить від якості мережі та попиту на моніторинг із вашого місця розташування. Вузли на VPS приймаються."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Заробіток вузлів відображається на nodes.bitping.com; app.bitping.com — це панель для клієнтів API. Виведення лише в SOL: коли невиплачений баланс перевищить $0.05, введіть у запит адресу Solana; запит обробляється протягом 24 годин. На новому або порожньому гаманці Solana спершу має бути приблизно 0.001 SOL для мінімальної ренти мережі."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Тепер лише Solana, і адреса вводиться ПІД ЧАС ВИВЕДЕННЯ, а не зберігається."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Використайте електронну пошту й пароль свого акаунта Bitping (ті самі, що на <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Виведіть свій баланс Bitping"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping може анулювати заробіток, не отриманий понад 12 місяців, після попередження електронною поштою за 30 днів."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Надішліть запит на виведення SOL на nodes.bitping.com і введіть у запит свою адресу Solana."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Виведення виплачуються в Solana (SOL) на адресу, яку ви вводите в кожен запит."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "За довідкою Bitping, виведення на новий порожній гаманець Solana може не пройти, доки ви самі не поповните цей гаманець невеликою сумою SOL."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "За довідкою Bitping, сервери та Docker-контейнери підтримуються."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Для виведення потрібна лише адреса Solana, введена в запит."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit — сервіс для обміну трафіком, який платить через PayPal і Stripe. Офіційного Docker-образу немає; клієнтами є застосунок для Windows і застосунок для Android. Сервіс працює на bytebenefit.io — старий домен bytebenefit.com покинули, і він виставлений на продаж на маркетплейсі, тому колись тут його було позначено як неактивний.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Обмін трафіком — виплати через PayPal/Stripe, застосунок для ПК/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Docker-образу немає. Лише застосунки для Windows і Android."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% заробітку з трафіку рефералів"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "Вітальний бонус $1 (10,000 Coins)"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "У Google Play на сторінці застосунку сказано, що ваш трафік обслуговує запити веброзвідки клієнтів Infatica, але не сказано, хто вони і як їх перевіряють."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Застосунок для Android зник з Google Play у квітні 2026 року через 17 місяців."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot не запускає ByteBenefit: ви користуєтеся власним застосунком провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir дає змогу отримувати пасивний дохід, ділячись невикористаним інтернет-трафіком. Підтримуються лише Windows і Android — в офіційних FAQ сказано, що клієнт для Linux або Docker не планується, iOS не підтримується, а для macOS клієнта немає. Заробіток дуже залежить від місця розташування. Для відстеження є вебпанель на dash.bytelixir.com. Docker-образу немає.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Обмін трафіком — лише Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Cookie сесії"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Cookie Remember Web"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "Токен XSRF"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Увійдіть на <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, натисніть F12 → Application → розгорніть <b>Cookies</b> на лівій бічній панелі → клацніть підпункт <code>https://dash.bytelixir.com</code> → у списку cookie праворуч знайдіть <code>bytelixir_session</code> → скопіюйте його Value (довгий JWT, що починається з eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Там само (Cookies → <code>https://dash.bytelixir.com</code>) → знайдіть cookie з назвою <code>remember_web_...</code> → скопіюйте його Value (необов'язково, подовжує термін дії сесії)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Там само → знайдіть <code>XSRF-TOKEN</code> → скопіюйте його Value (необов'язково)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Заробіток залежить від місця розташування ($2-50 на місяць). Docker-образу немає. Потрібен застосунок для ПК або для Android."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Лише криптовалюта. Мінімум залежить від монети: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Адресу ви вводите в кожен запит. Запити обробляються в робочі години, протягом 24 годин."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Баланс зберігає Bytelixir; адреса гаманця вводиться в кожен запит на виплату і ніколи не зберігається в контейнері."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Увійдіть на <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a>, <b>поставивши позначку Remember Me</b>, натисніть F12 → Application → розгорніть <b>Cookies</b> на лівій бічній панелі → клацніть <code>https://dash.bytelixir.com</code>, а потім скопіюйте три значення: <b>bytelixir_session</b>, <b>remember_web_…</b> (довге, що починається з цього префікса) і <b>XSRF-TOKEN</b>. Сам лише cookie сесії спливає приблизно через дві години після копіювання, тож збирання даних зупиниться того ж дня; cookie remember_web діє рік, і саме він забезпечує роботу."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50% їхнього прибутку довічно"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "Вітальний бонус $1"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Лише криптовалюта, і мінімум залежить від монети: від $5 для USDT до $250 для Bitcoin."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot не запускає Bytelixir: ви користуєтеся власним застосунком провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "На Trustpilot рейтинг 4.6 за 283 відгуками, більшість із яких хвалять криптовиплати; у кількох ідеться про виплати, що не надійшли."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Для виплати потрібна лише криптоадреса, введена в запит."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai — це маркетплейс GPU за принципом peer-to-peer. Ви виставляєте машину на Linux з GPU NVIDIA, самі встановлюєте ціни spot і on-demand, а орендарі запускають на ній власні Docker-контейнери. Вам платять лише за хвилини оренди, у CLORE, BTC, USDT або USDC. Для хостингу потрібна машина x86_64 з Ubuntu 22.04 або новішою (або HiveOS), робочий драйвер NVIDIA і щонайменше 100 Mbps на завантаження та вивантаження. GPU AMD не підтримуються.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "Маркетплейс GPU — здавайте в оренду GPU NVIDIA, оплата в CLORE, BTC або доларових стейблкоїнах"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Оплачуються лише хвилини оренди, за встановленою вами ціною. Верхній край діапазону, $490, — це власна верхня межа Clore для однієї RTX 4090 з похвилинною орендою ('up to ~$490/month'); менші карти заробляють менше, а карта без оренди не заробляє нічого. Clore залишає собі 5% (on-demand) або 1.25% (spot) від кожної оренди, плюс 15%, коли орендар платить у BTC, USDT або USDC замість CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Виводьте в розділі Account > Billing на власний гаманець: CLORE (ERC-20, мінімум 200, комісія приблизно $0.50), BTC (мінімум 0.0001, комісія 0.00005 BTC) або USDT/USDC в Ethereum чи BNB Chain (мінімум $10, комісія $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore зберігає баланс (CLORE, BTC і один доларовий баланс для USDT/USDC), доки ви його не виведете. Мережа обирається для кожного виведення: Ethereum для CLORE, Bitcoin для BTC, Ethereum або BNB Chain для USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (стандартний рівень) від комісій платформи, сплачених запрошеними вами хостами й орендарями, з кожної оренди; код ніколи не спливає; виплачується у валюті оренди (CLORE, BTC або USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps на завантаження й вивантаження"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "Час обчислень GPU на вашій машині."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Так. Орендарі запускають на вашій машині власні Docker-контейнери, і їхній трафік виходить через ваше підключення; порти SSH і застосунків перенаправляються в інтернет."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Політика конфіденційності Clore охоплює дані акаунта та вашу IP-адресу з приблизним місцем розташування; документи, що посвідчують особу, — лише якщо Clore попросить пройти KYC."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Вхідні порти мають бути доступні з інтернету (за замовчуванням 22, 8080 і 3000-4000), а на вашій лінії працюють навантаження сторонніх людей. Власний мережевий посібник Clore каже, що деякі інтернет-провайдери блокують хостинг."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "Від 18 років, не в країні під санкціями. Clore може призупинити або закрити акаунт на власний розсуд, а заборонене використання може коштувати вам коштів."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Ні умови, ні політика конфіденційності не називають юридичної особи, а питання юрисдикції умови відкладають до пізнішої версії."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore може призупинити або закрити акаунт на власний розсуд, а заборонене використання може призвести до конфіскації коштів."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Виплати лише в криптовалюті (CLORE, BTC, USDT або USDC), і Clore бере додаткові 15% з оренди, яку орендар оплачує в BTC, USDT або USDC, якщо хост не заблокує CLORE, щоб зменшити цю комісію."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Хосту платять лише за хвилини оренди, а цифра Clore для RTX 4090 — це верхня межа («up to ~$490/month») для однієї карти."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "Для базового використання KYC не потрібен, але Clore може попросити підтвердити особу для великих виведень або з причин відповідності вимогам."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Орендарі запускають на вашій машині будь-який публічний Docker-образ. Умови перелічують заборонені види використання (шкідливе ПЗ, DDoS, CSAM тощо), але ми не знайшли опису того, як перевіряють орендарів."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot не запускає Clore.ai: ви встановлюєте агент хостингу Clore на власну машину з GPU (Ubuntu 22.04 або новіша, або HiveOS), тому CashPilot не може розгорнути чи оновити його за вас."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Clore залишає собі 5% від оренди on-demand (1.25% для spot), коли орендар платить у CLORE, без додаткової комісії."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN керує мережею валідаторів, яка перевіряє пропускну здатність і покриття для ШІ-інфраструктури, що фінансується через протокол DAWN. Розширення для браузера DAWN Validator бере участь у цих перевірках proof-of-bandwidth і покриття та заробляє винагороди DAWN, поки працює. Усталеної грошової вартості ці винагороди ще не мають. Створіть акаунт у розширенні й введіть реферальний код 2QLQV97F, коли воно попросить.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "Валідатор DePIN — розширення для браузера заробляє бали DAWN"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "До запуску токена заробляє Dawn Points. Реальна вартість залежить від майбутньої ціни токена. Апаратний пристрій заробляє більше, ніж розширення для браузера."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Аірдроп токенів (дата невідома)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "Розширення працює, але сире. Анонсовано апаратний пристрій Black Box. Перевірте згодом."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "Розширення заробляє бали; станом на жовтень 2026 року розподіл токенів між операторами вузлів не підтверджено."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "Бали не мають усталеної вартості, доки не запуститься токен і не буде оголошено курс їх конвертації."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot не запускає Dawn: ви користуєтеся власним розширенням для браузера від провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network — проєкт децентралізованого VPN та інфраструктури web3. Здебільшого потребує фірмових апаратних пристроїв Deeper Connect. Moken — пов'язана платформа для майнінгу та стейкінгу. Не лише програмне рішення.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "Децентралізований VPN — потрібен фірмовий апаратний пристрій"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Потрібне обладнання Deeper Connect ($200-500). Платформа Moken для майнінгу та стейкінгу. Не лише програмне рішення."
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "Безперервно"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "Комісія з продажу пристрою"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "Знижка 5% на пристрій Deeper Connect з купоном SERGIO"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "Винагороди за майнінг нараховуються в DPR і залежать від кредитного рейтингу, який зростає повільно або завдяки стейкінгу DPR."
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot не запускає Deeper Network: ви користуєтеся власним роутером провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "b1ba1636070f"
earnapp.description:
  text: "EarnApp від Bright Data дає змогу продавати невикористаний трафік і отримувати пасивний дохід. Bright Data — найбільша у світі проксі-мережа, яка забезпечує збирання даних для компаній зі списку Fortune 500. CashPilot запускає його з власного образу, який під час першого запуску завантажує закріплену збірку EarnApp з CDN Bright Data, перевіряє її sha256 і запускає в режимі lite лише з UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Обмін трафіком — за підтримки Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "UUID вузла"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "ID вашого вузла EarnApp: sdk-node- і далі 32 шістнадцяткові символи в нижньому регістрі, як його виводить 'earnapp showid'. Після розгортання один раз прив'яжіть його, відкривши https://earnapp.com/r/ і додавши до нього цей UUID, коли ви увійшли в EarnApp; неприв'язаний вузол заробляє, але до вашого балансу нічого не надходить"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp постійно не може зв'язатися зі своїми серверами й перезапускається, тому заробляє мало або нічого. Перезапустіть цю копію; якщо це повторюється, перевірте інтернет-з'єднання цієї машини."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Відкрийте це посилання, увійшовши в EarnApp, щоб додати вузол до свого акаунта. Доки ви цього не зробите, вузол заробляє, але до вашого балансу нічого не надходить."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Дуже залежить від місця розташування. Найбільше заробляють IP зі США та ЄС. Заробіток зростає разом зі спожитим трафіком."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "За запитом (доступне автовиведення: PayPal від $10, Wise від $10, Amazon від $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Увімкніть автовиведення один раз, і EarnApp сам платитиме щоразу, коли баланс досягне мінімуму для обраного способу: PayPal $10, Wise $10, Amazon $50. Платежі PayPal надходять від Bright Data Ltd. У жовтні 2026 року платіж PayPal надійшов приблизно на 2% меншим за виведений баланс."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Баланс зберігає EarnApp; виводиться на Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Увійдіть на <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, натисніть F12 → Application → Cookies і скопіюйте значення <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% їхнього заробітку довічно, понад їхній заробіток"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "Довідковий центр EarnApp каже, що встановлювати його в Docker-контейнери, віртуальні машини, хостинг-сервіси або домашні сервери суворо заборонено, а саме так його запускає CashPilot."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "У тій самій довідковій статті сказано, що акаунт, виявлений за такою роботою, закривають без попередження, а його очікувані платежі скасовують."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Наша виплата через PayPal надійшла в жовтні 2026 року, приблизно на 2% меншою за виведений баланс."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "Мінімум $10 для PayPal і Wise, а автовиведення платить само."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp належить Bright Data, а його платежі PayPal надходять від Bright Data Ltd., названої компанії."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm платить вам за обмін інтернет-трафіком. Збирач заробітку використовує автентифікацію електронною поштою та паролем через Supabase. Легкий Docker-образ із простим розгортанням (клієнт Docker використовує окремий токен UUID).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "Обмін трафіком — автентифікація поштою/паролем, легкий клієнт"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "API-ключ"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "Увійдіть на <a href=\"https://app.earn.fm\">app.earn.fm</a> → клацніть значок профілю (угорі праворуч) → Account Settings → скопіюйте API Key (у форматі UUID)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "Відносно нова платформа. Заробіток залежить від місця розташування та доступного трафіку."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "Мінімум $15. Способи: USDT у BEP20 або Polygon (комісія $1) чи TRC20 (комісія $3), PayPal, подарункові картки Amazon або Starbucks від $15, або банківський переказ від $1,000 з вирахуванням комісій за переказ. Перед першою виплатою ви заповнюєте платіжний профіль (повне ім'я та адреса), який використовується для квитанцій про виплату."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "Баланс зберігає Earn.fm; виводиться за запитом."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Використайте електронну пошту й пароль свого акаунта Earn.fm (ті самі, що для входу на <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10% їхнього заробітку довічно"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "Стартовий баланс $5"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "Мінімум $15, комісія від $1 до $3 на USDT, а банківський переказ — лише від $1,000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Перед першою виплатою ви заповнюєте платіжний профіль зі своїм повним ім'ям та адресою."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Автори оглядів у 2025 році повідомляють, що підтримка електронною поштою та в Discord не відповідає; Trustpilot зазначає, що Earn.fm не відповідає на негативні відгуки."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Earn.fm публікує власний Docker-образ, earnfm/earnfm-client."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher — платформа обміну трафіком, де ви заробляєте кредити, відвідуючи вебсайти через автоматичний серфбар. Працює як розширення або доповнення для браузера. Це не класичний сервіс обміну трафіком — він генерує трафік, автоматично переглядаючи вебсайти.\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "Серфбар для обміну трафіком — розширення для браузера"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "Заробіток у балах BTP, які можна конвертувати в EUR. Лише розширення для браузера."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "Виплата в євро через PayPal або банківським переказом."
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "CashPilot не запускає eBesucher: це розширення для браузера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "Виплати від 2 євро через PayPal або SEPA, щонайменше щотижня, без комісії."
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "eBesucher працює з 2002 року."
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "У вихідних даних указано оператора, TurboAd GmbH, зареєстровану в Берлін-Шарлоттенбурзі (HRB 160730 B)."
  source: "84cbddd4330b"
flux.description:
  text: "Flux — глобально розподілена обчислювальна інфраструктура. Оператори вузлів стейкають токени FLUX і надають серверні ресурси. Три рівні: Cumulus (1,000 FLUX), Nimbus (12,500 FLUX), Stratus (40,000 FLUX). Доступні офіційні Docker-образи.\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "Децентралізовані обчислення — потрібен стейк токенів FLUX"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "Потрібен стейк від 1,000 FLUX (~$50-500 залежно від ціни). Вищі рівні потребують більшої застави, але заробляють більше."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "Винагороди за блоки"
  source: "590433237f8a"
flux.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "Найменший рівень вузла потребує 1,000 FLUX, заблокованих як застава."
  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "Винагорода за блок щороку зменшується на 10%, а посібник 2026 року визнав винагороди на малому рівні слабкими в доларовому вираженні."
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "CashPilot не запускає Flux: ви користуєтеся власним ПЗ вузла від провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "Демон Flux має відкритий код під ліцензією MIT."
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network — децентралізований маркетплейс обчислень, де ви надаєте ресурси CPU та GPU в обмін на токени GLM. Провайдери запускають агент Yagna, який керує виконанням завдань в ізольованих середовищах. Один із найстаріших проєктів децентралізованих обчислень (заснований у 2016 році). Підтримує завдання CPU, рендеринг на GPU та обчислення загального призначення. Оплата через Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Децентралізований маркетплейс обчислень — токени GLM через агент Yagna"
  source: "88f817c25848"
golem.earnings.notes:
  text: "Заробіток залежить від обладнання, цін і попиту на завдання. Вузли лише з CPU заробляють менше. Вузли з GPU заробляють більше, але потребують NVIDIA. Запускайте агент провайдера Yagna (не Docker-образ). Оплата в Polygon токенами GLM."
  source: "07287d437d51"
golem.payment.frequency:
  text: "За кожне виконане завдання"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "Заробляються токени GLM. Налаштуйте гаманець для виплат під час налаштування провайдера."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot не запускає Golem: ви самі встановлюєте агент провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Golem документує запуск провайдера у власному Docker-образі."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "Агент провайдера, yagna, має відкритий код під ліцензією GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Без акаунта: гаманець для виплат ви вказуєте під час налаштування провайдера."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "Мережа працює вже близько десяти років."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Політика конфіденційності Golem називає оператора — Golem Factory GmbH у Цузі, Швейцарія."
  source: "bae79b651923"
grass.description:
  text: "Grass — децентралізована мережа, яка дає змогу продавати невикористаний трафік для даних навчання ШІ. Працює як розширення для браузера та застосунок для ПК і пропускає через ваше підключення запити веб-скрейпінгу для створення структурованих наборів даних. Маючи понад 8.5M користувачів, це одна з найбільших мереж трафіку DePIN. Заробляє токени GRASS у блокчейні Solana.\n"
  source: "046951d812f9"
grass.short_description:
  text: "Обмін трафіком DePIN для даних ШІ — заробляє токени GRASS"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Токен доступу"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Увійдіть на <a href=\"https://app.grass.io\">app.grass.io</a>, натисніть F12 → Application → Local Storage → клацніть <code>https://app.grass.io</code> → скопіюйте значення <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Заробляє Grass Points, які конвертуються в токени GRASS через аірдропи. Реальна вартість у USD залежить від ціни токена. Потрібне розширення для браузера або застосунок для ПК."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Аірдроп за епохами"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Винагороди надходять як періодичні розподіли, які потрібно отримати на панелі Grass. Розподіл Stage 2 (активність з жовтня 2024 до червня 2026 року) виплачується в USDC: отримайте його на app.grass.io/dashboard не пізніше 22 січня 2027 року або раніше, якщо всі розподіли буде отримано раніше. Неотримані винагороди залишаються в Grass."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "Накопичує БАЛИ; GRASS отримують на панелі Grass під час періодичних аірдропів."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Увійдіть на <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, натисніть F12 → Application → Local Storage і скопіюйте значення <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% балів за час роботи прямих рефералів, 10% на другому рівні, 5% на третьому"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Отримайте свої USDC за Grass Stage 2"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Grass залишає собі кожен розподіл Stage 2, не отриманий не пізніше 22 січня 2027 року, а вікно може закритися раніше, щойно всі розподіли буде отримано."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Увійдіть на app.grass.io з акаунтом, який ви використовували в Stage 2, активуйте Grass Wallet, відкрийте вкладку Allocation і підтвердьте. Отримуйте лише на app.grass.io. Немає балів Stage 2? Оберіть «Не для мене»."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Винагороди надходять лише через сезони аірдропів. Оператори вузлів із тривалим стажем повідомляли про оцінки за сезон 2 у межах від кількох до кількох десятків доларів."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "Винагороди за сезон 2, не отримані не пізніше 22 січня 2027 року, втрачаються назавжди."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "Перший аірдроп викликав хвилю невдоволення через малі винагороди за бал, розподілені між понад двома мільйонами користувачів."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot не запускає Grass: ви користуєтеся власним застосунком або розширенням провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "Перший аірдроп отримали майже 1.5 мільйона адрес."
  source: "a4c55e10affa"
helium.description:
  text: "Helium — усталена децентралізована бездротова мережа. Спочатку це були хотспоти LoRaWAN, тепер мережа розширилася до 5G. Потрібне спеціальне обладнання ($500+). Заробляє токени HNT/MOBILE. Окупність значно знизилася — зазвичай $4-8 на місяць.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "Децентралізована бездротова мережа — потрібне обладнання, токени HNT"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "Потрібно купити обладнання за $500+. Окупність значно знизилася. Для нових операторів є процедура схвалення."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "За епохами"
  source: "75743e03bad2"
helium.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149 скасував винагороди Proof-of-Coverage 6 липня 2026 року; хотспоти IoT тепер заробляють лише за передані дані, а понад 114,000 із них не передали жодних."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Модель винагород Helium кілька разів змінювалася голосуванням, її CEO пішов у відставку, а HNT упав приблизно на 96%."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot не запускає Helium: ви користуєтеся власним обладнанням-хотспотом провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "ПЗ шлюзу хотспота має відкритий код під ліцензією Apache-2.0."
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "Відстежуйте невиплачений баланс Kaspa, який HeroMiners зберігає для вашої публічної адреси виплат. Запустіть власний майнер Kaspa і направте його на пул. CashPilot зчитує баланс пулу і просить вас підтвердити виплати, коли баланс зменшується.\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
  text: "Пул для майнінгу Kaspa, відстеження за адресою виплат"
  source: "92c5784dcf30"
herominers-kas.payment.minimum_payout:
  text: "1 KAS (можна змінити)"
  source: "d33ca7065ff9"
herominers-kas.payment.frequency:
  text: "Пул перевіряє ваш поріг виплати щогодини"
  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "HeroMiners автоматично платить на вашу адресу, щойно ви досягнете обраного порогу. Найнижчий поріг — 1 KAS.\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "Баланс накопичується на HeroMiners. Перш ніж підтвердити виплату в CashPilot, перевірте в гаманці, яку суму ви отримали.\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "Введіть повну публічну адресу виплат Kaspa, яку ваш майнер використовує на HeroMiners. Додайте префікс <b>kaspa:</b> і не вказуйте назву воркера.\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "Потрібен майнер Kaspa, направлений на HeroMiners"
  source: "898e36e7a701"
herominers-kas.disclosure.sells:
  text: "обчислення"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "Ні. Ваш майнер надсилає пулу результати майнінгу."
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "Публічна статистика пулу показує кожну адресу виплат і її майнінгову активність."
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "Замість акаунта пул використовує вашу адресу виплат."
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "Пул бере комісію 0.9% і затримує виплати, доки не буде досягнуто вашого порогу."
  source: "7eb2950589fa"
honeygain.description:
  text: "Діліться невикористаним інтернет-трафіком і отримуйте пасивний дохід. Honeygain пропускає через ваше підключення трафік веброзвідки, доставки контенту та маркетингових досліджень. Одна з найбільш усталених платформ обміну трафіком: понад 12M користувачів і понад 1M здійснених виплат.\n"
  source: "b219f969ba34"
honeygain.short_description:
  text: "Обмін трафіком — найбільш усталена платформа"
  source: "c0542c471f29"
honeygain.docker.env.HONEYGAIN_EMAIL.label:
  text: "Електронна пошта"
  source: "969ccbd3cf63"
honeygain.docker.env.HONEYGAIN_PASSWORD.label:
  text: "Пароль"
  source: "e7cf3ef4f17c"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.label:
  text: "Назва пристрою"
  source: "155106be1173"
honeygain.docker.env.HONEYGAIN_EMAIL.description:
  text: "Електронна пошта вашого акаунта Honeygain"
  source: "482869cea18f"
honeygain.docker.env.HONEYGAIN_PASSWORD.description:
  text: "Пароль вашого акаунта Honeygain"
  source: "f3ba1584b384"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.description:
  text: "Назва, що відображається на вашій панелі Honeygain"
  source: "a3ba173cae35"
honeygain.earnings.notes:
  text: "Залежить від місця розташування. IP зі США та ЄС заробляють більше. Максимум 10 пристроїв на акаунт."
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "Мінімум $20 (20,000 кредитів). Два варіанти: PayPal через Tipalti з комісією приблизно 15% або кредити JumpTask без комісії, які зараховуються на гаманець JumpTask. Для запиту потрібен 6-значний код, надісланий електронною поштою. Перша виплата через PayPal залишається в статусі «waiting for details», доки ви не зареєструєтеся в Tipalti за посиланням із їхнього листа. Це посилання працює лише один раз, тож відкривайте його, коли зможете завершити все за один раз і матимете телефон під рукою: після встановлення пароля Tipalti просить підтвердити номер мобільного через SMS (коди спливають за кілька хвилин), потім запитує ваше ім'я, адресу, країну, дату народження та вашу адресу PayPal. Tipalti бере $2.02 за кожен платіж; оберіть USD, щоб уникнути комісії за конвертацію валюти 1.9-3%. Платіж надходить протягом 2 робочих днів. Баланс списується з вашого акаунта одразу після запиту, навіть поки виплата очікує на Tipalti. Під час кожного наступного входу в Tipalti надходить новий SMS-код, якщо ви не поставите позначку, щоб запам'ятати пристрій на 30 днів. У жовтні 2026 року Tipalti не просив отримувача з Іспанії заповнити податкову форму."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Баланс зберігає Honeygain; виводиться за запитом."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Використайте електронну пошту й пароль свого акаунта Honeygain (ті самі, що на <a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a>)."
  source: "fd0be22aeb14"
honeygain.referral.bonus.referrer:
  text: "До 25% заробітку кожного запрошеного друга в режимі Honeygain"
  source: "30385153a66b"
honeygain.referral.bonus.referee:
  text: "Бонус $3 за реєстрацію за цим посиланням"
  source: "9ee5d2215305"
honeygain.obligations.withdraw-before-24-month-write-off.title:
  text: "Виведіть свій баланс Honeygain"
  source: "0868662c5a12"
honeygain.obligations.keep-active-6-months.title:
  text: "Тримайте пристрій Honeygain активним або зробіть виплату"
  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "Заробіток залишається дійсним 24 місяці після того, як досягне мінімуму $20. Після цього Honeygain може списати те, що не було виплачено."
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
  text: "Якщо застосунок не використовується понад 6 місяців, Honeygain вважає невиплачений баланс простроченим, навіть якщо він менший за $20."
  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "Тримайте пристрій, що ділиться трафіком, увімкненим або надішліть запит на виплату. У режимі JumpTask незмінний баланс — це нормально, тож оберіть «Не для мене»."
  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "Умови дозволяють Honeygain списувати заробіток, який досяг порогу $20 і не був виплачений протягом 24 місяців, а також вважати заробіток простроченим після шести місяців без використання."
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "Мінімум становить $20, а виплати через PayPal ідуть через Tipalti, який бере $2.02 за кожен платіж."
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "Умови дозволяють Honeygain призупинити акаунт і затримати або списати заробіток, який, на його думку, накопичено нечесним шляхом."
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "Перед першою виплатою через PayPal Tipalti просить підтвердити номер мобільного через SMS і вказати ваше ім'я, адресу та дату народження."
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "Умови кажуть, що бізнес-клієнти використовують трафік для збирання загальнодоступних вебданих, але не називають жодного клієнта, і ви не можете знати, який клієнт використовує ваше підключення."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "Власні відповіді Honeygain на відгуки про низький заробіток кажуть, що заробіток залежить від попиту в мережі та місця розташування; автори відгуків повідомляють, що дуже довго досягали мінімуму $20."
  source: "634fb331e65b"
honeygain.rating.pros.0.text:
  text: "Honeygain публікує власний Docker-образ, honeygain/honeygain."
  source: "ea44bd3c855c"
honeygain.rating.pros.1.text:
  text: "Умови називають оператора — Honeygain UAB, зареєстровану у Вільнюсі, Литва."
  source: "579a169fcf35"
honeygain.rating.pros.2.text:
  text: "На сторінці для преси Honeygain сказано, що компанію засновано у 2019 році."
  source: "a3bfbdb33f54"
ionet.description:
  text: "io.net — децентралізована мережа GPU для навантажень ШІ/ML. Об'єднує простоюючі GPU користувачів і дата-центрів. Для відчутного заробітку потрібен GPU NVIDIA з 8GB+ VRAM. Підтримуються розгортання на основі контейнерів.\n"
  source: "5d017f77f0ac"
ionet.short_description:
  text: "Децентралізована мережа GPU для ШІ — потрібен GPU NVIDIA"
  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "Потрібен GPU NVIDIA з 8GB+ VRAM. Для RTX 4090 заявляють $500-1000 на місяць (на практиці, ймовірно, менше)."
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "За епохами"
  source: "75743e03bad2"
ionet.payout.notes:
  text: "Ще не визначено: CashPilot ще не перевірив, де цей сервіс зберігає ваш заробіток."
  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "Винагороди постачальникам виплачувалися з емісії токенів незалежно від оплачених завдань, а власники GPU повідомляють, що здебільшого простоюють."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "Винагороди нараховуються в токені IO, а у 2026 році модель виплат змінилася на механізм із прив'язкою до долара."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "У квітні 2024 року близько 1.8 мільйона фальшивих GPU намагалися приєднатися через токен автентифікації, що потрапив у відкритий доступ, а згодом CEO пішов у відставку ще до запуску токена."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "CashPilot не запускає io.net: ви користуєтеся власним ПЗ воркера від провайдера, тому CashPilot не може розгорнути чи оновити його за вас. Його умови щодо контейнерів не перевірялися."
  source: "1cac289c99ad"
iproyal.description:
  text: "IPRoyal Pawns дає змогу заробляти, ділячись невикористаним трафіком. IPRoyal — відомий провайдер проксі, а Pawns — його підрозділ для обміну домашнім трафіком. Docker-образ CLI приймає облікові дані через прапорці командного рядка. Новий користувач, який зареєструвався за реферальним посиланням, отримує $1 за кожну з перших трьох виплат, разом до $3. Кожна виплата має відбутися протягом проміжку часу від одного до трьох тижнів, залежно від місця розташування. Цей проміжок починається з реєстрації і починається знову після кожної виплати. Якщо проміжок закінчиться раніше, решта бонусів втрачається.\n"
  source: "b12878d5917a"
iproyal.short_description:
  text: "Обмін трафіком — бонус до $3 за перші виплати"
  source: "20091c7b26ed"
