  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% від витрат запрошених орендарів протягом усього існування їхнього акаунта у вигляді реферальних кредитів; до 75% можна вивести з окремого реферального акаунта"
