iproyal.docker.env.IPROYALPAWNS_DEVICE_ID.description:
  text: "Унікальний ідентифікатор пристрою (передається як прапорець -device-id)"
  source: "e3aa886b5ab0"
iproyal.docker.health_signals.0.means:
  text: "IPRoyal Pawns вимкнув цей акаунт."
  source: "a3a68b67f1aa"
iproyal.docker.health_signals.1.means:
  text: "Pawns бачить на цій IP-адресі інший активний пристрій і платить лише за один на IP, тому ця копія працює, але нічим не ділиться й нічого не заробляє. Зупиніть будь-який інший застосунок Pawns на цій IP — на іншій машині, ПК чи телефоні. Якщо такого немає, зачекайте, доки Pawns прибере старий пристрій, або попросіть підтримку Pawns звільнити його."
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "Заробіток залежить від місця розташування та використаного трафіку. Домашні IP зі США та ЄС заробляють більше."
  source: "424261bf08d4"
iproyal.payment.frequency:
  text: "За запитом"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "Мінімум $5. Спершу оберіть свою країну: від неї залежать способи виплати. З Іспанії (жовтень 2026 року): PayPal 4% з мінімальною комісією $0.25, виплата через Tremendous, який надсилає електронною поштою посилання, де ви вводите своє ім'я та адресу PayPal; USDT (BEP20, ERC20, TRC20) або USDC (BEP20, ERC20) з мережевою комісією $1; Bitcoin з мінімальною комісією $2; подарункові картки без комісії. Для першої виплати потрібна одноразова перевірка номера телефону через SMS: її відкриває кнопка Withdraw, а номер вводиться з кодом країни. Далі кожна виплата запитує код, надісланий на електронну пошту акаунта, і перевіряється до 72 годин, перш ніж її буде надіслано."
  source: "0430fae34eb5"
iproyal.payout.notes:
  text: "Баланс зберігає IPRoyal Pawns; виводиться за запитом."
  source: "e11da90d5216"
iproyal.collector.credential_hint:
  text: "Використайте електронну пошту й пароль свого акаунта IPRoyal Pawns (ті самі, що на <a href='https://pawns.app' target='_blank'>pawns.app</a>)."
  source: "b9dcb3a01d17"
iproyal.referral.bonus.referrer:
  text: "$1 за кожну з їхніх перших трьох виплат, разом до $3, якщо кожна відбудеться у свій проміжок 1-3 тижні"
  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "$1 за кожну з ваших перших трьох виплат, разом до $3; якщо пропустите проміжок 1-3 тижні, решта згорає"
  source: "619d5960686c"
iproyal.rating.cons.0.text:
  text: "Умови кажуть, що акаунт можуть заблокувати без попередження за зловживання умовами виведення або за кілька акаунтів, і тоді його заробіток можуть не виплатити."
  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "Умови кажуть, що Pawns не дозволяє жодних серверів, VPN чи проксі-сервісів для обміну трафіком і лише один пристрій на IP."
  source: "449c1cdf793f"
iproyal.rating.cons.2.text:
  text: "PayPal коштує 4% (щонайменше $0.25) через Tremendous, і кожна виплата перевіряється до 72 годин."
  source: "56449f2db6ce"
iproyal.rating.cons.3.text:
  text: "Для першої виплати потрібна перевірка номера телефону через SMS, а для кожної виплати — код, надісланий електронною поштою."
  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "Політика конфіденційності називає оператора — Pawns.App Ltd (компанія 16043795 в Англії та Уельсі), яку, за даними Companies House, зареєстровано 28 жовтня 2024 року, менше ніж три роки тому."
  source: "a7fcb7aea980"
iproyal.rating.cons.5.text:
  text: "Умови кажуть, що Pawns і його бізнес-клієнти пропускають трафік через ваш пристрій і що ви не можете визначити, який клієнт ним користується."
  source: "ca979ac10720"
iproyal.rating.pros.0.text:
  text: "Мінімум $5, подарункові картки без комісії."
  source: "0fa4f89bbd63"
kryptex-pearl.description:
