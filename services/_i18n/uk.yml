mysterium.description:
  text: "MystNodes (Mysterium Network) — децентралізована мережа VPN і проксі, побудована на технології блокчейн. Ви заробляєте токени MYST, запускаючи вузол, який надає користувачам послуги VPN, проксі та збирання даних. Потрібні можливості NET_ADMIN, SETUID і SETGID та пристрій TUN, який вузол використовує у власному мережевому просторі імен на мості застосунків для заробітку за бар'єром. Має вбудований вебінтерфейс для керування вузлом. Працює як на домашніх підключеннях, так і на VPS, але реферальний бонус виплачується лише за вузли на домашній IP.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Вузол децентралізованого VPN — на основі блокчейну, працює на VPS"
  source: "ad1413ac81fa"
