vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/hr, RTX 4090 ~$0.40-0.80/hr в оренді. Завантаженість буває різною. Потрібні GPU NVIDIA, хост на Linux, Docker і nvidia-container-toolkit. Ціни встановлюєте самі."
