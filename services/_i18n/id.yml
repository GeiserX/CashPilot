# Indonesian translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/id.yml --restamp '<key>'
2miners-etc.description:
  text: "Pantau saldo Ethereum Classic yang belum dibayar, yang disimpan 2Miners untuk alamat pembayaran ETC publik Anda. Jalankan miner Anda sendiri dan arahkan ke pool. CashPilot membaca saldo tersebut dan meminta Anda mengonfirmasi pembayaran saat saldonya turun.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Pool penambangan Ethereum Classic, dipantau lewat alamat pembayaran Anda"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (dapat diubah)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "Pool memeriksa ambang pembayaran Anda setiap dua jam"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners membayar ke alamat Anda secara otomatis begitu Anda mencapai ambang yang Anda pilih. Ambang terendah untuk pembayaran ETC adalah 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Saldo yang belum dibayar terkumpul di 2Miners. Saldo dompet dibaca terpisah dari jaringan Ethereum Classic. Periksa jumlah yang Anda terima di dompet sebelum mengonfirmasi pembayaran di CashPilot.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Masukkan alamat pembayaran Ethereum Classic publik yang digunakan miner Anda di 2Miners, diawali dengan <b>0x</b>. Jangan sertakan nama worker.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Memerlukan miner ETCHash yang diarahkan ke 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "komputasi"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Tidak. Miner Anda mengirim hasil kerja penambangan ke pool."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "Pool menggunakan alamat pembayaran Anda, nama worker yang Anda pilih, dan alamat IP miner Anda."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Siapa pun dapat melihat statistik berdasarkan alamat pembayaran. Untuk mengubah ambang, pool meminta konfirmasi IP worker."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "Pool mengenakan biaya 1% dan menahan pembayaran sampai ambang Anda tercapai."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (dulu ATOR) adalah jaringan privasi onion routing terdesentralisasi. Operator node menjalankan node relay dan mendapatkan token ANYONE atas bandwidth yang disumbangkan. Anggap saja \"Tor berinsentif.\" CashPilot menjalankannya dari image miliknya sendiri, yang dibangun dari paket Debian bertanda tangan milik proyek tersebut, untuk amd64 dan arm64. Konfigurasi berbasis file melalui file anonrc yang di-mount ke dalam kontainer (Nickname, ContactInfo, ORPort, dll.). Relay tidak menghasilkan apa pun sampai 100 ANYONE dikunci untuknya selama minimal 180 hari, dan reward diklaim dengan menandatangani di dompet Anda. Relay juga mencantumkan IP publik Anda di direktori relay jaringan, yang dapat merusak reputasi IP yang dibayar oleh aplikasi bandwidth residensial.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Onion routing terdesentralisasi - node relay Tor berinsentif"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Kunci identitas ed25519 relay. Menghapusnya akan menghilangkan reputasi relay dan memulai riwayat penghasilannya dari nol."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Hanya membayar jika 100 ANYONE dikunci per relay selama minimal 180 hari dan klaim reward ditandatangani di dompet Anda. Tanpa stake, relay tidak menghasilkan apa pun. Dengan stake, penghasilan bergantung pada bandwidth yang disumbangkan dan waktu aktif."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Berbasis epoch"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Diatur sebagai ContactInfo di anonrc, dengan awalan '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Fingerprint relay yang dipisahkan koma. Ini tidak ada di dasbor web: jalankan <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> di host yang menjalankan relay.\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Bandwidth, sebagai relay di jaringan Anyone (fork dari Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Ya. Relay meneruskan lalu lintas orang lain. Apakah IP Anda menjadi lompatan terakhir bergantung pada apakah relay dikonfigurasi sebagai exit."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "Kunci identitas publik relay, IP dan port Anda, serta statistik waktu aktif, semuanya memang dipublikasikan ke direktori jaringan. Jika Anda mengisi ContactInfo di anonrc, isinya juga dipublikasikan di sana dan diindeks secara publik untuk selamanya — biasanya berupa alamat email, jadi biarkan kosong kecuali Anda ingin itu publik."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Nyata. Lalu lintas relay dikaitkan dengan koneksi Anda. Relay exit khususnya mengundang keluhan penyalahgunaan; banyak ISP rumahan melarangnya."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Tidak ada akun yang perlu didaftarkan, jadi tidak ada batas per akun. Untuk menghasilkan, Anda tetap memerlukan dompet Ethereum dengan 100 ANYONE dikunci untuk setiap relay selama minimal 180 hari, dan CashPilot memerlukan fingerprint relay untuk membaca reward. Proyek ini tidak memublikasikan batas relay per IP, dan katalog juga tidak mencantumkannya."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Relay tidak menghasilkan apa pun kecuali 100 ANYONE dikunci untuknya selama minimal 180 hari, dan setiap klaim reward ditandatangani di dompet Anda."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Relay memang dirancang untuk meneruskan lalu lintas orang lain, tanpa memeriksa siapa mereka; relay exit mengundang keluhan penyalahgunaan."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "Identitas, IP, dan waktu aktif relay dipublikasikan ke direktori jaringan, dan ContactInfo apa pun yang Anda isi menjadi publik selamanya."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Tidak ada akun yang perlu didaftarkan. Relay hanya memerlukan dompet, tanpa pemeriksaan identitas."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "Perangkat lunak relay adalah fork Tor yang dipublikasikan, di bawah lisensi Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot membangun image miliknya sendiri dari perangkat lunak relay Anyone yang dipublikasikan, yang tidak memerlukan akun."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping adalah platform pemantauan jaringan terdesentralisasi yang membayar Anda untuk menjalankan node. Node Anda melakukan pemantauan situs web, uji latensi, dan pemeriksaan kualitas jaringan untuk pelanggan Bitping. Berfungsi di koneksi residensial maupun VPS. Image Docker masuk dengan variabel lingkungan BITPING_EMAIL dan BITPING_PASSWORD saat pertama kali dijalankan (\"Attempting login with environment variables\" di log-nya sendiri), lalu menyimpan sesi di volume yang di-mount sehingga restart tidak perlu autentikasi ulang.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Berbagi bandwidth - pemantauan jaringan terdesentralisasi, berfungsi di VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Kata sandi"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "Email akun Bitping Anda (login yang sama dengan <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Kata sandi akun Bitping Anda. Digunakan sekali untuk membuat sesi node, yang kemudian tersimpan di volume data."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Penghasilan bergantung pada kualitas jaringan dan permintaan pemantauan dari lokasi Anda. Node VPS diterima."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Penghasilan node ada di nodes.bitping.com; app.bitping.com adalah dasbor pelanggan API. Penarikan hanya dalam SOL: begitu saldo yang belum dibayar lebih dari $0.05, ketik alamat Solana di permintaan, diproses dalam 24 jam. Dompet Solana yang baru atau kosong perlu berisi sekitar 0.001 SOL terlebih dahulu, untuk minimum rent jaringan."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Sekarang hanya Solana, dan alamat diketik SAAT PENARIKAN, bukan disimpan."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Gunakan email dan kata sandi akun Bitping Anda (sama dengan <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Tarik saldo Bitping Anda"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping dapat menghanguskan penghasilan yang tidak diklaim lebih dari 12 bulan, setelah pemberitahuan 30 hari melalui email."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Ajukan penarikan SOL di nodes.bitping.com dan ketik alamat Solana Anda di permintaan."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Penarikan dibayar dalam Solana (SOL), ke alamat yang Anda ketik di setiap permintaan."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Bantuan Bitping menyebutkan bahwa penarikan ke dompet Solana baru yang kosong bisa gagal sampai Anda sendiri mengisi dompet itu dengan sedikit SOL."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Bantuan Bitping menyebutkan bahwa server dan kontainer Docker didukung."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Penarikan hanya memerlukan alamat Solana yang diketik di permintaan."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit adalah layanan berbagi bandwidth yang membayar melalui PayPal dan Stripe. Tidak ada image Docker resmi; kliennya adalah aplikasi desktop Windows dan aplikasi Android. Layanan ini berada di bytebenefit.io -- domain lama bytebenefit.com ditinggalkan dan diparkir di marketplace, itulah sebabnya dulu layanan ini ditandai mati di sini.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Berbagi bandwidth - pembayaran PayPal/Stripe, aplikasi desktop/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Tidak ada image Docker. Hanya aplikasi desktop Windows dan aplikasi Android."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% dari penghasilan lalu lintas referal"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "Bonus sambutan $1 (10.000 Coins)"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "Halaman aplikasi di Google Play menyebutkan bahwa lalu lintas Anda melayani permintaan intelijen web dari klien Infatica, tanpa menyebut siapa mereka atau bagaimana mereka diperiksa."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Aplikasi Android keluar dari Google Play pada April 2026 setelah 17 bulan."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot tidak menjalankan ByteBenefit: Anda menggunakan aplikasi milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir memungkinkan Anda memperoleh penghasilan pasif dengan berbagi bandwidth internet yang tidak terpakai. Hanya mendukung Windows dan Android — FAQ resmi menyatakan tidak ada rencana klien Linux atau Docker, iOS tidak didukung, dan macOS tidak tersedia. Penghasilan sangat bergantung pada lokasi. Dasbor web di dash.bytelixir.com untuk pemantauan. Tidak ada image Docker.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Berbagi bandwidth - hanya Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Cookie sesi"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Cookie Remember Web"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "Token XSRF"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Masuk di <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, tekan F12 → Application → buka <b>Cookies</b> di sidebar kiri → klik sub-item <code>https://dash.bytelixir.com</code> → di daftar cookie sebelah kanan, cari <code>bytelixir_session</code> → salin Value-nya (JWT panjang yang diawali eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Di lokasi yang sama (Cookies → <code>https://dash.bytelixir.com</code>) → cari cookie bernama <code>remember_web_...</code> → salin Value-nya (opsional, memperpanjang masa berlaku sesi)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Di lokasi yang sama → cari <code>XSRF-TOKEN</code> → salin Value-nya (opsional)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Penghasilan bervariasi menurut lokasi ($2-50/bulan). Tidak ada image Docker. Memerlukan aplikasi desktop atau aplikasi Android."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Hanya kripto. Minimumnya bergantung pada koin: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Anda mengetik alamat di setiap permintaan. Permintaan diproses pada jam kerja, dalam 24 jam."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Saldo disimpan oleh Bytelixir; alamat dompet diketik di setiap permintaan pembayaran, tidak pernah disimpan di kontainer."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Masuk di <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>dengan mencentang Remember Me</b>, tekan F12 → Application → buka <b>Cookies</b> di sidebar kiri → klik <code>https://dash.bytelixir.com</code>, lalu salin tiga nilai: <b>bytelixir_session</b>, <b>remember_web_…</b> (yang panjang dan diawali prefiks itu) dan <b>XSRF-TOKEN</b>. Cookie sesi saja kedaluwarsa sekitar dua jam setelah Anda menyalinnya, sehingga pengumpulan berhenti pada sore yang sama; cookie remember_web berlaku setahun dan itulah yang membuatnya tetap berfungsi."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50% dari keuntungan mereka seumur hidup"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "Bonus sambutan $1"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Hanya kripto, dan minimumnya bergantung pada koin, dari $5 untuk USDT hingga $250 untuk Bitcoin."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot tidak menjalankan Bytelixir: Anda menggunakan aplikasi milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Trustpilot memberinya nilai 4.6 dari 283 ulasan, sebagian besar memuji pembayaran kripto; beberapa melaporkan pembayaran tidak sampai."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Pembayaran hanya memerlukan alamat kripto yang diketik di permintaan."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai adalah marketplace GPU peer-to-peer. Anda mendaftarkan mesin Linux dengan GPU NVIDIA, menetapkan sendiri harga spot dan on-demand, dan penyewa menjalankan kontainer Docker mereka sendiri di sana. Anda hanya dibayar untuk menit saat mesin disewa, dalam CLORE, BTC, USDT, atau USDC. Hosting memerlukan mesin x86_64 dengan Ubuntu 22.04 atau lebih baru (atau HiveOS), driver NVIDIA yang berfungsi, dan minimal 100 Mbps untuk unggah dan unduh. GPU AMD tidak didukung.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "Marketplace GPU - sewakan GPU NVIDIA, dibayar dalam CLORE, BTC, atau stablecoin USD"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Hanya dibayar untuk menit yang disewa, dengan harga yang Anda tetapkan. Ujung atas kisaran, $490, adalah batas atas versi Clore sendiri untuk satu RTX 4090 yang disewakan per menit ('hingga ~$490/bulan'); kartu yang lebih kecil menghasilkan lebih sedikit dan kartu yang menganggur tidak menghasilkan apa pun. Clore mengambil 5% (on-demand) atau 1.25% (spot) dari setiap sewa, ditambah 15% jika penyewa membayar dengan BTC, USDT, atau USDC alih-alih CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Tarik dari Account > Billing ke dompet Anda sendiri: CLORE (ERC-20, minimum 200, biaya sekitar $0.50), BTC (minimum 0.0001, biaya 0.00005 BTC) atau USDT/USDC di Ethereum atau BNB Chain (minimum $10, biaya $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore menyimpan saldo (CLORE, BTC, dan satu saldo USD untuk USDT/USDC) sampai Anda menariknya. Jaringan dipilih per penarikan: Ethereum untuk CLORE, Bitcoin untuk BTC, Ethereum atau BNB Chain untuk USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (tingkat standar) dari biaya platform yang dibayar oleh host dan penyewa yang Anda ajak, untuk setiap sewa; kodenya tidak pernah kedaluwarsa; dibayar dalam mata uang sewa (CLORE, BTC, atau USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps unggah dan unduh"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "Waktu komputasi GPU di mesin Anda."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Ya. Penyewa menjalankan kontainer Docker mereka sendiri di mesin Anda, dan lalu lintas mereka keluar dari koneksi Anda; port SSH dan aplikasi diteruskan ke internet."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Kebijakan privasi Clore mencakup data akun dan alamat IP Anda beserta perkiraan lokasi; dokumen identitas hanya jika Clore meminta KYC."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Port masuk harus dapat dijangkau dari internet (22, 8080, dan 3000-4000 secara default) dan beban kerja orang asing berjalan di jaringan Anda. Panduan jaringan Clore sendiri menyebutkan bahwa beberapa ISP memblokir hosting."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "Berusia 18 tahun atau lebih, tidak berada di negara yang terkena sanksi. Clore dapat menangguhkan atau menutup akun atas kebijakannya sendiri, dan penggunaan yang dilarang dapat membuat Anda kehilangan dana."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Baik ketentuan maupun kebijakan privasi tidak menyebutkan badan hukum, dan ketentuan menyerahkan yurisdiksi yang berlaku ke versi berikutnya."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore dapat menangguhkan atau menutup akun atas kebijakannya sendiri, dan penggunaan yang dilarang dapat berujung pada penyitaan dana."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Pembayaran hanya dalam kripto (CLORE, BTC, USDT, atau USDC), dan Clore mengambil tambahan 15% dari sewa yang dibayar penyewa dengan BTC, USDT, atau USDC, kecuali host mengunci CLORE untuk memangkasnya."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Host hanya dibayar untuk menit yang disewa, dan angka Clore untuk RTX 4090 adalah batas atas (\"hingga ~$490/bulan\") untuk satu kartu."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "Penggunaan dasar tidak memerlukan KYC, tetapi Clore dapat meminta verifikasi identitas untuk penarikan besar atau kasus kepatuhan."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Penyewa menjalankan image Docker publik apa pun di mesin Anda. Ketentuan mencantumkan penggunaan yang dilarang (malware, DDoS, CSAM, dan lainnya), tetapi kami tidak menemukan penjelasan tentang bagaimana penyewa diperiksa."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot tidak menjalankan Clore.ai: Anda memasang agen hosting Clore di mesin GPU Anda sendiri (Ubuntu 22.04 atau lebih baru, atau HiveOS), jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Clore mengambil 5% dari sewa on-demand (1.25% untuk spot) jika penyewa membayar dengan CLORE, tanpa biaya tambahan."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN menjalankan jaringan validator yang memeriksa bandwidth dan cakupan untuk infrastruktur AI yang didanai melalui protokol DAWN. Ekstensi browser DAWN Validator ikut serta dalam pemeriksaan proof-of-bandwidth dan cakupan ini dan mendapatkan reward DAWN selama berjalan. Reward tersebut belum memiliki nilai tunai yang pasti. Buat akun di ekstensi dan masukkan kode referal 2QLQV97F saat diminta.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "Validator DePIN - ekstensi browser mendapatkan poin DAWN"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Mendapatkan Dawn Points sebelum peluncuran token. Nilai sebenarnya bergantung pada harga token di masa depan. Perangkat keras menghasilkan lebih banyak daripada ekstensi browser."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Airdrop token (akan diumumkan)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "Ekstensi berfungsi tetapi belum matang. Perangkat keras Black Box sudah diumumkan. Periksa lagi nanti."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "Ekstensi menghasilkan poin; hingga Oktober 2026 belum ada distribusi token kepada operator node yang dikonfirmasi."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "Poin tidak memiliki nilai pasti sampai token diluncurkan dan konversinya diumumkan."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot tidak menjalankan Dawn: Anda menggunakan ekstensi browser milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network adalah proyek VPN terdesentralisasi dan infrastruktur web3. Terutama memerlukan perangkat keras khusus Deeper Connect. Moken adalah platform mining/staking terkait. Tidak bisa hanya dengan perangkat lunak.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "VPN terdesentralisasi - memerlukan perangkat keras khusus"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Memerlukan perangkat keras Deeper Connect ($200-500). Platform Moken untuk mining/staking. Tidak bisa hanya dengan perangkat lunak."
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "Berkelanjutan"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "Komisi dari penjualan perangkat"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "Diskon 5% untuk perangkat Deeper Connect dengan kupon SERGIO"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "Reward mining dalam DPR dan bergantung pada skor kredit yang naik perlahan atau dengan staking DPR."
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot tidak menjalankan Deeper Network: Anda menggunakan perangkat router milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "b1ba1636070f"
earnapp.description:
  text: "EarnApp dari Bright Data memungkinkan Anda menjual bandwidth yang tidak terpakai untuk penghasilan pasif. Bright Data adalah jaringan proxy terbesar di dunia, yang menjalankan pengumpulan data untuk perusahaan Fortune 500. CashPilot menjalankannya dari image miliknya sendiri, yang mengunduh build EarnApp yang dipatok dari CDN Bright Data saat pertama kali dijalankan, memeriksa sha256-nya, dan menjalankannya dalam mode lite hanya dengan UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Berbagi bandwidth - didukung oleh Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "UUID node"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "ID node EarnApp Anda: sdk-node- diikuti 32 karakter heksadesimal huruf kecil, seperti yang ditampilkan 'earnapp showid'. Setelah menerapkan, tautkan sekali dengan membuka https://earnapp.com/r/ diikuti UUID ini saat masuk ke EarnApp; node yang tidak ditautkan tetap menghasilkan, tetapi tidak ada yang masuk ke saldo Anda"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp terus gagal menjangkau servernya dan terus restart, sehingga menghasilkan sedikit atau tidak sama sekali. Restart salinan ini; jika terus terjadi, periksa koneksi internet mesin ini."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Buka tautan ini saat masuk ke EarnApp untuk menambahkan node ke akun Anda. Sampai Anda melakukannya, node tetap menghasilkan tetapi tidak ada yang masuk ke saldo Anda."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Sangat bergantung pada lokasi. IP AS/UE menghasilkan paling banyak. Penghasilan meningkat seiring bandwidth yang terpakai."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Sesuai permintaan (penukaran otomatis tersedia: PayPal min $10, Wise min $10, Amazon min $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Aktifkan penukaran otomatis sekali dan EarnApp akan membayar sendiri setiap kali saldo mencapai minimum metode: PayPal $10, Wise $10, Amazon $50. Pembayaran PayPal dikirim dari Bright Data Ltd. Pada Oktober 2026 sebuah pembayaran PayPal tiba sekitar 2% di bawah saldo yang ditukarkan."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Saldo disimpan oleh EarnApp; ditukarkan ke Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Masuk di <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, tekan F12 → Application → Cookies, salin nilai <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% dari penghasilan mereka seumur hidup, dibayar di luar penghasilan mereka"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "Pusat bantuan EarnApp menyebutkan bahwa memasangnya di kontainer Docker, mesin virtual, layanan hosting, atau server rumahan dilarang keras, padahal begitulah cara CashPilot menjalankannya."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "Artikel bantuan yang sama menyebutkan bahwa akun yang ketahuan berjalan dengan cara itu ditutup tanpa pemberitahuan dan pembayaran yang tertunda dibatalkan."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Pembayaran PayPal kami tiba pada Oktober 2026, sekitar 2% di bawah saldo yang ditukarkan."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "Minimum $10 untuk PayPal dan Wise, dengan penukaran otomatis yang membayar dengan sendirinya."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp milik Bright Data, dan pembayaran PayPal-nya dikirim dari Bright Data Ltd., perusahaan yang jelas namanya."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm membayar Anda untuk berbagi bandwidth internet. Kolektor penghasilan menggunakan autentikasi email/kata sandi melalui Supabase. Image Docker ringan dengan penerapan yang mudah (klien Docker menggunakan token UUID terpisah).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "Berbagi bandwidth - autentikasi email/kata sandi, klien ringan"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "Kunci API"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "Masuk di <a href=\"https://app.earn.fm\">app.earn.fm</a> → klik ikon profil Anda (kanan atas) → Account Settings → salin API Key (format UUID)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "Platform yang relatif baru. Penghasilan bervariasi menurut lokasi dan ketersediaan bandwidth."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "Minimum $15. Metode: USDT di BEP20 atau Polygon (biaya $1) atau TRC20 (biaya $3), PayPal, kartu hadiah Amazon atau Starbucks mulai $15, atau transfer bank mulai $1.000 dengan biaya transfer dipotong. Sebelum pembayaran pertama Anda mengisi profil penagihan (nama resmi dan alamat), yang digunakan untuk tanda terima pembayaran."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "Saldo disimpan oleh Earn.fm; ditarik sesuai permintaan."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Gunakan email dan kata sandi akun Earn.fm Anda (sama dengan login <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10% dari penghasilan mereka seumur hidup"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "Saldo awal $5"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "Minimum $15, biaya $1 hingga $3 untuk USDT, dan transfer bank hanya mulai $1.000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Sebelum pembayaran pertama Anda mengisi profil penagihan dengan nama resmi dan alamat Anda."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Pengulas pada 2025 melaporkan dukungan lewat email dan Discord tidak menjawab; Trustpilot mencatat Earn.fm belum membalas ulasan negatif."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Earn.fm memublikasikan image Docker miliknya sendiri, earnfm/earnfm-client."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher adalah platform pertukaran lalu lintas tempat Anda mendapatkan kredit dengan mengunjungi situs web melalui surfbar otomatis. Berjalan sebagai ekstensi/add-on browser. Bukan layanan berbagi bandwidth biasa — layanan ini menghasilkan lalu lintas dengan menjelajahi situs web secara otomatis.\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "Surfbar pertukaran lalu lintas - ekstensi browser"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "Penghasilan dalam poin BTP yang dapat dikonversi ke EUR. Hanya ekstensi browser."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "Pembayaran dalam euro melalui PayPal atau transfer bank."
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "CashPilot tidak menjalankan eBesucher: ini adalah ekstensi browser, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "Pembayaran mulai 2 euro melalui PayPal atau SEPA, setidaknya mingguan, tanpa biaya."
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "eBesucher sudah beroperasi sejak 2002."
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "Impresum menyebutkan operatornya, TurboAd GmbH, terdaftar di Berlin-Charlottenburg (HRB 160730 B)."
  source: "84cbddd4330b"
flux.description:
  text: "Flux adalah infrastruktur komputasi yang tersebar secara global. Operator node melakukan stake token FLUX dan menyediakan sumber daya server. Tiga tingkat: Cumulus (1.000 FLUX), Nimbus (12.500 FLUX), Stratus (40.000 FLUX). Image Docker resmi tersedia.\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "Komputasi terdesentralisasi - memerlukan stake token FLUX"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "Memerlukan stake 1.000+ FLUX (~$50-500 tergantung harga). Tingkat yang lebih tinggi memerlukan jaminan lebih besar tetapi menghasilkan lebih banyak."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "Reward blok"
  source: "590433237f8a"
flux.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
