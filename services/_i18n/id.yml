  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "Ketentuan menyebutkan bahwa klien bisnis menggunakan lalu lintas untuk mengumpulkan data web yang tersedia untuk umum, tetapi tidak menyebut klien mana pun, dan Anda tidak dapat mengetahui klien mana yang menggunakan koneksi Anda."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "Balasan Honeygain sendiri atas ulasan tentang penghasilan rendah menyebutkan bahwa penghasilan bergantung pada permintaan jaringan dan lokasi; pengulas melaporkan butuh waktu sangat lama untuk mencapai minimum $20."
  source: "634fb331e65b"
