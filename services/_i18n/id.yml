  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "Pada April 2024 sekitar 1.8 juta GPU palsu mencoba bergabung melalui token autentikasi yang bocor, dan CEO-nya kemudian mundur sebelum peluncuran token."
