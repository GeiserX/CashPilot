supportxmr.description:
  text: "SupportXMR adalah pool penambangan Monero tanpa akun: miner Anda masuk dengan alamat Monero Anda sebagai nama pengguna, dan pool membayar ke alamat itu. CashPilot tidak menjalankan miner di sini. CashPilot membaca saldo yang disimpan SupportXMR untuk alamat Anda, sehingga Anda melihat apa yang dihasilkan miner CPU Anda di samping penghasilan Anda yang lain. Saldo sudah diperoleh tetapi belum diterima: pool membayarnya begitu melewati ambang pembayaran Anda.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Pool penambangan Monero, dipantau lewat alamat pembayaran Anda"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (otomatis), 0.01 XMR sesuai permintaan"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Saat saldo Anda melewati ambang, atau sesuai permintaan"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR membayar ke alamat Anda begitu saldo mencapai ambang Anda (0.1 XMR secara default). Di situsnya Anda juga dapat meminta pembayaran instan mulai 0.01 XMR, dengan biaya 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Saldo sudah diperoleh tetapi belum diterima sampai SupportXMR membayarnya ke alamat ini. Saldo Monero tidak dapat dibaca on-chain tanpa private view key, yang tidak pernah diminta CashPilot, jadi Anda mengonfirmasi setiap pembayaran sendiri."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Alamat pembayaran Monero Anda: nama pengguna yang digunakan miner Anda di SupportXMR, tanpa bagian <b>.workername</b> atau <b>+difficulty</b>. Alamat ini publik dan tidak membuka akses ke dana apa pun."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Memerlukan miner Monero (XMRig) yang diarahkan ke pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "komputasi"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Tidak. Miner Anda mengirim hash ke pool; tidak ada yang meneruskan lalu lintas melalui koneksi Anda."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Alamat Monero Anda, nama worker yang Anda pilih, hashrate Anda, dan alamat IP miner Anda sebagaimana dilihat pool."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Miner menjaga satu koneksi terbuka ke pool dan memakai sedikit bandwidth. Biaya yang perlu diperhatikan adalah listrik, bukan ISP Anda."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Tidak ada akun. Alamat adalah identitasnya, dan siapa pun dapat membaca statistiknya di supportxmr.com."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Hanya dibayar dalam Monero, dengan biaya pool 0.6% dan ambang default 0.1 XMR sebelum pembayaran otomatis."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot tidak menjalankan miner untuk SupportXMR: Anda mengarahkan miner Anda sendiri ke pool, dan CashPilot hanya membaca saldo."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol memberi agen AI akses ke web secara langsung melalui jaringan Beacon. Teneo Beacon adalah aplikasi milik Teneo untuk Android, iOS, macOS, Windows, dan Linux, dengan versi baris perintah untuk server dan Raspberry Pi. Aplikasi ini membagikan bandwidth Anda yang tidak terpakai setelah Anda menyetujui layar persetujuannya, dan mendapatkan Teneo Protocol Points dan Fragments selama online. Fragments dihitung untuk undian musiman yang dibayar dalam USDC (Beacon Drop). Teneo menyatakan Beacon menghasilkan poin dua kali lipat dibandingkan ekstensi browser lamanya. Hanya satu Beacon yang menghasilkan per koneksi internet. Perangkat lain di koneksi yang sama berstatus siaga. Daftar di Expedition Hub dengan tautan referal atau kode PSA3BHPJ, lalu masuk ke Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "Aplikasi bandwidth DePIN (Beacon) - Fragments untuk undian USDC musiman, +100 Fragments dengan tautan referal"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Mendapatkan Teneo Points dan Fragments. Fragments dihitung untuk undian USDC musiman, jadi satu musim membayar hadiah, bukan tarif. Teneo menyatakan Beacon menghasilkan poin dua kali lipat dibandingkan ekstensi browser. Klaim boost setiap 8 jam untuk hingga 3x Fragments; jendela yang terlewat menurunkan pengalinya."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Undian musiman (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Hadiah Beacon Drop dibayar dalam USDC ke dompet yang Anda tautkan di Expedition Hub. Hub menampilkan berapa hari waktu yang Anda miliki untuk menautkannya; hadiah tanpa dompet yang ditautkan tepat waktu hangus."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Tautkan dompet di Expedition Hub sebelum hadiah musim dibayarkan; Hub menghanguskan hadiah yang dompetnya tidak ditautkan tepat waktu."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% dari Fragments setiap teman yang diajak dan 2% dari Fragments referal mereka, begitu teman tersebut mendaftar dalam 7 hari dan mendapatkan 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments saat mendaftar, dan +150 lagi begitu Anda mencapai 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "Hanya satu Beacon yang menghasilkan per koneksi internet. Mesin pusat data hanya menghasilkan di penyedia hosting yang telah diaktifkan Teneo, dengan separuh Fragments dan tanpa poin atau bonus referal. Koneksi VPN tidak pernah menghasilkan."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Fragments dari Beacon hanya membayar USDC sebagai hadiah dalam undian musiman, jadi menjalankannya tidak menghasilkan jumlah yang pasti."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo menyatakan poin akan digabungkan ke dalam $AGENTIC, token reward yang tidak dapat dipindahtangankan, bukan token $TENEO."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "Tanggal peluncuran, alokasi, maupun proses klaim $TENEO belum dikonfirmasi hingga November 2026, setelah target sebelumnya, kuartal kedua 2026, terlewati."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot tidak menjalankan Teneo: Anda memasang aplikasi Beacon milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo menyatakan lalu lintas berasal dari pelanggan bisnis yang telah diperiksa dan memblokir alamat privat serta port yang rawan penyalahgunaan, tetapi tidak menjelaskan bagaimana pelanggan tersebut diperiksa."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network adalah jaringan pengiriman video dan komputasi AI terdesentralisasi yang sudah mapan (sejak 2018). Pengguna menjalankan Edge Node yang berbagi bandwidth, penyimpanan, dan daya komputasi. Kemitraan konten besar. Mendapatkan token TFUEL.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "CDN terdesentralisasi + komputasi AI - reward TFUEL, proyek mapan"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Hanya aplikasi desktop. Penghasilan bergantung pada sumber daya dan lokasi. Kemitraan besar, terdaftar di semua exchange."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Berkelanjutan"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot tidak menjalankan Theta Edge: Anda menggunakan aplikasi desktop milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "893de938ed14"
titan.description:
  text: "Titan Network adalah platform DePIN yang membagikan alamat IP, penyimpanan, dan bandwidth Anda dengan imbalan reward token TNT. Tersedia di Windows, Mac, dan Android. Node berkontribusi pada CDN dan lapisan penyimpanan terdesentralisasi. Penghasilan umumnya berkisar $5-30/bulan tergantung sumber daya yang dibagikan dan lokasi geografis.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN berbagi IP, penyimpanan, bandwidth - $5-30/bulan"
  source: "799e68401067"
titan.earnings.notes:
  text: "Membagikan IP, penyimpanan, dan bandwidth. Penghasilan bergantung pada sumber daya yang disumbangkan dan wilayah. Alokasi penyimpanan yang lebih besar menghasilkan reward lebih tinggi."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Berbasis epoch"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Bantuan Titan sendiri menyebutkan bahwa node yang berjalan tidak menjamin penghasilan: tanpa tugas yang diberikan, node tidak menghasilkan apa pun, dan reward dalam token TNT."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot tidak menjalankan Titan: Anda menggunakan aplikasi atau ekstensi milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer memungkinkan Anda memonetisasi lalu lintas internet dengan berbagi bandwidth kepada bisnis terverifikasi. Salah satu dari sedikit layanan berbagi bandwidth yang berfungsi baik di IP VPS dan pusat data selain koneksi residensial. Menggunakan autentikasi berbasis token sederhana yang diteruskan melalui argumen baris perintah. Mendukung arsitektur ARM untuk Raspberry Pi dan perangkat serupa.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Berbagi bandwidth - berfungsi di VPS, autentikasi berbasis token"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Token"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Nama perangkat"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Masuk di <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, tekan F12 → Application → Local Storage → klik <code>https://app.traffmonetizer.io</code> → salin nilai <code>authToken</code> (sekitar 54 karakter: angka, sebuah <code>|</code>, lalu huruf dan angka)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Nama yang ditampilkan di dasbor untuk pengelolaan perangkat"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "IP VPS dan pusat data menghasilkan lebih sedikit daripada residensial. Lokasi AS/UE menghasilkan lebih banyak. Beberapa IP didukung melalui jaringan Docker."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Minimum $10. PayPal tidak lagi tersedia. Simpan satu metode pembayaran di profil terlebih dahulu: USDT di Solana atau TON (biaya terendah), Arbitrum (biaya rendah), atau Tron TRC20 (biaya jaringan tinggi), atau transfer bank mulai $1.000. Alamat pertama yang Anda simpan langsung berlaku; mengubahnya nanti memerlukan konfirmasi email. Dasbor mungkin meminta kontak messenger (WhatsApp, Telegram, atau Skype) sebelum penarikan pertama. Permintaan membayar dalam dolar bulat dan sennya tetap di saldo."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT di jaringan yang disimpan di pengaturan pembayaran profil (Solana, TON, Arbitrum, atau Tron), atau transfer bank. Alamatnya disimpan di pengaturan Traffmonetizer, bukan di kontainer."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Masuk di <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, tekan F12 → Application → Local Storage → nilai <b>authToken</b> (sekitar 54 karakter: angka, sebuah <code>|</code>, lalu huruf dan angka)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% dari setiap pembayaran yang mereka minta"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Ketentuan layanan Traffmonetizer mensyaratkan IP residensial, tetapi dalam praktiknya node VPS diterima."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot memberinya nilai 1.9; pengulas dari 2023 hingga November 2026 melaporkan pembayaran tertunda berminggu-minggu, atau ditandai selesai tanpa transaksi yang sesuai."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Pengulas yang sama melaporkan dukungan live chat dan email tidak menjawab, terkadang berminggu-minggu."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Hanya kripto atau transfer bank mulai $1.000; PayPal sudah tidak ada, dan permintaan hanya membayar dalam dolar bulat."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Ketentuan Traffmonetizer mensyaratkan IP residensial, jadi server di koneksi hosting berada di luar ketentuan tersebut."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Empat pengulas Trustpilot dari 2023 hingga 2025 melaporkan penghasilan yang sangat lambat, seperti satu sen per hari di empat perangkat, atau hampir dua tahun untuk mencapai $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Pembayaran hanya memerlukan alamat kripto tersimpan yang dikonfirmasi lewat email; dasbor mungkin meminta kontak messenger."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer memublikasikan image Docker miliknya sendiri, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Menambang dengan CPU Anda dan dibayar dengan koin pilihan Anda, seperti SHIB, DOGE, atau XMR. CashPilot menjalankan XMRig ke pool RandomX milik unMineable, dan unMineable mengonversi Monero yang ditambang CPU Anda menjadi koin Anda. Pembayaran dikirim ke alamat publik Anda begitu saldo mencapai ambang pembayaran koin tersebut. Setiap worker yang diterapkan CashPilot membawa kode referal unMineable milik CashPilot, yang menurunkan biaya platform Anda dari 1% menjadi 0.75%. Listrik bisa lebih mahal daripada yang Anda hasilkan."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Menambang dengan CPU Anda dan dibayar dengan koin pilihan Anda"
  source: "03bd0d4f2004"
