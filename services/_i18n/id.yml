  text: "Algoritma"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "Pool (host:port)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "Enkripsi koneksi pool (TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "Alamat Pearl publik Anda (prl1...). Untuk Zano atau Ravencoin, masukkan alamat koin tersebut dan pool untuknya."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash untuk Pearl, progpow_zano untuk Zano, kawpow untuk Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.earnings.notes:
  text: "Perkiraan kotor sebelum biaya listrik. Pada 2026-11-25 hashrate.no memperkirakan sekitar $2.45 per hari untuk Pearl dengan RTX 4070 yang menarik daya sekitar 142 W. Kami belum mengukurnya. Pearl adalah koin baru, dan harga serta tingkat kesulitannya berubah cepat. Periksa konsumsi daya GPU Anda dan harga listrik Anda untuk melihat apakah ini menguntungkan."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Saat ambang pool tercapai"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "Pool membayar ke alamat Anda saat saldo mencapai ambang Anda. Pool menyimpan saldo sampai membayar Anda."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, GPU NVIDIA, dan NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Mesin ini melaporkan koneksi hosting. Periksa ketentuan penyedia Anda sebelum menambang. Beberapa penyedia, termasuk Hetzner Cloud, melarangnya. Periksa biaya listrik Anda yang sebenarnya sebelum mengandalkan perkiraan keuntungan."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "Biaya miner 2% berlaku untuk pearlhash. SRBMiner-Multi mengambil 0.85% untuk progpow_zano dan kawpow. HeroMiners, pool Pearl default, mengenakan biaya pool 1%. Pool ini memeriksa pembayaran setiap jam dan membayar mulai 1 PRL. Pool lain menetapkan tarif dan ambangnya sendiri."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "komputasi"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "Tidak. Miner mengirim hasil kerja ke pool yang Anda pilih."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Alamat pembayaran, nama worker, dan alamat IP Anda dikirim ke pool. Saat pertama kali dijalankan, miner diunduh dari GitHub."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Beberapa jaringan dan resolver DNS memblokir koneksi ke pool penambangan."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "Sebagian besar pool mengenali Anda dari alamat pembayaran publik Anda."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "Miner mengambil 2% waktu hashing untuk Pearl dan 0.85% untuk Zano dan Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Beberapa penyedia hosting melarang penambangan mata uang kripto."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "Miner ini bersifat closed source, jadi tidak ada orang di luar pengembangnya yang dapat mengaudit apa yang dijalankannya."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "Listrik GPU bisa lebih mahal daripada koin yang dihasilkan, dan harga Pearl bergerak cepat."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "Miner mengirim hasil kerja ke pool dan tidak meneruskan lalu lintas orang lain."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Anda dapat menambang Pearl di HeroMiners dengan alamat publik dan tanpa akun."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj adalah jaringan penyimpanan cloud terdesentralisasi tempat Anda menghasilkan dengan menyewakan ruang disk yang tidak terpakai. Jalankan node penyimpanan melalui Docker dan dapatkan bayaran $1.35/TB yang disimpan per bulan ditambah $1/TB egress (tarif sejak 1 September 2026). Pembayaran bulanan dalam USDC, stablecoin dolar AS, di mainnet Ethereum ke dompet yang Anda kendalikan, begitu saldo melewati minimum berbasis biaya (token STORJ hingga pembayaran September 2026). Memerlukan ruang disk tersedia minimal 550GB dan koneksi internet yang stabil. Tidak perlu akun atau pendaftaran -- node bersifat tanpa izin sejak pertengahan 2025. PERHATIAN (Oktober 2026): Storj Labs mengajukan Chapter 11 pada 26 Juli 2026 (Pengadilan Kepailitan AS, Distrik Utara West Virginia, perkara 5:26-bk-00512) untuk merestrukturisasi utang lama. Jaringan tetap berjalan dan Storj tetap membayar node aktif, tetapi penghasilan node dari sebelum pengajuan dibekukan sampai pengadilan memutuskannya. Token STORJ turun sekitar 98% dari puncaknya pada 2021. Binance menghapusnya dari daftar pada 3 September 2026, dan Coinbase menangguhkan perdagangannya pada 28 September 2026. Node baru menahan sebagian penghasilannya selama sembilan bulan pertama dan hanya terisi sesuai permintaan pelanggan, jadi memulai node sekarang berarti mengikat masa balik modal yang panjang pada perusahaan yang sedang direstrukturisasi dan masih bisa berhenti beroperasi.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Node penyimpanan terdesentralisasi - $1.35/TB disimpan + $1/TB egress"
  source: "c68d5964b002"
