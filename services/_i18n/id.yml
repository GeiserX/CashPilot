  text: "Path host di hard disk (HDD) untuk penyimpanan data Storj. Memerlukan ruang kosong minimal 550GB"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Sebelum pertama kali dijalankan, inisialisasi konfigurasi node penyimpanan: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Identitas node. ID-nya terikat proof-of-work dan butuh berjam-jam untuk dibuat ulang, dan tidak dapat dibuat ulang dari cadangan data lain. Kehilangannya berarti kehilangan saldo pembayaran yang ditahan."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Data pelanggan yang disimpan dan jumlah yang ditahan node. Kehilangannya membuat node didiskualifikasi dan saldo yang ditahan hangus."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Jaringan Storj tidak dapat menghubungi node Anda di ADDRESS yang diumumkannya, sehingga satelit menganggapnya offline: data baru berhenti masuk, pendapatan egress terhenti, dan waktu offline yang berkepanjangan berujung pada penangguhan. Periksa bahwa ADDRESS sesuai dengan IP publik Anda SAAT INI (gunakan hostname DDNS, bukan IP literal, agar penggantian IP oleh ISP tidak membuat node terputus) dan bahwa port 28967 TCP+UDP diteruskan ke mesin ini."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB disimpan + $1/TB egress + $1/TB audit/perbaikan sejak 1 September 2026. Penghasilan meningkat seiring data yang disimpan dan usia node. Sembilan bulan pertama menahan 75%, lalu 50%, lalu 25% dari penghasilan; separuh jumlah yang ditahan kembali di bulan ke-16 dan sisanya saat keluar dengan benar (graceful exit). Port 28967 harus diteruskan."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4x biaya transaksi Ethereum, saldo yang lebih kecil dibawa ke bulan berikutnya"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Bulanan"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Dibayar bulanan dalam USDC di mainnet Ethereum begitu saldo dompet setidaknya empat kali biaya transaksi saat ini; saldo yang lebih kecil dibawa ke bulan berikutnya. Token STORJ hingga pembayaran September 2026. Dasbor di port 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Dibayar bulanan dalam USDC di mainnet Ethereum ke alamat di WALLET begitu saldo melewati minimum berbasis biaya. Token STORJ hingga pembayaran September 2026; pembayaran zkSync Era berakhir 1 September 2026."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "URL dasbor node di port 14002, dengan IP LAN server, bukan localhost, misalnya <b>http://192.168.1.10:14002</b>. Untuk beberapa node, cantumkan URL-nya dipisahkan koma: CashPilot menjumlahkannya."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Node Storj di subnet /24 yang sama berbagi alokasi data, sehingga mengurangi penghasilan per node."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "Unggah 5 Mbps"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Ruang disk dan bandwidth untuk melayaninya."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Tidak. Anda menyimpan fragmen data pelanggan yang terenkripsi dan di-erasure-code. Orang lain tidak meneruskan lalu lintas mereka sendiri melalui IP Anda."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "Identitas node, alamat dompet Anda, alamat email yang diwajibkan node untuk notifikasi operator, serta IP dan port Anda, yang harus dapat dijangkau agar node dapat melayani data."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "Terutama soal batas kuota data, bukan soal tanggung jawab hukum: node terus-menerus melayani dan menerima data pelanggan, yang merupakan lalu lintas nyata dan berkelanjutan di jaringan Anda. Namun, tidak seperti proxy atau relay, ini bukan lalu lintas pihak ketiga yang dianonimkan dan dikaitkan dengan Anda sebagai asalnya, sehingga tidak mengundang keluhan penyalahgunaan seperti keduanya."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Node tak terbatas, tetapi node di subnet /24 yang sama berbagi alokasi, jadi beberapa node di satu koneksi masing-masing menghasilkan lebih sedikit."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk melaporkan pada 27 Juli 2026 bahwa Storj Labs telah mengajukan perlindungan kepailitan Chapter 11."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
