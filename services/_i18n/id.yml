  text: "Alamat publik Anda untuk koin tersebut. Koin yang memerlukan memo atau tag tidak didukung."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Perkiraan kotor sebelum biaya listrik, dibayar dalam koin Anda dengan kurs konversi unMineable. Pada 2026-11-25, 1 kH/s RandomX bernilai sekitar $1 per bulan. CPU desktop dengan separuh thread-nya bisa menarik daya tambahan 30 hingga 50 W. Periksa pemakaian Anda yang sebenarnya dan harga listrik untuk melihat apakah ini menguntungkan."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "Ditetapkan per koin oleh unMineable (0.03 XMR pada 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Saat ambang pembayaran koin tercapai"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable membayar ke alamat Anda begitu saldo mencapai ambang pembayaran koin tersebut. Ambang berbeda menurut koin dan jaringan; CashPilot membaca ambang yang dilaporkan unMineable untuk alamat Anda."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Saldo sudah diperoleh tetapi belum diterima sampai unMineable membayarnya ke alamat ini. Jaringannya bergantung pada koin yang Anda pilih."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "Alamat pembayaran dan ticker koin yang sama dengan yang Anda gunakan saat menerapkan miner, misalnya <b>XMR</b>. Masukkan alamatnya saja, tanpa koin, nama worker, atau kode referal. Alamat ini publik dan tidak membuka akses ke dana apa pun."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% dari reward penambangan setiap miner yang diajak"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Biaya platform diturunkan dari 1% menjadi 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Mesin ini melaporkan koneksi hosting. Periksa ketentuan penyedia Anda sebelum menambang. Beberapa penyedia, termasuk Hetzner Cloud, melarangnya. Periksa biaya listrik Anda yang sebenarnya sebelum mengandalkan perkiraan keuntungan."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable mengenakan biaya platform 1%. CashPilot menambahkan kode referalnya (#awk6-j1z0) setelah setiap nama worker, yang menurunkan biaya Anda menjadi 0.75%. unMineable kemudian membayar pengelola CashPilot 0.25% dari reward penambangan Anda; Anda tetap mendapat 99.25%. Setiap koin memiliki ambang pembayarannya sendiri, misalnya 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "komputasi"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "Tidak. Miner mengirim hasil kerja ke pool unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "Alamat pembayaran, koin, nama worker, hashrate, dan alamat IP Anda dikirim ke unMineable."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "Beberapa jaringan dan resolver DNS memblokir koneksi ke pool penambangan."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "Tidak perlu akun. Alamat dan koin adalah identitasnya, dan siapa pun dapat membaca statistiknya di unmineable.com."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "unMineable tetap mengenakan biaya platform 0.75% dengan kode referal dan hanya membayar mulai ambang masing-masing koin."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "Beberapa penyedia hosting melarang penambangan mata uang kripto."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "Listrik tambahan bisa lebih mahal daripada koin yang dihasilkan."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "Statistik alamat, termasuk saldo, terbuka untuk siapa pun yang mengetahui alamat tersebut."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "Miner mengirim hash ke pool dan tidak meneruskan lalu lintas orang lain."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Anda dapat menambang ke alamat publik dalam koin pilihan Anda tanpa membuat akun."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock adalah platform DePIN (Decentralized Physical Infrastructure Network) yang memungkinkan Anda mendapatkan mata uang kripto dengan berbagi koneksi internet. Bagian dari ekosistem Web3 yang lebih luas. Tersedia image Docker komunitas tetapi tidak ada image resmi. Ekstensi browser adalah antarmuka utamanya.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "Berbagi internet DePIN - pembayaran kripto, utamanya ekstensi browser"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Penghasilan berbasis kripto/token. Tidak ada image Docker resmi — ekstensi browser adalah klien utamanya."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
uprock.cashout.notes:
  text: "Token UPT, ditarik ke dompet Solana mulai 250 UPT, dengan autentikasi dua faktor aktif. Ada biaya penarikan."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "Pusat bantuan UpRock menyebutkan bahwa penarikan berupa token UPT ke dompet Solana, dengan minimum 250 UPT."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "Reward berupa token UPT; pengulas dan sebuah ulasan pihak ketiga mengatakan nilainya sangat rendah."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot tidak menjalankan UpRock: Anda menggunakan aplikasi atau ekstensi milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork adalah jaringan VPN dan berbagi bandwidth terdesentralisasi. Anda menghasilkan dengan menyediakan bandwidth sebagai penyedia komunitas. Binary penyedia mengautentikasi dirinya sendiri dengan email dan kata sandi akun Anda (subperintah auth-provide-nya) dan menyimpan JWT sesi yang dihasilkan di volume data. Image Docker resmi dari BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "VPN/bandwidth terdesentralisasi - autentikasi email+kata sandi, sesi JWT di volume"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "Email"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Kata sandi"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "Email akun URnetwork Anda (login yang Anda gunakan di <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Akun yang dibuat melalui login Google/Apple perlu mengatur kata sandi terlebih dahulu. Belum punya akun? Daftar dengan <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "Kata sandi akun URnetwork Anda (tanpa spasi). Digunakan oleh login auth-provide milik penyedia; setelah itu sesi tersimpan di volume data."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Berfungsi di VPS dan residensial. Dibayar dalam SN25α (subnet Bittensor 25) per epoch mingguan sejak 2026-10-06. Mendukung mode proxy untuk penyiapan multi-IP."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "Berbasis epoch"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Atur coldkey Bittensor di ur.io/app/account/earnings (ditandatangani dengan Talisman, TAO.com, atau dompet WalletConnect), lalu klaim setiap epoch yang sudah final. Klaim membayar gas dalam TAO dari kunci gas EVM. EPOCH YANG TIDAK DIKLAIM KEDALUWARSA, dan pembayaran USDC lama dibatalkan jika tidak ada dompet yang ditautkan dalam 30 hari."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB data UR gratis per hari per teman, hingga 20 teman (data, bukan uang)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB data UR gratis per hari begitu Anda memakai setidaknya 10 MiB melalui aplikasi pada 2 hari dalam 90 hari sejak bergabung; jika tidak, referal berakhir"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Epoch yang tidak diklaim kedaluwarsa, dan pembayaran USDC lama dibatalkan untuk jaringan yang tidak menautkan dompet dalam 30 hari."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "Sejak Oktober 2026 reward dibayar dalam SN25α, token subnet Bittensor, dan setiap klaim memakan gas dalam TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork dulunya bernama BringYour; whitepaper yang diarsipkan masih memakai nama lama."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork memublikasikan kode sumber klien penyedianya."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork memublikasikan image Docker miliknya sendiri, bringyour/community-provider, dan berfungsi di koneksi VPS maupun residensial."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Klaim hanya memerlukan dompet Bittensor yang Anda kendalikan."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai adalah marketplace cloud GPU tempat Anda menyewakan GPU NVIDIA Anda kepada peneliti dan pengembang AI/ML. Platform berbasis Docker tempat Anda menetapkan sendiri harga per jam. RTX 3090 biasanya menghasilkan $0.20-0.40/jam saat disewa. Memerlukan GPU NVIDIA dengan driver terbaru dan koneksi internet yang stabil. Pendapatan sangat bergantung pada model GPU, strategi harga, dan permintaan pasar.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "Marketplace GPU - tetapkan harga sendiri, RTX 3090 ~$0.20-0.40/jam"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "Kunci API"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "Kunci API host Vast.ai dari dasbor"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/jam, RTX 4090 ~$0.40-0.80/jam saat disewa. Tingkat pemakaian bervariasi. Memerlukan GPU NVIDIA, host Linux, Docker, dan nvidia-container-toolkit. Tetapkan harga sendiri."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Mingguan (hari Jumat)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "Penghasilan terkumpul di saldo Vast.ai. Tarik melalui Wise, PayPal, atau Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% dari pengeluaran penyewa yang diajak, selama akun mereka ada, sebagai kredit referal; hingga 75% dapat dicairkan dari akun referal khusus"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Host hanya menghasilkan saat disewa, dan angka Vast sendiri untuk GPU konsumen bergantung pada jenis sewa dan skor keandalan."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot tidak menjalankan Vast.ai: Anda memasang perangkat lunak host Vast di mesin GPU Anda sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Vast membangun hosting di atas Docker pada host Linux."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Vast menyatakan tarif yang ditetapkan host adalah tarif yang diterimanya, tanpa potongan biaya."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "Pembayaran melalui Wise, PayPal, atau Stripe mulai minimum $20, ditagihkan mingguan; saldo yang lebih kecil dibawa ke minggu berikutnya."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter adalah platform berbagi bandwidth yang tersedia di Windows, Mac, Linux, dan Android. Platform ini mengklaim membayar hingga $1/GB bandwidth yang dibagikan dengan ambang pembayaran minimum $20. Platform ini bekerja mirip dengan aplikasi berbagi bandwidth tradisional, meneruskan lalu lintas yang sah melalui koneksi residensial.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Berbagi bandwidth - klaim hingga $1/GB, pembayaran min $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Mengklaim hingga $1/GB tetapi penghasilan nyata lebih rendah. Pembayaran minimum $20. Penghasilan sangat bervariasi menurut lokasi dan permintaan."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter tidak memiliki dasbor web. Buka aplikasi desktop atau ponsel Wipter, masuk, dan ajukan pembayaran di sana begitu saldo mencapai $20. Wipter hanya membayar dalam USDT di BNB Smart Chain (BEP20), ke dompet yang Anda atur di bagian Payments aplikasi; tidak ada pilihan PayPal."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% dari penghasilan lalu lintas mereka begitu mereka mencapai pembayaran minimum, untuk berapa pun teman yang Anda ajak"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "Bonus pendaftaran $5"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot tidak menjalankan Wipter: Anda menggunakan aplikasi desktop atau ponsel milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "fa32942c6b4f"
xmrig.description:
  text: "Tambang Monero dengan CPU Anda. CashPilot menjalankan XMRig, dan pool pilihan Anda membayar Monero ke alamat pembayaran publik Anda. XMRig memakai 1% waktu hashing untuk mendukung pengembangnya. Listrik bisa lebih mahal daripada XMR yang Anda hasilkan."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "Tambang Monero dengan CPU Anda dan pool pilihan Anda"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Alamat Monero"
  source: "a888ebb3ae9b"
xmrig.docker.env.POOL_URL.label:
  text: "Pool"
  source: "f13024272c38"
xmrig.docker.env.WORKER_NAME.label:
  text: "Nama worker"
  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "Maks thread CPU (%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "Mode RandomX"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "Perkiraan kotor sebelum biaya listrik. Pada 2026-11-25, 1 kH/s bernilai sekitar $1 per bulan pada harga XMR dan tingkat kesulitan jaringan yang teramati. CPU desktop dengan separuh thread-nya bisa menarik daya tambahan 30 hingga 50 W. Periksa pemakaian Anda yang sebenarnya dan harga listrik untuk melihat apakah ini menguntungkan."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, setelah Anda menurunkannya)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Saat ambang pool tercapai"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "Pool membayar ke alamat Monero Anda saat saldo mencapai ambang Anda. Pool menyimpan saldo sampai membayar Anda."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Mesin ini melaporkan koneksi hosting. Periksa ketentuan penyedia Anda sebelum menambang. Beberapa penyedia, termasuk Hetzner Cloud, melarangnya. Periksa biaya listrik Anda yang sebenarnya sebelum mengandalkan perkiraan keuntungan."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "MoneroOcean, pool default, mengenakan biaya penambangan 0%. Ambang pembayaran default adalah 0.3 XMR, dan Anda dapat menurunkannya hingga 0.003 XMR. Pembayaran di bawah 4 XMR dapat dikenai biaya hingga 0.0004 XMR. Pool lain menetapkan tarif dan ambangnya sendiri."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "komputasi"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "Tidak. Miner mengirim hasil kerja ke pool penambangan."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Alamat Monero, nama worker, dan alamat IP Anda dikirim ke pool."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "Beberapa jaringan dan resolver DNS memblokir koneksi ke pool penambangan."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "Sebagian besar pool Monero mengenali Anda dari alamat pembayaran publik Anda."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Pembayaran memerlukan XMR yang cukup untuk memenuhi ambang pool Anda."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "Beberapa penyedia hosting melarang penambangan mata uang kripto."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "Listrik tambahan bisa lebih mahal daripada XMR yang dihasilkan."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "Miner mengirim hash ke pool dan tidak meneruskan lalu lintas orang lain."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "Miner ini open source dan image-nya mematok rilis upstream yang bertanda tangan."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Anda dapat menambang dengan alamat Monero publik tanpa mengungkapkan nama Anda."
  source: "752cbb728aac"
