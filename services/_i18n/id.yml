  text: "Hostname DDNS dengan port (mis. mynode.ddns.net:28967) -- jauh lebih baik daripada IP literal, yang membuat node terputus pada hari ISP Anda diam-diam mengganti IP. Port 28967 harus diteruskan (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Ruang disk maksimum yang dialokasikan (mis. 2TB). Gunakan hard disk (HDD), bukan SSD"
  source: "9cb4ccc405fd"
