  text: "IPRoyal Pawns telah menonaktifkan akun ini."
  source: "a3a68b67f1aa"
iproyal.docker.health_signals.1.means:
  text: "Pawns melihat perangkat aktif lain di alamat IP ini dan hanya membayar satu per IP, sehingga salinan ini berjalan tetapi tidak berbagi apa pun dan tidak menghasilkan apa pun. Hentikan aplikasi Pawns lain di IP ini, di mesin lain, PC, atau ponsel. Jika tidak ada, tunggu Pawns melepas perangkat lama, atau minta dukungan Pawns untuk melepaskannya."
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "Penghasilan bergantung pada lokasi dan penggunaan bandwidth. IP residensial AS/UE menghasilkan lebih banyak."
  source: "424261bf08d4"
iproyal.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "Minimum $5. Pilih negara Anda terlebih dahulu; metodenya bergantung pada negara. Dari Spanyol (Oktober 2026): PayPal 4% dengan biaya minimum $0.25, dibayar melalui Tremendous, yang mengirim tautan lewat email tempat Anda memasukkan nama dan alamat PayPal; USDT (BEP20, ERC20, TRC20) atau USDC (BEP20, ERC20) dengan biaya jaringan $1; Bitcoin dengan biaya minimum $2; kartu hadiah tanpa biaya. Pembayaran pertama memerlukan pemeriksaan SMS satu kali untuk nomor telepon Anda: Withdraw membukanya, dan nomor dimasukkan dengan kode negaranya. Setelah itu setiap pembayaran meminta kode yang dikirim ke email akun Anda dan ditinjau hingga 72 jam sebelum dikirim."
  source: "0430fae34eb5"
iproyal.payout.notes:
  text: "Saldo disimpan oleh IPRoyal Pawns; ditarik sesuai permintaan."
  source: "e11da90d5216"
iproyal.collector.credential_hint:
  text: "Gunakan email dan kata sandi akun IPRoyal Pawns Anda (sama dengan <a href='https://pawns.app' target='_blank'>pawns.app</a>)."
  source: "b9dcb3a01d17"
iproyal.referral.bonus.referrer:
  text: "$1 untuk masing-masing dari tiga pembayaran pertama mereka, hingga $3, jika masing-masing terjadi dalam jendela 1-3 minggunya"
  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "$1 untuk masing-masing dari tiga pembayaran pertama Anda, hingga $3; lewatkan jendela 1-3 minggu dan sisanya kedaluwarsa"
  source: "619d5960686c"
iproyal.rating.cons.0.text:
  text: "Ketentuan menyebutkan bahwa akun dapat diblokir tanpa pemberitahuan sebelumnya karena penyalahgunaan syarat penarikan atau akun ganda, dan penghasilannya mungkin tidak dibayarkan."
  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "Ketentuan menyebutkan bahwa Pawns tidak mengizinkan server, VPN, atau layanan proxy apa pun untuk berbagi lalu lintas, dan hanya satu perangkat per IP."
  source: "449c1cdf793f"
iproyal.rating.cons.2.text:
  text: "PayPal dikenai 4% (minimal $0.25) melalui Tremendous, dan setiap pembayaran ditinjau hingga 72 jam."
  source: "56449f2db6ce"
iproyal.rating.cons.3.text:
  text: "Pembayaran pertama memerlukan pemeriksaan SMS untuk nomor telepon Anda, dan setiap pembayaran memerlukan kode yang dikirim lewat email."
  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "Kebijakan privasi menyebutkan operatornya, Pawns.App Ltd (perusahaan 16043795 di Inggris dan Wales), yang menurut Companies House didirikan pada 28 Oktober 2024, kurang dari tiga tahun lalu."
  source: "a7fcb7aea980"
iproyal.rating.cons.5.text:
  text: "Ketentuan menyebutkan bahwa Pawns dan klien bisnisnya meneruskan lalu lintas melalui perangkat Anda, dan bahwa Anda tidak dapat mengetahui klien mana yang menggunakannya."
  source: "ca979ac10720"
iproyal.rating.pros.0.text:
  text: "Minimum $5, dengan kartu hadiah tanpa biaya."
  source: "0fa4f89bbd63"
