proxybase.description:
  text: "ProxyBase adalah platform berbagi bandwidth yang membayar pengguna dalam mata uang kripto karena berbagi koneksi internet yang tidak terpakai. Anda mengautentikasi klien peer dengan Access Token dari dasbor Anda. IP residensial menghasilkan paling banyak, tetapi IP pusat data juga didukung. Image Docker resmi multi-arsitektur (amd64/arm64/armv7).\n"
