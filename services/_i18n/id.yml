  text: "PassiveApp adalah platform DePIN yang memungkinkan Anda mendapatkan reward kripto dan PayPal dengan berbagi bandwidth dan sumber daya komputasi yang tidak terpakai. Dalam praktiknya hanya Windows: halaman unduhan vendor sendiri mencantumkan Android, iOS, dan Linux sebagai \"coming soon\" tanpa perubahan sejak setidaknya Februari 2025, dan tidak ada versi macOS — meskipun teks pemasaran di situs yang sama mengklaim dukungan yang lebih luas. Tidak ada image Docker.\n"
