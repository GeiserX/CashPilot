proxyrack.description:
  text: "Program Peer dari ProxyRack memungkinkan Anda menghasilkan dengan berbagi bandwidth sebagai bagian dari jaringan proxy mereka. Setiap perangkat memerlukan UUID heksadesimal 64 karakter yang unik dan, opsional, kunci API untuk mendaftarkan perangkat secara otomatis. Berfungsi di koneksi residensial maupun VPS/pusat data. Dasbor berada di balik Cloudflare, yang mungkin mengharuskan Anda mengambil kunci API secara manual lewat browser.\n"
  source: "16b74380bb2a"
proxyrack.short_description:
  text: "Berbagi bandwidth - UUID per perangkat, berfungsi di VPS"
  source: "7c899dc1ba2d"
proxyrack.docker.env.UUID.label:
  text: "UUID perangkat"
  source: "dff993a2511b"
proxyrack.docker.env.API_KEY.label:
  text: "Kunci API"
  source: "23189d55f697"
proxyrack.docker.env.DEVICE_NAME.label:
  text: "Nama perangkat"
  source: "155106be1173"
proxyrack.docker.env.UUID.description:
  text: "ID heksadesimal 64 karakter yang unik per perangkat. Buat dengan: cat /dev/urandom | tr -dc 'a-f0-9' | fold -w 64 | head -n 1"
  source: "5de5d7264318"
proxyrack.docker.env.API_KEY.description:
  text: "Masuk di <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → Kunci API ditampilkan di halaman utama dasbor (mendaftarkan perangkat secara otomatis jika diisi). Belum punya akun? Daftar dengan <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
  source: "96df71a6ca26"
proxyrack.docker.env.DEVICE_NAME.description:
  text: "Nama yang mudah dikenali untuk perangkat di dasbor"
  source: "df01af60b81c"
proxyrack.docker.health_signals.0.means:
  text: "Klien ProxyRack tidak dapat berjalan di salinan ini, jadi salinan ini tidak menghasilkan apa pun. Penyebab yang biasa adalah server pembaruan ProxyRack tidak merespons, dan klien tidak dapat dimulai tanpanya. Salinan ini mencoba lagi setiap 5 menit dan mulai dengan sendirinya begitu server merespons. Tidak ada yang perlu Anda perbaiki."
  source: "0df8b8cfac10"
proxyrack.docker.health_signals.1.means:
  text: "Klien ProxyRack tidak terunduh saat salinan ini dimulai, karena server pembaruan ProxyRack tidak dapat dijangkau, jadi salinan ini berjalan tetapi tidak menghasilkan apa pun. CashPilot memulai ulang salinan ini setiap 6 jam untuk mencoba lagi. Terapkan ulang salinan ini agar mendapat proses mulai milik CashPilot sendiri, yang menyimpan klien dan mencoba lagi dengan sendirinya setiap 5 menit."
  source: "0a2ee4b478b2"
proxyrack.device_link.steps:
  text: "Masuk ke ProxyRack, buka Devices, pilih Add device, dan tempel UUID ini. Sampai perangkat ada di akun Anda, perangkat itu tidak menghasilkan untuk siapa pun. Jika Anda memasukkan kunci API, kontainer mendaftarkan dirinya sendiri: periksa bahwa perangkat tercantum di sana."
  source: "54c4041903b5"
proxyrack.earnings.notes:
  text: "IP residensial menghasilkan lebih banyak daripada pusat data. Dasbor di balik Cloudflare dapat menyulitkan akses otomatis."
  source: "b6e36d751afd"
proxyrack.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
proxyrack.cashout.notes:
  text: "Ajukan pembayaran di dasbor. ProxyRack meninjaunya dalam 72 jam, lalu Tremendous mengirimi Anda reward lewat email untuk ditukarkan sebagai PayPal, kartu hadiah, atau transfer bank. Tidak ada pilihan kripto."
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "Saldo disimpan oleh ProxyRack; ditarik sesuai permintaan."
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "Masuk di <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, tekan F12 → Network, cari permintaan API mana pun dan salin nilai header <b>Api-Key</b>. Belum punya akun? Daftar dengan <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "Proxyrack mendokumentasikan batas 500 perangkat per AKUN dan tanpa batas per IP. IP pusat data diterima tetapi diklasifikasikan ulang ke tarif lebih rendah."
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "Pusat bantuan ProxyRack menyebutkan bahwa menghapus perangkat akan menghapus penghasilan perangkat itu dari akun Anda, dan penghasilan itu hanya kembali jika perangkat yang sama ditambahkan lagi."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack memublikasikan image Docker miliknya sendiri, proxyrack/pop, dan menerima IP pusat data dengan tarif lebih rendah."
  source: "278541f81053"
repocket.description:
  text: "Repocket memungkinkan Anda memperoleh penghasilan pasif dengan berbagi bandwidth internet yang tidak terpakai. IP residensial menghasilkan paling banyak; IP VPS/pusat data diterima dengan tarif lebih rendah. Maksimal 5 perangkat dan 5 sesi aktif per akun. Kontainer Docker mengautentikasi dengan email akun Anda dan kunci API dari dasbor Repocket (bukan kata sandi Anda).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Berbagi bandwidth - maks 5 perangkat, autentikasi kunci API"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "Kunci API (UUIDv4, bukan kata sandi)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "Email akun Repocket Anda"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Kunci API Repocket Anda — masuk di <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> dan salin kunci API yang ditampilkan di halaman bandwidth-earnings (ini BUKAN kata sandi akun Anda). Belum punya akun? Daftar dengan <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "IP residensial menghasilkan lebih banyak. IP VPS/pusat data diterima tetapi dengan tarif lebih rendah."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 setelah pembayaran pertama)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket menetapkan minimum per akun: $4 sebelum pembayaran pertama dan $2 setelahnya pada Oktober 2026, jauh di bawah $20 yang dulu diiklankan. Metode: Tremendous (ke email Anda) atau USDT di Polygon. Setiap permintaan dikonfirmasi dari tautan yang dikirim lewat email dalam 2 jam, dan hanya satu permintaan yang boleh menunggu dalam satu waktu. Pada Oktober 2026 Repocket menolak permintaan Tremendous dengan pesan \"Please, message support\", sementara USDT di Polygon berhasil."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Saldo disimpan oleh Repocket; ditarik sesuai permintaan."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Gunakan email dan kata sandi akun Repocket Anda (sama dengan <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Belum punya akun? Daftar dengan <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2 begitu orang yang diajak menghasilkan $7, lalu 5% dari penghasilan mereka seumur hidup"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "Bonus dompet $2 saat mendaftar"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket mendokumentasikan batas lima perangkat per AKUN tetapi tidak memublikasikan batas perangkat per IP. Angka '2 perangkat per IP' yang diulang di situs ulasan tidak bersumber dari penyedia, jadi CashPilot tidak menyatakannya."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Biarkan perangkat Repocket tetap berbagi, atau tarik saldo Anda"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Setelah 12 bulan tanpa login, pembayaran, atau berbagi bandwidth, Repocket dapat menghanguskan saldo yang belum dibayar."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Biarkan perangkat tetap berbagi, masuk ke akun, atau tarik dana. Jika Anda berhenti menggunakan Repocket, tarik dana terlebih dahulu."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Beberapa pengulas Trustpilot melaporkan pembayaran yang dibatalkan dan saldo yang direset ke nol; seorang di antaranya mengatakan dukungan menyebut penghasilan bandwidth yang tidak wajar. Halaman tersebut memberi Repocket nilai 2.7 dan mencatat bahwa Repocket belum membalas ulasan negatif."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Pengulas melaporkan penarikan yang ditolak dan harus mengejar pembayaran."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Kebijakan pembayaran Repocket mengizinkannya membatalkan, menarik kembali, atau menghanguskan penghasilan secara permanen kapan pun ia mencurigai penghasilan itu tidak sah, serta menghanguskan penghasilan belum dibayar dari akun yang tidak aktif."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "Kebijakan yang sama mengizinkan Repocket menambah, menghapus, atau mengganti metode pembayaran kapan saja tanpa pemberitahuan; PayPal sudah dihapus."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Ketentuan menyebutkan bahwa Repocket dapat meminta verifikasi identitas atau akun kapan saja, dan kelayakan pembayaran bergantung padanya."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Ketentuan menyebutkan bahwa Repocket dan mitranya menggunakan kapasitas jaringan, tetapi tidak menyebutkan siapa mitranya atau bagaimana mereka diperiksa."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot mencatat Repocket belum membalas ulasan negatif, dan pengulas mengatakan pesan mereka diabaikan."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "Ketentuan saat ini menyebutkan Repocket Pte. Ltd. di Singapura; ketentuan lama tidak menyebutkan perusahaan apa pun."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket memublikasikan image Docker miliknya sendiri, repocket/repocket, dan ketentuannya mengizinkan kontainer milik Anda."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Minimumnya rendah: $4 sebelum pembayaran pertama dan $2 setelahnya."
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io memungkinkan Anda berbagi GPU untuk beban kerja AI terdistribusi dan mendapatkan saldo Salad yang dapat ditukar dengan kartu hadiah, game, atau uang tunai. Hanya Windows dengan aplikasi desktop native. Memerlukan GPU khusus (NVIDIA atau AMD). Platform ini meneruskan inferensi AI, rendering, dan tugas komputasi lainnya ke mesin Anda saat sedang menganggur. Salah satu platform berbagi GPU yang lebih ramah pengguna.\n"
  source: "09335baccea6"
salad.short_description:
  text: "Berbagi GPU untuk AI - hanya Windows, pembayaran kartu hadiah atau tunai"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Penghasilan bergantung pada model GPU dan ketersediaan pekerjaan. RTX 3060 ~$1-3/hari. Hanya Windows. Aplikasi native, tidak mendukung Docker. Dapat ditukar dengan kartu hadiah, game, atau PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal atau kartu hadiah melalui toko Salad."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Hanya PayPal dan kartu hadiah, tidak pernah kripto. Tidak ada alamat dompet, sehingga CashPilot tidak punya saldo on-chain untuk ditampilkan."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Masuk di <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, tekan F12 → Application → Cookies, salin nilai cookie <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Kumpulkan beberapa Salad Reward Points, atau belanjakan saldo Anda"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Jika sebuah akun tidak mendapatkan Reward Points selama 12 bulan berturut-turut, saldo yang belum ditukarkan dapat kedaluwarsa."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Jalankan aplikasi Salad sampai menghasilkan, atau belanjakan seluruh saldo di Salad Storefront. Membelanjakan sebagian saja tidak mengatur ulang hitungan 12 bulan."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot tidak menjalankan Salad: Anda menggunakan aplikasi desktop milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Beberapa pengulas Trustpilot pada Oktober dan November 2026 melaporkan penarikan PayPal tiba dengan cepat, sebagian lebih dari sekali; seorang pengulas pada periode yang sama mengatakan beberapa kali percobaan penarikan gagal."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel adalah blockchain Layer 1 Cosmos untuk VPN terdesentralisasi. Operator node menjual bandwidth kepada pengguna VPN dengan harga fleksibel (per GB atau per jam). Tersedia panduan penerapan Docker resmi. Proyek lama dengan komunitas yang aktif.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "VPN terdesentralisasi di Cosmos - operator node menjual bandwidth"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Operator menetapkan harga sendiri per GB atau per jam. Penghasilan bergantung pada permintaan pengguna VPN di wilayah Anda."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Per sesi"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Pembayaran dalam token P2P, dan 20% dari setiap pembayaran bandwidth masuk ke staker, bukan ke host node."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "Token ini berganti nama dari SENT menjadi DVPN pada 2021 dan dari DVPN menjadi P2P pada 2025."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot tidak menjalankan Sentinel: Anda menggunakan perangkat lunak node milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel memublikasikan kode sumber node-nya di bawah lisensi open source miliknya sendiri."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia adalah marketplace penyimpanan terdesentralisasi yang dikelola Sia Foundation (organisasi nirlaba Swiss) dan beroperasi sejak 2015. Jalankan node hostd resmi dari Foundation untuk menyewakan ruang disk cadangan dan mendapatkan Siacoin dari kontrak penyimpanan dan bandwidth. Anda harus membeli sejumlah Siacoin sebelum node dapat menghasilkan: host mengunci jaminan untuk setiap kontrak dan membayar biaya untuk setiap bukti penyimpanan. Jaminan dikembalikan saat kontrak selesai dan dibakar jika node offline atau kehilangan data, jadi diperlukan mesin yang selalu menyala (Sia menyebut waktu aktif minimal 95%). Penghasilan bergantung pada berapa banyak data yang benar-benar disimpan penyewa; Sia menyarankan harga penyimpanan $1 per TB per bulan, jadi layanan ini cocok untuk mesin dengan disk cadangan besar, bukan VPS kecil.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Node penyimpanan Sia Foundation - image Docker resmi, dapatkan Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Frasa pemulihan dompet"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Kata sandi dasbor"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Direktori penyimpanan"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "Frasa pemulihan BIP-39 yang mengendalikan dompet Siacoin host. Buat dengan `docker run --rm ghcr.io/siafoundation/hostd seed` dan cadangkan -- ini SATU-SATUNYA cara untuk menjangkau penghasilan"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Kata sandi untuk UI web hostd dan API lokal (BasicAuth). Frasa sandi panjang apa saja"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Path host di disk terbesar Anda tempat data penyewa disimpan (mis. /srv/sia). Memerlukan ruang kosong minimal 256GB"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Saat penerapan, CashPilot membuat dompet baru di mesin yang menjalankan node dan menampilkan frasa pemulihannya satu kali: catatlah. Untuk menggunakan dompet yang sudah Anda miliki, tempel frasa pemulihannya sebagai gantinya. Setelah penerapan, kirim sejumlah Siacoin ke dompet node untuk jaminan dan biaya, lalu tambahkan folder penyimpanan (/storage), atur harga, dan umumkan host di dasbor.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "Frasa pemulihan dompet (hostd.yml), database dompet, pengaturan host, dan state kontrak. Kehilangan ini berarti kehilangan identitas node dan pencatatan pendapatan kontrak; frasa pemulihan yang Anda catat lalu menjadi satu-satunya jalan untuk memulihkan dana."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Data penyewa yang disimpan. Kehilangan data ini membuat bukti penyimpanan gagal dan menghanguskan jaminan yang dikunci untuk kontrak tersebut."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Host menetapkan harga sendiri. Sia menyarankan $1 per TB yang disimpan per bulan dan lebih dari $5 per TB yang diunduh, dan 3.9% dari setiap pembayaran kontrak masuk ke pemegang Siafund. Pendapatan meningkat seiring banyaknya data penyewa yang masuk ke node, yang dimulai dari nol dan tumbuh seiring waktu aktif dan harga. Jaminan (Sia menyarankan 2x harga penyimpanan) dikunci per kontrak dan dikembalikan saat kontrak selesai dengan sukses.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Penghasilan terkumpul di dompet Siacoin milik host sendiri (dikendalikan frasa pemulihan). Konversikan SC di exchange dan tarik ke bank/kartu dari sana; tidak ada permintaan pembayaran di sisi penyedia.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Dana berada di dompet Sia yang dikendalikan frasa pemulihan di dalam node. Frasa pemulihan hanya ada di volume data hostd di mesin yang menjalankannya; CashPilot tidak pernah menyimpannya. Frasa yang Anda catat saat dompet dibuat adalah satu-satunya jalan pemulihan.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Alamat publik yang stabil dengan port 9981 (TCP, konsensus) dan 9984 (TCP dan UDP, kontrak penyewa) diteruskan. Hosting di pusat data/VPS umum di Sia. Dompet memerlukan Siacoin sebelum node dapat menerima kontrak."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Ruang disk dan bandwidth untuk melayaninya."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Tidak. Penyewa menyimpan fragmen file terenkripsi di disk Anda dan mengambilnya kembali. Orang lain tidak meneruskan lalu lintas sembarang melalui IP Anda."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Alamat dompet Sia Anda, kunci publik host, dan IP:port publik yang diumumkan node agar penyewa dapat menjangkaunya."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Lalu lintas unggah/unduh yang terus-menerus di jaringan, mirip dengan menjalankan server penyimpanan apa pun; tidak ada lalu lintas web pihak ketiga yang dianonimkan yang dikaitkan dengan Anda."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Tanpa izin: tanpa pendaftaran atau akun. Jaminan dibakar jika node melewatkan bukti penyimpanan, karena offline atau kehilangan data."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Penghasilan berupa Siacoin di dompet Anda sendiri: tidak ada pembayaran ke bank, jadi Anda menjualnya sendiri di exchange."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "Jaminan dikunci per kontrak dan dibakar jika host melewatkan bukti penyimpanan karena offline atau kehilangan data."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Hanya sekitar 30% dari penyimpanan yang ditawarkan di jaringan yang terpakai, sehingga host baru bersaing untuk permintaan yang sedikit."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Penyewa menyimpan fragmen file terenkripsi dan tidak ada yang meneruskan lalu lintas melalui IP Anda, tetapi kami tidak menemukan di mana Sia menyebutkan siapa penyewanya atau bagaimana mereka diperiksa."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd dikembangkan secara terbuka oleh Sia Foundation sejak 2022."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd bersifat open source di bawah lisensi MIT."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Sia Foundation memublikasikan hostd sebagai image kontainer."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Tanpa izin: tanpa pendaftaran atau akun."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide adalah layanan berbagi bandwidth yang memungkinkan Anda memonetisasi bandwidth internet yang tidak terpakai. Menggunakan machine ID opsional untuk pelacakan perangkat. Tersedia melalui image Docker komunitas dari proyek income-generator.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Berbagi bandwidth - berbasis machine ID"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "Machine ID"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "Machine ID untuk perangkat yang sudah terdaftar (dibuat otomatis jika kosong)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Informasi yang tersedia terbatas. Penghasilan bergantung pada lokasi."
