  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "Reward pemasok dibayar dari emisi token terlepas dari ada tidaknya pekerjaan berbayar, dan pemilik GPU melaporkan kartu mereka menganggur hampir sepanjang waktu."
