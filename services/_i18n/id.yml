proxylite.docker.env.USER_ID.description:
  text: "Masuk di <a href=\"https://lk.proxylite.ru\">lk.proxylite.ru</a> → User ID Anda ditampilkan di halaman utama dasbor di samping email Anda. Belum punya akun? Daftar dengan <a href=\"https://proxylite.ru/?r=KMUPRZIZ\">proxylite.ru/?r=KMUPRZIZ</a>"
