proxybase.docker.health_signals.0.means:
  text: "ProxyBase tidak dapat menjangkau relay-nya selama setidaknya setengah jam, sehingga tidak menghasilkan apa pun. Restart akan mengatasinya; jika tetap ada setelah restart, periksa apakah mesin ini dapat menjangkau internet."
