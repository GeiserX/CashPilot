  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "Memerlukan GPU NVIDIA dengan VRAM 8GB+. Klaim untuk RTX 4090 sebesar $500-1000/bulan (kemungkinan lebih rendah dalam praktiknya)."
