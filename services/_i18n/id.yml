  source: "be820103712e"
honeygain.cashout.notes:
  text: "Minimum $20 (20.000 kredit). Dua pilihan: PayPal melalui Tipalti, dengan biaya sekitar 15%, atau kredit JumpTask tanpa biaya, dibayarkan ke dompet JumpTask. Permintaan memerlukan kode 6 digit yang dikirim lewat email. Pembayaran PayPal pertama tetap berstatus \"waiting for details\" sampai Anda mendaftar di Tipalti dari tautan yang mereka kirim lewat email. Tautan itu hanya berfungsi sekali, jadi buka saat Anda bisa menyelesaikannya dalam satu kali duduk dan ponsel ada di dekat Anda: setelah membuat kata sandi, Tipalti meminta Anda mengonfirmasi nomor ponsel lewat SMS (kodenya kedaluwarsa dalam beberapa menit), lalu meminta nama, alamat, negara, dan tanggal lahir, serta alamat PayPal Anda. Tipalti mengenakan $2.02 per pembayaran; pilih USD untuk menghindari biaya konversi mata uang 1.9-3%. Pembayaran menyusul dalam 2 hari kerja. Saldo keluar dari akun Anda segera setelah Anda mengajukan permintaan, bahkan saat pembayaran masih menunggu Tipalti. Setiap login Tipalti berikutnya mengirim kode SMS baru kecuali Anda mencentang opsi untuk mengingat perangkat selama 30 hari. Pada Oktober 2026 Tipalti tidak meminta formulir pajak dari penerima di Spanyol."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Saldo disimpan oleh Honeygain; ditarik sesuai permintaan."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
