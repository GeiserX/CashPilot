  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "Ketentuan mengizinkan Honeygain menghapus penghasilan yang mencapai ambang $20 dan tidak dibayarkan dalam 24 bulan, serta menganggap penghasilan kedaluwarsa setelah enam bulan tidak digunakan."
