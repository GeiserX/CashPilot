  source: "be820103712e"
proxybase.cashout.notes:
  text: "Situs mencantumkan minimum $0.20, dan permintaan di bawah $1 berhasil pada Oktober 2026. Permintaan selalu menarik seluruh saldo, sebagai USDC di Polygon, POL, atau Litecoin, ke alamat yang Anda ketik. ProxyBase menanggung biaya jaringan."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "Penghasilan terkumpul di AKUN ProxyBase pemilik Access Token, dan ditarik dari dasbor sesuai permintaan. Klien peer tidak menyimpan dompet dan kontainer tidak menyimpan state -- docker.volumes kosong. Jangan tertukar dengan proxybase-xyz (ProxyBase Markets, organisasi yang sama), yang memang membuat dompet lokal dan menyatakannya sebagai volume penting."
  source: "3b630846bb51"
