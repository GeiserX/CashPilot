  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets adalah marketplace proxy SOCKS5 yang dibuat untuk agen AI. Penjual menjalankan daemon CLI Rust ringan yang terhubung melalui WebSocket untuk meneruskan lalu lintas pembeli melalui koneksi internet mereka, dan mendapatkan USDC di Tempo Chain per GB yang terjual. Mendukung mode direct (bandwidth sendiri) dan upstream (menjual ulang proxy eksternal) dengan sambung ulang otomatis. Pembeli membeli sesi proxy berdasarkan negara, ISP, dan bandwidth. Pembayaran mengalir melalui Machine Payments Protocol (MPP) di Tempo Chain. Tautan referal ditujukan untuk pembeli: pembeli yang membuka konsol melalui tautan itu mendapat tambahan 10% pada setoran pertamanya.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - marketplace SOCKS5 untuk agen AI, pembayaran USDC. Membuat dompet yang volumenya menyimpan satu-satunya salinan kunci"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "URL API backend"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "Mengganti URL API backend (default https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "Kontainer melakukan bootstrap otomatis saat pertama kali dijalankan: membuat dompet secp256k1 (BIP-39), mengautentikasi melalui challenge-response ECDSA, dan mulai menjual bandwidth dalam mode direct-only. Semua state (dompet, token sesi, konfigurasi penjual) disimpan di volume <code>proxybase-data</code>. Periksa log kontainer saat pertama kali dijalankan untuk melihat alamat dompet. Gunakan <code>--upstream</code> untuk menambahkan jalur penjualan ulang proxy eksternal.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "File kunci dompet yang dibuat. Volume ini ADALAH uangnya: tidak ada salinan di sisi server, jadi menghapusnya berarti memusnahkan dananya juga."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Penghasilan berdasarkan GB yang terjual dengan harga pasar. IP VPS/pusat data menghasilkan lebih sedikit daripada residensial. Mode multi-upstream dapat menggabungkan bandwidth Anda sendiri dengan proxy eksternal."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Kunci penghasilan melalui <code>proxybase-cli seller payout create</code>, diterima sebagai USDC di Tempo Chain (Tempo MPP). Membayar ke alamat EVM mana pun yang kuncinya Anda pegang (Tempo adalah jaringan EVM), tanpa perlu menandatangani apa pun; tambahkan jaringan Tempo ke dompet untuk melihat USDC-nya. Dompet yang masih tidak menampilkannya perlu menambahkan token Tempo USDC secara manual: impor berdasarkan alamat kontrak yang diberikan Proxybase, dan periksa alamat itu sebelum Anda memercayai saldonya."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "Klien membuat dompetnya sendiri saat pertama kali dijalankan."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "15% dari setiap setoran pembeli yang diajak, sebagai kredit untuk sesi proxy Anda sendiri"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "+10% pada setoran pertama pembeli"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "Bandwidth, sebagai proxy SOCKS5 yang dijual kepada pembeli di marketplace ProxyBase."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Ya. Pembeli meneruskan lalu lintas mereka melalui koneksi Anda — itulah tepatnya yang dijual."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Alamat dompet yang dibuat di mesin Anda, ditambah volume lalu lintas yang Anda teruskan."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Nyata, dan berlaku langsung untuk koneksi rumahan. Lalu lintas proxy dari pembeli yang tidak dikenal keluar dengan IP Anda, sehingga keluhan penyalahgunaan sampai ke Anda. Tidak ada apa pun di katalog ini yang membatasi layanan ke alamat pusat data, dan IP residensial menghasilkan lebih banyak, jadi insentifnya justru mengarah ke arah yang salah: baca ketentuan ISP Anda sebelum menjalankannya di rumah."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "tidak diketahui - penyedia tidak memublikasikan batas perangkat per akun atau per IP, dan katalog juga tidak mencantumkannya."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "Pembayaran berupa USDC di Tempo Chain, ke alamat EVM mana pun yang kuncinya Anda pegang."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "Koneksi Anda dijual sebagai proxy SOCKS5 kepada pembeli marketplace; kami tidak menemukan penjelasan tentang bagaimana pembeli diperiksa."
  source: "2dec55ca610f"
proxybase-xyz.rating.pros.0.text:
  text: "Judul halaman penghasilannya sendiri menyatakan tidak perlu KYC, dengan pembayaran $1."
  source: "25b6dc3b4608"
proxybase-xyz.rating.pros.1.text:
