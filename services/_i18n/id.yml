  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Pelanggan menyimpan fragmen file terenkripsi dan tidak ada yang meneruskan lalu lintas melalui IP Anda, tetapi kami tidak menemukan di mana Storj menyebutkan siapa pelanggannya atau bagaimana mereka diperiksa."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
