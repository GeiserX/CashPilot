ocean.description:
  text: "OCEAN adalah pool penambangan Bitcoin tanpa akun: miner Anda masuk dengan alamat Bitcoin Anda sebagai nama pengguna, dan pool membayar ke alamat itu. CashPilot tidak menjalankan miner di sini. CashPilot membaca saldo belum dibayar yang disimpan OCEAN untuk alamat Anda, sehingga Anda melihat apa yang dihasilkan ASIC Anda (Bitaxe, Antminer) di samping penghasilan Anda yang lain. Saldo belum dibayar sudah diperoleh tetapi belum diterima: OCEAN membayarnya on-chain begitu melewati ambang pembayaran.\n"
  source: "5d25f28a3de5"
