  text: "Tidak. KRig mengirim hasil kerja penambangan ke Kryptex Pool."
  source: "c5718af09746"
kryptex-pearl.disclosure.data_collected:
  text: "Kryptex melihat email akun, nama worker, hashrate, dan alamat IP Anda."
  source: "0a932e1163a6"
kryptex-pearl.disclosure.isp_risk:
  text: "Beberapa jaringan dan resolver DNS memblokir koneksi ke pool penambangan."
  source: "6e2ea365730d"
kryptex-pearl.disclosure.account_rules:
  text: "Verifikasi email akun Kryptex Anda sebelum menambang ke akun tersebut."
  source: "1990183a5b00"
kryptex-pearl.rating.cons.0.text:
  text: "Kryptex dapat menangguhkan akun yang tidak aktif setelah enam bulan dan menghapusnya setelah satu tahun."
  source: "1a40d04b07ad"
kryptex-pearl.rating.cons.1.text:
  text: "Minimum dan biaya penarikan bervariasi menurut metode."
  source: "05d8f85527c7"
kryptex-pearl.rating.pros.0.text:
  text: "Lisensi KRig mengizinkan mengunduh rilisnya dan menjalankannya dari perangkat lunak penambangan."
  source: "c710f405be6f"
kryptex-pearl.rating.pros.1.text:
  text: "KRig menggunakan endpoint TLS yang dipublikasikan untuk mengirim share Pearl ke Kryptex Pool."
  source: "fd21819f191a"
mysterium.description:
  text: "MystNodes (Mysterium Network) adalah jaringan VPN dan proxy terdesentralisasi yang dibangun dengan teknologi blockchain. Anda mendapatkan token MYST dengan menjalankan node yang menyediakan layanan VPN, proxy, dan pengambilan data (scraping) kepada pengguna. Memerlukan capability NET_ADMIN, SETUID, dan SETGID serta perangkat TUN, yang digunakannya di dalam namespace jaringannya sendiri di bridge aplikasi penghasil yang dipagari. Dilengkapi UI web bawaan untuk mengelola node. Berfungsi di koneksi residensial maupun VPS, tetapi bonus referal hanya dibayar untuk node di IP residensial.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Node VPN terdesentralisasi - berbasis blockchain, berfungsi di VPS"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "Alamat WebUI"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "Rentang port UDP"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "Alamat host tempat WebUI node (port 4449) dipublikasikan. 127.0.0.1 membuatnya hanya bisa diakses di mesin ini. Untuk mengaksesnya melalui reverse proxy, tambahkan alamat yang dihubungi proxy, dipisahkan koma tanpa spasi: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "Port UDP yang digunakan node untuk sesi VPN, dalam format start:end. Teruskan rentang yang sama ini di router Anda. Setiap sesi memakai sekitar dua port, jadi 30 port default menampung sekitar 15 sesi sekaligus, lebih dari yang didapat node rumahan. Rentang yang lebih lebar tidak memperbaiki apa pun dan lebih mahal: setiap port yang dipublikasikan memperlambat start dan penghapusan node (300 port butuh sekitar 12 detik untuk start), CashPilot menerima paling banyak 300, dan dengan userland proxy default Docker setiap port juga memakan sekitar 2.5 MB memori. Jika semua sesi gagal, masalahnya ada di router, bukan karena port terlalu sedikit: lihat \"Routers that rewrite UDP source ports\" di panduan Mysterium. Jaga di bawah 32768: port 32768-60999 adalah rentang ephemeral Linux, tempat program apa pun di host bisa memakainya sesaat, dan satu port yang terpakai membuat start node gagal. Node yang sudah memiliki rentang tetap mempertahankannya."
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "Keystore identitas node. Menghapusnya akan membuat identitas yang benar-benar baru: node kehilangan reputasinya dan semua penghasilan yang masih tertahan pada identitas lama."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "Node tidak dapat menjalankan sudo di dalam kontainernya, sehingga tidak dapat mengonfigurasi antarmuka VPN atau firewall-nya dan setiap sesi gagal saat penyiapan: node terlihat online tetapi tidak menghasilkan apa pun. Kontainer dibuat tanpa capability SETUID dan SETGID. Perbarui CashPilot dan worker yang menjalankan node ini, lalu terapkan ulang Mysterium dari dasbor; identitas node tersimpan di volume datanya dan tetap dipertahankan."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "Tidak ada sesi VPN dalam 6 jam terakhir yang menjangkau node ini secara langsung. Semuanya beralih ke hole punching, dan banyak pembeli gagal terhubung dengan cara itu, sehingga node menghasilkan lebih sedikit. Port UDP-nya tidak dapat dijangkau dari internet. Di router Anda, teruskan rentang port UDP ${UDP_PORTS} (start:end, rentang yang sama di kedua sisi) ke ${HOST_ADDRESS}. Peringatan ini hilang dengan sendirinya begitu ada sesi yang terhubung langsung."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Pemantauan Mysterium menandai node di ${WORKER_NAME} sebagai gagal, sehingga node tidak masuk daftar node yang dipilih sebagian besar pembeli, bahkan saat pemeriksaan node itu sendiri menyatakan semua port dapat dijangkau. Pertama, pastikan node memiliki /dev/net/tun dan SETUID/SETGID, karena tanpa itu node gagal dengan cara yang sama: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Jika itu sudah ada, penyebab umumnya adalah router di depan ${WORKER_NAME} yang menulis ulang port sumber UDP dari jawaban node begitu paket dari luar mencapai port tersebut. Lihat pengujiannya di panduan: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "Lima sesi VPN terakhir dari node di ${WORKER_NAME} masing-masing berakhir setelah sekitar satu menit tanpa memindahkan data, sehingga node tidak menghasilkan apa pun meskipun terlihat online. Kemungkinan penyebabnya adalah router di depan ${WORKER_NAME}: begitu paket dari luar mencapai sebuah port, router menulis ulang port sumber dari jawaban node berikutnya dari port itu, dan setiap sesi dimulai dengan paket seperti itu (pemeriksaan port oleh node itu sendiri), sehingga pembeli membuang jawaban node. Rentang port yang lebih lebar tidak membantu. Lihat pengujian dan perbaikannya di panduan: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Peringatan ini hilang begitu ada sesi yang membawa data."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Penghasilan dalam token MYST. IP residensial menghasilkan jauh lebih banyak. WebUI node di port 4449 untuk pengelolaan, secara default hanya dipublikasikan di mesin tempat node berjalan (127.0.0.1); dari mesin lain, buka terowongan SSH terlebih dahulu (ssh -L 14449:127.0.0.1:4449 diikuti alamat mesin node, lalu buka http://127.0.0.1:14449; port lokal 14449 agar tidak bentrok dengan node di mesin Anda sendiri), atau tambahkan alamat ke UI_ADDRESS (lihat WebUI address di panduan Mysterium). VPS diterima. Penerusan port UDP 23000-23029 (default UDP_PORTS) sangat dianjurkan -- tanpanya, node mendapat status Strict NAT dan banyak sesi VPN gagal, sehingga pendapatan sangat berkurang. Penting: setelah pertama kali dijalankan, atur dompet penerima (settlement) melalui WebUI node atau CLI agar sesuai dengan akun mystnodes.com Anda -- ini menautkan penghasilan on-chain ke dasbor cloud Anda."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Settlement on-chain otomatis setiap kali node menyimpan 5 MYST yang belum di-settle"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Tidak ada tombol yang perlu ditekan. Setiap node melakukan settlement di Polygon dengan sendirinya begitu menyimpan 5 MYST yang belum di-settle, dan sekitar 21% habis untuk biaya (biaya Hermes 20% ditambah biaya transaksi kecil), jadi kira-kira 3.9 MYST sampai ke dompet penerima per settlement. TequilAPI setiap node mencantumkan settlement-nya di /transactor/settle/history. Angka \"total earnings\" di MystNodes hanya mencakup 30 hari terakhir; itu bukan saldo dan bukan total seumur hidup. Bonus MYST dari program reward MystNodes tidak di-settle dengan sendirinya: klaim di halaman Rewards, dalam 30 hari setelah distribusi menurut pusat bantuan MystNodes."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "Dompet penerima diatur SETELAH penerapan, melalui TequilAPI atau WebUI node -- bukan lewat variabel lingkungan, sehingga tidak dapat dibaca dari spesifikasi kontainer."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Gunakan email dan kata sandi akun MystNodes Anda (sama dengan <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST per teman yang node-nya menghasilkan 5 MYST (hanya IP residensial)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST begitu node Anda menghasilkan 5 MYST pertamanya (IP residensial, node diklaim di mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Klaim reward MystNodes bulan lalu"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Reward yang tidak diklaim dalam 30 hari setelah distribusi bulanan hangus dan kembali ke pool bulan berikutnya."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Buka halaman Rewards dan tukar poin Anda dengan MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Bandwidth. Koneksi Anda digunakan sebagai exit node untuk jaringan Mysterium, yang menjual layanan VPN, proxy, DAN pengambilan data (scraping). Lalu lintas scraping yang keluar dari IP residensial adalah penggunaan yang paling mungkin mengundang keluhan, dan Anda tidak dapat memilih mana dari ketiganya yang dibawa node Anda."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Ya. Orang asing meneruskan lalu lintas mereka melalui alamat IP Anda — itulah produknya."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "Identitas node (alamat blockchain), IP Anda, dan perkiraan lokasi (negara/kota/ISP), yang dipublikasikan node ke jaringan agar pembeli dapat memilihnya."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Nyata dan perlu dipahami. Lalu lintas dari orang lain keluar dari koneksi Anda dan dikaitkan dengan Anda, sehingga apa pun yang mereka lakukan tampak berasal dari jaringan Anda. Banyak kontrak ISP rumahan melarang hal ini. Periksa kontrak Anda sebelum menjalankannya."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Perangkat tak terbatas per akun dan per IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Sekitar 21% dari setiap settlement habis untuk biaya, yaitu biaya Hermes 20% ditambah biaya transaksi, dan penghasilan dibayar dalam token MYST."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Node Anda menjadi exit untuk pelanggan VPN, proxy, dan pengambilan data Mysterium, dan Anda tidak dapat memilih lalu lintas siapa yang dibawanya."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "Perangkat lunak node bersifat open source di bawah GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium memublikasikan image Docker miliknya sendiri, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "Settlement masuk ke dompet milik Anda sendiri; tidak perlu nomor telepon atau identitas."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "Proyek node ini sudah berjalan sejak 2017."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Situs Mysterium menyebutkan bahwa jaringan ini dikembangkan oleh Blockdev AG, Zug, Swiss."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay adalah jaringan DePIN yang memberi reward kepada pengguna karena berbagi bandwidth melalui ekstensi browser. Platform ini berada di balik perlindungan Cloudflare, yang dapat menyulitkan akses otomatis. Pengguna mendapatkan Nodepay Points dengan menjaga ekstensi tetap aktif. Jaringan ini berfokus pada penyediaan infrastruktur data pelatihan AI.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "Berbagi bandwidth DePIN untuk AI - ekstensi browser"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Mendapatkan Nodepay Points; poin pengguna yang lolos pemeriksaan kelayakan Nodepay dikonversi menjadi token NC. Perlindungan Cloudflare dapat memblokir pengumpulan otomatis. Memerlukan ekstensi browser."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Airdrop token NC (waktu belum dikonfirmasi)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Sistem berbasis poin. Poin pengguna yang lolos pemeriksaan kelayakan Nodepay dikonversi menjadi token NC, yang diluncurkan pada Januari 2025."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "Dalam tinjauan musim pertamanya, Nodepay menghapus lebih dari 300.000 akun yang dianggapnya bot dan membatalkan 17 miliar poin."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Reward berupa poin yang dikonversi menjadi token NC, sehingga nilainya bergantung pada token tersebut."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot tidak menjalankan Nodepay: Anda menggunakan ekstensi browser milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes adalah tingkat awal gratis dari Noderr Protocol, proyek DeFi di Base L2. Micronode adalah agen kecil di ponsel Android cadangan, PC Windows, Mac, atau browser Chromium. Di Android, ia membagikan koneksi seluler ponsel: lalu lintas Noderr lain keluar melalui IP operator seluler ponsel, sehingga memerlukan SIM dengan data seluler. Di PC atau browser, ia menjalankan tugas otomatisasi untuk protokol dengan daya komputasi cadangan. Reward dirancang untuk dibayar dalam NODR, disesuaikan dengan skor waktu aktif dan keandalan on-chain, tetapi selama beta jaringan berada di testnet Base Sepolia: reward node belum didanai dan belum ada yang dibayarkan.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Micronode gratis (berbagi koneksi Android, Windows, Mac, browser) - testnet, reward belum didanai"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Beta testnet: reward node belum didanai dan belum ada yang dibayarkan. APY 5-10% di situs adalah target rancangan. Tinjau lagi saat jaringan keluar dari Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Sesuai permintaan"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Reward terkumpul di dompet node itu sendiri dan diklaim dari aplikasi atau dApp. Selama beta, reward berupa token testnet Base Sepolia tanpa nilai pasar."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "Aplikasi membuat dompet node saat pertama kali dijalankan dan mencetak Utility NFT soulbound gratis ke dompet itu. Cadangkan dompet dari aplikasi: kehilangan perangkat berarti kehilangan identitas node. Selama beta, reward berada di Base Sepolia (testnet)."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android memerlukan SIM dengan data seluler; klien desktop dan browser tidak memublikasikan persyaratan IP."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Bergantung pada perangkat. Ponsel Android menjual koneksi selulernya: lalu lintas Noderr lain keluar melalui alamat IP operator seluler ponsel dan memotong kuota paket datanya. PC Windows, Mac, atau browser menjual daya komputasi cadangan untuk apa yang disebut penyedia sebagai tugas otomatisasi media sosial dan konten."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Ya. Di Android, lalu lintas Noderr lain keluar melalui alamat IP seluler ponsel Anda; aplikasi meminta persetujuan yang direkam sebelum mulai, dan Anda dapat berhenti berbagi dari layar yang sama. Untuk klien Windows, Mac, dan browser, penyedia menjelaskan tugas otomatisasi dan tidak menyebutkan apakah tugas itu membawa lalu lintas orang lain."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "Alamat dompet node beserta angka waktu aktif dan penyelesaian tugasnya dicatat on-chain sebagai skor reputasi (TrustFingerprint). Penyedia menyatakan bahwa tugas dianonimkan, dijalankan di sandbox, dan kunci dompet tidak pernah meninggalkan perangkat. Tidak ada yang lebih spesifik yang dipublikasikan."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Di Android, koneksi yang dibagikan adalah paket seluler operator: dokumen penyedia sendiri memperingatkan bahwa berbagi mungkin tidak diizinkan oleh kebijakan penggunaan wajar sebagian operator, dan lalu lintas yang dibagikan memakai kuota paket. Untuk klien desktop dan browser, penyedia tidak menyebut apa pun tentang ketentuan ISP."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Satu node per perangkat, masing-masing dengan Utility NFT soulbound sendiri; menjalankan beberapa perangkat diizinkan dan dianjurkan. Tidak ada batas per IP yang dipublikasikan. Tidak ada akun dalam arti biasa: identitasnya adalah dompet yang dibuat aplikasi saat pertama kali dijalankan."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Reward node berupa token testnet yang belum didanai tanpa nilai pasar, dan belum ada yang dibayarkan; APY 5 hingga 10% di situsnya adalah target rancangan."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Untuk klien desktop dan browser, Noderr menjelaskan tugas otomatisasi dan tidak menyebutkan apakah tugas itu membawa lalu lintas orang lain."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Penyedia menyatakan bahwa tugas dianonimkan dan dijalankan di sandbox, tetapi tidak memublikasikan hal yang lebih spesifik."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Masih beta testnet di Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot tidak menjalankan Noderr: Anda menggunakan aplikasi atau ekstensi milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Tanpa akun: aplikasi membuat dompet saat pertama kali dijalankan."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle menggunakan Bluetooth smartphone untuk membangun infrastruktur IoT. Aplikasi secara pasif mendeteksi dan meneruskan data dari perangkat IoT di sekitar, sehingga mendapatkan token NODL. Pernah diliput Forbes, memiliki kemitraan perusahaan dengan Vivendi dan Hayden AI. Hanya seluler (iOS dan Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Relay IoT Bluetooth - aplikasi seluler, reward token NODL"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Penghasilan sangat rendah. Aplikasi ponsel latar belakang yang menggunakan Bluetooth. Koneksi dompet mungkin tidak stabil."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Berkelanjutan"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL berada di dompet aplikasi itu sendiri di ZKsync Era; periksa di aplikasi atau di block explorer ZKsync Era. Nodle meninggalkan parachain Polkadot-nya, dan jembatan Polkadot-ke-ZKsync ditutup pada 31 Desember 2025, sehingga NODL yang masih berada di sisi Polkadot tidak dapat lagi dipindahkan ke ZKsync."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "NODL Anda berada di dompet milik aplikasi Nodle sendiri di ZKsync Era. CashPilot tidak dapat melihat alamat dompet itu."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "Reward NODL untuk setiap pengguna aktif baru yang bergabung melalui undangan (Nodle tidak memublikasikan jumlahnya)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Seorang pengulas melaporkan sekitar $3 yang diperoleh selama tiga hingga empat tahun; yang lain melaporkan penghasilan harian turun tajam."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot tidak menjalankan Nodle: Anda menggunakan aplikasi ponsel milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana adalah marketplace komputasi GPU terdesentralisasi yang dibangun di Solana. Platform ini menghubungkan pemilik GPU dengan permintaan beban kerja AI, dan membayar dalam token NOS. RTX 3060 menghasilkan sekitar $0.048/jam. Platform ini berfokus pada beban kerja inferensi AI dan menggunakan blockchain Solana untuk penjadwalan pekerjaan dan penyelesaian pembayaran. Node menjalankan beban kerja dalam kontainer melalui Nosana CLI.\n"
