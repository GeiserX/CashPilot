ionet.description:
  text: "io.net adalah jaringan GPU terdesentralisasi untuk beban kerja AI/ML. Mengumpulkan GPU yang menganggur dari konsumen dan pusat data. Memerlukan GPU NVIDIA dengan VRAM 8GB+ untuk penghasilan yang berarti. Penerapan berbasis kontainer didukung.\n"
