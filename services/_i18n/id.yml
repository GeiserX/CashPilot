packetstream.cashout.notes:
  text: "Hanya PayPal, minimum $5, biaya 3% ditampilkan sebelum Anda mengonfirmasi. Penarikan pertama menyimpan email PayPal Anda; mengubahnya nanti memerlukan konfirmasi email dan menunggu 7 hari, jadi periksa alamatnya sebelum mengonfirmasi. Permintaan ditinjau dan dikirim dalam 7 hari; Anda dapat membatalkan permintaan selama masih menunggu, dan permintaan baru hanya dapat dibuat setelah yang sebelumnya dibayar."
