packetstream.rating.cons.0.text:
  text: "Pengulas Trustpilot pada 2025 dan 2026 melaporkan pembayaran datang terlambat atau tidak datang sama sekali, dan seorang pengguna lama mengatakan pembayaran melambat lalu berhenti; yang lain pada 2026 melaporkan sudah dibayar."
