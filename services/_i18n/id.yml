  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "Reward blok turun 10% setiap tahun, dan sebuah panduan 2026 menilai reward tingkat kecil lemah jika dihitung dalam dolar."
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "CashPilot tidak menjalankan Flux: Anda menggunakan perangkat lunak node milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "Daemon Flux bersifat open source di bawah lisensi MIT."
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network adalah marketplace komputasi terdesentralisasi tempat Anda berbagi sumber daya CPU dan GPU dengan imbalan token GLM. Penyedia menjalankan agen Yagna yang mengelola eksekusi beban kerja di lingkungan sandbox. Salah satu proyek komputasi terdesentralisasi tertua (didirikan 2016). Mendukung tugas CPU, rendering GPU, dan komputasi serbaguna. Pembayaran melalui Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Marketplace komputasi terdesentralisasi - token GLM melalui agen Yagna"
  source: "88f817c25848"
golem.earnings.notes:
  text: "Penghasilan bergantung pada perangkat keras, harga, dan permintaan tugas. Node yang hanya CPU menghasilkan lebih sedikit. Node GPU menghasilkan lebih banyak tetapi memerlukan NVIDIA. Jalankan agen penyedia Yagna (bukan image Docker). Pembayaran di Polygon dalam token GLM."
  source: "07287d437d51"
golem.payment.frequency:
  text: "Per penyelesaian tugas"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "Token GLM yang diperoleh. Atur dompet pembayaran saat penyiapan penyedia."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Belum ditentukan: CashPilot belum memeriksa di mana layanan ini menyimpan penghasilan Anda."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot tidak menjalankan Golem: Anda memasang sendiri agen penyedia, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Golem mendokumentasikan cara menjalankan penyedia dalam image Docker miliknya sendiri."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "Agen penyedia, yagna, bersifat open source di bawah GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Tanpa akun: Anda mengatur dompet pembayaran saat penyiapan penyedia."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "Jaringan ini sudah berjalan sekitar sepuluh tahun."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Kebijakan privasi Golem menyebutkan operatornya, Golem Factory GmbH di Zug, Swiss."
  source: "bae79b651923"
grass.description:
  text: "Grass adalah jaringan terdesentralisasi yang memungkinkan Anda menjual bandwidth yang tidak terpakai untuk data pelatihan AI. Berjalan sebagai ekstensi browser dan aplikasi desktop, meneruskan permintaan web scraping melalui koneksi Anda untuk membangun dataset terstruktur. Dengan 8.5M+ pengguna, ini salah satu jaringan bandwidth DePIN terbesar. Mendapatkan token GRASS di blockchain Solana.\n"
  source: "046951d812f9"
grass.short_description:
  text: "Berbagi bandwidth DePIN untuk data AI - mendapatkan token GRASS"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Token akses"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Masuk di <a href=\"https://app.grass.io\">app.grass.io</a>, tekan F12 → Application → Local Storage → klik <code>https://app.grass.io</code> → salin nilai <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Mendapatkan Grass Points yang dapat dikonversi menjadi token GRASS melalui airdrop. Nilai USD sebenarnya bergantung pada harga token. Memerlukan ekstensi browser atau aplikasi desktop."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Airdrop berbasis epoch"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Reward datang sebagai distribusi berkala yang diklaim di dasbor Grass. Distribusi Stage 2 (aktivitas Oktober 2024 hingga Juni 2026) dibayar dalam USDC: klaim di app.grass.io/dashboard paling lambat 22 Januari 2027, atau lebih awal jika semua alokasi sudah diklaim lebih dulu. Grass menyimpan reward yang tidak diklaim."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "Mengumpulkan POIN; GRASS diklaim dari dasbor Grass saat airdrop berkala."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Masuk di <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, tekan F12 → Application → Local Storage, salin nilai <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% dari poin waktu aktif referal langsung, 10% di tingkat kedua, 5% di tingkat ketiga"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Klaim USDC Grass Stage 2 Anda"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Grass menyimpan setiap alokasi Stage 2 yang tidak diklaim paling lambat 22 Jan 2027, dan jendelanya bisa tutup lebih awal jika semua alokasi sudah diklaim."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Masuk di app.grass.io dengan akun yang Anda gunakan di Stage 2, aktifkan Grass Wallet, buka tab Allocation, dan konfirmasi. Klaim hanya di app.grass.io. Tidak punya poin Stage 2? Pilih Bukan untuk saya."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Reward hanya datang melalui musim airdrop. Operator node lama melaporkan perkiraan musim 2 di kisaran beberapa dolar hingga belasan dolar."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "Reward musim 2 yang tidak diklaim paling lambat 22 Januari 2027 hilang untuk selamanya."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "Airdrop pertama menuai protes karena reward per poin yang kecil, terbagi ke lebih dari dua juta pengguna."
