  text: "10% dari penghasilan mereka"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "Bonus pendaftaran $5"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "Lalu lintas melalui satu IP publik dibagi di antara perangkat yang memakainya, jadi perangkat kedua di koneksi yang sama tidak menambah apa pun."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot tidak menjalankan Spide: Anda menggunakan aplikasi milik penyedia sendiri, jadi CashPilot tidak dapat menerapkan atau memperbaruinya untuk Anda. Ketentuannya belum diperiksa terkait kontainer."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Tambang Pearl, Zano, atau Ravencoin dengan satu GPU NVIDIA. CashPilot mengunduh rilis resmi SRBMiner-Multi saat pertama kali dijalankan dan memeriksa SHA-256-nya. Pool yang Anda pilih membayar ke alamat pembayaran publik Anda. SRBMiner-Multi mengambil 2% waktu hashing untuk Pearl dan 0.85% untuk dua koin lainnya. Listrik bisa lebih mahal daripada koin yang Anda hasilkan."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Tambang Pearl dan koin GPU lainnya di GPU NVIDIA"
  source: "21ebe0c11493"
