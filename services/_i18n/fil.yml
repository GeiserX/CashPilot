iproyal.docker.health_signals.1.means:
  text: "May nakikitang ibang aktibong device ang Pawns sa IP address na ito at isa lang ang binabayaran nito kada IP, kaya tumatakbo ang kopyang ito pero walang shine-share at walang kinikita. Itigil ang anumang ibang Pawns app sa IP na ito, nasa ibang makina man, PC o telepono. Kung wala, hintaying tanggalin ng Pawns ang lumang device, o hilingin sa support ng Pawns na i-release ito."
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "Nakadepende ang kita sa lokasyon at paggamit ng bandwidth. Mas malaki ang kita ng mga residential IP sa US/EU."
  source: "424261bf08d4"
iproyal.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "Minimum $5. Piliin muna ang bansa mo; nakadepende rito ang mga paraan. Mula Spain (Oktubre 2026): PayPal 4% na may $0.25 na minimum fee, binabayaran sa pamamagitan ng Tremendous, na mag-e-email ng link kung saan mo ilalagay ang iyong pangalan at PayPal address; USDT (BEP20, ERC20, TRC20) o USDC (BEP20, ERC20) na may $1 na network fee; Bitcoin na may $2 na minimum fee; gift card na walang fee. Kailangan ng unang payout ang isang beses na SMS check ng iyong phone number: binubuksan ito ng Withdraw, at ilalagay ang numero kasama ang country code nito. Pagkatapos, bawat payout ay hihingi ng code na ipinadala sa email ng account mo at susuriin nang hanggang 72 oras bago ipadala."
  source: "0430fae34eb5"
iproyal.payout.notes:
  text: "Hawak ng IPRoyal Pawns ang balanse; iwi-withdraw kapag hiniling."
  source: "e11da90d5216"
iproyal.collector.credential_hint:
  text: "Gamitin ang email at password ng iyong IPRoyal Pawns account (pareho sa <a href='https://pawns.app' target='_blank'>pawns.app</a>)."
  source: "b9dcb3a01d17"
iproyal.referral.bonus.referrer:
  text: "$1 sa bawat isa sa unang tatlong payout nila, hanggang $3, kung dumating ang bawat isa sa loob ng 1-3 linggong window nito"
  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "$1 sa bawat isa sa unang tatlong payout mo, hanggang $3; kapag lumampas ka sa isang 1-3 linggong window, mag-e-expire ang natitira"
  source: "619d5960686c"
iproyal.rating.cons.0.text:
  text: "Sinasabi ng mga termino na puwedeng i-block ang isang account nang walang paunang abiso dahil sa pag-abuso sa mga kondisyon ng withdrawal o sa maraming account, at maaaring hindi na mabayaran ang kita nito."
  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "Sinasabi ng mga termino na hindi pinapayagan ng Pawns ang anumang server, VPN o proxy service para sa traffic sharing, at isang device lang kada IP."
  source: "449c1cdf793f"
iproyal.rating.cons.2.text:
  text: "4% ang PayPal (hindi bababa sa $0.25) sa pamamagitan ng Tremendous, at bawat payout ay sinusuri nang hanggang 72 oras."
  source: "56449f2db6ce"
iproyal.rating.cons.3.text:
  text: "Kailangan ng unang payout ang SMS check ng iyong phone number, at bawat payout ay kailangan ng code na ipinadala sa email."
  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "Pinapangalanan ng privacy policy ang operator, ang Pawns.App Ltd (kumpanya 16043795 sa England and Wales), na ayon sa Companies House ay itinatag noong 28 Oktubre 2024, wala pang tatlong taon ang nakararaan."
  source: "a7fcb7aea980"
iproyal.rating.cons.5.text:
  text: "Sinasabi ng mga termino na idinadaan ng Pawns at ng mga business client nito ang traffic sa iyong device, at hindi mo matutukoy kung aling client ang gumagamit nito."
  source: "ca979ac10720"
iproyal.rating.pros.0.text:
  text: "$5 na minimum, at walang fee ang mga gift card."
  source: "0fa4f89bbd63"
