proxybase-xyz.description:
  text: "Ang ProxyBase Markets ay isang SOCKS5 proxy marketplace na ginawa para sa mga AI agent. Nagpapatakbo ang mga seller ng magaan na Rust CLI daemon na kumokonekta sa pamamagitan ng WebSocket para ipasa ang traffic ng buyer sa kanilang internet connection, at kumikita ng USDC sa Tempo Chain kada GB na naibenta. Suportado ang direct (sariling bandwidth) at upstream (muling pagbenta ng external proxy) na mode na may auto-reconnect. Bumibili ang mga buyer ng proxy session ayon sa bansa, ISP at bandwidth. Dumadaloy ang bayad sa Machine Payments Protocol (MPP) sa Tempo Chain. Para sa mga buyer ang referral link: ang buyer na magbubukas ng console gamit ito ay makakakuha ng dagdag na 10% sa una niyang deposito.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - SOCKS5 marketplace para sa mga AI agent, USDC payout. Gumagawa ng wallet na ang volume ang may hawak ng nag-iisang kopya ng key"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "Backend API URL"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "I-override ang backend API URL (default ay https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "Kusang nagse-setup ang container sa unang start: gumagawa ito ng secp256k1 wallet (BIP-39), nag-a-authenticate sa pamamagitan ng ECDSA challenge-response, at nagsisimulang magbenta ng bandwidth sa direct-only mode. Sine-save ang lahat ng state (wallet, session token, seller config) sa volume na <code>proxybase-data</code>. Tingnan ang container logs sa unang takbo para sa wallet address. Gamitin ang <code>--upstream</code> para magdagdag ng mga external proxy resell path.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "Ang ginawang wallet keyfile. Ang volume na ito MISMO ang pera: walang kopya sa server, kaya kapag binura mo ito, mawawala rin ang pondo."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Batay ang kita sa GB na naibenta sa presyo ng merkado. Mas maliit ang kita ng mga VPS/datacenter IP kaysa sa residential. Kayang pagsamahin ng multi-upstream mode ang sarili mong bandwidth at mga external proxy."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "I-lock ang kita gamit ang <code>proxybase-cli seller payout create</code>, na matatanggap bilang USDC sa Tempo Chain (Tempo MPP). Nagbabayad ito sa kahit anong EVM address na hawak mo ang key (EVM chain ang Tempo), nang walang kailangang i-sign; idagdag ang Tempo network sa wallet para makita ang USDC. Kung hindi pa rin ito lumalabas sa wallet, kailangang idagdag nang mano-mano ang Tempo USDC token: i-import ito gamit ang contract address na ibinibigay ng Proxybase, at suriin ang address na iyon bago pagkatiwalaan ang balanse."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "Gumagawa ang client ng sarili nitong wallet sa unang takbo."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "15% ng bawat depositong gagawin ng ni-refer na buyer, bilang credit para sa sarili mong mga proxy session"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "+10% sa unang deposito ng buyer"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "Bandwidth, bilang SOCKS5 proxy na ibinebenta sa mga buyer sa ProxyBase marketplace."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Oo. Idinadaan ng mga buyer ang traffic nila sa koneksyon mo — iyon mismo ang ibinebenta."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Isang wallet address na ginawa sa iyong makina, at ang dami ng traffic na ipinapasa mo."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Totoo, at direktang tumatama ito sa mga home connection. Lumalabas sa ilalim ng IP mo ang proxy traffic mula sa mga hindi kilalang buyer, kaya sa iyo darating ang mga abuse complaint. Walang anuman sa katalogong ito na naglilimita sa serbisyo sa mga datacentre address, at mas malaki ang kita ng mga residential IP, kaya mali ang direksyon ng insentibo rito: basahin ang mga termino ng iyong ISP bago ito patakbuhin sa bahay."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "hindi alam - hindi naglalathala ang provider ng limitasyon ng device kada account o kada IP, at wala ring idinedeklara ang katalogo."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "USDC sa Tempo Chain ang mga payout, sa kahit anong EVM address na hawak mo ang key."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "Ibinebenta ang koneksyon mo bilang SOCKS5 proxy sa mga buyer sa marketplace; wala kaming nakitang paliwanag kung paano sinusuri ang mga buyer."
  source: "2dec55ca610f"
proxybase-xyz.rating.pros.0.text:
  text: "Sinasabi mismo ng pamagat ng earn page nito na walang kailangang KYC, na may $1 na payout."
  source: "25b6dc3b4608"
