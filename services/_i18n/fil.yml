  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "Ipinapakita ng public stats ng pool ang bawat payout address at ang mining activity nito."
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "Ginagamit ng pool ang iyong payout address bilang kapalit ng account."
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "Naniningil ang pool ng 0.9% na fee at hindi nagbabayad hangga't hindi naaabot ang iyong threshold."
  source: "7eb2950589fa"
honeygain.description:
  text: "I-share ang hindi mo nagagamit na internet bandwidth at kumita ng passive income. Idinadaan ng Honeygain sa koneksyon mo ang traffic para sa web intelligence, content delivery at market research. Isa ito sa pinakamatatag na bandwidth-sharing platform, na may 12M+ user at mahigit 1M na natapos na payout.\n"
  source: "b219f969ba34"
honeygain.short_description:
  text: "Bandwidth sharing - pinakamatatag na platform"
  source: "c0542c471f29"
