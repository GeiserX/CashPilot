  text: "Ang ProxyBase ay isang bandwidth-sharing platform na nagbabayad sa mga user sa cryptocurrency para sa pag-share ng hindi nila nagagamit na internet connection. Ia-authenticate mo ang peer client gamit ang Access Token mula sa iyong dashboard. Pinakamalaki ang kita ng mga residential IP, pero suportado rin ang mga datacenter IP. Opisyal na multi-arch Docker image (amd64/arm64/armv7).\n"
