ocean.description:
  text: "Ang OCEAN ay isang Bitcoin mining pool na walang account: nagla-log in ang iyong miner gamit ang iyong Bitcoin address bilang username, at binabayaran ng pool ang address na iyon. Hindi nagpapatakbo ng miner dito ang CashPilot. Binabasa nito ang hindi pa nababayarang balanse na hawak ng OCEAN para sa address mo, para makita mo ang kinita ng iyong ASIC (isang Bitaxe, isang Antminer) katabi ng iba mo pang kita. Ang hindi pa nababayarang balanse ay kinita na pero hindi pa natatanggap: binabayaran ito ng OCEAN on-chain kapag lumampas na sa payout threshold.\n"
  source: "5d25f28a3de5"
