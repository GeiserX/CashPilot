  text: "Nakalista sa site ang $0.20 na minimum, at may request na mas mababa sa $1 na pumasok noong Oktubre 2026. Laging iwi-withdraw ng request ang buong balanse, bilang USDC sa Polygon, POL o Litecoin, sa address na ita-type mo. Sagot ng ProxyBase ang network fee."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "Naiipon ang kita sa ACCOUNT ng ProxyBase na may-ari ng Access Token, at iwi-withdraw mula sa dashboard kapag hiniling. Walang hawak na wallet ang peer client at walang state na itinatabi ang container -- walang laman ang docker.volumes. Huwag itong ipagkamali sa proxybase-xyz (ProxyBase Markets, parehong organisasyon), na talagang nagmi-mint ng local wallet at idinedeklara itong critical volume."
