  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "May bisa ang kita sa loob ng 24 na buwan matapos nitong maabot ang $20 na minimum. Pagkatapos noon, puwedeng burahin ng Honeygain ang hindi na-payout."
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
  text: "Kung hindi magagamit ang app nang mahigit 6 na buwan, ituturing ng Honeygain na expired na ang hindi pa nababayarang balanse, kahit mas mababa sa $20."
  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "Panatilihing nagshe-share ang isang device, o mag-request ng payout. Sa JumpTask mode, normal na hindi gumagalaw ang balanse, kaya piliin ang Hindi para sa akin."
  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "Pinapayagan ng mga termino ang Honeygain na burahin ang kitang umabot sa $20 na threshold at hindi na-payout sa loob ng 24 na buwan, at ituring na expired ang kita matapos ang anim na buwang walang paggamit."
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "$20 ang minimum, at dumadaan sa Tipalti ang mga PayPal payout, na naniningil ng $2.02 kada bayad."
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "Pinapayagan ng mga termino ang Honeygain na i-suspend ang isang account at pigilan o burahin ang kitang itinuturing nitong naipon sa mapanlinlang na paraan."
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "Bago ang unang PayPal payout, ipapakumpirma ng Tipalti ang isang mobile number sa SMS at hihingin ang iyong pangalan, address at petsa ng kapanganakan."
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "Sinasabi ng mga termino na ginagamit ng mga business client ang traffic para mangalap ng public na web data, pero walang pinapangalanang client, at hindi mo malalaman kung aling client ang gumagamit ng koneksyon mo."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "Sinasabi mismo ng Honeygain sa mga sagot nito sa mga review tungkol sa mababang kita na nakadepende ang kita sa demand ng network at sa lokasyon; iniuulat ng mga reviewer na napakatagal bago nila naabot ang $20 na minimum."
  source: "634fb331e65b"
honeygain.rating.pros.0.text:
  text: "Naglalathala ang Honeygain ng sarili nitong Docker image, honeygain/honeygain."
  source: "ea44bd3c855c"
honeygain.rating.pros.1.text:
  text: "Pinapangalanan ng mga termino ang operator, ang Honeygain UAB, na nakarehistro sa Vilnius, Lithuania."
  source: "579a169fcf35"
honeygain.rating.pros.2.text:
  text: "Sinasabi ng press page ng Honeygain na itinatag ito noong 2019."
  source: "a3bfbdb33f54"
ionet.description:
  text: "Ang io.net ay isang decentralized GPU network para sa mga AI/ML workload. Pinagsasama-sama nito ang mga idle GPU mula sa mga consumer at data center. Kailangan ng NVIDIA GPU na may 8GB+ VRAM para sa makabuluhang kita. Suportado ang mga deployment na batay sa container.\n"
  source: "5d017f77f0ac"
ionet.short_description:
  text: "Decentralized GPU network para sa AI - kailangan ng NVIDIA GPU"
  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "Kailangan ng NVIDIA GPU na may 8GB+ VRAM. May mga nagsasabing $500-1000/buwan para sa RTX 4090 (sa totoo, malamang mas mababa ang aktwal na kita)."
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "Batay sa epoch"
  source: "75743e03bad2"
ionet.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "Binayaran ang reward ng mga supplier mula sa token emission kahit walang bayad na job, at iniuulat ng mga may-ari ng GPU na idle sila halos lagi."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "Nasa IO token ang mga reward at nagbago ang payout model noong 2026 tungo sa isang engine na naka-peg sa dolyar."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "Noong Abril 2024, mga 1.8 milyong pekeng GPU ang sumubok sumali gamit ang isang na-leak na authentication token, at kalaunan ay nagbitiw ang CEO bago ang token launch."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "Hindi pinapatakbo ng CashPilot ang io.net: ginagamit mo ang sariling worker software ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "1cac289c99ad"
iproyal.description:
  text: "Hinahayaan ka ng IPRoyal Pawns na kumita sa pag-share ng hindi mo nagagamit na bandwidth. Ang IPRoyal ay isang matatag nang proxy provider, at ang Pawns ang sangay nila para sa residential bandwidth sharing. Tumatanggap ng credentials ang CLI Docker image sa pamamagitan ng mga command-line flag. Ang bagong user na nag-sign up gamit ang referral link ay makakakuha ng $1 sa bawat isa sa unang tatlong payout niya, hanggang $3. Dapat dumating ang bawat payout sa loob ng window na isa hanggang tatlong linggo, depende sa lokasyon. Nagsisimula ang window sa pag-sign up at nagsisimula ulit pagkatapos ng bawat payout. Kung magsara muna ang isang window, mawawala ang natitirang bonus.\n"
  source: "b12878d5917a"
iproyal.short_description:
  text: "Bandwidth sharing - hanggang $3 na bonus sa mga unang payout mo"
  source: "20091c7b26ed"
