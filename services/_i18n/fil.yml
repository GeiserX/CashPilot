# Filipino translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/fil.yml --restamp '<key>'
2miners-etc.description:
  text: "Subaybayan ang hindi pa nababayarang Ethereum Classic na balanse na hawak ng 2Miners para sa iyong public na ETC payout address. Patakbuhin ang sarili mong miner at ituro ito sa pool. Binabasa ng CashPilot ang balanse at hihilingin nitong kumpirmahin mo ang mga payout kapag bumaba ang balanse.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Ethereum Classic mining pool, sinusubaybayan gamit ang iyong payout address"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (nababago)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "Tinitingnan ng pool ang iyong payout threshold kada dalawang oras"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "Awtomatikong nagbabayad ang 2Miners sa iyong address kapag naabot mo na ang threshold na pinili mo. Ang pinakamababang threshold para sa ETC payout ay 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Sa 2Miners naiipon ang hindi pa nababayarang balanse. Hiwalay na binabasa mula sa Ethereum Classic ang balanse ng wallet. Tingnan sa iyong wallet ang halagang natanggap mo bago kumpirmahin ang isang payout sa CashPilot.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Ilagay ang public na Ethereum Classic payout address na ginagamit ng iyong miner sa 2Miners, na nagsisimula sa <b>0x</b>. Huwag isama ang pangalan ng worker.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Kailangan ng ETCHash miner na nakaturo sa 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "compute"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Hindi. Ang miner mo ang nagpapadala ng mining work sa pool."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "Ginagamit ng pool ang iyong payout address, ang mga pangalan ng worker na pinili mo, at ang IP address ng iyong miner."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Kahit sino ay puwedeng tumingin ng stats gamit ang payout address. Para mabago ang threshold, hihingi ang pool ng kumpirmasyon ng IP ng worker."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "Naniningil ang pool ng 1% na fee at hindi nagbabayad hangga't hindi naaabot ang iyong threshold."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Ang Anyone Protocol (dating ATOR) ay isang decentralized na privacy network na gumagamit ng onion routing. Nagpapatakbo ng mga relay node ang mga node operator at kumikita sila ng ANYONE token para sa bandwidth na ibinibigay nila. Isipin itong \"Tor na may insentibo.\" Pinapatakbo ito ng CashPilot gamit ang sarili nitong image, na binuo mula sa signed na Debian package ng proyekto, para sa amd64 at arm64. Sa file ginagawa ang configuration, sa pamamagitan ng anonrc file na naka-mount sa container (Nickname, ContactInfo, ORPort, atbp.). Walang kinikita ang isang relay hangga't walang 100 ANYONE na naka-lock para dito nang hindi bababa sa 180 araw, at kini-claim ang mga reward sa pamamagitan ng pag-sign sa iyong wallet. Inililista rin ng relay ang iyong public IP sa relay directory ng network, na puwedeng makasira sa reputasyon ng IP na binabayaran ng mga residential bandwidth app.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Decentralized onion routing - mga Tor relay node na may insentibo"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Ang ed25519 identity key ng relay. Kapag nasira ito, mawawala ang reputasyon ng relay at babalik sa zero ang kasaysayan ng kita nito."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Nagbabayad lang kapag may 100 ANYONE na naka-lock kada relay nang hindi bababa sa 180 araw at may reward claim na na-sign sa iyong wallet. Kung walang stake, walang kinikita ang relay. Kung mayroon, nakadepende ang kita sa bandwidth na ibinigay at sa uptime."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Batay sa epoch"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Itinatakda bilang ContactInfo sa anonrc, na may prefix na '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Mga relay fingerprint na pinaghihiwalay ng kuwit. Walang online dashboard na nagpapakita ng mga ito. Para sa relay na pinapatakbo ng CashPilot, patakbuhin ang <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> sa host na nagpapatakbo nito. Para sa hardware relay, buksan ang Relay Control Panel nito sa <b>http://relayup.local</b> at basahin ang Fingerprint sa Home page.\n"
  source: "ffa5be0d4953"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Bandwidth, bilang relay sa Anyone network (isang fork ng Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Oo. Ipinapasa nito ang traffic ng ibang tao. Kung ang IP mo ang huling hop ay nakadepende sa kung naka-configure bilang exit ang relay."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "Ang public identity key ng relay, ang iyong IP at port, at ang uptime statistics, na sadyang inilalathala lahat sa network directory. Kung magtatakda ka ng ContactInfo sa iyong anonrc, ilalathala rin ito roon at permanenteng mai-index sa publiko — kadalasan ay email address ito, kaya iwanan itong blangko maliban kung gusto mong maging public ito."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Totoo. Iniuugnay sa koneksyon mo ang traffic ng relay. Lalo na ang mga exit relay ay umaakit ng mga abuse complaint; maraming consumer ISP ang nagbabawal sa mga ito."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Walang account na kailangang i-sign up, kaya walang limitasyon kada account. Para kumita, kailangan mo pa rin ng Ethereum wallet na may 100 ANYONE na naka-lock para sa bawat relay nang hindi bababa sa 180 araw, at kailangan ng CashPilot ang mga relay fingerprint para mabasa ang mga reward. Hindi naglalathala ang proyekto ng limitasyon ng relay kada IP, at wala ring idinedeklara ang katalogo."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Walang kinikita ang isang relay maliban kung may 100 ANYONE na naka-lock para dito nang hindi bababa sa 180 araw, at bawat reward claim ay sina-sign sa iyong wallet."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Sadyang ipinapasa nito ang traffic ng ibang tao, nang hindi sinusuri kung sino sila; umaakit ng mga abuse complaint ang mga exit relay."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "Inilalathala sa network directory ang identity, IP at uptime ng relay, at magiging public magpakailanman ang anumang ContactInfo na itatakda mo."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Walang account na kailangang i-sign up. Wallet lang ang kailangan ng relay, walang identity check."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "Ang relay software ay isang public na fork ng Tor, sa ilalim ng lisensya ng Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "Bumubuo ang CashPilot ng sarili nitong image mula sa inilathalang relay software ng Anyone, na hindi nangangailangan ng account."
  source: "2e36c9093df6"
bitping.description:
  text: "Ang Bitping ay isang decentralized na platform para sa network monitoring na nagbabayad sa iyo para magpatakbo ng node. Gumagawa ang node mo ng website monitoring, latency testing at network quality check para sa mga customer ng Bitping. Gumagana ito sa parehong residential at VPS na koneksyon. Sa unang start, nagla-log in ang Docker image gamit ang mga environment variable na BITPING_EMAIL at BITPING_PASSWORD (\"Attempting login with environment variables\" sa sarili nitong log), at pagkatapos ay sine-save ang session sa volume mount para hindi na kailangang mag-authenticate ulit tuwing restart.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Bandwidth sharing - decentralized network monitoring, gumagana sa VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Password"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "Ang email ng iyong Bitping account (parehong login sa <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Ang password ng iyong Bitping account. Isang beses lang itong ginagamit para gumawa ng node session, na pagkatapos ay nananatili sa data volume."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Nakadepende ang kita sa kalidad ng network at sa demand para sa monitoring mula sa lokasyon mo. Tinatanggap ang mga VPS node."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Nasa nodes.bitping.com ang kita ng node; ang app.bitping.com ay ang dashboard para sa mga API customer. SOL lang ang mga withdrawal: kapag lumampas na sa $0.05 ang hindi pa nababayarang balanse, i-type ang Solana address sa request, na ipoproseso sa loob ng 24 na oras. Ang bago o walang lamang Solana wallet ay kailangang may mga 0.001 SOL muna, para sa rent minimum ng network."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Solana na lang ngayon, at ita-type ang address SA ORAS NG WITHDRAWAL sa halip na naka-save."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Gamitin ang email at password ng iyong Bitping account (pareho sa <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "I-withdraw ang iyong Bitping balanse"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Puwedeng kunin ng Bitping ang kitang hindi na-claim nang mahigit 12 buwan, matapos ang 30 araw na abiso sa email."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Mag-request ng SOL withdrawal sa nodes.bitping.com at i-type ang iyong Solana address sa request."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Binabayaran ang mga withdrawal sa Solana (SOL), sa address na ita-type mo sa bawat request."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Ayon sa help ng Bitping, puwedeng pumalya ang withdrawal sa bago at walang lamang Solana wallet hangga't hindi mo nilalagyan ng kaunting SOL ang wallet na iyon."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Ayon sa help ng Bitping, suportado ang mga server at Docker container."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Solana address lang na ita-type sa request ang kailangan para sa withdrawal."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Ang Bytebenefit ay isang bandwidth-sharing na serbisyo na nagbabayad sa PayPal at Stripe. Walang opisyal na Docker image; ang Windows desktop app at Android app ang mga client. Nasa bytebenefit.io ang serbisyo -- tinalikuran na ang lumang bytebenefit.com domain at naka-park ito sa isang marketplace, kaya minsan itong minarkahang patay dito.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Bandwidth sharing - PayPal/Stripe payout, desktop/Android app"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Walang available na Docker image. Windows desktop at Android app lang."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% ng kita mula sa traffic ng mga referral"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "$1 (10,000 Coins) na welcome bonus"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "Sinasabi ng listing ng app sa Google Play na ginagamit ang traffic mo para sa mga web-intelligence request ng mga client ng Infatica, nang hindi sinasabi kung sino sila o paano sila sinusuri."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Nawala sa Google Play ang Android app noong Abril 2026 matapos ang 17 buwan."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "Hindi pinapatakbo ng CashPilot ang ByteBenefit: ginagamit mo ang sariling app ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "550e4508aba2"
bytelixir.description:
  text: "Hinahayaan ka ng Bytelixir na kumita ng passive income sa pag-share ng hindi mo nagagamit na internet bandwidth. Windows at Android lang ang suportado — sinasabi ng opisyal na FAQ na walang planong Linux o Docker client, hindi suportado ang iOS, at walang macOS. Malaki ang epekto ng lokasyon sa kita. May web dashboard sa dash.bytelixir.com para sa pagsubaybay. Walang available na Docker image.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Bandwidth sharing - Windows + Android lang"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Session Cookie"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Remember Web Cookie"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "XSRF Token"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Mag-log in sa <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, pindutin ang F12 → Application → buksan ang <b>Cookies</b> sa kaliwang sidebar → i-click ang sub-item na <code>https://dash.bytelixir.com</code> → sa listahan ng cookie sa kanan, hanapin ang <code>bytelixir_session</code> → kopyahin ang Value nito (isang mahabang JWT na nagsisimula sa eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Parehong lokasyon (Cookies → <code>https://dash.bytelixir.com</code>) → hanapin ang cookie na <code>remember_web_...</code> → kopyahin ang Value nito (opsyonal, pinapahaba ang buhay ng session)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Parehong lokasyon → hanapin ang <code>XSRF-TOKEN</code> → kopyahin ang Value nito (opsyonal)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Nag-iiba ang kita ayon sa lokasyon ($2-50/buwan). Walang Docker image. Kailangan ang desktop app o Android app."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Crypto lang. Nakadepende sa coin ang minimum: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Ita-type mo ang address sa bawat request. Inaasikaso ang mga request sa oras ng trabaho, sa loob ng 24 na oras."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Hawak ng Bytelixir ang balanse; ita-type ang wallet address sa bawat payout request, at hindi ito kailanman sine-save sa container."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Mag-log in sa <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>nang naka-tick ang Remember Me</b>, pindutin ang F12 → Application → buksan ang <b>Cookies</b> sa kaliwang sidebar → i-click ang <code>https://dash.bytelixir.com</code>, pagkatapos ay kopyahin ang tatlong value: <b>bytelixir_session</b>, <b>remember_web_…</b> (ang mahaba na nagsisimula sa prefix na iyon) at <b>XSRF-TOKEN</b>. Ang session cookie lang ay mag-e-expire mga dalawang oras matapos mo itong kopyahin, kaya titigil ang pagkolekta sa hapon ding iyon; isang taon ang tagal ng remember_web cookie at ito ang nagpapanatiling gumagana nito."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50% ng kanilang kita habambuhay"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "$1 na greeting bonus"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Crypto lang, at nakadepende sa coin ang minimum, mula $5 para sa USDT hanggang $250 para sa Bitcoin."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "Hindi pinapatakbo ng CashPilot ang Bytelixir: ginagamit mo ang sariling app ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "May rating itong 4.6 sa Trustpilot mula sa 283 review, karamihan ay pumupuri sa mga crypto payout; ilan ang nag-uulat na hindi dumating ang payout nila."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Crypto address lang na ita-type sa request ang kailangan para sa payout."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Ang Clore.ai ay isang peer-to-peer na GPU marketplace. Ililista mo ang isang Linux machine na may NVIDIA GPU, itatakda mo ang sarili mong spot at on-demand na presyo, at magpapatakbo ang mga renter ng sarili nilang Docker container dito. Binabayaran ka lang para sa mga minutong naka-rent ito, sa CLORE, BTC, USDT o USDC. Para mag-host, kailangan ng x86_64 machine na may Ubuntu 22.04 o mas bago (o HiveOS), gumaganang NVIDIA driver at hindi bababa sa 100 Mbps na upload at download. Hindi suportado ang mga AMD GPU.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "GPU marketplace - paupahan ang mga NVIDIA GPU, bayad sa CLORE, BTC o USD stablecoin"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Binabayaran lang para sa mga minutong naka-rent, sa presyong itinakda mo. Ang pinakamataas sa range, $490, ay ang sariling ceiling ng Clore para sa isang RTX 4090 na nakalista kada minuto ('up to ~$490/month'); mas maliit ang kita ng mas maliliit na card at walang kinikita ang card na idle. Kinukuha ng Clore ang 5% (on-demand) o 1.25% (spot) ng bawat rental, dagdag pa ang 15% kapag nagbayad ang renter sa BTC, USDT o USDC sa halip na CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Mag-withdraw mula sa Account > Billing papunta sa sarili mong wallet: CLORE (ERC-20, minimum 200, fee na mga $0.50), BTC (minimum 0.0001, fee 0.00005 BTC) o USDT/USDC sa Ethereum o BNB Chain (minimum $10, fee $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Hawak ng Clore ang balanse (CLORE, BTC at isang USD balanse para sa USDT/USDC) hanggang mag-withdraw ka. Pinipili ang chain sa bawat withdrawal: Ethereum para sa CLORE, Bitcoin para sa BTC, Ethereum o BNB Chain para sa USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (standard tier) ng mga platform fee na binabayaran ng mga host at renter na ni-refer mo, sa bawat rental; hindi nag-e-expire ang code; bayad sa currency ng rental (CLORE, BTC o USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps na upload at download"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "GPU compute time sa iyong makina."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Oo. Nagpapatakbo ang mga renter ng sarili nilang Docker container sa iyong makina, at lumalabas ang traffic nila mula sa koneksyon mo; naka-forward sa internet ang SSH at mga application port."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Saklaw ng privacy policy ng Clore ang account data at ang iyong IP address na may tinatayang lokasyon; mga identity document lang kung hihingi ang Clore ng KYC."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Kailangang maaabot mula sa internet ang mga inbound port (22, 8080 at 3000-4000 bilang default) at tumatakbo sa linya mo ang mga workload ng mga estranghero. Sinasabi mismo ng network guide ng Clore na may mga ISP na nagbabawal ng hosting."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "18 pataas, at wala sa bansang may sanction. Puwedeng i-suspend o isara ng Clore ang isang account ayon sa sarili nitong pasya, at puwedeng mawala ang pondo dahil sa ipinagbabawal na paggamit."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Walang legal na entity na pinangalanan ang mga termino o ang privacy policy, at ipinapaubaya ng mga termino sa susunod na bersyon kung aling hurisdiksyon ang masusunod."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Puwedeng i-suspend o isara ng Clore ang isang account ayon sa sarili nitong pasya, at puwedeng humantong sa pagkawala ng pondo ang ipinagbabawal na paggamit."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Crypto lang ang mga payout (CLORE, BTC, USDT o USDC), at kumukuha ang Clore ng dagdag na 15% sa rental na binayaran ng renter sa BTC, USDT o USDC, maliban kung mag-lock ang host ng CLORE para mabawasan ito."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Binabayaran lang ang host para sa mga minutong naka-rent, at ang numero ng Clore para sa RTX 4090 ay ceiling (\"up to ~$490/month\") para sa isang card lang."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "Walang KYC para sa basic na paggamit, pero puwedeng humingi ang Clore ng identity verification para sa malalaking withdrawal o compliance case."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Puwedeng magpatakbo ang mga renter ng kahit anong public na Docker image sa iyong makina. Nakalista sa mga termino ang mga ipinagbabawal na paggamit (malware, DDoS, CSAM at iba pa), pero wala kaming nakitang paliwanag kung paano sinusuri ang mga renter."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "Hindi pinapatakbo ng CashPilot ang Clore.ai: ikaw ang mag-i-install ng hosting agent ng Clore sa sarili mong GPU machine (Ubuntu 22.04 o mas bago, o HiveOS), kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Kinukuha ng Clore ang 5% ng on-demand na rental (1.25% sa spot) kapag nagbayad ang renter sa CLORE, walang dagdag na fee."
  source: "699adf0a2179"
dawn.description:
  text: "Nagpapatakbo ang DAWN ng validator network na sumusuri sa bandwidth at coverage para sa AI infrastructure na pinopondohan sa pamamagitan ng DAWN protocol. Sumasali ang DAWN Validator browser extension sa mga proof-of-bandwidth at coverage check na ito at kumikita ng DAWN reward habang tumatakbo. Wala pang tiyak na cash value ang mga reward. Gumawa ng account sa extension at ilagay ang referral code na 2QLQV97F kapag hiningi ito.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "DePIN validator - kumikita ng DAWN points ang browser extension"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Kumikita ng Dawn Points bago ang token launch. Nakadepende ang totoong halaga sa magiging presyo ng token. Mas malaki ang kita ng hardware box kaysa sa browser extension."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Token airdrop (TBA)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "Gumagana ang extension pero hilaw pa. May inanunsyong Black Box hardware. Tingnan ulit sa hinaharap."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "Points ang kinikita ng extension; hanggang Oktubre 2026, walang nakumpirmang token distribution sa mga node operator."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "Walang tiyak na halaga ang points hangga't walang token launch at hindi pa inaanunsyo ang conversion nito."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "Hindi pinapatakbo ng CashPilot ang Dawn: ginagamit mo ang sariling browser extension ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "8232c9563c84"
deeper-network.description:
  text: "Ang Deeper Network ay isang proyekto ng decentralized VPN at web3 infrastructure. Pangunahing nangangailangan ito ng proprietary na Deeper Connect hardware device. Ang Moken ay kaugnay na platform para sa mining/staking. Hindi ito software lang.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "Decentralized VPN - kailangan ng proprietary na hardware device"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Kailangan ng Deeper Connect hardware ($200-500). Moken platform para sa mining/staking. Hindi ito software lang."
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "Tuloy-tuloy"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "Komisyon sa benta ng device"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "5% diskwento sa Deeper Connect device gamit ang coupon na SERGIO"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "DPR ang mining reward at nakadepende ito sa credit score na mabagal tumaas o tumataas sa pag-stake ng DPR."
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "Hindi pinapatakbo ng CashPilot ang Deeper Network: ginagamit mo ang sariling router hardware ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "b1ba1636070f"
earnapp.description:
  text: "Hinahayaan ka ng EarnApp ng Bright Data na ibenta ang hindi mo nagagamit na bandwidth para sa passive income. Ang Bright Data ang pinakamalaking proxy network sa mundo, na nagpapatakbo ng data collection para sa mga kumpanyang Fortune 500. Pinapatakbo ito ng CashPilot gamit ang sarili nitong image, na nagda-download ng naka-pin na EarnApp build mula sa CDN ng Bright Data sa unang start, sinusuri ang sha256 nito at pinapatakbo ito sa lite mode gamit lang ang UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Bandwidth sharing - suportado ng Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "Node UUID"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "Ang iyong EarnApp node ID: sdk-node- na sinusundan ng 32 lowercase hex character, gaya ng ipinapakita ng 'earnapp showid'. Pagkatapos mag-deploy, i-link ito nang isang beses sa pagbukas ng https://earnapp.com/r/ na sinusundan ng UUID na ito habang naka-sign in sa EarnApp; kumikita ang node na hindi naka-link, pero walang napupunta sa balanse mo"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "Paulit-ulit na hindi maabot ng EarnApp ang mga server nito at nagre-restart, kaya kaunti o walang kinikita. I-restart ang kopyang ito; kung patuloy itong nangyayari, tingnan ang internet connection ng makinang ito."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Buksan ang link na ito habang naka-sign in sa EarnApp para idagdag ang node sa iyong account. Hangga't hindi mo ito ginagawa, kumikita ang node pero walang napupunta sa balanse mo."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Malaki ang epekto ng lokasyon. Pinakamalaki ang kita ng mga IP sa US/EU. Tumataas ang kita ayon sa bandwidth na nagamit."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Kapag hiniling (may auto-redeem: PayPal $10 min, Wise $10 min, Amazon $50 min)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "I-on nang isang beses ang auto-redeem at kusang magbabayad ang EarnApp tuwing maaabot ng balanse ang minimum ng paraan: PayPal $10, Wise $10, Amazon $50. Galing sa Bright Data Ltd. ang mga bayad sa PayPal. Noong Oktubre 2026, dumating ang isang bayad sa PayPal na mga 2% na mas mababa sa na-redeem na balanse."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Hawak ng EarnApp ang balanse; nire-redeem sa Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Mag-log in sa <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, pindutin ang F12 → Application → Cookies, kopyahin ang value ng <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% ng kanilang kita habambuhay, binabayaran nang dagdag sa kita nila"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "Sinasabi ng help centre ng EarnApp na mahigpit na ipinagbabawal ang pag-install nito sa mga Docker container, virtual machine, hosting service o home server, at ganoon mismo ito pinapatakbo ng CashPilot."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "Sinasabi ng parehong help article na ang account na mahuhuling ganoon ang paggamit ay tatanggalin nang walang abiso at kakanselahin ang mga nakabinbing bayad nito."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Dumating ang aming PayPal payout noong Oktubre 2026, mga 2% na mas mababa sa na-redeem na balanse."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "$10 na minimum para sa PayPal at Wise, na may auto-redeem na kusang nagbabayad."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "Pag-aari ng Bright Data ang EarnApp, at galing sa Bright Data Ltd., isang kumpanyang may pangalan, ang mga bayad nito sa PayPal."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Binabayaran ka ng Earn.fm para sa pag-share ng iyong internet bandwidth. Gumagamit ang earnings collector ng email/password na auth sa pamamagitan ng Supabase. Magaan na Docker image na madaling i-deploy (gumagamit ang Docker client ng hiwalay na UUID token).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "Bandwidth sharing - email/password na auth, magaan na client"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "API Key"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "Mag-log in sa <a href=\"https://app.earn.fm\">app.earn.fm</a> → i-click ang profile icon mo (kanang itaas) → Account Settings → kopyahin ang API Key (UUID format)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "Medyo bagong platform. Nag-iiba ang kita ayon sa lokasyon at available na bandwidth."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "Minimum $15. Mga paraan: USDT sa BEP20 o Polygon ($1 fee) o TRC20 ($3 fee), PayPal, Amazon o Starbucks gift card mula $15, o bank wire mula $1,000 na ibinabawas ang transfer fee. Bago ang unang payout, sasagutan mo ang isang billing profile (legal na pangalan at address), na ginagamit para sa mga resibo ng payout."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "Hawak ng Earn.fm ang balanse; iwi-withdraw kapag hiniling."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Gamitin ang email at password ng iyong Earn.fm account (pareho sa login sa <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10% ng kanilang kita habambuhay"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "$5 na panimulang balanse"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "$15 na minimum, $1 hanggang $3 na fee sa USDT, at bank wire lang mula $1,000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Bago ang unang payout, sasagutan mo ang billing profile gamit ang iyong legal na pangalan at address."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Iniulat ng mga reviewer noong 2025 na hindi sumasagot ang support sa email at Discord; napansin ng Trustpilot na hindi sumasagot ang Earn.fm sa mga negatibong review."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Naglalathala ang Earn.fm ng sarili nitong Docker image, earnfm/earnfm-client."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ang Ebesucher ay isang traffic exchange platform kung saan kumikita ka ng credit sa pagbisita sa mga website sa pamamagitan ng awtomatikong surfbar. Tumatakbo ito bilang browser extension/addon. Hindi ito tradisyonal na bandwidth-sharing na serbisyo — gumagawa ito ng traffic sa awtomatikong pag-browse sa mga website.\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "Traffic exchange surfbar - browser extension"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "Kita sa BTP points na puwedeng gawing EUR. Browser extension lang."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "Payout sa euro sa pamamagitan ng PayPal o bank transfer."
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "Hindi pinapatakbo ng CashPilot ang eBesucher: isa itong browser extension, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "Payout mula 2 euro sa PayPal o SEPA, hindi bababa sa isang beses kada linggo, walang fee."
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "Tumatakbo ang eBesucher mula pa noong 2002."
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "Pinapangalanan ng imprint ang operator, ang TurboAd GmbH, na nakarehistro sa Berlin-Charlottenburg (HRB 160730 B)."
  source: "84cbddd4330b"
flux.description:
  text: "Ang Flux ay isang compute infrastructure na nakakalat sa buong mundo. Nag-i-stake ng FLUX token ang mga node operator at nagbibigay sila ng server resources. Tatlong tier: Cumulus (1,000 FLUX), Nimbus (12,500 FLUX), Stratus (40,000 FLUX). May mga opisyal na Docker image.\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "Decentralized compute - kailangan ng FLUX token stake"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "Kailangan ng stake na 1,000+ FLUX (~$50-500 depende sa presyo). Mas maraming collateral ang kailangan ng mas matataas na tier pero mas malaki ang kita."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "Block reward"
  source: "590433237f8a"
flux.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "Kailangan ng pinakamaliit na node tier ng 1,000 FLUX na naka-lock bilang collateral."
  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "Bumababa nang 10% kada taon ang block reward, at nakita ng isang gabay noong 2026 na mahina ang reward ng maliit na tier kung susukatin sa dolyar."
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "Hindi pinapatakbo ng CashPilot ang Flux: ginagamit mo ang sariling node software ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "Open source ang Flux daemon sa ilalim ng MIT licence."
  source: "1d44e028b43d"
golem.description:
  text: "Ang Golem Network ay isang decentralized compute marketplace kung saan nagshe-share ka ng CPU at GPU resources kapalit ng GLM token. Pinapatakbo ng mga provider ang Yagna agent na namamahala sa pagpapatakbo ng mga workload sa mga sandboxed na environment. Isa ito sa pinakamatatandang decentralized compute project (itinatag noong 2016). Suportado ang mga CPU task, GPU rendering at general-purpose compute. Bayad sa pamamagitan ng Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Decentralized compute marketplace - GLM token sa pamamagitan ng Yagna agent"
  source: "88f817c25848"
golem.earnings.notes:
  text: "Nakadepende ang kita sa hardware, presyo at demand sa mga task. Mas maliit ang kita ng mga CPU-only node. Mas malaki ang kita ng mga GPU node pero kailangan ng NVIDIA. Patakbuhin ang Yagna provider agent (hindi Docker image). Bayad sa Polygon gamit ang GLM token."
  source: "07287d437d51"
golem.payment.frequency:
  text: "Kada natapos na task"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "GLM token ang kinikita. I-configure ang payout wallet sa provider setup."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "Hindi pinapatakbo ng CashPilot ang Golem: ikaw mismo ang mag-i-install ng provider agent, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Dinodokumento ng Golem kung paano patakbuhin ang provider sa sarili nitong Docker image."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "Open source ang provider agent, ang yagna, sa ilalim ng GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Walang account: magtatakda ka ng payout wallet sa provider setup."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "Mga sampung taon nang tumatakbo ang network."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Pinapangalanan ng privacy policy ng Golem ang operator, ang Golem Factory GmbH sa Zug, Switzerland."
  source: "bae79b651923"
grass.description:
  text: "Ang Grass ay isang decentralized network na hinahayaan kang ibenta ang hindi mo nagagamit na bandwidth para sa AI training data. Gumagana ito bilang browser extension at desktop app, at idinadaan sa koneksyon mo ang mga web scraping request para bumuo ng mga structured dataset. May 8.5M+ user ito, kaya isa ito sa pinakamalalaking DePIN bandwidth network. Kumikita ng GRASS token sa Solana blockchain.\n"
  source: "046951d812f9"
grass.short_description:
  text: "DePIN bandwidth sharing para sa AI data - kumikita ng GRASS token"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Access Token"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Mag-log in sa <a href=\"https://app.grass.io\">app.grass.io</a>, pindutin ang F12 → Application → Local Storage → i-click ang <code>https://app.grass.io</code> → kopyahin ang value ng <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Kumikita ng Grass Points na puwedeng gawing GRASS token sa pamamagitan ng mga airdrop. Nakadepende sa presyo ng token ang totoong halaga sa USD. Kailangan ang browser extension o desktop app."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Airdrop batay sa epoch"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Dumarating ang mga reward bilang pana-panahong distribution na kini-claim sa Grass dashboard. Ang Stage 2 distribution (aktibidad mula Oktubre 2024 hanggang Hunyo 2026) ay binabayaran sa USDC: i-claim ito sa app.grass.io/dashboard nang hindi lalampas sa 22 Enero 2027, o mas maaga kung ma-claim na muna ang lahat ng allocation. Itinatabi ng Grass ang mga reward na hindi na-claim."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "POINTS ang naiipon; kini-claim ang GRASS mula sa Grass dashboard sa mga pana-panahong airdrop."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Mag-log in sa <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, pindutin ang F12 → Application → Local Storage, kopyahin ang value ng <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% ng uptime points ng mga direktang referral, 10% sa ikalawang level, 5% sa ikatlo"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "I-claim ang iyong Grass Stage 2 USDC"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Itinatabi ng Grass ang bawat Stage 2 allocation na hindi na-claim hanggang 22 Ene 2027, at puwedeng magsara nang mas maaga ang window kapag na-claim na ang lahat ng allocation."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Mag-sign in sa app.grass.io gamit ang account na ginamit mo sa Stage 2, i-activate ang Grass Wallet, buksan ang tab na Allocation at kumpirmahin. Sa app.grass.io ka lang mag-claim. Walang Stage 2 points? Piliin ang Hindi para sa akin."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Sa mga airdrop season lang dumarating ang mga reward. Iniulat ng mga matagal nang node operator na nasa ilang dolyar hanggang mababang dalawang-digit na dolyar ang tantiya nila para sa season 2."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "Tuluyang mawawala ang mga season 2 reward na hindi na-claim hanggang 22 Enero 2027."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "Umani ng batikos ang unang airdrop dahil sa maliit na reward kada point, na hinati sa mahigit dalawang milyong user."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "Hindi pinapatakbo ng CashPilot ang Grass: ginagamit mo ang sariling app o extension ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "Umabot ang unang airdrop sa halos 1.5 milyong address na nag-claim."
  source: "a4c55e10affa"
helium.description:
  text: "Ang Helium ay isang matatag nang decentralized wireless network. Dati itong mga LoRaWAN hotspot, ngayon ay umabot na sa 5G. Kailangan ng dedikadong hardware ($500+). Kumikita ng HNT/MOBILE token. Malaki na ang ibinaba ng ROI - karaniwang $4-8/buwan.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "Decentralized wireless network - kailangan ng hardware, HNT token"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "Kailangang bumili ng hardware na $500+. Malaki na ang ibinaba ng ROI. May approval process para sa mga bagong operator."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "Batay sa epoch"
  source: "75743e03bad2"
helium.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "Tinapos ng HIP 149 ang Proof-of-Coverage reward noong 6 Hulyo 2026; ngayon ay kumikita lang ang mga IoT hotspot para sa data na dinadala nila, at mahigit 114,000 sa kanila ang walang dinalang anuman."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Ilang beses nang nagbago sa pamamagitan ng botohan ang reward model ng Helium, nagbitiw ang CEO nito, at bumagsak nang mga 96% ang HNT."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "Hindi pinapatakbo ng CashPilot ang Helium: ginagamit mo ang sariling hotspot hardware ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "Open source ang hotspot gateway software sa ilalim ng Apache-2.0 licence."
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "Subaybayan ang hindi pa nababayarang Kaspa na balanse na hawak ng HeroMiners para sa iyong public na payout address. Patakbuhin ang sarili mong Kaspa miner at ituro ito sa pool. Binabasa ng CashPilot ang balanse sa pool at hihilingin nitong kumpirmahin mo ang mga payout kapag bumaba ang balanse.\n"
  source: "d27cc4c96f02"
