  text: "Nag-iiba ayon sa lokasyon. Mas malaki ang kita ng mga IP sa US/EU. Hanggang 10 device kada account."
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "Minimum $20 (20,000 credit). Dalawang opsyon: PayPal sa pamamagitan ng Tipalti, na may mga 15% fee, o JumpTask credit na walang fee, na ipinapasok sa isang JumpTask wallet. Kailangan ng request ang 6-digit na code na ipinadala sa email. Mananatiling \"waiting for details\" ang unang PayPal payout hangga't hindi ka nagrerehistro sa Tipalti mula sa link na ie-email nila. Isang beses lang gumagana ang link na iyon, kaya buksan ito kapag kaya mong tapusin nang tuloy-tuloy at hawak mo ang telepono mo: pagkatapos magtakda ng password, ipapakumpirma ng Tipalti ang isang mobile number sa SMS (nag-e-expire ang mga code sa loob ng ilang minuto), pagkatapos ay hihingin ang iyong pangalan, address, bansa at petsa ng kapanganakan, at ang iyong PayPal address. Naniningil ang Tipalti ng $2.02 kada bayad; piliin ang USD para maiwasan ang 1.9-3% na currency conversion fee nito. Darating ang bayad sa loob ng 2 business day. Aalis agad sa account mo ang balanse sa sandaling mag-request ka, kahit naghihintay pa ang payout sa Tipalti. Bawat susunod na login sa Tipalti ay magpapadala ng bagong SMS code maliban kung i-tick mo ang opsyong tandaan ang device sa loob ng 30 araw. Noong Oktubre 2026, hindi humingi ang Tipalti ng tax form sa isang payee sa Spain."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Hawak ng Honeygain ang balanse; iwi-withdraw kapag hiniling."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Gamitin ang email at password ng iyong Honeygain account (pareho sa <a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a>)."
  source: "fd0be22aeb14"
honeygain.referral.bonus.referrer:
  text: "Hanggang 25% ng kita ng bawat ni-refer na kaibigan sa Honeygain mode"
  source: "30385153a66b"
honeygain.referral.bonus.referee:
  text: "$3 na sign-up bonus gamit ang link na ito"
  source: "9ee5d2215305"
honeygain.obligations.withdraw-before-24-month-write-off.title:
  text: "I-withdraw ang iyong Honeygain balanse"
  source: "0868662c5a12"
honeygain.obligations.keep-active-6-months.title:
