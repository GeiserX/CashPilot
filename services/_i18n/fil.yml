mysterium.description:
  text: "Ang MystNodes (Mysterium Network) ay isang decentralized na VPN at proxy network na binuo sa blockchain technology. Kumikita ka ng MYST token sa pagpapatakbo ng node na nagbibigay ng VPN, proxy at data scraping service sa mga user. Kailangan nito ang mga capability na NET_ADMIN, SETUID at SETGID at isang TUN device, na ginagamit nito sa loob ng sarili nitong network namespace sa naka-bakod na earner bridge. May kasama itong built-in na web UI para sa pamamahala ng node. Gumagana ito sa parehong residential at VPS na koneksyon, pero binabayaran lang ang referral bonus para sa mga node na nasa residential IP.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Decentralized VPN node - batay sa blockchain, gumagana sa VPS"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "WebUI address"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "Saklaw ng UDP port"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "Ang mga host address kung saan inilalathala ang WebUI ng node (port 4449). Pinapanatili ito ng 127.0.0.1 sa makinang ito lang. Para maabot ito sa pamamagitan ng reverse proxy, idagdag ang address na kinokonektahan ng proxy, pinaghihiwalay ng kuwit at walang espasyo: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "Ang mga UDP port na ginagamit ng node para sa mga VPN session, bilang start:end. I-forward ang parehong saklaw na ito sa iyong router. Mga dalawang port ang ginagamit ng bawat session, kaya kaya ng default na 30 ang mga 15 session nang sabay-sabay, higit pa sa natatanggap ng isang home node. Walang naaayos ang mas malawak na saklaw at mas magastos pa: pinababagal ng bawat inilathalang port ang pag-start at pag-alis ng node (mga 12 s bago mag-start ang 300 port), hanggang 300 lang ang tinatanggap ng CashPilot, at sa default na userland proxy ng Docker, gumagamit din ang bawat port ng mga 2.5 MB na memory. Kapag pumapalya ang lahat ng session, problema iyon ng router, hindi kakulangan ng port: tingnan ang \"Routers that rewrite UDP source ports\" sa Mysterium guide. Panatilihin itong mas mababa sa 32768: ang mga port na 32768-60999 ay ang ephemeral range ng Linux, kung saan puwedeng humawak saglit ng isa ang kahit anong program sa host, at isang nakuhang port lang ay magpapapalya sa pag-start ng node. Pinapanatili ng node na may saklaw na ang saklaw nito."
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "Ang identity keystore ng node. Kapag nasira ito, gagawa ng bagong-bagong identity: mawawala sa node ang reputasyon nito at ang anumang kitang nakahawak pa sa luma."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "Hindi makapagpatakbo ng sudo ang node sa loob ng container nito, kaya hindi nito ma-configure ang VPN interface o firewall nito at pumapalya ang bawat session sa setup: mukhang online ito pero walang kinikita. Ginawa ang container nang walang mga capability na SETUID at SETGID. I-update ang CashPilot at ang worker na nagpapatakbo sa node na ito, pagkatapos ay i-redeploy ang Mysterium mula sa dashboard; nasa data volume nito ang identity ng node at mananatili ito."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "Walang VPN session sa nakaraang 6 na oras ang direktang nakaabot sa node na ito. Lahat ay bumagsak sa hole punching, at maraming buyer ang hindi makakonekta sa ganoong paraan, kaya mas maliit ang kinikita ng node. Hindi maaabot mula sa internet ang mga UDP port nito. Sa iyong router, i-forward ang saklaw ng UDP port na ${UDP_PORTS} (start:end, parehong saklaw sa magkabilang panig) papunta sa ${HOST_ADDRESS}. Kusa itong mawawala kapag may session na direktang nakakonekta."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Minarkahan ng monitoring ng Mysterium na failed ang node sa ${WORKER_NAME}, kaya hindi ito kasama sa listahan ng node na pinagpipilian ng karamihan ng buyer, kahit sinasabi ng sarili nitong check na naaabot ang lahat ng port. Siguraduhin muna na may /dev/net/tun at SETUID/SETGID ang node, dahil ganito rin ang pagpalya kapag wala ang mga ito: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Kapag nandiyan na ang mga iyon, karaniwang sanhi ang router sa harap ng ${WORKER_NAME} na binabago ang UDP source port ng mga sagot ng node kapag may packet na mula sa labas na nakaabot sa port na iyon. Tingnan ang test sa gabay: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "Natapos ang bawat isa sa huling limang VPN session ng node sa ${WORKER_NAME} matapos ang mga isang minuto nang walang nailipat na data, kaya walang kinikita ito kahit mukhang online. Malamang na sanhi ang router sa harap ng ${WORKER_NAME}: kapag may packet na mula sa labas na nakaabot sa isang port, binabago nito ang source port ng mga susunod na sagot ng node mula sa port na iyon, at nagsisimula ang bawat session sa ganoong packet (ang sariling port check ng node), kaya itinatapon ng mga buyer ang mga sagot ng node. Hindi nakakatulong ang mas malawak na saklaw ng port. Tingnan ang test at ang mga solusyon sa gabay: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Mawawala ito kapag may session na nakapagdala ng data."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Kita sa MYST token. Mas malaki nang husto ang kita ng mga residential IP. Nasa port 4449 ang WebUI ng node para sa pamamahala, at bilang default ay inilalathala lang ito sa makinang pinagtatakbuhan nito (127.0.0.1); mula sa ibang makina, magbukas muna ng SSH tunnel (ssh -L 14449:127.0.0.1:4449 na sinusundan ng address ng makina ng node, pagkatapos ay buksan ang http://127.0.0.1:14449; local port 14449 para hindi ito bumangga sa node sa sarili mong makina), o magdagdag ng address sa UI_ADDRESS (tingnan ang WebUI address sa Mysterium guide). Tinatanggap ang VPS. Lubos na inirerekomenda ang port forwarding ng UDP 23000-23029 (ang default ng UDP_PORTS) -- kung wala ito, magkakaroon ng Strict NAT status ang mga node at maraming VPN session ang papalya, na malaki ang bawas sa kita. Mahalaga: pagkatapos ng unang takbo, itakda ang iyong beneficiary (settlement) wallet sa WebUI o CLI ng node para tumugma sa iyong mystnodes.com account -- ito ang nagli-link ng on-chain na kita sa iyong cloud dashboard."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Awtomatikong on-chain settlement tuwing may 5 MYST na hindi pa na-settle ang isang node"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Walang button na pipindutin. Kusang nagse-settle sa Polygon ang bawat node kapag may 5 MYST na itong hindi pa na-settle, at mga 21% ang napupunta sa fee (ang 20% na Hermes fee dagdag ang maliit na transaction fee), kaya mga 3.9 MYST ang umaabot sa beneficiary wallet kada settlement. Inililista ng TequilAPI ng bawat node ang mga settlement nito sa /transactor/settle/history. Ang numerong \"total earnings\" sa MystNodes ay para lang sa nakaraang 30 araw; hindi ito balanse at hindi rin kabuuang kita mula sa simula. Hindi kusang nagse-settle ang bonus MYST mula sa rewards program ng MystNodes: i-claim ito sa Rewards page, sa loob ng 30 araw mula sa distribution ayon sa help center ng MystNodes."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "Itinatakda ang beneficiary wallet PAGKATAPOS mag-deploy, sa TequilAPI o sa WebUI ng node -- hindi sa env var, kaya hindi ito mababasa mula sa container spec."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Gamitin ang email at password ng iyong MystNodes account (pareho sa <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST kada kaibigang kumita ng 5 MYST ang node (residential IP lang)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST kapag kumita na ang node mo ng unang 5 MYST nito (residential IP, node na na-claim sa mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "I-claim ang MystNodes reward noong nakaraang buwan"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Mawawala ang mga reward na hindi na-claim sa loob ng 30 araw mula sa buwanang distribution at babalik ang mga ito sa pool ng susunod na buwan."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Buksan ang Rewards page at ipalit ang iyong points sa MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Bandwidth. Ginagamit ang koneksyon mo bilang exit node ng Mysterium network, na nagbebenta ng VPN, proxy AT data-scraping service. Ang scraping traffic na lumalabas sa residential IP ang paggamit na pinakamalamang na umani ng reklamo, at hindi mo mapipili kung alin sa tatlo ang dadalhin ng node mo."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Oo. Idinadaan ng mga estranghero ang traffic nila sa iyong IP address — iyon mismo ang produkto."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "Ang identity ng node (isang blockchain address), ang iyong IP, at ang tinatayang lokasyon (bansa/lungsod/ISP), na inilalathala ng node sa network para mapili ito ng mga buyer."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Totoo at sulit na maintindihan. Lumalabas sa koneksyon mo ang traffic ng ibang tao na nakapangalan sa iyo, kaya anumang gawin nila ay mukhang nanggaling sa linya mo. Ipinagbabawal ito ng maraming kontrata ng consumer ISP. Tingnan muna ang sa iyo bago ito patakbuhin."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Walang limitasyon sa device kada account at kada IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Mga 21% ng bawat settlement ang napupunta sa fee, ang 20% na Hermes fee dagdag ang transaction fee, at binabayaran ang kita sa MYST token."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Exit ang node mo para sa mga VPN, proxy at data-scraping customer ng Mysterium, at hindi mo mapipili kung alin sa kanila ang dadalhin nito."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "Open source ang node software sa ilalim ng GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Naglalathala ang Mysterium ng sarili nitong Docker image, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "Napupunta ang settlement sa wallet na pag-aari mo; hindi kailangan ng phone number o ID."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "Tumatakbo ang node project mula pa noong 2017."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Sinasabi ng site ng Mysterium na dine-develop ang network ng Blockdev AG, Zug, Switzerland."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Ang Nodepay ay isang DePIN network na nagbibigay ng reward sa mga user na nagshe-share ng bandwidth sa pamamagitan ng browser extension. Nasa likod ng Cloudflare protection ang platform, na puwedeng magpahirap sa awtomatikong access. Kumikita ang mga user ng Nodepay Points sa pagpapanatiling aktibo ng extension. Nakatuon ang network sa pagbibigay ng infrastructure para sa AI training data.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "DePIN bandwidth sharing para sa AI - browser extension"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Kumikita ng Nodepay Points; ang points ng mga user na papasa sa eligibility check ng Nodepay ay kino-convert sa NC token. Puwedeng i-block ng Cloudflare protection ang awtomatikong pagkolekta. Kailangan ang browser extension."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "NC token airdrop (hindi pa kumpirmado ang petsa)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Sistemang batay sa points. Ang points ng mga user na papasa sa eligibility check ng Nodepay ay kino-convert sa NC token, na inilunsad noong Enero 2025."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "Sa review ng unang season nito, tinanggal ng Nodepay ang mahigit 300,000 account na itinuring nitong bot at kinansela ang 17 bilyong points."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Points ang mga reward na kino-convert sa NC token, kaya nakasalalay sa token ang halaga nila."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "Hindi pinapatakbo ng CashPilot ang Nodepay: ginagamit mo ang sariling browser extension ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "08a3715c74a3"
noderr.description:
  text: "Ang Noderr Micronodes ay ang libreng entry tier ng Noderr Protocol, isang DeFi project sa Base L2. Ang micronode ay isang maliit na agent sa isang ekstrang Android phone, Windows PC, Mac o Chromium browser. Sa Android, shine-share nito ang mobile connection ng telepono: lumalabas ang ibang Noderr traffic sa carrier IP ng telepono, kaya kailangan nito ng SIM na may mobile data. Sa PC o sa browser, nagpapatakbo ito ng mga automation task para sa protocol gamit ang ekstrang compute. Dinisenyo ang mga reward para bayaran sa NODR, ayon sa on-chain na score ng uptime at pagiging maaasahan, pero nasa Base Sepolia testnet ang network habang beta pa ito: walang pondo ang mga node reward at wala pang naibabayad.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Libreng micronode (Android connection sharing, Windows, Mac, browser) - testnet, walang pondo pa ang mga reward"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Testnet beta: walang pondo ang mga node reward at wala pang naibabayad. Ang 5-10% APY sa site ay target ng disenyo. Balikan kapag umalis na ang network sa Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Naiipon ang mga reward sa sariling wallet ng node at kini-claim mula sa app o sa dApp. Habang beta, Base Sepolia testnet token ang mga ito na walang halaga sa merkado."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "Ginagawa ng app ang node wallet sa unang launch at nagmi-mint dito ng libreng soulbound na Utility NFT. I-backup ang wallet mula sa app: kapag nawala ang device, mawawala ang identity ng node. Nasa Base Sepolia (testnet) ang mga reward habang beta."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Kailangan ng Android ng SIM na may mobile data; walang inilathalang IP requirement para sa desktop at browser client."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Nakadepende sa device. Ibinebenta ng Android phone ang mobile connection nito: lumalabas ang ibang Noderr traffic sa carrier IP address ng telepono at binabawas ito sa data plan nito. Ibinebenta ng Windows PC, Mac o browser ang ekstrang compute para sa tinatawag ng provider na social media at content automation task."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Oo. Sa Android, lumalabas ang ibang Noderr traffic sa mobile IP address ng telepono mo; humihingi ang app ng consent na nire-record bago ito magsimula at puwede mong itigil ang pag-share mula sa parehong screen. Para sa Windows, Mac at browser client, mga automation task ang inilalarawan ng provider at hindi nito sinasabi kung nagdadala ang mga iyon ng traffic para sa ibang tao."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "Napupunta on-chain ang wallet address ng node at ang mga numero ng uptime at natapos na task nito bilang reputation score (ang TrustFingerprint). Sinasabi ng provider na anonymised ang mga task, tumatakbo sa sandbox at hindi kailanman umaalis sa device ang wallet key. Wala nang mas tiyak na inilathala."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Sa Android, carrier mobile plan ang shine-share na koneksyon: nagbababala mismo ang docs ng provider na maaaring hindi pinapayagan ang pag-share sa ilalim ng acceptable-use policy ng ilang carrier, at ginagamit ng shine-share na traffic ang allowance ng plan. Para sa desktop at browser client, walang sinasabi ang provider tungkol sa mga termino ng ISP."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Isang node kada device, bawat isa ay may sariling soulbound na Utility NFT; pinapayagan at hinihikayat ang pagpapatakbo ng maraming device. Walang inilathalang limitasyon kada IP. Walang account sa karaniwang kahulugan: ang identity ay isang wallet na ginagawa ng app sa unang launch."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Walang pondong testnet token ang mga node reward na walang halaga sa merkado, at wala pang naibabayad; ang 5 hanggang 10% APY sa site nito ay target ng disenyo."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Para sa desktop at browser client, mga automation task ang inilalarawan ng Noderr at hindi nito sinasabi kung nagdadala ang mga ito ng traffic ng ibang tao."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Sinasabi ng provider na anonymised at naka-sandbox ang mga task pero wala nang mas tiyak na inilalathala."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Testnet beta pa rin sa Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "Hindi pinapatakbo ng CashPilot ang Noderr: ginagamit mo ang sariling app o extension ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Walang account: gumagawa ang app ng wallet sa unang launch."
  source: "bf85f2f80b20"
nodle.description:
  text: "Ginagamit ng Nodle ang Bluetooth ng smartphone para bumuo ng IoT infrastructure. Pasibong nade-detect at ipinapasa ng app ang data mula sa mga kalapit na IoT device, at kumikita ng NODL token. Itinampok sa Forbes, may mga enterprise partnership sa Vivendi at Hayden AI. Mobile lang (iOS at Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Bluetooth IoT relay - mobile app, reward sa NODL token"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Napakaliit ng kita. Phone app sa background na gumagamit ng Bluetooth. Puwedeng pumalya-palya ang pag-connect ng wallet."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Tuloy-tuloy"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "Nasa sariling wallet ng app sa ZKsync Era ang NODL; tingnan ito sa app o sa isang ZKsync Era block explorer. Umalis ang Nodle sa Polkadot parachain nito, at nagsara ang Polkadot-to-ZKsync bridge noong 31 Disyembre 2025, kaya hindi na maililipat sa ZKsync ang NODL na nasa panig pa ng Polkadot."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "Nasa sariling wallet ng Nodle app sa ZKsync Era ang iyong NODL. Hindi nakikita ng CashPilot ang address ng wallet na iyon."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "Isang NODL reward para sa bawat bagong aktibong user na sasali gamit ang invite (hindi inilalathala ng Nodle ang halaga)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Iniulat ng isang reviewer na mga $3 ang kinita niya sa loob ng tatlo hanggang apat na taon; iniulat naman ng iba na matindi ang pagbaba ng araw-araw na kita."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "Hindi pinapatakbo ng CashPilot ang Nodle: ginagamit mo ang sariling phone app ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "6b6132c859c2"
nosana.description:
  text: "Ang Nosana ay isang decentralized GPU compute marketplace na binuo sa Solana. Ikinokonekta nito ang mga may-ari ng GPU sa demand para sa AI workload, at nagbabayad sa NOS token. Kumikita ang RTX 3060 ng humigit-kumulang $0.048/oras. Nakatuon ang platform sa mga AI inference workload at ginagamit ang Solana blockchain para sa job scheduling at payment settlement. Nagpapatakbo ang mga node ng mga containerized workload sa pamamagitan ng Nosana CLI.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "GPU compute sa Solana - NOS token, RTX 3060 ~$0.048/oras"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/oras, mas malaki ang kita ng mas mataas na klase ng GPU. Nakadepende ang kita sa dami ng job at sa modelo ng GPU. Kailangan ng NVIDIA GPU, Linux, Docker at Nosana CLI. Bayad sa NOS token sa Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "Kada natapos na job"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "NOS token ang kinikita sa Solana. Payout sa naka-configure na wallet."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Bilang default, gumagawa ang Nosana ng Solana wallet, kaya hindi pa nakikita ng karamihan sa mga user ang address nito."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Kailangang mag-lock ang bawat host ng NOS stake na katumbas ng oras-oras na presyo ng GPU nito."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Binabayaran sa NOS ang mga host, kaya gumagalaw ang kita sa dolyar kasabay ng token at ng demand para sa card nila."
