  source: "155106be1173"
proxyrack.docker.env.UUID.description:
  text: "Natatanging 64-character na hex ID kada device. Gumawa nito gamit ang: cat /dev/urandom | tr -dc 'a-f0-9' | fold -w 64 | head -n 1"
  source: "5de5d7264318"
proxyrack.docker.env.API_KEY.description:
  text: "Mag-log in sa <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → ipinapakita ang API Key sa main dashboard page (awtomatikong irerehistro ang device kung ibibigay mo ito). Kailangan ng account? Mag-sign up gamit ang <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
  source: "96df71a6ca26"
proxyrack.docker.env.DEVICE_NAME.description:
  text: "Madaling tandaang pangalan para sa device sa dashboard"
  source: "df01af60b81c"
proxyrack.docker.health_signals.0.means:
  text: "Hindi makatakbo ang client ng ProxyRack sa kopyang ito, kaya wala itong kinikita. Kadalasan, hindi sumasagot ang update server ng ProxyRack, at hindi makapagsimula ang client kung wala ito. Sinusubukan ulit ng kopya kada 5 minuto at kusa itong magsisimula kapag sumagot na ang server. Wala kang kailangang ayusin."
  source: "0df8b8cfac10"
proxyrack.docker.health_signals.1.means:
  text: "Hindi na-download ang client ng ProxyRack noong nagsimula ang kopyang ito, dahil hindi maabot ang update server ng ProxyRack, kaya tumatakbo ang kopya pero walang kinikita. Nire-restart ito ng CashPilot kada 6 na oras para subukan ulit. I-redeploy ito para makuha nito ang sariling start ng CashPilot, na nagtatabi ng client at kusang sumusubok ulit kada 5 minuto."
  source: "0a2ee4b478b2"
proxyrack.device_link.steps:
  text: "Mag-sign in sa ProxyRack, buksan ang Devices, piliin ang Add device at i-paste ang UUID na ito. Hangga't wala sa account mo ang device, wala itong kinikita para sa kahit sino. Kung naglagay ka ng API key, kusang magrerehistro ang container: tingnan kung nakalista roon ang device."
  source: "54c4041903b5"
proxyrack.earnings.notes:
  text: "Mas malaki ang kita ng mga residential IP kaysa sa datacenter. Puwedeng magpahirap sa awtomatikong access ang dashboard na nasa likod ng Cloudflare."
  source: "b6e36d751afd"
proxyrack.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
proxyrack.cashout.notes:
  text: "Mag-request ng payout sa dashboard. Sinusuri ito ng ProxyRack sa loob ng 72 oras, pagkatapos ay mag-e-email sa iyo ang Tremendous ng reward na ire-redeem bilang PayPal, gift card o wire transfer. Walang crypto na opsyon."
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "Hawak ng ProxyRack ang balanse; iwi-withdraw kapag hiniling."
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "Mag-log in sa <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, pindutin ang F12 → Network, maghanap ng kahit anong API request at kopyahin ang value ng header na <b>Api-Key</b>. Kailangan ng account? Mag-sign up gamit ang <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "Dinodokumento ng Proxyrack ang limitasyong 500 device kada ACCOUNT at walang limitasyon kada IP. Tinatanggap ang mga datacentre IP pero inililipat sa mas mababang rate."
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "Sinasabi ng help centre ng ProxyRack na kapag inalis ang isang device, tatanggalin din sa account mo ang kita ng device na iyon, at babalik lang ito kung idadagdag ulit ang parehong device."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "Naglalathala ang ProxyRack ng sarili nitong Docker image, proxyrack/pop, at tumatanggap ng mga datacentre IP sa mas mababang rate."
  source: "278541f81053"
repocket.description:
  text: "Hinahayaan ka ng Repocket na kumita ng passive income sa pag-share ng hindi mo nagagamit na internet bandwidth. Pinakamalaki ang kita ng mga residential IP; tinatanggap ang mga VPS/datacenter IP sa mas mababang rate. Hanggang 5 device at 5 aktibong session kada account. Nag-a-authenticate ang Docker container gamit ang email ng iyong account at isang API key mula sa Repocket dashboard (hindi ang password mo).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Bandwidth sharing - hanggang 5 device, API key na auth"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "API Key (UUIDv4, hindi ang password mo)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "Ang email ng iyong Repocket account"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Ang iyong Repocket API key — mag-log in sa <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> at kopyahin ang API key na ipinapakita sa bandwidth-earnings page (HINDI ito ang password ng account mo). Kailangan ng account? Mag-sign up gamit ang <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "Mas malaki ang kita ng mga residential IP. Tinatanggap ang mga VPS/datacenter IP pero sa mas mababang rate."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 pagkatapos ng unang payout)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Itinatakda ng Repocket ang minimum kada account: $4 bago ang unang payout at $2 pagkatapos nito noong Oktubre 2026, malayong mas mababa sa $20 na dati nitong ina-advertise. Mga paraan: Tremendous (sa iyong email) o USDT sa Polygon. Kinukumpirma ang bawat request mula sa link na ie-email sa loob ng 2 oras, at isang request lang ang puwedeng nakabinbin sa isang pagkakataon. Noong Oktubre 2026, tinanggihan ng Repocket ang isang Tremendous request na may \"Please, message support\", habang pumasok naman ang USDT sa Polygon."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Hawak ng Repocket ang balanse; iwi-withdraw kapag hiniling."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Gamitin ang email at password ng iyong Repocket account (pareho sa <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Kailangan ng account? Mag-sign up gamit ang <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2 kapag kumita na ng $7 ang ni-refer, pagkatapos ay 5% ng kanilang kita habambuhay"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "$2 na wallet bonus sa pag-sign up"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Dinodokumento ng Repocket ang limitasyong limang device kada ACCOUNT pero walang inilalathalang limitasyon ng device kada IP. Walang pinagmulang galing sa provider ang numerong '2 device kada IP' na inuulit sa mga review site, kaya hindi ito iginigiit ng CashPilot."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Panatilihing nagshe-share ang isang Repocket device, o i-withdraw ang iyong balanse"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Pagkatapos ng 12 buwang walang login, payout o bandwidth sharing, puwedeng kunin ng Repocket ang hindi pa nababayarang balanse."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Panatilihing nagshe-share ang isang device, mag-sign in, o mag-withdraw. Kung titigil ka na sa paggamit ng Repocket, mag-withdraw muna."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Iniulat ng ilang reviewer sa Trustpilot na kinansela ang mga payout nila at na-reset sa zero ang balanse; sinabi ng isa na binanggit ng support ang iregular na kita sa bandwidth. Binibigyan ng page ang Repocket ng 2.7 at napansin nitong hindi ito sumasagot sa mga negatibong review."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Iniulat ng mga reviewer na tinanggihan ang mga withdrawal nila at kinailangan nilang habulin ang bayad."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Pinapayagan ng payment policy ng Repocket na bawiin, kanselahin o permanenteng kunin nito ang kita tuwing hinihinala nitong hindi ito valid, at kunin ang hindi pa nababayarang kita ng dormant na account."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "Pinapayagan din ng parehong policy ang Repocket na magdagdag, mag-alis o magpalit ng mga payout method anumang oras nang walang abiso; inalis na ang PayPal."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Sinasabi ng mga termino na puwedeng humingi ang Repocket ng identity o account verification anumang oras, at nakadepende rito kung makakapag-payout ka."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Sinasabi ng mga termino na ginagamit ng Repocket at ng mga partner nito ang network capacity, pero hindi sinasabi kung sino ang mga partner o paano sila sinusuri."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Napansin ng Trustpilot na hindi sumasagot ang Repocket sa mga negatibong review, at sinasabi ng mga reviewer na hindi pinapansin ang mga mensahe."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "Pinapangalanan ng kasalukuyang mga termino ang Repocket Pte. Ltd. sa Singapore; walang kumpanyang pinangalanan ang mga dating termino."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Naglalathala ang Repocket ng sarili nitong Docker image, repocket/repocket, at pinapayagan ng mga termino nito ang mga container na pag-aari mo."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Mababa ang minimum: $4 bago ang unang payout at $2 pagkatapos nito."
  source: "ff8121a15aeb"
salad.description:
  text: "Hinahayaan ka ng Salad.io na i-share ang iyong GPU para sa mga distributed AI workload at kumita ng Salad balance na puwedeng i-redeem sa gift card, laro o cash. Windows lang, may native na desktop application. Kailangan ng dedikadong GPU (NVIDIA o AMD). Idinadaan ng platform sa makina mo ang AI inference, rendering at iba pang compute task kapag idle ito. Isa sa mas madaling gamiting GPU sharing platform.\n"
  source: "09335baccea6"
salad.short_description:
  text: "GPU sharing para sa AI - Windows lang, payout sa gift card o cash"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Nakadepende ang kita sa modelo ng GPU at sa dami ng trabaho. RTX 3060 ~$1-3/araw. Windows lang. Native app, walang Docker support. Puwedeng i-redeem sa gift card, laro o PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal o gift card sa pamamagitan ng Salad storefront."
  source: "5128232e4f57"
salad.payout.notes:
  text: "PayPal at gift card lang, hindi kailanman crypto. Walang wallet address, kaya walang on-chain na balance na maipapakita ang CashPilot."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Mag-log in sa <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, pindutin ang F12 → Application → Cookies, kopyahin ang value ng cookie na <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Kumita ng ilang Salad Reward Points, o gastusin ang iyong balanse"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Kung walang kinitang Reward Points ang isang account sa loob ng 12 sunod-sunod na buwan, puwedeng mag-expire ang hindi pa nare-redeem na balanse nito."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Patakbuhin ang Salad app hanggang kumita ito, o gastusin ang buong balanse sa Salad Storefront. Hindi nire-reset ng paggastos ng bahagi lang nito ang 12 buwan."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "Hindi pinapatakbo ng CashPilot ang Salad: ginagamit mo ang sariling desktop app ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Iniulat ng ilang reviewer sa Trustpilot noong Oktubre at Nobyembre 2026 na mabilis dumating ang mga PayPal cash-out, ang ilan ay higit sa isang beses; sinabi naman ng isang reviewer sa parehong panahon na pumalya ang paulit-ulit niyang pagsubok na mag-cash out."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Ang Sentinel ay isang Layer 1 Cosmos blockchain para sa decentralized VPN. Nagbebenta ng bandwidth ang mga node operator sa mga VPN user na may flexible na presyo (kada GB o kada oras). May opisyal na Docker deployment guide. Matagal nang tumatakbong proyekto na may aktibong komunidad.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "Decentralized VPN sa Cosmos - nagbebenta ng bandwidth ang mga node operator"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Ang mga operator ang nagtatakda ng sarili nilang presyo kada GB o kada oras. Nakadepende ang kita sa demand ng mga VPN user sa rehiyon mo."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Kada session"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Nasa P2P token ang bayad, at 20% ng bawat bandwidth payment ay napupunta sa mga staker sa halip na sa host ng node."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "Pinalitan ang pangalan ng token mula SENT tungong DVPN noong 2021 at mula DVPN tungong P2P noong 2025."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "Hindi pinapatakbo ng CashPilot ang Sentinel: ginagamit mo ang sariling node software ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Inilalathala ng Sentinel ang source code ng node nito sa ilalim ng sarili nitong open source licence."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Ang Sia ay isang decentralized storage marketplace na pinapatakbo ng Sia Foundation (isang Swiss non-profit) at tumatakbo mula pa noong 2015. Patakbuhin ang opisyal na hostd node ng Foundation para paupahan ang ekstrang disk space at kumita ng Siacoin mula sa mga storage at bandwidth contract. Kailangan mong bumili muna ng kaunting Siacoin bago makakita ang node: nagla-lock ang mga host ng collateral para sa bawat contract at nagbabayad ng fee para sa bawat storage proof. Ibinabalik ang collateral kapag natapos ang isang contract at sinusunog ito kapag nag-offline o nawalan ng data ang node, kaya kailangan nito ng makinang laging bukas (sinasabi ng Sia na hindi bababa sa 95% na uptime). Nakadepende ang kita sa dami ng data na talagang iniimbak ng mga renter; inirerekomenda ng Sia na presyuhan ang storage ng $1 kada TB kada buwan, kaya bagay ito sa mga makinang may malaking ekstrang disk kaysa sa maliliit na VPS.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Storage node ng Sia Foundation - opisyal na Docker image, kumita ng Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Seed phrase ng wallet"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Password ng dashboard"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Storage directory"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "BIP-39 seed phrase na kumokontrol sa Siacoin wallet ng host. Gumawa nito gamit ang `docker run --rm ghcr.io/siafoundation/hostd seed` at i-backup ito -- ito LANG ang paraan para maabot ang kita"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Password para sa hostd web UI at local API (BasicAuth). Kahit anong mahabang passphrase"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Host path sa pinakamalaki mong disk kung saan iniimbak ang data ng renter (hal. /srv/sia). Kailangan ng hindi bababa sa 256GB na bakante"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Sa pag-deploy, gagawa ang CashPilot ng bagong wallet sa makinang nagpapatakbo ng node at ipapakita nang isang beses ang seed phrase nito: isulat ito. Para gumamit ng wallet na mayroon ka na, i-paste na lang ang seed phrase nito. Pagkatapos mag-deploy, magpadala ng kaunting Siacoin sa wallet ng node para sa collateral at fee, pagkatapos ay idagdag ang storage folder (/storage), itakda ang mga presyo at i-announce ang host sa dashboard.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "Ang seed phrase ng wallet (hostd.yml), ang wallet database, mga setting ng host at ang state ng mga contract. Kapag nawala ito, mawawala ang identity ng node at ang pagsubaybay sa kita mula sa mga contract; ang seed phrase na isinulat mo na lang ang tanging paraan para mabawi ang pondo."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Ang naka-imbak na data ng renter. Kapag nawala ito, papalya ang mga storage proof at mawawala ang collateral na naka-lock para sa mga contract na iyon."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Ang mga host ang nagtatakda ng sarili nilang presyo. Inirerekomenda ng Sia ang $1 kada TB na naka-imbak kada buwan at higit sa $5 kada TB na na-download, at 3.9% ng bawat contract payout ay napupunta sa mga may hawak ng Siafund. Tumataas ang kita ayon sa dami ng data ng renter na napupunta sa node, na nagsisimula sa zero at lumalaki kasabay ng uptime at presyo. Naka-lock kada contract ang collateral (iminumungkahi ng Sia ang 2x ng presyo ng storage) at ibinabalik kapag matagumpay na natapos.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Naiipon ang kita sa sariling Siacoin wallet ng host (kontrolado ng seed). I-convert ang SC sa isang exchange at mula roon mag-withdraw sa bangko/card; walang payout request sa panig ng provider.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Nasa Sia wallet na kontrolado ng seed sa loob ng node ang pondo. Nasa data volume lang ng hostd sa makinang nagpapatakbo nito ang seed phrase; hindi ito kailanman sine-save ng CashPilot. Ang phrase na isinulat mo nang gawin ang wallet ang tanging paraan para mabawi ito.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Isang stable na public address na naka-forward ang mga port na 9981 (TCP, consensus) at 9984 (TCP at UDP, mga contract ng renter). Karaniwan sa Sia ang datacenter/VPS hosting. Kailangan ng wallet ng Siacoin bago makatanggap ng contract ang node."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Disk space at ang bandwidth para maibigay ito."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Hindi. Nag-iimbak ang mga renter ng mga naka-encrypt na piraso ng file sa disk mo at kinukuha nila ulit ang mga ito. Walang ibang taong nagdadaan ng kung anu-anong traffic sa IP mo."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Ang iyong Sia wallet address, ang public key ng host, at ang public na IP:port na ina-announce ng node para maabot ito ng mga renter."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Tuloy-tuloy na upload/download traffic sa linya, katulad ng pagpapatakbo ng kahit anong storage server; walang anonymised na third-party web traffic na iniuugnay sa iyo."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Permissionless: walang sign-up o account. Sinusunog ang collateral kapag hindi nakagawa ng storage proof ang node, dahil nag-offline ito o nawalan ng data."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Siacoin sa sarili mong wallet ang kita: walang payout sa bangko, kaya ikaw mismo ang magbebenta sa exchange."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "Naka-lock kada contract ang collateral at sinusunog kapag hindi nakagawa ng storage proof ang host dahil nag-offline ito o nawalan ng data."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Mga 30% lang ng storage na iniaalok sa network ang ginagamit, kaya kakaunti ang demand na pag-aagawan ng bagong host."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Nag-iimbak ang mga renter ng mga naka-encrypt na piraso ng file at walang nagdadaan ng traffic sa IP mo, pero hindi namin nakita kung saan sinasabi ng Sia kung sino ang mga renter o paano sila sinusuri."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "Hayagang dine-develop ng Sia Foundation ang hostd, mula pa noong 2022."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "Open source ang hostd sa ilalim ng MIT licence."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Inilalathala ng Sia Foundation ang hostd bilang container image."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Permissionless: walang sign-up o account."
  source: "f1f8d4114f1e"
spide.description:
  text: "Ang Spide ay isang bandwidth-sharing na serbisyo na hinahayaan kang pagkakitaan ang hindi mo nagagamit na internet bandwidth. Gumagamit ito ng opsyonal na machine ID para sa pagsubaybay sa device. Available ito sa pamamagitan ng mga community Docker image mula sa income-generator project.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Bandwidth sharing - batay sa machine ID"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "Machine ID"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "Machine ID para sa kasalukuyang device na nakarehistro na (awtomatikong gagawin kung walang laman)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Limitado ang available na impormasyon. Nakadepende sa lokasyon ang kita."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
spide.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% ng kanilang kita"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "$5 na sign-up bonus"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "Hinahati sa mga device na nagshe-share nito ang traffic na dumadaan sa isang public IP, kaya walang naidadagdag ang pangalawang device sa parehong koneksyon."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "Hindi pinapatakbo ng CashPilot ang Spide: ginagamit mo ang sariling app ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Mag-mine ng Pearl, Zano o Ravencoin gamit ang isang NVIDIA GPU. Dina-download ng CashPilot ang opisyal na SRBMiner-Multi release sa unang start at sinusuri ang SHA-256 nito. Ang pool na pinili mo ang nagbabayad sa iyong public na payout address. Kinukuha ng SRBMiner-Multi ang 2% ng hashing time sa Pearl at 0.85% sa dalawa pa. Puwedeng mas mahal ang kuryente kaysa sa mga coin na kikitain mo."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Mag-mine ng Pearl at iba pang GPU coin sa isang NVIDIA GPU"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Payout address"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "Pangalan ng worker"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "Algorithm"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "Pool (host:port)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "I-encrypt ang koneksyon sa pool (TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "Ang iyong public na Pearl address (prl1...). Para sa Zano o Ravencoin, ilagay ang address ng coin na iyon at isang pool para dito."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash para sa Pearl, progpow_zano para sa Zano, kawpow para sa Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.earnings.notes:
  text: "Gross na tantiya bago ang kuryente. Noong 2026-11-25, tinantiya ng hashrate.no na mga $2.45 kada araw sa Pearl para sa RTX 4070 na kumukonsumo ng mga 142 W. Hindi pa namin ito nasusukat. Bagong coin ang Pearl, at mabilis magbago ang presyo at difficulty nito. Tingnan ang konsumo ng iyong GPU at ang presyo ng kuryente mo para malaman kung sulit ito."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Kapag naabot ang threshold ng pool"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "Nagbabayad ang pool sa address mo kapag naabot na ng balanse mo ang iyong threshold. Hawak ng pool ang balanse hanggang bayaran ka nito."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, isang NVIDIA GPU at NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Hosting connection ang iniuulat ng makinang ito. Tingnan ang mga termino ng iyong provider bago mag-mine. May mga provider, kasama ang Hetzner Cloud, na nagbabawal nito. Alamin ang totoong gastos mo sa kuryente bago umasa sa isang tantiya ng kita."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "Para sa pearlhash ang 2% na miner fee. Kinukuha ng SRBMiner-Multi ang 0.85% sa progpow_zano at kawpow. Naniningil ang HeroMiners, ang default na Pearl pool, ng 1% na pool fee. Tinitingnan nito ang mga payout kada oras at nagbabayad mula 1 PRL. Ang ibang pool ang nagtatakda ng sarili nilang rate at threshold."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "compute"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "Hindi. Nagpapadala ang miner ng trabaho sa pool na pinili mo."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Napupunta sa pool ang iyong payout address, pangalan ng worker at IP address. Dina-download ng unang start ang miner mula sa GitHub."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "May mga network at DNS resolver na nagba-block ng koneksyon sa mga mining pool."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "Kinikilala ka ng karamihan ng pool gamit ang iyong public na payout address."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "Kinukuha ng miner ang 2% ng hashing time sa Pearl at 0.85% sa Zano at Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "May mga hosting provider na nagbabawal ng cryptocurrency mining."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "Closed source ang miner, kaya walang sinuman sa labas ng developer nito ang makakapag-audit kung ano ang pinapatakbo nito."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "Puwedeng mas mahal ang kuryente ng GPU kaysa sa mga coin na kinita, at mabilis gumalaw ang presyo ng Pearl."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "Nagpapadala ang miner ng trabaho sa pool at hindi nagpapasa ng traffic ng ibang tao."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Puwede kang mag-mine ng Pearl sa HeroMiners gamit ang public address at walang account."
  source: "1844ccbbc00a"
storj.description:
  text: "Ang Storj ay isang decentralized cloud storage network kung saan kumikita ka sa pagpapaupa ng hindi mo nagagamit na disk space. Patakbuhin ang storage node gamit ang Docker at mabayaran ng $1.35/TB na naka-imbak kada buwan dagdag ang $1/TB na egress (mga rate mula 1 Setyembre 2026). Buwanan ang payout sa USDC, isang stablecoin na naka-peg sa US dollar, sa Ethereum mainnet papunta sa wallet na kontrolado mo, kapag lumampas na ang balanse sa minimum na batay sa fee (STORJ token hanggang sa payout ng Setyembre 2026). Kailangan ng hindi bababa sa 550GB na available na disk space at stable na internet connection. Hindi kailangan ng account o sign-up -- permissionless na ang mga node mula kalagitnaan ng 2025. BABALA (Oktubre 2026): Nag-file ang Storj Labs ng Chapter 11 noong 26 Hulyo 2026 (US Bankruptcy Court, Northern District of West Virginia, kaso 5:26-bk-00512) para i-restructure ang lumang utang. Patuloy na tumatakbo ang network at patuloy na nagbabayad ang Storj sa mga aktibong node, pero naka-freeze ang kita ng mga node bago ang filing hanggang magpasya ang korte tungkol dito. Bumaba nang mga 98% ang STORJ token mula sa peak nito noong 2021. Dinelist ito ng Binance noong 3 Setyembre 2026, at sinuspinde ng Coinbase ang trading nito noong 28 Setyembre 2026. Pinipigilan ng bagong node ang bahagi ng kita nito sa unang siyam na buwan at napupuno lang ito ayon sa pinapayagan ng demand ng customer, kaya ang pagsisimula ng isa ngayon ay nagtatali ng mahabang payback sa isang kumpanyang nire-restructure na puwede pang magsara.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Decentralized storage node - $1.35/TB na naka-imbak + $1/TB na egress"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Wallet address"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "External address"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Storage allocation"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Identity directory"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Storage directory"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Ethereum wallet address para sa mga USDC payout (hal. 0x1234...abcd). Dapat self-custodial (MetaMask, Ledger, atbp.) -- huwag kailanman gumamit ng address ng exchange"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "Email address para sa mga notification sa operator"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "DDNS hostname na may port (hal. mynode.ddns.net:28967) -- mas mainam ito kaysa sa literal na IP, na mag-iiwan sa node na hindi maabot sa araw na tahimik itong palitan ng ISP mo. Dapat naka-forward ang port 28967 (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Pinakamalaking disk space na ilalaan (hal. 2TB). Gumamit ng spinning disk (HDD), hindi SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Host path kung saan naka-imbak ang mga identity file (dapat may ca.cert, ca.key, identity.cert, identity.key)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Host path sa isang spinning disk (HDD) para sa data storage ng Storj. Kailangan ng hindi bababa sa 550GB na bakante"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Bago ang unang takbo, i-initialize ang config ng storage node: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Ang identity ng node. Nakatali sa proof-of-work ang ID nito at ilang oras bago ito magawa ulit, at hindi ito magagawang muli mula sa backup ng anumang ibang bagay. Kapag nawala ito, mawawala ang nakatabing payout balance."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Ang naka-imbak na data ng customer at ang nakatabing halaga ng node. Kapag nawala ito, madi-disqualify ang node at mawawala ang nakatabing balanse."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Hindi ma-dial pabalik ng Storj network ang node mo sa ina-advertise nitong ADDRESS, kaya itinuturing itong offline ng mga satellite: titigil ang pagdating ng bagong data, hihinto ang kita mula sa egress, at hahantong sa suspension ang matagal na pagka-offline. Tingnan kung tugma ang ADDRESS sa KASALUKUYANG public IP mo (gumamit ng DDNS hostname, hindi literal na IP, para hindi maiwang hindi maabot ang node kapag pinalitan ng ISP ang IP) at kung naka-forward sa makinang ito ang port 28967 TCP+UDP."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB na naka-imbak + $1/TB na egress + $1/TB na audit/repair mula 1 Setyembre 2026. Tumataas ang kita ayon sa data na naka-imbak at sa edad ng node. Sa unang 9 na buwan, pinipigilan ang 75%, pagkatapos ay 50%, pagkatapos ay 25% ng kita; ibinabalik ang kalahati ng nakatabing halaga sa ika-16 na buwan at ang natitira sa graceful exit. Dapat naka-forward ang port 28967."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4x ng Ethereum transaction fee, ipinapasa sa susunod ang mas maliliit na balanse"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Buwanan"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Binabayaran buwan-buwan sa USDC sa Ethereum mainnet kapag ang balanse ng wallet ay hindi bababa sa apat na beses ng kasalukuyang transaction fee; ipinapasa sa susunod na buwan ang mas maliliit na balanse. STORJ token hanggang sa payout ng Setyembre 2026. Dashboard sa port 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Binabayaran buwan-buwan sa USDC sa Ethereum mainnet sa address na nasa WALLET kapag lumampas na ang balanse sa minimum na batay sa fee. STORJ token hanggang sa payout ng Setyembre 2026; natapos ang mga zkSync Era payout noong 1 Setyembre 2026."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "Ang URL ng node dashboard sa port 14002, gamit ang LAN IP ng server sa halip na localhost, halimbawa <b>http://192.168.1.10:14002</b>. Para sa maraming node, ilista ang mga URL nila na pinaghihiwalay ng kuwit: pagsasamahin ng CashPilot ang mga ito."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Naghahati sa data allocation ang mga Storj node sa parehong /24 subnet, kaya bumababa ang kita kada node."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps na upload"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Disk space at ang bandwidth para maibigay ito."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Hindi. Nag-iimbak ka ng mga naka-encrypt at erasure-coded na piraso ng data ng customer. Walang ibang taong nagdadaan ng sarili nilang traffic sa IP mo."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "Ang identity ng node, ang iyong wallet address, ang email address na hinihingi ng node para sa mga notification sa operator, at ang iyong IP at port, na dapat maaabot para makapagbigay ng data ang node."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "Kadalasan ay tanong ito ng data cap kaysa ng pananagutan: tuloy-tuloy na nagbibigay at tumatanggap ng data ng customer ang node, na totoong tuloy-tuloy na traffic sa linya mo. Pero hindi tulad ng proxy o relay, hindi ito anonymised na third-party traffic na iniuugnay sa iyo bilang pinagmulan, kaya hindi ito umaakit ng mga abuse complaint na gaya ng sa mga iyon."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Walang limitasyon sa dami ng node, pero naghahati sa allocation ang mga node sa parehong /24 subnet, kaya mas maliit ang kita ng bawat isa kapag marami sa iisang koneksyon."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "Iniulat ng CoinDesk noong 27 Hulyo 2026 na nag-file ang Storj Labs para sa Chapter 11 bankruptcy protection."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Napunta sa bankruptcy claims process ang mga bayad sa mga node operator bago ang filing."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "Sa bagong node, pinipigilan ang 75%, pagkatapos ay 50%, pagkatapos ay 25% ng kita nito sa unang siyam na buwan; ibinabalik ang kalahati sa ika-16 na buwan at ang natitira ay sa graceful exit lang."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Nag-iimbak ang mga customer ng mga naka-encrypt na piraso ng file at walang nagdadaan ng traffic sa IP mo, pero hindi namin nakita kung saan sinasabi ng Storj kung sino ang mga customer o paano sila sinusuri."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "Open source ang storage node software sa ilalim ng AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Naglalathala ang Storj ng sarili nitong Docker image, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Walang account: isang wallet address at isang email para sa mga abiso sa operator."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Patuloy na nabayaran ang mga aktibong node pagkatapos ng filing."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "Ang SupportXMR ay isang Monero mining pool na walang account: nagla-log in ang iyong miner gamit ang iyong Monero address bilang username, at binabayaran ng pool ang address na iyon. Hindi nagpapatakbo ng miner dito ang CashPilot. Binabasa nito ang balanse na hawak ng SupportXMR para sa address mo, para makita mo ang kinita ng iyong CPU miner katabi ng iba mo pang kita. Ang balanse ay kinita na pero hindi pa natatanggap: binabayaran ito ng pool kapag lumampas na sa iyong payout threshold.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Monero mining pool, sinusubaybayan gamit ang iyong payout address"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (awtomatiko), 0.01 XMR kapag hiniling"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Kapag lumampas sa threshold mo ang balanse, o kapag hiniling"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "Nagbabayad ang SupportXMR sa address mo kapag naabot na ng balanse ang iyong threshold (0.1 XMR bilang default). Sa site nito, puwede ka ring mag-request ng instant payout mula 0.01 XMR, na may 0.001 XMR na fee."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Kinita na ang balanse pero hindi pa natatanggap hangga't hindi ito binabayaran ng SupportXMR sa address na ito. Hindi mababasa on-chain ang Monero balance nang walang private view key, na hindi kailanman hinihingi ng CashPilot, kaya ikaw mismo ang magkukumpirma ng bawat payout."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Ang iyong Monero payout address: ang username na ginagamit ng iyong miner sa SupportXMR, nang walang anumang bahaging <b>.workername</b> o <b>+difficulty</b>. Public ito at hindi nito nabubuksan ang anumang pondo."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Kailangan ng Monero miner (XMRig) na nakaturo sa pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "compute"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Hindi. Nagpapadala ang miner mo ng mga hash sa pool; walang nagdadaan ng traffic sa koneksyon mo."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Ang iyong Monero address, ang mga pangalan ng worker na pinili mo, ang iyong hashrate at ang IP address ng iyong miner ayon sa nakikita ng pool."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Isang koneksyon lang sa pool ang pinananatiling bukas ng miner at kaunti lang ang bandwidth na ginagamit nito. Kuryente ang gastos na dapat bantayan, hindi ang ISP mo."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Walang account. Ang address ang identity, at kahit sino ay puwedeng magbasa ng stats nito sa supportxmr.com."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Monero lang ang bayad, may 0.6% na pool fee at 0.1 XMR na default threshold bago ang awtomatikong payout."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "Hindi nagpapatakbo ang CashPilot ng miner para sa SupportXMR: ikaw ang magtuturo ng sarili mong miner sa pool, at binabasa lang ng CashPilot ang balanse."
  source: "dfddab40ccc1"
teneo.description:
  text: "Binibigyan ng Teneo Protocol ang mga AI agent ng access sa live na web sa pamamagitan ng network ng mga Beacon. Ang Teneo Beacon ay sariling app ng Teneo para sa Android, iOS, macOS, Windows at Linux, na may command-line version para sa mga server at Raspberry Pi. Shine-share nito ang hindi mo nagagamit na bandwidth pagkatapos mong tanggapin ang consent screen nito, at kumikita ng Teneo Protocol Points at Fragments habang online ito. Binibilang ang Fragments sa mga seasonal draw na binabayaran sa USDC (ang Beacon Drop). Sinasabi ng Teneo na doble ang points na kinikita ng Beacon kumpara sa mas lumang browser extension nito. Isang Beacon lang ang kumikita kada internet connection. Naka-standby ang ibang device sa parehong koneksyon. Mag-sign up sa Expedition Hub gamit ang referral link o ang code na PSA3BHPJ, pagkatapos ay mag-sign in sa Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "DePIN bandwidth app (Beacon) - Fragments para sa seasonal USDC draw, +100 Fragments gamit ang referral link"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Kumikita ng Teneo Points at Fragments. Binibilang ang Fragments sa mga seasonal USDC draw, kaya premyo ang ibinabayad ng isang season, hindi rate. Sinasabi ng Teneo na doble ang points na kinikita ng Beacon kumpara sa browser extension. I-claim ang boost kada 8 oras para sa hanggang 3x na Fragments; bababa ang multiplier kapag may na-miss na window."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Seasonal draw (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Binabayaran sa USDC ang mga premyo ng Beacon Drop sa wallet na ibi-bind mo sa Expedition Hub. Ipinapakita ng Hub kung ilang araw ang mayroon ka para mag-bind ng isa; mawawala ang premyong walang naka-bind na wallet sa tamang oras."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Mag-bind ng wallet sa Expedition Hub bago bayaran ang mga premyo ng isang season; kinukuha ng Hub ang premyong hindi na-bind ang wallet sa tamang oras."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% ng Fragments ng bawat ni-refer na kaibigan at 2% ng Fragments ng kanilang mga referral, kapag nag-sign up ang kaibigan sa loob ng 7 araw at kumita ng 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments sa pag-sign up, at +150 pa kapag naabot mo ang 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "Isang Beacon lang ang kumikita kada internet connection. Kumikita lang ang mga datacentre machine sa mga hosting provider na in-enable ng Teneo, sa kalahati ng Fragments at walang points o referral bonus. Hindi kailanman kumikita ang mga VPN connection."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Nagbabayad lang ng USDC ang Fragments ng Beacon bilang premyo sa mga seasonal draw, kaya walang tiyak na halagang kinikita sa pagpapatakbo nito."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Sinasabi ng Teneo na pagsasamahin ang points sa $AGENTIC, isang hindi naililipat na reward token, hindi sa $TENEO token."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "Hanggang Nobyembre 2026, walang nakumpirmang launch date, allocation o claim process ng $TENEO, matapos lumipas ang naunang target na ikalawang quarter ng 2026."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "Hindi pinapatakbo ng CashPilot ang Teneo: ikaw ang mag-i-install ng sariling Beacon app ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Sinasabi ng Teneo na galing ang traffic sa mga nasuring business customer at bina-block nito ang mga private address at mga port na madalas abusuhin, pero hindi nito sinasabi kung paano nito sinusuri ang mga customer na iyon."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Ang Theta Network ay isang matatag nang decentralized network para sa video delivery at AI compute (mula 2018). Nagpapatakbo ang mga user ng mga Edge Node na nagshe-share ng bandwidth, storage at compute power. May malalaking content partnership. Kumikita ng TFUEL token.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "Decentralized CDN + AI compute - TFUEL reward, matatag nang proyekto"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Desktop app lang. Nakadepende ang kita sa resources at lokasyon. May malalaking partnership, nakalista sa lahat ng exchange."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Tuloy-tuloy"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "Hindi pinapatakbo ng CashPilot ang Theta Edge: ginagamit mo ang sariling desktop app ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "893de938ed14"
titan.description:
  text: "Ang Titan Network ay isang DePIN platform na nagshe-share ng iyong IP address, storage at bandwidth kapalit ng TNT token reward. Available sa Windows, Mac at Android. Nag-aambag ang mga node sa isang decentralized na CDN at storage layer. Karaniwang $5-30/buwan ang kita depende sa resources na shine-share at sa heograpikong lokasyon.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN na nagshe-share ng IP, storage, bandwidth - $5-30/buwan"
  source: "799e68401067"
titan.earnings.notes:
  text: "Nagshe-share ng IP, storage at bandwidth. Nakadepende ang kita sa resources na iniambag at sa rehiyon. Mas mataas ang reward kapag mas malaki ang inilaang storage."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Batay sa epoch"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Sinasabi mismo ng help ng Titan na hindi garantisado ang kita ng tumatakbong node: kapag walang task na naka-assign, wala itong kinikita, at nasa TNT token ang mga reward."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "Hindi pinapatakbo ng CashPilot ang Titan: ginagamit mo ang sariling app o extension ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Hinahayaan ka ng Traffmonetizer na pagkakitaan ang iyong internet traffic sa pag-share ng bandwidth sa mga verified na negosyo. Isa ito sa iilang bandwidth-sharing na serbisyo na maayos gumagana sa mga VPS at datacenter IP bukod pa sa residential na koneksyon. Gumagamit ito ng simpleng token-based na authentication na ipinapasa sa mga command-line argument. Suportado ang mga ARM architecture para sa Raspberry Pi at mga katulad na device.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Bandwidth sharing - gumagana sa VPS, token-based na auth"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Token"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Pangalan ng device"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Mag-log in sa <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, pindutin ang F12 → Application → Local Storage → i-click ang <code>https://app.traffmonetizer.io</code> → kopyahin ang value ng <code>authToken</code> (mga 54 na character: mga digit, isang <code>|</code>, pagkatapos ay mga letra at digit)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Pangalang ipinapakita sa dashboard para sa pamamahala ng device"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "Mas maliit ang kita ng mga VPS at datacenter IP kaysa sa residential. Mas malaki ang kita ng mga lokasyon sa US/EU. Suportado ang maraming IP sa pamamagitan ng mga Docker network."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Minimum $10. Wala nang PayPal. Mag-save muna ng isang payout method sa profile: USDT sa Solana o TON (pinakamababang fee), Arbitrum (mababang fee) o Tron TRC20 (mataas na network fee), o bank transfer mula $1,000. Agad na magagamit ang unang address na i-save mo; kapag binago ito kalaunan, kailangan ng email confirmation. Puwedeng humingi ang dashboard ng messenger contact (WhatsApp, Telegram o Skype) bago ang unang withdrawal. Buong dolyar lang ang ibinabayad ng request at naiiwan sa balanse ang mga sentimo."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT sa chain na naka-save sa payout settings ng profile (Solana, TON, Arbitrum o Tron), o bank transfer. Nasa settings ng Traffmonetizer ang address, hindi sa container."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Mag-log in sa <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, pindutin ang F12 → Application → Local Storage → value ng <b>authToken</b> (mga 54 na character: mga digit, isang <code>|</code>, pagkatapos ay mga letra at digit)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% ng bawat payout na hihilingin nila"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Hinihingi ng ToS ng Traffmonetizer ang residential IP, pero sa praktika ay tinatanggap ang mga VPS node."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "1.9 ang rating nito sa Trustpilot; iniulat ng mga reviewer mula 2023 hanggang Nobyembre 2026 na nakabinbin nang ilang linggo ang mga payout, o minarkahang tapos na pero walang katugmang transaksyon."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Iniulat din ng parehong mga reviewer na hindi sumasagot ang live chat at email support, minsan nang ilang linggo."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Crypto o bank wire mula $1,000 lang; wala nang PayPal, at buong dolyar lang ang ibinabayad ng request."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Hinihingi ng mga termino ng Traffmonetizer ang residential IP, kaya labas sa mga ito ang server na nasa hosting connection."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Iniulat ng apat na reviewer sa Trustpilot mula 2023 hanggang 2025 na napakabagal ng kita, gaya ng isang sentimo kada araw sa apat na device, o halos dalawang taon bago umabot sa $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Naka-save na crypto address lang na kinumpirma sa email ang kailangan para sa payout; puwedeng humingi ang dashboard ng messenger contact."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Naglalathala ang Traffmonetizer ng sarili nitong Docker image, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Mag-mine gamit ang iyong CPU at mabayaran sa coin na pipiliin mo, gaya ng SHIB, DOGE o XMR. Pinapatakbo ng CashPilot ang XMRig laban sa RandomX pool ng unMineable, at kino-convert ng unMineable ang Monero na mina-mine ng CPU mo sa coin mo. Binabayaran nito ang iyong public address kapag naabot na ng balanse mo ang payment threshold ng coin. Dala ng bawat worker na idine-deploy ng CashPilot ang unMineable referral code ng CashPilot, na nagpapababa sa iyong platform fee mula 1% tungong 0.75%. Puwedeng mas mahal ang kuryente kaysa sa kinikita mo."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Mag-mine gamit ang iyong CPU at mabayaran sa coin na pipiliin mo"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "Payout coin"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "Payout address"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "Pangalan ng worker"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "Max na CPU thread (%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "RandomX mode"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "Ticker ng coin na ibinabayad ng unMineable, gaya ng SHIB, DOGE o XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "Ang iyong public address para sa coin na iyon. Hindi suportado ang mga coin na nangangailangan ng memo o tag."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Gross na tantiya bago ang kuryente, binabayaran sa coin mo ayon sa conversion rate ng unMineable. Noong 2026-11-25, ang 1 kH/s ng RandomX ay nagkakahalaga ng mga $1 kada buwan. Ang desktop CPU na nasa kalahati ng mga thread nito ay puwedeng kumonsumo ng dagdag na 30 hanggang 50 W. Tingnan ang totoong konsumo mo at ang presyo ng kuryente para malaman kung sulit ito."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "Itinatakda ng unMineable kada coin (0.03 XMR noong 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Kapag naabot ang payment threshold ng coin"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "Nagbabayad ang unMineable sa address mo kapag naabot na ng balanse mo ang payment threshold ng coin. Iba-iba ang threshold ayon sa coin at network; binabasa ng CashPilot ang iniuulat ng unMineable para sa address mo."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Kinita na ang balanse pero hindi pa natatanggap hangga't hindi ito binabayaran ng unMineable sa address na ito. Nakadepende sa coin na pipiliin mo ang chain."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "Ang parehong payout address at coin ticker na ginamit mo sa pag-deploy ng miner, halimbawa <b>XMR</b>. Ilagay ang address lang, nang walang coin, pangalan ng worker o referral code. Public ito at hindi nito nabubuksan ang anumang pondo."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% ng mining reward ng bawat ni-refer na miner"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Ibinaba ang platform fee mula 1% tungong 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Hosting connection ang iniuulat ng makinang ito. Tingnan ang mga termino ng iyong provider bago mag-mine. May mga provider, kasama ang Hetzner Cloud, na nagbabawal nito. Alamin ang totoong gastos mo sa kuryente bago umasa sa isang tantiya ng kita."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "Naniningil ang unMineable ng 1% na platform fee. Idinadagdag ng CashPilot ang referral code nito (#awk6-j1z0) pagkatapos ng bawat pangalan ng worker, na nagpapababa sa fee mo sa 0.75%. Pagkatapos ay binabayaran ng unMineable ang maintainer ng CashPilot ng 0.25% ng iyong mining reward; sa iyo ang 99.25%. May sariling payment threshold ang bawat coin, halimbawa 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "compute"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "Hindi. Nagpapadala ang miner ng trabaho sa pool ng unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "Napupunta sa unMineable ang iyong payout address, coin, pangalan ng worker, hashrate at IP address."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "May mga network at DNS resolver na nagba-block ng koneksyon sa mga mining pool."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "Hindi kailangan ng account. Ang address at coin ang identity, at kahit sino ay puwedeng magbasa ng stats nila sa unmineable.com."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "Kinukuha ng unMineable ang 0.75% na platform fee kapag may referral code at nagbabayad lang mula sa threshold ng bawat coin."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "May mga hosting provider na nagbabawal ng cryptocurrency mining."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "Puwedeng mas mahal ang dagdag na kuryente kaysa sa mga coin na kinita."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "Public sa kahit sinong nakakaalam ng address ang stats nito, kasama ang balanse."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "Nagpapadala ang miner ng mga hash sa pool at hindi nagpapasa ng traffic ng ibang tao."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Puwede kang mag-mine papunta sa isang public address sa coin na pipiliin mo nang hindi gumagawa ng account."
  source: "c0b45001dc5c"
uprock.description:
  text: "Ang Uprock ay isang DePIN (Decentralized Physical Infrastructure Network) platform na hinahayaan kang kumita ng cryptocurrency sa pag-share ng iyong internet connection. Bahagi ito ng mas malawak na Web3 ecosystem. May mga community Docker image pero walang opisyal na image. Browser extension ang pangunahing interface.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "DePIN internet sharing - crypto payout, pangunahing browser extension"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Kita na batay sa crypto/token. Walang opisyal na Docker image — browser extension ang pangunahing client."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
uprock.cashout.notes:
  text: "UPT token, iwi-withdraw sa Solana wallet mula 250 UPT, nang naka-on ang two-factor authentication. May withdrawal fee."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "Sinasabi ng help centre ng UpRock na UPT token ang mga withdrawal papunta sa Solana wallet, na may 250 UPT na minimum."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "UPT token ang mga reward; sinasabi ng mga reviewer at ng isang third-party review na napakababa ng halaga nila."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "Hindi pinapatakbo ng CashPilot ang UpRock: ginagamit mo ang sariling app o extension ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "51f68f082425"
urnetwork.description:
  text: "Ang URnetwork ay isang decentralized na VPN at bandwidth-sharing network. Kumikita ka sa pagbibigay ng bandwidth bilang community provider. Nag-a-authenticate ang provider binary gamit ang email at password ng iyong account (ang auth-provide subcommand nito) at sine-save ang nakuhang session JWT sa data volume. Opisyal na Docker image mula sa BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "Decentralized VPN/bandwidth - email+password na auth, JWT session sa volume"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "Email"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Password"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "Ang email ng iyong URnetwork account (ang login na ginagamit mo sa <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Kailangang magtakda muna ng password ang mga account na ginawa gamit ang Google/Apple sign-in. Kailangan ng account? Mag-sign up gamit ang <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "Ang password ng iyong URnetwork account (walang espasyo). Ginagamit ito ng auth-provide login ng provider; pagkatapos ay mananatili ang session sa data volume."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Gumagana sa VPS at residential. Binabayaran sa SN25α (Bittensor subnet 25) kada lingguhang epoch mula 2026-10-06. Suportado ang proxy mode para sa mga setup na maraming IP."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "Batay sa epoch"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Magtakda ng Bittensor coldkey sa ur.io/app/account/earnings (naka-sign gamit ang Talisman, TAO.com o isang WalletConnect wallet), pagkatapos ay i-claim ang bawat natapos na epoch. Nagbabayad ang isang claim ng gas sa TAO mula sa isang EVM gas key. NAG-E-EXPIRE ANG MGA EPOCH NA HINDI NA-CLAIM, at kinansela ang mga lumang USDC payout kapag walang wallet na na-link sa loob ng 30 araw."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB kada araw ng libreng UR data kada kaibigan, hanggang 20 kaibigan (data, hindi pera)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB kada araw ng libreng UR data kapag nakagamit ka ng hindi bababa sa 10 MiB sa app sa loob ng 2 araw sa unang 90 araw mula nang sumali; kung hindi, matatapos ang referral"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Nag-e-expire ang mga epoch na hindi na-claim, at kinansela ang mga lumang USDC payout para sa mga network na walang na-link na wallet sa loob ng 30 araw."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "Mula Oktubre 2026, binabayaran ang mga reward sa SN25α, isang Bittensor subnet token, at bawat claim ay may gastos na gas sa TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "Dating BringYour ang URnetwork; dala pa ng naka-archive nitong whitepaper ang lumang pangalan."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "Inilalathala ng URnetwork ang source code ng provider client nito."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "Naglalathala ang URnetwork ng sarili nitong Docker image, bringyour/community-provider, at gumagana ito sa VPS at residential na koneksyon."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Bittensor wallet lang na kontrolado mo ang kailangan para sa isang claim."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Ang Vast.ai ay isang GPU cloud marketplace kung saan pinapaupahan mo ang iyong NVIDIA GPU sa mga AI/ML researcher at developer. Docker-native na platform kung saan ikaw ang nagtatakda ng sarili mong oras-oras na presyo. Karaniwang kumikita ang RTX 3090 ng $0.20-0.40/oras kapag naka-rent. Kailangan ng NVIDIA GPU na may bagong driver at stable na internet connection. Malaki ang epekto ng modelo ng GPU, ng diskarte sa presyo at ng demand sa merkado sa kita.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "GPU marketplace - ikaw ang nagtatakda ng presyo, RTX 3090 ~$0.20-0.40/oras"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "API Key"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "Vast.ai host API key mula sa dashboard"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/oras, RTX 4090 ~$0.40-0.80/oras kapag naka-rent. Nag-iiba ang utilization. Kailangan ng NVIDIA GPU, Linux host, Docker at nvidia-container-toolkit. Ikaw ang nagtatakda ng presyo."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Lingguhan (tuwing Biyernes)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "Naiipon ang kita sa Vast.ai balance. Mag-withdraw sa pamamagitan ng Wise, PayPal o Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% ng ginagastos ng mga ni-refer na renter, habang buhay ang account nila, bilang referral credit; hanggang 75% ang puwedeng i-cash out mula sa isang dedikadong referral account"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Kumikita lang ang host habang naka-rent, at nakadepende sa uri ng rental at reliability score ang sariling numero ng Vast para sa isang consumer GPU."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "Hindi pinapatakbo ng CashPilot ang Vast.ai: ikaw ang mag-i-install ng host software ng Vast sa sarili mong GPU machine, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Binubuo ng Vast ang hosting sa paligid ng Docker sa isang Linux host."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Sinasabi ng Vast na ang rate na itinakda ng host ay ang rate na natatanggap nito, walang ibinabawas na fee."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "Dumadaan sa Wise, PayPal o Stripe ang mga payout mula sa $20 na minimum, na ini-invoice lingguhan; ipinapasa sa susunod na linggo ang mas maliit na balanse."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Ang Wipter ay isang bandwidth sharing platform na available sa Windows, Mac, Linux at Android. Sinasabi nitong nagbabayad ito ng hanggang $1/GB ng shine-share na bandwidth na may $20 na minimum payout threshold. Gumagana ang platform na katulad ng mga tradisyonal na bandwidth sharing app, na nagdadaan ng lehitimong traffic sa mga residential na koneksyon.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Bandwidth sharing - sinasabing hanggang $1/GB, minimum na payout $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Sinasabing hanggang $1/GB pero mas mababa ang totoong kita. Minimum na payout $20. Malaki ang pagkakaiba ng kita ayon sa lokasyon at demand."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "Kapag hiniling"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Walang web dashboard ang Wipter. Buksan ang Wipter desktop o phone app, mag-sign in, at doon mag-request ng payout kapag umabot na sa $20 ang balanse. USDT sa BNB Smart Chain (BEP20) lang ang ibinabayad ng Wipter, sa wallet na itinakda mo sa Payments section ng app; walang opsyong PayPal."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Hindi pa natutukoy: hindi pa nasusuri ng CashPilot kung saan itinatago ng serbisyong ito ang kita mo."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% ng kanilang kita sa traffic kapag naabot na nila ang payout minimum, para sa lahat ng kaibigang ni-refer mo"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "$5 na sign-up bonus"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "Hindi pinapatakbo ng CashPilot ang Wipter: ginagamit mo ang sariling desktop o phone app ng provider, kaya hindi ito kayang i-deploy o i-update ng CashPilot para sa iyo. Hindi nasuri ang mga termino nito para sa mga container."
  source: "fa32942c6b4f"
xmrig.description:
  text: "Mag-mine ng Monero gamit ang iyong CPU. Pinapatakbo ng CashPilot ang XMRig, at ang pool na pinili mo ang nagbabayad ng Monero sa iyong public na payout address. Ginagamit ng XMRig ang 1% ng hashing time para suportahan ang mga developer nito. Puwedeng mas mahal ang kuryente kaysa sa XMR na kikitain mo."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "Mag-mine ng Monero gamit ang iyong CPU at ang pool na gusto mo"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Monero address"
  source: "a888ebb3ae9b"
xmrig.docker.env.POOL_URL.label:
  text: "Pool"
  source: "f13024272c38"
xmrig.docker.env.WORKER_NAME.label:
  text: "Pangalan ng worker"
  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "Max na CPU thread (%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "RandomX mode"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "Gross na tantiya bago ang kuryente. Noong 2026-11-25, ang 1 kH/s ay nagkakahalaga ng mga $1 kada buwan sa naobserbahang presyo ng XMR at network difficulty. Ang desktop CPU na nasa kalahati ng mga thread nito ay puwedeng kumonsumo ng dagdag na 30 hanggang 50 W. Tingnan ang totoong konsumo mo at ang presyo ng kuryente para malaman kung sulit ito."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, pagkatapos mo itong ibaba)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Kapag naabot ang threshold ng pool"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "Nagbabayad ang pool sa iyong Monero address kapag naabot na ng balanse mo ang iyong threshold. Hawak ng pool ang balanse hanggang bayaran ka nito."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Hosting connection ang iniuulat ng makinang ito. Tingnan ang mga termino ng iyong provider bago mag-mine. May mga provider, kasama ang Hetzner Cloud, na nagbabawal nito. Alamin ang totoong gastos mo sa kuryente bago umasa sa isang tantiya ng kita."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "Naniningil ang MoneroOcean, ang default na pool, ng 0% na mining fee. 0.3 XMR ang default na payout threshold, at puwede mo itong ibaba sa 0.003 XMR. Puwedeng magkahalaga ng hanggang 0.0004 XMR ang mga payout na mas mababa sa 4 XMR. Ang ibang pool ang nagtatakda ng sarili nilang rate at threshold."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "compute"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "Hindi. Nagpapadala ang miner ng trabaho sa mga mining pool."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Napupunta sa pool ang iyong Monero address, pangalan ng worker at IP address."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "May mga network at DNS resolver na nagba-block ng koneksyon sa mga mining pool."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "Kinikilala ka ng karamihan ng Monero pool gamit ang iyong public na payout address."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Kailangan ng payout ang sapat na XMR para maabot ang threshold ng iyong pool."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "May mga hosting provider na nagbabawal ng cryptocurrency mining."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "Puwedeng mas mahal ang dagdag na kuryente kaysa sa XMR na kinita."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "Nagpapadala ang miner ng mga hash sa mga pool at hindi nagpapasa ng traffic ng ibang tao."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "Open source ang miner at naka-pin ng image ang isang signed na upstream release."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Puwede kang mag-mine gamit ang public na Monero address nang hindi nagpapakilala sa pangalan."
  source: "752cbb728aac"
