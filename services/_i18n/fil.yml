  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "Sa HeroMiners naiipon ang balanse. Tingnan sa iyong wallet ang halagang natanggap mo bago kumpirmahin ang isang payout sa CashPilot.\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "Ilagay ang buong public na Kaspa payout address na ginagamit ng iyong miner sa HeroMiners. Isama ang prefix na <b>kaspa:</b> at huwag isama ang pangalan ng worker.\n"
