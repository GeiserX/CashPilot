nosana.description:
  text: "Nosana, Solana üzerine kurulu merkeziyetsiz bir GPU işlem gücü pazarıdır. GPU sahiplerini yapay zekâ iş yükü talebiyle buluşturur ve NOS token ile ödeme yapar. Bir RTX 3060 saatte yaklaşık $0.048 kazanır. Platform yapay zekâ çıkarım (inference) iş yüklerine odaklanır ve iş planlaması ile ödeme mutabakatı için Solana blokzincirini kullanır. Düğümler, konteynerleştirilmiş iş yüklerini Nosana CLI ile çalıştırır.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Solana üzerinde GPU işlem gücü - NOS token, RTX 3060 saatte ~$0.048"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 saatte ~$0.048; daha üst seviye GPU'lar daha çok kazanır. Kazanç iş bulunabilirliğine ve GPU modeline bağlıdır. NVIDIA GPU, Linux, Docker ve Nosana CLI gerektirir. Ödemeler Solana üzerinde NOS token ile yapılır."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "Her iş tamamlandığında"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Solana üzerinde NOS token kazanılır. Ödeme yapılandırılmış cüzdana yapılır."
  source: "ac23db0b1896"
nosana.payout.notes:
