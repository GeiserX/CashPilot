proxybase-xyz.description:
  text: "ProxyBase Markets, yapay zekâ ajanları için oluşturulmuş bir SOCKS5 proxy pazarıdır. Satıcılar, alıcı trafiğini kendi internet bağlantıları üzerinden aktarmak için WebSocket ile bağlanan hafif bir Rust CLI daemon'ı çalıştırır ve satılan GB başına Tempo Chain üzerinde USDC kazanır. Otomatik yeniden bağlanmayla hem doğrudan (kendi bant genişliği) hem de upstream (harici proxy'leri yeniden satma) modlarını destekler. Alıcılar proxy oturumlarını ülkeye, İSS'ye ve bant genişliğine göre satın alır. Ödemeler Tempo Chain üzerindeki Machine Payments Protocol (MPP) aracılığıyla yapılır. Referans bağlantısı alıcılar içindir: konsolu bu bağlantıyla açan bir alıcı ilk yüklemesinde %10 ek kazanır.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - yapay zekâ ajanları için SOCKS5 pazarı, USDC ödeme. Bir cüzdan oluşturur; anahtarın tek kopyası onun biriminde durur"
  source: "818327893d5b"
