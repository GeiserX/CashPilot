srbminer-multi.description:
  text: "Tek bir NVIDIA GPU ile Pearl, Zano veya Ravencoin kazın. CashPilot ilk başlatmada resmi SRBMiner-Multi sürümünü indirir ve SHA-256 değerini kontrol eder. Seçtiğiniz havuz herkese açık ödeme adresinize ödeme yapar. SRBMiner-Multi, hash süresinin Pearl'de %2'sini, diğer ikisinde %0.85'ini alır. Elektrik, kazandığınız coin'lerden daha pahalıya gelebilir."
