  source: "a3ba173cae35"
honeygain.earnings.notes:
  text: "Konuma göre değişir. ABD/AB IP'leri daha çok kazanır. Hesap başına en fazla 10 cihaz."
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "Minimum $20 (20.000 kredi). İki seçenek vardır: Tipalti aracılığıyla PayPal, yaklaşık %15 ücretle, ya da ücretsiz olarak bir JumpTask cüzdanına ödenen JumpTask kredileri. Bir talep için e-postayla gönderilen 6 haneli bir kod gerekir. İlk PayPal ödemesi, size e-postayla gönderilen bağlantıdan Tipalti'ye kaydolana kadar \"bilgiler bekleniyor\" durumunda kalır. Bu bağlantı yalnızca bir kez çalışır; bu yüzden tek seferde bitirebileceğiniz ve telefonunuz yanınızdayken açın: şifre belirledikten sonra Tipalti bir cep telefonu numarasını SMS ile onaylamanızı ister (kodların süresi birkaç dakika içinde dolar), ardından adınızı, adresinizi, ülkenizi, doğum tarihinizi ve PayPal adresinizi sorar. Tipalti ödeme başına $2.02 ücret alır; %1.9-3'lük döviz çevirme ücretinden kaçınmak için USD seçin. Ödeme 2 iş günü içinde yapılır. Bakiye, ödeme Tipalti'yi beklerken bile, talep ettiğiniz anda hesabınızdan düşer. Sonraki her Tipalti girişinde, cihazı 30 gün hatırlama seçeneğini işaretlemediğiniz sürece yeni bir SMS kodu gönderilir. Ekim 2026'da Tipalti, İspanya'daki bir alıcıdan vergi formu istemedi."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Bakiye Honeygain'de tutulur; talep üzerine çekilir."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Honeygain hesabınızın e-posta adresini ve şifresini kullanın (<a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a> ile aynı)."
  source: "fd0be22aeb14"
honeygain.referral.bonus.referrer:
  text: "Honeygain modunda davet edilen her arkadaşın kazancının %25'ine kadar"
  source: "30385153a66b"
honeygain.referral.bonus.referee:
  text: "Bu bağlantıyla $3 kayıt bonusu"
  source: "9ee5d2215305"
honeygain.obligations.withdraw-before-24-month-write-off.title:
  text: "Honeygain bakiyenizi çekin"
  source: "0868662c5a12"
honeygain.obligations.keep-active-6-months.title:
  text: "Bir Honeygain cihazında paylaşımı sürdürün veya ödeme alın"
  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "Kazançlar, $20 minimuma ulaştıktan sonra 24 ay geçerli kalır. Honeygain bu süreden sonra ödenmemiş olanı silebilir."
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
  text: "Uygulama 6 aydan uzun süre kullanılmazsa Honeygain ödenmemiş bakiyeyi, $20'ın altında olsa bile, süresi dolmuş sayar."
  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "Bir cihazda paylaşımı sürdürün veya bir ödeme talep edin. JumpTask modunda bakiyenin değişmemesi normaldir, bu yüzden Bana uygun değil seçeneğini seçin."
  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "Koşullar, Honeygain'in $20 eşiğine ulaşıp 24 ay içinde ödenmeyen kazançları silmesine ve altı ay kullanılmayan kazançları süresi dolmuş saymasına izin verir."
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "Minimum tutar $20'dır ve PayPal ödemeleri, ödeme başına $2.02 ücret alan Tipalti üzerinden yapılır."
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "Koşullar, Honeygain'in bir hesabı askıya almasına ve yanıltıcı yollarla biriktirildiğini düşündüğü kazançları alıkoymasına veya silmesine izin verir."
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "İlk PayPal ödemesinden önce Tipalti, bir cep telefonu numarasını SMS ile onaylamanızı ve adınızı, adresinizi ve doğum tarihinizi vermenizi ister."
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "Koşullara göre kurumsal müşteriler trafiği herkese açık web verilerini toplamak için kullanır, ancak hiçbir müşterinin adı verilmez ve bağlantınızı hangi müşterinin kullandığını bilemezsiniz."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "Honeygain'in düşük kazanç yorumlarına verdiği yanıtlara göre kazanç ağ talebine ve konuma bağlıdır; yorumcular $20 minimuma ulaşmanın çok uzun sürdüğünü bildiriyor."
  source: "634fb331e65b"
honeygain.rating.pros.0.text:
  text: "Honeygain kendi Docker imajını yayımlar: honeygain/honeygain."
  source: "ea44bd3c855c"
honeygain.rating.pros.1.text:
  text: "Koşullar işletmeciyi açıkça belirtir: Litvanya'nın Vilnius kentinde kayıtlı Honeygain UAB."
  source: "579a169fcf35"
honeygain.rating.pros.2.text:
  text: "Honeygain'in basın sayfasına göre şirket 2019'da kuruldu."
  source: "a3bfbdb33f54"
ionet.description:
  text: "io.net, AI/ML iş yükleri için merkeziyetsiz bir GPU ağıdır. Kullanıcılardan ve veri merkezlerinden boşta duran GPU'ları bir araya getirir. Anlamlı bir kazanç için 8GB+ VRAM'li NVIDIA GPU gerektirir. Konteyner tabanlı dağıtımlar desteklenir.\n"
