  text: "Bir alıcının ilk yüklemesinde +%10"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "Bant genişliği, ProxyBase pazarındaki alıcılara satılan bir SOCKS5 proxy olarak."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Evet. Alıcılar trafiklerini sizin bağlantınız üzerinden yönlendirir; satılan şey tam olarak budur."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Makinenizde oluşturulan bir cüzdan adresi ve aktardığınız trafik hacmi."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Gerçek bir risk ve doğrudan ev bağlantıları için geçerli. Bilinmeyen alıcıların proxy trafiği sizin IP'nizden çıkar, bu yüzden kötüye kullanım şikâyetleri size gelir. Bu katalogda hizmeti veri merkezi adresleriyle sınırlayan hiçbir şey yoktur ve ev IP'leri daha çok kazanır; yani teşvik burada yanlış yönü gösteriyor: evde çalıştırmadan önce İSS'nizin koşullarını okuyun."
  source: "686837157681"
