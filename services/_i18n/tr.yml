  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Ayrılacak en fazla disk alanı (ör. 2TB). SSD değil, dönen diskler (HDD) kullanın"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
