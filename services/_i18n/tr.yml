  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream bu kopyanın IP adresini ev IP'si olmadığı gerekçesiyle reddediyor, bu yüzden hiçbir şey kazanmıyor. Bunu internet bağlantısı bir ev hattı olan bir makinede çalıştırın veya bu kopyayı kaldırın."
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "PacketStream'in bu IP adresinde zaten başka bir istemcisi var ve IP başına yalnızca birine ödeme yapıyor. Bu kopyayı veya aynı IP'yi paylaşan diğerini kaldırın."
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "Paylaşılan bant genişliği için GB başına $0.10 öder. Kazanç büyük ölçüde IP'nizin konumuna olan talebe bağlıdır."
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "Yalnızca PayPal, minimum $5, onaylamadan önce gösterilen %3 ücret. İlk para çekme işlemi PayPal e-posta adresinizi kaydeder; sonradan değiştirmek için e-posta onayı ve 7 günlük bekleme gerekir, bu yüzden onaylamadan önce adresi kontrol edin. Talepler incelenir ve 7 gün içinde gönderilir; bekleyen bir talebi iptal edebilirsiniz ve yeni bir talep ancak önceki ödendikten sonra oluşturulabilir."
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "Bakiye PacketStream'de tutulur; talep üzerine çekilir."
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "<a href='https://packetstream.io' target='_blank'>packetstream.io</a> adresinde oturum açın, F12'ye basın → Application → Cookies, <b>auth</b> çerezinin değerini kopyalayın (bir JWT'dir)."
  source: "15bae9d455f5"
