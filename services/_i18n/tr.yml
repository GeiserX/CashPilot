2miners-etc.description:
  text: "2Miners'ın herkese açık ETC ödeme adresiniz için tuttuğu ödenmemiş Ethereum Classic bakiyesini takip edin. Kendi madencinizi çalıştırın ve havuza yönlendirin. CashPilot bakiyeyi okur ve bakiye düştüğünde ödemeleri onaylamanızı ister.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Ethereum Classic madencilik havuzu, ödeme adresinizle takip edilir"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (ayarlanabilir)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "Havuz ödeme eşiğinizi iki saatte bir kontrol eder"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners, seçtiğiniz eşiğe ulaştığınızda adresinize otomatik olarak ödeme yapar. ETC ödemeleri için en düşük eşik 0.1 ETC'dir.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Ödenmemiş bakiye 2Miners'ta birikir. Cüzdan bakiyesi Ethereum Classic'ten ayrıca okunur. CashPilot'ta bir ödemeyi onaylamadan önce cüzdanınızda gelen tutarı kontrol edin.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Madencinizin 2Miners'ta kullandığı, <b>0x</b> ile başlayan herkese açık Ethereum Classic ödeme adresini girin. Worker adını eklemeyin.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "2Miners'a yönlendirilmiş bir ETCHash madencisi gerekir"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "işlem gücü"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Hayır. Madenciniz madencilik işini havuza gönderir."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "Havuz ödeme adresinizi, seçtiğiniz worker adlarını ve madencinizin IP adresini kullanır."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Ödeme adresiyle herkes istatistikleri görüntüleyebilir. Havuz, eşiği değiştirmek için worker IP onayı ister."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "Havuz %1 ücret alır ve eşiğinize ulaşılana kadar ödemeleri bekletir."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (eski adıyla ATOR), merkeziyetsiz bir onion yönlendirme gizlilik ağıdır. Düğüm operatörleri relay düğümleri çalıştırır ve sağladıkları bant genişliği için ANYONE token kazanır. \"Teşvikli Tor\" olarak düşünebilirsiniz. CashPilot bunu, projenin imzalı Debian paketinden amd64 ve arm64 için derlenen kendi imajıyla çalıştırır. Yapılandırma, konteynere bağlanan bir anonrc dosyasıyla yapılır (Nickname, ContactInfo, ORPort vb.). Bir relay, kendisi için en az 180 gün boyunca 100 ANYONE kilitlenene kadar hiçbir şey kazanmaz ve ödüller cüzdanınızda imza atılarak talep edilir. Relay ayrıca herkese açık IP'nizi ağın relay dizininde listeler; bu da ev bant genişliği uygulamalarının para ödediği IP itibarına zarar verebilir.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Merkeziyetsiz onion yönlendirme - teşvikli Tor relay düğümleri"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Relay'in ed25519 kimlik anahtarı. Silinirse relay'in itibarı sona erer ve kazanç geçmişi sıfırdan başlar."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Yalnızca relay başına en az 180 gün boyunca 100 ANYONE kilitliyse ve cüzdanınızda imzalanmış bir ödül talebi varsa ödeme yapar. Stake olmadan bir relay hiçbir şey kazanmaz. Stake ile kazanç, sağlanan bant genişliğine ve çalışma süresine bağlıdır."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Dönem (epoch) bazlı"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "anonrc içinde ContactInfo olarak, başına '@anon:0x...' eklenerek ayarlanır."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Virgülle ayrılmış relay parmak izleri. Hiçbir çevrimiçi pano bunları göstermez. CashPilot'un çalıştırdığı relay için, onu çalıştıran ana makinede <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> komutunu çalıştırın. Donanım relay'i için <b>http://relayup.local</b> adresinde Relay Control Panel'i açın ve Home sayfasındaki Fingerprint değerini okuyun.\n"
  source: "ffa5be0d4953"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Bant genişliği, Anyone ağında (bir Tor çatallaması) relay olarak."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Evet. Başkalarının trafiğini aktarır. IP'nizin son atlama noktası olup olmadığı, relay'in çıkış (exit) olarak yapılandırılıp yapılandırılmadığına bağlıdır."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "Relay'in herkese açık kimlik anahtarı, IP'niz ve portunuz ile çalışma süresi istatistikleri; bunların hepsi tasarım gereği ağ dizininde yayımlanır. anonrc dosyanızda ContactInfo ayarlarsanız o da orada yayımlanır ve kalıcı olarak, herkese açık şekilde dizinlenir. Genellikle bir e-posta adresidir; herkese açık olmasını istemiyorsanız boş bırakın."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Gerçek bir risk. Relay trafiği sizin bağlantınıza atfedilir. Özellikle çıkış relay'leri kötüye kullanım şikâyetleri çeker; birçok bireysel İSS bunları yasaklar."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Kaydolunacak bir hesap yoktur, dolayısıyla hesap başına sınırlanacak bir şey de yoktur. Yine de kazanmak için her relay için en az 180 gün boyunca 100 ANYONE kilitlenmiş bir Ethereum cüzdanına ihtiyacınız vardır ve CashPilot'un ödülleri okuyabilmesi için relay parmak izleri gerekir. Proje IP başına bir relay sınırı yayımlamaz ve katalog da bir sınır belirtmez."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Bir relay, kendisi için en az 180 gün boyunca 100 ANYONE kilitlenmedikçe hiçbir şey kazanmaz ve her ödül talebi cüzdanınızda imzalanır."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Tasarım gereği başkalarının trafiğini, kim olduklarını denetlemeden aktarır; çıkış relay'leri kötüye kullanım şikâyetleri çeker."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "Relay'in kimliği, IP'si ve çalışma süresi ağ dizininde yayımlanır ve ayarladığınız her ContactInfo kalıcı olarak herkese açık olur."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Kaydolunacak bir hesap yoktur. Bir relay için yalnızca bir cüzdan gerekir, kimlik kontrolü yoktur."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "Relay yazılımı, Tor'un lisansı altında yayımlanmış bir Tor çatallamasıdır."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot, Anyone'ın yayımladığı ve hesap gerektirmeyen relay yazılımından kendi imajını derler."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping, bir düğüm çalıştırmanız için size ödeme yapan merkeziyetsiz bir ağ izleme platformudur. Düğümünüz, Bitping müşterileri için web sitesi izleme, gecikme testi ve ağ kalitesi kontrolleri yapar. Hem ev hem de VPS bağlantılarında çalışır. Docker imajı ilk başlatmada BITPING_EMAIL ve BITPING_PASSWORD ortam değişkenleriyle oturum açar (kendi günlüğünde \"Attempting login with environment variables\"), ardından oturumu birim bağlantısında saklar; böylece yeniden başlatmalarda tekrar kimlik doğrulaması yapmaz.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Bant genişliği paylaşımı - merkeziyetsiz ağ izleme, VPS'te çalışır"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "E-posta"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Şifre"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "Bitping hesabınızın e-posta adresi (<a href='https://app.bitping.com' target='_blank'>app.bitping.com</a> ile aynı giriş bilgisi)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Bitping hesabınızın şifresi. Düğüm oturumunu oluşturmak için bir kez kullanılır; oturum daha sonra veri biriminde saklanır."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Kazanç, ağ kalitesine ve bulunduğunuz konumdan izleme talebine bağlıdır. VPS düğümleri kabul edilir."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Düğüm kazançları nodes.bitping.com'da bulunur; app.bitping.com ise API müşteri panosudur. Para çekme yalnızca SOL iledir: ödenmemiş bakiye $0.05'i aştığında talebe Solana adresini yazın; talep 24 saat içinde işlenir. Yeni veya boş bir Solana cüzdanında, ağın kira minimumu için önce yaklaşık 0.001 SOL bulunması gerekir."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Artık yalnızca Solana; adres saklanmaz, PARA ÇEKME SIRASINDA yazılır."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Bitping hesabınızın e-posta adresini ve şifresini kullanın (<a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a> ile aynı)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Bitping bakiyenizi çekin"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping, 12 aydan uzun süre talep edilmeyen kazançlara, e-postayla 30 gün önceden bildirimde bulunduktan sonra el koyabilir."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "nodes.bitping.com'da bir SOL para çekme talebi oluşturun ve Solana adresinizi talebe yazın."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Para çekme işlemleri Solana (SOL) ile, her talebe yazdığınız bir adrese ödenir."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Bitping'in yardım sayfasına göre yeni ve boş bir Solana cüzdanına para çekme işlemi, o cüzdana kendiniz biraz SOL yükleyene kadar başarısız olabilir."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Bitping'in yardım sayfasına göre sunucular ve Docker konteynerleri desteklenir."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Para çekmek için talebe yalnızca bir Solana adresi yazmanız yeterlidir."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit, PayPal ve Stripe üzerinden ödeme yapan bir bant genişliği paylaşım hizmetidir. Resmi bir Docker imajı yoktur; istemciler Windows masaüstü uygulaması ve Android uygulamasıdır. Hizmet bytebenefit.io adresindedir -- eski bytebenefit.com alan adı bırakıldı ve bir alan adı pazarında park edildi; bu yüzden burada bir zamanlar ölü olarak işaretlenmişti.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Bant genişliği paylaşımı - PayPal/Stripe ödemeleri, masaüstü/Android uygulaması"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Docker imajı yoktur. Yalnızca Windows masaüstü ve Android uygulamaları."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "Referans trafiği kazancının %20'si"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "$1 (10.000 Coin) hoş geldin bonusu"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "Uygulamanın Google Play sayfasına göre trafiğiniz, Infatica müşterilerinin web istihbaratı isteklerine hizmet eder; bu müşterilerin kim olduğu veya nasıl denetlendiği belirtilmez."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Android uygulaması 17 ay sonra, Nisan 2026'da Google Play'den kaldırıldı."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot, ByteBenefit'i çalıştırmaz: sağlayıcının kendi uygulamasını kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir, kullanılmayan internet bant genişliğinizi paylaşarak pasif gelir elde etmenizi sağlar. Yalnızca Windows ve Android desteklenir: resmi SSS'ye göre Linux veya Docker istemcisi planlanmamaktadır, iOS desteklenmez ve macOS sunulmaz. Kazanç büyük ölçüde konuma bağlıdır. Takip için web panosu dash.bytelixir.com adresindedir. Docker imajı yoktur.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Bant genişliği paylaşımı - yalnızca Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Oturum Çerezi"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Remember Web Çerezi"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "XSRF Token"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "<a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a> adresinde oturum açın, F12'ye basın → Application → sol kenar çubuğunda <b>Cookies</b> öğesini genişletin → <code>https://dash.bytelixir.com</code> alt öğesine tıklayın → sağdaki çerez listesinde <code>bytelixir_session</code> çerezini bulun → Value değerini kopyalayın (eyJ ile başlayan uzun bir JWT)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Aynı yerde (Cookies → <code>https://dash.bytelixir.com</code>) → <code>remember_web_...</code> adlı çerezi bulun → Value değerini kopyalayın (isteğe bağlı, oturum süresini uzatır)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Aynı yerde → <code>XSRF-TOKEN</code> çerezini bulun → Value değerini kopyalayın (isteğe bağlı)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Kazanç konuma göre değişir (ayda $2-50). Docker imajı yoktur. Masaüstü uygulaması veya Android uygulaması gerekir."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Yalnızca kripto. Minimum tutar coin'e bağlıdır: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Adresi her talepte yazarsınız. Talepler mesai saatlerinde, 24 saat içinde işlenir."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Bakiye Bytelixir'de tutulur; cüzdan adresi her ödeme talebine yazılır, konteynerde asla saklanmaz."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "<a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> adresinde <b>Remember Me seçeneğini işaretleyerek</b> oturum açın, F12'ye basın → Application → sol kenar çubuğunda <b>Cookies</b> öğesini genişletin → <code>https://dash.bytelixir.com</code> öğesine tıklayın, ardından üç değeri kopyalayın: <b>bytelixir_session</b>, <b>remember_web_…</b> (bu önekle başlayan uzun olan) ve <b>XSRF-TOKEN</b>. Oturum çerezi tek başına, kopyaladıktan yaklaşık iki saat sonra sona erer; bu yüzden veri toplama aynı öğleden sonra durur. remember_web çerezi bir yıl geçerlidir ve çalışmaya devam etmesini sağlayan odur."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "Kârlarının %50'si, ömür boyu"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "$1 karşılama bonusu"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Yalnızca kripto ve minimum tutar coin'e bağlıdır: USDT için $5 ile Bitcoin için $250 arasında değişir."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot, Bytelixir'i çalıştırmaz: sağlayıcının kendi uygulamasını kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Trustpilot'ta 283 yorumdan 4.6 puanı var; çoğu kripto ödemelerini övüyor, birkaçı ise ödemelerin ulaşmadığını bildiriyor."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Bir ödeme için talebe yalnızca bir kripto adresi yazmanız yeterlidir."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai, eşler arası bir GPU pazarıdır. NVIDIA GPU'lu bir Linux makineyi listelersiniz, kendi spot ve isteğe bağlı fiyatlarınızı belirlersiniz ve kiracılar üzerinde kendi Docker konteynerlerini çalıştırır. Yalnızca kiralandığı dakikalar için CLORE, BTC, USDT veya USDC olarak ödeme alırsınız. Barındırma için Ubuntu 22.04 veya daha yenisi (ya da HiveOS) çalıştıran bir x86_64 makine, çalışan bir NVIDIA sürücüsü ve indirme ile yüklemede en az 100 Mbps gerekir. AMD GPU'lar desteklenmez.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "GPU pazarı - NVIDIA GPU'larınızı kiraya verin, ödeme CLORE, BTC veya USD stablecoin ile"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Yalnızca kiralanan dakikalar için, belirlediğiniz fiyattan ödeme alırsınız. Aralığın üst ucu olan $490, Clore'un dakika bazında listelenen tek bir RTX 4090 için kendi verdiği üst sınırdır ('ayda ~$490'a kadar'); daha küçük kartlar daha az kazanır, boşta duran bir kart hiçbir şey kazanmaz. Clore her kiralamanın %5'ini (isteğe bağlı) veya %1.25'ini (spot) alır; kiracı CLORE yerine BTC, USDT veya USDC ile öderse buna ek olarak %15 daha alır."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Account > Billing bölümünden kendi cüzdanınıza çekin: CLORE (ERC-20, minimum 200, ücret yaklaşık $0.50), BTC (minimum 0.0001, ücret 0.00005 BTC) veya Ethereum ya da BNB Chain üzerinde USDT/USDC (minimum $10, ücret $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore, siz çekene kadar bakiyeyi tutar (CLORE, BTC ve USDT/USDC için tek bir USD bakiyesi). Zincir her para çekmede seçilir: CLORE için Ethereum, BTC için Bitcoin, USDT/USDC için Ethereum veya BNB Chain."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "Davet ettiğiniz ev sahiplerinin ve kiracıların her kiralamada ödediği platform ücretlerinin %15'i (standart seviye); kodun süresi hiç dolmaz; ödeme kiralamanın para biriminde yapılır (CLORE, BTC veya USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "İndirme ve yüklemede 100 Mbps"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "Makinenizdeki GPU işlem süresi."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Evet. Kiracılar makinenizde kendi Docker konteynerlerini çalıştırır ve trafikleri sizin bağlantınızdan çıkar; SSH ve uygulama portları internete yönlendirilir."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Clore'un gizlilik politikası hesap verilerini ve IP adresinizi yaklaşık konumla birlikte kapsar; kimlik belgeleri yalnızca Clore KYC isterse toplanır."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Gelen portlara internetten erişilebilmelidir (varsayılan olarak 22, 8080 ve 3000-4000) ve yabancıların iş yükleri sizin hattınızda çalışır. Clore'un kendi ağ rehberine göre bazı İSS'ler barındırmayı engeller."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "18 yaş veya üzeri olmalı, yaptırım uygulanan bir ülkede bulunmamalısınız. Clore tamamen kendi takdirine bağlı olarak bir hesabı askıya alabilir veya kapatabilir; yasaklanmış bir kullanım fonların kaybına yol açabilir."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Ne kullanım koşulları ne de gizlilik politikası bir tüzel kişiliğin adını verir; koşullar, geçerli yargı bölgesini sonraki bir sürüme bırakır."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore tamamen kendi takdirine bağlı olarak bir hesabı askıya alabilir veya kapatabilir; yasaklanmış bir kullanım fonlara el konulmasına yol açabilir."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Ödemeler yalnızca kriptoyla yapılır (CLORE, BTC, USDT veya USDC) ve kiracının BTC, USDT veya USDC ile ödediği bir kiralamadan Clore ek olarak %15 alır; ev sahibi bunu azaltmak için CLORE kilitlerse bu durum değişir."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Ev sahibine yalnızca kiralanan dakikalar için ödeme yapılır ve Clore'un RTX 4090 için verdiği rakam tek bir kart için bir üst sınırdır (\"ayda ~$490'a kadar\")."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "Temel kullanım için KYC gerekmez, ancak Clore büyük para çekme işlemlerinde veya uyum gerektiren durumlarda kimlik doğrulaması isteyebilir."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Kiracılar makinenizde herhangi bir herkese açık Docker imajını çalıştırabilir. Koşullar yasak kullanımları listeler (kötü amaçlı yazılım, DDoS, CSAM ve daha fazlası), ancak kiracıların nasıl denetlendiğine dair bir açıklama bulamadık."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot, Clore.ai'yi çalıştırmaz: Clore'un barındırma aracısını kendi GPU makinenize (Ubuntu 22.04 veya daha yenisi ya da HiveOS) kurarsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Kiracı CLORE ile ödediğinde Clore, isteğe bağlı bir kiralamanın %5'ini (spot'ta %1.25) alır, ek ücret yoktur."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN, DAWN protokolü aracılığıyla finanse edilen yapay zekâ altyapısı için bant genişliğini ve kapsama alanını kontrol eden bir doğrulayıcı ağı çalıştırır. DAWN Validator tarayıcı eklentisi bu bant genişliği kanıtı ve kapsama kontrollerine katılır ve çalıştığı sürece DAWN ödülleri kazanır. Ödüllerin henüz belirlenmiş bir nakit değeri yoktur. Hesabı eklentide oluşturun ve istendiğinde 2QLQV97F referans kodunu girin.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "DePIN doğrulayıcı - tarayıcı eklentisi DAWN puanı kazanır"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Token lansmanı öncesinde Dawn Points kazanır. Gerçek değer gelecekteki token fiyatına bağlıdır. Donanım cihazı tarayıcı eklentisinden daha fazla kazanır."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Token airdrop'u (henüz duyurulmadı)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "Eklenti çalışıyor ama yarım yamalak. Black Box donanımı duyuruldu. İleride tekrar kontrol edin."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "Eklenti puan kazanır; Ekim 2026 itibarıyla düğüm operatörlerine token dağıtımı doğrulanmamıştı."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "Bir token piyasaya çıkıp dönüşüm oranı duyurulana kadar puanların belirlenmiş bir değeri yoktur."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot, Dawn'ı çalıştırmaz: sağlayıcının kendi tarayıcı eklentisini kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network, merkeziyetsiz bir VPN ve web3 altyapı projesidir. Öncelikle tescilli Deeper Connect donanım cihazları gerektirir. Moken, ilgili bir madencilik/staking platformudur. Yalnızca yazılımla çalışmaz.\n"
