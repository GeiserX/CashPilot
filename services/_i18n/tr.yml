herominers-kas.payment.frequency:
  text: "Havuz ödeme eşiğinizi saatte bir kontrol eder"
  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "HeroMiners, seçtiğiniz eşiğe ulaştığınızda adresinize otomatik olarak ödeme yapar. En düşük eşik 1 KAS'tır.\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
