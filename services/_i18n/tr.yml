  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket minimum tutarı hesap başına belirler: Ekim 2026'da ilk ödemeden önce $4, sonrasında $2 idi; bu, eskiden duyurduğu $20'ın çok altındadır. Yöntemler: Tremendous (e-postanıza) veya Polygon üzerinde USDT. Her talep, e-postayla gönderilen bir bağlantıdan 2 saat içinde onaylanır ve aynı anda yalnızca bir talep beklemede olabilir. Ekim 2026'da Repocket bir Tremendous talebini \"Please, message support\" mesajıyla reddetti, Polygon üzerinde USDT ise sorunsuz gerçekleşti."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Bakiye Repocket'te tutulur; talep üzerine çekilir."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Repocket hesabınızın e-posta adresini ve şifresini kullanın (<a href='https://app.repocket.com' target='_blank'>app.repocket.com</a> ile aynı). Hesabınız yok mu? <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a> ile kaydolun."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "Davet edilen kişi $7 kazandığında $2, ardından ömür boyu kazancının %5'i"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "Kayıtta $2 cüzdan bonusu"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket HESAP başına beş cihaz sınırı belgeler, ancak IP başına bir cihaz sınırı yayımlamaz. İnceleme sitelerinde tekrarlanan 'IP başına 2 cihaz' rakamının sağlayıcıya dayanan bir kaynağı yoktur, bu yüzden CashPilot bunu öne sürmez."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Bir Repocket cihazında paylaşımı sürdürün veya bakiyenizi çekin"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Giriş, ödeme veya bant genişliği paylaşımı olmadan geçen 12 ayın ardından Repocket ödenmemiş bakiyeye el koyabilir."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Bir cihazda paylaşımı sürdürün, oturum açın veya para çekin. Repocket'i kullanmayı bırakacaksanız önce paranızı çekin."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Birkaç Trustpilot yorumcusu iptal edilen ödemeler ve sıfırlanan bakiyeler bildiriyor; biri desteğin düzensiz bant genişliği kazançlarını gerekçe gösterdiğini söylüyor. Sayfa Repocket'e 2.7 puan veriyor ve olumsuz yorumlara yanıt vermediğini belirtiyor."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Yorumcular reddedilen para çekme taleplerini ve ödemenin peşinden koşmak zorunda kaldıklarını bildiriyor."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Repocket'in ödeme politikası, kazançların geçersiz olduğundan şüphelendiği her durumda onları geri almasına, iptal etmesine veya kalıcı olarak el koymasına ve etkin olmayan bir hesabın ödenmemiş kazançlarına el koymasına izin verir."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "Aynı politika, Repocket'in ödeme yöntemlerini istediği zaman bildirimsiz olarak eklemesine, kaldırmasına veya değiştirmesine izin verir; PayPal kaldırıldı."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Koşullara göre Repocket istediği zaman kimlik veya hesap doğrulaması isteyebilir ve ödeme uygunluğu buna bağlıdır."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Koşullara göre Repocket ve ortakları ağ kapasitesini kullanır, ancak ortakların kim olduğu veya nasıl denetlendiği belirtilmez."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot, Repocket'in olumsuz yorumlara yanıt vermediğini belirtiyor ve yorumcular mesajların görmezden gelindiğini söylüyor."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "Güncel koşullar Singapur'daki Repocket Pte. Ltd. adını verir; eski koşullarda hiçbir şirket adı yoktu."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket kendi Docker imajını yayımlar (repocket/repocket) ve koşulları sahibi olduğunuz konteynerlere izin verir."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Minimum tutar düşüktür: ilk ödemeden önce $4, sonrasında $2."
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io, GPU'nuzu dağıtık yapay zekâ iş yükleri için paylaşmanızı ve hediye kartı, oyun veya nakit olarak kullanılabilen Salad bakiyesi kazanmanızı sağlar. Yalnızca Windows, yerel bir masaüstü uygulamasıyla. Ayrı bir GPU gerektirir (NVIDIA veya AMD). Platform, makineniz boştayken yapay zekâ çıkarımı, render ve diğer işlem görevlerini ona yönlendirir. Kullanımı en kolay GPU paylaşım platformlarından biridir.\n"
  source: "09335baccea6"
salad.short_description:
  text: "Yapay zekâ için GPU paylaşımı - yalnızca Windows, hediye kartı veya nakit ödeme"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Kazanç GPU modeline ve iş bulunabilirliğine bağlıdır. RTX 3060 günde ~$1-3. Yalnızca Windows. Yerel uygulama, Docker desteği yok. Hediye kartı, oyun veya PayPal olarak kullanılabilir."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
salad.cashout.notes:
  text: "Salad mağazası üzerinden PayPal veya hediye kartları."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Yalnızca PayPal ve hediye kartları, asla kripto değil. Cüzdan adresi yoktur, bu yüzden CashPilot'un gösterebileceği zincir üstü bir bakiye yoktur."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "<a href='https://app.salad.io' target='_blank'>app.salad.io</a> adresinde oturum açın, F12'ye basın → Application → Cookies, <b>auth</b> çerezinin değerini kopyalayın."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Biraz Salad Reward Points kazanın veya bakiyenizi harcayın"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Bir hesap art arda 12 ay boyunca hiç Reward Points kazanmazsa, kullanılmamış bakiyesinin süresi dolabilir."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Salad uygulamasını kazanç sağlayana kadar çalıştırın veya bakiyenin tamamını Salad Storefront'ta harcayın. Yalnızca bir kısmını harcamak 12 aylık süreyi sıfırlamaz."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot, Salad'ı çalıştırmaz: sağlayıcının kendi masaüstü uygulamasını kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Ekim ve Kasım 2026'daki birkaç Trustpilot yorumcusu PayPal ile para çekme işlemlerinin hızlı ulaştığını, bazıları bunu birden fazla kez yaşadığını bildiriyor; aynı dönemde bir yorumcu ise tekrarlanan para çekme denemelerinin başarısız olduğunu söylüyor."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel, merkeziyetsiz VPN için bir Layer 1 Cosmos blokzinciridir. Düğüm operatörleri bant genişliğini VPN kullanıcılarına esnek fiyatlandırmayla (GB başına veya saatlik) satar. Resmi bir Docker dağıtım rehberi mevcuttur. Etkin bir topluluğa sahip, uzun süredir devam eden bir projedir.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "Cosmos üzerinde merkeziyetsiz VPN - düğüm operatörleri bant genişliği satar"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Operatörler kendi fiyatlarını GB başına veya saatlik olarak belirler. Kazanç, bölgenizdeki VPN kullanıcı talebine bağlıdır."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Oturum başına"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Ödemeler P2P token ile yapılır ve her bant genişliği ödemesinin %20'si düğüm sahibine değil, stake edenlere gider."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "Token'ın adı 2021'de SENT'ten DVPN'e, 2025'te de DVPN'den P2P'ye değiştirildi."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot, Sentinel'i çalıştırmaz: sağlayıcının kendi düğüm yazılımını kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel, düğüm kaynak kodunu kendi açık kaynak lisansı altında yayımlar."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia, 2015'ten beri faaliyette olan ve Sia Foundation (İsviçreli kâr amacı gütmeyen bir kuruluş) tarafından yürütülen merkeziyetsiz bir depolama pazarıdır. Boş disk alanınızı kiraya vermek ve depolama ile bant genişliği sözleşmelerinden Siacoin kazanmak için Vakfın resmi hostd düğümünü çalıştırın. Düğümün kazanabilmesi için önce biraz Siacoin satın almanız gerekir: ev sahipleri her sözleşme için teminat kilitler ve her depolama kanıtı için bir ücret öder. Teminat, sözleşme tamamlandığında geri gelir; düğüm çevrimdışı kalırsa veya veri kaybederse yakılır. Bu yüzden sürekli açık bir makine gerekir (Sia en az %95 çalışma süresi diyor). Kazanç, kiracıların gerçekte ne kadar veri depoladığına bağlıdır; Sia depolamanın ayda TB başına $1 olarak fiyatlandırılmasını önerir, bu yüzden küçük VPS dilimlerinden çok büyük boş diskleri olan makinelere uygundur.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Sia Foundation depolama düğümü - resmi Docker imajı, Siacoin kazanın"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Cüzdan kurtarma ifadesi"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Pano şifresi"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Depolama dizini"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "Ev sahibinin Siacoin cüzdanını kontrol eden BIP-39 kurtarma ifadesi. `docker run --rm ghcr.io/siafoundation/hostd seed` ile bir tane oluşturun ve yedekleyin -- kazançlara ulaşmanın TEK yolu budur"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "hostd web arayüzü ve yerel API için şifre (BasicAuth). Herhangi bir uzun parola"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Kiracı verilerinin depolandığı, en büyük diskinizdeki ana makine yolu (ör. /srv/sia). En az 256GB boş alan gerekir"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Dağıtım sırasında CashPilot, düğümü çalıştıran makinede yeni bir cüzdan oluşturur ve kurtarma ifadesini bir kez gösterir: bunu bir yere yazın. Zaten sahip olduğunuz bir cüzdanı kullanmak için bunun yerine onun kurtarma ifadesini yapıştırın. Dağıtımdan sonra teminat ve ücretler için düğümün cüzdanına biraz Siacoin gönderin, ardından panoda depolama klasörünü (/storage) ekleyin, fiyatları belirleyin ve ev sahibini duyurun.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "Cüzdan kurtarma ifadesi (hostd.yml), cüzdan veritabanı, ev sahibi ayarları ve sözleşme durumu. Bunu kaybetmek düğümün kimliğini ve sözleşme gelirinin takibini kaybettirir; bu durumda fonlar için tek kurtarma yolu yazdığınız kurtarma ifadesidir."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Depolanan kiracı verileri. Bunları kaybetmek depolama kanıtlarının başarısız olmasına ve o sözleşmeler için kilitlenen teminatın kaybedilmesine yol açar."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Ev sahipleri kendi fiyatlarını belirler. Sia, depolanan TB başına ayda $1 ve indirilen TB başına $5'ın üzerinde fiyat önerir; her sözleşme ödemesinin %3.9'u Siafund sahiplerine gider. Gelir, düğüme ne kadar kiracı verisi geldiğine göre artar; bu sıfırdan başlar ve çalışma süresi ile fiyata göre büyür. Teminat (Sia depolama fiyatının 2 katını önerir) sözleşme başına kilitlenir ve başarılı tamamlanmada iade edilir.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Kazançlar ev sahibinin kendi Siacoin cüzdanında (kurtarma ifadesiyle kontrol edilen) birikir. SC'yi bir borsada dönüştürün ve oradan bankaya/karta çekin; sağlayıcı tarafında bir ödeme talebi yoktur.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Fonlar, düğümün içindeki kurtarma ifadesiyle kontrol edilen Sia cüzdanında durur. Kurtarma ifadesi yalnızca, hostd'yi çalıştıran makinedeki veri biriminde bulunur; CashPilot onu asla saklamaz. Cüzdan oluşturulurken yazdığınız ifade tek kurtarma yoludur.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "9981 (TCP, konsensüs) ve 9984 (TCP ve UDP, kiracı sözleşmeleri) portları yönlendirilmiş, sabit bir herkese açık adres. Sia'da veri merkezi/VPS barındırma yaygındır. Düğümün sözleşme alabilmesi için cüzdanda Siacoin bulunmalıdır."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Disk alanı ve onu sunmak için gereken bant genişliği."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Hayır. Kiracılar şifrelenmiş dosya parçalarını diskinizde depolar ve geri alır. Başkaları IP'niz üzerinden rastgele trafik yönlendirmez."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Sia cüzdan adresiniz, ev sahibi açık anahtarınız ve düğümün, kiracıların ona ulaşabilmesi için duyurduğu herkese açık IP:port."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Herhangi bir depolama sunucusu çalıştırmaya benzer şekilde hatta sürekli yükleme/indirme trafiği olur; anonimleştirilmiş üçüncü taraf web trafiği size atfedilmez."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "İzin gerektirmez: kayıt veya hesap yoktur. Düğüm çevrimdışı kalarak veya veri kaybederek depolama kanıtlarını kaçırırsa teminat yakılır."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Kazançlar kendi cüzdanınızda Siacoin olarak birikir: bankaya ödeme yoktur, bu yüzden bir borsada kendiniz satarsınız."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "Teminat sözleşme başına kilitlenir ve ev sahibi çevrimdışı kalarak veya veri kaybederek depolama kanıtlarını kaçırırsa yakılır."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Ağda sunulan depolamanın yalnızca yaklaşık %30'u kullanımdadır, bu yüzden yeni bir ev sahibi az bir talep için rekabet eder."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Kiracılar şifrelenmiş dosya parçaları depolar ve kimse IP'niz üzerinden trafik yönlendirmez, ancak Sia'nın kiracıların kim olduğunu veya nasıl denetlendiğini nerede açıkladığını bulamadık."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd, 2022'den beri Sia Foundation tarafından açık şekilde geliştiriliyor."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd, MIT lisansı altında açık kaynaktır."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Sia Foundation, hostd'yi bir konteyner imajı olarak yayımlar."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "İzin gerektirmez: kayıt veya hesap yoktur."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide, kullanılmayan internet bant genişliğinizden gelir elde etmenizi sağlayan bir bant genişliği paylaşım hizmetidir. Cihaz takibi için isteğe bağlı bir makine kimliği kullanır. income-generator projesindeki topluluk Docker imajlarıyla kullanılabilir.\n"
