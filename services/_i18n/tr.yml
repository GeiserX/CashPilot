  text: "USDC ödemeleri için Ethereum cüzdan adresi (ör. 0x1234...abcd). Kendi kontrolünüzdeki bir cüzdan olmalıdır (MetaMask, Ledger vb.) -- asla bir borsa adresi kullanmayın"
