nodepay.description:
  text: "Nodepay, kullanıcıları bir tarayıcı eklentisi aracılığıyla bant genişliği paylaştıkları için ödüllendiren bir DePIN ağıdır. Platform, otomatik erişimi zorlaştırabilen Cloudflare koruması arkasındadır. Kullanıcılar eklentiyi etkin tutarak Nodepay Points kazanır. Ağ, yapay zekâ eğitim verisi altyapısı sağlamaya odaklanır.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "Yapay zekâ için DePIN bant genişliği paylaşımı - tarayıcı eklentisi"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Nodepay Points kazandırır; Nodepay'in uygunluk kontrollerini geçen kullanıcıların puanları NC token'a dönüşür. Cloudflare koruması otomatik veri toplamayı engelleyebilir. Tarayıcı eklentisi gerekir."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "NC token airdrop'u (zamanlama doğrulanmadı)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Puan tabanlı sistem. Nodepay'in uygunluk kontrollerini geçen kullanıcıların puanları, Ocak 2025'te piyasaya çıkan NC token'a dönüşür."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "Nodepay, ilk sezon incelemesinde bot olarak değerlendirdiği 300.000'den fazla hesabı kaldırdı ve 17 milyar puanı iptal etti."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Ödüller NC token'a dönüştürülen puanlardır, bu yüzden değerleri token'a bağlıdır."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot, Nodepay'i çalıştırmaz: sağlayıcının kendi tarayıcı eklentisini kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes, Base L2 üzerindeki bir DeFi projesi olan Noderr Protocol'ün ücretsiz giriş seviyesidir. Bir micronode; yedek bir Android telefonda, bir Windows PC'de, bir Mac'te veya bir Chromium tarayıcısında çalışan küçük bir aracıdır. Android'de telefonun mobil bağlantısını paylaşır: diğer Noderr trafiği telefonun operatör IP'si üzerinden çıkar, bu yüzden mobil verisi olan bir SIM kart gerekir. Bir PC'de veya tarayıcıda, boştaki işlem gücüyle protokol için otomasyon görevleri çalıştırır. Ödüllerin, zincir üstü bir çalışma süresi ve güvenilirlik puanına göre ölçeklenerek NODR ile ödenmesi planlanıyor, ancak ağ beta süresince Base Sepolia testnet'indedir: düğüm ödülleri için fon ayrılmamıştır ve şu ana kadar hiç ödeme yapılmamıştır.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Ücretsiz micronode (Android bağlantı paylaşımı, Windows, Mac, tarayıcı) - testnet, ödüller için henüz fon yok"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Testnet betası: düğüm ödülleri için fon ayrılmamıştır ve şu ana kadar hiç ödeme yapılmamıştır. Sitedeki %5-10 APY bir tasarım hedefidir. Ağ Base Sepolia'dan çıktığında tekrar değerlendirin."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Ödüller düğümün kendi cüzdanında birikir ve uygulamadan veya dApp'ten talep edilir. Beta süresince bunlar piyasa değeri olmayan Base Sepolia testnet token'larıdır."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "Uygulama ilk açılışta düğüm cüzdanını oluşturur ve ona ücretsiz, devredilemez (soulbound) bir Utility NFT basar. Cüzdanı uygulamadan yedekleyin: cihazı kaybetmek düğüm kimliğini de kaybetmek demektir. Beta süresince ödüller Base Sepolia (testnet) üzerindedir."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android için mobil verisi olan bir SIM kart gerekir; masaüstü ve tarayıcı istemcileri için yayımlanmış bir IP gereksinimi yoktur."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Cihaza bağlıdır. Bir Android telefon mobil bağlantısını satar: diğer Noderr trafiği telefonun operatör IP adresi üzerinden çıkar ve veri paketinden düşer. Bir Windows PC, bir Mac veya bir tarayıcı, boştaki işlem gücünü sağlayıcının sosyal medya ve içerik otomasyonu görevleri dediği işler için satar."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Evet. Android'de diğer Noderr trafiği telefonunuzun mobil IP adresi üzerinden çıkar; uygulama başlamadan önce kayıt altına alınan bir onay ister ve paylaşımı aynı ekrandan durdurabilirsiniz. Windows, Mac ve tarayıcı istemcileri için sağlayıcı otomasyon görevlerinden bahseder ve bunların başkaları adına trafik taşıyıp taşımadığını söylemez."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "Düğümün cüzdan adresi ile çalışma süresi ve görev tamamlama rakamları, bir itibar puanı (TrustFingerprint) olarak zincire yazılır. Sağlayıcıya göre görevler anonimleştirilir, korumalı bir ortamda (sandbox) çalışır ve cüzdan anahtarları cihazdan asla çıkmaz. Bundan daha ayrıntılı bir bilgi yayımlanmamıştır."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Android'de paylaşılan bağlantı bir mobil operatör paketidir: sağlayıcının kendi belgeleri, bazı operatörlerin kabul edilebilir kullanım politikalarına göre paylaşıma izin verilmeyebileceği konusunda uyarır ve paylaşılan trafik paketin kotasından düşer. Masaüstü ve tarayıcı istemcileri için sağlayıcı İSS koşulları hakkında hiçbir şey söylemez."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Cihaz başına bir düğüm, her birinin kendi devredilemez (soulbound) Utility NFT'si vardır; birden fazla cihaz çalıştırmaya izin verilir ve teşvik edilir. Yayımlanmış bir IP başına sınır yoktur. Alışılmış anlamda bir hesap yoktur: kimlik, uygulamanın ilk açılışta oluşturduğu bir cüzdandır."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Düğüm ödülleri, fon ayrılmamış ve piyasa değeri olmayan testnet token'larıdır ve hiç ödeme yapılmamıştır; sitesindeki %5 ile %10 arası APY bir tasarım hedefidir."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Masaüstü ve tarayıcı istemcileri için Noderr otomasyon görevlerinden bahseder ve bunların başkalarının trafiğini taşıyıp taşımadığını söylemez."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Sağlayıcıya göre görevler anonimleştirilir ve korumalı bir ortamda çalışır, ancak bundan daha ayrıntılı bir bilgi yayımlanmamıştır."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Hâlâ Base Sepolia üzerinde bir testnet betası."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot, Noderr'ı çalıştırmaz: sağlayıcının kendi uygulamasını veya eklentisini kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Hesap yok: uygulama ilk açılışta bir cüzdan oluşturur."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle, IoT altyapısı oluşturmak için akıllı telefonların Bluetooth'unu kullanır. Uygulama yakındaki IoT cihazlarını pasif olarak algılar ve onlardan gelen verileri aktararak NODL token kazanır. Forbes'ta yer aldı; Vivendi ve Hayden AI ile kurumsal ortaklıkları var. Yalnızca mobil (iOS ve Android).\n"
