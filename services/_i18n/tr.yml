  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "NODL'leriniz, Nodle uygulamasının ZKsync Era üzerindeki kendi cüzdanında durur. CashPilot bu cüzdanın adresini göremez."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
