honeygain.description:
  text: "Kullanılmayan internet bant genişliğinizi paylaşın ve pasif gelir elde edin. Honeygain, web istihbaratı, içerik dağıtımı ve pazar araştırması trafiğini sizin bağlantınız üzerinden yönlendirir. 12M+ kullanıcısı ve 1M'den fazla tamamlanmış ödemesiyle en köklü bant genişliği paylaşım platformlarından biridir.\n"
  source: "b219f969ba34"
honeygain.short_description:
  text: "Bant genişliği paylaşımı - en köklü platform"
  source: "c0542c471f29"
honeygain.docker.env.HONEYGAIN_EMAIL.label:
