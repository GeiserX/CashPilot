  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Her ev sahibi, GPU'sunun saatlik fiyatına göre belirlenen bir NOS stake'i kilitlemelidir."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Ev sahiplerine NOS ile ödeme yapılır; bu yüzden dolar bazındaki kazanç token'a ve kartlarına olan talebe göre değişir."
