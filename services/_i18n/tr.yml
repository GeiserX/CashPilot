proxybase.description:
  text: "ProxyBase, kullanılmayan internet bağlantılarını paylaşan kullanıcılara kripto para ile ödeme yapan bir bant genişliği paylaşım platformudur. Eş istemcisinin kimliğini panonuzdaki bir Access Token ile doğrularsınız. En çok ev IP'leri kazanır, ancak veri merkezi IP'leri de desteklenir. Resmi çok mimarili Docker imajı (amd64/arm64/armv7).\n"
