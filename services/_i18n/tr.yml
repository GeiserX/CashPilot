unmineable.earnings.notes:
  text: "Elektrik öncesi brüt tahmin; unMineable'ın dönüşüm oranıyla sizin coin'inizde ödenir. 2026-11-25 tarihinde 1 kH/s RandomX ayda yaklaşık $1 değerindeydi. İş parçacıklarının yarısını kullanan bir masaüstü CPU 30 ila 50 W ek güç çekebilir. Kârlı olup olmadığını görmek için gerçek tüketiminizi ve elektrik fiyatınızı kontrol edin."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "unMineable tarafından coin başına belirlenir (2026-11-26 tarihinde 0.03 XMR)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Coin'in ödeme eşiğine ulaşıldığında"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable, bakiyeniz coin'in ödeme eşiğine ulaştığında adresinize ödeme yapar. Eşikler coin'e ve ağa göre farklıdır; CashPilot, unMineable'ın adresiniz için bildirdiği eşiği okur."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Bakiye kazanılmıştır, ancak unMineable bunu bu adrese ödeyene kadar alınmış sayılmaz. Zincir, seçtiğiniz coin'e bağlıdır."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "Madenciyi dağıtırken kullandığınız aynı ödeme adresi ve coin kısaltması, örneğin <b>XMR</b>. Adresi tek başına girin; coin, worker adı veya referans kodu eklemeyin. Herkese açıktır ve hiçbir fonun kilidini açmaz."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "Davet edilen her madencinin madencilik ödüllerinin %0.25'i"
