proxybase.cashout.notes:
  text: "Site $0.20 minimum belirtiyor ve Ekim 2026'da $1'ın altındaki bir talep sorunsuz gerçekleşti. Bir talep her zaman bakiyenin tamamını, Polygon üzerinde USDC, POL veya Litecoin olarak, yazdığınız bir adrese çeker. Ağ ücretini ProxyBase karşılar."
