golem.description:
  text: "Golem Network, GLM token karşılığında CPU ve GPU kaynaklarınızı paylaştığınız merkeziyetsiz bir işlem gücü pazarıdır. Sağlayıcılar, iş yüklerinin korumalı (sandbox) ortamlarda çalıştırılmasını yöneten Yagna aracısını çalıştırır. En eski merkeziyetsiz işlem gücü projelerinden biridir (2016'da kuruldu). CPU görevlerini, GPU render işlerini ve genel amaçlı işlem gücünü destekler. Ödemeler Polygon L2 üzerinden yapılır.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Merkeziyetsiz işlem gücü pazarı - Yagna aracısıyla GLM token"
  source: "88f817c25848"
golem.earnings.notes:
  text: "Kazanç donanıma, fiyatlandırmaya ve görev talebine bağlıdır. Yalnızca CPU'lu düğümler daha az kazanır. GPU düğümleri daha çok kazanır ama NVIDIA gerektirir. Yagna sağlayıcı aracısını çalıştırın (Docker imajı değil). Ödemeler Polygon üzerinde GLM token olarak yapılır."
  source: "07287d437d51"
golem.payment.frequency:
  text: "Her görev tamamlandığında"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "GLM token kazanılır. Ödeme cüzdanını sağlayıcı kurulumunda yapılandırın."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot, Golem'i çalıştırmaz: sağlayıcı aracısını kendiniz kurarsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Golem, sağlayıcının kendi Docker imajında çalıştırılmasını belgeler."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "Sağlayıcı aracısı yagna, GPL-3.0 altında açık kaynaktır."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Hesap yok: ödeme cüzdanını sağlayıcı kurulumunda ayarlarsınız."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "Ağ yaklaşık on yıldır çalışıyor."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Golem'in gizlilik politikası işletmeciyi açıkça belirtir: İsviçre'nin Zug kentindeki Golem Factory GmbH."
  source: "bae79b651923"
grass.description:
  text: "Grass, kullanılmayan bant genişliğinizi yapay zekâ eğitim verisi için satmanızı sağlayan merkeziyetsiz bir ağdır. Tarayıcı eklentisi ve masaüstü uygulaması olarak çalışır; yapılandırılmış veri kümeleri oluşturmak için web kazıma isteklerini sizin bağlantınız üzerinden yönlendirir. 8.5M+ kullanıcısıyla en büyük DePIN bant genişliği ağlarından biridir. Solana blokzincirinde GRASS token kazandırır.\n"
  source: "046951d812f9"
grass.short_description:
  text: "Yapay zekâ verisi için DePIN bant genişliği paylaşımı - GRASS token kazandırır"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Erişim Token'ı"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "<a href=\"https://app.grass.io\">app.grass.io</a> adresinde oturum açın, F12'ye basın → Application → Local Storage → <code>https://app.grass.io</code> öğesine tıklayın → <code>token</code> değerini kopyalayın"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Airdrop'lar yoluyla GRASS token'a dönüştürülebilen Grass Points kazandırır. Gerçek USD değeri token fiyatına bağlıdır. Tarayıcı eklentisi veya masaüstü uygulaması gerekir."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Dönem (epoch) bazlı airdrop"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Ödüller, Grass panosunda talep edilen dönemsel dağıtımlar olarak gelir. Stage 2 dağıtımı (Ekim 2024 ile Haziran 2026 arasındaki etkinlik) USDC olarak ödenir: en geç 22 Ocak 2027 tarihine kadar, ya da tüm paylar daha önce talep edilirse daha erken, app.grass.io/dashboard üzerinden talep edin. Talep edilmeyen ödüller Grass'ta kalır."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "PUAN biriktirir; GRASS, dönemsel airdrop'lar sırasında Grass panosundan talep edilir."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "<a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a> adresinde oturum açın, F12'ye basın → Application → Local Storage, <b>accessToken</b> değerini kopyalayın."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "Doğrudan davet ettiklerinizin çalışma süresi puanlarının %20'si, ikinci seviyede %10, üçüncü seviyede %5"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Grass Stage 2 USDC'nizi talep edin"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "En geç 22 Ocak 2027 tarihine kadar talep edilmeyen her Stage 2 payı Grass'ta kalır ve tüm paylar talep edildiğinde süre daha erken kapanabilir."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Stage 2'de kullandığınız hesapla app.grass.io'da oturum açın, Grass Wallet'ı etkinleştirin, Allocation sekmesini açın ve onaylayın. Yalnızca app.grass.io üzerinden talep edin. Stage 2 puanınız yok mu? Bana uygun değil seçeneğini seçin."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Ödüller yalnızca airdrop sezonları aracılığıyla gelir. Uzun süredir düğüm çalıştıran operatörler, 2. sezon tahminlerinin tek haneli ile düşük iki haneli dolar aralığında olduğunu bildirdi."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "En geç 22 Ocak 2027 tarihine kadar talep edilmeyen 2. sezon ödülleri kalıcı olarak kaybedilir."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "İlk airdrop, iki milyondan fazla kullanıcıya bölünen puan başına düşük ödüller nedeniyle tepki çekti."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot, Grass'ı çalıştırmaz: sağlayıcının kendi uygulamasını veya eklentisini kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "İlk airdrop'ta talepte bulunan adres sayısı yaklaşık 1.5 milyona ulaştı."
  source: "a4c55e10affa"
helium.description:
  text: "Helium, köklü bir merkeziyetsiz kablosuz ağdır. Başlangıçta LoRaWAN hotspot'larıydı, şimdi 5G'ye genişledi. Özel donanım gerektirir ($500+). HNT/MOBILE token kazandırır. Yatırım getirisi önemli ölçüde düştü - tipik olarak ayda $4-8.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "Merkeziyetsiz kablosuz ağ - donanım gerektirir, HNT token"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "$500+ donanım satın alımı gerektirir. Yatırım getirisi önemli ölçüde düştü. Yeni operatörler için onay süreci vardır."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "Dönem (epoch) bazlı"
  source: "75743e03bad2"
helium.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149, 6 Temmuz 2026'da Proof-of-Coverage ödüllerini kaldırdı; IoT hotspot'ları artık yalnızca taşıdıkları veri için kazanıyor ve bunların 114.000'den fazlası hiç veri taşımadı."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Helium'un ödül modeli oylamayla birkaç kez değişti, CEO'su görevden ayrıldı ve HNT yaklaşık %96 değer kaybetti."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot, Helium'u çalıştırmaz: sağlayıcının kendi hotspot donanımını kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "Hotspot ağ geçidi yazılımı Apache-2.0 lisansı altında açık kaynaktır."
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "HeroMiners'ın herkese açık ödeme adresiniz için tuttuğu ödenmemiş Kaspa bakiyesini takip edin. Kendi Kaspa madencinizi çalıştırın ve havuza yönlendirin. CashPilot havuz bakiyesini okur ve bakiye düştüğünde ödemeleri onaylamanızı ister.\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
  text: "Kaspa madencilik havuzu, ödeme adresinizle takip edilir"
