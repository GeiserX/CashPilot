unmineable.referral.bonus.referee:
  text: "Platform ücreti %1'den %0.75'e düşer"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Bu makine bir barındırma bağlantısı bildiriyor. Madencilik yapmadan önce sağlayıcınızın koşullarını kontrol edin. Hetzner Cloud dahil bazı sağlayıcılar bunu yasaklar. Bir kâr tahminine güvenmeden önce gerçek elektrik maliyetlerinizi kontrol edin."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable %1 platform ücreti alır. CashPilot her worker adının sonuna referans kodunu (#awk6-j1z0) ekler; bu da ücretinizi %0.75'e düşürür. Ardından unMineable, madencilik ödüllerinizin %0.25'ini CashPilot'un geliştiricisine öder; %99.25'i sizde kalır. Her coin'in kendi ödeme eşiği vardır, örneğin 0.03 XMR."
