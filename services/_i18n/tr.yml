  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "Tedarikçi ödülleri, ücretli işlerden bağımsız olarak token emisyonlarından ödendi ve GPU sahipleri çoğu zaman boşta beklediklerini bildiriyor."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "Ödüller IO token cinsindendir ve ödeme modeli 2026'da dolara sabitlenmiş bir motora geçti."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "Nisan 2024'te yaklaşık 1.8 milyon sahte GPU, sızdırılmış bir kimlik doğrulama token'ı aracılığıyla ağa katılmaya çalıştı; CEO da daha sonra token lansmanından önce görevden ayrıldı."
