mysterium.description:
  text: "MystNodes (Mysterium Network), blokzincir teknolojisi üzerine kurulu merkeziyetsiz bir VPN ve proxy ağıdır. Kullanıcılara VPN, proxy ve veri kazıma hizmetleri sunan bir düğüm çalıştırarak MYST token kazanırsınız. NET_ADMIN, SETUID ve SETGID yetkileri ile bir TUN cihazı gerektirir; bunları bariyerli kazanç uygulaması köprüsündeki kendi ağ ad alanı içinde kullanır. Düğüm yönetimi için yerleşik bir web arayüzü içerir. Hem ev hem de VPS bağlantılarında çalışır, ancak referans bonusu yalnızca ev IP'si üzerindeki düğümler için ödenir.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Merkeziyetsiz VPN düğümü - blokzincir tabanlı, VPS'te çalışır"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "WebUI adresi"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "UDP port aralığı"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "Düğümün WebUI'sinin (port 4449) yayımlandığı ana makine adresleri. 127.0.0.1 onu bu makinede tutar. Bir ters proxy üzerinden erişmek için proxy'nin bağlandığı adresi virgülle ayırarak ve boşluk bırakmadan ekleyin: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "Düğümün VPN oturumları için kullandığı UDP portları, start:end biçiminde. Aynı aralığı yönlendiricinizde de yönlendirin. Her oturum yaklaşık iki port kullanır; bu yüzden varsayılan 30 port aynı anda yaklaşık 15 oturum taşır, bu da bir ev düğümünün aldığından fazladır. Daha geniş bir aralık hiçbir şeyi düzeltmez ve maliyeti artırır: yayımlanan her port düğümün başlatılmasını ve kaldırılmasını yavaşlatır (300 portun başlatılması yaklaşık 12 s sürer), CashPilot en fazla 300 port kabul eder ve Docker'ın varsayılan userland proxy'si ile her port ayrıca yaklaşık 2.5 MB bellek kullanır. Tüm oturumların başarısız olması port azlığından değil, yönlendiriciden kaynaklanır: Mysterium rehberindeki \"Routers that rewrite UDP source ports\" bölümüne bakın. Aralığı 32768'in altında tutun: 32768-60999 portları Linux'un geçici port aralığıdır; ana makinedeki herhangi bir program bunlardan birini kısa süreliğine tutabilir ve tek bir dolu port düğümün başlatılmasını başarısız kılar. Zaten bir aralığı olan düğüm onu korur."
  source: "530524e2e718"
mysterium.docker.runtime_reason:
  text: "gVisor ona iptables-nft ve çekirdek WireGuard sağlamaz; trafiği taşımak için ikisine de ihtiyacı var."
  source: "d8a72a275579"
mysterium.docker.critical_volumes.0.holds:
  text: "Düğüm kimliği anahtar deposu. Silinirse yepyeni bir kimlik oluşturulur: düğüm itibarını ve eski kimliğe bağlı olarak hâlâ tutulan kazançlarını kaybeder."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "Düğüm konteyneri içinde sudo çalıştıramıyor; bu yüzden VPN arayüzünü veya güvenlik duvarını yapılandıramıyor ve her oturum kurulum aşamasında başarısız oluyor: çevrimiçi görünüyor ama hiçbir şey kazanmıyor. Konteyner SETUID ve SETGID yetkileri olmadan oluşturulmuş. CashPilot'u ve bu düğümü çalıştıran worker'ı güncelleyin, ardından Mysterium'u panodan yeniden dağıtın; düğüm kimliği veri biriminde durur ve korunur."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "Son 6 saatte hiçbir VPN oturumu bu düğüme doğrudan ulaşmadı. Hepsi hole punching yöntemine geri döndü ve birçok alıcı bu yolla bağlanamıyor; bu yüzden düğüm daha az kazanıyor. Düğümün UDP portlarına internetten erişilemiyor. Yönlendiricinizde ${UDP_PORTS} UDP port aralığını (start:end, her iki tarafta aynı aralık) ${HOST_ADDRESS} adresine yönlendirin. Bir oturum doğrudan bağlandığında bu uyarı kendiliğinden kalkar."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Mysterium'un izleme sistemi ${WORKER_NAME} üzerindeki düğümü başarısız olarak işaretliyor; bu yüzden düğüm, kendi kontrolü tüm portlara erişilebildiğini söylese bile çoğu alıcının seçim yaptığı düğüm listesinin dışında kalıyor. Önce düğümde /dev/net/tun ve SETUID/SETGID olduğundan emin olun; bunların eksikliği de aynı şekilde başarısızlığa yol açar: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Bunlar yerindeyse yaygın bir neden, ${WORKER_NAME} önündeki yönlendiricinin, dışarıdan bir paket o porta ulaştıktan sonra düğümün yanıtlarının UDP kaynak portunu değiştirmesidir. Rehberdeki teste bakın: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "${WORKER_NAME} üzerindeki düğümün son beş VPN oturumunun her biri, hiç veri aktarmadan yaklaşık bir dakika sonra sona erdi; bu yüzden düğüm çevrimiçi görünürken hiçbir şey kazanmıyor. Olası neden ${WORKER_NAME} önündeki yönlendiricidir: dışarıdan bir paket bir porta ulaştığında, düğümün o porttan verdiği sonraki yanıtların kaynak portunu değiştirir ve her oturum böyle bir paketle (düğümün kendi port kontrolüyle) başlar; bu yüzden alıcılar düğümün yanıtlarını düşürür. Daha geniş bir port aralığı işe yaramaz. Rehberdeki teste ve çözümlere bakın: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Bir oturum veri taşıdığında bu uyarı kalkar."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Kazanç MYST token cinsindendir. Ev IP'leri belirgin şekilde daha çok kazanır. Yönetim için düğümün WebUI'si 4449 portundadır ve varsayılan olarak yalnızca çalıştığı makinede (127.0.0.1) yayımlanır; başka bir makineden erişmek için önce bir SSH tüneli açın (ssh -L 14449:127.0.0.1:4449 ve sonuna düğüm makinesinin adresi, ardından http://127.0.0.1:14449 adresine gidin; yerel port 14449'dur, böylece kendi makinenizdeki bir düğümle çakışmaz) ya da UI_ADDRESS'e bir adres ekleyin (Mysterium rehberindeki WebUI adresi bölümüne bakın). VPS kabul edilir. UDP 23000-23029 port yönlendirmesi (UDP_PORTS varsayılanı) şiddetle önerilir -- bu olmadan düğümler Strict NAT durumuna düşer ve birçok VPN oturumu başarısız olur, bu da geliri ciddi ölçüde azaltır. Önemli: ilk çalıştırmadan sonra, düğüm WebUI'si veya CLI üzerinden lehtar (settlement) cüzdanınızı mystnodes.com hesabınızla eşleşecek şekilde ayarlayın -- bu, zincir üstü kazançları bulut panonuza bağlar."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Bir düğümde her 5 MYST mutabakatı yapılmamış bakiye biriktiğinde otomatik zincir üstü mutabakat"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Basılacak bir düğme yoktur. Her düğüm, 5 MYST mutabakatı yapılmamış bakiye biriktirdiğinde Polygon üzerinde kendiliğinden mutabakat yapar ve yaklaşık %21'i ücretlere gider (%20 Hermes ücreti artı küçük bir işlem ücreti); böylece her mutabakatta lehtar cüzdanına kabaca 3.9 MYST ulaşır. Her düğümün TequilAPI'si mutabakatlarını /transactor/settle/history altında listeler. MystNodes'taki \"total earnings\" rakamı yalnızca son 30 günü kapsar; ne bir bakiye ne de tüm zamanların toplamıdır. MystNodes ödül programından gelen bonus MYST kendiliğinden mutabakata girmez: MystNodes yardım merkezine göre dağıtımdan sonraki 30 gün içinde Rewards sayfasından talep edin."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "Lehtar cüzdanı dağıtımdan SONRA, TequilAPI veya düğüm WebUI'si üzerinden ayarlanır -- bir ortam değişkeniyle değil; bu yüzden konteyner tanımından okunamaz."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "MystNodes hesabınızın e-posta adresini ve şifresini kullanın (<a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a> ile aynı)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "Düğümü 5 MYST kazanan her arkadaş için 5 MYST (yalnızca ev IP'leri)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "Düğümünüz ilk 5 MYST'ini kazandığında 5 MYST (ev IP'si, düğüm mystnodes.com'da sahiplenilmiş olmalı)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Geçen ayın MystNodes ödüllerini talep edin"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Aylık dağıtımdan sonraki 30 gün içinde talep edilmeyen ödüller kaybedilir ve bir sonraki ayın havuzuna geri döner."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Rewards sayfasını açın ve puanlarınızı MYST ile takas edin."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Bant genişliği. Bağlantınız, VPN, proxy VE veri kazıma hizmetleri satan Mysterium ağı için çıkış düğümü olarak kullanılır. Bir ev IP'sinden çıkan kazıma trafiği, şikâyet çekme olasılığı en yüksek kullanımdır ve düğümünüzün bu üçünden hangisini taşıyacağını seçemezsiniz."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Evet. Yabancılar trafiklerini sizin IP adresiniz üzerinden yönlendirir; ürün tam olarak budur."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "Düğüm kimliği (bir blokzincir adresi), IP'niz ve kaba konumunuz (ülke/şehir/İSS); düğüm, alıcıların onu seçebilmesi için bunları ağda yayımlar."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Gerçek bir risk ve anlaşılmaya değer. Başkalarının trafiği bağlantınızdan sizin adınıza çıkar; bu yüzden yaptıkları her şey sizin hattınızdan geliyormuş gibi görünür. Birçok bireysel İSS sözleşmesi bunu yasaklar. Çalıştırmadan önce kendi sözleşmenizi kontrol edin."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Hesap başına ve IP başına sınırsız cihaz."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
