  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Bu makine bir barındırma bağlantısı bildiriyor. Madencilik yapmadan önce sağlayıcınızın koşullarını kontrol edin. Hetzner Cloud dahil bazı sağlayıcılar bunu yasaklar. Bir kâr tahminine güvenmeden önce gerçek elektrik maliyetlerinizi kontrol edin."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "%2 madenci ücreti pearlhash içindir. SRBMiner-Multi, progpow_zano ve kawpow için %0.85 alır. Varsayılan Pearl havuzu HeroMiners %1 havuz ücreti alır. Ödemeleri saatte bir kontrol eder ve 1 PRL'den itibaren öder. Diğer havuzlar kendi oranlarını ve eşiklerini belirler."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
