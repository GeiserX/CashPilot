  text: "Bazı barındırma sağlayıcıları kripto para madenciliğini yasaklar."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "Madenci kapalı kaynaktır, bu yüzden geliştiricisi dışında kimse ne çalıştırdığını denetleyemez."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "GPU'nun elektriği kazanılan coin'lerden daha pahalıya gelebilir ve Pearl'ün fiyatı hızla değişir."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
