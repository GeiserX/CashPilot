  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "Kazançlarının %10'u, ömür boyu, onların kazancına ek olarak ödenir"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "EarnApp'in yardım merkezine göre Docker konteynerlerine, sanal makinelere, barındırma hizmetlerine veya ev sunucularına kurulması kesinlikle yasaktır; CashPilot ise onu tam da bu şekilde çalıştırır."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "Aynı yardım makalesine göre bu şekilde çalıştırıldığı tespit edilen bir hesap bildirimsiz olarak kapatılır ve bekleyen ödemeleri iptal edilir."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "PayPal ödememiz Ekim 2026'da, çekilen bakiyenin yaklaşık %2 altında geldi."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "PayPal ve Wise için $10 minimum ve kendiliğinden ödeme yapan otomatik çekim."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp, Bright Data'ya aittir ve PayPal ödemeleri adı belli bir şirket olan Bright Data Ltd.'den gelir."
  source: "ead3e8e87bba"
