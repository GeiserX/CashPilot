storj.docker.setup:
  text: "İlk çalıştırmadan önce depolama düğümü yapılandırmasını başlatın: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Düğüm kimliği. Kimliği iş kanıtına (proof-of-work) bağlıdır ve yeniden oluşturulması saatler sürer; başka hiçbir şeyin yedeğinden yeniden oluşturulamaz. Kaybedilirse tutulan ödeme bakiyesi de kaybedilir."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Depolanan müşteri verileri ve düğümün tutulan tutarı. Kaybedilirse düğüm diskalifiye olur ve tutulan bakiye kaybedilir."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Storj ağı, düğümünüze bildirdiği ADDRESS üzerinden geri bağlanamıyor, bu yüzden uydular onu çevrimdışı sayıyor: yeni veri gelmesi durur, çıkış trafiği geliri durma noktasına gelir ve uzun süre çevrimdışı kalmak askıya almaya yol açar. ADDRESS değerinin ŞU ANKİ herkese açık IP'nizle eşleştiğini (İSS değişikliğinin düğümü ulaşılamaz bırakmaması için doğrudan IP değil, bir DDNS ana makine adı kullanın) ve 28967 TCP+UDP portunun bu makineye yönlendirildiğini kontrol edin."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "1 Eylül 2026'dan beri depolanan TB başına $1.35 + çıkış trafiği TB başına $1 + denetim/onarım TB başına $1. Kazanç, depolanan veriye ve düğümün yaşına göre artar. İlk 9 ayda kazançların önce %75'i, sonra %50'si, sonra %25'i alıkonur; alıkonan tutarın yarısı 16. ayda, kalanı düzgün çıkışta (graceful exit) iade edilir. 28967 portu yönlendirilmelidir."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "Ethereum işlem ücretinin 4 katı; daha küçük bakiyeler devreder"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Aylık"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Cüzdan bakiyesi güncel işlem ücretinin en az dört katı olduğunda Ethereum ana ağında USDC olarak aylık ödenir; daha küçük bakiyeler bir sonraki aya devreder. Eylül 2026 ödemesine kadar STORJ token ile ödeniyordu. Pano 14002 portundadır."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Bakiye ücrete dayalı minimumu aştığında, WALLET'taki adrese Ethereum ana ağında USDC olarak aylık ödenir. Eylül 2026 ödemesine kadar STORJ token ile ödeniyordu; zkSync Era ödemeleri 1 Eylül 2026'da sona erdi."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "Düğüm panosunun 14002 portundaki URL'si; localhost yerine sunucunun LAN IP'siyle, örneğin <b>http://192.168.1.10:14002</b>. Birden fazla düğüm için URL'lerini virgülle ayırarak listeleyin: CashPilot bunları toplar."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Aynı /24 alt ağındaki Storj düğümleri veri tahsisini paylaşır, bu da düğüm başına kazancı azaltır."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps yükleme"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Disk alanı ve onu sunmak için gereken bant genişliği."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Hayır. Müşteri verilerinin şifrelenmiş, silme kodlamalı (erasure-coded) parçalarını depolarsınız. Başkaları kendi trafiklerini IP'niz üzerinden yönlendirmez."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "Düğüm kimliği, cüzdan adresiniz, düğümün operatör bildirimleri için istediği e-posta adresi ve düğümün veri sunabilmesi için erişilebilir olması gereken IP ve portunuz."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "Bu, sorumluluktan çok bir veri kotası meselesidir: bir düğüm sürekli olarak müşteri verisi sunar ve alır; bu da hattınızda gerçek ve sürekli bir trafik demektir. Ancak bir proxy veya relay'den farklı olarak, kaynağı sizmişsiniz gibi size atfedilen anonimleştirilmiş üçüncü taraf trafiği değildir; bu yüzden onların çektiği kötüye kullanım şikâyetlerini çekmez."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Sınırsız düğüm; ancak aynı /24 alt ağındaki düğümler tahsisi paylaşır, bu yüzden tek bir bağlantıdaki birden fazla düğümün her biri daha az kazanır."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk, 27 Temmuz 2026'da Storj Labs'in Chapter 11 iflas koruması başvurusunda bulunduğunu bildirdi."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Başvuru öncesine ait düğüm operatörü ödemeleri iflas alacak süreci kapsamına girdi."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "Yeni bir düğümün ilk dokuz ayında kazancının önce %75'i, sonra %50'si, sonra %25'i alıkonur; yarısı 16. ayda, kalanı ise yalnızca düzgün çıkışta geri gelir."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Müşteriler şifrelenmiş dosya parçaları depolar ve kimse IP'niz üzerinden trafik yönlendirmez, ancak Storj'un müşterilerin kim olduğunu veya nasıl denetlendiğini nerede açıkladığını bulamadık."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "Depolama düğümü yazılımı AGPL-3.0 altında açık kaynaktır."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj kendi Docker imajını yayımlar: storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Hesap yok: bir cüzdan adresi ve operatör bildirimleri için bir e-posta yeterlidir."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Etkin düğümlere başvurudan sonra da ödeme yapılmaya devam edildi."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR, hesap gerektirmeyen bir Monero madencilik havuzudur: madenciniz kullanıcı adı olarak Monero adresinizle oturum açar ve havuz o adrese ödeme yapar. CashPilot burada bir madenci çalıştırmaz. SupportXMR'ın adresiniz için tuttuğu bakiyeyi okur; böylece CPU madencinizin ne kazandığını diğer gelirlerinizin yanında görürsünüz. Bakiye kazanılmıştır ama henüz alınmamıştır: havuz, ödeme eşiğinizi geçtiğinde bunu öder.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Monero madencilik havuzu, ödeme adresinizle takip edilir"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (otomatik), talep üzerine 0.01 XMR"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Bakiyeniz eşiğinizi geçtiğinde veya talep üzerine"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR, bakiye eşiğinize (varsayılan olarak 0.1 XMR) ulaştığında adresinize ödeme yapar. Sitesinde 0.001 XMR ücret karşılığında 0.01 XMR'dan itibaren anında ödeme de talep edebilirsiniz."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Bakiye kazanılmıştır, ancak SupportXMR bunu bu adrese ödeyene kadar alınmış sayılmaz. Monero bakiyeleri, CashPilot'un asla istemediği özel bir görüntüleme anahtarı (view key) olmadan zincir üstünde okunamaz; bu yüzden her ödemeyi kendiniz onaylarsınız."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Monero ödeme adresiniz: madencinizin SupportXMR'da kullandığı kullanıcı adı, herhangi bir <b>.workername</b> veya <b>+difficulty</b> kısmı olmadan. Herkese açıktır ve hiçbir fonun kilidini açmaz."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "pool.supportxmr.com adresine yönlendirilmiş bir Monero madencisi (XMRig) gerekir"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "işlem gücü"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Hayır. Madenciniz havuza hash gönderir; kimse bağlantınız üzerinden trafik yönlendirmez."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Monero adresiniz, seçtiğiniz worker adları, hash oranınız ve madencinizin havuzun gördüğü IP adresi."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Bir madenci havuza tek bir bağlantı açık tutar ve az bant genişliği kullanır. Dikkat edilmesi gereken maliyet İSS'niz değil, elektriktir."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Hesap yoktur. Kimlik adrestir ve herkes onun istatistiklerini supportxmr.com üzerinde görebilir."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Yalnızca Monero ile ödeme yapılır; %0.6 havuz ücreti vardır ve otomatik ödemeden önceki varsayılan eşik 0.1 XMR'dır."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot, SupportXMR için madenci çalıştırmaz: kendi madencinizi havuza yönlendirirsiniz, CashPilot yalnızca bakiyeyi okur."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol, bir Beacon ağı aracılığıyla yapay zekâ ajanlarına canlı web erişimi sağlar. Teneo Beacon, Teneo'nun Android, iOS, macOS, Windows ve Linux için kendi uygulamasıdır; sunucular ve Raspberry Pi için bir komut satırı sürümü de vardır. Onay ekranını kabul ettikten sonra kullanılmayan bant genişliğinizi paylaşır ve çevrimiçi olduğu sürece Teneo Protocol Points ve Fragments kazanır. Fragments, USDC ile ödenen sezonluk çekilişlere (Beacon Drop) sayılır. Teneo'ya göre Beacon, eski tarayıcı eklentisinin iki katı puan kazanır. İnternet bağlantısı başına bir Beacon kazanır. Aynı bağlantıdaki diğer cihazlar beklemede kalır. Expedition Hub'da referans bağlantısıyla veya PSA3BHPJ koduyla kaydolun, ardından Beacon'da oturum açın.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "DePIN bant genişliği uygulaması (Beacon) - sezonluk USDC çekilişleri için Fragments, referans bağlantısıyla +100 Fragments"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Teneo Points ve Fragments kazandırır. Fragments sezonluk USDC çekilişlerine sayılır; yani bir sezon sabit bir oran değil, bir ödül öder. Teneo'ya göre Beacon, tarayıcı eklentisinin iki katı puan kazanır. 3 kata kadar Fragments için takviyeyi her 8 saatte bir talep edin; kaçırılan bir süre çarpanı düşürür."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Sezonluk çekiliş (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Beacon Drop ödülleri, Expedition Hub'da bağladığınız bir cüzdana USDC olarak ödenir. Hub, cüzdan bağlamak için kaç gününüz kaldığını gösterir; zamanında cüzdan bağlanmayan bir ödül kaybedilir."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Bir sezonun ödülleri ödenmeden önce Expedition Hub'da bir cüzdan bağlayın; Hub, cüzdanı zamanında bağlanmayan ödülü iptal eder."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "Arkadaş 7 gün içinde kaydolup 480 Fragments kazandığında, davet edilen her arkadaşın Fragments'ının %8'i ve onların davet ettiklerinin Fragments'ının %2'si"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "Kayıtta +100 Fragments ve 480 Fragments'a ulaştığınızda +150 daha"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "İnternet bağlantısı başına bir Beacon kazanır. Veri merkezi makineleri yalnızca Teneo'nun etkinleştirdiği barındırma sağlayıcılarında, yarı Fragments ile ve puan veya referans bonusu olmadan kazanır. VPN bağlantıları asla kazanmaz."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Beacon'ın Fragments'ı yalnızca sezonluk çekilişlerde ödül olarak USDC öder, bu yüzden çalıştırmak belirli bir tutar kazandırmaz."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo'ya göre puanlar $TENEO token'ında değil, devredilemeyen bir ödül token'ı olan $AGENTIC'te birleştirilecek."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "Daha önceki 2026'nın ikinci çeyreği hedefi geçtikten sonra, Kasım 2026 itibarıyla $TENEO için bir lansman tarihi, dağıtım payı veya talep süreci doğrulanmamıştı."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot, Teneo'yu çalıştırmaz: sağlayıcının kendi Beacon uygulamasını kurarsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo'ya göre trafik denetlenmiş kurumsal müşterilerden gelir ve özel adresler ile kötüye kullanıma açık portlar engellenir, ancak bu müşterileri nasıl denetlediği belirtilmez."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network, köklü bir merkeziyetsiz video dağıtım ve yapay zekâ işlem gücü ağıdır (2018'den beri). Kullanıcılar bant genişliği, depolama ve işlem gücü paylaşan Edge Node'lar çalıştırır. Büyük içerik ortaklıkları vardır. TFUEL token kazandırır.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "Merkeziyetsiz CDN + yapay zekâ işlem gücü - TFUEL ödülleri, köklü proje"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Yalnızca masaüstü uygulaması. Kazanç kaynaklara ve konuma bağlıdır. Büyük ortaklıkları var, tüm borsalarda listelenir."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Sürekli"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot, Theta Edge'i çalıştırmaz: sağlayıcının kendi masaüstü uygulamasını kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "893de938ed14"
titan.description:
  text: "Titan Network, TNT token ödülleri karşılığında IP adresinizi, depolama alanınızı ve bant genişliğinizi paylaşan bir DePIN platformudur. Windows, Mac ve Android'de kullanılabilir. Düğümler merkeziyetsiz bir CDN'e ve depolama katmanına katkıda bulunur. Tipik kazanç, paylaşılan kaynaklara ve coğrafi konuma bağlı olarak ayda $5-30 arasındadır.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "IP, depolama, bant genişliği paylaşan DePIN - ayda $5-30"
  source: "799e68401067"
titan.earnings.notes:
  text: "IP, depolama ve bant genişliği paylaşır. Kazanç, sağlanan kaynaklara ve bölgeye bağlıdır. Daha fazla depolama tahsisi daha yüksek ödül getirir."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Dönem (epoch) bazlı"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Titan'ın kendi yardım sayfasına göre çalışan bir düğüm kazanç garantisi vermez: atanmış görev yoksa hiçbir şey kazanmaz ve ödüller TNT token cinsindendir."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot, Titan'ı çalıştırmaz: sağlayıcının kendi uygulamasını veya eklentisini kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer, bant genişliğini doğrulanmış işletmelerle paylaşarak internet trafiğinizden gelir elde etmenizi sağlar. Ev bağlantılarının yanı sıra VPS ve veri merkezi IP'lerinde de iyi çalışan az sayıdaki bant genişliği paylaşım hizmetinden biridir. Komut satırı argümanlarıyla iletilen basit, token tabanlı bir kimlik doğrulama kullanır. Raspberry Pi ve benzeri cihazlar için ARM mimarilerini destekler.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Bant genişliği paylaşımı - VPS'te çalışır, token tabanlı kimlik doğrulama"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Token"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Cihaz adı"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "<a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a> adresinde oturum açın, F12'ye basın → Application → Local Storage → <code>https://app.traffmonetizer.io</code> öğesine tıklayın → <code>authToken</code> değerini kopyalayın (yaklaşık 54 karakter: rakamlar, bir <code>|</code>, ardından harfler ve rakamlar)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Cihaz yönetimi için panoda gösterilen ad"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "VPS ve veri merkezi IP'leri ev IP'lerinden daha az kazanır. ABD/AB konumları daha çok kazanır. Docker ağlarıyla birden fazla IP desteklenir."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Minimum $10. PayPal artık sunulmuyor. Önce profilde bir ödeme yöntemi kaydedin: Solana veya TON üzerinde USDT (en düşük ücretler), Arbitrum (düşük ücretler) veya Tron TRC20 (yüksek ağ ücretleri) ya da en az $1.000 tutarında banka havalesi. Kaydettiğiniz ilk adres hemen geçerli olur; sonradan değiştirmek için e-posta onayı gerekir. Pano, ilk para çekmeden önce bir mesajlaşma iletişim bilgisi (WhatsApp, Telegram veya Skype) isteyebilir. Bir talep tam dolar olarak öder ve sentler bakiyede kalır."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "Profilin ödeme ayarlarında kaydedilen zincirde (Solana, TON, Arbitrum veya Tron) USDT ya da banka havalesi. Adres konteynerde değil, Traffmonetizer'ın ayarlarında durur."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "<a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a> adresinde oturum açın, F12'ye basın → Application → Local Storage → <b>authToken</b> değeri (yaklaşık 54 karakter: rakamlar, bir <code>|</code>, ardından harfler ve rakamlar)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "Talep ettikleri her ödemenin %10'u"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Traffmonetizer kullanım koşulları ev IP'si gerektirir, ancak pratikte VPS düğümleri kabul edilir."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot'ta 1.9 puanı var; 2023'ten Kasım 2026'ya kadarki yorumcular haftalarca bekleyen veya eşleşen bir işlem olmadan tamamlandı olarak işaretlenen ödemeler bildiriyor."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Aynı yorumcular canlı sohbet ve e-posta desteğinin, bazen haftalarca, yanıt vermediğini bildiriyor."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Yalnızca kripto veya en az $1.000 tutarında banka havalesi; PayPal kaldırıldı ve bir talep yalnızca tam dolar öder."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Traffmonetizer'ın koşulları ev IP'si gerektirir, bu yüzden barındırma bağlantısındaki bir sunucu koşulların dışında kalır."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "2023-2025 arasındaki dört Trustpilot yorumcusu çok yavaş kazanç bildiriyor; örneğin dört cihazda günde bir sent veya $10'a ulaşmak için neredeyse iki yıl."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Bir ödeme için yalnızca e-postayla onaylanmış, kaydedilmiş bir kripto adresi gerekir; pano bir mesajlaşma iletişim bilgisi isteyebilir."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer kendi Docker imajını yayımlar: traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "CPU'nuzla madencilik yapın ve seçtiğiniz coin ile, örneğin SHIB, DOGE veya XMR ile ödeme alın. CashPilot, XMRig'i unMineable'ın RandomX havuzuna karşı çalıştırır ve unMineable, CPU'nuzun kazdığı Monero'yu sizin coin'inize çevirir. Bakiyeniz coin'in ödeme eşiğine ulaştığında herkese açık adresinize ödeme yapar. CashPilot'un dağıttığı her worker, CashPilot'un unMineable referans kodunu taşır; bu da platform ücretinizi %1'den %0.75'e düşürür. Elektrik, kazandığınızdan daha pahalıya gelebilir."
  source: "a91a1a6282bd"
unmineable.short_description:
