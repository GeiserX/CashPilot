earnapp.description:
  text: "Bright Data'nın EarnApp uygulaması, kullanılmayan bant genişliğinizi satarak pasif gelir elde etmenizi sağlar. Bright Data, Fortune 500 şirketlerinin veri toplama işlerine güç veren, dünyanın en büyük proxy ağıdır. CashPilot bunu kendi imajıyla çalıştırır: bu imaj ilk başlatmada sabitlenmiş EarnApp sürümünü Bright Data'nın CDN'inden indirir, sha256 değerini kontrol eder ve yalnızca bir UUID ile lite modunda çalıştırır.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Bant genişliği paylaşımı - Bright Data destekli"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
