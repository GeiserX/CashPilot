  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "Arka uç API URL'sini geçersiz kılın (varsayılan: https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "Konteyner ilk başlatmada kendini otomatik olarak kurar: bir secp256k1 cüzdanı (BIP-39) oluşturur, ECDSA sınama-yanıt yöntemiyle kimlik doğrular ve yalnızca doğrudan modda bant genişliği satmaya başlar. Tüm durum (cüzdan, oturum token'ı, satıcı yapılandırması) <code>proxybase-data</code> biriminde saklanır. Cüzdan adresi için ilk çalıştırmada konteyner günlüklerine bakın. Harici proxy yeniden satış yolları eklemek için <code>--upstream</code> kullanın.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "Oluşturulan cüzdanın anahtar dosyası. Bu birim paranın KENDİSİDİR: sunucu tarafında bir kopyası yoktur, bu yüzden onu silmek fonları da yok eder."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Kazanç, piyasa fiyatlarından satılan GB miktarına dayanır. VPS/veri merkezi IP'leri ev IP'lerinden daha az kazanır. Çoklu upstream modu, kendi bant genişliğinizi harici proxy'lerle birleştirebilir."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Kazançları <code>proxybase-cli seller payout create</code> ile kilitleyin; Tempo Chain üzerinde USDC olarak alınır (Tempo MPP). Anahtarı sizde olan herhangi bir EVM adresine ödeme yapar (Tempo bir EVM zinciridir) ve imzalanacak bir şey yoktur; USDC'yi görmek için Tempo ağını cüzdana ekleyin. Hâlâ listelemeyen bir cüzdana Tempo USDC token'ını elle eklemeniz gerekir: Proxybase'in verdiği sözleşme adresiyle içe aktarın ve bakiyeye güvenmeden önce o adresi kontrol edin."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "İstemci ilk çalıştırmada kendi cüzdanını oluşturur."
  source: "e4a9ee1e1f5c"
