  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "EarnApp düğüm kimliğiniz: 'earnapp showid' komutunun yazdırdığı gibi, sdk-node- ve ardından 32 küçük harfli onaltılık karakter. Dağıttıktan sonra, EarnApp'te oturum açıkken https://earnapp.com/r/ ve ardından bu UUID'den oluşan adresi açarak bir kez bağlayın; bağlanmamış bir düğüm kazanır, ancak bakiyenize hiçbir şey ulaşmaz"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp sunucularına ulaşmakta sürekli başarısız oluyor ve yeniden başlıyor, bu yüzden çok az kazanıyor ya da hiç kazanmıyor. Bu kopyayı yeniden başlatın; sorun devam ederse bu makinenin internet bağlantısını kontrol edin."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Düğümü hesabınıza eklemek için EarnApp'te oturum açıkken bu bağlantıyı açın. Bunu yapana kadar düğüm kazanır, ancak bakiyenize hiçbir şey ulaşmaz."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Büyük ölçüde konuma bağlıdır. En çok ABD/AB IP'leri kazanır. Kazanç, kullanılan bant genişliğiyle orantılı artar."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Talep üzerine (otomatik çekim mevcut: PayPal min. $10, Wise min. $10, Amazon min. $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Otomatik çekimi bir kez açın; EarnApp, bakiye yöntemin minimum tutarına ulaştığında kendiliğinden ödeme yapar: PayPal $10, Wise $10, Amazon $50. PayPal ödemeleri Bright Data Ltd.'den gelir. Ekim 2026'da bir PayPal ödemesi, çekilen bakiyenin yaklaşık %2 altında geldi."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Bakiye EarnApp'te tutulur; Amazon/Wise/PayPal'a çekilir."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
