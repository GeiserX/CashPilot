ionet.rating.cons.3.text:
  text: "CashPilot, io.net'i çalıştırmaz: sağlayıcının kendi worker yazılımını kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "1cac289c99ad"
iproyal.description:
  text: "IPRoyal Pawns, kullanılmayan bant genişliğinizi paylaşarak kazanmanızı sağlar. IPRoyal köklü bir proxy sağlayıcısıdır ve Pawns, onların ev bant genişliği paylaşım koludur. CLI Docker imajı kimlik bilgilerini komut satırı bayraklarıyla kabul eder. Bir referans bağlantısıyla kaydolan yeni kullanıcı, ilk üç ödemesinin her birinde $1, toplamda en fazla $3 alır. Her ödeme, konuma göre belirlenen bir ila üç haftalık bir süre içinde gelmelidir. Süre kayıtla başlar ve her ödemeden sonra yeniden başlar. Bir süre önce dolarsa kalan bonuslar kaybedilir.\n"
  source: "b12878d5917a"
iproyal.short_description:
  text: "Bant genişliği paylaşımı - ilk ödemelerinizde $3'a kadar bonus"
  source: "20091c7b26ed"
