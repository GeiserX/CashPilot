  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "Madencinizin HeroMiners'ta kullandığı herkese açık Kaspa ödeme adresinin tamamını girin. <b>kaspa:</b> önekini ekleyin ve worker adını yazmayın.\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "HeroMiners'a yönlendirilmiş bir Kaspa madencisi gerekir"
  source: "898e36e7a701"
herominers-kas.disclosure.sells:
  text: "işlem gücü"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "Hayır. Madenciniz madencilik işini havuza gönderir."
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "Havuzun herkese açık istatistikleri her ödeme adresini ve madencilik etkinliğini gösterir."
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
