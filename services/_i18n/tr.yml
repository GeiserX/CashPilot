  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN, hesap gerektirmeyen bir Bitcoin madencilik havuzudur: madenciniz kullanıcı adı olarak Bitcoin adresinizle oturum açar ve havuz o adrese ödeme yapar. CashPilot burada bir madenci çalıştırmaz. OCEAN'ın adresiniz için tuttuğu ödenmemiş bakiyeyi okur; böylece ASIC'inizin (bir Bitaxe, bir Antminer) ne kazandığını diğer gelirlerinizin yanında görürsünüz. Ödenmemiş bakiye kazanılmıştır ama henüz alınmamıştır: OCEAN, ödeme eşiğini geçtiğinde bunu zincir üstünde öder.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Bitcoin madencilik havuzu, ödeme adresinizle takip edilir"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Bir blok bakiyenizi eşiğin üzerine çıkardığında"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN, ödenmemiş bakiyeniz eşiğe ulaştığında adresinize zincir üstünde ödeme yapar. Lightning ödemeleri (isteğe bağlı, BOLT12) CashPilot tarafından algılanmaz."
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "Ödenmemiş tutar kazanılmıştır, ancak Lightning ödemelerini açmadıysanız OCEAN bunu bu adrese zincir üstünde ödeyene kadar alınmış sayılmaz."
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "BTC ödeme adresiniz: madencinizin OCEAN'da kullandığı kullanıcı adı, <b>.workername</b> kısmı olmadan. Herkese açıktır ve hiçbir fonun kilidini açmaz."
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "mine.ocean.xyz:3334 adresine yönlendirilmiş bir Bitcoin ASIC madencisi (bir Bitaxe, bir Antminer) gerekir"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "işlem gücü"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
  text: "Hayır. Madenciniz havuza hash gönderir; kimse bağlantınız üzerinden trafik yönlendirmez."
  source: "7239118f749a"
ocean.disclosure.data_collected:
  text: "Bitcoin adresiniz, seçtiğiniz worker adları, hash oranınız ve madencinizin havuzun gördüğü IP adresi."
  source: "22282404721c"
ocean.disclosure.isp_risk:
  text: "Bir madenci havuza tek bir bağlantı açık tutar ve az bant genişliği kullanır. Dikkat edilmesi gereken maliyet İSS'niz değil, elektriktir."
  source: "7bf5f9f6b028"
ocean.disclosure.account_rules:
  text: "Hesap yoktur. Kimlik adrestir ve herkes onun istatistiklerini ocean.xyz üzerinde görebilir."
  source: "e3c8fd5863c1"
ocean.rating.cons.0.text:
  text: "Yalnızca Bitcoin ile ödeme yapılır ve bakiyeniz 0.01048576 BTC'ye ulaşana kadar zincir üstünde hiçbir ödeme yapılmaz."
  source: "9c9981f2fbd5"
ocean.rating.cons.1.text:
  text: "%2 havuz ücreti; DATUM ile kendi blok şablonlarınızı oluşturursanız %1."
  source: "497f4f1ec62e"
ocean.rating.cons.2.text:
  text: "CashPilot, OCEAN için madenci çalıştırmaz: kendi donanımınızı havuza yönlendirirsiniz, CashPilot yalnızca bakiyeyi okur."
  source: "eccc0b4b47ae"
ocean.rating.pros.0.text:
  text: "Hesap ve kimlik kontrolü yok. OCEAN yalnızca ödeme yaptığı Bitcoin adresini ister."
  source: "38c4a7764846"
packetstream.description:
  text: "PacketStream, kullanılmayan bant genişliğinizi satabileceğiniz eşler arası bir bant genişliği pazarıdır. Pazar araştırması, SEO izleme ve reklam doğrulama için kullanılan bir ev proxy ağına güç verir. Yalnızca bir CID (Client ID) gerektiren basit bir Docker kurulumu vardır. CAPTCHA korumalı girişin, kazançların otomatik toplanmasını zorlaştırabileceğini unutmayın.\n"
  source: "ee363f486228"
packetstream.short_description:
  text: "Bant genişliği paylaşımı - CID tabanlı basit kurulum"
  source: "583d6cb0e210"
packetstream.docker.env.CID.label:
