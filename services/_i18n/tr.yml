repocket.docker.env.RP_API_KEY.description:
  text: "Repocket API anahtarınız: <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> adresinde oturum açın ve bandwidth-earnings sayfasında gösterilen API anahtarını kopyalayın (bu, hesap şifreniz DEĞİLDİR). Hesabınız yok mu? <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a> ile kaydolun"
