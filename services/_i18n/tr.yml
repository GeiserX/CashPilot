proxyrack.rating.pros.0.text:
  text: "ProxyRack kendi Docker imajını yayımlar (proxyrack/pop) ve veri merkezi IP'lerini daha düşük bir ücretle kabul eder."
  source: "278541f81053"
repocket.description:
  text: "Repocket, kullanılmayan internet bant genişliğinizi paylaşarak pasif gelir elde etmenizi sağlar. En çok ev IP'leri kazanır; VPS/veri merkezi IP'leri daha düşük ücretlerle kabul edilir. Hesap başına en fazla 5 cihaz ve 5 etkin oturum. Docker konteyneri, hesabınızın e-posta adresi ve Repocket panosundan alınan bir API anahtarıyla kimlik doğrular (şifrenizle değil).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Bant genişliği paylaşımı - en fazla 5 cihaz, API anahtarıyla kimlik doğrulama"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
