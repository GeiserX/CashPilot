deeper-network.rating.cons.1.text:
  text: "CashPilot, Deeper Network'ü çalıştırmaz: sağlayıcının kendi yönlendirici donanımını kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
