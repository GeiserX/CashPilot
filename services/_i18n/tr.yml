proxybase.payout.notes:
  text: "Kazançlar, Access Token'ın ait olduğu ProxyBase HESABINDA birikir ve talep üzerine panodan çekilir. Eş istemcisi cüzdan tutmaz ve konteyner hiçbir durum saklamaz -- docker.volumes boştur. Gerçekten yerel bir cüzdan oluşturan ve bunu kritik bir birim olarak bildiren proxybase-xyz (ProxyBase Markets, aynı kuruluş) ile karıştırılmamalıdır."
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
