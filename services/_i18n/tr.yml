  source: "1844ccbbc00a"
storj.description:
  text: "Storj, kullanılmayan disk alanınızı kiraya vererek kazandığınız merkeziyetsiz bir bulut depolama ağıdır. Depolama düğümünü Docker ile çalıştırın; depolanan TB başına ayda $1.35 ve çıkış trafiği için TB başına $1 kazanın (1 Eylül 2026'dan beri geçerli ücretler). Ödemeler, bakiye ücrete dayalı bir minimumu aştığında, sizin kontrol ettiğiniz bir cüzdana Ethereum ana ağında USDC (ABD dolarına sabitlenmiş bir stablecoin) olarak aylık yapılır (Eylül 2026 ödemesine kadar STORJ token ile yapılıyordu). En az 550GB kullanılabilir disk alanı ve sabit bir internet bağlantısı gerektirir. Hesap veya kayıt gerekmez -- düğümler 2025 ortasından beri izin gerektirmez. DİKKAT (Ekim 2026): Storj Labs, eski borçlarını yeniden yapılandırmak için 26 Temmuz 2026'da Chapter 11 başvurusunda bulundu (ABD İflas Mahkemesi, Batı Virginia Kuzey Bölgesi, dava 5:26-bk-00512). Ağ çalışmaya devam ediyor ve Storj etkin düğümlere ödeme yapmayı sürdürüyor, ancak başvurudan önceki düğüm kazançları mahkeme bunlar hakkında karar verene kadar dondurulmuş durumda. STORJ token'ı 2021'deki zirvesinden yaklaşık %98 düştü. Binance onu 3 Eylül 2026'da listeden çıkardı ve Coinbase 28 Eylül 2026'da işlemlerini askıya aldı. Yeni bir düğüm ilk dokuz ayında kazancının bir kısmını alıkoyar ve yalnızca müşteri talebinin izin verdiği ölçüde dolar; bu yüzden şimdi bir düğüm başlatmak, uzun bir geri ödeme süresini hâlâ tasfiye edilebilecek, yeniden yapılandırma sürecindeki bir şirkete bağlamak demektir.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Merkeziyetsiz depolama düğümü - depolanan TB başına $1.35 + çıkış trafiği TB başına $1"
  source: "c68d5964b002"
