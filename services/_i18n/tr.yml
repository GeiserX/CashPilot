srbminer-multi.earnings.notes:
  text: "Elektrik öncesi brüt tahmin. 2026-11-25 tarihinde hashrate.no, yaklaşık 142 W çeken bir RTX 4070 için Pearl'de günde yaklaşık $2.45 tahmin etti. Bunu biz ölçmedik. Pearl yeni bir coin'dir; fiyatı ve zorluğu hızla değişir. Kârlı olup olmadığını görmek için GPU'nuzun güç tüketimini ve elektrik fiyatınızı kontrol edin."
  source: "e7b856e43825"
