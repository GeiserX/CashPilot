uprock.description:
  text: "Uprock, internet bağlantınızı paylaşarak kripto para kazanmanızı sağlayan bir DePIN (Merkeziyetsiz Fiziksel Altyapı Ağı) platformudur. Daha geniş Web3 ekosisteminin bir parçasıdır. Topluluk Docker imajları mevcuttur ancak resmi bir imaj yoktur. Ana arayüz tarayıcı eklentisidir.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "DePIN internet paylaşımı - kripto ödeme, ana istemci tarayıcı eklentisi"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Kripto/token tabanlı kazanç. Resmi Docker imajı yoktur; ana istemci tarayıcı eklentisidir."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
uprock.cashout.notes:
  text: "UPT token'ları, iki faktörlü kimlik doğrulama açıkken, 250 UPT'den itibaren bir Solana cüzdanına çekilir. Bir para çekme ücreti uygulanır."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "UpRock'ın yardım merkezine göre para çekme işlemleri, 250 UPT minimumla, bir Solana cüzdanına UPT token olarak yapılır."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "Ödüller UPT token'larıdır; yorumcular ve üçüncü taraf bir inceleme değerlerinin çok düşük olduğunu söylüyor."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot, UpRock'ı çalıştırmaz: sağlayıcının kendi uygulamasını veya eklentisini kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork, merkeziyetsiz bir VPN ve bant genişliği paylaşım ağıdır. Topluluk sağlayıcısı olarak bant genişliği sunarak kazanırsınız. Sağlayıcı programı, hesabınızın e-posta adresi ve şifresiyle kendi kimliğini doğrular (auth-provide alt komutu) ve ortaya çıkan oturum JWT'sini veri biriminde saklar. BringYour, Inc.'in resmi Docker imajı.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "Merkeziyetsiz VPN/bant genişliği - e-posta+şifre ile giriş, JWT oturumu birimde"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "E-posta"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Şifre"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "URnetwork hesabınızın e-posta adresi (<a href=\"https://ur.io\" target=\"_blank\">ur.io</a> adresinde kullandığınız giriş bilgisi). Google/Apple ile oturum açılarak oluşturulan hesapların önce bir şifre belirlemesi gerekir. Hesabınız yok mu? <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a> ile kaydolun"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "URnetwork hesabınızın şifresi (boşluksuz). Sağlayıcının auth-provide girişi tarafından kullanılır; oturum daha sonra veri biriminde saklanır."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "VPS'te ve ev bağlantılarında çalışır. 2026-10-06'dan beri haftalık dönem (epoch) başına SN25α (Bittensor subnet 25) ile ödenir. Çoklu IP kurulumları için proxy modunu destekler."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "Dönem (epoch) bazlı"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "ur.io/app/account/earnings sayfasında bir Bittensor coldkey ayarlayın (Talisman, TAO.com veya bir WalletConnect cüzdanıyla imzalanır), ardından sonuçlanan her dönemi talep edin. Bir talep, gas ücretini bir EVM gas anahtarından TAO ile öder. TALEP EDİLMEYEN DÖNEMLERİN SÜRESİ DOLAR; eski USDC ödemeleri ise 30 gün içinde cüzdan bağlanmadığında iptal edildi."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "Arkadaş başına günde 3 GiB ücretsiz UR verisi, en fazla 20 arkadaş (para değil, veri)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "Katıldıktan sonraki 90 gün içinde 2 gün boyunca uygulama üzerinden en az 10 MiB kullandığınızda günde 3 GiB ücretsiz UR verisi; aksi halde referans sona erer"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Talep edilmeyen dönemlerin süresi dolar ve eski USDC ödemeleri, 30 gün içinde cüzdan bağlanmayan ağlar için iptal edildi."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "Ekim 2026'dan beri ödüller bir Bittensor subnet token'ı olan SN25α ile ödenir ve her talep TAO cinsinden gas ücretine mal olur."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork'ün eski adı BringYour'dı; arşivlenmiş teknik belgesi (whitepaper) eski adı taşıyor."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork, sağlayıcı istemcisinin kaynak kodunu yayımlar."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork kendi Docker imajını yayımlar (bringyour/community-provider) ve VPS ile ev bağlantılarında çalışır."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Bir talep için yalnızca kontrolünüzdeki bir Bittensor cüzdanı gerekir."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai, NVIDIA GPU'nuzu AI/ML araştırmacılarına ve geliştiricilerine kiraya verdiğiniz bir GPU bulut pazarıdır. Saatlik fiyatlarınızı kendiniz belirlediğiniz, Docker tabanlı bir platformdur. Bir RTX 3090 kiralandığında tipik olarak saatte $0.20-0.40 kazanır. Güncel sürücülere sahip bir NVIDIA GPU ve sabit bir internet bağlantısı gerektirir. Gelir büyük ölçüde GPU modeline, fiyatlandırma stratejisine ve piyasa talebine bağlıdır.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "GPU pazarı - fiyatlarınızı kendiniz belirleyin, RTX 3090 saatte ~$0.20-0.40"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "API Anahtarı"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "Panodan alınan Vast.ai ev sahibi API anahtarı"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "Kiralandığında RTX 3090 saatte ~$0.20-0.40, RTX 4090 saatte ~$0.40-0.80. Kullanım oranı değişkendir. NVIDIA GPU, Linux ana makine, Docker ve nvidia-container-toolkit gerektirir. Fiyatlarınızı kendiniz belirleyin."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Haftalık (cuma günleri)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "Kazançlar Vast.ai bakiyesinde birikir. Wise, PayPal veya Stripe ile çekin."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "Davet edilen kiracıların harcamalarının %3'ü, hesapları var olduğu sürece, referans kredisi olarak; %75'e kadarı özel bir referans hesabından nakde çevrilebilir"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Bir ev sahibi yalnızca kiralandığı sürece kazanır ve Vast'ın bir tüketici GPU'su için verdiği rakamlar kiralama türüne ve güvenilirlik puanına bağlıdır."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot, Vast.ai'yi çalıştırmaz: Vast'ın barındırma yazılımını kendi GPU makinenize kurarsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Vast, barındırmayı bir Linux ana makinede Docker üzerine kurar."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Vast'a göre ev sahibinin belirlediği ücret, hiçbir ücret kesilmeden aldığı ücrettir."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "Ödemeler, $20 minimumdan itibaren Wise, PayPal veya Stripe ile yapılır ve haftalık faturalandırılır; daha küçük bir bakiye bir sonraki haftaya devreder."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter, Windows, Mac, Linux ve Android'de kullanılabilen bir bant genişliği paylaşım platformudur. Paylaşılan bant genişliği için GB başına $1'a kadar ödeme yaptığını ve minimum ödeme eşiğinin $20 olduğunu iddia eder. Platform, geleneksel bant genişliği paylaşım uygulamalarına benzer şekilde çalışır ve meşru trafiği ev bağlantıları üzerinden yönlendirir.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Bant genişliği paylaşımı - GB başına $1'a kadar iddiası, minimum ödeme $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "GB başına $1'a kadar ödediğini iddia eder, ancak gerçek kazançlar daha düşüktür. Minimum ödeme $20. Kazanç konuma ve talebe göre büyük ölçüde değişir."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "Talep üzerine"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter'ın web panosu yoktur. Wipter masaüstü veya telefon uygulamasını açın, oturum açın ve bakiye $20'a ulaştığında ödemeyi oradan talep edin. Wipter yalnızca BNB Smart Chain (BEP20) üzerinde USDT ile, uygulamanın Payments bölümünde ayarladığınız cüzdana ödeme yapar; PayPal seçeneği yoktur."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Henüz belirlenmedi: CashPilot bu hizmetin kazançlarınızı nerede tuttuğunu henüz kontrol etmedi."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "Minimum ödeme tutarına ulaştıklarında trafik kazançlarının %10'u; davet ettiğiniz arkadaş sayısında sınır yok"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "$5 kayıt bonusu"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot, Wipter'ı çalıştırmaz: sağlayıcının kendi masaüstü veya telefon uygulamasını kullanırsınız, bu yüzden CashPilot onu sizin için dağıtamaz veya güncelleyemez. Kullanım koşulları konteyner kullanımı açısından incelenmedi."
  source: "fa32942c6b4f"
xmrig.description:
  text: "CPU'nuzla Monero kazın. CashPilot XMRig'i çalıştırır ve seçtiğiniz havuz herkese açık ödeme adresinize Monero öder. XMRig, geliştiricilerini desteklemek için hash süresinin %1'ini kullanır. Elektrik, kazandığınız XMR'dan daha pahalıya gelebilir."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "CPU'nuzla ve seçtiğiniz havuzla Monero kazın"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Monero adresi"
  source: "a888ebb3ae9b"
xmrig.docker.env.POOL_URL.label:
  text: "Havuz"
  source: "f13024272c38"
xmrig.docker.env.WORKER_NAME.label:
  text: "Worker adı"
  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "En fazla CPU iş parçacığı (%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "RandomX modu"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "Elektrik öncesi brüt tahmin. 2026-11-25 tarihinde, gözlenen XMR fiyatı ve ağ zorluğuyla 1 kH/s ayda yaklaşık $1 değerindeydi. İş parçacıklarının yarısını kullanan bir masaüstü CPU 30 ila 50 W ek güç çekebilir. Kârlı olup olmadığını görmek için gerçek tüketiminizi ve elektrik fiyatınızı kontrol edin."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, siz düşürdükten sonra)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Havuz eşiğine ulaşıldığında"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "Bakiyeniz eşiğinize ulaştığında havuz Monero adresinize ödeme yapar. Havuz size ödeme yapana kadar bakiyeyi tutar."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Bu makine bir barındırma bağlantısı bildiriyor. Madencilik yapmadan önce sağlayıcınızın koşullarını kontrol edin. Hetzner Cloud dahil bazı sağlayıcılar bunu yasaklar. Bir kâr tahminine güvenmeden önce gerçek elektrik maliyetlerinizi kontrol edin."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "Varsayılan havuz MoneroOcean %0 madencilik ücreti alır. Varsayılan ödeme eşiği 0.3 XMR'dır ve bunu 0.003 XMR'a düşürebilirsiniz. 4 XMR'ın altındaki ödemeler 0.0004 XMR'a kadar ücrete mal olabilir. Diğer havuzlar kendi oranlarını ve eşiklerini belirler."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "işlem gücü"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "Hayır. Madenci işi madencilik havuzlarına gönderir."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Monero adresiniz, worker adınız ve IP adresiniz havuza gider."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "Bazı ağlar ve DNS çözümleyicileri madencilik havuzu bağlantılarını engeller."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "Çoğu Monero havuzu sizi herkese açık ödeme adresinizle tanımlar."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Bir ödeme için havuz eşiğinizi karşılayacak kadar XMR gerekir."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "Bazı barındırma sağlayıcıları kripto para madenciliğini yasaklar."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "Ek elektrik, kazanılan XMR'dan daha pahalıya gelebilir."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "Madenci havuzlara hash gönderir ve başkasının trafiğini aktarmaz."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "Madenci açık kaynaktır ve imaj, imzalı bir upstream sürümüne sabitlenmiştir."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Kendinizi adınızla tanıtmadan, herkese açık bir Monero adresiyle madencilik yapabilirsiniz."
  source: "752cbb728aac"
