mysterium.disclosure.sells:
  text: "बैंडविड्थ। आपका कनेक्शन Mysterium नेटवर्क के लिए एग्ज़िट नोड के रूप में इस्तेमाल होता है, जो VPN, प्रॉक्सी और डेटा-स्क्रैपिंग सेवाएँ बेचता है। आवासीय IP से निकलने वाला स्क्रैपिंग ट्रैफ़िक वह इस्तेमाल है जिस पर शिकायतें आने की सबसे ज़्यादा संभावना है, और आप नहीं चुन सकते कि आपका नोड इन तीनों में से कौन सा ले जाए।"
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "हाँ। अनजान लोग अपना ट्रैफ़िक आपके IP पते से भेजते हैं — यही प्रोडक्ट है।"
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "नोड की पहचान (एक ब्लॉकचेन पता), आपका IP, और मोटी लोकेशन (देश/शहर/ISP), जिसे नोड नेटवर्क पर प्रकाशित करता है ताकि खरीदार उसे चुन सकें।"
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "वास्तविक और समझने लायक। दूसरे लोगों का ट्रैफ़िक आपके नाम से आपके कनेक्शन से निकलता है, इसलिए वे जो भी करें वह आपकी लाइन से आया दिखता है। कई घरेलू ISP अनुबंध इसे मना करते हैं। इसे चलाने से पहले अपना अनुबंध जाँचें।"
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "प्रति खाता और प्रति IP असीमित डिवाइस।"
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "हर सेटलमेंट का लगभग 21% शुल्क में जाता है, 20% Hermes शुल्क और एक ट्रांज़ैक्शन शुल्क, और कमाई MYST टोकन में दी जाती है।"
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "आपका नोड Mysterium के VPN, प्रॉक्सी और डेटा-स्क्रैपिंग ग्राहकों के लिए एग्ज़िट है, और आप नहीं चुन सकते कि वह इनमें से किसका ट्रैफ़िक ले जाए।"
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "नोड सॉफ़्टवेयर GPL-3.0 के तहत ओपन सोर्स है।"
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium अपनी खुद की Docker इमेज mysteriumnetwork/myst प्रकाशित करता है।"
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
