bytebenefit.rating.cons.2.text:
  text: "CashPilot ByteBenefit नहीं चलाता: आप प्रदाता का अपना ऐप इस्तेमाल करते हैं, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। कंटेनरों के लिए इसकी शर्तें जाँची नहीं गईं।"
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir आपकी इस्तेमाल न हुई इंटरनेट बैंडविड्थ शेयर करके निष्क्रिय आय कमाने देता है। सिर्फ़ Windows और Android समर्थित हैं — आधिकारिक FAQ कहता है कि कोई Linux या Docker क्लाइंट लाने की योजना नहीं है, iOS समर्थित नहीं है, और macOS उपलब्ध नहीं है। कमाई काफ़ी हद तक लोकेशन पर निर्भर करती है। ट्रैकिंग के लिए वेब डैशबोर्ड dash.bytelixir.com पर है। कोई Docker इमेज उपलब्ध नहीं।\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "बैंडविड्थ शेयरिंग - सिर्फ़ Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "सेशन कुकी"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Remember Web कुकी"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "XSRF टोकन"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "<a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a> पर लॉग इन करें, F12 दबाएँ → Application → बाईं साइडबार में <b>Cookies</b> खोलें → उप-आइटम <code>https://dash.bytelixir.com</code> पर क्लिक करें → दाईं ओर की कुकी सूची में <code>bytelixir_session</code> ढूँढें → उसकी Value कॉपी करें (eyJ से शुरू होने वाला एक लंबा JWT)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "उसी जगह (Cookies → <code>https://dash.bytelixir.com</code>) → <code>remember_web_...</code> नाम की कुकी ढूँढें → उसकी Value कॉपी करें (वैकल्पिक, सेशन की अवधि बढ़ाती है)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "उसी जगह → <code>XSRF-TOKEN</code> ढूँढें → उसकी Value कॉपी करें (वैकल्पिक)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "कमाई लोकेशन के अनुसार बदलती है ($2-50/माह)। कोई Docker इमेज नहीं। डेस्कटॉप ऐप या Android ऐप ज़रूरी है।"
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "अनुरोध पर"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "सिर्फ़ क्रिप्टो। न्यूनतम राशि कॉइन पर निर्भर करती है: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250। हर अनुरोध में आप पता टाइप करते हैं। अनुरोध कामकाजी घंटों में, 24 घंटे के भीतर निपटाए जाते हैं।"
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "बैलेंस Bytelixir के पास रहता है; वॉलेट पता हर भुगतान अनुरोध में टाइप किया जाता है, कंटेनर पर कभी सहेजा नहीं जाता।"
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "<a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> पर <b>Remember Me पर टिक करके</b> लॉग इन करें, F12 दबाएँ → Application → बाईं साइडबार में <b>Cookies</b> खोलें → <code>https://dash.bytelixir.com</code> पर क्लिक करें, फिर तीन मान कॉपी करें: <b>bytelixir_session</b>, <b>remember_web_…</b> (इसी उपसर्ग से शुरू होने वाला लंबा वाला) और <b>XSRF-TOKEN</b>। अकेली सेशन कुकी कॉपी करने के लगभग दो घंटे बाद समाप्त हो जाती है, इसलिए उसी दोपहर डेटा संग्रह रुक जाता है; remember_web कुकी एक साल चलती है और वही इसे चालू रखती है।"
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "उनके मुनाफ़े का 50% जीवन भर"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "$1 स्वागत बोनस"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "सिर्फ़ क्रिप्टो, और न्यूनतम राशि कॉइन पर निर्भर करती है, USDT के लिए $5 से लेकर Bitcoin के लिए $250 तक।"
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot Bytelixir नहीं चलाता: आप प्रदाता का अपना ऐप इस्तेमाल करते हैं, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। कंटेनरों के लिए इसकी शर्तें जाँची नहीं गईं।"
