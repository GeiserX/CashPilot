repocket.obligations.avoid-12-month-dormancy.how:
  text: "एक डिवाइस पर शेयरिंग चालू रखें, साइन इन करें, या निकासी करें। अगर आप Repocket का इस्तेमाल बंद करते हैं, तो पहले निकासी करें।"
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "कई Trustpilot समीक्षक बताते हैं कि भुगतान रद्द हुए और बैलेंस शून्य कर दिए गए; एक का कहना है कि सहायता ने अनियमित बैंडविड्थ कमाई का हवाला दिया। पेज Repocket को 2.7 रेटिंग देता है और बताता है कि इसने नकारात्मक समीक्षाओं का जवाब नहीं दिया है।"
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "समीक्षक बताते हैं कि निकासी अस्वीकार हुई और भुगतान के लिए पीछे पड़ना पड़ा।"
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Repocket की भुगतान नीति उसे जब भी कमाई के अमान्य होने का शक हो, उसे वापस लेने, रद्द करने या हमेशा के लिए ज़ब्त करने की छूट देती है, और निष्क्रिय खाते की बिना भुगतान वाली कमाई ज़ब्त करने की भी।"
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "वही नीति Repocket को बिना सूचना के कभी भी भुगतान के तरीके जोड़ने, हटाने या बदलने की छूट देती है; PayPal हटा दिया गया।"
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "शर्तें कहती हैं कि Repocket कभी भी पहचान या खाता सत्यापन माँग सकता है, और भुगतान की पात्रता उसी पर निर्भर करती है।"
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "शर्तें कहती हैं कि Repocket और उसके साझेदार नेटवर्क क्षमता का इस्तेमाल करते हैं, पर यह नहीं बतातीं कि साझेदार कौन हैं या उनकी जाँच कैसे होती है।"
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot बताता है कि Repocket ने नकारात्मक समीक्षाओं का जवाब नहीं दिया है, और समीक्षक कहते हैं कि संदेशों को अनदेखा किया जाता है।"
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "मौजूदा शर्तों में सिंगापुर की Repocket Pte. Ltd. का नाम है; पुरानी शर्तों में किसी कंपनी का नाम नहीं था।"
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket अपनी खुद की Docker इमेज repocket/repocket प्रकाशित करता है, और इसकी शर्तें आपके अपने कंटेनरों की अनुमति देती हैं।"
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "न्यूनतम राशि कम है: पहले भुगतान से पहले $4 और उसके बाद $2।"
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io आपको वितरित AI वर्कलोड के लिए अपना GPU शेयर करने और Salad बैलेंस कमाने देता है, जिसे गिफ़्ट कार्ड, गेम या नकद में रिडीम किया जा सकता है। सिर्फ़ Windows, नेटिव डेस्कटॉप एप्लिकेशन के साथ। एक अलग GPU (NVIDIA या AMD) ज़रूरी है। मशीन खाली होने पर प्लेटफ़ॉर्म AI इनफ़रेंस, रेंडरिंग और दूसरे कंप्यूट कार्य आपकी मशीन पर भेजता है। ज़्यादा आसान GPU शेयरिंग प्लेटफ़ॉर्म में से एक।\n"
  source: "09335baccea6"
salad.short_description:
  text: "AI के लिए GPU शेयरिंग - सिर्फ़ Windows, गिफ़्ट कार्ड या नकद भुगतान"
  source: "4665796e0965"
salad.earnings.notes:
  text: "कमाई GPU मॉडल और काम की उपलब्धता पर निर्भर करती है। RTX 3060 ~$1-3/दिन। सिर्फ़ Windows। नेटिव ऐप, कोई Docker समर्थन नहीं। गिफ़्ट कार्ड, गेम या PayPal में रिडीम किया जा सकता है।"
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "अनुरोध पर"
  source: "be820103712e"
salad.cashout.notes:
  text: "Salad स्टोरफ़्रंट से PayPal या गिफ़्ट कार्ड।"
  source: "5128232e4f57"
salad.payout.notes:
  text: "सिर्फ़ PayPal और गिफ़्ट कार्ड, क्रिप्टो कभी नहीं। कोई वॉलेट पता नहीं होता, इसलिए CashPilot के पास दिखाने के लिए कोई ऑन-चेन बैलेंस नहीं है।"
  source: "202ba88e23ba"
