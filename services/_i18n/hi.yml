  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "अपेक्षाकृत नया प्लेटफ़ॉर्म। कमाई लोकेशन और बैंडविड्थ उपलब्धता के अनुसार बदलती है।"
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "अनुरोध पर"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "न्यूनतम $15। तरीके: BEP20 या Polygon पर USDT ($1 शुल्क) या TRC20 ($3 शुल्क), PayPal, $15 से Amazon या Starbucks गिफ़्ट कार्ड, या $1,000 से बैंक वायर, ट्रांसफ़र शुल्क काटकर। पहले भुगतान से पहले आप एक बिलिंग प्रोफ़ाइल (कानूनी नाम और पता) भरते हैं, जो भुगतान रसीदों के लिए इस्तेमाल होती है।"
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "बैलेंस Earn.fm के पास रहता है; अनुरोध पर निकाला जाता है।"
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "अपने Earn.fm खाते का ईमेल और पासवर्ड इस्तेमाल करें (<a href='https://app.earn.fm' target='_blank'>app.earn.fm</a> लॉगिन वाले ही)।"
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "उनकी कमाई का 10% जीवन भर"
