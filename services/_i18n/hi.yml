# Hindi translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/hi.yml --restamp '<key>'
2miners-etc.description:
  text: "2Miners आपके सार्वजनिक ETC भुगतान पते के लिए जो बिना भुगतान वाला Ethereum Classic बैलेंस रखता है, उसे ट्रैक करें। अपना खुद का माइनर चलाएँ और उसे पूल की ओर पॉइंट करें। CashPilot बैलेंस पढ़ता है और बैलेंस घटने पर आपसे भुगतान की पुष्टि करने को कहता है।\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Ethereum Classic माइनिंग पूल, आपके भुगतान पते से ट्रैक किया जाता है"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (बदला जा सकता है)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "पूल हर दो घंटे में आपकी भुगतान सीमा जाँचता है"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "आपकी चुनी हुई सीमा तक पहुँचते ही 2Miners आपके पते पर अपने-आप भुगतान करता है। ETC भुगतान की सबसे कम सीमा 0.1 ETC है।\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "बिना भुगतान वाला बैलेंस 2Miners पर जमा होता है। वॉलेट बैलेंस Ethereum Classic से अलग से पढ़ा जाता है। CashPilot में भुगतान की पुष्टि करने से पहले अपने वॉलेट में मिली राशि जाँच लें।\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "वह सार्वजनिक Ethereum Classic भुगतान पता डालें जो आपका माइनर 2Miners पर इस्तेमाल करता है, जो <b>0x</b> से शुरू होता है। कोई भी वर्कर नाम न जोड़ें।\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "2Miners की ओर पॉइंट किया गया ETCHash माइनर ज़रूरी है"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "कंप्यूट"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "नहीं। आपका माइनर माइनिंग का काम पूल को भेजता है।"
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "पूल आपके भुगतान पते, आपके चुने हुए वर्कर नामों और आपके माइनर के IP पते का इस्तेमाल करता है।"
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "कोई भी भुगतान पते से आँकड़े देख सकता है। सीमा बदलने के लिए पूल वर्कर IP की पुष्टि माँगता है।"
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "पूल 1% शुल्क लेता है और आपकी सीमा पूरी होने तक भुगतान रोक कर रखता है।"
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (पहले ATOR) एक विकेंद्रीकृत ओनियन-रूटिंग प्राइवेसी नेटवर्क है। नोड ऑपरेटर रिले नोड चलाते हैं और दी गई बैंडविड्थ के बदले ANYONE टोकन कमाते हैं। इसे \"इनाम वाला Tor\" समझें। CashPilot इसे अपनी खुद की इमेज से चलाता है, जो प्रोजेक्ट के साइन किए गए Debian पैकेज से amd64 और arm64 के लिए बनाई जाती है। कॉन्फ़िगरेशन फ़ाइल से होता है, कंटेनर में माउंट की गई anonrc फ़ाइल के ज़रिए (Nickname, ContactInfo, ORPort आदि)। जब तक किसी रिले के लिए 100 ANYONE कम से कम 180 दिनों के लिए लॉक नहीं किए जाते, वह कुछ नहीं कमाता, और इनाम आपके वॉलेट में साइन करके क्लेम किए जाते हैं। रिले आपका सार्वजनिक IP नेटवर्क की रिले डायरेक्टरी में भी दर्ज करता है, जिससे उस IP की साख को नुकसान हो सकता है जिसके लिए आवासीय बैंडविड्थ ऐप भुगतान करते हैं।\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "विकेंद्रीकृत ओनियन रूटिंग - इनाम वाले Tor रिले नोड"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "रिले की ed25519 पहचान कुंजी। इसे मिटाने से रिले की साख खत्म हो जाती है और उसकी कमाई का इतिहास शून्य से फिर शुरू होता है।"
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "भुगतान तभी होता है जब प्रति रिले 100 ANYONE कम से कम 180 दिनों के लिए लॉक हों और आपके वॉलेट में साइन किया गया इनाम क्लेम हो। स्टेक के बिना रिले कुछ नहीं कमाता। स्टेक के साथ, कमाई दी गई बैंडविड्थ और अपटाइम पर निर्भर करती है।"
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "एपॉक के आधार पर"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "anonrc में ContactInfo के रूप में सेट करें, '@anon:0x...' उपसर्ग के साथ।"
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "कॉमा से अलग किए गए रिले फ़िंगरप्रिंट। यह किसी वेब डैशबोर्ड में नहीं मिलता: रिले चला रहे होस्ट पर <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> चलाएँ।\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "बैंडविड्थ, Anyone नेटवर्क (Tor का एक फ़ोर्क) में रिले के रूप में।"
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "हाँ। यह दूसरे लोगों का ट्रैफ़िक रिले करता है। आपका IP आखिरी हॉप होगा या नहीं, यह इस पर निर्भर है कि रिले को एग्ज़िट के रूप में कॉन्फ़िगर किया गया है या नहीं।"
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "रिले की सार्वजनिक पहचान कुंजी, आपका IP और पोर्ट, और अपटाइम के आँकड़े, सब डिज़ाइन के अनुसार नेटवर्क डायरेक्टरी में प्रकाशित होते हैं। अगर आप अपनी anonrc में ContactInfo सेट करते हैं, तो वह भी वहाँ प्रकाशित होती है और हमेशा के लिए सार्वजनिक रूप से इंडेक्स हो जाती है — यह आमतौर पर एक ईमेल पता होता है, इसलिए जब तक आप इसे सार्वजनिक न करना चाहें, इसे खाली छोड़ दें।"
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "वास्तविक। रिले ट्रैफ़िक आपके कनेक्शन के नाम दर्ज होता है। खास तौर पर एग्ज़िट रिले पर दुरुपयोग की शिकायतें आती हैं; कई घरेलू ISP इन्हें मना करते हैं।"
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "साइन अप करने के लिए कोई खाता नहीं है, इसलिए प्रति खाता सीमित करने के लिए कुछ नहीं है। कमाई के लिए फिर भी आपको एक Ethereum वॉलेट चाहिए जिसमें हर रिले के लिए 100 ANYONE कम से कम 180 दिनों के लिए लॉक हों, और इनाम पढ़ने के लिए CashPilot को रिले फ़िंगरप्रिंट चाहिए। प्रोजेक्ट प्रति-IP रिले सीमा प्रकाशित नहीं करता, और कैटलॉग भी कोई सीमा घोषित नहीं करता।"
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "जब तक किसी रिले के लिए 100 ANYONE कम से कम 180 दिनों के लिए लॉक न हों, वह कुछ नहीं कमाता, और हर इनाम क्लेम आपके वॉलेट में साइन किया जाता है।"
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "यह डिज़ाइन के अनुसार दूसरे लोगों का ट्रैफ़िक रिले करता है, बिना यह जाँचे कि वे कौन हैं; एग्ज़िट रिले पर दुरुपयोग की शिकायतें आती हैं।"
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "रिले की पहचान, IP और अपटाइम नेटवर्क डायरेक्टरी में प्रकाशित होते हैं, और आपकी सेट की गई कोई भी ContactInfo हमेशा के लिए सार्वजनिक रहती है।"
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "साइन अप करने के लिए कोई खाता नहीं है। रिले को बस एक वॉलेट चाहिए, कोई पहचान जाँच नहीं।"
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "रिले सॉफ़्टवेयर Tor का एक प्रकाशित फ़ोर्क है, Tor के लाइसेंस के तहत।"
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot Anyone के प्रकाशित रिले सॉफ़्टवेयर से अपनी खुद की इमेज बनाता है, जिसके लिए किसी खाते की ज़रूरत नहीं होती।"
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping एक विकेंद्रीकृत नेटवर्क मॉनिटरिंग प्लेटफ़ॉर्म है जो नोड चलाने के लिए आपको भुगतान करता है। आपका नोड Bitping के ग्राहकों के लिए वेबसाइट मॉनिटरिंग, लेटेंसी टेस्टिंग और नेटवर्क गुणवत्ता जाँच करता है। आवासीय और VPS दोनों कनेक्शन पर काम करता है। Docker इमेज पहली बार शुरू होने पर BITPING_EMAIL और BITPING_PASSWORD environment variables से लॉग इन करती है (उसके अपने लॉग में \"Attempting login with environment variables\"), फिर सेशन को वॉल्यूम माउंट में सहेज लेती है ताकि रीस्टार्ट पर फिर से प्रमाणीकरण न करना पड़े।\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "बैंडविड्थ शेयरिंग - विकेंद्रीकृत नेटवर्क मॉनिटरिंग, VPS पर काम करता है"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "ईमेल"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "पासवर्ड"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "आपके Bitping खाते का ईमेल (<a href='https://app.bitping.com' target='_blank'>app.bitping.com</a> वाला ही लॉगिन)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "आपके Bitping खाते का पासवर्ड। नोड सेशन बनाने के लिए एक बार इस्तेमाल होता है, जो फिर डेटा वॉल्यूम में सहेजा रहता है।"
  source: "acb49b137850"
bitping.earnings.notes:
  text: "कमाई नेटवर्क की गुणवत्ता और आपकी लोकेशन से मॉनिटरिंग की माँग पर निर्भर करती है। VPS नोड स्वीकार किए जाते हैं।"
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "अनुरोध पर"
  source: "be820103712e"
bitping.cashout.notes:
  text: "नोड की कमाई nodes.bitping.com पर रहती है; app.bitping.com API ग्राहकों का डैशबोर्ड है। निकासी सिर्फ़ SOL में होती है: बिना भुगतान वाला बैलेंस $0.05 से ज़्यादा होते ही अनुरोध में Solana पता टाइप करें, जिसे 24 घंटे के भीतर प्रोसेस किया जाता है। नए या खाली Solana वॉलेट में नेटवर्क के न्यूनतम रेंट के लिए पहले लगभग 0.001 SOL होना चाहिए।"
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "अब सिर्फ़ Solana, और पता सहेजा नहीं जाता बल्कि निकासी के समय टाइप किया जाता है।"
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "अपने Bitping खाते का ईमेल और पासवर्ड इस्तेमाल करें (<a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a> वाले ही)।"
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "अपना Bitping बैलेंस निकालें"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "12 महीने से ज़्यादा समय तक बिना क्लेम की गई कमाई Bitping ईमेल से 30 दिन का नोटिस देने के बाद ज़ब्त कर सकता है।"
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "nodes.bitping.com पर SOL निकासी का अनुरोध करें और अनुरोध में अपना Solana पता टाइप करें।"
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "निकासी Solana (SOL) में होती है, उस पते पर जिसे आप हर अनुरोध में टाइप करते हैं।"
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Bitping की सहायता के अनुसार, नए और खाली Solana वॉलेट में निकासी तब तक विफल हो सकती है जब तक आप खुद उस वॉलेट में थोड़ा SOL न डाल दें।"
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Bitping की सहायता के अनुसार सर्वर और Docker कंटेनर समर्थित हैं।"
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "निकासी के लिए बस अनुरोध में टाइप किया गया एक Solana पता चाहिए।"
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit एक बैंडविड्थ शेयरिंग सेवा है जो PayPal और Stripe से भुगतान करती है। कोई आधिकारिक Docker इमेज नहीं है; Windows डेस्कटॉप ऐप और Android ऐप ही क्लाइंट हैं। यह सेवा bytebenefit.io पर है -- पुराना bytebenefit.com डोमेन छोड़ दिया गया था और एक मार्केटप्लेस पर पार्क है, इसी वजह से इसे कभी यहाँ बंद के रूप में चिह्नित किया गया था।\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "बैंडविड्थ शेयरिंग - PayPal/Stripe भुगतान, डेस्कटॉप/Android ऐप"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "कोई Docker इमेज उपलब्ध नहीं। सिर्फ़ Windows डेस्कटॉप और Android ऐप।"
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "अनुरोध पर"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "अभी तय नहीं: CashPilot ने अभी तक यह नहीं जाँचा है कि यह सेवा आपकी कमाई कहाँ रखती है।"
