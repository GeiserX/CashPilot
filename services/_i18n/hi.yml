earnfm.rating.cons.2.text:
  text: "2025 में समीक्षकों ने बताया कि ईमेल और Discord पर सहायता जवाब नहीं देती; Trustpilot बताता है कि Earn.fm ने नकारात्मक समीक्षाओं का जवाब नहीं दिया है।"
