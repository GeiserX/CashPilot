  text: "न्यूनतम $20 (20,000 क्रेडिट)। दो विकल्प: Tipalti के ज़रिए PayPal, लगभग 15% शुल्क, या बिना शुल्क JumpTask क्रेडिट, जो JumpTask वॉलेट में दिए जाते हैं। अनुरोध के लिए ईमेल से भेजा गया 6 अंकों का कोड चाहिए। पहला PayPal भुगतान तब तक \"waiting for details\" में रहता है जब तक आप उनके ईमेल किए लिंक से Tipalti पर पंजीकरण नहीं करते। वह लिंक सिर्फ़ एक बार काम करता है, इसलिए इसे तब खोलें जब आप एक ही बार में पूरा कर सकें और आपका फ़ोन पास हो: पासवर्ड सेट करने के बाद, Tipalti आपसे SMS से मोबाइल नंबर की पुष्टि करवाता है (कोड कुछ ही मिनटों में समाप्त हो जाते हैं), फिर आपका नाम, पता, देश और जन्म तिथि, और आपका PayPal पता माँगता है। Tipalti हर भुगतान पर $2.02 लेता है; उसके 1.9-3% मुद्रा रूपांतरण शुल्क से बचने के लिए USD चुनें। भुगतान 2 कार्यदिवसों के भीतर आता है। अनुरोध करते ही बैलेंस आपके खाते से निकल जाता है, भले ही भुगतान Tipalti का इंतज़ार कर रहा हो। बाद में हर Tipalti लॉगिन पर नया SMS कोड भेजा जाता है, जब तक आप डिवाइस को 30 दिनों तक याद रखने के विकल्प पर टिक न करें। अक्टूबर 2026 में Tipalti ने स्पेन के एक प्राप्तकर्ता से टैक्स फ़ॉर्म नहीं माँगा।"
