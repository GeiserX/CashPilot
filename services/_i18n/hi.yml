  text: "RandomX मोड"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "unMineable जिस कॉइन में भुगतान करता है उसका टिकर, जैसे SHIB, DOGE या XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "उस कॉइन के लिए आपका सार्वजनिक पता। जिन कॉइन के लिए memo या tag चाहिए, वे समर्थित नहीं हैं।"
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "बिजली से पहले का कुल अनुमान, unMineable की रूपांतरण दर पर आपके कॉइन में दिया जाता है। 2026-11-25 को RandomX का 1 kH/s लगभग $1 प्रति माह का था। आधे थ्रेड पर चलता डेस्कटॉप CPU 30 से 50 W अतिरिक्त खींच सकता है। यह फ़ायदेमंद है या नहीं, यह देखने के लिए अपनी असली खपत और बिजली की कीमत जाँचें।"
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "unMineable हर कॉइन के लिए तय करता है (2026-11-26 को 0.03 XMR)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "कॉइन की भुगतान सीमा पूरी होने पर"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "आपका बैलेंस कॉइन की भुगतान सीमा तक पहुँचते ही unMineable आपके पते पर भुगतान करता है। सीमाएँ कॉइन और नेटवर्क के अनुसार अलग हैं; CashPilot वही सीमा पढ़ता है जो unMineable आपके पते के लिए बताता है।"
  source: "119caa81a181"
unmineable.payout.notes:
  text: "बैलेंस कमाया गया है पर तब तक मिला नहीं है जब तक unMineable इसे इस पते पर न भेजे। चेन आपके चुने कॉइन पर निर्भर करती है।"
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "वही भुगतान पता और कॉइन टिकर जिनसे आपने माइनर डिप्लॉय किया, जैसे <b>XMR</b>। सिर्फ़ पता डालें, कॉइन, वर्कर नाम या रेफ़रल कोड के बिना। यह सार्वजनिक है और इससे कोई रकम नहीं खुलती।"
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "हर रेफ़र किए गए माइनर के माइनिंग इनाम का 0.25%"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "प्लेटफ़ॉर्म शुल्क 1% से घटकर 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "यह मशीन होस्टिंग कनेक्शन बताती है। माइनिंग से पहले अपने प्रदाता की शर्तें जाँचें। कुछ प्रदाता, जिनमें Hetzner Cloud भी है, इसे मना करते हैं। मुनाफ़े के अनुमान पर भरोसा करने से पहले अपनी असली बिजली लागत जाँचें।"
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable 1% प्लेटफ़ॉर्म शुल्क लेता है। CashPilot हर वर्कर नाम के बाद अपना रेफ़रल कोड (#awk6-j1z0) जोड़ता है, जिससे आपका शुल्क 0.75% हो जाता है। इसके बाद unMineable आपके माइनिंग इनाम का 0.25% CashPilot के मेंटेनर को देता है; आप 99.25% रखते हैं। हर कॉइन की अपनी भुगतान सीमा है, जैसे 0.03 XMR।"
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "कंप्यूट"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "नहीं। माइनर unMineable के पूल को काम भेजता है।"
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "आपका भुगतान पता, कॉइन, वर्कर का नाम, हैशरेट और IP पता unMineable को जाते हैं।"
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "कुछ नेटवर्क और DNS रिज़ॉल्वर माइनिंग पूल कनेक्शन ब्लॉक करते हैं।"
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "कोई खाता नहीं चाहिए। पता और कॉइन ही पहचान हैं, और कोई भी unmineable.com पर उनके आँकड़े पढ़ सकता है।"
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "रेफ़रल कोड के साथ unMineable 0.75% प्लेटफ़ॉर्म शुल्क रखता है और सिर्फ़ हर कॉइन की सीमा से भुगतान करता है।"
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "कुछ होस्टिंग प्रदाता क्रिप्टोकरेंसी माइनिंग मना करते हैं।"
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "अतिरिक्त बिजली की लागत कमाए गए कॉइन से ज़्यादा हो सकती है।"
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "पते के आँकड़े, बैलेंस समेत, हर उस व्यक्ति के लिए सार्वजनिक हैं जो पता जानता है।"
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "माइनर पूल को हैश भेजता है और किसी और का ट्रैफ़िक रिले नहीं करता।"
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "आप खाता बनाए बिना अपनी पसंद के कॉइन में किसी सार्वजनिक पते पर माइन कर सकते हैं।"
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock एक DePIN (Decentralized Physical Infrastructure Network) प्लेटफ़ॉर्म है जो आपको अपना इंटरनेट कनेक्शन शेयर करके क्रिप्टोकरेंसी कमाने देता है। बड़े Web3 इकोसिस्टम का हिस्सा। कम्युनिटी Docker इमेज उपलब्ध हैं पर कोई आधिकारिक इमेज नहीं। ब्राउज़र एक्सटेंशन मुख्य इंटरफ़ेस है।\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "DePIN इंटरनेट शेयरिंग - क्रिप्टो भुगतान, मुख्य रूप से ब्राउज़र एक्सटेंशन"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "क्रिप्टो/टोकन-आधारित कमाई। कोई आधिकारिक Docker इमेज नहीं — ब्राउज़र एक्सटेंशन मुख्य क्लाइंट है।"
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "अनुरोध पर"
  source: "be820103712e"
uprock.cashout.notes:
  text: "UPT टोकन, 250 UPT से Solana वॉलेट में निकाले जाते हैं, टू-फ़ैक्टर प्रमाणीकरण चालू होने पर। निकासी शुल्क लगता है।"
  source: "9a70ab978908"
uprock.payout.notes:
  text: "अभी तय नहीं: CashPilot ने अभी तक यह नहीं जाँचा है कि यह सेवा आपकी कमाई कहाँ रखती है।"
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "UpRock का सहायता केंद्र कहता है कि निकासी UPT टोकन में Solana वॉलेट में होती है, न्यूनतम 250 UPT।"
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "इनाम UPT टोकन हैं; समीक्षक और एक तीसरे पक्ष की समीक्षा कहते हैं कि उनका मूल्य बहुत कम है।"
