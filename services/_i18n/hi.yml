ionet.rating.cons.0.text:
  text: "सप्लायर इनाम भुगतान वाले कामों की परवाह किए बिना टोकन उत्सर्जन से दिए जाते थे, और GPU मालिक बताते हैं कि ज़्यादातर समय GPU खाली पड़े रहते हैं।"
