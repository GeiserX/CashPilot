  text: "न्यूनतम $15, USDT पर $1 से $3 शुल्क, और बैंक वायर सिर्फ़ $1,000 से।"
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "पहले भुगतान से पहले आप अपने कानूनी नाम और पते के साथ एक बिलिंग प्रोफ़ाइल भरते हैं।"
