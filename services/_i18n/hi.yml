storj.docker.env.WALLET.description:
  text: "USDC भुगतान के लिए Ethereum वॉलेट पता (जैसे 0x1234...abcd)। यह सेल्फ़-कस्टडी वाला होना चाहिए (MetaMask, Ledger आदि) -- कभी किसी एक्सचेंज का पता इस्तेमाल न करें"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "ऑपरेटर सूचनाओं के लिए ईमेल पता"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "पोर्ट के साथ DDNS होस्टनेम (जैसे mynode.ddns.net:28967) -- सीधे IP के बजाय यही ज़ोरदार तरीके से बेहतर है, क्योंकि जिस दिन आपका ISP चुपचाप IP बदल देगा, सीधा IP नोड को अटका देगा। पोर्ट 28967 फ़ॉरवर्ड होना चाहिए (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "आवंटित करने के लिए अधिकतम डिस्क स्पेस (जैसे 2TB)। घूमने वाली डिस्क (HDD) इस्तेमाल करें, SSD नहीं"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "होस्ट का वह पाथ जहाँ पहचान फ़ाइलें रखी जाती हैं (इसमें ca.cert, ca.key, identity.cert, identity.key होनी चाहिए)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Storj डेटा स्टोरेज के लिए घूमने वाली डिस्क (HDD) पर होस्ट का पाथ। कम से कम 550GB खाली जगह चाहिए"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "पहली बार चलाने से पहले, स्टोरेज नोड कॉन्फ़िग शुरू करें: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "नोड की पहचान। इसकी ID proof-of-work से बँधी है और दोबारा बनाने में घंटों लगते हैं, और इसे किसी और चीज़ के बैकअप से फिर से नहीं बनाया जा सकता। इसे खोने पर रोका गया भुगतान बैलेंस ज़ब्त हो जाता है।"
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "रखा गया ग्राहक डेटा और नोड की रोकी गई राशि। इसे खोने पर नोड अयोग्य हो जाता है और रोका गया बैलेंस ज़ब्त हो जाता है।"
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Storj नेटवर्क आपके नोड से उसके बताए गए ADDRESS पर वापस संपर्क नहीं कर पा रहा, इसलिए सैटेलाइट उसे ऑफ़लाइन मानते हैं: नया डेटा आना बंद हो जाता है, egress आय रुक जाती है, और लंबे समय तक ऑफ़लाइन रहने पर निलंबन होता है। जाँचें कि ADDRESS आपके मौजूदा सार्वजनिक IP से मेल खाता है (DDNS होस्टनेम इस्तेमाल करें, सीधा IP नहीं, ताकि ISP के IP बदलने पर नोड अटके नहीं) और पोर्ट 28967 TCP+UDP इस मशीन पर फ़ॉरवर्ड है।"
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "1 सितंबर 2026 से $1.35/TB स्टोरेज + $1/TB egress + $1/TB audit/repair। कमाई रखे गए डेटा और नोड की उम्र के साथ बढ़ती है। पहले 9 महीनों में कमाई का 75%, फिर 50%, फिर 25% रोका जाता है; रोकी गई राशि का आधा 16वें महीने में और बाकी ग्रेसफ़ुल एग्ज़िट पर लौटता है। पोर्ट 28967 फ़ॉरवर्ड होना चाहिए।"
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "Ethereum ट्रांज़ैक्शन शुल्क का 4 गुना, छोटे बैलेंस आगे ले जाए जाते हैं"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "मासिक"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Ethereum mainnet पर USDC में हर महीने भुगतान, जब वॉलेट बैलेंस मौजूदा ट्रांज़ैक्शन शुल्क का कम से कम चार गुना हो; छोटे बैलेंस अगले महीने में जुड़ जाते हैं। सितंबर 2026 के भुगतान तक STORJ टोकन में। डैशबोर्ड पोर्ट 14002 पर।"
  source: "6208f04947d2"
storj.payout.notes:
  text: "बैलेंस शुल्क-आधारित न्यूनतम पार करते ही WALLET वाले पते पर Ethereum mainnet पर USDC में हर महीने भुगतान। सितंबर 2026 के भुगतान तक STORJ टोकन में; zkSync Era भुगतान 1 सितंबर 2026 को बंद हुए।"
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "पोर्ट 14002 पर नोड डैशबोर्ड का URL, localhost के बजाय सर्वर के LAN IP के साथ, जैसे <b>http://192.168.1.10:14002</b>। कई नोड के लिए, उनके URL कॉमा से अलग करके लिखें: CashPilot उन्हें जोड़ देता है।"
  source: "e582f1e74baa"
storj.requirements.note:
  text: "एक ही /24 सबनेट पर Storj नोड डेटा आवंटन शेयर करते हैं, जिससे प्रति नोड कमाई घटती है।"
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps अपलोड"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "डिस्क स्पेस और उसे देने के लिए बैंडविड्थ।"
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "नहीं। आप ग्राहक डेटा के एन्क्रिप्ट किए गए, erasure-coded टुकड़े रखते हैं। दूसरे लोग अपना ट्रैफ़िक आपके IP से नहीं भेजते।"
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "नोड की पहचान, आपका वॉलेट पता, वह ईमेल पता जो नोड को ऑपरेटर सूचनाओं के लिए चाहिए, और आपका IP और पोर्ट, जिन तक पहुँचना ज़रूरी है ताकि नोड डेटा दे सके।"
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "मुख्य रूप से कानूनी जोखिम के बजाय डेटा सीमा का सवाल: नोड लगातार ग्राहक डेटा भेजता और लेता है, जो आपकी लाइन पर असली लगातार ट्रैफ़िक है। लेकिन प्रॉक्सी या रिले के उलट, यह गुमनाम तीसरे पक्ष का ऐसा ट्रैफ़िक नहीं है जो आपसे शुरू हुआ माना जाए, इसलिए उन पर आने वाली दुरुपयोग की शिकायतें इस पर नहीं आतीं।"
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "असीमित नोड, लेकिन एक ही /24 सबनेट वाले नोड आवंटन शेयर करते हैं, इसलिए एक कनेक्शन पर कई नोड हों तो हर एक कम कमाता है।"
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk ने 27 जुलाई 2026 को बताया कि Storj Labs ने Chapter 11 दिवालियापन सुरक्षा के लिए आवेदन किया है।"
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "आवेदन से पहले के नोड ऑपरेटरों के भुगतान दिवालियापन दावों की प्रक्रिया में चले गए।"
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "नए नोड की कमाई का पहले नौ महीनों में 75%, फिर 50%, फिर 25% रोका जाता है; आधा 16वें महीने में लौटता है और बाकी सिर्फ़ ग्रेसफ़ुल एग्ज़िट पर।"
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "ग्राहक एन्क्रिप्ट की गई फ़ाइलों के टुकड़े रखते हैं और कोई आपके IP से ट्रैफ़िक नहीं भेजता, लेकिन हमें यह नहीं मिला कि Storj कहाँ बताता है कि ग्राहक कौन हैं या उनकी जाँच कैसे होती है।"
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "स्टोरेज नोड सॉफ़्टवेयर AGPL-3.0 के तहत ओपन सोर्स है।"
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj अपनी खुद की Docker इमेज storjlabs/storagenode प्रकाशित करता है।"
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "कोई खाता नहीं: एक वॉलेट पता और ऑपरेटर सूचनाओं के लिए एक ईमेल।"
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "आवेदन के बाद भी सक्रिय नोड को भुगतान मिलता रहा।"
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR बिना खाते वाला एक Monero माइनिंग पूल है: आपका माइनर आपके Monero पते को यूज़रनेम बनाकर लॉग इन करता है, और पूल उसी पते पर भुगतान करता है। CashPilot यहाँ कोई माइनर नहीं चलाता। यह वह बैलेंस पढ़ता है जो SupportXMR आपके पते के लिए रखता है, ताकि आप अपनी दूसरी आय के साथ देख सकें कि आपके CPU माइनर ने कितना कमाया। बैलेंस कमाया गया है पर मिला नहीं है: आपकी भुगतान सीमा पार होते ही पूल इसका भुगतान करता है।\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Monero माइनिंग पूल, आपके भुगतान पते से ट्रैक किया जाता है"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (अपने-आप), अनुरोध पर 0.01 XMR"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "जब आपका बैलेंस आपकी सीमा पार करे, या अनुरोध पर"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "बैलेंस आपकी सीमा (डिफ़ॉल्ट रूप से 0.1 XMR) तक पहुँचते ही SupportXMR आपके पते पर भुगतान करता है। इसकी साइट पर आप 0.01 XMR से तुरंत भुगतान का अनुरोध भी कर सकते हैं, 0.001 XMR शुल्क पर।"
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "बैलेंस कमाया गया है पर तब तक मिला नहीं है जब तक SupportXMR इसे इस पते पर न भेजे। Monero बैलेंस निजी view key के बिना ऑन-चेन नहीं पढ़े जा सकते, जो CashPilot कभी नहीं माँगता, इसलिए हर भुगतान की पुष्टि आप खुद करते हैं।"
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "आपका Monero भुगतान पता: वह यूज़रनेम जो आपका माइनर SupportXMR पर इस्तेमाल करता है, किसी भी <b>.workername</b> या <b>+difficulty</b> हिस्से के बिना। यह सार्वजनिक है और इससे कोई रकम नहीं खुलती।"
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "pool.supportxmr.com की ओर पॉइंट किया गया Monero माइनर (XMRig) ज़रूरी है"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "कंप्यूट"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "नहीं। आपका माइनर पूल को हैश भेजता है; कोई भी आपके कनेक्शन से ट्रैफ़िक नहीं भेजता।"
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "आपका Monero पता, आपके चुने हुए वर्कर नाम, आपका हैशरेट और आपके माइनर का IP पता जैसा पूल उसे देखता है।"
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "माइनर पूल से एक कनेक्शन खुला रखता है और बहुत कम बैंडविड्थ इस्तेमाल करता है। ध्यान रखने वाली लागत बिजली है, आपका ISP नहीं।"
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "कोई खाता नहीं है। पता ही पहचान है, और कोई भी supportxmr.com पर उसके आँकड़े पढ़ सकता है।"
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "भुगतान सिर्फ़ Monero में, 0.6% पूल शुल्क के साथ, और अपने-आप भुगतान से पहले 0.1 XMR की डिफ़ॉल्ट सीमा।"
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot SupportXMR के लिए माइनर नहीं चलाता: आप अपना खुद का माइनर पूल की ओर पॉइंट करते हैं, और CashPilot सिर्फ़ बैलेंस पढ़ता है।"
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol, Beacons के एक नेटवर्क के ज़रिए AI एजेंटों को लाइव वेब तक पहुँच देता है। Teneo Beacon, Android, iOS, macOS, Windows और Linux के लिए Teneo का अपना ऐप है, जिसका सर्वर और Raspberry Pi के लिए कमांड-लाइन संस्करण भी है। इसकी सहमति स्क्रीन स्वीकार करने के बाद यह आपकी इस्तेमाल न हुई बैंडविड्थ शेयर करता है, और ऑनलाइन रहते हुए Teneo Protocol Points और Fragments कमाता है। Fragments, USDC में दिए जाने वाले सीज़नल ड्रॉ (Beacon Drop) में गिने जाते हैं। Teneo कहता है कि Beacon उसके पुराने ब्राउज़र एक्सटेंशन से दोगुने पॉइंट कमाता है। प्रति इंटरनेट कनेक्शन एक Beacon कमाता है। उसी कनेक्शन पर दूसरे डिवाइस स्टैंडबाय पर रहते हैं। रेफ़रल लिंक या कोड PSA3BHPJ से Expedition Hub में साइन अप करें, फिर Beacon में साइन इन करें।\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "DePIN बैंडविड्थ ऐप (Beacon) - सीज़नल USDC ड्रॉ के लिए Fragments, रेफ़रल लिंक से +100 Fragments"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Teneo Points और Fragments कमाता है। Fragments सीज़नल USDC ड्रॉ में गिने जाते हैं, इसलिए एक सीज़न इनाम देता है, कोई तय दर नहीं। Teneo कहता है कि Beacon ब्राउज़र एक्सटेंशन से दोगुने पॉइंट कमाता है। 3x तक Fragments के लिए हर 8 घंटे में बूस्ट क्लेम करें; कोई अवधि छूटने पर मल्टीप्लायर घट जाता है।"
  source: "7a9714079893"
teneo.payment.frequency:
  text: "सीज़नल ड्रॉ (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Beacon Drop इनाम USDC में उस वॉलेट में दिए जाते हैं जिसे आप Expedition Hub में बाइंड करते हैं। Hub दिखाता है कि वॉलेट बाइंड करने के लिए आपके पास कितने दिन हैं; अगर समय पर कोई वॉलेट बाइंड न हो, तो इनाम ज़ब्त हो जाता है।"
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "किसी सीज़न के इनाम दिए जाने से पहले Expedition Hub में एक वॉलेट बाइंड करें; जिस इनाम का वॉलेट समय पर बाइंड न हो, Hub उसे ज़ब्त कर लेता है।"
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "हर रेफ़र किए गए दोस्त के Fragments का 8% और उनके रेफ़रल के Fragments का 2%, जब दोस्त 7 दिनों के भीतर साइन अप करे और 480 Fragments कमाए"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "साइन अप पर +100 Fragments, और 480 Fragments तक पहुँचने पर +150 और"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "प्रति इंटरनेट कनेक्शन एक Beacon कमाता है। डेटासेंटर मशीनें सिर्फ़ उन होस्टिंग प्रदाताओं पर कमाती हैं जिन्हें Teneo ने चालू किया है, आधे Fragments के साथ और बिना पॉइंट या रेफ़रल बोनस के। VPN कनेक्शन कभी नहीं कमाते।"
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Beacon के Fragments सिर्फ़ सीज़नल ड्रॉ में इनाम के रूप में USDC देते हैं, इसलिए इसे चलाने से कोई तय राशि नहीं मिलती।"
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo कहता है कि पॉइंट $AGENTIC में मिलाए जाएँगे, जो एक ट्रांसफ़र न होने वाला इनाम टोकन है, $TENEO टोकन नहीं।"
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "2026 की दूसरी तिमाही का पहले का लक्ष्य बीत जाने के बाद, नवंबर 2026 तक $TENEO की लॉन्च तारीख, आवंटन या क्लेम प्रक्रिया की पुष्टि नहीं हुई थी।"
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot Teneo नहीं चलाता: आप प्रदाता का अपना Beacon ऐप इंस्टॉल करते हैं, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। कंटेनरों के लिए इसकी शर्तें जाँची नहीं गईं।"
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo कहता है कि ट्रैफ़िक जाँचे गए व्यावसायिक ग्राहकों से आता है और वह निजी पते और दुरुपयोग वाले पोर्ट ब्लॉक करता है, पर यह नहीं बताता कि वह उन ग्राहकों की जाँच कैसे करता है।"
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network एक स्थापित विकेंद्रीकृत वीडियो डिलीवरी और AI कंप्यूट नेटवर्क है (2018 से)। उपयोगकर्ता Edge Nodes चलाते हैं जो बैंडविड्थ, स्टोरेज और कंप्यूट शक्ति शेयर करते हैं। बड़ी कंटेंट साझेदारियाँ। TFUEL टोकन कमाता है।\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "विकेंद्रीकृत CDN + AI कंप्यूट - TFUEL इनाम, स्थापित प्रोजेक्ट"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "सिर्फ़ डेस्कटॉप ऐप। कमाई संसाधनों और लोकेशन पर निर्भर करती है। बड़ी साझेदारियाँ, सभी एक्सचेंजों पर लिस्टेड।"
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "लगातार"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "अभी तय नहीं: CashPilot ने अभी तक यह नहीं जाँचा है कि यह सेवा आपकी कमाई कहाँ रखती है।"
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot Theta Edge नहीं चलाता: आप प्रदाता का अपना डेस्कटॉप ऐप इस्तेमाल करते हैं, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। कंटेनरों के लिए इसकी शर्तें जाँची नहीं गईं।"
  source: "893de938ed14"
titan.description:
  text: "Titan Network एक DePIN प्लेटफ़ॉर्म है जो TNT टोकन इनाम के बदले आपका IP पता, स्टोरेज और बैंडविड्थ शेयर करता है। Windows, Mac और Android पर उपलब्ध। नोड एक विकेंद्रीकृत CDN और स्टोरेज लेयर में योगदान देते हैं। शेयर किए गए संसाधनों और भौगोलिक लोकेशन के अनुसार आम कमाई $5-30/माह होती है।\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN, IP, स्टोरेज, बैंडविड्थ शेयरिंग - $5-30/माह"
  source: "799e68401067"
titan.earnings.notes:
  text: "IP, स्टोरेज और बैंडविड्थ शेयर करता है। कमाई दिए गए संसाधनों और क्षेत्र पर निर्भर करती है। ज़्यादा स्टोरेज आवंटन से ज़्यादा इनाम मिलते हैं।"
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "एपॉक के आधार पर"
  source: "75743e03bad2"
titan.payout.notes:
