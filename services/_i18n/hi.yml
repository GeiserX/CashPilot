proxyrack.description:
  text: "ProxyRack का Peer कार्यक्रम आपको उनके प्रॉक्सी नेटवर्क के हिस्से के रूप में अपनी बैंडविड्थ शेयर करके कमाने देता है। हर डिवाइस के लिए एक अनोखा 64-वर्ण का hex UUID चाहिए, और डिवाइस को अपने-आप पंजीकृत करने के लिए वैकल्पिक रूप से एक API कुंजी। आवासीय और VPS/डेटासेंटर दोनों कनेक्शन पर काम करता है। डैशबोर्ड Cloudflare के पीछे है, जिसकी वजह से API कुंजी ब्राउज़र से हाथ से निकालनी पड़ सकती है।\n"
  source: "16b74380bb2a"
proxyrack.short_description:
  text: "बैंडविड्थ शेयरिंग - हर डिवाइस का UUID, VPS पर काम करता है"
