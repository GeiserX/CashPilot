  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai एक पीयर-टू-पीयर GPU मार्केटप्लेस है। आप NVIDIA GPU वाली एक Linux मशीन लिस्ट करते हैं, अपनी खुद की स्पॉट और ऑन-डिमांड कीमतें तय करते हैं, और किराएदार उस पर अपने खुद के Docker कंटेनर चलाते हैं। आपको सिर्फ़ उन मिनटों का भुगतान मिलता है जितने समय वह किराए पर रहती है, CLORE, BTC, USDT या USDC में। होस्टिंग के लिए Ubuntu 22.04 या नए (या HiveOS) पर एक x86_64 मशीन, चालू NVIDIA ड्राइवर और कम से कम 100 Mbps अपलोड और डाउनलोड चाहिए। AMD GPU समर्थित नहीं हैं।\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "GPU मार्केटप्लेस - NVIDIA GPU किराए पर दें, भुगतान CLORE, BTC या USD स्टेबलकॉइन में"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "भुगतान सिर्फ़ किराए वाले मिनटों का, आपकी तय की गई कीमत पर। रेंज का ऊपरी सिरा, $490, मिनट के हिसाब से लिस्ट किए गए एक RTX 4090 के लिए Clore की अपनी ऊपरी सीमा है ('up to ~$490/month'); छोटे कार्ड कम कमाते हैं और खाली पड़ा कार्ड कुछ नहीं कमाता। Clore हर किराए का 5% (ऑन-डिमांड) या 1.25% (स्पॉट) रखता है, और अगर किराएदार CLORE की जगह BTC, USDT या USDC में भुगतान करे तो 15% और।"
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "अनुरोध पर"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Account > Billing से अपने खुद के वॉलेट में निकालें: CLORE (ERC-20, न्यूनतम 200, शुल्क लगभग $0.50), BTC (न्यूनतम 0.0001, शुल्क 0.00005 BTC) या Ethereum या BNB Chain पर USDT/USDC (न्यूनतम $10, शुल्क $1)।"
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "आपके निकालने तक Clore बैलेंस अपने पास रखता है (CLORE, BTC और USDT/USDC के लिए एक USD बैलेंस)। चेन हर निकासी के लिए चुनी जाती है: CLORE के लिए Ethereum, BTC के लिए Bitcoin, USDT/USDC के लिए Ethereum या BNB Chain।"
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "आपके रेफ़र किए गए होस्ट और किराएदारों के चुकाए प्लेटफ़ॉर्म शुल्क का 15% (स्टैंडर्ड स्तर), हर किराए पर; कोड कभी समाप्त नहीं होता; भुगतान किराए की मुद्रा में (CLORE, BTC या USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps अपलोड और डाउनलोड"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "आपकी मशीन पर GPU कंप्यूट समय।"
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "हाँ। किराएदार आपकी मशीन पर अपने खुद के Docker कंटेनर चलाते हैं, और उनका ट्रैफ़िक आपके कनेक्शन से निकलता है; SSH और एप्लिकेशन पोर्ट इंटरनेट पर फ़ॉरवर्ड किए जाते हैं।"
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Clore की प्राइवेसी नीति में खाते का डेटा और आपका IP पता अनुमानित लोकेशन के साथ शामिल है; पहचान दस्तावेज़ सिर्फ़ तब, जब Clore KYC माँगे।"
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "इनबाउंड पोर्ट इंटरनेट से पहुँचने लायक होने चाहिए (डिफ़ॉल्ट रूप से 22, 8080 और 3000-4000) और अनजान लोगों के वर्कलोड आपकी लाइन पर चलते हैं। Clore की अपनी नेटवर्क गाइड कहती है कि कुछ ISP होस्टिंग को ब्लॉक करते हैं।"
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "18 या उससे ज़्यादा उम्र, किसी प्रतिबंधित देश में नहीं। Clore पूरी तरह अपने विवेक से खाता निलंबित या बंद कर सकता है, और प्रतिबंधित इस्तेमाल पर रकम गँवानी पड़ सकती है।"
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "न शर्तें और न प्राइवेसी नीति किसी कानूनी इकाई का नाम बताती हैं, और शर्तें लागू क्षेत्राधिकार को किसी बाद के संस्करण पर छोड़ देती हैं।"
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore पूरी तरह अपने विवेक से खाता निलंबित या बंद कर सकता है, और प्रतिबंधित इस्तेमाल पर रकम ज़ब्त हो सकती है।"
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "भुगतान सिर्फ़ क्रिप्टो में (CLORE, BTC, USDT या USDC), और अगर किराएदार BTC, USDT या USDC में भुगतान करे तो Clore किराए का अतिरिक्त 15% लेता है, जब तक होस्ट इसे कम करने के लिए CLORE लॉक न करे।"
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "होस्ट को सिर्फ़ किराए वाले मिनटों का भुगतान मिलता है, और RTX 4090 के लिए Clore का आँकड़ा एक कार्ड की ऊपरी सीमा है (\"up to ~$490/month\")।"
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "बुनियादी इस्तेमाल के लिए KYC नहीं चाहिए, लेकिन बड़ी निकासी या अनुपालन मामलों में Clore पहचान सत्यापन माँग सकता है।"
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "किराएदार आपकी मशीन पर कोई भी सार्वजनिक Docker इमेज चलाते हैं। शर्तों में मना किए गए इस्तेमाल लिखे हैं (मैलवेयर, DDoS, CSAM और अन्य), लेकिन हमें इसका कोई विवरण नहीं मिला कि किराएदारों की जाँच कैसे होती है।"
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot Clore.ai नहीं चलाता: आप Clore का होस्टिंग एजेंट अपनी खुद की GPU मशीन पर इंस्टॉल करते हैं (Ubuntu 22.04 या नया, या HiveOS), इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता।"
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "जब किराएदार CLORE में भुगतान करता है, तो Clore ऑन-डिमांड किराए का 5% (स्पॉट पर 1.25%) रखता है, बिना किसी अतिरिक्त शुल्क के।"
  source: "699adf0a2179"
dawn.description:
  text: "DAWN एक वैलिडेटर नेटवर्क चलाता है जो DAWN प्रोटोकॉल के ज़रिए फ़ंड किए गए AI इंफ्रास्ट्रक्चर के लिए बैंडविड्थ और कवरेज की जाँच करता है। DAWN Validator ब्राउज़र एक्सटेंशन इन proof-of-bandwidth और कवरेज जाँचों में हिस्सा लेता है और चलते समय DAWN इनाम कमाता है। इन इनामों का अभी कोई तय नकद मूल्य नहीं है। एक्सटेंशन में खाता बनाएँ और पूछे जाने पर रेफ़रल कोड 2QLQV97F डालें।\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "DePIN वैलिडेटर - ब्राउज़र एक्सटेंशन DAWN पॉइंट कमाता है"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "टोकन लॉन्च से पहले Dawn Points कमाता है। असली मूल्य भविष्य की टोकन कीमत पर निर्भर करता है। हार्डवेयर बॉक्स ब्राउज़र एक्सटेंशन से ज़्यादा कमाता है।"
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "टोकन एयरड्रॉप (घोषणा बाकी)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "एक्सटेंशन काम करता है पर अधूरा है। Black Box हार्डवेयर की घोषणा हुई है। आगे देखें।"
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "अभी तय नहीं: CashPilot ने अभी तक यह नहीं जाँचा है कि यह सेवा आपकी कमाई कहाँ रखती है।"
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "एक्सटेंशन पॉइंट कमाता है; अक्टूबर 2026 तक नोड ऑपरेटरों को टोकन वितरण की पुष्टि नहीं हुई थी।"
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "जब तक कोई टोकन लॉन्च न हो और उसके रूपांतरण की घोषणा न हो, पॉइंट का कोई तय मूल्य नहीं है।"
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot Dawn नहीं चलाता: आप प्रदाता का अपना ब्राउज़र एक्सटेंशन इस्तेमाल करते हैं, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। कंटेनरों के लिए इसकी शर्तें जाँची नहीं गईं।"
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network एक विकेंद्रीकृत VPN और web3 इंफ्रास्ट्रक्चर प्रोजेक्ट है। मुख्य रूप से इसके लिए मालिकाना Deeper Connect हार्डवेयर डिवाइस चाहिए। Moken इससे जुड़ा माइनिंग/स्टेकिंग प्लेटफ़ॉर्म है। सिर्फ़ सॉफ़्टवेयर से नहीं चलता।\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "विकेंद्रीकृत VPN - मालिकाना हार्डवेयर डिवाइस ज़रूरी"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Deeper Connect हार्डवेयर ($200-500) ज़रूरी है। माइनिंग/स्टेकिंग के लिए Moken प्लेटफ़ॉर्म। सिर्फ़ सॉफ़्टवेयर से नहीं चलता।"
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "लगातार"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "अभी तय नहीं: CashPilot ने अभी तक यह नहीं जाँचा है कि यह सेवा आपकी कमाई कहाँ रखती है।"
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "डिवाइस की बिक्री पर कमीशन"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "कूपन SERGIO से Deeper Connect डिवाइस पर 5% छूट"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "माइनिंग इनाम DPR में मिलते हैं और एक क्रेडिट स्कोर पर निर्भर करते हैं जो धीरे-धीरे या DPR स्टेक करके बढ़ता है।"
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot Deeper Network नहीं चलाता: आप प्रदाता का अपना राउटर हार्डवेयर इस्तेमाल करते हैं, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। कंटेनरों के लिए इसकी शर्तें जाँची नहीं गईं।"
  source: "b1ba1636070f"
earnapp.description:
  text: "Bright Data का EarnApp आपको निष्क्रिय आय के लिए अपनी इस्तेमाल न हुई बैंडविड्थ बेचने देता है। Bright Data दुनिया का सबसे बड़ा प्रॉक्सी नेटवर्क है, जो Fortune 500 कंपनियों के लिए डेटा संग्रह चलाता है। CashPilot इसे अपनी खुद की इमेज से चलाता है, जो पहली बार शुरू होने पर Bright Data के CDN से पिन किया गया EarnApp बिल्ड डाउनलोड करती है, उसका sha256 जाँचती है और उसे सिर्फ़ एक UUID के साथ lite मोड में चलाती है।\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "बैंडविड्थ शेयरिंग - Bright Data समर्थित"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "नोड UUID"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "आपकी EarnApp नोड ID: sdk-node- के बाद 32 छोटे अक्षरों वाले hex वर्ण, जैसे 'earnapp showid' दिखाता है। डिप्लॉय करने के बाद, EarnApp में साइन इन रहते हुए https://earnapp.com/r/ के बाद यह UUID लगाकर बना पता खोलकर इसे एक बार लिंक करें; बिना लिंक वाला नोड कमाता है, पर आपके बैलेंस तक कुछ नहीं पहुँचता"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp बार-बार अपने सर्वरों तक पहुँचने में विफल होकर रीस्टार्ट हो रहा है, इसलिए यह बहुत कम या कुछ नहीं कमाता। इस कॉपी को रीस्टार्ट करें; अगर ऐसा होता रहे, तो इस मशीन का इंटरनेट कनेक्शन जाँचें।"
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "नोड को अपने खाते में जोड़ने के लिए EarnApp में साइन इन रहते हुए यह लिंक खोलें। जब तक आप ऐसा नहीं करते, नोड कमाता है पर आपके बैलेंस तक कुछ नहीं पहुँचता।"
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "लोकेशन पर बहुत ज़्यादा निर्भर। US/EU IP सबसे ज़्यादा कमाते हैं। कमाई इस्तेमाल हुई बैंडविड्थ के साथ बढ़ती है।"
  source: "460beb388888"
earnapp.payment.frequency:
  text: "अनुरोध पर (ऑटो-रिडीम उपलब्ध: PayPal न्यूनतम $10, Wise न्यूनतम $10, Amazon न्यूनतम $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "एक बार ऑटो-रिडीम चालू करें और बैलेंस तरीके की न्यूनतम राशि तक पहुँचते ही EarnApp खुद भुगतान करता है: PayPal $10, Wise $10, Amazon $50। PayPal भुगतान Bright Data Ltd. की ओर से आते हैं। अक्टूबर 2026 में एक PayPal भुगतान रिडीम किए गए बैलेंस से लगभग 2% कम आया।"
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "बैलेंस EarnApp के पास रहता है; Amazon/Wise/PayPal में रिडीम होता है।"
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "<a href='https://earnapp.com' target='_blank'>earnapp.com</a> पर लॉग इन करें, F12 दबाएँ → Application → Cookies, <b>oauth-refresh-token</b> का मान कॉपी करें।"
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "उनकी कमाई का 10% जीवन भर, उनकी कमाई के ऊपर से दिया जाता है"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "EarnApp का सहायता केंद्र कहता है कि इसे Docker कंटेनर, वर्चुअल मशीन, होस्टिंग सेवाओं या होम सर्वर में इंस्टॉल करना सख्त मना है, और CashPilot इसे इसी तरह चलाता है।"
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "वही सहायता लेख कहता है कि इस तरह चलता पाया गया खाता बिना सूचना के बंद कर दिया जाता है और उसके बाकी भुगतान रद्द कर दिए जाते हैं।"
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "हमारा PayPal भुगतान अक्टूबर 2026 में आया, रिडीम किए गए बैलेंस से लगभग 2% कम।"
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "PayPal और Wise के लिए न्यूनतम $10, और ऑटो-रिडीम जो खुद भुगतान कर देता है।"
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp, Bright Data का है, और इसके PayPal भुगतान एक नामित कंपनी Bright Data Ltd. की ओर से आते हैं।"
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm आपकी इंटरनेट बैंडविड्थ शेयर करने के लिए आपको भुगतान करता है। कमाई कलेक्टर Supabase के ज़रिए ईमेल/पासवर्ड प्रमाणीकरण इस्तेमाल करता है। हल्की Docker इमेज, सीधा-सादा डिप्लॉयमेंट (Docker क्लाइंट एक अलग UUID टोकन इस्तेमाल करता है)।\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "बैंडविड्थ शेयरिंग - ईमेल/पासवर्ड प्रमाणीकरण, हल्का क्लाइंट"
