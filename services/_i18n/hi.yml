  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher एक ट्रैफ़िक एक्सचेंज प्लेटफ़ॉर्म है जहाँ आप एक स्वचालित सर्फ़बार के ज़रिए वेबसाइटें देखकर क्रेडिट कमाते हैं। ब्राउज़र एक्सटेंशन/ऐडऑन के रूप में चलता है। यह पारंपरिक बैंडविड्थ शेयरिंग सेवा नहीं है — यह अपने-आप वेबसाइटें ब्राउज़ करके ट्रैफ़िक पैदा करता है।\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "ट्रैफ़िक एक्सचेंज सर्फ़बार - ब्राउज़र एक्सटेंशन"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "कमाई BTP पॉइंट में, जो EUR में बदले जा सकते हैं। सिर्फ़ ब्राउज़र एक्सटेंशन।"
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "अनुरोध पर"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "PayPal या बैंक ट्रांसफ़र से यूरो में भुगतान।"
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "अभी तय नहीं: CashPilot ने अभी तक यह नहीं जाँचा है कि यह सेवा आपकी कमाई कहाँ रखती है।"
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "CashPilot eBesucher नहीं चलाता: यह एक ब्राउज़र एक्सटेंशन है, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। कंटेनरों के लिए इसकी शर्तें जाँची नहीं गईं।"
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "PayPal या SEPA से 2 यूरो से भुगतान, कम से कम हर हफ़्ते, बिना शुल्क के।"
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "eBesucher 2002 से चल रहा है।"
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "इम्प्रिंट में ऑपरेटर का नाम TurboAd GmbH है, जो Berlin-Charlottenburg में पंजीकृत है (HRB 160730 B)।"
  source: "84cbddd4330b"
flux.description:
  text: "Flux एक विश्व स्तर पर फैला हुआ कंप्यूट इंफ्रास्ट्रक्चर है। नोड ऑपरेटर FLUX टोकन स्टेक करते हैं और सर्वर संसाधन देते हैं। तीन स्तर: Cumulus (1,000 FLUX), Nimbus (12,500 FLUX), Stratus (40,000 FLUX)। आधिकारिक Docker इमेज उपलब्ध हैं।\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "विकेंद्रीकृत कंप्यूट - FLUX टोकन स्टेक ज़रूरी"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "1,000+ FLUX स्टेक ज़रूरी (कीमत के अनुसार ~$50-500)। ऊँचे स्तरों के लिए ज़्यादा कोलैटरल चाहिए, पर कमाई भी ज़्यादा होती है।"
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "ब्लॉक इनाम"
  source: "590433237f8a"
flux.payout.notes:
  text: "अभी तय नहीं: CashPilot ने अभी तक यह नहीं जाँचा है कि यह सेवा आपकी कमाई कहाँ रखती है।"
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "सबसे छोटे नोड स्तर के लिए 1,000 FLUX कोलैटरल के रूप में लॉक करने होते हैं।"
  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "ब्लॉक इनाम हर साल 10% घटता है, और 2026 की एक गाइड ने पाया कि डॉलर के हिसाब से छोटे स्तर के इनाम कमज़ोर हैं।"
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "CashPilot Flux नहीं चलाता: आप प्रदाता का अपना नोड सॉफ़्टवेयर इस्तेमाल करते हैं, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। कंटेनरों के लिए इसकी शर्तें जाँची नहीं गईं।"
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "Flux डेमन MIT लाइसेंस के तहत ओपन सोर्स है।"
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network एक विकेंद्रीकृत कंप्यूट मार्केटप्लेस है जहाँ आप GLM टोकन के बदले CPU और GPU संसाधन शेयर करते हैं। प्रदाता Yagna एजेंट चलाते हैं, जो सैंडबॉक्स वाले वातावरण में वर्कलोड चलाने का प्रबंधन करता है। सबसे पुराने विकेंद्रीकृत कंप्यूट प्रोजेक्ट में से एक (2016 में स्थापित)। CPU कार्य, GPU रेंडरिंग और सामान्य कंप्यूट समर्थित हैं। भुगतान Polygon L2 के ज़रिए।\n"
  source: "9a6843f56459"
golem.short_description:
  text: "विकेंद्रीकृत कंप्यूट मार्केटप्लेस - Yagna एजेंट से GLM टोकन"
  source: "88f817c25848"
golem.earnings.notes:
  text: "कमाई हार्डवेयर, कीमत और कार्यों की माँग पर निर्भर करती है। सिर्फ़ CPU वाले नोड कम कमाते हैं। GPU नोड ज़्यादा कमाते हैं पर उनके लिए NVIDIA ज़रूरी है। Yagna प्रदाता एजेंट चलाएँ (Docker इमेज नहीं)। भुगतान Polygon पर GLM टोकन में।"
  source: "07287d437d51"
golem.payment.frequency:
  text: "हर कार्य पूरा होने पर"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "GLM टोकन कमाए जाते हैं। प्रदाता सेटअप में भुगतान वॉलेट कॉन्फ़िगर करें।"
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "अभी तय नहीं: CashPilot ने अभी तक यह नहीं जाँचा है कि यह सेवा आपकी कमाई कहाँ रखती है।"
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot Golem नहीं चलाता: आप प्रदाता एजेंट खुद इंस्टॉल करते हैं, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। Golem प्रदाता को उसकी अपनी Docker इमेज में चलाने का तरीका बताता है।"
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "प्रदाता एजेंट yagna, GPL-3.0 के तहत ओपन सोर्स है।"
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "कोई खाता नहीं: आप प्रदाता सेटअप में भुगतान वॉलेट सेट करते हैं।"
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "नेटवर्क लगभग दस साल से चल रहा है।"
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Golem की प्राइवेसी नीति में ऑपरेटर का नाम है: Golem Factory GmbH, Zug, स्विट्ज़रलैंड।"
  source: "bae79b651923"
grass.description:
  text: "Grass एक विकेंद्रीकृत नेटवर्क है जो आपको AI ट्रेनिंग डेटा के लिए अपनी इस्तेमाल न हुई बैंडविड्थ बेचने देता है। यह ब्राउज़र एक्सटेंशन और डेस्कटॉप ऐप के रूप में चलता है, और संरचित डेटासेट बनाने के लिए वेब स्क्रैपिंग अनुरोधों को आपके कनेक्शन से भेजता है। 8.5M+ उपयोगकर्ताओं के साथ, यह सबसे बड़े DePIN बैंडविड्थ नेटवर्क में से एक है। Solana ब्लॉकचेन पर GRASS टोकन कमाता है।\n"
  source: "046951d812f9"
grass.short_description:
  text: "AI डेटा के लिए DePIN बैंडविड्थ शेयरिंग - GRASS टोकन कमाता है"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "एक्सेस टोकन"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "<a href=\"https://app.grass.io\">app.grass.io</a> पर लॉग इन करें, F12 दबाएँ → Application → Local Storage → <code>https://app.grass.io</code> पर क्लिक करें → <code>token</code> का मान कॉपी करें"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Grass Points कमाता है जो एयरड्रॉप से GRASS टोकन में बदले जा सकते हैं। असली USD मूल्य टोकन की कीमत पर निर्भर करता है। ब्राउज़र एक्सटेंशन या डेस्कटॉप ऐप ज़रूरी है।"
  source: "da61137319f8"
grass.payment.frequency:
  text: "एपॉक-आधारित एयरड्रॉप"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "इनाम समय-समय पर होने वाले वितरण के रूप में आते हैं जिन्हें Grass डैशबोर्ड पर क्लेम किया जाता है। Stage 2 वितरण (अक्टूबर 2024 से जून 2026 तक की गतिविधि) का भुगतान USDC में होता है: इसे ज़्यादा से ज़्यादा 22 जनवरी 2027 तक app.grass.io/dashboard पर क्लेम करें, या उससे पहले, अगर सारे आवंटन पहले ही क्लेम हो जाएँ। बिना क्लेम किए इनाम Grass रख लेता है।"
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "POINTS जमा होते हैं; GRASS समय-समय पर होने वाले एयरड्रॉप के दौरान Grass डैशबोर्ड से क्लेम किया जाता है।"
  source: "14879f750890"
grass.collector.credential_hint:
  text: "<a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a> पर लॉग इन करें, F12 दबाएँ → Application → Local Storage, <b>accessToken</b> का मान कॉपी करें।"
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "सीधे रेफ़रल के अपटाइम पॉइंट का 20%, दूसरे स्तर पर 10%, तीसरे पर 5%"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "अपना Grass Stage 2 USDC क्लेम करें"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "ज़्यादा से ज़्यादा 22 जनवरी 2027 तक क्लेम न किया गया हर Stage 2 आवंटन Grass रख लेता है, और सारे आवंटन क्लेम हो जाने पर यह अवधि पहले भी बंद हो सकती है।"
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Stage 2 में इस्तेमाल किए गए खाते से app.grass.io पर साइन इन करें, Grass Wallet सक्रिय करें, Allocation टैब खोलें और पुष्टि करें। सिर्फ़ app.grass.io पर ही क्लेम करें। कोई Stage 2 पॉइंट नहीं? मेरे लिए नहीं चुनें।"
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "इनाम सिर्फ़ एयरड्रॉप सीज़न के ज़रिए आते हैं। लंबे समय से नोड चला रहे ऑपरेटरों ने सीज़न 2 का अनुमान कुछ डॉलर से लेकर कम दहाई वाले डॉलर तक बताया।"
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "ज़्यादा से ज़्यादा 22 जनवरी 2027 तक क्लेम न किए गए सीज़न 2 इनाम हमेशा के लिए खो जाते हैं।"
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "पहले एयरड्रॉप पर प्रति पॉइंट छोटे इनाम को लेकर विरोध हुआ, जो बीस लाख से ज़्यादा उपयोगकर्ताओं में बँट गए।"
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot Grass नहीं चलाता: आप प्रदाता का अपना ऐप या एक्सटेंशन इस्तेमाल करते हैं, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। कंटेनरों के लिए इसकी शर्तें जाँची नहीं गईं।"
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "पहला एयरड्रॉप लगभग 15 लाख क्लेम करने वाले पतों तक पहुँचा।"
  source: "a4c55e10affa"
helium.description:
  text: "Helium एक स्थापित विकेंद्रीकृत वायरलेस नेटवर्क है। शुरुआत में LoRaWAN हॉटस्पॉट, अब 5G तक फैला हुआ। समर्पित हार्डवेयर ($500+) ज़रूरी है। HNT/MOBILE टोकन कमाता है। ROI काफ़ी गिर गया है - आमतौर पर $4-8/माह।\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "विकेंद्रीकृत वायरलेस नेटवर्क - हार्डवेयर ज़रूरी, HNT टोकन"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "$500+ का हार्डवेयर खरीदना ज़रूरी। ROI काफ़ी गिर गया है। नए ऑपरेटरों के लिए मंज़ूरी प्रक्रिया।"
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "एपॉक के आधार पर"
  source: "75743e03bad2"
helium.payout.notes:
  text: "अभी तय नहीं: CashPilot ने अभी तक यह नहीं जाँचा है कि यह सेवा आपकी कमाई कहाँ रखती है।"
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149 ने 6 जुलाई 2026 को Proof-of-Coverage इनाम बंद कर दिए; IoT हॉटस्पॉट अब सिर्फ़ अपने ले जाए गए डेटा के लिए कमाते हैं, और उनमें से 114,000 से ज़्यादा ने कोई डेटा नहीं ले जाया।"
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Helium का इनाम मॉडल वोट से कई बार बदला है, इसके CEO ने पद छोड़ा, और HNT लगभग 96% गिरा।"
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot Helium नहीं चलाता: आप प्रदाता का अपना हॉटस्पॉट हार्डवेयर इस्तेमाल करते हैं, इसलिए CashPilot इसे आपके लिए डिप्लॉय या अपडेट नहीं कर सकता। कंटेनरों के लिए इसकी शर्तें जाँची नहीं गईं।"
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "हॉटस्पॉट गेटवे सॉफ़्टवेयर Apache-2.0 लाइसेंस के तहत ओपन सोर्स है।"
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "HeroMiners आपके सार्वजनिक भुगतान पते के लिए जो बिना भुगतान वाला Kaspa बैलेंस रखता है, उसे ट्रैक करें। अपना खुद का Kaspa माइनर चलाएँ और उसे पूल की ओर पॉइंट करें। CashPilot पूल बैलेंस पढ़ता है और बैलेंस घटने पर आपसे भुगतान की पुष्टि करने को कहता है।\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
  text: "Kaspa माइनिंग पूल, आपके भुगतान पते से ट्रैक किया जाता है"
  source: "92c5784dcf30"
herominers-kas.payment.minimum_payout:
  text: "1 KAS (बदला जा सकता है)"
  source: "d33ca7065ff9"
herominers-kas.payment.frequency:
  text: "पूल हर घंटे आपकी भुगतान सीमा जाँचता है"
  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "आपकी चुनी हुई सीमा तक पहुँचते ही HeroMiners आपके पते पर अपने-आप भुगतान करता है। सबसे कम सीमा 1 KAS है।\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "बैलेंस HeroMiners पर जमा होता है। CashPilot में भुगतान की पुष्टि करने से पहले अपने वॉलेट में मिली राशि जाँच लें।\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "वह पूरा सार्वजनिक Kaspa भुगतान पता डालें जो आपका माइनर HeroMiners पर इस्तेमाल करता है। <b>kaspa:</b> उपसर्ग शामिल करें और वर्कर का नाम छोड़ दें।\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "HeroMiners की ओर पॉइंट किया गया Kaspa माइनर ज़रूरी है"
  source: "898e36e7a701"
herominers-kas.disclosure.sells:
  text: "कंप्यूट"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "नहीं। आपका माइनर माइनिंग का काम पूल को भेजता है।"
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "पूल के सार्वजनिक आँकड़े हर भुगतान पता और उसकी माइनिंग गतिविधि दिखाते हैं।"
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "पूल खाते की जगह आपके भुगतान पते का इस्तेमाल करता है।"
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "पूल 0.9% शुल्क लेता है और आपकी सीमा पूरी होने तक भुगतान रोक कर रखता है।"
  source: "7eb2950589fa"
honeygain.description:
  text: "अपनी इस्तेमाल न हुई इंटरनेट बैंडविड्थ शेयर करें और निष्क्रिय आय कमाएँ। Honeygain वेब इंटेलिजेंस, कंटेंट डिलीवरी और मार्केट रिसर्च ट्रैफ़िक को आपके कनेक्शन से भेजता है। 12M+ उपयोगकर्ताओं और 10 लाख से ज़्यादा पूरे हुए भुगतानों के साथ सबसे स्थापित बैंडविड्थ शेयरिंग प्लेटफ़ॉर्म में से एक।\n"
  source: "b219f969ba34"
honeygain.short_description:
