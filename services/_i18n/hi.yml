  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "ऐप की Google Play लिस्टिंग कहती है कि आपका ट्रैफ़िक Infatica के ग्राहकों के वेब-इंटेलिजेंस अनुरोधों के काम आता है, पर यह नहीं बताती कि वे कौन हैं या उनकी जाँच कैसे होती है।"
