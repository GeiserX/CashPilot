  source: "5de5d7264318"
proxyrack.docker.env.API_KEY.description:
  text: "<a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> पर लॉग इन करें → API Key मुख्य डैशबोर्ड पेज पर दिखती है (दी गई हो तो डिवाइस अपने-आप पंजीकृत होता है)। खाता चाहिए? <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a> से साइन अप करें"
  source: "96df71a6ca26"
proxyrack.docker.env.DEVICE_NAME.description:
  text: "डैशबोर्ड में डिवाइस का पहचानने लायक नाम"
  source: "df01af60b81c"
proxyrack.docker.health_signals.0.means:
  text: "कंटेनर शुरू होने पर Proxyrack का क्लाइंट डाउनलोड नहीं हुआ, इसलिए कंटेनर चलता है पर कुछ नहीं कमाता। रीस्टार्ट करने पर यह फिर से डाउनलोड होता है; अगर रीस्टार्ट के बाद भी यह बना रहे, तो जाँचें कि यह मशीन इंटरनेट तक पहुँच सकती है।"
  source: "b5143d72ce35"
proxyrack.device_link.steps:
  text: "ProxyRack में साइन इन करें, Devices खोलें, Add device चुनें और यह UUID पेस्ट करें। जब तक डिवाइस आपके खाते में नहीं है, वह किसी के लिए नहीं कमाता। अगर आपने API कुंजी डाली है, तो कंटेनर खुद को पंजीकृत कर लेता है: जाँचें कि डिवाइस वहाँ सूची में है।"
  source: "54c4041903b5"
proxyrack.earnings.notes:
  text: "आवासीय IP डेटासेंटर से ज़्यादा कमाते हैं। Cloudflare के पीछे डैशबोर्ड की वजह से स्वचालित एक्सेस मुश्किल हो सकता है।"
  source: "b6e36d751afd"
proxyrack.payment.frequency:
  text: "अनुरोध पर"
  source: "be820103712e"
proxyrack.cashout.notes:
  text: "डैशबोर्ड पर भुगतान का अनुरोध करें। ProxyRack 72 घंटों के भीतर इसकी समीक्षा करता है, फिर Tremendous आपको एक इनाम ईमेल करता है जिसे PayPal, गिफ़्ट कार्ड या वायर ट्रांसफ़र के रूप में रिडीम किया जा सकता है। कोई क्रिप्टो विकल्प नहीं है।"
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "बैलेंस ProxyRack के पास रहता है; अनुरोध पर निकाला जाता है।"
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "<a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a> पर लॉग इन करें, F12 दबाएँ → Network, कोई भी API अनुरोध ढूँढें और <b>Api-Key</b> हेडर का मान कॉपी करें। खाता चाहिए? <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a> से साइन अप करें।"
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "Proxyrack प्रति खाता 500 डिवाइस की सीमा बताता है और कोई प्रति-IP सीमा नहीं। डेटासेंटर IP स्वीकार किए जाते हैं पर उन्हें कम दर वाली श्रेणी में रखा जाता है।"
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "ProxyRack का सहायता केंद्र कहता है कि किसी डिवाइस को हटाने से उस डिवाइस की कमाई आपके खाते से हट जाती है, और वह तभी वापस आती है जब वही डिवाइस फिर से जोड़ा जाए।"
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack अपनी खुद की Docker इमेज proxyrack/pop प्रकाशित करता है, और डेटासेंटर IP कम दर पर स्वीकार करता है।"
