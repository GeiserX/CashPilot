  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "माइनर पूल को हैश भेजता है और किसी और का ट्रैफ़िक रिले नहीं करता।"
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "माइनर ओपन सोर्स है और इमेज एक साइन की गई अपस्ट्रीम रिलीज़ पिन करती है।"
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "आप अपने नाम से पहचान बताए बिना एक सार्वजनिक Monero पते से माइन कर सकते हैं।"
  source: "752cbb728aac"
