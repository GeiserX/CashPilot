mysterium.description:
  text: "MystNodes (Mysterium Network) ब्लॉकचेन तकनीक पर बना एक विकेंद्रीकृत VPN और प्रॉक्सी नेटवर्क है। आप एक नोड चलाकर MYST टोकन कमाते हैं जो उपयोगकर्ताओं को VPN, प्रॉक्सी और डेटा स्क्रैपिंग सेवाएँ देता है। इसके लिए NET_ADMIN, SETUID और SETGID क्षमताएँ और एक TUN डिवाइस ज़रूरी है, जिसे यह सुरक्षा घेरे वाले कमाई ऐप ब्रिज पर अपने खुद के नेटवर्क नेमस्पेस के अंदर इस्तेमाल करता है। नोड प्रबंधन के लिए इसमें एक बिल्ट-इन वेब UI है। आवासीय और VPS दोनों कनेक्शन पर काम करता है, लेकिन रेफ़रल बोनस सिर्फ़ आवासीय IP वाले नोड के लिए मिलता है।\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "विकेंद्रीकृत VPN नोड - ब्लॉकचेन-आधारित, VPS पर काम करता है"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "WebUI पता"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "UDP पोर्ट रेंज"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "होस्ट के वे पते जिन पर नोड का WebUI (पोर्ट 4449) प्रकाशित होता है। 127.0.0.1 इसे इसी मशीन तक सीमित रखता है। रिवर्स प्रॉक्सी से पहुँचने के लिए, वह पता जोड़ें जिससे प्रॉक्सी जुड़ता है, कॉमा से अलग और बिना स्पेस के: 127.0.0.1,172.18.0.1।"
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "VPN सेशन के लिए नोड जो UDP पोर्ट इस्तेमाल करता है, start:end के रूप में। अपने राउटर पर यही रेंज फ़ॉरवर्ड करें। हर सेशन लगभग दो पोर्ट लेता है, इसलिए डिफ़ॉल्ट 30 पोर्ट एक साथ लगभग 15 सेशन संभालते हैं, जो किसी घरेलू नोड को मिलने वाले सेशन से ज़्यादा है। चौड़ी रेंज कुछ ठीक नहीं करती और ज़्यादा खर्चीली है: हर प्रकाशित पोर्ट नोड के शुरू होने और हटने को धीमा करता है (300 पोर्ट शुरू होने में लगभग 12 s लेते हैं), CashPilot अधिकतम 300 स्वीकार करता है, और Docker के डिफ़ॉल्ट userland proxy के साथ हर पोर्ट लगभग 2.5 MB मेमोरी भी लेता है। अगर सारे सेशन विफल हों, तो यह राउटर की समस्या है, कम पोर्ट की नहीं: Mysterium गाइड में \"Routers that rewrite UDP source ports\" देखें। इसे 32768 से नीचे रखें: पोर्ट 32768-60999 Linux की ephemeral रेंज हैं, जहाँ होस्ट का कोई भी प्रोग्राम एक पल के लिए कोई पोर्ट पकड़ सकता है, और एक भी पोर्ट व्यस्त होने पर नोड शुरू नहीं होता। जिस नोड की पहले से कोई रेंज है, वह उसे बनाए रखता है।"
  source: "530524e2e718"
mysterium.docker.runtime_reason:
  text: "gVisor इसे iptables-nft और कर्नेल WireGuard नहीं देता, जिनकी इसे ट्रैफ़िक ले जाने के लिए ज़रूरत है।"
  source: "d8a72a275579"
mysterium.docker.critical_volumes.0.holds:
  text: "नोड की पहचान का कीस्टोर। इसे मिटाने से एक बिल्कुल नई पहचान बनती है: नोड अपनी साख खो देता है और पुरानी पहचान पर अब भी रुकी हुई कोई भी कमाई भी।"
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "नोड अपने कंटेनर के अंदर sudo नहीं चला सकता, इसलिए वह अपना VPN इंटरफ़ेस या फ़ायरवॉल कॉन्फ़िगर नहीं कर सकता और हर सेशन सेटअप पर ही विफल होता है: यह ऑनलाइन दिखता है और कुछ नहीं कमाता। कंटेनर SETUID और SETGID क्षमताओं के बिना बनाया गया था। CashPilot और इस नोड को चलाने वाले वर्कर को अपडेट करें, फिर डैशबोर्ड से Mysterium को फिर से डिप्लॉय करें; नोड की पहचान उसके डेटा वॉल्यूम में रहती है और बनी रहती है।"
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "पिछले 6 घंटों में कोई भी VPN सेशन इस नोड तक सीधे नहीं पहुँचा। हर सेशन hole punching पर लौट गया, और कई खरीदार उस तरीके से नहीं जुड़ पाते, इसलिए नोड कम कमाता है। इसके UDP पोर्ट इंटरनेट से पहुँचने लायक नहीं हैं। अपने राउटर पर UDP पोर्ट रेंज ${UDP_PORTS} (start:end, दोनों तरफ़ एक ही रेंज) को ${HOST_ADDRESS} पर फ़ॉरवर्ड करें। कोई सेशन सीधे जुड़ते ही यह अपने-आप हट जाता है।"
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Mysterium की मॉनिटरिंग ${WORKER_NAME} पर चल रहे नोड को विफल चिह्नित करती है, इसलिए वह उस नोड सूची से बाहर रहता है जिससे ज़्यादातर खरीदार चुनते हैं, भले ही उसकी अपनी जाँच कहे कि हर पोर्ट पहुँचने लायक है। पहले पक्का करें कि नोड के पास /dev/net/tun और SETUID/SETGID हैं, जिनके न होने पर भी यह इसी तरह विफल होता है: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 ये ठीक होने पर, एक आम कारण ${WORKER_NAME} के आगे का राउटर है, जो बाहर से कोई पैकेट उस पोर्ट तक पहुँचते ही नोड के जवाबों का UDP सोर्स पोर्ट बदल देता है। गाइड में जाँच देखें: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "${WORKER_NAME} पर चल रहे नोड के पिछले पाँच VPN सेशन लगभग एक मिनट बाद बिना कोई डेटा भेजे खत्म हो गए, इसलिए ऑनलाइन दिखते हुए भी यह कुछ नहीं कमाता। संभावित कारण ${WORKER_NAME} के आगे का राउटर है: बाहर से कोई पैकेट किसी पोर्ट तक पहुँचते ही, वह उस पोर्ट से नोड के बाद के जवाबों का सोर्स पोर्ट बदल देता है, और हर सेशन ऐसे ही एक पैकेट से शुरू होता है (नोड की अपनी पोर्ट जाँच), इसलिए खरीदार नोड के जवाब छोड़ देते हैं। चौड़ी पोर्ट रेंज से मदद नहीं मिलती। गाइड में जाँच और समाधान देखें: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports कोई सेशन डेटा ले जाते ही यह हट जाता है।"
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "कमाई MYST टोकन में। आवासीय IP काफ़ी ज़्यादा कमाते हैं। प्रबंधन के लिए नोड WebUI पोर्ट 4449 पर है, जो डिफ़ॉल्ट रूप से सिर्फ़ उसी मशीन (127.0.0.1) पर प्रकाशित होता है जिस पर नोड चलता है; दूसरी मशीन से पहले एक SSH टनल खोलें (ssh -L 14449:127.0.0.1:4449 और उसके बाद नोड की मशीन का पता, फिर http://127.0.0.1:14449 ब्राउज़ करें; लोकल पोर्ट 14449 ताकि यह आपकी अपनी मशीन के किसी नोड से न टकराए), या UI_ADDRESS में एक पता जोड़ें (Mysterium गाइड में WebUI पता देखें)। VPS स्वीकार। UDP 23000-23029 (UDP_PORTS डिफ़ॉल्ट) का पोर्ट फ़ॉरवर्डिंग ज़ोरदार तरीके से सुझाया जाता है -- इसके बिना नोड को Strict NAT स्थिति मिलती है और कई VPN सेशन विफल होते हैं, जिससे आय बहुत घट जाती है। ज़रूरी: पहली बार चलाने के बाद, नोड WebUI या CLI से अपना beneficiary (settlement) वॉलेट अपने mystnodes.com खाते से मेल खाता सेट करें -- इससे ऑन-चेन कमाई आपके क्लाउड डैशबोर्ड से जुड़ती है।"
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "हर बार जब किसी नोड के पास 5 MYST बिना सेटल किए हों, तब अपने-आप ऑन-चेन सेटलमेंट"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "दबाने के लिए कोई बटन नहीं। हर नोड के पास 5 MYST बिना सेटल किए होते ही वह Polygon पर खुद सेटल करता है, और लगभग 21% शुल्क में जाता है (20% Hermes शुल्क और थोड़ा ट्रांज़ैक्शन शुल्क), इसलिए हर सेटलमेंट पर लगभग 3.9 MYST beneficiary वॉलेट तक पहुँचते हैं। हर नोड का TequilAPI अपने सेटलमेंट /transactor/settle/history पर दिखाता है। MystNodes पर \"total earnings\" का आँकड़ा सिर्फ़ पिछले 30 दिनों का है; यह न बैलेंस है और न जीवन भर का कुल। MystNodes इनाम कार्यक्रम से मिले बोनस MYST अपने-आप सेटल नहीं होते: इन्हें Rewards पेज पर क्लेम करें, MystNodes सहायता केंद्र के अनुसार वितरण के 30 दिनों के भीतर।"
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "beneficiary वॉलेट डिप्लॉय के बाद TequilAPI या नोड WebUI से सेट किया जाता है -- किसी env var से नहीं, इसलिए इसे कंटेनर स्पेसिफ़िकेशन से नहीं पढ़ा जा सकता।"
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
