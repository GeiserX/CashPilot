  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Minez du Pearl, du Zano ou du Ravencoin avec un GPU NVIDIA. CashPilot télécharge la version officielle de SRBMiner-Multi au premier démarrage et vérifie son SHA-256. Le pool que vous choisissez paie votre adresse de paiement publique. SRBMiner-Multi garde 2 % du temps de hachage sur Pearl et 0.85 % sur les deux autres. L'électricité peut coûter plus cher que les cryptomonnaies que vous gagnez."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Minez du Pearl et d'autres cryptomonnaies GPU sur un GPU NVIDIA"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Adresse de paiement"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "Nom du worker"
  source: "73f1a739a9a5"
