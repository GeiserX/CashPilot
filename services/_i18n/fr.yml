  source: "df01af60b81c"
proxyrack.docker.health_signals.0.means:
  text: "Le client de Proxyrack ne s'est pas téléchargé au démarrage du conteneur : le conteneur tourne donc, mais ne gagne rien. Un redémarrage le télécharge à nouveau ; si le problème persiste après un redémarrage, vérifiez que cette machine a accès à Internet."
