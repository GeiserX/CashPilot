proxyrack.rating.cons.0.text:
  text: "Le centre d'aide de ProxyRack indique que supprimer un appareil retire ses gains de votre compte, et qu'ils ne reviennent que si le même appareil est ajouté à nouveau."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack publie sa propre image Docker, proxyrack/pop, et accepte les IP de centre de données à un tarif plus bas."
  source: "278541f81053"
repocket.description:
  text: "Repocket vous permet de gagner des revenus passifs en partageant la bande passante Internet que vous n'utilisez pas. Les IP résidentielles gagnent le plus ; les IP de VPS/centre de données sont acceptées à des tarifs plus bas. 5 appareils et 5 sessions actives max. par compte. Le conteneur Docker s'authentifie avec l'e-mail de votre compte et une clé d'API issue du tableau de bord Repocket (pas votre mot de passe).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Partage de bande passante - 5 appareils max., authentification par clé d'API"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "E-mail"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "Clé d'API (UUIDv4, pas votre mot de passe)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "L'e-mail de votre compte Repocket"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Votre clé d'API Repocket — connectez-vous sur <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> et copiez la clé d'API affichée sur la page bandwidth-earnings (ce n'est PAS le mot de passe de votre compte). Pas encore de compte ? Inscrivez-vous via <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "Les IP résidentielles gagnent plus. Les IP de VPS/centre de données sont acceptées, mais à des tarifs plus bas."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 après le premier paiement)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket fixe le minimum par compte : $4 avant le premier paiement et $2 ensuite en octobre 2026, bien en dessous des $20 annoncés auparavant. Moyens : Tremendous (vers votre e-mail) ou USDT sur Polygon. Chaque demande se confirme via un lien reçu par e-mail dans les 2 heures, et une seule demande peut être en attente à la fois. En octobre 2026, Repocket a refusé une demande Tremendous avec « Please, message support », alors que l'USDT sur Polygon est passé."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Solde conservé par Repocket ; retiré sur demande."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Utilisez l'e-mail et le mot de passe de votre compte Repocket (les mêmes que sur <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Pas encore de compte ? Inscrivez-vous via <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2 dès que le filleul a gagné $7, puis 5 % de ses gains à vie"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "Bonus de $2 sur le portefeuille à l'inscription"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket documente une limite de cinq appareils par COMPTE mais ne publie aucune limite d'appareils par IP. Le chiffre de « 2 appareils par IP » répété sur les sites d'avis n'a aucune source chez le fournisseur, CashPilot ne l'affirme donc pas."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Gardez un appareil Repocket en partage, ou retirez votre solde"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Après 12 mois sans connexion, paiement ni partage de bande passante, Repocket peut confisquer le solde non payé."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Gardez un appareil en partage, connectez-vous ou retirez votre solde. Si vous arrêtez d'utiliser Repocket, retirez d'abord."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Plusieurs avis Trustpilot signalent des paiements annulés et des soldes remis à zéro ; l'un d'eux indique que le support a invoqué des gains de bande passante irréguliers. La page note Repocket 2.7 et indique qu'il n'a pas répondu aux avis négatifs."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Des utilisateurs signalent des retraits refusés et devoir relancer pour être payés."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "La politique de paiement de Repocket lui permet d'annuler, de révoquer ou de confisquer définitivement des gains dès qu'il les soupçonne d'être invalides, et de confisquer les gains non payés d'un compte inactif."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "La même politique permet à Repocket d'ajouter, de retirer ou de remplacer des moyens de paiement à tout moment sans préavis ; PayPal a été retiré."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Les conditions indiquent que Repocket peut exiger une vérification d'identité ou de compte à tout moment, et que l'éligibilité aux paiements en dépend."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Les conditions indiquent que Repocket et ses partenaires utilisent la capacité du réseau, mais ne disent ni qui sont les partenaires ni comment ils sont contrôlés."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot note que Repocket n'a pas répondu aux avis négatifs, et des utilisateurs disent que leurs messages sont ignorés."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "Les conditions actuelles nomment Repocket Pte. Ltd. à Singapour ; les anciennes ne nommaient aucune société."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket publie sa propre image Docker, repocket/repocket, et ses conditions autorisent les conteneurs qui vous appartiennent."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Le minimum est bas : $4 avant le premier paiement et $2 ensuite."
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io vous permet de partager votre GPU pour des charges de travail d'IA distribuées et de gagner un solde Salad échangeable contre des cartes cadeaux, des jeux ou de l'argent. Windows uniquement, avec une application de bureau native. Nécessite un GPU dédié (NVIDIA ou AMD). La plateforme envoie à votre machine, quand elle est inactive, des tâches d'inférence d'IA, de rendu et d'autres calculs. L'une des plateformes de partage de GPU les plus simples à utiliser.\n"
  source: "09335baccea6"
salad.short_description:
  text: "Partage de GPU pour l'IA - Windows uniquement, paiement en cartes cadeaux ou en argent"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Les gains dépendent du modèle de GPU et du travail disponible. RTX 3060 ~$1-3/jour. Windows uniquement. App native, pas de prise en charge de Docker. Échangeable contre des cartes cadeaux, des jeux ou PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
