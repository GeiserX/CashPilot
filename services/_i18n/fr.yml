proxyrack.device_link.steps:
  text: "Connectez-vous à ProxyRack, ouvrez Devices, choisissez Add device et collez cet UUID. Tant que l'appareil n'est pas sur votre compte, il ne gagne pour personne. Si vous avez saisi une clé d'API, le conteneur s'enregistre lui-même : vérifiez que l'appareil y figure."
  source: "54c4041903b5"
proxyrack.earnings.notes:
