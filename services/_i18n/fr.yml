  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "Les adresses de l'hôte sur lesquelles la WebUI du nœud (port 4449) est publiée. 127.0.0.1 la limite à cette machine. Pour y accéder via un reverse proxy, ajoutez l'adresse à laquelle le proxy se connecte, séparée par une virgule et sans espace : 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "Les ports UDP que le nœud utilise pour les sessions VPN, au format début:fin. Redirigez cette même plage sur votre routeur. Chaque session prend environ deux ports, donc les 30 par défaut permettent environ 15 sessions simultanées, plus qu'un nœud domestique n'en reçoit. Une plage plus large ne corrige rien et coûte plus cher : chaque port publié ralentit le démarrage et la suppression du nœud (300 ports prennent environ 12 s à démarrer), CashPilot en accepte au plus 300, et avec le proxy userland par défaut de Docker chaque port prend aussi environ 2.5 MB de mémoire. Des sessions qui échouent toutes indiquent un problème de routeur, pas un manque de ports : voir « Routers that rewrite UDP source ports » dans le guide Mysterium. Restez en dessous de 32768 : les ports 32768-60999 forment la plage éphémère de Linux, où n'importe quel programme de l'hôte peut en occuper un un instant, et un seul port pris fait échouer le démarrage du nœud. Un nœud qui a déjà une plage la conserve."
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "Trousseau de l'identité du nœud. Le détruire crée une identité entièrement nouvelle : le nœud perd sa réputation et tous les gains encore retenus au titre de l'ancienne."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "Le nœud ne peut pas exécuter sudo dans son conteneur : il ne peut donc pas configurer son interface VPN ni son pare-feu, et chaque session échoue à l'établissement. Il semble en ligne et ne gagne rien. Le conteneur a été créé sans les capacités SETUID et SETGID. Mettez à jour CashPilot et le worker qui fait tourner ce nœud, puis redéployez Mysterium depuis le tableau de bord ; l'identité du nœud se trouve dans son volume de données et est conservée."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "Aucune session VPN des 6 dernières heures n'a atteint ce nœud directement. Toutes sont passées par le hole punching, et beaucoup d'acheteurs n'arrivent pas à se connecter de cette façon : le nœud gagne donc moins. Ses ports UDP ne sont pas joignables depuis Internet. Sur votre routeur, redirigez la plage de ports UDP ${UDP_PORTS} (début:fin, la même plage des deux côtés) vers ${HOST_ADDRESS}. Ce message disparaît de lui-même dès qu'une session se connecte directement."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "La surveillance de Mysterium marque le nœud sur ${WORKER_NAME} comme en échec : il est donc exclu de la liste de nœuds dans laquelle la plupart des acheteurs choisissent, même quand sa propre vérification indique que tous les ports sont joignables. Assurez-vous d'abord que le nœud dispose de /dev/net/tun et de SETUID/SETGID, dont l'absence le fait échouer de la même façon : https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Une fois ces points réglés, une cause fréquente est que le routeur devant ${WORKER_NAME} réécrit le port source UDP des réponses du nœud dès qu'un paquet venu de l'extérieur a atteint ce port. Voir le test dans le guide : https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "Les cinq dernières sessions VPN du nœud sur ${WORKER_NAME} se sont toutes terminées au bout d'environ une minute sans transférer de données : il ne gagne donc rien tout en semblant en ligne. La cause probable est le routeur devant ${WORKER_NAME} : dès qu'un paquet venu de l'extérieur atteint un port, il réécrit le port source des réponses suivantes du nœud depuis ce port, et chaque session commence par un tel paquet (la vérification de port du nœud lui-même), si bien que les acheteurs rejettent les réponses du nœud. Une plage de ports plus large n'aide pas. Voir le test et les correctifs dans le guide : https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Ce message disparaît dès qu'une session transfère des données."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Gains en jetons MYST. Les IP résidentielles gagnent nettement plus. WebUI du nœud sur le port 4449 pour la gestion, publiée par défaut uniquement sur la machine où il tourne (127.0.0.1) ; depuis une autre machine, ouvrez d'abord un tunnel SSH (ssh -L 14449:127.0.0.1:4449 suivi de l'adresse de la machine du nœud, puis ouvrez http://127.0.0.1:14449 ; le port local 14449 évite tout conflit avec un nœud sur votre propre machine), ou ajoutez une adresse à UI_ADDRESS (voir WebUI address dans le guide Mysterium). VPS acceptés. La redirection des ports UDP 23000-23029 (la valeur par défaut de UDP_PORTS) est fortement recommandée -- sans elle, les nœuds passent en statut Strict NAT et beaucoup de sessions VPN échouent, ce qui réduit fortement les revenus. Important : après le premier lancement, définissez votre portefeuille bénéficiaire (de règlement) via la WebUI ou la CLI du nœud pour qu'il corresponde à votre compte mystnodes.com -- cela relie les gains on-chain à votre tableau de bord cloud."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Règlement on-chain automatique chaque fois qu'un nœud détient 5 MYST non réglés"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Aucun bouton à presser. Chaque nœud effectue lui-même son règlement sur Polygon dès qu'il détient 5 MYST non réglés, et environ 21 % partent en frais (les 20 % de frais Hermes plus de petits frais de transaction) : environ 3.9 MYST arrivent donc sur le portefeuille bénéficiaire à chaque règlement. La TequilAPI de chaque nœud liste ses règlements sur /transactor/settle/history. Le chiffre « total earnings » de MystNodes ne couvre que les 30 derniers jours ; ce n'est ni un solde ni un total depuis le début. Les MYST bonus du programme de récompenses MystNodes ne se règlent pas d'eux-mêmes : réclamez-les sur la page Rewards, dans les 30 jours suivant la distribution selon le centre d'aide MystNodes."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "Le portefeuille bénéficiaire se définit APRÈS le déploiement, via TequilAPI ou la WebUI du nœud -- pas par une variable d'environnement, il ne peut donc pas être lu dans la spécification du conteneur."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Utilisez l'e-mail et le mot de passe de votre compte MystNodes (les mêmes que sur <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST par ami dont le nœud gagne 5 MYST (IP résidentielles uniquement)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST dès que votre nœud gagne ses 5 premiers MYST (IP résidentielle, nœud associé sur mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Réclamez les récompenses MystNodes du mois dernier"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Les récompenses non réclamées dans les 30 jours suivant la distribution mensuelle sont perdues et retournent dans la cagnotte du mois suivant."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Ouvrez la page Rewards et échangez vos points contre des MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "De la bande passante. Votre connexion sert de nœud de sortie au réseau Mysterium, qui vend des services de VPN, de proxy ET de collecte de données. Le trafic de collecte qui sort d'une IP résidentielle est l'usage le plus susceptible de provoquer des plaintes, et vous ne pouvez pas choisir lequel des trois votre nœud transporte."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Oui. Des inconnus font passer leur trafic par votre adresse IP — c'est le produit lui-même."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "L'identité du nœud (une adresse blockchain), votre IP et une localisation approximative (pays/ville/FAI), que le nœud publie sur le réseau pour que les acheteurs puissent le choisir."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Réel et à bien comprendre. Le trafic d'autres personnes sort par votre connexion en vous étant attribué : tout ce qu'elles font semble donc provenir de votre ligne. Beaucoup de contrats de FAI grand public l'interdisent. Vérifiez le vôtre avant de le faire tourner."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Appareils illimités par compte et par IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Environ 21 % de chaque règlement part en frais, les 20 % de frais Hermes plus des frais de transaction, et les gains sont payés en jeton MYST."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Votre nœud sert de sortie aux clients VPN, proxy et collecte de données de Mysterium, et vous ne pouvez pas choisir lesquels il transporte."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "Le logiciel du nœud est open source sous GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium publie sa propre image Docker, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "Le règlement va sur un portefeuille qui vous appartient ; aucun numéro de téléphone ni pièce d'identité n'est demandé."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "Le projet de nœud existe depuis 2017."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Le site de Mysterium indique que le réseau est développé par Blockdev AG, à Zoug, en Suisse."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay est un réseau DePIN qui récompense les utilisateurs qui partagent leur bande passante via une extension de navigateur. La plateforme est protégée par Cloudflare, ce qui peut compliquer l'accès automatisé. Les utilisateurs gagnent des Nodepay Points en gardant l'extension active. Le réseau se concentre sur la fourniture d'infrastructure de données d'entraînement pour l'IA.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "Partage de bande passante DePIN pour l'IA - extension de navigateur"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Gagne des Nodepay Points ; les points des utilisateurs qui passent les contrôles d'éligibilité de Nodepay sont convertis en jeton NC. La protection Cloudflare peut bloquer la collecte automatisée. L'extension de navigateur est nécessaire."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Airdrop du jeton NC (calendrier non confirmé)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Système à points. Les points des utilisateurs qui passent les contrôles d'éligibilité de Nodepay sont convertis en jeton NC, lancé en janvier 2025."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Pas encore déterminé : CashPilot n'a pas encore vérifié où ce service conserve vos gains."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "Lors du bilan de sa première saison, Nodepay a supprimé plus de 300,000 comptes qu'il jugeait être des bots et annulé 17 milliards de points."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Les récompenses sont des points convertis en jeton NC : leur valeur repose donc sur le jeton."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot ne fait pas tourner Nodepay : vous utilisez l'extension de navigateur du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes est le niveau d'entrée gratuit du Noderr Protocol, un projet DeFi sur Base L2. Un micronode est un petit agent sur un téléphone Android inutilisé, un PC Windows, un Mac ou un navigateur Chromium. Sur Android, il partage la connexion mobile du téléphone : du trafic Noderr d'autres personnes sort par l'IP de l'opérateur du téléphone, il faut donc une SIM avec des données mobiles. Sur un PC ou dans le navigateur, il exécute des tâches d'automatisation pour le protocole avec la puissance de calcul disponible. Les récompenses sont prévues en NODR, ajustées selon un score on-chain de disponibilité et de fiabilité, mais le réseau est sur le testnet Base Sepolia pendant sa bêta : les récompenses des nœuds ne sont pas financées et aucune n'a encore été payée.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Micronode gratuit (partage de connexion Android, Windows, Mac, navigateur) - testnet, récompenses non financées pour l'instant"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Bêta sur testnet : les récompenses des nœuds ne sont pas financées et aucune n'a encore été payée. L'APY de 5-10 % affiché sur le site est un objectif de conception. À revoir quand le réseau quittera Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Les récompenses s'accumulent sur le portefeuille propre du nœud et se réclament depuis l'app ou la dApp. Pendant la bêta, ce sont des jetons du testnet Base Sepolia sans valeur marchande."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "L'app crée le portefeuille du nœud au premier lancement et y frappe un Utility NFT soulbound gratuit. Sauvegardez le portefeuille depuis l'app : perdre l'appareil fait perdre l'identité du nœud. Les récompenses sont sur Base Sepolia (testnet) pendant la bêta."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android nécessite une SIM avec des données mobiles ; les clients de bureau et de navigateur n'indiquent aucune exigence d'IP."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Dépend de l'appareil. Un téléphone Android vend sa connexion mobile : du trafic Noderr d'autres personnes sort par l'adresse IP de l'opérateur du téléphone et est décompté de son forfait de données. Un PC Windows, un Mac ou un navigateur vend de la puissance de calcul disponible pour ce que le fournisseur appelle des tâches d'automatisation de réseaux sociaux et de contenu."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Oui. Sur Android, du trafic Noderr d'autres personnes sort par l'adresse IP mobile de votre téléphone ; l'app demande un consentement enregistré avant de démarrer et vous pouvez arrêter le partage depuis le même écran. Pour les clients Windows, Mac et navigateur, le fournisseur décrit des tâches d'automatisation sans dire si elles transportent du trafic pour d'autres personnes."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "L'adresse du portefeuille du nœud ainsi que ses chiffres de disponibilité et de tâches terminées sont inscrits on-chain sous forme de score de réputation (le TrustFingerprint). Le fournisseur indique que les tâches sont anonymisées, exécutées dans un bac à sable, et que les clés du portefeuille ne quittent jamais l'appareil. Rien de plus précis n'est publié."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Sur Android, la connexion partagée est un forfait mobile d'opérateur : la documentation du fournisseur prévient elle-même que le partage peut ne pas être autorisé par les politiques d'utilisation acceptable de certains opérateurs, et le trafic partagé consomme le forfait. Pour les clients de bureau et de navigateur, le fournisseur ne dit rien des conditions des FAI."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Un nœud par appareil, chacun avec son propre Utility NFT soulbound ; faire tourner plusieurs appareils est autorisé et encouragé. Aucune limite par IP n'est publiée. Il n'y a pas de compte au sens habituel : l'identité est un portefeuille que l'app génère au premier lancement."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Les récompenses des nœuds sont des jetons de testnet non financés, sans valeur marchande, et aucune n'a été payée ; l'APY de 5 à 10 % affiché sur son site est un objectif de conception."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Pour les clients de bureau et de navigateur, Noderr décrit des tâches d'automatisation sans dire si elles transportent le trafic d'autres personnes."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Le fournisseur indique que les tâches sont anonymisées et isolées dans un bac à sable, mais ne publie rien de plus précis."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Toujours une bêta sur le testnet Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot ne fait pas tourner Noderr : vous utilisez l'app ou l'extension du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Pas de compte : l'app génère un portefeuille au premier lancement."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle utilise le Bluetooth des smartphones pour créer une infrastructure IoT. L'app détecte et relaie passivement les données des objets IoT à proximité, et gagne des jetons NODL. Cité par Forbes, avec des partenariats d'entreprise avec Vivendi et Hayden AI. Mobile uniquement (iOS et Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Relais IoT Bluetooth - app mobile, récompenses en jeton NODL"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Gains très faibles. App de téléphone en arrière-plan qui utilise le Bluetooth. La connexion du portefeuille peut être capricieuse."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "En continu"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "Les NODL se trouvent dans le portefeuille de l'app sur ZKsync Era ; consultez-les dans l'app ou sur un explorateur de blocs ZKsync Era. Nodle a quitté sa parachain Polkadot, et le pont Polkadot vers ZKsync a fermé le 31 décembre 2025 : les NODL encore du côté Polkadot ne peuvent donc plus passer sur ZKsync."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "Pas encore déterminé : CashPilot n'a pas encore vérifié où ce service conserve vos gains."
  source: "8d61a71de590"
nodle.referral.bonus.referrer:
  text: "Une récompense en NODL pour chaque nouvel utilisateur actif qui rejoint via l'invitation (Nodle ne publie pas le montant)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Un utilisateur dit avoir gagné environ $3 en trois à quatre ans ; d'autres signalent une forte baisse des gains quotidiens."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot ne fait pas tourner Nodle : vous utilisez l'app de téléphone du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana est une place de marché de calcul GPU décentralisée construite sur Solana. Elle met en relation les propriétaires de GPU avec la demande de charges de travail d'IA, et paie en jetons NOS. Une RTX 3060 gagne environ $0.048/h. La plateforme se concentre sur les charges d'inférence d'IA et utilise la blockchain Solana pour la planification des tâches et le règlement des paiements. Les nœuds exécutent des charges de travail en conteneur via la CLI Nosana.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Calcul GPU sur Solana - jetons NOS, RTX 3060 ~$0.048/h"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/h, les GPU haut de gamme gagnent plus. Les gains dépendent des tâches disponibles et du modèle de GPU. Nécessite un GPU NVIDIA, Linux, Docker et la CLI Nosana. Paiements en jeton NOS sur Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "À chaque tâche terminée"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Gains en jetons NOS sur Solana. Paiement vers le portefeuille configuré."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Nosana crée par défaut un portefeuille Solana, si bien que la plupart des utilisateurs n'en ont jamais vu l'adresse."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Chaque hôte doit bloquer une mise en NOS proportionnelle au prix horaire de son GPU."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Les hôtes sont payés en NOS : leurs gains en dollars varient donc avec le jeton et avec la demande pour leur carte."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot ne fait pas tourner Nosana : vous utilisez le logiciel d'hôte du fournisseur, donc CashPilot ne peut ni le déployer ni le mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN est un pool de minage Bitcoin sans compte : votre mineur se connecte avec votre adresse Bitcoin comme nom d'utilisateur, et le pool paie cette adresse. CashPilot ne fait pas tourner de mineur ici. Il lit le solde non payé qu'OCEAN conserve pour votre adresse, pour que vous voyiez ce que votre ASIC (un Bitaxe, un Antminer) a gagné à côté de vos autres revenus. Le solde non payé est gagné mais pas encore reçu : OCEAN le paie on-chain dès qu'il dépasse le seuil de paiement.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Pool de minage Bitcoin, suivi par votre adresse de paiement"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Quand un bloc fait passer votre solde au-delà du seuil"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN paie on-chain sur votre adresse dès que votre solde non payé atteint le seuil. Les paiements Lightning (sur activation, BOLT12) ne sont pas détectés par CashPilot."
  source: "2d0f3e2d7422"
