proxybase.earnings.notes:
  text: "Paiements en crypto. Les gains dépendent de l'emplacement et de l'utilisation de la bande passante."
  source: "39229c292994"
proxybase.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
proxybase.cashout.notes:
  text: "Le site indique un minimum de $0.20, et une demande de moins de $1 est passée en octobre 2026. Une demande retire toujours la totalité du solde, en USDC sur Polygon, en POL ou en Litecoin, vers une adresse que vous saisissez. ProxyBase prend en charge les frais de réseau."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "Les gains s'accumulent sur le COMPTE ProxyBase auquel appartient l'Access Token, et se retirent depuis le tableau de bord sur demande. Le client pair ne détient aucun portefeuille et le conteneur ne conserve aucun état -- docker.volumes est vide. À ne pas confondre avec proxybase-xyz (ProxyBase Markets, même organisation), qui crée réellement un portefeuille local et le déclare comme volume critique."
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
