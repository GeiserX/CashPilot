passiveapp.description:
  text: "PassiveApp est une plateforme DePIN qui vous permet de gagner des récompenses en crypto et PayPal en partageant votre bande passante et vos ressources de calcul inutilisées. Windows uniquement en pratique : la page de téléchargement de l'éditeur indique Android, iOS et Linux comme « coming soon » sans changement depuis au moins février 2025, et aucune version macOS n'existe — malgré des textes marketing sur le même site qui annoncent une compatibilité plus large. Pas d'image Docker.\n"
