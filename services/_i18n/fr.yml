proxybase.description:
  text: "ProxyBase est une plateforme de partage de bande passante qui paie les utilisateurs en cryptomonnaie pour partager leur connexion Internet inutilisée. Vous authentifiez le client pair avec un Access Token issu de votre tableau de bord. Les IP résidentielles gagnent le plus, mais les IP de centre de données sont aussi prises en charge. Image Docker officielle multi-architecture (amd64/arm64/armv7).\n"
  source: "7a558682be11"
proxybase.short_description:
