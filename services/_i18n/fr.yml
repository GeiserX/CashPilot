  text: "Spide est un service de partage de bande passante qui vous permet de monétiser la bande passante Internet que vous n'utilisez pas. Utilise un identifiant de machine facultatif pour suivre l'appareil. Disponible via des images Docker communautaires du projet income-generator.\n"
