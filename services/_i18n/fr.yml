  source: "be820103712e"
proxyrack.cashout.notes:
  text: "Demandez le paiement sur le tableau de bord. ProxyRack l'examine sous 72 heures, puis Tremendous vous envoie par e-mail une récompense à échanger contre PayPal, une carte cadeau ou un virement bancaire. Il n'y a pas d'option crypto."
  source: "6201d57f50be"
proxyrack.payout.notes:
