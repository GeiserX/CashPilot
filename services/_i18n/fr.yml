packetstream.cashout.notes:
  text: "PayPal uniquement, minimum $5, frais de 3 % affichés avant confirmation. Le premier retrait enregistre votre e-mail PayPal ; le modifier ensuite demande une confirmation par e-mail et un délai de 7 jours, vérifiez donc l'adresse avant de confirmer. Les demandes sont examinées et envoyées sous 7 jours ; vous pouvez en annuler une tant qu'elle est en attente, et une nouvelle ne peut être faite qu'une fois la précédente payée."
  source: "ca9e35054ffd"
packetstream.payout.notes:
