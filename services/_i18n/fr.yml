  source: "3571c2e99729"
proxybase.docker.env.NAME.description:
  text: "N'importe quel nom (sans espace) pour identifier cet appareil dans votre tableau de bord ProxyBase"
  source: "906ebedecbc7"
proxybase.docker.health_signals.0.means:
  text: "ProxyBase n'a pas joint son relais depuis au moins une demi-heure : il ne gagne donc rien. Un redémarrage règle le problème ; s'il persiste après un redémarrage, vérifiez que cette machine a accès à Internet."
