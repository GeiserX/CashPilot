grass.description:
  text: "Grass est un réseau décentralisé qui vous permet de vendre votre bande passante inutilisée pour des données d'entraînement d'IA. Il fonctionne comme extension de navigateur et comme app de bureau, et fait passer par votre connexion des requêtes de web scraping pour constituer des jeux de données structurés. Avec plus de 8.5M d'utilisateurs, c'est l'un des plus grands réseaux DePIN de bande passante. Gagne des jetons GRASS sur la blockchain Solana.\n"
  source: "046951d812f9"
