iproyal.docker.health_signals.1.means:
  text: "Pawns voit un autre appareil actif sur cette adresse IP et n'en paie qu'un par IP : cette copie tourne donc, mais ne partage rien et ne gagne rien. Arrêtez toute autre app Pawns sur cette IP, que ce soit sur une autre machine, un PC ou un téléphone. S'il n'y en a aucune, attendez que Pawns retire l'ancien appareil, ou demandez au support Pawns de le libérer."
