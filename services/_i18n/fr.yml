packetstream.referral.bonus.referee:
  text: "Crédit bonus de 10 % sur votre premier dépôt par carte ou PayPal (clients proxy)"
  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "Des avis Trustpilot de 2025 et 2026 signalent des paiements arrivés en retard ou jamais, et un utilisateur de longue date dit que les paiements ont ralenti puis cessé ; d'autres, en 2026, disent avoir été payés."
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "PayPal uniquement, avec 3 % de frais de retrait ; les utilisateurs de pays non desservis par PayPal n'ont aucun autre moyen."
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
