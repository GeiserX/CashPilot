earnapp.description:
  text: "EarnApp de Bright Data vous permet de vendre votre bande passante inutilisée pour obtenir des revenus passifs. Bright Data est le plus grand réseau de proxys au monde et alimente la collecte de données d'entreprises du Fortune 500. CashPilot le fait tourner depuis sa propre image, qui télécharge au premier démarrage la version épinglée d'EarnApp depuis le CDN de Bright Data, vérifie son sha256 et l'exécute en mode lite avec seulement un UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Partage de bande passante - soutenu par Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "UUID du nœud"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "L'identifiant de votre nœud EarnApp : sdk-node- suivi de 32 caractères hexadécimaux en minuscules, tel que l'affiche 'earnapp showid'. Après le déploiement, associez-le une fois en ouvrant https://earnapp.com/r/ suivi de cet UUID en étant connecté à EarnApp ; un nœud non associé gagne, mais rien n'arrive sur votre solde"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp n'arrive toujours pas à joindre ses serveurs et redémarre sans cesse, donc il gagne peu ou rien. Redémarrez cette copie ; si cela continue, vérifiez la connexion Internet de cette machine."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Ouvrez ce lien en étant connecté à EarnApp pour ajouter le nœud à votre compte. Tant que vous ne l'avez pas fait, le nœud gagne mais rien n'arrive sur votre solde."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Dépend fortement de l'emplacement. Les IP des États-Unis et de l'UE gagnent le plus. Les gains augmentent avec la bande passante consommée."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Sur demande (échange automatique disponible : PayPal min. $10, Wise min. $10, Amazon min. $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Activez une fois l'échange automatique et EarnApp paie de lui-même chaque fois que le solde atteint le minimum du moyen choisi : PayPal $10, Wise $10, Amazon $50. Les paiements PayPal viennent de Bright Data Ltd. En octobre 2026, un paiement PayPal est arrivé environ 2 % en dessous du solde échangé."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Solde conservé par EarnApp ; échangé vers Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Connectez-vous sur <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, appuyez sur F12 → Application → Cookies, puis copiez la valeur <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10 % de leurs gains à vie, versés en plus des leurs"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "Le centre d'aide d'EarnApp indique que l'installer dans des conteneurs Docker, des machines virtuelles, des services d'hébergement ou des serveurs domestiques est strictement interdit, or c'est ainsi que CashPilot le fait tourner."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
