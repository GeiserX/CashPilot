dawn.description:
  text: "DAWN exploite un réseau de validateurs qui vérifie la bande passante et la couverture de l'infrastructure d'IA financée via le protocole DAWN. L'extension de navigateur DAWN Validator participe à ces vérifications de preuve de bande passante et de couverture, et gagne des récompenses DAWN tant qu'elle tourne. Ces récompenses n'ont pas encore de valeur en argent établie. Créez le compte dans l'extension et saisissez le code de parrainage 2QLQV97F quand elle le demande.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "Validateur DePIN - une extension de navigateur gagne des points DAWN"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Gagne des Dawn Points avant le lancement du jeton. La valeur réelle dépend du futur prix du jeton. Le boîtier matériel gagne plus que l'extension de navigateur."
  source: "607d3b0c3f7c"
