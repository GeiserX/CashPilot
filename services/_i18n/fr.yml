mysterium.description:
  text: "MystNodes (Mysterium Network) est un réseau décentralisé de VPN et de proxy basé sur la technologie blockchain. Vous gagnez des jetons MYST en faisant tourner un nœud qui fournit des services de VPN, de proxy et de collecte de données aux utilisateurs. Nécessite les capacités NET_ADMIN, SETUID et SETGID et un périphérique TUN, qu'il utilise dans son propre espace de noms réseau sur le pont des apps de gains derrière la barrière. Comprend une interface web intégrée pour gérer le nœud. Fonctionne sur les connexions résidentielles comme sur les VPS, mais le bonus de parrainage n'est payé que pour les nœuds sur une IP résidentielle.\n"
  source: "7d3687f6edbd"
