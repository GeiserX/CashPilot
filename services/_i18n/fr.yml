  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10 % de leurs gains à vie"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "Solde de départ de $5"
  source: "fb8d2b82e1e7"
