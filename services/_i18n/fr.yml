  source: "be820103712e"
honeygain.cashout.notes:
  text: "Minimum $20 (20,000 crédits). Deux options : PayPal via Tipalti, avec environ 15 % de frais, ou des crédits JumpTask sans frais, versés sur un portefeuille JumpTask. Une demande nécessite un code à 6 chiffres envoyé par e-mail. Le premier paiement PayPal reste « waiting for details » tant que vous ne vous êtes pas inscrit sur Tipalti via le lien reçu par e-mail. Ce lien ne fonctionne qu'une fois : ouvrez-le quand vous pouvez tout terminer d'une traite et que vous avez votre téléphone sous la main. Après la création d'un mot de passe, Tipalti vous fait confirmer un numéro de mobile par SMS (les codes expirent en quelques minutes), puis demande vos nom, adresse, pays et date de naissance, ainsi que votre adresse PayPal. Tipalti facture $2.02 par paiement ; choisissez USD pour éviter ses frais de conversion de devise de 1.9-3 %. Le paiement suit sous 2 jours ouvrés. Le solde quitte votre compte dès la demande, même pendant que le paiement attend Tipalti. Chaque connexion ultérieure à Tipalti envoie un nouveau code SMS, sauf si vous cochez l'option pour mémoriser l'appareil pendant 30 jours. En octobre 2026, Tipalti n'a pas demandé de formulaire fiscal à un bénéficiaire en Espagne."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Solde conservé par Honeygain ; retiré sur demande."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
