  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network est un projet de VPN décentralisé et d'infrastructure web3. Nécessite surtout des appareils matériels propriétaires Deeper Connect. Moken est une plateforme de minage et de staking associée. Pas uniquement logiciel.\n"
