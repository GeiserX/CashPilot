  source: "452b38e35357"
proxybase.rating.cons.2.text:
  text: "Crypto uniquement, en USDC sur Polygon, en POL ou en Litecoin, sans moyen en monnaie classique. Le minimum est de $0.20 et ProxyBase paie les frais de réseau."
  source: "2f15ff41b14c"
proxybase.rating.pros.0.text:
  text: "Notre retrait de moins de $1 est passé en octobre 2026."
