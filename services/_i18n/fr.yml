  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets est une place de marché de proxys SOCKS5 conçue pour les agents d'IA. Les vendeurs font tourner un démon CLI léger en Rust qui se connecte en WebSocket pour relayer le trafic des acheteurs via leur connexion Internet, et gagnent des USDC sur Tempo Chain par GB vendu. Prend en charge un mode direct (votre propre bande passante) et un mode upstream (revente de proxys externes), avec reconnexion automatique. Les acheteurs achètent des sessions de proxy par pays, FAI et bande passante. Les paiements passent par le Machine Payments Protocol (MPP) sur Tempo Chain. Le lien de parrainage est destiné aux acheteurs : un acheteur qui ouvre la console via ce lien reçoit 10 % de plus sur son premier dépôt.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - place de marché SOCKS5 pour agents d'IA, paiement en USDC. Génère un portefeuille dont le volume contient la seule copie de la clé"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "URL de l'API backend"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "Remplace l'URL de l'API backend (par défaut https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "Le conteneur s'initialise tout seul au premier démarrage : il génère un portefeuille secp256k1 (BIP-39), s'authentifie par défi-réponse ECDSA et commence à vendre de la bande passante en mode direct uniquement. Tout l'état (portefeuille, jeton de session, configuration vendeur) est conservé dans le volume <code>proxybase-data</code>. Consultez les journaux du conteneur au premier lancement pour connaître l'adresse du portefeuille. Utilisez <code>--upstream</code> pour ajouter des chemins de revente de proxys externes.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "Le fichier de clé du portefeuille généré. Ce volume, C'EST l'argent : il n'existe aucune copie côté serveur, donc le supprimer détruit les fonds avec lui."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Gains basés sur les GB vendus au prix du marché. Les IP de VPS/centre de données gagnent moins que les IP résidentielles. Le mode multi-upstream peut combiner votre propre bande passante avec des proxys externes."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Bloquez les gains via <code>proxybase-cli seller payout create</code>, reçus en USDC sur Tempo Chain (Tempo MPP). Paie sur toute adresse EVM dont vous détenez la clé (Tempo est une chaîne EVM), sans rien à signer ; ajoutez le réseau Tempo au portefeuille pour voir les USDC. Si un portefeuille ne les affiche toujours pas, il faut ajouter à la main le jeton USDC de Tempo : importez-le avec l'adresse de contrat fournie par Proxybase, et vérifiez cette adresse avant de vous fier au solde."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "Le client crée son propre portefeuille au premier lancement."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "15 % de chaque dépôt d'un acheteur parrainé, sous forme de crédit pour vos propres sessions de proxy"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "+10 % sur le premier dépôt d'un acheteur"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "De la bande passante, sous forme de proxy SOCKS5 vendu aux acheteurs de la place de marché ProxyBase."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Oui. Les acheteurs font passer leur trafic par votre connexion — c'est exactement ce qui est vendu."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Une adresse de portefeuille générée sur votre machine, plus le volume de trafic que vous relayez."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Réel, et il concerne directement les connexions domestiques. Le trafic proxy d'acheteurs inconnus sort sous votre IP : les plaintes pour abus arrivent donc chez vous. Rien dans ce catalogue ne limite le service aux adresses de centre de données, et les IP résidentielles gagnent plus : l'incitation va donc dans le mauvais sens ici. Lisez les conditions de votre FAI avant de le faire tourner chez vous."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "inconnu - le fournisseur ne publie pas de limite d'appareils par compte ou par IP, et le catalogue n'en déclare pas."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "Les paiements se font en USDC sur Tempo Chain, vers toute adresse EVM dont vous détenez la clé."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "Votre connexion est vendue comme proxy SOCKS5 aux acheteurs de la place de marché ; nous n'avons trouvé aucune description de la façon dont les acheteurs sont contrôlés."
  source: "2dec55ca610f"
proxybase-xyz.rating.pros.0.text:
  text: "Sa propre page de gains annonce dans son titre qu'aucun KYC n'est nécessaire, avec un paiement à $1."
  source: "25b6dc3b4608"
proxybase-xyz.rating.pros.1.text:
  text: "ProxyBase publie sa propre image de client et accepte les connexions de centre de données."
  source: "ae81d006093f"
