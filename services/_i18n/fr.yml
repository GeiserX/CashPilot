  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Notre paiement PayPal est arrivé en octobre 2026, environ 2 % en dessous du solde échangé."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
