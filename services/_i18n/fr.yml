  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Connectez-vous sur <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, appuyez sur F12 → Application → Cookies, puis copiez la valeur du cookie <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Gagnez quelques Salad Reward Points, ou dépensez votre solde"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Si un compte ne gagne aucun Reward Point pendant 12 mois d'affilée, son solde non échangé peut expirer."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Faites tourner l'app Salad jusqu'à ce qu'elle gagne, ou dépensez la totalité du solde dans le Salad Storefront. N'en dépenser qu'une partie ne remet pas les 12 mois à zéro."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot ne fait pas tourner Salad : vous utilisez l'app de bureau du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Plusieurs avis Trustpilot d'octobre et novembre 2026 signalent des retraits PayPal reçus rapidement, parfois à plusieurs reprises ; un avis de la même période indique que des tentatives de retrait répétées ont échoué."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel est une blockchain Cosmos de couche 1 pour le VPN décentralisé. Les opérateurs de nœuds vendent de la bande passante aux utilisateurs de VPN avec une tarification flexible (au GB ou à l'heure). Un guide officiel de déploiement Docker est disponible. Projet ancien avec une communauté active.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "VPN décentralisé sur Cosmos - les opérateurs de nœuds vendent de la bande passante"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Les opérateurs fixent leurs propres prix au GB ou à l'heure. Les gains dépendent de la demande des utilisateurs de VPN dans votre région."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Par session"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Pas encore déterminé : CashPilot n'a pas encore vérifié où ce service conserve vos gains."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Les paiements sont en jeton P2P, et 20 % de chaque paiement de bande passante va aux stakers plutôt qu'à l'hôte du nœud."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "Le jeton a été renommé de SENT en DVPN en 2021, puis de DVPN en P2P en 2025."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot ne fait pas tourner Sentinel : vous utilisez le logiciel de nœud du fournisseur, donc CashPilot ne peut ni le déployer ni le mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel publie le code source de son nœud sous sa propre licence open source."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia est une place de marché de stockage décentralisée gérée par la Sia Foundation (une organisation suisse à but non lucratif), en activité depuis 2015. Faites tourner le nœud officiel hostd de la Foundation pour louer votre espace disque libre et gagner des Siacoin grâce à des contrats de stockage et de bande passante. Vous devez acheter quelques Siacoin avant que le nœud puisse gagner : les hôtes bloquent une garantie pour chaque contrat et paient des frais pour chaque preuve de stockage. La garantie est restituée à la fin d'un contrat et brûlée si le nœud se déconnecte ou perd des données : il faut donc une machine allumée en permanence (Sia demande au moins 95 % de disponibilité). Les gains dépendent de la quantité de données que les locataires stockent réellement ; Sia recommande de fixer le prix du stockage à $1 par TB et par mois, ce qui convient donc à des machines avec de grands disques libres plutôt qu'à de petites offres VPS.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Nœud de stockage de la Sia Foundation - image Docker officielle, gagnez des Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Phrase de récupération du portefeuille"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Mot de passe du tableau de bord"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Dossier de stockage"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "Phrase de récupération BIP-39 qui contrôle le portefeuille Siacoin de l'hôte. Générez-en une avec `docker run --rm ghcr.io/siafoundation/hostd seed` et sauvegardez-la -- c'est le SEUL moyen d'accéder aux gains"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Mot de passe de l'interface web et de l'API locale de hostd (BasicAuth). N'importe quelle longue phrase de passe"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Chemin sur l'hôte, sur votre plus grand disque, où sont stockées les données des locataires (par ex. /srv/sia). Nécessite au moins 256GB libres"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Au déploiement, CashPilot crée un nouveau portefeuille sur la machine qui fait tourner le nœud et affiche sa phrase de récupération une seule fois : notez-la. Pour utiliser un portefeuille que vous avez déjà, collez plutôt sa phrase de récupération. Après le déploiement, envoyez quelques Siacoin sur le portefeuille du nœud pour la garantie et les frais, puis ajoutez le dossier de stockage (/storage), fixez les prix et annoncez l'hôte dans le tableau de bord.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "La phrase de récupération du portefeuille (hostd.yml), la base de données du portefeuille, les paramètres de l'hôte et l'état des contrats. Le perdre fait perdre l'identité du nœud et le suivi des revenus des contrats ; la phrase de récupération que vous avez notée devient alors le seul moyen de récupérer les fonds."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Les données stockées des locataires. Les perdre fait échouer les preuves de stockage et fait perdre la garantie bloquée pour ces contrats."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Les hôtes fixent leurs propres prix. Sia recommande $1 par TB stocké et par mois et plus de $5 par TB téléchargé, et 3.9 % de chaque paiement de contrat va aux détenteurs de Siafund. Les revenus augmentent avec la quantité de données de locataires qui arrivent sur le nœud, qui part de zéro et croît avec la disponibilité et le prix. La garantie (Sia suggère 2x le prix du stockage) est bloquée par contrat et restituée quand celui-ci se termine correctement.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Les gains s'accumulent dans le portefeuille Siacoin propre de l'hôte (contrôlé par la phrase de récupération). Convertissez les SC sur une plateforme d'échange et retirez de là vers votre banque ou votre carte ; il n'y a pas de demande de paiement auprès du fournisseur.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Les fonds se trouvent dans le portefeuille Sia contrôlé par la phrase de récupération, à l'intérieur du nœud. La phrase de récupération n'existe que dans le volume de données de hostd, sur la machine qui le fait tourner ; CashPilot ne l'enregistre jamais. La phrase que vous notez à la création du portefeuille est le seul moyen de récupération.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Une adresse publique stable avec les ports 9981 (TCP, consensus) et 9984 (TCP et UDP, contrats des locataires) redirigés. L'hébergement en centre de données/VPS est courant sur Sia. Le portefeuille doit contenir des Siacoin avant que le nœud puisse accepter des contrats."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "De l'espace disque et la bande passante pour le servir."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Non. Les locataires stockent des fragments de fichiers chiffrés sur votre disque et les récupèrent. D'autres personnes ne font pas passer de trafic quelconque par votre IP."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "L'adresse de votre portefeuille Sia, la clé publique de l'hôte et l'IP:port public que le nœud annonce pour que les locataires puissent le joindre."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Un trafic soutenu en envoi et en réception sur la ligne, comme pour n'importe quel serveur de stockage ; aucun trafic web anonymisé de tiers ne vous est attribué."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Sans autorisation préalable : ni inscription ni compte. La garantie est brûlée si le nœud manque des preuves de stockage, parce qu'il se déconnecte ou perd des données."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Les gains sont des Siacoin dans votre propre portefeuille : il n'y a pas de paiement vers une banque, vous vendez donc vous-même sur une plateforme d'échange."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "La garantie est bloquée par contrat et brûlée si l'hôte manque des preuves de stockage parce qu'il se déconnecte ou perd des données."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Seulement environ 30 % du stockage proposé sur le réseau est utilisé : un nouvel hôte se dispute donc une faible demande."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Les locataires stockent des fragments de fichiers chiffrés et personne ne fait passer de trafic par votre IP, mais nous n'avons pas trouvé où Sia indique qui sont les locataires ni comment ils sont contrôlés."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd est développé de façon ouverte par la Sia Foundation, depuis 2022."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd est open source sous licence MIT."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "La Sia Foundation publie hostd sous forme d'image de conteneur."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Sans autorisation préalable : ni inscription ni compte."
  source: "f1f8d4114f1e"
