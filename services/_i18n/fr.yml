proxyrack.docker.env.API_KEY.description:
  text: "Connectez-vous sur <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → l'API Key s'affiche sur la page principale du tableau de bord (enregistre automatiquement l'appareil si elle est fournie). Pas encore de compte ? Inscrivez-vous via <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
