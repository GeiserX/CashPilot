proxyrack.description:
  text: "Le programme Peer de ProxyRack vous permet de gagner de l'argent en partageant votre bande passante au sein de son réseau de proxys. Chaque appareil nécessite un UUID hexadécimal unique de 64 caractères et, en option, une clé d'API pour enregistrer automatiquement l'appareil. Fonctionne sur les connexions résidentielles comme sur les connexions VPS/centre de données. Le tableau de bord est derrière Cloudflare, ce qui peut obliger à récupérer la clé d'API manuellement dans le navigateur.\n"
