  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "Connectez-vous sur <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, appuyez sur F12 → Network, trouvez n'importe quelle requête d'API et copiez la valeur de l'en-tête <b>Api-Key</b>. Pas encore de compte ? Inscrivez-vous via <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
