  source: "be820103712e"
iproyal.cashout.notes:
  text: "Minimum $5. Sélectionnez d'abord votre pays ; les moyens de paiement en dépendent. Depuis l'Espagne (octobre 2026) : PayPal à 4 % avec des frais minimum de $0.25, payé via Tremendous, qui envoie par e-mail un lien où vous saisissez votre nom et votre adresse PayPal ; USDT (BEP20, ERC20, TRC20) ou USDC (BEP20, ERC20) avec $1 de frais de réseau ; Bitcoin avec des frais minimum de $2 ; cartes cadeaux sans frais. Le premier paiement nécessite une vérification unique de votre numéro de téléphone par SMS : Withdraw l'ouvre, et le numéro se saisit avec son indicatif pays. Chaque paiement demande ensuite un code envoyé à l'e-mail de votre compte et fait l'objet d'un examen pouvant durer jusqu'à 72 heures avant l'envoi."
