flux.description:
  text: "Flux est une infrastructure de calcul distribuée dans le monde entier. Les opérateurs de nœuds stakent des jetons FLUX et fournissent des ressources serveur. Trois niveaux : Cumulus (1,000 FLUX), Nimbus (12,500 FLUX), Stratus (40,000 FLUX). Images Docker officielles disponibles.\n"
