golem.description:
  text: "Golem Network est une place de marché de calcul décentralisée où vous partagez des ressources CPU et GPU en échange de jetons GLM. Les fournisseurs font tourner l'agent Yagna, qui gère l'exécution des charges de travail dans des environnements isolés. L'un des plus anciens projets de calcul décentralisé (fondé en 2016). Prend en charge les tâches CPU, le rendu GPU et le calcul généraliste. Paiements via Polygon L2.\n"
