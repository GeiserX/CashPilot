ionet.description:
  text: "io.net est un réseau GPU décentralisé pour les charges de travail d'IA et de ML. Il regroupe les GPU inactifs de particuliers et de centres de données. Nécessite un GPU NVIDIA avec 8GB+ de VRAM pour des gains significatifs. Les déploiements par conteneur sont pris en charge.\n"
