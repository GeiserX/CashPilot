  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "Votre adresse Pearl publique (prl1...). Pour Zano ou Ravencoin, saisissez l'adresse de cette cryptomonnaie et un pool adapté."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash pour Pearl, progpow_zano pour Zano, kawpow pour Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.earnings.notes:
  text: "Estimation brute, avant électricité. Le 2026-11-25, hashrate.no estimait environ $2.45 par jour sur Pearl pour une RTX 4070 consommant environ 142 W. Nous ne l'avons pas mesuré. Pearl est une cryptomonnaie récente, et son prix comme sa difficulté changent vite. Vérifiez la consommation de votre GPU et le prix de votre électricité pour savoir si c'est rentable."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Quand le seuil du pool est atteint"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "Le pool paie votre adresse quand votre solde atteint votre seuil. Le pool conserve le solde jusqu'à ce qu'il vous paie."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, un GPU NVIDIA et NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Cette machine signale une connexion d'hébergement. Vérifiez les conditions de votre fournisseur avant de miner. Certains fournisseurs, dont Hetzner Cloud, l'interdisent. Vérifiez vos coûts d'électricité réels avant de vous fier à une estimation de profit."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "Les 2 % de frais de mineur s'appliquent à pearlhash. SRBMiner-Multi garde 0.85 % sur progpow_zano et kawpow. HeroMiners, le pool Pearl par défaut, prélève 1 % de frais de pool. Il vérifie les paiements toutes les heures et paie à partir de 1 PRL. Les autres pools fixent leurs propres tarifs et seuils."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "calcul"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "Non. Le mineur envoie du travail au pool que vous choisissez."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Votre adresse de paiement, le nom du worker et votre adresse IP sont transmis au pool. Le premier démarrage télécharge le mineur depuis GitHub."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Certains réseaux et résolveurs DNS bloquent les connexions aux pools de minage."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "La plupart des pools vous identifient par votre adresse de paiement publique."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "Le mineur garde 2 % du temps de hachage sur Pearl et 0.85 % sur Zano et Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Certains hébergeurs interdisent le minage de cryptomonnaies."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "Le mineur est propriétaire (code source fermé) : personne en dehors de son développeur ne peut vérifier ce qu'il exécute."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "L'électricité du GPU peut coûter plus cher que les cryptomonnaies gagnées, et le prix du Pearl évolue vite."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "Le mineur envoie du travail au pool et ne relaie le trafic de personne d'autre."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Vous pouvez miner du Pearl sur HeroMiners avec une adresse publique, sans compte."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj est un réseau de stockage cloud décentralisé où vous gagnez de l'argent en louant votre espace disque inutilisé. Faites tourner le nœud de stockage via Docker et soyez payé $1.35/TB stocké par mois plus $1/TB en sortie (tarifs depuis le 1er septembre 2026). Les paiements sont mensuels en USDC, un stablecoin indexé sur le dollar américain, sur le réseau principal Ethereum, vers un portefeuille que vous contrôlez, dès que le solde dépasse un minimum lié aux frais (en jeton STORJ jusqu'au paiement de septembre 2026). Nécessite au moins 550GB d'espace disque disponible et une connexion Internet stable. Aucun compte ni inscription nécessaire -- les nœuds sont sans autorisation préalable depuis mi-2025. ATTENTION (octobre 2026) : Storj Labs s'est placé sous le régime du Chapter 11 le 26 juillet 2026 (US Bankruptcy Court, Northern District of West Virginia, affaire 5:26-bk-00512) pour restructurer une dette ancienne. Le réseau continue de fonctionner et Storj continue de payer les nœuds actifs, mais les gains des nœuds antérieurs au dépôt de la procédure sont gelés jusqu'à ce que le tribunal statue. Le jeton STORJ a perdu environ 98 % par rapport à son pic de 2021. Binance l'a retiré de sa cote le 3 septembre 2026, et Coinbase en a suspendu les échanges le 28 septembre 2026. Un nouveau nœud retient une partie de ses gains pendant ses neuf premiers mois et ne se remplit qu'au rythme de la demande des clients : en démarrer un maintenant, c'est lier un long délai de retour sur investissement à une entreprise en restructuration qui pourrait encore cesser son activité.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Nœud de stockage décentralisé - $1.35/TB stocké + $1/TB en sortie"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Adresse du portefeuille"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "E-mail"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "Adresse externe"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Espace alloué"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Dossier d'identité"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Dossier de stockage"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Adresse de portefeuille Ethereum pour les paiements en USDC (par ex. 0x1234...abcd). Doit être un portefeuille dont vous détenez les clés (MetaMask, Ledger, etc.) -- n'utilisez jamais une adresse de plateforme d'échange"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "Adresse e-mail pour les notifications à l'opérateur"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "Nom d'hôte DDNS avec le port (par ex. mynode.ddns.net:28967) -- fortement préférable à une IP en dur, qui laisse le nœud injoignable le jour où votre FAI la change sans prévenir. Le port 28967 doit être redirigé (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Espace disque maximal à allouer (par ex. 2TB). Utilisez des disques durs mécaniques (HDD), pas des SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Chemin sur l'hôte où sont stockés les fichiers d'identité (doit contenir ca.cert, ca.key, identity.cert, identity.key)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Chemin sur l'hôte, sur un disque dur mécanique (HDD), pour le stockage des données Storj. Nécessite au moins 550GB libres"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Avant le premier lancement, initialisez la configuration du nœud de stockage : docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Identité du nœud. Son ID est lié à une preuve de travail et prend des heures à régénérer, et il ne peut être recréé à partir d'aucune autre sauvegarde. La perdre fait perdre le solde de paiement retenu."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Les données clients stockées et le montant retenu du nœud. Les perdre disqualifie le nœud et fait perdre le solde retenu."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Le réseau Storj n'arrive pas à rappeler votre nœud à l'ADDRESS annoncée, donc les satellites le considèrent hors ligne : les nouvelles données n'arrivent plus, les revenus de sortie stagnent, et une indisponibilité prolongée entraîne une suspension. Vérifiez que l'ADDRESS correspond à votre IP publique ACTUELLE (utilisez un nom d'hôte DDNS, pas une IP en dur, pour qu'un changement chez le FAI ne rende pas le nœud injoignable) et que le port 28967 TCP+UDP est redirigé vers cette machine."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB stocké + $1/TB en sortie + $1/TB d'audit/réparation depuis le 1er septembre 2026. Les gains augmentent avec les données stockées et l'ancienneté du nœud. Pendant les 9 premiers mois, 75 %, puis 50 %, puis 25 % des gains sont retenus ; la moitié du montant retenu revient au 16e mois et le reste lors d'une sortie en bonne et due forme. Le port 28967 doit être redirigé."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4x les frais de transaction Ethereum, les soldes plus petits sont reportés"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Mensuelle"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Payé chaque mois en USDC sur le réseau principal Ethereum dès que le solde du portefeuille atteint au moins quatre fois les frais de transaction actuels ; les soldes plus petits sont reportés au mois suivant. En jeton STORJ jusqu'au paiement de septembre 2026. Tableau de bord sur le port 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Payé chaque mois en USDC sur le réseau principal Ethereum à l'adresse indiquée dans WALLET, dès que le solde dépasse le minimum lié aux frais. En jeton STORJ jusqu'au paiement de septembre 2026 ; les paiements sur zkSync Era ont pris fin le 1er septembre 2026."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "L'URL du tableau de bord du nœud sur le port 14002, avec l'IP locale du serveur plutôt que localhost, par exemple <b>http://192.168.1.10:14002</b>. Pour plusieurs nœuds, listez leurs URL séparées par des virgules : CashPilot les additionne."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Les nœuds Storj d'un même sous-réseau /24 se partagent l'allocation de données, ce qui réduit les gains par nœud."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps en envoi"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "De l'espace disque et la bande passante pour le servir."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Non. Vous stockez des fragments chiffrés, avec codage d'effacement, de données de clients. D'autres personnes ne font pas passer leur propre trafic par votre IP."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "L'identité du nœud, l'adresse de votre portefeuille, l'adresse e-mail que le nœud exige pour les notifications à l'opérateur, ainsi que votre IP et votre port, qui doivent être joignables pour que le nœud serve les données."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "Surtout une question de plafond de données plutôt que de responsabilité : un nœud envoie et reçoit en continu des données de clients, ce qui représente un trafic réel et soutenu sur votre ligne. Contrairement à un proxy ou à un relais, en revanche, ce n'est pas du trafic anonymisé de tiers qui vous est attribué comme s'il venait de vous : il n'attire donc pas les plaintes pour abus que ceux-ci attirent."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Nœuds illimités, mais les nœuds d'un même sous-réseau /24 se partagent l'allocation : plusieurs nœuds sur une même connexion gagnent donc moins chacun."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk a rapporté le 27 juillet 2026 que Storj Labs s'était placé sous la protection du Chapter 11 de la loi sur les faillites."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Les paiements aux opérateurs de nœuds antérieurs au dépôt de la procédure sont passés dans le processus de déclaration des créances."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "Un nouveau nœud voit 75 %, puis 50 %, puis 25 % de ses gains retenus pendant ses neuf premiers mois ; la moitié revient au 16e mois et le reste seulement lors d'une sortie en bonne et due forme."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Les clients stockent des fragments de fichiers chiffrés et personne ne fait passer de trafic par votre IP, mais nous n'avons pas trouvé où Storj indique qui sont les clients ni comment ils sont contrôlés."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "Le logiciel du nœud de stockage est open source sous AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj publie sa propre image Docker, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Pas de compte : une adresse de portefeuille et un e-mail pour les notifications à l'opérateur."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Les nœuds actifs ont continué à être payés après le dépôt de la procédure."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR est un pool de minage Monero sans compte : votre mineur se connecte avec votre adresse Monero comme nom d'utilisateur, et le pool paie cette adresse. CashPilot ne fait pas tourner de mineur ici. Il lit le solde que SupportXMR conserve pour votre adresse, pour que vous voyiez ce que votre mineur CPU a gagné à côté de vos autres revenus. Le solde est gagné mais pas encore reçu : le pool le paie dès qu'il dépasse votre seuil de paiement.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Pool de minage Monero, suivi par votre adresse de paiement"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (automatique), 0.01 XMR sur demande"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Quand votre solde dépasse votre seuil, ou sur demande"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR paie votre adresse dès que le solde atteint votre seuil (0.1 XMR par défaut). Sur son site, vous pouvez aussi demander un paiement immédiat à partir de 0.01 XMR, pour des frais de 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Le solde est gagné mais pas reçu tant que SupportXMR ne l'a pas payé à cette adresse. Les soldes Monero ne peuvent pas être lus on-chain sans clé de visualisation privée, que CashPilot ne demande jamais : vous confirmez donc vous-même chaque paiement."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Votre adresse de paiement Monero : le nom d'utilisateur que votre mineur utilise sur SupportXMR, sans aucune partie <b>.workername</b> ou <b>+difficulty</b>. Elle est publique et ne donne accès à aucun fonds."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Nécessite un mineur Monero (XMRig) dirigé vers pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "calcul"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Non. Votre mineur envoie des hashs au pool ; personne ne fait passer de trafic par votre connexion."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Votre adresse Monero, les noms de worker que vous choisissez, votre hashrate et l'adresse IP de votre mineur telle que le pool la voit."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Un mineur garde une seule connexion ouverte vers le pool et utilise peu de bande passante. Le coût à surveiller est l'électricité, pas votre FAI."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Il n'y a pas de compte. L'adresse sert d'identité, et tout le monde peut consulter ses statistiques sur supportxmr.com."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Payé uniquement en Monero, avec 0.6 % de frais de pool et un seuil par défaut de 0.1 XMR avant un paiement automatique."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot ne fait pas tourner de mineur pour SupportXMR : vous dirigez votre propre mineur vers le pool, et CashPilot se contente de lire le solde."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol donne aux agents d'IA un accès au web en direct grâce à un réseau de Beacons. Le Teneo Beacon est l'app de Teneo pour Android, iOS, macOS, Windows et Linux, avec une version en ligne de commande pour les serveurs et le Raspberry Pi. Il partage votre bande passante inutilisée une fois que vous avez accepté son écran de consentement, et gagne des Teneo Protocol Points et des Fragments tant qu'il est en ligne. Les Fragments comptent pour des tirages saisonniers payés en USDC (le Beacon Drop). Teneo indique que le Beacon gagne deux fois plus de points que son ancienne extension de navigateur. Un seul Beacon gagne par connexion Internet. Les autres appareils sur la même connexion restent en attente. Inscrivez-vous dans l'Expedition Hub avec le lien de parrainage ou le code PSA3BHPJ, puis connectez-vous au Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "App de bande passante DePIN (Beacon) - des Fragments pour des tirages USDC saisonniers, +100 Fragments avec un lien de parrainage"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Gagne des Teneo Points et des Fragments. Les Fragments comptent pour des tirages USDC saisonniers : une saison paie donc un lot, pas un tarif. Teneo indique que le Beacon gagne deux fois plus de points que l'extension de navigateur. Réclamez le boost toutes les 8 heures pour obtenir jusqu'à 3x plus de Fragments ; une fenêtre manquée réduit le multiplicateur."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Tirage saisonnier (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Les lots du Beacon Drop sont payés en USDC sur un portefeuille que vous associez dans l'Expedition Hub. Le Hub indique combien de jours il vous reste pour en associer un ; un lot sans portefeuille associé à temps est perdu."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Associez un portefeuille dans l'Expedition Hub avant le paiement des lots d'une saison ; le Hub annule un lot dont le portefeuille n'est pas associé à temps."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8 % des Fragments de chaque ami parrainé et 2 % des Fragments de ses propres filleuls, une fois que l'ami s'est inscrit dans les 7 jours et a gagné 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments à l'inscription, et +150 de plus une fois 480 Fragments atteints"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "Un seul Beacon gagne par connexion Internet. Les machines en centre de données ne gagnent que chez les hébergeurs que Teneo a activés, avec moitié moins de Fragments et sans points ni bonus de parrainage. Les connexions VPN ne gagnent jamais."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Les Fragments du Beacon ne rapportent des USDC que sous forme de lots lors de tirages saisonniers : le faire tourner ne rapporte donc pas un montant fixe."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo indique que les points seront regroupés dans $AGENTIC, un jeton de récompense non transférable, et non dans le jeton $TENEO."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "Aucune date de lancement, allocation ni procédure de réclamation de $TENEO n'avait été confirmée en novembre 2026, alors qu'un objectif antérieur fixé au deuxième trimestre 2026 était passé."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot ne fait pas tourner Teneo : vous installez l'app Beacon du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo indique que le trafic provient de clients professionnels vérifiés et bloque les adresses privées et les ports propices aux abus, mais ne dit pas comment il vérifie ces clients."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network est un réseau décentralisé bien établi de diffusion vidéo et de calcul pour l'IA (depuis 2018). Les utilisateurs font tourner des Edge Nodes qui partagent de la bande passante, du stockage et de la puissance de calcul. Partenariats de contenu majeurs. Gagne des jetons TFUEL.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "CDN décentralisé + calcul pour l'IA - récompenses en TFUEL, projet établi"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "App de bureau uniquement. Les gains dépendent des ressources et de l'emplacement. Partenariats majeurs, coté sur toutes les plateformes d'échange."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "En continu"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Pas encore déterminé : CashPilot n'a pas encore vérifié où ce service conserve vos gains."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot ne fait pas tourner Theta Edge : vous utilisez l'app de bureau du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "893de938ed14"
titan.description:
  text: "Titan Network est une plateforme DePIN qui partage votre adresse IP, votre stockage et votre bande passante en échange de récompenses en jeton TNT. Disponible sur Windows, Mac et Android. Les nœuds contribuent à un CDN et à une couche de stockage décentralisés. Les gains habituels vont de $5-30/mois selon les ressources partagées et l'emplacement géographique.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN partageant IP, stockage, bande passante - $5-30/mois"
  source: "799e68401067"
titan.earnings.notes:
  text: "Partage l'IP, le stockage et la bande passante. Les gains dépendent des ressources fournies et de la région. Allouer plus de stockage rapporte plus de récompenses."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Par époque"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Pas encore déterminé : CashPilot n'a pas encore vérifié où ce service conserve vos gains."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "L'aide de Titan indique elle-même qu'un nœud en marche ne garantit pas de gains : sans tâche assignée, il ne gagne rien, et les récompenses sont en jeton TNT."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot ne fait pas tourner Titan : vous utilisez l'app ou l'extension du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer vous permet de monétiser votre trafic Internet en partageant votre bande passante avec des entreprises vérifiées. L'un des rares services de partage de bande passante qui fonctionne bien sur les IP de VPS et de centre de données en plus des connexions résidentielles. Utilise une authentification simple par jeton, passée en argument de ligne de commande. Prend en charge les architectures ARM pour le Raspberry Pi et les appareils similaires.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Partage de bande passante - fonctionne sur VPS, authentification par jeton"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Jeton"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Nom de l'appareil"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Connectez-vous sur <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, appuyez sur F12 → Application → Local Storage → cliquez sur <code>https://app.traffmonetizer.io</code> → copiez la valeur <code>authToken</code> (environ 54 caractères : des chiffres, un <code>|</code>, puis des lettres et des chiffres)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Nom affiché dans le tableau de bord pour gérer l'appareil"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "Les IP de VPS et de centre de données gagnent moins que les IP résidentielles. Les emplacements aux États-Unis et dans l'UE gagnent plus. Plusieurs IP prises en charge via les réseaux Docker."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Minimum $10. PayPal n'est plus proposé. Enregistrez d'abord un moyen de paiement dans le profil : USDT sur Solana ou TON (frais les plus bas), Arbitrum (frais bas) ou Tron TRC20 (frais de réseau élevés), ou un virement bancaire dès $1,000. La première adresse enregistrée s'applique immédiatement ; la modifier ensuite demande une confirmation par e-mail. Le tableau de bord peut demander un contact de messagerie (WhatsApp, Telegram ou Skype) avant le premier retrait. Une demande paie des dollars entiers et les centimes restent sur le solde."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT sur la chaîne enregistrée dans les paramètres de paiement du profil (Solana, TON, Arbitrum ou Tron), ou virement bancaire. L'adresse se trouve dans les paramètres de Traffmonetizer, pas dans le conteneur."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Connectez-vous sur <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, appuyez sur F12 → Application → Local Storage → valeur <b>authToken</b> (environ 54 caractères : des chiffres, un <code>|</code>, puis des lettres et des chiffres)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10 % de chaque paiement qu'ils demandent"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Les conditions d'utilisation de Traffmonetizer exigent une IP résidentielle, mais les nœuds VPS sont acceptés en pratique."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot lui donne 1.9 ; des avis de 2023 à novembre 2026 signalent des paiements en attente pendant des semaines, ou marqués comme effectués sans transaction correspondante."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Les mêmes utilisateurs signalent que le chat en direct et le support par e-mail ne répondent pas, parfois pendant des semaines."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Uniquement la crypto ou un virement bancaire dès $1,000 ; PayPal a disparu, et une demande ne paie que des dollars entiers."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Les conditions de Traffmonetizer exigent une IP résidentielle : un serveur sur une connexion d'hébergement sort donc de leur cadre."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Quatre avis Trustpilot de 2023 à 2025 signalent des gains très lents, comme un centime par jour sur quatre appareils, ou près de deux ans pour atteindre $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Un paiement ne demande qu'une adresse crypto enregistrée et confirmée par e-mail ; le tableau de bord peut demander un contact de messagerie."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer publie sa propre image Docker, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Minez avec votre CPU et soyez payé dans la cryptomonnaie de votre choix, comme SHIB, DOGE ou XMR. CashPilot fait tourner XMRig sur le pool RandomX d'unMineable, et unMineable convertit le Monero que votre CPU mine dans votre cryptomonnaie. Il paie votre adresse publique dès que votre solde atteint le seuil de paiement de la cryptomonnaie. Chaque worker que CashPilot déploie porte le code de parrainage unMineable de CashPilot, qui réduit vos frais de plateforme de 1 % à 0.75 %. L'électricité peut coûter plus cher que ce que vous gagnez."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Minez avec votre CPU et soyez payé dans la cryptomonnaie de votre choix"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "Cryptomonnaie de paiement"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "Adresse de paiement"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "Nom du worker"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "Threads CPU max. (%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "Mode RandomX"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "Ticker d'une cryptomonnaie que paie unMineable, comme SHIB, DOGE ou XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "Votre adresse publique pour cette cryptomonnaie. Les cryptomonnaies qui nécessitent un mémo ou un tag ne sont pas prises en charge."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Estimation brute, avant électricité, payée dans votre cryptomonnaie au taux de conversion d'unMineable. Le 2026-11-25, 1 kH/s de RandomX valait environ $1 par mois. Un CPU de bureau à la moitié de ses threads peut consommer 30 à 50 W de plus. Vérifiez votre consommation réelle et le prix de votre électricité pour savoir si c'est rentable."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "Fixé par unMineable pour chaque cryptomonnaie (0.03 XMR le 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Quand le seuil de paiement de la cryptomonnaie est atteint"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable paie votre adresse dès que votre solde atteint le seuil de paiement de la cryptomonnaie. Les seuils varient selon la cryptomonnaie et le réseau ; CashPilot lit celui qu'unMineable indique pour votre adresse."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Le solde est gagné mais pas reçu tant qu'unMineable ne l'a pas payé à cette adresse. La chaîne dépend de la cryptomonnaie choisie."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "La même adresse de paiement et le même ticker de cryptomonnaie qu'au déploiement du mineur, par exemple <b>XMR</b>. Saisissez l'adresse seule, sans la cryptomonnaie, le nom du worker ni le code de parrainage. Elle est publique et ne donne accès à aucun fonds."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25 % des récompenses de minage de chaque mineur parrainé"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Frais de plateforme réduits de 1 % à 0.75 %"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Cette machine signale une connexion d'hébergement. Vérifiez les conditions de votre fournisseur avant de miner. Certains fournisseurs, dont Hetzner Cloud, l'interdisent. Vérifiez vos coûts d'électricité réels avant de vous fier à une estimation de profit."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable prélève 1 % de frais de plateforme. CashPilot ajoute son code de parrainage (#awk6-j1z0) après chaque nom de worker, ce qui réduit vos frais à 0.75 %. unMineable verse ensuite au mainteneur de CashPilot 0.25 % de vos récompenses de minage ; vous gardez 99.25 %. Chaque cryptomonnaie a son propre seuil de paiement, par exemple 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "calcul"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "Non. Le mineur envoie du travail au pool d'unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "Votre adresse de paiement, la cryptomonnaie, le nom du worker, le hashrate et l'adresse IP sont transmis à unMineable."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "Certains réseaux et résolveurs DNS bloquent les connexions aux pools de minage."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "Aucun compte n'est nécessaire. L'adresse et la cryptomonnaie servent d'identité, et tout le monde peut consulter leurs statistiques sur unmineable.com."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "unMineable garde 0.75 % de frais de plateforme avec le code de parrainage et ne paie qu'à partir du seuil de chaque cryptomonnaie."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "Certains hébergeurs interdisent le minage de cryptomonnaies."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "L'électricité supplémentaire peut coûter plus cher que les cryptomonnaies gagnées."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "Les statistiques de l'adresse, solde compris, sont visibles par toute personne qui connaît l'adresse."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "Le mineur envoie des hashs au pool et ne relaie le trafic de personne d'autre."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Vous pouvez miner vers une adresse publique dans la cryptomonnaie de votre choix sans créer de compte."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock est une plateforme DePIN (réseau d'infrastructure physique décentralisé) qui vous permet de gagner des cryptomonnaies en partageant votre connexion Internet. Fait partie de l'écosystème Web3 au sens large. Des images Docker communautaires existent, mais pas d'image officielle. L'extension de navigateur est l'interface principale.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "Partage de connexion Internet DePIN - paiement en crypto, extension de navigateur principalement"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Gains en crypto/jetons. Pas d'image Docker officielle — l'extension de navigateur est le client principal."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
uprock.cashout.notes:
  text: "Jetons UPT, retirés vers un portefeuille Solana à partir de 250 UPT, avec l'authentification à deux facteurs activée. Des frais de retrait s'appliquent."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Pas encore déterminé : CashPilot n'a pas encore vérifié où ce service conserve vos gains."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "Le centre d'aide d'UpRock indique que les retraits se font en jetons UPT vers un portefeuille Solana, avec un minimum de 250 UPT."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "Les récompenses sont des jetons UPT ; des utilisateurs et un avis indépendant estiment que leur valeur est très faible."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot ne fait pas tourner UpRock : vous utilisez l'app ou l'extension du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork est un réseau décentralisé de VPN et de partage de bande passante. Vous gagnez de l'argent en fournissant de la bande passante en tant que fournisseur communautaire. Le binaire du fournisseur s'authentifie lui-même avec l'e-mail et le mot de passe de votre compte (sa sous-commande auth-provide) et enregistre le JWT de session obtenu dans le volume de données. Image Docker officielle de BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "VPN/bande passante décentralisés - authentification par e-mail et mot de passe, session JWT dans le volume"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "E-mail"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Mot de passe"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "L'e-mail de votre compte URnetwork (l'identifiant que vous utilisez sur <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Les comptes créés via une connexion Google/Apple doivent d'abord définir un mot de passe. Pas encore de compte ? Inscrivez-vous via <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "Le mot de passe de votre compte URnetwork (sans espace). Utilisé par la connexion auth-provide du fournisseur ; la session est ensuite conservée dans le volume de données."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Fonctionne sur VPS et en résidentiel. Payé en SN25α (sous-réseau 25 de Bittensor) par époque hebdomadaire depuis le 2026-10-06. Prend en charge le mode proxy pour les configurations multi-IP."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "Par époque"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Définissez une coldkey Bittensor sur ur.io/app/account/earnings (signée avec Talisman, TAO.com ou un portefeuille WalletConnect), puis réclamez chaque époque finalisée. Une réclamation paie le gas en TAO depuis une clé de gas EVM. LES ÉPOQUES NON RÉCLAMÉES EXPIRENT, et les anciens paiements en USDC ont été annulés quand aucun portefeuille n'avait été associé dans les 30 jours."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB par jour de données UR gratuites par ami, jusqu'à 20 amis (des données, pas de l'argent)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB par jour de données UR gratuites dès que vous utilisez au moins 10 MiB via l'app sur 2 jours dans les 90 jours suivant votre inscription ; sinon, le parrainage prend fin"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Les époques non réclamées expirent, et les anciens paiements en USDC ont été annulés pour les réseaux sans portefeuille associé dans les 30 jours."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "Depuis octobre 2026, les récompenses sont payées en SN25α, un jeton de sous-réseau Bittensor, et chaque réclamation coûte du gas en TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork s'appelait auparavant BringYour ; son livre blanc archivé porte l'ancien nom."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork publie le code source de son client fournisseur."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork publie sa propre image Docker, bringyour/community-provider, et fonctionne sur les connexions VPS et résidentielles."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Une réclamation ne demande qu'un portefeuille Bittensor que vous contrôlez."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai est une place de marché de cloud GPU où vous louez votre GPU NVIDIA à des chercheurs et développeurs en IA/ML. Plateforme native Docker où vous fixez vos propres prix horaires. Une RTX 3090 gagne en général $0.20-0.40/h quand elle est louée. Nécessite un GPU NVIDIA avec des pilotes récents et une connexion Internet stable. Les revenus dépendent fortement du modèle de GPU, de la stratégie de prix et de la demande du marché.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "Place de marché de GPU - fixez vos propres prix, RTX 3090 ~$0.20-0.40/h"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "Clé d'API"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "Clé d'API d'hôte Vast.ai, issue du tableau de bord"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/h, RTX 4090 ~$0.40-0.80/h en location. Le taux d'utilisation varie. Nécessite un GPU NVIDIA, un hôte Linux, Docker et nvidia-container-toolkit. Fixez vos propres prix."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Hebdomadaire (le vendredi)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "Les gains s'accumulent sur le solde Vast.ai. Retirez via Wise, PayPal ou Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Pas encore déterminé : CashPilot n'a pas encore vérifié où ce service conserve vos gains."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3 % des dépenses des locataires parrainés, pendant toute la durée de vie de leur compte, sous forme de crédits de parrainage ; jusqu'à 75 % peuvent être retirés depuis un compte de parrainage dédié"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Un hôte ne gagne que pendant la location, et les chiffres de Vast pour un GPU grand public dépendent du type de location et du score de fiabilité."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot ne fait pas tourner Vast.ai : vous installez le logiciel d'hôte de Vast sur votre propre machine GPU, donc CashPilot ne peut ni le déployer ni le mettre à jour pour vous. Vast construit l'hébergement autour de Docker sur un hôte Linux."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Vast indique que le tarif fixé par un hôte est celui qu'il reçoit, sans frais déduits."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "Les paiements se font par Wise, PayPal ou Stripe à partir d'un minimum de $20, facturés chaque semaine ; un solde plus petit est reporté à la semaine suivante."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter est une plateforme de partage de bande passante disponible sur Windows, Mac, Linux et Android. Elle affirme payer jusqu'à $1/GB de bande passante partagée, avec un seuil de paiement minimum de $20. La plateforme fonctionne comme les apps classiques de partage de bande passante, en faisant passer du trafic légitime par des connexions résidentielles.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Partage de bande passante - annonce jusqu'à $1/GB, paiement min. $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Annonce jusqu'à $1/GB, mais les gains réels sont plus faibles. Paiement minimum $20. Les gains varient fortement selon l'emplacement et la demande."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter n'a pas de tableau de bord web. Ouvrez l'app Wipter sur ordinateur ou téléphone, connectez-vous, et demandez-y le paiement dès que le solde atteint $20. Wipter paie uniquement en USDT sur BNB Smart Chain (BEP20), sur le portefeuille défini dans la section Payments de l'app ; il n'y a pas d'option PayPal."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Pas encore déterminé : CashPilot n'a pas encore vérifié où ce service conserve vos gains."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10 % de leurs gains de trafic une fois qu'ils atteignent le paiement minimum, pour autant d'amis que vous en parrainez"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "Bonus d'inscription de $5"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot ne fait pas tourner Wipter : vous utilisez l'app de bureau ou de téléphone du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "fa32942c6b4f"
xmrig.description:
  text: "Minez du Monero avec votre CPU. CashPilot fait tourner XMRig, et le pool que vous choisissez paie des Monero sur votre adresse de paiement publique. XMRig utilise 1 % du temps de hachage pour soutenir ses développeurs. L'électricité peut coûter plus cher que les XMR que vous gagnez."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "Minez du Monero avec votre CPU et le pool de votre choix"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Adresse Monero"
  source: "a888ebb3ae9b"
xmrig.docker.env.POOL_URL.label:
  text: "Pool"
  source: "f13024272c38"
xmrig.docker.env.WORKER_NAME.label:
  text: "Nom du worker"
  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "Threads CPU max. (%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "Mode RandomX"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "Estimation brute, avant électricité. Le 2026-11-25, 1 kH/s valait environ $1 par mois au prix du XMR et à la difficulté du réseau observés. Un CPU de bureau à la moitié de ses threads peut consommer 30 à 50 W de plus. Vérifiez votre consommation réelle et le prix de votre électricité pour savoir si c'est rentable."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, après l'avoir abaissé)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Quand le seuil du pool est atteint"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "Le pool paie votre adresse Monero quand votre solde atteint votre seuil. Le pool conserve le solde jusqu'à ce qu'il vous paie."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Cette machine signale une connexion d'hébergement. Vérifiez les conditions de votre fournisseur avant de miner. Certains fournisseurs, dont Hetzner Cloud, l'interdisent. Vérifiez vos coûts d'électricité réels avant de vous fier à une estimation de profit."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "MoneroOcean, le pool par défaut, prélève 0 % de frais de minage. Le seuil de paiement par défaut est de 0.3 XMR, et vous pouvez l'abaisser à 0.003 XMR. Les paiements inférieurs à 4 XMR peuvent coûter jusqu'à 0.0004 XMR. Les autres pools fixent leurs propres tarifs et seuils."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "calcul"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "Non. Le mineur envoie du travail aux pools de minage."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Votre adresse Monero, le nom du worker et votre adresse IP sont transmis au pool."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "Certains réseaux et résolveurs DNS bloquent les connexions aux pools de minage."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "La plupart des pools Monero vous identifient par votre adresse de paiement publique."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Un paiement nécessite assez de XMR pour atteindre le seuil de votre pool."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "Certains hébergeurs interdisent le minage de cryptomonnaies."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "L'électricité supplémentaire peut coûter plus cher que les XMR gagnés."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "Le mineur envoie des hashs aux pools et ne relaie le trafic de personne d'autre."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "Le mineur est open source et l'image épingle une version amont signée."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Vous pouvez miner avec une adresse Monero publique sans vous identifier par votre nom."
  source: "752cbb728aac"
