  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm vous paie pour partager votre bande passante Internet. Le collecteur de gains s'authentifie par e-mail et mot de passe via Supabase. Image Docker légère au déploiement simple (le client Docker utilise un jeton UUID distinct).\n"
