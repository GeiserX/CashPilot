# French translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/fr.yml --restamp '<key>'
2miners-etc.description:
  text: "Suivez le solde Ethereum Classic non payé que 2Miners conserve pour votre adresse de paiement ETC publique. Faites tourner votre propre mineur et dirigez-le vers le pool. CashPilot lit le solde et vous demande de confirmer les paiements quand le solde baisse.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Pool de minage Ethereum Classic, suivi par votre adresse de paiement"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (réglable)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "Le pool vérifie votre seuil de paiement toutes les deux heures"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners paie automatiquement votre adresse dès que vous atteignez le seuil choisi. Le seuil le plus bas pour les paiements ETC est de 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Le solde non payé s'accumule chez 2Miners. Le solde du portefeuille est une lecture distincte sur Ethereum Classic. Vérifiez dans votre portefeuille le montant reçu avant de confirmer un paiement dans CashPilot.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Saisissez l'adresse de paiement Ethereum Classic publique que votre mineur utilise sur 2Miners, qui commence par <b>0x</b>. N'ajoutez aucun nom de worker.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Nécessite un mineur ETCHash dirigé vers 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "calcul"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Non. Votre mineur envoie du travail de minage au pool."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "Le pool utilise votre adresse de paiement, les noms de worker que vous choisissez et l'adresse IP de votre mineur."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Tout le monde peut consulter les statistiques d'une adresse de paiement. Pour modifier le seuil, le pool demande de confirmer l'IP d'un worker."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "Le pool prélève 1 % de frais et retient les paiements jusqu'à ce que votre seuil soit atteint."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (anciennement ATOR) est un réseau décentralisé de confidentialité par routage en oignon. Les opérateurs de nœuds font tourner des relais et gagnent des jetons ANYONE pour la bande passante fournie. Imaginez « un Tor rémunéré ». CashPilot le fait tourner depuis sa propre image, construite à partir du paquet Debian signé du projet, pour amd64 et arm64. La configuration se fait par fichier, via un fichier anonrc monté dans le conteneur (Nickname, ContactInfo, ORPort, etc.). Un relais ne gagne rien tant que 100 ANYONE ne sont pas bloqués pour lui pendant au moins 180 jours, et les récompenses se réclament en signant dans votre portefeuille. Le relais inscrit aussi votre IP publique dans l'annuaire des relais du réseau, ce qui peut nuire à la réputation d'IP pour laquelle les apps de bande passante résidentielle paient.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Routage en oignon décentralisé - nœuds relais Tor rémunérés"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Clé d'identité ed25519 du relais. La détruire met fin à la réputation du relais et remet son historique de gains à zéro."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Ne paie que si 100 ANYONE sont bloqués par relais pendant au moins 180 jours et qu'une réclamation de récompense est signée dans votre portefeuille. Sans cette mise, un relais ne gagne rien. Avec elle, les gains dépendent de la bande passante fournie et du temps de disponibilité."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Par époque"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "À définir comme ContactInfo dans anonrc, avec le préfixe '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Empreintes des relais, séparées par des virgules. Celle-ci ne figure pas dans un tableau de bord web : exécutez <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> sur l'hôte qui fait tourner le relais.\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "De la bande passante, en tant que relais du réseau Anyone (un fork de Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Oui. Il relaie le trafic d'autres personnes. Votre IP est le dernier saut ou non selon que le relais est configuré comme sortie ou pas."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "La clé d'identité publique du relais, votre IP et votre port, ainsi que les statistiques de disponibilité, tous publiés dans l'annuaire du réseau par conception. Si vous définissez ContactInfo dans votre anonrc, cette valeur y est aussi publiée et indexée publiquement de façon permanente. Il s'agit en général d'une adresse e-mail : laissez-la vide, sauf si vous voulez qu'elle soit publique."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Réel. Le trafic du relais est attribué à votre connexion. Les relais de sortie, en particulier, attirent les plaintes pour abus ; beaucoup de FAI grand public les interdisent."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Il n'y a aucun compte à créer, donc rien à limiter par compte. Pour gagner, il vous faut quand même un portefeuille Ethereum avec 100 ANYONE bloqués pour chaque relais pendant au moins 180 jours, et CashPilot a besoin des empreintes des relais pour lire les récompenses. Le projet ne publie pas de limite de relais par IP, et le catalogue n'en déclare pas."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Un relais ne gagne rien tant que 100 ANYONE ne sont pas bloqués pour lui pendant au moins 180 jours, et chaque réclamation de récompense se signe dans votre portefeuille."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Par conception, il relaie le trafic d'autres personnes, sans aucun contrôle de leur identité ; les relais de sortie attirent les plaintes pour abus."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "L'identité, l'IP et la disponibilité du relais sont publiées dans l'annuaire du réseau, et toute valeur ContactInfo que vous définissez reste publique définitivement."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Il n'y a aucun compte à créer. Un relais n'a besoin que d'un portefeuille, sans vérification d'identité."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "Le logiciel du relais est un fork publié de Tor, sous la licence de Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot construit sa propre image à partir du logiciel de relais publié par Anyone, qui ne nécessite aucun compte."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping est une plateforme décentralisée de surveillance réseau qui vous paie pour faire tourner un nœud. Votre nœud surveille des sites web, mesure la latence et vérifie la qualité du réseau pour les clients de Bitping. Fonctionne sur les connexions résidentielles comme sur les VPS. L'image Docker se connecte avec les variables d'environnement BITPING_EMAIL et BITPING_PASSWORD au premier démarrage (« Attempting login with environment variables » dans son propre journal), puis conserve la session dans le volume monté pour que les redémarrages ne demandent pas de nouvelle authentification.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Partage de bande passante - surveillance réseau décentralisée, fonctionne sur VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "E-mail"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Mot de passe"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "L'e-mail de votre compte Bitping (même identifiant que sur <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Le mot de passe de votre compte Bitping. Utilisé une seule fois pour créer la session du nœud, qui est ensuite conservée dans le volume de données."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Les gains dépendent de la qualité du réseau et de la demande de surveillance depuis votre emplacement. Les nœuds VPS sont acceptés."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Les gains des nœuds se trouvent sur nodes.bitping.com ; app.bitping.com est le tableau de bord des clients de l'API. Les retraits se font uniquement en SOL : dès que le solde non payé dépasse $0.05, saisissez l'adresse Solana dans la demande, traitée sous 24 heures. Un portefeuille Solana neuf ou vide doit d'abord contenir environ 0.001 SOL, pour le minimum de rente du réseau."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Uniquement Solana désormais, et l'adresse se saisit AU MOMENT DU RETRAIT au lieu d'être enregistrée."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Utilisez l'e-mail et le mot de passe de votre compte Bitping (les mêmes que sur <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Retirez votre solde Bitping"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping peut confisquer les gains non réclamés depuis plus de 12 mois, après un préavis de 30 jours par e-mail."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Demandez un retrait en SOL sur nodes.bitping.com et saisissez votre adresse Solana dans la demande."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Les retraits sont payés en Solana (SOL), à une adresse que vous saisissez dans chaque demande."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "L'aide de Bitping indique qu'un retrait vers un portefeuille Solana neuf et vide peut échouer tant que vous n'y avez pas versé vous-même un peu de SOL."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "L'aide de Bitping indique que les serveurs et les conteneurs Docker sont pris en charge."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Un retrait ne demande qu'une adresse Solana saisie dans la demande."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit est un service de partage de bande passante qui paie via PayPal et Stripe. Pas d'image Docker officielle ; les clients sont l'app de bureau Windows et l'app Android. Le service se trouve sur bytebenefit.io -- l'ancien domaine bytebenefit.com a été abandonné et est parqué sur une place de marché, c'est pourquoi il avait été marqué comme mort ici.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Partage de bande passante - paiements PayPal/Stripe, app de bureau/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Aucune image Docker disponible. Uniquement les apps de bureau Windows et Android."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Pas encore déterminé : CashPilot n'a pas encore vérifié où ce service conserve vos gains."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20 % des gains issus du trafic des filleuls"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "Bonus de bienvenue de $1 (10,000 Coins)"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "La fiche Google Play de l'app indique que votre trafic sert aux requêtes de veille web des clients d'Infatica, sans dire qui ils sont ni comment ils sont contrôlés."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "L'app Android a quitté Google Play en avril 2026, après 17 mois."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot ne fait pas tourner ByteBenefit : vous utilisez l'app du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir vous permet de gagner des revenus passifs en partageant la bande passante Internet que vous n'utilisez pas. Prend en charge Windows et Android uniquement — la FAQ officielle indique qu'aucun client Linux ou Docker n'est prévu, iOS n'est pas pris en charge et macOS n'est pas proposé. Les gains dépendent fortement de l'emplacement. Tableau de bord web sur dash.bytelixir.com pour le suivi. Aucune image Docker disponible.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Partage de bande passante - Windows + Android uniquement"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Cookie de session"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Cookie Remember Web"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "Jeton XSRF"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Connectez-vous sur <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, appuyez sur F12 → Application → dépliez <b>Cookies</b> dans la barre latérale gauche → cliquez sur le sous-élément <code>https://dash.bytelixir.com</code> → dans la liste des cookies à droite, trouvez <code>bytelixir_session</code> → copiez sa valeur (Value, un long JWT qui commence par eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Même emplacement (Cookies → <code>https://dash.bytelixir.com</code>) → trouvez le cookie nommé <code>remember_web_...</code> → copiez sa valeur (Value) (facultatif, prolonge la durée de la session)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Même emplacement → trouvez <code>XSRF-TOKEN</code> → copiez sa valeur (Value) (facultatif)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Les gains varient selon l'emplacement ($2-50/mois). Pas d'image Docker. L'app de bureau ou l'app Android est nécessaire."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Crypto uniquement. Le minimum dépend de la cryptomonnaie : USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Vous saisissez l'adresse dans chaque demande. Les demandes sont traitées aux heures ouvrées, sous 24 heures."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Solde conservé par Bytelixir ; l'adresse du portefeuille se saisit dans chaque demande de paiement et n'est jamais enregistrée dans le conteneur."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Connectez-vous sur <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>en cochant Remember Me</b>, appuyez sur F12 → Application → dépliez <b>Cookies</b> dans la barre latérale gauche → cliquez sur <code>https://dash.bytelixir.com</code>, puis copiez trois valeurs : <b>bytelixir_session</b>, <b>remember_web_…</b> (la longue valeur qui commence par ce préfixe) et <b>XSRF-TOKEN</b>. Le cookie de session seul expire environ deux heures après sa copie, et la collecte s'arrête donc l'après-midi même ; le cookie remember_web dure un an et c'est lui qui maintient le fonctionnement."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50 % de leur profit à vie"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "Bonus de bienvenue de $1"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Crypto uniquement, et le minimum dépend de la cryptomonnaie, de $5 pour l'USDT à $250 pour le Bitcoin."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot ne fait pas tourner Bytelixir : vous utilisez l'app du fournisseur, donc CashPilot ne peut ni la déployer ni la mettre à jour pour vous. Ses conditions n'ont pas été vérifiées pour les conteneurs."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Trustpilot lui donne 4.6 sur 283 avis, dont la plupart saluent les paiements en crypto ; quelques-uns signalent des paiements jamais reçus."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Un paiement ne demande qu'une adresse crypto saisie dans la demande."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai est une place de marché de GPU de pair à pair. Vous proposez une machine Linux avec des GPU NVIDIA, fixez vos propres prix spot et à la demande, et les locataires y font tourner leurs propres conteneurs Docker. Vous n'êtes payé que pour les minutes de location, en CLORE, BTC, USDT ou USDC. L'hébergement nécessite une machine x86_64 sous Ubuntu 22.04 ou plus récent (ou HiveOS), un pilote NVIDIA fonctionnel et au moins 100 Mbps en envoi comme en réception. Les GPU AMD ne sont pas pris en charge.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "Place de marché de GPU - louez vos GPU NVIDIA, payé en CLORE, BTC ou stablecoins USD"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Payé uniquement pour les minutes louées, au prix que vous fixez. Le haut de la fourchette, $490, est le plafond donné par Clore pour une RTX 4090 proposée à la minute ('up to ~$490/month') ; les cartes plus modestes gagnent moins et une carte inactive ne gagne rien. Clore garde 5 % (à la demande) ou 1.25 % (spot) de chaque location, plus 15 % quand le locataire paie en BTC, USDT ou USDC au lieu de CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Sur demande"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Retirez depuis Account > Billing vers votre propre portefeuille : CLORE (ERC-20, minimum 200, frais d'environ $0.50), BTC (minimum 0.0001, frais de 0.00005 BTC) ou USDT/USDC sur Ethereum ou BNB Chain (minimum $10, frais de $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore conserve le solde (CLORE, BTC et un solde en USD pour USDT/USDC) jusqu'à ce que vous retiriez. La chaîne se choisit à chaque retrait : Ethereum pour CLORE, Bitcoin pour BTC, Ethereum ou BNB Chain pour USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15 % (niveau standard) des frais de plateforme payés par les hébergeurs et les locataires que vous parrainez, sur chaque location ; le code n'expire jamais ; payé dans la devise de la location (CLORE, BTC ou USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps en envoi et en réception"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "Du temps de calcul GPU sur votre machine."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Oui. Les locataires font tourner leurs propres conteneurs Docker sur votre machine, et leur trafic sort par votre connexion ; les ports SSH et applicatifs sont redirigés vers Internet."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "La politique de confidentialité de Clore couvre les données du compte et votre adresse IP avec une localisation approximative ; des pièces d'identité uniquement si Clore demande un KYC."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Des ports entrants doivent être joignables depuis Internet (22, 8080 et 3000-4000 par défaut) et les charges de travail d'inconnus tournent sur votre ligne. Le guide réseau de Clore indique lui-même que certains FAI bloquent l'hébergement."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "18 ans ou plus, hors pays sous sanctions. Clore peut suspendre ou fermer un compte à sa seule discrétion, et une utilisation interdite peut faire perdre les fonds."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Ni les conditions ni la politique de confidentialité ne nomment une entité juridique, et les conditions renvoient la juridiction applicable à une version ultérieure."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore peut suspendre ou fermer un compte à sa seule discrétion, et une utilisation interdite peut entraîner la confiscation des fonds."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Les paiements se font uniquement en crypto (CLORE, BTC, USDT ou USDC), et Clore prélève 15 % de plus sur une location que le locataire paie en BTC, USDT ou USDC, sauf si l'hébergeur bloque des CLORE pour réduire ces frais."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Un hébergeur n'est payé que pour les minutes louées, et le chiffre de Clore pour une RTX 4090 est un plafond (« up to ~$490/month ») pour une seule carte."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "L'utilisation de base ne demande pas de KYC, mais Clore peut demander une vérification d'identité pour les gros retraits ou pour des raisons de conformité."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Les locataires font tourner n'importe quelle image Docker publique sur votre machine. Les conditions listent les utilisations interdites (logiciels malveillants, DDoS, CSAM, etc.), mais nous n'avons trouvé aucune description de la façon dont les locataires sont contrôlés."
