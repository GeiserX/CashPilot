sia-hostd.description: "Sia is a decentralized storage marketplace run by the Sia Foundation (a Swiss non-profit) that has operated since 2015. Run the Foundation's official hostd node to rent out spare disk space and earn Siacoin from storage and bandwidth contracts. You must buy some Siacoin before the node can earn: hosts lock collateral against every contract and pay a fee for each storage proof. The collateral comes back when a contract completes and is burned if the node goes offline or loses data, so it needs an always-on machine (Sia says 95% uptime at least). Earnings depend on how much data renters actually store; Sia recommends pricing storage at $1 per TB per month, so it suits machines with large spare disks rather than small VPS slices.\n"
sia-hostd.short_description: "Sia Foundation storage node - official Docker image, earn Siacoin"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label: "Wallet seed phrase"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label: "Dashboard password"
sia-hostd.docker.env.SIA_STORAGE_DIR.label: "Storage directory"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description: "BIP-39 seed phrase that controls the host's Siacoin wallet. Generate one with `docker run --rm ghcr.io/siafoundation/hostd seed` and back it up -- it is the ONLY way to reach the earnings"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description: "Password for the hostd web UI and local API (BasicAuth). Any long passphrase"
sia-hostd.docker.env.SIA_STORAGE_DIR.description: "Host path on your largest disk where renter data is stored (e.g. /srv/sia). Needs at least 256GB free"
sia-hostd.docker.setup: "On deploy, CashPilot creates a new wallet on the machine that runs the node and shows its seed phrase once: write it down. To use a wallet you already have, paste its seed phrase instead. After the deploy, send some Siacoin to the node's wallet for collateral and fees, then add the storage folder (/storage), set prices and announce the host in the dashboard.\n"
sia-hostd.docker.critical_volumes.0.holds: "The wallet seed phrase (hostd.yml), the wallet database, host settings and contract state. Losing it loses the node's identity and contract revenue tracking; the seed phrase you wrote down is then the only recovery path for funds."
sia-hostd.docker.critical_volumes.1.holds: "Stored renter data. Losing it fails storage proofs and forfeits the collateral locked against those contracts."
sia-hostd.earnings.notes: "Hosts set their own prices. Sia recommends $1 per TB stored per month and over $5 per TB downloaded, and 3.9% of every contract payout goes to Siafund holders. Income scales with how much renter data lands on the node, which starts at zero and grows with uptime and price. Collateral (Sia suggests 2x the storage price) is locked per contract and returned on successful completion.\n"
sia-hostd.payment.frequency: "On request"
sia-hostd.cashout.notes: "Earnings accrue in the host's own Siacoin wallet (seed-controlled). Convert SC on an exchange and withdraw to bank/card from there; there is no provider-side payout request.\n"
sia-hostd.payout.notes: "Funds live in the seed-controlled Sia wallet inside the node. The seed phrase lives only in hostd's data volume on the machine that runs it; CashPilot never stores it. The phrase you write down when the wallet is created is the only recovery path.\n"
sia-hostd.requirements.note: "A stable public address with ports 9981 (TCP, consensus) and 9984 (TCP and UDP, renter contracts) forwarded. Datacenter/VPS hosting is common on Sia. The wallet needs Siacoin before the node can take contracts."
sia-hostd.requirements.min_storage: "256GB"
sia-hostd.disclosure.sells: "Disk space and the bandwidth to serve it."
sia-hostd.disclosure.third_party_traffic: "No. Renters store encrypted file fragments on your disk and fetch them back. Other people do not route arbitrary traffic through your IP."
sia-hostd.disclosure.data_collected: "Your Sia wallet address, host public key, and the public IP:port the node announces so renters can reach it."
sia-hostd.disclosure.isp_risk: "Sustained upload/download traffic on the line, similar to running any storage server; no anonymised third-party web traffic is attributed to you."
sia-hostd.disclosure.account_rules: "Permissionless: no signup or account. Collateral is burned if the node misses storage proofs, by going offline or losing data."
sia-hostd.rating.cons.0.text: "Earnings are Siacoin in your own wallet: there is no payout to a bank, so you sell on an exchange yourself."
sia-hostd.rating.cons.1.text: "Collateral is locked per contract and burned if the host misses storage proofs by going offline or losing data."
sia-hostd.rating.cons.2.text: "Only about 30% of the storage offered on the network is in use, so a new host competes for little demand."
sia-hostd.rating.cons.3.text: "Renters store encrypted file fragments and nobody routes traffic through your IP, but we did not find where Sia says who the renters are or how they are checked."
sia-hostd.rating.pros.0.text: "hostd is developed in the open by the Sia Foundation, since 2022."
sia-hostd.rating.pros.1.text: "hostd is open source under the MIT licence."
sia-hostd.rating.pros.2.text: "The Sia Foundation publishes hostd as a container image."
sia-hostd.rating.pros.3.text: "Permissionless: no signup or account."
