earnfm.cashout.notes: "Minimum $15. Methods: USDT on BEP20 or Polygon ($1 fee) or TRC20 ($3 fee), PayPal, Amazon or Starbucks gift cards from $15, or a bank wire from $1,000 with transfer fees deducted. Before the first payout you fill in a billing profile (legal name and address), used for the payout receipts."
earnfm.payout.notes: "Balance held by Earn.fm; withdrawn on request."
