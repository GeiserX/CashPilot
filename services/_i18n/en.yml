golem.description: "Golem Network is a decentralized compute marketplace where you share CPU and GPU resources in exchange for GLM tokens. Providers run the Yagna agent which manages workload execution in sandboxed environments. One of the oldest decentralized compute projects (founded 2016). Supports CPU tasks, GPU rendering, and general-purpose compute. Payments via Polygon L2.\n"
golem.short_description: "Decentralized compute marketplace - GLM tokens via Yagna agent"
golem.earnings.notes: "Earnings depend on hardware, pricing, and task demand. CPU-only nodes earn less. GPU nodes earn more but require NVIDIA. Run the Yagna provider agent (not Docker image). Payments on Polygon in GLM tokens."
golem.payment.frequency: "Per task completion"
golem.cashout.notes: "GLM tokens earned. Configure payout wallet in provider setup."
golem.payout.notes: "Not yet determined: CashPilot has not checked yet where this service keeps your earnings."
golem.requirements.min_bandwidth: "10 Mbps"
golem.requirements.min_storage: "20GB"
golem.rating.cons.0.text: "CashPilot does not run Golem: you install the provider agent yourself, so CashPilot cannot deploy or update it for you. Golem documents running the provider in its own Docker image."
golem.rating.pros.0.text: "The provider agent, yagna, is open source under the GPL-3.0."
golem.rating.pros.1.text: "No account: you set a payout wallet in the provider setup."
golem.rating.pros.2.text: "The network has run for about ten years."
golem.rating.pros.3.text: "Golem's privacy policy names the operator, Golem Factory GmbH in Zug, Switzerland."
grass.description: "Grass is a decentralized network that lets you sell your unused bandwidth for AI training data. It operates as a browser extension and desktop app, routing web scraping requests through your connection to build structured datasets. With 8.5M+ users, it is one of the largest DePIN bandwidth networks. Earns GRASS tokens on the Solana blockchain.\n"
grass.short_description: "DePIN bandwidth sharing for AI data - earns GRASS tokens"
