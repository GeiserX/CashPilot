2miners-etc.description: "Track the unpaid Ethereum Classic balance 2Miners holds for your public ETC payout address. Run your own miner and point it at the pool. CashPilot reads the balance and asks you to confirm payouts when the balance drops.\n"
2miners-etc.short_description: "Ethereum Classic mining pool, tracked by your payout address"
2miners-etc.payment.minimum_payout: "0.1 ETC (adjustable)"
2miners-etc.payment.frequency: "The pool checks your payout threshold every two hours"
2miners-etc.cashout.notes: "2Miners pays your address automatically once you reach your chosen threshold. The lowest threshold for ETC payouts is 0.1 ETC.\n"
2miners-etc.payout.notes: "The unpaid balance is accrued at 2Miners. The wallet balance is a separate read from Ethereum Classic. Check your wallet for the amount you received before confirming a payout in CashPilot.\n"
2miners-etc.collector.credential_hint: "Enter the public Ethereum Classic payout address your miner uses on 2Miners, starting with <b>0x</b>. Leave out any worker name.\n"
2miners-etc.requirements.note: "Needs an ETCHash miner pointed at 2Miners"
2miners-etc.disclosure.sells: "compute"
2miners-etc.disclosure.third_party_traffic: "No. Your miner sends mining work to the pool."
2miners-etc.disclosure.data_collected: "The pool uses your payout address, your chosen worker names, and your miner's IP address."
2miners-etc.disclosure.account_rules: "Anyone can view stats by payout address. The pool asks for worker IP confirmation to change the threshold."
2miners-etc.rating.cons.0.text: "The pool charges a 1% fee and holds payouts until your threshold is reached."
anyone-protocol.description: "Anyone Protocol (formerly ATOR) is a decentralized onion-routing privacy network. Node operators run relay nodes and earn ANYONE tokens for bandwidth contributed. Think \"incentivized Tor.\" CashPilot runs it from its own image, built from the project's signed Debian package, for amd64 and arm64. Configuration is file-based via an anonrc file mounted into the container (Nickname, ContactInfo, ORPort, etc.). A relay earns nothing until 100 ANYONE is locked for it for at least 180 days, and rewards are claimed by signing in your wallet. The relay also lists your public IP in the network's relay directory, which may hurt the IP reputation residential bandwidth apps pay for.\n"
anyone-protocol.short_description: "Decentralized onion routing - incentivized Tor relay nodes"
anyone-protocol.docker.critical_volumes.0.holds: "Relay ed25519 identity key. Destroying it retires the relay's reputation and restarts its earning history from zero."
anyone-protocol.earnings.notes: "Pays only with 100 ANYONE locked per relay for at least 180 days and a reward claim signed in your wallet. Without the stake a relay earns nothing. With it, earnings depend on bandwidth contributed and uptime."
anyone-protocol.payment.frequency: "Epoch-based"
anyone-protocol.payout.notes: "Set as ContactInfo in anonrc, prefixed '@anon:0x...'."
anyone-protocol.collector.credential_hint: "Comma-separated relay fingerprints. This one is not in a web dashboard: run <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> on the host running the relay.\n"
anyone-protocol.requirements.min_bandwidth: "10 Mbps"
anyone-protocol.disclosure.sells: "Bandwidth, as a relay in the Anyone network (a Tor fork)."
anyone-protocol.disclosure.third_party_traffic: "Yes. It relays other people's traffic. Whether your IP is the final hop depends on whether the relay is configured as an exit."
anyone-protocol.disclosure.data_collected: "The relay's public identity key, your IP and port, and uptime statistics, all published to the network directory by design. If you set ContactInfo in your anonrc it is published there too and is permanently, publicly indexed — it is usually an email address, so leave it empty unless you want it public."
anyone-protocol.disclosure.isp_risk: "Real. Relay traffic is attributed to your connection. Exit relays in particular attract abuse complaints; many consumer ISPs prohibit them."
anyone-protocol.disclosure.account_rules: "There is no account to sign up for, so there is nothing to limit per account. To earn you still need an Ethereum wallet with 100 ANYONE locked for each relay for at least 180 days, and CashPilot needs the relay fingerprints to read the rewards. The project does not publish a per-IP relay limit, and the catalog does not declare one."
anyone-protocol.rating.cons.0.text: "A relay earns nothing unless 100 ANYONE is locked for it for at least 180 days, and each reward claim is signed in your wallet."
anyone-protocol.rating.cons.1.text: "It relays other people's traffic by design, with no vetting of who they are; exit relays attract abuse complaints."
anyone-protocol.rating.cons.2.text: "The relay's identity, IP and uptime are published to the network directory, and any ContactInfo you set is public for good."
anyone-protocol.rating.pros.0.text: "There is no account to sign up for. A relay needs only a wallet, with no identity check."
anyone-protocol.rating.pros.1.text: "The relay software is a published fork of Tor, under Tor's licence."
anyone-protocol.rating.pros.2.text: "CashPilot builds its own image from Anyone's published relay software, which needs no account."
bitping.description: "Bitping is a decentralized network monitoring platform that pays you for running a node. Your node performs website monitoring, latency testing, and network quality checks for Bitping's customers. Works on both residential and VPS connections. The Docker image logs in with the BITPING_EMAIL and BITPING_PASSWORD environment variables on first start (\"Attempting login with environment variables\" in its own log), then persists the session in the volume mount so restarts do not re-authenticate.\n"
bitping.short_description: "Bandwidth sharing - decentralized network monitoring, works on VPS"
bitping.docker.env.BITPING_EMAIL.label: "Email"
bitping.docker.env.BITPING_PASSWORD.label: "Password"
bitping.docker.env.BITPING_EMAIL.description: "Your Bitping account email (same login as <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
bitping.docker.env.BITPING_PASSWORD.description: "Your Bitping account password. Used once to create the node session, which then persists in the data volume."
bitping.earnings.notes: "Earnings depend on network quality and demand for monitoring from your location. VPS nodes accepted."
bitping.payment.frequency: "On request"
bitping.cashout.notes: "Node earnings live on nodes.bitping.com; app.bitping.com is the API customer dashboard. Withdrawals are SOL only: once the unpaid balance is more than $0.05, type the Solana address into the request, processed within 24 hours. A new or empty Solana wallet needs about 0.001 SOL in it first, for the network's rent minimum."
bitping.payout.notes: "Solana-only now, and the address is typed in AT WITHDRAWAL TIME rather than stored."
bitping.collector.credential_hint: "Use your Bitping account email and password (same as <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
bitping.obligations.withdraw-before-12-month-forfeit.title: "Withdraw your Bitping balance"
bitping.obligations.withdraw-before-12-month-forfeit.loss: "Bitping may forfeit earnings left unclaimed for more than 12 months, after 30 days' notice by email."
bitping.obligations.withdraw-before-12-month-forfeit.how: "Request a SOL withdrawal on nodes.bitping.com and type your Solana address into the request."
bitping.rating.cons.0.text: "Withdrawals are paid in Solana (SOL), to an address you type into each request."
bitping.rating.cons.1.text: "Bitping's help says a withdrawal to a new, empty Solana wallet may fail until you fund that wallet with a little SOL yourself."
bitping.rating.pros.0.text: "Bitping's help says servers and Docker containers are supported."
bitping.rating.pros.1.text: "A withdrawal needs only a Solana address typed into the request."
bytebenefit.description: "Bytebenefit is a bandwidth-sharing service that pays through PayPal and Stripe. No official Docker image; the Windows desktop app and Android app are the clients. The service lives at bytebenefit.io -- the old bytebenefit.com domain was dropped and is parked on a marketplace, which is why it was once marked dead here.\n"
bytebenefit.short_description: "Bandwidth sharing - PayPal/Stripe payouts, desktop/Android app"
bytebenefit.earnings.notes: "No Docker image available. Windows desktop and Android apps only."
bytebenefit.payment.frequency: "On request"
bytebenefit.payout.notes: "Not yet determined: CashPilot has not checked yet where this service keeps your earnings."
bytebenefit.referral.bonus.referrer: "20% of referral traffic earnings"
bytebenefit.referral.bonus.referee: "$1 (10,000 Coins) welcome bonus"
bytebenefit.rating.cons.0.text: "The app's Google Play listing says your traffic serves web-intelligence requests by Infatica's clients, without saying who they are or how they are checked."
bytebenefit.rating.cons.1.text: "The Android app left Google Play in April 2026 after 17 months."
bytebenefit.rating.cons.2.text: "CashPilot does not run ByteBenefit: you use the provider's own app, so CashPilot cannot deploy or update it for you. Its terms were not checked for containers."
bytelixir.description: "Bytelixir lets you earn passive income by sharing unused internet bandwidth. Supports Windows and Android only — the official FAQ states no Linux or Docker client is planned, iOS is unsupported, and macOS is not offered. Earnings depend heavily on location. Web dashboard at dash.bytelixir.com for tracking. No Docker image available.\n"
bytelixir.short_description: "Bandwidth sharing - Windows + Android only"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label: "Session Cookie"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label: "Remember Web Cookie"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label: "XSRF Token"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description: "Log in at <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, press F12 → Application → expand <b>Cookies</b> in the left sidebar → click the sub-item <code>https://dash.bytelixir.com</code> → in the cookie list on the right, find <code>bytelixir_session</code> → copy its Value (a long JWT starting with eyJ)"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description: "Same location (Cookies → <code>https://dash.bytelixir.com</code>) → find the cookie named <code>remember_web_...</code> → copy its Value (optional, extends session lifetime)"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description: "Same location → find <code>XSRF-TOKEN</code> → copy its Value (optional)"
bytelixir.earnings.notes: "Earnings vary by location ($2-50/month). No Docker image. Desktop app or Android app required."
bytelixir.payment.frequency: "On request"
bytelixir.cashout.notes: "Crypto only. The minimum depends on the coin: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. You type the address in each request. Requests are handled in working hours, within 24 hours."
bytelixir.payout.notes: "Balance held by Bytelixir; the wallet address is typed into each payout request, never stored on the container."
bytelixir.collector.credential_hint: "Log in at <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>ticking Remember Me</b>, press F12 → Application → expand <b>Cookies</b> in the left sidebar → click <code>https://dash.bytelixir.com</code>, then copy three values: <b>bytelixir_session</b>, <b>remember_web_…</b> (the long one starting with that prefix) and <b>XSRF-TOKEN</b>. The session cookie alone expires about two hours after you copy it, so collection stops the same afternoon; the remember_web cookie lasts a year and is what keeps it working."
bytelixir.referral.bonus.referrer: "50% of their profit for life"
bytelixir.referral.bonus.referee: "$1 greeting bonus"
bytelixir.rating.cons.0.text: "Crypto only, and the minimum depends on the coin, from $5 for USDT to $250 for Bitcoin."
bytelixir.rating.cons.1.text: "CashPilot does not run Bytelixir: you use the provider's own app, so CashPilot cannot deploy or update it for you. Its terms were not checked for containers."
bytelixir.rating.pros.0.text: "Trustpilot rates it 4.6 from 283 reviews, most of them praising crypto payouts; a few report payouts not arriving."
bytelixir.rating.pros.1.text: "A payout needs only a crypto address typed into the request."
clore-ai.description: "Clore.ai is a peer-to-peer GPU marketplace. You list a Linux machine with NVIDIA GPUs, set your own spot and on-demand prices, and renters run their own Docker containers on it. You are paid only for the minutes it is rented, in CLORE, BTC, USDT or USDC. Hosting needs an x86_64 machine on Ubuntu 22.04 or newer (or HiveOS), a working NVIDIA driver and at least 100 Mbps up and down. AMD GPUs are not supported.\n"
clore-ai.short_description: "GPU marketplace - rent out NVIDIA GPUs, paid in CLORE, BTC or USD stablecoins"
clore-ai.earnings.notes: "Paid only for rented minutes, at the price you set. The top of the range, $490, is Clore's own ceiling for one RTX 4090 listed by the minute ('up to ~$490/month'); smaller cards earn less and an idle card earns nothing. Clore keeps 5% (on-demand) or 1.25% (spot) of each rental, plus 15% when the renter pays in BTC, USDT or USDC instead of CLORE."
clore-ai.payment.minimum_payout: "200 CLORE"
clore-ai.payment.frequency: "On request"
clore-ai.cashout.notes: "Withdraw from Account > Billing to your own wallet: CLORE (ERC-20, minimum 200, fee about $0.50), BTC (minimum 0.0001, fee 0.00005 BTC) or USDT/USDC on Ethereum or BNB Chain (minimum $10, fee $1)."
clore-ai.payout.notes: "Clore keeps the balance (CLORE, BTC and one USD balance for USDT/USDC) until you withdraw. The chain is chosen per withdrawal: Ethereum for CLORE, Bitcoin for BTC, Ethereum or BNB Chain for USDT/USDC."
clore-ai.referral.bonus.referrer: "15% (standard tier) of the platform fees paid by the hosts and renters you refer, on every rental; the code never expires; paid in the rental's currency (CLORE, BTC or USD)"
clore-ai.requirements.min_bandwidth: "100 Mbps up and down"
clore-ai.requirements.min_storage: "32GB"
clore-ai.disclosure.sells: "GPU compute time on your machine."
clore-ai.disclosure.third_party_traffic: "Yes. Renters run their own Docker containers on your machine, and their traffic leaves from your connection; SSH and application ports are forwarded to the internet."
clore-ai.disclosure.data_collected: "Clore's privacy policy covers account data and your IP address with an approximate location; identity documents only if Clore asks for KYC."
clore-ai.disclosure.isp_risk: "Inbound ports must be reachable from the internet (22, 8080 and 3000-4000 by default) and strangers' workloads run on your line. Clore's own network guide says some ISPs block hosting."
clore-ai.disclosure.account_rules: "18 or older, not in a sanctioned country. Clore may suspend or close an account at its sole discretion, and a prohibited use can cost the funds."
clore-ai.rating.cons.0.text: "Neither the terms nor the privacy policy name a legal entity, and the terms leave the governing jurisdiction to a later version."
clore-ai.rating.cons.1.text: "Clore may suspend or close an account at its sole discretion, and a prohibited use can lead to forfeiture of funds."
clore-ai.rating.cons.2.text: "Payouts are crypto only (CLORE, BTC, USDT or USDC), and Clore takes an extra 15% of a rental the renter pays in BTC, USDT or USDC, unless the host locks CLORE to cut it."
clore-ai.rating.cons.3.text: "A host is paid only for rented minutes, and Clore's figure for an RTX 4090 is a ceiling (\"up to ~$490/month\") for a single card."
clore-ai.rating.cons.4.text: "Basic use needs no KYC, but Clore may ask for identity verification for large withdrawals or compliance cases."
clore-ai.rating.cons.5.text: "Renters run any public Docker image on your machine. The terms list forbidden uses (malware, DDoS, CSAM and more), but we found no description of how renters are checked."
clore-ai.rating.cons.6.text: "CashPilot does not run Clore.ai: you install Clore's hosting agent on your own GPU machine (Ubuntu 22.04 or newer, or HiveOS), so CashPilot cannot deploy or update it for you."
clore-ai.rating.pros.0.text: "Clore keeps 5% of an on-demand rental (1.25% on spot) when the renter pays in CLORE, with no extra fee."
dawn.description: "DAWN runs a validator network that checks bandwidth and coverage for the AI infrastructure financed through the DAWN protocol. The DAWN Validator browser extension takes part in these proof-of-bandwidth and coverage checks and earns DAWN rewards while it runs. The rewards have no settled cash value yet. Create the account in the extension and enter referral code 2QLQV97F when it asks.\n"
dawn.short_description: "DePIN validator - browser extension earns DAWN points"
dawn.earnings.notes: "Earns Dawn Points pre-token launch. Actual value depends on future token price. Hardware box earns more than browser extension."
dawn.payment.frequency: "Token airdrop (TBA)"
dawn.cashout.notes: "Extension works but half-baked. Black Box hardware announced. Check future."
dawn.payout.notes: "Not yet determined: CashPilot has not checked yet where this service keeps your earnings."
dawn.rating.cons.0.text: "The extension earns points; no token distribution to node operators had been confirmed by October 2026."
dawn.rating.cons.1.text: "Points have no settled value until a token launches and its conversion is announced."
dawn.rating.cons.2.text: "CashPilot does not run Dawn: you use the provider's own browser extension, so CashPilot cannot deploy or update it for you. Its terms were not checked for containers."
deeper-network.description: "Deeper Network is a decentralized VPN and web3 infrastructure project. Primarily requires proprietary Deeper Connect hardware devices. Moken is a related mining/staking platform. Not software-only.\n"
