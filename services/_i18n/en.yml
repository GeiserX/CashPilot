earnfm.docker.env.EARNFM_TOKEN.description: "Log in at <a href=\"https://app.earn.fm\">app.earn.fm</a> → click your profile icon (top right) → Account Settings → copy the API Key (UUID format)"
earnfm.earnings.notes: "Relatively new platform. Earnings vary by location and bandwidth availability."
