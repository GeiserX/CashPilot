mysterium.description: "MystNodes (Mysterium Network) is a decentralized VPN and proxy network built on blockchain technology. You earn MYST tokens by running a node that provides VPN, proxy, and data scraping services to users. Requires NET_ADMIN, SETUID and SETGID capabilities and a TUN device, which it uses inside its own network namespace on the fenced earner bridge. Includes a built-in web UI for node management. Works on both residential and VPS connections, but the referral bonus is paid only for nodes on a residential IP.\n"
mysterium.short_description: "Decentralized VPN node - blockchain-based, works on VPS"
mysterium.docker.env.UI_ADDRESS.label: "WebUI address"
mysterium.docker.env.UDP_PORTS.label: "UDP port range"
mysterium.docker.env.UI_ADDRESS.description: "The host addresses the node's WebUI (port 4449) is published on. 127.0.0.1 keeps it on this machine. To reach it through a reverse proxy, add the address the proxy connects to, comma separated with no spaces: 127.0.0.1,172.18.0.1."
mysterium.docker.env.UDP_PORTS.description: "The UDP ports the node uses for VPN sessions, as start:end. Forward this same range on your router. Each session takes about two ports, so the default 30 carry about 15 sessions at once, more than a home node gets. A wider range fixes nothing and costs more: every published port slows the node's start and removal (300 ports take about 12 s to start), CashPilot accepts at most 300, and with Docker's default userland proxy each port also takes about 2.5 MB of memory. Sessions that all fail are a router problem, not too few ports: see \"Routers that rewrite UDP source ports\" in the Mysterium guide. Keep it below 32768: ports 32768-60999 are Linux's ephemeral range, where any program on the host can hold one for a moment, and one taken port fails the node's start. A node that already has a range keeps it."
mysterium.docker.runtime_reason: "gVisor gives it no iptables-nft and no kernel WireGuard, which it needs to carry traffic."
mysterium.docker.critical_volumes.0.holds: "Node identity keystore. Destroying it creates a brand-new identity: the node loses its reputation and any earnings still held against the old one."
mysterium.docker.health_signals.0.means: "The node cannot run sudo inside its container, so it cannot configure its VPN interface or firewall and every session fails at setup: it looks online and earns nothing. The container was created without the SETUID and SETGID capabilities. Update CashPilot and the worker running this node, then redeploy Mysterium from the dashboard; the node identity lives in its data volume and is kept."
mysterium.docker.health_signals.1.means: "No VPN session in the last 6 hours reached this node directly. Every one fell back to hole punching, and many buyers fail to connect that way, so the node earns less. Its UDP ports are not reachable from the internet. On your router, forward the UDP port range ${UDP_PORTS} (start:end, the same range on both sides) to ${HOST_ADDRESS}. This clears by itself once a session connects directly."
mysterium.docker.health_probe.checks.0.means: "Mysterium's monitoring marks the node on ${WORKER_NAME} as failed, so it is left out of the node list most buyers pick from, even when its own check says every port is reachable. First make sure the node has /dev/net/tun and SETUID/SETGID, which fail it the same way: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 With those in place, a common cause is the router in front of ${WORKER_NAME} rewriting the UDP source port of the node's answers once a packet from outside has reached that port. See the test in the guide: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
mysterium.docker.health_probe.checks.1.means: "The last five VPN sessions of the node on ${WORKER_NAME} each ended after about a minute having moved no data, so it earns nothing while it looks online. The likely cause is the router in front of ${WORKER_NAME}: once a packet from outside reaches a port, it rewrites the source port of the node's later answers from that port, and every session starts with such a packet (the node's own port check), so buyers drop the node's answers. A wider port range does not help. See the test and the fixes in the guide: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports This clears once a session carries data."
mysterium.earnings.notes: "Earnings in MYST tokens. Residential IPs earn significantly more. Node WebUI at port 4449 for management, published on the machine it runs on only (127.0.0.1) by default; from another machine open an SSH tunnel first (ssh -L 14449:127.0.0.1:4449 followed by the address of the node's machine, then browse http://127.0.0.1:14449; local port 14449 so it cannot clash with a node on your own machine), or add an address to UI_ADDRESS (see WebUI address in the Mysterium guide). VPS accepted. Port forwarding UDP 23000-23029 (the UDP_PORTS default) strongly recommended -- without it, nodes get Strict NAT status and many VPN sessions fail, severely reducing income. Important: after first run, set your beneficiary (settlement) wallet via the node WebUI or CLI to match your mystnodes.com account -- this links on-chain earnings to your cloud dashboard."
mysterium.payment.minimum_payout: "5 MYST"
mysterium.payment.frequency: "Automatic on-chain settlement each time a node holds 5 MYST unsettled"
mysterium.cashout.notes: "No button to press. Each node settles on Polygon by itself once it holds 5 MYST unsettled, and about 21% goes in fees (the 20% Hermes fee plus a small transaction fee), so roughly 3.9 MYST reaches the beneficiary wallet per settlement. Each node's TequilAPI lists its settlements at /transactor/settle/history. The \"total earnings\" figure on MystNodes covers the last 30 days only; it is neither a balance nor a lifetime total. Bonus MYST from the MystNodes rewards program does not settle by itself: claim it on the Rewards page, within 30 days of distribution according to the MystNodes help center."
mysterium.payout.notes: "The beneficiary wallet is set AFTER deploy, via TequilAPI or the node WebUI -- not by an env var, so it cannot be read from the container spec."
mysterium.collector.credential_hint: "Use your MystNodes account email and password (same as <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
mysterium.referral.bonus.referrer: "5 MYST per friend whose node earns 5 MYST (residential IPs only)"
mysterium.referral.bonus.referee: "5 MYST once your node earns its first 5 MYST (residential IP, node claimed on mystnodes.com)"
mysterium.obligations.claim-monthly-rewards-pool.title: "Claim last month's MystNodes rewards"
mysterium.obligations.claim-monthly-rewards-pool.loss: "Rewards not claimed within 30 days of the monthly distribution are forfeited and go back into the next month's pool."
mysterium.obligations.claim-monthly-rewards-pool.how: "Open the Rewards page and swap your points for MYST."
mysterium.disclosure.sells: "Bandwidth. Your connection is used as an exit node for the Mysterium network, which sells VPN, proxy AND data-scraping services. Scraping traffic leaving a residential IP is the use most likely to draw complaints, and you cannot choose which of the three your node carries."
mysterium.disclosure.third_party_traffic: "Yes. Strangers route their traffic through your IP address — that is the product."
mysterium.disclosure.data_collected: "Node identity (a blockchain address), your IP, and coarse location (country/city/ISP), which the node publishes to the network so buyers can select it."
mysterium.disclosure.isp_risk: "Real and worth understanding. Traffic from other people leaves your connection attributed to you, so anything they do appears to originate from your line. Many consumer ISP contracts prohibit this. Check yours before running it."
mysterium.disclosure.account_rules: "Unlimited devices per account and per IP."
mysterium.rating.cons.0.text: "About 21% of every settlement goes in fees, the 20% Hermes fee plus a transaction fee, and earnings are paid in the MYST token."
mysterium.rating.cons.1.text: "Your node is an exit for Mysterium's VPN, proxy and data-scraping customers, and you cannot choose which of them it carries."
mysterium.rating.pros.0.text: "The node software is open source under the GPL-3.0."
mysterium.rating.pros.1.text: "Mysterium publishes its own Docker image, mysteriumnetwork/myst."
mysterium.rating.pros.2.text: "Settlement goes to a wallet you own; no phone number or ID is needed."
mysterium.rating.pros.3.text: "The node project has run since 2017."
mysterium.rating.pros.4.text: "Mysterium's site says the network is developed by Blockdev AG, Zug, Switzerland."
