srbminer-multi.description: "Mine Pearl, Zano or Ravencoin with one NVIDIA GPU. CashPilot downloads the official SRBMiner-Multi release at first start and checks its SHA-256. Your chosen pool pays your public payout address. SRBMiner-Multi keeps 2% of hashing time on Pearl and 0.85% on the other two. Electricity can cost more than the coins you earn."
