srbminer-multi.mining.pool_fee_note: "The 2% miner fee is for pearlhash. SRBMiner-Multi keeps 0.85% on progpow_zano and kawpow. HeroMiners, the default Pearl pool, charges a 1% pool fee. It checks payouts every hour and pays from 1 PRL. Other pools set their own rates and thresholds."
srbminer-multi.disclosure.sells: "compute"
srbminer-multi.disclosure.third_party_traffic: "No. The miner sends work to the pool you choose."
srbminer-multi.disclosure.data_collected: "Your payout address, worker name and IP address go to the pool. The first start downloads the miner from GitHub."
srbminer-multi.disclosure.isp_risk: "Some networks and DNS resolvers block mining pool connections."
srbminer-multi.disclosure.account_rules: "Most pools identify you by your public payout address."
srbminer-multi.rating.cons.0.text: "The miner keeps 2% of hashing time on Pearl and 0.85% on Zano and Ravencoin."
srbminer-multi.rating.cons.1.text: "Some hosting providers prohibit cryptocurrency mining."
srbminer-multi.rating.cons.2.text: "The miner is closed source, so nobody outside its developer can audit what it runs."
srbminer-multi.rating.cons.3.text: "The GPU's electricity can cost more than the coins earned, and Pearl's price moves fast."
srbminer-multi.rating.pros.0.text: "The miner sends work to the pool and does not relay anyone else's traffic."
srbminer-multi.rating.pros.1.text: "You can mine Pearl on HeroMiners with a public address and no account."
storj.description: "Storj is a decentralized cloud storage network where you earn by renting out your unused disk space. Run the storage node via Docker and get paid $1.35/TB stored per month plus $1/TB egress (rates since 1 September 2026). Payouts are monthly in USDC, a US-dollar stablecoin, on Ethereum mainnet to a wallet you control, once the balance clears a fee-based minimum (STORJ token until the September 2026 payout). Requires at least 550GB of available disk space and a stable internet connection. No account or signup needed -- nodes are permissionless since mid-2025. CAUTION (October 2026): Storj Labs filed for Chapter 11 on 26 July 2026 (US Bankruptcy Court, Northern District of West Virginia, case 5:26-bk-00512) to restructure legacy debt. The network keeps running and Storj keeps paying active nodes, but node earnings from before the filing are frozen until the court rules on them. The STORJ token is down about 98% from its 2021 peak. Binance delisted it on 3 September 2026, and Coinbase suspended trading in it on 28 September 2026. A new node withholds part of its earnings during its first nine months and fills only as customer demand allows, so starting one now ties a long payback to a company in restructuring that could still wind down.\n"
storj.short_description: "Decentralized storage node - $1.35/TB stored + $1/TB egress"
storj.docker.env.WALLET.label: "Wallet address"
storj.docker.env.EMAIL.label: "Email"
storj.docker.env.ADDRESS.label: "External address"
storj.docker.env.STORAGE.label: "Storage allocation"
storj.docker.env.IDENTITY_DIR.label: "Identity directory"
storj.docker.env.STORAGE_DIR.label: "Storage directory"
storj.docker.env.WALLET.description: "Ethereum wallet address for USDC payouts (e.g. 0x1234...abcd). Must be self-custodial (MetaMask, Ledger, etc.) -- never use an exchange address"
storj.docker.env.EMAIL.description: "Email address for operator notifications"
storj.docker.env.ADDRESS.description: "DDNS hostname with port (e.g. mynode.ddns.net:28967) -- strongly preferred over a literal IP, which strands the node the day your ISP silently re-provisions it. Port 28967 must be forwarded (TCP+UDP)"
storj.docker.env.STORAGE.description: "Maximum disk space to allocate (e.g. 2TB). Use spinning disks (HDD), not SSD"
storj.docker.env.IDENTITY_DIR.description: "Host path where identity files are stored (must contain ca.cert, ca.key, identity.cert, identity.key)"
storj.docker.env.STORAGE_DIR.description: "Host path on a spinning disk (HDD) for Storj data storage. Needs at least 550GB free"
storj.docker.setup: "Before first run, initialize the storage node config: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
storj.docker.critical_volumes.0.holds: "Node identity. Its ID is proof-of-work bound and takes hours to regenerate, and it cannot be recreated from a backup of anything else. Losing it forfeits the held payout balance."
storj.docker.critical_volumes.1.holds: "Stored customer data and the node's held amount. Losing it disqualifies the node and forfeits the held balance."
storj.docker.health_signals.0.means: "The Storj network cannot dial your node back at its advertised ADDRESS, so satellites count it offline: new data stops arriving, egress income stalls, and sustained offline time leads to suspension. Check that ADDRESS matches your CURRENT public IP (use a DDNS hostname, not a literal IP, so an ISP re-provision cannot strand the node) and that port 28967 TCP+UDP is forwarded to this machine."
storj.earnings.notes: "$1.35/TB stored + $1/TB egress + $1/TB audit/repair since 1 September 2026. Earnings scale with data stored and node age. The first 9 months withhold 75%, then 50%, then 25% of earnings; half the held amount returns in month 16 and the rest on graceful exit. Port 28967 must be forwarded."
storj.payment.minimum_payout: "4x the Ethereum transaction fee, smaller balances roll over"
storj.payment.frequency: "Monthly"
storj.cashout.notes: "Paid monthly in USDC on Ethereum mainnet once the wallet balance is at least four times the current transaction fee; smaller balances roll into the next month. STORJ token until the September 2026 payout. Dashboard at port 14002."
storj.payout.notes: "Paid monthly in USDC on Ethereum mainnet to the address in WALLET once the balance clears the fee-based minimum. STORJ token until the September 2026 payout; zkSync Era payouts ended 1 September 2026."
storj.collector.credential_hint: "The node dashboard's URL on port 14002, with the server's LAN IP rather than localhost, for example <b>http://192.168.1.10:14002</b>. For several nodes, list their URLs separated by commas: CashPilot adds them up."
storj.requirements.note: "Storj nodes on the same /24 subnet share data allocation, reducing per-node earnings."
storj.requirements.min_bandwidth: "5 Mbps upload"
storj.requirements.min_storage: "550GB"
storj.disclosure.sells: "Disk space and the bandwidth to serve it."
storj.disclosure.third_party_traffic: "No. You store encrypted, erasure-coded fragments of customer data. Other people do not route their own traffic through your IP."
storj.disclosure.data_collected: "Node identity, your wallet address, the email address the node requires for operator notifications, and your IP and port, which must be reachable for the node to serve data."
storj.disclosure.isp_risk: "Mainly a data-cap question rather than a liability one: a node serves and ingests customer data continuously, which is real sustained traffic on your line. Unlike a proxy or a relay, though, it is not anonymised third-party traffic attributed to you as its origin, so it does not attract the abuse complaints those do."
storj.disclosure.account_rules: "Unlimited nodes, but nodes on the same /24 subnet share allocation, so several on one connection earn less each."
storj.rating.cons.0.text: "CoinDesk reported on 27 July 2026 that Storj Labs had filed for Chapter 11 bankruptcy protection."
storj.rating.cons.1.text: "Pre-filing payments to node operators went into the bankruptcy claims process."
storj.rating.cons.2.text: "A new node has 75%, then 50%, then 25% of its earnings held in its first nine months; half comes back in month 16 and the rest only on a graceful exit."
storj.rating.cons.3.text: "Customers store encrypted file fragments and nobody routes traffic through your IP, but we did not find where Storj says who the customers are or how they are checked."
storj.rating.pros.0.text: "The storage node software is open source under the AGPL-3.0."
storj.rating.pros.1.text: "Storj publishes its own Docker image, storjlabs/storagenode."
storj.rating.pros.2.text: "No account: a wallet address and an email for operator notices."
storj.rating.pros.3.text: "Active nodes kept being paid after the filing."
supportxmr.description: "SupportXMR is a Monero mining pool with no account: your miner logs in with your Monero address as its username, and the pool pays that address. CashPilot does not run a miner here. It reads the balance SupportXMR holds for your address, so you see what your CPU miner has earned next to your other income. The balance is earned but not received: the pool pays it once it passes your payout threshold.\n"
supportxmr.short_description: "Monero mining pool, tracked by your payout address"
supportxmr.payment.minimum_payout: "0.1 XMR (automatic), 0.01 XMR on request"
supportxmr.payment.frequency: "When your balance passes your threshold, or on request"
supportxmr.cashout.notes: "SupportXMR pays your address once the balance reaches your threshold (0.1 XMR by default). On its site you can also request an instant payout from 0.01 XMR, for a 0.001 XMR fee."
supportxmr.payout.notes: "The balance is earned but not received until SupportXMR pays it to this address. Monero balances cannot be read on-chain without a private view key, which CashPilot never asks for, so you confirm each payout yourself."
supportxmr.collector.credential_hint: "Your Monero payout address: the username your miner uses on SupportXMR, without any <b>.workername</b> or <b>+difficulty</b> part. It is public and unlocks no funds."
supportxmr.requirements.note: "Needs a Monero miner (XMRig) pointed at pool.supportxmr.com"
supportxmr.disclosure.sells: "compute"
supportxmr.disclosure.third_party_traffic: "No. Your miner sends hashes to the pool; nobody routes traffic through your connection."
supportxmr.disclosure.data_collected: "Your Monero address, the worker names you choose, your hashrate and your miner's IP address as the pool sees it."
supportxmr.disclosure.isp_risk: "A miner keeps one connection open to the pool and uses little bandwidth. The cost to watch is electricity, not your ISP."
supportxmr.disclosure.account_rules: "There is no account. The address is the identity, and anyone can read its stats on supportxmr.com."
supportxmr.rating.cons.0.text: "Paid in Monero only, with a 0.6% pool fee and a 0.1 XMR default threshold before an automatic payout."
supportxmr.rating.cons.1.text: "CashPilot does not run a miner for SupportXMR: you point your own miner at the pool, and CashPilot only reads the balance."
teneo.description: "Teneo Protocol gives AI agents access to the live web through a network of Beacons. The Teneo Beacon is Teneo's own app for Android, iOS, macOS, Windows and Linux, with a command-line version for servers and a Raspberry Pi. It shares your unused bandwidth after you accept its consent screen, and earns Teneo Protocol Points and Fragments while it is online. Fragments count toward seasonal draws paid in USDC (the Beacon Drop). Teneo says the Beacon earns twice the points of its older browser extension. One Beacon earns per internet connection. Other devices on the same connection stand by. Sign up in the Expedition Hub with the referral link or code PSA3BHPJ, then sign in to the Beacon.\n"
teneo.short_description: "DePIN bandwidth app (Beacon) - Fragments toward seasonal USDC draws, +100 Fragments with a referral link"
teneo.earnings.notes: "Earns Teneo Points and Fragments. Fragments count toward seasonal USDC draws, so a season pays a prize, not a rate. Teneo says the Beacon earns twice the points of the browser extension. Claim the boost every 8 hours for up to 3x Fragments; a missed window lowers the multiplier."
teneo.payment.frequency: "Seasonal draw (Beacon Drop)"
teneo.cashout.notes: "Beacon Drop prizes are paid in USDC to a wallet you bind in the Expedition Hub. The Hub shows how many days you have to bind one; a prize with no wallet bound in time is forfeited."
teneo.payout.notes: "Bind a wallet in the Expedition Hub before a season's prizes are paid; the Hub forfeits a prize whose wallet is not bound in time."
teneo.referral.bonus.referrer: "8% of each referred friend's Fragments and 2% of their referrals' Fragments, once the friend signs up within 7 days and earns 480 Fragments"
teneo.referral.bonus.referee: "+100 Fragments at signup, and +150 more once you reach 480 Fragments"
teneo.requirements.note: "One Beacon earns per internet connection. Datacentre machines earn only on hosting providers Teneo has enabled, at half the Fragments and with no points or referral bonus. VPN connections never earn."
teneo.rating.cons.0.text: "The Beacon's Fragments pay USDC only as prizes in seasonal draws, so running it does not earn a set amount."
teneo.rating.cons.1.text: "Teneo says points will be consolidated into $AGENTIC, a non-transferable reward token, not the $TENEO token."
teneo.rating.cons.2.text: "No $TENEO launch date, allocation or claim process had been confirmed by November 2026, after an earlier target of the second quarter of 2026 passed."
teneo.rating.cons.3.text: "CashPilot does not run Teneo: you install the provider's own Beacon app, so CashPilot cannot deploy or update it for you. Its terms were not checked for containers."
teneo.rating.cons.4.text: "Teneo says the traffic comes from vetted business customers and blocks private addresses and abuse-prone ports, but does not say how it vets those customers."
