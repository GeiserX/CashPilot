earnapp.description: "EarnApp by Bright Data lets you sell your unused bandwidth for passive income. Bright Data is the world's largest proxy network, powering data collection for Fortune 500 companies. CashPilot runs it from its own image, which downloads the pinned EarnApp build from Bright Data's CDN at first start, checks its sha256 and runs it in lite mode with only a UUID.\n"
earnapp.short_description: "Bandwidth sharing - backed by Bright Data"
earnapp.docker.env.EARNAPP_UUID.label: "Node UUID"
earnapp.docker.env.EARNAPP_UUID.description: "Your EarnApp node ID: sdk-node- followed by 32 lowercase hex characters, as 'earnapp showid' prints it. After deploying, link it once by opening https://earnapp.com/r/ followed by this UUID while signed in to EarnApp; an unlinked node earns, but nothing reaches your balance"
earnapp.docker.health_signals.0.means: "EarnApp keeps failing to reach its servers and restarting, so it earns little or nothing. Restart this copy; if it keeps happening, check this box's internet connection."
earnapp.device_link.steps: "Open this link while signed in to EarnApp to add the node to your account. Until you do, the node earns but nothing reaches your balance."
earnapp.earnings.notes: "Highly location-dependent. US/EU IPs earn the most. Earnings scale with bandwidth consumed."
earnapp.payment.frequency: "On request (auto-redeem available: PayPal $10 min, Wise $10 min, Amazon $50 min)"
earnapp.cashout.notes: "Turn on auto-redeem once and EarnApp pays by itself whenever the balance reaches the method's minimum: PayPal $10, Wise $10, Amazon $50. PayPal payments arrive from Bright Data Ltd. In October 2026 a PayPal payment arrived about 2% below the redeemed balance."
earnapp.payout.notes: "Balance held by EarnApp; redeemed to Amazon/Wise/PayPal."
earnapp.collector.credential_hint: "Log in at <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, press F12 → Application → Cookies, copy the <b>oauth-refresh-token</b> value."
earnapp.referral.bonus.referrer: "10% of their earnings for life, paid on top of theirs"
earnapp.rating.cons.0.text: "EarnApp's help centre says installing it in Docker containers, virtual machines, hosting services or home servers is strictly prohibited, which is how CashPilot runs it."
earnapp.rating.cons.1.text: "The same help article says an account found running that way is terminated without notice and its pending payments are cancelled."
earnapp.rating.pros.0.text: "Our PayPal payout arrived in October 2026, about 2% below the redeemed balance."
earnapp.rating.pros.1.text: "A $10 minimum for PayPal and Wise, with auto-redeem that pays out by itself."
earnapp.rating.pros.2.text: "EarnApp belongs to Bright Data, and its PayPal payments arrive from Bright Data Ltd., a named company."
earnfm.description: "Earn.fm pays you for sharing your internet bandwidth. Earnings collector uses email/password auth via Supabase. Lightweight Docker image with straightforward deployment (Docker client uses separate UUID token).\n"
