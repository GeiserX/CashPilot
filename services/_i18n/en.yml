noderr.description: "Noderr Micronodes is the free entry tier of the Noderr Protocol, a DeFi project on Base L2. A micronode is a small agent on a spare Android phone, a Windows PC, a Mac or a Chromium browser. On Android it shares the phone's mobile connection: other Noderr traffic exits through the phone's carrier IP, so it needs a SIM with mobile data. On a PC or in the browser it runs automation tasks for the protocol with spare compute. Rewards are designed to be paid in NODR, scaled by an on-chain uptime and reliability score, but the network is on the Base Sepolia testnet during its beta: node rewards are unfunded and none have been paid yet.\n"
noderr.short_description: "Free micronode (Android connection sharing, Windows, Mac, browser) - testnet, rewards unfunded so far"
noderr.earnings.notes: "Testnet beta: node rewards are unfunded and none have been paid yet. The 5-10% APY on the site is a design target. Revisit when the network leaves Base Sepolia."
noderr.payment.frequency: "On request"
noderr.cashout.notes: "Rewards accrue to the node's own wallet and are claimed from the app or the dApp. During the beta they are Base Sepolia testnet tokens with no market value."
noderr.payout.notes: "The app creates the node wallet on first launch and mints a free soulbound Utility NFT to it. Back up the wallet from the app: losing the device loses the node identity. Rewards are on Base Sepolia (testnet) during the beta."
noderr.requirements.note: "Android needs a SIM with mobile data; the desktop and browser clients publish no IP requirement."
noderr.disclosure.sells: "Depends on the device. An Android phone sells its mobile connection: other Noderr traffic exits through the phone's carrier IP address and counts against its data plan. A Windows PC, a Mac or a browser sells spare compute for what the provider calls social media and content automation tasks."
noderr.disclosure.third_party_traffic: "Yes. On Android, other Noderr traffic exits through your phone's mobile IP address; the app asks for a recorded consent before it starts and you can stop sharing from the same screen. For the Windows, Mac and browser clients the provider describes automation tasks and does not say whether those carry traffic for other people."
noderr.disclosure.data_collected: "The node's wallet address and its uptime and task-completion figures go on-chain as a reputation score (the TrustFingerprint). The provider says tasks are anonymised, run in a sandbox and that wallet keys never leave the device. Nothing more specific is published."
noderr.disclosure.isp_risk: "On Android the shared connection is a carrier mobile plan: the provider's own docs warn that sharing may not be allowed under some carriers' acceptable-use policies, and shared traffic uses the plan's allowance. For the desktop and browser clients the provider says nothing about ISP terms."
noderr.disclosure.account_rules: "One node per device, each with its own soulbound Utility NFT; running several devices is allowed and encouraged. No per-IP limit is published. There is no account in the usual sense: the identity is a wallet the app generates on first launch."
noderr.rating.cons.0.text: "Node rewards are unfunded testnet tokens with no market value, and none have been paid; the 5 to 10% APY on its site is a design target."
noderr.rating.cons.1.text: "For the desktop and browser clients Noderr describes automation tasks and does not say whether they carry other people's traffic."
noderr.rating.cons.2.text: "The provider says tasks are anonymised and sandboxed but publishes nothing more specific."
noderr.rating.cons.3.text: "Still a testnet beta on Base Sepolia."
noderr.rating.cons.4.text: "CashPilot does not run Noderr: you use the provider's own app or extension, so CashPilot cannot deploy or update it for you. Its terms were not checked for containers."
noderr.rating.pros.0.text: "No account: the app generates a wallet on first launch."
nodle.description: "Nodle uses smartphone Bluetooth to create IoT infrastructure. The app passively detects and relays data from nearby IoT devices, earning NODL tokens. Featured in Forbes, enterprise partnerships with Vivendi and Hayden AI. Mobile-only (iOS and Android).\n"
nodle.short_description: "Bluetooth IoT relay - mobile app, NODL token rewards"
nodle.earnings.notes: "Very low earnings. Background phone app using Bluetooth. Wallet connect may be flaky."
nodle.payment.frequency: "Continuous"
nodle.cashout.notes: "NODL lives in the app's own wallet on ZKsync Era; check it in the app or on a ZKsync Era block explorer. Nodle left its Polkadot parachain, and the Polkadot-to-ZKsync bridge closed on 31 December 2025, so NODL still on the Polkadot side can no longer move to ZKsync."
nodle.payout.notes: "Not yet determined: CashPilot has not checked yet where this service keeps your earnings."
nodle.referral.bonus.referrer: "A NODL reward for each new active user who joins through the invite (Nodle does not publish the amount)"
nodle.rating.cons.0.text: "One reviewer reports about $3 earned over three to four years; others report daily earnings falling sharply."
nodle.rating.cons.1.text: "CashPilot does not run Nodle: you use the provider's own phone app, so CashPilot cannot deploy or update it for you. Its terms were not checked for containers."
nosana.description: "Nosana is a decentralized GPU compute marketplace built on Solana. It connects GPU owners with AI workload demand, paying in NOS tokens. An RTX 3060 earns approximately $0.048/hr. The platform focuses on AI inference workloads and uses the Solana blockchain for job scheduling and payment settlement. Nodes run containerized workloads via the Nosana CLI.\n"
nosana.short_description: "GPU compute on Solana - NOS tokens, RTX 3060 ~$0.048/hr"
nosana.earnings.notes: "RTX 3060 ~$0.048/hr, higher-end GPUs earn more. Earnings depend on job availability and GPU model. Requires NVIDIA GPU, Linux, Docker, and Nosana CLI. Payments in NOS token on Solana."
nosana.payment.frequency: "Per job completion"
nosana.cashout.notes: "NOS tokens earned on Solana. Payout to configured wallet."
nosana.payout.notes: "Nosana creates a Solana wallet by default, so most users have never seen its address."
nosana.requirements.min_bandwidth: "50 Mbps"
nosana.requirements.min_storage: "50GB"
nosana.rating.cons.0.text: "Each host must lock a NOS stake sized to its GPU's hourly price."
nosana.rating.cons.1.text: "Hosts are paid in NOS, so dollar earnings move with the token and with demand for their card."
nosana.rating.cons.2.text: "CashPilot does not run Nosana: you use the provider's own host software, so CashPilot cannot deploy or update it for you. Its terms were not checked for containers."
ocean.description: "OCEAN is a Bitcoin mining pool with no account: your miner logs in with your Bitcoin address as its username, and the pool pays that address. CashPilot does not run a miner here. It reads the unpaid balance OCEAN holds for your address, so you see what your ASIC (a Bitaxe, an Antminer) has earned next to your other income. The unpaid balance is earned but not received: OCEAN pays it on-chain once it passes the payout threshold.\n"
ocean.short_description: "Bitcoin mining pool, tracked by your payout address"
ocean.payment.minimum_payout: "0.01048576 BTC"
ocean.payment.frequency: "When a block pays your balance past the threshold"
ocean.cashout.notes: "OCEAN pays on-chain to your address once your unpaid balance reaches the threshold. Lightning payouts (opt-in, BOLT12) are not detected by CashPilot."
ocean.payout.notes: "Unpaid is earned but not received until OCEAN pays it on-chain to this address, unless you turned on Lightning payouts."
ocean.collector.credential_hint: "Your BTC payout address: the username your miner uses on OCEAN, without the <b>.workername</b> part. It is public and unlocks no funds."
ocean.requirements.note: "Needs a Bitcoin ASIC miner (a Bitaxe, an Antminer) pointed at mine.ocean.xyz:3334"
ocean.disclosure.sells: "compute"
ocean.disclosure.third_party_traffic: "No. Your miner sends hashes to the pool; nobody routes traffic through your connection."
ocean.disclosure.data_collected: "Your Bitcoin address, the worker names you choose, your hashrate and your miner's IP address as the pool sees it."
ocean.disclosure.isp_risk: "A miner keeps one connection open to the pool and uses little bandwidth. The cost to watch is electricity, not your ISP."
ocean.disclosure.account_rules: "There is no account. The address is the identity, and anyone can read its stats on ocean.xyz."
ocean.rating.cons.0.text: "Paid in Bitcoin only, and nothing is paid on-chain until your balance reaches 0.01048576 BTC."
ocean.rating.cons.1.text: "A 2% pool fee, or 1% when you build your own block templates with DATUM."
ocean.rating.cons.2.text: "CashPilot does not run a miner for OCEAN: you point your own hardware at the pool, and CashPilot only reads the balance."
ocean.rating.pros.0.text: "No account and no identity check. OCEAN asks only for the Bitcoin address it pays."
packetstream.description: "PacketStream is a peer-to-peer bandwidth marketplace where you can sell your unused bandwidth. It powers a residential proxy network used for market research, SEO monitoring, and ad verification. Simple Docker setup with just a CID (Client ID) required. Note that CAPTCHA-protected login can make automated earnings collection challenging.\n"
packetstream.short_description: "Bandwidth sharing - simple CID-based setup"
packetstream.docker.env.CID.label: "Client ID"
packetstream.docker.env.CID.description: "Log in at <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> → click Setup in the sidebar → your CID is displayed in the Docker command"
packetstream.docker.health_signals.0.means: "PacketStream refuses this copy's IP address as not residential, so it earns nothing. Run it on a box whose internet connection is a home line, or remove this copy."
packetstream.docker.health_signals.1.means: "PacketStream already has another client on this IP address, and it pays only one per IP. Remove this copy, or the other one that shares its IP."
packetstream.earnings.notes: "Pays $0.10/GB for bandwidth shared. Earnings depend heavily on demand for your IP's location."
packetstream.payment.frequency: "On request"
packetstream.cashout.notes: "PayPal only, minimum $5, 3% fee shown before you confirm. The first withdrawal saves your PayPal email; changing it later needs an email confirmation and a 7-day wait, so check the address before you confirm. Requests are reviewed and sent within 7 days; you can cancel one while it waits, and a new one can only be made once it is paid."
packetstream.payout.notes: "Balance held by PacketStream; withdrawn on request."
packetstream.collector.credential_hint: "Log in at <a href='https://packetstream.io' target='_blank'>packetstream.io</a>, press F12 → Application → Cookies, copy the <b>auth</b> cookie value (it’s a JWT)."
packetstream.referral.bonus.referrer: "20% of their bandwidth earnings (limited-time Packeter bonus)"
packetstream.referral.bonus.referee: "10% bonus credit on your first card or PayPal deposit (proxy customers)"
packetstream.rating.cons.0.text: "Trustpilot reviewers in 2025 and 2026 report payouts arriving late or not at all, and one long-time user says payouts slowed and then stopped; others in 2026 report being paid."
packetstream.rating.cons.1.text: "PayPal only, with a 3% cashout fee; users in countries PayPal does not serve have no other method."
packetstream.rating.cons.2.text: "The terms let PacketStream withhold, reverse or invalidate earnings it ties to fraud, manipulation or prohibited activity."
packetstream.rating.cons.3.text: "The terms say proxy customers and PacketStream itself route traffic through your connection; they describe no vetting of ordinary buyers."
packetstream.rating.cons.4.text: "Trustpilot notes PacketStream has not replied to negative reviews; reviewers report unanswered emails."
packetstream.rating.pros.0.text: "PacketStream publishes its own Docker image, packetstream/psclient."
packetstream.rating.pros.1.text: "The terms only require a device and connection you own or may use."
packetstream.rating.pros.2.text: "The terms describe no identity check; a payout needs a PayPal address."
packetstream.rating.pros.3.text: "The terms name PacketStream Inc. under California law."
packetstream.rating.pros.4.text: "PacketStream has run since 2018."
passiveapp.description: "PassiveApp is a DePIN platform that lets you earn crypto and PayPal rewards by sharing unused bandwidth and computing resources. Windows only in practice: the vendor's own download page has listed Android, iOS and Linux as \"coming soon\" unchanged since at least February 2025, and no macOS version exists — despite marketing copy on the same site claiming broader support. No Docker image.\n"
passiveapp.short_description: "DePIN bandwidth/compute - Windows only, crypto and PayPal payouts"
passiveapp.earnings.notes: "Windows desktop app only (v1.0.x); Android/iOS/Linux are vendor-announced 'coming soon' since early 2025 and have never shipped. No official Docker image."
passiveapp.payment.frequency: "On request"
passiveapp.payout.notes: "Not yet determined: CashPilot has not checked yet where this service keeps your earnings."
passiveapp.referral.bonus.referrer: "10% of their earnings for life"
passiveapp.rating.cons.0.text: "CashPilot does not run PassiveApp: you use the provider's own desktop app, so CashPilot cannot deploy or update it for you. Its terms were not checked for containers."
passiveapp.rating.pros.0.text: "PassiveApp's site lists PayPal, crypto and gift cards from a $3 minimum."
proxybase.description: "ProxyBase is a bandwidth-sharing platform that pays users in cryptocurrency for sharing their unused internet connection. You authenticate the peer client with an Access Token from your dashboard. Residential IPs earn the most, but datacenter IPs are also supported. Official multi-arch Docker image (amd64/arm64/armv7).\n"
proxybase.short_description: "proxybase.org - bandwidth sharing, crypto payout, Access Token auth. No wallet is generated"
proxybase.docker.env.ID.label: "Access Token"
proxybase.docker.env.NAME.label: "Device Name"
proxybase.docker.env.ID.description: "Log in at <a href=\"https://peer.proxybase.org/dashboard/login?referral=nXzS3c6iTO\">peer.proxybase.org/dashboard</a> → copy your Access Token (shown in the Docker command on the setup page)"
proxybase.docker.env.NAME.description: "Any name (no spaces) to identify this device in your ProxyBase dashboard"
proxybase.docker.health_signals.0.means: "ProxyBase has not reached its relay for at least half an hour, so it earns nothing. A restart clears this; if it stays after a restart, check that this box can reach the internet."
proxybase.earnings.notes: "Crypto payouts. Earnings depend on location and bandwidth usage."
proxybase.payment.frequency: "On request"
proxybase.cashout.notes: "The site lists a $0.20 minimum, and a request under $1 went through in October 2026. A request always withdraws the full balance, as USDC on Polygon, POL or Litecoin, to an address you type in. ProxyBase covers the network fee."
proxybase.payout.notes: "Earnings accrue to the ProxyBase ACCOUNT the Access Token belongs to, and are withdrawn from the dashboard on request. The peer client holds no wallet and the container keeps no state -- docker.volumes is empty. Not to be confused with proxybase-xyz (ProxyBase Markets, same org), which genuinely does mint a local wallet and declares it a critical volume."
proxybase.rating.cons.0.text: "ProxyBase itself wrote in August 2025 that it is new and not yet the place to maximise earnings."
proxybase.rating.cons.1.text: "ProxyBase switched peer clients in 2026 and shut the old backend, so containers on the old image kept running and stopped earning."
proxybase.rating.cons.2.text: "Crypto only, as USDC on Polygon, POL or Litecoin, with no fiat method. The minimum is $0.20 and ProxyBase pays the network fee."
proxybase.rating.pros.0.text: "Our withdrawal of under $1 went through in October 2026."
proxybase.rating.pros.1.text: "A withdrawal needs only an address typed into the request."
proxybase.rating.pros.2.text: "ProxyBase publishes its own peer client image and supports datacentre IPs."
proxybase-xyz.description: "ProxyBase Markets is a SOCKS5 proxy marketplace built for AI agents. Sellers run a lightweight Rust CLI daemon that connects via WebSocket to relay buyer traffic through their internet connection, earning USDC on Tempo Chain per GB sold. Supports both direct (own bandwidth) and upstream (resell external proxies) modes with auto-reconnect. Buyers purchase proxy sessions by country, ISP, and bandwidth. Payments flow through the Machine Payments Protocol (MPP) on Tempo Chain. The referral link is for buyers: a buyer who opens the console through it gets 10% extra on their first deposit.\n"
proxybase-xyz.short_description: "proxybase.xyz - SOCKS5 marketplace for AI agents, USDC payout. Generates a wallet whose volume holds the only copy of the key"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label: "Backend API URL"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description: "Override the backend API URL (defaults to https://api.proxybase.xyz)"
proxybase-xyz.docker.setup: "The container auto-bootstraps on first start: generates a secp256k1 wallet (BIP-39), authenticates via ECDSA challenge-response, and starts selling bandwidth in direct-only mode. All state (wallet, session token, seller config) is persisted in the <code>proxybase-data</code> volume. Check container logs on first run for the wallet address. Use <code>--upstream</code> to add external proxy resell paths.\n"
proxybase-xyz.docker.critical_volumes.0.holds: "The generated wallet keyfile. This volume IS the money: there is no server-side copy, so deleting it destroys the funds with it."
proxybase-xyz.earnings.notes: "Earnings based on GB sold at market rates. VPS/datacenter IPs earn less than residential. Multi-upstream mode can combine your own bandwidth with external proxies."
proxybase-xyz.payment.frequency: "On request"
proxybase-xyz.cashout.notes: "Lock earnings via <code>proxybase-cli seller payout create</code>, received as USDC on Tempo Chain (Tempo MPP). Pays to any EVM address whose key you hold (Tempo is an EVM chain), with nothing to sign; add the Tempo network to the wallet to see the USDC. A wallet that still does not list it needs the Tempo USDC token added by hand: import it by the contract address Proxybase gives, and check that address before you trust the balance."
proxybase-xyz.payout.notes: "The client creates its own wallet on first run."
proxybase-xyz.referral.bonus.referrer: "15% of every deposit a referred buyer makes, as credit for your own proxy sessions"
proxybase-xyz.referral.bonus.referee: "+10% on a buyer's first deposit"
proxybase-xyz.disclosure.sells: "Bandwidth, as a SOCKS5 proxy sold to buyers on the ProxyBase marketplace."
proxybase-xyz.disclosure.third_party_traffic: "Yes. Buyers route their traffic through your connection — that is exactly what is being sold."
proxybase-xyz.disclosure.data_collected: "A wallet address generated on your machine, plus the traffic volume you relay."
proxybase-xyz.disclosure.isp_risk: "Real, and it applies directly to home connections. Proxy traffic from unknown buyers exits under your IP, so abuse complaints arrive at your door. Nothing in this catalog restricts the service to datacentre addresses, and residential IPs earn more, so the incentive points the wrong way here: read your ISP's terms before running it at home."
proxybase-xyz.disclosure.account_rules: "unknown - the provider does not publish a per-account or per-IP device limit, and the catalog does not declare one."
proxybase-xyz.rating.cons.0.text: "Payouts are USDC on Tempo Chain, to any EVM address whose key you hold."
proxybase-xyz.rating.cons.1.text: "Your connection is sold as a SOCKS5 proxy to marketplace buyers; we found no description of how buyers are checked."
proxybase-xyz.rating.pros.0.text: "Its own earn page is titled as needing no KYC, with a $1 payout."
proxybase-xyz.rating.pros.1.text: "ProxyBase publishes its own client image and accepts datacentre connections."
proxylite.description: "ProxyLite monetizes your internet traffic by sharing bandwidth with verified organizations. Works on both residential and VPS/datacenter connections. Simple setup requiring only a user ID from the dashboard. Offers a generous 15% lifetime referral commission.\n"
proxylite.short_description: "Bandwidth sharing - 15% lifetime referral, works on VPS"
proxylite.docker.env.USER_ID.label: "User ID"
proxylite.docker.env.USER_ID.description: "Log in at <a href=\"https://lk.proxylite.ru\">lk.proxylite.ru</a> → your User ID is shown on the main dashboard page next to your email. Need an account? Sign up with <a href=\"https://proxylite.ru/?r=KMUPRZIZ\">proxylite.ru/?r=KMUPRZIZ</a>"
proxylite.earnings.notes: "Residential IPs earn more. VPS/datacenter connections accepted at lower rates."
proxylite.payment.frequency: "On request"
proxylite.payout.notes: "Not yet determined: CashPilot has not checked yet where this service keeps your earnings."
proxylite.referral.bonus.referrer: "15% of their earnings for life"
proxylite.rating.cons.0.text: "The site's owner is hidden in its domain records, and we found no named company behind it."
proxylite.rating.pros.0.text: "A $5 minimum, by crypto or PayPal."
proxylite.rating.pros.1.text: "ProxyLite publishes a Docker image, proxylite/proxyservice, and accepts datacentre connections at a lower rate."
proxyrack.description: "ProxyRack's Peer program lets you earn by sharing your bandwidth as part of their proxy network. Each device requires a unique 64-character hex UUID and optionally an API key to auto-register the device. Works on both residential and VPS/datacenter connections. Dashboard is behind Cloudflare, which may require manual browser-based API key retrieval.\n"
proxyrack.short_description: "Bandwidth sharing - UUID per device, works on VPS"
proxyrack.docker.env.UUID.label: "Device UUID"
proxyrack.docker.env.API_KEY.label: "API Key"
proxyrack.docker.env.DEVICE_NAME.label: "Device name"
proxyrack.docker.env.UUID.description: "Unique 64-character hex ID per device. Generate with: cat /dev/urandom | tr -dc 'a-f0-9' | fold -w 64 | head -n 1"
proxyrack.docker.env.API_KEY.description: "Log in at <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → API Key is shown on the main dashboard page (auto-registers device if provided). Need an account? Sign up with <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
proxyrack.docker.env.DEVICE_NAME.description: "Friendly name for the device in dashboard"
proxyrack.docker.health_signals.0.means: "ProxyRack's client cannot run on this copy, so it earns nothing. The usual cause is that ProxyRack's update server is not answering, and the client cannot start without it. The copy tries again every 5 minutes and starts by itself once the server answers. There is nothing to fix on your side."
proxyrack.docker.health_signals.1.means: "ProxyRack's client did not download when this copy started, because ProxyRack's update server could not be reached, so the copy runs but earns nothing. CashPilot restarts it every 6 hours to try again. Redeploy it to give it CashPilot's own start, which keeps the client and tries again every 5 minutes by itself."
proxyrack.device_link.steps: "Sign in to ProxyRack, open Devices, choose Add device and paste this UUID. Until the device is on your account it earns for nobody. If you entered an API key, the container registers itself: check the device is listed there."
proxyrack.earnings.notes: "Residential IPs earn more than datacenter. Dashboard behind Cloudflare may complicate automated access."
proxyrack.payment.frequency: "On request"
proxyrack.cashout.notes: "Request the payout on the dashboard. ProxyRack reviews it within 72 hours, then Tremendous emails you a reward to redeem as PayPal, a gift card or a wire transfer. There is no crypto option."
proxyrack.payout.notes: "Balance held by ProxyRack; withdrawn on request."
proxyrack.collector.credential_hint: "Log in at <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, press F12 → Network, find any API request and copy the <b>Api-Key</b> header value. Need an account? Sign up with <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
proxyrack.requirements.note: "Proxyrack documents a 500-device limit per ACCOUNT and no per-IP limit. Datacentre IPs are accepted but reclassified to a lower rate."
proxyrack.rating.cons.0.text: "ProxyRack's help centre says removing a device takes that device's earnings off your account, and they come back only if the same device is added again."
proxyrack.rating.pros.0.text: "ProxyRack publishes its own Docker image, proxyrack/pop, and accepts datacentre IPs at a lower rate."
repocket.description: "Repocket lets you earn passive income by sharing your unused internet bandwidth. Residential IPs earn the most; VPS/datacenter IPs are accepted at lower rates. Max 5 devices and 5 active sessions per account. The Docker container authenticates with your account email and an API key from the Repocket dashboard (not your password).\n"
repocket.short_description: "Bandwidth sharing - max 5 devices, API key auth"
repocket.docker.env.RP_EMAIL.label: "Email"
repocket.docker.env.RP_API_KEY.label: "API Key (UUIDv4, not your password)"
repocket.docker.env.RP_EMAIL.description: "Your Repocket account email"
repocket.docker.env.RP_API_KEY.description: "Your Repocket API key — log in at <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> and copy the API key shown on the bandwidth-earnings page (this is NOT your account password). Need an account? Sign up with <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
repocket.earnings.notes: "Residential IPs earn more. VPS/datacenter IPs accepted but at lower rates."
repocket.payment.minimum_payout: "$4 ($2 after the first payout)"
repocket.payment.frequency: "On request"
repocket.cashout.notes: "Repocket sets the minimum per account: $4 before the first payout and $2 after it in October 2026, far below the $20 it used to advertise. Methods: Tremendous (to your email) or USDT on Polygon. Each request is confirmed from an emailed link within 2 hours, and only one request can be pending at a time. In October 2026 Repocket refused a Tremendous request with \"Please, message support\", while USDT on Polygon went through."
repocket.payout.notes: "Balance held by Repocket; withdrawn on request."
repocket.collector.credential_hint: "Use your Repocket account email and password (same as <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Need an account? Sign up with <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
repocket.referral.bonus.referrer: "$2 once the referee has earned $7, then 5% of their earnings for life"
repocket.referral.bonus.referee: "$2 wallet bonus on sign-up"
repocket.requirements.note: "Repocket documents a five-device limit per ACCOUNT but publishes no per-IP device limit. The '2 devices per IP' figure repeated on review sites has no provider source, so CashPilot does not assert it."
repocket.obligations.avoid-12-month-dormancy.title: "Keep a Repocket device sharing, or withdraw your balance"
repocket.obligations.avoid-12-month-dormancy.loss: "After 12 months with no login, payout or bandwidth sharing, Repocket may forfeit the unpaid balance."
repocket.obligations.avoid-12-month-dormancy.how: "Keep a device sharing, sign in, or withdraw. If you stop using Repocket, withdraw first."
repocket.rating.cons.0.text: "Several Trustpilot reviewers report cancelled payouts and balances reset to zero; one says support cited irregular bandwidth earnings. The page rates Repocket 2.7 and notes it has not replied to negative reviews."
repocket.rating.cons.1.text: "Reviewers report rejected withdrawals and having to chase payment."
repocket.rating.cons.2.text: "Repocket's payment policy lets it reverse, cancel or permanently forfeit earnings whenever it suspects they are invalid, and forfeit the unpaid earnings of a dormant account."
repocket.rating.cons.3.text: "The same policy lets Repocket add, remove or replace payout methods at any time without notice; PayPal was removed."
repocket.rating.cons.4.text: "The terms say Repocket may require identity or account verification at any time, and payout eligibility depends on it."
repocket.rating.cons.5.text: "The terms say Repocket and its partners use the network capacity, but do not say who the partners are or how they are vetted."
repocket.rating.cons.6.text: "Trustpilot notes Repocket has not replied to negative reviews, and reviewers say messages are ignored."
repocket.rating.cons.7.text: "The current terms name Repocket Pte. Ltd. in Singapore; older terms named no company."
repocket.rating.pros.0.text: "Repocket publishes its own Docker image, repocket/repocket, and its terms allow containers you own."
repocket.rating.pros.1.text: "The minimum is low: $4 before the first payout and $2 after it."
salad.description: "Salad.io lets you share your GPU for distributed AI workloads and earn Salad balance redeemable for gift cards, games, or cash. Windows only with a native desktop application. Requires a dedicated GPU (NVIDIA or AMD). The platform routes AI inference, rendering, and other compute tasks to your machine when idle. One of the more user-friendly GPU sharing platforms.\n"
salad.short_description: "GPU sharing for AI - Windows only, gift card or cash payout"
salad.earnings.notes: "Earnings depend on GPU model and availability of work. RTX 3060 ~$1-3/day. Windows only. Native app, no Docker support. Redeemable for gift cards, games, or PayPal."
salad.payment.frequency: "On request"
salad.cashout.notes: "PayPal or gift cards via Salad storefront."
