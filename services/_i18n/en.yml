traffmonetizer.description: "Traffmonetizer lets you monetize your internet traffic by sharing bandwidth with verified businesses. One of the few bandwidth-sharing services that works well on VPS and datacenter IPs in addition to residential connections. Uses a simple token-based authentication passed via command-line arguments. Supports ARM architectures for Raspberry Pi and similar devices.\n"
traffmonetizer.short_description: "Bandwidth sharing - works on VPS, token-based auth"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label: "Token"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label: "Device name"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description: "Log in at <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, press F12 → Application → Local Storage → click <code>https://app.traffmonetizer.io</code> → copy the <code>authToken</code> value (about 54 characters, digits, a <code>|</code>, then letters and digits)"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description: "Name displayed in dashboard for device management"
traffmonetizer.earnings.notes: "VPS and datacenter IPs earn less than residential. US/EU locations earn more. Multiple IPs supported via Docker networks."
traffmonetizer.payment.frequency: "On request"
traffmonetizer.cashout.notes: "Minimum $10. PayPal is no longer offered. Save one payout method in the profile first: USDT on Solana or TON (lowest fees), Arbitrum (low fees) or Tron TRC20 (high network fees), or a bank transfer from $1,000. The first address you save applies at once; changing it later needs an email confirmation. The dashboard may ask for a messenger contact (WhatsApp, Telegram or Skype) before the first withdrawal. A request pays whole dollars and the cents stay in the balance."
traffmonetizer.payout.notes: "USDT on the chain saved in the profile's payout settings (Solana, TON, Arbitrum or Tron), or a bank transfer. The address lives in Traffmonetizer's settings, not on the container."
traffmonetizer.collector.credential_hint: "Log in at <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, press F12 → Application → Local Storage → <b>authToken</b> value (about 54 characters, digits, a <code>|</code>, then letters and digits)."
traffmonetizer.referral.bonus.referrer: "10% of every payout they request"
traffmonetizer.requirements.note: "Traffmonetizer ToS requires residential IP, but VPS nodes are accepted in practice."
traffmonetizer.rating.cons.0.text: "Trustpilot rates it 1.9; reviewers from 2023 to November 2026 report payouts pending for weeks, or marked completed with no matching transaction."
traffmonetizer.rating.cons.1.text: "The same reviewers report live chat and email support not answering, sometimes for weeks."
traffmonetizer.rating.cons.2.text: "Crypto or a bank wire from $1,000 only; PayPal is gone, and a request pays whole dollars only."
traffmonetizer.rating.cons.3.text: "Traffmonetizer's terms require a residential IP, so a server on a hosting connection is outside them."
traffmonetizer.rating.cons.4.text: "Four Trustpilot reviewers from 2023 to 2025 report very slow earnings, such as one cent a day across four devices, or almost two years to reach $10."
traffmonetizer.rating.pros.0.text: "A payout needs only a saved crypto address confirmed by email; the dashboard may ask for a messenger contact."
traffmonetizer.rating.pros.1.text: "Traffmonetizer publishes its own Docker image, traffmonetizer/cli_v2."
unmineable.description: "Mine with your CPU and get paid in the coin you choose, such as SHIB, DOGE or XMR. CashPilot runs XMRig against unMineable's RandomX pool, and unMineable converts the Monero your CPU mines into your coin. It pays your public address once your balance reaches the coin's payment threshold. Every worker CashPilot deploys carries CashPilot's unMineable referral code, which lowers your platform fee from 1% to 0.75%. Electricity can cost more than you earn."
unmineable.short_description: "Mine with your CPU and get paid in the coin you choose"
unmineable.docker.env.PAYOUT_COIN.label: "Payout coin"
unmineable.docker.env.WALLET.label: "Payout address"
unmineable.docker.env.WORKER_NAME.label: "Worker name"
unmineable.docker.env.CPU_PERCENT.label: "Max CPU threads (%)"
unmineable.docker.env.RANDOMX_MODE.label: "RandomX mode"
unmineable.docker.env.PAYOUT_COIN.description: "Ticker of a coin unMineable pays, such as SHIB, DOGE or XMR"
unmineable.docker.env.WALLET.description: "Your public address for that coin. Coins that need a memo or tag are not supported."
unmineable.earnings.notes: "Gross estimate before electricity, paid in your coin at unMineable's conversion rate. On 2026-11-25, 1 kH/s of RandomX was worth about $1 a month. A desktop CPU at half its threads can draw 30 to 50 W extra. Check your actual usage and electricity price to see if it pays."
unmineable.payment.minimum_payout: "Set per coin by unMineable (0.03 XMR on 2026-11-26)"
unmineable.payment.frequency: "When the coin's payment threshold is reached"
unmineable.cashout.notes: "unMineable pays your address once your balance reaches the coin's payment threshold. Thresholds differ by coin and network; CashPilot reads the one unMineable reports for your address."
unmineable.payout.notes: "The balance is earned but not received until unMineable pays it to this address. The chain depends on the coin you choose."
unmineable.collector.credential_hint: "The same payout address and coin ticker you deployed the miner with, for example <b>XMR</b>. Enter the address alone, without the coin, worker name or referral code. It is public and unlocks no funds."
unmineable.referral.bonus.referrer: "0.25% of each referred miner's mining rewards"
unmineable.referral.bonus.referee: "Platform fee lowered from 1% to 0.75%"
unmineable.requirements.hosting_note: "This machine reports a hosting connection. Check your provider's terms before mining. Some providers, including Hetzner Cloud, prohibit it. Check your actual power costs before relying on a profit estimate."
unmineable.mining.pool_fee_note: "unMineable charges a 1% platform fee. CashPilot adds its referral code (#awk6-j1z0) after every worker name, which lowers your fee to 0.75%. unMineable then pays CashPilot's maintainer 0.25% of your mining rewards; you keep 99.25%. Each coin has its own payment threshold, for example 0.03 XMR."
unmineable.disclosure.sells: "compute"
unmineable.disclosure.third_party_traffic: "No. The miner sends work to unMineable's pool."
unmineable.disclosure.data_collected: "Your payout address, coin, worker name, hashrate and IP address go to unMineable."
unmineable.disclosure.isp_risk: "Some networks and DNS resolvers block mining pool connections."
unmineable.disclosure.account_rules: "No account is needed. The address and coin are the identity, and anyone can read their stats on unmineable.com."
unmineable.rating.cons.0.text: "unMineable keeps a 0.75% platform fee with the referral code and pays only from each coin's threshold."
unmineable.rating.cons.1.text: "Some hosting providers prohibit cryptocurrency mining."
unmineable.rating.cons.2.text: "The extra electricity can cost more than the coins earned."
unmineable.rating.cons.3.text: "Address stats, including the balance, are public to anyone who knows the address."
unmineable.rating.pros.0.text: "The miner sends hashes to the pool and does not relay anyone else's traffic."
unmineable.rating.pros.1.text: "You can mine to a public address in the coin you choose without creating an account."
uprock.description: "Uprock is a DePIN (Decentralized Physical Infrastructure Network) platform that lets you earn cryptocurrency by sharing your internet connection. Part of the broader Web3 ecosystem. Community Docker images available but no official image. Browser extension is the primary interface.\n"
uprock.short_description: "DePIN internet sharing - crypto payout, browser extension primary"
uprock.earnings.notes: "Crypto/token-based earnings. No official Docker image — browser extension is the primary client."
uprock.payment.minimum_payout: "250 UPT"
uprock.payment.frequency: "On request"
uprock.cashout.notes: "UPT tokens, withdrawn to a Solana wallet from 250 UPT, with two-factor authentication on. A withdrawal fee applies."
uprock.payout.notes: "Not yet determined: CashPilot has not checked yet where this service keeps your earnings."
uprock.rating.cons.0.text: "UpRock's help centre says withdrawals are UPT tokens to a Solana wallet, with a 250 UPT minimum."
uprock.rating.cons.1.text: "Rewards are UPT tokens; reviewers and a third-party review say their value is very low."
uprock.rating.cons.2.text: "CashPilot does not run UpRock: you use the provider's own app or extension, so CashPilot cannot deploy or update it for you. Its terms were not checked for containers."
urnetwork.description: "URnetwork is a decentralized VPN and bandwidth-sharing network. You earn by providing bandwidth as a community provider. The provider binary authenticates itself with your account email and password (its auth-provide subcommand) and stores the resulting session JWT in the data volume. Official Docker image from BringYour, Inc.\n"
urnetwork.short_description: "Decentralized VPN/bandwidth - email+password auth, JWT session in volume"
urnetwork.docker.env.UR_USER_AUTH.label: "Email"
urnetwork.docker.env.UR_PASSWORD.label: "Password"
urnetwork.docker.env.UR_USER_AUTH.description: "Your URnetwork account email (the login you use at <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Accounts created via Google/Apple sign-in need a password set first. Need an account? Sign up with <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
urnetwork.docker.env.UR_PASSWORD.description: "Your URnetwork account password (no spaces). Used by the provider's auth-provide login; the session then persists in the data volume."
urnetwork.earnings.notes: "Works on VPS and residential. Paid in SN25α (Bittensor subnet 25) per weekly epoch since 2026-10-06. Supports proxy mode for multi-IP setups."
urnetwork.payment.frequency: "Epoch-based"
urnetwork.payout.notes: "Set a Bittensor coldkey on ur.io/app/account/earnings (signed with Talisman, TAO.com or a WalletConnect wallet), then claim each finalized epoch. A claim pays gas in TAO from an EVM gas key. UNCLAIMED EPOCHS EXPIRE, and the old USDC payouts were canceled when no wallet was linked within 30 days."
urnetwork.referral.bonus.referrer: "3 GiB a day of free UR data per friend, up to 20 friends (data, not money)"
urnetwork.referral.bonus.referee: "3 GiB a day of free UR data once you use at least 10 MiB through the app on 2 days within 90 days of joining; otherwise the referral ends"
urnetwork.rating.cons.0.text: "Unclaimed epochs expire, and the old USDC payouts were cancelled for networks with no wallet linked within 30 days."
urnetwork.rating.cons.1.text: "Since October 2026 rewards are paid in SN25α, a Bittensor subnet token, and each claim costs gas in TAO."
urnetwork.rating.cons.2.text: "URnetwork was formerly BringYour; its archived whitepaper carries the old name."
urnetwork.rating.pros.0.text: "URnetwork publishes the source code of its provider client."
urnetwork.rating.pros.1.text: "URnetwork publishes its own Docker image, bringyour/community-provider, and works on VPS and residential connections."
urnetwork.rating.pros.2.text: "A claim needs only a Bittensor wallet you control."
vast-ai.description: "Vast.ai is a GPU cloud marketplace where you rent out your NVIDIA GPU to AI/ML researchers and developers. Docker-native platform where you set your own hourly prices. An RTX 3090 typically earns $0.20-0.40/hr when rented. Requires an NVIDIA GPU with recent drivers and a stable internet connection. Revenue depends heavily on GPU model, pricing strategy, and market demand.\n"
vast-ai.short_description: "GPU marketplace - set your own prices, RTX 3090 ~$0.20-0.40/hr"
vast-ai.docker.env.VAST_API_KEY.label: "API Key"
vast-ai.docker.env.VAST_API_KEY.description: "Vast.ai host API key from dashboard"
vast-ai.earnings.notes: "RTX 3090 ~$0.20-0.40/hr, RTX 4090 ~$0.40-0.80/hr when rented. Utilization varies. Requires NVIDIA GPU, Linux host, Docker, and nvidia-container-toolkit. Set your own pricing."
vast-ai.payment.frequency: "Weekly (Fridays)"
vast-ai.cashout.notes: "Earnings accumulate in Vast.ai balance. Withdraw via Wise, PayPal or Stripe."
vast-ai.payout.notes: "Not yet determined: CashPilot has not checked yet where this service keeps your earnings."
vast-ai.referral.bonus.referrer: "3% of what referred renters spend, for the life of their account, as referral credits; up to 75% can be cashed out from a dedicated referral account"
vast-ai.requirements.min_bandwidth: "100 Mbps"
vast-ai.requirements.min_storage: "100GB"
vast-ai.rating.cons.0.text: "A host earns only while rented, and Vast's own figures for a consumer GPU depend on rental type and reliability score."
vast-ai.rating.cons.1.text: "CashPilot does not run Vast.ai: you install Vast's host software on your own GPU machine, so CashPilot cannot deploy or update it for you. Vast builds hosting around Docker on a Linux host."
vast-ai.rating.pros.0.text: "Vast says the rate a host sets is the rate it receives, with no fee deducted."
vast-ai.rating.pros.1.text: "Payouts go by Wise, PayPal or Stripe from a $20 minimum, invoiced weekly; a smaller balance rolls forward to the next week."
wipter.description: "Wipter is a bandwidth sharing platform available on Windows, Mac, Linux, and Android. It claims to pay up to $1/GB of shared bandwidth with a minimum payout threshold of $20. The platform operates similarly to traditional bandwidth sharing apps, routing legitimate traffic through residential connections.\n"
wipter.short_description: "Bandwidth sharing - claims up to $1/GB, min payout $20"
wipter.earnings.notes: "Claims up to $1/GB but real-world earnings are lower. Minimum payout $20. Earnings vary heavily by location and demand."
wipter.payment.frequency: "On request"
wipter.cashout.notes: "Wipter has no web dashboard. Open the Wipter desktop or phone app, sign in, and request the payout there once the balance reaches $20. Wipter pays only in USDT on BNB Smart Chain (BEP20), to the wallet you set in the app's Payments section; there is no PayPal option."
wipter.payout.notes: "Not yet determined: CashPilot has not checked yet where this service keeps your earnings."
wipter.referral.bonus.referrer: "10% of their traffic earnings once they reach the payout minimum, for as many friends as you refer"
wipter.referral.bonus.referee: "$5 sign-up bonus"
wipter.rating.cons.0.text: "CashPilot does not run Wipter: you use the provider's own desktop or phone app, so CashPilot cannot deploy or update it for you. Its terms were not checked for containers."
xmrig.description: "Mine Monero with your CPU. CashPilot runs XMRig, and your chosen pool pays Monero to your public payout address. XMRig uses 1% of hashing time to support its developers. Electricity can cost more than the XMR you earn."
xmrig.short_description: "Mine Monero with your CPU and your choice of pool"
xmrig.docker.env.WALLET.label: "Monero address"
xmrig.docker.env.POOL_URL.label: "Pool"
xmrig.docker.env.WORKER_NAME.label: "Worker name"
xmrig.docker.env.CPU_PERCENT.label: "Max CPU threads (%)"
xmrig.docker.env.RANDOMX_MODE.label: "RandomX mode"
xmrig.earnings.notes: "Gross estimate before electricity. On 2026-11-25, 1 kH/s was worth about $1 a month at the observed XMR price and network difficulty. A desktop CPU at half its threads can draw 30 to 50 W extra. Check your actual usage and electricity price to see if it pays."
xmrig.payment.minimum_payout: "0.003 XMR (MoneroOcean, after you lower it)"
xmrig.payment.frequency: "When the pool threshold is reached"
xmrig.cashout.notes: "The pool pays your Monero address when your balance reaches your threshold. The pool holds the balance until it pays you."
xmrig.requirements.hosting_note: "This machine reports a hosting connection. Check your provider's terms before mining. Some providers, including Hetzner Cloud, prohibit it. Check your actual power costs before relying on a profit estimate."
xmrig.mining.pool_fee_note: "MoneroOcean, the default pool, charges a 0% mining fee. The default payout threshold is 0.3 XMR, and you can lower it to 0.003 XMR. Payouts below 4 XMR can cost up to 0.0004 XMR. Other pools set their own rates and thresholds."
xmrig.disclosure.sells: "compute"
xmrig.disclosure.third_party_traffic: "No. The miner sends work to mining pools."
xmrig.disclosure.data_collected: "Your Monero address, worker name and IP address go to the pool."
xmrig.disclosure.isp_risk: "Some networks and DNS resolvers block mining pool connections."
xmrig.disclosure.account_rules: "Most Monero pools identify you by your public payout address."
xmrig.rating.cons.0.text: "A payout requires enough XMR to meet your pool threshold."
xmrig.rating.cons.1.text: "Some hosting providers prohibit cryptocurrency mining."
xmrig.rating.cons.2.text: "The extra electricity can cost more than the XMR earned."
xmrig.rating.pros.0.text: "The miner sends hashes to pools and does not relay anyone else's traffic."
xmrig.rating.pros.1.text: "The miner is open source and the image pins a signed upstream release."
xmrig.rating.pros.2.text: "You can mine with a public Monero address without identifying yourself by name."
