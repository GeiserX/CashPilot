flux.description: "Flux is a globally distributed compute infrastructure. Node operators stake FLUX tokens and provide server resources. Three tiers: Cumulus (1,000 FLUX), Nimbus (12,500 FLUX), Stratus (40,000 FLUX). Official Docker images available.\n"
