proxyrack.description:
  text: "El programa Peer de ProxyRack te permite ganar dinero compartiendo tu ancho de banda como parte de su red de proxies. Cada dispositivo necesita un UUID hexadecimal único de 64 caracteres y, opcionalmente, una clave de API para registrarlo automáticamente. Funciona tanto con conexiones residenciales como de VPS/centros de datos. El panel está detrás de Cloudflare, por lo que puede que tengas que obtener la clave de API a mano desde el navegador.\n"
