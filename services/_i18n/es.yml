  text: "Retira tu saldo de Honeygain"
  source: "0868662c5a12"
honeygain.obligations.keep-active-6-months.title:
  text: "Mantén un dispositivo de Honeygain compartiendo, o pide un pago"
  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "Las ganancias siguen siendo válidas durante 24 meses después de llegar al mínimo de $20. Después, Honeygain puede anular lo que no se haya pagado."
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
