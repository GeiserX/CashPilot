  source: "be820103712e"
proxyrack.cashout.notes:
  text: "Solicita el pago en el panel. ProxyRack lo revisa en un plazo de 72 horas y después Tremendous te envía por correo una recompensa que puedes canjear por PayPal, una tarjeta regalo o una transferencia bancaria. No hay opción en cripto."
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "Saldo en poder de ProxyRack; se retira bajo petición."
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "Inicia sesión en <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, pulsa F12 → Network, busca cualquier petición a la API y copia el valor de la cabecera <b>Api-Key</b>. ¿No tienes cuenta? Regístrate con <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "Proxyrack documenta un límite de 500 dispositivos por CUENTA y ningún límite por IP. Las IP de centros de datos se aceptan, pero se reclasifican a una tarifa más baja."
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "El centro de ayuda de ProxyRack dice que eliminar un dispositivo quita de tu cuenta las ganancias de ese dispositivo, y que solo vuelven si se añade de nuevo el mismo dispositivo."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack publica su propia imagen de Docker, proxyrack/pop, y acepta IP de centros de datos con una tarifa más baja."
  source: "278541f81053"
repocket.description:
  text: "Repocket te permite obtener ingresos pasivos compartiendo el ancho de banda de internet que no usas. Las IP residenciales son las que más ganan; las IP de VPS/centros de datos se aceptan con tarifas más bajas. Máximo 5 dispositivos y 5 sesiones activas por cuenta. El contenedor de Docker se autentica con el correo de tu cuenta y una clave de API del panel de Repocket (no con tu contraseña).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Ancho de banda compartido: máximo 5 dispositivos, autenticación con clave de API"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "Correo electrónico"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "Clave de API (UUIDv4, no tu contraseña)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "El correo de tu cuenta de Repocket"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Tu clave de API de Repocket: inicia sesión en <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> y copia la clave de API que aparece en la página bandwidth-earnings (NO es la contraseña de tu cuenta). ¿No tienes cuenta? Regístrate con <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "Las IP residenciales ganan más. Se aceptan IP de VPS/centros de datos, pero con tarifas más bajas."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 después del primer pago)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket fija el mínimo por cuenta: $4 antes del primer pago y $2 después, en octubre de 2026, muy por debajo de los $20 que anunciaba antes. Métodos: Tremendous (a tu correo) o USDT en Polygon. Cada solicitud se confirma desde un enlace enviado por correo en un plazo de 2 horas, y solo puede haber una solicitud pendiente a la vez. En octubre de 2026, Repocket rechazó una solicitud por Tremendous con \"Please, message support\", mientras que una en USDT en Polygon se completó."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Saldo en poder de Repocket; se retira bajo petición."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Usa el correo y la contraseña de tu cuenta de Repocket (los mismos que en <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). ¿No tienes cuenta? Regístrate con <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2 cuando el referido haya ganado $7, y después el 5% de sus ganancias de por vida"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "Bono de $2 en la billetera al registrarte"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket documenta un límite de cinco dispositivos por CUENTA, pero no publica ningún límite de dispositivos por IP. La cifra de '2 dispositivos por IP' que repiten los sitios de reseñas no tiene ninguna fuente del proveedor, así que CashPilot no la afirma."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Mantén un dispositivo de Repocket compartiendo, o retira tu saldo"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Tras 12 meses sin iniciar sesión, sin pagos y sin compartir ancho de banda, Repocket puede anular el saldo pendiente."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Mantén un dispositivo compartiendo, inicia sesión o retira. Si dejas de usar Repocket, retira antes."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Varias reseñas de Trustpilot cuentan pagos cancelados y saldos puestos a cero; una dice que el soporte alegó ganancias irregulares por ancho de banda. La página da a Repocket un 2.7 e indica que no ha contestado a las reseñas negativas."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Algunos usuarios cuentan retiros rechazados y que tuvieron que insistir para cobrar."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "La política de pagos de Repocket le permite revertir, cancelar o anular para siempre las ganancias siempre que sospeche que no son válidas, y anular las ganancias pendientes de una cuenta inactiva."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "La misma política permite a Repocket añadir, quitar o sustituir métodos de pago en cualquier momento y sin aviso; PayPal se eliminó."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Las condiciones dicen que Repocket puede exigir una verificación de identidad o de la cuenta en cualquier momento, y que el derecho a cobrar depende de ella."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Las condiciones dicen que Repocket y sus socios usan la capacidad de la red, pero no dicen quiénes son los socios ni cómo se les verifica."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot indica que Repocket no ha contestado a las reseñas negativas, y los usuarios dicen que sus mensajes se ignoran."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "Las condiciones actuales nombran a Repocket Pte. Ltd., en Singapur; las condiciones anteriores no nombraban ninguna empresa."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket publica su propia imagen de Docker, repocket/repocket, y sus condiciones permiten contenedores que sean tuyos."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "El mínimo es bajo: $4 antes del primer pago y $2 después."
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io te permite compartir tu GPU para cargas de trabajo de IA distribuidas y ganar saldo de Salad canjeable por tarjetas regalo, juegos o dinero. Solo Windows, con una aplicación de escritorio nativa. Requiere una GPU dedicada (NVIDIA o AMD). La plataforma envía a tu máquina tareas de inferencia de IA, renderizado y otros trabajos de cómputo cuando está inactiva. Es una de las plataformas para compartir GPU más fáciles de usar.\n"
  source: "09335baccea6"
salad.short_description:
  text: "GPU compartida para IA: solo Windows, pago en tarjetas regalo o dinero"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Las ganancias dependen del modelo de GPU y del trabajo disponible. RTX 3060 ~$1-3/día. Solo Windows. App nativa, sin soporte para Docker. Canjeable por tarjetas regalo, juegos o PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal o tarjetas regalo en la tienda de Salad."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Solo PayPal y tarjetas regalo, nunca cripto. No existe ninguna dirección de billetera, así que CashPilot no tiene ningún saldo on-chain que mostrar."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Inicia sesión en <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, pulsa F12 → Application → Cookies y copia el valor de la cookie <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Gana algunos Salad Reward Points, o gasta tu saldo"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Si una cuenta no gana Reward Points durante 12 meses seguidos, su saldo sin canjear puede caducar."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Ejecuta la app de Salad hasta que gane algo, o gasta todo el saldo en la Salad Storefront. Gastar solo una parte no reinicia los 12 meses."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot no ejecuta Salad: usas la app de escritorio del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Varias reseñas de Trustpilot de octubre y noviembre de 2026 cuentan que los retiros por PayPal llegan rápido, a algunos más de una vez; una reseña del mismo periodo dice que varios intentos de retiro fallaron."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel es una blockchain Layer 1 de Cosmos para VPN descentralizada. Los operadores de nodos venden ancho de banda a usuarios de VPN con precios flexibles (por GB o por hora). Hay una guía oficial de despliegue con Docker. Es un proyecto veterano con una comunidad activa.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "VPN descentralizada en Cosmos: los operadores de nodos venden ancho de banda"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Los operadores fijan su propio precio por GB o por hora. Las ganancias dependen de la demanda de usuarios de VPN en tu región."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Por sesión"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Los pagos son en el token P2P, y el 20% de cada pago por ancho de banda va a quienes hacen staking, no al anfitrión del nodo."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "El token pasó de llamarse SENT a DVPN en 2021, y de DVPN a P2P en 2025."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot no ejecuta Sentinel: usas el software de nodo del propio proveedor, así que CashPilot no puede desplegarlo ni actualizarlo por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel publica el código fuente de su nodo bajo su propia licencia de código abierto."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia es un mercado de almacenamiento descentralizado gestionado por la Sia Foundation (una organización suiza sin ánimo de lucro) que funciona desde 2015. Ejecuta el nodo oficial hostd de la Fundación para alquilar el espacio de disco que te sobra y ganar Siacoin con contratos de almacenamiento y de ancho de banda. Tienes que comprar algo de Siacoin antes de que el nodo pueda ganar: los anfitriones bloquean una garantía en cada contrato y pagan una comisión por cada prueba de almacenamiento. La garantía se devuelve cuando el contrato termina y se quema si el nodo se desconecta o pierde datos, así que necesita una máquina siempre encendida (Sia pide al menos un 95% de tiempo en línea). Las ganancias dependen de cuántos datos guarden realmente los inquilinos; Sia recomienda cobrar el almacenamiento a $1 por TB al mes, así que encaja con máquinas con discos grandes libres, no con VPS pequeños.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Nodo de almacenamiento de la Sia Foundation: imagen oficial de Docker, gana Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Frase semilla de la billetera"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Contraseña del panel"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Directorio de almacenamiento"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "Frase semilla BIP-39 que controla la billetera de Siacoin del anfitrión. Genera una con `docker run --rm ghcr.io/siafoundation/hostd seed` y haz una copia de seguridad: es la ÚNICA forma de acceder a las ganancias"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Contraseña de la interfaz web y de la API local de hostd (BasicAuth). Cualquier frase de contraseña larga"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Ruta del equipo, en tu disco más grande, donde se guardan los datos de los inquilinos (p. ej., /srv/sia). Necesita al menos 256GB libres"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Al desplegar, CashPilot crea una billetera nueva en la máquina que ejecuta el nodo y muestra su frase semilla una sola vez: apúntala. Para usar una billetera que ya tienes, pega su frase semilla. Después del despliegue, envía algo de Siacoin a la billetera del nodo para la garantía y las comisiones, y luego añade la carpeta de almacenamiento (/storage), fija los precios y anuncia el anfitrión en el panel.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "La frase semilla de la billetera (hostd.yml), la base de datos de la billetera, la configuración del anfitrión y el estado de los contratos. Si lo pierdes, pierdes la identidad del nodo y el seguimiento de los ingresos de los contratos; la frase semilla que apuntaste pasa a ser la única forma de recuperar los fondos."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Datos guardados de los inquilinos. Si los pierdes, fallan las pruebas de almacenamiento y pierdes la garantía bloqueada en esos contratos."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Los anfitriones fijan sus propios precios. Sia recomienda $1 por TB almacenado al mes y más de $5 por TB descargado, y el 3.9% de cada pago de contrato va a los poseedores de Siafund. Los ingresos crecen con la cantidad de datos de inquilinos que llegan al nodo, que empieza en cero y aumenta con el tiempo en línea y el precio. La garantía (Sia sugiere el doble del precio de almacenamiento) se bloquea en cada contrato y se devuelve cuando termina con éxito.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Las ganancias se acumulan en la billetera de Siacoin propia del anfitrión (controlada por la frase semilla). Convierte los SC en un exchange y retira desde ahí a tu banco o tarjeta; no hay solicitudes de pago al proveedor.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Los fondos están en la billetera de Sia dentro del nodo, controlada por la frase semilla. La frase semilla solo está en el volumen de datos de hostd, en la máquina que lo ejecuta; CashPilot nunca la guarda. La frase que apuntas al crear la billetera es la única forma de recuperar la billetera.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Una dirección pública estable con los puertos 9981 (TCP, consenso) y 9984 (TCP y UDP, contratos de inquilinos) redirigidos. Alojar en centros de datos o VPS es habitual en Sia. La billetera necesita Siacoin antes de que el nodo pueda aceptar contratos."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Espacio en disco y el ancho de banda para servirlo."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "No. Los inquilinos guardan fragmentos de archivos cifrados en tu disco y los recuperan. Otras personas no envían tráfico cualquiera a través de tu IP."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "La dirección de tu billetera de Sia, la clave pública del anfitrión y la IP:puerto pública que anuncia el nodo para que los inquilinos puedan llegar a él."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Tráfico continuo de subida/bajada en la línea, como con cualquier servidor de almacenamiento; no se te atribuye tráfico web anonimizado de terceros."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Sin permisos: ni registro ni cuenta. La garantía se quema si el nodo no supera las pruebas de almacenamiento, por desconectarse o por perder datos."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Las ganancias son Siacoin en tu propia billetera: no hay pagos a un banco, así que tienes que venderlos tú en un exchange."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "La garantía se bloquea en cada contrato y se quema si el anfitrión no supera las pruebas de almacenamiento por desconectarse o por perder datos."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Solo se usa alrededor del 30% del almacenamiento ofrecido en la red, así que un anfitrión nuevo compite por poca demanda."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Los inquilinos guardan fragmentos de archivos cifrados y nadie envía tráfico a través de tu IP, pero no encontramos dónde dice Sia quiénes son los inquilinos ni cómo se les verifica."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "La Sia Foundation desarrolla hostd de forma abierta desde 2022."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd es de código abierto bajo la licencia MIT."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "La Sia Foundation publica hostd como imagen de contenedor."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Sin permisos: ni registro ni cuenta."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide es un servicio de ancho de banda compartido que te permite monetizar el ancho de banda de internet que no usas. Usa un ID de máquina opcional para identificar el dispositivo. Disponible mediante imágenes de Docker de la comunidad del proyecto income-generator.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Ancho de banda compartido: basado en ID de máquina"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "ID de máquina"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "ID de máquina de un dispositivo ya registrado (se genera automáticamente si se deja vacío)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Hay poca información disponible. Las ganancias dependen de la ubicación."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
spide.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% de sus ganancias"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "Bono de registro de $5"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "El tráfico que pasa por una IP pública se reparte entre los dispositivos que la comparten, así que un segundo dispositivo en la misma conexión no suma nada."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot no ejecuta Spide: usas la app del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Mina Pearl, Zano o Ravencoin con una GPU NVIDIA. CashPilot descarga la versión oficial de SRBMiner-Multi en el primer arranque y comprueba su SHA-256. El pool que elijas paga a tu dirección pública de pago. SRBMiner-Multi se queda con el 2% del tiempo de hash en Pearl y el 0.85% en las otras dos. La electricidad puede costar más que las monedas que ganes."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Mina Pearl y otras monedas de GPU en una GPU NVIDIA"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Dirección de pago"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "Nombre del worker"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "Algoritmo"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "Pool (host:puerto)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "Cifrar la conexión al pool (TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "Tu dirección pública de Pearl (prl1...). Para Zano o Ravencoin, introduce la dirección de esa moneda y un pool para ella."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash para Pearl, progpow_zano para Zano, kawpow para Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.docker.runtime_reason:
  text: "gVisor no puede darle acceso a la GPU."
  source: "302a2b5c988f"
srbminer-multi.earnings.notes:
  text: "Estimación bruta antes de la electricidad. El 2026-11-25, hashrate.no estimó unos $2.45 al día en Pearl para una RTX 4070 que consume unos 142 W. No lo hemos medido. Pearl es una moneda nueva, y su precio y su dificultad cambian rápido. Comprueba el consumo de tu GPU y el precio de tu electricidad para ver si sale a cuenta."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Cuando se alcanza el umbral del pool"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "El pool paga a tu dirección cuando tu saldo alcanza tu umbral. El pool guarda el saldo hasta que te paga."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, una GPU NVIDIA y NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Esta máquina indica una conexión de hosting. Revisa las condiciones de tu proveedor antes de minar. Algunos proveedores, como Hetzner Cloud, lo prohíben. Comprueba tu coste real de electricidad antes de fiarte de una estimación de beneficios."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "La comisión de minero del 2% es para pearlhash. SRBMiner-Multi se queda con el 0.85% en progpow_zano y kawpow. HeroMiners, el pool de Pearl por defecto, cobra una comisión de pool del 1%. Comprueba los pagos cada hora y paga a partir de 1 PRL. Otros pools fijan sus propias tarifas y umbrales."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "cómputo"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "No. El minero envía trabajo al pool que elijas."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Tu dirección de pago, el nombre del worker y la dirección IP van al pool. El primer arranque descarga el minero desde GitHub."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Algunas redes y resolutores DNS bloquean las conexiones a pools de minería."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "La mayoría de los pools te identifican por tu dirección pública de pago."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "El minero se queda con el 2% del tiempo de hash en Pearl y el 0.85% en Zano y Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Algunos proveedores de hosting prohíben la minería de criptomonedas."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "El minero es de código cerrado, así que nadie fuera de su desarrollador puede auditar lo que ejecuta."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "La electricidad de la GPU puede costar más que las monedas ganadas, y el precio de Pearl cambia rápido."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "El minero envía trabajo al pool y no retransmite el tráfico de nadie."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Puedes minar Pearl en HeroMiners con una dirección pública y sin cuenta."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj es una red de almacenamiento en la nube descentralizada en la que ganas alquilando el espacio de disco que no usas. Ejecuta el nodo de almacenamiento con Docker y cobra $1.35/TB almacenado al mes más $1/TB de salida (tarifas desde el 1 de septiembre de 2026). Los pagos son mensuales en USDC, una stablecoin en dólares estadounidenses, en la red principal de Ethereum, a una billetera que controlas, cuando el saldo supera un mínimo que depende de las comisiones (en el token STORJ hasta el pago de septiembre de 2026). Requiere al menos 550GB de espacio libre en disco y una conexión a internet estable. No hace falta cuenta ni registro: los nodos no necesitan permiso desde mediados de 2025. PRECAUCIÓN (octubre de 2026): Storj Labs se acogió al Chapter 11 el 26 de julio de 2026 (US Bankruptcy Court, Northern District of West Virginia, caso 5:26-bk-00512) para reestructurar deuda heredada. La red sigue funcionando y Storj sigue pagando a los nodos activos, pero las ganancias de los nodos anteriores a la solicitud están congeladas hasta que el tribunal se pronuncie. El token STORJ ha caído alrededor de un 98% desde su máximo de 2021. Binance lo retiró de su lista el 3 de septiembre de 2026, y Coinbase suspendió su negociación el 28 de septiembre de 2026. Un nodo nuevo retiene parte de sus ganancias durante sus primeros nueve meses y solo se llena a medida que lo permite la demanda de los clientes, así que empezar uno ahora ata una recuperación de la inversión larga a una empresa en reestructuración que todavía podría cerrar.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Nodo de almacenamiento descentralizado: $1.35/TB almacenado + $1/TB de salida"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Dirección de la billetera"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "Correo electrónico"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "Dirección externa"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Espacio asignado"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Directorio de identidad"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Directorio de almacenamiento"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Dirección de billetera de Ethereum para los pagos en USDC (p. ej., 0x1234...abcd). Debe ser de custodia propia (MetaMask, Ledger, etc.): nunca uses la dirección de un exchange"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "Dirección de correo para los avisos al operador"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "Nombre de host DDNS con puerto (p. ej., mynode.ddns.net:28967): es mucho mejor que una IP literal, que deja el nodo inaccesible el día que tu ISP te la cambie sin avisar. El puerto 28967 debe estar redirigido (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Espacio máximo en disco que se asigna (p. ej., 2TB). Usa discos mecánicos (HDD), no SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Ruta del equipo donde se guardan los archivos de identidad (debe contener ca.cert, ca.key, identity.cert, identity.key)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Ruta del equipo en un disco mecánico (HDD) para guardar los datos de Storj. Necesita al menos 550GB libres"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Antes del primer arranque, inicializa la configuración del nodo de almacenamiento: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Identidad del nodo. Su ID está ligado a una prueba de trabajo y tarda horas en regenerarse, y no se puede recrear a partir de una copia de seguridad de ninguna otra cosa. Si la pierdes, pierdes el saldo de pagos retenido."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Datos guardados de los clientes y la cantidad retenida del nodo. Si los pierdes, el nodo queda descalificado y pierdes el saldo retenido."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "La red de Storj no puede volver a conectar con tu nodo en la ADDRESS que anuncia, así que los satélites lo cuentan como desconectado: dejan de llegar datos nuevos, los ingresos por salida se estancan y, si sigue desconectado mucho tiempo, se suspende. Comprueba que ADDRESS coincide con tu IP pública ACTUAL (usa un nombre de host DDNS, no una IP literal, para que un cambio de tu ISP no deje el nodo inaccesible) y que el puerto 28967 TCP+UDP está redirigido a esta máquina."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB almacenado + $1/TB de salida + $1/TB de auditoría/reparación desde el 1 de septiembre de 2026. Las ganancias crecen con los datos almacenados y la antigüedad del nodo. Durante los primeros 9 meses se retiene el 75%, luego el 50% y luego el 25% de las ganancias; la mitad de lo retenido se devuelve en el mes 16 y el resto al salir de forma ordenada (graceful exit). El puerto 28967 debe estar redirigido."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4 veces la comisión de transacción de Ethereum; los saldos menores pasan al mes siguiente"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Mensual"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Se paga cada mes en USDC en la red principal de Ethereum cuando el saldo de la billetera es al menos cuatro veces la comisión de transacción actual; los saldos menores pasan al mes siguiente. En el token STORJ hasta el pago de septiembre de 2026. Panel en el puerto 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Se paga cada mes en USDC en la red principal de Ethereum a la dirección de WALLET cuando el saldo supera el mínimo que depende de las comisiones. En el token STORJ hasta el pago de septiembre de 2026; los pagos en zkSync Era terminaron el 1 de septiembre de 2026."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "La URL del panel del nodo en el puerto 14002, con la IP de LAN del servidor en lugar de localhost, por ejemplo <b>http://192.168.1.10:14002</b>. Si tienes varios nodos, pon sus URL separadas por comas: CashPilot las suma."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Los nodos de Storj en la misma subred /24 comparten la asignación de datos, lo que reduce las ganancias de cada nodo."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps de subida"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Espacio en disco y el ancho de banda para servirlo."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "No. Guardas fragmentos cifrados y con codificación de borrado de los datos de los clientes. Otras personas no envían su propio tráfico a través de tu IP."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "La identidad del nodo, la dirección de tu billetera, la dirección de correo que el nodo exige para los avisos al operador, y tu IP y puerto, que deben ser accesibles para que el nodo sirva datos."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "Es sobre todo una cuestión de límite de datos, no de responsabilidad: un nodo sirve y recibe datos de clientes de forma continua, lo que supone un tráfico real y constante en tu línea. Pero, a diferencia de un proxy o un relay, no es tráfico anonimizado de terceros que se te atribuya como origen, así que no atrae las denuncias por abuso que atraen esos."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Nodos ilimitados, pero los nodos de la misma subred /24 comparten la asignación, así que si hay varios en una misma conexión, cada uno gana menos."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk informó el 27 de julio de 2026 de que Storj Labs se había acogido a la protección por quiebra del Chapter 11."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Los pagos a los operadores de nodos anteriores a la solicitud pasaron al proceso de reclamaciones de la quiebra."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "A un nodo nuevo se le retiene el 75%, luego el 50% y luego el 25% de sus ganancias en sus primeros nueve meses; la mitad se devuelve en el mes 16 y el resto solo al salir de forma ordenada."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Los clientes guardan fragmentos de archivos cifrados y nadie envía tráfico a través de tu IP, pero no encontramos dónde dice Storj quiénes son los clientes ni cómo se les verifica."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "El software del nodo de almacenamiento es de código abierto bajo la AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj publica su propia imagen de Docker, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Sin cuenta: una dirección de billetera y un correo para los avisos al operador."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Los nodos activos siguieron cobrando después de la solicitud."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR es un pool de minería de Monero sin cuenta: tu minero inicia sesión con tu dirección de Monero como nombre de usuario, y el pool paga a esa dirección. Aquí CashPilot no ejecuta ningún minero. Lee el saldo que SupportXMR guarda para tu dirección, para que veas lo que ha ganado tu minero de CPU junto a tus otros ingresos. El saldo está ganado, pero no recibido: el pool lo paga cuando supera tu umbral de pago.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Pool de minería de Monero, seguido por tu dirección de pago"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (automático), 0.01 XMR bajo petición"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Cuando tu saldo supera tu umbral, o bajo petición"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR paga a tu dirección cuando el saldo alcanza tu umbral (0.1 XMR por defecto). En su sitio también puedes solicitar un pago inmediato desde 0.01 XMR, con una comisión de 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "El saldo está ganado, pero no se recibe hasta que SupportXMR lo paga a esta dirección. Los saldos de Monero no se pueden leer on-chain sin una clave privada de visualización, que CashPilot nunca pide, así que confirmas tú cada pago."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Tu dirección de pago de Monero: el nombre de usuario que tu minero usa en SupportXMR, sin ninguna parte <b>.workername</b> ni <b>+difficulty</b>. Es pública y no da acceso a ningún fondo."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Necesita un minero de Monero (XMRig) apuntado a pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "cómputo"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "No. Tu minero envía hashes al pool; nadie envía tráfico a través de tu conexión."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Tu dirección de Monero, los nombres de worker que elijas, tu hashrate y la dirección IP de tu minero tal como la ve el pool."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Un minero mantiene una conexión abierta con el pool y usa poco ancho de banda. El coste que hay que vigilar es la electricidad, no tu ISP."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "No hay cuenta. La dirección es la identidad, y cualquiera puede leer sus estadísticas en supportxmr.com."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Paga solo en Monero, con una comisión de pool del 0.6% y un umbral por defecto de 0.1 XMR antes de un pago automático."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot no ejecuta un minero para SupportXMR: apuntas tu propio minero al pool, y CashPilot solo lee el saldo."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol da a los agentes de IA acceso a la web en tiempo real a través de una red de Beacons. Teneo Beacon es la app propia de Teneo para Android, iOS, macOS, Windows y Linux, con una versión de línea de comandos para servidores y Raspberry Pi. Comparte el ancho de banda que no usas después de que aceptes su pantalla de consentimiento, y gana Teneo Protocol Points y Fragments mientras está en línea. Los Fragments cuentan para sorteos de temporada pagados en USDC (el Beacon Drop). Teneo dice que el Beacon gana el doble de puntos que su antigua extensión de navegador. Solo gana un Beacon por conexión a internet. Los demás dispositivos de la misma conexión quedan en espera. Regístrate en el Expedition Hub con el enlace o el código de referido PSA3BHPJ y después inicia sesión en el Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "App DePIN de ancho de banda (Beacon): Fragments para sorteos de temporada en USDC, +100 Fragments con un enlace de referido"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Gana Teneo Points y Fragments. Los Fragments cuentan para sorteos de temporada en USDC, así que una temporada paga un premio, no una tarifa. Teneo dice que el Beacon gana el doble de puntos que la extensión de navegador. Reclama el impulso cada 8 horas para conseguir hasta 3x Fragments; si se te pasa un plazo, baja el multiplicador."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Sorteo de temporada (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Los premios del Beacon Drop se pagan en USDC a una billetera que vinculas en el Expedition Hub. El Hub muestra cuántos días tienes para vincularla; un premio sin billetera vinculada a tiempo se pierde."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Vincula una billetera en el Expedition Hub antes de que se paguen los premios de una temporada; el Hub anula un premio cuya billetera no se vincule a tiempo."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% de los Fragments de cada amigo referido y 2% de los Fragments de sus referidos, cuando el amigo se registra en un plazo de 7 días y gana 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments al registrarte, y +150 más cuando llegues a 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "Solo gana un Beacon por conexión a internet. Las máquinas de centros de datos solo ganan en los proveedores de hosting que Teneo ha habilitado, con la mitad de Fragments y sin puntos ni bono de referido. Las conexiones por VPN nunca ganan."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Los Fragments del Beacon solo pagan USDC como premios de sorteos de temporada, así que ejecutarlo no da una cantidad fija."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo dice que los puntos se consolidarán en $AGENTIC, un token de recompensa no transferible, no en el token $TENEO."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "En noviembre de 2026 no se había confirmado ninguna fecha de lanzamiento, asignación ni proceso de reclamación de $TENEO, después de que pasara un objetivo anterior fijado para el segundo trimestre de 2026."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot no ejecuta Teneo: instalas la app Beacon del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo dice que el tráfico procede de clientes empresariales verificados y que bloquea las direcciones privadas y los puertos propensos al abuso, pero no dice cómo verifica a esos clientes."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network es una red descentralizada consolidada de distribución de vídeo y cómputo de IA (desde 2018). Los usuarios ejecutan Edge Nodes que comparten ancho de banda, almacenamiento y potencia de cómputo. Tiene grandes acuerdos de contenidos. Gana tokens TFUEL.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "CDN descentralizada + cómputo de IA: recompensas en TFUEL, proyecto consolidado"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Solo app de escritorio. Las ganancias dependen de los recursos y de la ubicación. Grandes acuerdos; cotiza en todos los exchanges."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Continuo"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot no ejecuta Theta Edge: usas la app de escritorio del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "893de938ed14"
titan.description:
  text: "Titan Network es una plataforma DePIN que comparte tu dirección IP, tu almacenamiento y tu ancho de banda a cambio de recompensas en tokens TNT. Disponible en Windows, Mac y Android. Los nodos contribuyen a una CDN y una capa de almacenamiento descentralizadas. Las ganancias típicas van de $5-30/mes según los recursos compartidos y la ubicación geográfica.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN que comparte IP, almacenamiento y ancho de banda: $5-30/mes"
  source: "799e68401067"
titan.earnings.notes:
  text: "Comparte IP, almacenamiento y ancho de banda. Las ganancias dependen de los recursos aportados y de la región. Cuanto más almacenamiento asignes, mayores son las recompensas."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Por épocas"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "La propia ayuda de Titan dice que un nodo en marcha no garantiza ganancias: si no tiene ninguna tarea asignada, no gana nada, y las recompensas son en el token TNT."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot no ejecuta Titan: usas la app o la extensión del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer te permite monetizar tu tráfico de internet compartiendo ancho de banda con empresas verificadas. Es uno de los pocos servicios de ancho de banda compartido que funcionan bien con IP de VPS y centros de datos, además de con conexiones residenciales. Usa una autenticación sencilla con un token que se pasa como argumento de línea de comandos. Admite arquitecturas ARM para Raspberry Pi y dispositivos similares.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Ancho de banda compartido: funciona en VPS, autenticación con token"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Token"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Nombre del dispositivo"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Inicia sesión en <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, pulsa F12 → Application → Local Storage → haz clic en <code>https://app.traffmonetizer.io</code> → copia el valor de <code>authToken</code> (unos 54 caracteres: dígitos, una <code>|</code> y luego letras y dígitos)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Nombre que aparece en el panel para gestionar el dispositivo"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "Las IP de VPS y centros de datos ganan menos que las residenciales. Las ubicaciones de EE. UU. y la UE ganan más. Admite varias IP mediante redes de Docker."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Mínimo $10. Ya no se ofrece PayPal. Primero guarda un método de pago en el perfil: USDT en Solana o TON (las comisiones más bajas), Arbitrum (comisiones bajas) o Tron TRC20 (comisiones de red altas), o una transferencia bancaria desde $1,000. La primera dirección que guardas se aplica al momento; cambiarla después requiere una confirmación por correo. Puede que el panel te pida un contacto de mensajería (WhatsApp, Telegram o Skype) antes del primer retiro. Cada solicitud paga dólares enteros y los céntimos se quedan en el saldo."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT en la cadena guardada en la configuración de pagos del perfil (Solana, TON, Arbitrum o Tron), o una transferencia bancaria. La dirección está en la configuración de Traffmonetizer, no en el contenedor."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Inicia sesión en <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, pulsa F12 → Application → Local Storage → valor de <b>authToken</b> (unos 54 caracteres: dígitos, una <code>|</code> y luego letras y dígitos)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% de cada pago que soliciten"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Las condiciones de servicio de Traffmonetizer exigen una IP residencial, pero en la práctica se aceptan nodos en VPS."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot le da un 1.9; reseñas de 2023 a noviembre de 2026 cuentan pagos pendientes durante semanas, o marcados como completados sin ninguna transacción que corresponda."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Esos mismos usuarios cuentan que el chat en directo y el soporte por correo no responden, a veces durante semanas."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Solo cripto o transferencia bancaria desde $1,000; PayPal ya no está, y cada solicitud solo paga dólares enteros."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Las condiciones de Traffmonetizer exigen una IP residencial, así que un servidor con una conexión de hosting queda fuera de ellas."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Cuatro reseñas de Trustpilot de 2023 a 2025 cuentan ganancias muy lentas, como un céntimo al día entre cuatro dispositivos, o casi dos años para llegar a $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Un pago solo necesita una dirección de cripto guardada y confirmada por correo; puede que el panel te pida un contacto de mensajería."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer publica su propia imagen de Docker, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Mina con tu CPU y cobra en la moneda que elijas, como SHIB, DOGE o XMR. CashPilot ejecuta XMRig contra el pool RandomX de unMineable, y unMineable convierte el Monero que mina tu CPU a tu moneda. Paga a tu dirección pública cuando tu saldo alcanza el umbral de pago de la moneda. Cada worker que despliega CashPilot lleva el código de referido de unMineable de CashPilot, que baja tu comisión de plataforma del 1% al 0.75%. La electricidad puede costar más de lo que ganes."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Mina con tu CPU y cobra en la moneda que elijas"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "Moneda de pago"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "Dirección de pago"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "Nombre del worker"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "Máx. hilos de CPU (%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "Modo RandomX"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "Ticker de una moneda que paga unMineable, como SHIB, DOGE o XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "Tu dirección pública para esa moneda. No se admiten las monedas que necesitan un memo o una etiqueta."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Estimación bruta antes de la electricidad, pagada en tu moneda al tipo de conversión de unMineable. El 2026-11-25, 1 kH/s de RandomX valía alrededor de $1 al mes. Una CPU de escritorio a la mitad de sus hilos puede consumir de 30 a 50 W extra. Comprueba tu consumo real y el precio de tu electricidad para ver si sale a cuenta."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "Lo fija unMineable para cada moneda (0.03 XMR el 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Cuando se alcanza el umbral de pago de la moneda"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable paga a tu dirección cuando tu saldo alcanza el umbral de pago de la moneda. Los umbrales varían según la moneda y la red; CashPilot lee el que unMineable indica para tu dirección."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "El saldo está ganado, pero no se recibe hasta que unMineable lo paga a esta dirección. La cadena depende de la moneda que elijas."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "La misma dirección de pago y el mismo ticker de moneda con los que desplegaste el minero, por ejemplo <b>XMR</b>. Introduce solo la dirección, sin la moneda, el nombre del worker ni el código de referido. Es pública y no da acceso a ningún fondo."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% de las recompensas de minería de cada minero referido"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Comisión de plataforma reducida del 1% al 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Esta máquina indica una conexión de hosting. Revisa las condiciones de tu proveedor antes de minar. Algunos proveedores, como Hetzner Cloud, lo prohíben. Comprueba tu coste real de electricidad antes de fiarte de una estimación de beneficios."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable cobra una comisión de plataforma del 1%. CashPilot añade su código de referido (#awk6-j1z0) detrás de cada nombre de worker, lo que baja tu comisión al 0.75%. Después, unMineable paga al mantenedor de CashPilot el 0.25% de tus recompensas de minería; tú te quedas con el 99.25%. Cada moneda tiene su propio umbral de pago, por ejemplo 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "cómputo"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "No. El minero envía trabajo al pool de unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "Tu dirección de pago, la moneda, el nombre del worker, el hashrate y la dirección IP van a unMineable."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "Algunas redes y resolutores DNS bloquean las conexiones a pools de minería."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "No hace falta cuenta. La dirección y la moneda son la identidad, y cualquiera puede leer sus estadísticas en unmineable.com."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "unMineable se queda con una comisión de plataforma del 0.75% con el código de referido y solo paga a partir del umbral de cada moneda."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "Algunos proveedores de hosting prohíben la minería de criptomonedas."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "La electricidad extra puede costar más que las monedas ganadas."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "Las estadísticas de la dirección, incluido el saldo, son públicas para cualquiera que conozca la dirección."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "El minero envía hashes al pool y no retransmite el tráfico de nadie."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Puedes minar hacia una dirección pública en la moneda que elijas sin crear una cuenta."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock es una plataforma DePIN (red descentralizada de infraestructura física) que te permite ganar criptomonedas compartiendo tu conexión a internet. Forma parte del ecosistema Web3 en general. Hay imágenes de Docker de la comunidad, pero ninguna oficial. La extensión de navegador es la interfaz principal.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "Internet compartido DePIN: pago en cripto, extensión de navegador como cliente principal"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Ganancias en cripto/tokens. No hay imagen oficial de Docker: la extensión de navegador es el cliente principal."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
uprock.cashout.notes:
  text: "Tokens UPT, que se retiran a una billetera de Solana desde 250 UPT, con la autenticación en dos pasos activada. Se aplica una comisión de retiro."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "El centro de ayuda de UpRock dice que los retiros son tokens UPT a una billetera de Solana, con un mínimo de 250 UPT."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "Las recompensas son tokens UPT; algunos usuarios y una reseña independiente dicen que su valor es muy bajo."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot no ejecuta UpRock: usas la app o la extensión del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork es una red descentralizada de VPN y ancho de banda compartido. Ganas aportando ancho de banda como proveedor de la comunidad. El binario del proveedor se autentica con el correo y la contraseña de tu cuenta (su subcomando auth-provide) y guarda el JWT de sesión resultante en el volumen de datos. Imagen oficial de Docker de BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "VPN/ancho de banda descentralizado: autenticación con correo+contraseña, sesión JWT en el volumen"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "Correo electrónico"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Contraseña"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "El correo de tu cuenta de URnetwork (el inicio de sesión que usas en <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Las cuentas creadas con el inicio de sesión de Google/Apple necesitan que primero definas una contraseña. ¿No tienes cuenta? Regístrate con <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "La contraseña de tu cuenta de URnetwork (sin espacios). La usa el inicio de sesión auth-provide del proveedor; después, la sesión se guarda en el volumen de datos."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Funciona en VPS y en conexiones residenciales. Paga en SN25α (subred 25 de Bittensor) por cada época semanal desde el 2026-10-06. Admite el modo proxy para configuraciones con varias IP."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "Por épocas"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Define una coldkey de Bittensor en ur.io/app/account/earnings (firmada con Talisman, TAO.com o una billetera WalletConnect) y luego reclama cada época finalizada. Cada reclamación paga gas en TAO desde una clave de gas EVM. LAS ÉPOCAS SIN RECLAMAR CADUCAN, y los antiguos pagos en USDC se cancelaron cuando no se vinculó ninguna billetera en 30 días."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB al día de datos UR gratis por amigo, hasta 20 amigos (datos, no dinero)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB al día de datos UR gratis cuando uses al menos 10 MiB con la app en 2 días dentro de los 90 días siguientes a unirte; si no, el bono de referido se cancela"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Las épocas sin reclamar caducan, y los antiguos pagos en USDC se cancelaron para las redes sin ninguna billetera vinculada en 30 días."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "Desde octubre de 2026, las recompensas se pagan en SN25α, un token de una subred de Bittensor, y cada reclamación cuesta gas en TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork se llamaba antes BringYour; su whitepaper archivado lleva el nombre antiguo."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork publica el código fuente de su cliente de proveedor."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork publica su propia imagen de Docker, bringyour/community-provider, y funciona en conexiones de VPS y residenciales."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Una reclamación solo necesita una billetera de Bittensor que controles."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai es un mercado de GPU en la nube donde alquilas tu GPU NVIDIA a investigadores y desarrolladores de IA/ML. Es una plataforma nativa de Docker en la que fijas tus propios precios por hora. Una RTX 3090 suele ganar $0.20-0.40/h cuando está alquilada. Requiere una GPU NVIDIA con controladores recientes y una conexión a internet estable. Los ingresos dependen mucho del modelo de GPU, de la estrategia de precios y de la demanda del mercado.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "Mercado de GPU: fija tus propios precios, RTX 3090 ~$0.20-0.40/h"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "Clave de API"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "Clave de API de anfitrión de Vast.ai, desde el panel"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/h, RTX 4090 ~$0.40-0.80/h cuando están alquiladas. La ocupación varía. Requiere GPU NVIDIA, un equipo con Linux, Docker y nvidia-container-toolkit. Fijas tus propios precios."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Semanal (los viernes)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "Las ganancias se acumulan en el saldo de Vast.ai. Retira por Wise, PayPal o Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% de lo que gastan los inquilinos referidos, durante toda la vida de su cuenta, como créditos de referido; puedes retirar hasta el 75% desde una cuenta de referidos dedicada"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Un anfitrión solo gana mientras su máquina está alquilada, y las cifras de la propia Vast para una GPU doméstica dependen del tipo de alquiler y de la puntuación de fiabilidad."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot no ejecuta Vast.ai: instalas el software de anfitrión de Vast en tu propia máquina con GPU, así que CashPilot no puede desplegarlo ni actualizarlo por ti. Vast basa el alojamiento en Docker sobre un equipo con Linux."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Vast dice que la tarifa que fija un anfitrión es la que recibe, sin descontar ninguna comisión."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "Los pagos se hacen por Wise, PayPal o Stripe desde un mínimo de $20, facturados cada semana; un saldo menor pasa a la semana siguiente."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter es una plataforma de ancho de banda compartido disponible en Windows, Mac, Linux y Android. Asegura pagar hasta $1/GB de ancho de banda compartido, con un umbral de pago mínimo de $20. La plataforma funciona de forma parecida a las apps clásicas de ancho de banda compartido y envía tráfico legítimo a través de conexiones residenciales.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Ancho de banda compartido: asegura hasta $1/GB, pago mínimo $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Asegura pagar hasta $1/GB, pero las ganancias reales son menores. Pago mínimo $20. Las ganancias varían mucho según la ubicación y la demanda."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter no tiene panel web. Abre la app de escritorio o de móvil de Wipter, inicia sesión y solicita el pago ahí cuando el saldo llegue a $20. Wipter solo paga en USDT en BNB Smart Chain (BEP20), a la billetera que definas en la sección Payments de la app; no hay opción de PayPal."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% de sus ganancias por tráfico cuando lleguen al pago mínimo, por todos los amigos que refieras"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "Bono de registro de $5"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot no ejecuta Wipter: usas la app de escritorio o de móvil del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "fa32942c6b4f"
xmrig.description:
  text: "Mina Monero con tu CPU. CashPilot ejecuta XMRig, y el pool que elijas paga en Monero a tu dirección pública de pago. XMRig usa el 1% del tiempo de hash para apoyar a sus desarrolladores. La electricidad puede costar más que los XMR que ganes."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "Mina Monero con tu CPU y el pool que elijas"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Dirección de Monero"
  source: "a888ebb3ae9b"
