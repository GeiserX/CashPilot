xmrig.earnings.notes:
  text: "Estimación bruta antes de la electricidad. El 2026-11-25, 1 kH/s valía alrededor de $1 al mes con el precio de XMR y la dificultad de red observados. Una CPU de escritorio a la mitad de sus hilos puede consumir de 30 a 50 W extra. Comprueba tu consumo real y el precio de tu electricidad para ver si sale a cuenta."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, después de bajarlo)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Cuando se alcanza el umbral del pool"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "El pool paga a tu dirección de Monero cuando tu saldo alcanza tu umbral. El pool guarda el saldo hasta que te paga."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Esta máquina indica una conexión de hosting. Revisa las condiciones de tu proveedor antes de minar. Algunos proveedores, como Hetzner Cloud, lo prohíben. Comprueba tu coste real de electricidad antes de fiarte de una estimación de beneficios."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "MoneroOcean, el pool por defecto, cobra una comisión de minería del 0%. El umbral de pago por defecto es 0.3 XMR, y puedes bajarlo a 0.003 XMR. Los pagos por debajo de 4 XMR pueden costar hasta 0.0004 XMR. Otros pools fijan sus propias tarifas y umbrales."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "cómputo"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "No. El minero envía trabajo a los pools de minería."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Tu dirección de Monero, el nombre del worker y la dirección IP van al pool."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "Algunas redes y resolutores DNS bloquean las conexiones a pools de minería."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "La mayoría de los pools de Monero te identifican por tu dirección pública de pago."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Un pago requiere suficientes XMR para alcanzar el umbral de tu pool."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "Algunos proveedores de hosting prohíben la minería de criptomonedas."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "La electricidad extra puede costar más que los XMR ganados."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "El minero envía hashes a los pools y no retransmite el tráfico de nadie."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "El minero es de código abierto y la imagen fija una versión oficial firmada."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Puedes minar con una dirección pública de Monero sin identificarte con tu nombre."
  source: "752cbb728aac"
