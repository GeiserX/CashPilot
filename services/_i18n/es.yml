ionet.description:
  text: "io.net es una red de GPU descentralizada para cargas de trabajo de IA/ML. Reúne GPU inactivas de particulares y centros de datos. Requiere una GPU NVIDIA con 8GB+ de VRAM para obtener ganancias significativas. Se admiten despliegues basados en contenedores.\n"
  source: "5d017f77f0ac"
ionet.short_description:
  text: "Red de GPU descentralizada para IA: requiere GPU NVIDIA"
  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "Requiere una GPU NVIDIA con 8GB+ de VRAM. Se habla de $500-1000/mes con una RTX 4090 (probablemente menos en la práctica)."
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "Por épocas"
  source: "75743e03bad2"
ionet.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "Las recompensas a los proveedores salían de la emisión de tokens, hubiera o no trabajos pagados, y los dueños de GPU cuentan que pasan inactivos la mayor parte del tiempo."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "Las recompensas son en el token IO, y el modelo de pago cambió en 2026 a un sistema vinculado al dólar."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "En abril de 2024, unos 1.8 millones de GPU falsas intentaron unirse con un token de autenticación filtrado, y más tarde el CEO dimitió antes del lanzamiento del token."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "CashPilot no ejecuta io.net: usas el software worker del propio proveedor, así que CashPilot no puede desplegarlo ni actualizarlo por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "1cac289c99ad"
iproyal.description:
  text: "IPRoyal Pawns te permite ganar dinero compartiendo el ancho de banda que no usas. IPRoyal es un proveedor de proxies consolidado, y Pawns es su rama de ancho de banda residencial compartido. La imagen de Docker de la CLI acepta las credenciales mediante opciones de línea de comandos. Un usuario nuevo que se registra con un enlace de referido recibe $1 en cada uno de sus tres primeros pagos, hasta $3. Cada pago debe llegar dentro de un plazo de una a tres semanas, que depende de la ubicación. El plazo empieza al registrarse y vuelve a empezar tras cada pago. Si un plazo se cierra antes, los bonos restantes se pierden.\n"
  source: "b12878d5917a"
