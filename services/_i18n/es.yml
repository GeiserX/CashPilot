  text: "Varía según la ubicación. Las IP de EE. UU. y la UE ganan más. Máximo 10 dispositivos por cuenta."
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "Mínimo $20 (20,000 créditos). Dos opciones: PayPal a través de Tipalti, con una comisión de alrededor del 15%, o créditos de JumpTask sin comisión, pagados en una billetera de JumpTask. Cada solicitud necesita un código de 6 dígitos que se envía por correo. El primer pago por PayPal se queda en \"waiting for details\" hasta que te registras en Tipalti desde el enlace que te envían por correo. Ese enlace solo funciona una vez, así que ábrelo cuando puedas terminar de una sentada y tengas el móvil a mano: después de crear una contraseña, Tipalti te hace confirmar un número de móvil por SMS (los códigos caducan en pocos minutos) y luego te pide tu nombre, dirección, país y fecha de nacimiento, y tu dirección de PayPal. Tipalti cobra $2.02 por pago; elige USD para evitar su comisión de conversión de divisa del 1.9-3%. El pago llega en un plazo de 2 días hábiles. El saldo sale de tu cuenta en cuanto lo solicitas, aunque el pago siga esperando a Tipalti. Cada vez que vuelvas a iniciar sesión en Tipalti te enviará un nuevo código por SMS, salvo que marques la opción de recordar el dispositivo durante 30 días. En octubre de 2026, Tipalti no pidió un formulario fiscal a un beneficiario en España."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Saldo en poder de Honeygain; se retira bajo petición."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Usa el correo y la contraseña de tu cuenta de Honeygain (los mismos que en <a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a>)."
  source: "fd0be22aeb14"
