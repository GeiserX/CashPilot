proxybase.description:
  text: "ProxyBase es una plataforma de ancho de banda compartido que paga en criptomonedas a los usuarios por compartir la conexión a internet que no usan. El cliente peer se autentica con un Access Token de tu panel. Las IP residenciales son las que más ganan, pero también se admiten IP de centros de datos. Imagen oficial de Docker multiarquitectura (amd64/arm64/armv7).\n"
  source: "7a558682be11"
proxybase.short_description:
  text: "proxybase.org: ancho de banda compartido, pago en cripto, autenticación con Access Token. No se genera ninguna billetera"
  source: "5224bb16fee4"
proxybase.docker.env.ID.label:
  text: "Access Token"
  source: "f9db72ced1ee"
proxybase.docker.env.NAME.label:
  text: "Nombre del dispositivo"
  source: "6415f86bc24f"
proxybase.docker.env.ID.description:
  text: "Inicia sesión en <a href=\"https://peer.proxybase.org/dashboard/login?referral=nXzS3c6iTO\">peer.proxybase.org/dashboard</a> → copia tu Access Token (aparece en el comando de Docker de la página de configuración)"
  source: "3571c2e99729"
proxybase.docker.env.NAME.description:
  text: "Cualquier nombre (sin espacios) para identificar este dispositivo en tu panel de ProxyBase"
  source: "906ebedecbc7"
proxybase.docker.health_signals.0.means:
  text: "ProxyBase lleva al menos media hora sin llegar a su relay, así que no gana nada. Un reinicio lo soluciona; si sigue igual después de reiniciar, comprueba que este equipo tiene acceso a internet."
  source: "cbe6b5ef771f"
proxybase.earnings.notes:
  text: "Pagos en cripto. Las ganancias dependen de la ubicación y del uso de ancho de banda."
  source: "39229c292994"
proxybase.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
proxybase.cashout.notes:
  text: "El sitio indica un mínimo de $0.20, y una solicitud de menos de $1 se completó en octubre de 2026. Cada solicitud retira siempre el saldo completo, en USDC en Polygon, POL o Litecoin, a una dirección que escribes. ProxyBase cubre la comisión de red."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "Las ganancias se acumulan en la CUENTA de ProxyBase a la que pertenece el Access Token y se retiran desde el panel bajo petición. El cliente peer no tiene billetera y el contenedor no guarda estado: docker.volumes está vacío. No confundir con proxybase-xyz (ProxyBase Markets, de la misma organización), que sí crea una billetera local y la declara como volumen crítico."
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
  text: "La propia ProxyBase escribió en agosto de 2025 que es nueva y que todavía no es el sitio para maximizar ganancias."
  source: "9f5177f749d7"
proxybase.rating.cons.1.text:
  text: "ProxyBase cambió de cliente peer en 2026 y apagó el backend antiguo, así que los contenedores con la imagen antigua siguieron funcionando, pero dejaron de ganar."
  source: "452b38e35357"
proxybase.rating.cons.2.text:
  text: "Solo cripto, en USDC en Polygon, POL o Litecoin, sin ningún método en moneda fiduciaria. El mínimo es $0.20 y ProxyBase paga la comisión de red."
  source: "2f15ff41b14c"
proxybase.rating.pros.0.text:
  text: "Nuestro retiro de menos de $1 se completó en octubre de 2026."
  source: "00e8781a2252"
proxybase.rating.pros.1.text:
  text: "Un retiro solo necesita una dirección escrita en la solicitud."
  source: "985d03ae1755"
proxybase.rating.pros.2.text:
  text: "ProxyBase publica su propia imagen del cliente peer y admite IP de centros de datos."
  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets es un mercado de proxies SOCKS5 creado para agentes de IA. Los vendedores ejecutan un daemon CLI ligero escrito en Rust que se conecta por WebSocket para retransmitir el tráfico de los compradores a través de su conexión a internet, y ganan USDC en Tempo Chain por cada GB vendido. Admite los modos directo (ancho de banda propio) y upstream (reventa de proxies externos), con reconexión automática. Los compradores adquieren sesiones de proxy por país, ISP y ancho de banda. Los pagos pasan por el Machine Payments Protocol (MPP) en Tempo Chain. El enlace de referido es para compradores: un comprador que abre la consola desde él recibe un 10% extra en su primer depósito.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz: mercado SOCKS5 para agentes de IA, pago en USDC. Genera una billetera cuyo volumen guarda la única copia de la clave"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "URL de la API del backend"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "Sustituye la URL de la API del backend (por defecto, https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "El contenedor se configura solo en el primer arranque: genera una billetera secp256k1 (BIP-39), se autentica mediante desafío-respuesta ECDSA y empieza a vender ancho de banda en modo solo directo. Todo el estado (billetera, token de sesión, configuración de vendedor) se guarda en el volumen <code>proxybase-data</code>. En el primer arranque, consulta los registros del contenedor para ver la dirección de la billetera. Usa <code>--upstream</code> para añadir rutas de reventa de proxies externos.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "El archivo de claves de la billetera generada. Este volumen ES el dinero: no hay ninguna copia en el servidor, así que si lo borras, destruyes los fondos con él."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Ganancias según los GB vendidos a precio de mercado. Las IP de VPS/centros de datos ganan menos que las residenciales. El modo multi-upstream puede combinar tu propio ancho de banda con proxies externos."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Bloquea las ganancias con <code>proxybase-cli seller payout create</code> y las recibirás en USDC en Tempo Chain (Tempo MPP). Paga a cualquier dirección EVM cuya clave tengas (Tempo es una cadena EVM), sin nada que firmar; añade la red Tempo a la billetera para ver los USDC. Si la billetera sigue sin mostrarlos, tendrás que añadir a mano el token USDC de Tempo: impórtalo con la dirección de contrato que da Proxybase, y comprueba esa dirección antes de fiarte del saldo."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "El cliente crea su propia billetera en el primer arranque."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "15% de cada depósito que haga un comprador referido, como crédito para tus propias sesiones de proxy"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "+10% en el primer depósito de un comprador"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "Ancho de banda, como proxy SOCKS5 vendido a compradores en el mercado de ProxyBase."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Sí. Los compradores envían su tráfico a través de tu conexión: eso es exactamente lo que se vende."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Una dirección de billetera generada en tu máquina, más el volumen de tráfico que retransmites."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Real, y afecta directamente a las conexiones domésticas. El tráfico de proxy de compradores desconocidos sale con tu IP, así que las denuncias por abuso te llegan a ti. Nada en este catálogo limita el servicio a direcciones de centros de datos, y las IP residenciales ganan más, así que aquí el incentivo apunta en la dirección equivocada: lee las condiciones de tu ISP antes de ejecutarlo en casa."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "desconocido: el proveedor no publica un límite de dispositivos por cuenta ni por IP, y el catálogo no declara ninguno."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "Los pagos son en USDC en Tempo Chain, a cualquier dirección EVM cuya clave tengas."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "Tu conexión se vende como proxy SOCKS5 a los compradores del mercado; no encontramos ninguna descripción de cómo se verifica a los compradores."
  source: "2dec55ca610f"
proxybase-xyz.rating.pros.0.text:
  text: "Su propia página para ganar dinero se titula como sin KYC, con un pago de $1."
  source: "25b6dc3b4608"
proxybase-xyz.rating.pros.1.text:
  text: "ProxyBase publica su propia imagen del cliente y acepta conexiones de centros de datos."
  source: "ae81d006093f"
