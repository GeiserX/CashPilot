proxyrack.docker.env.API_KEY.description:
  text: "Inicia sesión en <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → la API Key aparece en la página principal del panel (si la indicas, el dispositivo se registra automáticamente). ¿No tienes cuenta? Regístrate con <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
