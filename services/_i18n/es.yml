# Spanish translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/es.yml --restamp '<key>'
2miners-etc.description:
  text: "Sigue el saldo pendiente de Ethereum Classic que 2Miners guarda para tu dirección pública de pago de ETC. Ejecuta tu propio minero y apúntalo al pool. CashPilot lee el saldo y te pide que confirmes los pagos cuando el saldo baja.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Pool de minería de Ethereum Classic, seguido por tu dirección de pago"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (ajustable)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "El pool comprueba tu umbral de pago cada dos horas"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners paga a tu dirección automáticamente cuando alcanzas el umbral que elegiste. El umbral más bajo para pagos en ETC es 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "El saldo pendiente se acumula en 2Miners. El saldo de la billetera es una lectura aparte desde Ethereum Classic. Comprueba en tu billetera la cantidad que recibiste antes de confirmar un pago en CashPilot.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Introduce la dirección pública de pago de Ethereum Classic que usa tu minero en 2Miners, que empieza por <b>0x</b>. No incluyas ningún nombre de worker.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Necesita un minero ETCHash apuntado a 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "cómputo"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "No. Tu minero envía trabajo de minería al pool."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "El pool usa tu dirección de pago, los nombres de worker que elijas y la dirección IP de tu minero."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Cualquiera puede ver las estadísticas por dirección de pago. El pool pide confirmar la IP del worker para cambiar el umbral."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "El pool cobra una comisión del 1% y retiene los pagos hasta que alcanzas tu umbral."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (antes ATOR) es una red de privacidad descentralizada de enrutamiento cebolla. Los operadores de nodos ejecutan nodos de retransmisión (relays) y ganan tokens ANYONE por el ancho de banda que aportan. Piensa en un \"Tor con incentivos\". CashPilot lo ejecuta desde su propia imagen, creada a partir del paquete Debian firmado del proyecto, para amd64 y arm64. La configuración se hace con un archivo anonrc montado en el contenedor (Nickname, ContactInfo, ORPort, etc.). Un relay no gana nada hasta que se bloquean 100 ANYONE para él durante al menos 180 días, y las recompensas se reclaman firmando en tu billetera. El relay también publica tu IP pública en el directorio de relays de la red, lo que puede dañar la reputación de IP por la que pagan las apps de ancho de banda residencial.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Enrutamiento cebolla descentralizado: nodos relay de Tor con incentivos"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Clave de identidad ed25519 del relay. Si la destruyes, el relay pierde su reputación y su historial de ganancias vuelve a empezar de cero."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Solo paga con 100 ANYONE bloqueados por relay durante al menos 180 días y una reclamación de recompensa firmada en tu billetera. Sin ese stake, un relay no gana nada. Con él, las ganancias dependen del ancho de banda aportado y del tiempo en línea."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Por épocas"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Se define como ContactInfo en anonrc, con el prefijo '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Huellas (fingerprints) de los relays separadas por comas. Este dato no está en ningún panel web: ejecuta <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> en el equipo que ejecuta el relay.\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Ancho de banda, como relay en la red Anyone (un fork de Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Sí. Retransmite el tráfico de otras personas. Que tu IP sea el último salto depende de si el relay está configurado como salida (exit)."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "La clave de identidad pública del relay, tu IP y puerto, y las estadísticas de tiempo en línea, todo publicado en el directorio de la red por diseño. Si defines ContactInfo en tu anonrc, también se publica ahí y queda indexado de forma pública y permanente. Suele ser una dirección de correo, así que déjalo vacío salvo que quieras que sea público."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Real. El tráfico del relay se atribuye a tu conexión. Los relays de salida en particular atraen denuncias por abuso; muchos ISP domésticos los prohíben."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "No hay ninguna cuenta en la que registrarse, así que no hay nada que limitar por cuenta. Para ganar sigues necesitando una billetera de Ethereum con 100 ANYONE bloqueados por cada relay durante al menos 180 días, y CashPilot necesita las huellas de los relays para leer las recompensas. El proyecto no publica un límite de relays por IP, y el catálogo no declara ninguno."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Un relay no gana nada salvo que se bloqueen 100 ANYONE para él durante al menos 180 días, y cada reclamación de recompensa se firma en tu billetera."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Retransmite el tráfico de otras personas por diseño, sin verificar quiénes son; los relays de salida atraen denuncias por abuso."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "La identidad, la IP y el tiempo en línea del relay se publican en el directorio de la red, y cualquier ContactInfo que definas queda público para siempre."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "No hay ninguna cuenta en la que registrarse. Un relay solo necesita una billetera, sin verificación de identidad."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "El software del relay es un fork publicado de Tor, bajo la licencia de Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot crea su propia imagen a partir del software de relay publicado por Anyone, que no necesita cuenta."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping es una plataforma descentralizada de monitorización de redes que te paga por ejecutar un nodo. Tu nodo monitoriza sitios web, mide la latencia y comprueba la calidad de la red para los clientes de Bitping. Funciona tanto con conexiones residenciales como de VPS. La imagen de Docker inicia sesión con las variables de entorno BITPING_EMAIL y BITPING_PASSWORD en el primer arranque (\"Attempting login with environment variables\" en su propio registro) y después guarda la sesión en el volumen montado, así que los reinicios no vuelven a autenticarse.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Ancho de banda compartido: monitorización de redes descentralizada, funciona en VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "Correo electrónico"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Contraseña"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "El correo de tu cuenta de Bitping (el mismo inicio de sesión que en <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "La contraseña de tu cuenta de Bitping. Se usa una vez para crear la sesión del nodo, que después se guarda en el volumen de datos."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Las ganancias dependen de la calidad de la red y de la demanda de monitorización desde tu ubicación. Se aceptan nodos en VPS."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Las ganancias de los nodos están en nodes.bitping.com; app.bitping.com es el panel de clientes de la API. Los retiros son solo en SOL: cuando el saldo pendiente supera $0.05, escribe la dirección de Solana en la solicitud, que se procesa en 24 horas. Una billetera de Solana nueva o vacía necesita primero unos 0.001 SOL, por el mínimo de renta de la red."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Ahora solo Solana, y la dirección se escribe EN EL MOMENTO DEL RETIRO en lugar de guardarse."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Usa el correo y la contraseña de tu cuenta de Bitping (los mismos que en <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Retira tu saldo de Bitping"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping puede anular las ganancias sin reclamar durante más de 12 meses, tras avisar por correo con 30 días de antelación."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Solicita un retiro en SOL en nodes.bitping.com y escribe tu dirección de Solana en la solicitud."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Los retiros se pagan en Solana (SOL), a una dirección que escribes en cada solicitud."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "La ayuda de Bitping dice que un retiro a una billetera de Solana nueva y vacía puede fallar hasta que tú mismo le pongas un poco de SOL."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "La ayuda de Bitping dice que se admiten servidores y contenedores Docker."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Un retiro solo necesita una dirección de Solana escrita en la solicitud."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit es un servicio de ancho de banda compartido que paga por PayPal y Stripe. No hay imagen oficial de Docker; los clientes son la app de escritorio para Windows y la app de Android. El servicio está en bytebenefit.io -- el antiguo dominio bytebenefit.com se abandonó y está aparcado en un mercado de dominios, por eso en su momento se marcó aquí como muerto.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Ancho de banda compartido: pagos por PayPal/Stripe, app de escritorio/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "No hay imagen de Docker disponible. Solo apps de escritorio para Windows y de Android."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% de las ganancias por tráfico de los referidos"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "Bono de bienvenida de $1 (10,000 Coins)"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "La ficha de la app en Google Play dice que tu tráfico atiende peticiones de inteligencia web de clientes de Infatica, sin decir quiénes son ni cómo se verifican."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "La app de Android salió de Google Play en abril de 2026, tras 17 meses."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot no ejecuta ByteBenefit: usas la app del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir te permite obtener ingresos pasivos compartiendo el ancho de banda de internet que no usas. Solo admite Windows y Android: las FAQ oficiales dicen que no hay previsto un cliente para Linux ni Docker, iOS no se admite y macOS no se ofrece. Las ganancias dependen mucho de la ubicación. Panel web en dash.bytelixir.com para el seguimiento. No hay imagen de Docker disponible.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Ancho de banda compartido: solo Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Cookie de sesión"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Cookie Remember Web"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "Token XSRF"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Inicia sesión en <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, pulsa F12 → Application → despliega <b>Cookies</b> en la barra lateral izquierda → haz clic en el subelemento <code>https://dash.bytelixir.com</code> → en la lista de cookies de la derecha, busca <code>bytelixir_session</code> → copia su Value (un JWT largo que empieza por eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "En el mismo sitio (Cookies → <code>https://dash.bytelixir.com</code>) → busca la cookie llamada <code>remember_web_...</code> → copia su Value (opcional, alarga la duración de la sesión)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "En el mismo sitio → busca <code>XSRF-TOKEN</code> → copia su Value (opcional)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Las ganancias varían según la ubicación ($2-50/mes). No hay imagen de Docker. Se necesita la app de escritorio o la app de Android."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Solo cripto. El mínimo depende de la moneda: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Escribes la dirección en cada solicitud. Las solicitudes se atienden en horario laboral, en un plazo de 24 horas."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Saldo en poder de Bytelixir; la dirección de la billetera se escribe en cada solicitud de pago y nunca se guarda en el contenedor."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Inicia sesión en <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>marcando Remember Me</b>, pulsa F12 → Application → despliega <b>Cookies</b> en la barra lateral izquierda → haz clic en <code>https://dash.bytelixir.com</code> y copia tres valores: <b>bytelixir_session</b>, <b>remember_web_…</b> (la larga que empieza por ese prefijo) y <b>XSRF-TOKEN</b>. La cookie de sesión sola caduca unas dos horas después de copiarla, así que la recolección se detiene esa misma tarde; la cookie remember_web dura un año y es la que lo mantiene funcionando."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50% de su beneficio de por vida"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "Bono de bienvenida de $1"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Solo cripto, y el mínimo depende de la moneda, desde $5 en USDT hasta $250 en Bitcoin."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot no ejecuta Bytelixir: usas la app del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Trustpilot le da un 4.6 con 283 reseñas, la mayoría elogiando los pagos en cripto; unas pocas dicen que los pagos no llegaron."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Un pago solo necesita una dirección de cripto escrita en la solicitud."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai es un mercado de GPU entre particulares. Publicas una máquina Linux con GPU NVIDIA, fijas tus propios precios spot y bajo demanda, y los inquilinos ejecutan en ella sus propios contenedores Docker. Solo cobras por los minutos en que está alquilada, en CLORE, BTC, USDT o USDC. Para alojar necesitas una máquina x86_64 con Ubuntu 22.04 o posterior (o HiveOS), un controlador de NVIDIA que funcione y al menos 100 Mbps de subida y de bajada. Las GPU de AMD no se admiten.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "Mercado de GPU: alquila GPU NVIDIA, cobra en CLORE, BTC o stablecoins en USD"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Solo cobras los minutos alquilados, al precio que fijas. El máximo del rango, $490, es el techo que da la propia Clore para una RTX 4090 publicada por minutos ('up to ~$490/month'); las tarjetas más pequeñas ganan menos y una tarjeta inactiva no gana nada. Clore se queda con el 5% (bajo demanda) o el 1.25% (spot) de cada alquiler, más un 15% cuando el inquilino paga en BTC, USDT o USDC en lugar de CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Retira desde Account > Billing a tu propia billetera: CLORE (ERC-20, mínimo 200, comisión de unos $0.50), BTC (mínimo 0.0001, comisión de 0.00005 BTC) o USDT/USDC en Ethereum o BNB Chain (mínimo $10, comisión de $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore guarda el saldo (CLORE, BTC y un saldo en USD para USDT/USDC) hasta que retiras. La cadena se elige en cada retiro: Ethereum para CLORE, Bitcoin para BTC, Ethereum o BNB Chain para USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (nivel estándar) de las comisiones de la plataforma que pagan los anfitriones e inquilinos que refieres, en cada alquiler; el código no caduca nunca; se paga en la moneda del alquiler (CLORE, BTC o USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps de subida y de bajada"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "Tiempo de cómputo de GPU en tu máquina."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Sí. Los inquilinos ejecutan sus propios contenedores Docker en tu máquina y su tráfico sale por tu conexión; los puertos SSH y de aplicación se redirigen a internet."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "La política de privacidad de Clore cubre los datos de la cuenta y tu dirección IP con una ubicación aproximada; documentos de identidad solo si Clore pide KYC."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Los puertos de entrada deben ser accesibles desde internet (22, 8080 y 3000-4000 por defecto) y en tu línea se ejecutan cargas de trabajo de desconocidos. La propia guía de red de Clore dice que algunos ISP bloquean el alojamiento."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "Mayores de 18 años, fuera de países sancionados. Clore puede suspender o cerrar una cuenta a su entera discreción, y un uso prohibido puede costar los fondos."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Ni las condiciones ni la política de privacidad nombran una entidad legal, y las condiciones dejan la jurisdicción aplicable para una versión posterior."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore puede suspender o cerrar una cuenta a su entera discreción, y un uso prohibido puede llevar a la pérdida de los fondos."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Los pagos son solo en cripto (CLORE, BTC, USDT o USDC), y Clore se queda un 15% extra de un alquiler que el inquilino paga en BTC, USDT o USDC, salvo que el anfitrión bloquee CLORE para reducirlo."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Un anfitrión solo cobra los minutos alquilados, y la cifra de Clore para una RTX 4090 es un techo (\"up to ~$490/month\") para una sola tarjeta."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "El uso básico no necesita KYC, pero Clore puede pedir verificación de identidad para retiros grandes o por cumplimiento normativo."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Los inquilinos ejecutan cualquier imagen pública de Docker en tu máquina. Las condiciones enumeran los usos prohibidos (malware, DDoS, CSAM y más), pero no encontramos ninguna descripción de cómo se verifica a los inquilinos."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot no ejecuta Clore.ai: instalas el agente de alojamiento de Clore en tu propia máquina con GPU (Ubuntu 22.04 o posterior, o HiveOS), así que CashPilot no puede desplegarlo ni actualizarlo por ti."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Clore se queda con el 5% de un alquiler bajo demanda (1.25% en spot) cuando el inquilino paga en CLORE, sin comisión extra."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN gestiona una red de validadores que comprueba el ancho de banda y la cobertura de la infraestructura de IA financiada a través del protocolo DAWN. La extensión de navegador DAWN Validator participa en estas comprobaciones de prueba de ancho de banda y de cobertura y gana recompensas DAWN mientras está en marcha. Las recompensas aún no tienen un valor en efectivo fijado. Crea la cuenta en la extensión e introduce el código de referido 2QLQV97F cuando te lo pida.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "Validador DePIN: la extensión de navegador gana puntos DAWN"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Gana Dawn Points antes del lanzamiento del token. El valor real depende del precio futuro del token. El equipo de hardware gana más que la extensión de navegador."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Airdrop de tokens (por anunciar)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "La extensión funciona, pero está a medio hacer. Se ha anunciado el hardware Black Box. Revísalo más adelante."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "La extensión gana puntos; en octubre de 2026 no se había confirmado ningún reparto de tokens a los operadores de nodos."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "Los puntos no tienen un valor fijado hasta que se lance un token y se anuncie su conversión."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot no ejecuta Dawn: usas la extensión de navegador del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network es un proyecto descentralizado de VPN e infraestructura web3. Principalmente requiere dispositivos de hardware propietarios Deeper Connect. Moken es una plataforma relacionada de minería/staking. No funciona solo con software.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "VPN descentralizada: requiere un dispositivo de hardware propietario"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Requiere hardware Deeper Connect ($200-500). Plataforma Moken para minería/staking. No funciona solo con software."
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "Continuo"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "Comisión por la venta del dispositivo"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "5% de descuento en el dispositivo Deeper Connect con el cupón SERGIO"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "Las recompensas de minería son en DPR y dependen de una puntuación de crédito que crece despacio o haciendo staking de DPR."
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot no ejecuta Deeper Network: usas el router de hardware del propio proveedor, así que CashPilot no puede desplegarlo ni actualizarlo por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "b1ba1636070f"
earnapp.description:
  text: "EarnApp de Bright Data te permite vender el ancho de banda que no usas para obtener ingresos pasivos. Bright Data es la mayor red de proxies del mundo y da servicio de recopilación de datos a empresas de Fortune 500. CashPilot lo ejecuta desde su propia imagen, que descarga la versión fijada de EarnApp desde la CDN de Bright Data en el primer arranque, comprueba su sha256 y la ejecuta en modo lite solo con un UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Ancho de banda compartido: respaldado por Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "UUID del nodo"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "El ID de tu nodo de EarnApp: sdk-node- seguido de 32 caracteres hexadecimales en minúscula, tal como lo muestra 'earnapp showid'. Después de desplegar, vincúlalo una vez abriendo https://earnapp.com/r/ seguido de este UUID con la sesión de EarnApp iniciada; un nodo sin vincular gana, pero nada llega a tu saldo"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp no consigue conectar con sus servidores y se reinicia una y otra vez, así que gana poco o nada. Reinicia esta copia; si sigue pasando, revisa la conexión a internet de este equipo."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Abre este enlace con la sesión de EarnApp iniciada para añadir el nodo a tu cuenta. Hasta que lo hagas, el nodo gana, pero nada llega a tu saldo."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Depende mucho de la ubicación. Las IP de EE. UU. y la UE son las que más ganan. Las ganancias crecen con el ancho de banda consumido."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Bajo petición (canje automático disponible: PayPal mín. $10, Wise mín. $10, Amazon mín. $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Activa el canje automático una vez y EarnApp pagará solo cada vez que el saldo llegue al mínimo del método: PayPal $10, Wise $10, Amazon $50. Los pagos por PayPal llegan de Bright Data Ltd. En octubre de 2026, un pago por PayPal llegó con un 2% menos aproximadamente que el saldo canjeado."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Saldo en poder de EarnApp; se canjea en Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Inicia sesión en <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, pulsa F12 → Application → Cookies y copia el valor de <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% de sus ganancias de por vida, pagado aparte de lo suyo"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "El centro de ayuda de EarnApp dice que está estrictamente prohibido instalarlo en contenedores Docker, máquinas virtuales, servicios de hosting o servidores domésticos, que es justo como lo ejecuta CashPilot."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "El mismo artículo de ayuda dice que una cuenta que se detecte funcionando así se cancela sin aviso y se anulan sus pagos pendientes."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Nuestro pago por PayPal llegó en octubre de 2026, con un 2% menos aproximadamente que el saldo canjeado."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "Un mínimo de $10 para PayPal y Wise, con canje automático que paga solo."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp pertenece a Bright Data, y sus pagos por PayPal llegan de Bright Data Ltd., una empresa identificada."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm te paga por compartir tu ancho de banda de internet. El recolector de ganancias usa autenticación con correo y contraseña a través de Supabase. Imagen de Docker ligera con un despliegue sencillo (el cliente de Docker usa un token UUID aparte).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "Ancho de banda compartido: autenticación con correo y contraseña, cliente ligero"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "Clave de API"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "Inicia sesión en <a href=\"https://app.earn.fm\">app.earn.fm</a> → haz clic en el icono de tu perfil (arriba a la derecha) → Account Settings → copia la API Key (formato UUID)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "Plataforma relativamente nueva. Las ganancias varían según la ubicación y el ancho de banda disponible."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "Mínimo $15. Métodos: USDT en BEP20 o Polygon (comisión de $1) o TRC20 (comisión de $3), PayPal, tarjetas regalo de Amazon o Starbucks desde $15, o transferencia bancaria desde $1,000 con las comisiones de transferencia descontadas. Antes del primer pago rellenas un perfil de facturación (nombre legal y dirección), que se usa para los recibos de pago."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "Saldo en poder de Earn.fm; se retira bajo petición."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Usa el correo y la contraseña de tu cuenta de Earn.fm (los mismos del inicio de sesión en <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10% de sus ganancias de por vida"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "Saldo inicial de $5"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "Un mínimo de $15, una comisión de $1 a $3 en USDT y transferencia bancaria solo desde $1,000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Antes del primer pago rellenas un perfil de facturación con tu nombre legal y tu dirección."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Reseñas de 2025 dicen que el soporte por correo y por Discord no responde; Trustpilot indica que Earn.fm no ha contestado a las reseñas negativas."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Earn.fm publica su propia imagen de Docker, earnfm/earnfm-client."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher es una plataforma de intercambio de tráfico en la que ganas créditos visitando sitios web con una surfbar automática. Funciona como extensión/complemento del navegador. No es un servicio clásico de ancho de banda compartido: genera tráfico navegando por sitios web de forma automática.\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "Surfbar de intercambio de tráfico: extensión de navegador"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "Ganancias en puntos BTP convertibles a EUR. Solo extensión de navegador."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "Pago en euros por PayPal o transferencia bancaria."
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "CashPilot no ejecuta eBesucher: es una extensión de navegador, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "Pagos desde 2 euros por PayPal o SEPA, al menos una vez a la semana, sin comisión."
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "eBesucher funciona desde 2002."
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "El aviso legal nombra al operador, TurboAd GmbH, registrada en Berlín-Charlottenburg (HRB 160730 B)."
  source: "84cbddd4330b"
flux.description:
  text: "Flux es una infraestructura de cómputo distribuida por todo el mundo. Los operadores de nodos hacen staking de tokens FLUX y aportan recursos de servidor. Tres niveles: Cumulus (1,000 FLUX), Nimbus (12,500 FLUX), Stratus (40,000 FLUX). Hay imágenes oficiales de Docker.\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "Cómputo descentralizado: requiere stake de tokens FLUX"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "Requiere un stake de 1,000+ FLUX (~$50-500 según el precio). Los niveles más altos necesitan más garantía, pero ganan más."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "Recompensas por bloque"
  source: "590433237f8a"
flux.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "El nivel de nodo más pequeño necesita 1,000 FLUX bloqueados como garantía."
  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "La recompensa por bloque baja un 10% cada año, y una guía de 2026 vio que las recompensas del nivel pequeño son flojas en dólares."
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "CashPilot no ejecuta Flux: usas el software de nodo del propio proveedor, así que CashPilot no puede desplegarlo ni actualizarlo por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "El daemon de Flux es de código abierto bajo la licencia MIT."
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network es un mercado de cómputo descentralizado en el que compartes recursos de CPU y GPU a cambio de tokens GLM. Los proveedores ejecutan el agente Yagna, que gestiona la ejecución de las cargas de trabajo en entornos aislados. Es uno de los proyectos de cómputo descentralizado más antiguos (fundado en 2016). Admite tareas de CPU, renderizado por GPU y cómputo de uso general. Pagos a través de Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Mercado de cómputo descentralizado: tokens GLM con el agente Yagna"
  source: "88f817c25848"
golem.earnings.notes:
  text: "Las ganancias dependen del hardware, los precios y la demanda de tareas. Los nodos solo con CPU ganan menos. Los nodos con GPU ganan más, pero requieren NVIDIA. Ejecuta el agente proveedor Yagna (no una imagen de Docker). Pagos en Polygon en tokens GLM."
  source: "07287d437d51"
golem.payment.frequency:
  text: "Al completar cada tarea"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "Se ganan tokens GLM. Configura la billetera de pago en la configuración del proveedor."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot no ejecuta Golem: instalas tú mismo el agente proveedor, así que CashPilot no puede desplegarlo ni actualizarlo por ti. Golem documenta cómo ejecutar el proveedor en su propia imagen de Docker."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "El agente proveedor, yagna, es de código abierto bajo la GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Sin cuenta: defines una billetera de pago en la configuración del proveedor."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "La red funciona desde hace unos diez años."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "La política de privacidad de Golem nombra al operador, Golem Factory GmbH, en Zug (Suiza)."
  source: "bae79b651923"
grass.description:
  text: "Grass es una red descentralizada que te permite vender el ancho de banda que no usas para datos de entrenamiento de IA. Funciona como extensión de navegador y app de escritorio, y envía peticiones de web scraping a través de tu conexión para crear conjuntos de datos estructurados. Con más de 8.5M de usuarios, es una de las mayores redes DePIN de ancho de banda. Gana tokens GRASS en la blockchain de Solana.\n"
  source: "046951d812f9"
grass.short_description:
  text: "Ancho de banda compartido DePIN para datos de IA: gana tokens GRASS"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Token de acceso"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Inicia sesión en <a href=\"https://app.grass.io\">app.grass.io</a>, pulsa F12 → Application → Local Storage → haz clic en <code>https://app.grass.io</code> → copia el valor de <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Gana Grass Points convertibles a tokens GRASS mediante airdrops. El valor real en USD depende del precio del token. Se necesita la extensión de navegador o la app de escritorio."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Airdrop por épocas"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Las recompensas llegan como repartos periódicos que se reclaman en el panel de Grass. El reparto de la Stage 2 (actividad de octubre de 2024 a junio de 2026) se paga en USDC: reclámalo en app.grass.io/dashboard como muy tarde el 22 de enero de 2027, o antes si se reclaman primero todas las asignaciones. Grass se queda con las recompensas sin reclamar."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "Acumula PUNTOS; GRASS se reclama desde el panel de Grass durante los airdrops periódicos."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Inicia sesión en <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, pulsa F12 → Application → Local Storage y copia el valor de <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% de los puntos por tiempo en línea de los referidos directos, 10% en el segundo nivel, 5% en el tercero"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Reclama tus USDC de la Stage 2 de Grass"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Grass se queda con toda asignación de la Stage 2 que no se haya reclamado el 22 de enero de 2027 como muy tarde, y el plazo puede cerrarse antes si ya se han reclamado todas las asignaciones."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Inicia sesión en app.grass.io con la cuenta que usaste en la Stage 2, activa la Grass Wallet, abre la pestaña Allocation y confirma. Reclama solo en app.grass.io. ¿No tienes puntos de la Stage 2? Elige No es para mí."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Las recompensas solo llegan con las temporadas de airdrop. Operadores de nodos veteranos calcularon para la temporada 2 entre unos pocos dólares y unas pocas decenas."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "Las recompensas de la temporada 2 que no se reclamen como muy tarde el 22 de enero de 2027 se pierden para siempre."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "El primer airdrop provocó críticas por las pequeñas recompensas por punto, repartidas entre más de dos millones de usuarios."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot no ejecuta Grass: usas la app o la extensión del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "El primer airdrop llegó a casi 1.5 millones de direcciones que lo reclamaron."
  source: "a4c55e10affa"
helium.description:
  text: "Helium es una red inalámbrica descentralizada consolidada. Empezó con hotspots LoRaWAN y ahora se ha ampliado a 5G. Requiere hardware dedicado ($500+). Gana tokens HNT/MOBILE. El retorno de la inversión ha caído mucho: lo típico es $4-8/mes.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "Red inalámbrica descentralizada: requiere hardware, tokens HNT"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "Requiere comprar hardware de $500+. El retorno de la inversión ha caído mucho. Proceso de aprobación para nuevos operadores."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "Por épocas"
  source: "75743e03bad2"
helium.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "La HIP 149 eliminó las recompensas de Proof-of-Coverage el 6 de julio de 2026; los hotspots IoT ahora solo ganan por los datos que transportan, y más de 114,000 de ellos no transportaron ninguno."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "El modelo de recompensas de Helium ha cambiado por votación varias veces, su CEO dimitió y HNT cayó alrededor de un 96%."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot no ejecuta Helium: usas el hotspot de hardware del propio proveedor, así que CashPilot no puede desplegarlo ni actualizarlo por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "4828f2a97494"
helium.rating.pros.0.text:
