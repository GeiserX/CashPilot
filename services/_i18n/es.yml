  source: "b5143d72ce35"
proxyrack.device_link.steps:
  text: "Inicia sesión en ProxyRack, abre Devices, elige Add device y pega este UUID. Mientras el dispositivo no esté en tu cuenta, no gana para nadie. Si introdujiste una clave de API, el contenedor se registra solo: comprueba que el dispositivo aparece ahí."
