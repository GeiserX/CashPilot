packetstream.description:
  text: "PacketStream es un mercado de ancho de banda entre particulares donde puedes vender el ancho de banda que no usas. Da servicio a una red de proxies residenciales que se usa para estudios de mercado, monitorización SEO y verificación de anuncios. Configuración sencilla en Docker: solo hace falta un CID (Client ID). Ten en cuenta que el inicio de sesión protegido con CAPTCHA puede dificultar la recolección automática de ganancias.\n"
  source: "ee363f486228"
packetstream.short_description:
  text: "Ancho de banda compartido: configuración sencilla con CID"
  source: "583d6cb0e210"
packetstream.docker.env.CID.label:
  text: "Client ID"
  source: "8726db013948"
packetstream.docker.env.CID.description:
  text: "Inicia sesión en <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> → haz clic en Setup en la barra lateral → tu CID aparece en el comando de Docker"
  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream rechaza la dirección IP de esta copia por no ser residencial, así que no gana nada. Ejecútala en un equipo cuya conexión a internet sea una línea doméstica, o elimina esta copia."
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "PacketStream ya tiene otro cliente en esta dirección IP y solo paga a uno por IP. Elimina esta copia, o la otra que comparte su IP."
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "Paga $0.10/GB por el ancho de banda compartido. Las ganancias dependen mucho de la demanda en la ubicación de tu IP."
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "Solo PayPal, mínimo $5, con una comisión del 3% que se muestra antes de confirmar. El primer retiro guarda tu correo de PayPal; cambiarlo después requiere una confirmación por correo y una espera de 7 días, así que revisa la dirección antes de confirmar. Las solicitudes se revisan y se envían en un plazo de 7 días; puedes cancelar una mientras espera, y solo puedes hacer una nueva cuando se haya pagado."
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "Saldo en poder de PacketStream; se retira bajo petición."
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "Inicia sesión en <a href='https://packetstream.io' target='_blank'>packetstream.io</a>, pulsa F12 → Application → Cookies y copia el valor de la cookie <b>auth</b> (es un JWT)."
  source: "15bae9d455f5"
packetstream.referral.bonus.referrer:
  text: "20% de sus ganancias por ancho de banda (bono Packeter por tiempo limitado)"
  source: "964a44bb9e65"
packetstream.referral.bonus.referee:
  text: "10% de crédito extra en tu primer depósito con tarjeta o PayPal (clientes de proxy)"
  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "Reseñas de Trustpilot de 2025 y 2026 cuentan que los pagos llegan tarde o no llegan, y un usuario veterano dice que los pagos se ralentizaron y luego se detuvieron; otros en 2026 dicen que sí cobraron."
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "Solo PayPal, con una comisión de retiro del 3%; los usuarios de países donde PayPal no opera no tienen otro método."
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "Las condiciones permiten a PacketStream retener, revertir o invalidar las ganancias que relacione con fraude, manipulación o actividades prohibidas."
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
  text: "Las condiciones dicen que los clientes de proxy y la propia PacketStream envían tráfico a través de tu conexión; no describen ninguna verificación de los compradores normales."
  source: "fd4707690d2b"
packetstream.rating.cons.4.text:
  text: "Trustpilot indica que PacketStream no ha contestado a las reseñas negativas; algunos usuarios cuentan que sus correos no reciben respuesta."
  source: "4885bceb8df9"
packetstream.rating.pros.0.text:
  text: "PacketStream publica su propia imagen de Docker, packetstream/psclient."
  source: "b358af0b3419"
packetstream.rating.pros.1.text:
  text: "Las condiciones solo exigen un dispositivo y una conexión que sean tuyos o que puedas usar."
  source: "bde1b5ad5a6a"
packetstream.rating.pros.2.text:
  text: "Las condiciones no describen ninguna verificación de identidad; para un pago basta una dirección de PayPal."
  source: "a05886b55edc"
packetstream.rating.pros.3.text:
  text: "Las condiciones nombran a PacketStream Inc., bajo la ley de California."
  source: "7966bde559dd"
packetstream.rating.pros.4.text:
  text: "PacketStream funciona desde 2018."
  source: "70db8167d5bc"
passiveapp.description:
  text: "PassiveApp es una plataforma DePIN que te permite ganar recompensas en cripto y PayPal compartiendo ancho de banda y recursos de cómputo que no usas. En la práctica, solo Windows: la propia página de descargas del proveedor muestra Android, iOS y Linux como \"coming soon\" sin cambios desde al menos febrero de 2025, y no existe versión para macOS, aunque los textos promocionales del mismo sitio aseguran que es compatible con más plataformas. No hay imagen de Docker.\n"
