mysterium.description:
  text: "MystNodes (Mysterium Network) es una red descentralizada de VPN y proxy basada en tecnología blockchain. Ganas tokens MYST ejecutando un nodo que ofrece servicios de VPN, proxy y extracción de datos a los usuarios. Requiere las capacidades NET_ADMIN, SETUID y SETGID y un dispositivo TUN, que usa dentro de su propio espacio de nombres de red en el puente de apps de ingresos protegido por la barrera. Incluye una interfaz web integrada para gestionar el nodo. Funciona tanto con conexiones residenciales como de VPS, pero el bono de referido solo se paga por nodos con una IP residencial.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Nodo de VPN descentralizada: basado en blockchain, funciona en VPS"
  source: "ad1413ac81fa"
