iproyal.docker.health_signals.0.means:
  text: "IPRoyal Pawns ha desactivado esta cuenta."
  source: "a3a68b67f1aa"
iproyal.docker.health_signals.1.means:
  text: "Pawns ve otro dispositivo activo en esta dirección IP y solo paga a uno por IP, así que esta copia funciona, pero no comparte nada ni gana nada. Detén cualquier otra app de Pawns en esta IP, ya sea en otro equipo, un PC o un móvil. Si no hay ninguna, espera a que Pawns dé de baja el dispositivo antiguo o pide al soporte de Pawns que lo libere."
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "Las ganancias dependen de la ubicación y del uso de ancho de banda. Las IP residenciales de EE. UU. y la UE ganan más."
  source: "424261bf08d4"
iproyal.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "Mínimo $5. Elige primero tu país; los métodos dependen de él. Desde España (octubre de 2026): PayPal con un 4% y una comisión mínima de $0.25, pagado a través de Tremendous, que te envía por correo un enlace donde introduces tu nombre y tu dirección de PayPal; USDT (BEP20, ERC20, TRC20) o USDC (BEP20, ERC20) con una comisión de red de $1; Bitcoin con una comisión mínima de $2; tarjetas regalo sin comisión. El primer pago necesita una verificación única de tu número de teléfono por SMS: la abre Withdraw, y el número se introduce con su prefijo de país. Después, cada pago pide un código que se envía al correo de tu cuenta y se revisa durante hasta 72 horas antes de enviarse."
  source: "0430fae34eb5"
iproyal.payout.notes:
  text: "Saldo en poder de IPRoyal Pawns; se retira bajo petición."
  source: "e11da90d5216"
iproyal.collector.credential_hint:
  text: "Usa el correo y la contraseña de tu cuenta de IPRoyal Pawns (los mismos que en <a href='https://pawns.app' target='_blank'>pawns.app</a>)."
  source: "b9dcb3a01d17"
iproyal.referral.bonus.referrer:
  text: "$1 en cada uno de sus tres primeros pagos, hasta $3, si cada uno llega dentro de su plazo de 1-3 semanas"
  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "$1 en cada uno de tus tres primeros pagos, hasta $3; si se te pasa un plazo de 1-3 semanas, los demás caducan"
  source: "619d5960686c"
iproyal.rating.cons.0.text:
  text: "Las condiciones dicen que una cuenta puede bloquearse sin aviso previo por abuso de las condiciones de retiro o por tener varias cuentas, y que entonces puede que sus ganancias no se paguen."
  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "Las condiciones dicen que Pawns no permite servidores, VPN ni servicios de proxy para compartir tráfico, y solo un dispositivo por IP."
  source: "449c1cdf793f"
iproyal.rating.cons.2.text:
  text: "PayPal cuesta un 4% (al menos $0.25) a través de Tremendous, y cada pago se revisa durante hasta 72 horas."
  source: "56449f2db6ce"
iproyal.rating.cons.3.text:
  text: "El primer pago necesita una verificación de tu número de teléfono por SMS, y cada pago, un código enviado por correo."
  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "La política de privacidad nombra al operador, Pawns.App Ltd (empresa 16043795 en Inglaterra y Gales), que según Companies House se constituyó el 28 de octubre de 2024, hace menos de tres años."
  source: "a7fcb7aea980"
iproyal.rating.cons.5.text:
  text: "Las condiciones dicen que Pawns y sus clientes empresariales envían tráfico a través de tu dispositivo, y que no puedes identificar qué cliente lo usa."
  source: "ca979ac10720"
