mysterium.docker.env.UI_ADDRESS.description:
  text: "Las direcciones del equipo en las que se publica la WebUI del nodo (puerto 4449). 127.0.0.1 la deja solo en esta máquina. Para acceder a ella a través de un proxy inverso, añade la dirección a la que se conecta el proxy, separada por comas y sin espacios: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "Los puertos UDP que usa el nodo para las sesiones de VPN, en formato inicio:fin. Redirige este mismo rango en tu router. Cada sesión ocupa unos dos puertos, así que los 30 por defecto admiten unas 15 sesiones a la vez, más de las que recibe un nodo doméstico. Un rango más amplio no arregla nada y cuesta más: cada puerto publicado ralentiza el arranque y la eliminación del nodo (300 puertos tardan unos 12 s en arrancar), CashPilot acepta como máximo 300, y con el userland proxy por defecto de Docker cada puerto ocupa además unos 2.5 MB de memoria. Si todas las sesiones fallan, el problema es del router, no de que haya pocos puertos: consulta \"Routers that rewrite UDP source ports\" en la guía de Mysterium. Mantenlo por debajo de 32768: los puertos 32768-60999 son el rango efímero de Linux, donde cualquier programa del equipo puede ocupar uno un momento, y un solo puerto ocupado hace fallar el arranque del nodo. Un nodo que ya tiene un rango lo conserva."
  source: "530524e2e718"
mysterium.docker.runtime_reason:
  text: "gVisor no le da iptables-nft ni WireGuard del kernel, que necesita para transportar tráfico."
  source: "d8a72a275579"
mysterium.docker.critical_volumes.0.holds:
  text: "Almacén de claves de la identidad del nodo. Si lo destruyes, se crea una identidad totalmente nueva: el nodo pierde su reputación y las ganancias que aún estén retenidas en la identidad antigua."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "El nodo no puede ejecutar sudo dentro de su contenedor, así que no puede configurar su interfaz VPN ni su cortafuegos y todas las sesiones fallan al establecerse: parece en línea, pero no gana nada. El contenedor se creó sin las capacidades SETUID y SETGID. Actualiza CashPilot y el worker que ejecuta este nodo y después vuelve a desplegar Mysterium desde el panel; la identidad del nodo está en su volumen de datos y se conserva."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "Ninguna sesión de VPN de las últimas 6 horas llegó directamente a este nodo. Todas recurrieron a hole punching, y muchos compradores no consiguen conectarse así, por lo que el nodo gana menos. Sus puertos UDP no son accesibles desde internet. En tu router, redirige el rango de puertos UDP ${UDP_PORTS} (inicio:fin, el mismo rango en ambos lados) a ${HOST_ADDRESS}. Este aviso desaparece solo en cuanto una sesión se conecta directamente."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "La monitorización de Mysterium marca como fallido el nodo de ${WORKER_NAME}, así que queda fuera de la lista de nodos de la que eligen la mayoría de los compradores, aunque su propia comprobación diga que todos los puertos son accesibles. Primero asegúrate de que el nodo tiene /dev/net/tun y SETUID/SETGID, cuya falta lo hace fallar de la misma forma: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Si eso ya está bien, una causa habitual es que el router que hay delante de ${WORKER_NAME} reescriba el puerto de origen UDP de las respuestas del nodo en cuanto un paquete de fuera ha llegado a ese puerto. Consulta la prueba en la guía: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "Las cinco últimas sesiones de VPN del nodo de ${WORKER_NAME} terminaron cada una tras un minuto aproximadamente sin mover datos, así que no gana nada aunque parezca en línea. La causa probable es el router que hay delante de ${WORKER_NAME}: en cuanto un paquete de fuera llega a un puerto, reescribe el puerto de origen de las respuestas posteriores del nodo desde ese puerto, y cada sesión empieza con un paquete así (la propia comprobación de puertos del nodo), por lo que los compradores descartan las respuestas del nodo. Un rango de puertos más amplio no ayuda. Consulta la prueba y las soluciones en la guía: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Este aviso desaparece en cuanto una sesión transporta datos."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Ganancias en tokens MYST. Las IP residenciales ganan bastante más. La WebUI del nodo, en el puerto 4449, sirve para gestionarlo y por defecto solo se publica en la máquina donde se ejecuta (127.0.0.1); desde otra máquina, abre antes un túnel SSH (ssh -L 14449:127.0.0.1:4449 seguido de la dirección de la máquina del nodo y luego abre http://127.0.0.1:14449; el puerto local 14449 evita que choque con un nodo en tu propia máquina), o añade una dirección a UI_ADDRESS (consulta WebUI address en la guía de Mysterium). Se aceptan VPS. Se recomienda encarecidamente redirigir los puertos UDP 23000-23029 (el valor por defecto de UDP_PORTS): sin ello, los nodos quedan en estado Strict NAT y muchas sesiones de VPN fallan, lo que reduce mucho los ingresos. Importante: tras el primer arranque, define tu billetera beneficiaria (de liquidación) desde la WebUI o la CLI del nodo para que coincida con tu cuenta de mystnodes.com; así se vinculan las ganancias on-chain con tu panel en la nube."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Liquidación on-chain automática cada vez que un nodo acumula 5 MYST sin liquidar"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "No hay ningún botón que pulsar. Cada nodo liquida en Polygon por sí solo cuando acumula 5 MYST sin liquidar, y alrededor del 21% se va en comisiones (la comisión de Hermes del 20% más una pequeña comisión de transacción), así que en cada liquidación llegan unos 3.9 MYST a la billetera beneficiaria. La TequilAPI de cada nodo muestra sus liquidaciones en /transactor/settle/history. La cifra de \"total earnings\" de MystNodes solo cubre los últimos 30 días; no es un saldo ni un total histórico. Los MYST extra del programa de recompensas de MystNodes no se liquidan solos: reclámalos en la página Rewards, en los 30 días siguientes al reparto según el centro de ayuda de MystNodes."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "La billetera beneficiaria se define DESPUÉS del despliegue, con TequilAPI o la WebUI del nodo, no con una variable de entorno, así que no se puede leer de la especificación del contenedor."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Usa el correo y la contraseña de tu cuenta de MystNodes (los mismos que en <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST por cada amigo cuyo nodo gane 5 MYST (solo IP residenciales)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST cuando tu nodo gane sus primeros 5 MYST (IP residencial, nodo reclamado en mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Reclama las recompensas de MystNodes del mes pasado"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Las recompensas que no se reclamen en los 30 días siguientes al reparto mensual se pierden y vuelven al fondo del mes siguiente."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Abre la página Rewards y cambia tus puntos por MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Ancho de banda. Tu conexión se usa como nodo de salida de la red Mysterium, que vende servicios de VPN, de proxy Y de extracción de datos (scraping). El tráfico de scraping que sale de una IP residencial es el uso con más probabilidades de provocar denuncias, y no puedes elegir cuál de los tres transporta tu nodo."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Sí. Desconocidos envían su tráfico a través de tu dirección IP: ese es el producto."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "La identidad del nodo (una dirección de blockchain), tu IP y tu ubicación aproximada (país/ciudad/ISP), que el nodo publica en la red para que los compradores puedan elegirlo."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Real, y conviene entenderlo. El tráfico de otras personas sale por tu conexión atribuido a ti, así que todo lo que hagan parece salir de tu línea. Muchos contratos de ISP domésticos lo prohíben. Revisa el tuyo antes de ejecutarlo."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Dispositivos ilimitados por cuenta y por IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Alrededor del 21% de cada liquidación se va en comisiones, la de Hermes del 20% más una comisión de transacción, y las ganancias se pagan en el token MYST."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Tu nodo es una salida para los clientes de VPN, proxy y extracción de datos de Mysterium, y no puedes elegir a cuáles de ellos atiende."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "El software del nodo es de código abierto bajo la GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium publica su propia imagen de Docker, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "La liquidación va a una billetera que es tuya; no hace falta número de teléfono ni documento de identidad."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "El proyecto del nodo funciona desde 2017."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "El sitio de Mysterium dice que la red la desarrolla Blockdev AG, en Zug (Suiza)."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay es una red DePIN que recompensa a los usuarios por compartir ancho de banda mediante una extensión de navegador. La plataforma está detrás de la protección de Cloudflare, lo que puede complicar el acceso automatizado. Los usuarios ganan Nodepay Points manteniendo la extensión activa. La red se centra en ofrecer infraestructura de datos para entrenar IA.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "Ancho de banda compartido DePIN para IA: extensión de navegador"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Gana Nodepay Points; los puntos de los usuarios que superan las comprobaciones de elegibilidad de Nodepay se convierten al token NC. La protección de Cloudflare puede bloquear la recolección automatizada. Se necesita la extensión de navegador."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Airdrop del token NC (fechas sin confirmar)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Sistema basado en puntos. Los puntos de los usuarios que superan las comprobaciones de elegibilidad de Nodepay se convierten al token NC, que se lanzó en enero de 2025."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "En la revisión de su primera temporada, Nodepay eliminó más de 300,000 cuentas que consideró bots y anuló 17 mil millones de puntos."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Las recompensas son puntos convertidos al token NC, así que su valor depende del token."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot no ejecuta Nodepay: usas la extensión de navegador del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes es el nivel de entrada gratuito de Noderr Protocol, un proyecto DeFi en Base L2. Un micronodo es un pequeño agente en un móvil Android que no uses, un PC con Windows, un Mac o un navegador Chromium. En Android comparte la conexión móvil del teléfono: otro tráfico de Noderr sale por la IP del operador del teléfono, así que necesita una SIM con datos móviles. En un PC o en el navegador ejecuta tareas de automatización para el protocolo con cómputo sobrante. Las recompensas están pensadas para pagarse en NODR, ajustadas según una puntuación on-chain de tiempo en línea y fiabilidad, pero durante la beta la red está en la testnet Base Sepolia: las recompensas de los nodos no tienen fondos y todavía no se ha pagado ninguna.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Micronodo gratuito (conexión compartida en Android, Windows, Mac, navegador): testnet, recompensas sin fondos de momento"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Beta en testnet: las recompensas de los nodos no tienen fondos y todavía no se ha pagado ninguna. El 5-10% de APY del sitio es un objetivo de diseño. Vuelve a revisarlo cuando la red salga de Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Bajo petición"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Las recompensas se acumulan en la billetera propia del nodo y se reclaman desde la app o la dApp. Durante la beta son tokens de la testnet Base Sepolia sin valor de mercado."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "La app crea la billetera del nodo en el primer arranque y le acuña un Utility NFT soulbound gratuito. Haz una copia de seguridad de la billetera desde la app: si pierdes el dispositivo, pierdes la identidad del nodo. Durante la beta, las recompensas están en Base Sepolia (testnet)."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android necesita una SIM con datos móviles; los clientes de escritorio y de navegador no publican ningún requisito de IP."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Depende del dispositivo. Un móvil Android vende su conexión móvil: otro tráfico de Noderr sale por la dirección IP del operador del teléfono y consume su tarifa de datos. Un PC con Windows, un Mac o un navegador venden cómputo sobrante para lo que el proveedor llama tareas de automatización de redes sociales y de contenido."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Sí. En Android, otro tráfico de Noderr sale por la dirección IP móvil de tu teléfono; la app pide un consentimiento que queda registrado antes de empezar, y puedes dejar de compartir desde la misma pantalla. Para los clientes de Windows, Mac y navegador, el proveedor describe tareas de automatización y no dice si transportan tráfico de otras personas."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "La dirección de la billetera del nodo y sus cifras de tiempo en línea y de tareas completadas van on-chain como una puntuación de reputación (el TrustFingerprint). El proveedor dice que las tareas se anonimizan, se ejecutan en un sandbox y que las claves de la billetera nunca salen del dispositivo. No se publica nada más concreto."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "En Android, la conexión compartida es una tarifa móvil de un operador: la propia documentación del proveedor advierte de que compartirla puede no estar permitido por las políticas de uso aceptable de algunos operadores, y el tráfico compartido consume los datos de la tarifa. Para los clientes de escritorio y de navegador, el proveedor no dice nada sobre las condiciones del ISP."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Un nodo por dispositivo, cada uno con su propio Utility NFT soulbound; se permite y se fomenta usar varios dispositivos. No se publica ningún límite por IP. No hay una cuenta en el sentido habitual: la identidad es una billetera que la app genera en el primer arranque."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Las recompensas de los nodos son tokens de testnet sin fondos ni valor de mercado, y no se ha pagado ninguna; el 5 al 10% de APY de su sitio es un objetivo de diseño."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Para los clientes de escritorio y de navegador, Noderr describe tareas de automatización y no dice si transportan tráfico de otras personas."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "El proveedor dice que las tareas se anonimizan y se ejecutan en un sandbox, pero no publica nada más concreto."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Sigue siendo una beta en la testnet Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot no ejecuta Noderr: usas la app o la extensión del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Sin cuenta: la app genera una billetera en el primer arranque."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle usa el Bluetooth del smartphone para crear infraestructura IoT. La app detecta y retransmite de forma pasiva los datos de los dispositivos IoT cercanos y gana tokens NODL. Ha aparecido en Forbes y tiene acuerdos empresariales con Vivendi y Hayden AI. Solo móvil (iOS y Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Retransmisión IoT por Bluetooth: app móvil, recompensas en tokens NODL"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Ganancias muy bajas. App de móvil en segundo plano que usa Bluetooth. La conexión de la billetera puede fallar a veces."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Continuo"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "Los NODL están en la billetera propia de la app en ZKsync Era; consúltalos en la app o en un explorador de bloques de ZKsync Era. Nodle dejó su parachain de Polkadot, y el puente de Polkadot a ZKsync cerró el 31 de diciembre de 2025, así que los NODL que sigan en Polkadot ya no pueden pasar a ZKsync."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "Aún sin determinar: CashPilot todavía no ha comprobado dónde guarda este servicio tus ganancias."
  source: "8d61a71de590"
nodle.referral.bonus.referrer:
  text: "Una recompensa en NODL por cada nuevo usuario activo que se une con la invitación (Nodle no publica la cantidad)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Un usuario cuenta que ganó unos $3 en tres o cuatro años; otros cuentan que las ganancias diarias han caído mucho."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot no ejecuta Nodle: usas la app de móvil del propio proveedor, así que CashPilot no puede desplegarla ni actualizarla por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana es un mercado descentralizado de cómputo con GPU construido sobre Solana. Conecta a los dueños de GPU con la demanda de cargas de trabajo de IA y paga en tokens NOS. Una RTX 3060 gana aproximadamente $0.048/h. La plataforma se centra en cargas de trabajo de inferencia de IA y usa la blockchain de Solana para planificar los trabajos y liquidar los pagos. Los nodos ejecutan cargas de trabajo en contenedores con la CLI de Nosana.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Cómputo con GPU en Solana: tokens NOS, RTX 3060 ~$0.048/h"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/h; las GPU de gama más alta ganan más. Las ganancias dependen de los trabajos disponibles y del modelo de GPU. Requiere GPU NVIDIA, Linux, Docker y la CLI de Nosana. Pagos en el token NOS en Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "Al completar cada trabajo"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Se ganan tokens NOS en Solana. Pago a la billetera configurada."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Nosana crea por defecto una billetera de Solana, así que la mayoría de los usuarios nunca ha visto su dirección."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Cada anfitrión debe bloquear un stake de NOS acorde al precio por hora de su GPU."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "A los anfitriones se les paga en NOS, así que las ganancias en dólares varían con el token y con la demanda de su tarjeta."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot no ejecuta Nosana: usas el software de anfitrión del propio proveedor, así que CashPilot no puede desplegarlo ni actualizarlo por ti. No se revisaron sus condiciones respecto a los contenedores."
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN es un pool de minería de Bitcoin sin cuenta: tu minero inicia sesión con tu dirección de Bitcoin como nombre de usuario, y el pool paga a esa dirección. Aquí CashPilot no ejecuta ningún minero. Lee el saldo pendiente que OCEAN guarda para tu dirección, para que veas lo que ha ganado tu ASIC (un Bitaxe, un Antminer) junto a tus otros ingresos. El saldo pendiente está ganado, pero no recibido: OCEAN lo paga on-chain cuando supera el umbral de pago.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Pool de minería de Bitcoin, seguido por tu dirección de pago"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Cuando un bloque lleva tu saldo por encima del umbral"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN paga on-chain a tu dirección cuando tu saldo pendiente alcanza el umbral. CashPilot no detecta los pagos por Lightning (opcionales, BOLT12)."
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "Lo pendiente está ganado, pero no se recibe hasta que OCEAN lo paga on-chain a esta dirección, salvo que hayas activado los pagos por Lightning."
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "Tu dirección de pago de BTC: el nombre de usuario que tu minero usa en OCEAN, sin la parte <b>.workername</b>. Es pública y no da acceso a ningún fondo."
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "Necesita un minero ASIC de Bitcoin (un Bitaxe, un Antminer) apuntado a mine.ocean.xyz:3334"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "cómputo"
