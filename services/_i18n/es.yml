honeygain.rating.cons.0.text:
  text: "Las condiciones permiten a Honeygain anular las ganancias que llegaron al umbral de $20 y no se pagaron en 24 meses, y dar por caducadas las ganancias tras seis meses sin uso."
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "El mínimo es $20, y los pagos por PayPal pasan por Tipalti, que cobra $2.02 por pago."
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "Las condiciones permiten a Honeygain suspender una cuenta y retener o anular las ganancias que considere acumuladas de forma fraudulenta."
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "Antes del primer pago por PayPal, Tipalti te hace confirmar un número de móvil por SMS y dar tu nombre, dirección y fecha de nacimiento."
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "Las condiciones dicen que los clientes empresariales usan el tráfico para recopilar datos web disponibles públicamente, pero no nombran a ningún cliente, y no puedes saber qué cliente usa tu conexión."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "Las respuestas de Honeygain a las reseñas sobre ganancias bajas dicen que las ganancias dependen de la demanda de la red y de la ubicación; algunos usuarios cuentan que tardaron muchísimo en llegar al mínimo de $20."
  source: "634fb331e65b"
