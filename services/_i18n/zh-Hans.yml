xmrig.docker.env.CPU_PERCENT.label:
  text: "最大 CPU 线程数（%）"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "RandomX 模式"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "未扣电费的毛收益估算。2026-11-25，按当时观察到的 XMR 价格和全网难度，1 kH/s 每月约值 $1。使用一半线程的台式机 CPU 可能多耗电 30 到 50 W。请核对你的实际用电量和电价，看看是否划算。"
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR（MoneroOcean，需你自行调低）"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "达到矿池门槛时"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "余额达到你的门槛时，矿池会向你的门罗币地址付款。在付款之前，余额由矿池保管。"
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "这台机器报告的是机房网络连接。挖矿前请查看你的服务商条款。一些服务商（包括 Hetzner Cloud）禁止挖矿。在相信收益估算之前，请先核算你的实际电费。"
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "默认矿池 MoneroOcean 收取 0% 的挖矿费。默认付款门槛为 0.3 XMR，你可以将其调低到 0.003 XMR。低于 4 XMR 的付款最多可能花费 0.0004 XMR。其他矿池自行设定费率和门槛。"
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "算力"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "否。矿机向矿池发送工作。"
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "你的门罗币地址、矿工名和 IP 地址会发送给矿池。"
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "一些网络和 DNS 解析器会屏蔽与矿池的连接。"
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "大多数门罗币矿池通过你的公开收款地址识别你。"
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "付款需要足够的 XMR 才能达到你的矿池门槛。"
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "一些托管服务商禁止加密货币挖矿。"
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "额外的电费可能高于挖到的 XMR 的价值。"
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "矿机向矿池发送哈希，不转发任何他人的流量。"
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "挖矿软件是开源的，镜像固定使用一个经过签名的上游发布版本。"
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "你可以使用公开的门罗币地址挖矿，无需透露姓名。"
  source: "752cbb728aac"
