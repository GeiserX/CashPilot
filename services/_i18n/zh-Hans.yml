2miners-etc.description:
  text: "跟踪 2Miners 为你的公开 ETC 收款地址保留的未付以太坊经典（Ethereum Classic）余额。请自行运行矿机程序并将其指向该矿池。CashPilot 会读取余额，并在余额下降时请你确认付款。\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "以太坊经典矿池，按你的收款地址跟踪"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC（可调整）"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "矿池每两小时检查一次你的付款门槛"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "达到你设定的门槛后，2Miners 会自动向你的地址付款。ETC 付款的最低门槛为 0.1 ETC。\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "未付余额在 2Miners 累积。钱包余额是从以太坊经典链上单独读取的。在 CashPilot 中确认付款之前，请先在钱包中核对实际到账金额。\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "输入你的矿机在 2Miners 上使用的公开以太坊经典收款地址，以 <b>0x</b> 开头。不要包含任何矿工名。\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "需要一台指向 2Miners 的 ETCHash 矿机"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "算力"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "否。你的矿机向矿池发送挖矿工作。"
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "矿池会使用你的收款地址、你选择的矿工名以及矿机的 IP 地址。"
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "任何人都可以按收款地址查看统计数据。修改门槛时，矿池会要求确认某个矿工的 IP。"
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "矿池收取 1% 的费用，并在达到你的门槛之前暂扣付款。"
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol（原名 ATOR）是一个去中心化的洋葱路由隐私网络。节点运营者运行中继节点，并按贡献的带宽赚取 ANYONE 代币。可以把它理解为“有激励的 Tor”。CashPilot 使用自有镜像运行它，该镜像由项目签名的 Debian 软件包构建，支持 amd64 和 arm64。配置通过挂载到容器中的 anonrc 文件完成（Nickname、ContactInfo、ORPort 等）。中继在为其锁定 100 ANYONE 至少 180 天之前没有任何收益，奖励需要在你的钱包中签名领取。中继还会把你的公网 IP 列入网络的中继目录，这可能损害住宅带宽类应用所看重的 IP 信誉。\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "去中心化洋葱路由 - 有激励的 Tor 中继节点"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "中继的 ed25519 身份密钥。销毁它会让中继的信誉作废，收益记录从零开始。"
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "只有在每个中继锁定 100 ANYONE 至少 180 天，并在钱包中签名领取奖励时才有收益。没有质押的中继没有任何收益。有质押时，收益取决于贡献的带宽和在线时间。"
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "按纪元（epoch）"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "在 anonrc 中设为 ContactInfo，前缀为 '@anon:0x...'。"
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "以逗号分隔的中继指纹。它不在网页仪表板中：请在运行中继的主机上执行 <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b>。\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "带宽，作为 Anyone 网络（Tor 的一个分支）中的中继。"
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "是。它会转发他人的流量。你的 IP 是否为最后一跳，取决于中继是否被配置为出口。"
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "中继的公开身份密钥、你的 IP 和端口以及在线时间统计，按设计全部发布到网络目录中。如果你在 anonrc 中设置了 ContactInfo，它也会发布在那里，并被永久公开索引。它通常是一个电子邮件地址，所以除非你希望公开，否则请留空。"
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "确实存在。中继流量会被归到你的网络连接上。尤其是出口中继，容易招来滥用投诉；许多家庭宽带运营商禁止运行出口中继。"
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "无需注册账户，因此也没有按账户的限制。要获得收益，你仍需要一个以太坊钱包，为每个中继锁定 100 ANYONE 至少 180 天，并且 CashPilot 需要中继指纹来读取奖励。该项目没有公布每个 IP 的中继数量上限，目录中也没有声明。"
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "除非为中继锁定 100 ANYONE 至少 180 天，否则中继没有任何收益，而且每次领取奖励都要在你的钱包中签名。"
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "它按设计转发他人的流量，不审核对方身份；出口中继容易招来滥用投诉。"
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "中继的身份、IP 和在线时间会发布到网络目录，你设置的任何 ContactInfo 都会永久公开。"
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "无需注册账户。中继只需要一个钱包，不做身份验证。"
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "中继软件是 Tor 的公开分支，采用 Tor 的许可证。"
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot 使用 Anyone 公开的中继软件构建自有镜像，无需账户。"
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping 是一个去中心化网络监测平台，运行节点即可获得报酬。你的节点为 Bitping 的客户执行网站监测、延迟测试和网络质量检查。住宅网络和 VPS 均可使用。Docker 镜像在首次启动时使用 BITPING_EMAIL 和 BITPING_PASSWORD 环境变量登录（其日志中显示 \"Attempting login with environment variables\"），之后把会话保存在挂载的卷中，因此重启时无需重新认证。\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "带宽共享 - 去中心化网络监测，可在 VPS 上运行"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "电子邮件"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "密码"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "你的 Bitping 账户邮箱（与 <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a> 的登录账号相同）"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "你的 Bitping 账户密码。仅用于创建一次节点会话，之后会话保存在数据卷中。"
  source: "acb49b137850"
bitping.earnings.notes:
  text: "收益取决于网络质量以及你所在地区的监测需求。接受 VPS 节点。"
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
bitping.cashout.notes:
  text: "节点收益在 nodes.bitping.com 上；app.bitping.com 是 API 客户的仪表板。提现仅支持 SOL：未付余额超过 $0.05 后，在申请中输入 Solana 地址，24 小时内处理。新的或空的 Solana 钱包需要先存入约 0.001 SOL，以满足网络的租金（rent）最低要求。"
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "现在仅支持 Solana，且地址在提现时输入，而不是预先保存。"
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "使用你的 Bitping 账户邮箱和密码（与 <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a> 相同）。"
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "提取你的 Bitping 余额"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping 可能会在提前 30 天发邮件通知后，没收超过 12 个月未领取的收益。"
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "在 nodes.bitping.com 上申请 SOL 提现，并在申请中输入你的 Solana 地址。"
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "提现以 Solana（SOL）支付，付到你每次申请时输入的地址。"
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Bitping 的帮助文档说，提现到新的空 Solana 钱包可能会失败，直到你自己先往该钱包里存入少量 SOL。"
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Bitping 的帮助文档说支持服务器和 Docker 容器。"
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "提现只需在申请中输入一个 Solana 地址。"
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit 是一个带宽共享服务，通过 PayPal 和 Stripe 付款。没有官方 Docker 镜像；客户端为 Windows 桌面应用和 Android 应用。服务位于 bytebenefit.io -- 旧域名 bytebenefit.com 已被弃用并停放在域名交易市场上，这也是它曾在这里被标记为已失效的原因。\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "带宽共享 - PayPal/Stripe 付款，桌面/Android 应用"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "没有可用的 Docker 镜像。仅有 Windows 桌面应用和 Android 应用。"
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "尚未确定：CashPilot 尚未核实此服务把你的收益存放在哪里。"
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "被推荐人流量收益的 20%"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "$1（10,000 Coins）欢迎奖励"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "该应用的 Google Play 页面说，你的流量用于为 Infatica 的客户处理网络情报请求，但没有说明这些客户是谁、如何审核。"
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Android 应用在上架 17 个月后，于 2026 年 4 月从 Google Play 下架。"
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot 不运行 ByteBenefit：你需要使用提供商自己的应用，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir 让你通过共享闲置的网络带宽赚取被动收入。仅支持 Windows 和 Android — 官方常见问题说明没有计划推出 Linux 或 Docker 客户端，不支持 iOS，也不提供 macOS 版本。收益在很大程度上取决于所在地区。可在 dash.bytelixir.com 的网页仪表板上跟踪。没有可用的 Docker 镜像。\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "带宽共享 - 仅限 Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "会话 Cookie"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Remember Web Cookie"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "XSRF 令牌"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "登录 <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>，按 F12 → Application → 在左侧边栏展开 <b>Cookies</b> → 点击子项 <code>https://dash.bytelixir.com</code> → 在右侧的 Cookie 列表中找到 <code>bytelixir_session</code> → 复制它的 Value（一个以 eyJ 开头的长 JWT）"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "同一位置（Cookies → <code>https://dash.bytelixir.com</code>）→ 找到名为 <code>remember_web_...</code> 的 Cookie → 复制它的 Value（可选，可延长会话有效期）"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "同一位置 → 找到 <code>XSRF-TOKEN</code> → 复制它的 Value（可选）"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "收益因地区而异（$2-50/月）。没有 Docker 镜像。需要使用桌面应用或 Android 应用。"
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "仅支持加密货币。最低金额取决于币种：USDT $5、USDC $5、TON $8、LTC $10、ETH $40、BTC $250。每次申请时输入地址。申请在工作时间内处理，24 小时内完成。"
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "余额由 Bytelixir 保管；钱包地址在每次付款申请时输入，从不保存在容器中。"
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "<b>勾选 Remember Me</b> 登录 <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a>，按 F12 → Application → 在左侧边栏展开 <b>Cookies</b> → 点击 <code>https://dash.bytelixir.com</code>，然后复制三个值：<b>bytelixir_session</b>、<b>remember_web_…</b>（以该前缀开头的长 Cookie）和 <b>XSRF-TOKEN</b>。仅有会话 Cookie 的话，复制后约两小时就会过期，采集当天下午就会停止；remember_web Cookie 有效期为一年，正是它让采集持续工作。"
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "终身获得其利润的 50%"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "$1 欢迎奖励"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "仅支持加密货币，且最低金额取决于币种，从 USDT 的 $5 到比特币的 $250 不等。"
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot 不运行 Bytelixir：你需要使用提供商自己的应用，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Trustpilot 基于 283 条评价给出 4.6 分，大多数称赞加密货币付款；少数反映付款未到账。"
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "付款只需在申请中输入一个加密货币地址。"
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai 是一个点对点 GPU 交易市场。你上架一台装有 NVIDIA GPU 的 Linux 机器，自行设定现货（spot）和按需价格，租用者在上面运行他们自己的 Docker 容器。你只按机器被租用的分钟数获得报酬，以 CLORE、BTC、USDT 或 USDC 支付。托管需要一台运行 Ubuntu 22.04 或更新版本（或 HiveOS）的 x86_64 机器、可正常工作的 NVIDIA 驱动，以及至少 100 Mbps 的上行和下行带宽。不支持 AMD GPU。\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "GPU 交易市场 - 出租 NVIDIA GPU，以 CLORE、BTC 或美元稳定币付款"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "只按被租用的分钟数、以你设定的价格付款。区间上限 $490 是 Clore 自己给出的单张按分钟上架的 RTX 4090 的上限（'up to ~$490/month'）；较小的显卡收益更少，闲置的显卡没有收益。Clore 从每笔租金中抽取 5%（按需）或 1.25%（现货），租用者用 BTC、USDT 或 USDC 而非 CLORE 付款时，还要再加 15%。"
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "在 Account > Billing 中提现到你自己的钱包：CLORE（ERC-20，最低 200，手续费约 $0.50）、BTC（最低 0.0001，手续费 0.00005 BTC），或以太坊或 BNB Chain 上的 USDT/USDC（最低 $10，手续费 $1）。"
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore 保管余额（CLORE、BTC，以及 USDT/USDC 共用的一个美元余额），直到你提现。每次提现时选择链：CLORE 用以太坊，BTC 用比特币，USDT/USDC 用以太坊或 BNB Chain。"
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "你推荐的托管方和租用者每笔租赁所付平台费的 15%（标准等级）；推荐码永不过期；以租赁所用币种支付（CLORE、BTC 或 USD）"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "上行和下行 100 Mbps"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "你机器上的 GPU 算力时间。"
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "是。租用者在你的机器上运行他们自己的 Docker 容器，其流量从你的网络连接发出；SSH 和应用端口会被转发到互联网。"
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Clore 的隐私政策涵盖账户数据以及你的 IP 地址和大致位置；只有在 Clore 要求 KYC 时才涉及身份证件。"
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "入站端口必须能从互联网访问（默认 22、8080 和 3000-4000），陌生人的工作负载会在你的线路上运行。Clore 自己的网络指南说，一些网络运营商会封锁托管。"
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "须年满 18 岁，且不在受制裁国家。Clore 可自行决定暂停或关闭账户，违禁使用可能导致资金损失。"
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "条款和隐私政策都没有写明法律实体，条款还把适用的司法管辖区留待以后的版本确定。"
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore 可自行决定暂停或关闭账户，违禁使用可能导致资金被没收。"
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "付款仅限加密货币（CLORE、BTC、USDT 或 USDC），租用者用 BTC、USDT 或 USDC 支付的租金，Clore 还要额外抽取 15%，除非托管方锁定 CLORE 来降低这部分费用。"
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "托管方只按被租用的分钟数获得报酬，Clore 给出的 RTX 4090 数字是单张显卡的上限（\"up to ~$490/month\"）。"
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "基本使用无需 KYC，但对于大额提现或合规情况，Clore 可能会要求身份验证。"
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "租用者可以在你的机器上运行任何公开的 Docker 镜像。条款列出了禁止的用途（恶意软件、DDoS、CSAM 等），但我们没有找到关于如何审核租用者的说明。"
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot 不运行 Clore.ai：你需要在自己的 GPU 机器（Ubuntu 22.04 或更新版本，或 HiveOS）上安装 Clore 的托管代理程序，因此 CashPilot 无法替你部署或更新它。"
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "租用者用 CLORE 支付时，Clore 从按需租赁中抽取 5%（现货为 1.25%），没有额外费用。"
  source: "699adf0a2179"
dawn.description:
  text: "DAWN 运营着一个验证者网络，为通过 DAWN 协议融资的 AI 基础设施检查带宽和覆盖情况。DAWN Validator 浏览器扩展参与这些带宽证明和覆盖检查，并在运行期间赚取 DAWN 奖励。这些奖励目前还没有确定的现金价值。在扩展中创建账户，并在提示时输入推荐码 2QLQV97F。\n"
  source: "bea38e2849d6"
dawn.short_description:
