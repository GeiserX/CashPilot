  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "付款通过 Wise、PayPal 或 Stripe 进行，最低 $20，每周结算；更少的余额顺延到下一周。"
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter 是一个带宽共享平台，支持 Windows、Mac、Linux 和 Android。它声称每共享 1 GB 带宽最多支付 $1，最低付款门槛为 $20。该平台的运作方式与传统带宽共享应用类似，通过住宅网络转发合法流量。\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "带宽共享 - 声称最高 $1/GB，最低付款 $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "声称最高 $1/GB，但实际收益更低。最低付款额 $20。收益因地区和需求差异很大。"
  source: "2be529de3995"
wipter.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
wipter.cashout.notes:
