grass.description:
  text: "Grass 是一个去中心化网络，让你把闲置带宽出售用于 AI 训练数据。它以浏览器扩展和桌面应用的形式运行，通过你的网络连接转发网页抓取请求，以构建结构化数据集。拥有超过 850 万用户，是最大的 DePIN 带宽网络之一。在 Solana 区块链上赚取 GRASS 代币。\n"
