proxyrack.docker.health_signals.0.means:
  text: "ProxyRack 的客户端无法在这个副本上运行，所以它没有任何收益。常见原因是 ProxyRack 的更新服务器没有响应，而没有它客户端就无法启动。副本每 5 分钟重试一次，服务器一响应就会自行启动。你无需做任何修复。"
  source: "0df8b8cfac10"
proxyrack.docker.health_signals.1.means:
  text: "这个副本启动时没有下载到 ProxyRack 的客户端，因为无法连接 ProxyRack 的更新服务器，所以副本在运行，但没有任何收益。CashPilot 每 6 小时重启一次副本以便重试。请重新部署它，让它使用 CashPilot 自己的启动方式，这种方式会保留客户端，并每 5 分钟自行重试。"
  source: "0a2ee4b478b2"
proxyrack.device_link.steps:
