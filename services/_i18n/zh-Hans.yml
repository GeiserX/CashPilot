earnapp.description:
  text: "Bright Data 旗下的 EarnApp 让你出售闲置带宽来获得被动收入。Bright Data 是全球最大的代理网络，为财富 500 强企业的数据采集提供支持。CashPilot 使用自有镜像运行它：首次启动时从 Bright Data 的 CDN 下载固定版本的 EarnApp，校验其 sha256，然后以 lite 模式运行，只需一个 UUID。\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "带宽共享 - 由 Bright Data 支持"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "节点 UUID"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "你的 EarnApp 节点 ID：sdk-node- 后接 32 个小写十六进制字符，与 'earnapp showid' 输出的格式相同。部署后，请在登录 EarnApp 的状态下打开 https://earnapp.com/r/ 后接此 UUID 的地址进行一次绑定；未绑定的节点会产生收益，但不会计入你的余额"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp 一直无法连接其服务器并反复重启，因此收益很少或没有。请重启这个副本；如果问题持续，请检查这台机器的网络连接。"
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "在登录 EarnApp 的状态下打开此链接，将节点添加到你的账户。在此之前，节点会产生收益，但不会计入你的余额。"
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "高度依赖所在地区。美国/欧盟 IP 收益最高。收益随消耗的带宽增加。"
  source: "460beb388888"
earnapp.payment.frequency:
  text: "按需申请（可自动兑换：PayPal 最低 $10，Wise 最低 $10，Amazon 最低 $50）"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "开启一次自动兑换后，只要余额达到所选方式的最低额，EarnApp 就会自动付款：PayPal $10、Wise $10、Amazon $50。PayPal 付款来自 Bright Data Ltd.。2026 年 10 月，一笔 PayPal 付款比兑换的余额少了约 2%。"
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "余额由 EarnApp 保管；兑换到 Amazon/Wise/PayPal。"
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "登录 <a href='https://earnapp.com' target='_blank'>earnapp.com</a>，按 F12 → Application → Cookies，复制 <b>oauth-refresh-token</b> 的值。"
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "终身获得其收益的 10%，在其收益之外额外支付"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "EarnApp 的帮助中心说，严禁将其安装在 Docker 容器、虚拟机、托管服务或家用服务器中，而 CashPilot 正是这样运行它的。"
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "同一篇帮助文章说，一旦发现账户以这种方式运行，会在不另行通知的情况下终止账户，并取消其待付款项。"
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "我们的 PayPal 付款于 2026 年 10 月到账，比兑换的余额少了约 2%。"
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
