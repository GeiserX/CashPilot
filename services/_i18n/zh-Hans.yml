  text: "io.net 是一个面向 AI/ML 工作负载的去中心化 GPU 网络。它汇集来自个人用户和数据中心的闲置 GPU。要获得可观收益，需要 8GB+ 显存的 NVIDIA GPU。支持基于容器的部署。\n"
