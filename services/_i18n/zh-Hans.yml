  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "基于积分的系统。通过 Nodepay 资格审核的用户，其积分会兑换为 2025 年 1 月发行的 NC 代币。"
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "尚未确定：CashPilot 尚未核实此服务把你的收益存放在哪里。"
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "在第一季审查中，Nodepay 删除了 300,000 多个它认定为机器人的账户，并作废了 170 亿积分。"
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
