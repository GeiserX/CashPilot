  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "仪表板中的 Vast.ai 托管方 API 密钥"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "被租用时，RTX 3090 约 $0.20-0.40/小时，RTX 4090 约 $0.40-0.80/小时。利用率不固定。需要 NVIDIA GPU、Linux 主机、Docker 和 nvidia-container-toolkit。自行定价。"
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "每周（周五）"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "收益累积在 Vast.ai 余额中。通过 Wise、PayPal 或 Stripe 提现。"
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "尚未确定：CashPilot 尚未核实此服务把你的收益存放在哪里。"
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "被推荐租用者在其账户存续期间消费金额的 3%，以推荐额度形式发放；其中最多 75% 可从专用的推荐账户提现"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
