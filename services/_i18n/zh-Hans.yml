golem.description:
  text: "Golem Network 是一个去中心化算力市场，你共享 CPU 和 GPU 资源来换取 GLM 代币。提供者运行 Yagna 代理程序，在沙箱环境中管理工作负载的执行。它是最早的去中心化算力项目之一（成立于 2016 年）。支持 CPU 任务、GPU 渲染和通用计算。通过 Polygon L2 付款。\n"
