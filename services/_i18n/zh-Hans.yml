iproyal.description:
  text: "IPRoyal Pawns 让你通过共享闲置带宽赚钱。IPRoyal 是一家成熟的代理提供商，Pawns 是其住宅带宽共享业务。其 CLI Docker 镜像通过命令行参数接收凭据。通过推荐链接注册的新用户，前三笔付款每笔可获 $1，最多 $3。每笔付款必须在一个时间窗口内完成，窗口按地区设定为一到三周。窗口从注册时开始，并在每次付款后重新开始。如果某个窗口先结束，剩余的奖励就会失效。\n"
