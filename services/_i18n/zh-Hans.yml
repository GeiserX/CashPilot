mysterium.description:
  text: "MystNodes（Mysterium Network）是一个基于区块链技术的去中心化 VPN 和代理网络。你运行一个为用户提供 VPN、代理和数据抓取服务的节点，从而赚取 MYST 代币。需要 NET_ADMIN、SETUID 和 SETGID 能力（capabilities）以及一个 TUN 设备，它在隔离墙内的收益应用网桥上，于自己的网络命名空间中使用这些。内置用于管理节点的网页界面。住宅网络和 VPS 均可使用，但推荐奖励只发放给使用住宅 IP 的节点。\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "去中心化 VPN 节点 - 基于区块链，可在 VPS 上运行"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "WebUI 地址"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "UDP 端口范围"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "节点 WebUI（端口 4449）所发布到的主机地址。127.0.0.1 表示只能在本机访问。如需通过反向代理访问，请添加代理所连接的地址，用逗号分隔且不加空格：127.0.0.1,172.18.0.1。"
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "节点用于 VPN 会话的 UDP 端口，格式为 起始:结束。请在路由器上转发同样的范围。每个会话约占两个端口，所以默认的 30 个端口可同时承载约 15 个会话，比家用节点实际获得的还多。更大的范围解决不了任何问题，反而代价更高：每个发布的端口都会拖慢节点的启动和移除（300 个端口约需 12 s 启动），CashPilot 最多接受 300 个，而在 Docker 默认的 userland proxy 下，每个端口还会占用约 2.5 MB 内存。如果所有会话都失败，那是路由器的问题，而不是端口太少：请参阅 Mysterium 指南中的 \"Routers that rewrite UDP source ports\"。请保持在 32768 以下：32768-60999 是 Linux 的临时端口范围，主机上的任何程序都可能短暂占用其中某个端口，只要有一个端口被占用，节点就会启动失败。已有端口范围的节点会保留原范围。"
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "节点身份密钥库。销毁它会生成一个全新的身份：节点会失去信誉，以及旧身份下仍被暂扣的所有收益。"
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "节点无法在容器内运行 sudo，因此无法配置其 VPN 接口或防火墙，每个会话都在建立时失败：它看起来在线，却没有任何收益。该容器创建时没有 SETUID 和 SETGID 能力。请更新 CashPilot 和运行此节点的工作节点，然后在仪表板中重新部署 Mysterium；节点身份保存在其数据卷中，会被保留。"
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "过去 6 小时内没有任何 VPN 会话直接连到此节点。所有会话都退回到了打洞（hole punching）方式，而许多买家无法以这种方式连接，所以节点收益减少。它的 UDP 端口无法从互联网访问。请在路由器上将 UDP 端口范围 ${UDP_PORTS}（起始:结束，两侧使用相同范围）转发到 ${HOST_ADDRESS}。一旦有会话直接连接，此提示会自动消失。"
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Mysterium 的监控将 ${WORKER_NAME} 上的节点标记为失败，因此它不会出现在大多数买家挑选节点所用的列表中，即使节点自身的检查显示所有端口都可访问。请先确认节点拥有 /dev/net/tun 和 SETUID/SETGID，缺少它们也会导致同样的失败：https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 这些都没问题时，一个常见原因是 ${WORKER_NAME} 前面的路由器：一旦有来自外部的数据包到达该端口，它就会改写节点应答的 UDP 源端口。请参阅指南中的测试方法：https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "${WORKER_NAME} 上节点最近的五个 VPN 会话，每个都在约一分钟后结束且没有传输任何数据，因此它看起来在线，却没有收益。可能的原因是 ${WORKER_NAME} 前面的路由器：一旦有来自外部的数据包到达某个端口，它就会改写节点之后从该端口发出的应答的源端口，而每个会话都以这样的数据包开始（节点自己的端口检查），所以买家会丢弃节点的应答。扩大端口范围没有帮助。请参阅指南中的测试和修复方法：https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports 一旦有会话传输了数据，此提示就会消失。"
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "收益为 MYST 代币。住宅 IP 收益明显更高。节点 WebUI 位于端口 4449，用于管理，默认只发布在其运行的机器上（127.0.0.1）；从另一台机器访问时，请先建立 SSH 隧道（ssh -L 14449:127.0.0.1:4449 后接节点所在机器的地址，然后浏览 http://127.0.0.1:14449；使用本地端口 14449 是为了不与你本机上的节点冲突），或在 UI_ADDRESS 中添加一个地址（参见 Mysterium 指南中的 WebUI address）。接受 VPS。强烈建议转发 UDP 23000-23029（UDP_PORTS 的默认值）-- 否则节点会处于 Strict NAT 状态，许多 VPN 会话会失败，收入会大幅减少。重要：首次运行后，请通过节点 WebUI 或 CLI 设置你的受益人（结算）钱包，使其与你的 mystnodes.com 账户一致 -- 这样才能把链上收益与你的云端仪表板关联起来。"
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "每当节点累积 5 MYST 未结算时，自动进行链上结算"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "无需点击任何按钮。每个节点在累积 5 MYST 未结算金额后会自行在 Polygon 上结算，约 21% 作为费用扣除（20% 的 Hermes 费用加少量交易费），因此每次结算约有 3.9 MYST 到达受益人钱包。每个节点的 TequilAPI 在 /transactor/settle/history 中列出其结算记录。MystNodes 上的 \"total earnings\" 数字只涵盖最近 30 天；它既不是余额，也不是累计总额。MystNodes 奖励计划的奖励 MYST 不会自动结算：根据 MystNodes 帮助中心的说明，需在分发后 30 天内到 Rewards 页面领取。"
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "受益人钱包在部署之后通过 TequilAPI 或节点 WebUI 设置 -- 不是通过环境变量设置，因此无法从容器配置中读取。"
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "使用你的 MystNodes 账户邮箱和密码（与 <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a> 相同）。"
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "好友的节点赚到 5 MYST 后，每位好友奖励 5 MYST（仅限住宅 IP）"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "你的节点赚到首个 5 MYST 后奖励 5 MYST（住宅 IP，且已在 mystnodes.com 上认领节点）"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "领取上个月的 MystNodes 奖励"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "月度分发后 30 天内未领取的奖励将被没收，并退回下个月的奖励池。"
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "打开 Rewards 页面，把你的积分兑换成 MYST。"
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "带宽。你的网络连接被用作 Mysterium 网络的出口节点，该网络出售 VPN、代理以及数据抓取服务。从住宅 IP 发出的抓取流量最容易招来投诉，而你无法选择节点承载这三者中的哪一种。"
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "是。陌生人通过你的 IP 地址转发他们的流量 — 这正是它的产品。"
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "节点身份（一个区块链地址）、你的 IP 以及大致位置（国家/城市/网络运营商），节点会把这些发布到网络上，以便买家选择。"
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "确实存在，值得了解清楚。他人的流量从你的网络连接发出并被归到你名下，因此他们做的任何事看起来都来自你的线路。许多家庭宽带合同禁止这样做。运行前请先查看你的合同。"
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "每个账户和每个 IP 的设备数量不限。"
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "每次结算约 21% 用于支付费用（20% 的 Hermes 费用加交易费），收益以 MYST 代币支付。"
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "你的节点是 Mysterium 的 VPN、代理和数据抓取客户的出口，你无法选择它承载哪一类。"
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "节点软件以 GPL-3.0 许可证开源。"
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium 发布了自己的 Docker 镜像 mysteriumnetwork/myst。"
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "结算会打到你自己拥有的钱包；不需要手机号或身份证件。"
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "该节点项目自 2017 年起运行。"
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Mysterium 的网站说，该网络由瑞士楚格（Zug）的 Blockdev AG 开发。"
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay 是一个 DePIN 网络，奖励通过浏览器扩展共享带宽的用户。该平台受 Cloudflare 保护，这可能使自动化访问变得困难。用户只要保持扩展处于活动状态即可赚取 Nodepay Points。该网络专注于提供 AI 训练数据基础设施。\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "面向 AI 的 DePIN 带宽共享 - 浏览器扩展"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "赚取 Nodepay Points；通过 Nodepay 资格审核的用户，其积分会兑换为 NC 代币。Cloudflare 保护可能会阻止自动采集。需要浏览器扩展。"
  source: "6a4c4b37179f"
nodepay.payment.frequency:
