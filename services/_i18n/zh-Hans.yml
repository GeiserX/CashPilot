honeygain.cashout.notes:
  text: "最低 $20（20,000 积分）。两种方式：通过 Tipalti 付到 PayPal，手续费约 15%；或无手续费的 JumpTask 积分，付到 JumpTask 钱包。每次申请都需要通过邮件发送的 6 位验证码。第一笔 PayPal 付款会一直处于 \"waiting for details\" 状态，直到你通过他们邮件发来的链接在 Tipalti 注册。该链接只能使用一次，所以请在能一次完成并且手机在身边时打开：设置密码后，Tipalti 会要求你通过短信验证手机号（验证码几分钟内过期），然后要求填写姓名、地址、国家和出生日期，以及你的 PayPal 地址。Tipalti 每笔付款收取 $2.02；请选择 USD，以避免 1.9-3% 的货币兑换费。付款会在 2 个工作日内到账。一旦申请，余额就会立即从账户中扣除，即使付款仍在等待 Tipalti 处理。此后每次登录 Tipalti 都会发送新的短信验证码，除非你勾选在 30 天内记住此设备的选项。2026 年 10 月，Tipalti 没有要求一位在西班牙的收款人填写税务表格。"
  source: "553463d96535"
honeygain.payout.notes:
  text: "余额由 Honeygain 保管；按需提现。"
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "使用你的 Honeygain 账户邮箱和密码（与 <a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a> 相同）。"
  source: "fd0be22aeb14"
