salad.description:
  text: "Salad.io 让你把 GPU 共享给分布式 AI 工作负载，赚取 Salad 余额，可兑换礼品卡、游戏或现金。仅支持 Windows，提供原生桌面应用。需要独立显卡（NVIDIA 或 AMD）。机器空闲时，平台会把 AI 推理、渲染和其他计算任务分配给它。它是较易上手的 GPU 共享平台之一。\n"
  source: "09335baccea6"
salad.short_description:
  text: "面向 AI 的 GPU 共享 - 仅限 Windows，礼品卡或现金付款"
  source: "4665796e0965"
salad.earnings.notes:
  text: "收益取决于 GPU 型号和任务供给情况。RTX 3060 约 $1-3/天。仅限 Windows。原生应用，不支持 Docker。可兑换礼品卡、游戏或 PayPal。"
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
salad.cashout.notes:
  text: "通过 Salad 商店兑换 PayPal 或礼品卡。"
  source: "5128232e4f57"
salad.payout.notes:
  text: "仅限 PayPal 和礼品卡，从不支持加密货币。没有钱包地址，因此 CashPilot 没有可显示的链上余额。"
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "登录 <a href='https://app.salad.io' target='_blank'>app.salad.io</a>，按 F12 → Application → Cookies，复制 <b>auth</b> Cookie 的值。"
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "赚取一些 Salad Reward Points，或花掉你的余额"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "如果账户连续 12 个月没有赚到任何 Reward Points，其未兑换的余额可能会过期。"
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "运行 Salad 应用直到它产生收益，或在 Salad Storefront 中花掉全部余额。只花掉一部分不会重置这 12 个月。"
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot 不运行 Salad：你需要使用提供商自己的桌面应用，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "2026 年 10 月和 11 月的多位 Trustpilot 评价者反映 PayPal 提现很快到账，有些人不止一次；同期也有一位评价者说多次尝试提现都失败了。"
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel 是一条用于去中心化 VPN 的 Cosmos Layer 1 区块链。节点运营者以灵活的定价（按 GB 或按小时）向 VPN 用户出售带宽。提供官方 Docker 部署指南。这是一个运行已久、社区活跃的项目。\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "Cosmos 上的去中心化 VPN - 节点运营者出售带宽"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "运营者自行设定按 GB 或按小时的价格。收益取决于你所在地区的 VPN 用户需求。"
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "按会话"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "尚未确定：CashPilot 尚未核实此服务把你的收益存放在哪里。"
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "付款以 P2P 代币支付，每笔带宽付款的 20% 归质押者，而不是节点托管方。"
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "该代币在 2021 年从 SENT 改名为 DVPN，2025 年又从 DVPN 改名为 P2P。"
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot 不运行 Sentinel：你需要使用提供商自己的节点软件，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel 以其自有的开源许可证公开了节点源代码。"
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia 是一个去中心化存储市场，由 Sia Foundation（一家瑞士非营利组织）运营，自 2015 年起运行。运行该基金会官方的 hostd 节点，即可出租闲置磁盘空间，从存储和带宽合约中赚取 Siacoin。节点开始赚钱之前，你必须先购买一些 Siacoin：托管方要为每份合约锁定抵押金，并为每次存储证明支付费用。合约完成后抵押金会退回；如果节点离线或丢失数据，抵押金会被销毁，因此它需要一台始终在线的机器（Sia 要求至少 95% 的在线时间）。收益取决于租用者实际存储了多少数据；Sia 建议存储定价为每 TB 每月 $1，因此它适合有大容量闲置磁盘的机器，而不适合小规格 VPS。\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Sia Foundation 存储节点 - 官方 Docker 镜像，赚取 Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "钱包助记词"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "仪表板密码"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "存储目录"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "控制托管方 Siacoin 钱包的 BIP-39 助记词。用 `docker run --rm ghcr.io/siafoundation/hostd seed` 生成一个并做好备份 -- 这是取得收益的唯一途径"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "hostd 网页界面和本地 API 的密码（BasicAuth）。任意较长的口令均可"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "你最大磁盘上用于存储租用者数据的主机路径（例如 /srv/sia）。需要至少 256GB 可用空间"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "部署时，CashPilot 会在运行节点的机器上创建一个新钱包，并只显示一次助记词：请把它抄下来。如果要使用你已有的钱包，请改为粘贴其助记词。部署完成后，向节点钱包转入一些 Siacoin 用于抵押和手续费，然后在仪表板中添加存储文件夹（/storage）、设置价格并发布托管公告。\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "钱包助记词（hostd.yml）、钱包数据库、托管设置和合约状态。丢失它会失去节点的身份和合约收入记录；此时你抄下的助记词就是找回资金的唯一途径。"
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "已存储的租用者数据。丢失它会导致存储证明失败，并失去为这些合约锁定的抵押金。"
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "托管方自行定价。Sia 建议每 TB 存储每月 $1，每 TB 下载超过 $5，每笔合约付款的 3.9% 归 Siafund 持有者。收入随落到节点上的租用者数据量增加，数据量从零开始，并随在线时间和价格增长。抵押金（Sia 建议为存储价格的 2 倍）按合约锁定，合约成功完成后退回。\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "收益累积在托管方自己的 Siacoin 钱包中（由助记词控制）。在交易所将 SC 兑换后，从那里提现到银行/银行卡；提供商一方没有付款申请。\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "资金存放在节点内由助记词控制的 Sia 钱包中。助记词只保存在运行它的机器上 hostd 的数据卷中；CashPilot 从不存储它。创建钱包时你抄下的助记词是唯一的恢复途径。\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "需要一个稳定的公网地址，并转发端口 9981（TCP，共识）和 9984（TCP 和 UDP，租用合约）。在 Sia 上使用数据中心/VPS 托管很常见。节点开始接受合约之前，钱包中需要有 Siacoin。"
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "磁盘空间以及提供这些空间所需的带宽。"
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "否。租用者在你的磁盘上存储加密的文件片段并取回。其他人不会通过你的 IP 转发任意流量。"
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "你的 Sia 钱包地址、托管方公钥，以及节点为便于租用者访问而公布的公网 IP:端口。"
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "线路上会有持续的上传/下载流量，与运行任何存储服务器类似；不会有匿名的第三方网页流量被归到你名下。"
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "无需许可：无需注册，也没有账户。如果节点因离线或丢失数据而错过存储证明，抵押金会被销毁。"
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "收益是你自己钱包中的 Siacoin：不会付款到银行，需要你自己在交易所出售。"
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "抵押金按合约锁定，如果托管方因离线或丢失数据而错过存储证明，抵押金会被销毁。"
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "网络上提供的存储空间只有约 30% 被使用，因此新的托管方要争夺很少的需求。"
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "租用者存储的是加密的文件片段，也没有人通过你的 IP 转发流量，但我们没有找到 Sia 说明租用者是谁、如何审核的内容。"
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd 自 2022 年起由 Sia Foundation 公开开发。"
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd 以 MIT 许可证开源。"
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Sia Foundation 以容器镜像形式发布 hostd。"
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "无需许可：无需注册，也没有账户。"
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide 是一个带宽共享服务，让你把闲置的网络带宽变现。使用一个可选的机器 ID 来跟踪设备。可通过 income-generator 项目的社区 Docker 镜像获取。\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "带宽共享 - 基于机器 ID"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "机器 ID"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "已注册设备的机器 ID（留空则自动生成）"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "可用信息有限。收益取决于所在地区。"
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
spide.payout.notes:
  text: "尚未确定：CashPilot 尚未核实此服务把你的收益存放在哪里。"
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "其收益的 10%"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "$5 注册奖励"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "同一个公网 IP 上的流量会在共享该 IP 的设备之间分配，因此同一网络连接上的第二台设备不会带来额外收益。"
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot 不运行 Spide：你需要使用提供商自己的应用，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "用一张 NVIDIA GPU 挖 Pearl、Zano 或 Ravencoin。CashPilot 在首次启动时下载官方的 SRBMiner-Multi 发布版本并校验其 SHA-256。你选择的矿池会向你的公开收款地址付款。SRBMiner-Multi 在 Pearl 上抽取 2% 的哈希时间，在另外两种币上抽取 0.85%。电费可能高于你挖到的币的价值。"
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "用 NVIDIA GPU 挖 Pearl 及其他 GPU 币"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "收款地址"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "矿工名"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "算法"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "矿池（主机:端口）"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "加密矿池连接（TLS）"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "你的公开 Pearl 地址（prl1...）。如挖 Zano 或 Ravencoin，请填写该币的地址和对应的矿池。"
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "Pearl 用 pearlhash，Zano 用 progpow_zano，Ravencoin 用 kawpow。"
  source: "31c8ee0aa660"
srbminer-multi.earnings.notes:
  text: "未扣电费的毛收益估算。2026-11-25，hashrate.no 估计一张功耗约 142 W 的 RTX 4070 挖 Pearl 每天约 $2.45。我们没有实测。Pearl 是一种新币，其价格和难度变化很快。请核对你的 GPU 功耗和电价，看看是否划算。"
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL（HeroMiners）"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "达到矿池门槛时"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "余额达到你的门槛时，矿池会向你的地址付款。在付款之前，余额由矿池保管。"
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64、一张 NVIDIA GPU 以及 NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "这台机器报告的是机房网络连接。挖矿前请查看你的服务商条款。一些服务商（包括 Hetzner Cloud）禁止挖矿。在相信收益估算之前，请先核算你的实际电费。"
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "2% 的挖矿软件费适用于 pearlhash。SRBMiner-Multi 在 progpow_zano 和 kawpow 上抽取 0.85%。默认的 Pearl 矿池 HeroMiners 收取 1% 的矿池费。它每小时检查一次付款，1 PRL 起付。其他矿池自行设定费率和门槛。"
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "算力"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "否。矿机向你选择的矿池发送工作。"
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "你的收款地址、矿工名和 IP 地址会发送给矿池。首次启动时会从 GitHub 下载挖矿软件。"
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "一些网络和 DNS 解析器会屏蔽与矿池的连接。"
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "大多数矿池通过你的公开收款地址识别你。"
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "挖矿软件在 Pearl 上抽取 2% 的哈希时间，在 Zano 和 Ravencoin 上抽取 0.85%。"
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "一些托管服务商禁止加密货币挖矿。"
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "该挖矿软件是闭源的，因此除其开发者外，没有人能审计它运行的内容。"
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "GPU 的电费可能高于挖到的币的价值，而且 Pearl 的价格波动很快。"
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "挖矿软件向矿池发送工作，不转发任何他人的流量。"
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "你可以用一个公开地址在 HeroMiners 上挖 Pearl，无需账户。"
  source: "1844ccbbc00a"
storj.description:
  text: "Storj 是一个去中心化云存储网络，你通过出租闲置磁盘空间赚钱。通过 Docker 运行存储节点，每存储 1 TB 每月可获 $1.35，另加每 TB 出站流量（egress）$1（2026 年 9 月 1 日起的费率）。付款按月以 USDC（一种美元稳定币）在以太坊主网上支付到你自己控制的钱包，前提是余额超过基于手续费的最低额（2026 年 9 月那次付款之前为 STORJ 代币）。需要至少 550GB 可用磁盘空间和稳定的网络连接。无需账户或注册 -- 自 2025 年年中起节点无需许可。注意（2026 年 10 月）：Storj Labs 于 2026 年 7 月 26 日申请了 Chapter 11 破产保护（美国西弗吉尼亚州北区破产法院，案号 5:26-bk-00512），以重组历史债务。网络仍在运行，Storj 仍在向活跃节点付款，但申请之前的节点收益在法院作出裁决前被冻结。STORJ 代币较 2021 年高点下跌了约 98%。Binance 于 2026 年 9 月 3 日将其下架，Coinbase 于 2026 年 9 月 28 日暂停了它的交易。新节点在前九个月会暂扣部分收益，并且只会随着客户需求逐步填满，因此现在开始运行一个节点，意味着要把漫长的回本期押在一家正在重组、仍可能清算关闭的公司身上。\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "去中心化存储节点 - 每 TB 存储 $1.35 + 每 TB 出站流量 $1"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "钱包地址"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "电子邮件"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "外部地址"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "分配的存储空间"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "身份目录"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "存储目录"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "用于接收 USDC 付款的以太坊钱包地址（例如 0x1234...abcd）。必须是自托管钱包（MetaMask、Ledger 等）-- 切勿使用交易所地址"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "用于接收运营者通知的电子邮件地址"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "带端口的 DDNS 主机名（例如 mynode.ddns.net:28967）-- 强烈建议使用它而不是固定 IP，否则网络运营商哪天悄悄更换了你的 IP，节点就会失联。端口 28967 必须转发（TCP+UDP）"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "要分配的最大磁盘空间（例如 2TB）。请使用机械硬盘（HDD），不要用 SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "存放身份文件的主机路径（必须包含 ca.cert、ca.key、identity.cert、identity.key）"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "机械硬盘（HDD）上用于 Storj 数据存储的主机路径。需要至少 550GB 可用空间"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "首次运行之前，请先初始化存储节点配置：docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "节点身份。其 ID 与工作量证明绑定，重新生成需要数小时，而且无法从任何其他内容的备份中重建。丢失它会失去被暂扣的付款余额。"
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "已存储的客户数据和节点的暂扣金额。丢失它会导致节点被取消资格，并失去暂扣的余额。"
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Storj 网络无法通过你公布的 ADDRESS 回连你的节点，因此卫星节点将其视为离线：新数据不再进来，出站流量收入停滞，长时间离线会导致暂停。请检查 ADDRESS 是否与你当前的公网 IP 一致（使用 DDNS 主机名而不是固定 IP，这样网络运营商更换 IP 时节点不会失联），并确认端口 28967 TCP+UDP 已转发到这台机器。"
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "2026 年 9 月 1 日起：每 TB 存储 $1.35 + 每 TB 出站流量 $1 + 每 TB 审计/修复 $1。收益随存储的数据量和节点运行时长增加。前 9 个月依次暂扣 75%、50% 和 25% 的收益；暂扣金额的一半在第 16 个月退还，其余在正常退出（graceful exit）时退还。端口 28967 必须转发。"
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "以太坊交易手续费的 4 倍，更少的余额顺延"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "每月"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "当钱包余额至少为当前交易手续费的四倍时，按月在以太坊主网上以 USDC 支付；更少的余额顺延到下个月。2026 年 9 月那次付款之前为 STORJ 代币。仪表板位于端口 14002。"
  source: "6208f04947d2"
storj.payout.notes:
  text: "余额超过基于手续费的最低额后，按月在以太坊主网上以 USDC 支付到 WALLET 中的地址。2026 年 9 月那次付款之前为 STORJ 代币；zkSync Era 付款已于 2026 年 9 月 1 日停止。"
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "节点仪表板在端口 14002 上的 URL，使用服务器的局域网 IP 而不是 localhost，例如 <b>http://192.168.1.10:14002</b>。有多个节点时，请用逗号分隔列出它们的 URL：CashPilot 会把它们加总。"
  source: "e582f1e74baa"
storj.requirements.note:
  text: "同一 /24 子网中的 Storj 节点共享数据分配，会降低每个节点的收益。"
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "上行 5 Mbps"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "磁盘空间以及提供这些空间所需的带宽。"
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "否。你存储的是经过加密和纠删码处理的客户数据片段。其他人不会通过你的 IP 转发他们自己的流量。"
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "节点身份、你的钱包地址、节点为发送运营者通知而要求的电子邮件地址，以及你的 IP 和端口（节点必须可被访问才能提供数据）。"
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "主要是流量上限的问题，而不是法律责任问题：节点会持续地提供和接收客户数据，这在你的线路上是真实而持续的流量。但与代理或中继不同，它不是以你为来源的匿名第三方流量，因此不会像那些服务一样招来滥用投诉。"
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "节点数量不限，但同一 /24 子网中的节点共享分配，因此同一网络连接上的多个节点各自收益更少。"
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk 于 2026 年 7 月 27 日报道，Storj Labs 已申请 Chapter 11 破产保护。"
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "申请之前应付给节点运营者的款项已进入破产债权申报程序。"
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "新节点在前九个月依次被暂扣 75%、50% 和 25% 的收益；一半在第 16 个月退还，其余只在正常退出（graceful exit）时退还。"
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "客户存储的是加密的文件片段，也没有人通过你的 IP 转发流量，但我们没有找到 Storj 说明客户是谁、如何审核的内容。"
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "存储节点软件以 AGPL-3.0 许可证开源。"
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj 发布了自己的 Docker 镜像 storjlabs/storagenode。"
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "无需账户：只需一个钱包地址和一个接收运营者通知的邮箱。"
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "申请破产后，活跃节点仍持续收到付款。"
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR 是一个无需账户的门罗币（Monero）矿池：你的矿机以你的门罗币地址作为用户名登录，矿池向该地址付款。CashPilot 在这里不运行矿机。它读取 SupportXMR 为你的地址保留的余额，让你在其他收入旁边看到你的 CPU 矿机赚了多少。该余额是已赚到但尚未收到的：一旦超过你的付款门槛，矿池就会支付。\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "门罗币矿池，按你的收款地址跟踪"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR（自动），按需申请为 0.01 XMR"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "余额超过你的门槛时，或按需申请"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "余额达到你的门槛（默认 0.1 XMR）后，SupportXMR 会向你的地址付款。你也可以在其网站上申请 0.01 XMR 起的即时付款，手续费 0.001 XMR。"
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "该余额是已赚到但尚未收到的，直到 SupportXMR 付到此地址。没有私有查看密钥（view key）就无法在链上读取门罗币余额，而 CashPilot 从不索要该密钥，因此每笔付款都需要你自己确认。"
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "你的门罗币收款地址：即你的矿机在 SupportXMR 上使用的用户名，去掉任何 <b>.workername</b> 或 <b>+difficulty</b> 部分。它是公开的，无法用来动用任何资金。"
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "需要一个指向 pool.supportxmr.com 的门罗币挖矿程序（XMRig）"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "算力"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "否。你的矿机向矿池发送哈希；没有人通过你的网络连接转发流量。"
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "你的门罗币地址、你选择的矿工名、你的算力，以及矿池所见的矿机 IP 地址。"
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "矿机只与矿池保持一个连接，使用的带宽很少。需要关注的成本是电费，而不是网络运营商。"
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "没有账户。地址就是身份，任何人都可以在 supportxmr.com 上查看其统计数据。"
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "只以门罗币支付，矿池费 0.6%，默认门槛为 0.1 XMR，达到后才自动付款。"
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot 不为 SupportXMR 运行矿机：你需要把自己的挖矿程序指向矿池，CashPilot 只读取余额。"
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol 通过一个由 Beacon 组成的网络，让 AI 代理能够访问实时网页。Teneo Beacon 是 Teneo 自己的应用，支持 Android、iOS、macOS、Windows 和 Linux，并有用于服务器和 Raspberry Pi 的命令行版本。在你接受其同意界面后，它会共享你闲置的带宽，并在在线期间赚取 Teneo Protocol Points 和 Fragments。Fragments 会计入以 USDC 支付的赛季抽奖（Beacon Drop）。Teneo 说 Beacon 赚取的积分是其旧版浏览器扩展的两倍。每个网络连接只有一个 Beacon 产生收益。同一网络连接上的其他设备处于待机状态。请使用推荐链接或推荐码 PSA3BHPJ 在 Expedition Hub 注册，然后登录 Beacon。\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "DePIN 带宽应用（Beacon）- Fragments 用于赛季 USDC 抽奖，通过推荐链接注册 +100 Fragments"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "赚取 Teneo Points 和 Fragments。Fragments 计入赛季 USDC 抽奖，所以每个赛季支付的是奖品，而不是固定费率。Teneo 说 Beacon 赚取的积分是浏览器扩展的两倍。每 8 小时领取一次加成，最多可得 3 倍 Fragments；错过一个时间窗口会降低倍数。"
  source: "7a9714079893"
teneo.payment.frequency:
  text: "赛季抽奖（Beacon Drop）"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Beacon Drop 的奖品以 USDC 支付到你在 Expedition Hub 中绑定的钱包。Hub 会显示你还有多少天可以绑定；未及时绑定钱包的奖品将作废。"
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "请在赛季奖品发放之前在 Expedition Hub 中绑定钱包；未及时绑定钱包的奖品会被 Hub 作废。"
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "每位被推荐好友 Fragments 的 8%，以及其推荐用户 Fragments 的 2%，前提是好友在 7 天内注册并赚到 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "注册时 +100 Fragments，达到 480 Fragments 后再 +150"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "每个网络连接只有一个 Beacon 产生收益。数据中心机器只在 Teneo 已启用的托管服务商上产生收益，Fragments 减半，且没有积分和推荐奖励。VPN 连接永远不会产生收益。"
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Beacon 的 Fragments 只以赛季抽奖奖品的形式支付 USDC，因此运行它不会带来固定的收益。"
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo 说积分将合并为不可转让的奖励代币 $AGENTIC，而不是 $TENEO 代币。"
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "此前定于 2026 年第二季度的目标已经过去，截至 2026 年 11 月，$TENEO 的发行日期、分配方式和领取流程均未确认。"
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot 不运行 Teneo：你需要安装提供商自己的 Beacon 应用，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo 说流量来自经过审核的企业客户，并会屏蔽私有地址和容易被滥用的端口，但没有说明如何审核这些客户。"
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network 是一个成熟的去中心化视频分发和 AI 算力网络（始于 2018 年）。用户运行 Edge Node，共享带宽、存储和计算能力。有重要的内容合作伙伴。赚取 TFUEL 代币。\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "去中心化 CDN + AI 算力 - TFUEL 奖励，成熟项目"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "仅有桌面应用。收益取决于资源和所在地区。有重要合作伙伴，在所有交易所上市。"
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "持续"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "尚未确定：CashPilot 尚未核实此服务把你的收益存放在哪里。"
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot 不运行 Theta Edge：你需要使用提供商自己的桌面应用，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "893de938ed14"
titan.description:
  text: "Titan Network 是一个 DePIN 平台，共享你的 IP 地址、存储和带宽，以换取 TNT 代币奖励。支持 Windows、Mac 和 Android。节点为去中心化 CDN 和存储层提供资源。典型收益为 $5-30/月，取决于共享的资源和地理位置。\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "共享 IP、存储和带宽的 DePIN - $5-30/月"
  source: "799e68401067"
titan.earnings.notes:
  text: "共享 IP、存储和带宽。收益取决于提供的资源和所在地区。分配的存储越多，奖励越高。"
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "按纪元（epoch）"
  source: "75743e03bad2"
titan.payout.notes:
  text: "尚未确定：CashPilot 尚未核实此服务把你的收益存放在哪里。"
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Titan 自己的帮助文档说，节点在运行并不保证有收益：没有分配任务时就没有收益，而且奖励以 TNT 代币发放。"
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot 不运行 Titan：你需要使用提供商自己的应用或扩展，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer 通过与经过验证的企业共享带宽，让你的网络流量变现。除住宅网络外，它也是少数能在 VPS 和数据中心 IP 上良好运行的带宽共享服务之一。使用简单的令牌认证，通过命令行参数传入。支持 Raspberry Pi 等设备的 ARM 架构。\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "带宽共享 - 可在 VPS 上运行，令牌认证"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "令牌"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "设备名称"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "登录 <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>，按 F12 → Application → Local Storage → 点击 <code>https://app.traffmonetizer.io</code> → 复制 <code>authToken</code> 的值（约 54 个字符：数字、一个 <code>|</code>，然后是字母和数字）"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "在仪表板中显示、用于管理设备的名称"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "VPS 和数据中心 IP 的收益低于住宅 IP。美国/欧盟地区收益更高。可通过 Docker 网络支持多个 IP。"
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "最低 $10。已不再提供 PayPal。请先在个人资料中保存一种付款方式：Solana 或 TON 上的 USDT（手续费最低）、Arbitrum（手续费低）或 Tron TRC20（网络手续费高），或 $1,000 起的银行转账。第一次保存的地址立即生效；之后更改需要邮件确认。首次提现前，仪表板可能会要求提供一个即时通讯联系方式（WhatsApp、Telegram 或 Skype）。每次申请只支付整数美元，零头留在余额中。"
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "以个人资料付款设置中保存的链（Solana、TON、Arbitrum 或 Tron）上的 USDT 支付，或银行转账。地址保存在 Traffmonetizer 的设置中，而不是容器中。"
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "登录 <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>，按 F12 → Application → Local Storage → <b>authToken</b> 的值（约 54 个字符：数字、一个 <code>|</code>，然后是字母和数字）。"
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "其每次申请付款金额的 10%"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Traffmonetizer 的服务条款要求住宅 IP，但实际上接受 VPS 节点。"
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot 评分为 1.9；2023 年至 2026 年 11 月的评价者反映付款数周处于待处理状态，或被标记为已完成却没有对应的交易。"
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "同一批评价者反映在线聊天和邮件客服不回复，有时长达数周。"
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "仅支持加密货币或 $1,000 起的银行电汇；PayPal 已取消，每次申请只支付整数美元。"
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Traffmonetizer 的条款要求住宅 IP，因此使用机房网络连接的服务器不符合条款。"
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "2023 年至 2025 年有四位 Trustpilot 评价者反映收益非常慢，例如四台设备每天一美分，或近两年才达到 $10。"
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "付款只需要一个经邮件确认并保存的加密货币地址；仪表板可能会要求提供即时通讯联系方式。"
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer 发布了自己的 Docker 镜像 traffmonetizer/cli_v2。"
  source: "007cb0d9fa02"
unmineable.description:
  text: "用你的 CPU 挖矿，并以你选择的币种收款，例如 SHIB、DOGE 或 XMR。CashPilot 运行 XMRig 连接 unMineable 的 RandomX 矿池，unMineable 会把你的 CPU 挖到的门罗币换成你选择的币。余额达到该币的付款门槛后，它会向你的公开地址付款。CashPilot 部署的每个矿工都带有 CashPilot 的 unMineable 推荐码，可将你的平台费从 1% 降至 0.75%。电费可能高于你的收益。"
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "用 CPU 挖矿，以你选择的币种收款"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "收款币种"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "收款地址"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "矿工名"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "最大 CPU 线程数（%）"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "RandomX 模式"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "unMineable 支付的某个币种的代码，例如 SHIB、DOGE 或 XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "你在该币种上的公开地址。不支持需要 memo 或 tag 的币种。"
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "未扣电费的毛收益估算，按 unMineable 的兑换率以你选择的币支付。2026-11-25，1 kH/s 的 RandomX 算力每月约值 $1。使用一半线程的台式机 CPU 可能多耗电 30 到 50 W。请核对你的实际用电量和电价，看看是否划算。"
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "由 unMineable 按币种设定（2026-11-26 为 0.03 XMR）"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "达到该币的付款门槛时"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "余额达到该币的付款门槛后，unMineable 会向你的地址付款。门槛因币种和网络而异；CashPilot 读取 unMineable 为你的地址报告的门槛。"
  source: "119caa81a181"
unmineable.payout.notes:
  text: "该余额是已赚到但尚未收到的，直到 unMineable 付到此地址。所用的链取决于你选择的币种。"
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "与你部署矿机时相同的收款地址和币种代码，例如 <b>XMR</b>。只填写地址本身，不要带币种、矿工名或推荐码。它是公开的，无法用来动用任何资金。"
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "每位被推荐矿工挖矿奖励的 0.25%"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "平台费从 1% 降至 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "这台机器报告的是机房网络连接。挖矿前请查看你的服务商条款。一些服务商（包括 Hetzner Cloud）禁止挖矿。在相信收益估算之前，请先核算你的实际电费。"
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable 收取 1% 的平台费。CashPilot 会在每个矿工名后加上它的推荐码（#awk6-j1z0），将你的费用降至 0.75%。随后 unMineable 会把你挖矿奖励的 0.25% 付给 CashPilot 的维护者；你保留 99.25%。每种币都有各自的付款门槛，例如 0.03 XMR。"
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "算力"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "否。矿机向 unMineable 的矿池发送工作。"
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "你的收款地址、币种、矿工名、算力和 IP 地址会发送给 unMineable。"
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "一些网络和 DNS 解析器会屏蔽与矿池的连接。"
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "无需账户。地址和币种就是身份，任何人都可以在 unmineable.com 上查看其统计数据。"
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "使用推荐码时 unMineable 仍收取 0.75% 的平台费，并且只在达到各币种的门槛后付款。"
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "一些托管服务商禁止加密货币挖矿。"
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "额外的电费可能高于挖到的币的价值。"
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "地址的统计数据（包括余额）对任何知道该地址的人公开。"
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "矿机向矿池发送哈希，不转发任何他人的流量。"
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "你可以以所选币种向一个公开地址挖矿，无需创建账户。"
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock 是一个 DePIN（Decentralized Physical Infrastructure Network，去中心化物理基础设施网络）平台，让你通过共享网络连接赚取加密货币。它是更广泛的 Web3 生态的一部分。有社区 Docker 镜像，但没有官方镜像。浏览器扩展是主要的使用方式。\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "DePIN 网络共享 - 加密货币付款，以浏览器扩展为主"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "基于加密货币/代币的收益。没有官方 Docker 镜像 — 浏览器扩展是主要客户端。"
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
uprock.cashout.notes:
  text: "UPT 代币，250 UPT 起可提现到 Solana 钱包，需开启双重认证。提现需支付手续费。"
  source: "9a70ab978908"
uprock.payout.notes:
  text: "尚未确定：CashPilot 尚未核实此服务把你的收益存放在哪里。"
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "UpRock 的帮助中心说，提现以 UPT 代币打到 Solana 钱包，最低 250 UPT。"
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "奖励是 UPT 代币；评价者和一篇第三方评测都说其价值非常低。"
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot 不运行 UpRock：你需要使用提供商自己的应用或扩展，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork 是一个去中心化 VPN 和带宽共享网络。你作为社区提供者提供带宽来赚钱。提供者程序用你的账户邮箱和密码自行认证（其 auth-provide 子命令），并把生成的会话 JWT 保存在数据卷中。由 BringYour, Inc. 提供官方 Docker 镜像。\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "去中心化 VPN/带宽 - 邮箱+密码认证，JWT 会话保存在卷中"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "电子邮件"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "密码"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "你的 URnetwork 账户邮箱（你在 <a href=\"https://ur.io\" target=\"_blank\">ur.io</a> 上使用的登录账号）。通过 Google/Apple 登录创建的账户需要先设置密码。还没有账户？请通过 <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a> 注册"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "你的 URnetwork 账户密码（不含空格）。由提供者程序的 auth-provide 登录使用；之后会话保存在数据卷中。"
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "可在 VPS 和住宅网络上运行。自 2026-10-06 起，每个每周纪元以 SN25α（Bittensor 子网 25）支付。支持代理模式，适用于多 IP 设置。"
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "按纪元（epoch）"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "在 ur.io/app/account/earnings 上设置一个 Bittensor coldkey（用 Talisman、TAO.com 或 WalletConnect 钱包签名），然后逐个领取已结束的纪元。每次领取都要从一个 EVM gas 密钥支付 TAO 作为 gas。未领取的纪元会过期；旧的 USDC 付款在 30 天内未绑定钱包时已被取消。"
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "每位好友每天 3 GiB 免费 UR 流量，最多 20 位好友（是流量，不是钱）"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "加入后 90 天内有 2 天通过应用使用至少 10 MiB，即可每天获得 3 GiB 免费 UR 流量；否则推荐关系终止"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "未领取的纪元会过期，对于 30 天内未绑定钱包的网络，旧的 USDC 付款已被取消。"
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "自 2026 年 10 月起，奖励以 Bittensor 子网代币 SN25α 支付，每次领取都要花费 TAO 作为 gas。"
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork 原名 BringYour；其存档的白皮书仍使用旧名称。"
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork 公开了其提供者客户端的源代码。"
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork 发布了自己的 Docker 镜像 bringyour/community-provider，可在 VPS 和住宅网络上运行。"
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "领取只需一个由你自己控制的 Bittensor 钱包。"
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai 是一个 GPU 云市场，你可以把 NVIDIA GPU 出租给 AI/ML 研究人员和开发者。这是一个原生基于 Docker 的平台，你自行设定每小时价格。一张 RTX 3090 被租用时通常可赚 $0.20-0.40/小时。需要安装了较新驱动的 NVIDIA GPU 和稳定的网络连接。收入在很大程度上取决于 GPU 型号、定价策略和市场需求。\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "GPU 市场 - 自行定价，RTX 3090 约 $0.20-0.40/小时"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
