helium.description:
  text: "Helium 是一个成熟的去中心化无线网络。最初是 LoRaWAN 热点，现已扩展到 5G。需要专用硬件（$500+）。赚取 HNT/MOBILE 代币。投资回报率已大幅下降 - 通常为 $4-8/月。\n"
