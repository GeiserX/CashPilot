  source: "fa32942c6b4f"
xmrig.description:
  text: "用你的 CPU 挖门罗币。CashPilot 运行 XMRig，你选择的矿池会以门罗币向你的公开收款地址付款。XMRig 会用 1% 的哈希时间支持其开发者。电费可能高于你挖到的 XMR 的价值。"
  source: "a578c826aa2d"
xmrig.short_description:
  text: "用你的 CPU 和自选矿池挖门罗币"
