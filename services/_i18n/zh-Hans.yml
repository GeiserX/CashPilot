  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot 不运行 Vast.ai：你需要在自己的 GPU 机器上安装 Vast 的托管软件，因此 CashPilot 无法替你部署或更新它。Vast 的托管基于 Linux 主机上的 Docker。"
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
