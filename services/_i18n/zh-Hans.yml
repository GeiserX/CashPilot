  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot 不运行 Nodepay：你需要使用提供商自己的浏览器扩展，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes 是 Noderr Protocol 的免费入门层级，Noderr Protocol 是 Base L2 上的一个 DeFi 项目。micronode 是运行在闲置 Android 手机、Windows 电脑、Mac 或 Chromium 浏览器上的小型代理程序。在 Android 上，它共享手机的移动网络：其他 Noderr 流量通过手机的运营商 IP 发出，因此需要一张开通移动数据的 SIM 卡。在电脑或浏览器中，它利用闲置算力为协议执行自动化任务。按设计，奖励以 NODR 支付，并根据链上的在线时间和可靠性评分计算，但测试版期间网络运行在 Base Sepolia 测试网上：节点奖励没有资金来源，至今尚未支付任何奖励。\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "免费 micronode（Android 共享网络、Windows、Mac、浏览器）- 测试网，奖励至今无资金来源"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "测试网测试版：节点奖励没有资金来源，至今尚未支付任何奖励。网站上的 5-10% APY 是设计目标。等网络离开 Base Sepolia 后再评估。"
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
noderr.cashout.notes:
  text: "奖励累积在节点自己的钱包中，通过应用或 dApp 领取。测试版期间，它们是没有市场价值的 Base Sepolia 测试网代币。"
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "应用在首次启动时创建节点钱包，并向其免费铸造一个灵魂绑定（soulbound）的 Utility NFT。请在应用中备份钱包：丢失设备就会丢失节点身份。测试版期间奖励在 Base Sepolia（测试网）上。"
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android 需要一张开通移动数据的 SIM 卡；桌面和浏览器客户端没有公布 IP 要求。"
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "取决于设备。Android 手机出售的是其移动网络：其他 Noderr 流量通过手机的运营商 IP 地址发出，并计入其流量套餐。Windows 电脑、Mac 或浏览器出售的是闲置算力，用于提供商所称的社交媒体和内容自动化任务。"
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "是。在 Android 上，其他 Noderr 流量通过你手机的移动 IP 地址发出；应用在开始前会征求一份有记录的同意，你也可以在同一界面停止共享。对于 Windows、Mac 和浏览器客户端，提供商描述的是自动化任务，没有说明这些任务是否承载他人的流量。"
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "节点的钱包地址及其在线时间和任务完成数据会作为信誉评分（TrustFingerprint）上链。提供商说任务经过匿名化、在沙箱中运行，并且钱包密钥从不离开设备。没有公布更具体的信息。"
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "在 Android 上，共享的连接是运营商的移动套餐：提供商自己的文档警告说，一些运营商的可接受使用政策可能不允许共享，而且共享流量会消耗套餐额度。对于桌面和浏览器客户端，提供商没有提及网络运营商条款。"
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "每台设备一个节点，每个节点有自己的灵魂绑定 Utility NFT；允许并鼓励运行多台设备。没有公布每个 IP 的上限。没有通常意义上的账户：身份是应用在首次启动时生成的一个钱包。"
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "节点奖励是没有资金来源、没有市场价值的测试网代币，且至今尚未支付；网站上的 5 到 10% APY 是设计目标。"
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "对于桌面和浏览器客户端，Noderr 描述的是自动化任务，没有说明它们是否承载他人的流量。"
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "提供商说任务经过匿名化并在沙箱中运行，但没有公布更具体的信息。"
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "仍是 Base Sepolia 上的测试网测试版。"
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot 不运行 Noderr：你需要使用提供商自己的应用或扩展，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "无需账户：应用在首次启动时生成一个钱包。"
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle 利用智能手机的蓝牙构建物联网基础设施。应用会被动检测并转发附近物联网设备的数据，赚取 NODL 代币。曾被 Forbes 报道，与 Vivendi 和 Hayden AI 有企业合作。仅限手机（iOS 和 Android）。\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "蓝牙物联网中继 - 手机应用，NODL 代币奖励"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "收益非常低。使用蓝牙的后台手机应用。钱包连接可能不稳定。"
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "持续"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL 存放在应用自带的 ZKsync Era 钱包中；可在应用内或 ZKsync Era 区块浏览器上查看。Nodle 已离开其 Polkadot 平行链，Polkadot 到 ZKsync 的跨链桥已于 2025 年 12 月 31 日关闭，因此仍在 Polkadot 一侧的 NODL 已无法再转到 ZKsync。"
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "你的 NODL 存放在 Nodle 应用自己的钱包中，位于 ZKsync Era。CashPilot 无法看到该钱包的地址。"
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "每有一位通过邀请加入的新活跃用户，即可获得一笔 NODL 奖励（Nodle 未公布金额）"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "一位评价者反映三到四年共赚了约 $3；其他人反映每日收益大幅下降。"
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot 不运行 Nodle：你需要使用提供商自己的手机应用，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana 是一个基于 Solana 的去中心化 GPU 算力市场。它把 GPU 所有者与 AI 工作负载需求连接起来，以 NOS 代币付款。一张 RTX 3060 大约可赚 $0.048/小时。该平台专注于 AI 推理工作负载，并使用 Solana 区块链进行任务调度和付款结算。节点通过 Nosana CLI 运行容器化工作负载。\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Solana 上的 GPU 算力 - NOS 代币，RTX 3060 约 $0.048/小时"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 约 $0.048/小时，高端 GPU 收益更高。收益取决于任务供给情况和 GPU 型号。需要 NVIDIA GPU、Linux、Docker 和 Nosana CLI。在 Solana 上以 NOS 代币付款。"
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "每完成一个任务"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "在 Solana 上赚取 NOS 代币。付款到已配置的钱包。"
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Nosana 默认会创建一个 Solana 钱包，因此大多数用户从未见过它的地址。"
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "每个托管方都必须锁定一笔与其 GPU 每小时价格相应的 NOS 质押。"
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "托管方以 NOS 收款，因此按美元计算的收益会随代币价格以及对其显卡的需求而波动。"
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot 不运行 Nosana：你需要使用提供商自己的托管软件，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN 是一个无需账户的比特币矿池：你的矿机以你的比特币地址作为用户名登录，矿池向该地址付款。CashPilot 在这里不运行矿机。它读取 OCEAN 为你的地址保留的未付余额，让你在其他收入旁边看到你的 ASIC 矿机（Bitaxe、Antminer）赚了多少。未付余额是已赚到但尚未收到的：一旦超过付款门槛，OCEAN 就会在链上支付。\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "比特币矿池，按你的收款地址跟踪"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "当某个区块使你的余额超过门槛时"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "未付余额达到门槛后，OCEAN 会在链上向你的地址付款。CashPilot 检测不到 Lightning 付款（需选择开启，BOLT12）。"
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "未付金额是已赚到但尚未收到的，直到 OCEAN 在链上付到此地址；如果你开启了 Lightning 付款则另当别论。"
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "你的 BTC 收款地址：即你的矿机在 OCEAN 上使用的用户名，去掉 <b>.workername</b> 部分。它是公开的，无法用来动用任何资金。"
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "需要一台指向 mine.ocean.xyz:3334 的比特币 ASIC 矿机（Bitaxe、Antminer）"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "算力"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
  text: "否。你的矿机向矿池发送哈希；没有人通过你的网络连接转发流量。"
  source: "7239118f749a"
ocean.disclosure.data_collected:
  text: "你的比特币地址、你选择的矿工名、你的算力，以及矿池所见的矿机 IP 地址。"
  source: "22282404721c"
ocean.disclosure.isp_risk:
  text: "矿机只与矿池保持一个连接，使用的带宽很少。需要关注的成本是电费，而不是网络运营商。"
  source: "7bf5f9f6b028"
ocean.disclosure.account_rules:
  text: "没有账户。地址就是身份，任何人都可以在 ocean.xyz 上查看其统计数据。"
  source: "e3c8fd5863c1"
ocean.rating.cons.0.text:
  text: "只以比特币支付，余额达到 0.01048576 BTC 之前不会进行任何链上付款。"
  source: "9c9981f2fbd5"
ocean.rating.cons.1.text:
  text: "矿池费为 2%，如果你使用 DATUM 自行构建区块模板，则为 1%。"
  source: "497f4f1ec62e"
ocean.rating.cons.2.text:
  text: "CashPilot 不为 OCEAN 运行矿机：你需要把自己的硬件指向矿池，CashPilot 只读取余额。"
  source: "eccc0b4b47ae"
ocean.rating.pros.0.text:
  text: "无需账户，也不做身份验证。OCEAN 只需要它付款的比特币地址。"
  source: "38c4a7764846"
packetstream.description:
  text: "PacketStream 是一个点对点带宽市场，你可以在这里出售闲置带宽。它支撑着一个住宅代理网络，用于市场调研、SEO 监测和广告验证。Docker 设置简单，只需一个 CID（Client ID）。请注意，受 CAPTCHA 保护的登录可能使自动采集收益变得困难。\n"
  source: "ee363f486228"
packetstream.short_description:
  text: "带宽共享 - 基于 CID 的简单设置"
  source: "583d6cb0e210"
packetstream.docker.env.CID.label:
  text: "Client ID"
  source: "8726db013948"
packetstream.docker.env.CID.description:
  text: "登录 <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> → 点击侧边栏中的 Setup → 你的 CID 显示在 Docker 命令中"
  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream 认为这个副本的 IP 地址不是住宅 IP 而拒绝了它，因此没有收益。请在使用家庭宽带的机器上运行它，或删除这个副本。"
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "PacketStream 在此 IP 地址上已有另一个客户端，而每个 IP 只为一个客户端付费。请删除这个副本，或删除与它共用 IP 的另一个。"
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "共享带宽按 $0.10/GB 付费。收益在很大程度上取决于你的 IP 所在地区的需求。"
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "仅支持 PayPal，最低 $5，确认前会显示 3% 的手续费。第一次提现会保存你的 PayPal 邮箱；之后更改需要邮件确认并等待 7 天，所以请在确认前核对地址。申请会在 7 天内审核并发出；等待期间可以取消，而只有在付款完成后才能发起新的申请。"
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "余额由 PacketStream 保管；按需提现。"
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "登录 <a href='https://packetstream.io' target='_blank'>packetstream.io</a>，按 F12 → Application → Cookies，复制 <b>auth</b> Cookie 的值（它是一个 JWT）。"
  source: "15bae9d455f5"
packetstream.referral.bonus.referrer:
  text: "其带宽收益的 20%（限时 Packeter 奖励）"
  source: "964a44bb9e65"
packetstream.referral.bonus.referee:
  text: "首次用银行卡或 PayPal 充值可获 10% 赠送额度（代理客户）"
  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "2025 年和 2026 年的 Trustpilot 评价者反映付款迟到或根本没有到账，一位老用户说付款先是变慢后来停止；也有 2026 年的评价者反映已收到付款。"
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "仅支持 PayPal，提现手续费 3%；PayPal 不提供服务的国家的用户没有其他方式。"
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "条款允许 PacketStream 扣留、撤销或作废其认为与欺诈、操纵或违禁活动有关的收益。"
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
  text: "条款说代理客户和 PacketStream 本身会通过你的网络连接转发流量；条款没有描述对普通买家的任何审核。"
  source: "fd4707690d2b"
packetstream.rating.cons.4.text:
  text: "Trustpilot 注明 PacketStream 没有回复差评；评价者反映邮件无人回复。"
  source: "4885bceb8df9"
packetstream.rating.pros.0.text:
  text: "PacketStream 发布了自己的 Docker 镜像 packetstream/psclient。"
  source: "b358af0b3419"
packetstream.rating.pros.1.text:
  text: "条款只要求设备和网络连接归你所有或你有权使用。"
  source: "bde1b5ad5a6a"
packetstream.rating.pros.2.text:
  text: "条款没有描述任何身份验证；付款只需要一个 PayPal 地址。"
  source: "a05886b55edc"
packetstream.rating.pros.3.text:
  text: "条款写明 PacketStream Inc. 受加利福尼亚州法律管辖。"
  source: "7966bde559dd"
packetstream.rating.pros.4.text:
  text: "PacketStream 自 2018 年起运营。"
  source: "70db8167d5bc"
passiveapp.description:
  text: "PassiveApp 是一个 DePIN 平台，让你通过共享闲置带宽和计算资源赚取加密货币和 PayPal 奖励。实际上仅支持 Windows：开发商自己的下载页面至少从 2025 年 2 月起就一直把 Android、iOS 和 Linux 列为 \"coming soon\"，没有任何变化，而且不存在 macOS 版本 — 尽管同一网站上的宣传文案声称支持更多平台。没有 Docker 镜像。\n"
  source: "e0f069b6b6e0"
passiveapp.short_description:
  text: "DePIN 带宽/算力 - 仅限 Windows，加密货币和 PayPal 付款"
  source: "e23871afdcd9"
passiveapp.earnings.notes:
  text: "仅有 Windows 桌面应用（v1.0.x）；Android/iOS/Linux 自 2025 年初起就被开发商宣布为 'coming soon'，但从未发布。没有官方 Docker 镜像。"
  source: "57f5891e1772"
passiveapp.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
passiveapp.payout.notes:
  text: "尚未确定：CashPilot 尚未核实此服务把你的收益存放在哪里。"
  source: "8d61a71de590"
passiveapp.referral.bonus.referrer:
  text: "终身获得其收益的 10%"
  source: "f0262d54b65c"
passiveapp.rating.cons.0.text:
  text: "CashPilot 不运行 PassiveApp：你需要使用提供商自己的桌面应用，因此 CashPilot 无法替你部署或更新它。尚未核查其条款是否允许在容器中运行。"
  source: "2b27df807548"
passiveapp.rating.pros.0.text:
  text: "PassiveApp 的网站列出了 PayPal、加密货币和礼品卡，最低 $3。"
  source: "5fb04eb0efdc"
proxybase.description:
  text: "ProxyBase 是一个带宽共享平台，用加密货币向共享闲置网络连接的用户付款。你使用仪表板中的 Access Token 为对等（peer）客户端进行认证。住宅 IP 收益最高，但也支持数据中心 IP。提供官方多架构 Docker 镜像（amd64/arm64/armv7）。\n"
  source: "7a558682be11"
proxybase.short_description:
  text: "proxybase.org - 带宽共享，加密货币付款，Access Token 认证。不会生成钱包"
  source: "5224bb16fee4"
proxybase.docker.env.ID.label:
  text: "Access Token"
  source: "f9db72ced1ee"
proxybase.docker.env.NAME.label:
  text: "设备名称"
  source: "6415f86bc24f"
proxybase.docker.env.ID.description:
  text: "登录 <a href=\"https://peer.proxybase.org/dashboard/login?referral=nXzS3c6iTO\">peer.proxybase.org/dashboard</a> → 复制你的 Access Token（显示在设置页面的 Docker 命令中）"
  source: "3571c2e99729"
proxybase.docker.env.NAME.description:
  text: "任意名称（不含空格），用于在你的 ProxyBase 仪表板中识别此设备"
  source: "906ebedecbc7"
proxybase.docker.health_signals.0.means:
  text: "ProxyBase 已至少半小时无法连接到其中继，因此没有收益。重启可以解决；如果重启后仍然如此，请检查这台机器能否访问互联网。"
  source: "cbe6b5ef771f"
proxybase.earnings.notes:
  text: "加密货币付款。收益取决于所在地区和带宽使用量。"
  source: "39229c292994"
proxybase.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
proxybase.cashout.notes:
  text: "网站列出的最低额为 $0.20，2026 年 10 月一笔不到 $1 的申请已成功处理。每次申请总是提取全部余额，以 Polygon 上的 USDC、POL 或 Litecoin 付到你输入的地址。网络手续费由 ProxyBase 承担。"
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "收益累积在 Access Token 所属的 ProxyBase 账户中，按需从仪表板提现。对等客户端不持有钱包，容器也不保存任何状态 -- docker.volumes 为空。不要与 proxybase-xyz（ProxyBase Markets，同一组织）混淆，后者确实会创建本地钱包，并将其声明为关键卷。"
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
  text: "ProxyBase 自己在 2025 年 8 月写道，它还很新，目前还不是追求收益最大化的地方。"
  source: "9f5177f749d7"
proxybase.rating.cons.1.text:
  text: "ProxyBase 在 2026 年更换了对等客户端并关闭了旧后端，因此使用旧镜像的容器虽然继续运行，却不再有收益。"
  source: "452b38e35357"
proxybase.rating.cons.2.text:
  text: "仅支持加密货币，即 Polygon 上的 USDC、POL 或 Litecoin，没有法币方式。最低额为 $0.20，网络手续费由 ProxyBase 承担。"
  source: "2f15ff41b14c"
proxybase.rating.pros.0.text:
  text: "我们一笔不到 $1 的提现于 2026 年 10 月成功到账。"
  source: "00e8781a2252"
proxybase.rating.pros.1.text:
  text: "提现只需在申请中输入一个地址。"
  source: "985d03ae1755"
proxybase.rating.pros.2.text:
  text: "ProxyBase 发布了自己的对等客户端镜像，并支持数据中心 IP。"
  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets 是一个为 AI 代理打造的 SOCKS5 代理市场。卖家运行一个轻量的 Rust CLI 守护进程，通过 WebSocket 连接，经由自己的网络连接转发买家流量，按每售出 1 GB 在 Tempo Chain 上赚取 USDC。支持直连（自有带宽）和上游（转售外部代理）两种模式，并能自动重连。买家按国家、网络运营商和带宽购买代理会话。付款通过 Tempo Chain 上的 Machine Payments Protocol（MPP）进行。推荐链接面向买家：通过它打开控制台的买家，首次充值可多得 10%。\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - 面向 AI 代理的 SOCKS5 市场，USDC 付款。会生成一个钱包，其卷中保存着密钥的唯一副本"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "后端 API URL"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "覆盖后端 API URL（默认为 https://api.proxybase.xyz）"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "容器在首次启动时自动完成初始化：生成一个 secp256k1 钱包（BIP-39），通过 ECDSA 挑战-响应进行认证，并以仅直连模式开始出售带宽。所有状态（钱包、会话令牌、卖家配置）都保存在 <code>proxybase-data</code> 卷中。首次运行时请查看容器日志以获取钱包地址。使用 <code>--upstream</code> 添加外部代理转售路径。\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "生成的钱包密钥文件。这个卷就是钱本身：服务器端没有副本，删除它就等于连同资金一起销毁。"
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "收益按以市场价格售出的 GB 数计算。VPS/数据中心 IP 的收益低于住宅 IP。多上游模式可以把你自己的带宽与外部代理结合起来。"
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "按需申请"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "通过 <code>proxybase-cli seller payout create</code> 锁定收益，以 Tempo Chain 上的 USDC 到账（Tempo MPP）。可付到任何你持有密钥的 EVM 地址（Tempo 是 EVM 链），无需签名；在钱包中添加 Tempo 网络即可看到 USDC。如果钱包仍然没有显示，需要手动添加 Tempo USDC 代币：按 Proxybase 提供的合约地址导入，并在信任余额之前核对该地址。"
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "客户端在首次运行时会创建自己的钱包。"
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "被推荐买家每次充值的 15%，作为你自己代理会话的额度"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "买家首次充值额外 +10%"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "带宽，作为 SOCKS5 代理卖给 ProxyBase 市场上的买家。"
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "是。买家通过你的网络连接转发他们的流量 — 这正是所出售的东西。"
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "在你的机器上生成的钱包地址，以及你转发的流量大小。"
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "确实存在，而且直接适用于家庭网络。来自未知买家的代理流量以你的 IP 发出，因此滥用投诉会找上你。本目录中没有任何内容将该服务限制在数据中心地址，而住宅 IP 收益更高，所以这里的激励方向是错的：在家中运行之前，请先阅读你的网络运营商条款。"
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "未知 - 提供商没有公布每个账户或每个 IP 的设备上限，目录中也没有声明。"
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "付款为 Tempo Chain 上的 USDC，付到任何你持有密钥的 EVM 地址。"
  source: "349f93fcfa2b"
