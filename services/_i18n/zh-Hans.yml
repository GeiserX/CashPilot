helium.rating.cons.0.text:
  text: "HIP 149 于 2026 年 7 月 6 日取消了 Proof-of-Coverage 奖励；IoT 热点现在只按实际传输的数据获得收益，其中超过 114,000 个热点没有传输任何数据。"
