bytelixir.cashout.notes:
  text: "암호화폐로만 지급합니다. 최소 금액은 코인에 따라 다릅니다: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. 요청할 때마다 주소를 입력합니다. 요청은 업무 시간에 24시간 이내로 처리됩니다."
