proxyrack.docker.health_signals.0.means:
  text: "ProxyRack 클라이언트가 이 사본에서 실행되지 않아 수익이 없습니다. 보통은 ProxyRack의 업데이트 서버가 응답하지 않는 것이 원인이며, 클라이언트는 이 서버 없이 시작할 수 없습니다. 사본은 5분마다 다시 시도하고 서버가 응답하면 바로 스스로 시작합니다. 직접 고칠 것은 없습니다."
  source: "0df8b8cfac10"
proxyrack.docker.health_signals.1.means:
