  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack은 자체 Docker 이미지 proxyrack/pop을 공개하고, 데이터 센터 IP를 더 낮은 요율로 허용합니다."
  source: "278541f81053"
repocket.description:
  text: "Repocket을 사용하면 사용하지 않는 인터넷 대역폭을 공유하여 패시브 인컴을 얻을 수 있습니다. 가정용 IP가 가장 많이 벌며, VPS/데이터 센터 IP는 더 낮은 요율로 허용됩니다. 계정당 최대 기기 5대, 활성 세션 5개입니다. Docker 컨테이너는 계정 이메일과 Repocket 대시보드의 API 키(비밀번호가 아님)로 인증합니다.\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "대역폭 공유 - 최대 기기 5대, API 키 인증"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "이메일"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "API 키(UUIDv4, 비밀번호 아님)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "Repocket 계정 이메일"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Repocket API 키 — <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a>에 로그인하고 bandwidth-earnings 페이지에 표시된 API 키를 복사하십시오(계정 비밀번호가 아닙니다). 계정이 없습니까? <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>에서 가입하십시오"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "가정용 IP가 더 많이 법니다. VPS/데이터 센터 IP는 허용되지만 요율이 더 낮습니다."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4(첫 지급 이후 $2)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket은 계정마다 최소 금액을 정합니다: 2026년 10월 기준 첫 지급 전 $4, 이후 $2로, 예전에 광고하던 $20보다 훨씬 낮습니다. 방법: Tremendous(이메일로) 또는 Polygon의 USDT. 각 요청은 2시간 이내에 이메일 링크로 확인해야 하며, 한 번에 하나의 요청만 대기할 수 있습니다. 2026년 10월에 Repocket은 Tremendous 요청을 \"Please, message support\"라며 거부했고, Polygon의 USDT는 처리되었습니다."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "잔액은 Repocket이 보유하며, 요청 시 출금합니다."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Repocket 계정 이메일과 비밀번호를 사용하십시오(<a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>과 동일). 계정이 없습니까? <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>에서 가입하십시오."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "추천한 사용자가 $7을 벌면 $2, 이후 그 사용자 수익의 5%, 평생"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "가입 시 $2 지갑 보너스"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket은 계정당 기기 5대 제한을 명시하지만 IP당 기기 제한은 공개하지 않습니다. 리뷰 사이트에서 되풀이되는 'IP당 2대'라는 수치는 제공업체 출처가 없으므로 CashPilot은 이를 단정하지 않습니다."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Repocket 기기의 공유를 유지하거나, 잔액을 출금하십시오"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "12개월 동안 로그인, 지급, 대역폭 공유가 없으면 Repocket은 미지급 잔액을 몰수할 수 있습니다."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "기기의 공유를 유지하거나, 로그인하거나, 출금하십시오. Repocket 사용을 그만둔다면 먼저 출금하십시오."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "여러 Trustpilot 리뷰어가 지급 취소와 잔액이 0으로 초기화된 경험을 보고하며, 한 명은 지원팀이 비정상적인 대역폭 수익을 이유로 들었다고 말합니다. 해당 페이지의 Repocket 평점은 2.7이며, 부정적인 리뷰에 답하지 않았다고 표시되어 있습니다."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "리뷰어들은 출금이 거부되거나 지급을 계속 독촉해야 했다고 보고합니다."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Repocket의 지급 정책은 수익이 무효라고 의심될 때마다 이를 취소, 철회 또는 영구 몰수할 수 있고, 휴면 계정의 미지급 수익을 몰수할 수 있게 합니다."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "같은 정책에 따라 Repocket은 언제든 통지 없이 지급 방법을 추가, 제거 또는 교체할 수 있으며, PayPal은 제거되었습니다."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "약관에 따르면 Repocket은 언제든 신원 또는 계정 확인을 요구할 수 있으며, 지급 자격은 이에 따라 결정됩니다."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "약관에 따르면 Repocket과 그 파트너가 네트워크 용량을 사용하지만, 파트너가 누구인지, 어떻게 확인하는지는 밝히지 않습니다."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot에 따르면 Repocket은 부정적인 리뷰에 답하지 않았으며, 리뷰어들은 메시지가 무시된다고 말합니다."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "현재 약관에는 싱가포르의 Repocket Pte. Ltd.가 명시되어 있으며, 이전 약관에는 회사 이름이 없었습니다."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket은 자체 Docker 이미지 repocket/repocket을 공개하며, 약관은 본인 소유의 컨테이너를 허용합니다."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "최소 금액이 낮습니다: 첫 지급 전 $4, 이후 $2."
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io를 사용하면 분산 AI 작업에 GPU를 공유하고, 기프트 카드, 게임 또는 현금으로 교환할 수 있는 Salad 잔액을 받을 수 있습니다. 네이티브 데스크톱 애플리케이션으로 Windows에서만 작동합니다. 별도의 GPU(NVIDIA 또는 AMD)가 필요합니다. 플랫폼은 머신이 유휴 상태일 때 AI 추론, 렌더링 등 컴퓨팅 작업을 보냅니다. 비교적 사용하기 쉬운 GPU 공유 플랫폼 중 하나입니다.\n"
  source: "09335baccea6"
salad.short_description:
  text: "AI용 GPU 공유 - Windows 전용, 기프트 카드 또는 현금 지급"
  source: "4665796e0965"
salad.earnings.notes:
  text: "수익은 GPU 모델과 작업 가용성에 따라 다릅니다. RTX 3060 ~$1-3/일. Windows 전용입니다. 네이티브 앱이며 Docker는 지원하지 않습니다. 기프트 카드, 게임 또는 PayPal로 교환할 수 있습니다."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
salad.cashout.notes:
  text: "Salad 스토어를 통한 PayPal 또는 기프트 카드."
  source: "5128232e4f57"
salad.payout.notes:
  text: "PayPal과 기프트 카드만 가능하며 암호화폐는 절대 없습니다. 지갑 주소가 없으므로 CashPilot이 보여 줄 온체인 잔액이 없습니다."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "<a href='https://app.salad.io' target='_blank'>app.salad.io</a>에 로그인하고 F12 → Application → Cookies에서 <b>auth</b> 쿠키 값을 복사하십시오."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Salad Reward Points를 조금이라도 적립하거나, 잔액을 사용하십시오"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "계정이 12개월 연속으로 Reward Points를 적립하지 않으면 교환하지 않은 잔액이 만료될 수 있습니다."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "적립될 때까지 Salad 앱을 실행하거나, Salad Storefront에서 잔액 전체를 사용하십시오. 일부만 사용하면 12개월이 다시 시작되지 않습니다."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot은 Salad를 실행하지 않습니다. 제공업체의 자체 데스크톱 앱을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "2026년 10월과 11월에 여러 Trustpilot 리뷰어가 PayPal 출금이 빨리 도착했다고 보고하며, 일부는 여러 번 받았습니다. 같은 기간 한 리뷰어는 출금 시도가 반복해서 실패했다고 말합니다."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel은 탈중앙화 VPN을 위한 Cosmos 기반 Layer 1 블록체인입니다. 노드 운영자는 유연한 가격(GB당 또는 시간당)으로 VPN 사용자에게 대역폭을 판매합니다. 공식 Docker 배포 가이드가 있습니다. 활발한 커뮤니티가 있는 오래된 프로젝트입니다.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "Cosmos 기반 탈중앙화 VPN - 노드 운영자가 대역폭 판매"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "운영자가 GB당 또는 시간당 가격을 직접 정합니다. 수익은 해당 지역의 VPN 사용자 수요에 따라 달라집니다."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "세션마다"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "지급은 P2P 토큰으로 이루어지며, 모든 대역폭 결제의 20%가 노드 호스트가 아닌 스테이커에게 갑니다."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "토큰 이름은 2021년에 SENT에서 DVPN으로, 2025년에 DVPN에서 P2P로 바뀌었습니다."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot은 Sentinel을 실행하지 않습니다. 제공업체의 자체 노드 소프트웨어를 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel은 노드 소스 코드를 자체 오픈 소스 라이선스로 공개합니다."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia는 2015년부터 운영되어 온, Sia Foundation(스위스 비영리 단체)이 운영하는 탈중앙화 스토리지 마켓플레이스입니다. Foundation의 공식 hostd 노드를 실행하여 남는 디스크 공간을 임대하고 스토리지 및 대역폭 계약으로 Siacoin을 받습니다. 노드가 수익을 내려면 먼저 Siacoin을 조금 사야 합니다: 호스트는 계약마다 담보를 예치하고 스토리지 증명마다 수수료를 냅니다. 담보는 계약이 완료되면 돌아오고, 노드가 오프라인이 되거나 데이터를 잃으면 소각되므로 항상 켜져 있는 머신이 필요합니다(Sia는 최소 95% 가동 시간을 요구합니다). 수익은 임차인이 실제로 저장하는 데이터 양에 따라 달라집니다. Sia는 스토리지 가격을 월 TB당 $1로 권장하므로, 작은 VPS보다는 큰 여유 디스크가 있는 머신에 적합합니다.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Sia Foundation 스토리지 노드 - 공식 Docker 이미지, Siacoin 적립"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "지갑 시드 문구"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "대시보드 비밀번호"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "스토리지 디렉터리"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "호스트의 Siacoin 지갑을 제어하는 BIP-39 시드 문구입니다. `docker run --rm ghcr.io/siafoundation/hostd seed`로 생성하고 백업하십시오 -- 수익에 접근할 수 있는 유일한 방법입니다"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "hostd 웹 UI와 로컬 API(BasicAuth)의 비밀번호입니다. 긴 암호 문구라면 무엇이든 됩니다"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "임차인 데이터를 저장할, 가장 큰 디스크의 호스트 경로(예: /srv/sia). 최소 256GB의 여유 공간이 필요합니다"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "배포 시 CashPilot은 노드를 실행하는 머신에 새 지갑을 만들고 시드 문구를 한 번 보여 줍니다: 적어 두십시오. 이미 가진 지갑을 쓰려면 대신 그 지갑의 시드 문구를 붙여 넣으십시오. 배포한 뒤 담보와 수수료용 Siacoin을 노드 지갑으로 보낸 다음, 대시보드에서 스토리지 폴더(/storage)를 추가하고 가격을 정하고 호스트를 공지하십시오.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "지갑 시드 문구(hostd.yml), 지갑 데이터베이스, 호스트 설정, 계약 상태입니다. 이를 잃으면 노드의 신원과 계약 수익 추적이 사라지며, 그때는 적어 둔 시드 문구가 자금을 복구할 유일한 방법입니다."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "저장된 임차인 데이터입니다. 이를 잃으면 스토리지 증명에 실패하고 해당 계약에 예치된 담보를 몰수당합니다."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "호스트가 직접 가격을 정합니다. Sia는 월 저장 TB당 $1, 다운로드 TB당 $5 초과를 권장하며, 모든 계약 지급액의 3.9%는 Siafund 보유자에게 갑니다. 수입은 노드에 들어오는 임차인 데이터 양에 비례하며, 이 양은 0에서 시작해 가동 시간과 가격에 따라 늘어납니다. 담보(Sia는 스토리지 가격의 2x를 권장)는 계약마다 예치되며, 계약이 성공적으로 완료되면 돌려받습니다.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "수익은 호스트 자체 Siacoin 지갑(시드로 제어)에 쌓입니다. 거래소에서 SC를 환전하고 거기서 은행/카드로 출금하십시오. 제공업체 측의 지급 요청은 없습니다.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "자금은 노드 안의, 시드로 제어되는 Sia 지갑에 있습니다. 시드 문구는 노드를 실행하는 머신의 hostd 데이터 볼륨에만 있으며, CashPilot은 이를 저장하지 않습니다. 지갑을 만들 때 적어 둔 문구가 유일한 복구 방법입니다.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "포트 9981(TCP, 합의)과 9984(TCP 및 UDP, 임차인 계약)가 포워딩된 안정적인 공개 주소가 필요합니다. Sia에서는 데이터 센터/VPS 호스팅이 흔합니다. 노드가 계약을 받으려면 지갑에 Siacoin이 있어야 합니다."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "디스크 공간과 이를 제공하기 위한 대역폭입니다."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "아니요. 임차인이 암호화된 파일 조각을 사용자 디스크에 저장하고 다시 가져갑니다. 다른 사람이 사용자의 IP로 임의의 트래픽을 보내지 않습니다."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Sia 지갑 주소, 호스트 공개 키, 그리고 임차인이 접근할 수 있도록 노드가 공지하는 공개 IP:포트입니다."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "다른 스토리지 서버를 운영할 때와 비슷하게 회선에 지속적인 업로드/다운로드 트래픽이 발생합니다. 익명화된 제3자 웹 트래픽이 사용자에게 귀속되지는 않습니다."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "누구나 참여 가능: 가입도 계정도 없습니다. 노드가 오프라인이 되거나 데이터를 잃어 스토리지 증명을 놓치면 담보가 소각됩니다."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "수익은 본인 지갑의 Siacoin입니다: 은행으로 지급되지 않으므로 거래소에서 직접 팔아야 합니다."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "담보는 계약마다 예치되며, 호스트가 오프라인이 되거나 데이터를 잃어 스토리지 증명을 놓치면 소각됩니다."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "네트워크에 제공된 스토리지 중 약 30%만 사용되고 있어, 새 호스트는 적은 수요를 두고 경쟁합니다."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "임차인은 암호화된 파일 조각을 저장하고 누구도 사용자의 IP로 트래픽을 보내지 않지만, 임차인이 누구인지, 어떻게 확인하는지를 Sia가 밝힌 곳은 찾지 못했습니다."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd는 2022년부터 Sia Foundation이 공개적으로 개발합니다."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd는 MIT 라이선스의 오픈 소스입니다."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Sia Foundation은 hostd를 컨테이너 이미지로 공개합니다."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "누구나 참여 가능: 가입도 계정도 없습니다."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide는 사용하지 않는 인터넷 대역폭으로 수익을 내는 대역폭 공유 서비스입니다. 기기 추적에 선택적 머신 ID를 사용합니다. income-generator 프로젝트의 커뮤니티 Docker 이미지로 사용할 수 있습니다.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "대역폭 공유 - 머신 ID 기반"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "머신 ID"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "이미 등록된 기존 기기의 머신 ID(비워 두면 자동 생성)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "알려진 정보가 많지 않습니다. 수익은 위치에 따라 달라집니다."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
spide.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "추천한 사용자 수익의 10%"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "$5 가입 보너스"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "공개 IP 하나를 통한 트래픽은 그 IP를 공유하는 기기들 사이에 나뉘므로, 같은 연결에 두 번째 기기를 추가해도 늘어나는 것이 없습니다."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot은 Spide를 실행하지 않습니다. 제공업체의 자체 앱을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "NVIDIA GPU 한 장으로 Pearl, Zano 또는 Ravencoin을 채굴합니다. CashPilot은 첫 시작 시 공식 SRBMiner-Multi 릴리스를 내려받아 SHA-256을 확인합니다. 선택한 풀이 공개 지급 주소로 지급합니다. SRBMiner-Multi는 해싱 시간 중 Pearl에서 2%, 나머지 두 코인에서 0.85%를 가져갑니다. 전기 요금이 버는 코인보다 더 많이 들 수 있습니다."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "NVIDIA GPU로 Pearl과 다른 GPU 코인 채굴"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "지급 주소"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "워커 이름"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "알고리즘"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "풀(host:port)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "풀 연결 암호화(TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "공개 Pearl 주소(prl1...)입니다. Zano나 Ravencoin은 해당 코인의 주소와 그 코인용 풀을 입력하십시오."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "Pearl은 pearlhash, Zano는 progpow_zano, Ravencoin은 kawpow."
  source: "31c8ee0aa660"
srbminer-multi.docker.runtime_reason:
  text: "gVisor는 GPU를 이 서비스에 전달할 수 없습니다."
  source: "302a2b5c988f"
srbminer-multi.earnings.notes:
  text: "전기 요금을 빼기 전의 총 추정치입니다. 2026-11-25 hashrate.no는 약 142 W를 소비하는 RTX 4070의 Pearl 수익을 하루 약 $2.45로 추정했습니다. 저희가 직접 측정하지는 않았습니다. Pearl은 새로운 코인이며 가격과 난이도가 빠르게 바뀝니다. 수익이 나는지 보려면 GPU의 소비 전력과 전기 요금을 확인하십시오."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL(HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "풀 기준액에 도달할 때"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "잔액이 기준액에 도달하면 풀이 주소로 지급합니다. 지급할 때까지 풀이 잔액을 보유합니다."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, NVIDIA GPU, NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "이 머신은 호스팅 연결로 보고됩니다. 채굴하기 전에 제공업체의 약관을 확인하십시오. Hetzner Cloud를 포함한 일부 제공업체는 채굴을 금지합니다. 수익 추정치를 믿기 전에 실제 전기 요금을 확인하십시오."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "채굴기 수수료 2%는 pearlhash에 적용됩니다. SRBMiner-Multi는 progpow_zano와 kawpow에서 0.85%를 가져갑니다. 기본 Pearl 풀인 HeroMiners는 풀 수수료 1%를 부과합니다. 매시간 지급을 확인하며 1 PRL부터 지급합니다. 다른 풀은 자체 요율과 기준액을 정합니다."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "컴퓨팅"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "아니요. 채굴기는 선택한 풀로 작업을 보냅니다."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "지급 주소, 워커 이름, IP 주소가 풀로 전송됩니다. 첫 시작 시 GitHub에서 채굴기를 내려받습니다."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "일부 네트워크와 DNS 리졸버는 채굴 풀 연결을 차단합니다."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "대부분의 풀은 공개 지급 주소로 사용자를 식별합니다."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "채굴기는 해싱 시간 중 Pearl에서 2%, Zano와 Ravencoin에서 0.85%를 가져갑니다."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "일부 호스팅 제공업체는 암호화폐 채굴을 금지합니다."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "채굴기는 비공개 소스이므로, 개발자 외에는 누구도 그것이 무엇을 실행하는지 검증할 수 없습니다."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "GPU의 전기 요금이 번 코인보다 더 많이 들 수 있으며, Pearl의 가격은 빠르게 움직입니다."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "채굴기는 풀로 작업을 보내며 다른 사람의 트래픽을 중계하지 않습니다."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "공개 주소만으로 계정 없이 HeroMiners에서 Pearl을 채굴할 수 있습니다."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj는 사용하지 않는 디스크 공간을 임대하여 수익을 얻는 탈중앙화 클라우드 스토리지 네트워크입니다. Docker로 스토리지 노드를 실행하면 월 저장 TB당 $1.35에 이그레스 TB당 $1을 받습니다(2026년 9월 1일부터의 요율). 지급은 매월 미국 달러 스테이블코인인 USDC로, Ethereum 메인넷에서 본인이 관리하는 지갑으로 이루어지며, 잔액이 수수료 기반 최소 금액을 넘어야 합니다(2026년 9월 지급까지는 STORJ 토큰). 최소 550GB의 사용 가능한 디스크 공간과 안정적인 인터넷 연결이 필요합니다. 계정이나 가입은 필요 없습니다 -- 2025년 중반부터 누구나 노드를 운영할 수 있습니다. 주의(2026년 10월): Storj Labs는 기존 부채를 구조 조정하기 위해 2026년 7월 26일 Chapter 11을 신청했습니다(미국 파산법원 West Virginia 북부 지구, 사건 번호 5:26-bk-00512). 네트워크는 계속 운영되고 Storj는 활성 노드에 계속 지급하지만, 신청 이전의 노드 수익은 법원이 판단할 때까지 동결됩니다. STORJ 토큰은 2021년 고점 대비 약 98% 하락했습니다. Binance는 2026년 9월 3일에 상장 폐지했고, Coinbase는 2026년 9월 28일에 거래를 중단했습니다. 새 노드는 처음 9개월 동안 수익의 일부를 보류하며 고객 수요에 따라서만 채워지므로, 지금 시작하면 아직 청산될 수도 있는 구조 조정 중인 회사에 긴 회수 기간을 묶어 두게 됩니다.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "탈중앙화 스토리지 노드 - 저장 $1.35/TB + 이그레스 $1/TB"
  source: "c68d5964b002"
