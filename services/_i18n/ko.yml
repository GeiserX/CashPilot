  source: "be820103712e"
proxybase.cashout.notes:
  text: "사이트에는 최소 $0.20으로 나와 있으며, 2026년 10월에 $1 미만 요청이 처리되었습니다. 요청은 항상 전체 잔액을 Polygon의 USDC, POL 또는 Litecoin으로, 입력한 주소로 출금합니다. 네트워크 수수료는 ProxyBase가 부담합니다."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "수익은 Access Token이 속한 ProxyBase 계정에 쌓이며, 요청 시 대시보드에서 출금합니다. 피어 클라이언트에는 지갑이 없고 컨테이너는 상태를 저장하지 않습니다 -- docker.volumes가 비어 있습니다. 실제로 로컬 지갑을 생성하고 이를 중요 볼륨으로 선언하는 proxybase-xyz(같은 조직의 ProxyBase Markets)와 혼동하지 마십시오."
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
  text: "ProxyBase는 2025년 8월에 스스로 아직 신생이며 수익을 극대화할 곳은 아니라고 썼습니다."
  source: "9f5177f749d7"
proxybase.rating.cons.1.text:
  text: "ProxyBase는 2026년에 피어 클라이언트를 교체하고 이전 백엔드를 종료했으며, 그래서 이전 이미지의 컨테이너는 계속 실행되면서 수익이 멈췄습니다."
  source: "452b38e35357"
proxybase.rating.cons.2.text:
  text: "암호화폐로만 지급하며(Polygon의 USDC, POL 또는 Litecoin), 법정화폐 방법은 없습니다. 최소 금액은 $0.20이며 네트워크 수수료는 ProxyBase가 냅니다."
  source: "2f15ff41b14c"
proxybase.rating.pros.0.text:
  text: "저희의 $1 미만 출금이 2026년 10월에 처리되었습니다."
  source: "00e8781a2252"
proxybase.rating.pros.1.text:
