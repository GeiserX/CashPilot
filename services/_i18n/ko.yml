  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai는 P2P GPU 마켓플레이스입니다. NVIDIA GPU가 있는 Linux 머신을 등록하고 스팟 가격과 온디맨드 가격을 직접 정하면, 임차인이 그 머신에서 자신의 Docker 컨테이너를 실행합니다. 임대된 시간(분)에 대해서만 CLORE, BTC, USDT 또는 USDC로 지급됩니다. 호스팅하려면 Ubuntu 22.04 이상(또는 HiveOS)을 실행하는 x86_64 머신, 정상 작동하는 NVIDIA 드라이버, 업로드와 다운로드 모두 최소 100 Mbps가 필요합니다. AMD GPU는 지원되지 않습니다.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "GPU 마켓플레이스 - NVIDIA GPU 임대, CLORE, BTC 또는 USD 스테이블코인으로 지급"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "직접 정한 가격으로, 임대된 시간(분)에 대해서만 지급됩니다. 범위의 상단인 $490은 분 단위로 등록한 RTX 4090 한 장에 대한 Clore 자체의 상한선입니다('up to ~$490/month'). 더 작은 카드는 덜 벌고, 놀고 있는 카드는 아무것도 벌지 못합니다. Clore는 임대마다 5%(온디맨드) 또는 1.25%(스팟)를 가져가며, 임차인이 CLORE 대신 BTC, USDT 또는 USDC로 결제하면 15%를 추가로 가져갑니다."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Account > Billing에서 본인 지갑으로 출금합니다: CLORE(ERC-20, 최소 200, 수수료 약 $0.50), BTC(최소 0.0001, 수수료 0.00005 BTC), 또는 Ethereum이나 BNB Chain의 USDT/USDC(최소 $10, 수수료 $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "출금할 때까지 Clore가 잔액(CLORE, BTC, 그리고 USDT/USDC용 USD 잔액 하나)을 보유합니다. 체인은 출금할 때마다 선택합니다: CLORE는 Ethereum, BTC는 Bitcoin, USDT/USDC는 Ethereum 또는 BNB Chain입니다."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "추천한 호스트와 임차인이 모든 임대에서 내는 플랫폼 수수료의 15%(표준 등급). 코드는 만료되지 않으며, 임대 통화(CLORE, BTC 또는 USD)로 지급됩니다"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "업로드와 다운로드 모두 100 Mbps"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "사용자 머신의 GPU 컴퓨팅 시간입니다."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "예. 임차인이 사용자 머신에서 자신의 Docker 컨테이너를 실행하며, 그 트래픽은 사용자의 회선으로 나갑니다. SSH와 애플리케이션 포트가 인터넷으로 포워딩됩니다."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Clore의 개인정보 처리방침은 계정 데이터와 대략적인 위치가 포함된 IP 주소를 다룹니다. 신분증은 Clore가 KYC를 요구하는 경우에만 제출합니다."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "인바운드 포트가 인터넷에서 접근 가능해야 하며(기본값 22, 8080, 3000-4000), 모르는 사람의 작업이 사용자의 회선에서 실행됩니다. Clore의 네트워크 가이드에 따르면 일부 ISP는 호스팅을 차단합니다."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "18세 이상이어야 하며 제재 대상 국가에 있으면 안 됩니다. Clore는 단독 재량으로 계정을 정지하거나 해지할 수 있으며, 금지된 용도로 사용하면 자금을 잃을 수 있습니다."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "약관과 개인정보 처리방침 어디에도 법인 이름이 없으며, 약관은 준거 관할을 나중 버전으로 미뤄 둡니다."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore는 단독 재량으로 계정을 정지하거나 해지할 수 있으며, 금지된 용도로 사용하면 자금이 몰수될 수 있습니다."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "지급은 암호화폐(CLORE, BTC, USDT 또는 USDC)로만 하며, 임차인이 BTC, USDT 또는 USDC로 결제한 임대에서는 Clore가 15%를 추가로 가져갑니다. 단, 호스트가 CLORE를 예치하면 이를 줄일 수 있습니다."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "호스트는 임대된 시간(분)에 대해서만 지급받으며, RTX 4090에 대한 Clore의 수치는 카드 한 장 기준의 상한선(\"up to ~$490/month\")입니다."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "기본 사용에는 KYC가 필요 없지만, 큰 금액을 출금하거나 규정 준수가 필요한 경우 Clore가 신원 확인을 요구할 수 있습니다."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "임차인은 사용자 머신에서 어떤 공개 Docker 이미지든 실행할 수 있습니다. 약관에 금지된 용도(악성코드, DDoS, CSAM 등)가 나열되어 있지만, 임차인을 어떻게 확인하는지에 대한 설명은 찾지 못했습니다."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot은 Clore.ai를 실행하지 않습니다. 본인 GPU 머신(Ubuntu 22.04 이상 또는 HiveOS)에 Clore의 호스팅 에이전트를 직접 설치하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "임차인이 CLORE로 결제하면 Clore는 온디맨드 임대의 5%(스팟은 1.25%)만 가져가며 추가 수수료는 없습니다."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN은 DAWN 프로토콜로 자금을 조달한 AI 인프라의 대역폭과 커버리지를 점검하는 검증자 네트워크를 운영합니다. DAWN Validator 브라우저 확장 프로그램은 이러한 대역폭 증명과 커버리지 점검에 참여하며, 실행되는 동안 DAWN 보상을 받습니다. 보상에는 아직 확정된 현금 가치가 없습니다. 확장 프로그램에서 계정을 만들고, 요청하면 추천 코드 2QLQV97F를 입력하십시오.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "DePIN 검증자 - 브라우저 확장 프로그램으로 DAWN 포인트 적립"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "토큰 출시 전 Dawn Points를 적립합니다. 실제 가치는 향후 토큰 가격에 따라 달라집니다. 하드웨어 박스가 브라우저 확장 프로그램보다 더 많이 법니다."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "토큰 에어드롭(미정)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "확장 프로그램은 작동하지만 완성도가 낮습니다. Black Box 하드웨어가 발표되었습니다. 나중에 다시 확인하십시오."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "확장 프로그램은 포인트를 적립합니다. 2026년 10월까지 노드 운영자에 대한 토큰 분배는 확정되지 않았습니다."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "토큰이 출시되고 전환 비율이 발표되기 전까지 포인트에는 확정된 가치가 없습니다."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot은 Dawn을 실행하지 않습니다. 제공업체의 자체 브라우저 확장 프로그램을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network는 탈중앙화 VPN 및 web3 인프라 프로젝트입니다. 주로 독자적인 Deeper Connect 하드웨어 기기가 필요합니다. Moken은 관련 채굴/스테이킹 플랫폼입니다. 소프트웨어만으로는 사용할 수 없습니다.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "탈중앙화 VPN - 독자 하드웨어 기기 필요"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Deeper Connect 하드웨어($200-500)가 필요합니다. 채굴/스테이킹용 Moken 플랫폼이 있습니다. 소프트웨어만으로는 사용할 수 없습니다."
