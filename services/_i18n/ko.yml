  text: "ProxyLite는 인증된 기관과 대역폭을 공유하여 인터넷 트래픽으로 수익을 냅니다. 가정용과 VPS/데이터 센터 연결 모두에서 작동합니다. 대시보드의 사용자 ID만 있으면 되는 간단한 설정입니다. 평생 15%라는 넉넉한 추천 수수료를 제공합니다.\n"
