  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "예. 구매자가 사용자의 연결로 트래픽을 보냅니다 — 바로 그것이 판매되는 상품입니다."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "사용자 머신에서 생성된 지갑 주소와 중계한 트래픽 양입니다."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "실제로 있으며, 가정용 연결에 그대로 해당됩니다. 모르는 구매자의 프록시 트래픽이 사용자의 IP로 나가므로 남용 신고가 사용자에게 옵니다. 이 카탈로그에는 서비스를 데이터 센터 주소로 제한하는 것이 없고, 가정용 IP가 더 많이 벌기 때문에 여기서는 동기가 잘못된 방향을 가리킵니다: 집에서 실행하기 전에 ISP 약관을 읽어 보십시오."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "알 수 없음 - 제공업체는 계정당 또는 IP당 기기 제한을 공개하지 않으며, 카탈로그에도 명시되어 있지 않습니다."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "지급은 Tempo Chain의 USDC로, 본인이 키를 가진 EVM 주소라면 어디로든 이루어집니다."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "사용자의 연결이 마켓플레이스 구매자에게 SOCKS5 프록시로 판매되며, 구매자를 어떻게 확인하는지에 대한 설명은 찾지 못했습니다."
  source: "2dec55ca610f"
