  text: "채굴 보상은 DPR로 지급되며, 천천히 오르거나 DPR을 스테이킹해야 오르는 신용 점수에 따라 달라집니다."
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot은 Deeper Network를 실행하지 않습니다. 제공업체의 자체 라우터 하드웨어를 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "b1ba1636070f"
earnapp.description:
  text: "Bright Data의 EarnApp을 사용하면 사용하지 않는 대역폭을 판매하여 패시브 인컴을 얻을 수 있습니다. Bright Data는 세계 최대의 프록시 네트워크로, Fortune 500 기업의 데이터 수집을 지원합니다. CashPilot은 자체 이미지로 실행하며, 이 이미지는 첫 시작 시 Bright Data의 CDN에서 고정된 EarnApp 빌드를 내려받아 sha256을 확인한 뒤 UUID만으로 라이트 모드에서 실행합니다.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "대역폭 공유 - Bright Data 운영"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "노드 UUID"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "EarnApp 노드 ID입니다: 'earnapp showid'가 출력하는 형식대로 sdk-node- 뒤에 소문자 16진수 32자가 붙습니다. 배포한 뒤 EarnApp에 로그인한 상태에서 https://earnapp.com/r/ 뒤에 이 UUID를 붙인 주소를 한 번 열어 연결하십시오. 연결되지 않은 노드도 수익을 내지만 잔액에는 아무것도 들어오지 않습니다"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp이 서버에 계속 연결하지 못하고 재시작하고 있어 거의 또는 전혀 벌지 못합니다. 이 사본을 재시작하십시오. 계속 발생하면 이 머신의 인터넷 연결을 확인하십시오."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "EarnApp에 로그인한 상태에서 이 링크를 열어 노드를 계정에 추가하십시오. 추가하기 전까지 노드는 수익을 내지만 잔액에는 아무것도 들어오지 않습니다."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "위치에 따라 크게 달라집니다. 미국/EU IP가 가장 많이 법니다. 수익은 사용된 대역폭에 비례합니다."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "요청 시(자동 교환 가능: PayPal 최소 $10, Wise 최소 $10, Amazon 최소 $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "자동 교환을 한 번 켜 두면 잔액이 지급 방법의 최소 금액에 도달할 때마다 EarnApp이 알아서 지급합니다: PayPal $10, Wise $10, Amazon $50. PayPal 지급은 Bright Data Ltd.에서 보냅니다. 2026년 10월에 받은 PayPal 지급은 교환한 잔액보다 약 2% 적었습니다."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "잔액은 EarnApp이 보유하며, Amazon/Wise/PayPal로 교환합니다."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "<a href='https://earnapp.com' target='_blank'>earnapp.com</a>에 로그인하고 F12 → Application → Cookies에서 <b>oauth-refresh-token</b> 값을 복사하십시오."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "추천한 사용자 수익의 10%, 평생, 그들의 수익과 별도로 지급"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "EarnApp 고객센터에 따르면 Docker 컨테이너, 가상 머신, 호스팅 서비스 또는 홈 서버에 설치하는 것은 엄격히 금지되어 있는데, CashPilot은 바로 그렇게 실행합니다."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "같은 도움말 문서에 따르면 그렇게 실행하는 것이 발견된 계정은 통지 없이 해지되고 대기 중인 지급이 취소됩니다."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "저희의 PayPal 지급은 2026년 10월에 교환한 잔액보다 약 2% 적게 도착했습니다."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "PayPal과 Wise는 최소 $10이며, 자동 교환으로 알아서 지급됩니다."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp은 Bright Data 소속이며, PayPal 지급은 실명 회사인 Bright Data Ltd.에서 보냅니다."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm은 인터넷 대역폭을 공유하면 보상을 줍니다. 수익 수집기는 Supabase를 통한 이메일/비밀번호 인증을 사용합니다. 가벼운 Docker 이미지로 간단하게 배포할 수 있습니다(Docker 클라이언트는 별도의 UUID 토큰을 사용).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "대역폭 공유 - 이메일/비밀번호 인증, 가벼운 클라이언트"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "API 키"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "<a href=\"https://app.earn.fm\">app.earn.fm</a>에 로그인 → 프로필 아이콘(오른쪽 위) 클릭 → Account Settings → API Key 복사(UUID 형식)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "비교적 새로운 플랫폼입니다. 수익은 위치와 사용 가능한 대역폭에 따라 다릅니다."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "최소 $15. 방법: BEP20 또는 Polygon의 USDT(수수료 $1), TRC20(수수료 $3), PayPal, $15부터 Amazon 또는 Starbucks 기프트 카드, 또는 $1,000부터 송금 수수료를 차감한 은행 송금. 첫 지급 전에 청구 프로필(법적 이름과 주소)을 작성해야 하며, 이는 지급 영수증에 사용됩니다."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "잔액은 Earn.fm이 보유하며, 요청 시 출금합니다."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Earn.fm 계정 이메일과 비밀번호를 사용하십시오(<a href='https://app.earn.fm' target='_blank'>app.earn.fm</a> 로그인과 동일)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "추천한 사용자 수익의 10%, 평생"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "$5 시작 잔액"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "최소 $15, USDT 수수료 $1~$3, 은행 송금은 $1,000부터만 가능합니다."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "첫 지급 전에 법적 이름과 주소가 포함된 청구 프로필을 작성해야 합니다."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "2025년 리뷰어들은 이메일과 Discord 지원이 응답하지 않는다고 보고합니다. Trustpilot에 따르면 Earn.fm은 부정적인 리뷰에 답하지 않았습니다."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Earn.fm은 자체 Docker 이미지 earnfm/earnfm-client를 공개합니다."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher는 자동 서프바로 웹사이트를 방문하여 크레딧을 얻는 트래픽 교환 플랫폼입니다. 브라우저 확장 프로그램/애드온으로 실행됩니다. 전통적인 대역폭 공유 서비스가 아니며 — 웹사이트를 자동으로 탐색하여 트래픽을 만들어 냅니다.\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "트래픽 교환 서프바 - 브라우저 확장 프로그램"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "수익은 EUR로 전환할 수 있는 BTP 포인트입니다. 브라우저 확장 프로그램 전용입니다."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "PayPal 또는 은행 송금으로 유로 지급."
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "CashPilot은 eBesucher를 실행하지 않습니다. 브라우저 확장 프로그램이므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "2유로부터 PayPal 또는 SEPA로, 최소 매주, 수수료 없이 지급합니다."
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "eBesucher는 2002년부터 운영되고 있습니다."
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "사이트 고지(Impressum)에 운영사 TurboAd GmbH가 명시되어 있으며, Berlin-Charlottenburg에 등록되어 있습니다(HRB 160730 B)."
  source: "84cbddd4330b"
flux.description:
  text: "Flux는 전 세계에 분산된 컴퓨팅 인프라입니다. 노드 운영자는 FLUX 토큰을 스테이킹하고 서버 자원을 제공합니다. 세 가지 등급이 있습니다: Cumulus(1,000 FLUX), Nimbus(12,500 FLUX), Stratus(40,000 FLUX). 공식 Docker 이미지가 있습니다.\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "탈중앙화 컴퓨팅 - FLUX 토큰 스테이킹 필요"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "1,000+ FLUX 스테이킹이 필요합니다(가격에 따라 ~$50-500). 상위 등급은 담보가 더 많이 필요하지만 더 많이 법니다."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "블록 보상"
  source: "590433237f8a"
flux.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "가장 작은 노드 등급도 1,000 FLUX를 담보로 예치해야 합니다."
  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "블록 보상은 매년 10%씩 줄어들며, 2026년의 한 가이드는 소형 등급 보상이 달러 기준으로 약하다고 평가했습니다."
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "CashPilot은 Flux를 실행하지 않습니다. 제공업체의 자체 노드 소프트웨어를 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "Flux 데몬은 MIT 라이선스의 오픈 소스입니다."
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network는 CPU와 GPU 자원을 공유하고 GLM 토큰을 받는 탈중앙화 컴퓨팅 마켓플레이스입니다. 제공자는 샌드박스 환경에서 작업 실행을 관리하는 Yagna 에이전트를 실행합니다. 가장 오래된 탈중앙화 컴퓨팅 프로젝트 중 하나입니다(2016년 설립). CPU 작업, GPU 렌더링, 범용 컴퓨팅을 지원합니다. 지급은 Polygon L2로 이루어집니다.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "탈중앙화 컴퓨팅 마켓플레이스 - Yagna 에이전트로 GLM 토큰 적립"
  source: "88f817c25848"
golem.earnings.notes:
  text: "수익은 하드웨어, 가격, 작업 수요에 따라 다릅니다. CPU 전용 노드는 덜 법니다. GPU 노드는 더 많이 벌지만 NVIDIA가 필요합니다. Docker 이미지가 아닌 Yagna 제공자 에이전트를 실행합니다. 지급은 Polygon에서 GLM 토큰으로 이루어집니다."
  source: "07287d437d51"
golem.payment.frequency:
  text: "작업 완료 시마다"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "GLM 토큰을 적립합니다. 제공자 설정에서 지급 지갑을 설정하십시오."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot은 Golem을 실행하지 않습니다. 제공자 에이전트를 직접 설치하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. Golem은 자체 Docker 이미지로 제공자를 실행하는 방법을 문서로 제공합니다."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "제공자 에이전트 yagna는 GPL-3.0의 오픈 소스입니다."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "계정이 없습니다. 제공자 설정에서 지급 지갑만 설정합니다."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "네트워크는 약 10년 동안 운영되었습니다."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Golem의 개인정보 처리방침에 운영사 Golem Factory GmbH(스위스 Zug)가 명시되어 있습니다."
  source: "bae79b651923"
grass.description:
  text: "Grass는 사용하지 않는 대역폭을 AI 학습 데이터용으로 판매할 수 있는 탈중앙화 네트워크입니다. 브라우저 확장 프로그램과 데스크톱 앱으로 작동하며, 웹 스크래핑 요청을 사용자의 연결로 보내 구조화된 데이터 세트를 만듭니다. 사용자가 850만 명 이상으로, 가장 큰 DePIN 대역폭 네트워크 중 하나입니다. Solana 블록체인에서 GRASS 토큰을 적립합니다.\n"
  source: "046951d812f9"
grass.short_description:
  text: "AI 데이터용 DePIN 대역폭 공유 - GRASS 토큰 적립"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "액세스 토큰"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "<a href=\"https://app.grass.io\">app.grass.io</a>에 로그인하고 F12 → Application → Local Storage → <code>https://app.grass.io</code> 클릭 → <code>token</code> 값 복사"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "에어드롭을 통해 GRASS 토큰으로 전환할 수 있는 Grass Points를 적립합니다. 실제 USD 가치는 토큰 가격에 따라 달라집니다. 브라우저 확장 프로그램이나 데스크톱 앱이 필요합니다."
  source: "da61137319f8"
grass.payment.frequency:
  text: "에포크 단위 에어드롭"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "보상은 Grass 대시보드에서 수령하는 정기 분배로 지급됩니다. Stage 2 분배(2024년 10월부터 2026년 6월까지의 활동)는 USDC로 지급됩니다. 늦어도 2027년 1월 22일까지 app.grass.io/dashboard에서 수령하십시오. 모든 할당이 먼저 수령되면 더 일찍 마감될 수 있습니다. 수령하지 않은 보상은 Grass가 가져갑니다."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "포인트가 적립되며, GRASS는 정기 에어드롭 기간에 Grass 대시보드에서 수령합니다."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "<a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>에 로그인하고 F12 → Application → Local Storage에서 <b>accessToken</b> 값을 복사하십시오."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "직접 추천한 사용자의 가동 시간 포인트 20%, 2단계 10%, 3단계 5%"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Grass Stage 2 USDC를 수령하십시오"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "2027년 1월 22일이 지나도록 수령하지 않은 Stage 2 할당은 모두 Grass가 가져가며, 모든 할당이 수령되면 기간이 더 일찍 끝날 수 있습니다."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Stage 2에서 사용한 계정으로 app.grass.io에 로그인하고 Grass Wallet을 활성화한 뒤 Allocation 탭을 열어 확인하십시오. 수령은 app.grass.io에서만 하십시오. Stage 2 포인트가 없습니까? 해당 없음을 선택하십시오."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "보상은 에어드롭 시즌을 통해서만 지급됩니다. 오래 운영한 노드 운영자들은 시즌 2 예상치가 몇 달러에서 수십 달러 초반 수준이라고 보고했습니다."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "2027년 1월 22일이 지나도록 수령하지 않은 시즌 2 보상은 영구히 사라집니다."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "첫 에어드롭은 200만 명이 넘는 사용자에게 나뉘어 포인트당 보상이 적다는 반발을 샀습니다."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot은 Grass를 실행하지 않습니다. 제공업체의 자체 앱이나 확장 프로그램을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "첫 에어드롭은 수령 주소가 거의 150만 개에 달했습니다."
  source: "a4c55e10affa"
helium.description:
  text: "Helium은 자리 잡은 탈중앙화 무선 네트워크입니다. 원래 LoRaWAN 핫스팟이었으며 지금은 5G로 확장되었습니다. 전용 하드웨어($500+)가 필요합니다. HNT/MOBILE 토큰을 적립합니다. 수익률이 크게 떨어졌습니다 - 보통 $4-8/월입니다.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "탈중앙화 무선 네트워크 - 하드웨어 필요, HNT 토큰"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "$500+ 하드웨어 구매가 필요합니다. 수익률이 크게 떨어졌습니다. 신규 운영자는 승인 절차를 거칩니다."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "에포크 단위"
  source: "75743e03bad2"
helium.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149로 2026년 7월 6일 Proof-of-Coverage 보상이 종료되었습니다. IoT 핫스팟은 이제 전송한 데이터에 대해서만 벌며, 114,000개가 넘는 핫스팟이 데이터를 전혀 전송하지 않았습니다."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Helium의 보상 모델은 투표로 여러 번 바뀌었고, CEO가 물러났으며, HNT는 약 96% 하락했습니다."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot은 Helium을 실행하지 않습니다. 제공업체의 자체 핫스팟 하드웨어를 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "핫스팟 게이트웨이 소프트웨어는 Apache-2.0 라이선스의 오픈 소스입니다."
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "HeroMiners가 공개 지급 주소에 대해 보유하고 있는 미지급 Kaspa 잔액을 추적합니다. 직접 Kaspa 채굴기를 실행하고 풀을 가리키도록 설정하십시오. CashPilot은 풀 잔액을 읽고, 잔액이 줄어들면 지급을 확인하도록 요청합니다.\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
  text: "Kaspa 채굴 풀, 지급 주소로 추적"
  source: "92c5784dcf30"
herominers-kas.payment.minimum_payout:
  text: "1 KAS (조정 가능)"
  source: "d33ca7065ff9"
herominers-kas.payment.frequency:
  text: "풀이 매시간 지급 기준액을 확인합니다"
  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "선택한 기준액에 도달하면 HeroMiners가 자동으로 주소에 지급합니다. 최저 기준액은 1 KAS입니다.\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "잔액은 HeroMiners에 누적됩니다. CashPilot에서 지급을 확인하기 전에 지갑에서 받은 금액을 확인하십시오.\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "채굴기가 HeroMiners에서 사용하는 전체 공개 Kaspa 지급 주소를 입력하십시오. <b>kaspa:</b> 접두사를 포함하고 워커 이름은 빼십시오.\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "HeroMiners를 가리키는 Kaspa 채굴기가 필요합니다"
  source: "898e36e7a701"
herominers-kas.disclosure.sells:
  text: "컴퓨팅"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "아니요. 채굴기가 채굴 작업을 풀로 보냅니다."
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "풀의 공개 통계에 각 지급 주소와 그 채굴 활동이 표시됩니다."
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "풀은 계정 대신 지급 주소를 사용합니다."
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "풀은 0.9% 수수료를 부과하며 기준액에 도달할 때까지 지급을 보류합니다."
  source: "7eb2950589fa"
honeygain.description:
  text: "사용하지 않는 인터넷 대역폭을 공유하고 패시브 인컴을 얻으십시오. Honeygain은 웹 인텔리전스, 콘텐츠 전송, 시장 조사 트래픽을 사용자의 연결로 보냅니다. 1,200만 명 이상의 사용자와 100만 건이 넘는 지급 완료 실적을 가진, 가장 자리 잡은 대역폭 공유 플랫폼 중 하나입니다.\n"
  source: "b219f969ba34"
honeygain.short_description:
  text: "대역폭 공유 - 가장 자리 잡은 플랫폼"
  source: "c0542c471f29"
honeygain.docker.env.HONEYGAIN_EMAIL.label:
  text: "이메일"
  source: "969ccbd3cf63"
honeygain.docker.env.HONEYGAIN_PASSWORD.label:
  text: "비밀번호"
  source: "e7cf3ef4f17c"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.label:
  text: "기기 이름"
  source: "155106be1173"
honeygain.docker.env.HONEYGAIN_EMAIL.description:
  text: "Honeygain 계정 이메일"
  source: "482869cea18f"
honeygain.docker.env.HONEYGAIN_PASSWORD.description:
  text: "Honeygain 계정 비밀번호"
  source: "f3ba1584b384"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.description:
  text: "Honeygain 대시보드에 표시되는 이름"
  source: "a3ba173cae35"
honeygain.earnings.notes:
  text: "위치에 따라 다릅니다. 미국/EU IP가 더 많이 법니다. 계정당 최대 10대의 기기."
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "최소 $20(20,000 크레딧). 두 가지 방법이 있습니다: Tipalti를 통한 PayPal(수수료 약 15%), 또는 수수료 없이 JumpTask 지갑으로 지급되는 JumpTask 크레딧. 요청하려면 이메일로 받은 6자리 코드가 필요합니다. 첫 PayPal 지급은 Tipalti가 이메일로 보내는 링크에서 등록하기 전까지 \"waiting for details\" 상태로 남습니다. 그 링크는 한 번만 작동하므로, 한 번에 끝낼 수 있고 휴대폰을 곁에 둘 수 있을 때 여십시오. 비밀번호를 설정하면 Tipalti가 SMS로 휴대폰 번호를 확인하게 하고(코드는 몇 분 안에 만료됨), 이어서 이름, 주소, 국가, 생년월일과 PayPal 주소를 묻습니다. Tipalti는 지급 건당 $2.02를 부과합니다. 1.9-3% 환전 수수료를 피하려면 USD를 선택하십시오. 지급은 영업일 기준 2일 이내에 이루어집니다. 잔액은 요청하는 즉시 계정에서 빠져나가며, 지급이 Tipalti를 기다리는 동안에도 마찬가지입니다. 이후 Tipalti에 로그인할 때마다 새 SMS 코드가 발송되며, 기기를 30일 동안 기억하는 옵션을 체크하면 그렇지 않습니다. 2026년 10월에 Tipalti는 스페인의 수취인에게 세금 양식을 요구하지 않았습니다."
  source: "553463d96535"
honeygain.payout.notes:
  text: "잔액은 Honeygain이 보유하며, 요청 시 출금합니다."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Honeygain 계정 이메일과 비밀번호를 사용하십시오(<a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a>과 동일)."
  source: "fd0be22aeb14"
honeygain.referral.bonus.referrer:
  text: "Honeygain 모드에서 추천한 친구 수익의 최대 25%"
  source: "30385153a66b"
honeygain.referral.bonus.referee:
  text: "이 링크로 가입 시 $3 보너스"
  source: "9ee5d2215305"
honeygain.obligations.withdraw-before-24-month-write-off.title:
  text: "Honeygain 잔액을 출금하십시오"
  source: "0868662c5a12"
honeygain.obligations.keep-active-6-months.title:
  text: "Honeygain 기기의 공유를 유지하거나, 지급을 요청하십시오"
  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "수익은 최소 금액 $20에 도달한 뒤 24개월 동안 유효합니다. 그 후 Honeygain은 지급되지 않은 금액을 소멸시킬 수 있습니다."
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
  text: "앱을 6개월 넘게 사용하지 않으면 Honeygain은 미지급 잔액이 $20 미만이라도 만료된 것으로 처리합니다."
  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "기기의 공유를 유지하거나 지급을 요청하십시오. JumpTask 모드에서는 잔액이 변하지 않는 것이 정상이므로 해당 없음을 선택하십시오."
  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "약관에 따르면 Honeygain은 $20 기준액에 도달했으나 24개월 안에 지급되지 않은 수익을 소멸시킬 수 있고, 6개월 동안 사용하지 않은 수익을 만료된 것으로 처리할 수 있습니다."
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "최소 금액은 $20이며, PayPal 지급은 건당 $2.02를 부과하는 Tipalti를 거칩니다."
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "약관에 따르면 Honeygain은 계정을 정지하고, 허위로 쌓였다고 판단한 수익을 보류하거나 소멸시킬 수 있습니다."
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "첫 PayPal 지급 전에 Tipalti가 SMS로 휴대폰 번호를 확인하고 이름, 주소, 생년월일을 입력하게 합니다."
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "약관에 따르면 기업 고객이 트래픽을 사용해 공개된 웹 데이터를 수집하지만, 어떤 고객인지는 밝히지 않으며, 어떤 고객이 사용자의 연결을 쓰는지 알 수 없습니다."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "수익이 낮다는 리뷰에 대한 Honeygain의 답변에 따르면 수익은 네트워크 수요와 위치에 따라 달라집니다. 리뷰어들은 최소 금액 $20에 도달하는 데 매우 오래 걸린다고 보고합니다."
  source: "634fb331e65b"
honeygain.rating.pros.0.text:
  text: "Honeygain은 자체 Docker 이미지 honeygain/honeygain을 공개합니다."
  source: "ea44bd3c855c"
honeygain.rating.pros.1.text:
  text: "약관에 운영사 Honeygain UAB가 명시되어 있으며, 리투아니아 Vilnius에 등록되어 있습니다."
  source: "579a169fcf35"
honeygain.rating.pros.2.text:
  text: "Honeygain의 보도 자료 페이지에 따르면 2019년에 설립되었습니다."
  source: "a3bfbdb33f54"
ionet.description:
  text: "io.net은 AI/ML 작업을 위한 탈중앙화 GPU 네트워크입니다. 일반 사용자와 데이터 센터의 유휴 GPU를 모읍니다. 의미 있는 수익을 내려면 VRAM 8GB+의 NVIDIA GPU가 필요합니다. 컨테이너 기반 배포를 지원합니다.\n"
  source: "5d017f77f0ac"
ionet.short_description:
  text: "AI용 탈중앙화 GPU 네트워크 - NVIDIA GPU 필요"
  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "VRAM 8GB+의 NVIDIA GPU가 필요합니다. RTX 4090으로 $500-1000/월을 번다는 주장이 있습니다(실제로는 더 낮을 가능성이 큼)."
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "에포크 단위"
  source: "75743e03bad2"
ionet.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "공급자 보상은 유료 작업과 관계없이 토큰 발행분에서 지급되었으며, GPU 소유자들은 대부분의 시간 동안 GPU가 놀고 있다고 보고합니다."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "보상은 IO 토큰으로 지급되며, 지급 모델은 2026년에 달러 연동 방식으로 바뀌었습니다."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "2024년 4월 유출된 인증 토큰을 통해 약 180만 개의 가짜 GPU가 참여를 시도했으며, 이후 CEO가 토큰 출시 전에 물러났습니다."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "CashPilot은 io.net을 실행하지 않습니다. 제공업체의 자체 워커 소프트웨어를 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "1cac289c99ad"
iproyal.description:
  text: "IPRoyal Pawns를 사용하면 사용하지 않는 대역폭을 공유하여 돈을 벌 수 있습니다. IPRoyal은 자리 잡은 프록시 제공업체이며, Pawns는 가정용 대역폭 공유 부문입니다. CLI Docker 이미지는 명령줄 플래그로 자격 증명을 받습니다. 추천 링크로 가입한 신규 사용자는 처음 세 번의 지급에서 각각 $1, 최대 $3을 받습니다. 각 지급은 위치에 따라 정해지는 1~3주의 기간 안에 이루어져야 합니다. 기간은 가입 시 시작되고 지급할 때마다 다시 시작됩니다. 기간이 먼저 끝나면 남은 보너스는 사라집니다.\n"
  source: "b12878d5917a"
iproyal.short_description:
  text: "대역폭 공유 - 첫 지급 시 최대 $3 보너스"
