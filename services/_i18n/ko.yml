proxyrack.description:
  text: "ProxyRack의 Peer 프로그램을 사용하면 프록시 네트워크의 일부로 대역폭을 공유하여 돈을 벌 수 있습니다. 각 기기에는 고유한 64자 16진수 UUID가 필요하며, 기기를 자동 등록하려면 선택적으로 API 키가 필요합니다. 가정용과 VPS/데이터 센터 연결 모두에서 작동합니다. 대시보드가 Cloudflare 뒤에 있어 브라우저에서 API 키를 직접 가져와야 할 수 있습니다.\n"
