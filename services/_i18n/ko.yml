# Korean translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/ko.yml --restamp '<key>'
2miners-etc.description:
  text: "2Miners가 공개 ETC 지급 주소에 대해 보유하고 있는 미지급 Ethereum Classic 잔액을 추적합니다. 직접 채굴기를 실행하고 풀을 가리키도록 설정하십시오. CashPilot은 잔액을 읽고, 잔액이 줄어들면 지급을 확인하도록 요청합니다.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Ethereum Classic 채굴 풀, 지급 주소로 추적"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (조정 가능)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "풀이 2시간마다 지급 기준액을 확인합니다"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "선택한 기준액에 도달하면 2Miners가 자동으로 주소에 지급합니다. ETC 지급의 최저 기준액은 0.1 ETC입니다.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "미지급 잔액은 2Miners에 누적됩니다. 지갑 잔액은 Ethereum Classic에서 별도로 읽습니다. CashPilot에서 지급을 확인하기 전에 지갑에서 받은 금액을 확인하십시오.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "채굴기가 2Miners에서 사용하는 공개 Ethereum Classic 지급 주소를 입력하십시오. 주소는 <b>0x</b>로 시작합니다. 워커 이름은 넣지 마십시오.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "2Miners를 가리키는 ETCHash 채굴기가 필요합니다"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "컴퓨팅"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "아니요. 채굴기가 채굴 작업을 풀로 보냅니다."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "풀은 지급 주소, 선택한 워커 이름, 채굴기의 IP 주소를 사용합니다."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "누구나 지급 주소로 통계를 볼 수 있습니다. 기준액을 변경하려면 풀이 워커 IP 확인을 요구합니다."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "풀은 1% 수수료를 부과하며 기준액에 도달할 때까지 지급을 보류합니다."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol(이전 이름 ATOR)은 탈중앙화 어니언 라우팅 프라이버시 네트워크입니다. 노드 운영자는 릴레이 노드를 실행하고 제공한 대역폭에 대해 ANYONE 토큰을 받습니다. \"보상이 있는 Tor\"라고 생각하면 됩니다. CashPilot은 프로젝트의 서명된 Debian 패키지로 빌드한 자체 이미지로 amd64와 arm64에서 실행합니다. 설정은 컨테이너에 마운트된 anonrc 파일로 합니다(Nickname, ContactInfo, ORPort 등). 릴레이는 100 ANYONE이 최소 180일 동안 예치되기 전에는 아무것도 벌지 못하며, 보상은 지갑에서 서명하여 수령합니다. 릴레이는 또한 네트워크의 릴레이 디렉터리에 공개 IP를 게시하므로, 가정용 대역폭 앱이 보상하는 IP 평판이 나빠질 수 있습니다.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "탈중앙화 어니언 라우팅 - 보상이 있는 Tor 릴레이 노드"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "릴레이의 ed25519 신원 키입니다. 이를 삭제하면 릴레이의 평판이 사라지고 수익 기록이 0부터 다시 시작됩니다."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "릴레이마다 100 ANYONE을 최소 180일 동안 예치하고 지갑에서 서명한 보상 수령이 있어야만 지급됩니다. 예치가 없으면 릴레이는 아무것도 벌지 못합니다. 예치가 있으면 수익은 제공한 대역폭과 가동 시간에 따라 달라집니다."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "에포크 단위"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "anonrc의 ContactInfo에 '@anon:0x...' 접두사를 붙여 설정합니다."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "쉼표로 구분한 릴레이 핑거프린트입니다. 온라인 대시보드에는 표시되지 않습니다. CashPilot이 실행하는 릴레이는 그 릴레이를 실행하는 호스트에서 <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b>를 실행하십시오. 하드웨어 릴레이는 <b>http://relayup.local</b>에서 Relay Control Panel을 열고 Home 페이지의 Fingerprint를 확인하십시오.\n"
  source: "ffa5be0d4953"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "대역폭, Anyone 네트워크(Tor 포크)의 릴레이로 제공합니다."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "예. 다른 사람의 트래픽을 중계합니다. 사용자의 IP가 마지막 홉이 되는지는 릴레이가 출구로 설정되었는지에 따라 다릅니다."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "릴레이의 공개 신원 키, IP와 포트, 가동 시간 통계이며, 모두 설계상 네트워크 디렉터리에 게시됩니다. anonrc에 ContactInfo를 설정하면 그것도 게시되어 영구적으로 공개 색인됩니다. 보통 이메일 주소이므로 공개하고 싶지 않다면 비워 두십시오."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "실제로 있습니다. 릴레이 트래픽은 사용자의 회선에서 나온 것으로 간주됩니다. 특히 출구 릴레이는 남용 신고를 받기 쉬우며, 많은 가정용 ISP가 이를 금지합니다."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "가입할 계정이 없으므로 계정별로 제한할 것도 없습니다. 그래도 수익을 얻으려면 릴레이마다 100 ANYONE을 최소 180일 동안 예치한 Ethereum 지갑이 필요하고, CashPilot이 보상을 읽으려면 릴레이 핑거프린트가 필요합니다. 프로젝트는 IP당 릴레이 제한을 공개하지 않으며, 카탈로그에도 명시되어 있지 않습니다."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "릴레이는 100 ANYONE이 최소 180일 동안 예치되지 않으면 아무것도 벌지 못하며, 보상을 수령할 때마다 지갑에서 서명해야 합니다."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "설계상 다른 사람의 트래픽을 중계하며, 그들이 누구인지 확인하지 않습니다. 출구 릴레이는 남용 신고를 받기 쉽습니다."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "릴레이의 신원, IP, 가동 시간이 네트워크 디렉터리에 게시되며, 설정한 ContactInfo는 영구적으로 공개됩니다."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "가입할 계정이 없습니다. 릴레이에는 신원 확인 없이 지갑만 있으면 됩니다."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "릴레이 소프트웨어는 Tor 라이선스로 공개된 Tor의 포크입니다."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot은 Anyone이 공개한 릴레이 소프트웨어로 자체 이미지를 빌드하며, 계정이 필요하지 않습니다."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping은 노드를 실행하면 보상을 주는 탈중앙화 네트워크 모니터링 플랫폼입니다. 노드는 Bitping의 고객을 위해 웹사이트 모니터링, 지연 시간 테스트, 네트워크 품질 점검을 수행합니다. 가정용과 VPS 연결 모두에서 작동합니다. Docker 이미지는 첫 시작 시 BITPING_EMAIL과 BITPING_PASSWORD 환경 변수로 로그인하고(자체 로그에 \"Attempting login with environment variables\"로 표시), 이후 세션을 볼륨 마운트에 저장하므로 재시작해도 다시 인증하지 않습니다.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "대역폭 공유 - 탈중앙화 네트워크 모니터링, VPS에서 작동"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "이메일"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "비밀번호"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "Bitping 계정 이메일(<a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>과 같은 로그인)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Bitping 계정 비밀번호입니다. 노드 세션을 만들 때 한 번 사용하며, 이후 세션은 데이터 볼륨에 유지됩니다."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "수익은 네트워크 품질과 사용자 위치에서의 모니터링 수요에 따라 달라집니다. VPS 노드도 허용됩니다."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
bitping.cashout.notes:
  text: "노드 수익은 nodes.bitping.com에 표시되며, app.bitping.com은 API 고객용 대시보드입니다. 출금은 SOL로만 가능합니다. 미지급 잔액이 $0.05를 넘으면 요청에 Solana 주소를 입력하며, 24시간 이내에 처리됩니다. 새 Solana 지갑이나 빈 Solana 지갑에는 네트워크의 렌트 최소 금액 때문에 먼저 약 0.001 SOL이 있어야 합니다."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "현재는 Solana만 지원하며, 주소는 저장되지 않고 출금할 때마다 입력합니다."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Bitping 계정 이메일과 비밀번호를 사용하십시오(<a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>과 동일)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Bitping 잔액을 출금하십시오"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping은 12개월 넘게 수령하지 않은 수익을 이메일로 30일 전에 통지한 뒤 몰수할 수 있습니다."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "nodes.bitping.com에서 SOL 출금을 요청하고 요청에 Solana 주소를 입력하십시오."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "출금은 Solana(SOL)로 지급되며, 요청할 때마다 입력하는 주소로 보내집니다."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Bitping 도움말에 따르면 새 Solana 지갑이나 빈 Solana 지갑으로의 출금은 그 지갑에 직접 SOL을 조금 넣기 전까지 실패할 수 있습니다."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Bitping 도움말에 따르면 서버와 Docker 컨테이너를 지원합니다."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "출금에는 요청에 입력하는 Solana 주소만 있으면 됩니다."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit은 PayPal과 Stripe로 지급하는 대역폭 공유 서비스입니다. 공식 Docker 이미지는 없으며, Windows 데스크톱 앱과 Android 앱이 클라이언트입니다. 서비스는 bytebenefit.io에 있습니다 -- 이전 도메인 bytebenefit.com은 포기되어 도메인 마켓에 파킹되어 있으며, 그래서 한때 여기에서 서비스 종료로 표시되었습니다.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "대역폭 공유 - PayPal/Stripe 지급, 데스크톱/Android 앱"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Docker 이미지가 없습니다. Windows 데스크톱 앱과 Android 앱만 있습니다."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "추천한 사용자의 트래픽 수익 20%"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "$1(10,000 Coins) 환영 보너스"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "앱의 Google Play 페이지에 따르면 사용자의 트래픽은 Infatica 고객의 웹 인텔리전스 요청에 쓰이지만, 그 고객이 누구인지, 어떻게 확인하는지는 밝히지 않습니다."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Android 앱은 17개월 만인 2026년 4월에 Google Play에서 사라졌습니다."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot은 ByteBenefit을 실행하지 않습니다. 제공업체의 자체 앱을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir를 사용하면 사용하지 않는 인터넷 대역폭을 공유하여 패시브 인컴을 얻을 수 있습니다. Windows와 Android만 지원합니다 — 공식 FAQ에 따르면 Linux나 Docker 클라이언트는 계획이 없고, iOS는 지원되지 않으며, macOS 버전도 제공되지 않습니다. 수익은 위치에 따라 크게 달라집니다. 추적용 웹 대시보드는 dash.bytelixir.com에 있습니다. Docker 이미지가 없습니다.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "대역폭 공유 - Windows + Android 전용"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "세션 쿠키"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Remember Web 쿠키"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "XSRF 토큰"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "<a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>에 로그인하고 F12 → Application → 왼쪽 사이드바에서 <b>Cookies</b> 펼치기 → 하위 항목 <code>https://dash.bytelixir.com</code> 클릭 → 오른쪽 쿠키 목록에서 <code>bytelixir_session</code> 찾기 → Value 복사(eyJ로 시작하는 긴 JWT)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "같은 위치(Cookies → <code>https://dash.bytelixir.com</code>) → 이름이 <code>remember_web_...</code>인 쿠키 찾기 → Value 복사(선택 사항, 세션 유지 기간을 늘림)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
