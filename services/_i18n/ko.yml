  source: "a3a68b67f1aa"
iproyal.docker.health_signals.1.means:
  text: "Pawns가 이 IP 주소에서 다른 활성 기기를 감지했으며 IP당 한 대에만 지급하므로, 이 사본은 실행되지만 아무것도 공유하지 않고 아무것도 벌지 못합니다. 다른 머신, PC 또는 휴대폰 등 이 IP에서 실행 중인 다른 Pawns 앱을 중지하십시오. 그런 앱이 없다면 Pawns가 이전 기기를 제거할 때까지 기다리거나, Pawns 지원팀에 해제를 요청하십시오."
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "수익은 위치와 대역폭 사용량에 따라 달라집니다. 미국/EU 가정용 IP가 더 많이 법니다."
  source: "424261bf08d4"
iproyal.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "최소 $5. 먼저 국가를 선택하십시오. 지급 방법은 국가에 따라 다릅니다. 스페인 기준(2026년 10월): PayPal 4%(최소 수수료 $0.25), Tremendous를 통해 지급되며 이름과 PayPal 주소를 입력하는 링크를 이메일로 보냅니다. USDT(BEP20, ERC20, TRC20) 또는 USDC(BEP20, ERC20)는 네트워크 수수료 $1, Bitcoin은 최소 수수료 $2, 기프트 카드는 수수료가 없습니다. 첫 지급에는 휴대폰 번호의 일회성 SMS 확인이 필요합니다. Withdraw를 누르면 열리며, 번호는 국가 코드와 함께 입력합니다. 이후 모든 지급은 계정 이메일로 보낸 코드를 요구하며, 발송 전에 최대 72시간 동안 검토됩니다."
  source: "0430fae34eb5"
iproyal.payout.notes:
  text: "잔액은 IPRoyal Pawns가 보유하며, 요청 시 출금합니다."
  source: "e11da90d5216"
iproyal.collector.credential_hint:
  text: "IPRoyal Pawns 계정 이메일과 비밀번호를 사용하십시오(<a href='https://pawns.app' target='_blank'>pawns.app</a>과 동일)."
  source: "b9dcb3a01d17"
iproyal.referral.bonus.referrer:
  text: "추천한 사용자의 처음 세 번의 지급에서 각각 $1, 최대 $3. 각 지급이 1~3주 기간 안에 이루어진 경우"
  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "처음 세 번의 지급에서 각각 $1, 최대 $3. 1~3주 기간을 놓치면 나머지는 만료됩니다"
  source: "619d5960686c"
iproyal.rating.cons.0.text:
  text: "약관에 따르면 출금 조건을 남용하거나 여러 계정을 쓰면 사전 통지 없이 계정이 차단될 수 있으며, 그 경우 수익이 지급되지 않을 수 있습니다."
  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "약관에 따르면 Pawns는 트래픽 공유에 서버, VPN, 프록시 서비스를 허용하지 않으며, IP당 기기 한 대만 허용합니다."
  source: "449c1cdf793f"
iproyal.rating.cons.2.text:
  text: "PayPal은 Tremendous를 통해 4%(최소 $0.25)가 들며, 모든 지급은 최대 72시간 동안 검토됩니다."
  source: "56449f2db6ce"
iproyal.rating.cons.3.text:
  text: "첫 지급에는 휴대폰 번호의 SMS 확인이, 모든 지급에는 이메일로 받은 코드가 필요합니다."
  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "개인정보 처리방침에 운영사 Pawns.App Ltd(잉글랜드 및 웨일스 회사 번호 16043795)가 명시되어 있으며, Companies House에 따르면 2024년 10월 28일, 즉 3년이 채 안 된 시점에 설립되었습니다."
  source: "a7fcb7aea980"
iproyal.rating.cons.5.text:
  text: "약관에 따르면 Pawns와 그 기업 고객이 사용자의 기기를 통해 트래픽을 보내며, 어떤 고객이 사용하는지는 알 수 없습니다."
  source: "ca979ac10720"
iproyal.rating.pros.0.text:
  text: "최소 $5이며, 기프트 카드는 수수료가 없습니다."
  source: "0fa4f89bbd63"
kryptex-pearl.description:
  text: "NVIDIA GPU 한 장으로 KRig를 사용해 Pearl을 채굴합니다. Kryptex는 보상을 Bitcoin으로 전환하고, 출금을 요청할 때까지 잔액을 계정에 보관합니다."
  source: "4f7cb8fe1273"
kryptex-pearl.short_description:
  text: "NVIDIA GPU로 Pearl을 채굴하고 계정에 Bitcoin으로 적립"
  source: "b0398c2b2485"
kryptex-pearl.docker.env.KRYPTEX_EMAIL.label:
  text: "Kryptex 계정 이메일"
  source: "5859b93a0ff5"
kryptex-pearl.docker.env.WORKER_NAME.label:
  text: "워커 이름"
  source: "73f1a739a9a5"
kryptex-pearl.docker.env.KRYPTEX_EMAIL.description:
  text: "Kryptex 계정의 인증된 이메일입니다."
  source: "3809c99ec5ff"
kryptex-pearl.docker.env.WORKER_NAME.description:
  text: "Kryptex 계정에서 머신마다 서로 다른 이름을 지정하십시오."
  source: "277ed1b0adb3"
kryptex-pearl.docker.runtime_reason:
  text: "gVisor는 GPU를 이 서비스에 전달할 수 없습니다."
  source: "302a2b5c988f"
kryptex-pearl.payment.minimum_payout:
  text: "Lightning으로 0.00001 BTC(다른 방법은 다름)"
  source: "134616d8ae98"
kryptex-pearl.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
kryptex-pearl.cashout.notes:
  text: "Kryptex는 Pearl 보상을 BTC로 전환하여 계정에 잔액을 보관합니다. Kryptex에서 출금을 요청하십시오. 방법마다 최소 금액과 수수료가 다릅니다. Bitcoin Lightning의 최소 금액은 0.00001 BTC입니다."
  source: "0b64f906f7db"
kryptex-pearl.payout.notes:
  text: "출금할 때까지 Kryptex가 전환된 Bitcoin을 계정에 보관합니다."
  source: "662740464ed7"
kryptex-pearl.referral.bonus.referrer:
  text: "추천한 사용자로부터 Kryptex가 얻는 풀 수입의 20%"
  source: "de0f80ea1cd2"
kryptex-pearl.requirements.note:
  text: "Linux amd64, Volta(sm_70) 이상의 NVIDIA GPU, NVIDIA Container Toolkit"
  source: "0feb85dc1ef2"
kryptex-pearl.requirements.hosting_note:
  text: "이 머신은 호스팅 연결로 보고됩니다. 채굴하기 전에 제공업체의 약관을 확인하십시오. Hetzner Cloud를 포함한 일부 제공업체는 채굴을 금지합니다. 수익 추정치를 믿기 전에 실제 전기 요금을 확인하십시오."
  source: "8896f33e3cc8"
kryptex-pearl.mining.pool_fee_note:
  text: "KRig는 Kryptex Pool에서 채굴기 수수료를 0% 부과합니다. Kryptex는 별도로 Pearl PPS+ 풀 수수료 3%를 명시합니다. 출금 수수료는 방법에 따라 다릅니다."
  source: "f2e70f65b538"
kryptex-pearl.disclosure.sells:
  text: "컴퓨팅"
  source: "b04a12f6483e"
kryptex-pearl.disclosure.third_party_traffic:
  text: "아니요. KRig는 채굴 작업을 Kryptex Pool에 제출합니다."
  source: "c5718af09746"
kryptex-pearl.disclosure.data_collected:
  text: "Kryptex는 계정 이메일, 워커 이름, 해시레이트, IP 주소를 봅니다."
  source: "0a932e1163a6"
kryptex-pearl.disclosure.isp_risk:
  text: "일부 네트워크와 DNS 리졸버는 채굴 풀 연결을 차단합니다."
  source: "6e2ea365730d"
kryptex-pearl.disclosure.account_rules:
  text: "채굴하기 전에 Kryptex 계정 이메일을 인증하십시오."
  source: "1990183a5b00"
kryptex-pearl.rating.cons.0.text:
  text: "Kryptex는 비활성 계정을 6개월 후 정지하고 1년 후 삭제할 수 있습니다."
  source: "1a40d04b07ad"
kryptex-pearl.rating.cons.1.text:
  text: "출금 최소 금액과 수수료는 방법에 따라 다릅니다."
  source: "05d8f85527c7"
kryptex-pearl.rating.pros.0.text:
  text: "KRig의 라이선스는 릴리스를 내려받아 채굴 소프트웨어에서 실행하는 것을 허용합니다."
  source: "c710f405be6f"
kryptex-pearl.rating.pros.1.text:
  text: "KRig는 공개된 TLS 엔드포인트를 사용해 Pearl 셰어를 Kryptex Pool에 제출합니다."
  source: "fd21819f191a"
mysterium.description:
  text: "MystNodes(Mysterium Network)는 블록체인 기술 기반의 탈중앙화 VPN 및 프록시 네트워크입니다. 사용자에게 VPN, 프록시, 데이터 스크래핑 서비스를 제공하는 노드를 실행하여 MYST 토큰을 받습니다. NET_ADMIN, SETUID, SETGID 권한(capabilities)과 TUN 장치가 필요하며, 차단벽이 적용된 수익 앱 브리지 위의 자체 네트워크 네임스페이스 안에서 이를 사용합니다. 노드 관리를 위한 웹 UI가 내장되어 있습니다. 가정용과 VPS 연결 모두에서 작동하지만, 추천 보너스는 가정용 IP의 노드에만 지급됩니다.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "탈중앙화 VPN 노드 - 블록체인 기반, VPS에서 작동"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "WebUI 주소"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "UDP 포트 범위"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "노드의 WebUI(포트 4449)를 게시하는 호스트 주소입니다. 127.0.0.1이면 이 머신에서만 접근할 수 있습니다. 리버스 프록시로 접근하려면 프록시가 연결하는 주소를 공백 없이 쉼표로 구분하여 추가하십시오: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "노드가 VPN 세션에 사용하는 UDP 포트이며, start:end 형식입니다. 라우터에서 같은 범위를 포워딩하십시오. 세션마다 약 두 개의 포트를 사용하므로 기본값 30개로 동시에 약 15개의 세션을 처리할 수 있으며, 이는 가정용 노드가 받는 양보다 많습니다. 범위를 넓혀도 해결되는 것은 없고 비용만 늘어납니다: 게시된 포트마다 노드의 시작과 제거가 느려지고(300개 포트는 시작에 약 12 s 소요), CashPilot은 최대 300개만 허용하며, Docker의 기본 userland 프록시에서는 포트마다 약 2.5 MB의 메모리도 사용합니다. 모든 세션이 실패한다면 포트 부족이 아니라 라우터 문제입니다: Mysterium 가이드의 \"Routers that rewrite UDP source ports\"를 참조하십시오. 32768 미만으로 유지하십시오: 32768-60999 포트는 Linux의 임시(ephemeral) 포트 범위로, 호스트의 어떤 프로그램이든 잠시 점유할 수 있으며, 포트 하나만 점유되어도 노드 시작이 실패합니다. 이미 범위가 있는 노드는 그 범위를 유지합니다."
  source: "530524e2e718"
mysterium.docker.runtime_reason:
  text: "gVisor는 iptables-nft와 커널 WireGuard를 제공하지 않으며, 둘 다 트래픽을 전달하는 데 필요합니다."
  source: "d8a72a275579"
mysterium.docker.critical_volumes.0.holds:
  text: "노드 신원 키 저장소입니다. 이를 삭제하면 완전히 새로운 신원이 만들어집니다: 노드는 평판과, 이전 신원에 아직 보류된 모든 수익을 잃습니다."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "노드가 컨테이너 안에서 sudo를 실행할 수 없어 VPN 인터페이스나 방화벽을 구성하지 못하므로 모든 세션이 설정 단계에서 실패합니다: 온라인으로 보이지만 아무것도 벌지 못합니다. 컨테이너가 SETUID와 SETGID 권한 없이 생성되었습니다. CashPilot과 이 노드를 실행하는 워커를 업데이트한 다음 대시보드에서 Mysterium을 재배포하십시오. 노드 신원은 데이터 볼륨에 있으므로 유지됩니다."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "지난 6시간 동안 이 노드에 직접 연결된 VPN 세션이 하나도 없습니다. 모든 세션이 홀 펀칭으로 대체되었고, 많은 구매자는 이 방식으로 연결에 실패하므로 노드의 수익이 줄어듭니다. 노드의 UDP 포트가 인터넷에서 접근되지 않습니다. 라우터에서 UDP 포트 범위 ${UDP_PORTS}(start:end, 양쪽 모두 같은 범위)를 ${HOST_ADDRESS}(으)로 포워딩하십시오. 세션이 직접 연결되면 이 메시지는 저절로 사라집니다."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Mysterium의 모니터링이 ${WORKER_NAME}의 노드를 실패로 표시하여, 노드 자체 점검에서 모든 포트에 접근할 수 있다고 나오더라도 대부분의 구매자가 고르는 노드 목록에서 제외됩니다. 먼저 노드에 /dev/net/tun과 SETUID/SETGID가 있는지 확인하십시오. 이것이 없어도 같은 방식으로 실패합니다: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 이것들이 갖춰져 있다면, 흔한 원인은 외부 패킷이 포트에 도달한 뒤 ${WORKER_NAME} 앞의 라우터가 노드 응답의 UDP 출발지 포트를 다시 쓰는 것입니다. 가이드의 테스트를 참조하십시오: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "${WORKER_NAME}의 노드에서 마지막 VPN 세션 다섯 개가 모두 데이터를 전혀 전송하지 않은 채 약 1분 뒤에 끝났으므로, 온라인으로 보이는 동안에도 아무것도 벌지 못합니다. 가능성이 높은 원인은 ${WORKER_NAME} 앞의 라우터입니다: 외부 패킷이 포트에 도달하면 그 포트에서 나가는 노드의 이후 응답의 출발지 포트를 다시 쓰는데, 모든 세션은 그런 패킷(노드 자체의 포트 점검)으로 시작하므로 구매자가 노드의 응답을 버립니다. 포트 범위를 넓혀도 도움이 되지 않습니다. 가이드의 테스트와 해결 방법을 참조하십시오: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports 세션이 데이터를 전송하면 이 메시지는 사라집니다."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "수익은 MYST 토큰으로 받습니다. 가정용 IP가 훨씬 많이 법니다. 관리용 노드 WebUI는 포트 4449에 있으며, 기본적으로 노드가 실행되는 머신에서만(127.0.0.1) 게시됩니다. 다른 머신에서는 먼저 SSH 터널을 여십시오(ssh -L 14449:127.0.0.1:4449 뒤에 노드 머신의 주소를 붙여 실행한 후 http://127.0.0.1:14449 접속. 로컬 포트 14449는 본인 머신의 노드와 충돌하지 않게 하기 위함입니다). 또는 UI_ADDRESS에 주소를 추가하십시오(Mysterium 가이드의 WebUI 주소 참조). VPS도 허용됩니다. UDP 23000-23029(UDP_PORTS 기본값)의 포트 포워딩을 강력히 권장합니다 -- 포워딩하지 않으면 노드가 Strict NAT 상태가 되어 많은 VPN 세션이 실패하고 수입이 크게 줄어듭니다. 중요: 처음 실행한 뒤 노드 WebUI나 CLI에서 수익자(정산) 지갑을 mystnodes.com 계정과 일치하도록 설정하십시오 -- 그래야 온체인 수익이 클라우드 대시보드에 연결됩니다."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "노드에 미정산 5 MYST가 쌓일 때마다 자동 온체인 정산"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "누를 버튼이 없습니다. 각 노드는 미정산 5 MYST가 쌓이면 스스로 Polygon에서 정산하며, 약 21%가 수수료로 나갑니다(Hermes 수수료 20%와 소액의 거래 수수료). 따라서 정산 한 번에 약 3.9 MYST가 수익자 지갑에 들어옵니다. 각 노드의 TequilAPI는 /transactor/settle/history에서 정산 내역을 보여 줍니다. MystNodes의 \"total earnings\" 수치는 최근 30일만 포함하며, 잔액도 누적 총액도 아닙니다. MystNodes 보상 프로그램의 보너스 MYST는 자동으로 정산되지 않습니다: MystNodes 고객센터에 따르면 분배 후 30일 이내에 Rewards 페이지에서 수령해야 합니다."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "수익자 지갑은 배포한 뒤에 TequilAPI나 노드 WebUI로 설정합니다 -- 환경 변수로 설정하지 않으므로 컨테이너 사양에서 읽을 수 없습니다."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "MystNodes 계정 이메일과 비밀번호를 사용하십시오(<a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>과 동일)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "노드가 5 MYST를 번 친구 한 명당 5 MYST(가정용 IP만 해당)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "노드가 처음 5 MYST를 벌면 5 MYST(가정용 IP, mystnodes.com에서 노드 등록 필요)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "지난달 MystNodes 보상을 수령하십시오"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "월간 분배 후 30일 이내에 수령하지 않은 보상은 몰수되어 다음 달 풀로 돌아갑니다."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Rewards 페이지를 열고 포인트를 MYST로 교환하십시오."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "대역폭입니다. 사용자의 연결이 Mysterium 네트워크의 출구 노드로 쓰이며, 이 네트워크는 VPN, 프록시, 그리고 데이터 스크래핑 서비스를 판매합니다. 가정용 IP에서 나가는 스크래핑 트래픽이 신고를 가장 많이 받는 용도이며, 노드가 셋 중 어떤 트래픽을 전달할지는 선택할 수 없습니다."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "예. 모르는 사람이 사용자의 IP 주소를 통해 트래픽을 보냅니다 — 그것이 바로 이 상품입니다."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "노드 신원(블록체인 주소), IP, 대략적인 위치(국가/도시/ISP)이며, 구매자가 고를 수 있도록 노드가 네트워크에 게시합니다."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "실제로 있으며 이해해 둘 가치가 있습니다. 다른 사람의 트래픽이 사용자의 연결에서 사용자의 이름으로 나가므로, 그들이 하는 모든 일이 사용자의 회선에서 나온 것처럼 보입니다. 많은 가정용 ISP 계약이 이를 금지합니다. 실행하기 전에 본인 계약을 확인하십시오."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "계정당, IP당 기기 수 제한이 없습니다."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "정산마다 약 21%가 수수료(Hermes 수수료 20%와 거래 수수료)로 나가며, 수익은 MYST 토큰으로 지급됩니다."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "노드는 Mysterium의 VPN, 프록시, 데이터 스크래핑 고객의 출구가 되며, 그중 어떤 고객의 트래픽을 전달할지는 선택할 수 없습니다."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "노드 소프트웨어는 GPL-3.0의 오픈 소스입니다."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium은 자체 Docker 이미지 mysteriumnetwork/myst를 공개합니다."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "정산은 본인이 소유한 지갑으로 들어가며, 휴대폰 번호나 신분증이 필요하지 않습니다."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "노드 프로젝트는 2017년부터 운영되고 있습니다."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Mysterium 사이트에 따르면 네트워크는 스위스 Zug의 Blockdev AG가 개발합니다."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay는 브라우저 확장 프로그램으로 대역폭을 공유하는 사용자에게 보상을 주는 DePIN 네트워크입니다. 플랫폼이 Cloudflare 보호 뒤에 있어 자동화된 접근이 어려울 수 있습니다. 사용자는 확장 프로그램을 활성 상태로 두어 Nodepay Points를 적립합니다. 네트워크는 AI 학습 데이터 인프라 제공에 중점을 둡니다.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "AI용 DePIN 대역폭 공유 - 브라우저 확장 프로그램"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Nodepay Points를 적립합니다. Nodepay의 자격 심사를 통과한 사용자의 포인트는 NC 토큰으로 전환됩니다. Cloudflare 보호 때문에 자동 수집이 차단될 수 있습니다. 브라우저 확장 프로그램이 필요합니다."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "NC 토큰 에어드롭(시기 미확정)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "포인트 기반 시스템입니다. Nodepay의 자격 심사를 통과한 사용자의 포인트는 2025년 1월에 출시된 NC 토큰으로 전환됩니다."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "첫 시즌 검토에서 Nodepay는 봇으로 판단한 300,000개가 넘는 계정을 삭제하고 170억 포인트를 취소했습니다."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "보상은 NC 토큰으로 전환되는 포인트이므로, 그 가치는 토큰에 달려 있습니다."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot은 Nodepay를 실행하지 않습니다. 제공업체의 자체 브라우저 확장 프로그램을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes는 Base L2의 DeFi 프로젝트인 Noderr Protocol의 무료 입문 등급입니다. 마이크로노드는 남는 Android 휴대폰, Windows PC, Mac 또는 Chromium 브라우저에서 실행되는 작은 에이전트입니다. Android에서는 휴대폰의 모바일 연결을 공유합니다: 다른 Noderr 트래픽이 휴대폰의 통신사 IP로 나가므로 모바일 데이터가 있는 SIM이 필요합니다. PC나 브라우저에서는 남는 컴퓨팅 자원으로 프로토콜의 자동화 작업을 실행합니다. 보상은 온체인 가동 시간 및 신뢰도 점수에 따라 NODR로 지급되도록 설계되었지만, 베타 기간에는 네트워크가 Base Sepolia 테스트넷에 있습니다: 노드 보상은 재원이 없으며 아직 지급된 적이 없습니다.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "무료 마이크로노드(Android 연결 공유, Windows, Mac, 브라우저) - 테스트넷, 아직 보상 재원 없음"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "테스트넷 베타: 노드 보상은 재원이 없으며 아직 지급된 적이 없습니다. 사이트의 5-10% APY는 설계 목표치입니다. 네트워크가 Base Sepolia를 벗어나면 다시 확인하십시오."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
noderr.cashout.notes:
  text: "보상은 노드 자체 지갑에 쌓이며 앱이나 dApp에서 수령합니다. 베타 기간에는 시장 가치가 없는 Base Sepolia 테스트넷 토큰입니다."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "앱은 첫 실행 시 노드 지갑을 만들고 무료 소울바운드 Utility NFT를 그 지갑에 발행합니다. 앱에서 지갑을 백업하십시오: 기기를 잃어버리면 노드 신원도 잃습니다. 베타 기간에 보상은 Base Sepolia(테스트넷)에 있습니다."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android에는 모바일 데이터가 있는 SIM이 필요합니다. 데스크톱 및 브라우저 클라이언트에 대해서는 IP 요구 사항이 공개되어 있지 않습니다."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "기기에 따라 다릅니다. Android 휴대폰은 모바일 연결을 판매합니다: 다른 Noderr 트래픽이 휴대폰의 통신사 IP 주소로 나가며 데이터 요금제에서 차감됩니다. Windows PC, Mac 또는 브라우저는 제공업체가 소셜 미디어 및 콘텐츠 자동화 작업이라고 부르는 일에 남는 컴퓨팅 자원을 판매합니다."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "예. Android에서는 다른 Noderr 트래픽이 휴대폰의 모바일 IP 주소로 나갑니다. 앱은 시작 전에 기록되는 동의를 요청하며, 같은 화면에서 공유를 중지할 수 있습니다. Windows, Mac, 브라우저 클라이언트에 대해서는 제공업체가 자동화 작업이라고 설명하지만, 그 작업이 다른 사람의 트래픽을 전달하는지는 밝히지 않습니다."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "노드의 지갑 주소와 가동 시간 및 작업 완료 수치가 평판 점수(TrustFingerprint)로 온체인에 기록됩니다. 제공업체는 작업이 익명화되어 샌드박스에서 실행되며 지갑 키는 기기를 떠나지 않는다고 말합니다. 그 이상 구체적인 내용은 공개되어 있지 않습니다."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Android에서 공유되는 연결은 통신사 모바일 요금제입니다: 제공업체의 문서는 일부 통신사의 이용 정책상 공유가 허용되지 않을 수 있다고 경고하며, 공유된 트래픽은 요금제 데이터에서 차감됩니다. 데스크톱 및 브라우저 클라이언트에 대해서는 제공업체가 ISP 약관에 대해 아무것도 말하지 않습니다."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "기기당 노드 하나이며, 각 노드에 고유한 소울바운드 Utility NFT가 있습니다. 여러 기기를 실행하는 것은 허용되며 권장됩니다. IP당 제한은 공개되어 있지 않습니다. 일반적인 의미의 계정은 없습니다: 신원은 앱이 첫 실행 시 생성하는 지갑입니다."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "노드 보상은 재원이 없고 시장 가치도 없는 테스트넷 토큰이며, 아직 지급된 적이 없습니다. 사이트의 5~10% APY는 설계 목표치입니다."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "데스크톱 및 브라우저 클라이언트에 대해 Noderr는 자동화 작업이라고 설명하지만, 그것이 다른 사람의 트래픽을 전달하는지는 밝히지 않습니다."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "제공업체는 작업이 익명화되어 샌드박스에서 실행된다고 말하지만, 그 이상 구체적인 내용은 공개하지 않습니다."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "아직 Base Sepolia의 테스트넷 베타입니다."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot은 Noderr를 실행하지 않습니다. 제공업체의 자체 앱이나 확장 프로그램을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "계정이 없습니다. 앱이 첫 실행 시 지갑을 생성합니다."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle은 스마트폰의 Bluetooth를 사용해 IoT 인프라를 만듭니다. 앱이 근처 IoT 기기를 백그라운드에서 감지하고 데이터를 중계하여 NODL 토큰을 받습니다. Forbes에 소개되었으며, Vivendi 및 Hayden AI와 기업 파트너십을 맺고 있습니다. 모바일 전용입니다(iOS 및 Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Bluetooth IoT 중계 - 모바일 앱, NODL 토큰 보상"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "수익이 매우 낮습니다. Bluetooth를 사용하는 백그라운드 휴대폰 앱입니다. 지갑 연결이 불안정할 수 있습니다."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "지속적"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL은 ZKsync Era에 있는 앱 자체 지갑에 보관됩니다. 앱이나 ZKsync Era 블록 탐색기에서 확인하십시오. Nodle은 Polkadot 파라체인을 떠났고 Polkadot-ZKsync 브리지는 2025년 12월 31일에 닫혔으므로, 아직 Polkadot 쪽에 있는 NODL은 더 이상 ZKsync로 옮길 수 없습니다."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "NODL은 ZKsync Era에 있는 Nodle 앱 자체 지갑에 보관됩니다. CashPilot은 그 지갑의 주소를 볼 수 없습니다."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "초대로 가입한 새 활성 사용자 한 명당 NODL 보상(Nodle은 금액을 공개하지 않음)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "한 리뷰어는 3~4년 동안 약 $3을 벌었다고 보고하며, 다른 리뷰어들은 일일 수익이 급격히 줄었다고 보고합니다."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot은 Nodle을 실행하지 않습니다. 제공업체의 자체 휴대폰 앱을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana는 Solana 기반의 탈중앙화 GPU 컴퓨팅 마켓플레이스입니다. GPU 소유자를 AI 작업 수요와 연결하고 NOS 토큰으로 지급합니다. RTX 3060은 약 $0.048/시간을 법니다. 플랫폼은 AI 추론 작업에 중점을 두며, 작업 스케줄링과 지급 정산에 Solana 블록체인을 사용합니다. 노드는 Nosana CLI로 컨테이너 작업을 실행합니다.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Solana 기반 GPU 컴퓨팅 - NOS 토큰, RTX 3060 ~$0.048/시간"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/시간이며, 상위 GPU는 더 많이 법니다. 수익은 작업 가용성과 GPU 모델에 따라 다릅니다. NVIDIA GPU, Linux, Docker, Nosana CLI가 필요합니다. 지급은 Solana의 NOS 토큰으로 이루어집니다."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "작업 완료 시마다"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Solana에서 NOS 토큰을 적립합니다. 설정한 지갑으로 지급됩니다."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Nosana는 기본적으로 Solana 지갑을 생성하므로, 대부분의 사용자는 그 주소를 본 적이 없습니다."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "각 호스트는 GPU의 시간당 가격에 맞춘 NOS 스테이크를 예치해야 합니다."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "호스트는 NOS로 지급받으므로 달러 기준 수익은 토큰 가격과 해당 카드의 수요에 따라 움직입니다."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot은 Nosana를 실행하지 않습니다. 제공업체의 자체 호스트 소프트웨어를 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN은 계정이 없는 Bitcoin 채굴 풀입니다: 채굴기가 Bitcoin 주소를 사용자 이름으로 로그인하고, 풀은 그 주소로 지급합니다. CashPilot은 여기서 채굴기를 실행하지 않습니다. OCEAN이 주소에 대해 보유한 미지급 잔액을 읽어, ASIC(Bitaxe, Antminer)이 번 금액을 다른 수입과 함께 볼 수 있게 합니다. 미지급 잔액은 벌었지만 아직 받지 않은 금액입니다: 지급 기준액을 넘으면 OCEAN이 온체인으로 지급합니다.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Bitcoin 채굴 풀, 지급 주소로 추적"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "블록 보상으로 잔액이 기준액을 넘을 때"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "미지급 잔액이 기준액에 도달하면 OCEAN이 주소로 온체인 지급합니다. Lightning 지급(선택 사항, BOLT12)은 CashPilot이 감지하지 못합니다."
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "미지급 금액은 벌었지만, Lightning 지급을 켜지 않은 한 OCEAN이 이 주소로 온체인 지급할 때까지는 받지 않은 것입니다."
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "BTC 지급 주소입니다: 채굴기가 OCEAN에서 사용하는 사용자 이름에서 <b>.workername</b> 부분을 뺀 것입니다. 공개 정보이며 자금에 접근할 수 없습니다."
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "mine.ocean.xyz:3334를 가리키는 Bitcoin ASIC 채굴기(Bitaxe, Antminer)가 필요합니다"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "컴퓨팅"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
  text: "아니요. 채굴기가 해시를 풀로 보내며, 누구도 사용자의 연결로 트래픽을 보내지 않습니다."
  source: "7239118f749a"
ocean.disclosure.data_collected:
  text: "Bitcoin 주소, 선택한 워커 이름, 해시레이트, 그리고 풀이 보는 채굴기의 IP 주소입니다."
  source: "22282404721c"
ocean.disclosure.isp_risk:
  text: "채굴기는 풀과 연결 하나를 유지하며 대역폭을 거의 사용하지 않습니다. 신경 써야 할 비용은 ISP가 아니라 전기 요금입니다."
  source: "7bf5f9f6b028"
ocean.disclosure.account_rules:
  text: "계정이 없습니다. 주소가 신원이며, 누구나 ocean.xyz에서 그 통계를 볼 수 있습니다."
  source: "e3c8fd5863c1"
ocean.rating.cons.0.text:
  text: "Bitcoin으로만 지급하며, 잔액이 0.01048576 BTC에 도달하기 전에는 온체인으로 아무것도 지급하지 않습니다."
  source: "9c9981f2fbd5"
ocean.rating.cons.1.text:
  text: "풀 수수료는 2%이며, DATUM으로 직접 블록 템플릿을 만들면 1%입니다."
  source: "497f4f1ec62e"
ocean.rating.cons.2.text:
  text: "CashPilot은 OCEAN용 채굴기를 실행하지 않습니다. 본인 하드웨어가 풀을 가리키도록 설정하며, CashPilot은 잔액만 읽습니다."
  source: "eccc0b4b47ae"
ocean.rating.pros.0.text:
  text: "계정도 신원 확인도 없습니다. OCEAN은 지급할 Bitcoin 주소만 요구합니다."
  source: "38c4a7764846"
packetstream.description:
  text: "PacketStream은 사용하지 않는 대역폭을 판매할 수 있는 P2P 대역폭 마켓플레이스입니다. 시장 조사, SEO 모니터링, 광고 검증에 쓰이는 가정용 프록시 네트워크를 운영합니다. CID(Client ID)만 있으면 되는 간단한 Docker 설정입니다. CAPTCHA로 보호된 로그인 때문에 자동 수익 수집이 어려울 수 있습니다.\n"
  source: "ee363f486228"
packetstream.short_description:
  text: "대역폭 공유 - 간단한 CID 기반 설정"
  source: "583d6cb0e210"
packetstream.docker.env.CID.label:
  text: "Client ID"
  source: "8726db013948"
packetstream.docker.env.CID.description:
  text: "<a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a>에 로그인 → 사이드바에서 Setup 클릭 → Docker 명령에 CID가 표시됩니다"
  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream이 이 사본의 IP 주소를 가정용이 아니라는 이유로 거부하므로 아무것도 벌지 못합니다. 가정용 회선으로 인터넷에 연결된 머신에서 실행하거나, 이 사본을 제거하십시오."
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "PacketStream에 이미 이 IP 주소의 다른 클라이언트가 있으며, IP당 하나에만 지급합니다. 이 사본이나 같은 IP를 쓰는 다른 사본을 제거하십시오."
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "공유한 대역폭에 대해 $0.10/GB를 지급합니다. 수익은 IP 위치에 대한 수요에 따라 크게 달라집니다."
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "PayPal만 가능하며, 최소 $5, 확인 전에 표시되는 수수료 3%입니다. 첫 출금 시 PayPal 이메일이 저장되며, 나중에 변경하려면 이메일 확인과 7일 대기가 필요하므로 확인하기 전에 주소를 점검하십시오. 요청은 검토 후 7일 이내에 발송됩니다. 대기 중인 요청은 취소할 수 있으며, 새 요청은 이전 요청이 지급된 뒤에만 할 수 있습니다."
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "잔액은 PacketStream이 보유하며, 요청 시 출금합니다."
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "<a href='https://packetstream.io' target='_blank'>packetstream.io</a>에 로그인하고 F12 → Application → Cookies에서 <b>auth</b> 쿠키 값을 복사하십시오(JWT입니다)."
  source: "15bae9d455f5"
packetstream.referral.bonus.referrer:
  text: "추천한 사용자 대역폭 수익의 20%(기간 한정 Packeter 보너스)"
  source: "964a44bb9e65"
packetstream.referral.bonus.referee:
  text: "첫 카드 또는 PayPal 입금 시 10% 보너스 크레딧(프록시 고객)"
  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "2025년과 2026년 Trustpilot 리뷰어들은 지급이 늦거나 아예 오지 않는다고 보고하며, 오래 사용한 한 사용자는 지급이 느려지다가 멈췄다고 말합니다. 2026년에 지급을 받았다는 다른 리뷰어들도 있습니다."
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "PayPal만 가능하고 출금 수수료가 3%이며, PayPal이 서비스하지 않는 국가의 사용자에게는 다른 방법이 없습니다."
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "약관에 따르면 PacketStream은 사기, 조작 또는 금지된 활동과 관련된다고 보는 수익을 보류, 취소 또는 무효화할 수 있습니다."
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
  text: "약관에 따르면 프록시 고객과 PacketStream 자체가 사용자의 연결로 트래픽을 보내며, 일반 구매자를 확인하는 절차는 설명되어 있지 않습니다."
  source: "fd4707690d2b"
packetstream.rating.cons.4.text:
  text: "Trustpilot에 따르면 PacketStream은 부정적인 리뷰에 답하지 않았으며, 리뷰어들은 이메일에 답이 없다고 보고합니다."
  source: "4885bceb8df9"
packetstream.rating.pros.0.text:
  text: "PacketStream은 자체 Docker 이미지 packetstream/psclient를 공개합니다."
  source: "b358af0b3419"
packetstream.rating.pros.1.text:
  text: "약관은 본인이 소유하거나 사용할 수 있는 기기와 연결만 요구합니다."
  source: "bde1b5ad5a6a"
packetstream.rating.pros.2.text:
  text: "약관에는 신원 확인이 없으며, 지급에는 PayPal 주소가 필요합니다."
  source: "a05886b55edc"
packetstream.rating.pros.3.text:
  text: "약관에 캘리포니아 법에 따른 PacketStream Inc.가 명시되어 있습니다."
  source: "7966bde559dd"
packetstream.rating.pros.4.text:
  text: "PacketStream은 2018년부터 운영되고 있습니다."
  source: "70db8167d5bc"
passiveapp.description:
  text: "PassiveApp은 사용하지 않는 대역폭과 컴퓨팅 자원을 공유하여 암호화폐와 PayPal 보상을 받는 DePIN 플랫폼입니다. 실제로는 Windows 전용입니다: 제공업체의 다운로드 페이지에는 최소 2025년 2월부터 Android, iOS, Linux가 변함없이 \"coming soon\"으로 표시되어 있고, macOS 버전은 없습니다 — 같은 사이트의 마케팅 문구가 더 넓은 지원을 주장하는데도 그렇습니다. Docker 이미지가 없습니다.\n"
  source: "e0f069b6b6e0"
passiveapp.short_description:
  text: "DePIN 대역폭/컴퓨팅 - Windows 전용, 암호화폐 및 PayPal 지급"
  source: "e23871afdcd9"
passiveapp.earnings.notes:
  text: "Windows 데스크톱 앱 전용(v1.0.x). Android/iOS/Linux는 2025년 초부터 제공업체가 'coming soon'으로 발표했지만 출시된 적이 없습니다. 공식 Docker 이미지가 없습니다."
  source: "57f5891e1772"
passiveapp.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
passiveapp.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
passiveapp.referral.bonus.referrer:
  text: "추천한 사용자 수익의 10%, 평생"
  source: "f0262d54b65c"
passiveapp.rating.cons.0.text:
  text: "CashPilot은 PassiveApp을 실행하지 않습니다. 제공업체의 자체 데스크톱 앱을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "2b27df807548"
passiveapp.rating.pros.0.text:
  text: "PassiveApp 사이트에는 최소 $3부터 PayPal, 암호화폐, 기프트 카드가 나와 있습니다."
  source: "5fb04eb0efdc"
proxybase.description:
  text: "ProxyBase는 사용하지 않는 인터넷 연결을 공유하면 암호화폐로 지급하는 대역폭 공유 플랫폼입니다. 대시보드의 Access Token으로 피어 클라이언트를 인증합니다. 가정용 IP가 가장 많이 벌지만 데이터 센터 IP도 지원합니다. 공식 멀티 아키텍처 Docker 이미지(amd64/arm64/armv7)가 있습니다.\n"
  source: "7a558682be11"
proxybase.short_description:
  text: "proxybase.org - 대역폭 공유, 암호화폐 지급, Access Token 인증. 지갑을 생성하지 않음"
  source: "5224bb16fee4"
proxybase.docker.env.ID.label:
  text: "액세스 토큰"
  source: "f9db72ced1ee"
proxybase.docker.env.NAME.label:
  text: "기기 이름"
  source: "6415f86bc24f"
proxybase.docker.env.ID.description:
  text: "<a href=\"https://peer.proxybase.org/dashboard/login?referral=nXzS3c6iTO\">peer.proxybase.org/dashboard</a>에 로그인 → Access Token 복사(설정 페이지의 Docker 명령에 표시됨)"
  source: "3571c2e99729"
proxybase.docker.env.NAME.description:
  text: "ProxyBase 대시보드에서 이 기기를 식별할 이름(공백 없이 아무 이름)"
  source: "906ebedecbc7"
proxybase.docker.health_signals.0.means:
  text: "ProxyBase가 최소 30분 동안 릴레이에 연결하지 못해 아무것도 벌지 못합니다. 재시작하면 해결됩니다. 재시작 후에도 계속되면 이 머신이 인터넷에 연결되는지 확인하십시오."
