  text: "지갑 주소"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "이메일"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "외부 주소"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "스토리지 할당량"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "신원 디렉터리"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "스토리지 디렉터리"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "USDC 지급용 Ethereum 지갑 주소(예: 0x1234...abcd). 본인이 직접 관리하는 지갑(MetaMask, Ledger 등)이어야 합니다 -- 거래소 주소는 절대 사용하지 마십시오"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "운영자 알림을 받을 이메일 주소"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "포트가 포함된 DDNS 호스트 이름(예: mynode.ddns.net:28967) -- 고정 IP보다 강력히 권장합니다. 고정 IP를 쓰면 ISP가 예고 없이 IP를 바꾸는 날 노드가 연결되지 않습니다. 포트 28967을 포워딩해야 합니다(TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "할당할 최대 디스크 공간(예: 2TB). SSD가 아닌 회전식 디스크(HDD)를 사용하십시오"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "신원 파일이 저장된 호스트 경로(ca.cert, ca.key, identity.cert, identity.key가 있어야 함)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Storj 데이터를 저장할 회전식 디스크(HDD)의 호스트 경로. 최소 550GB의 여유 공간이 필요합니다"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "처음 실행하기 전에 스토리지 노드 설정을 초기화하십시오: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "노드 신원입니다. ID는 작업 증명(proof-of-work)에 묶여 있어 다시 만드는 데 몇 시간이 걸리며, 다른 어떤 백업으로도 다시 만들 수 없습니다. 이를 잃으면 보류된 지급 잔액을 몰수당합니다."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "저장된 고객 데이터와 노드의 보류 금액입니다. 이를 잃으면 노드가 실격되고 보류된 잔액을 몰수당합니다."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Storj 네트워크가 공지된 ADDRESS로 노드에 다시 연결할 수 없어 위성이 노드를 오프라인으로 집계합니다: 새 데이터가 들어오지 않고, 이그레스 수입이 멈추며, 오프라인 상태가 오래 지속되면 정지됩니다. ADDRESS가 현재 공개 IP와 일치하는지(ISP가 IP를 바꿔도 노드가 끊기지 않도록 고정 IP가 아닌 DDNS 호스트 이름을 사용), 그리고 포트 28967 TCP+UDP가 이 머신으로 포워딩되는지 확인하십시오."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "2026년 9월 1일부터 저장 $1.35/TB + 이그레스 $1/TB + 감사/복구 $1/TB. 수익은 저장된 데이터와 노드 연차에 따라 늘어납니다. 처음 9개월 동안 수익의 75%, 이어서 50%, 25%가 보류되며, 보류 금액의 절반은 16개월째에, 나머지는 정상 탈퇴(graceful exit) 시에 돌려받습니다. 포트 28967을 포워딩해야 합니다."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "Ethereum 거래 수수료의 4x, 그보다 적은 잔액은 이월"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "매월"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "지갑 잔액이 현재 거래 수수료의 최소 네 배가 되면 매월 Ethereum 메인넷의 USDC로 지급되며, 그보다 적은 잔액은 다음 달로 이월됩니다. 2026년 9월 지급까지는 STORJ 토큰이었습니다. 대시보드는 포트 14002에 있습니다."
  source: "6208f04947d2"
storj.payout.notes:
  text: "잔액이 수수료 기반 최소 금액을 넘으면 매월 Ethereum 메인넷의 USDC로 WALLET의 주소에 지급됩니다. 2026년 9월 지급까지는 STORJ 토큰이었으며, zkSync Era 지급은 2026년 9월 1일에 종료되었습니다."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "포트 14002의 노드 대시보드 URL로, localhost 대신 서버의 LAN IP를 사용합니다. 예: <b>http://192.168.1.10:14002</b>. 노드가 여러 개라면 URL을 쉼표로 구분하여 나열하십시오: CashPilot이 합산합니다."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "같은 /24 서브넷의 Storj 노드는 데이터 할당을 나눠 가지므로 노드당 수익이 줄어듭니다."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "업로드 5 Mbps"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "디스크 공간과 이를 제공하기 위한 대역폭입니다."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "아니요. 암호화되고 소거 부호화된 고객 데이터 조각을 저장합니다. 다른 사람이 자신의 트래픽을 사용자의 IP로 보내지 않습니다."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "노드 신원, 지갑 주소, 노드가 운영자 알림용으로 요구하는 이메일 주소, 그리고 노드가 데이터를 제공하려면 접근 가능해야 하는 IP와 포트입니다."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "책임 문제라기보다는 주로 데이터 한도 문제입니다: 노드는 고객 데이터를 계속 주고받으므로 회선에 실제로 지속적인 트래픽이 발생합니다. 다만 프록시나 릴레이와 달리 사용자가 출처로 간주되는 익명화된 제3자 트래픽은 아니므로, 그런 서비스가 받는 남용 신고를 받지 않습니다."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "노드 수 제한은 없지만, 같은 /24 서브넷의 노드는 할당을 나눠 가지므로 한 연결에 여러 노드를 두면 각자 덜 법니다."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk는 2026년 7월 27일 Storj Labs가 Chapter 11 파산 보호를 신청했다고 보도했습니다."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "신청 이전의 노드 운영자 지급분은 파산 채권 절차로 넘어갔습니다."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "새 노드는 처음 9개월 동안 수익의 75%, 이어서 50%, 25%가 보류되며, 절반은 16개월째에, 나머지는 정상 탈퇴(graceful exit) 시에만 돌려받습니다."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "고객은 암호화된 파일 조각을 저장하고 누구도 사용자의 IP로 트래픽을 보내지 않지만, 고객이 누구인지, 어떻게 확인하는지를 Storj가 밝힌 곳은 찾지 못했습니다."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "스토리지 노드 소프트웨어는 AGPL-3.0의 오픈 소스입니다."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj는 자체 Docker 이미지 storjlabs/storagenode를 공개합니다."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "계정이 없습니다: 지갑 주소와 운영자 알림용 이메일만 있으면 됩니다."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "신청 이후에도 활성 노드에는 계속 지급되었습니다."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR은 계정이 없는 Monero 채굴 풀입니다: 채굴기가 Monero 주소를 사용자 이름으로 로그인하고, 풀은 그 주소로 지급합니다. CashPilot은 여기서 채굴기를 실행하지 않습니다. SupportXMR이 주소에 대해 보유한 잔액을 읽어, CPU 채굴기가 번 금액을 다른 수입과 함께 볼 수 있게 합니다. 잔액은 벌었지만 아직 받지 않은 금액입니다: 지급 기준액을 넘으면 풀이 지급합니다.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Monero 채굴 풀, 지급 주소로 추적"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR(자동), 요청 시 0.01 XMR"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "잔액이 기준액을 넘을 때, 또는 요청 시"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "잔액이 기준액(기본값 0.1 XMR)에 도달하면 SupportXMR이 주소로 지급합니다. 사이트에서 0.01 XMR부터 즉시 지급을 요청할 수도 있으며, 수수료는 0.001 XMR입니다."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "잔액은 벌었지만 SupportXMR이 이 주소로 지급할 때까지는 받지 않은 것입니다. Monero 잔액은 개인 보기 키(private view key) 없이는 온체인에서 읽을 수 없고 CashPilot은 이 키를 요구하지 않으므로, 지급은 매번 직접 확인합니다."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Monero 지급 주소입니다: 채굴기가 SupportXMR에서 사용하는 사용자 이름에서 <b>.workername</b>이나 <b>+difficulty</b> 부분을 뺀 것입니다. 공개 정보이며 자금에 접근할 수 없습니다."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "pool.supportxmr.com을 가리키는 Monero 채굴기(XMRig)가 필요합니다"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "컴퓨팅"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "아니요. 채굴기가 해시를 풀로 보내며, 누구도 사용자의 연결로 트래픽을 보내지 않습니다."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Monero 주소, 선택한 워커 이름, 해시레이트, 그리고 풀이 보는 채굴기의 IP 주소입니다."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "채굴기는 풀과 연결 하나를 유지하며 대역폭을 거의 사용하지 않습니다. 신경 써야 할 비용은 ISP가 아니라 전기 요금입니다."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "계정이 없습니다. 주소가 신원이며, 누구나 supportxmr.com에서 그 통계를 볼 수 있습니다."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Monero로만 지급하며, 풀 수수료 0.6%, 자동 지급 전 기본 기준액 0.1 XMR입니다."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot은 SupportXMR용 채굴기를 실행하지 않습니다. 본인 채굴기가 풀을 가리키도록 설정하며, CashPilot은 잔액만 읽습니다."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol은 Beacon 네트워크를 통해 AI 에이전트가 실시간 웹에 접근하게 합니다. Teneo Beacon은 Android, iOS, macOS, Windows, Linux용 Teneo 자체 앱이며, 서버와 Raspberry Pi용 명령줄 버전도 있습니다. 동의 화면을 수락하면 사용하지 않는 대역폭을 공유하고, 온라인인 동안 Teneo Protocol Points와 Fragments를 적립합니다. Fragments는 USDC로 지급되는 시즌 추첨(Beacon Drop)에 반영됩니다. Teneo에 따르면 Beacon은 이전 브라우저 확장 프로그램보다 두 배의 포인트를 법니다. 인터넷 연결당 Beacon 하나만 수익을 냅니다. 같은 연결의 다른 기기는 대기합니다. 추천 링크나 코드 PSA3BHPJ로 Expedition Hub에 가입한 다음 Beacon에 로그인하십시오.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "DePIN 대역폭 앱(Beacon) - 시즌 USDC 추첨용 Fragments, 추천 링크로 +100 Fragments"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Teneo Points와 Fragments를 적립합니다. Fragments는 시즌 USDC 추첨에 반영되므로, 시즌마다 정해진 요율이 아니라 상금이 지급됩니다. Teneo에 따르면 Beacon은 브라우저 확장 프로그램보다 두 배의 포인트를 법니다. 8시간마다 부스트를 수령하면 최대 3x Fragments를 받을 수 있으며, 기간을 놓치면 배수가 낮아집니다."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "시즌 추첨(Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Beacon Drop 상금은 Expedition Hub에 연결한 지갑으로 USDC로 지급됩니다. Hub에 지갑을 연결할 수 있는 남은 일수가 표시되며, 기한 내에 지갑을 연결하지 않은 상금은 몰수됩니다."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "시즌 상금이 지급되기 전에 Expedition Hub에서 지갑을 연결하십시오. 기한 내에 지갑을 연결하지 않으면 Hub가 상금을 몰수합니다."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "친구가 7일 이내에 가입하고 480 Fragments를 벌면, 추천한 친구 Fragments의 8%와 그 친구가 추천한 사용자 Fragments의 2%"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "가입 시 +100 Fragments, 480 Fragments에 도달하면 +150 추가"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "인터넷 연결당 Beacon 하나만 수익을 냅니다. 데이터 센터 머신은 Teneo가 허용한 호스팅 제공업체에서만, Fragments 절반으로, 포인트와 추천 보너스 없이 법니다. VPN 연결은 절대 수익을 내지 않습니다."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Beacon의 Fragments는 시즌 추첨의 상금으로만 USDC를 지급하므로, 실행한다고 해서 정해진 금액을 버는 것은 아닙니다."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo에 따르면 포인트는 $TENEO 토큰이 아니라 양도할 수 없는 보상 토큰인 $AGENTIC으로 통합됩니다."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "이전 목표였던 2026년 2분기가 지난 뒤에도, 2026년 11월까지 $TENEO 출시일, 할당, 수령 절차가 확정되지 않았습니다."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot은 Teneo를 실행하지 않습니다. 제공업체의 자체 Beacon 앱을 설치하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo는 트래픽이 검증된 기업 고객에게서 오며 사설 주소와 남용되기 쉬운 포트를 차단한다고 말하지만, 그 고객을 어떻게 검증하는지는 밝히지 않습니다."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network는 자리 잡은 탈중앙화 동영상 전송 및 AI 컴퓨팅 네트워크입니다(2018년부터). 사용자는 대역폭, 스토리지, 컴퓨팅 파워를 공유하는 Edge Node를 실행합니다. 주요 콘텐츠 파트너십이 있습니다. TFUEL 토큰을 적립합니다.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "탈중앙화 CDN + AI 컴퓨팅 - TFUEL 보상, 자리 잡은 프로젝트"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "데스크톱 앱 전용입니다. 수익은 자원과 위치에 따라 다릅니다. 주요 파트너십이 있으며 모든 거래소에 상장되어 있습니다."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "지속적"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot은 Theta Edge를 실행하지 않습니다. 제공업체의 자체 데스크톱 앱을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "893de938ed14"
titan.description:
  text: "Titan Network는 IP 주소, 스토리지, 대역폭을 공유하고 TNT 토큰 보상을 받는 DePIN 플랫폼입니다. Windows, Mac, Android에서 사용할 수 있습니다. 노드는 탈중앙화 CDN과 스토리지 계층에 기여합니다. 일반적인 수익은 공유하는 자원과 지리적 위치에 따라 $5-30/월입니다.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "IP, 스토리지, 대역폭을 공유하는 DePIN - $5-30/월"
  source: "799e68401067"
titan.earnings.notes:
  text: "IP, 스토리지, 대역폭을 공유합니다. 수익은 기여한 자원과 지역에 따라 다릅니다. 스토리지를 더 많이 할당할수록 보상이 커집니다."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "에포크 단위"
  source: "75743e03bad2"
titan.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Titan 도움말에 따르면 노드를 실행한다고 수익이 보장되지 않습니다: 할당된 작업이 없으면 아무것도 벌지 못하며, 보상은 TNT 토큰으로 지급됩니다."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot은 Titan을 실행하지 않습니다. 제공업체의 자체 앱이나 확장 프로그램을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer는 인증된 기업과 대역폭을 공유하여 인터넷 트래픽으로 수익을 냅니다. 가정용 연결뿐 아니라 VPS와 데이터 센터 IP에서도 잘 작동하는 몇 안 되는 대역폭 공유 서비스 중 하나입니다. 명령줄 인수로 전달하는 간단한 토큰 기반 인증을 사용합니다. Raspberry Pi 등 비슷한 기기를 위한 ARM 아키텍처를 지원합니다.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "대역폭 공유 - VPS에서 작동, 토큰 기반 인증"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "토큰"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "기기 이름"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "<a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>에 로그인하고 F12 → Application → Local Storage → <code>https://app.traffmonetizer.io</code> 클릭 → <code>authToken</code> 값 복사(약 54자: 숫자, <code>|</code>, 그다음 문자와 숫자)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "기기 관리를 위해 대시보드에 표시되는 이름"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "VPS와 데이터 센터 IP는 가정용보다 덜 법니다. 미국/EU 지역이 더 많이 법니다. Docker 네트워크로 여러 IP를 지원합니다."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "최소 $10. PayPal은 더 이상 제공되지 않습니다. 먼저 프로필에 지급 방법 하나를 저장하십시오: Solana 또는 TON의 USDT(수수료 최저), Arbitrum(수수료 낮음) 또는 Tron TRC20(네트워크 수수료 높음), 또는 $1,000부터 은행 송금. 처음 저장한 주소는 즉시 적용되며, 나중에 변경하려면 이메일 확인이 필요합니다. 첫 출금 전에 대시보드가 메신저 연락처(WhatsApp, Telegram 또는 Skype)를 요구할 수 있습니다. 요청은 달러 단위로만 지급되며 센트는 잔액에 남습니다."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "프로필의 지급 설정에 저장된 체인(Solana, TON, Arbitrum 또는 Tron)의 USDT, 또는 은행 송금입니다. 주소는 컨테이너가 아니라 Traffmonetizer 설정에 있습니다."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "<a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>에 로그인하고 F12 → Application → Local Storage → <b>authToken</b> 값(약 54자: 숫자, <code>|</code>, 그다음 문자와 숫자)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "추천한 사용자가 요청하는 모든 지급의 10%"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Traffmonetizer 이용 약관은 가정용 IP를 요구하지만, 실제로는 VPS 노드도 허용됩니다."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot 평점은 1.9이며, 2023년부터 2026년 11월까지의 리뷰어들은 지급이 몇 주 동안 대기 상태로 있거나, 완료로 표시되었지만 해당 거래가 없다고 보고합니다."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "같은 리뷰어들은 라이브 채팅과 이메일 지원이 응답하지 않으며, 때로는 몇 주 동안 그렇다고 보고합니다."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "암호화폐 또는 $1,000부터의 은행 송금만 가능합니다. PayPal은 없어졌고, 요청은 달러 단위로만 지급됩니다."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Traffmonetizer 약관은 가정용 IP를 요구하므로, 호스팅 연결의 서버는 약관 범위를 벗어납니다."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "2023년부터 2025년까지 Trustpilot 리뷰어 네 명이 기기 네 대로 하루 1센트, 또는 $10에 도달하는 데 거의 2년이 걸리는 등 수익이 매우 느리다고 보고합니다."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "지급에는 이메일로 확인된 저장된 암호화폐 주소만 있으면 됩니다. 대시보드가 메신저 연락처를 요구할 수 있습니다."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer는 자체 Docker 이미지 traffmonetizer/cli_v2를 공개합니다."
  source: "007cb0d9fa02"
unmineable.description:
  text: "CPU로 채굴하고 SHIB, DOGE, XMR 등 선택한 코인으로 지급받습니다. CashPilot은 unMineable의 RandomX 풀을 대상으로 XMRig를 실행하며, unMineable은 CPU가 채굴한 Monero를 선택한 코인으로 전환합니다. 잔액이 해당 코인의 지급 기준액에 도달하면 공개 주소로 지급합니다. CashPilot이 배포하는 모든 워커에는 CashPilot의 unMineable 추천 코드가 들어가며, 이 코드로 플랫폼 수수료가 1%에서 0.75%로 낮아집니다. 전기 요금이 버는 금액보다 더 많이 들 수 있습니다."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "CPU로 채굴하고 선택한 코인으로 지급받기"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "지급 코인"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "지급 주소"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "워커 이름"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "최대 CPU 스레드(%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "RandomX 모드"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "unMineable이 지급하는 코인의 티커(예: SHIB, DOGE, XMR)"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "해당 코인의 공개 주소입니다. 메모나 태그가 필요한 코인은 지원되지 않습니다."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "전기 요금을 빼기 전의 총 추정치이며, unMineable의 전환 비율로 선택한 코인으로 지급됩니다. 2026-11-25 기준 RandomX 1 kH/s는 월 약 $1의 가치였습니다. 데스크톱 CPU를 스레드 절반으로 돌리면 전력이 30~50 W 더 들 수 있습니다. 수익이 나는지 보려면 실제 사용량과 전기 요금을 확인하십시오."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "unMineable이 코인마다 정함(2026-11-26 기준 0.03 XMR)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "코인의 지급 기준액에 도달할 때"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "잔액이 해당 코인의 지급 기준액에 도달하면 unMineable이 주소로 지급합니다. 기준액은 코인과 네트워크마다 다르며, CashPilot은 unMineable이 주소에 대해 알려 주는 기준액을 읽습니다."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "잔액은 벌었지만 unMineable이 이 주소로 지급할 때까지는 받지 않은 것입니다. 체인은 선택한 코인에 따라 다릅니다."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "채굴기를 배포할 때 사용한 것과 같은 지급 주소와 코인 티커(예: <b>XMR</b>)입니다. 코인, 워커 이름, 추천 코드 없이 주소만 입력하십시오. 공개 정보이며 자금에 접근할 수 없습니다."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "추천한 채굴자 채굴 보상의 0.25%"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "플랫폼 수수료 1%에서 0.75%로 인하"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "이 머신은 호스팅 연결로 보고됩니다. 채굴하기 전에 제공업체의 약관을 확인하십시오. Hetzner Cloud를 포함한 일부 제공업체는 채굴을 금지합니다. 수익 추정치를 믿기 전에 실제 전기 요금을 확인하십시오."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable은 플랫폼 수수료 1%를 부과합니다. CashPilot은 모든 워커 이름 뒤에 추천 코드(#awk6-j1z0)를 붙이며, 이로써 수수료가 0.75%로 낮아집니다. 그러면 unMineable이 채굴 보상의 0.25%를 CashPilot 관리자에게 지급하며, 사용자는 99.25%를 갖습니다. 코인마다 지급 기준액이 있습니다(예: 0.03 XMR)."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "컴퓨팅"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "아니요. 채굴기는 unMineable의 풀로 작업을 보냅니다."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "지급 주소, 코인, 워커 이름, 해시레이트, IP 주소가 unMineable로 전송됩니다."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "일부 네트워크와 DNS 리졸버는 채굴 풀 연결을 차단합니다."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "계정이 필요 없습니다. 주소와 코인이 신원이며, 누구나 unmineable.com에서 그 통계를 볼 수 있습니다."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "unMineable은 추천 코드를 적용해도 플랫폼 수수료 0.75%를 가져가며, 코인별 기준액부터만 지급합니다."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "일부 호스팅 제공업체는 암호화폐 채굴을 금지합니다."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "추가 전기 요금이 번 코인보다 더 많이 들 수 있습니다."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "잔액을 포함한 주소 통계는 주소를 아는 누구에게나 공개됩니다."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "채굴기는 해시를 풀로 보내며 다른 사람의 트래픽을 중계하지 않습니다."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "계정을 만들지 않고도 선택한 코인의 공개 주소로 채굴할 수 있습니다."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock은 인터넷 연결을 공유하여 암호화폐를 받는 DePIN(Decentralized Physical Infrastructure Network) 플랫폼입니다. 더 넓은 Web3 생태계의 일부입니다. 커뮤니티 Docker 이미지는 있지만 공식 이미지는 없습니다. 주요 인터페이스는 브라우저 확장 프로그램입니다.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "DePIN 인터넷 공유 - 암호화폐 지급, 주로 브라우저 확장 프로그램"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "암호화폐/토큰 기반 수익입니다. 공식 Docker 이미지는 없으며 — 주요 클라이언트는 브라우저 확장 프로그램입니다."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
uprock.cashout.notes:
  text: "UPT 토큰이며, 2단계 인증을 켠 상태에서 250 UPT부터 Solana 지갑으로 출금합니다. 출금 수수료가 있습니다."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "UpRock 고객센터에 따르면 출금은 UPT 토큰으로 Solana 지갑에 이루어지며, 최소 250 UPT입니다."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "보상은 UPT 토큰이며, 리뷰어들과 제3자 리뷰는 그 가치가 매우 낮다고 말합니다."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot은 UpRock을 실행하지 않습니다. 제공업체의 자체 앱이나 확장 프로그램을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork는 탈중앙화 VPN 및 대역폭 공유 네트워크입니다. 커뮤니티 제공자로서 대역폭을 제공하여 수익을 얻습니다. 제공자 바이너리는 계정 이메일과 비밀번호로 스스로 인증하고(auth-provide 하위 명령), 그 결과로 받은 세션 JWT를 데이터 볼륨에 저장합니다. BringYour, Inc.의 공식 Docker 이미지입니다.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "탈중앙화 VPN/대역폭 - 이메일+비밀번호 인증, 볼륨에 JWT 세션 저장"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "이메일"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "비밀번호"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "URnetwork 계정 이메일(<a href=\"https://ur.io\" target=\"_blank\">ur.io</a>에서 사용하는 로그인). Google/Apple 로그인으로 만든 계정은 먼저 비밀번호를 설정해야 합니다. 계정이 없습니까? <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>에서 가입하십시오"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "URnetwork 계정 비밀번호(공백 없음). 제공자의 auth-provide 로그인에 사용되며, 이후 세션은 데이터 볼륨에 유지됩니다."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "VPS와 가정용에서 작동합니다. 2026-10-06부터 주간 에포크마다 SN25α(Bittensor 서브넷 25)로 지급됩니다. 여러 IP 구성을 위한 프록시 모드를 지원합니다."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "에포크 단위"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "ur.io/app/account/earnings에서 Bittensor 콜드키를 설정한 다음(Talisman, TAO.com 또는 WalletConnect 지갑으로 서명), 확정된 에포크마다 수령하십시오. 수령 시 EVM 가스 키에서 TAO로 가스비를 냅니다. 수령하지 않은 에포크는 만료되며, 이전 USDC 지급은 30일 이내에 지갑을 연결하지 않으면 취소되었습니다."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "친구 한 명당 하루 3 GiB의 무료 UR 데이터, 최대 친구 20명(돈이 아닌 데이터)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "가입 후 90일 이내에 2일 동안 앱으로 최소 10 MiB를 사용하면 하루 3 GiB의 무료 UR 데이터. 그렇지 않으면 추천이 종료됩니다"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "수령하지 않은 에포크는 만료되며, 이전 USDC 지급은 30일 이내에 지갑을 연결하지 않은 네트워크에 대해 취소되었습니다."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "2026년 10월부터 보상은 Bittensor 서브넷 토큰인 SN25α로 지급되며, 수령할 때마다 TAO로 가스비가 듭니다."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork의 이전 이름은 BringYour이며, 보관된 백서에는 이전 이름이 남아 있습니다."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork는 제공자 클라이언트의 소스 코드를 공개합니다."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork는 자체 Docker 이미지 bringyour/community-provider를 공개하며, VPS와 가정용 연결에서 작동합니다."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "수령에는 본인이 관리하는 Bittensor 지갑만 있으면 됩니다."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai는 NVIDIA GPU를 AI/ML 연구자와 개발자에게 임대하는 GPU 클라우드 마켓플레이스입니다. 시간당 가격을 직접 정하는 Docker 기반 플랫폼입니다. RTX 3090은 임대 시 보통 $0.20-0.40/시간을 법니다. 최신 드라이버가 설치된 NVIDIA GPU와 안정적인 인터넷 연결이 필요합니다. 수익은 GPU 모델, 가격 전략, 시장 수요에 따라 크게 달라집니다.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "GPU 마켓플레이스 - 가격 직접 설정, RTX 3090 ~$0.20-0.40/시간"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "API 키"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "대시보드의 Vast.ai 호스트 API 키"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "임대 시 RTX 3090 ~$0.20-0.40/시간, RTX 4090 ~$0.40-0.80/시간. 사용률은 변동합니다. NVIDIA GPU, Linux 호스트, Docker, nvidia-container-toolkit이 필요합니다. 가격은 직접 정합니다."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "매주(금요일)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "수익은 Vast.ai 잔액에 쌓입니다. Wise, PayPal 또는 Stripe로 출금합니다."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "추천한 임차인이 쓰는 금액의 3%, 그 계정이 유지되는 동안 추천 크레딧으로 지급. 최대 75%를 전용 추천 계정에서 현금으로 출금할 수 있습니다"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "호스트는 임대되는 동안에만 벌며, 소비자용 GPU에 대한 Vast 자체 수치는 임대 유형과 신뢰도 점수에 따라 다릅니다."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot은 Vast.ai를 실행하지 않습니다. 본인 GPU 머신에 Vast의 호스트 소프트웨어를 설치하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. Vast는 Linux 호스트의 Docker를 중심으로 호스팅을 구성합니다."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Vast에 따르면 호스트가 정한 요율을 수수료 공제 없이 그대로 받습니다."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "지급은 최소 $20부터 Wise, PayPal 또는 Stripe로 이루어지며 매주 정산되고, 그보다 적은 잔액은 다음 주로 이월됩니다."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter는 Windows, Mac, Linux, Android에서 사용할 수 있는 대역폭 공유 플랫폼입니다. 공유한 대역폭에 대해 최대 $1/GB를 지급한다고 주장하며, 최소 지급 기준액은 $20입니다. 이 플랫폼은 전통적인 대역폭 공유 앱과 비슷하게 작동하며, 정당한 트래픽을 가정용 연결로 보냅니다.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "대역폭 공유 - 최대 $1/GB 주장, 최소 지급액 $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "최대 $1/GB라고 주장하지만 실제 수익은 더 낮습니다. 최소 지급액은 $20입니다. 수익은 위치와 수요에 따라 크게 달라집니다."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter에는 웹 대시보드가 없습니다. Wipter 데스크톱 앱이나 휴대폰 앱을 열고 로그인한 다음, 잔액이 $20에 도달하면 거기서 지급을 요청하십시오. Wipter는 BNB Smart Chain(BEP20)의 USDT로만, 앱의 Payments 섹션에서 설정한 지갑으로 지급합니다. PayPal 옵션은 없습니다."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "아직 정해지지 않았습니다. CashPilot이 이 서비스가 수익을 어디에 보관하는지 아직 확인하지 않았습니다."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "추천한 사용자가 지급 최소 금액에 도달하면 그 트래픽 수익의 10%, 추천 인원 제한 없음"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "$5 가입 보너스"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot은 Wipter를 실행하지 않습니다. 제공업체의 자체 데스크톱 앱이나 휴대폰 앱을 사용하므로 CashPilot이 대신 배포하거나 업데이트할 수 없습니다. 컨테이너 사용에 관한 약관은 확인하지 않았습니다."
  source: "fa32942c6b4f"
xmrig.description:
  text: "CPU로 Monero를 채굴합니다. CashPilot은 XMRig를 실행하며, 선택한 풀이 공개 지급 주소로 Monero를 지급합니다. XMRig는 개발자를 지원하기 위해 해싱 시간의 1%를 사용합니다. 전기 요금이 버는 XMR보다 더 많이 들 수 있습니다."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "CPU와 원하는 풀로 Monero 채굴"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Monero 주소"
  source: "a888ebb3ae9b"
xmrig.docker.env.POOL_URL.label:
  text: "풀"
  source: "f13024272c38"
xmrig.docker.env.WORKER_NAME.label:
  text: "워커 이름"
  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "최대 CPU 스레드(%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "RandomX 모드"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "전기 요금을 빼기 전의 총 추정치입니다. 2026-11-25 기준, 관측된 XMR 가격과 네트워크 난이도에서 1 kH/s는 월 약 $1의 가치였습니다. 데스크톱 CPU를 스레드 절반으로 돌리면 전력이 30~50 W 더 들 수 있습니다. 수익이 나는지 보려면 실제 사용량과 전기 요금을 확인하십시오."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR(MoneroOcean, 기준액을 낮춘 경우)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "풀 기준액에 도달할 때"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "잔액이 기준액에 도달하면 풀이 Monero 주소로 지급합니다. 지급할 때까지 풀이 잔액을 보유합니다."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "이 머신은 호스팅 연결로 보고됩니다. 채굴하기 전에 제공업체의 약관을 확인하십시오. Hetzner Cloud를 포함한 일부 제공업체는 채굴을 금지합니다. 수익 추정치를 믿기 전에 실제 전기 요금을 확인하십시오."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "기본 풀인 MoneroOcean은 채굴 수수료 0%를 부과합니다. 기본 지급 기준액은 0.3 XMR이며 0.003 XMR까지 낮출 수 있습니다. 4 XMR 미만의 지급에는 최대 0.0004 XMR의 비용이 들 수 있습니다. 다른 풀은 자체 요율과 기준액을 정합니다."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "컴퓨팅"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "아니요. 채굴기는 채굴 풀로 작업을 보냅니다."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Monero 주소, 워커 이름, IP 주소가 풀로 전송됩니다."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "일부 네트워크와 DNS 리졸버는 채굴 풀 연결을 차단합니다."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "대부분의 Monero 풀은 공개 지급 주소로 사용자를 식별합니다."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "지급을 받으려면 풀 기준액을 채울 만큼의 XMR이 필요합니다."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "일부 호스팅 제공업체는 암호화폐 채굴을 금지합니다."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "추가 전기 요금이 번 XMR보다 더 많이 들 수 있습니다."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "채굴기는 해시를 풀로 보내며 다른 사람의 트래픽을 중계하지 않습니다."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "채굴기는 오픈 소스이며, 이미지는 서명된 업스트림 릴리스로 고정되어 있습니다."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "이름으로 신원을 밝히지 않고 공개 Monero 주소로 채굴할 수 있습니다."
  source: "752cbb728aac"
