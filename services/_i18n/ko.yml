  source: "985d03ae1755"
proxybase.rating.pros.2.text:
  text: "ProxyBase는 자체 피어 클라이언트 이미지를 공개하고 데이터 센터 IP를 지원합니다."
  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets는 AI 에이전트를 위한 SOCKS5 프록시 마켓플레이스입니다. 판매자는 WebSocket으로 연결하여 구매자 트래픽을 자신의 인터넷 연결로 중계하는 가벼운 Rust CLI 데몬을 실행하고, 판매한 GB마다 Tempo Chain에서 USDC를 받습니다. direct(자체 대역폭)와 upstream(외부 프록시 재판매) 모드를 모두 지원하며 자동으로 다시 연결합니다. 구매자는 국가, ISP, 대역폭별로 프록시 세션을 구매합니다. 지급은 Tempo Chain의 Machine Payments Protocol(MPP)로 이루어집니다. 추천 링크는 구매자용입니다: 이 링크로 콘솔을 연 구매자는 첫 입금 시 10%를 추가로 받습니다.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - AI 에이전트용 SOCKS5 마켓플레이스, USDC 지급. 키의 유일한 사본이 볼륨에 저장되는 지갑을 생성"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "백엔드 API URL"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "백엔드 API URL을 재정의합니다(기본값 https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "컨테이너는 첫 시작 시 스스로 초기 설정을 합니다: secp256k1 지갑(BIP-39)을 생성하고, ECDSA 챌린지-응답으로 인증한 뒤, direct 전용 모드로 대역폭 판매를 시작합니다. 모든 상태(지갑, 세션 토큰, 판매자 설정)는 <code>proxybase-data</code> 볼륨에 저장됩니다. 처음 실행할 때 컨테이너 로그에서 지갑 주소를 확인하십시오. 외부 프록시 재판매 경로를 추가하려면 <code>--upstream</code>을 사용하십시오.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "생성된 지갑 키 파일입니다. 이 볼륨이 곧 돈입니다: 서버 측 사본이 없으므로 이를 삭제하면 자금도 함께 사라집니다."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "수익은 시장 가격으로 판매된 GB를 기준으로 합니다. VPS/데이터 센터 IP는 가정용보다 덜 법니다. 멀티 upstream 모드로 자체 대역폭과 외부 프록시를 함께 사용할 수 있습니다."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "요청 시"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "<code>proxybase-cli seller payout create</code>로 수익을 확정하면 Tempo Chain의 USDC(Tempo MPP)로 받습니다. 본인이 키를 가진 EVM 주소라면 어디로든 지급되며(Tempo는 EVM 체인입니다), 서명할 것은 없습니다. USDC를 보려면 지갑에 Tempo 네트워크를 추가하십시오. 그래도 표시되지 않는 지갑에는 Tempo USDC 토큰을 직접 추가해야 합니다: Proxybase가 알려 주는 컨트랙트 주소로 가져오고, 잔액을 믿기 전에 그 주소를 확인하십시오."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "클라이언트는 첫 실행 시 자체 지갑을 생성합니다."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "추천한 구매자가 하는 모든 입금의 15%, 본인의 프록시 세션용 크레딧으로 지급"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "구매자의 첫 입금 시 +10%"
  source: "6bae1a2e30d6"
