bytelixir.collector.credential_hint:
  text: "<a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a>에 <b>Remember Me를 체크하고</b> 로그인한 뒤 F12 → Application → 왼쪽 사이드바에서 <b>Cookies</b> 펼치기 → <code>https://dash.bytelixir.com</code> 클릭, 그다음 세 값을 복사하십시오: <b>bytelixir_session</b>, <b>remember_web_…</b>(이 접두사로 시작하는 긴 값), <b>XSRF-TOKEN</b>. 세션 쿠키만 있으면 복사한 지 약 2시간 뒤에 만료되어 같은 날 오후에 수집이 멈춥니다. remember_web 쿠키는 1년 동안 유효하며 수집이 계속되게 해 줍니다."
