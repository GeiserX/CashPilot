  source: "155106be1173"
proxyrack.docker.env.UUID.description:
  text: "Unikalny 64-znakowy szesnastkowy ID dla każdego urządzenia. Wygeneruj go poleceniem: cat /dev/urandom | tr -dc 'a-f0-9' | fold -w 64 | head -n 1"
  source: "5de5d7264318"
proxyrack.docker.env.API_KEY.description:
  text: "Zaloguj się na <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → klucz API jest widoczny na głównej stronie panelu (jeśli go podasz, urządzenie zarejestruje się automatycznie). Potrzebujesz konta? Zarejestruj się przez <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
  source: "96df71a6ca26"
proxyrack.docker.env.DEVICE_NAME.description:
  text: "Przyjazna nazwa urządzenia w panelu"
  source: "df01af60b81c"
proxyrack.docker.health_signals.0.means:
  text: "Klient ProxyRack nie może działać na tej kopii, więc nic nie zarabia. Zwykle przyczyną jest to, że serwer aktualizacji ProxyRack nie odpowiada, a bez niego klient nie może się uruchomić. Kopia próbuje ponownie co 5 minut i uruchamia się sama, gdy tylko serwer odpowie. Nie musisz nic naprawiać."
  source: "0df8b8cfac10"
proxyrack.docker.health_signals.1.means:
  text: "Klient ProxyRack nie został pobrany przy starcie tej kopii, bo serwer aktualizacji ProxyRack był nieosiągalny, więc kopia działa, ale nic nie zarabia. CashPilot uruchamia ją ponownie co 6 godzin, żeby spróbować jeszcze raz. Wdróż ją ponownie, aby dostała własny start CashPilot, który zachowuje klienta i sam próbuje ponownie co 5 minut."
  source: "0a2ee4b478b2"
proxyrack.device_link.steps:
  text: "Zaloguj się do ProxyRack, otwórz Devices, wybierz Add device i wklej ten UUID. Dopóki urządzenie nie jest na Twoim koncie, nie zarabia dla nikogo. Jeśli podano klucz API, kontener rejestruje się sam: sprawdź, czy urządzenie jest tam na liście."
  source: "54c4041903b5"
proxyrack.earnings.notes:
  text: "IP domowe zarabiają więcej niż z centrów danych. Panel za Cloudflare może utrudniać automatyczny dostęp."
  source: "b6e36d751afd"
proxyrack.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
proxyrack.cashout.notes:
  text: "Zleć wypłatę w panelu. ProxyRack sprawdza ją w ciągu 72 godzin, a potem Tremendous wysyła Ci e-mailem nagrodę do wymiany na PayPal, kartę podarunkową lub przelew bankowy. Nie ma opcji kryptowalutowej."
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "Saldo przechowuje ProxyRack; wypłacane na żądanie."
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "Zaloguj się na <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, naciśnij F12 → Network, znajdź dowolne zapytanie API i skopiuj wartość nagłówka <b>Api-Key</b>. Potrzebujesz konta? Zarejestruj się przez <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
