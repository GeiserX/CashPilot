  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB dziennie darmowych danych UR, gdy w ciągu 90 dni od dołączenia przez 2 dni zużyjesz w aplikacji co najmniej 10 MiB; w przeciwnym razie polecenie wygasa"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
