vast-ai.description:
  text: "Vast.ai to chmurowy rynek GPU, na którym wynajmujesz swoją kartę NVIDIA badaczom i programistom AI/ML. Platforma natywnie oparta na Dockerze, na której samodzielnie ustalasz stawki godzinowe. RTX 3090 zwykle zarabia $0.20-0.40/godz., gdy jest wynajęta. Wymaga karty NVIDIA z aktualnymi sterownikami i stabilnego łącza internetowego. Przychód mocno zależy od modelu GPU, strategii cenowej i popytu na rynku.\n"
