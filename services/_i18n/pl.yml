xmrig.earnings.notes:
  text: "Szacunek brutto, przed kosztami prądu. 2026-11-25 1 kH/s był wart około $1 miesięcznie przy zaobserwowanej cenie XMR i trudności sieci. Procesor desktopowy na połowie wątków może pobierać dodatkowe 30 do 50 W. Sprawdź swoje rzeczywiste zużycie i cenę prądu, aby zobaczyć, czy to się opłaca."
