  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Ustaw coldkey Bittensor na ur.io/app/account/earnings (podpisany w Talisman, TAO.com lub portfelu WalletConnect), a potem odbieraj każdą zakończoną epokę. Odbiór płaci gas w TAO z klucza gas EVM. NIEODEBRANE EPOKI WYGASAJĄ, a stare wypłaty USDC anulowano, gdy w ciągu 30 dni nie powiązano portfela."
  source: "3b2d56971147"
