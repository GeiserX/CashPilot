repocket.cashout.notes:
  text: "Repocket ustala minimum dla każdego konta: w październiku 2026 było to $4 przed pierwszą wypłatą i $2 po niej, znacznie poniżej $20, które kiedyś reklamował. Metody: Tremendous (na Twój e-mail) lub USDT w sieci Polygon. Każde zlecenie potwierdzasz linkiem z e-maila w ciągu 2 godzin, a naraz może oczekiwać tylko jedno zlecenie. W październiku 2026 Repocket odrzucił zlecenie Tremendous komunikatem „Please, message support”, a USDT w sieci Polygon przeszło."
