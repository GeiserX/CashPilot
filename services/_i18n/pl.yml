repocket.rating.cons.0.text:
  text: "Kilku recenzentów na Trustpilot zgłasza anulowane wypłaty i salda wyzerowane; jeden pisze, że wsparcie powołało się na nieprawidłowe zarobki z przepustowości. Strona ocenia Repocket na 2.7 i zaznacza, że nie odpowiedział on na negatywne opinie."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Recenzenci zgłaszają odrzucone wypłaty i konieczność upominania się o płatność."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Zasady płatności Repocket pozwalają mu cofnąć, anulować lub trwale unieważnić zarobki, gdy tylko podejrzewa, że są nieprawidłowe, a także anulować niewypłacone zarobki nieaktywnego konta."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "Te same zasady pozwalają Repocket w dowolnej chwili bez uprzedzenia dodawać, usuwać lub zmieniać metody wypłat; PayPal został usunięty."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Regulamin mówi, że Repocket może w dowolnej chwili wymagać weryfikacji tożsamości lub konta, a prawo do wypłaty od niej zależy."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Regulamin mówi, że Repocket i jego partnerzy korzystają z przepustowości sieci, ale nie podaje, kim są partnerzy ani jak są weryfikowani."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot zaznacza, że Repocket nie odpowiedział na negatywne opinie, a recenzenci piszą, że wiadomości są ignorowane."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "Obecny regulamin podaje Repocket Pte. Ltd. w Singapurze; starszy nie podawał żadnej firmy."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket publikuje własny obraz Docker, repocket/repocket, a jego regulamin dopuszcza kontenery, które należą do Ciebie."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Minimum jest niskie: $4 przed pierwszą wypłatą i $2 po niej."
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io pozwala udostępniać GPU do rozproszonych zadań AI i zarabiać saldo Salad wymienialne na karty podarunkowe, gry lub gotówkę. Tylko Windows, z natywną aplikacją desktopową. Wymaga dedykowanego GPU (NVIDIA lub AMD). Platforma kieruje na Twoją maszynę wnioskowanie AI, renderowanie i inne zadania obliczeniowe, gdy jest bezczynna. To jedna z bardziej przyjaznych dla użytkownika platform udostępniania GPU.\n"
  source: "09335baccea6"
salad.short_description:
  text: "Udostępnianie GPU dla AI - tylko Windows, wypłata w kartach podarunkowych lub gotówce"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Zarobki zależą od modelu GPU i dostępności pracy. RTX 3060 ~$1-3/dzień. Tylko Windows. Natywna aplikacja, bez obsługi Dockera. Do wymiany na karty podarunkowe, gry lub PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal lub karty podarunkowe przez sklep Salad."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Tylko PayPal i karty podarunkowe, nigdy kryptowaluty. Nie ma adresu portfela, więc CashPilot nie ma salda on-chain do pokazania."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Zaloguj się na <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, naciśnij F12 → Application → Cookies, skopiuj wartość ciasteczka <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Zarób trochę Salad Reward Points albo wydaj saldo"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Jeśli konto nie zarobi żadnych Reward Points przez 12 miesięcy z rzędu, jego niewymienione saldo może wygasnąć."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Uruchom aplikację Salad, aż zacznie zarabiać, albo wydaj całe saldo w Salad Storefront. Wydanie tylko części nie resetuje 12 miesięcy."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot nie uruchamia Salad: korzystasz z własnej aplikacji desktopowej dostawcy, więc CashPilot nie może jej za Ciebie wdrożyć ani zaktualizować. Jej regulaminu nie sprawdzono pod kątem kontenerów."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Kilku recenzentów na Trustpilot w październiku i listopadzie 2026 zgłasza, że wypłaty PayPal przychodzą szybko, u niektórych więcej niż raz; jeden recenzent z tego samego okresu pisze, że kolejne próby wypłaty się nie udały."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel to blockchain Layer 1 w ekosystemie Cosmos do zdecentralizowanego VPN. Operatorzy węzłów sprzedają przepustowość użytkownikom VPN z elastycznymi cenami (za GB lub za godzinę). Dostępny jest oficjalny przewodnik wdrożenia w Dockerze. Projekt działa od dawna i ma aktywną społeczność.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "Zdecentralizowany VPN w Cosmos - operatorzy węzłów sprzedają przepustowość"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Operatorzy sami ustalają ceny za GB lub za godzinę. Zarobki zależą od popytu użytkowników VPN w Twoim regionie."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Za sesję"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Płatności są w tokenie P2P, a 20% każdej płatności za przepustowość trafia do stakerów, a nie do hosta węzła."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "Token zmienił nazwę z SENT na DVPN w 2021 i z DVPN na P2P w 2025."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot nie uruchamia Sentinel: korzystasz z własnego oprogramowania węzła dostawcy, więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować. Jego regulaminu nie sprawdzono pod kątem kontenerów."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel publikuje kod źródłowy węzła na własnej licencji open source."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia to zdecentralizowany rynek przestrzeni dyskowej prowadzony przez Sia Foundation (szwajcarską organizację non-profit), działający od 2015. Uruchom oficjalny węzeł hostd Fundacji, aby wynajmować wolne miejsce na dysku i zarabiać Siacoin z kontraktów na przechowywanie i transfer. Zanim węzeł zacznie zarabiać, musisz kupić trochę Siacoin: hosty blokują zabezpieczenie (collateral) przy każdym kontrakcie i płacą opłatę za każdy dowód przechowywania. Zabezpieczenie wraca po zakończeniu kontraktu i jest spalane, jeśli węzeł przestanie działać lub utraci dane, więc potrzebna jest maszyna działająca bez przerwy (Sia podaje co najmniej 95% czasu działania). Zarobki zależą od tego, ile danych najemcy faktycznie przechowują; Sia zaleca cenę $1 za TB miesięcznie, więc nadaje się to do maszyn z dużymi wolnymi dyskami, a nie do małych VPS.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Węzeł przestrzeni dyskowej Sia Foundation - oficjalny obraz Docker, zarabiaj Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Fraza seed portfela"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Hasło do panelu"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Katalog danych"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "Fraza seed BIP-39, która kontroluje portfel Siacoin hosta. Wygeneruj ją poleceniem `docker run --rm ghcr.io/siafoundation/hostd seed` i zrób jej kopię zapasową -- to JEDYNY sposób dostępu do zarobków"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Hasło do interfejsu WWW hostd i lokalnego API (BasicAuth). Dowolne długie hasło"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Ścieżka na hoście, na Twoim największym dysku, gdzie przechowywane są dane najemców (np. /srv/sia). Wymaga co najmniej 256GB wolnego miejsca"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Przy wdrożeniu CashPilot tworzy nowy portfel na maszynie, na której działa węzeł, i jeden raz pokazuje jego frazę seed: zapisz ją. Aby użyć portfela, który już masz, wklej zamiast tego jego frazę seed. Po wdrożeniu wyślij trochę Siacoin na portfel węzła na zabezpieczenie i opłaty, a potem w panelu dodaj folder danych (/storage), ustaw ceny i ogłoś hosta.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "Fraza seed portfela (hostd.yml), baza danych portfela, ustawienia hosta i stan kontraktów. Ich utrata oznacza utratę tożsamości węzła i śledzenia przychodów z kontraktów; zapisana przez Ciebie fraza seed jest wtedy jedynym sposobem odzyskania środków."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Przechowywane dane najemców. Ich utrata powoduje niezaliczenie dowodów przechowywania i przepadek zabezpieczenia zablokowanego przy tych kontraktach."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Hosty same ustalają ceny. Sia zaleca $1 za przechowywany TB miesięcznie i ponad $5 za pobrany TB, a 3.9% każdej wypłaty z kontraktu trafia do posiadaczy Siafund. Przychód rośnie wraz z ilością danych najemców trafiających na węzeł, która zaczyna się od zera i rośnie wraz z czasem działania i ceną. Zabezpieczenie (Sia sugeruje 2x cena przechowywania) jest blokowane przy każdym kontrakcie i zwracane po jego pomyślnym zakończeniu.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Zarobki narastają we własnym portfelu Siacoin hosta (kontrolowanym frazą seed). Wymień SC na giełdzie i stamtąd wypłać na konto bankowe lub kartę; nie ma zlecenia wypłaty po stronie dostawcy.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Środki są w kontrolowanym frazą seed portfelu Sia wewnątrz węzła. Fraza seed jest tylko w wolumenie danych hostd na maszynie, na której działa; CashPilot nigdy jej nie przechowuje. Fraza zapisana przy tworzeniu portfela to jedyny sposób odzyskania.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Stały publiczny adres z przekierowanymi portami 9981 (TCP, konsensus) i 9984 (TCP i UDP, kontrakty najemców). Hosting w centrach danych i na VPS jest w Sia powszechny. Portfel potrzebuje Siacoin, zanim węzeł będzie mógł przyjmować kontrakty."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Miejsce na dysku i przepustowość do jego udostępniania."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Nie. Najemcy przechowują zaszyfrowane fragmenty plików na Twoim dysku i pobierają je z powrotem. Inni ludzie nie kierują dowolnego ruchu przez Twój IP."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Adres Twojego portfela Sia, klucz publiczny hosta oraz publiczny IP:port, który węzeł ogłasza, aby najemcy mogli się z nim połączyć."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Stały ruch wysyłania i pobierania na łączu, podobnie jak przy każdym serwerze danych; żaden zanonimizowany ruch WWW osób trzecich nie jest przypisywany Tobie."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Bez zezwoleń: bez rejestracji i konta. Zabezpieczenie jest spalane, jeśli węzeł nie dostarczy dowodów przechowywania, bo przestał działać lub utracił dane."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Zarobki to Siacoin w Twoim własnym portfelu: nie ma wypłaty na konto bankowe, więc sprzedajesz je samodzielnie na giełdzie."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "Zabezpieczenie jest blokowane przy każdym kontrakcie i spalane, jeśli host nie dostarczy dowodów przechowywania, bo przestał działać lub utracił dane."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Używane jest tylko około 30% przestrzeni oferowanej w sieci, więc nowy host konkuruje o niewielki popyt."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Najemcy przechowują zaszyfrowane fragmenty plików i nikt nie kieruje ruchu przez Twój IP, ale nie znaleźliśmy miejsca, w którym Sia podaje, kim są najemcy ani jak są weryfikowani."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd jest rozwijany otwarcie przez Sia Foundation od 2022."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd jest otwartoźródłowy, na licencji MIT."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Sia Foundation publikuje hostd jako obraz kontenera."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Bez zezwoleń: bez rejestracji i konta."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide to usługa udostępniania przepustowości, która pozwala zarabiać na nieużywanej przepustowości internetu. Używa opcjonalnego ID maszyny do śledzenia urządzenia. Dostępna przez społecznościowe obrazy Docker z projektu income-generator.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Udostępnianie przepustowości - oparte na ID maszyny"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "ID maszyny"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "ID maszyny dla istniejącego, już zarejestrowanego urządzenia (generowany automatycznie, jeśli puste)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Dostępnych jest niewiele informacji. Zarobki zależą od lokalizacji."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
spide.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% ich zarobków"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "$5 bonusu za rejestrację"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "Ruch przez jeden publiczny IP jest dzielony między urządzenia, które z niego korzystają, więc drugie urządzenie na tym samym łączu nic nie dodaje."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot nie uruchamia Spide: korzystasz z własnej aplikacji dostawcy, więc CashPilot nie może jej za Ciebie wdrożyć ani zaktualizować. Jej regulaminu nie sprawdzono pod kątem kontenerów."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Kop Pearl, Zano lub Ravencoin na jednej karcie NVIDIA. CashPilot przy pierwszym uruchomieniu pobiera oficjalne wydanie SRBMiner-Multi i sprawdza jego SHA-256. Wybrana przez Ciebie pula płaci na Twój publiczny adres wypłat. SRBMiner-Multi zatrzymuje 2% czasu haszowania przy Pearl i 0.85% przy dwóch pozostałych. Prąd może kosztować więcej niż zarobione monety."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Kop Pearl i inne monety GPU na karcie NVIDIA"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Adres wypłat"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "Nazwa workera"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "Algorytm"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "Pula (host:port)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "Szyfruj połączenie z pulą (TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "Twój publiczny adres Pearl (prl1...). Dla Zano lub Ravencoin wpisz adres tej monety i pulę dla niej."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash dla Pearl, progpow_zano dla Zano, kawpow dla Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.earnings.notes:
  text: "Szacunek brutto, przed kosztami prądu. 2026-11-25 hashrate.no szacował około $2.45 dziennie na Pearl dla RTX 4070 pobierającej około 142 W. Nie zmierzyliśmy tego. Pearl to nowa moneta, a jej cena i trudność szybko się zmieniają. Sprawdź pobór mocy swojego GPU i cenę prądu, aby zobaczyć, czy to się opłaca."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Po osiągnięciu progu puli"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "Pula płaci na Twój adres, gdy saldo osiągnie Twój próg. Do tego czasu saldo przechowuje pula."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, karta NVIDIA i NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Ta maszyna zgłasza łącze hostingowe. Przed kopaniem sprawdź regulamin swojego dostawcy. Niektórzy dostawcy, w tym Hetzner Cloud, tego zabraniają. Zanim zaufasz szacunkowi zysku, sprawdź swoje rzeczywiste koszty prądu."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "Opłata minera 2% dotyczy pearlhash. Przy progpow_zano i kawpow SRBMiner-Multi zatrzymuje 0.85%. HeroMiners, domyślna pula dla Pearl, pobiera opłatę puli 1%. Sprawdza wypłaty co godzinę i płaci od 1 PRL. Inne pule ustalają własne stawki i progi."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "moc obliczeniowa"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "Nie. Miner wysyła wyniki do wybranej przez Ciebie puli."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Twój adres wypłat, nazwa workera i adres IP trafiają do puli. Pierwsze uruchomienie pobiera minera z GitHuba."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Niektóre sieci i serwery DNS blokują połączenia z pulami kopania."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "Większość pul identyfikuje Cię po publicznym adresie wypłat."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "Miner zatrzymuje 2% czasu haszowania przy Pearl i 0.85% przy Zano i Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Niektórzy dostawcy hostingu zabraniają kopania kryptowalut."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "Miner ma zamknięty kod, więc nikt poza jego twórcą nie może sprawdzić, co uruchamia."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "Prąd zużywany przez GPU może kosztować więcej niż zarobione monety, a cena Pearl szybko się zmienia."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "Miner wysyła wyniki do puli i nie przekazuje niczyjego ruchu."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Możesz kopać Pearl w HeroMiners z publicznym adresem i bez konta."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj to zdecentralizowana sieć przechowywania danych w chmurze, w której zarabiasz, wynajmując nieużywane miejsce na dysku. Uruchom węzeł przez Dockera i otrzymuj $1.35/TB przechowywanych danych miesięcznie plus $1/TB transferu wychodzącego (stawki od 1 września 2026). Wypłaty są miesięczne, w USDC, stablecoinie powiązanym z dolarem amerykańskim, w sieci głównej Ethereum, na portfel, który kontrolujesz, gdy saldo przekroczy minimum zależne od opłat (do wypłaty za wrzesień 2026 w tokenie STORJ). Wymaga co najmniej 550GB wolnego miejsca na dysku i stabilnego łącza internetowego. Nie potrzeba konta ani rejestracji -- od połowy 2025 węzły nie wymagają zezwoleń. UWAGA (październik 2026): Storj Labs złożył 26 lipca 2026 wniosek o postępowanie Chapter 11 (Sąd Upadłościowy USA, Northern District of West Virginia, sprawa 5:26-bk-00512), aby zrestrukturyzować dawne zadłużenie. Sieć nadal działa, a Storj nadal płaci aktywnym węzłom, ale zarobki węzłów sprzed złożenia wniosku są zamrożone do czasu rozstrzygnięcia przez sąd. Token STORJ jest o około 98% niżej niż na szczycie z 2021. Binance usunął go z notowań 3 września 2026, a Coinbase zawiesił handel nim 28 września 2026. Nowy węzeł przez pierwsze dziewięć miesięcy zatrzymuje część zarobków i zapełnia się tylko na tyle, na ile pozwala popyt klientów, więc uruchomienie go teraz wiąże długi okres zwrotu z firmą w restrukturyzacji, która nadal może zostać zlikwidowana.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Zdecentralizowany węzeł przestrzeni dyskowej - $1.35/TB przechowywania + $1/TB transferu wychodzącego"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Adres portfela"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "E-mail"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "Adres zewnętrzny"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Przydział miejsca"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Katalog tożsamości"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Katalog danych"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Adres portfela Ethereum do wypłat w USDC (np. 0x1234...abcd). Musi to być portfel z własną kontrolą kluczy (MetaMask, Ledger itp.) -- nigdy nie używaj adresu z giełdy"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "Adres e-mail na powiadomienia dla operatora"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "Nazwa hosta DDNS z portem (np. mynode.ddns.net:28967) -- zdecydowanie lepsza niż dosłowny IP, który odetnie węzeł w dniu, w którym Twój dostawca internetu po cichu go zmieni. Port 28967 musi być przekierowany (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Maksymalne miejsce na dysku do przydzielenia (np. 2TB). Używaj dysków talerzowych (HDD), nie SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Ścieżka na hoście, w której przechowywane są pliki tożsamości (musi zawierać ca.cert, ca.key, identity.cert, identity.key)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Ścieżka na hoście, na dysku talerzowym (HDD), na dane Storj. Wymaga co najmniej 550GB wolnego miejsca"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Przed pierwszym uruchomieniem zainicjuj konfigurację węzła: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Tożsamość węzła. Jej ID jest powiązane z proof-of-work, a ponowne wygenerowanie zajmuje godziny; nie da się jej odtworzyć z kopii zapasowej czegokolwiek innego. Jej utrata oznacza przepadek wstrzymanego salda wypłat."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Przechowywane dane klientów i wstrzymana kwota węzła. Ich utrata dyskwalifikuje węzeł i oznacza przepadek wstrzymanego salda."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Sieć Storj nie może połączyć się z Twoim węzłem pod ogłaszanym ADDRESS, więc satelity uznają go za niedostępny: nowe dane przestają napływać, przychód z transferu wychodzącego staje, a dłuższa niedostępność prowadzi do zawieszenia. Sprawdź, czy ADDRESS odpowiada Twojemu OBECNEMU publicznemu IP (użyj nazwy hosta DDNS, a nie dosłownego IP, aby zmiana adresu przez dostawcę internetu nie odcięła węzła) i czy port 28967 TCP+UDP jest przekierowany na tę maszynę."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB przechowywania + $1/TB transferu wychodzącego + $1/TB audytu/naprawy od 1 września 2026. Zarobki rosną wraz z ilością przechowywanych danych i wiekiem węzła. Przez pierwsze 9 miesięcy wstrzymywane jest 75%, potem 50%, potem 25% zarobków; połowa wstrzymanej kwoty wraca w 16. miesiącu, a reszta przy kontrolowanym wyjściu (graceful exit). Port 28967 musi być przekierowany."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4x opłata transakcyjna Ethereum, mniejsze salda przechodzą na kolejny miesiąc"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Co miesiąc"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Wypłacane co miesiąc w USDC w sieci głównej Ethereum, gdy saldo portfela wynosi co najmniej czterokrotność bieżącej opłaty transakcyjnej; mniejsze salda przechodzą na kolejny miesiąc. Do wypłaty za wrzesień 2026 w tokenie STORJ. Panel na porcie 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Wypłacane co miesiąc w USDC w sieci głównej Ethereum na adres z WALLET, gdy saldo przekroczy minimum zależne od opłat. Do wypłaty za wrzesień 2026 w tokenie STORJ; wypłaty przez zkSync Era zakończyły się 1 września 2026."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "URL panelu węzła na porcie 14002, z adresem IP serwera w sieci LAN zamiast localhost, na przykład <b>http://192.168.1.10:14002</b>. Przy kilku węzłach podaj ich URL-e rozdzielone przecinkami: CashPilot je zsumuje."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Węzły Storj w tej samej podsieci /24 dzielą przydział danych, co obniża zarobki każdego węzła."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps wysyłania"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Miejsce na dysku i przepustowość do jego udostępniania."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Nie. Przechowujesz zaszyfrowane fragmenty danych klientów zakodowane kodem korekcyjnym (erasure coding). Inni ludzie nie kierują swojego ruchu przez Twój IP."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "Tożsamość węzła, adres Twojego portfela, adres e-mail wymagany przez węzeł do powiadomień dla operatora oraz Twój IP i port, które muszą być osiągalne, aby węzeł mógł udostępniać dane."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "Głównie kwestia limitu danych, a nie odpowiedzialności: węzeł bez przerwy wysyła i przyjmuje dane klientów, co oznacza realny, stały ruch na Twoim łączu. W przeciwieństwie do proxy lub przekaźnika nie jest to jednak zanonimizowany ruch osób trzecich przypisywany Tobie jako źródłu, więc nie ściąga skarg na nadużycia, jak tamte."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Bez limitu węzłów, ale węzły w tej samej podsieci /24 dzielą przydział, więc kilka węzłów na jednym łączu zarabia każdy mniej."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk podał 27 lipca 2026, że Storj Labs złożył wniosek o ochronę przed wierzycielami w ramach Chapter 11."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Płatności dla operatorów węzłów sprzed złożenia wniosku trafiły do procesu zgłaszania wierzytelności w postępowaniu upadłościowym."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "Nowy węzeł ma wstrzymywane 75%, potem 50%, potem 25% zarobków w pierwszych dziewięciu miesiącach; połowa wraca w 16. miesiącu, a reszta tylko przy kontrolowanym wyjściu."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Klienci przechowują zaszyfrowane fragmenty plików i nikt nie kieruje ruchu przez Twój IP, ale nie znaleźliśmy miejsca, w którym Storj podaje, kim są klienci ani jak są weryfikowani."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "Oprogramowanie węzła jest otwartoźródłowe, na licencji AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj publikuje własny obraz Docker, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Bez konta: adres portfela i e-mail na powiadomienia dla operatora."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Aktywne węzły nadal otrzymywały płatności po złożeniu wniosku."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR to pula kopania Monero bez konta: Twój miner loguje się, używając Twojego adresu Monero jako nazwy użytkownika, a pula płaci na ten adres. CashPilot nie uruchamia tu minera. Odczytuje saldo, które SupportXMR przechowuje dla Twojego adresu, więc widzisz, ile zarobił Twój miner CPU, obok pozostałych dochodów. Saldo jest zarobione, ale jeszcze nie otrzymane: pula wypłaca je, gdy przekroczy Twój próg wypłaty.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Pula kopania Monero, śledzona po adresie wypłat"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (automatycznie), 0.01 XMR na żądanie"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Gdy saldo przekroczy Twój próg albo na żądanie"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR płaci na Twój adres, gdy saldo osiągnie Twój próg (domyślnie 0.1 XMR). Na jego stronie możesz też zlecić natychmiastową wypłatę od 0.01 XMR, z opłatą 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Saldo jest zarobione, ale nie otrzymane, dopóki SupportXMR nie wypłaci go na ten adres. Sald Monero nie da się odczytać on-chain bez prywatnego klucza podglądu (view key), o który CashPilot nigdy nie prosi, więc każdą wypłatę potwierdzasz samodzielnie."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Twój adres wypłat Monero: nazwa użytkownika, której Twój miner używa w SupportXMR, bez części <b>.workername</b> ani <b>+difficulty</b>. Jest publiczny i nie daje dostępu do żadnych środków."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Wymaga minera Monero (XMRig) skierowanego na pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "moc obliczeniowa"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Nie. Twój miner wysyła hashe do puli; nikt nie kieruje ruchu przez Twoje łącze."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Twój adres Monero, wybrane przez Ciebie nazwy workerów, Twój hashrate i adres IP Twojego minera widziany przez pulę."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Miner utrzymuje jedno otwarte połączenie z pulą i zużywa mało przepustowości. Kosztem, na który trzeba uważać, jest prąd, a nie dostawca internetu."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Nie ma konta. Tożsamością jest adres, a jego statystyki każdy może odczytać na supportxmr.com."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Płatne tylko w Monero, z opłatą puli 0.6% i domyślnym progiem 0.1 XMR przed automatyczną wypłatą."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot nie uruchamia minera dla SupportXMR: kierujesz na pulę własnego minera, a CashPilot tylko odczytuje saldo."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol daje agentom AI dostęp do internetu na żywo przez sieć Beaconów. Teneo Beacon to własna aplikacja Teneo na Androida, iOS, macOS, Windows i Linuksa, z wersją wiersza poleceń na serwery i Raspberry Pi. Po zaakceptowaniu ekranu zgody udostępnia nieużywaną przepustowość i zarabia Teneo Protocol Points oraz Fragments, gdy jest online. Fragments liczą się do sezonowych losowań z nagrodami w USDC (Beacon Drop). Teneo podaje, że Beacon zarabia dwa razy więcej punktów niż starsze rozszerzenie przeglądarki. Na jednym łączu internetowym zarabia jeden Beacon. Pozostałe urządzenia na tym samym łączu czekają w gotowości. Zarejestruj się w Expedition Hub przez link polecający lub kod PSA3BHPJ, a potem zaloguj się w Beaconie.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "Aplikacja przepustowości DePIN (Beacon) - Fragments do sezonowych losowań USDC, +100 Fragments z linkiem polecającym"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Zarabia Teneo Points i Fragments. Fragments liczą się do sezonowych losowań USDC, więc sezon wypłaca nagrodę, a nie stawkę. Teneo podaje, że Beacon zarabia dwa razy więcej punktów niż rozszerzenie przeglądarki. Odbieraj boost co 8 godzin, aby mieć do 3x Fragments; przegapione okno obniża mnożnik."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Sezonowe losowanie (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Nagrody Beacon Drop są wypłacane w USDC na portfel powiązany w Expedition Hub. Hub pokazuje, ile dni masz na powiązanie portfela; nagroda bez portfela powiązanego na czas przepada."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Powiąż portfel w Expedition Hub, zanim zostaną wypłacone nagrody za sezon; Hub anuluje nagrodę, jeśli portfel nie zostanie powiązany na czas."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% Fragments każdego poleconego znajomego i 2% Fragments osób przez niego poleconych, gdy znajomy zarejestruje się w ciągu 7 dni i zarobi 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments przy rejestracji i kolejne +150, gdy osiągniesz 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "Na jednym łączu internetowym zarabia jeden Beacon. Maszyny w centrach danych zarabiają tylko u dostawców hostingu, których Teneo dopuściło, za połowę Fragments i bez punktów oraz bonusu za polecenie. Połączenia VPN nigdy nie zarabiają."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Fragments z Beacona dają USDC tylko jako nagrody w sezonowych losowaniach, więc jego uruchomienie nie przynosi ustalonej kwoty."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo podaje, że punkty zostaną połączone w $AGENTIC, nieprzenoszalny token nagród, a nie w token $TENEO."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "Do listopada 2026 nie potwierdzono daty startu $TENEO, przydziału ani procesu odbioru, po tym jak minął wcześniejszy termin w drugim kwartale 2026."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot nie uruchamia Teneo: instalujesz własną aplikację Beacon dostawcy, więc CashPilot nie może jej za Ciebie wdrożyć ani zaktualizować. Jej regulaminu nie sprawdzono pod kątem kontenerów."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo podaje, że ruch pochodzi od zweryfikowanych klientów biznesowych i blokuje adresy prywatne oraz porty podatne na nadużycia, ale nie mówi, jak weryfikuje tych klientów."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network to uznana zdecentralizowana sieć dostarczania wideo i mocy obliczeniowej AI (od 2018). Użytkownicy uruchamiają Edge Nodes, udostępniając przepustowość, przestrzeń dyskową i moc obliczeniową. Duże partnerstwa z dostawcami treści. Zarabia tokeny TFUEL.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "Zdecentralizowany CDN + moc obliczeniowa AI - nagrody TFUEL, uznany projekt"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Tylko aplikacja desktopowa. Zarobki zależą od zasobów i lokalizacji. Duże partnerstwa, notowany na wszystkich giełdach."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Na bieżąco"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot nie uruchamia Theta Edge: korzystasz z własnej aplikacji desktopowej dostawcy, więc CashPilot nie może jej za Ciebie wdrożyć ani zaktualizować. Jej regulaminu nie sprawdzono pod kątem kontenerów."
  source: "893de938ed14"
titan.description:
  text: "Titan Network to platforma DePIN, która udostępnia Twój adres IP, przestrzeń dyskową i przepustowość w zamian za nagrody w tokenach TNT. Dostępna na Windows, Mac i Androida. Węzły tworzą zdecentralizowaną warstwę CDN i przechowywania danych. Typowe zarobki to $5-30/miesiąc, zależnie od udostępnionych zasobów i lokalizacji geograficznej.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN udostępniający IP, przestrzeń dyskową, przepustowość - $5-30/miesiąc"
  source: "799e68401067"
titan.earnings.notes:
  text: "Udostępnia IP, przestrzeń dyskową i przepustowość. Zarobki zależą od udostępnionych zasobów i regionu. Większy przydział przestrzeni daje wyższe nagrody."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Według epok"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Własna pomoc Titan mówi, że działający węzeł nie gwarantuje zarobków: bez przydzielonego zadania nic nie zarabia, a nagrody są w tokenie TNT."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot nie uruchamia Titan: korzystasz z własnej aplikacji lub rozszerzenia dostawcy, więc CashPilot nie może ich za Ciebie wdrożyć ani zaktualizować. Ich regulaminu nie sprawdzono pod kątem kontenerów."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer pozwala zarabiać na ruchu internetowym, udostępniając przepustowość zweryfikowanym firmom. To jedna z niewielu usług udostępniania przepustowości, które dobrze działają nie tylko na łączach domowych, ale też na IP z VPS i centrów danych. Używa prostego uwierzytelniania tokenem przekazywanym w argumentach wiersza poleceń. Obsługuje architektury ARM dla Raspberry Pi i podobnych urządzeń.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Udostępnianie przepustowości - działa na VPS, logowanie tokenem"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Token"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Nazwa urządzenia"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Zaloguj się na <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, naciśnij F12 → Application → Local Storage → kliknij <code>https://app.traffmonetizer.io</code> → skopiuj wartość <code>authToken</code> (około 54 znaków: cyfry, znak <code>|</code>, a potem litery i cyfry)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Nazwa wyświetlana w panelu do zarządzania urządzeniami"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "IP z VPS i centrów danych zarabiają mniej niż domowe. Lokalizacje w USA i UE zarabiają więcej. Wiele IP obsługiwanych przez sieci Docker."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Minimum $10. PayPal nie jest już oferowany. Najpierw zapisz w profilu jedną metodę wypłaty: USDT w sieci Solana lub TON (najniższe opłaty), Arbitrum (niskie opłaty) lub Tron TRC20 (wysokie opłaty sieciowe) albo przelew bankowy od $1000. Pierwszy zapisany adres obowiązuje od razu; późniejsza zmiana wymaga potwierdzenia e-mailem. Przed pierwszą wypłatą panel może poprosić o kontakt w komunikatorze (WhatsApp, Telegram lub Skype). Zlecenie wypłaca pełne dolary, a centy zostają na saldzie."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT w sieci zapisanej w ustawieniach wypłat profilu (Solana, TON, Arbitrum lub Tron) albo przelew bankowy. Adres jest w ustawieniach Traffmonetizer, a nie w kontenerze."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Zaloguj się na <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, naciśnij F12 → Application → Local Storage → wartość <b>authToken</b> (około 54 znaków: cyfry, znak <code>|</code>, a potem litery i cyfry)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% każdej wypłaty, którą zlecą"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Regulamin Traffmonetizer wymaga IP domowego, ale w praktyce węzły na VPS są akceptowane."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot ocenia go na 1.9; recenzenci od 2023 do listopada 2026 zgłaszają wypłaty oczekujące tygodniami albo oznaczone jako zrealizowane bez odpowiadającej im transakcji."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Ci sami recenzenci zgłaszają, że czat na żywo i wsparcie e-mailowe nie odpowiadają, czasem przez tygodnie."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Tylko kryptowaluty lub przelew bankowy od $1000; PayPala już nie ma, a zlecenie wypłaca tylko pełne dolary."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Regulamin Traffmonetizer wymaga IP domowego, więc serwer na łączu hostingowym go nie spełnia."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Czterech recenzentów na Trustpilot od 2023 do 2025 zgłasza bardzo powolne zarobki, np. jeden cent dziennie na czterech urządzeniach albo prawie dwa lata, by dojść do $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Wypłata wymaga tylko zapisanego adresu kryptowalutowego potwierdzonego e-mailem; panel może poprosić o kontakt w komunikatorze."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer publikuje własny obraz Docker, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Kop za pomocą CPU i otrzymuj zapłatę w wybranej monecie, np. SHIB, DOGE lub XMR. CashPilot uruchamia XMRig na puli RandomX od unMineable, a unMineable przelicza Monero wykopane przez Twój CPU na Twoją monetę. Płaci na Twój publiczny adres, gdy saldo osiągnie próg płatności danej monety. Każdy worker wdrożony przez CashPilot zawiera kod polecający CashPilot w unMineable, który obniża Twoją opłatę platformy z 1% do 0.75%. Prąd może kosztować więcej, niż zarobisz."
  source: "a91a1a6282bd"
unmineable.short_description:
