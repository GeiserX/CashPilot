uprock.description:
  text: "Uprock to platforma DePIN (Decentralized Physical Infrastructure Network), która pozwala zarabiać kryptowaluty, udostępniając łącze internetowe. Część szerszego ekosystemu Web3. Dostępne są społecznościowe obrazy Docker, ale nie ma oficjalnego. Głównym interfejsem jest rozszerzenie przeglądarki.\n"
