  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable płaci na Twój adres, gdy saldo osiągnie próg płatności danej monety. Progi różnią się w zależności od monety i sieci; CashPilot odczytuje próg, który unMineable podaje dla Twojego adresu."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Saldo jest zarobione, ale nie otrzymane, dopóki unMineable nie wypłaci go na ten adres. Sieć zależy od wybranej monety."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "Ten sam adres wypłat i symbol monety, z którymi wdrożono minera, na przykład <b>XMR</b>. Wpisz sam adres, bez monety, nazwy workera ani kodu polecającego. Jest publiczny i nie daje dostępu do żadnych środków."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% nagród za kopanie każdego poleconego minera"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Opłata platformy obniżona z 1% do 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Ta maszyna zgłasza łącze hostingowe. Przed kopaniem sprawdź regulamin swojego dostawcy. Niektórzy dostawcy, w tym Hetzner Cloud, tego zabraniają. Zanim zaufasz szacunkowi zysku, sprawdź swoje rzeczywiste koszty prądu."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable pobiera opłatę platformy 1%. CashPilot dodaje swój kod polecający (#awk6-j1z0) po każdej nazwie workera, co obniża Twoją opłatę do 0.75%. unMineable płaci wtedy opiekunowi CashPilot 0.25% Twoich nagród za kopanie; Ty zachowujesz 99.25%. Każda moneta ma własny próg płatności, na przykład 0.03 XMR."
