# Polish translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/pl.yml --restamp '<key>'
2miners-etc.description:
  text: "Śledź niewypłacone saldo Ethereum Classic, które 2Miners przechowuje dla Twojego publicznego adresu wypłat ETC. Uruchom własnego minera i skieruj go na pulę. CashPilot odczytuje saldo i prosi Cię o potwierdzenie wypłat, gdy saldo spada.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Pula kopania Ethereum Classic, śledzona po adresie wypłat"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (do ustawienia)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "Pula sprawdza Twój próg wypłaty co dwie godziny"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners automatycznie wysyła środki na Twój adres, gdy osiągniesz wybrany próg. Najniższy próg wypłat ETC to 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Niewypłacone saldo narasta w 2Miners. Saldo portfela to osobny odczyt z sieci Ethereum Classic. Zanim potwierdzisz wypłatę w CashPilot, sprawdź w portfelu otrzymaną kwotę.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Wpisz publiczny adres wypłat Ethereum Classic, którego Twój miner używa w 2Miners, zaczynający się od <b>0x</b>. Nie dodawaj nazwy workera.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Wymaga minera ETCHash skierowanego na 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "moc obliczeniowa"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Nie. Twój miner wysyła do puli wyniki kopania."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "Pula używa Twojego adresu wypłat, wybranych przez Ciebie nazw workerów i adresu IP Twojego minera."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Każdy może zobaczyć statystyki po adresie wypłat. Aby zmienić próg, pula prosi o potwierdzenie IP workera."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "Pula pobiera prowizję 1% i wstrzymuje wypłaty do osiągnięcia Twojego progu."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (dawniej ATOR) to zdecentralizowana sieć prywatności oparta na trasowaniu cebulowym. Operatorzy węzłów uruchamiają węzły przekaźnikowe i zarabiają tokeny ANYONE za udostępnioną przepustowość. To coś jak „Tor z nagrodami”. CashPilot uruchamia go z własnego obrazu, zbudowanego z podpisanego pakietu Debiana projektu, dla amd64 i arm64. Konfiguracja odbywa się przez plik anonrc zamontowany w kontenerze (Nickname, ContactInfo, ORPort itd.). Przekaźnik nic nie zarabia, dopóki nie zablokujesz dla niego 100 ANYONE na co najmniej 180 dni, a nagrody odbiera się, podpisując transakcję w portfelu. Przekaźnik umieszcza też Twój publiczny IP w katalogu przekaźników sieci, co może zaszkodzić reputacji IP, za którą płacą aplikacje udostępniające przepustowość domową.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Zdecentralizowane trasowanie cebulowe - węzły przekaźnikowe Tor z nagrodami"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Klucz tożsamości ed25519 przekaźnika. Jego zniszczenie kasuje reputację przekaźnika i zaczyna jego historię zarobków od zera."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Płaci tylko wtedy, gdy na każdy przekaźnik zablokowano 100 ANYONE na co najmniej 180 dni, a odbiór nagrody podpisano w portfelu. Bez tej stawki przekaźnik nic nie zarabia. Z nią zarobki zależą od udostępnionej przepustowości i czasu działania."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Według epok"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Ustawiane jako ContactInfo w anonrc, z prefiksem '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Odciski przekaźników rozdzielone przecinkami. Żaden panel online ich nie pokazuje. Dla przekaźnika uruchomionego przez CashPilot uruchom <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> na hoście, na którym działa. Dla przekaźnika sprzętowego otwórz jego Relay Control Panel pod adresem <b>http://relayup.local</b> i odczytaj Fingerprint na stronie Home.\n"
  source: "ffa5be0d4953"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Przepustowość, jako przekaźnik w sieci Anyone (fork Tora)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Tak. Przekazuje ruch innych osób. To, czy Twój IP jest ostatnim przeskokiem, zależy od tego, czy przekaźnik skonfigurowano jako węzeł wyjściowy."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "Publiczny klucz tożsamości przekaźnika, Twój IP i port oraz statystyki czasu działania, z założenia publikowane w katalogu sieci. Jeśli ustawisz ContactInfo w anonrc, ono również jest tam publikowane i na zawsze publicznie indeksowane — zwykle jest to adres e-mail, więc zostaw je puste, chyba że chcesz, by było publiczne."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Realne. Ruch przekaźnika jest przypisywany do Twojego łącza. Zwłaszcza przekaźniki wyjściowe ściągają skargi na nadużycia; wielu dostawców internetu dla klientów domowych ich zabrania."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Nie ma konta do założenia, więc nie ma limitów na konto. Aby zarabiać, nadal potrzebujesz portfela Ethereum ze 100 ANYONE zablokowanymi dla każdego przekaźnika na co najmniej 180 dni, a CashPilot potrzebuje odcisków przekaźników, aby odczytać nagrody. Projekt nie publikuje limitu przekaźników na IP, a katalog go nie deklaruje."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Przekaźnik nic nie zarabia, jeśli nie zablokujesz dla niego 100 ANYONE na co najmniej 180 dni, a każdy odbiór nagrody podpisujesz w portfelu."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Z założenia przekazuje ruch innych osób, bez sprawdzania, kim są; przekaźniki wyjściowe ściągają skargi na nadużycia."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "Tożsamość, IP i czas działania przekaźnika są publikowane w katalogu sieci, a każde ustawione ContactInfo jest publiczne na zawsze."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Nie ma konta do założenia. Przekaźnik potrzebuje tylko portfela, bez weryfikacji tożsamości."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "Oprogramowanie przekaźnika to opublikowany fork Tora, na licencji Tora."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot buduje własny obraz z opublikowanego oprogramowania przekaźnika Anyone, które nie wymaga konta."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping to zdecentralizowana platforma monitorowania sieci, która płaci Ci za uruchomienie węzła. Twój węzeł monitoruje strony WWW, mierzy opóźnienia i sprawdza jakość sieci dla klientów Bitping. Działa zarówno na łączach domowych, jak i na VPS. Obraz Docker przy pierwszym uruchomieniu loguje się za pomocą zmiennych środowiskowych BITPING_EMAIL i BITPING_PASSWORD (w jego logu widać „Attempting login with environment variables”), a potem zapisuje sesję w zamontowanym wolumenie, więc restarty nie wymagają ponownego logowania.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Udostępnianie przepustowości - zdecentralizowane monitorowanie sieci, działa na VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "E-mail"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Hasło"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "E-mail Twojego konta Bitping (ten sam login co w <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Hasło Twojego konta Bitping. Używane raz do utworzenia sesji węzła, która potem jest przechowywana w wolumenie danych."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Zarobki zależą od jakości sieci i popytu na monitorowanie z Twojej lokalizacji. Węzły na VPS są akceptowane."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Zarobki węzłów są na nodes.bitping.com; app.bitping.com to panel klientów API. Wypłaty tylko w SOL: gdy niewypłacone saldo przekroczy $0.05, wpisz w zleceniu adres Solana; zlecenie jest realizowane w ciągu 24 godzin. Nowy lub pusty portfel Solana potrzebuje najpierw około 0.001 SOL na minimalny depozyt (rent) sieci."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Teraz tylko Solana, a adres wpisujesz W MOMENCIE WYPŁATY, zamiast go zapisywać."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Użyj e-maila i hasła swojego konta Bitping (tych samych co w <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Wypłać saldo Bitping"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping może anulować zarobki nieodebrane przez ponad 12 miesięcy, po uprzedzeniu e-mailem z 30-dniowym wyprzedzeniem."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Zleć wypłatę SOL na nodes.bitping.com i wpisz w zleceniu swój adres Solana."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Wypłaty są w Solanie (SOL), na adres, który wpisujesz w każdym zleceniu."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Pomoc Bitping podaje, że wypłata na nowy, pusty portfel Solana może się nie udać, dopóki samodzielnie nie zasilisz go niewielką ilością SOL."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Pomoc Bitping podaje, że serwery i kontenery Docker są obsługiwane."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Wypłata wymaga tylko adresu Solana wpisanego w zleceniu."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit to usługa udostępniania przepustowości, która płaci przez PayPal i Stripe. Nie ma oficjalnego obrazu Docker; klientami są aplikacja na Windows i aplikacja na Androida. Usługa działa pod adresem bytebenefit.io -- stara domena bytebenefit.com została porzucona i jest wystawiona na sprzedaż na giełdzie domen, dlatego kiedyś była tu oznaczona jako martwa.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Udostępnianie przepustowości - wypłaty PayPal/Stripe, aplikacja desktopowa/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Brak obrazu Docker. Tylko aplikacje na Windows i Androida."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% zarobków z ruchu poleconych osób"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "Bonus powitalny $1 (10 000 Coins)"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "Opis aplikacji w Google Play mówi, że Twój ruch obsługuje zapytania web intelligence klientów Infatica, bez podania, kim są ani jak są weryfikowani."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Aplikacja na Androida zniknęła z Google Play w kwietniu 2026 po 17 miesiącach."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot nie uruchamia ByteBenefit: korzystasz z własnej aplikacji dostawcy, więc CashPilot nie może jej za Ciebie wdrożyć ani zaktualizować. Jej regulaminu nie sprawdzono pod kątem kontenerów."
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir pozwala zarabiać dochód pasywny, udostępniając nieużywaną przepustowość internetu. Obsługuje tylko Windows i Androida — oficjalne FAQ mówi, że klient na Linuksa ani Dockera nie jest planowany, iOS nie jest obsługiwany, a macOS nie jest oferowany. Zarobki mocno zależą od lokalizacji. Do śledzenia służy panel WWW pod adresem dash.bytelixir.com. Brak obrazu Docker.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Udostępnianie przepustowości - tylko Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Ciasteczko sesji"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Ciasteczko Remember Web"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "Token XSRF"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Zaloguj się na <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, naciśnij F12 → Application → rozwiń <b>Cookies</b> na lewym pasku bocznym → kliknij podpozycję <code>https://dash.bytelixir.com</code> → na liście ciasteczek po prawej znajdź <code>bytelixir_session</code> → skopiuj jego Value (długi JWT zaczynający się od eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "To samo miejsce (Cookies → <code>https://dash.bytelixir.com</code>) → znajdź ciasteczko o nazwie <code>remember_web_...</code> → skopiuj jego Value (opcjonalne, wydłuża czas trwania sesji)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "To samo miejsce → znajdź <code>XSRF-TOKEN</code> → skopiuj jego Value (opcjonalne)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Zarobki zależą od lokalizacji ($2-50/miesiąc). Brak obrazu Docker. Wymagana aplikacja desktopowa lub aplikacja na Androida."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Tylko kryptowaluty. Minimum zależy od monety: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Adres wpisujesz w każdym zleceniu. Zlecenia są realizowane w godzinach pracy, w ciągu 24 godzin."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Saldo przechowuje Bytelixir; adres portfela wpisujesz w każdym zleceniu wypłaty i nigdy nie jest zapisywany w kontenerze."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Zaloguj się na <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a>, <b>zaznaczając Remember Me</b>, naciśnij F12 → Application → rozwiń <b>Cookies</b> na lewym pasku bocznym → kliknij <code>https://dash.bytelixir.com</code>, a potem skopiuj trzy wartości: <b>bytelixir_session</b>, <b>remember_web_…</b> (ta długa, zaczynająca się od tego prefiksu) i <b>XSRF-TOKEN</b>. Samo ciasteczko sesji wygasa około dwóch godzin po skopiowaniu, więc zbieranie danych zatrzymuje się jeszcze tego samego popołudnia; ciasteczko remember_web działa rok i to ono utrzymuje zbieranie."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50% ich zysku dożywotnio"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "Bonus powitalny $1"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Tylko kryptowaluty, a minimum zależy od monety: od $5 dla USDT do $250 dla Bitcoina."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot nie uruchamia Bytelixir: korzystasz z własnej aplikacji dostawcy, więc CashPilot nie może jej za Ciebie wdrożyć ani zaktualizować. Jej regulaminu nie sprawdzono pod kątem kontenerów."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Trustpilot ocenia go na 4.6 na podstawie 283 opinii, w większości chwalących wypłaty w kryptowalutach; kilka zgłasza wypłaty, które nie dotarły."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Wypłata wymaga tylko adresu kryptowalutowego wpisanego w zleceniu."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai to rynek GPU peer-to-peer. Wystawiasz maszynę z Linuksem i kartami NVIDIA, ustalasz własne ceny spot i na żądanie, a najemcy uruchamiają na niej własne kontenery Docker. Płacą Ci tylko za minuty wynajmu, w CLORE, BTC, USDT lub USDC. Hosting wymaga maszyny x86_64 z Ubuntu 22.04 lub nowszym (albo HiveOS), działającego sterownika NVIDIA i co najmniej 100 Mbps w obie strony. Karty AMD nie są obsługiwane.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "Rynek GPU - wynajmuj karty NVIDIA, wypłaty w CLORE, BTC lub stablecoinach USD"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Płatne tylko za minuty wynajmu, po ustalonej przez Ciebie cenie. Górna granica przedziału, $490, to własny pułap Clore dla jednej karty RTX 4090 wystawionej na minuty ('up to ~$490/month'); mniejsze karty zarabiają mniej, a bezczynna karta nie zarabia nic. Clore zatrzymuje 5% (na żądanie) lub 1.25% (spot) z każdego wynajmu oraz dodatkowe 15%, gdy najemca płaci w BTC, USDT lub USDC zamiast w CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Wypłacasz z Account > Billing do własnego portfela: CLORE (ERC-20, minimum 200, opłata około $0.50), BTC (minimum 0.0001, opłata 0.00005 BTC) lub USDT/USDC w sieci Ethereum albo BNB Chain (minimum $10, opłata $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore przechowuje saldo (CLORE, BTC i jedno saldo USD dla USDT/USDC), dopóki go nie wypłacisz. Sieć wybierasz przy każdej wypłacie: Ethereum dla CLORE, Bitcoin dla BTC, Ethereum lub BNB Chain dla USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (poziom standardowy) opłat platformy wnoszonych przez poleconych przez Ciebie hostów i najemców, od każdego wynajmu; kod nigdy nie wygasa; wypłacane w walucie wynajmu (CLORE, BTC lub USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps w obie strony"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "Czas obliczeniowy GPU na Twojej maszynie."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Tak. Najemcy uruchamiają na Twojej maszynie własne kontenery Docker, a ich ruch wychodzi z Twojego łącza; porty SSH i aplikacji są przekierowane do internetu."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Polityka prywatności Clore obejmuje dane konta oraz Twój adres IP z przybliżoną lokalizacją; dokumenty tożsamości tylko wtedy, gdy Clore poprosi o KYC."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Porty przychodzące muszą być osiągalne z internetu (domyślnie 22, 8080 i 3000-4000), a na Twoim łączu działają zadania obcych osób. Sam przewodnik sieciowy Clore mówi, że niektórzy dostawcy internetu blokują hosting."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "Ukończone 18 lat, kraj nieobjęty sankcjami. Clore może zawiesić lub zamknąć konto według własnego uznania, a niedozwolone użycie może kosztować utratę środków."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Ani regulamin, ani polityka prywatności nie podają nazwy podmiotu prawnego, a regulamin pozostawia wskazanie właściwej jurysdykcji przyszłej wersji."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore może zawiesić lub zamknąć konto według własnego uznania, a niedozwolone użycie może prowadzić do przepadku środków."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Wypłaty tylko w kryptowalutach (CLORE, BTC, USDT lub USDC), a Clore pobiera dodatkowe 15% z wynajmu opłaconego przez najemcę w BTC, USDT lub USDC, chyba że host zablokuje CLORE, aby to obniżyć."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Host dostaje zapłatę tylko za minuty wynajmu, a podana przez Clore kwota dla RTX 4090 to pułap („up to ~$490/month”) dla jednej karty."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "Podstawowe użycie nie wymaga KYC, ale Clore może poprosić o weryfikację tożsamości przy dużych wypłatach lub w sprawach zgodności z przepisami."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Najemcy uruchamiają na Twojej maszynie dowolny publiczny obraz Docker. Regulamin wymienia zakazane zastosowania (malware, DDoS, CSAM i inne), ale nie znaleźliśmy opisu, jak najemcy są weryfikowani."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot nie uruchamia Clore.ai: instalujesz agenta hostingowego Clore na własnej maszynie z GPU (Ubuntu 22.04 lub nowszy albo HiveOS), więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Clore zatrzymuje 5% z wynajmu na żądanie (1.25% przy spot), gdy najemca płaci w CLORE, bez dodatkowej opłaty."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN prowadzi sieć walidatorów, która sprawdza przepustowość i zasięg infrastruktury AI finansowanej przez protokół DAWN. Rozszerzenie przeglądarki DAWN Validator bierze udział w tych kontrolach proof-of-bandwidth i zasięgu i zarabia nagrody DAWN, gdy działa. Nagrody nie mają jeszcze ustalonej wartości pieniężnej. Załóż konto w rozszerzeniu i podaj kod polecający 2QLQV97F, gdy o niego poprosi.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "Walidator DePIN - rozszerzenie przeglądarki zarabia punkty DAWN"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Zarabia Dawn Points przed premierą tokena. Rzeczywista wartość zależy od przyszłej ceny tokena. Urządzenie sprzętowe zarabia więcej niż rozszerzenie przeglądarki."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Airdrop tokenów (termin nieogłoszony)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "Rozszerzenie działa, ale jest niedopracowane. Zapowiedziano sprzęt Black Box. Sprawdź w przyszłości."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "Rozszerzenie zarabia punkty; do października 2026 nie potwierdzono żadnej dystrybucji tokenów dla operatorów węzłów."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "Punkty nie mają ustalonej wartości, dopóki nie wystartuje token i nie zostanie ogłoszony przelicznik."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot nie uruchamia Dawn: korzystasz z własnego rozszerzenia przeglądarki dostawcy, więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować. Jego regulaminu nie sprawdzono pod kątem kontenerów."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network to projekt zdecentralizowanego VPN i infrastruktury web3. Wymaga przede wszystkim własnościowych urządzeń sprzętowych Deeper Connect. Moken to powiązana platforma do kopania i stakingu. Nie działa jako samo oprogramowanie.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "Zdecentralizowany VPN - wymaga własnościowego urządzenia sprzętowego"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Wymaga sprzętu Deeper Connect ($200-500). Platforma Moken do kopania i stakingu. Nie działa jako samo oprogramowanie."
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "Na bieżąco"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "Prowizja od sprzedaży urządzenia"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "5% zniżki na urządzenie Deeper Connect z kuponem SERGIO"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "Nagrody za kopanie są w DPR i zależą od wskaźnika kredytowego, który rośnie powoli albo dzięki stakingowi DPR."
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot nie uruchamia Deeper Network: korzystasz z własnego routera dostawcy, więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować. Jego regulaminu nie sprawdzono pod kątem kontenerów."
  source: "b1ba1636070f"
earnapp.description:
  text: "EarnApp od Bright Data pozwala sprzedawać nieużywaną przepustowość i uzyskiwać dochód pasywny. Bright Data to największa na świecie sieć proxy, która obsługuje zbieranie danych dla firm z listy Fortune 500. CashPilot uruchamia go z własnego obrazu, który przy pierwszym uruchomieniu pobiera przypiętą wersję EarnApp z CDN Bright Data, sprawdza jej sha256 i uruchamia ją w trybie lite, tylko z UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Udostępnianie przepustowości - wspierane przez Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "UUID węzła"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "ID Twojego węzła EarnApp: sdk-node-, a po nim 32 małe znaki szesnastkowe, tak jak wypisuje je 'earnapp showid'. Po wdrożeniu połącz go raz, otwierając https://earnapp.com/r/ z tym UUID na końcu po zalogowaniu się w EarnApp; niepołączony węzeł zarabia, ale nic nie trafia na Twoje saldo"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp ciągle nie może połączyć się ze swoimi serwerami i restartuje się, więc zarabia mało albo nic. Zrestartuj tę kopię; jeśli problem się powtarza, sprawdź połączenie internetowe tej maszyny."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Otwórz ten link po zalogowaniu się w EarnApp, aby dodać węzeł do swojego konta. Dopóki tego nie zrobisz, węzeł zarabia, ale nic nie trafia na Twoje saldo."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Bardzo zależne od lokalizacji. Najwięcej zarabiają IP z USA i UE. Zarobki rosną wraz ze zużytą przepustowością."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Na żądanie (dostępne automatyczne wypłaty: PayPal min. $10, Wise min. $10, Amazon min. $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Włącz raz automatyczne wypłaty (auto-redeem), a EarnApp sam zapłaci, gdy saldo osiągnie minimum danej metody: PayPal $10, Wise $10, Amazon $50. Płatności PayPal przychodzą od Bright Data Ltd. W październiku 2026 płatność PayPal dotarła w kwocie o około 2% niższej niż saldo zlecone do wypłaty."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Saldo przechowuje EarnApp; wypłacane na Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Zaloguj się na <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, naciśnij F12 → Application → Cookies, skopiuj wartość <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% ich zarobków dożywotnio, wypłacane ponad ich zarobki"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "Centrum pomocy EarnApp mówi, że instalowanie go w kontenerach Docker, maszynach wirtualnych, usługach hostingowych lub na serwerach domowych jest surowo zabronione, a właśnie tak uruchamia go CashPilot."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "Ten sam artykuł pomocy mówi, że konto wykryte przy takim użyciu jest likwidowane bez uprzedzenia, a jego oczekujące płatności są anulowane."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Nasza wypłata PayPal dotarła w październiku 2026, w kwocie o około 2% niższej niż saldo zlecone do wypłaty."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "Minimum $10 dla PayPal i Wise oraz automatyczne wypłaty, które realizują się same."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp należy do Bright Data, a jego płatności PayPal przychodzą od Bright Data Ltd., firmy o podanej nazwie."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm płaci Ci za udostępnianie przepustowości internetu. Kolektor zarobków loguje się e-mailem i hasłem przez Supabase. Lekki obraz Docker z prostym wdrożeniem (klient Docker używa osobnego tokena UUID).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "Udostępnianie przepustowości - logowanie e-mailem i hasłem, lekki klient"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "Klucz API"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "Zaloguj się na <a href=\"https://app.earn.fm\">app.earn.fm</a> → kliknij ikonę profilu (w prawym górnym rogu) → Account Settings → skopiuj API Key (w formacie UUID)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "Stosunkowo nowa platforma. Zarobki zależą od lokalizacji i dostępnej przepustowości."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "Minimum $15. Metody: USDT w sieci BEP20 lub Polygon (opłata $1) albo TRC20 (opłata $3), PayPal, karty podarunkowe Amazon lub Starbucks od $15 albo przelew bankowy od $1000 z potrąceniem opłat za przelew. Przed pierwszą wypłatą wypełniasz profil rozliczeniowy (imię i nazwisko oraz adres), używany na potwierdzeniach wypłat."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "Saldo przechowuje Earn.fm; wypłacane na żądanie."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Użyj e-maila i hasła swojego konta Earn.fm (tych samych co przy logowaniu na <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10% ich zarobków dożywotnio"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "$5 salda na start"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "Minimum $15, opłata od $1 do $3 przy USDT, a przelew bankowy dopiero od $1000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Przed pierwszą wypłatą wypełniasz profil rozliczeniowy z imieniem i nazwiskiem oraz adresem."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Recenzenci w 2025 zgłaszają, że wsparcie przez e-mail i Discord nie odpowiada; Trustpilot zaznacza, że Earn.fm nie odpowiedział na negatywne opinie."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Earn.fm publikuje własny obraz Docker, earnfm/earnfm-client."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher to platforma wymiany ruchu, na której zdobywasz kredyty, odwiedzając strony WWW przez zautomatyzowany surfbar. Działa jako rozszerzenie/dodatek przeglądarki. To nie jest klasyczna usługa udostępniania przepustowości — generuje ruch, automatycznie przeglądając strony.\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "Surfbar wymiany ruchu - rozszerzenie przeglądarki"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "Zarobki w punktach BTP wymienialnych na EUR. Tylko rozszerzenie przeglądarki."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "Wypłata w euro przez PayPal lub przelew bankowy."
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "CashPilot nie uruchamia eBesucher: to rozszerzenie przeglądarki, więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować. Jego regulaminu nie sprawdzono pod kątem kontenerów."
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "Wypłaty od 2 euro przez PayPal lub SEPA, co najmniej raz w tygodniu, bez opłat."
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "eBesucher działa od 2002 roku."
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "Nota prawna (Impressum) podaje operatora, TurboAd GmbH, zarejestrowanego w Berlin-Charlottenburg (HRB 160730 B)."
  source: "84cbddd4330b"
flux.description:
  text: "Flux to globalnie rozproszona infrastruktura obliczeniowa. Operatorzy węzłów stakują tokeny FLUX i udostępniają zasoby serwerowe. Trzy poziomy: Cumulus (1000 FLUX), Nimbus (12 500 FLUX), Stratus (40 000 FLUX). Dostępne oficjalne obrazy Docker.\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "Zdecentralizowana moc obliczeniowa - wymaga stakingu tokenów FLUX"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "Wymaga stakingu 1000+ FLUX (~$50-500 zależnie od ceny). Wyższe poziomy wymagają większego zabezpieczenia, ale zarabiają więcej."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "Nagrody za bloki"
  source: "590433237f8a"
flux.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "Najmniejszy poziom węzła wymaga 1000 FLUX zablokowanych jako zabezpieczenie."
  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "Nagroda za blok spada co roku o 10%, a przewodnik z 2026 ocenił nagrody na najniższym poziomie jako słabe w przeliczeniu na dolary."
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "CashPilot nie uruchamia Flux: korzystasz z własnego oprogramowania węzła dostawcy, więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować. Jego regulaminu nie sprawdzono pod kątem kontenerów."
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "Demon Flux jest otwartoźródłowy, na licencji MIT."
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network to zdecentralizowany rynek mocy obliczeniowej, na którym udostępniasz zasoby CPU i GPU w zamian za tokeny GLM. Dostawcy uruchamiają agenta Yagna, który zarządza wykonywaniem zadań w odizolowanych środowiskach (sandbox). To jeden z najstarszych projektów zdecentralizowanej mocy obliczeniowej (założony w 2016). Obsługuje zadania CPU, renderowanie na GPU i obliczenia ogólnego przeznaczenia. Płatności przez Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Zdecentralizowany rynek mocy obliczeniowej - tokeny GLM przez agenta Yagna"
  source: "88f817c25848"
golem.earnings.notes:
  text: "Zarobki zależą od sprzętu, cen i popytu na zadania. Węzły tylko z CPU zarabiają mniej. Węzły z GPU zarabiają więcej, ale wymagają karty NVIDIA. Uruchamiasz agenta dostawcy Yagna (nie obraz Docker). Płatności w sieci Polygon w tokenach GLM."
  source: "07287d437d51"
golem.payment.frequency:
  text: "Po ukończeniu każdego zadania"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "Zarabiasz tokeny GLM. Portfel do wypłat ustawiasz w konfiguracji dostawcy."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot nie uruchamia Golem: samodzielnie instalujesz agenta dostawcy, więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować. Golem opisuje w dokumentacji uruchamianie dostawcy we własnym obrazie Docker."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "Agent dostawcy, yagna, jest otwartoźródłowy, na licencji GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Bez konta: portfel do wypłat ustawiasz w konfiguracji dostawcy."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "Sieć działa od około dziesięciu lat."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Polityka prywatności Golem podaje operatora, Golem Factory GmbH z Zug w Szwajcarii."
  source: "bae79b651923"
grass.description:
  text: "Grass to zdecentralizowana sieć, która pozwala sprzedawać nieużywaną przepustowość na potrzeby danych do trenowania AI. Działa jako rozszerzenie przeglądarki i aplikacja desktopowa, kierując przez Twoje łącze zapytania web scrapingu, z których powstają uporządkowane zbiory danych. Z ponad 8.5 mln użytkowników jest jedną z największych sieci przepustowości DePIN. Zarabia tokeny GRASS na blockchainie Solana.\n"
  source: "046951d812f9"
grass.short_description:
  text: "Udostępnianie przepustowości DePIN na dane dla AI - zarabia tokeny GRASS"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Token dostępu"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Zaloguj się na <a href=\"https://app.grass.io\">app.grass.io</a>, naciśnij F12 → Application → Local Storage → kliknij <code>https://app.grass.io</code> → skopiuj wartość <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Zarabia Grass Points wymienialne na tokeny GRASS w airdropach. Rzeczywista wartość w USD zależy od ceny tokena. Wymagane rozszerzenie przeglądarki lub aplikacja desktopowa."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Airdrop według epok"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Nagrody przychodzą jako okresowe dystrybucje odbierane w panelu Grass. Dystrybucja Stage 2 (aktywność od października 2024 do czerwca 2026) jest wypłacana w USDC: odbierz ją na app.grass.io/dashboard do 22 stycznia 2027 albo wcześniej, jeśli wszystkie przydziały zostaną odebrane przed tym terminem. Grass zatrzymuje nieodebrane nagrody."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "Narastają PUNKTY; GRASS odbiera się w panelu Grass podczas okresowych airdropów."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Zaloguj się na <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, naciśnij F12 → Application → Local Storage, skopiuj wartość <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% punktów za czas działania bezpośrednio poleconych osób, 10% na drugim poziomie, 5% na trzecim"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Odbierz swoje USDC z Grass Stage 2"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Grass zatrzymuje każdy przydział Stage 2 nieodebrany do 22 stycznia 2027, a okno może zamknąć się wcześniej, gdy wszystkie przydziały zostaną odebrane."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Zaloguj się na app.grass.io kontem używanym w Stage 2, aktywuj Grass Wallet, otwórz kartę Allocation i potwierdź. Odbieraj tylko na app.grass.io. Nie masz punktów ze Stage 2? Wybierz Nie dla mnie."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Nagrody przychodzą tylko w sezonach airdropów. Operatorzy węzłów działających od dawna podawali szacunki za sezon 2 rzędu od kilku do kilkunastu dolarów."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "Nagrody za sezon 2 nieodebrane do 22 stycznia 2027 przepadają na zawsze."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "Pierwszy airdrop wywołał falę krytyki z powodu małych nagród za punkt, rozłożonych na ponad dwa miliony użytkowników."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot nie uruchamia Grass: korzystasz z własnej aplikacji lub rozszerzenia dostawcy, więc CashPilot nie może ich za Ciebie wdrożyć ani zaktualizować. Ich regulaminu nie sprawdzono pod kątem kontenerów."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "Pierwszy airdrop dotarł do prawie 1.5 mln adresów, które odebrały nagrody."
  source: "a4c55e10affa"
helium.description:
  text: "Helium to uznana zdecentralizowana sieć bezprzewodowa. Początkowo hotspoty LoRaWAN, teraz rozszerzona o 5G. Wymaga dedykowanego sprzętu ($500+). Zarabia tokeny HNT/MOBILE. Zwrot z inwestycji mocno spadł - typowo $4-8/miesiąc.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "Zdecentralizowana sieć bezprzewodowa - wymaga sprzętu, tokeny HNT"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "Wymaga zakupu sprzętu za $500+. Zwrot z inwestycji mocno spadł. Nowi operatorzy przechodzą proces zatwierdzania."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "Według epok"
  source: "75743e03bad2"
helium.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149 wycofało nagrody Proof-of-Coverage 6 lipca 2026; hotspoty IoT zarabiają teraz tylko za przesyłane dane, a ponad 114 000 z nich nie przesłało żadnych."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Model nagród Helium kilka razy zmieniano w głosowaniu, jego CEO ustąpił, a HNT spadł o około 96%."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot nie uruchamia Helium: korzystasz z własnego hotspotu dostawcy, więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować. Jego regulaminu nie sprawdzono pod kątem kontenerów."
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "Oprogramowanie bramy hotspotu jest otwartoźródłowe, na licencji Apache-2.0."
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "Śledź niewypłacone saldo Kaspa, które HeroMiners przechowuje dla Twojego publicznego adresu wypłat. Uruchom własnego minera Kaspa i skieruj go na pulę. CashPilot odczytuje saldo puli i prosi Cię o potwierdzenie wypłat, gdy saldo spada.\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
  text: "Pula kopania Kaspa, śledzona po adresie wypłat"
  source: "92c5784dcf30"
herominers-kas.payment.minimum_payout:
  text: "1 KAS (do ustawienia)"
  source: "d33ca7065ff9"
herominers-kas.payment.frequency:
  text: "Pula sprawdza Twój próg wypłaty co godzinę"
  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "HeroMiners automatycznie wysyła środki na Twój adres, gdy osiągniesz wybrany próg. Najniższy próg to 1 KAS.\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "Saldo narasta w HeroMiners. Zanim potwierdzisz wypłatę w CashPilot, sprawdź w portfelu otrzymaną kwotę.\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "Wpisz pełny publiczny adres wypłat Kaspa, którego Twój miner używa w HeroMiners. Dołącz prefiks <b>kaspa:</b> i pomiń nazwę workera.\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "Wymaga minera Kaspa skierowanego na HeroMiners"
  source: "898e36e7a701"
herominers-kas.disclosure.sells:
  text: "moc obliczeniowa"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "Nie. Twój miner wysyła do puli wyniki kopania."
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "Publiczne statystyki puli pokazują każdy adres wypłat i jego aktywność kopania."
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "Pula używa Twojego adresu wypłat zamiast konta."
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "Pula pobiera prowizję 0.9% i wstrzymuje wypłaty do osiągnięcia Twojego progu."
  source: "7eb2950589fa"
honeygain.description:
  text: "Udostępniaj nieużywaną przepustowość internetu i zarabiaj dochód pasywny. Honeygain kieruje przez Twoje łącze ruch związany z web intelligence, dostarczaniem treści i badaniami rynku. To jedna z najbardziej uznanych platform udostępniania przepustowości, z ponad 12 mln użytkowników i ponad 1 mln zrealizowanych wypłat.\n"
  source: "b219f969ba34"
honeygain.short_description:
  text: "Udostępnianie przepustowości - najbardziej uznana platforma"
  source: "c0542c471f29"
honeygain.docker.env.HONEYGAIN_EMAIL.label:
  text: "E-mail"
  source: "969ccbd3cf63"
honeygain.docker.env.HONEYGAIN_PASSWORD.label:
  text: "Hasło"
  source: "e7cf3ef4f17c"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.label:
  text: "Nazwa urządzenia"
  source: "155106be1173"
honeygain.docker.env.HONEYGAIN_EMAIL.description:
  text: "E-mail Twojego konta Honeygain"
  source: "482869cea18f"
honeygain.docker.env.HONEYGAIN_PASSWORD.description:
  text: "Hasło Twojego konta Honeygain"
  source: "f3ba1584b384"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.description:
  text: "Nazwa wyświetlana w Twoim panelu Honeygain"
  source: "a3ba173cae35"
honeygain.earnings.notes:
  text: "Zależy od lokalizacji. IP z USA i UE zarabiają więcej. Maks. 10 urządzeń na konto."
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "Minimum $20 (20 000 kredytów). Dwie opcje: PayPal przez Tipalti, z opłatą około 15%, albo kredyty JumpTask bez opłat, wypłacane do portfela JumpTask. Zlecenie wymaga 6-cyfrowego kodu wysłanego e-mailem. Pierwsza wypłata PayPal ma status „waiting for details”, dopóki nie zarejestrujesz się w Tipalti przez link z e-maila. Ten link działa tylko raz, więc otwórz go, gdy możesz skończyć za jednym podejściem i masz telefon pod ręką: po ustawieniu hasła Tipalti każe potwierdzić numer telefonu komórkowego SMS-em (kody wygasają w ciągu kilku minut), a potem prosi o imię i nazwisko, adres, kraj i datę urodzenia oraz adres PayPal. Tipalti pobiera $2.02 za każdą płatność; wybierz USD, aby uniknąć jego opłaty za przewalutowanie 1.9-3%. Płatność następuje w ciągu 2 dni roboczych. Saldo znika z Twojego konta od razu po zleceniu, nawet gdy wypłata czeka na Tipalti. Każde kolejne logowanie do Tipalti wysyła nowy kod SMS, chyba że zaznaczysz opcję zapamiętania urządzenia na 30 dni. W październiku 2026 Tipalti nie poprosił odbiorcy w Hiszpanii o formularz podatkowy."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Saldo przechowuje Honeygain; wypłacane na żądanie."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Użyj e-maila i hasła swojego konta Honeygain (tych samych co w <a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a>)."
  source: "fd0be22aeb14"
honeygain.referral.bonus.referrer:
  text: "Do 25% zarobków każdego poleconego znajomego w trybie Honeygain"
  source: "30385153a66b"
honeygain.referral.bonus.referee:
  text: "$3 bonusu za rejestrację z tego linku"
  source: "9ee5d2215305"
honeygain.obligations.withdraw-before-24-month-write-off.title:
  text: "Wypłać saldo Honeygain"
  source: "0868662c5a12"
honeygain.obligations.keep-active-6-months.title:
  text: "Utrzymuj udostępnianie na urządzeniu Honeygain albo zrób wypłatę"
  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "Zarobki pozostają ważne przez 24 miesiące od osiągnięcia minimum $20. Potem Honeygain może umorzyć to, co nie zostało wypłacone."
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
  text: "Jeśli aplikacja nie jest używana przez ponad 6 miesięcy, Honeygain uznaje niewypłacone saldo za wygasłe, nawet poniżej $20."
  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "Utrzymuj udostępnianie na jednym urządzeniu albo zleć wypłatę. W trybie JumpTask stałe saldo jest normalne, więc wybierz Nie dla mnie."
  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "Regulamin pozwala Honeygain umorzyć zarobki, które osiągnęły próg $20 i nie zostały wypłacone w ciągu 24 miesięcy, oraz uznać zarobki za wygasłe po sześciu miesiącach nieużywania."
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "Minimum to $20, a wypłaty PayPal idą przez Tipalti, który pobiera $2.02 za każdą płatność."
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "Regulamin pozwala Honeygain zawiesić konto oraz wstrzymać lub umorzyć zarobki, które uzna za zgromadzone pod fałszywym pretekstem."
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "Przed pierwszą wypłatą PayPal Tipalti każe potwierdzić numer telefonu komórkowego SMS-em i podać imię i nazwisko, adres oraz datę urodzenia."
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "Regulamin mówi, że klienci biznesowi używają ruchu do zbierania publicznie dostępnych danych z sieci, ale nie wymienia żadnego klienta, a Ty nie możesz wiedzieć, który klient korzysta z Twojego łącza."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "Odpowiedzi samego Honeygain na opinie o niskich zarobkach mówią, że zarobki zależą od popytu w sieci i lokalizacji; recenzenci piszą, że dojście do minimum $20 zajęło im bardzo dużo czasu."
  source: "634fb331e65b"
honeygain.rating.pros.0.text:
  text: "Honeygain publikuje własny obraz Docker, honeygain/honeygain."
  source: "ea44bd3c855c"
honeygain.rating.pros.1.text:
  text: "Regulamin podaje operatora, Honeygain UAB, zarejestrowanego w Wilnie na Litwie."
  source: "579a169fcf35"
honeygain.rating.pros.2.text:
  text: "Strona prasowa Honeygain podaje, że firmę założono w 2019 roku."
  source: "a3bfbdb33f54"
ionet.description:
  text: "io.net to zdecentralizowana sieć GPU do zadań AI/ML. Zbiera bezczynne karty GPU od użytkowników prywatnych i centrów danych. Aby zarobki były znaczące, wymaga karty NVIDIA z co najmniej 8GB VRAM. Obsługiwane są wdrożenia oparte na kontenerach.\n"
  source: "5d017f77f0ac"
ionet.short_description:
  text: "Zdecentralizowana sieć GPU dla AI - wymagana karta NVIDIA"
  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "Wymaga karty NVIDIA z co najmniej 8GB VRAM. Deklaracje dla RTX 4090 to $500-1000/mies. (w praktyce prawdopodobnie mniej)."
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "Według epok"
  source: "75743e03bad2"
ionet.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "Nagrody dla dostawców były wypłacane z emisji tokenów niezależnie od opłaconych zadań, a właściciele GPU piszą, że ich karty przez większość czasu stoją bezczynnie."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "Nagrody są w tokenie IO, a w 2026 model wypłat zmieniono na mechanizm powiązany z dolarem."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "W kwietniu 2024 około 1.8 mln fałszywych GPU próbowało dołączyć dzięki wyciekłemu tokenowi uwierzytelniającemu, a CEO ustąpił później, jeszcze przed premierą tokena."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "CashPilot nie uruchamia io.net: korzystasz z własnego oprogramowania workera dostawcy, więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować. Jego regulaminu nie sprawdzono pod kątem kontenerów."
  source: "1cac289c99ad"
iproyal.description:
  text: "IPRoyal Pawns pozwala zarabiać na udostępnianiu nieużywanej przepustowości. IPRoyal to uznany dostawca proxy, a Pawns to jego dział udostępniania przepustowości domowej. Obraz Docker z CLI przyjmuje dane logowania przez flagi wiersza poleceń. Nowy użytkownik, który zarejestruje się przez link polecający, dostaje $1 przy każdej z pierwszych trzech wypłat, łącznie do $3. Każda wypłata musi nastąpić w oknie czasowym od jednego do trzech tygodni, zależnym od lokalizacji. Okno zaczyna się w chwili rejestracji i zaczyna od nowa po każdej wypłacie. Jeśli okno zamknie się wcześniej, pozostałe bonusy przepadają.\n"
  source: "b12878d5917a"
iproyal.short_description:
  text: "Udostępnianie przepustowości - do $3 bonusu przy pierwszych wypłatach"
  source: "20091c7b26ed"
