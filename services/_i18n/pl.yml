iproyal.docker.health_signals.0.means:
  text: "IPRoyal Pawns wyłączył to konto."
  source: "a3a68b67f1aa"
iproyal.docker.health_signals.1.means:
  text: "Pawns widzi inne aktywne urządzenie na tym adresie IP i płaci tylko za jedno na IP, więc ta kopia działa, ale nic nie udostępnia i nic nie zarabia. Zatrzymaj każdą inną aplikację Pawns na tym IP: na innej maszynie, komputerze lub telefonie. Jeśli żadnej nie ma, poczekaj, aż Pawns usunie stare urządzenie, albo poproś wsparcie Pawns o jego zwolnienie."
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "Zarobki zależą od lokalizacji i zużycia przepustowości. Domowe IP z USA i UE zarabiają więcej."
  source: "424261bf08d4"
iproyal.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "Minimum $5. Najpierw wybierz kraj; od niego zależą metody. Z Hiszpanii (październik 2026): PayPal 4% z minimalną opłatą $0.25, wypłacany przez Tremendous, który wysyła e-mailem link, pod którym podajesz imię i nazwisko oraz adres PayPal; USDT (BEP20, ERC20, TRC20) lub USDC (BEP20, ERC20) z opłatą sieciową $1; Bitcoin z minimalną opłatą $2; karty podarunkowe bez opłat. Pierwsza wypłata wymaga jednorazowej weryfikacji numeru telefonu SMS-em: otwiera ją Withdraw, a numer podajesz z kierunkowym kraju. Potem każda wypłata wymaga kodu wysłanego na e-mail konta i jest sprawdzana do 72 godzin przed wysłaniem."
  source: "0430fae34eb5"
iproyal.payout.notes:
  text: "Saldo przechowuje IPRoyal Pawns; wypłacane na żądanie."
  source: "e11da90d5216"
iproyal.collector.credential_hint:
