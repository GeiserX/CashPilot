mysterium.description:
  text: "MystNodes (Mysterium Network) to zdecentralizowana sieć VPN i proxy oparta na technologii blockchain. Zarabiasz tokeny MYST, uruchamiając węzeł, który świadczy użytkownikom usługi VPN, proxy i scrapingu danych. Wymaga uprawnień NET_ADMIN, SETUID i SETGID oraz urządzenia TUN, którego używa we własnej przestrzeni nazw sieci na odgrodzonym barierą moście aplikacji zarobkowych. Ma wbudowany interfejs WWW do zarządzania węzłem. Działa zarówno na łączach domowych, jak i na VPS, ale bonus za polecenie jest wypłacany tylko za węzły na IP domowym.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Zdecentralizowany węzeł VPN - oparty na blockchainie, działa na VPS"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "Adres WebUI"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "Zakres portów UDP"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "Adresy hosta, na których publikowany jest WebUI węzła (port 4449). 127.0.0.1 ogranicza go do tej maszyny. Aby dostać się do niego przez reverse proxy, dodaj adres, z którego łączy się proxy, po przecinku bez spacji: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "Porty UDP, których węzeł używa do sesji VPN, w formacie start:end. Przekieruj ten sam zakres na routerze. Każda sesja zajmuje około dwóch portów, więc domyślne 30 obsłuży około 15 sesji naraz, więcej niż dostaje węzeł domowy. Szerszy zakres niczego nie naprawi i więcej kosztuje: każdy opublikowany port spowalnia start i usuwanie węzła (300 portów to około 12 s startu), CashPilot przyjmuje najwyżej 300, a przy domyślnym userland proxy Dockera każdy port zajmuje też około 2.5 MB pamięci. Sesje, które wszystkie się nie udają, to problem routera, a nie za mała liczba portów: zobacz „Routers that rewrite UDP source ports” w przewodniku Mysterium. Trzymaj się poniżej 32768: porty 32768-60999 to zakres efemeryczny Linuksa, w którym dowolny program na hoście może na chwilę zająć port, a jeden zajęty port uniemożliwia start węzła. Węzeł, który ma już zakres, zachowuje go."
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "Magazyn kluczy tożsamości węzła. Jego zniszczenie tworzy zupełnie nową tożsamość: węzeł traci reputację i wszystkie zarobki wciąż przypisane do starej."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "Węzeł nie może uruchomić sudo w swoim kontenerze, więc nie może skonfigurować interfejsu VPN ani zapory i każda sesja kończy się błędem przy konfiguracji: wygląda na aktywny, a nic nie zarabia. Kontener utworzono bez uprawnień SETUID i SETGID. Zaktualizuj CashPilot i workera, na którym działa ten węzeł, a potem wdróż ponownie Mysterium z panelu; tożsamość węzła jest w jego wolumenie danych i zostanie zachowana."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "W ciągu ostatnich 6 godzin żadna sesja VPN nie dotarła do tego węzła bezpośrednio. Każda przeszła na hole punching, a wielu kupujących nie może połączyć się w ten sposób, więc węzeł zarabia mniej. Jego porty UDP nie są osiągalne z internetu. Na routerze przekieruj zakres portów UDP ${UDP_PORTS} (start:end, ten sam zakres po obu stronach) na ${HOST_ADDRESS}. Komunikat zniknie sam, gdy jakaś sesja połączy się bezpośrednio."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Monitoring Mysterium oznacza węzeł na ${WORKER_NAME} jako niesprawny, więc nie trafia on na listę węzłów, z której wybiera większość kupujących, nawet gdy jego własna kontrola mówi, że każdy port jest osiągalny. Najpierw upewnij się, że węzeł ma /dev/net/tun oraz SETUID/SETGID, bo ich brak daje taki sam błąd: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Gdy to jest w porządku, częstą przyczyną jest router przed ${WORKER_NAME}, który przepisuje port źródłowy UDP odpowiedzi węzła, gdy tylko pakiet z zewnątrz dotrze do tego portu. Zobacz test w przewodniku: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "Ostatnie pięć sesji VPN węzła na ${WORKER_NAME} kończyło się po około minucie bez przesłania danych, więc węzeł nic nie zarabia, choć wygląda na aktywny. Prawdopodobną przyczyną jest router przed ${WORKER_NAME}: gdy pakiet z zewnątrz dotrze do portu, router przepisuje port źródłowy kolejnych odpowiedzi węzła z tego portu, a każda sesja zaczyna się od takiego pakietu (własnej kontroli portów węzła), więc kupujący odrzucają odpowiedzi węzła. Szerszy zakres portów nie pomoże. Zobacz test i rozwiązania w przewodniku: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Komunikat zniknie, gdy jakaś sesja prześle dane."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Zarobki w tokenach MYST. IP domowe zarabiają znacznie więcej. WebUI węzła na porcie 4449 służy do zarządzania i domyślnie jest publikowane tylko na maszynie, na której działa (127.0.0.1); z innej maszyny najpierw otwórz tunel SSH (ssh -L 14449:127.0.0.1:4449 i adres maszyny, na której działa węzeł, a potem otwórz w przeglądarce http://127.0.0.1:14449; lokalny port 14449, aby nie kolidował z węzłem na Twojej własnej maszynie) albo dodaj adres do UI_ADDRESS (zobacz WebUI address w przewodniku Mysterium). VPS akceptowane. Przekierowanie portów UDP 23000-23029 (domyślne UDP_PORTS) jest mocno zalecane -- bez niego węzły dostają status Strict NAT, a wiele sesji VPN się nie udaje, co poważnie obniża przychód. Ważne: po pierwszym uruchomieniu ustaw portfel beneficjenta (rozliczeniowy) przez WebUI węzła lub CLI zgodnie ze swoim kontem mystnodes.com -- to łączy zarobki on-chain z Twoim panelem w chmurze."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Automatyczne rozliczenie on-chain za każdym razem, gdy węzeł ma 5 MYST nierozliczonych"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Nie ma przycisku do naciśnięcia. Każdy węzeł sam rozlicza się w sieci Polygon, gdy uzbiera 5 MYST nierozliczonych, a około 21% pochłaniają opłaty (20% opłaty Hermes plus niewielka opłata transakcyjna), więc na portfel beneficjenta trafia z każdego rozliczenia mniej więcej 3.9 MYST. TequilAPI każdego węzła wyświetla jego rozliczenia pod /transactor/settle/history. Kwota „total earnings” w MystNodes obejmuje tylko ostatnie 30 dni; nie jest to ani saldo, ani suma od początku. Bonusowe MYST z programu nagród MystNodes nie rozliczają się same: odbierz je na stronie Rewards, według centrum pomocy MystNodes w ciągu 30 dni od dystrybucji."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "Portfel beneficjenta ustawia się PO wdrożeniu, przez TequilAPI lub WebUI węzła -- nie przez zmienną środowiskową, więc nie da się go odczytać ze specyfikacji kontenera."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Użyj e-maila i hasła swojego konta MystNodes (tych samych co w <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST za każdego znajomego, którego węzeł zarobi 5 MYST (tylko IP domowe)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST, gdy Twój węzeł zarobi pierwsze 5 MYST (IP domowy, węzeł przypisany na mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Odbierz nagrody MystNodes z zeszłego miesiąca"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Nagrody nieodebrane w ciągu 30 dni od comiesięcznej dystrybucji przepadają i wracają do puli następnego miesiąca."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Otwórz stronę Rewards i wymień swoje punkty na MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Przepustowość. Twoje łącze służy jako węzeł wyjściowy sieci Mysterium, która sprzedaje usługi VPN, proxy ORAZ scrapingu danych. Ruch scrapingowy wychodzący z IP domowego najczęściej ściąga skargi, a nie możesz wybrać, który z tych trzech rodzajów obsługuje Twój węzeł."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Tak. Obcy ludzie kierują swój ruch przez Twój adres IP — to jest właśnie produkt."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "Tożsamość węzła (adres blockchain), Twój IP i przybliżona lokalizacja (kraj/miasto/dostawca internetu), które węzeł publikuje w sieci, aby kupujący mogli go wybrać."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Realne i warte zrozumienia. Ruch innych osób wychodzi z Twojego łącza i jest przypisywany Tobie, więc wszystko, co robią, wygląda tak, jakby pochodziło z Twojej linii. Wiele umów z dostawcami internetu dla klientów domowych tego zabrania. Sprawdź swoją, zanim go uruchomisz."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Bez limitu urządzeń na konto i na IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Około 21% każdego rozliczenia pochłaniają opłaty: 20% opłaty Hermes plus opłata transakcyjna, a zarobki są wypłacane w tokenie MYST."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Twój węzeł jest wyjściem dla klientów VPN, proxy i scrapingu danych Mysterium, a nie możesz wybrać, których z nich obsługuje."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "Oprogramowanie węzła jest otwartoźródłowe, na licencji GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium publikuje własny obraz Docker, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "Rozliczenia trafiają do portfela, który należy do Ciebie; nie jest potrzebny numer telefonu ani dokument tożsamości."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "Projekt węzła działa od 2017 roku."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Strona Mysterium podaje, że sieć rozwija Blockdev AG z Zug w Szwajcarii."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay to sieć DePIN, która nagradza użytkowników za udostępnianie przepustowości przez rozszerzenie przeglądarki. Platforma jest za ochroną Cloudflare, co może utrudniać automatyczny dostęp. Użytkownicy zarabiają Nodepay Points, utrzymując rozszerzenie aktywne. Sieć skupia się na dostarczaniu infrastruktury danych do trenowania AI.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "Udostępnianie przepustowości DePIN dla AI - rozszerzenie przeglądarki"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Zarabia Nodepay Points; punkty użytkowników, którzy przejdą kontrole kwalifikacyjne Nodepay, są wymieniane na token NC. Ochrona Cloudflare może blokować automatyczne zbieranie danych. Wymagane rozszerzenie przeglądarki."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Airdrop tokena NC (termin niepotwierdzony)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "System oparty na punktach. Punkty użytkowników, którzy przejdą kontrole kwalifikacyjne Nodepay, są wymieniane na token NC, który wystartował w styczniu 2025."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "W podsumowaniu pierwszego sezonu Nodepay usunął ponad 300 000 kont uznanych za boty i anulował 17 mld punktów."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Nagrody to punkty wymieniane na token NC, więc ich wartość zależy od tokena."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot nie uruchamia Nodepay: korzystasz z własnego rozszerzenia przeglądarki dostawcy, więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować. Jego regulaminu nie sprawdzono pod kątem kontenerów."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes to darmowy poziom wejściowy Noderr Protocol, projektu DeFi na Base L2. Mikrowęzeł to mały agent na zapasowym telefonie z Androidem, komputerze z Windows, Macu lub w przeglądarce Chromium. Na Androidzie udostępnia mobilne łącze telefonu: inny ruch Noderr wychodzi przez IP operatora komórkowego telefonu, więc potrzebna jest karta SIM z transmisją danych. Na komputerze lub w przeglądarce wykonuje dla protokołu zadania automatyzacji, używając wolnej mocy obliczeniowej. Nagrody mają być wypłacane w NODR, skalowane według zapisanej on-chain oceny czasu działania i niezawodności, ale w fazie beta sieć działa na testnecie Base Sepolia: nagrody dla węzłów nie są zasilone i dotąd żadnych nie wypłacono.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Darmowy mikrowęzeł (udostępnianie łącza na Androidzie, Windows, Mac, przeglądarka) - testnet, nagrody na razie niezasilone"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Beta na testnecie: nagrody dla węzłów nie są zasilone i dotąd żadnych nie wypłacono. Podawane na stronie APY 5-10% to cel projektowy. Wróć do tego, gdy sieć opuści Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Nagrody trafiają do własnego portfela węzła i odbiera się je z aplikacji lub dAppki. W fazie beta są to tokeny testnetu Base Sepolia bez wartości rynkowej."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "Aplikacja przy pierwszym uruchomieniu tworzy portfel węzła i wybija do niego darmowy, nieprzenoszalny (soulbound) Utility NFT. Zrób kopię zapasową portfela z aplikacji: utrata urządzenia oznacza utratę tożsamości węzła. W fazie beta nagrody są na Base Sepolia (testnet)."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android wymaga karty SIM z transmisją danych; klienci desktopowi i przeglądarkowi nie mają opublikowanych wymagań co do IP."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Zależy od urządzenia. Telefon z Androidem sprzedaje swoje łącze mobilne: inny ruch Noderr wychodzi przez adres IP operatora komórkowego telefonu i zużywa jego pakiet danych. Komputer z Windows, Mac lub przeglądarka sprzedaje wolną moc obliczeniową na to, co dostawca nazywa zadaniami automatyzacji mediów społecznościowych i treści."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Tak. Na Androidzie inny ruch Noderr wychodzi przez mobilny adres IP Twojego telefonu; przed startem aplikacja prosi o zarejestrowaną zgodę, a udostępnianie możesz zatrzymać na tym samym ekranie. W przypadku klientów na Windows, Mac i przeglądarkę dostawca opisuje zadania automatyzacji i nie mówi, czy przenoszą one ruch innych osób."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "Adres portfela węzła oraz dane o czasie działania i wykonanych zadaniach trafiają on-chain jako ocena reputacji (TrustFingerprint). Dostawca mówi, że zadania są anonimizowane, działają w sandboxie, a klucze portfela nigdy nie opuszczają urządzenia. Nic bardziej szczegółowego nie opublikowano."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Na Androidzie udostępniane łącze to mobilny abonament operatora: dokumentacja samego dostawcy ostrzega, że udostępnianie może być niedozwolone w zasadach dopuszczalnego użytkowania niektórych operatorów, a udostępniany ruch zużywa limit pakietu. W przypadku klientów desktopowych i przeglądarkowych dostawca nic nie mówi o regulaminach dostawców internetu."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Jeden węzeł na urządzenie, każdy z własnym nieprzenoszalnym Utility NFT; uruchamianie kilku urządzeń jest dozwolone i zalecane. Nie opublikowano limitu na IP. Nie ma konta w zwykłym sensie: tożsamością jest portfel generowany przez aplikację przy pierwszym uruchomieniu."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Nagrody dla węzłów to niezasilone tokeny testnetu bez wartości rynkowej i żadnych nie wypłacono; APY 5 do 10% na jego stronie to cel projektowy."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "W przypadku klientów desktopowych i przeglądarkowych Noderr opisuje zadania automatyzacji i nie mówi, czy przenoszą one ruch innych osób."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Dostawca mówi, że zadania są anonimizowane i działają w sandboxie, ale nie publikuje nic bardziej szczegółowego."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Wciąż beta na testnecie Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot nie uruchamia Noderr: korzystasz z własnej aplikacji lub rozszerzenia dostawcy, więc CashPilot nie może ich za Ciebie wdrożyć ani zaktualizować. Ich regulaminu nie sprawdzono pod kątem kontenerów."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Bez konta: aplikacja generuje portfel przy pierwszym uruchomieniu."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle wykorzystuje Bluetooth w smartfonach do tworzenia infrastruktury IoT. Aplikacja w tle wykrywa i przekazuje dane z pobliskich urządzeń IoT, zarabiając tokeny NODL. Opisywany w Forbes, partnerstwa biznesowe z Vivendi i Hayden AI. Tylko na urządzenia mobilne (iOS i Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Przekaźnik IoT przez Bluetooth - aplikacja mobilna, nagrody w tokenach NODL"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Bardzo niskie zarobki. Aplikacja telefoniczna działająca w tle przez Bluetooth. Połączenie portfela może działać zawodnie."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Na bieżąco"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL znajduje się we własnym portfelu aplikacji na ZKsync Era; sprawdzisz go w aplikacji lub w eksploratorze bloków ZKsync Era. Nodle opuścił swój parachain Polkadot, a most Polkadot-ZKsync zamknięto 31 grudnia 2025, więc NODL pozostałych po stronie Polkadot nie da się już przenieść na ZKsync."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "Twoje NODL są we własnym portfelu aplikacji Nodle w ZKsync Era. CashPilot nie widzi adresu tego portfela."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "Nagroda NODL za każdego nowego aktywnego użytkownika, który dołączy z zaproszenia (Nodle nie podaje kwoty)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Jeden recenzent pisze o około $3 zarobionych w ciągu trzech-czterech lat; inni zgłaszają gwałtowny spadek dziennych zarobków."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot nie uruchamia Nodle: korzystasz z własnej aplikacji telefonicznej dostawcy, więc CashPilot nie może jej za Ciebie wdrożyć ani zaktualizować. Jej regulaminu nie sprawdzono pod kątem kontenerów."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana to zdecentralizowany rynek mocy obliczeniowej GPU zbudowany na Solanie. Łączy właścicieli GPU z popytem na zadania AI i płaci w tokenach NOS. RTX 3060 zarabia około $0.048/godz. Platforma skupia się na zadaniach wnioskowania AI i używa blockchaina Solana do planowania zadań i rozliczania płatności. Węzły uruchamiają skonteneryzowane zadania przez Nosana CLI.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Moc obliczeniowa GPU na Solanie - tokeny NOS, RTX 3060 ~$0.048/godz."
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/godz., mocniejsze karty zarabiają więcej. Zarobki zależą od dostępności zadań i modelu GPU. Wymaga karty NVIDIA, Linuksa, Dockera i Nosana CLI. Płatności w tokenie NOS na Solanie."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "Po ukończeniu każdego zadania"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Zarabiasz tokeny NOS na Solanie. Wypłata na skonfigurowany portfel."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Nosana domyślnie tworzy portfel Solana, więc większość użytkowników nigdy nie widziała jego adresu."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Każdy host musi zablokować stawkę NOS dopasowaną do godzinowej ceny swojego GPU."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Hosty dostają zapłatę w NOS, więc zarobki w dolarach zmieniają się wraz z tokenem i popytem na ich kartę."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot nie uruchamia Nosana: korzystasz z własnego oprogramowania hosta dostawcy, więc CashPilot nie może go za Ciebie wdrożyć ani zaktualizować. Jego regulaminu nie sprawdzono pod kątem kontenerów."
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN to pula kopania Bitcoina bez konta: Twój miner loguje się, używając Twojego adresu Bitcoin jako nazwy użytkownika, a pula płaci na ten adres. CashPilot nie uruchamia tu minera. Odczytuje niewypłacone saldo, które OCEAN przechowuje dla Twojego adresu, więc widzisz, ile zarobił Twój ASIC (Bitaxe, Antminer), obok pozostałych dochodów. Niewypłacone saldo jest zarobione, ale jeszcze nie otrzymane: OCEAN wypłaca je on-chain, gdy przekroczy próg wypłaty.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Pula kopania Bitcoina, śledzona po adresie wypłat"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Gdy blok podniesie Twoje saldo powyżej progu"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN płaci on-chain na Twój adres, gdy niewypłacone saldo osiągnie próg. Wypłat przez Lightning (opcjonalnych, BOLT12) CashPilot nie wykrywa."
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "Niewypłacone jest zarobione, ale nie otrzymane, dopóki OCEAN nie wypłaci tego on-chain na ten adres, chyba że włączono wypłaty przez Lightning."
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "Twój adres wypłat BTC: nazwa użytkownika, której Twój miner używa w OCEAN, bez części <b>.workername</b>. Jest publiczny i nie daje dostępu do żadnych środków."
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "Wymaga koparki ASIC do Bitcoina (Bitaxe, Antminer) skierowanej na mine.ocean.xyz:3334"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "moc obliczeniowa"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
  text: "Nie. Twój miner wysyła hashe do puli; nikt nie kieruje ruchu przez Twoje łącze."
  source: "7239118f749a"
ocean.disclosure.data_collected:
  text: "Twój adres Bitcoin, wybrane przez Ciebie nazwy workerów, Twój hashrate i adres IP Twojego minera widziany przez pulę."
  source: "22282404721c"
ocean.disclosure.isp_risk:
  text: "Miner utrzymuje jedno otwarte połączenie z pulą i zużywa mało przepustowości. Kosztem, na który trzeba uważać, jest prąd, a nie dostawca internetu."
  source: "7bf5f9f6b028"
ocean.disclosure.account_rules:
  text: "Nie ma konta. Tożsamością jest adres, a jego statystyki każdy może odczytać na ocean.xyz."
  source: "e3c8fd5863c1"
ocean.rating.cons.0.text:
  text: "Płatne tylko w Bitcoinie, a nic nie jest wypłacane on-chain, dopóki saldo nie osiągnie 0.01048576 BTC."
  source: "9c9981f2fbd5"
ocean.rating.cons.1.text:
  text: "Opłata puli 2% albo 1%, gdy budujesz własne szablony bloków za pomocą DATUM."
  source: "497f4f1ec62e"
ocean.rating.cons.2.text:
  text: "CashPilot nie uruchamia minera dla OCEAN: kierujesz na pulę własny sprzęt, a CashPilot tylko odczytuje saldo."
  source: "eccc0b4b47ae"
ocean.rating.pros.0.text:
  text: "Bez konta i bez weryfikacji tożsamości. OCEAN prosi tylko o adres Bitcoin, na który płaci."
  source: "38c4a7764846"
packetstream.description:
  text: "PacketStream to rynek przepustowości peer-to-peer, na którym możesz sprzedawać nieużywaną przepustowość. Napędza sieć proxy domowych używaną do badań rynku, monitorowania SEO i weryfikacji reklam. Prosta konfiguracja Docker, wymagany tylko CID (Client ID). Pamiętaj, że logowanie chronione CAPTCHA może utrudniać automatyczne zbieranie zarobków.\n"
  source: "ee363f486228"
packetstream.short_description:
  text: "Udostępnianie przepustowości - prosta konfiguracja przez CID"
  source: "583d6cb0e210"
packetstream.docker.env.CID.label:
  text: "Client ID"
  source: "8726db013948"
packetstream.docker.env.CID.description:
  text: "Zaloguj się na <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> → kliknij Setup na pasku bocznym → Twój CID jest widoczny w poleceniu Docker"
  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream odrzuca adres IP tej kopii jako niedomowy, więc nic ona nie zarabia. Uruchom ją na maszynie podłączonej do domowego łącza internetowego albo usuń tę kopię."
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "PacketStream ma już innego klienta na tym adresie IP i płaci tylko za jednego na IP. Usuń tę kopię albo tę drugą, która dzieli z nią IP."
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "Płaci $0.10/GB za udostępnioną przepustowość. Zarobki mocno zależą od popytu na lokalizację Twojego IP."
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "Tylko PayPal, minimum $5, opłata 3% pokazywana przed potwierdzeniem. Pierwsza wypłata zapisuje Twój e-mail PayPal; późniejsza zmiana wymaga potwierdzenia e-mailem i 7 dni oczekiwania, więc sprawdź adres przed potwierdzeniem. Zlecenia są sprawdzane i wysyłane w ciągu 7 dni; oczekujące zlecenie możesz anulować, a nowe możesz złożyć dopiero, gdy poprzednie zostanie wypłacone."
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "Saldo przechowuje PacketStream; wypłacane na żądanie."
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "Zaloguj się na <a href='https://packetstream.io' target='_blank'>packetstream.io</a>, naciśnij F12 → Application → Cookies, skopiuj wartość ciasteczka <b>auth</b> (to JWT)."
  source: "15bae9d455f5"
packetstream.referral.bonus.referrer:
  text: "20% ich zarobków z przepustowości (czasowy bonus Packeter)"
  source: "964a44bb9e65"
packetstream.referral.bonus.referee:
  text: "10% bonusu przy pierwszej wpłacie kartą lub przez PayPal (klienci proxy)"
  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "Recenzenci na Trustpilot w 2025 i 2026 zgłaszają wypłaty, które przychodzą z opóźnieniem albo wcale, a jeden wieloletni użytkownik pisze, że wypłaty zwolniły, a potem ustały; inni w 2026 zgłaszają, że dostali zapłatę."
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "Tylko PayPal, z opłatą 3% za wypłatę; użytkownicy w krajach, których PayPal nie obsługuje, nie mają innej metody."
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "Regulamin pozwala PacketStream wstrzymać, cofnąć lub unieważnić zarobki, które powiąże z oszustwem, manipulacją lub niedozwoloną działalnością."
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
  text: "Regulamin mówi, że klienci proxy i sam PacketStream kierują ruch przez Twoje łącze; nie opisuje żadnej weryfikacji zwykłych kupujących."
  source: "fd4707690d2b"
packetstream.rating.cons.4.text:
  text: "Trustpilot zaznacza, że PacketStream nie odpowiedział na negatywne opinie; recenzenci zgłaszają e-maile bez odpowiedzi."
  source: "4885bceb8df9"
packetstream.rating.pros.0.text:
  text: "PacketStream publikuje własny obraz Docker, packetstream/psclient."
  source: "b358af0b3419"
packetstream.rating.pros.1.text:
  text: "Regulamin wymaga tylko urządzenia i łącza, które należą do Ciebie lub z których możesz korzystać."
  source: "bde1b5ad5a6a"
packetstream.rating.pros.2.text:
  text: "Regulamin nie opisuje weryfikacji tożsamości; wypłata wymaga adresu PayPal."
  source: "a05886b55edc"
packetstream.rating.pros.3.text:
  text: "Regulamin podaje PacketStream Inc. i prawo Kalifornii."
  source: "7966bde559dd"
packetstream.rating.pros.4.text:
  text: "PacketStream działa od 2018 roku."
  source: "70db8167d5bc"
passiveapp.description:
  text: "PassiveApp to platforma DePIN, która pozwala zarabiać nagrody w kryptowalutach i przez PayPal, udostępniając nieużywaną przepustowość i moc obliczeniową. W praktyce tylko Windows: własna strona pobierania producenta od co najmniej lutego 2025 bez zmian podaje Androida, iOS i Linuksa jako „coming soon”, a wersji na macOS nie ma — mimo że teksty marketingowe na tej samej stronie obiecują szerszą obsługę. Brak obrazu Docker.\n"
  source: "e0f069b6b6e0"
passiveapp.short_description:
  text: "Przepustowość/moc obliczeniowa DePIN - tylko Windows, wypłaty w kryptowalutach i przez PayPal"
  source: "e23871afdcd9"
passiveapp.earnings.notes:
  text: "Tylko aplikacja desktopowa na Windows (v1.0.x); Android/iOS/Linux producent zapowiada jako 'coming soon' od początku 2025 i nigdy ich nie wydał. Brak oficjalnego obrazu Docker."
  source: "57f5891e1772"
passiveapp.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
passiveapp.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
passiveapp.referral.bonus.referrer:
  text: "10% ich zarobków dożywotnio"
  source: "f0262d54b65c"
passiveapp.rating.cons.0.text:
  text: "CashPilot nie uruchamia PassiveApp: korzystasz z własnej aplikacji desktopowej dostawcy, więc CashPilot nie może jej za Ciebie wdrożyć ani zaktualizować. Jej regulaminu nie sprawdzono pod kątem kontenerów."
  source: "2b27df807548"
passiveapp.rating.pros.0.text:
  text: "Strona PassiveApp podaje PayPal, kryptowaluty i karty podarunkowe od minimum $3."
  source: "5fb04eb0efdc"
proxybase.description:
  text: "ProxyBase to platforma udostępniania przepustowości, która płaci użytkownikom w kryptowalutach za udostępnianie nieużywanego łącza internetowego. Klienta peer uwierzytelniasz tokenem dostępu (Access Token) z panelu. Najwięcej zarabiają IP domowe, ale obsługiwane są też IP z centrów danych. Oficjalny wieloarchitekturowy obraz Docker (amd64/arm64/armv7).\n"
  source: "7a558682be11"
proxybase.short_description:
  text: "proxybase.org - udostępnianie przepustowości, wypłaty w kryptowalutach, logowanie tokenem dostępu. Żaden portfel nie jest generowany"
  source: "5224bb16fee4"
proxybase.docker.env.ID.label:
  text: "Token dostępu"
  source: "f9db72ced1ee"
proxybase.docker.env.NAME.label:
  text: "Nazwa urządzenia"
  source: "6415f86bc24f"
proxybase.docker.env.ID.description:
  text: "Zaloguj się na <a href=\"https://peer.proxybase.org/dashboard/login?referral=nXzS3c6iTO\">peer.proxybase.org/dashboard</a> → skopiuj swój Access Token (widoczny w poleceniu Docker na stronie konfiguracji)"
  source: "3571c2e99729"
proxybase.docker.env.NAME.description:
  text: "Dowolna nazwa (bez spacji) identyfikująca to urządzenie w Twoim panelu ProxyBase"
  source: "906ebedecbc7"
proxybase.docker.health_signals.0.means:
  text: "ProxyBase od co najmniej pół godziny nie może połączyć się ze swoim przekaźnikiem, więc nic nie zarabia. Restart to naprawia; jeśli problem nie zniknie po restarcie, sprawdź, czy ta maszyna ma dostęp do internetu."
  source: "cbe6b5ef771f"
proxybase.earnings.notes:
  text: "Wypłaty w kryptowalutach. Zarobki zależą od lokalizacji i zużycia przepustowości."
  source: "39229c292994"
proxybase.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
proxybase.cashout.notes:
  text: "Strona podaje minimum $0.20, a zlecenie poniżej $1 przeszło w październiku 2026. Zlecenie zawsze wypłaca całe saldo, jako USDC w sieci Polygon, POL lub Litecoin, na adres, który wpisujesz. ProxyBase pokrywa opłatę sieciową."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "Zarobki narastają na KONCIE ProxyBase, do którego należy token dostępu, i są wypłacane z panelu na żądanie. Klient peer nie ma portfela, a kontener nie przechowuje stanu -- docker.volumes jest puste. Nie myl z proxybase-xyz (ProxyBase Markets, ta sama organizacja), który naprawdę tworzy lokalny portfel i deklaruje go jako krytyczny wolumen."
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
  text: "Sam ProxyBase napisał w sierpniu 2025, że jest nowy i nie jest jeszcze miejscem do maksymalizowania zarobków."
  source: "9f5177f749d7"
proxybase.rating.cons.1.text:
  text: "ProxyBase zmienił klienta peer w 2026 i wyłączył stary backend, więc kontenery na starym obrazie dalej działały, ale przestały zarabiać."
  source: "452b38e35357"
proxybase.rating.cons.2.text:
  text: "Tylko kryptowaluty, jako USDC w sieci Polygon, POL lub Litecoin, bez metody fiat. Minimum to $0.20, a opłatę sieciową płaci ProxyBase."
  source: "2f15ff41b14c"
proxybase.rating.pros.0.text:
  text: "Nasza wypłata poniżej $1 przeszła w październiku 2026."
  source: "00e8781a2252"
proxybase.rating.pros.1.text:
