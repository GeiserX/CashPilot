  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "Centrum pomocy ProxyRack mówi, że usunięcie urządzenia zabiera z Twojego konta zarobki tego urządzenia, a wracają one tylko wtedy, gdy to samo urządzenie zostanie dodane ponownie."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack publikuje własny obraz Docker, proxyrack/pop, i akceptuje IP z centrów danych po niższej stawce."
