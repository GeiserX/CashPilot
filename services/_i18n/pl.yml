  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Działa na VPS i łączach domowych. Od 2026-10-06 płatne w SN25α (podsieć Bittensor 25) za każdą tygodniową epokę. Obsługuje tryb proxy dla konfiguracji z wieloma IP."
