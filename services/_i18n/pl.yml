wipter.description:
  text: "Wipter to platforma udostępniania przepustowości dostępna na Windows, Mac, Linuksa i Androida. Deklaruje wypłatę do $1/GB udostępnionej przepustowości przy minimalnym progu wypłaty $20. Platforma działa podobnie jak klasyczne aplikacje udostępniania przepustowości, kierując legalny ruch przez łącza domowe.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Udostępnianie przepustowości - deklaruje do $1/GB, min. wypłata $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Deklaruje do $1/GB, ale rzeczywiste zarobki są niższe. Minimalna wypłata $20. Zarobki mocno zależą od lokalizacji i popytu."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter nie ma panelu WWW. Otwórz aplikację Wipter na komputerze lub telefonie, zaloguj się i tam zleć wypłatę, gdy saldo osiągnie $20. Wipter płaci tylko w USDT w sieci BNB Smart Chain (BEP20), na portfel ustawiony w sekcji Payments aplikacji; nie ma opcji PayPal."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Jeszcze nieustalone: CashPilot nie sprawdził jeszcze, gdzie ta usługa przechowuje Twoje zarobki."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% ich zarobków z ruchu, gdy osiągną minimalną wypłatę, za każdego poleconego znajomego bez limitu"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "$5 bonusu za rejestrację"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot nie uruchamia Wipter: korzystasz z własnej aplikacji dostawcy na komputer lub telefon, więc CashPilot nie może jej za Ciebie wdrożyć ani zaktualizować. Jej regulaminu nie sprawdzono pod kątem kontenerów."
  source: "fa32942c6b4f"
xmrig.description:
  text: "Kop Monero za pomocą CPU. CashPilot uruchamia XMRig, a wybrana przez Ciebie pula płaci Monero na Twój publiczny adres wypłat. XMRig przeznacza 1% czasu haszowania na wsparcie swoich twórców. Prąd może kosztować więcej niż zarobione XMR."
  source: "a578c826aa2d"
