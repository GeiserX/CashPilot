urnetwork.description:
  text: "URnetwork to zdecentralizowana sieć VPN i udostępniania przepustowości. Zarabiasz, udostępniając przepustowość jako dostawca społecznościowy. Program dostawcy sam się uwierzytelnia e-mailem i hasłem Twojego konta (podpolecenie auth-provide) i zapisuje uzyskany JWT sesji w wolumenie danych. Oficjalny obraz Docker od BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
