xmrig.requirements.hosting_note:
  text: "Ta maszyna zgłasza łącze hostingowe. Przed kopaniem sprawdź regulamin swojego dostawcy. Niektórzy dostawcy, w tym Hetzner Cloud, tego zabraniają. Zanim zaufasz szacunkowi zysku, sprawdź swoje rzeczywiste koszty prądu."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "MoneroOcean, domyślna pula, pobiera 0% opłaty za kopanie. Domyślny próg wypłaty to 0.3 XMR i możesz go obniżyć do 0.003 XMR. Wypłaty poniżej 4 XMR mogą kosztować do 0.0004 XMR. Inne pule ustalają własne stawki i progi."
  source: "0a5db026488f"
