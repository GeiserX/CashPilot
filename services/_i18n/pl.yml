repocket.description:
  text: "Repocket pozwala zarabiać dochód pasywny, udostępniając nieużywaną przepustowość internetu. Najwięcej zarabiają IP domowe; IP z VPS i centrów danych są akceptowane po niższych stawkach. Maks. 5 urządzeń i 5 aktywnych sesji na konto. Kontener Docker uwierzytelnia się e-mailem konta i kluczem API z panelu Repocket (nie hasłem).\n"
