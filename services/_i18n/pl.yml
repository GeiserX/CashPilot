unmineable.earnings.notes:
  text: "Szacunek brutto, przed kosztami prądu, wypłacany w Twojej monecie po kursie przeliczenia unMineable. 2026-11-25 1 kH/s RandomX był wart około $1 miesięcznie. Procesor desktopowy na połowie wątków może pobierać dodatkowe 30 do 50 W. Sprawdź swoje rzeczywiste zużycie i cenę prądu, aby zobaczyć, czy to się opłaca."
  source: "cfe83489865c"
