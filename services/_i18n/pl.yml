  source: "985d03ae1755"
proxybase.rating.pros.2.text:
  text: "ProxyBase publikuje własny obraz klienta peer i obsługuje IP z centrów danych."
  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets to rynek proxy SOCKS5 stworzony dla agentów AI. Sprzedawcy uruchamiają lekki demon CLI w Rust, który łączy się przez WebSocket i przekazuje ruch kupujących przez ich łącze internetowe, zarabiając USDC w sieci Tempo Chain za każdy sprzedany GB. Obsługuje tryb bezpośredni (własna przepustowość) i upstream (odsprzedaż zewnętrznych proxy) z automatycznym ponownym łączeniem. Kupujący kupują sesje proxy według kraju, dostawcy internetu i przepustowości. Płatności przechodzą przez Machine Payments Protocol (MPP) w sieci Tempo Chain. Link polecający jest dla kupujących: kupujący, który otworzy przez niego konsolę, dostaje 10% więcej przy pierwszej wpłacie.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - rynek SOCKS5 dla agentów AI, wypłaty w USDC. Generuje portfel, którego wolumen przechowuje jedyną kopię klucza"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "URL API backendu"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "Nadpisz URL API backendu (domyślnie https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "Kontener sam się konfiguruje przy pierwszym uruchomieniu: generuje portfel secp256k1 (BIP-39), uwierzytelnia się metodą challenge-response ECDSA i zaczyna sprzedawać przepustowość w trybie tylko bezpośrednim. Cały stan (portfel, token sesji, konfiguracja sprzedawcy) jest zapisywany w wolumenie <code>proxybase-data</code>. Przy pierwszym uruchomieniu sprawdź adres portfela w logach kontenera. Użyj <code>--upstream</code>, aby dodać ścieżki odsprzedaży zewnętrznych proxy.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "Plik klucza wygenerowanego portfela. Ten wolumen TO są pieniądze: nie ma kopii po stronie serwera, więc jego usunięcie niszczy razem z nim środki."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Zarobki zależą od liczby GB sprzedanych po stawkach rynkowych. IP z VPS i centrów danych zarabiają mniej niż domowe. Tryb wielu upstreamów pozwala łączyć własną przepustowość z zewnętrznymi proxy."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "Na żądanie"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Zablokuj zarobki poleceniem <code>proxybase-cli seller payout create</code>; otrzymasz je jako USDC w sieci Tempo Chain (Tempo MPP). Płaci na dowolny adres EVM, do którego masz klucz (Tempo to sieć EVM), bez niczego do podpisywania; dodaj sieć Tempo do portfela, aby zobaczyć USDC. Jeśli portfel nadal go nie pokazuje, trzeba ręcznie dodać token Tempo USDC: zaimportuj go po adresie kontraktu podanym przez Proxybase i sprawdź ten adres, zanim zaufasz saldu."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "Klient przy pierwszym uruchomieniu tworzy własny portfel."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "15% każdej wpłaty poleconego kupującego, jako kredyt na Twoje własne sesje proxy"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "+10% przy pierwszej wpłacie kupującego"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "Przepustowość, jako proxy SOCKS5 sprzedawane kupującym na rynku ProxyBase."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Tak. Kupujący kierują swój ruch przez Twoje łącze — dokładnie to jest sprzedawane."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Adres portfela wygenerowany na Twojej maszynie oraz ilość przekazywanego ruchu."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Realne i dotyczy bezpośrednio łączy domowych. Ruch proxy od nieznanych kupujących wychodzi z Twojego IP, więc skargi na nadużycia trafiają do Ciebie. Nic w tym katalogu nie ogranicza usługi do adresów z centrów danych, a IP domowe zarabiają więcej, więc zachęta działa tu w złą stronę: zanim uruchomisz to w domu, przeczytaj regulamin swojego dostawcy internetu."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "nieznane - dostawca nie publikuje limitu urządzeń na konto ani na IP, a katalog go nie deklaruje."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "Wypłaty są w USDC w sieci Tempo Chain, na dowolny adres EVM, do którego masz klucz."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "Twoje łącze jest sprzedawane jako proxy SOCKS5 kupującym na rynku; nie znaleźliśmy opisu, jak kupujący są weryfikowani."
  source: "2dec55ca610f"
proxybase-xyz.rating.pros.0.text:
  text: "Tytuł jego własnej strony o zarabianiu mówi, że nie wymaga KYC, a wypłata jest od $1."
