urnetwork.docker.env.UR_USER_AUTH.description:
  text: "E-mail Twojego konta URnetwork (login, którego używasz na <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Konta utworzone przez logowanie Google/Apple muszą najpierw mieć ustawione hasło. Potrzebujesz konta? Zarejestruj się przez <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
