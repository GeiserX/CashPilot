proxylite.description:
  text: "ProxyLite zarabia na Twoim ruchu internetowym, udostępniając przepustowość zweryfikowanym organizacjom. Działa zarówno na łączach domowych, jak i na VPS oraz w centrach danych. Prosta konfiguracja, wymaga tylko ID użytkownika z panelu. Oferuje hojną dożywotnią prowizję 15% za polecenia.\n"
