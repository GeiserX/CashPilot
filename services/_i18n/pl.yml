proxyrack.description:
  text: "Program Peer od ProxyRack pozwala zarabiać, udostępniając przepustowość jako część ich sieci proxy. Każde urządzenie wymaga unikalnego 64-znakowego szesnastkowego UUID i opcjonalnie klucza API do automatycznej rejestracji urządzenia. Działa zarówno na łączach domowych, jak i na VPS oraz w centrach danych. Panel jest za Cloudflare, przez co klucz API może trzeba będzie pobrać ręcznie w przeglądarce.\n"
  source: "16b74380bb2a"
proxyrack.short_description:
