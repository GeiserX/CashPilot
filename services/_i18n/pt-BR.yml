  source: "be820103712e"
iproyal.cashout.notes:
  text: "Mínimo de $5. Selecione primeiro o seu país; os métodos dependem dele. A partir da Espanha (outubro de 2026): PayPal com 4% e taxa mínima de $0.25, pago pela Tremendous, que envia por e-mail um link onde você informa o seu nome e endereço do PayPal; USDT (BEP20, ERC20, TRC20) ou USDC (BEP20, ERC20) com taxa de rede de $1; Bitcoin com taxa mínima de $2; vales-presente sem taxa. O primeiro pagamento exige uma verificação única do seu número de telefone por SMS: Withdraw a abre, e o número é informado com o código do país. Depois disso, todo pagamento pede um código enviado para o e-mail da sua conta e passa por uma análise de até 72 horas antes de ser enviado."
