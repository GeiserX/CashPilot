  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "A Proxyrack documenta um limite de 500 dispositivos por CONTA e nenhum limite por IP. IPs de data center são aceitos, mas reclassificados para uma taxa mais baixa."
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "A central de ajuda da ProxyRack diz que remover um dispositivo tira os ganhos desse dispositivo da sua conta, e eles só voltam se o mesmo dispositivo for adicionado de novo."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "A ProxyRack publica a sua própria imagem Docker, proxyrack/pop, e aceita IPs de data center com uma taxa mais baixa."
  source: "278541f81053"
repocket.description:
  text: "O Repocket permite ganhar renda passiva compartilhando a largura de banda de internet que você não usa. IPs residenciais ganham mais; IPs de VPS/data center são aceitos com taxas mais baixas. Máximo de 5 dispositivos e 5 sessões ativas por conta. O contêiner Docker se autentica com o e-mail da sua conta e uma chave de API do painel do Repocket (não a sua senha).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Compartilhamento de banda - máx. 5 dispositivos, autenticação por chave de API"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "E-mail"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "Chave de API (UUIDv4, não a senha)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "O e-mail da sua conta Repocket"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "A sua chave de API do Repocket — faça login em <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> e copie a chave de API exibida na página bandwidth-earnings (ela NÃO é a senha da sua conta). Precisa de uma conta? Cadastre-se em <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "IPs residenciais ganham mais. IPs de VPS/data center são aceitos, mas com taxas mais baixas."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 após o primeiro pagamento)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
repocket.cashout.notes:
  text: "O Repocket define o mínimo por conta: $4 antes do primeiro pagamento e $2 depois dele, em outubro de 2026, bem abaixo dos $20 que ele anunciava antes. Métodos: Tremendous (para o seu e-mail) ou USDT na Polygon. Cada solicitação é confirmada por um link enviado por e-mail em até 2 horas, e só pode haver uma solicitação pendente por vez. Em outubro de 2026, o Repocket recusou uma solicitação via Tremendous com \"Please, message support\", enquanto a de USDT na Polygon foi processada."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Saldo mantido pelo Repocket; sacado sob solicitação."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Use o e-mail e a senha da sua conta Repocket (os mesmos de <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Precisa de uma conta? Cadastre-se em <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2 quando o indicado tiver ganhado $7, depois 5% dos ganhos dele para sempre"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "Bônus de $2 na carteira ao se cadastrar"
  source: "0227076a427a"
repocket.requirements.note:
  text: "O Repocket documenta um limite de cinco dispositivos por CONTA, mas não publica limite de dispositivos por IP. O número '2 dispositivos por IP' repetido em sites de avaliação não tem fonte do provedor, então o CashPilot não o afirma."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Mantenha um dispositivo Repocket compartilhando ou saque o seu saldo"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Após 12 meses sem login, saque ou compartilhamento de largura de banda, o Repocket pode confiscar o saldo não pago."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Mantenha um dispositivo compartilhando, entre na conta ou saque. Se você parar de usar o Repocket, saque antes."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Vários avaliadores do Trustpilot relatam pagamentos cancelados e saldos zerados; um diz que o suporte alegou ganhos de largura de banda irregulares. A página dá nota 2.7 ao Repocket e observa que ele não respondeu às avaliações negativas."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Avaliadores relatam saques recusados e a necessidade de ficar cobrando o pagamento."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "A política de pagamentos do Repocket permite estornar, cancelar ou confiscar definitivamente ganhos sempre que ele suspeitar que são inválidos, e confiscar os ganhos não pagos de uma conta inativa."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "A mesma política permite que o Repocket adicione, remova ou substitua métodos de pagamento a qualquer momento, sem aviso; o PayPal foi removido."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Os termos dizem que o Repocket pode exigir verificação de identidade ou de conta a qualquer momento, e o direito a receber pagamentos depende disso."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Os termos dizem que o Repocket e os seus parceiros usam a capacidade de rede, mas não dizem quem são os parceiros nem como são verificados."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "O Trustpilot observa que o Repocket não respondeu às avaliações negativas, e avaliadores dizem que as mensagens são ignoradas."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "Os termos atuais identificam a Repocket Pte. Ltd., em Singapura; os termos antigos não citavam nenhuma empresa."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "O Repocket publica a sua própria imagem Docker, repocket/repocket, e os termos permitem contêineres que sejam seus."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "O mínimo é baixo: $4 antes do primeiro pagamento e $2 depois dele."
  source: "ff8121a15aeb"
salad.description:
  text: "O Salad.io permite compartilhar a sua GPU para cargas de trabalho de IA distribuídas e ganhar saldo Salad, que pode ser trocado por vales-presente, jogos ou dinheiro. Apenas Windows, com um aplicativo nativo para desktop. Requer uma GPU dedicada (NVIDIA ou AMD). A plataforma envia inferência de IA, renderização e outras tarefas de computação para a sua máquina quando ela está ociosa. É uma das plataformas de compartilhamento de GPU mais fáceis de usar.\n"
  source: "09335baccea6"
salad.short_description:
  text: "Compartilhamento de GPU para IA - apenas Windows, pagamento em vale-presente ou dinheiro"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Os ganhos dependem do modelo da GPU e da disponibilidade de trabalho. RTX 3060 ~$1-3/dia. Apenas Windows. App nativo, sem suporte a Docker. Pode ser trocado por vales-presente, jogos ou PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal ou vales-presente pela loja do Salad."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Somente PayPal e vales-presente, nunca cripto. Não existe endereço de carteira, então o CashPilot não tem saldo on-chain para mostrar."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Faça login em <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, pressione F12 → Application → Cookies e copie o valor do cookie <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Ganhe alguns Salad Reward Points ou gaste o seu saldo"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Se uma conta não ganhar nenhum Reward Point por 12 meses seguidos, o saldo não resgatado dela pode expirar."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Rode o app Salad até ele ganhar ou gaste o saldo inteiro no Salad Storefront. Gastar só parte dele não reinicia os 12 meses."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "O CashPilot não roda o Salad: você usa o app para desktop do próprio provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. Os termos dele não foram verificados quanto ao uso em contêineres."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Vários avaliadores do Trustpilot em outubro e novembro de 2026 relatam saques via PayPal que chegaram rápido, alguns mais de uma vez; um avaliador no mesmo período diz que repetidas tentativas de saque falharam."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "A Sentinel é uma blockchain Layer 1 da Cosmos para VPN descentralizada. Os operadores de nó vendem largura de banda a usuários de VPN com preços flexíveis (por GB ou por hora). Há um guia oficial de implantação com Docker. É um projeto antigo, com uma comunidade ativa.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "VPN descentralizada na Cosmos - operadores de nó vendem largura de banda"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Os operadores definem os próprios preços por GB ou por hora. Os ganhos dependem da demanda de usuários de VPN na sua região."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Por sessão"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Ainda não determinado: o CashPilot ainda não verificou onde este serviço guarda os seus ganhos."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Os pagamentos são no token P2P, e 20% de cada pagamento de largura de banda vai para quem faz staking, não para o host do nó."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "O token foi renomeado de SENT para DVPN em 2021 e de DVPN para P2P em 2025."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "O CashPilot não roda a Sentinel: você usa o software de nó do próprio provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. Os termos dela não foram verificados quanto ao uso em contêineres."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "A Sentinel publica o código-fonte do nó sob a sua própria licença de código aberto."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "A Sia é um marketplace descentralizado de armazenamento mantido pela Sia Foundation (uma organização sem fins lucrativos suíça) e em funcionamento desde 2015. Rode o nó oficial hostd da Foundation para alugar espaço em disco sobrando e ganhar Siacoin com contratos de armazenamento e de largura de banda. Você precisa comprar algum Siacoin antes que o nó possa ganhar: os hosts bloqueiam uma garantia em cada contrato e pagam uma taxa por cada prova de armazenamento. A garantia volta quando um contrato é concluído e é queimada se o nó ficar offline ou perder dados, então ele precisa de uma máquina sempre ligada (a Sia fala em pelo menos 95% de tempo online). Os ganhos dependem de quantos dados os locatários realmente armazenam; a Sia recomenda cobrar $1 por TB por mês pelo armazenamento, então ela é indicada para máquinas com discos grandes sobrando, e não para fatias pequenas de VPS.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Nó de armazenamento da Sia Foundation - imagem Docker oficial, ganhe Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Frase de recuperação da carteira"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Senha do painel"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Diretório de armazenamento"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "Frase de recuperação BIP-39 que controla a carteira Siacoin do host. Gere uma com `docker run --rm ghcr.io/siafoundation/hostd seed` e faça backup dela -- é a ÚNICA forma de acessar os ganhos"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Senha da interface web e da API local do hostd (BasicAuth). Qualquer frase-senha longa"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Caminho no host, no seu maior disco, onde os dados dos locatários ficam armazenados (por exemplo, /srv/sia). Precisa de pelo menos 256GB livres"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Na implantação, o CashPilot cria uma nova carteira na máquina que roda o nó e mostra a frase de recuperação uma única vez: anote-a. Para usar uma carteira que você já tem, cole a frase de recuperação dela. Depois da implantação, envie algum Siacoin para a carteira do nó para a garantia e as taxas, depois adicione a pasta de armazenamento (/storage), defina os preços e anuncie o host no painel.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "A frase de recuperação da carteira (hostd.yml), o banco de dados da carteira, as configurações do host e o estado dos contratos. Perdê-lo significa perder a identidade do nó e o acompanhamento da receita dos contratos; a frase de recuperação que você anotou passa a ser a única forma de recuperar os fundos."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Dados armazenados dos locatários. Perdê-los faz as provas de armazenamento falharem e custa a garantia bloqueada nesses contratos."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Os hosts definem os próprios preços. A Sia recomenda $1 por TB armazenado por mês e mais de $5 por TB baixado, e 3.9% de cada pagamento de contrato vai para os detentores de Siafund. A renda aumenta conforme a quantidade de dados de locatários que chega ao nó, que começa em zero e cresce com o tempo online e o preço. A garantia (a Sia sugere 2x o preço do armazenamento) é bloqueada por contrato e devolvida quando ele é concluído com sucesso.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Os ganhos se acumulam na própria carteira Siacoin do host (controlada pela frase de recuperação). Converta os SC em uma exchange e saque de lá para banco/cartão; não há solicitação de pagamento junto ao provedor.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Os fundos ficam na carteira Sia controlada pela frase de recuperação, dentro do nó. A frase de recuperação fica apenas no volume de dados do hostd, na máquina que o roda; o CashPilot nunca a armazena. A frase que você anota quando a carteira é criada é a única forma de recuperação.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Um endereço público estável com as portas 9981 (TCP, consenso) e 9984 (TCP e UDP, contratos com locatários) encaminhadas. Hospedagem em data center/VPS é comum na Sia. A carteira precisa de Siacoin antes que o nó possa aceitar contratos."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Espaço em disco e a largura de banda para servi-lo."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Não. Os locatários armazenam fragmentos de arquivos criptografados no seu disco e os buscam de volta. Outras pessoas não encaminham tráfego arbitrário pelo seu IP."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "O endereço da sua carteira Sia, a chave pública do host e o IP:porta público que o nó anuncia para que os locatários possam acessá-lo."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Tráfego constante de upload/download na linha, parecido com rodar qualquer servidor de armazenamento; nenhum tráfego web anonimizado de terceiros é atribuído a você."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Sem permissão necessária: sem cadastro nem conta. A garantia é queimada se o nó deixar de entregar provas de armazenamento, por ficar offline ou perder dados."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Os ganhos são em Siacoin na sua própria carteira: não há pagamento para um banco, então você mesmo vende em uma exchange."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "A garantia é bloqueada por contrato e queimada se o host deixar de entregar provas de armazenamento por ficar offline ou perder dados."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Apenas cerca de 30% do armazenamento oferecido na rede está em uso, então um host novo disputa uma demanda pequena."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Os locatários armazenam fragmentos de arquivos criptografados e ninguém encaminha tráfego pelo seu IP, mas não encontramos onde a Sia diz quem são os locatários nem como são verificados."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "O hostd é desenvolvido de forma aberta pela Sia Foundation, desde 2022."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "O hostd é de código aberto, sob a licença MIT."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "A Sia Foundation publica o hostd como imagem de contêiner."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Sem permissão necessária: sem cadastro nem conta."
  source: "f1f8d4114f1e"
spide.description:
  text: "O Spide é um serviço de compartilhamento de largura de banda que permite monetizar a banda de internet que você não usa. Usa um ID de máquina opcional para identificar o dispositivo. Disponível por meio de imagens Docker da comunidade, do projeto income-generator.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Compartilhamento de banda - baseado em ID de máquina"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "ID da máquina"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "ID de máquina de um dispositivo já registrado (gerado automaticamente se ficar vazio)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Há poucas informações disponíveis. Os ganhos dependem da localização."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
spide.payout.notes:
  text: "Ainda não determinado: o CashPilot ainda não verificou onde este serviço guarda os seus ganhos."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% dos ganhos deles"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "Bônus de cadastro de $5"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "O tráfego por um mesmo IP público é dividido entre os dispositivos que o compartilham, então um segundo dispositivo na mesma conexão não acrescenta nada."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "O CashPilot não roda o Spide: você usa o app do próprio provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. Os termos dele não foram verificados quanto ao uso em contêineres."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Minere Pearl, Zano ou Ravencoin com uma GPU NVIDIA. O CashPilot baixa a versão oficial do SRBMiner-Multi na primeira inicialização e verifica o SHA-256. O pool que você escolher paga o seu endereço público de pagamento. O SRBMiner-Multi fica com 2% do tempo de hash no Pearl e 0.85% nas outras duas moedas. A eletricidade pode custar mais do que as moedas que você ganha."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Minere Pearl e outras moedas de GPU em uma GPU NVIDIA"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Endereço de pagamento"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
