  text: "Sob solicitação"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Bloqueie os ganhos com <code>proxybase-cli seller payout create</code>; eles chegam como USDC na Tempo Chain (Tempo MPP). Paga para qualquer endereço EVM cuja chave você tenha (a Tempo é uma rede EVM), sem nada para assinar; adicione a rede Tempo à carteira para ver os USDC. Uma carteira que ainda assim não os mostre precisa que o token USDC da Tempo seja adicionado manualmente: importe-o pelo endereço de contrato que a Proxybase fornece e confira esse endereço antes de confiar no saldo."
  source: "c3daffcb3fa4"
