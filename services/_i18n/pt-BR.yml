  source: "be820103712e"
wipter.cashout.notes:
  text: "O Wipter não tem painel web. Abra o app do Wipter para desktop ou celular, entre na conta e solicite o pagamento ali quando o saldo chegar a $20. O Wipter paga apenas em USDT na BNB Smart Chain (BEP20), para a carteira que você definir na seção Payments do app; não há opção de PayPal."
  source: "80cc5b3e017b"
wipter.payout.notes:
