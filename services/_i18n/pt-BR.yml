mysterium.description:
  text: "O MystNodes (Mysterium Network) é uma rede descentralizada de VPN e proxy construída com tecnologia blockchain. Você ganha tokens MYST rodando um nó que fornece serviços de VPN, proxy e coleta de dados (scraping) aos usuários. Requer as capabilities NET_ADMIN, SETUID e SETGID e um dispositivo TUN, que ele usa dentro do seu próprio namespace de rede na bridge de apps de renda protegida pela barreira. Inclui uma interface web integrada para gerenciar o nó. Funciona tanto em conexões residenciais quanto em VPS, mas o bônus de indicação só é pago para nós em um IP residencial.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Nó de VPN descentralizada - baseado em blockchain, funciona em VPS"
  source: "ad1413ac81fa"
