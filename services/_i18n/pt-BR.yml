  source: "8232c9563c84"
deeper-network.description:
  text: "A Deeper Network é um projeto de VPN descentralizada e infraestrutura web3. Requer principalmente dispositivos de hardware proprietários Deeper Connect. A Moken é uma plataforma relacionada de mineração/staking. Não funciona só com software.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
