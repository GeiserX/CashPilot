  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "As portas UDP que o nó usa para sessões de VPN, no formato início:fim. Encaminhe essa mesma faixa no seu roteador. Cada sessão ocupa cerca de duas portas, então as 30 padrão comportam cerca de 15 sessões ao mesmo tempo, mais do que um nó doméstico recebe. Uma faixa maior não resolve nada e custa mais: cada porta publicada deixa mais lentas a inicialização e a remoção do nó (300 portas levam cerca de 12 s para iniciar), o CashPilot aceita no máximo 300 e, com o userland proxy padrão do Docker, cada porta também ocupa cerca de 2.5 MB de memória. Se todas as sessões falham, o problema é o roteador, não a falta de portas: veja \"Routers that rewrite UDP source ports\" no guia do Mysterium. Mantenha abaixo de 32768: as portas 32768-60999 são a faixa efêmera do Linux, em que qualquer programa no host pode ocupar uma por um instante, e uma única porta ocupada faz a inicialização do nó falhar. Um nó que já tem uma faixa a mantém."
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "Keystore da identidade do nó. Destruí-lo cria uma identidade totalmente nova: o nó perde a reputação e todos os ganhos ainda retidos na identidade antiga."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "O nó não consegue executar sudo dentro do contêiner, então não consegue configurar a interface de VPN nem o firewall, e toda sessão falha na configuração: ele parece online e não ganha nada. O contêiner foi criado sem as capabilities SETUID e SETGID. Atualize o CashPilot e o worker que roda este nó e depois reimplante o Mysterium pelo painel; a identidade do nó fica no volume de dados e é mantida."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "Nenhuma sessão de VPN nas últimas 6 horas chegou diretamente a este nó. Todas recorreram ao hole punching, e muitos compradores não conseguem se conectar dessa forma, então o nó ganha menos. As portas UDP dele não estão acessíveis pela internet. No seu roteador, encaminhe a faixa de portas UDP ${UDP_PORTS} (início:fim, a mesma faixa dos dois lados) para ${HOST_ADDRESS}. Este aviso some sozinho assim que uma sessão se conectar diretamente."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "O monitoramento do Mysterium marca o nó em ${WORKER_NAME} como com falha, então ele fica fora da lista de nós que a maioria dos compradores usa para escolher, mesmo quando a própria verificação dele diz que todas as portas estão acessíveis. Primeiro, confirme que o nó tem /dev/net/tun e SETUID/SETGID, cuja falta o derruba da mesma forma: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Com isso resolvido, uma causa comum é o roteador na frente de ${WORKER_NAME} reescrever a porta UDP de origem das respostas do nó depois que um pacote vindo de fora chega a essa porta. Veja o teste no guia: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "As últimas cinco sessões de VPN do nó em ${WORKER_NAME} terminaram, cada uma, depois de cerca de um minuto sem transferir dados, então ele não ganha nada enquanto parece online. A causa provável é o roteador na frente de ${WORKER_NAME}: depois que um pacote vindo de fora chega a uma porta, ele reescreve a porta de origem das respostas seguintes do nó a partir dessa porta, e toda sessão começa com um pacote assim (a verificação de porta do próprio nó), então os compradores descartam as respostas do nó. Uma faixa de portas maior não ajuda. Veja o teste e as correções no guia: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Este aviso some quando uma sessão transferir dados."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Ganhos em tokens MYST. IPs residenciais ganham bem mais. A WebUI do nó, na porta 4449, serve para gerenciá-lo e, por padrão, é publicada apenas na máquina em que ele roda (127.0.0.1); a partir de outra máquina, abra antes um túnel SSH (ssh -L 14449:127.0.0.1:4449 seguido do endereço da máquina do nó e depois acesse http://127.0.0.1:14449; a porta local 14449 evita conflito com um nó na sua própria máquina) ou adicione um endereço a UI_ADDRESS (veja WebUI address no guia do Mysterium). VPS aceita. O encaminhamento de portas UDP 23000-23029 (o padrão de UDP_PORTS) é muito recomendado -- sem ele, os nós ficam com status Strict NAT e muitas sessões de VPN falham, o que reduz muito a renda. Importante: depois da primeira execução, defina a sua carteira beneficiária (de liquidação) pela WebUI ou pela CLI do nó para corresponder à sua conta mystnodes.com -- isso vincula os ganhos on-chain ao seu painel na nuvem."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Liquidação on-chain automática sempre que um nó acumula 5 MYST não liquidados"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Não há botão para apertar. Cada nó faz a liquidação na Polygon sozinho assim que acumula 5 MYST não liquidados, e cerca de 21% vai para taxas (a taxa Hermes de 20% mais uma pequena taxa de transação), então aproximadamente 3.9 MYST chegam à carteira beneficiária a cada liquidação. A TequilAPI de cada nó lista as liquidações em /transactor/settle/history. O valor de \"total earnings\" no MystNodes cobre apenas os últimos 30 dias; não é um saldo nem um total acumulado desde o início. Os MYST de bônus do programa de recompensas do MystNodes não são liquidados sozinhos: resgate-os na página Rewards, em até 30 dias após a distribuição, segundo a central de ajuda do MystNodes."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "A carteira beneficiária é definida DEPOIS da implantação, pela TequilAPI ou pela WebUI do nó -- não por uma variável de ambiente, então ela não pode ser lida na especificação do contêiner."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Use o e-mail e a senha da sua conta MystNodes (os mesmos de <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST por amigo cujo nó ganhe 5 MYST (apenas IPs residenciais)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST quando o seu nó ganhar os primeiros 5 MYST (IP residencial, nó reivindicado em mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Resgate as recompensas do MystNodes do mês passado"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "As recompensas não resgatadas em até 30 dias após a distribuição mensal são perdidas e voltam para o pool do mês seguinte."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Abra a página Rewards e troque os seus pontos por MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Largura de banda. A sua conexão é usada como nó de saída da rede Mysterium, que vende serviços de VPN, proxy E coleta de dados (scraping). O tráfego de scraping saindo de um IP residencial é o uso com mais chance de gerar reclamações, e você não pode escolher qual dos três o seu nó transporta."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Sim. Desconhecidos encaminham o tráfego deles pelo seu endereço IP — esse é o produto."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "A identidade do nó (um endereço de blockchain), o seu IP e a localização aproximada (país/cidade/provedor de internet), que o nó publica na rede para que os compradores possam escolhê-lo."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Real e vale a pena entender. O tráfego de outras pessoas sai pela sua conexão atribuído a você, então tudo o que elas fizerem parece ter origem na sua linha. Muitos contratos de provedores de internet residenciais proíbem isso. Confira o seu antes de rodá-lo."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Dispositivos ilimitados por conta e por IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Cerca de 21% de cada liquidação vai para taxas, a taxa Hermes de 20% mais uma taxa de transação, e os ganhos são pagos no token MYST."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "O seu nó é uma saída para os clientes de VPN, proxy e coleta de dados do Mysterium, e você não pode escolher quais deles ele transporta."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "O software do nó é de código aberto, sob a GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "O Mysterium publica a sua própria imagem Docker, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "A liquidação vai para uma carteira que é sua; não é preciso número de telefone nem documento de identidade."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "O projeto do nó existe desde 2017."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "O site do Mysterium diz que a rede é desenvolvida pela Blockdev AG, de Zug, na Suíça."
  source: "7764b2d4ac85"
nodepay.description:
  text: "A Nodepay é uma rede DePIN que recompensa os usuários por compartilhar largura de banda por meio de uma extensão de navegador. A plataforma fica atrás da proteção da Cloudflare, o que pode dificultar o acesso automatizado. Os usuários ganham Nodepay Points mantendo a extensão ativa. A rede se concentra em fornecer infraestrutura de dados de treinamento de IA.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "Compartilhamento de banda DePIN para IA - extensão de navegador"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Ganha Nodepay Points; os pontos dos usuários que passam nas verificações de elegibilidade da Nodepay são convertidos no token NC. A proteção da Cloudflare pode bloquear a coleta automatizada. É necessária a extensão de navegador."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Airdrop do token NC (data não confirmada)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Sistema baseado em pontos. Os pontos dos usuários que passam nas verificações de elegibilidade da Nodepay são convertidos no token NC, lançado em janeiro de 2025."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Ainda não determinado: o CashPilot ainda não verificou onde este serviço guarda os seus ganhos."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "Na revisão da primeira temporada, a Nodepay removeu mais de 300,000 contas que considerou bots e cancelou 17 bilhões de pontos."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "As recompensas são pontos convertidos no token NC, então o valor delas depende do token."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "O CashPilot não roda a Nodepay: você usa a extensão de navegador do próprio provedor, então o CashPilot não pode implantá-la nem atualizá-la para você. Os termos dela não foram verificados quanto ao uso em contêineres."
  source: "08a3715c74a3"
noderr.description:
  text: "O Noderr Micronodes é o nível de entrada gratuito do Noderr Protocol, um projeto DeFi na Base L2. Um micronode é um pequeno agente em um celular Android sobrando, um PC Windows, um Mac ou um navegador Chromium. No Android, ele compartilha a conexão móvel do celular: outro tráfego do Noderr sai pelo IP da operadora do celular, então é preciso um chip (SIM) com dados móveis. Em um PC ou no navegador, ele executa tarefas de automação para o protocolo com a capacidade de computação que sobra. As recompensas foram pensadas para ser pagas em NODR, de acordo com uma pontuação on-chain de tempo online e confiabilidade, mas a rede está na testnet Base Sepolia durante o beta: as recompensas dos nós não têm fundos e nenhuma foi paga até agora.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Micronode gratuito (compartilhamento de conexão no Android, Windows, Mac, navegador) - testnet, recompensas sem fundos até agora"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Beta em testnet: as recompensas dos nós não têm fundos e nenhuma foi paga até agora. O APY de 5-10% no site é uma meta de projeto. Reavaliar quando a rede sair da Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
noderr.cashout.notes:
  text: "As recompensas se acumulam na carteira do próprio nó e são resgatadas pelo app ou pelo dApp. Durante o beta, elas são tokens da testnet Base Sepolia, sem valor de mercado."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "O app cria a carteira do nó na primeira execução e emite para ela um Utility NFT soulbound gratuito. Faça backup da carteira pelo app: perder o dispositivo significa perder a identidade do nó. As recompensas ficam na Base Sepolia (testnet) durante o beta."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "O Android precisa de um chip (SIM) com dados móveis; os clientes para desktop e navegador não publicam nenhum requisito de IP."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Depende do dispositivo. Um celular Android vende a sua conexão móvel: outro tráfego do Noderr sai pelo endereço IP da operadora do celular e consome a franquia do plano de dados. Um PC Windows, um Mac ou um navegador vende capacidade de computação ociosa para o que o provedor chama de tarefas de automação de redes sociais e de conteúdo."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Sim. No Android, outro tráfego do Noderr sai pelo endereço IP móvel do seu celular; o app pede um consentimento registrado antes de começar, e você pode parar de compartilhar na mesma tela. Para os clientes Windows, Mac e navegador, o provedor descreve tarefas de automação e não diz se elas transportam tráfego de outras pessoas."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "O endereço da carteira do nó e os números de tempo online e de tarefas concluídas vão para a blockchain como uma pontuação de reputação (o TrustFingerprint). O provedor diz que as tarefas são anonimizadas, rodam em sandbox e que as chaves da carteira nunca saem do dispositivo. Nada mais específico é publicado."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "No Android, a conexão compartilhada é um plano móvel de operadora: a própria documentação do provedor avisa que o compartilhamento pode não ser permitido pelas políticas de uso aceitável de algumas operadoras, e o tráfego compartilhado consome a franquia do plano. Para os clientes de desktop e navegador, o provedor não diz nada sobre os termos dos provedores de internet."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Um nó por dispositivo, cada um com o seu próprio Utility NFT soulbound; rodar vários dispositivos é permitido e incentivado. Nenhum limite por IP é publicado. Não há conta no sentido habitual: a identidade é uma carteira que o app gera na primeira execução."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "As recompensas dos nós são tokens de testnet sem fundos e sem valor de mercado, e nenhuma foi paga; o APY de 5 a 10% no site é uma meta de projeto."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Para os clientes de desktop e navegador, o Noderr descreve tarefas de automação e não diz se elas transportam tráfego de outras pessoas."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "O provedor diz que as tarefas são anonimizadas e rodam em sandbox, mas não publica nada mais específico."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Ainda é um beta em testnet na Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "O CashPilot não roda o Noderr: você usa o app ou a extensão do próprio provedor, então o CashPilot não pode implantá-los nem atualizá-los para você. Os termos dele não foram verificados quanto ao uso em contêineres."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Sem conta: o app gera uma carteira na primeira execução."
  source: "bf85f2f80b20"
nodle.description:
  text: "A Nodle usa o Bluetooth do smartphone para criar infraestrutura de IoT. O app detecta e retransmite de forma passiva os dados de dispositivos IoT próximos, ganhando tokens NODL. Já apareceu na Forbes e tem parcerias empresariais com a Vivendi e a Hayden AI. Apenas para celular (iOS e Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Retransmissão IoT por Bluetooth - app para celular, recompensas em token NODL"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Ganhos muito baixos. App de celular em segundo plano usando Bluetooth. A conexão da carteira pode ser instável."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Contínuo"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "O NODL fica na carteira do próprio app, na ZKsync Era; confira no app ou em um explorador de blocos da ZKsync Era. A Nodle saiu da sua parachain na Polkadot, e a bridge de Polkadot para ZKsync foi fechada em 31 de dezembro de 2025, então os NODL que ainda estão do lado da Polkadot não podem mais ir para a ZKsync."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "Ainda não determinado: o CashPilot ainda não verificou onde este serviço guarda os seus ganhos."
  source: "8d61a71de590"
nodle.referral.bonus.referrer:
  text: "Uma recompensa em NODL para cada novo usuário ativo que entrar pelo convite (a Nodle não publica o valor)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Um avaliador relata cerca de $3 ganhos em três a quatro anos; outros relatam uma queda forte nos ganhos diários."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "O CashPilot não roda a Nodle: você usa o app de celular do próprio provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. Os termos dela não foram verificados quanto ao uso em contêineres."
  source: "6b6132c859c2"
nosana.description:
  text: "A Nosana é um marketplace descentralizado de computação em GPU construído na Solana. Ela conecta donos de GPUs à demanda de cargas de trabalho de IA e paga em tokens NOS. Uma RTX 3060 ganha aproximadamente $0.048/h. A plataforma se concentra em cargas de trabalho de inferência de IA e usa a blockchain Solana para agendar trabalhos e liquidar pagamentos. Os nós rodam cargas de trabalho em contêineres pela Nosana CLI.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Computação em GPU na Solana - tokens NOS, RTX 3060 ~$0.048/h"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/h; GPUs mais potentes ganham mais. Os ganhos dependem da disponibilidade de trabalhos e do modelo da GPU. Requer GPU NVIDIA, Linux, Docker e a Nosana CLI. Pagamentos no token NOS na Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "A cada trabalho concluído"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Ganha tokens NOS na Solana. Pagamento na carteira configurada."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "O Nosana cria uma carteira Solana por padrão, então a maioria dos usuários nunca viu o endereço dela."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Cada host precisa bloquear um stake de NOS proporcional ao preço por hora da sua GPU."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Os hosts recebem em NOS, então os ganhos em dólares variam com o token e com a demanda pela placa deles."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "O CashPilot não roda a Nosana: você usa o software de host do próprio provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. Os termos dela não foram verificados quanto ao uso em contêineres."
  source: "1a3ea3856a00"
ocean.description:
  text: "O OCEAN é um pool de mineração de Bitcoin sem conta: o seu minerador faz login usando o seu endereço Bitcoin como nome de usuário, e o pool paga esse endereço. O CashPilot não roda um minerador aqui. Ele lê o saldo não pago que o OCEAN mantém para o seu endereço, para você ver o que o seu ASIC (um Bitaxe, um Antminer) ganhou junto com as suas outras rendas. O saldo não pago foi ganho, mas não recebido: o OCEAN o paga on-chain assim que ele passa do limite de pagamento.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Pool de mineração de Bitcoin, acompanhado pelo seu endereço de pagamento"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Quando um bloco leva o seu saldo além do limite"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "O OCEAN paga on-chain no seu endereço assim que o seu saldo não pago atinge o limite. Os pagamentos via Lightning (opcionais, BOLT12) não são detectados pelo CashPilot."
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "O não pago foi ganho, mas só é recebido quando o OCEAN o paga on-chain neste endereço, a menos que você tenha ativado os pagamentos via Lightning."
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "O seu endereço de pagamento em BTC: o nome de usuário que o seu minerador usa no OCEAN, sem a parte <b>.workername</b>. Ele é público e não dá acesso a nenhum fundo."
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "Requer um minerador ASIC de Bitcoin (um Bitaxe, um Antminer) apontado para mine.ocean.xyz:3334"
