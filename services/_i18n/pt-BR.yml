  source: "51f68f082425"
urnetwork.description:
  text: "A URnetwork é uma rede descentralizada de VPN e de compartilhamento de largura de banda. Você ganha fornecendo largura de banda como provedor da comunidade. O binário do provedor se autentica com o e-mail e a senha da sua conta (pelo subcomando auth-provide) e guarda o JWT de sessão resultante no volume de dados. Imagem Docker oficial da BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "VPN/banda descentralizada - autenticação por e-mail+senha, sessão JWT no volume"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "E-mail"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Senha"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "O e-mail da sua conta URnetwork (o login que você usa em <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Contas criadas com login do Google/Apple precisam primeiro definir uma senha. Precisa de uma conta? Cadastre-se em <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "A senha da sua conta URnetwork (sem espaços). Usada pelo login auth-provide do provedor; depois, a sessão fica guardada no volume de dados."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Funciona em VPS e em conexões residenciais. Pago em SN25α (subnet 25 da Bittensor) a cada época semanal desde 2026-10-06. Suporta modo proxy para configurações com vários IPs."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "Por época (epoch)"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Defina uma coldkey da Bittensor em ur.io/app/account/earnings (assinada com Talisman, TAO.com ou uma carteira WalletConnect) e depois resgate cada época finalizada. Um resgate paga o gas em TAO a partir de uma chave de gas EVM. ÉPOCAS NÃO RESGATADAS EXPIRAM, e os antigos pagamentos em USDC foram cancelados quando nenhuma carteira foi vinculada em até 30 dias."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB por dia de dados UR grátis por amigo, até 20 amigos (dados, não dinheiro)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB por dia de dados UR grátis quando você usar pelo menos 10 MiB pelo app em 2 dias dentro de 90 dias após entrar; caso contrário, a indicação termina"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Épocas não resgatadas expiram, e os antigos pagamentos em USDC foram cancelados para redes sem carteira vinculada em até 30 dias."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "Desde outubro de 2026, as recompensas são pagas em SN25α, um token de subnet da Bittensor, e cada resgate custa gas em TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "A URnetwork se chamava BringYour; o whitepaper arquivado dela traz o nome antigo."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "A URnetwork publica o código-fonte do seu cliente de provedor."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "A URnetwork publica a sua própria imagem Docker, bringyour/community-provider, e funciona em conexões VPS e residenciais."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Um resgate precisa apenas de uma carteira Bittensor que você controle."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "A Vast.ai é um marketplace de nuvem de GPUs onde você aluga a sua GPU NVIDIA para pesquisadores e desenvolvedores de IA/ML. É uma plataforma nativa em Docker na qual você define os seus próprios preços por hora. Uma RTX 3090 costuma ganhar $0.20-0.40/h quando alugada. Requer uma GPU NVIDIA com drivers recentes e uma conexão de internet estável. A receita depende muito do modelo da GPU, da estratégia de preços e da demanda do mercado.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "Marketplace de GPUs - defina os seus próprios preços, RTX 3090 ~$0.20-0.40/h"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
