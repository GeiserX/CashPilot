flux.description:
  text: "A Flux é uma infraestrutura de computação distribuída globalmente. Os operadores de nó fazem staking de tokens FLUX e fornecem recursos de servidor. Três níveis: Cumulus (1,000 FLUX), Nimbus (12,500 FLUX), Stratus (40,000 FLUX). Imagens Docker oficiais disponíveis.\n"
