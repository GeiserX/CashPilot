  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "As recompensas dos fornecedores eram pagas com a emissão de tokens, independentemente de trabalhos pagos, e donos de GPUs relatam ficar ociosos a maior parte do tempo."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "As recompensas são no token IO, e o modelo de pagamento mudou em 2026 para um mecanismo atrelado ao dólar."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "Em abril de 2024, cerca de 1.8 milhão de GPUs falsas tentaram entrar na rede por meio de um token de autenticação vazado, e depois o CEO deixou o cargo antes do lançamento do token."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "O CashPilot não roda a io.net: você usa o software de worker do próprio provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. Os termos dela não foram verificados quanto ao uso em contêineres."
  source: "1cac289c99ad"
iproyal.description:
  text: "O IPRoyal Pawns permite ganhar compartilhando a largura de banda que você não usa. A IPRoyal é um provedor de proxy bem consolidado, e o Pawns é o seu braço de compartilhamento de largura de banda residencial. A imagem Docker de CLI aceita as credenciais por flags de linha de comando. Um novo usuário que se cadastra por um link de indicação ganha $1 em cada um dos três primeiros pagamentos, até $3. Cada pagamento precisa acontecer dentro de um prazo de uma a três semanas, definido pela localização. O prazo começa no cadastro e recomeça depois de cada pagamento. Se um prazo terminar antes, os bônus restantes são perdidos.\n"
