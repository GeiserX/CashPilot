traffmonetizer.description:
  text: "O Traffmonetizer permite monetizar o seu tráfego de internet compartilhando largura de banda com empresas verificadas. É um dos poucos serviços de compartilhamento de largura de banda que funcionam bem em IPs de VPS e de data center, além de conexões residenciais. Usa uma autenticação simples por token, passada por argumentos de linha de comando. Suporta arquiteturas ARM para Raspberry Pi e dispositivos semelhantes.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Compartilhamento de banda - funciona em VPS, autenticação por token"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Token"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Nome do dispositivo"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Faça login em <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, pressione F12 → Application → Local Storage → clique em <code>https://app.traffmonetizer.io</code> → copie o valor de <code>authToken</code> (cerca de 54 caracteres: dígitos, um <code>|</code> e depois letras e dígitos)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Nome exibido no painel para gerenciar o dispositivo"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "IPs de VPS e de data center ganham menos que residenciais. Localizações nos EUA/UE ganham mais. Vários IPs são suportados por meio de redes Docker."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Mínimo de $10. O PayPal não é mais oferecido. Primeiro, salve um método de pagamento no perfil: USDT na Solana ou na TON (taxas mais baixas), Arbitrum (taxas baixas) ou Tron TRC20 (taxas de rede altas), ou transferência bancária a partir de $1,000. O primeiro endereço que você salvar vale na hora; alterá-lo depois exige uma confirmação por e-mail. O painel pode pedir um contato de mensageiro (WhatsApp, Telegram ou Skype) antes do primeiro saque. Uma solicitação paga apenas dólares inteiros, e os centavos ficam no saldo."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT na rede salva nas configurações de pagamento do perfil (Solana, TON, Arbitrum ou Tron), ou transferência bancária. O endereço fica nas configurações do Traffmonetizer, não no contêiner."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Faça login em <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, pressione F12 → Application → Local Storage → valor de <b>authToken</b> (cerca de 54 caracteres: dígitos, um <code>|</code> e depois letras e dígitos)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% de cada pagamento que eles solicitarem"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Os termos de uso do Traffmonetizer exigem IP residencial, mas, na prática, nós em VPS são aceitos."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "O Trustpilot dá nota 1.9; avaliadores de 2023 a novembro de 2026 relatam pagamentos pendentes por semanas, ou marcados como concluídos sem nenhuma transação correspondente."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Os mesmos avaliadores relatam que o suporte por chat ao vivo e por e-mail não responde, às vezes por semanas."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Somente cripto ou transferência bancária a partir de $1,000; o PayPal acabou, e uma solicitação paga apenas dólares inteiros."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Os termos do Traffmonetizer exigem um IP residencial, então um servidor em uma conexão de hospedagem fica fora deles."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Quatro avaliadores do Trustpilot de 2023 a 2025 relatam ganhos muito lentos, como um centavo por dia em quatro dispositivos, ou quase dois anos para chegar a $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Um pagamento precisa apenas de um endereço de cripto salvo e confirmado por e-mail; o painel pode pedir um contato de mensageiro."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "O Traffmonetizer publica a sua própria imagem Docker, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Minere com a sua CPU e receba na moeda que você escolher, como SHIB, DOGE ou XMR. O CashPilot roda o XMRig no pool RandomX da unMineable, e a unMineable converte o Monero que a sua CPU minera na sua moeda. Ela paga o seu endereço público assim que o seu saldo atinge o limite de pagamento da moeda. Todo worker que o CashPilot implanta leva o código de indicação do CashPilot na unMineable, que reduz a sua taxa de plataforma de 1% para 0.75%. A eletricidade pode custar mais do que você ganha."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Minere com a sua CPU e receba na moeda que você escolher"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "Moeda de pagamento"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "Endereço de pagamento"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "Nome do worker"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "Máx. de threads da CPU (%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "Modo RandomX"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "Ticker de uma moeda que a unMineable paga, como SHIB, DOGE ou XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "O seu endereço público para essa moeda. Moedas que exigem memo ou tag não são suportadas."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Estimativa bruta antes da eletricidade, paga na sua moeda pela taxa de conversão da unMineable. Em 2026-11-25, 1 kH/s de RandomX valia cerca de $1 por mês. Uma CPU de desktop usando metade dos threads pode consumir de 30 a 50 W a mais. Confira o seu uso real e o preço da sua eletricidade para ver se compensa."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "Definido por moeda pela unMineable (0.03 XMR em 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Quando o limite de pagamento da moeda é atingido"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "A unMineable paga o seu endereço assim que o seu saldo atinge o limite de pagamento da moeda. Os limites variam conforme a moeda e a rede; o CashPilot lê o que a unMineable informa para o seu endereço."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "O saldo foi ganho, mas só é recebido quando a unMineable o paga neste endereço. A rede depende da moeda que você escolher."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "O mesmo endereço de pagamento e o mesmo ticker de moeda com que você implantou o minerador, por exemplo <b>XMR</b>. Informe apenas o endereço, sem a moeda, o nome do worker ou o código de indicação. Ele é público e não dá acesso a nenhum fundo."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% das recompensas de mineração de cada minerador indicado"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Taxa de plataforma reduzida de 1% para 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Esta máquina informa uma conexão de hospedagem. Confira os termos do seu provedor antes de minerar. Alguns provedores, incluindo a Hetzner Cloud, proíbem isso. Confira o seu custo real de energia antes de confiar em uma estimativa de lucro."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "A unMineable cobra uma taxa de plataforma de 1%. O CashPilot adiciona o seu código de indicação (#awk6-j1z0) depois de cada nome de worker, o que reduz a sua taxa para 0.75%. A unMineable então paga ao mantenedor do CashPilot 0.25% das suas recompensas de mineração; você fica com 99.25%. Cada moeda tem o seu próprio limite de pagamento, por exemplo 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "computação"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "Não. O minerador envia trabalho para o pool da unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "O seu endereço de pagamento, a moeda, o nome do worker, o hashrate e o endereço IP vão para a unMineable."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "Algumas redes e resolvedores de DNS bloqueiam conexões com pools de mineração."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "Não é preciso conta. O endereço e a moeda são a identidade, e qualquer pessoa pode ler as estatísticas deles em unmineable.com."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "A unMineable fica com uma taxa de plataforma de 0.75% com o código de indicação e só paga a partir do limite de cada moeda."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "Alguns provedores de hospedagem proíbem a mineração de criptomoedas."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "A eletricidade extra pode custar mais do que as moedas ganhas."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "As estatísticas do endereço, incluindo o saldo, são públicas para qualquer pessoa que conheça o endereço."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "O minerador envia hashes para o pool e não retransmite o tráfego de ninguém."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Você pode minerar para um endereço público na moeda que escolher, sem criar conta."
  source: "c0b45001dc5c"
uprock.description:
  text: "A Uprock é uma plataforma DePIN (Decentralized Physical Infrastructure Network, rede descentralizada de infraestrutura física) que permite ganhar criptomoedas compartilhando a sua conexão de internet. Faz parte do ecossistema Web3 mais amplo. Há imagens Docker da comunidade, mas nenhuma imagem oficial. A extensão de navegador é a interface principal.\n"
  source: "10af70251bd4"
uprock.short_description:
