proxybase-xyz.description:
  text: "O ProxyBase Markets é um marketplace de proxies SOCKS5 feito para agentes de IA. Os vendedores rodam um daemon leve de CLI em Rust que se conecta via WebSocket para retransmitir o tráfego dos compradores pela própria conexão de internet, ganhando USDC na Tempo Chain por GB vendido. Suporta os modos direto (largura de banda própria) e upstream (revenda de proxies externos), com reconexão automática. Os compradores adquirem sessões de proxy por país, provedor de internet e largura de banda. Os pagamentos passam pelo Machine Payments Protocol (MPP) na Tempo Chain. O link de indicação é para compradores: um comprador que abre o console por ele ganha 10% a mais no primeiro depósito.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
