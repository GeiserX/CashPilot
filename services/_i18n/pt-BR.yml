  text: "Chave de API"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "Faça login em <a href=\"https://app.earn.fm\">app.earn.fm</a> → clique no ícone do seu perfil (canto superior direito) → Account Settings → copie a API Key (formato UUID)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "Plataforma relativamente nova. Os ganhos variam conforme a localização e a disponibilidade de largura de banda."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "Mínimo de $15. Métodos: USDT em BEP20 ou Polygon (taxa de $1) ou TRC20 (taxa de $3), PayPal, vales-presente da Amazon ou da Starbucks a partir de $15, ou transferência bancária internacional a partir de $1,000, com as taxas de transferência descontadas. Antes do primeiro pagamento, você preenche um perfil de faturamento (nome legal e endereço), usado nos recibos de pagamento."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "Saldo mantido pelo Earn.fm; sacado sob solicitação."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Use o e-mail e a senha da sua conta Earn.fm (os mesmos do login em <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10% dos ganhos deles para sempre"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "Saldo inicial de $5"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "Mínimo de $15, taxa de $1 a $3 em USDT e transferência bancária só a partir de $1,000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Antes do primeiro pagamento, você preenche um perfil de faturamento com o seu nome legal e endereço."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Avaliadores em 2025 relatam que o suporte por e-mail e Discord não responde; o Trustpilot observa que o Earn.fm não respondeu às avaliações negativas."
