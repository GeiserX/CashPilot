  source: "699adf0a2179"
dawn.description:
  text: "A DAWN opera uma rede de validadores que verifica a largura de banda e a cobertura da infraestrutura de IA financiada pelo protocolo DAWN. A extensão de navegador DAWN Validator participa dessas verificações de prova de largura de banda e de cobertura e ganha recompensas DAWN enquanto está rodando. As recompensas ainda não têm um valor em dinheiro definido. Crie a conta na extensão e informe o código de indicação 2QLQV97F quando ela pedir.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "Validador DePIN - extensão de navegador ganha pontos DAWN"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Ganha Dawn Points antes do lançamento do token. O valor real depende do preço futuro do token. A caixa de hardware ganha mais do que a extensão de navegador."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
