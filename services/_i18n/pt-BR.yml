honeygain.cashout.notes:
  text: "Mínimo de $20 (20,000 créditos). Duas opções: PayPal pela Tipalti, com taxa de cerca de 15%, ou créditos JumpTask sem taxa, pagos em uma carteira JumpTask. Uma solicitação exige um código de 6 dígitos enviado por e-mail. O primeiro pagamento via PayPal fica \"waiting for details\" até você se cadastrar na Tipalti pelo link que eles enviam por e-mail. Esse link funciona apenas uma vez, então abra-o quando puder terminar tudo de uma vez e estiver com o celular à mão: depois de definir uma senha, a Tipalti pede que você confirme um número de celular por SMS (os códigos expiram em poucos minutos) e depois pede o seu nome, endereço, país e data de nascimento, além do seu endereço do PayPal. A Tipalti cobra $2.02 por pagamento; escolha USD para evitar a taxa de conversão de moeda de 1.9-3%. O pagamento sai em até 2 dias úteis. O saldo sai da sua conta assim que você faz a solicitação, mesmo enquanto o pagamento aguarda a Tipalti. Cada login posterior na Tipalti envia um novo código por SMS, a menos que você marque a opção de lembrar o dispositivo por 30 dias. Em outubro de 2026, a Tipalti não pediu formulário fiscal a um beneficiário na Espanha."
  source: "553463d96535"
