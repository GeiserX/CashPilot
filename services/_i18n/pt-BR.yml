  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "A política de privacidade identifica o operador, Pawns.App Ltd (empresa 16043795 na Inglaterra e no País de Gales), que, segundo a Companies House, foi constituída em 28 de outubro de 2024, há menos de três anos."
