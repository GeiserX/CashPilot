  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "Pool (host:porta)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "Criptografar conexão com o pool (TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "O seu endereço público de Pearl (prl1...). Para Zano ou Ravencoin, informe o endereço dessa moeda e um pool para ela."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash para Pearl, progpow_zano para Zano, kawpow para Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.earnings.notes:
  text: "Estimativa bruta, antes da eletricidade. Em 2026-11-25, o hashrate.no estimou cerca de $2.45 por dia no Pearl para uma RTX 4070 consumindo cerca de 142 W. Nós não medimos isso. O Pearl é uma moeda nova, e o preço e a dificuldade dele mudam rápido. Confira o consumo da sua GPU e o preço da sua eletricidade para ver se compensa."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Quando o limite do pool é atingido"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "O pool paga o seu endereço quando o seu saldo atinge o seu limite. O pool mantém o saldo até pagar você."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, uma GPU NVIDIA e o NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Esta máquina informa uma conexão de hospedagem. Confira os termos do seu provedor antes de minerar. Alguns provedores, incluindo a Hetzner Cloud, proíbem isso. Confira o seu custo real de energia antes de confiar em uma estimativa de lucro."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "A taxa de minerador de 2% é para o pearlhash. O SRBMiner-Multi fica com 0.85% no progpow_zano e no kawpow. A HeroMiners, o pool padrão de Pearl, cobra uma taxa de pool de 1%. Ela verifica os pagamentos a cada hora e paga a partir de 1 PRL. Outros pools definem as próprias taxas e limites."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "computação"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "Não. O minerador envia trabalho para o pool que você escolher."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "O seu endereço de pagamento, o nome do worker e o endereço IP vão para o pool. A primeira inicialização baixa o minerador do GitHub."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Algumas redes e resolvedores de DNS bloqueiam conexões com pools de mineração."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "A maioria dos pools identifica você pelo seu endereço público de pagamento."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "O minerador fica com 2% do tempo de hash no Pearl e 0.85% no Zano e no Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Alguns provedores de hospedagem proíbem a mineração de criptomoedas."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "O minerador é de código fechado, então ninguém além do desenvolvedor pode auditar o que ele executa."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "A eletricidade da GPU pode custar mais do que as moedas ganhas, e o preço do Pearl muda rápido."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "O minerador envia trabalho para o pool e não retransmite o tráfego de ninguém."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Você pode minerar Pearl na HeroMiners com um endereço público e sem conta."
  source: "1844ccbbc00a"
storj.description:
  text: "A Storj é uma rede descentralizada de armazenamento em nuvem em que você ganha alugando o espaço em disco que não usa. Rode o nó de armazenamento via Docker e receba $1.35/TB armazenado por mês, mais $1/TB de egress (tráfego de saída) (valores desde 1 de setembro de 2026). Os pagamentos são mensais, em USDC, uma stablecoin atrelada ao dólar americano, na mainnet da Ethereum, para uma carteira que você controla, assim que o saldo passa de um mínimo baseado nas taxas (token STORJ até o pagamento de setembro de 2026). Requer pelo menos 550GB de espaço livre em disco e uma conexão de internet estável. Não é preciso conta nem cadastro -- os nós não exigem permissão desde meados de 2025. ATENÇÃO (outubro de 2026): a Storj Labs pediu recuperação judicial sob o Chapter 11 em 26 de julho de 2026 (Tribunal de Falências dos EUA, Distrito Norte da Virgínia Ocidental, processo 5:26-bk-00512) para reestruturar dívidas antigas. A rede continua funcionando e a Storj continua pagando os nós ativos, mas os ganhos dos nós de antes do pedido estão congelados até que o tribunal decida sobre eles. O token STORJ caiu cerca de 98% em relação ao pico de 2021. A Binance o deslistou em 3 de setembro de 2026, e a Coinbase suspendeu a negociação dele em 28 de setembro de 2026. Um nó novo retém parte dos ganhos durante os primeiros nove meses e só se enche à medida que a demanda dos clientes permite, então começar um agora vincula um retorno demorado a uma empresa em reestruturação que ainda pode encerrar as atividades.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Nó de armazenamento descentralizado - $1.35/TB armazenado + $1/TB de egress"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Endereço da carteira"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "E-mail"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "Endereço externo"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Espaço alocado"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Diretório de identidade"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Diretório de armazenamento"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Endereço de carteira Ethereum para pagamentos em USDC (por exemplo, 0x1234...abcd). Precisa ser uma carteira de autocustódia (MetaMask, Ledger etc.) -- nunca use um endereço de exchange"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "Endereço de e-mail para notificações ao operador"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "Hostname DDNS com porta (por exemplo, mynode.ddns.net:28967) -- muito preferível a um IP fixo, que deixa o nó inacessível no dia em que o seu provedor de internet trocar o IP sem avisar. A porta 28967 precisa estar encaminhada (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Espaço máximo em disco a alocar (por exemplo, 2TB). Use discos rígidos (HDD), não SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Caminho no host onde ficam os arquivos de identidade (precisa conter ca.cert, ca.key, identity.cert, identity.key)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Caminho no host, em um disco rígido (HDD), para o armazenamento de dados da Storj. Precisa de pelo menos 550GB livres"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Antes da primeira execução, inicialize a configuração do nó de armazenamento: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Identidade do nó. O ID dela é vinculado a uma prova de trabalho e leva horas para ser gerado de novo, e não pode ser recriado a partir do backup de nenhuma outra coisa. Perdê-la significa perder o saldo de pagamento retido."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Dados armazenados dos clientes e o valor retido do nó. Perdê-los desqualifica o nó e faz você perder o saldo retido."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "A rede Storj não consegue se conectar de volta ao seu nó no ADDRESS anunciado, então os satélites o consideram offline: novos dados param de chegar, a renda de egress para e um tempo prolongado offline leva à suspensão. Confira se ADDRESS corresponde ao seu IP público ATUAL (use um hostname DDNS, não um IP fixo, para que uma troca de IP pelo provedor de internet não deixe o nó inacessível) e se a porta 28967 TCP+UDP está encaminhada para esta máquina."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB armazenado + $1/TB de egress + $1/TB de auditoria/reparo desde 1 de setembro de 2026. Os ganhos aumentam com os dados armazenados e a idade do nó. Nos primeiros 9 meses, são retidos 75%, depois 50% e depois 25% dos ganhos; metade do valor retido volta no mês 16 e o restante na saída voluntária (graceful exit). A porta 28967 precisa estar encaminhada."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4x a taxa de transação da Ethereum; saldos menores passam para o mês seguinte"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Mensal"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Pago mensalmente em USDC na mainnet da Ethereum assim que o saldo da carteira for pelo menos quatro vezes a taxa de transação atual; saldos menores passam para o mês seguinte. Token STORJ até o pagamento de setembro de 2026. Painel na porta 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Pago mensalmente em USDC na mainnet da Ethereum para o endereço em WALLET assim que o saldo passar do mínimo baseado nas taxas. Token STORJ até o pagamento de setembro de 2026; os pagamentos na zkSync Era terminaram em 1 de setembro de 2026."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "A URL do painel do nó na porta 14002, com o IP do servidor na rede local em vez de localhost, por exemplo <b>http://192.168.1.10:14002</b>. Para vários nós, liste as URLs separadas por vírgulas: o CashPilot soma os valores."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Nós da Storj na mesma sub-rede /24 dividem a alocação de dados, o que reduz os ganhos por nó."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps de upload"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Espaço em disco e a largura de banda para servi-lo."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Não. Você armazena fragmentos criptografados e com codificação de apagamento (erasure coding) dos dados dos clientes. Outras pessoas não encaminham o próprio tráfego pelo seu IP."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "A identidade do nó, o endereço da sua carteira, o endereço de e-mail que o nó exige para notificações ao operador e o seu IP e porta, que precisam estar acessíveis para que o nó sirva os dados."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "É principalmente uma questão de franquia de dados, não de responsabilidade: um nó envia e recebe dados de clientes continuamente, o que é tráfego real e constante na sua linha. Ao contrário de um proxy ou relay, porém, não é tráfego anonimizado de terceiros atribuído a você como origem, então não atrai as denúncias de abuso que eles atraem."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Nós ilimitados, mas nós na mesma sub-rede /24 dividem a alocação, então vários em uma mesma conexão ganham menos cada um."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "O CoinDesk noticiou em 27 de julho de 2026 que a Storj Labs tinha pedido proteção contra falência sob o Chapter 11."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Os pagamentos a operadores de nó de antes do pedido entraram no processo de habilitação de créditos da falência."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "Um nó novo tem 75%, depois 50% e depois 25% dos ganhos retidos nos primeiros nove meses; metade volta no mês 16 e o restante só em uma saída voluntária (graceful exit)."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Os clientes armazenam fragmentos de arquivos criptografados e ninguém encaminha tráfego pelo seu IP, mas não encontramos onde a Storj diz quem são os clientes nem como são verificados."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "O software do nó de armazenamento é de código aberto, sob a AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "A Storj publica a sua própria imagem Docker, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Sem conta: um endereço de carteira e um e-mail para avisos ao operador."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Os nós ativos continuaram recebendo depois do pedido."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "O SupportXMR é um pool de mineração de Monero sem conta: o seu minerador faz login usando o seu endereço Monero como nome de usuário, e o pool paga esse endereço. O CashPilot não roda um minerador aqui. Ele lê o saldo que o SupportXMR mantém para o seu endereço, para você ver o que o seu minerador de CPU ganhou junto com as suas outras rendas. O saldo foi ganho, mas não recebido: o pool o paga assim que ele passa do seu limite de pagamento.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Pool de mineração de Monero, acompanhado pelo seu endereço de pagamento"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (automático), 0.01 XMR sob solicitação"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Quando o seu saldo passa do seu limite, ou sob solicitação"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "O SupportXMR paga o seu endereço assim que o saldo atinge o seu limite (0.1 XMR por padrão). No site dele, você também pode solicitar um pagamento instantâneo a partir de 0.01 XMR, com taxa de 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "O saldo foi ganho, mas só é recebido quando o SupportXMR o paga neste endereço. Saldos de Monero não podem ser lidos on-chain sem uma chave privada de visualização, que o CashPilot nunca pede, então você mesmo confirma cada pagamento."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "O seu endereço de pagamento em Monero: o nome de usuário que o seu minerador usa no SupportXMR, sem nenhuma parte <b>.workername</b> ou <b>+difficulty</b>. Ele é público e não dá acesso a nenhum fundo."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Requer um minerador de Monero (XMRig) apontado para pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "computação"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Não. O seu minerador envia hashes para o pool; ninguém encaminha tráfego pela sua conexão."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "O seu endereço Monero, os nomes de worker que você escolher, o seu hashrate e o endereço IP do seu minerador como o pool o vê."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Um minerador mantém uma conexão aberta com o pool e usa pouca largura de banda. O custo a acompanhar é a eletricidade, não o seu provedor de internet."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Não há conta. O endereço é a identidade, e qualquer pessoa pode ler as estatísticas dele em supportxmr.com."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Paga apenas em Monero, com taxa de pool de 0.6% e limite padrão de 0.1 XMR antes de um pagamento automático."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "O CashPilot não roda um minerador para o SupportXMR: você aponta o seu próprio minerador para o pool, e o CashPilot só lê o saldo."
  source: "dfddab40ccc1"
teneo.description:
  text: "O Teneo Protocol dá a agentes de IA acesso à web em tempo real por meio de uma rede de Beacons. O Teneo Beacon é o app da própria Teneo para Android, iOS, macOS, Windows e Linux, com uma versão de linha de comando para servidores e Raspberry Pi. Ele compartilha a largura de banda que você não usa depois que você aceita a tela de consentimento, e ganha Teneo Protocol Points e Fragments enquanto está online. Os Fragments contam para sorteios de temporada pagos em USDC (o Beacon Drop). A Teneo diz que o Beacon ganha o dobro de pontos da extensão de navegador mais antiga. Um Beacon ganha por conexão de internet. Os outros dispositivos na mesma conexão ficam em espera. Cadastre-se no Expedition Hub com o link ou o código de indicação PSA3BHPJ e depois entre no Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "App DePIN de largura de banda (Beacon) - Fragments para sorteios de USDC por temporada, +100 Fragments com um link de indicação"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Ganha Teneo Points e Fragments. Os Fragments contam para sorteios de USDC por temporada, então uma temporada paga um prêmio, não um valor fixo por uso. A Teneo diz que o Beacon ganha o dobro de pontos da extensão de navegador. Resgate o boost a cada 8 horas para até 3x Fragments; perder uma janela reduz o multiplicador."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Sorteio por temporada (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Os prêmios do Beacon Drop são pagos em USDC em uma carteira que você vincula no Expedition Hub. O Hub mostra quantos dias você tem para vincular uma; um prêmio sem carteira vinculada a tempo é perdido."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Vincule uma carteira no Expedition Hub antes que os prêmios de uma temporada sejam pagos; o Hub cancela um prêmio cuja carteira não tenha sido vinculada a tempo."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% dos Fragments de cada amigo indicado e 2% dos Fragments dos indicados dele, desde que o amigo se cadastre em até 7 dias e ganhe 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments no cadastro e mais +150 quando você chegar a 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "Um Beacon ganha por conexão de internet. Máquinas em data center só ganham em provedores de hospedagem que a Teneo habilitou, com metade dos Fragments e sem pontos nem bônus de indicação. Conexões via VPN nunca ganham."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Os Fragments do Beacon só pagam USDC como prêmios em sorteios por temporada, então rodá-lo não garante um valor definido."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "A Teneo diz que os pontos serão consolidados em $AGENTIC, um token de recompensa intransferível, e não no token $TENEO."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "Até novembro de 2026, nenhuma data de lançamento, alocação ou processo de resgate do $TENEO tinha sido confirmado, depois que uma meta anterior para o segundo trimestre de 2026 passou."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "O CashPilot não roda a Teneo: você instala o app Beacon do próprio provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. Os termos dela não foram verificados quanto ao uso em contêineres."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "A Teneo diz que o tráfego vem de clientes empresariais verificados e que bloqueia endereços privados e portas propensas a abuso, mas não diz como verifica esses clientes."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "A Theta Network é uma rede descentralizada já consolidada de entrega de vídeo e computação de IA (desde 2018). Os usuários rodam Edge Nodes que compartilham largura de banda, armazenamento e poder de computação. Tem grandes parcerias de conteúdo. Ganha tokens TFUEL.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "CDN descentralizada + computação de IA - recompensas em TFUEL, projeto consolidado"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Apenas app para desktop. Os ganhos dependem dos recursos e da localização. Grandes parcerias, listada em todas as exchanges."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Contínuo"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Ainda não determinado: o CashPilot ainda não verificou onde este serviço guarda os seus ganhos."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "O CashPilot não roda o Theta Edge: você usa o app para desktop do próprio provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. Os termos dele não foram verificados quanto ao uso em contêineres."
  source: "893de938ed14"
titan.description:
  text: "A Titan Network é uma plataforma DePIN que compartilha o seu endereço IP, armazenamento e largura de banda em troca de recompensas em token TNT. Disponível para Windows, Mac e Android. Os nós contribuem para uma CDN e uma camada de armazenamento descentralizadas. Os ganhos típicos vão de $5-30/mês, dependendo dos recursos compartilhados e da localização geográfica.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN que compartilha IP, armazenamento e banda - $5-30/mês"
  source: "799e68401067"
titan.earnings.notes:
  text: "Compartilha IP, armazenamento e largura de banda. Os ganhos dependem dos recursos fornecidos e da região. Uma alocação de armazenamento maior rende recompensas maiores."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Por época (epoch)"
  source: "75743e03bad2"
titan.payout.notes:
