  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "O CashPilot não roda a Vast.ai: você instala o software de host da Vast na sua própria máquina com GPU, então o CashPilot não pode implantá-lo nem atualizá-lo para você. A Vast estrutura a hospedagem em torno do Docker em um host Linux."
