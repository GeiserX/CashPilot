  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "O contêiner se configura sozinho na primeira inicialização: gera uma carteira secp256k1 (BIP-39), se autentica por desafio-resposta ECDSA e começa a vender largura de banda no modo somente direto. Todo o estado (carteira, token de sessão, configuração de vendedor) fica salvo no volume <code>proxybase-data</code>. Confira os logs do contêiner na primeira execução para ver o endereço da carteira. Use <code>--upstream</code> para adicionar caminhos de revenda de proxies externos.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "O arquivo de chave da carteira gerada. Este volume É o dinheiro: não há cópia no servidor, então excluí-lo destrói os fundos junto."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Ganhos baseados nos GB vendidos a preços de mercado. IPs de VPS/data center ganham menos que residenciais. O modo multi-upstream pode combinar a sua própria largura de banda com proxies externos."
  source: "a18f27f3f0dd"
