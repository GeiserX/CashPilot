  source: "fa32942c6b4f"
xmrig.description:
  text: "Minere Monero com a sua CPU. O CashPilot roda o XMRig, e o pool que você escolher paga Monero no seu endereço público de pagamento. O XMRig usa 1% do tempo de hash para apoiar os seus desenvolvedores. A eletricidade pode custar mais do que os XMR que você ganha."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "Minere Monero com a sua CPU e o pool que você escolher"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Endereço Monero"
  source: "a888ebb3ae9b"
xmrig.docker.env.POOL_URL.label:
  text: "Pool"
  source: "f13024272c38"
xmrig.docker.env.WORKER_NAME.label:
  text: "Nome do worker"
  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "Máx. de threads da CPU (%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "Modo RandomX"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "Estimativa bruta, antes da eletricidade. Em 2026-11-25, 1 kH/s valia cerca de $1 por mês, com o preço do XMR e a dificuldade da rede observados. Uma CPU de desktop usando metade dos threads pode consumir de 30 a 50 W a mais. Confira o seu uso real e o preço da sua eletricidade para ver se compensa."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, depois que você reduzir)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Quando o limite do pool é atingido"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "O pool paga o seu endereço Monero quando o seu saldo atinge o seu limite. O pool mantém o saldo até pagar você."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Esta máquina informa uma conexão de hospedagem. Confira os termos do seu provedor antes de minerar. Alguns provedores, incluindo a Hetzner Cloud, proíbem isso. Confira o seu custo real de energia antes de confiar em uma estimativa de lucro."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "O MoneroOcean, o pool padrão, cobra 0% de taxa de mineração. O limite de pagamento padrão é 0.3 XMR, e você pode reduzi-lo para 0.003 XMR. Pagamentos abaixo de 4 XMR podem custar até 0.0004 XMR. Outros pools definem as próprias taxas e limites."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "computação"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "Não. O minerador envia trabalho para pools de mineração."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "O seu endereço Monero, o nome do worker e o endereço IP vão para o pool."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "Algumas redes e resolvedores de DNS bloqueiam conexões com pools de mineração."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "A maioria dos pools de Monero identifica você pelo seu endereço público de pagamento."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Um pagamento exige XMR suficiente para atingir o limite do seu pool."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "Alguns provedores de hospedagem proíbem a mineração de criptomoedas."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "A eletricidade extra pode custar mais do que os XMR ganhos."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "O minerador envia hashes para os pools e não retransmite o tráfego de ninguém."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "O minerador é de código aberto e a imagem fixa uma versão upstream assinada."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Você pode minerar com um endereço Monero público sem se identificar pelo nome."
  source: "752cbb728aac"
