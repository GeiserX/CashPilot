ionet.description:
  text: "A io.net é uma rede descentralizada de GPUs para cargas de trabalho de IA/ML. Reúne GPUs ociosas de usuários comuns e de data centers. Requer GPU NVIDIA com 8GB+ de VRAM para ganhos relevantes. Implantações baseadas em contêiner são suportadas.\n"
