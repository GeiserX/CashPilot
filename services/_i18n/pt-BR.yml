grass.description:
  text: "A Grass é uma rede descentralizada que permite vender a largura de banda que você não usa para dados de treinamento de IA. Funciona como extensão de navegador e app para desktop, encaminhando solicitações de web scraping pela sua conexão para montar conjuntos de dados estruturados. Com mais de 8.5M usuários, é uma das maiores redes DePIN de largura de banda. Ganha tokens GRASS na blockchain Solana.\n"
  source: "046951d812f9"
grass.short_description:
  text: "Compartilhamento de banda DePIN para dados de IA - ganha tokens GRASS"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Token de acesso"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Faça login em <a href=\"https://app.grass.io\">app.grass.io</a>, pressione F12 → Application → Local Storage → clique em <code>https://app.grass.io</code> → copie o valor de <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Ganha Grass Points, conversíveis em tokens GRASS por meio de airdrops. O valor real em USD depende do preço do token. É necessária a extensão de navegador ou o app para desktop."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Airdrop por época (epoch)"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "As recompensas vêm em distribuições periódicas resgatadas no painel da Grass. A distribuição da Stage 2 (atividade de outubro de 2024 a junho de 2026) é paga em USDC: resgate-a em app.grass.io/dashboard até 22 de janeiro de 2027, ou antes, se todas as alocações forem resgatadas primeiro. A Grass fica com as recompensas não resgatadas."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "Acumula PONTOS; o GRASS é resgatado no painel da Grass durante os airdrops periódicos."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Faça login em <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, pressione F12 → Application → Local Storage e copie o valor de <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% dos pontos de tempo online dos indicados diretos, 10% no segundo nível e 5% no terceiro"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Resgate os seus USDC da Stage 2 da Grass"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "A Grass fica com toda alocação da Stage 2 não resgatada até 22 jan 2027, e o prazo pode terminar antes, quando todas as alocações forem resgatadas."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Entre em app.grass.io com a conta que você usou na Stage 2, ative a Grass Wallet, abra a aba Allocation e confirme. Resgate somente em app.grass.io. Não tem pontos da Stage 2? Escolha Não é para mim."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "As recompensas vêm apenas por meio de temporadas de airdrop. Operadores de nó de longa data relataram estimativas da temporada 2 na faixa de um dígito a poucas dezenas de dólares."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "As recompensas da temporada 2 não resgatadas até 22 de janeiro de 2027 são perdidas para sempre."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "O primeiro airdrop gerou reclamações pelas pequenas recompensas por ponto, diluídas entre mais de dois milhões de usuários."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "O CashPilot não roda a Grass: você usa o app ou a extensão do próprio provedor, então o CashPilot não pode implantá-los nem atualizá-los para você. Os termos dela não foram verificados quanto ao uso em contêineres."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "O primeiro airdrop chegou a quase 1.5 milhão de endereços que resgataram."
  source: "a4c55e10affa"
helium.description:
  text: "A Helium é uma rede sem fio descentralizada já consolidada. Começou com hotspots LoRaWAN e agora se expandiu para o 5G. Requer hardware dedicado ($500+). Ganha tokens HNT/MOBILE. O retorno sobre o investimento caiu muito - em geral $4-8/mês.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "Rede sem fio descentralizada - requer hardware, tokens HNT"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "Requer a compra de hardware de $500+. O retorno sobre o investimento caiu muito. Há um processo de aprovação para novos operadores."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "Por época (epoch)"
  source: "75743e03bad2"
helium.payout.notes:
  text: "Ainda não determinado: o CashPilot ainda não verificou onde este serviço guarda os seus ganhos."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "A HIP 149 encerrou as recompensas de Proof-of-Coverage em 6 de julho de 2026; os hotspots IoT agora só ganham pelos dados que transportam, e mais de 114,000 deles não transportaram nenhum."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "O modelo de recompensas da Helium mudou por votação várias vezes, o CEO deixou o cargo e o HNT caiu cerca de 96%."
