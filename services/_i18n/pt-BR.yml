vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/h, RTX 4090 ~$0.40-0.80/h quando alugadas. A taxa de utilização varia. Requer GPU NVIDIA, host Linux, Docker e nvidia-container-toolkit. Defina os seus próprios preços."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Semanal (às sextas-feiras)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "Os ganhos se acumulam no saldo da Vast.ai. Saque via Wise, PayPal ou Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Ainda não determinado: o CashPilot ainda não verificou onde este serviço guarda os seus ganhos."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% do que os locatários indicados gastarem, durante toda a vida da conta deles, em créditos de indicação; até 75% pode ser sacado a partir de uma conta de indicação dedicada"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
