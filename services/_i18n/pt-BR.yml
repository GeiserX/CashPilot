  source: "1f51b1d2ddac"
wipter.description:
  text: "O Wipter é uma plataforma de compartilhamento de largura de banda disponível para Windows, Mac, Linux e Android. Afirma pagar até $1/GB de largura de banda compartilhada, com um limite mínimo de pagamento de $20. A plataforma funciona de forma parecida com os apps tradicionais de compartilhamento de largura de banda, encaminhando tráfego legítimo por conexões residenciais.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Compartilhamento de banda - afirma pagar até $1/GB, pagamento mín. $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
