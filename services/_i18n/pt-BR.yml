golem.description:
  text: "A Golem Network é um marketplace descentralizado de computação em que você compartilha recursos de CPU e GPU em troca de tokens GLM. Os provedores rodam o agente Yagna, que gerencia a execução das cargas de trabalho em ambientes isolados (sandbox). É um dos projetos de computação descentralizada mais antigos (fundado em 2016). Suporta tarefas de CPU, renderização em GPU e computação de uso geral. Pagamentos via Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Marketplace de computação descentralizada - tokens GLM via agente Yagna"
  source: "88f817c25848"
golem.earnings.notes:
  text: "Os ganhos dependem do hardware, dos preços e da demanda por tarefas. Nós só com CPU ganham menos. Nós com GPU ganham mais, mas exigem NVIDIA. Rode o agente de provedor Yagna (não uma imagem Docker). Pagamentos na Polygon em tokens GLM."
  source: "07287d437d51"
golem.payment.frequency:
  text: "A cada tarefa concluída"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "Ganha tokens GLM. Configure a carteira de pagamento na configuração do provedor."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Ainda não determinado: o CashPilot ainda não verificou onde este serviço guarda os seus ganhos."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "O CashPilot não roda a Golem: você mesmo instala o agente de provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. A Golem documenta como rodar o provedor na sua própria imagem Docker."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "O agente de provedor, yagna, é de código aberto, sob a GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Sem conta: você define uma carteira de pagamento na configuração do provedor."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
