  text: "O Pawns vê outro dispositivo ativo neste endereço IP e paga apenas um por IP, então esta cópia roda, mas não compartilha nada e não ganha nada. Pare qualquer outro app Pawns neste IP, em outra máquina, em um PC ou em um celular. Se não houver nenhum, espere o Pawns descartar o dispositivo antigo ou peça ao suporte do Pawns para liberá-lo."
