  source: "b1ba1636070f"
earnapp.description:
  text: "O EarnApp, da Bright Data, permite vender a largura de banda que você não usa para obter renda passiva. A Bright Data é a maior rede de proxies do mundo e alimenta a coleta de dados de empresas da Fortune 500. O CashPilot o roda a partir de uma imagem própria, que baixa a versão fixada do EarnApp da CDN da Bright Data na primeira inicialização, verifica o sha256 e a executa no modo lite apenas com um UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Compartilhamento de banda - apoiado pela Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "UUID do nó"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "O ID do seu nó EarnApp: sdk-node- seguido de 32 caracteres hexadecimais minúsculos, como 'earnapp showid' o exibe. Depois de implantar, vincule-o uma vez abrindo https://earnapp.com/r/ seguido deste UUID com a sessão do EarnApp iniciada; um nó não vinculado ganha, mas nada chega ao seu saldo"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "O EarnApp continua falhando ao acessar os seus servidores e reiniciando, então ganha pouco ou nada. Reinicie esta cópia; se continuar acontecendo, verifique a conexão de internet desta máquina."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Abra este link com a sessão do EarnApp iniciada para adicionar o nó à sua conta. Até você fazer isso, o nó ganha, mas nada chega ao seu saldo."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Depende muito da localização. IPs dos EUA/UE são os que mais ganham. Os ganhos aumentam conforme a largura de banda consumida."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Sob solicitação (resgate automático disponível: PayPal mín. $10, Wise mín. $10, Amazon mín. $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Ative o resgate automático uma vez e o EarnApp paga sozinho sempre que o saldo atingir o mínimo do método: PayPal $10, Wise $10, Amazon $50. Os pagamentos via PayPal chegam da Bright Data Ltd. Em outubro de 2026, um pagamento via PayPal chegou cerca de 2% abaixo do saldo resgatado."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Saldo mantido pelo EarnApp; resgatado via Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Faça login em <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, pressione F12 → Application → Cookies e copie o valor de <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% dos ganhos deles para sempre, pagos além dos ganhos deles"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "A central de ajuda do EarnApp diz que instalá-lo em contêineres Docker, máquinas virtuais, serviços de hospedagem ou servidores domésticos é estritamente proibido, e é assim que o CashPilot o roda."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "O mesmo artigo de ajuda diz que uma conta flagrada rodando dessa forma é encerrada sem aviso e os seus pagamentos pendentes são cancelados."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "O nosso pagamento via PayPal chegou em outubro de 2026, cerca de 2% abaixo do saldo resgatado."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "Mínimo de $10 para PayPal e Wise, com resgate automático que paga sozinho."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "O EarnApp pertence à Bright Data, e os pagamentos via PayPal chegam da Bright Data Ltd., uma empresa identificada."
  source: "ead3e8e87bba"
earnfm.description:
  text: "O Earn.fm paga você por compartilhar a sua largura de banda de internet. O coletor de ganhos usa autenticação por e-mail/senha via Supabase. Imagem Docker leve, com implantação simples (o cliente Docker usa um token UUID separado).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "Compartilhamento de banda - autenticação por e-mail/senha, cliente leve"
  source: "d74693321b51"
