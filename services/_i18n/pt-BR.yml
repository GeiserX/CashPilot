2miners-etc.description:
  text: "Acompanhe o saldo não pago de Ethereum Classic que a 2Miners mantém para o seu endereço público de pagamento em ETC. Rode o seu próprio minerador e aponte-o para o pool. O CashPilot lê o saldo e pede que você confirme os pagamentos quando o saldo cai.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Pool de mineração de Ethereum Classic, acompanhado pelo seu endereço de pagamento"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (ajustável)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "O pool verifica o seu limite de pagamento a cada duas horas"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "A 2Miners paga o seu endereço automaticamente assim que você atinge o limite escolhido. O limite mais baixo para pagamentos em ETC é 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "O saldo não pago se acumula na 2Miners. O saldo da carteira é uma leitura separada, feita na rede Ethereum Classic. Confira na sua carteira o valor recebido antes de confirmar um pagamento no CashPilot.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Informe o endereço público de pagamento em Ethereum Classic que o seu minerador usa na 2Miners, começando com <b>0x</b>. Não inclua nenhum nome de worker.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Requer um minerador ETCHash apontado para a 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "computação"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Não. O seu minerador envia trabalho de mineração para o pool."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "O pool usa o seu endereço de pagamento, os nomes de worker que você escolher e o endereço IP do seu minerador."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Qualquer pessoa pode ver as estatísticas pelo endereço de pagamento. Para alterar o limite, o pool pede a confirmação do IP de um worker."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "O pool cobra uma taxa de 1% e retém os pagamentos até você atingir o seu limite."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "O Anyone Protocol (antigo ATOR) é uma rede de privacidade descentralizada com roteamento onion. Os operadores de nó rodam nós de retransmissão (relays) e ganham tokens ANYONE pela largura de banda fornecida. Pense em um “Tor com incentivos”. O CashPilot o roda a partir de uma imagem própria, criada com o pacote Debian assinado do projeto, para amd64 e arm64. A configuração é feita por um arquivo anonrc montado no contêiner (Nickname, ContactInfo, ORPort etc.). Um relay não ganha nada até que 100 ANYONE fiquem bloqueados para ele por pelo menos 180 dias, e as recompensas são resgatadas com uma assinatura na sua carteira. O relay também publica o seu IP público no diretório de relays da rede, o que pode prejudicar a reputação do IP pela qual os apps de largura de banda residencial pagam.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Roteamento onion descentralizado - nós relay do Tor com incentivos"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Chave de identidade ed25519 do relay. Destruí-la encerra a reputação do relay e reinicia do zero o seu histórico de ganhos."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Só paga com 100 ANYONE bloqueados por relay por pelo menos 180 dias e um resgate de recompensa assinado na sua carteira. Sem esse stake, um relay não ganha nada. Com ele, os ganhos dependem da largura de banda fornecida e do tempo online."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Por época (epoch)"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Definido como ContactInfo no anonrc, com o prefixo '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Impressões digitais (fingerprints) dos relays, separadas por vírgula. Esta não fica em um painel web: rode <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> no host que executa o relay.\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Largura de banda, como relay na rede Anyone (um fork do Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Sim. Ele retransmite o tráfego de outras pessoas. Se o seu IP é o último salto depende de o relay estar configurado como saída (exit)."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "A chave pública de identidade do relay, o seu IP e porta e estatísticas de tempo online, tudo publicado no diretório da rede de propósito. Se você definir ContactInfo no seu anonrc, ele também é publicado ali e fica indexado publicamente para sempre. Normalmente é um endereço de e-mail, então deixe-o vazio, a menos que queira que ele seja público."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Real. O tráfego do relay é atribuído à sua conexão. Relays de saída, em especial, atraem denúncias de abuso; muitos provedores de internet residenciais os proíbem."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Não há conta para criar, então não há nada a limitar por conta. Para ganhar, você ainda precisa de uma carteira Ethereum com 100 ANYONE bloqueados para cada relay por pelo menos 180 dias, e o CashPilot precisa das fingerprints dos relays para ler as recompensas. O projeto não publica um limite de relays por IP, e o catálogo não declara nenhum."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Um relay não ganha nada se 100 ANYONE não ficarem bloqueados para ele por pelo menos 180 dias, e cada resgate de recompensa é assinado na sua carteira."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Ele retransmite o tráfego de outras pessoas por design, sem verificar quem elas são; relays de saída atraem denúncias de abuso."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "A identidade, o IP e o tempo online do relay são publicados no diretório da rede, e qualquer ContactInfo que você definir fica público para sempre."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Não há conta para criar. Um relay precisa apenas de uma carteira, sem verificação de identidade."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "O software do relay é um fork publicado do Tor, sob a licença do Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "O CashPilot cria a sua própria imagem a partir do software de relay publicado pela Anyone, que não exige conta."
  source: "2e36c9093df6"
bitping.description:
  text: "A Bitping é uma plataforma descentralizada de monitoramento de rede que paga você por rodar um nó. O seu nó faz monitoramento de sites, testes de latência e verificações de qualidade de rede para os clientes da Bitping. Funciona tanto em conexões residenciais quanto em VPS. A imagem Docker faz login com as variáveis de ambiente BITPING_EMAIL e BITPING_PASSWORD na primeira inicialização (\"Attempting login with environment variables\" no próprio log), depois mantém a sessão no volume montado, para que as reinicializações não precisem autenticar de novo.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Compartilhamento de banda - monitoramento de rede descentralizado, funciona em VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "E-mail"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Senha"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "O e-mail da sua conta Bitping (o mesmo login de <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "A senha da sua conta Bitping. Usada uma vez para criar a sessão do nó, que depois fica guardada no volume de dados."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Os ganhos dependem da qualidade da rede e da demanda por monitoramento na sua localização. Nós em VPS são aceitos."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Os ganhos dos nós ficam em nodes.bitping.com; app.bitping.com é o painel dos clientes da API. Os saques são só em SOL: quando o saldo não pago passar de $0.05, digite o endereço Solana na solicitação, processada em até 24 horas. Uma carteira Solana nova ou vazia precisa primeiro ter cerca de 0.001 SOL, para o mínimo de aluguel (rent) da rede."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Agora só Solana, e o endereço é digitado NO MOMENTO DO SAQUE em vez de ficar salvo."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Use o e-mail e a senha da sua conta Bitping (os mesmos de <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Saque o seu saldo da Bitping"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "A Bitping pode confiscar ganhos não resgatados por mais de 12 meses, após aviso de 30 dias por e-mail."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Solicite um saque em SOL em nodes.bitping.com e digite o seu endereço Solana na solicitação."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Os saques são pagos em Solana (SOL), para um endereço que você digita em cada solicitação."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "A ajuda da Bitping diz que um saque para uma carteira Solana nova e vazia pode falhar até que você mesmo coloque um pouco de SOL nessa carteira."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "A ajuda da Bitping diz que servidores e contêineres Docker são suportados."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Um saque precisa apenas de um endereço Solana digitado na solicitação."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "A Bytebenefit é um serviço de compartilhamento de largura de banda que paga via PayPal e Stripe. Não há imagem Docker oficial; os clientes são o app para desktop Windows e o app Android. O serviço fica em bytebenefit.io -- o antigo domínio bytebenefit.com foi abandonado e está estacionado em um marketplace, e por isso ele já foi marcado aqui como inativo.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Compartilhamento de banda - pagamentos via PayPal/Stripe, app desktop/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Nenhuma imagem Docker disponível. Apenas apps para desktop Windows e Android."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Ainda não determinado: o CashPilot ainda não verificou onde este serviço guarda os seus ganhos."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% dos ganhos de tráfego dos indicados"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "Bônus de boas-vindas de $1 (10,000 Coins)"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "A página do app no Google Play diz que o seu tráfego atende a solicitações de inteligência web de clientes da Infatica, sem dizer quem eles são nem como são verificados."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "O app Android saiu do Google Play em abril de 2026, depois de 17 meses."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "O CashPilot não roda o ByteBenefit: você usa o app do próprio provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. Os termos dele não foram verificados quanto ao uso em contêineres."
  source: "550e4508aba2"
bytelixir.description:
  text: "A Bytelixir permite ganhar renda passiva compartilhando a largura de banda de internet que você não usa. Suporta apenas Windows e Android — o FAQ oficial diz que não há planos de cliente para Linux ou Docker, o iOS não é suportado e o macOS não é oferecido. Os ganhos dependem muito da localização. Painel web em dash.bytelixir.com para acompanhamento. Nenhuma imagem Docker disponível.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Compartilhamento de banda - apenas Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Cookie de sessão"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Cookie Remember Web"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "Token XSRF"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Faça login em <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, pressione F12 → Application → expanda <b>Cookies</b> na barra lateral esquerda → clique no subitem <code>https://dash.bytelixir.com</code> → na lista de cookies à direita, encontre <code>bytelixir_session</code> → copie o Value dele (um JWT longo que começa com eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Mesmo local (Cookies → <code>https://dash.bytelixir.com</code>) → encontre o cookie chamado <code>remember_web_...</code> → copie o Value dele (opcional, prolonga a duração da sessão)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Mesmo local → encontre <code>XSRF-TOKEN</code> → copie o Value dele (opcional)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Os ganhos variam conforme a localização ($2-50/mês). Sem imagem Docker. É necessário o app para desktop ou o app Android."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Somente cripto. O mínimo depende da moeda: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Você digita o endereço em cada solicitação. As solicitações são atendidas em horário comercial, em até 24 horas."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Saldo mantido pela Bytelixir; o endereço da carteira é digitado em cada solicitação de pagamento e nunca fica salvo no contêiner."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Faça login em <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>marcando Remember Me</b>, pressione F12 → Application → expanda <b>Cookies</b> na barra lateral esquerda → clique em <code>https://dash.bytelixir.com</code> e copie três valores: <b>bytelixir_session</b>, <b>remember_web_…</b> (o longo que começa com esse prefixo) e <b>XSRF-TOKEN</b>. O cookie de sessão sozinho expira cerca de duas horas depois de copiado, então a coleta para na mesma tarde; o cookie remember_web dura um ano e é ele que mantém tudo funcionando."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50% do lucro deles, para sempre"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "Bônus de boas-vindas de $1"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Somente cripto, e o mínimo depende da moeda, de $5 para USDT a $250 para Bitcoin."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "O CashPilot não roda o Bytelixir: você usa o app do próprio provedor, então o CashPilot não pode implantá-lo nem atualizá-lo para você. Os termos dele não foram verificados quanto ao uso em contêineres."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "O Trustpilot dá nota 4.6 com base em 283 avaliações, a maioria elogiando os pagamentos em cripto; algumas relatam pagamentos que não chegaram."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Um pagamento precisa apenas de um endereço de cripto digitado na solicitação."
  source: "89f36ce9e779"
clore-ai.description:
  text: "A Clore.ai é um marketplace peer-to-peer de GPUs. Você anuncia uma máquina Linux com GPUs NVIDIA, define os seus próprios preços spot e sob demanda, e os locatários rodam os próprios contêineres Docker nela. Você recebe apenas pelos minutos em que ela fica alugada, em CLORE, BTC, USDT ou USDC. A hospedagem requer uma máquina x86_64 com Ubuntu 22.04 ou mais recente (ou HiveOS), um driver NVIDIA funcionando e pelo menos 100 Mbps de upload e download. GPUs AMD não são suportadas.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "Marketplace de GPUs - alugue GPUs NVIDIA, com pagamento em CLORE, BTC ou stablecoins em dólar"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Paga apenas pelos minutos alugados, ao preço que você definir. O topo da faixa, $490, é o teto da própria Clore para uma RTX 4090 anunciada por minuto ('up to ~$490/month'); placas menores ganham menos e uma placa ociosa não ganha nada. A Clore fica com 5% (sob demanda) ou 1.25% (spot) de cada aluguel, mais 15% quando o locatário paga em BTC, USDT ou USDC em vez de CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Sob solicitação"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Saque em Account > Billing para a sua própria carteira: CLORE (ERC-20, mínimo de 200, taxa de cerca de $0.50), BTC (mínimo de 0.0001, taxa de 0.00005 BTC) ou USDT/USDC na Ethereum ou na BNB Chain (mínimo de $10, taxa de $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "A Clore mantém o saldo (CLORE, BTC e um saldo em dólar para USDT/USDC) até você sacar. A rede é escolhida a cada saque: Ethereum para CLORE, Bitcoin para BTC, Ethereum ou BNB Chain para USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (nível padrão) das taxas da plataforma pagas pelos hosts e locatários que você indicar, em todo aluguel; o código nunca expira; pago na moeda do aluguel (CLORE, BTC ou USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps de upload e download"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "Tempo de computação de GPU na sua máquina."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Sim. Os locatários rodam os próprios contêineres Docker na sua máquina, e o tráfego deles sai pela sua conexão; as portas SSH e de aplicação são encaminhadas para a internet."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "A política de privacidade da Clore abrange dados da conta e o seu endereço IP com uma localização aproximada; documentos de identidade apenas se a Clore pedir KYC."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "As portas de entrada precisam estar acessíveis pela internet (22, 8080 e 3000-4000 por padrão) e cargas de trabalho de desconhecidos rodam na sua linha. O próprio guia de rede da Clore diz que alguns provedores de internet bloqueiam hospedagem."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "18 anos ou mais, fora de países sob sanções. A Clore pode suspender ou encerrar uma conta a seu exclusivo critério, e um uso proibido pode custar os fundos."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Nem os termos nem a política de privacidade citam uma pessoa jurídica, e os termos deixam a jurisdição aplicável para uma versão futura."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "A Clore pode suspender ou encerrar uma conta a seu exclusivo critério, e um uso proibido pode levar à perda dos fundos."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Os pagamentos são só em cripto (CLORE, BTC, USDT ou USDC), e a Clore fica com 15% a mais de um aluguel que o locatário paga em BTC, USDT ou USDC, a menos que o host bloqueie CLORE para reduzir isso."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Um host recebe apenas pelos minutos alugados, e o valor da Clore para uma RTX 4090 é um teto (\"up to ~$490/month\") para uma única placa."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "O uso básico não exige KYC, mas a Clore pode pedir verificação de identidade para saques grandes ou casos de compliance."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Os locatários rodam qualquer imagem Docker pública na sua máquina. Os termos listam usos proibidos (malware, DDoS, CSAM e outros), mas não encontramos nenhuma descrição de como os locatários são verificados."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "O CashPilot não roda a Clore.ai: você instala o agente de hospedagem da Clore na sua própria máquina com GPU (Ubuntu 22.04 ou mais recente, ou HiveOS), então o CashPilot não pode implantá-lo nem atualizá-lo para você."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
