  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "تتراكم الأرباح في رصيد Vast.ai. اسحب عبر Wise أو PayPal أو Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% مما ينفقه المستأجرون المحالون، طوال عمر حساباتهم، كأرصدة إحالة؛ ويمكن سحب ما يصل إلى 75% منها نقدًا من حساب إحالة مخصص"
  source: "a52e6fabeaac"
