  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "$1 في كل دفعة من دفعاتك الثلاث الأولى، بحد أقصى $3؛ وإذا فاتتك نافذة 1-3 أسابيع تنتهي صلاحية البقية"
