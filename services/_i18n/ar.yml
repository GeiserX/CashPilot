  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "افتح صفحة Rewards واستبدل نقاطك بـ MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "عرض النطاق. يُستخدم اتصالك كعقدة خروج لشبكة Mysterium، التي تبيع خدمات VPN والبروكسي وجمع البيانات أيضًا. حركة مرور جمع البيانات الخارجة من عنوان IP منزلي هي الاستخدام الأكثر ترجيحًا لجلب الشكاوى، ولا يمكنك اختيار أي من الثلاثة تحمله عقدتك."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "نعم. يوجّه غرباء حركة مرورهم عبر عنوان IP الخاص بك — وهذا هو المنتج نفسه."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "هوية العقدة (عنوان على البلوك تشين)، وعنوان IP الخاص بك، وموقع تقريبي (البلد/المدينة/مزوّد الإنترنت)، تنشرها العقدة في الشبكة حتى يتمكن المشترون من اختيارها."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "حقيقي ويستحق الفهم. تخرج حركة مرور أشخاص آخرين من اتصالك منسوبةً إليك، لذا يبدو أن أي شيء يفعلونه صادر من خطك. تحظر كثير من عقود مزوّدي الإنترنت المنزلي ذلك. راجع عقدك قبل تشغيلها."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "عدد غير محدود من الأجهزة لكل حساب ولكل عنوان IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "يذهب نحو 21% من كل تسوية رسومًا، رسوم Hermes البالغة 20% إضافة إلى رسوم معاملة، وتُدفع الأرباح برمز MYST."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "عقدتك نقطة خروج لعملاء Mysterium في خدمات VPN والبروكسي وجمع البيانات، ولا يمكنك اختيار من منهم تحمل حركة مروره."
  source: "fec2996bf4fe"
