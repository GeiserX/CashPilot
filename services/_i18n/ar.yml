flux.description:
  text: "Flux بنية تحتية للحوسبة موزعة عالميًا. يرهن مشغّلو العقد رموز FLUX ويقدّمون موارد الخوادم. ثلاثة مستويات: Cumulus (1,000 FLUX)، وNimbus (12,500 FLUX)، وStratus (40,000 FLUX). تتوفر صور حاويات Docker رسمية.\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "حوسبة لامركزية - تتطلب رهن رموز FLUX"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "يتطلب رهن 1,000 FLUX أو أكثر (نحو $50-500 حسب السعر). المستويات الأعلى تحتاج إلى ضمان أكبر لكنها تكسب أكثر."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "مكافآت الكتل"
  source: "590433237f8a"
flux.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "يحتاج أصغر مستوى للعقد إلى 1,000 FLUX مقفلة كضمان."
