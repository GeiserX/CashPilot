  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN مجمّع تعدين Bitcoin بلا حساب: يسجّل برنامج التعدين الدخول باستخدام عنوان Bitcoin الخاص بك كاسم مستخدم، ويدفع المجمّع إلى ذلك العنوان. لا يشغّل CashPilot أي برنامج تعدين هنا. بل يقرأ الرصيد غير المدفوع الذي يحتفظ به OCEAN لعنوانك، فترى ما كسبه جهاز ASIC الخاص بك (Bitaxe أو Antminer) بجانب دخلك الآخر. الرصيد غير المدفوع مكتسب لكنه لم يصل بعد: يدفعه OCEAN على السلسلة بمجرد تجاوزه حد الدفع.\n"
  source: "5d25f28a3de5"
ocean.short_description:
