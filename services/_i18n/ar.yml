  text: "رمز عملة تدفع بها unMineable، مثل SHIB أو DOGE أو XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "عنوانك العام لتلك العملة. العملات التي تحتاج إلى مذكرة (memo) أو وسم (tag) غير مدعومة."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "تقدير إجمالي قبل احتساب الكهرباء، يُدفع بعملتك بسعر التحويل لدى unMineable. في 2026-11-25 كانت قيمة 1 kH/s من RandomX نحو $1 شهريًا. قد يستهلك معالج حاسوب مكتبي يعمل بنصف خيوطه 30 إلى 50 W إضافية. تحقّق من استهلاكك الفعلي وسعر الكهرباء لترى إن كان التعدين مجديًا."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "تحدده unMineable لكل عملة (0.03 XMR في 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "عند بلوغ حد الدفع الخاص بالعملة"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "تدفع unMineable إلى عنوانك بمجرد أن يبلغ رصيدك حد الدفع الخاص بالعملة. تختلف الحدود حسب العملة والشبكة؛ ويقرأ CashPilot الحد الذي تعلنه unMineable لعنوانك."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "الرصيد مكتسب لكنه لا يصل حتى تدفعه unMineable إلى هذا العنوان. تعتمد السلسلة على العملة التي تختارها."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "عنوان الدفع ورمز العملة نفسهما اللذان نشرت بهما برنامج التعدين، مثلًا <b>XMR</b>. أدخل العنوان وحده، دون العملة أو اسم العامل أو رمز الإحالة. وهو عام ولا يتيح الوصول إلى أي أموال."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% من مكافآت التعدين لكل معدِّن محال"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "خفض رسوم المنصة من 1% إلى 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "يُبلغ هذا الجهاز عن اتصال استضافة. راجع شروط مزوّد الاستضافة قبل التعدين. بعض المزوّدين، ومنهم Hetzner Cloud، يحظرونه. تحقّق من تكاليف الكهرباء الفعلية قبل الاعتماد على أي تقدير للربح."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "تفرض unMineable رسوم منصة بنسبة 1%. يضيف CashPilot رمز الإحالة الخاص به (#awk6-j1z0) بعد كل اسم عامل، ما يخفض رسومك إلى 0.75%. ثم تدفع unMineable لمشرف CashPilot نسبة 0.25% من مكافآت التعدين الخاصة بك؛ وتحتفظ أنت بنسبة 99.25%. لكل عملة حد دفع خاص بها، مثلًا 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "الحوسبة"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "لا. يرسل برنامج التعدين العمل إلى مجمّع unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "يصل عنوان الدفع والعملة واسم العامل ومعدل التجزئة وعنوان IP الخاص بك إلى unMineable."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "بعض الشبكات وخوادم DNS تحظر الاتصالات بمجمّعات التعدين."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "لا حاجة إلى حساب. العنوان والعملة هما الهوية، ويمكن لأي شخص قراءة إحصاءاتهما على unmineable.com."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "تحتفظ unMineable برسوم منصة بنسبة 0.75% مع رمز الإحالة، ولا تدفع إلا بدءًا من حد كل عملة."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "بعض مزوّدي الاستضافة يحظرون تعدين العملات المشفرة."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "قد تكلّف الكهرباء الإضافية أكثر من العملات المكتسبة."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "إحصاءات العنوان، بما فيها الرصيد، علنية لكل من يعرف العنوان."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "يرسل برنامج التعدين قيم التجزئة إلى المجمّع ولا ينقل حركة مرور أي شخص آخر."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "يمكنك التعدين إلى عنوان عام بالعملة التي تختارها دون إنشاء حساب."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock منصة DePIN (شبكة بنية تحتية مادية لامركزية) تتيح لك كسب العملات المشفرة بمشاركة اتصالك بالإنترنت. جزء من منظومة Web3 الأوسع. تتوفر صور حاويات Docker مجتمعية لكن لا توجد صورة رسمية. إضافة المتصفح هي الواجهة الأساسية.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "مشاركة الإنترنت ضمن DePIN - دفع بالعملات المشفرة، إضافة المتصفح هي الأساس"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "أرباح بالعملات المشفرة/الرموز. لا توجد صورة حاوية Docker رسمية — إضافة المتصفح هي العميل الأساسي."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
uprock.cashout.notes:
  text: "رموز UPT، تُسحب إلى محفظة Solana بدءًا من 250 UPT، مع تفعيل المصادقة الثنائية. تُطبَّق رسوم سحب."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "يذكر مركز المساعدة في UpRock أن عمليات السحب برموز UPT إلى محفظة Solana، بحد أدنى قدره 250 UPT."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "المكافآت رموز UPT؛ ويقول المراجعون ومراجعة من طرف ثالث إن قيمتها منخفضة جدًا."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "لا يشغّل CashPilot خدمة UpRock: أنت تستخدم تطبيق المزوّد أو إضافته، لذا لا يستطيع CashPilot نشرها أو تحديثها نيابة عنك. لم تُراجَع شروطها بشأن الحاويات."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork شبكة VPN ومشاركة عرض نطاق لامركزية. تكسب بتقديم عرض النطاق كمزوّد مجتمعي. يصادق البرنامج التنفيذي للمزوّد نفسه باستخدام البريد الإلكتروني وكلمة المرور لحسابك (الأمر الفرعي auth-provide)، ويخزّن رمز JWT للجلسة الناتجة في وحدة تخزين البيانات. صورة حاوية Docker رسمية من BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "VPN/عرض نطاق لامركزي - مصادقة بالبريد الإلكتروني+كلمة المرور، جلسة JWT في وحدة التخزين"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "البريد الإلكتروني"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "كلمة المرور"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "البريد الإلكتروني لحسابك في URnetwork (بيانات الدخول التي تستخدمها في <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). الحسابات التي أُنشئت عبر تسجيل الدخول بـ Google/Apple تحتاج إلى تعيين كلمة مرور أولًا. تحتاج إلى حساب؟ سجّل عبر <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "كلمة مرور حسابك في URnetwork (دون مسافات). يستخدمها تسجيل الدخول auth-provide الخاص بالمزوّد؛ ثم تُحفظ الجلسة في وحدة تخزين البيانات."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "يعمل على VPS والاتصالات المنزلية. يُدفع بـ SN25α (Bittensor subnet 25) لكل حقبة أسبوعية منذ 2026-10-06. يدعم وضع البروكسي للإعدادات متعددة عناوين IP."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "حسب الحقبة (epoch)"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "اضبط مفتاح Bittensor البارد (coldkey) على ur.io/app/account/earnings (موقَّعًا باستخدام Talisman أو TAO.com أو محفظة WalletConnect)، ثم طالب بكل حقبة مكتملة. تدفع المطالبة رسوم الغاز بعملة TAO من مفتاح غاز EVM. الحقب التي لا يُطالب بها تنتهي صلاحيتها، وقد أُلغيت دفعات USDC القديمة عندما لم تُربط أي محفظة خلال 30 يومًا."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB يوميًا من بيانات UR المجانية عن كل صديق، حتى 20 صديقًا (بيانات، وليست أموالًا)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB يوميًا من بيانات UR المجانية بمجرد أن تستخدم 10 MiB على الأقل عبر التطبيق في يومين خلال 90 يومًا من الانضمام؛ وإلا تنتهي الإحالة"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "الحقب التي لا يُطالب بها تنتهي صلاحيتها، وقد أُلغيت دفعات USDC القديمة للشبكات التي لم تُربط بها أي محفظة خلال 30 يومًا."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "منذ أكتوبر 2026 تُدفع المكافآت بـ SN25α، وهو رمز شبكة فرعية في Bittensor، وكل مطالبة تكلّف رسوم غاز بعملة TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "كانت URnetwork تُعرف سابقًا باسم BringYour؛ وتحمل ورقتها البيضاء المؤرشفة الاسم القديم."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "تنشر URnetwork الشيفرة المصدرية لعميل المزوّد الخاص بها."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "تنشر URnetwork صورة حاوية Docker خاصة بها، bringyour/community-provider، وتعمل على اتصالات VPS والاتصالات المنزلية."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "لا تحتاج المطالبة إلا إلى محفظة Bittensor تتحكم فيها."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai سوق سحابي لوحدات GPU تؤجّر فيه NVIDIA GPU الخاصة بك لباحثي ومطوّري الذكاء الاصطناعي وتعلّم الآلة. منصة مبنية على Docker تحدد فيها أسعارك بالساعة بنفسك. تكسب بطاقة RTX 3090 عادةً $0.20-0.40/hr عند تأجيرها. يتطلب NVIDIA GPU بتعريفات حديثة واتصالًا مستقرًا بالإنترنت. تعتمد الإيرادات كثيرًا على طراز GPU واستراتيجية التسعير والطلب في السوق.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "سوق GPU - حدد أسعارك بنفسك، بطاقة RTX 3090 نحو $0.20-0.40/hr"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "مفتاح API"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "مفتاح API للمضيف في Vast.ai من لوحة التحكم"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "بطاقة RTX 3090 نحو $0.20-0.40/hr، وبطاقة RTX 4090 نحو $0.40-0.80/hr عند تأجيرها. تختلف نسبة الاستخدام. يتطلب NVIDIA GPU، وجهازًا مضيفًا يعمل بنظام Linux، وDocker، وnvidia-container-toolkit. حدد أسعارك بنفسك."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
