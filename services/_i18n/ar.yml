storj.description:
  text: "Storj شبكة تخزين سحابي لامركزية تكسب فيها بتأجير مساحة القرص غير المستخدمة. شغّل عقدة التخزين عبر Docker واحصل على $1.35/TB مخزَّن شهريًا إضافة إلى $1/TB لحركة البيانات الصادرة (الأسعار منذ 1 سبتمبر 2026). تُدفع الدفعات شهريًا بعملة USDC، وهي عملة مستقرة مربوطة بالدولار الأمريكي، على شبكة Ethereum الرئيسية إلى محفظة تتحكم فيها، بمجرد أن يتجاوز الرصيد حدًا أدنى يعتمد على الرسوم (برمز STORJ حتى دفعة سبتمبر 2026). يتطلب 550GB على الأقل من مساحة القرص المتاحة واتصالًا مستقرًا بالإنترنت. لا حاجة إلى حساب أو تسجيل -- العقد لا تحتاج إلى إذن مسبق منذ منتصف 2025. تنبيه (أكتوبر 2026): تقدّمت Storj Labs بطلب الحماية بموجب الفصل 11 (Chapter 11) في 26 يوليو 2026 (US Bankruptcy Court، المنطقة الشمالية لولاية West Virginia، القضية 5:26-bk-00512) لإعادة هيكلة ديون سابقة. تستمر الشبكة في العمل وتواصل Storj الدفع للعقد النشطة، لكن أرباح العقد السابقة لتقديم الطلب مجمّدة حتى تبتّ فيها المحكمة. انخفض رمز STORJ بنحو 98% عن ذروته في 2021. أزالت Binance إدراجه في 3 سبتمبر 2026، وعلّقت Coinbase تداوله في 28 سبتمبر 2026. تحجب العقدة الجديدة جزءًا من أرباحها خلال أشهرها التسعة الأولى ولا تمتلئ إلا بقدر ما يسمح به طلب العملاء، لذا فإن بدء تشغيل عقدة الآن يربط استردادًا طويل الأمد لتكاليفك بشركة في طور إعادة الهيكلة لا يزال من الممكن أن تُصفّى أعمالها.\n"
  source: "491c6a4d439a"
storj.short_description:
