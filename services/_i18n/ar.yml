clore-ai.description:
  text: "Clore.ai سوق لوحدات GPU من نظير إلى نظير. تعرض جهاز Linux مزوّدًا بوحدات NVIDIA GPU، وتحدد أسعارك الفورية وأسعار الطلب بنفسك، ويشغّل المستأجرون حاويات Docker الخاصة بهم عليه. لا يُدفع لك إلا عن الدقائق التي يكون فيها مؤجَّرًا، بعملات CLORE أو BTC أو USDT أو USDC. تتطلب الاستضافة جهاز x86_64 يعمل بنظام Ubuntu 22.04 أو أحدث (أو HiveOS)، وتعريف NVIDIA يعمل، وسرعة 100 Mbps على الأقل في الرفع والتنزيل. وحدات AMD GPU غير مدعومة.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "سوق GPU - أجِّر وحدات NVIDIA GPU، والدفع بـ CLORE أو BTC أو عملات مستقرة بالدولار"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "لا يُدفع إلا عن الدقائق المؤجَّرة، بالسعر الذي تحدده. الحد الأعلى للنطاق، $490، هو السقف الذي تذكره Clore نفسها لبطاقة RTX 4090 واحدة معروضة بالدقيقة ('up to ~$490/month')؛ البطاقات الأصغر تكسب أقل، والبطاقة الخاملة لا تكسب شيئًا. تحتفظ Clore بنسبة 5% (عند الطلب) أو 1.25% (فوري) من كل تأجير، بالإضافة إلى 15% عندما يدفع المستأجر بـ BTC أو USDT أو USDC بدلًا من CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "اسحب من Account > Billing إلى محفظتك الخاصة: CLORE (ERC-20، الحد الأدنى 200، الرسوم نحو $0.50)، أو BTC (الحد الأدنى 0.0001، الرسوم 0.00005 BTC)، أو USDT/USDC على Ethereum أو BNB Chain (الحد الأدنى $10، الرسوم $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "تحتفظ Clore بالرصيد (CLORE وBTC ورصيد واحد بالدولار لـ USDT/USDC) حتى تسحبه. تُختار السلسلة لكل عملية سحب: Ethereum لـ CLORE، وBitcoin لـ BTC، وEthereum أو BNB Chain لـ USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (المستوى القياسي) من رسوم المنصة التي يدفعها المضيفون والمستأجرون الذين تحيلهم، على كل تأجير؛ الرمز لا تنتهي صلاحيته أبدًا؛ يُدفع بعملة التأجير (CLORE أو BTC أو USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps رفعًا وتنزيلًا"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "وقت حوسبة GPU على جهازك."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "نعم. يشغّل المستأجرون حاويات Docker الخاصة بهم على جهازك، وتخرج حركة مرورهم من اتصالك؛ وتُعاد توجيه منافذ SSH والتطبيقات إلى الإنترنت."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "تغطي سياسة الخصوصية لدى Clore بيانات الحساب وعنوان IP الخاص بك مع موقع تقريبي؛ ووثائق الهوية فقط إذا طلبت Clore التحقق من الهوية (KYC)."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "يجب أن تكون المنافذ الواردة قابلة للوصول من الإنترنت (22 و8080 و3000-4000 افتراضيًا)، وتعمل أحمال عمل الغرباء على خطك. ويذكر دليل الشبكة الخاص بـ Clore نفسها أن بعض مزوّدي الإنترنت يحظرون الاستضافة."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "سن 18 عامًا أو أكثر، وألا تكون في دولة خاضعة للعقوبات. قد تعلّق Clore أي حساب أو تغلقه وفق تقديرها المطلق، وقد يكلّفك الاستخدام المحظور أموالك."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "لا تذكر الشروط ولا سياسة الخصوصية اسم أي كيان قانوني، وتترك الشروط تحديد الولاية القضائية الحاكمة لنسخة لاحقة."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "قد تعلّق Clore أي حساب أو تغلقه وفق تقديرها المطلق، وقد يؤدي الاستخدام المحظور إلى مصادرة الأموال."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "الدفعات بالعملات المشفرة فقط (CLORE أو BTC أو USDT أو USDC)، وتأخذ Clore نسبة إضافية قدرها 15% من التأجير الذي يدفعه المستأجر بـ BTC أو USDT أو USDC، ما لم يُقفل المضيف CLORE لخفضها."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "لا يُدفع للمضيف إلا عن الدقائق المؤجَّرة، والرقم الذي تذكره Clore لبطاقة RTX 4090 هو سقف (\"up to ~$490/month\") لبطاقة واحدة."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "لا يحتاج الاستخدام الأساسي إلى KYC، لكن قد تطلب Clore التحقق من الهوية لعمليات السحب الكبيرة أو في حالات الامتثال."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "يشغّل المستأجرون أي صورة حاوية Docker عامة على جهازك. تسرد الشروط الاستخدامات المحظورة (البرمجيات الخبيثة وهجمات DDoS ومواد الاعتداء الجنسي على الأطفال وغيرها)، لكننا لم نجد أي وصف لكيفية التحقق من المستأجرين."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "لا يشغّل CashPilot خدمة Clore.ai: أنت تثبّت برنامج الاستضافة الخاص بـ Clore على جهاز GPU الخاص بك (Ubuntu 22.04 أو أحدث، أو HiveOS)، لذا لا يستطيع CashPilot نشره أو تحديثه نيابة عنك."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "تحتفظ Clore بنسبة 5% من التأجير عند الطلب (1.25% في الفوري) عندما يدفع المستأجر بـ CLORE، دون رسوم إضافية."
  source: "699adf0a2179"
dawn.description:
  text: "تشغّل DAWN شبكة مدقِّقين تتحقق من عرض النطاق والتغطية للبنية التحتية للذكاء الاصطناعي الممولة عبر بروتوكول DAWN. تشارك إضافة المتصفح DAWN Validator في عمليات التحقق هذه من عرض النطاق والتغطية، وتكسب مكافآت DAWN أثناء تشغيلها. لا قيمة نقدية مستقرة لهذه المكافآت بعد. أنشئ الحساب في الإضافة وأدخل رمز الإحالة 2QLQV97F عندما يُطلب منك.\n"
  source: "bea38e2849d6"
dawn.short_description:
