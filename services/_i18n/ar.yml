xmrig.earnings.notes:
  text: "تقدير إجمالي قبل احتساب الكهرباء. في 2026-11-25 كانت قيمة 1 kH/s نحو $1 شهريًا بسعر XMR وصعوبة الشبكة الملحوظين. قد يستهلك معالج حاسوب مكتبي يعمل بنصف خيوطه 30 إلى 50 W إضافية. تحقّق من استهلاكك الفعلي وسعر الكهرباء لترى إن كان التعدين مجديًا."
  source: "917ca0ef4712"
