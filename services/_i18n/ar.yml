storj.docker.env.ADDRESS.description:
  text: "اسم مضيف DDNS مع المنفذ (مثلًا mynode.ddns.net:28967) -- وهو مفضَّل بشدة على عنوان IP حرفي، الذي يعزل العقدة يوم يغيّره مزوّد الإنترنت دون إعلام. يجب إعادة توجيه المنفذ 28967 (TCP+UDP)"
  source: "408df4211220"
