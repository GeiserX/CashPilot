  source: "278541f81053"
repocket.description:
  text: "يتيح لك Repocket كسب دخل سلبي بمشاركة عرض النطاق غير المستخدم في اتصالك بالإنترنت. عناوين IP المنزلية تكسب أكثر؛ وتُقبل عناوين IP لخوادم VPS ومراكز البيانات بأسعار أقل. الحد الأقصى 5 أجهزة و5 جلسات نشطة لكل حساب. تصادق حاوية Docker باستخدام البريد الإلكتروني لحسابك ومفتاح API من لوحة تحكم Repocket (وليس كلمة المرور).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "مشاركة عرض النطاق - 5 أجهزة كحد أقصى، مصادقة بمفتاح API"
  source: "5851a7eb5769"
