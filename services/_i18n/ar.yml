honeygain.rating.cons.0.text:
  text: "تسمح الشروط لـ Honeygain بشطب الأرباح التي بلغت حد $20 ولم تُدفع خلال 24 شهرًا، وبعدّ الأرباح منتهية الصلاحية بعد ستة أشهر دون استخدام."
