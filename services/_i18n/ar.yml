  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "كانت مكافآت المورّدين تُدفع من إصدار الرموز بغض النظر عن المهام المدفوعة، ويذكر مالكو وحدات GPU أنها تبقى خاملة معظم الوقت."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "المكافآت برمز IO، وتغيّر نموذج الدفع في 2026 إلى محرك مربوط بالدولار."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "في أبريل 2024 حاولت نحو 1.8 مليون وحدة GPU مزيفة الانضمام عبر رمز مصادقة مسرَّب، ثم تنحّى الرئيس التنفيذي لاحقًا قبل إطلاق الرمز."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "لا يشغّل CashPilot خدمة io.net: أنت تستخدم برنامج العامل الخاص بالمزوّد، لذا لا يستطيع CashPilot نشره أو تحديثه نيابة عنك. لم تُراجَع شروطه بشأن الحاويات."
  source: "1cac289c99ad"
iproyal.description:
  text: "يتيح لك IPRoyal Pawns الكسب بمشاركة عرض النطاق غير المستخدم. IPRoyal مزوّد بروكسي راسخ، وPawns هو ذراعه لمشاركة عرض النطاق المنزلي. تقبل صورة حاوية Docker الخاصة بسطر الأوامر بيانات الاعتماد عبر خيارات سطر الأوامر. يحصل المستخدم الجديد الذي يسجّل عبر رابط إحالة على $1 في كل دفعة من دفعاته الثلاث الأولى، بحد أقصى $3. يجب أن تتم كل دفعة ضمن نافذة زمنية من أسبوع إلى ثلاثة أسابيع، تُحدَّد حسب الموقع. تبدأ النافذة عند التسجيل وتبدأ من جديد بعد كل دفعة. إذا أُغلقت النافذة أولًا، تضيع المكافآت المتبقية.\n"
  source: "b12878d5917a"
