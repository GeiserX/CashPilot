helium.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "ألغى HIP 149 مكافآت Proof-of-Coverage في 6 يوليو 2026؛ ولا تكسب نقاط اتصال IoT الآن إلا مقابل البيانات التي تنقلها، وأكثر من 114,000 منها لم تنقل أي بيانات."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "تغيّر نموذج المكافآت في Helium بالتصويت عدة مرات، وتنحّى رئيسها التنفيذي، وانخفض HNT بنحو 96%."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
