  text: "يرى Pawns جهازًا آخر نشطًا على عنوان IP هذا، ولا يدفع إلا لجهاز واحد لكل عنوان IP، لذا تعمل هذه النسخة لكنها لا تشارك شيئًا ولا تكسب شيئًا. أوقف أي تطبيق Pawns آخر على عنوان IP هذا، سواء على جهاز آخر أو حاسوب أو هاتف. وإن لم يوجد أي تطبيق آخر، فانتظر حتى يُسقط Pawns الجهاز القديم، أو اطلب من دعم Pawns تحريره."
