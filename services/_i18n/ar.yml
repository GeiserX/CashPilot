  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "عنوان URL للوحة تحكم العقدة على المنفذ 14002، مع عنوان IP المحلي (LAN) للخادم بدلًا من localhost، مثلًا <b>http://192.168.1.10:14002</b>. لعدة عقد، اذكر عناوين URL الخاصة بها مفصولة بفواصل: يجمعها CashPilot."
  source: "e582f1e74baa"
