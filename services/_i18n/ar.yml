vast-ai.rating.cons.0.text:
  text: "لا يكسب المضيف إلا أثناء التأجير، وتعتمد الأرقام التي تذكرها Vast نفسها لوحدة GPU استهلاكية على نوع التأجير ودرجة الموثوقية."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "لا يشغّل CashPilot خدمة Vast.ai: أنت تثبّت برنامج الاستضافة الخاص بـ Vast على جهاز GPU الخاص بك، لذا لا يستطيع CashPilot نشره أو تحديثه نيابة عنك. تبني Vast الاستضافة على Docker في جهاز مضيف يعمل بنظام Linux."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "تقول Vast إن السعر الذي يحدده المضيف هو السعر الذي يتقاضاه، دون خصم أي رسوم."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "تُدفع الدفعات عبر Wise أو PayPal أو Stripe بدءًا من حد أدنى قدره $20، بفواتير أسبوعية؛ ويُرحَّل الرصيد الأصغر إلى الأسبوع التالي."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter منصة لمشاركة عرض النطاق متاحة على Windows وMac وLinux وAndroid. تدّعي أنها تدفع حتى $1/GB من عرض النطاق المشترك، بحد أدنى للدفع قدره $20. تعمل المنصة بطريقة مشابهة لتطبيقات مشاركة عرض النطاق التقليدية، إذ توجّه حركة مرور مشروعة عبر الاتصالات المنزلية.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "مشاركة عرض النطاق - تدّعي حتى $1/GB، الحد الأدنى للدفع $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "تدّعي حتى $1/GB لكن الأرباح الفعلية أقل. الحد الأدنى للدفع $20. تختلف الأرباح كثيرًا حسب الموقع والطلب."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
wipter.cashout.notes:
  text: "ليس لدى Wipter لوحة تحكم على الويب. افتح تطبيق Wipter لسطح المكتب أو الهاتف، وسجّل الدخول، واطلب الدفعة من هناك بمجرد أن يبلغ الرصيد $20. لا تدفع Wipter إلا بعملة USDT على BNB Smart Chain (BEP20)، إلى المحفظة التي تضبطها في قسم Payments في التطبيق؛ ولا يوجد خيار PayPal."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% من أرباح حركة المرور الخاصة بهم بمجرد بلوغهم الحد الأدنى للدفع، لأي عدد من الأصدقاء تحيلهم"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "مكافأة تسجيل بقيمة $5"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "لا يشغّل CashPilot خدمة Wipter: أنت تستخدم تطبيق سطح المكتب أو الهاتف الخاص بالمزوّد، لذا لا يستطيع CashPilot نشره أو تحديثه نيابة عنك. لم تُراجَع شروطه بشأن الحاويات."
  source: "fa32942c6b4f"
xmrig.description:
  text: "عدّن Monero باستخدام CPU. يشغّل CashPilot برنامج XMRig، ويدفع المجمّع الذي تختاره عملة Monero إلى عنوان الدفع العام الخاص بك. يستخدم XMRig نسبة 1% من وقت التجزئة لدعم مطوّريه. قد تكلّف الكهرباء أكثر من XMR التي تكسبها."
  source: "a578c826aa2d"
xmrig.short_description:
