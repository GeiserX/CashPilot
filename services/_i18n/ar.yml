storj.cashout.notes:
  text: "يُدفع شهريًا بعملة USDC على شبكة Ethereum الرئيسية بمجرد أن يبلغ رصيد المحفظة أربعة أضعاف رسوم المعاملة الحالية على الأقل؛ وتُرحَّل الأرصدة الأصغر إلى الشهر التالي. برمز STORJ حتى دفعة سبتمبر 2026. لوحة التحكم على المنفذ 14002."
  source: "6208f04947d2"
storj.payout.notes:
