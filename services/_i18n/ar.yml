proxybase-xyz.cashout.notes:
  text: "اقفل الأرباح عبر <code>proxybase-cli seller payout create</code>، وتُستلم بعملة USDC على Tempo Chain (Tempo MPP). يدفع إلى أي عنوان EVM تملك مفتاحه (Tempo سلسلة EVM)، دون الحاجة إلى توقيع أي شيء؛ أضف شبكة Tempo إلى المحفظة لرؤية USDC. المحفظة التي لا تزال لا تعرضها تحتاج إلى إضافة رمز USDC على Tempo يدويًا: استورده بعنوان العقد الذي تقدّمه Proxybase، وتحقّق من ذلك العنوان قبل أن تثق بالرصيد."
