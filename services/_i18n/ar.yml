bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "سجّل الدخول في <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>، واضغط F12 ← Application ← وسّع <b>Cookies</b> في الشريط الجانبي الأيسر ← انقر العنصر الفرعي <code>https://dash.bytelixir.com</code> ← في قائمة ملفات تعريف الارتباط على اليمين، ابحث عن <code>bytelixir_session</code> ← انسخ قيمته Value (رمز JWT طويل يبدأ بـ eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "في المكان نفسه (Cookies ← <code>https://dash.bytelixir.com</code>) ← ابحث عن ملف تعريف الارتباط المسمى <code>remember_web_...</code> ← انسخ قيمته Value (اختياري، يطيل عمر الجلسة)"
