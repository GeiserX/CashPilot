  source: "71bbe07a51d1"
storj.docker.setup:
  text: "قبل أول تشغيل، هيّئ إعدادات عقدة التخزين: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "هوية العقدة. معرّفها مرتبط بإثبات العمل (proof-of-work) ويستغرق إنشاؤه من جديد ساعات، ولا يمكن إعادة إنشائه من نسخة احتياطية لأي شيء آخر. فقدانها يؤدي إلى خسارة رصيد الدفع المحتجز."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "بيانات العملاء المخزنة والمبلغ المحتجز للعقدة. فقدانها يؤدي إلى استبعاد العقدة وخسارة الرصيد المحتجز."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "لا تستطيع شبكة Storj الاتصال بعقدتك على العنوان ADDRESS المعلَن، لذا تعدّها الأقمار (satellites) غير متصلة: يتوقف وصول بيانات جديدة، ويتعطل دخل حركة البيانات الصادرة، ويؤدي الانقطاع المستمر إلى التعليق. تحقّق من أن ADDRESS يطابق عنوان IP العام الحالي (استخدم اسم مضيف DDNS، وليس عنوان IP حرفيًا، حتى لا يعزل تغيير مزوّد الإنترنت للعنوان العقدة)، ومن أن المنفذ 28967 TCP+UDP مُعاد توجيهه إلى هذا الجهاز."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB مخزَّن + $1/TB صادر + $1/TB للتدقيق/الإصلاح منذ 1 سبتمبر 2026. تزداد الأرباح مع كمية البيانات المخزنة وعمر العقدة. خلال الأشهر التسعة الأولى يُحتجز 75% ثم 50% ثم 25% من الأرباح؛ ويعود نصف المبلغ المحتجز في الشهر 16 والباقي عند الخروج المنظَّم. يجب إعادة توجيه المنفذ 28967."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4 أضعاف رسوم معاملة Ethereum، وتُرحَّل الأرصدة الأصغر"
  source: "29ecc25530cd"
