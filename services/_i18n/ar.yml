salad.obligations.earn-within-12-months.how:
  text: "شغّل تطبيق Salad حتى يكسب، أو أنفق الرصيد كاملًا في Salad Storefront. إنفاق جزء منه فقط لا يعيد احتساب مدة الـ 12 شهرًا."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "لا يشغّل CashPilot خدمة Salad: أنت تستخدم تطبيق سطح المكتب الخاص بالمزوّد، لذا لا يستطيع CashPilot نشره أو تحديثه نيابة عنك. لم تُراجَع شروطه بشأن الحاويات."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "يذكر عدة مراجعين على Trustpilot في أكتوبر ونوفمبر 2026 أن عمليات السحب عبر PayPal وصلت بسرعة، وبعضها أكثر من مرة؛ ويقول مراجع واحد في الفترة نفسها إن محاولات السحب المتكررة فشلت."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel سلسلة بلوك تشين من الطبقة الأولى (Layer 1) على Cosmos لشبكات VPN اللامركزية. يبيع مشغّلو العقد عرض النطاق لمستخدمي VPN بتسعير مرن (لكل GB أو بالساعة). يتوفر دليل رسمي للنشر عبر Docker. مشروع قديم ذو مجتمع نشط.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "VPN لامركزي على Cosmos - مشغّلو العقد يبيعون عرض النطاق"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "يحدد المشغّلون أسعارهم بأنفسهم لكل GB أو بالساعة. تعتمد الأرباح على طلب مستخدمي VPN في منطقتك."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "لكل جلسة"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
