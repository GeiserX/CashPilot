herominers-kas.description:
  text: "تتبّع رصيد Kaspa غير المدفوع الذي يحتفظ به HeroMiners لعنوان الدفع العام الخاص بك. شغّل برنامج تعدين Kaspa الخاص بك ووجّهه إلى المجمّع. يقرأ CashPilot رصيد المجمّع ويطلب منك تأكيد الدفعات عندما ينخفض الرصيد.\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
