  source: "b1ba1636070f"
earnapp.description:
  text: "يتيح لك EarnApp من Bright Data بيع عرض النطاق غير المستخدم مقابل دخل سلبي. Bright Data أكبر شبكة بروكسي في العالم، وتشغّل جمع البيانات لشركات Fortune 500. يشغّله CashPilot من صورة حاوية خاصة به، تنزّل إصدار EarnApp المثبَّت من شبكة CDN التابعة لـ Bright Data عند أول تشغيل، وتتحقق من sha256 الخاص به، وتشغّله في الوضع الخفيف (lite) بمعرّف UUID فقط.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "مشاركة عرض النطاق - مدعوم من Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "معرّف UUID للعقدة"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "معرّف عقدة EarnApp الخاصة بك: sdk-node- متبوعًا بـ 32 حرفًا ست عشريًا صغيرًا، كما يطبعه الأمر 'earnapp showid'. بعد النشر، اربطه مرة واحدة بفتح https://earnapp.com/r/ متبوعًا بهذا UUID وأنت مسجّل الدخول في EarnApp؛ العقدة غير المربوطة تكسب، لكن لا يصل شيء إلى رصيدك"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "يفشل EarnApp مرارًا في الوصول إلى خوادمه ويعيد التشغيل، لذا يكسب القليل أو لا شيء. أعد تشغيل هذه النسخة؛ وإذا استمر ذلك، فتحقق من اتصال الإنترنت في هذا الجهاز."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "افتح هذا الرابط وأنت مسجّل الدخول في EarnApp لإضافة العقدة إلى حسابك. وإلى أن تفعل ذلك، تكسب العقدة لكن لا يصل شيء إلى رصيدك."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "يعتمد كثيرًا على الموقع. عناوين IP في الولايات المتحدة وأوروبا تكسب أكثر. تزداد الأرباح مع زيادة عرض النطاق المستهلك."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "عند الطلب (الاسترداد التلقائي متاح: PayPal بحد أدنى $10، وWise بحد أدنى $10، وAmazon بحد أدنى $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "فعّل الاسترداد التلقائي مرة واحدة، وسيدفع EarnApp من تلقاء نفسه كلما بلغ الرصيد الحد الأدنى لطريقة الدفع: PayPal $10، وWise $10، وAmazon $50. تصل دفعات PayPal من Bright Data Ltd. في أكتوبر 2026 وصلت دفعة PayPal أقل بنحو 2% من الرصيد المسترد."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "يحتفظ EarnApp بالرصيد؛ ويُسترد عبر Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "سجّل الدخول في <a href='https://earnapp.com' target='_blank'>earnapp.com</a>، واضغط F12 ← Application ← Cookies، وانسخ قيمة <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% من أرباحهم مدى الحياة، تُدفع إضافةً إلى أرباحهم"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "يذكر مركز المساعدة في EarnApp أن تثبيته في حاويات Docker أو الأجهزة الافتراضية أو خدمات الاستضافة أو الخوادم المنزلية محظور تمامًا، وهذه هي الطريقة التي يشغّله بها CashPilot."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "ويذكر مقال المساعدة نفسه أن الحساب الذي يُكتشف أنه يعمل بهذه الطريقة يُنهى دون إشعار وتُلغى دفعاته المعلّقة."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "وصلت دفعتنا عبر PayPal في أكتوبر 2026، أقل بنحو 2% من الرصيد المسترد."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "حد أدنى قدره $10 لـ PayPal وWise، مع استرداد تلقائي يدفع من تلقاء نفسه."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "ينتمي EarnApp إلى Bright Data، وتصل دفعاته عبر PayPal من Bright Data Ltd.، وهي شركة معروفة بالاسم."
  source: "ead3e8e87bba"
earnfm.description:
  text: "يدفع لك Earn.fm مقابل مشاركة عرض النطاق في اتصالك بالإنترنت. يستخدم مُجمِّع الأرباح المصادقة بالبريد الإلكتروني وكلمة المرور عبر Supabase. صورة حاوية Docker خفيفة ونشر مباشر (يستخدم عميل Docker رمز UUID منفصلًا).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
