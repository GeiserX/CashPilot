proxybase-xyz.description:
  text: "ProxyBase Markets سوق لبروكسي SOCKS5 مصمَّم لوكلاء الذكاء الاصطناعي. يشغّل البائعون برنامجًا خفيًا (daemon) خفيفًا بسطر الأوامر مكتوبًا بلغة Rust يتصل عبر WebSocket لترحيل حركة مرور المشترين عبر اتصالهم بالإنترنت، ويكسبون USDC على Tempo Chain عن كل GB يُباع. يدعم الوضعين المباشر (عرض النطاق الخاص بك) والمنبع (إعادة بيع بروكسيات خارجية) مع إعادة الاتصال التلقائي. يشتري المشترون جلسات البروكسي حسب البلد ومزوّد الإنترنت وعرض النطاق. تمر الدفعات عبر Machine Payments Protocol (MPP) على Tempo Chain. رابط الإحالة مخصص للمشترين: المشتري الذي يفتح لوحة التحكم عبره يحصل على 10% إضافية على أول إيداع له.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - سوق SOCKS5 لوكلاء الذكاء الاصطناعي، دفع بـ USDC. يُنشئ محفظة تحمل وحدة تخزينها النسخة الوحيدة من المفتاح"
  source: "818327893d5b"
