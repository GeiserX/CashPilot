  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "تذكر سياسة الخصوصية في Golem اسم المشغّل، Golem Factory GmbH في Zug، سويسرا."
  source: "bae79b651923"
grass.description:
  text: "Grass شبكة لامركزية تتيح لك بيع عرض النطاق غير المستخدم لبيانات تدريب الذكاء الاصطناعي. تعمل كإضافة متصفح وتطبيق سطح مكتب، وتوجّه طلبات جمع بيانات الويب عبر اتصالك لبناء مجموعات بيانات منظمة. بأكثر من 8.5M مستخدم، تُعد من أكبر شبكات DePIN لعرض النطاق. تكسب رموز GRASS على سلسلة Solana.\n"
  source: "046951d812f9"
grass.short_description:
  text: "مشاركة عرض النطاق ضمن DePIN لبيانات الذكاء الاصطناعي - تكسب رموز GRASS"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "رمز الوصول"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "سجّل الدخول في <a href=\"https://app.grass.io\">app.grass.io</a>، واضغط F12 ← Application ← Local Storage ← انقر <code>https://app.grass.io</code> ← انسخ قيمة <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "تكسب نقاط Grass Points القابلة للتحويل إلى رموز GRASS عبر التوزيعات المجانية (airdrops). القيمة الفعلية بالدولار تعتمد على سعر الرمز. يلزم إضافة المتصفح أو تطبيق سطح المكتب."
  source: "da61137319f8"
grass.payment.frequency:
  text: "توزيع مجاني (airdrop) حسب الحقبة"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "تأتي المكافآت كتوزيعات دورية يُطالب بها في لوحة تحكم Grass. يُدفع توزيع Stage 2 (النشاط من أكتوبر 2024 إلى يونيو 2026) بعملة USDC: طالب به على app.grass.io/dashboard في موعد أقصاه 22 يناير 2027، أو قبل ذلك إذا طولب بكل الحصص أولًا. تحتفظ Grass بالمكافآت التي لم يُطالب بها."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "تتراكم نقاط (POINTS)؛ ويُطالب بـ GRASS من لوحة تحكم Grass خلال التوزيعات المجانية الدورية."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "سجّل الدخول في <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>، واضغط F12 ← Application ← Local Storage، وانسخ قيمة <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% من نقاط مدة التشغيل للإحالات المباشرة، و10% في المستوى الثاني، و5% في المستوى الثالث"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "طالب بـ USDC الخاصة بك من Grass Stage 2"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "تحتفظ Grass بكل حصة من Stage 2 لم يُطالب بها في موعد أقصاه 22 يناير 2027، وقد تُغلق النافذة قبل ذلك بمجرد المطالبة بكل الحصص."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "سجّل الدخول في app.grass.io بالحساب الذي استخدمته في Stage 2، وفعّل Grass Wallet، وافتح علامة التبويب Allocation وأكّد. طالب فقط على app.grass.io. ليس لديك نقاط من Stage 2؟ اختر «لا يعنيني»."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "لا تأتي المكافآت إلا عبر مواسم التوزيع المجاني. أفاد مشغّلو عقد قدامى بأن تقديرات الموسم 2 تراوحت بين بضعة دولارات وعشرات قليلة من الدولارات."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "مكافآت الموسم 2 التي لا يُطالب بها في موعد أقصاه 22 يناير 2027 تضيع نهائيًا."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "أثار التوزيع المجاني الأول موجة انتقادات بسبب صغر المكافآت لكل نقطة، إذ توزعت على أكثر من مليوني مستخدم."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "لا يشغّل CashPilot خدمة Grass: أنت تستخدم تطبيق المزوّد أو إضافته، لذا لا يستطيع CashPilot نشرها أو تحديثها نيابة عنك. لم تُراجَع شروطها بشأن الحاويات."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "وصل التوزيع المجاني الأول إلى ما يقرب من 1.5 مليون عنوان طالب بحصته."
  source: "a4c55e10affa"
helium.description:
  text: "Helium شبكة لاسلكية لامركزية راسخة. بدأت بنقاط اتصال LoRaWAN، وتوسعت الآن إلى 5G. تتطلب عتادًا مخصصًا ($500+). تكسب رموز HNT/MOBILE. انخفض العائد على الاستثمار كثيرًا - عادةً $4-8 شهريًا.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "شبكة لاسلكية لامركزية - تتطلب عتادًا، رموز HNT"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "تتطلب شراء عتاد بقيمة $500+. انخفض العائد على الاستثمار كثيرًا. توجد عملية موافقة للمشغّلين الجدد."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "حسب الحقبة (epoch)"
