repocket.obligations.avoid-12-month-dormancy.loss:
  text: "بعد 12 شهرًا دون تسجيل دخول أو دفعة أو مشاركة لعرض النطاق، قد يصادر Repocket الرصيد غير المدفوع."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "أبقِ جهازًا يشارك، أو سجّل الدخول، أو اسحب الرصيد. إذا توقفت عن استخدام Repocket، فاسحب أولًا."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "يذكر عدة مراجعين على Trustpilot دفعات أُلغيت وأرصدة أُعيدت إلى الصفر؛ ويقول أحدهم إن الدعم برّر ذلك بأرباح عرض نطاق غير منتظمة. تقيّم الصفحة Repocket بـ 2.7 وتشير إلى أنها لم ترد على المراجعات السلبية."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "يذكر المراجعون رفض عمليات سحب واضطرارهم إلى ملاحقة الدفع."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "تسمح سياسة الدفع في Repocket بعكس الأرباح أو إلغائها أو مصادرتها نهائيًا كلما اشتبهت في أنها غير صالحة، وبمصادرة الأرباح غير المدفوعة للحساب الخامل."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "تسمح السياسة نفسها لـ Repocket بإضافة طرق الدفع أو إزالتها أو استبدالها في أي وقت دون إشعار؛ وقد أُزيل PayPal."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "تذكر الشروط أن Repocket قد تطلب التحقق من الهوية أو الحساب في أي وقت، وأن أهلية الدفع تعتمد على ذلك."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "تذكر الشروط أن Repocket وشركاءها يستخدمون سعة الشبكة، لكنها لا تذكر من هم الشركاء أو كيف يُتحقق منهم."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "يشير Trustpilot إلى أن Repocket لم ترد على المراجعات السلبية، ويقول المراجعون إن رسائلهم تُتجاهل."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "تذكر الشروط الحالية اسم Repocket Pte. Ltd. في سنغافورة؛ ولم تذكر الشروط القديمة أي شركة."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "تنشر Repocket صورة حاوية Docker خاصة بها، repocket/repocket، وتسمح شروطها بالحاويات التي تملكها."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "الحد الأدنى منخفض: $4 قبل الدفعة الأولى و$2 بعدها."
  source: "ff8121a15aeb"
salad.description:
  text: "يتيح لك Salad.io مشاركة وحدة GPU لأحمال عمل الذكاء الاصطناعي الموزعة، وكسب رصيد Salad القابل للاسترداد ببطاقات هدايا أو ألعاب أو نقدًا. لنظام Windows فقط عبر تطبيق سطح مكتب أصلي. يتطلب وحدة GPU مخصصة (NVIDIA أو AMD). توجّه المنصة مهام الاستدلال بالذكاء الاصطناعي وعرض الرسوميات ومهام الحوسبة الأخرى إلى جهازك عندما يكون خاملًا. من أسهل منصات مشاركة GPU استخدامًا.\n"
  source: "09335baccea6"
salad.short_description:
  text: "مشاركة GPU للذكاء الاصطناعي - Windows فقط، الدفع ببطاقات هدايا أو نقدًا"
  source: "4665796e0965"
salad.earnings.notes:
  text: "تعتمد الأرباح على طراز GPU وتوفر العمل. بطاقة RTX 3060 نحو $1-3 يوميًا. Windows فقط. تطبيق أصلي، دون دعم Docker. قابل للاسترداد ببطاقات هدايا أو ألعاب أو عبر PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal أو بطاقات هدايا عبر متجر Salad."
  source: "5128232e4f57"
salad.payout.notes:
  text: "PayPal وبطاقات الهدايا فقط، ولا عملات مشفرة أبدًا. لا يوجد عنوان محفظة، لذا لا يملك CashPilot رصيدًا على السلسلة لعرضه."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "سجّل الدخول في <a href='https://app.salad.io' target='_blank'>app.salad.io</a>، واضغط F12 ← Application ← Cookies، وانسخ قيمة ملف تعريف الارتباط <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
