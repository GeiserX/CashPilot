honeygain.cashout.notes:
  text: "الحد الأدنى $20 (20,000 رصيد). خياران: PayPal عبر Tipalti، برسوم نحو 15%، أو أرصدة JumpTask دون رسوم، تُدفع إلى محفظة JumpTask. يحتاج الطلب إلى رمز من 6 أرقام يُرسل بالبريد الإلكتروني. تبقى أول دفعة عبر PayPal في حالة \"waiting for details\" حتى تسجّل في Tipalti من الرابط الذي يرسلونه بالبريد الإلكتروني. لا يعمل هذا الرابط إلا مرة واحدة، لذا افتحه عندما تستطيع الإنهاء في جلسة واحدة وهاتفك في متناول يدك: بعد تعيين كلمة مرور، يطلب منك Tipalti تأكيد رقم هاتف محمول عبر SMS (تنتهي صلاحية الرموز خلال دقائق)، ثم يطلب اسمك وعنوانك وبلدك وتاريخ ميلادك وعنوان PayPal الخاص بك. يفرض Tipalti رسومًا قدرها $2.02 على كل دفعة؛ اختر USD لتجنّب رسوم تحويل العملة البالغة 1.9-3%. تصل الدفعة خلال يومي عمل. يُخصم الرصيد من حسابك فور طلبك، حتى وإن كانت الدفعة تنتظر Tipalti. يرسل كل تسجيل دخول لاحق إلى Tipalti رمز SMS جديدًا ما لم تحدد خيار تذكّر الجهاز لمدة 30 يومًا. في أكتوبر 2026 لم يطلب Tipalti نموذجًا ضريبيًا من مستفيد في إسبانيا."
  source: "553463d96535"
