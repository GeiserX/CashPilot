  text: "في المكان نفسه ← ابحث عن <code>XSRF-TOKEN</code> ← انسخ قيمته Value (اختياري)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "تختلف الأرباح حسب الموقع ($2-50 شهريًا). لا توجد صورة حاوية Docker. يلزم تطبيق سطح المكتب أو تطبيق Android."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "بالعملات المشفرة فقط. يعتمد الحد الأدنى على العملة: USDT $5، وUSDC $5، وTON $8، وLTC $10، وETH $40، وBTC $250. تكتب العنوان في كل طلب. تُعالج الطلبات في ساعات العمل، خلال 24 ساعة."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "يحتفظ Bytelixir بالرصيد؛ ويُكتب عنوان المحفظة في كل طلب دفع، ولا يُحفظ أبدًا في الحاوية."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "سجّل الدخول في <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>مع تحديد Remember Me</b>، واضغط F12 ← Application ← وسّع <b>Cookies</b> في الشريط الجانبي الأيسر ← انقر <code>https://dash.bytelixir.com</code>، ثم انسخ ثلاث قيم: <b>bytelixir_session</b> و<b>remember_web_…</b> (الطويل الذي يبدأ بهذه البادئة) و<b>XSRF-TOKEN</b>. تنتهي صلاحية ملف تعريف الجلسة وحده بعد نحو ساعتين من نسخه، فيتوقف الجمع بعد ظهر اليوم نفسه؛ أما ملف remember_web فيدوم سنة، وهو ما يُبقي الجمع يعمل."
