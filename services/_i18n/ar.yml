2miners-etc.description:
  text: "تتبّع رصيد Ethereum Classic غير المدفوع الذي يحتفظ به 2Miners لعنوان الدفع العام الخاص بك بعملة ETC. شغّل برنامج التعدين الخاص بك ووجّهه إلى المجمّع. يقرأ CashPilot الرصيد ويطلب منك تأكيد الدفعات عندما ينخفض الرصيد.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "مجمّع تعدين Ethereum Classic، يُتتبَّع عبر عنوان الدفع الخاص بك"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (قابل للتعديل)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "يتحقق المجمّع من حدّ الدفع الخاص بك كل ساعتين"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "يدفع 2Miners إلى عنوانك تلقائيًا بمجرد وصولك إلى الحد الذي اخترته. أدنى حد لدفعات ETC هو 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "يتراكم الرصيد غير المدفوع لدى 2Miners. أما رصيد المحفظة فهو قراءة منفصلة من شبكة Ethereum Classic. تحقّق من المبلغ الذي وصل إلى محفظتك قبل تأكيد أي دفعة في CashPilot.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "أدخل عنوان الدفع العام لـ Ethereum Classic الذي يستخدمه برنامج التعدين على 2Miners، ويبدأ بـ <b>0x</b>. لا تضف أي اسم للعامل.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "يحتاج إلى برنامج تعدين ETCHash موجَّه إلى 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "الحوسبة"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "لا. يرسل برنامج التعدين أعمال التعدين إلى المجمّع."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "يستخدم المجمّع عنوان الدفع الخاص بك وأسماء العمّال التي تختارها وعنوان IP لجهاز التعدين."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "يمكن لأي شخص عرض الإحصاءات من خلال عنوان الدفع. يطلب المجمّع تأكيد عنوان IP للعامل لتغيير حدّ الدفع."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "يفرض المجمّع رسومًا بنسبة 1% ويحتجز الدفعات حتى تصل إلى الحد الذي اخترته."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (المعروف سابقًا باسم ATOR) شبكة خصوصية لامركزية تعتمد التوجيه البصلي (onion routing). يشغّل مشغّلو العقد عقد ترحيل ويكسبون رموز ANYONE مقابل عرض النطاق الذي يقدّمونه. يمكن وصفه بأنه «Tor مع حوافز». يشغّله CashPilot من صورة حاوية خاصة به، مبنية من حزمة Debian الموقّعة للمشروع، لمعماريتي amd64 وarm64. يتم الإعداد عبر ملف anonrc يُربط داخل الحاوية (Nickname وContactInfo وORPort وغيرها). لا تكسب عقدة الترحيل شيئًا حتى يُقفَل لها 100 ANYONE لمدة 180 يومًا على الأقل، وتتم المطالبة بالمكافآت بالتوقيع في محفظتك. كما تُدرج عقدة الترحيل عنوان IP العام الخاص بك في دليل عقد الترحيل في الشبكة، ما قد يضرّ بسمعة عنوان IP التي تدفع مقابلها تطبيقات عرض النطاق المنزلية.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "توجيه بصلي لامركزي - عقد ترحيل Tor مع حوافز"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "مفتاح هوية ed25519 لعقدة الترحيل. حذفه يُنهي سمعة عقدة الترحيل ويُعيد سجل أرباحها إلى الصفر."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "لا يدفع إلا إذا أُقفل 100 ANYONE لكل عقدة ترحيل لمدة 180 يومًا على الأقل ووُقّعت مطالبة بالمكافأة في محفظتك. من دون هذا الرهن لا تكسب عقدة الترحيل شيئًا. ومعه تعتمد الأرباح على عرض النطاق المقدَّم ومدة التشغيل."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "حسب الحقبة (epoch)"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "يُضبط في ContactInfo داخل anonrc، مسبوقًا بـ '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "بصمات عقد الترحيل مفصولة بفواصل. هذه القيمة غير موجودة في أي لوحة تحكم على الويب: شغّل <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> على الجهاز المضيف الذي يشغّل عقدة الترحيل.\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "عرض النطاق، بصفته عقدة ترحيل في شبكة Anyone (نسخة متفرعة من Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "نعم. تنقل حركة مرور أشخاص آخرين. ويعتمد كون عنوان IP الخاص بك هو المحطة الأخيرة على ما إذا كانت عقدة الترحيل مُعدّة كعقدة خروج."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "مفتاح الهوية العام لعقدة الترحيل وعنوان IP والمنفذ الخاصّان بك وإحصاءات مدة التشغيل، وكلها تُنشر في دليل الشبكة عن قصد. إذا ضبطت ContactInfo في ملف anonrc فإنه يُنشر هناك أيضًا ويُفهرس علنًا وبشكل دائم — وغالبًا ما يكون عنوان بريد إلكتروني، لذا اتركه فارغًا إلا إذا أردته علنيًا."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "حقيقي. تُنسب حركة مرور الترحيل إلى اتصالك. وتجذب عقد الخروج تحديدًا شكاوى إساءة الاستخدام؛ ويحظرها كثير من مزوّدي الإنترنت المنزلي."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "لا يوجد حساب للتسجيل فيه، لذا لا يوجد ما يُقيَّد لكل حساب. ومع ذلك تحتاج لكي تكسب إلى محفظة Ethereum فيها 100 ANYONE مقفلة لكل عقدة ترحيل لمدة 180 يومًا على الأقل، ويحتاج CashPilot إلى بصمات عقد الترحيل لقراءة المكافآت. لا ينشر المشروع حدًا لعدد عقد الترحيل لكل عنوان IP، ولا يعلن الكتالوج عن حد."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "لا تكسب عقدة الترحيل شيئًا ما لم يُقفَل لها 100 ANYONE لمدة 180 يومًا على الأقل، وتُوقَّع كل مطالبة بالمكافأة في محفظتك."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "تنقل حركة مرور أشخاص آخرين بحكم تصميمها، دون أي تحقق من هويتهم؛ وتجذب عقد الخروج شكاوى إساءة الاستخدام."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "تُنشر هوية عقدة الترحيل وعنوان IP ومدة التشغيل في دليل الشبكة، وأي ContactInfo تضبطه يصبح علنيًا إلى الأبد."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "لا يوجد حساب للتسجيل فيه. تحتاج عقدة الترحيل إلى محفظة فقط، دون أي تحقق من الهوية."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "برنامج الترحيل نسخة متفرعة منشورة من Tor، بموجب ترخيص Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "يبني CashPilot صورة الحاوية الخاصة به من برنامج الترحيل الذي نشره Anyone، ولا يحتاج إلى حساب."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping منصة لامركزية لمراقبة الشبكات تدفع لك مقابل تشغيل عقدة. تجري عقدتك مراقبة المواقع واختبارات زمن الاستجابة وفحوصات جودة الشبكة لصالح عملاء Bitping. تعمل على الاتصالات المنزلية واتصالات VPS على حد سواء. تسجّل صورة حاوية Docker الدخول باستخدام متغيري البيئة BITPING_EMAIL وBITPING_PASSWORD عند أول تشغيل (\"Attempting login with environment variables\" في سجلها)، ثم تحفظ الجلسة في وحدة التخزين المربوطة حتى لا تعيد عمليات إعادة التشغيل المصادقة.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "مشاركة عرض النطاق - مراقبة شبكات لامركزية، تعمل على VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "البريد الإلكتروني"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "كلمة المرور"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "البريد الإلكتروني لحسابك في Bitping (نفس بيانات الدخول إلى <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "كلمة مرور حسابك في Bitping. تُستخدم مرة واحدة لإنشاء جلسة العقدة، التي تُحفظ بعد ذلك في وحدة تخزين البيانات."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "تعتمد الأرباح على جودة الشبكة والطلب على المراقبة من موقعك. تُقبل عقد VPS."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
bitping.cashout.notes:
  text: "أرباح العقد موجودة على nodes.bitping.com؛ أما app.bitping.com فهي لوحة تحكم عملاء API. السحب بعملة SOL فقط: عندما يتجاوز الرصيد غير المدفوع $0.05، اكتب عنوان Solana في الطلب، ويُعالج خلال 24 ساعة. تحتاج محفظة Solana الجديدة أو الفارغة إلى نحو 0.001 SOL فيها أولًا، لتغطية الحد الأدنى للإيجار في الشبكة."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "بعملة Solana فقط حاليًا، ويُكتب العنوان وقت السحب بدلًا من حفظه."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "استخدم البريد الإلكتروني وكلمة المرور لحسابك في Bitping (نفس بيانات <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "اسحب رصيدك في Bitping"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "قد يصادر Bitping الأرباح التي تبقى دون مطالبة لأكثر من 12 شهرًا، بعد إشعار بالبريد الإلكتروني قبل 30 يومًا."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "اطلب سحبًا بعملة SOL على nodes.bitping.com واكتب عنوان Solana الخاص بك في الطلب."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "تُدفع عمليات السحب بعملة Solana (SOL)، إلى عنوان تكتبه في كل طلب."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "تذكر صفحة المساعدة في Bitping أن السحب إلى محفظة Solana جديدة وفارغة قد يفشل حتى تموّل تلك المحفظة بقليل من SOL بنفسك."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "تذكر صفحة المساعدة في Bitping أن الخوادم وحاويات Docker مدعومة."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "لا يحتاج السحب إلا إلى عنوان Solana يُكتب في الطلب."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit خدمة لمشاركة عرض النطاق تدفع عبر PayPal وStripe. لا توجد صورة حاوية Docker رسمية؛ تطبيق سطح المكتب لنظام Windows وتطبيق Android هما العميلان. الخدمة موجودة على bytebenefit.io -- فقد تُرك النطاق القديم bytebenefit.com وهو معروض الآن في سوق للنطاقات، ولهذا السبب وُسمت الخدمة هنا ذات مرة بأنها متوقفة.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "مشاركة عرض النطاق - دفعات عبر PayPal/Stripe، تطبيق سطح مكتب/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "لا توجد صورة حاوية Docker. تطبيقات سطح المكتب لنظام Windows وAndroid فقط."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% من أرباح حركة مرور الإحالات"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "مكافأة ترحيب بقيمة $1 (10,000 Coins)"
