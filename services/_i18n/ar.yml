  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "تُهيّئ الحاوية نفسها تلقائيًا عند أول تشغيل: تُنشئ محفظة secp256k1 (BIP-39)، وتصادق عبر تحدٍّ واستجابة ECDSA، وتبدأ بيع عرض النطاق في الوضع المباشر فقط. تُحفظ الحالة كلها (المحفظة ورمز الجلسة وإعدادات البائع) في وحدة التخزين <code>proxybase-data</code>. راجع سجلات الحاوية عند أول تشغيل لمعرفة عنوان المحفظة. استخدم <code>--upstream</code> لإضافة مسارات لإعادة بيع بروكسيات خارجية.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "ملف مفتاح المحفظة المُنشأة. وحدة التخزين هذه هي المال نفسه: لا توجد نسخة على الخادم، لذا فإن حذفها يُتلف الأموال معها."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "الأرباح حسب عدد GB المبيعة بأسعار السوق. عناوين IP لخوادم VPS ومراكز البيانات تكسب أقل من المنزلية. يمكن لوضع المنابع المتعددة الجمع بين عرض النطاق الخاص بك وبروكسيات خارجية."
