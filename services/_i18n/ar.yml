iproyal.cashout.notes:
  text: "الحد الأدنى $5. اختر بلدك أولًا؛ فطرق الدفع تعتمد عليه. من إسبانيا (أكتوبر 2026): PayPal بنسبة 4% وحد أدنى للرسوم قدره $0.25، ويُدفع عبر Tremendous، التي ترسل رابطًا بالبريد الإلكتروني تُدخل فيه اسمك وعنوان PayPal؛ وUSDT (BEP20 وERC20 وTRC20) أو USDC (BEP20 وERC20) برسوم شبكة قدرها $1؛ وBitcoin بحد أدنى للرسوم قدره $2؛ وبطاقات الهدايا دون رسوم. تحتاج الدفعة الأولى إلى تحقق لمرة واحدة من رقم هاتفك عبر SMS: يفتحه زر Withdraw، ويُدخل الرقم مع رمز البلد. بعد ذلك تطلب كل دفعة رمزًا يُرسل إلى البريد الإلكتروني لحسابك، وتُراجَع لمدة تصل إلى 72 ساعة قبل إرسالها."
