  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "يُبلغ هذا الجهاز عن اتصال استضافة. راجع شروط مزوّد الاستضافة قبل التعدين. بعض المزوّدين، ومنهم Hetzner Cloud، يحظرونه. تحقّق من تكاليف الكهرباء الفعلية قبل الاعتماد على أي تقدير للربح."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "رسوم برنامج التعدين البالغة 2% خاصة بـ pearlhash. ويحتفظ SRBMiner-Multi بنسبة 0.85% على progpow_zano وkawpow. يفرض HeroMiners، مجمّع Pearl الافتراضي، رسوم مجمّع بنسبة 1%. ويتحقق من الدفعات كل ساعة ويدفع بدءًا من 1 PRL. تحدد المجمّعات الأخرى أسعارها وحدودها بنفسها."
