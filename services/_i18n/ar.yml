  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "أُعيدت تسمية الرمز من SENT إلى DVPN في 2021، ومن DVPN إلى P2P في 2025."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "لا يشغّل CashPilot خدمة Sentinel: أنت تستخدم برنامج العقدة الخاص بالمزوّد، لذا لا يستطيع CashPilot نشره أو تحديثه نيابة عنك. لم تُراجَع شروطه بشأن الحاويات."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "تنشر Sentinel الشيفرة المصدرية لعقدتها بموجب ترخيص مفتوح المصدر خاص بها."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia سوق تخزين لامركزي تديره Sia Foundation (مؤسسة سويسرية غير ربحية) ويعمل منذ عام 2015. شغّل عقدة hostd الرسمية التابعة للمؤسسة لتأجير مساحة القرص الفائضة وكسب Siacoin من عقود التخزين وعرض النطاق. يجب أن تشتري بعض Siacoin قبل أن تتمكن العقدة من الكسب: يُقفل المضيفون ضمانًا مقابل كل عقد ويدفعون رسومًا عن كل إثبات تخزين. يعود الضمان عند اكتمال العقد، ويُحرق إذا انقطعت العقدة عن الاتصال أو فقدت البيانات، لذا تحتاج إلى جهاز يعمل دائمًا (تقول Sia إن مدة التشغيل يجب ألا تقل عن 95%). تعتمد الأرباح على كمية البيانات التي يخزنها المستأجرون فعلًا؛ وتوصي Sia بتسعير التخزين بـ $1 لكل TB شهريًا، لذا فهي تناسب الأجهزة ذات الأقراص الكبيرة الفائضة أكثر من خوادم VPS الصغيرة.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "عقدة تخزين من Sia Foundation - صورة حاوية Docker رسمية، اكسب Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "العبارة السرية للمحفظة"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "كلمة مرور لوحة التحكم"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "مجلد التخزين"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "عبارة سرية بمعيار BIP-39 تتحكم في محفظة Siacoin للمضيف. أنشئ واحدة بالأمر `docker run --rm ghcr.io/siafoundation/hostd seed` واحتفظ بنسخة احتياطية منها -- فهي الطريقة الوحيدة للوصول إلى الأرباح"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "كلمة المرور لواجهة الويب في hostd وواجهة API المحلية (BasicAuth). أي عبارة مرور طويلة"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "مسار على الجهاز المضيف في أكبر قرص لديك تُخزَّن فيه بيانات المستأجرين (مثلًا /srv/sia). يحتاج إلى 256GB فارغة على الأقل"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "عند النشر، يُنشئ CashPilot محفظة جديدة على الجهاز الذي يشغّل العقدة ويعرض عبارتها السرية مرة واحدة: دوّنها. لاستخدام محفظة لديك بالفعل، الصق عبارتها السرية بدلًا من ذلك. بعد النشر، أرسل بعض Siacoin إلى محفظة العقدة للضمان والرسوم، ثم أضف مجلد التخزين (/storage)، واضبط الأسعار، وأعلن عن المضيف في لوحة التحكم.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "العبارة السرية للمحفظة (hostd.yml)، وقاعدة بيانات المحفظة، وإعدادات المضيف، وحالة العقود. فقدانها يعني فقدان هوية العقدة وتتبع إيرادات العقود؛ وتصبح العبارة السرية التي دوّنتها عندئذ الطريقة الوحيدة لاستعادة الأموال."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "بيانات المستأجرين المخزنة. فقدانها يُفشل إثباتات التخزين ويؤدي إلى خسارة الضمان المقفل مقابل تلك العقود."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "يحدد المضيفون أسعارهم بأنفسهم. توصي Sia بـ $1 لكل TB مخزَّن شهريًا وأكثر من $5 لكل TB يُنزَّل، ويذهب 3.9% من كل دفعة عقد إلى حاملي Siafund. يزداد الدخل مع كمية بيانات المستأجرين التي تصل إلى العقدة، وهي تبدأ من الصفر وتنمو مع مدة التشغيل والسعر. يُقفل الضمان (تقترح Sia ضعف سعر التخزين) لكل عقد ويُعاد عند اكتماله بنجاح.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "تتراكم الأرباح في محفظة Siacoin الخاصة بالمضيف (التي تتحكم فيها العبارة السرية). حوّل SC في منصة تداول واسحب منها إلى حساب مصرفي أو بطاقة؛ لا يوجد طلب دفع لدى المزوّد.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "توجد الأموال في محفظة Sia التي تتحكم فيها العبارة السرية داخل العقدة. لا توجد العبارة السرية إلا في وحدة تخزين البيانات الخاصة بـ hostd على الجهاز الذي يشغّلها؛ ولا يخزّنها CashPilot أبدًا. العبارة التي تدوّنها عند إنشاء المحفظة هي الطريقة الوحيدة للاستعادة.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "عنوان عام ثابت مع إعادة توجيه المنفذين 9981 (TCP، للإجماع) و9984 (TCP وUDP، لعقود المستأجرين). الاستضافة على مراكز البيانات وخوادم VPS شائعة على Sia. تحتاج المحفظة إلى Siacoin قبل أن تتمكن العقدة من قبول العقود."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "مساحة القرص وعرض النطاق اللازم لتقديمها."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "لا. يخزّن المستأجرون أجزاء ملفات مشفرة على قرصك ويستعيدونها. لا يوجّه أشخاص آخرون حركة مرور عشوائية عبر عنوان IP الخاص بك."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "عنوان محفظة Sia الخاص بك، والمفتاح العام للمضيف، وعنوان IP:المنفذ العام الذي تعلنه العقدة حتى يتمكن المستأجرون من الوصول إليها."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "حركة رفع وتنزيل مستمرة على الخط، كما هو الحال عند تشغيل أي خادم تخزين؛ ولا تُنسب إليك أي حركة مرور ويب مجهولة الهوية من أطراف أخرى."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "دون إذن مسبق: لا تسجيل ولا حساب. يُحرق الضمان إذا فاتت العقدة إثباتات التخزين، بسبب انقطاعها عن الاتصال أو فقدانها البيانات."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "الأرباح بعملة Siacoin في محفظتك الخاصة: لا يوجد دفع إلى حساب مصرفي، لذا تبيع بنفسك في منصة تداول."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "يُقفل الضمان لكل عقد ويُحرق إذا فات المضيف إثباتات التخزين بسبب انقطاعه عن الاتصال أو فقدانه البيانات."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "لا يُستخدم إلا نحو 30% من مساحة التخزين المعروضة على الشبكة، لذا يتنافس المضيف الجديد على طلب قليل."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "يخزّن المستأجرون أجزاء ملفات مشفرة ولا أحد يوجّه حركة مرور عبر عنوان IP الخاص بك، لكننا لم نجد أين تذكر Sia من هم المستأجرون أو كيف يُتحقق منهم."
  source: "7c08211baa39"
