  text: "توثّق Proxyrack حدًا قدره 500 جهاز لكل حساب، ولا حد لكل عنوان IP. تُقبل عناوين IP لمراكز البيانات لكن يُعاد تصنيفها بسعر أقل."
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "يذكر مركز المساعدة في ProxyRack أن إزالة جهاز تُخرج أرباح ذلك الجهاز من حسابك، ولا تعود إلا إذا أُضيف الجهاز نفسه مرة أخرى."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
