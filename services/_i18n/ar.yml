ocean.disclosure.sells:
  text: "الحوسبة"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
  text: "لا. يرسل برنامج التعدين قيم التجزئة إلى المجمّع؛ ولا أحد يوجّه حركة مرور عبر اتصالك."
  source: "7239118f749a"
ocean.disclosure.data_collected:
  text: "عنوان Bitcoin الخاص بك، وأسماء العمّال التي تختارها، ومعدل التجزئة، وعنوان IP لجهاز التعدين كما يراه المجمّع."
  source: "22282404721c"
ocean.disclosure.isp_risk:
  text: "يُبقي جهاز التعدين اتصالًا واحدًا مفتوحًا مع المجمّع ويستخدم القليل من عرض النطاق. التكلفة التي يجب مراقبتها هي الكهرباء، وليس مزوّد الإنترنت."
  source: "7bf5f9f6b028"
ocean.disclosure.account_rules:
  text: "لا يوجد حساب. العنوان هو الهوية، ويمكن لأي شخص قراءة إحصاءاته على ocean.xyz."
  source: "e3c8fd5863c1"
ocean.rating.cons.0.text:
  text: "يُدفع بعملة Bitcoin فقط، ولا يُدفع شيء على السلسلة حتى يبلغ رصيدك 0.01048576 BTC."
  source: "9c9981f2fbd5"
ocean.rating.cons.1.text:
  text: "رسوم مجمّع بنسبة 2%، أو 1% عندما تبني قوالب الكتل الخاصة بك باستخدام DATUM."
  source: "497f4f1ec62e"
ocean.rating.cons.2.text:
  text: "لا يشغّل CashPilot برنامج تعدين لـ OCEAN: أنت توجّه عتادك الخاص إلى المجمّع، ويكتفي CashPilot بقراءة الرصيد."
  source: "eccc0b4b47ae"
ocean.rating.pros.0.text:
