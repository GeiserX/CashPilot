  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "يجب على كل مضيف أن يُقفل رهنًا من NOS يتناسب مع السعر بالساعة لوحدة GPU لديه."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
