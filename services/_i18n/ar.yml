mysterium.description:
  text: "MystNodes (Mysterium Network) شبكة VPN وبروكسي لامركزية مبنية على تقنية البلوك تشين. تكسب رموز MYST بتشغيل عقدة تقدّم خدمات VPN والبروكسي وجمع البيانات للمستخدمين. تتطلب صلاحيات NET_ADMIN وSETUID وSETGID وجهاز TUN، تستخدمه داخل نطاق الشبكة الخاص بها على جسر تطبيقات الربح المحمي بالحاجز. تتضمن واجهة ويب مدمجة لإدارة العقدة. تعمل على الاتصالات المنزلية واتصالات VPS على حد سواء، لكن مكافأة الإحالة لا تُدفع إلا للعقد التي تعمل على عنوان IP منزلي.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "عقدة VPN لامركزية - قائمة على البلوك تشين، تعمل على VPS"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "عنوان واجهة الويب"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "نطاق منافذ UDP"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "عناوين الجهاز المضيف التي تُنشر عليها واجهة الويب للعقدة (المنفذ 4449). يُبقيها 127.0.0.1 على هذا الجهاز. للوصول إليها عبر بروكسي عكسي، أضف العنوان الذي يتصل منه البروكسي، مفصولًا بفاصلة دون مسافات: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "منافذ UDP التي تستخدمها العقدة لجلسات VPN، بالصيغة start:end. أعد توجيه النطاق نفسه على جهاز التوجيه (الراوتر). تأخذ كل جلسة نحو منفذين، لذا تحمل المنافذ الثلاثون الافتراضية نحو 15 جلسة في وقت واحد، وهذا أكثر مما تحصل عليه عقدة منزلية. النطاق الأوسع لا يصلح شيئًا ويكلّف أكثر: كل منفذ منشور يبطئ بدء تشغيل العقدة وإزالتها (300 منفذ تستغرق نحو 12 s للبدء)، ولا يقبل CashPilot أكثر من 300، ومع بروكسي userland الافتراضي في Docker يأخذ كل منفذ أيضًا نحو 2.5 MB من الذاكرة. الجلسات التي تفشل كلها مشكلة في جهاز التوجيه، وليست بسبب قلة المنافذ: راجع \"Routers that rewrite UDP source ports\" في دليل Mysterium. أبقِه أقل من 32768: فالمنافذ 32768-60999 هي النطاق المؤقت في Linux، حيث يمكن لأي برنامج على الجهاز المضيف أن يحجز أحدها لحظة، ومنفذ واحد محجوز يُفشل بدء تشغيل العقدة. العقدة التي لديها نطاق بالفعل تحتفظ به."
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "مخزن مفاتيح هوية العقدة. حذفه يُنشئ هوية جديدة تمامًا: تفقد العقدة سمعتها وأي أرباح لا تزال محتجزة على الهوية القديمة."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "لا تستطيع العقدة تشغيل sudo داخل حاويتها، لذا لا تستطيع إعداد واجهة VPN أو جدار الحماية، وتفشل كل جلسة عند الإعداد: تبدو متصلة ولا تكسب شيئًا. أُنشئت الحاوية دون صلاحيتي SETUID وSETGID. حدّث CashPilot والعامل الذي يشغّل هذه العقدة، ثم أعد نشر Mysterium من لوحة التحكم؛ تبقى هوية العقدة في وحدة تخزين البيانات الخاصة بها ولا تضيع."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "لم تصل أي جلسة VPN في آخر 6 ساعات إلى هذه العقدة مباشرة. لجأت كلها إلى تقنية ثقب NAT (hole punching)، ويفشل كثير من المشترين في الاتصال بهذه الطريقة، لذا تكسب العقدة أقل. منافذ UDP الخاصة بها غير قابلة للوصول من الإنترنت. على جهاز التوجيه، أعد توجيه نطاق منافذ UDP ${UDP_PORTS} (start:end، النطاق نفسه على الجانبين) إلى ${HOST_ADDRESS}. يزول هذا التنبيه من تلقاء نفسه بمجرد اتصال جلسة مباشرة."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "تضع مراقبة Mysterium علامة فشل على العقدة الموجودة على ${WORKER_NAME}، لذا تُستبعد من قائمة العقد التي يختار منها معظم المشترين، حتى عندما يقول فحصها الذاتي إن كل المنافذ قابلة للوصول. تأكد أولًا من أن لدى العقدة /dev/net/tun وSETUID/SETGID، فغيابها يُفشلها بالطريقة نفسها: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 وإذا كانت متوفرة، فالسبب الشائع هو أن جهاز التوجيه أمام ${WORKER_NAME} يعيد كتابة منفذ المصدر UDP لردود العقدة بمجرد أن تصل حزمة من الخارج إلى ذلك المنفذ. راجع الاختبار في الدليل: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "انتهت كل جلسة من آخر خمس جلسات VPN للعقدة الموجودة على ${WORKER_NAME} بعد نحو دقيقة دون نقل أي بيانات، لذا لا تكسب شيئًا وهي تبدو متصلة. السبب المرجح هو جهاز التوجيه أمام ${WORKER_NAME}: بمجرد أن تصل حزمة من الخارج إلى منفذ ما، يعيد كتابة منفذ المصدر لردود العقدة اللاحقة من ذلك المنفذ، وكل جلسة تبدأ بحزمة كهذه (فحص المنفذ الذي تجريه العقدة نفسها)، فيُسقط المشترون ردود العقدة. النطاق الأوسع للمنافذ لا يساعد. راجع الاختبار والحلول في الدليل: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports يزول هذا التنبيه بمجرد أن تنقل جلسة بيانات."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "الأرباح برموز MYST. عناوين IP المنزلية تكسب أكثر بكثير. واجهة الويب للعقدة على المنفذ 4449 للإدارة، وهي منشورة افتراضيًا على الجهاز الذي تعمل عليه فقط (127.0.0.1)؛ ومن جهاز آخر افتح نفق SSH أولًا (ssh -L 14449:127.0.0.1:4449 متبوعًا بعنوان جهاز العقدة، ثم تصفّح http://127.0.0.1:14449؛ المنفذ المحلي 14449 حتى لا يتعارض مع عقدة على جهازك أنت)، أو أضف عنوانًا إلى UI_ADDRESS (راجع WebUI address في دليل Mysterium). تُقبل VPS. يُنصح بشدة بإعادة توجيه منافذ UDP 23000-23029 (القيمة الافتراضية لـ UDP_PORTS) -- فبدونها تحصل العقد على حالة Strict NAT وتفشل كثير من جلسات VPN، ما يقلل الدخل كثيرًا. مهم: بعد أول تشغيل، اضبط محفظة المستفيد (التسوية) عبر واجهة الويب للعقدة أو سطر الأوامر لتطابق حسابك على mystnodes.com -- فهذا يربط الأرباح على السلسلة بلوحة التحكم السحابية."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "تسوية تلقائية على السلسلة في كل مرة تحمل فيها العقدة 5 MYST غير مسوّاة"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "لا يوجد زر للضغط عليه. تُجري كل عقدة التسوية على Polygon من تلقاء نفسها بمجرد أن تحمل 5 MYST غير مسوّاة، ويذهب نحو 21% رسومًا (رسوم Hermes البالغة 20% إضافة إلى رسوم معاملة صغيرة)، لذا يصل نحو 3.9 MYST إلى محفظة المستفيد في كل تسوية. يسرد TequilAPI لكل عقدة تسوياتها على /transactor/settle/history. رقم \"total earnings\" على MystNodes يغطي آخر 30 يومًا فقط؛ فهو ليس رصيدًا ولا إجماليًا مدى الحياة. لا تُسوّى مكافآت MYST الإضافية من برنامج مكافآت MystNodes من تلقاء نفسها: طالب بها في صفحة Rewards، خلال 30 يومًا من التوزيع وفقًا لمركز مساعدة MystNodes."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "تُضبط محفظة المستفيد بعد النشر، عبر TequilAPI أو واجهة الويب للعقدة -- وليس بمتغير بيئة، لذا لا يمكن قراءتها من مواصفات الحاوية."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "استخدم البريد الإلكتروني وكلمة المرور لحسابك في MystNodes (نفس بيانات <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST عن كل صديق تكسب عقدته 5 MYST (عناوين IP المنزلية فقط)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
