  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "يدفع المجمّع إلى عنوان Monero الخاص بك عندما يبلغ رصيدك الحد الذي اخترته. يحتفظ المجمّع بالرصيد حتى يدفعه لك."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "يُبلغ هذا الجهاز عن اتصال استضافة. راجع شروط مزوّد الاستضافة قبل التعدين. بعض المزوّدين، ومنهم Hetzner Cloud، يحظرونه. تحقّق من تكاليف الكهرباء الفعلية قبل الاعتماد على أي تقدير للربح."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "يفرض MoneroOcean، المجمّع الافتراضي، رسوم تعدين بنسبة 0%. حد الدفع الافتراضي 0.3 XMR، ويمكنك خفضه إلى 0.003 XMR. قد تكلّف الدفعات الأقل من 4 XMR ما يصل إلى 0.0004 XMR. تحدد المجمّعات الأخرى أسعارها وحدودها بنفسها."
  source: "0a5db026488f"
