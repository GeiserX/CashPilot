passiveapp.description:
  text: "PassiveApp منصة DePIN تتيح لك كسب مكافآت بالعملات المشفرة وعبر PayPal بمشاركة عرض النطاق وموارد الحوسبة غير المستخدمة. عمليًا لنظام Windows فقط: تعرض صفحة التنزيل الخاصة بالمورّد نفسه Android وiOS وLinux على أنها \"coming soon\" دون تغيير منذ فبراير 2025 على الأقل، ولا يوجد إصدار لنظام macOS — رغم أن النصوص التسويقية على الموقع نفسه تدّعي دعمًا أوسع. لا توجد صورة حاوية Docker.\n"
