nosana.description:
  text: "Nosana سوق حوسبة GPU لامركزي مبني على Solana. يربط مالكي وحدات GPU بالطلب على أحمال عمل الذكاء الاصطناعي، ويدفع برموز NOS. تكسب بطاقة RTX 3060 نحو $0.048/hr. تركّز المنصة على أحمال عمل الاستدلال بالذكاء الاصطناعي، وتستخدم سلسلة Solana لجدولة المهام وتسوية الدفعات. تشغّل العقد أحمال عمل في حاويات عبر Nosana CLI.\n"
  source: "6767fa2885ea"
nosana.short_description:
