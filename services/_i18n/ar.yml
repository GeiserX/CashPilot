  text: "عنوان محفظة يُنشأ على جهازك، إضافة إلى حجم حركة المرور التي ترحّلها."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "حقيقي، وينطبق مباشرة على الاتصالات المنزلية. تخرج حركة مرور البروكسي من مشترين مجهولين باسم عنوان IP الخاص بك، فتصل شكاوى إساءة الاستخدام إليك. لا شيء في هذا الكتالوج يقصر الخدمة على عناوين مراكز البيانات، وعناوين IP المنزلية تكسب أكثر، لذا فإن الحافز هنا يدفع في الاتجاه الخطأ: اقرأ شروط مزوّد الإنترنت قبل تشغيلها في المنزل."
  source: "686837157681"
