  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "تذكر سياسة الخصوصية اسم المشغّل، Pawns.App Ltd (الشركة رقم 16043795 في إنجلترا وويلز)، التي يُظهر سجل Companies House أنها تأسست في 28 أكتوبر 2024، أي قبل أقل من ثلاث سنوات."
