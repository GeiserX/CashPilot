nodle.cashout.notes:
  text: "توجد NODL في محفظة التطبيق نفسه على ZKsync Era؛ تحقّق منها في التطبيق أو في مستكشف كتل ZKsync Era. غادرت Nodle سلسلة parachain الخاصة بها على Polkadot، وأُغلق الجسر من Polkadot إلى ZKsync في 31 ديسمبر 2025، لذا لم يعد بالإمكان نقل NODL الباقية على جانب Polkadot إلى ZKsync."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "توجد عملات NODL في المحفظة الخاصة بتطبيق Nodle على ZKsync Era. لا يستطيع CashPilot رؤية عنوان تلك المحفظة."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "مكافأة NODL عن كل مستخدم نشط جديد ينضم عبر الدعوة (لا تنشر Nodle المبلغ)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "يذكر أحد المراجعين أنه كسب نحو $3 خلال ثلاث إلى أربع سنوات؛ ويذكر آخرون أن الأرباح اليومية انخفضت بشدة."
