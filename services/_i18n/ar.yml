ebesucher.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "الدفع باليورو عبر PayPal أو تحويل مصرفي."
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "لا يشغّل CashPilot خدمة eBesucher: إنها إضافة متصفح، لذا لا يستطيع CashPilot نشرها أو تحديثها نيابة عنك. لم تُراجَع شروطها بشأن الحاويات."
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
