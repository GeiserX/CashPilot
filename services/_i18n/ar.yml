  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "تتطلب NVIDIA GPU بذاكرة VRAM لا تقل عن 8GB. تُذكر لبطاقة RTX 4090 أرباح بقيمة $500-1000 شهريًا (وهي على الأرجح أقل في الواقع)."
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "حسب الحقبة (epoch)"
  source: "75743e03bad2"
ionet.payout.notes:
