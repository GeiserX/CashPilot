packetstream.cashout.notes:
  text: "عبر PayPal فقط، الحد الأدنى $5، ورسوم 3% تظهر قبل التأكيد. يحفظ السحب الأول بريدك الإلكتروني في PayPal؛ وتغييره لاحقًا يتطلب تأكيدًا بالبريد الإلكتروني وانتظار 7 أيام، لذا تحقّق من العنوان قبل التأكيد. تُراجَع الطلبات وتُرسل خلال 7 أيام؛ ويمكنك إلغاء الطلب أثناء انتظاره، ولا يمكن تقديم طلب جديد إلا بعد دفع السابق."
