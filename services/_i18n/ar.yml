packetstream.rating.cons.0.text:
  text: "يذكر مراجعون على Trustpilot في 2025 و2026 أن الدفعات تصل متأخرة أو لا تصل إطلاقًا، ويقول مستخدم قديم إن الدفعات تباطأت ثم توقفت؛ ويذكر آخرون في 2026 أنهم تلقّوا دفعاتهم."
