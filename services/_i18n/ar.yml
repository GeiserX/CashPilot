storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "مساحة القرص وعرض النطاق اللازم لتقديمها."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "لا. تخزّن أجزاء مشفرة ومرمَّزة بترميز المحو (erasure-coded) من بيانات العملاء. لا يوجّه أشخاص آخرون حركة مرورهم عبر عنوان IP الخاص بك."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "هوية العقدة، وعنوان محفظتك، والبريد الإلكتروني الذي تتطلبه العقدة لإشعارات المشغّل، وعنوان IP والمنفذ الخاصان بك، اللذان يجب أن يكونا قابلين للوصول حتى تقدّم العقدة البيانات."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "مسألة حد استهلاك البيانات أساسًا وليست مسألة مسؤولية: تقدّم العقدة بيانات العملاء وتستقبلها باستمرار، وهي حركة مرور حقيقية ومستمرة على خطك. لكنها، خلافًا للبروكسي أو عقدة الترحيل، ليست حركة مرور مجهولة الهوية من أطراف أخرى تُنسب إليك كمصدر لها، لذا لا تجلب شكاوى إساءة الاستخدام التي تجلبها تلك."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "عدد غير محدود من العقد، لكن العقد على الشبكة الفرعية /24 نفسها تتشارك التخصيص، لذا تكسب كل واحدة منها أقل إذا شغّلت عدة عقد على اتصال واحد."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "أفادت CoinDesk في 27 يوليو 2026 بأن Storj Labs تقدّمت بطلب الحماية من الإفلاس بموجب الفصل 11 (Chapter 11)."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "دخلت الدفعات المستحقة لمشغّلي العقد عن الفترة السابقة لتقديم الطلب في إجراءات مطالبات الإفلاس."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "تُحتجز من العقدة الجديدة 75% ثم 50% ثم 25% من أرباحها في أشهرها التسعة الأولى؛ ويعود النصف في الشهر 16 والباقي فقط عند الخروج المنظَّم."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "يخزّن العملاء أجزاء ملفات مشفرة ولا أحد يوجّه حركة مرور عبر عنوان IP الخاص بك، لكننا لم نجد أين تذكر Storj من هم العملاء أو كيف يُتحقق منهم."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "برنامج عقدة التخزين مفتوح المصدر بموجب ترخيص AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "تنشر Storj صورة حاوية Docker خاصة بها، storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "لا حساب: عنوان محفظة وبريد إلكتروني لإشعارات المشغّل."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "استمر الدفع للعقد النشطة بعد تقديم الطلب."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR مجمّع تعدين Monero بلا حساب: يسجّل برنامج التعدين الدخول باستخدام عنوان Monero الخاص بك كاسم مستخدم، ويدفع المجمّع إلى ذلك العنوان. لا يشغّل CashPilot أي برنامج تعدين هنا. بل يقرأ الرصيد الذي يحتفظ به SupportXMR لعنوانك، فترى ما كسبه برنامج التعدين على CPU بجانب دخلك الآخر. الرصيد مكتسب لكنه لم يصل بعد: يدفعه المجمّع بمجرد تجاوزه حد الدفع الذي حددته.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "مجمّع تعدين Monero، يُتتبَّع عبر عنوان الدفع الخاص بك"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (تلقائيًا)، 0.01 XMR عند الطلب"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "عندما يتجاوز رصيدك الحد الذي حددته، أو عند الطلب"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "يدفع SupportXMR إلى عنوانك بمجرد أن يبلغ الرصيد الحد الذي حددته (0.1 XMR افتراضيًا). ويمكنك أيضًا على موقعه طلب دفعة فورية بدءًا من 0.01 XMR، مقابل رسوم قدرها 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "الرصيد مكتسب لكنه لا يصل حتى يدفعه SupportXMR إلى هذا العنوان. لا يمكن قراءة أرصدة Monero على السلسلة دون مفتاح العرض الخاص (private view key)، الذي لا يطلبه CashPilot أبدًا، لذا تؤكد كل دفعة بنفسك."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "عنوان الدفع بعملة Monero: اسم المستخدم الذي يستخدمه برنامج التعدين على SupportXMR، دون أي جزء <b>.workername</b> أو <b>+difficulty</b>. وهو عام ولا يتيح الوصول إلى أي أموال."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "يحتاج إلى برنامج تعدين Monero (XMRig) موجَّه إلى pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "الحوسبة"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "لا. يرسل برنامج التعدين قيم التجزئة إلى المجمّع؛ ولا أحد يوجّه حركة مرور عبر اتصالك."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "عنوان Monero الخاص بك، وأسماء العمّال التي تختارها، ومعدل التجزئة، وعنوان IP لجهاز التعدين كما يراه المجمّع."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "يُبقي برنامج التعدين اتصالًا واحدًا مفتوحًا مع المجمّع ويستخدم القليل من عرض النطاق. التكلفة التي يجب مراقبتها هي الكهرباء، وليس مزوّد الإنترنت."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "لا يوجد حساب. العنوان هو الهوية، ويمكن لأي شخص قراءة إحصاءاته على supportxmr.com."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "يُدفع بعملة Monero فقط، مع رسوم مجمّع بنسبة 0.6% وحد افتراضي قدره 0.1 XMR قبل الدفع التلقائي."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "لا يشغّل CashPilot برنامج تعدين لـ SupportXMR: أنت توجّه برنامج التعدين الخاص بك إلى المجمّع، ويكتفي CashPilot بقراءة الرصيد."
  source: "dfddab40ccc1"
teneo.description:
  text: "يمنح Teneo Protocol وكلاء الذكاء الاصطناعي إمكانية الوصول إلى الويب الحي عبر شبكة من Beacons. Teneo Beacon هو تطبيق Teneo نفسه لأنظمة Android وiOS وmacOS وWindows وLinux، مع إصدار بسطر الأوامر للخوادم وRaspberry Pi. يشارك عرض النطاق غير المستخدم بعد أن توافق على شاشة الموافقة الخاصة به، ويكسب نقاط Teneo Protocol Points وFragments أثناء اتصاله. تُحتسب Fragments ضمن سحوبات موسمية تُدفع جوائزها بعملة USDC (Beacon Drop). تقول Teneo إن Beacon يكسب ضعف نقاط إضافة المتصفح القديمة. يكسب Beacon واحد فقط لكل اتصال بالإنترنت. أما الأجهزة الأخرى على الاتصال نفسه فتبقى في وضع الانتظار. سجّل في Expedition Hub باستخدام رابط الإحالة أو الرمز PSA3BHPJ، ثم سجّل الدخول في Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "تطبيق عرض نطاق ضمن DePIN (Beacon) - Fragments للسحوبات الموسمية بـ USDC، و+100 Fragments مع رابط إحالة"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "يكسب نقاط Teneo Points وFragments. تُحتسب Fragments ضمن سحوبات موسمية بـ USDC، لذا يدفع الموسم جائزة وليس معدلًا ثابتًا. تقول Teneo إن Beacon يكسب ضعف نقاط إضافة المتصفح. طالب بالتعزيز كل 8 ساعات للحصول على ما يصل إلى 3x من Fragments؛ وتفويت النافذة يخفض المضاعِف."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "سحب موسمي (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "تُدفع جوائز Beacon Drop بعملة USDC إلى محفظة تربطها في Expedition Hub. يعرض Hub عدد الأيام المتبقية لك لربط محفظة؛ والجائزة التي لا تُربط لها محفظة في الوقت المحدد تُصادَر."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "اربط محفظة في Expedition Hub قبل دفع جوائز الموسم؛ يصادر Hub الجائزة التي لم تُربط محفظتها في الوقت المحدد."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% من Fragments كل صديق محال و2% من Fragments إحالاته، بمجرد أن يسجّل الصديق خلال 7 أيام ويكسب 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments عند التسجيل، و+150 أخرى بمجرد وصولك إلى 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "يكسب Beacon واحد فقط لكل اتصال بالإنترنت. أجهزة مراكز البيانات لا تكسب إلا لدى مزوّدي الاستضافة الذين فعّلتهم Teneo، بنصف Fragments ودون نقاط أو مكافأة إحالة. اتصالات VPN لا تكسب أبدًا."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "لا تدفع Fragments الخاصة بـ Beacon بعملة USDC إلا كجوائز في سحوبات موسمية، لذا لا يكسب تشغيله مبلغًا محددًا."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "تقول Teneo إن النقاط ستُدمج في $AGENTIC، وهو رمز مكافآت غير قابل للتحويل، وليس رمز $TENEO."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "لم يُؤكَّد أي موعد لإطلاق $TENEO أو تخصيصه أو آلية المطالبة به حتى نوفمبر 2026، بعد أن مضى موعد مستهدف سابق في الربع الثاني من 2026."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "لا يشغّل CashPilot خدمة Teneo: أنت تثبّت تطبيق Beacon الخاص بالمزوّد، لذا لا يستطيع CashPilot نشره أو تحديثه نيابة عنك. لم تُراجَع شروطه بشأن الحاويات."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "تقول Teneo إن حركة المرور تأتي من عملاء أعمال موثَّقين، وإنها تحظر العناوين الخاصة والمنافذ المعرّضة لإساءة الاستخدام، لكنها لا تذكر كيف تتحقق من هؤلاء العملاء."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network شبكة لامركزية راسخة لتوصيل الفيديو وحوسبة الذكاء الاصطناعي (منذ 2018). يشغّل المستخدمون عقد Edge Nodes تشارك عرض النطاق والتخزين وقدرة الحوسبة. شراكات كبيرة في مجال المحتوى. تكسب رموز TFUEL.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "CDN لامركزية + حوسبة ذكاء اصطناعي - مكافآت TFUEL، مشروع راسخ"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "تطبيق سطح مكتب فقط. تعتمد الأرباح على الموارد والموقع. شراكات كبيرة، ومدرجة في جميع منصات التداول."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "مستمر"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "لا يشغّل CashPilot خدمة Theta Edge: أنت تستخدم تطبيق سطح المكتب الخاص بالمزوّد، لذا لا يستطيع CashPilot نشره أو تحديثه نيابة عنك. لم تُراجَع شروطه بشأن الحاويات."
  source: "893de938ed14"
titan.description:
  text: "Titan Network منصة DePIN تشارك عنوان IP والتخزين وعرض النطاق الخاصة بك مقابل مكافآت برمز TNT. متاحة على Windows وMac وAndroid. تساهم العقد في شبكة CDN وطبقة تخزين لامركزيتين. تتراوح الأرباح المعتادة بين $5-30 شهريًا حسب الموارد المشتركة والموقع الجغرافي.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN لمشاركة IP والتخزين وعرض النطاق - $5-30 شهريًا"
  source: "799e68401067"
titan.earnings.notes:
  text: "يشارك عنوان IP والتخزين وعرض النطاق. تعتمد الأرباح على الموارد المقدَّمة والمنطقة. تخصيص مساحة تخزين أكبر يجلب مكافآت أعلى."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "حسب الحقبة (epoch)"
  source: "75743e03bad2"
titan.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "تذكر صفحة المساعدة في Titan نفسها أن تشغيل العقدة لا يضمن الأرباح: إذا لم تُسند إليها أي مهمة فلا تكسب شيئًا، والمكافآت برمز TNT."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "لا يشغّل CashPilot خدمة Titan: أنت تستخدم تطبيق المزوّد أو إضافته، لذا لا يستطيع CashPilot نشرها أو تحديثها نيابة عنك. لم تُراجَع شروطها بشأن الحاويات."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "يتيح لك Traffmonetizer تحقيق دخل من حركة مرورك على الإنترنت بمشاركة عرض النطاق مع شركات موثَّقة. من الخدمات القليلة لمشاركة عرض النطاق التي تعمل جيدًا على عناوين IP لخوادم VPS ومراكز البيانات إضافة إلى الاتصالات المنزلية. يستخدم مصادقة بسيطة برمز يُمرَّر عبر وسائط سطر الأوامر. يدعم معماريات ARM لأجهزة Raspberry Pi والأجهزة المشابهة.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "مشاركة عرض النطاق - يعمل على VPS، مصادقة برمز"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "الرمز"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "اسم الجهاز"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "سجّل الدخول في <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>، واضغط F12 ← Application ← Local Storage ← انقر <code>https://app.traffmonetizer.io</code> ← انسخ قيمة <code>authToken</code> (نحو 54 حرفًا: أرقام، ثم <code>|</code>، ثم حروف وأرقام)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "الاسم المعروض في لوحة التحكم لإدارة الأجهزة"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "عناوين IP لخوادم VPS ومراكز البيانات تكسب أقل من المنزلية. المواقع في الولايات المتحدة وأوروبا تكسب أكثر. يدعم عناوين IP متعددة عبر شبكات Docker."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "الحد الأدنى $10. لم يعد PayPal متاحًا. احفظ طريقة دفع واحدة في الملف الشخصي أولًا: USDT على Solana أو TON (أقل الرسوم)، أو Arbitrum (رسوم منخفضة)، أو Tron TRC20 (رسوم شبكة مرتفعة)، أو تحويل مصرفي بدءًا من $1,000. يُطبَّق أول عنوان تحفظه فورًا؛ وتغييره لاحقًا يتطلب تأكيدًا بالبريد الإلكتروني. قد تطلب لوحة التحكم وسيلة تواصل عبر تطبيق مراسلة (WhatsApp أو Telegram أو Skype) قبل السحب الأول. يدفع الطلب دولارات كاملة وتبقى السنتات في الرصيد."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT على السلسلة المحفوظة في إعدادات الدفع في الملف الشخصي (Solana أو TON أو Arbitrum أو Tron)، أو تحويل مصرفي. يُحفظ العنوان في إعدادات Traffmonetizer، وليس في الحاوية."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "سجّل الدخول في <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>، واضغط F12 ← Application ← Local Storage ← قيمة <b>authToken</b> (نحو 54 حرفًا: أرقام، ثم <code>|</code>، ثم حروف وأرقام)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% من كل دفعة يطلبونها"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "تشترط شروط خدمة Traffmonetizer عنوان IP منزليًا، لكن عقد VPS مقبولة عمليًا."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "يقيّمه Trustpilot بـ 1.9؛ ويذكر مراجعون من 2023 إلى نوفمبر 2026 دفعات معلّقة لأسابيع، أو موسومة بأنها مكتملة دون معاملة مطابقة."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "ويذكر المراجعون أنفسهم أن الدعم عبر الدردشة المباشرة والبريد الإلكتروني لا يرد، أحيانًا لأسابيع."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "بالعملات المشفرة أو بحوالة مصرفية بدءًا من $1,000 فقط؛ وأُلغي PayPal، ولا يدفع الطلب إلا دولارات كاملة."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "تشترط شروط Traffmonetizer عنوان IP منزليًا، لذا فإن تشغيله على خادم باتصال استضافة يقع خارجها."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "يذكر أربعة مراجعين على Trustpilot من 2023 إلى 2025 أرباحًا بطيئة جدًا، مثل سنت واحد يوميًا عبر أربعة أجهزة، أو قرابة عامين للوصول إلى $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "لا تحتاج الدفعة إلا إلى عنوان عملة مشفرة محفوظ ومؤكَّد بالبريد الإلكتروني؛ وقد تطلب لوحة التحكم وسيلة تواصل عبر تطبيق مراسلة."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "تنشر Traffmonetizer صورة حاوية Docker خاصة بها، traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "عدّن باستخدام CPU واحصل على الدفع بالعملة التي تختارها، مثل SHIB أو DOGE أو XMR. يشغّل CashPilot برنامج XMRig على مجمّع RandomX التابع لـ unMineable، وتحوّل unMineable عملة Monero التي يعدّنها CPU لديك إلى عملتك. وتدفع إلى عنوانك العام بمجرد أن يبلغ رصيدك حد الدفع الخاص بالعملة. يحمل كل عامل ينشره CashPilot رمز الإحالة الخاص بـ CashPilot في unMineable، ما يخفض رسوم المنصة عليك من 1% إلى 0.75%. قد تكلّف الكهرباء أكثر مما تكسب."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "عدّن باستخدام CPU واحصل على الدفع بالعملة التي تختارها"
  source: "03bd0d4f2004"
