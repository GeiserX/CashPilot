  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "يدفع HeroMiners إلى عنوانك تلقائيًا بمجرد وصولك إلى الحد الذي اخترته. أدنى حد هو 1 KAS.\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "يتراكم الرصيد لدى HeroMiners. تحقّق من المبلغ الذي وصل إلى محفظتك قبل تأكيد أي دفعة في CashPilot.\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "أدخل عنوان الدفع العام الكامل لـ Kaspa الذي يستخدمه برنامج التعدين على HeroMiners. ضمّن البادئة <b>kaspa:</b> ولا تضف اسم العامل.\n"
  source: "11b04c49529a"
