  source: "317724b762f3"
nosana.earnings.notes:
  text: "بطاقة RTX 3060 نحو $0.048/hr، والبطاقات الأعلى تكسب أكثر. تعتمد الأرباح على توفر المهام وطراز GPU. يتطلب NVIDIA GPU وLinux وDocker وNosana CLI. الدفعات برمز NOS على Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "عند إكمال كل مهمة"
