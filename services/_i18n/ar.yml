repocket.cashout.notes:
  text: "يحدد Repocket الحد الأدنى لكل حساب: $4 قبل الدفعة الأولى و$2 بعدها في أكتوبر 2026، وهو أقل بكثير من $20 التي كان يعلن عنها سابقًا. الطرق: Tremendous (إلى بريدك الإلكتروني) أو USDT على Polygon. يُؤكَّد كل طلب من رابط يُرسل بالبريد الإلكتروني خلال ساعتين، ولا يمكن أن يكون هناك أكثر من طلب واحد معلّق في الوقت نفسه. في أكتوبر 2026 رفض Repocket طلبًا عبر Tremendous برسالة \"Please, message support\"، بينما نجح طلب USDT على Polygon."
  source: "4257bc89db22"
repocket.payout.notes:
