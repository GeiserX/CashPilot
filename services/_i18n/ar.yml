srbminer-multi.description:
  text: "عدّن Pearl أو Zano أو Ravencoin باستخدام NVIDIA GPU واحدة. ينزّل CashPilot الإصدار الرسمي من SRBMiner-Multi عند أول تشغيل ويتحقق من SHA-256 الخاص به. يدفع المجمّع الذي تختاره إلى عنوان الدفع العام الخاص بك. يحتفظ SRBMiner-Multi بنسبة 2% من وقت التجزئة على Pearl و0.85% على العملتين الأخريين. قد تكلّف الكهرباء أكثر من العملات التي تكسبها."
  source: "a32202ef76d4"
