  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "تذكر الشروط أن Pawns لا يسمح بأي خوادم أو شبكات VPN أو خدمات بروكسي لمشاركة حركة المرور، ولا يسمح إلا بجهاز واحد لكل عنوان IP."
