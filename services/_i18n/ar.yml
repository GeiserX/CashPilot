srbminer-multi.earnings.notes:
  text: "تقدير إجمالي قبل احتساب الكهرباء. في 2026-11-25 قدّر hashrate.no نحو $2.45 يوميًا على Pearl لبطاقة RTX 4070 تستهلك نحو 142 W. لم نقِس ذلك بأنفسنا. Pearl عملة جديدة، ويتغير سعرها وصعوبة تعدينها بسرعة. تحقّق من استهلاك GPU للطاقة ومن سعر الكهرباء لديك لترى إن كان التعدين مجديًا."
  source: "e7b856e43825"
