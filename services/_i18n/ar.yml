earnfm.cashout.notes:
  text: "الحد الأدنى $15. الطرق: USDT على BEP20 أو Polygon (رسوم $1) أو TRC20 (رسوم $3)، أو PayPal، أو بطاقات هدايا Amazon أو Starbucks بدءًا من $15، أو حوالة مصرفية بدءًا من $1,000 مع خصم رسوم التحويل. قبل الدفعة الأولى تملأ ملف الفوترة (الاسم القانوني والعنوان)، الذي يُستخدم لإيصالات الدفع."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "يحتفظ Earn.fm بالرصيد؛ ويُسحب عند الطلب."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "استخدم البريد الإلكتروني وكلمة المرور لحسابك في Earn.fm (نفس بيانات الدخول إلى <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10% من أرباحهم مدى الحياة"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "رصيد ابتدائي بقيمة $5"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "حد أدنى قدره $15، ورسوم من $1 إلى $3 على USDT، والحوالة المصرفية متاحة فقط بدءًا من $1,000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "قبل الدفعة الأولى تملأ ملف الفوترة باسمك القانوني وعنوانك."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "يذكر مراجعون في 2025 أن الدعم عبر البريد الإلكتروني وDiscord لا يرد؛ ويشير Trustpilot إلى أن Earn.fm لم ترد على المراجعات السلبية."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "تنشر Earn.fm صورة حاوية Docker خاصة بها، earnfm/earnfm-client."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher منصة لتبادل الزيارات تكسب فيها أرصدة بزيارة المواقع عبر شريط تصفح آلي (surfbar). تعمل كإضافة متصفح. ليست خدمة تقليدية لمشاركة عرض النطاق — فهي تولّد الزيارات بتصفح المواقع تلقائيًا.\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
