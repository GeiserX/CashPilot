spide.description:
  text: "Spide خدمة لمشاركة عرض النطاق تتيح لك تحقيق دخل من عرض النطاق غير المستخدم في اتصالك بالإنترنت. تستخدم معرّف جهاز اختياريًا لتتبع الأجهزة. متاحة عبر صور حاويات Docker مجتمعية من مشروع income-generator.\n"
