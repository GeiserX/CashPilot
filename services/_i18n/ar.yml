  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay شبكة DePIN تكافئ المستخدمين على مشاركة عرض النطاق عبر إضافة متصفح. المنصة محمية بـ Cloudflare، ما قد يعقّد الوصول الآلي. يكسب المستخدمون نقاط Nodepay Points بإبقاء الإضافة نشطة. تركّز الشبكة على توفير بنية تحتية لبيانات تدريب الذكاء الاصطناعي.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "مشاركة عرض النطاق ضمن DePIN للذكاء الاصطناعي - إضافة متصفح"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "تكسب نقاط Nodepay Points؛ وتتحول نقاط المستخدمين الذين يجتازون فحوصات الأهلية لدى Nodepay إلى رمز NC. قد تحظر حماية Cloudflare الجمع الآلي. يلزم وجود إضافة المتصفح."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "توزيع مجاني (airdrop) لرمز NC (التوقيت غير مؤكد)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "نظام قائم على النقاط. تتحول نقاط المستخدمين الذين يجتازون فحوصات الأهلية لدى Nodepay إلى رمز NC، الذي أُطلق في يناير 2025."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "في مراجعة الموسم الأول أزالت Nodepay أكثر من 300,000 حساب رأت أنها روبوتات وألغت 17 مليار نقطة."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "المكافآت نقاط تتحول إلى رمز NC، لذا تعتمد قيمتها على الرمز."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "لا يشغّل CashPilot خدمة Nodepay: أنت تستخدم إضافة المتصفح الخاصة بالمزوّد، لذا لا يستطيع CashPilot نشرها أو تحديثها نيابة عنك. لم تُراجَع شروطها بشأن الحاويات."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes هو المستوى المجاني للدخول إلى Noderr Protocol، وهو مشروع تمويل لامركزي (DeFi) على Base L2. العقدة الصغيرة (micronode) برنامج صغير يعمل على هاتف Android احتياطي أو حاسوب Windows أو Mac أو متصفح Chromium. على Android يشارك اتصال الهاتف المحمول: تخرج حركة مرور Noderr الأخرى عبر عنوان IP لمشغّل شبكة الهاتف، لذا يحتاج إلى شريحة SIM فيها بيانات جوّال. على الحاسوب أو في المتصفح ينفّذ مهام أتمتة للبروتوكول باستخدام قدرة الحوسبة الفائضة. صُمّمت المكافآت لتُدفع بعملة NODR، بحسب درجة مدة تشغيل وموثوقية مسجّلة على السلسلة، لكن الشبكة تعمل على شبكة الاختبار Base Sepolia خلال المرحلة التجريبية: مكافآت العقد غير ممولة ولم يُدفع منها شيء بعد.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "عقدة صغيرة مجانية (مشاركة اتصال Android، وWindows، وMac، والمتصفح) - شبكة اختبار، المكافآت غير ممولة حتى الآن"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "مرحلة تجريبية على شبكة اختبار: مكافآت العقد غير ممولة ولم يُدفع منها شيء بعد. عائد APY البالغ 5-10% على الموقع هدف تصميمي. أعد النظر عندما تغادر الشبكة Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "عند الطلب"
  source: "be820103712e"
noderr.cashout.notes:
  text: "تتراكم المكافآت في محفظة العقدة نفسها ويُطالب بها من التطبيق أو من التطبيق اللامركزي (dApp). خلال المرحلة التجريبية هي رموز شبكة اختبار Base Sepolia بلا قيمة سوقية."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "ينشئ التطبيق محفظة العقدة عند أول تشغيل ويسكّ لها رمز Utility NFT مجانيًا غير قابل للنقل (soulbound). احتفظ بنسخة احتياطية من المحفظة من التطبيق: فقدان الجهاز يعني فقدان هوية العقدة. المكافآت على Base Sepolia (شبكة اختبار) خلال المرحلة التجريبية."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "يحتاج Android إلى شريحة SIM فيها بيانات جوّال؛ ولا تنشر عملاء سطح المكتب والمتصفح أي متطلبات لعنوان IP."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "يعتمد على الجهاز. يبيع هاتف Android اتصاله المحمول: تخرج حركة مرور Noderr الأخرى عبر عنوان IP لمشغّل شبكة الهاتف وتُحتسب من باقة البيانات. ويبيع حاسوب Windows أو Mac أو المتصفح قدرة الحوسبة الفائضة لما يسميه المزوّد مهام أتمتة وسائل التواصل الاجتماعي والمحتوى."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "نعم. على Android تخرج حركة مرور Noderr الأخرى عبر عنوان IP المحمول لهاتفك؛ ويطلب التطبيق موافقة مسجّلة قبل البدء، ويمكنك إيقاف المشاركة من الشاشة نفسها. أما لعملاء Windows وMac والمتصفح فيصف المزوّد مهام أتمتة ولا يذكر ما إذا كانت تحمل حركة مرور لأشخاص آخرين."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "يُسجَّل عنوان محفظة العقدة وأرقام مدة تشغيلها وإنجازها للمهام على السلسلة كدرجة سمعة (TrustFingerprint). يقول المزوّد إن المهام مجهولة الهوية، وتعمل في بيئة معزولة (sandbox)، وإن مفاتيح المحفظة لا تغادر الجهاز أبدًا. لم يُنشر شيء أكثر تحديدًا."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "على Android يكون الاتصال المشترك باقة جوّال من مشغّل الشبكة: تحذّر وثائق المزوّد نفسه من أن المشاركة قد لا تكون مسموحة وفق سياسات الاستخدام المقبول لدى بعض المشغّلين، وتستهلك حركة المرور المشتركة من رصيد الباقة. أما لعملاء سطح المكتب والمتصفح فلا يذكر المزوّد شيئًا عن شروط مزوّدي الإنترنت."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "عقدة واحدة لكل جهاز، لكل منها رمز Utility NFT خاص بها غير قابل للنقل؛ تشغيل عدة أجهزة مسموح ومشجَّع. لا يوجد حد منشور لكل عنوان IP. لا يوجد حساب بالمعنى المعتاد: الهوية محفظة ينشئها التطبيق عند أول تشغيل."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "مكافآت العقد رموز شبكة اختبار غير ممولة بلا قيمة سوقية، ولم يُدفع منها شيء؛ وعائد APY البالغ 5 إلى 10% على موقعها هدف تصميمي."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "لعملاء سطح المكتب والمتصفح تصف Noderr مهام أتمتة ولا تذكر ما إذا كانت تحمل حركة مرور أشخاص آخرين."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "يقول المزوّد إن المهام مجهولة الهوية وتعمل في بيئة معزولة لكنه لا ينشر شيئًا أكثر تحديدًا."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "لا تزال مرحلة تجريبية على شبكة اختبار Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "لا يشغّل CashPilot خدمة Noderr: أنت تستخدم تطبيق المزوّد أو إضافته، لذا لا يستطيع CashPilot نشرها أو تحديثها نيابة عنك. لم تُراجَع شروطها بشأن الحاويات."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "لا حساب: ينشئ التطبيق محفظة عند أول تشغيل."
  source: "bf85f2f80b20"
nodle.description:
  text: "يستخدم Nodle تقنية Bluetooth في الهواتف الذكية لإنشاء بنية تحتية لإنترنت الأشياء (IoT). يكتشف التطبيق في الخلفية البيانات من أجهزة IoT القريبة وينقلها، ويكسب رموز NODL. ظهر في Forbes، وله شراكات مؤسسية مع Vivendi وHayden AI. للهواتف المحمولة فقط (iOS وAndroid).\n"
