  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "عندما تدفع كتلةٌ رصيدَك إلى ما بعد الحد"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "يدفع OCEAN على السلسلة إلى عنوانك بمجرد أن يبلغ رصيدك غير المدفوع الحد. لا يكتشف CashPilot دفعات Lightning (اختيارية، BOLT12)."
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "غير المدفوع مكتسب لكنه لا يصل حتى يدفعه OCEAN على السلسلة إلى هذا العنوان، ما لم تكن قد فعّلت دفعات Lightning."
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "عنوان الدفع بعملة BTC: اسم المستخدم الذي يستخدمه برنامج التعدين على OCEAN، دون الجزء <b>.workername</b>. وهو عام ولا يتيح الوصول إلى أي أموال."
  source: "53cb5da14daf"
ocean.requirements.note:
