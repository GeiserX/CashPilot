  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "برنامج Flux الخفي (daemon) مفتوح المصدر بموجب ترخيص MIT."
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network سوق حوسبة لامركزي تشارك فيه موارد CPU وGPU مقابل رموز GLM. يشغّل المزوّدون برنامج Yagna الذي يدير تنفيذ أحمال العمل في بيئات معزولة. من أقدم مشاريع الحوسبة اللامركزية (تأسس عام 2016). يدعم مهام CPU وعرض الرسوميات بـ GPU والحوسبة العامة. الدفعات عبر Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "سوق حوسبة لامركزي - رموز GLM عبر برنامج Yagna"
  source: "88f817c25848"
golem.earnings.notes:
  text: "تعتمد الأرباح على العتاد والتسعير والطلب على المهام. العقد التي تعتمد على CPU فقط تكسب أقل. عقد GPU تكسب أكثر لكنها تتطلب NVIDIA. شغّل برنامج المزوّد Yagna (وليس صورة حاوية Docker). الدفعات على Polygon برموز GLM."
  source: "07287d437d51"
golem.payment.frequency:
  text: "عند إكمال كل مهمة"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "تُكسب رموز GLM. اضبط محفظة الدفع في إعداد المزوّد."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "لم يُحدَّد بعد: لم يتحقق CashPilot بعد من المكان الذي تحتفظ فيه هذه الخدمة بأرباحك."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "لا يشغّل CashPilot خدمة Golem: أنت تثبّت برنامج المزوّد بنفسك، لذا لا يستطيع CashPilot نشره أو تحديثه نيابة عنك. يوثّق Golem تشغيل المزوّد في صورة حاوية Docker خاصة به."
