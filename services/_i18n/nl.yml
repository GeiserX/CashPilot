# Dutch translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/nl.yml --restamp '<key>'
2miners-etc.description:
  text: "Volg het onbetaalde Ethereum Classic-saldo dat 2Miners aanhoudt voor je openbare ETC-uitbetalingsadres. Draai je eigen miner en laat die naar de pool wijzen. CashPilot leest het saldo uit en vraagt je uitbetalingen te bevestigen wanneer het saldo daalt.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Ethereum Classic-miningpool, gevolgd via je uitbetalingsadres"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (aanpasbaar)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "De pool controleert je uitbetalingsdrempel elke twee uur"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners betaalt automatisch uit naar je adres zodra je je gekozen drempel bereikt. De laagste drempel voor ETC-uitbetalingen is 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Het onbetaalde saldo wordt bij 2Miners opgebouwd. Het walletsaldo wordt apart uitgelezen van Ethereum Classic. Controleer in je wallet welk bedrag je hebt ontvangen voordat je een uitbetaling in CashPilot bevestigt.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Vul het openbare Ethereum Classic-uitbetalingsadres in dat je miner op 2Miners gebruikt, beginnend met <b>0x</b>. Laat een eventuele workernaam weg.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Vereist een ETCHash-miner die naar 2Miners wijst"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "rekenkracht"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Nee. Je miner stuurt miningwerk naar de pool."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "De pool gebruikt je uitbetalingsadres, de workernamen die je kiest en het IP-adres van je miner."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Iedereen kan statistieken bekijken via het uitbetalingsadres. Om de drempel te wijzigen vraagt de pool om bevestiging van het IP-adres van een worker."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "De pool rekent 1% kosten en houdt uitbetalingen vast tot je drempel is bereikt."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (voorheen ATOR) is een gedecentraliseerd privacynetwerk op basis van onion routing. Node-operators draaien relay-nodes en verdienen ANYONE-tokens voor de bandbreedte die ze bijdragen. Zie het als \"Tor met beloning\". CashPilot draait het vanuit een eigen image, gebouwd uit het ondertekende Debian-pakket van het project, voor amd64 en arm64. De configuratie gebeurt via een anonrc-bestand dat in de container wordt gekoppeld (Nickname, ContactInfo, ORPort, enz.). Een relay verdient niets totdat er 100 ANYONE voor is vastgezet gedurende minstens 180 dagen, en beloningen claim je door in je wallet te ondertekenen. De relay zet je openbare IP-adres ook in de relaylijst van het netwerk, wat de IP-reputatie kan schaden waarvoor residentiële bandbreedte-apps betalen.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Gedecentraliseerde onion routing - Tor-relay-nodes met beloning"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "De ed25519-identiteitssleutel van de relay. Als je die vernietigt, verdwijnt de reputatie van de relay en begint de inkomstengeschiedenis weer bij nul."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Betaalt alleen met 100 ANYONE vastgezet per relay gedurende minstens 180 dagen en een beloningsclaim die je in je wallet ondertekent. Zonder die inzet verdient een relay niets. Met de inzet hangen de inkomsten af van de bijgedragen bandbreedte en de uptime."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Per epoch"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Ingesteld als ContactInfo in anonrc, met het voorvoegsel '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Relay-fingerprints, gescheiden door komma's. Geen online dashboard toont ze. Voor de relay die CashPilot draait: voer <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> uit op de host waarop hij draait. Voor een hardware-relay: open het Relay Control Panel op <b>http://relayup.local</b> en lees Fingerprint af op de pagina Home.\n"
  source: "ffa5be0d4953"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Bandbreedte, als relay in het Anyone-netwerk (een fork van Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Ja. Het stuurt verkeer van andere mensen door. Of jouw IP-adres de laatste hop is, hangt ervan af of de relay als exit is ingesteld."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "De openbare identiteitssleutel van de relay, je IP-adres en poort, en uptimestatistieken, die allemaal bewust in de netwerklijst worden gepubliceerd. Als je ContactInfo in je anonrc instelt, wordt die daar ook gepubliceerd en blijvend en openbaar geïndexeerd — meestal is het een e-mailadres, dus laat het leeg tenzij je wilt dat het openbaar is."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Reëel. Relayverkeer wordt aan jouw verbinding toegeschreven. Vooral exit-relays trekken misbruikklachten aan; veel consumentenproviders verbieden ze."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Er is geen account om voor aan te melden, dus er valt per account niets te beperken. Om te verdienen heb je wel een Ethereum-wallet nodig met 100 ANYONE vastgezet voor elke relay gedurende minstens 180 dagen, en CashPilot heeft de relay-fingerprints nodig om de beloningen uit te lezen. Het project publiceert geen relaylimiet per IP-adres en de catalogus vermeldt er ook geen."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Een relay verdient niets tenzij er minstens 180 dagen 100 ANYONE voor is vastgezet, en elke beloningsclaim onderteken je in je wallet."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Het stuurt bewust verkeer van andere mensen door, zonder te controleren wie dat zijn; exit-relays trekken misbruikklachten aan."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "De identiteit, het IP-adres en de uptime van de relay worden in de netwerklijst gepubliceerd, en elke ContactInfo die je instelt blijft voorgoed openbaar."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Er is geen account om voor aan te melden. Een relay heeft alleen een wallet nodig, zonder identiteitscontrole."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "De relaysoftware is een gepubliceerde fork van Tor, onder de licentie van Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot bouwt een eigen image uit de gepubliceerde relaysoftware van Anyone, waarvoor geen account nodig is."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping is een gedecentraliseerd platform voor netwerkmonitoring dat je betaalt voor het draaien van een node. Je node voert websitemonitoring, latentietests en controles van de netwerkkwaliteit uit voor de klanten van Bitping. Werkt op zowel residentiële als VPS-verbindingen. De Docker-image logt bij de eerste start in met de omgevingsvariabelen BITPING_EMAIL en BITPING_PASSWORD (\"Attempting login with environment variables\" in zijn eigen log) en bewaart daarna de sessie in de volume-mount, zodat herstarts niet opnieuw hoeven te authenticeren.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Bandbreedte delen - gedecentraliseerde netwerkmonitoring, werkt op VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "E-mailadres"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Wachtwoord"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "Het e-mailadres van je Bitping-account (dezelfde login als <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Het wachtwoord van je Bitping-account. Wordt één keer gebruikt om de nodesessie aan te maken, die daarna in het datavolume bewaard blijft."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "De inkomsten hangen af van de netwerkkwaliteit en de vraag naar monitoring vanaf jouw locatie. VPS-nodes worden geaccepteerd."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Node-inkomsten staan op nodes.bitping.com; app.bitping.com is het dashboard voor API-klanten. Opnames gaan alleen in SOL: zodra het onbetaalde saldo meer dan $0.05 is, typ je het Solana-adres in de aanvraag, die binnen 24 uur wordt verwerkt. Een nieuwe of lege Solana-wallet heeft eerst ongeveer 0.001 SOL nodig, voor het rent-minimum van het netwerk."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Nu alleen Solana, en het adres typ je in OP HET MOMENT VAN OPNAME in plaats van dat het wordt opgeslagen."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Gebruik het e-mailadres en wachtwoord van je Bitping-account (dezelfde als op <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Neem je Bitping-saldo op"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping kan inkomsten die langer dan 12 maanden niet zijn opgenomen laten vervallen, na een aankondiging per e-mail 30 dagen vooraf."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Vraag een SOL-opname aan op nodes.bitping.com en typ je Solana-adres in de aanvraag."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Opnames worden betaald in Solana (SOL), naar een adres dat je bij elke aanvraag intypt."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Volgens de helppagina's van Bitping kan een opname naar een nieuwe, lege Solana-wallet mislukken totdat je die wallet zelf met een beetje SOL hebt gevuld."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Volgens de helppagina's van Bitping worden servers en Docker-containers ondersteund."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Voor een opname is alleen een Solana-adres nodig dat je in de aanvraag typt."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit is een dienst voor het delen van bandbreedte die uitbetaalt via PayPal en Stripe. Er is geen officiële Docker-image; de Windows-desktopapp en de Android-app zijn de clients. De dienst staat op bytebenefit.io -- het oude domein bytebenefit.com is opgegeven en staat geparkeerd op een marktplaats, en daarom werd de dienst hier ooit als dood gemarkeerd.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Bandbreedte delen - uitbetaling via PayPal/Stripe, desktop-/Android-app"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Geen Docker-image beschikbaar. Alleen Windows-desktopapp en Android-app."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% van de inkomsten uit verkeer van doorverwezen gebruikers"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "Welkomstbonus van $1 (10.000 Coins)"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "Volgens de Google Play-pagina van de app bedient je verkeer web-intelligence-verzoeken van klanten van Infatica, zonder te zeggen wie dat zijn of hoe ze worden gecontroleerd."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "De Android-app verdween in april 2026 na 17 maanden uit Google Play."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot draait ByteBenefit niet: je gebruikt de eigen app van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "550e4508aba2"
bytelixir.description:
  text: "Met Bytelixir verdien je passief inkomen door ongebruikte internetbandbreedte te delen. Ondersteunt alleen Windows en Android — volgens de officiële FAQ is er geen Linux- of Docker-client gepland, wordt iOS niet ondersteund en is macOS niet beschikbaar. De inkomsten hangen sterk af van je locatie. Webdashboard op dash.bytelixir.com om alles te volgen. Geen Docker-image beschikbaar.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Bandbreedte delen - alleen Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Sessiecookie"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Remember-web-cookie"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "XSRF-token"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Log in op <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, druk op F12 → Application → klap <b>Cookies</b> open in de linkerzijbalk → klik op het subitem <code>https://dash.bytelixir.com</code> → zoek in de cookielijst rechts <code>bytelixir_session</code> → kopieer de Value (een lange JWT die begint met eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Op dezelfde plek (Cookies → <code>https://dash.bytelixir.com</code>) → zoek de cookie met de naam <code>remember_web_...</code> → kopieer de Value (optioneel, verlengt de levensduur van de sessie)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Op dezelfde plek → zoek <code>XSRF-TOKEN</code> → kopieer de Value (optioneel)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "De inkomsten verschillen per locatie ($2-50/maand). Geen Docker-image. Desktopapp of Android-app vereist."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Alleen crypto. Het minimum hangt af van de munt: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Je typt het adres bij elke aanvraag in. Aanvragen worden tijdens kantooruren verwerkt, binnen 24 uur."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Het saldo wordt door Bytelixir aangehouden; het walletadres typ je bij elke uitbetalingsaanvraag in en wordt nooit in de container opgeslagen."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Log in op <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>met Remember Me aangevinkt</b>, druk op F12 → Application → klap <b>Cookies</b> open in de linkerzijbalk → klik op <code>https://dash.bytelixir.com</code> en kopieer dan drie waarden: <b>bytelixir_session</b>, <b>remember_web_…</b> (de lange die met dat voorvoegsel begint) en <b>XSRF-TOKEN</b>. De sessiecookie alleen verloopt ongeveer twee uur nadat je hem kopieert, waardoor het uitlezen dezelfde middag stopt; de remember_web-cookie blijft een jaar geldig en zorgt ervoor dat het blijft werken."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "Levenslang 50% van hun winst"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "Welkomstbonus van $1"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Alleen crypto, en het minimum hangt af van de munt, van $5 voor USDT tot $250 voor Bitcoin."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot draait Bytelixir niet: je gebruikt de eigen app van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Trustpilot geeft een 4.6 op basis van 283 reviews, waarvan de meeste de crypto-uitbetalingen prijzen; een paar melden dat uitbetalingen niet aankomen."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Voor een uitbetaling is alleen een crypto-adres nodig dat je in de aanvraag typt."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai is een peer-to-peer-marktplaats voor GPU's. Je biedt een Linux-machine met NVIDIA-GPU's aan, stelt je eigen spot- en on-demandprijzen in, en huurders draaien er hun eigen Docker-containers op. Je wordt alleen betaald voor de minuten dat hij verhuurd is, in CLORE, BTC, USDT of USDC. Voor hosting is een x86_64-machine nodig met Ubuntu 22.04 of nieuwer (of HiveOS), een werkende NVIDIA-driver en minstens 100 Mbps up en down. AMD-GPU's worden niet ondersteund.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "GPU-marktplaats - verhuur NVIDIA-GPU's, betaald in CLORE, BTC of USD-stablecoins"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Je wordt alleen betaald voor verhuurde minuten, tegen de prijs die je zelf instelt. De bovenkant van de marge, $490, is het eigen plafond van Clore voor één RTX 4090 die per minuut wordt aangeboden ('up to ~$490/month'); kleinere kaarten verdienen minder en een ongebruikte kaart verdient niets. Clore houdt 5% (on-demand) of 1.25% (spot) van elke verhuur in, plus 15% als de huurder in BTC, USDT of USDC betaalt in plaats van in CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Neem op via Account > Billing naar je eigen wallet: CLORE (ERC-20, minimum 200, kosten ongeveer $0.50), BTC (minimum 0.0001, kosten 0.00005 BTC) of USDT/USDC op Ethereum of BNB Chain (minimum $10, kosten $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore houdt het saldo aan (CLORE, BTC en één USD-saldo voor USDT/USDC) totdat je opneemt. De chain kies je per opname: Ethereum voor CLORE, Bitcoin voor BTC, Ethereum of BNB Chain voor USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (standaardniveau) van de platformkosten die de hosts en huurders die je doorverwijst betalen, bij elke verhuur; de code verloopt nooit; uitbetaald in de valuta van de verhuur (CLORE, BTC of USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps up en down"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "GPU-rekentijd op je machine."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Ja. Huurders draaien hun eigen Docker-containers op je machine, en hun verkeer gaat via jouw verbinding naar buiten; SSH- en applicatiepoorten worden naar het internet doorgestuurd."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Het privacybeleid van Clore omvat accountgegevens en je IP-adres met een geschatte locatie; identiteitsdocumenten alleen als Clore om KYC vraagt."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Inkomende poorten moeten vanaf het internet bereikbaar zijn (standaard 22, 8080 en 3000-4000) en workloads van vreemden draaien op jouw lijn. Volgens de eigen netwerkhandleiding van Clore blokkeren sommige internetproviders hosting."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "18 jaar of ouder, niet in een land onder sancties. Clore kan een account naar eigen goeddunken opschorten of sluiten, en verboden gebruik kan je het tegoed kosten."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Noch de voorwaarden noch het privacybeleid noemen een rechtspersoon, en de voorwaarden laten het toepasselijke rechtsgebied over aan een latere versie."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore kan een account naar eigen goeddunken opschorten of sluiten, en verboden gebruik kan leiden tot verbeurdverklaring van het tegoed."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Uitbetalingen gaan alleen in crypto (CLORE, BTC, USDT of USDC), en Clore neemt 15% extra van een verhuur die de huurder in BTC, USDT of USDC betaalt, tenzij de host CLORE vastzet om dat te verlagen."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Een host wordt alleen betaald voor verhuurde minuten, en het bedrag dat Clore noemt voor een RTX 4090 is een plafond (\"up to ~$490/month\") voor één kaart."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "Voor basisgebruik is geen KYC nodig, maar Clore kan om identiteitsverificatie vragen bij grote opnames of om nalevingsredenen."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Huurders draaien elke willekeurige openbare Docker-image op je machine. De voorwaarden noemen verboden gebruik (malware, DDoS, CSAM en meer), maar we vonden geen beschrijving van hoe huurders worden gecontroleerd."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot draait Clore.ai niet: je installeert de hostingagent van Clore op je eigen GPU-machine (Ubuntu 22.04 of nieuwer, of HiveOS), dus CashPilot kan die niet voor je uitrollen of bijwerken."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Clore houdt 5% van een on-demandverhuur in (1.25% bij spot) als de huurder in CLORE betaalt, zonder extra kosten."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN draait een validatornetwerk dat bandbreedte en dekking controleert voor de AI-infrastructuur die via het DAWN-protocol wordt gefinancierd. De browserextensie DAWN Validator neemt deel aan deze proof-of-bandwidth- en dekkingscontroles en verdient DAWN-beloningen zolang hij draait. De beloningen hebben nog geen vaste geldwaarde. Maak het account aan in de extensie en vul verwijzingscode 2QLQV97F in wanneer daarom wordt gevraagd.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "DePIN-validator - browserextensie verdient DAWN-punten"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Verdient Dawn Points vóór de tokenlancering. De werkelijke waarde hangt af van de toekomstige tokenprijs. Een hardwarebox verdient meer dan de browserextensie."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Token-airdrop (nog niet bekend)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "De extensie werkt, maar is nog niet af. Black Box-hardware is aangekondigd. Later opnieuw bekijken."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "De extensie verdient punten; in oktober 2026 was er nog geen tokenverdeling aan node-operators bevestigd."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "Punten hebben geen vaste waarde totdat er een token wordt gelanceerd en de omrekening wordt aangekondigd."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot draait Dawn niet: je gebruikt de eigen browserextensie van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network is een gedecentraliseerd VPN- en web3-infrastructuurproject. Vereist vooral eigen Deeper Connect-hardware. Moken is een verwant mining-/stakingplatform. Niet alleen software.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "Gedecentraliseerde VPN - vereist eigen hardware van de aanbieder"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Vereist Deeper Connect-hardware ($200-500). Moken-platform voor mining/staking. Niet alleen software."
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "Doorlopend"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "Commissie op de verkoop van het apparaat"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "5% korting op het Deeper Connect-apparaat met kortingscode SERGIO"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "Miningbeloningen zijn in DPR en hangen af van een kredietscore die langzaam groeit of door DPR te staken."
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot draait Deeper Network niet: je gebruikt de eigen routerhardware van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "b1ba1636070f"
earnapp.description:
  text: "Met EarnApp van Bright Data verkoop je je ongebruikte bandbreedte voor passief inkomen. Bright Data is het grootste proxynetwerk ter wereld en verzorgt dataverzameling voor Fortune 500-bedrijven. CashPilot draait het vanuit een eigen image, die bij de eerste start de vastgepinde EarnApp-build van het CDN van Bright Data downloadt, de sha256 controleert en hem in lite-modus draait met alleen een UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Bandbreedte delen - gesteund door Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "Node-UUID"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "Je EarnApp-node-ID: sdk-node- gevolgd door 32 hexadecimale tekens in kleine letters, zoals 'earnapp showid' het toont. Koppel hem na het uitrollen één keer door https://earnapp.com/r/ gevolgd door deze UUID te openen terwijl je bij EarnApp bent ingelogd; een niet-gekoppelde node verdient wel, maar er komt niets op je saldo"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp kan zijn servers steeds niet bereiken en herstart telkens, waardoor hij weinig of niets verdient. Herstart deze kopie; als het blijft gebeuren, controleer dan de internetverbinding van deze machine."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Open deze link terwijl je bij EarnApp bent ingelogd om de node aan je account toe te voegen. Tot je dat doet, verdient de node wel, maar komt er niets op je saldo."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Sterk afhankelijk van je locatie. IP-adressen in de VS/EU verdienen het meest. De inkomsten groeien mee met de verbruikte bandbreedte."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Op aanvraag (automatisch inwisselen mogelijk: PayPal min. $10, Wise min. $10, Amazon min. $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Zet automatisch inwisselen één keer aan en EarnApp betaalt vanzelf uit zodra het saldo het minimum van de methode bereikt: PayPal $10, Wise $10, Amazon $50. PayPal-betalingen komen binnen van Bright Data Ltd. In oktober 2026 kwam een PayPal-betaling ongeveer 2% lager binnen dan het ingewisselde saldo."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Het saldo wordt door EarnApp aangehouden; ingewisseld via Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Log in op <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, druk op F12 → Application → Cookies en kopieer de waarde van <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "Levenslang 10% van hun inkomsten, bovenop die van hen uitbetaald"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "Volgens het helpcentrum van EarnApp is installatie in Docker-containers, virtuele machines, hostingdiensten of thuisservers strikt verboden, en zo draait CashPilot het juist."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "Hetzelfde helpartikel zegt dat een account dat zo wordt gebruikt zonder waarschuwing wordt beëindigd en dat de openstaande betalingen worden geannuleerd."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Onze PayPal-uitbetaling kwam in oktober 2026 binnen, ongeveer 2% lager dan het ingewisselde saldo."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "Een minimum van $10 voor PayPal en Wise, met automatisch inwisselen dat vanzelf uitbetaalt."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp is van Bright Data, en de PayPal-betalingen komen binnen van Bright Data Ltd., een bedrijf met een naam."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm betaalt je voor het delen van je internetbandbreedte. De inkomstencollector gebruikt authenticatie met e-mailadres en wachtwoord via Supabase. Lichtgewicht Docker-image die eenvoudig uit te rollen is (de Docker-client gebruikt een apart UUID-token).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "Bandbreedte delen - inloggen met e-mail/wachtwoord, lichtgewicht client"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "API-sleutel"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "Log in op <a href=\"https://app.earn.fm\">app.earn.fm</a> → klik op je profielpictogram (rechtsboven) → Account Settings → kopieer de API Key (UUID-formaat)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "Relatief nieuw platform. De inkomsten verschillen per locatie en beschikbare bandbreedte."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "Minimum $15. Methoden: USDT op BEP20 of Polygon ($1 kosten) of TRC20 ($3 kosten), PayPal, cadeaukaarten van Amazon of Starbucks vanaf $15, of een bankoverschrijving vanaf $1.000 waarbij de overboekingskosten worden ingehouden. Vóór de eerste uitbetaling vul je een factuurprofiel in (wettelijke naam en adres), dat wordt gebruikt voor de uitbetalingsbewijzen."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "Het saldo wordt door Earn.fm aangehouden; opgenomen op aanvraag."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Gebruik het e-mailadres en wachtwoord van je Earn.fm-account (dezelfde als de login op <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "Levenslang 10% van hun inkomsten"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "$5 startsaldo"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "Een minimum van $15, $1 tot $3 kosten bij USDT, en een bankoverschrijving pas vanaf $1.000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Vóór de eerste uitbetaling vul je een factuurprofiel in met je wettelijke naam en adres."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Reviewers melden in 2025 dat support via e-mail en Discord niet reageert; Trustpilot vermeldt dat Earn.fm niet op negatieve reviews heeft gereageerd."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Earn.fm publiceert een eigen Docker-image, earnfm/earnfm-client."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher is een platform voor verkeersuitwisseling waarop je credits verdient door websites te bezoeken via een geautomatiseerde surfbar. Draait als browserextensie/add-on. Geen traditionele dienst voor het delen van bandbreedte — het genereert verkeer door automatisch websites te bezoeken.\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "Surfbar voor verkeersuitwisseling - browserextensie"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "Inkomsten in BTP-punten die in EUR kunnen worden omgezet. Alleen browserextensie."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "Uitbetaling in euro via PayPal of bankoverschrijving."
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "CashPilot draait eBesucher niet: het is een browserextensie, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "Uitbetalingen vanaf 2 euro via PayPal of SEPA, minstens wekelijks, zonder kosten."
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "eBesucher bestaat sinds 2002."
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "Het impressum noemt de exploitant, TurboAd GmbH, ingeschreven in Berlin-Charlottenburg (HRB 160730 B)."
  source: "84cbddd4330b"
flux.description:
  text: "Flux is een wereldwijd gespreide rekeninfrastructuur. Node-operators staken FLUX-tokens en leveren serverresources. Drie niveaus: Cumulus (1.000 FLUX), Nimbus (12.500 FLUX), Stratus (40.000 FLUX). Officiële Docker-images beschikbaar.\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "Gedecentraliseerde rekenkracht - vereist een inzet van FLUX-tokens"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "Vereist een inzet van 1.000+ FLUX (~$50-500, afhankelijk van de koers). Hogere niveaus vereisen meer onderpand, maar verdienen meer."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "Blokbeloningen"
  source: "590433237f8a"
flux.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "Het kleinste node-niveau vereist 1.000 FLUX die als onderpand worden vastgezet."
  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "De blokbeloning daalt elk jaar met 10%, en volgens een handleiding uit 2026 zijn de beloningen op het kleine niveau in dollars gemeten zwak."
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "CashPilot draait Flux niet: je gebruikt de eigen nodesoftware van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "De Flux-daemon is open source onder de MIT-licentie."
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network is een gedecentraliseerde marktplaats voor rekenkracht waarop je CPU- en GPU-resources deelt in ruil voor GLM-tokens. Aanbieders draaien de Yagna-agent, die de uitvoering van workloads in afgeschermde omgevingen (sandboxes) beheert. Een van de oudste gedecentraliseerde rekenprojecten (opgericht in 2016). Ondersteunt CPU-taken, GPU-rendering en rekenwerk voor algemene doeleinden. Betalingen via Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Gedecentraliseerde marktplaats voor rekenkracht - GLM-tokens via de Yagna-agent"
  source: "88f817c25848"
golem.earnings.notes:
  text: "De inkomsten hangen af van hardware, prijzen en de vraag naar taken. Nodes met alleen CPU verdienen minder. GPU-nodes verdienen meer, maar vereisen NVIDIA. Draai de Yagna-provideragent (geen Docker-image). Betalingen op Polygon in GLM-tokens."
  source: "07287d437d51"
golem.payment.frequency:
  text: "Per voltooide taak"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "Je verdient GLM-tokens. Stel de uitbetalingswallet in bij de providerinstellingen."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot draait Golem niet: je installeert de provideragent zelf, dus CashPilot kan die niet voor je uitrollen of bijwerken. Golem documenteert hoe je de provider in een eigen Docker-image draait."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "De provideragent, yagna, is open source onder de GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Geen account: je stelt een uitbetalingswallet in bij de providerinstellingen."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "Het netwerk draait al ongeveer tien jaar."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Het privacybeleid van Golem noemt de exploitant, Golem Factory GmbH in Zug, Zwitserland."
  source: "bae79b651923"
grass.description:
  text: "Grass is een gedecentraliseerd netwerk waarmee je je ongebruikte bandbreedte verkoopt voor AI-trainingsdata. Het werkt als browserextensie en desktopapp en stuurt webscrapingverzoeken via je verbinding om gestructureerde datasets op te bouwen. Met 8.5M+ gebruikers is het een van de grootste DePIN-bandbreedtenetwerken. Verdient GRASS-tokens op de Solana-blockchain.\n"
  source: "046951d812f9"
grass.short_description:
  text: "DePIN-bandbreedte delen voor AI-data - verdient GRASS-tokens"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Toegangstoken"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Log in op <a href=\"https://app.grass.io\">app.grass.io</a>, druk op F12 → Application → Local Storage → klik op <code>https://app.grass.io</code> → kopieer de waarde van <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Verdient Grass Points die via airdrops in GRASS-tokens kunnen worden omgezet. De werkelijke waarde in USD hangt af van de tokenprijs. Browserextensie of desktopapp vereist."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Airdrop per epoch"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Beloningen komen als periodieke uitkeringen die je op het Grass-dashboard claimt. De Stage 2-uitkering (activiteit van oktober 2024 tot juni 2026) wordt in USDC betaald: claim die op app.grass.io/dashboard uiterlijk op 22 januari 2027, of eerder als alle toewijzingen al eerder zijn geclaimd. Grass houdt niet-geclaimde beloningen."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "Bouwt PUNTEN op; GRASS wordt tijdens periodieke airdrops geclaimd via het Grass-dashboard."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Log in op <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, druk op F12 → Application → Local Storage en kopieer de waarde van <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% van de uptimepunten van directe doorverwijzingen, 10% op het tweede niveau, 5% op het derde"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Claim je Grass Stage 2-USDC"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Grass houdt elke Stage 2-toewijzing die niet uiterlijk op 22 jan 2027 is geclaimd, en de periode kan eerder sluiten zodra alle toewijzingen zijn geclaimd."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Log in op app.grass.io met het account dat je in Stage 2 gebruikte, activeer de Grass Wallet, open het tabblad Allocation en bevestig. Claim alleen op app.grass.io. Geen Stage 2-punten? Kies Niet voor mij."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Beloningen komen alleen via airdrop-seizoenen. Node-operators die al lang meedraaien, meldden schattingen voor seizoen 2 van enkele tot een paar tientallen dollars."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "Beloningen van seizoen 2 die niet uiterlijk op 22 januari 2027 zijn geclaimd, gaan voorgoed verloren."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "De eerste airdrop leidde tot kritiek op de lage beloning per punt, verdeeld over meer dan twee miljoen gebruikers."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot draait Grass niet: je gebruikt de eigen app of extensie van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "De eerste airdrop bereikte bijna 1.5 miljoen claimende adressen."
  source: "a4c55e10affa"
helium.description:
  text: "Helium is een gevestigd gedecentraliseerd draadloos netwerk. Oorspronkelijk LoRaWAN-hotspots, nu uitgebreid naar 5G. Vereist speciale hardware ($500+). Verdient HNT-/MOBILE-tokens. Het rendement is flink gedaald - meestal $4-8/maand.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "Gedecentraliseerd draadloos netwerk - vereist hardware, HNT-tokens"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "Vereist de aankoop van hardware van $500+. Het rendement is flink gedaald. Goedkeuringsprocedure voor nieuwe operators."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "Per epoch"
  source: "75743e03bad2"
helium.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149 heeft de Proof-of-Coverage-beloningen op 6 juli 2026 stopgezet; IoT-hotspots verdienen nu alleen nog voor data die ze doorgeven, en meer dan 114.000 ervan gaven helemaal niets door."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Het beloningsmodel van Helium is meerdere keren per stemming gewijzigd, de CEO is afgetreden en HNT is ongeveer 96% gedaald."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot draait Helium niet: je gebruikt de eigen hotspothardware van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "De gatewaysoftware van de hotspot is open source onder de Apache-2.0-licentie."
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "Volg het onbetaalde Kaspa-saldo dat HeroMiners aanhoudt voor je openbare uitbetalingsadres. Draai je eigen Kaspa-miner en laat die naar de pool wijzen. CashPilot leest het poolsaldo uit en vraagt je uitbetalingen te bevestigen wanneer het saldo daalt.\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
  text: "Kaspa-miningpool, gevolgd via je uitbetalingsadres"
  source: "92c5784dcf30"
herominers-kas.payment.minimum_payout:
  text: "1 KAS (aanpasbaar)"
  source: "d33ca7065ff9"
herominers-kas.payment.frequency:
  text: "De pool controleert je uitbetalingsdrempel elk uur"
  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "HeroMiners betaalt automatisch uit naar je adres zodra je je gekozen drempel bereikt. De laagste drempel is 1 KAS.\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "Het saldo wordt bij HeroMiners opgebouwd. Controleer in je wallet welk bedrag je hebt ontvangen voordat je een uitbetaling in CashPilot bevestigt.\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "Vul het volledige openbare Kaspa-uitbetalingsadres in dat je miner op HeroMiners gebruikt. Neem het voorvoegsel <b>kaspa:</b> mee en laat de workernaam weg.\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "Vereist een Kaspa-miner die naar HeroMiners wijst"
  source: "898e36e7a701"
herominers-kas.disclosure.sells:
  text: "rekenkracht"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "Nee. Je miner stuurt miningwerk naar de pool."
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "De openbare statistieken van de pool tonen elk uitbetalingsadres en de bijbehorende miningactiviteit."
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "De pool gebruikt je uitbetalingsadres in plaats van een account."
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "De pool rekent 0.9% kosten en houdt uitbetalingen vast tot je drempel is bereikt."
  source: "7eb2950589fa"
honeygain.description:
  text: "Deel je ongebruikte internetbandbreedte en verdien passief inkomen. Honeygain stuurt verkeer voor web intelligence, contentlevering en marktonderzoek via je verbinding. Een van de meest gevestigde platforms voor het delen van bandbreedte, met 12M+ gebruikers en meer dan 1M voltooide uitbetalingen.\n"
  source: "b219f969ba34"
honeygain.short_description:
  text: "Bandbreedte delen - het meest gevestigde platform"
  source: "c0542c471f29"
honeygain.docker.env.HONEYGAIN_EMAIL.label:
  text: "E-mailadres"
  source: "969ccbd3cf63"
honeygain.docker.env.HONEYGAIN_PASSWORD.label:
  text: "Wachtwoord"
  source: "e7cf3ef4f17c"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.label:
  text: "Apparaatnaam"
  source: "155106be1173"
honeygain.docker.env.HONEYGAIN_EMAIL.description:
  text: "Het e-mailadres van je Honeygain-account"
  source: "482869cea18f"
honeygain.docker.env.HONEYGAIN_PASSWORD.description:
  text: "Het wachtwoord van je Honeygain-account"
  source: "f3ba1584b384"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.description:
  text: "Naam die in je Honeygain-dashboard wordt getoond"
  source: "a3ba173cae35"
honeygain.earnings.notes:
  text: "Verschilt per locatie. IP-adressen in de VS/EU verdienen meer. Max. 10 apparaten per account."
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "Minimum $20 (20.000 credits). Twee opties: PayPal via Tipalti, met ongeveer 15% kosten, of JumpTask-credits zonder kosten, uitbetaald in een JumpTask-wallet. Voor een aanvraag is een 6-cijferige code nodig die per e-mail wordt verstuurd. De eerste PayPal-uitbetaling blijft op \"waiting for details\" staan totdat je je bij Tipalti registreert via de link die ze je mailen. Die link werkt maar één keer, dus open hem wanneer je alles in één keer kunt afronden en je telefoon bij de hand hebt: nadat je een wachtwoord hebt ingesteld, laat Tipalti je een mobiel nummer per sms bevestigen (de codes verlopen binnen enkele minuten), en daarna vraagt het om je naam, adres, land en geboortedatum, en je PayPal-adres. Tipalti rekent $2.02 per betaling; kies USD om de valutaomrekeningskosten van 1.9-3% te vermijden. De betaling volgt binnen 2 werkdagen. Het saldo verdwijnt van je account zodra je de aanvraag doet, ook terwijl de uitbetaling op Tipalti wacht. Bij elke volgende Tipalti-login wordt een nieuwe sms-code verstuurd, tenzij je de optie aanvinkt om het apparaat 30 dagen te onthouden. In oktober 2026 vroeg Tipalti een ontvanger in Spanje niet om een belastingformulier."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Het saldo wordt door Honeygain aangehouden; opgenomen op aanvraag."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Gebruik het e-mailadres en wachtwoord van je Honeygain-account (dezelfde als op <a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a>)."
  source: "fd0be22aeb14"
honeygain.referral.bonus.referrer:
  text: "Tot 25% van de inkomsten van elke doorverwezen vriend in Honeygain-modus"
  source: "30385153a66b"
honeygain.referral.bonus.referee:
  text: "$3 aanmeldbonus met deze link"
  source: "9ee5d2215305"
honeygain.obligations.withdraw-before-24-month-write-off.title:
  text: "Neem je Honeygain-saldo op"
  source: "0868662c5a12"
honeygain.obligations.keep-active-6-months.title:
  text: "Laat een Honeygain-apparaat delen, of vraag een uitbetaling aan"
  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "Inkomsten blijven 24 maanden geldig nadat ze het minimum van $20 hebben bereikt. Daarna kan Honeygain afboeken wat niet is uitbetaald."
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
  text: "Als de app langer dan 6 maanden niet wordt gebruikt, beschouwt Honeygain het onbetaalde saldo als verlopen, ook als het onder $20 is."
  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "Laat een apparaat delen, of vraag een uitbetaling aan. In JumpTask-modus is een gelijkblijvend saldo normaal, dus kies dan Niet voor mij."
  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "Volgens de voorwaarden mag Honeygain inkomsten afboeken die de drempel van $20 hebben bereikt en niet binnen 24 maanden zijn uitbetaald, en inkomsten na zes maanden zonder gebruik als verlopen beschouwen."
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "Het minimum is $20, en PayPal-uitbetalingen lopen via Tipalti, dat $2.02 per betaling rekent."
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "Volgens de voorwaarden mag Honeygain een account opschorten en inkomsten inhouden of afboeken waarvan het vindt dat ze onder valse voorwendselen zijn opgebouwd."
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "Vóór de eerste PayPal-uitbetaling laat Tipalti je een mobiel nummer per sms bevestigen en je naam, adres en geboortedatum opgeven."
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "Volgens de voorwaarden gebruiken zakelijke klanten het verkeer om openbaar beschikbare webdata te verzamelen, maar er wordt geen klant genoemd, en je kunt niet weten welke klant je verbinding gebruikt."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "In de eigen reacties van Honeygain op reviews over lage inkomsten staat dat de inkomsten afhangen van de vraag op het netwerk en de locatie; reviewers melden dat het heel lang duurt om het minimum van $20 te bereiken."
  source: "634fb331e65b"
honeygain.rating.pros.0.text:
  text: "Honeygain publiceert een eigen Docker-image, honeygain/honeygain."
  source: "ea44bd3c855c"
honeygain.rating.pros.1.text:
  text: "De voorwaarden noemen de exploitant, Honeygain UAB, ingeschreven in Vilnius, Litouwen."
  source: "579a169fcf35"
honeygain.rating.pros.2.text:
  text: "Volgens de perspagina van Honeygain is het in 2019 opgericht."
  source: "a3bfbdb33f54"
ionet.description:
  text: "io.net is een gedecentraliseerd GPU-netwerk voor AI/ML-workloads. Het bundelt ongebruikte GPU's van consumenten en datacenters. Vereist een NVIDIA-GPU met 8GB+ VRAM voor noemenswaardige inkomsten. Uitrollen op basis van containers wordt ondersteund.\n"
  source: "5d017f77f0ac"
ionet.short_description:
  text: "Gedecentraliseerd GPU-netwerk voor AI - NVIDIA-GPU vereist"
  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "Vereist een NVIDIA-GPU met 8GB+ VRAM. Er wordt beweerd dat een RTX 4090 $500-1000/maand oplevert (in de praktijk waarschijnlijk minder)."
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "Per epoch"
  source: "75743e03bad2"
ionet.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "Beloningen voor leveranciers werden betaald uit tokenuitgifte, ongeacht betaalde opdrachten, en GPU-eigenaren melden dat hun hardware meestal ongebruikt blijft."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "Beloningen zijn in de IO-token, en het uitbetalingsmodel is in 2026 veranderd naar een systeem dat aan de dollar is gekoppeld."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "In april 2024 probeerden ongeveer 1.8 miljoen nep-GPU's zich aan te sluiten via een uitgelekt authenticatietoken, en de CEO trad later af vóór de tokenlancering."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "CashPilot draait io.net niet: je gebruikt de eigen workersoftware van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "1cac289c99ad"
iproyal.description:
  text: "Met IPRoyal Pawns verdien je door je ongebruikte bandbreedte te delen. IPRoyal is een gevestigde proxyaanbieder, en Pawns is hun tak voor het delen van residentiële bandbreedte. De CLI-Docker-image accepteert inloggegevens via opdrachtregelvlaggen. Een nieuwe gebruiker die zich via een verwijzingslink aanmeldt, krijgt $1 bij elk van de eerste drie uitbetalingen, tot $3. Elke uitbetaling moet binnen een periode van één tot drie weken vallen, afhankelijk van de locatie. De periode begint bij de aanmelding en begint opnieuw na elke uitbetaling. Als een periode eerder afloopt, vervallen de resterende bonussen.\n"
  source: "b12878d5917a"
iproyal.short_description:
  text: "Bandbreedte delen - tot $3 bonus op je eerste uitbetalingen"
  source: "20091c7b26ed"
