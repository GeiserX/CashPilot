  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream weigert het IP-adres van deze kopie omdat het niet residentieel is, dus verdient hij niets. Draai hem op een machine met een internetverbinding via een thuislijn, of verwijder deze kopie."
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "PacketStream heeft al een andere client op dit IP-adres, en betaalt er maar één per IP-adres. Verwijder deze kopie, of de andere die hetzelfde IP-adres gebruikt."
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "Betaalt $0.10/GB voor gedeelde bandbreedte. De inkomsten hangen sterk af van de vraag naar de locatie van je IP-adres."
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "Alleen PayPal, minimum $5, 3% kosten die worden getoond voordat je bevestigt. Bij de eerste opname wordt je PayPal-e-mailadres opgeslagen; het later wijzigen vereist een bevestiging per e-mail en een wachttijd van 7 dagen, dus controleer het adres voordat je bevestigt. Aanvragen worden beoordeeld en binnen 7 dagen verzonden; je kunt een aanvraag annuleren zolang die wacht, en een nieuwe kan pas worden gedaan zodra de vorige is uitbetaald."
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "Het saldo wordt door PacketStream aangehouden; opgenomen op aanvraag."
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "Log in op <a href='https://packetstream.io' target='_blank'>packetstream.io</a>, druk op F12 → Application → Cookies en kopieer de waarde van de cookie <b>auth</b> (het is een JWT)."
  source: "15bae9d455f5"
packetstream.referral.bonus.referrer:
  text: "20% van hun bandbreedte-inkomsten (tijdelijke Packeter-bonus)"
  source: "964a44bb9e65"
packetstream.referral.bonus.referee:
  text: "10% bonustegoed op je eerste storting met kaart of PayPal (proxyklanten)"
  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "Trustpilot-reviewers melden in 2025 en 2026 dat uitbetalingen te laat of helemaal niet aankomen, en een gebruiker die het al lang gebruikt, zegt dat uitbetalingen trager werden en daarna stopten; anderen melden in 2026 dat ze wel zijn betaald."
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "Alleen PayPal, met 3% uitbetalingskosten; gebruikers in landen waar PayPal niet beschikbaar is, hebben geen andere methode."
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "Volgens de voorwaarden mag PacketStream inkomsten inhouden, terugdraaien of ongeldig verklaren die het in verband brengt met fraude, manipulatie of verboden activiteiten."
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
