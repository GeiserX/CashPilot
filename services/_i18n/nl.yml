mysterium.description:
  text: "MystNodes (Mysterium Network) is een gedecentraliseerd VPN- en proxynetwerk op basis van blockchaintechnologie. Je verdient MYST-tokens door een node te draaien die VPN-, proxy- en datascrapingdiensten aan gebruikers levert. Vereist de capabilities NET_ADMIN, SETUID en SETGID en een TUN-apparaat, dat het binnen een eigen netwerknamespace op de afgeschermde bridge voor verdien-apps gebruikt. Bevat een ingebouwde web-UI voor het beheer van de node. Werkt op zowel residentiële als VPS-verbindingen, maar de verwijzingsbonus wordt alleen betaald voor nodes op een residentieel IP-adres.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Gedecentraliseerde VPN-node - op basis van blockchain, werkt op VPS"
  source: "ad1413ac81fa"
