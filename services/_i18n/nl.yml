xmrig.earnings.notes:
  text: "Bruto schatting vóór stroomkosten. Op 2026-11-25 was 1 kH/s ongeveer $1 per maand waard, bij de waargenomen XMR-koers en netwerkmoeilijkheid. Een desktop-CPU op de helft van zijn threads kan 30 tot 50 W extra verbruiken. Controleer je werkelijke verbruik en je stroomprijs om te zien of het loont."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, nadat je de drempel verlaagt)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Wanneer de pooldrempel is bereikt"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "De pool betaalt uit naar je Monero-adres wanneer je saldo je drempel bereikt. De pool houdt het saldo aan totdat hij je uitbetaalt."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Deze machine meldt een hostingverbinding. Controleer de voorwaarden van je provider voordat je gaat minen. Sommige providers, waaronder Hetzner Cloud, verbieden het. Controleer je werkelijke stroomkosten voordat je op een winstschatting vertrouwt."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "MoneroOcean, de standaardpool, rekent 0% miningkosten. De standaarddrempel voor uitbetaling is 0.3 XMR, en je kunt die verlagen naar 0.003 XMR. Uitbetalingen onder 4 XMR kunnen tot 0.0004 XMR kosten. Andere pools hanteren hun eigen tarieven en drempels."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "rekenkracht"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
