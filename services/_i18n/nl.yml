  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "De hostadressen waarop de WebUI van de node (poort 4449) wordt gepubliceerd. Met 127.0.0.1 blijft die op deze machine. Om hem via een reverse proxy te bereiken, voeg je het adres toe waarmee de proxy verbinding maakt, gescheiden door komma's zonder spaties: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "De UDP-poorten die de node voor VPN-sessies gebruikt, als start:end. Stuur ditzelfde bereik door op je router. Elke sessie neemt ongeveer twee poorten in, dus de standaard 30 poorten dragen ongeveer 15 sessies tegelijk, meer dan een thuisnode krijgt. Een groter bereik lost niets op en kost meer: elke gepubliceerde poort vertraagt het starten en verwijderen van de node (300 poorten kosten ongeveer 12 s om te starten), CashPilot accepteert er maximaal 300, en met de standaard userland-proxy van Docker neemt elke poort ook ongeveer 2.5 MB geheugen in. Als alle sessies mislukken, is dat een routerprobleem, geen tekort aan poorten: zie \"Routers that rewrite UDP source ports\" in de Mysterium-handleiding. Blijf onder 32768: poorten 32768-60999 zijn het ephemeral bereik van Linux, waar elk programma op de host er even een kan bezetten, en één bezette poort laat het starten van de node mislukken. Een node die al een bereik heeft, houdt dat."
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "Keystore met de identiteit van de node. Als je die vernietigt, ontstaat er een gloednieuwe identiteit: de node verliest zijn reputatie en alle inkomsten die nog op de oude identiteit staan."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "De node kan in zijn container geen sudo uitvoeren, dus kan hij zijn VPN-interface of firewall niet configureren en mislukt elke sessie bij het opzetten: hij lijkt online, maar verdient niets. De container is aangemaakt zonder de capabilities SETUID en SETGID. Werk CashPilot en de worker waarop deze node draait bij en rol Mysterium daarna opnieuw uit vanaf het dashboard; de identiteit van de node staat in zijn datavolume en blijft behouden."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "Geen enkele VPN-sessie in de afgelopen 6 uur bereikte deze node rechtstreeks. Elke sessie viel terug op hole punching, en veel kopers krijgen op die manier geen verbinding, dus de node verdient minder. De UDP-poorten zijn niet bereikbaar vanaf het internet. Stuur op je router het UDP-poortbereik ${UDP_PORTS} (start:end, aan beide kanten hetzelfde bereik) door naar ${HOST_ADDRESS}. Dit verdwijnt vanzelf zodra een sessie rechtstreeks verbinding maakt."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "De monitoring van Mysterium markeert de node op ${WORKER_NAME} als mislukt, waardoor hij niet in de nodelijst staat waaruit de meeste kopers kiezen, zelfs als zijn eigen controle zegt dat elke poort bereikbaar is. Controleer eerst of de node /dev/net/tun en SETUID/SETGID heeft, want die laten hem op dezelfde manier mislukken: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Als die in orde zijn, is een veelvoorkomende oorzaak dat de router vóór ${WORKER_NAME} de UDP-bronpoort van de antwoorden van de node herschrijft zodra een pakket van buitenaf die poort heeft bereikt. Zie de test in de handleiding: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "De laatste vijf VPN-sessies van de node op ${WORKER_NAME} eindigden elk na ongeveer een minuut zonder dat er data was verplaatst, dus hij verdient niets terwijl hij online lijkt. De waarschijnlijke oorzaak is de router vóór ${WORKER_NAME}: zodra een pakket van buitenaf een poort bereikt, herschrijft die de bronpoort van de latere antwoorden van de node vanaf die poort, en elke sessie begint met zo'n pakket (de eigen poortcontrole van de node), dus kopers negeren de antwoorden van de node. Een groter poortbereik helpt niet. Zie de test en de oplossingen in de handleiding: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Dit verdwijnt zodra een sessie data overdraagt."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Inkomsten in MYST-tokens. Residentiële IP-adressen verdienen aanzienlijk meer. De WebUI van de node op poort 4449 is voor beheer en wordt standaard alleen gepubliceerd op de machine waarop hij draait (127.0.0.1); open vanaf een andere machine eerst een SSH-tunnel (ssh -L 14449:127.0.0.1:4449 gevolgd door het adres van de machine van de node, en ga dan naar http://127.0.0.1:14449; lokale poort 14449, zodat die niet botst met een node op je eigen machine), of voeg een adres toe aan UI_ADDRESS (zie WebUI-adres in de Mysterium-handleiding). VPS wordt geaccepteerd. Port forwarding van UDP 23000-23029 (de standaard van UDP_PORTS) wordt sterk aanbevolen -- zonder krijgen nodes de status Strict NAT en mislukken veel VPN-sessies, wat de inkomsten sterk verlaagt. Belangrijk: stel na de eerste start je beneficiary-wallet (settlement) in via de WebUI of de CLI van de node, zodat die overeenkomt met je mystnodes.com-account -- zo worden de on-chain inkomsten aan je clouddashboard gekoppeld."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Automatische on-chain afrekening telkens wanneer een node 5 MYST niet-afgerekend heeft staan"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Er is geen knop om op te drukken. Elke node rekent zelf af op Polygon zodra hij 5 MYST niet-afgerekend heeft staan, en ongeveer 21% gaat op aan kosten (de Hermes-fee van 20% plus kleine transactiekosten), dus per afrekening komt er ongeveer 3.9 MYST in de beneficiary-wallet. De TequilAPI van elke node toont zijn afrekeningen op /transactor/settle/history. Het bedrag \"total earnings\" op MystNodes beslaat alleen de laatste 30 dagen; het is geen saldo en ook geen totaal over de hele looptijd. Bonus-MYST uit het beloningsprogramma van MystNodes wordt niet vanzelf afgerekend: claim die op de pagina Rewards, volgens het helpcentrum van MystNodes binnen 30 dagen na de verdeling."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "De beneficiary-wallet wordt NA het uitrollen ingesteld, via TequilAPI of de WebUI van de node -- niet met een omgevingsvariabele, dus hij is niet uit de containerspecificatie af te lezen."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Gebruik het e-mailadres en wachtwoord van je MystNodes-account (dezelfde als op <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST per vriend wiens node 5 MYST verdient (alleen residentiële IP-adressen)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST zodra je node zijn eerste 5 MYST verdient (residentieel IP-adres, node geclaimd op mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Claim de MystNodes-beloningen van vorige maand"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Beloningen die niet binnen 30 dagen na de maandelijkse verdeling zijn geclaimd, vervallen en gaan terug naar de pool van de volgende maand."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Open de pagina Rewards en wissel je punten in voor MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Bandbreedte. Je verbinding wordt gebruikt als exit-node voor het Mysterium-netwerk, dat VPN-, proxy- EN datascrapingdiensten verkoopt. Scrapingverkeer dat vanaf een residentieel IP-adres vertrekt, levert het vaakst klachten op, en je kunt niet kiezen welke van de drie je node doorgeeft."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Ja. Vreemden sturen hun verkeer via jouw IP-adres — dat is het product."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "De identiteit van de node (een blockchainadres), je IP-adres en een globale locatie (land/stad/internetprovider), die de node op het netwerk publiceert zodat kopers hem kunnen kiezen."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Reëel en het is goed om dit te begrijpen. Verkeer van andere mensen verlaat je verbinding op jouw naam, dus alles wat zij doen lijkt van jouw lijn te komen. Veel contracten van consumentenproviders verbieden dit. Controleer het jouwe voordat je dit draait."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Onbeperkt aantal apparaten per account en per IP-adres."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Ongeveer 21% van elke afrekening gaat op aan kosten, de Hermes-fee van 20% plus transactiekosten, en de inkomsten worden betaald in de MYST-token."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Je node is een exit voor de VPN-, proxy- en datascrapingklanten van Mysterium, en je kunt niet kiezen van wie hij het verkeer doorgeeft."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "De nodesoftware is open source onder de GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium publiceert een eigen Docker-image, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "De afrekening gaat naar een wallet die van jou is; er is geen telefoonnummer of identiteitsbewijs nodig."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "Het nodeproject bestaat sinds 2017."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Volgens de site van Mysterium wordt het netwerk ontwikkeld door Blockdev AG, Zug, Zwitserland."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay is een DePIN-netwerk dat gebruikers beloont voor het delen van bandbreedte via een browserextensie. Het platform zit achter Cloudflare-bescherming, wat geautomatiseerde toegang lastig kan maken. Gebruikers verdienen Nodepay Points door de extensie actief te houden. Het netwerk richt zich op infrastructuur voor AI-trainingsdata.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "DePIN-bandbreedte delen voor AI - browserextensie"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Verdient Nodepay Points; punten van gebruikers die door de geschiktheidscontroles van Nodepay komen, worden omgezet in de NC-token. Cloudflare-bescherming kan het geautomatiseerd uitlezen blokkeren. Browserextensie vereist."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Airdrop van NC-tokens (tijdstip niet bevestigd)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Systeem op basis van punten. Punten van gebruikers die door de geschiktheidscontroles van Nodepay komen, worden omgezet in de NC-token, die in januari 2025 is gelanceerd."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "Bij de evaluatie van het eerste seizoen verwijderde Nodepay meer dan 300.000 accounts die het als bots beschouwde en schrapte het 17 miljard punten."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Beloningen zijn punten die in de NC-token worden omgezet, dus hun waarde hangt af van de token."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot draait Nodepay niet: je gebruikt de eigen browserextensie van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes is het gratis instapniveau van het Noderr Protocol, een DeFi-project op Base L2. Een micronode is een kleine agent op een reserve-Android-telefoon, een Windows-pc, een Mac of een Chromium-browser. Op Android deelt hij de mobiele verbinding van de telefoon: ander Noderr-verkeer gaat naar buiten via het IP-adres van de provider van de telefoon, dus er is een simkaart met mobiele data nodig. Op een pc of in de browser voert hij met ongebruikte rekenkracht automatiseringstaken uit voor het protocol. Beloningen zijn bedoeld om in NODR te worden betaald, afhankelijk van een on-chain score voor uptime en betrouwbaarheid, maar tijdens de bèta draait het netwerk op het Base Sepolia-testnet: noderewards zijn niet gefinancierd en er is nog niets uitbetaald.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Gratis micronode (verbinding delen op Android, Windows, Mac, browser) - testnet, beloningen tot nu toe niet gefinancierd"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Testnet-bèta: noderewards zijn niet gefinancierd en er is nog niets uitbetaald. De APY van 5-10% op de site is een ontwerpdoel. Opnieuw bekijken wanneer het netwerk Base Sepolia verlaat."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Beloningen worden opgebouwd in de eigen wallet van de node en worden geclaimd vanuit de app of de dApp. Tijdens de bèta zijn het Base Sepolia-testnettokens zonder marktwaarde."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "De app maakt de nodewallet aan bij de eerste start en mint er een gratis soulbound Utility NFT naartoe. Maak vanuit de app een back-up van de wallet: als je het apparaat kwijtraakt, raak je de identiteit van de node kwijt. Tijdens de bèta staan beloningen op Base Sepolia (testnet)."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android vereist een simkaart met mobiele data; voor de desktop- en browserclients is geen IP-vereiste gepubliceerd."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Hangt af van het apparaat. Een Android-telefoon verkoopt zijn mobiele verbinding: ander Noderr-verkeer gaat naar buiten via het IP-adres van de provider van de telefoon en telt mee voor de databundel. Een Windows-pc, een Mac of een browser verkoopt ongebruikte rekenkracht voor wat de aanbieder automatiseringstaken voor sociale media en content noemt."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Ja. Op Android gaat ander Noderr-verkeer naar buiten via het mobiele IP-adres van je telefoon; de app vraagt om vastgelegde toestemming voordat het begint, en je kunt het delen op hetzelfde scherm stoppen. Voor de Windows-, Mac- en browserclients beschrijft de aanbieder automatiseringstaken en zegt niet of die verkeer voor andere mensen doorgeven."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "Het walletadres van de node en de cijfers over uptime en voltooide taken komen on-chain als reputatiescore (de TrustFingerprint). Volgens de aanbieder worden taken geanonimiseerd, in een sandbox uitgevoerd en verlaten walletsleutels het apparaat nooit. Meer specifieke informatie is niet gepubliceerd."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Op Android is de gedeelde verbinding een mobiel abonnement van een provider: de eigen documentatie van de aanbieder waarschuwt dat delen onder het beleid voor redelijk gebruik van sommige providers mogelijk niet is toegestaan, en gedeeld verkeer gaat van de bundel af. Voor de desktop- en browserclients zegt de aanbieder niets over de voorwaarden van internetproviders."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Eén node per apparaat, elk met een eigen soulbound Utility NFT; meerdere apparaten draaien is toegestaan en wordt aangemoedigd. Er is geen limiet per IP-adres gepubliceerd. Er is geen account in de gebruikelijke zin: de identiteit is een wallet die de app bij de eerste start aanmaakt."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Noderewards zijn niet-gefinancierde testnettokens zonder marktwaarde, en er is nog niets uitbetaald; de APY van 5 tot 10% op de site is een ontwerpdoel."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Voor de desktop- en browserclients beschrijft Noderr automatiseringstaken en zegt het niet of die verkeer van andere mensen doorgeven."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Volgens de aanbieder worden taken geanonimiseerd en in een sandbox uitgevoerd, maar meer specifieke informatie publiceert hij niet."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Nog steeds een testnet-bèta op Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot draait Noderr niet: je gebruikt de eigen app of extensie van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Geen account: de app maakt bij de eerste start een wallet aan."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle gebruikt de Bluetooth van smartphones om IoT-infrastructuur op te bouwen. De app detecteert op de achtergrond IoT-apparaten in de buurt en geeft hun data door, en verdient daarmee NODL-tokens. Verschenen in Forbes, zakelijke partnerschappen met Vivendi en Hayden AI. Alleen mobiel (iOS en Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Bluetooth-IoT-relay - mobiele app, beloningen in NODL-tokens"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Zeer lage inkomsten. Telefoonapp op de achtergrond die Bluetooth gebruikt. De walletkoppeling kan haperen."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Doorlopend"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL staat in de eigen wallet van de app op ZKsync Era; controleer het in de app of in een blockexplorer voor ZKsync Era. Nodle heeft zijn Polkadot-parachain verlaten en de bridge van Polkadot naar ZKsync is op 31 december 2025 gesloten, dus NODL die nog aan de Polkadot-kant staat, kan niet meer naar ZKsync."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "Je NODL staat in de eigen wallet van de Nodle-app op ZKsync Era. CashPilot kan het adres van die wallet niet zien."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "Een NODL-beloning voor elke nieuwe actieve gebruiker die via de uitnodiging meedoet (Nodle publiceert het bedrag niet)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Eén reviewer meldt ongeveer $3 verdiend in drie tot vier jaar; anderen melden dat de dagelijkse inkomsten sterk dalen."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot draait Nodle niet: je gebruikt de eigen telefoonapp van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana is een gedecentraliseerde marktplaats voor GPU-rekenkracht, gebouwd op Solana. Het brengt GPU-eigenaren in contact met de vraag naar AI-workloads en betaalt in NOS-tokens. Een RTX 3060 verdient ongeveer $0.048/uur. Het platform richt zich op AI-inferentieworkloads en gebruikt de Solana-blockchain voor het inplannen van opdrachten en het afrekenen van betalingen. Nodes draaien workloads in containers via de Nosana CLI.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "GPU-rekenkracht op Solana - NOS-tokens, RTX 3060 ~$0.048/uur"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/uur, duurdere GPU's verdienen meer. De inkomsten hangen af van het aanbod aan opdrachten en het GPU-model. Vereist een NVIDIA-GPU, Linux, Docker en de Nosana CLI. Betalingen in de NOS-token op Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "Per voltooide opdracht"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Je verdient NOS-tokens op Solana. Uitbetaling naar de ingestelde wallet."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Nosana maakt standaard een Solana-wallet aan, dus de meeste gebruikers hebben het adres ervan nooit gezien."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Elke host moet een NOS-inzet vastzetten die past bij de uurprijs van zijn GPU."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Hosts worden in NOS betaald, dus de inkomsten in dollars bewegen mee met de token en met de vraag naar hun kaart."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot draait Nosana niet: je gebruikt de eigen hostsoftware van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN is een Bitcoin-miningpool zonder account: je miner logt in met je Bitcoin-adres als gebruikersnaam, en de pool betaalt naar dat adres. CashPilot draait hier geen miner. Het leest het onbetaalde saldo uit dat OCEAN voor je adres aanhoudt, zodat je ziet wat je ASIC (een Bitaxe, een Antminer) heeft verdiend, naast je andere inkomsten. Het onbetaalde saldo is verdiend maar nog niet ontvangen: OCEAN betaalt het on-chain uit zodra het de uitbetalingsdrempel overschrijdt.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Bitcoin-miningpool, gevolgd via je uitbetalingsadres"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Wanneer een blok je saldo over de drempel brengt"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN betaalt on-chain uit naar je adres zodra je onbetaalde saldo de drempel bereikt. Lightning-uitbetalingen (opt-in, BOLT12) worden door CashPilot niet gedetecteerd."
  source: "2d0f3e2d7422"
ocean.payout.notes:
