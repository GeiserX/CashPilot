iproyal.docker.health_signals.0.means:
  text: "IPRoyal Pawns heeft dit account uitgeschakeld."
  source: "a3a68b67f1aa"
iproyal.docker.health_signals.1.means:
  text: "Pawns ziet een ander actief apparaat op dit IP-adres en betaalt er maar één per IP-adres, dus deze kopie draait wel, maar deelt niets en verdient niets. Stop elke andere Pawns-app op dit IP-adres, op een andere machine, een pc of een telefoon. Is er geen, wacht dan tot Pawns het oude apparaat verwijdert, of vraag Pawns-support om het vrij te geven."
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "De inkomsten hangen af van de locatie en het bandbreedtegebruik. Residentiële IP-adressen in de VS/EU verdienen meer."
  source: "424261bf08d4"
iproyal.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "Minimum $5. Kies eerst je land; de methoden hangen daarvan af. Vanuit Spanje (oktober 2026): PayPal 4% met minimaal $0.25 kosten, betaald via Tremendous, dat een link mailt waar je je naam en PayPal-adres invult; USDT (BEP20, ERC20, TRC20) of USDC (BEP20, ERC20) met $1 netwerkkosten; Bitcoin met minimaal $2 kosten; cadeaukaarten zonder kosten. Voor de eerste uitbetaling is een eenmalige sms-controle van je telefoonnummer nodig: Withdraw opent die, en het nummer vul je in met landcode. Daarna vraagt elke uitbetaling om een code die naar het e-mailadres van je account wordt gestuurd, en wordt ze tot 72 uur beoordeeld voordat ze wordt verzonden."
  source: "0430fae34eb5"
iproyal.payout.notes:
  text: "Het saldo wordt door IPRoyal Pawns aangehouden; opgenomen op aanvraag."
  source: "e11da90d5216"
iproyal.collector.credential_hint:
  text: "Gebruik het e-mailadres en wachtwoord van je IPRoyal Pawns-account (dezelfde als op <a href='https://pawns.app' target='_blank'>pawns.app</a>)."
  source: "b9dcb3a01d17"
iproyal.referral.bonus.referrer:
  text: "$1 bij elk van hun eerste drie uitbetalingen, tot $3, als elke uitbetaling binnen de periode van 1-3 weken valt"
  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "$1 bij elk van je eerste drie uitbetalingen, tot $3; mis je een periode van 1-3 weken, dan vervalt de rest"
  source: "619d5960686c"
iproyal.rating.cons.0.text:
  text: "Volgens de voorwaarden kan een account zonder voorafgaande waarschuwing worden geblokkeerd bij misbruik van de opnamevoorwaarden of bij meerdere accounts, en worden de inkomsten dan mogelijk niet uitbetaald."
  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "Volgens de voorwaarden staat Pawns geen servers, VPN's of proxydiensten toe voor het delen van verkeer, en maar één apparaat per IP-adres."
  source: "449c1cdf793f"
iproyal.rating.cons.2.text:
  text: "PayPal kost 4% (minstens $0.25) via Tremendous, en elke uitbetaling wordt tot 72 uur beoordeeld."
  source: "56449f2db6ce"
iproyal.rating.cons.3.text:
  text: "Voor de eerste uitbetaling is een sms-controle van je telefoonnummer nodig, en voor elke uitbetaling een code die per e-mail wordt verstuurd."
  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "Het privacybeleid noemt de exploitant, Pawns.App Ltd (bedrijf 16043795 in Engeland en Wales), dat volgens Companies House op 28 oktober 2024 is opgericht, minder dan drie jaar geleden."
  source: "a7fcb7aea980"
iproyal.rating.cons.5.text:
  text: "Volgens de voorwaarden sturen Pawns en zijn zakelijke klanten verkeer via je apparaat, en kun je niet nagaan welke klant het gebruikt."
  source: "ca979ac10720"
iproyal.rating.pros.0.text:
  text: "Een minimum van $5, met cadeaukaarten zonder kosten."
  source: "0fa4f89bbd63"
