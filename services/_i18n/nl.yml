  source: "39229c292994"
proxybase.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
proxybase.cashout.notes:
  text: "De site vermeldt een minimum van $0.20, en een aanvraag onder $1 kwam in oktober 2026 door. Een aanvraag neemt altijd het volledige saldo op, als USDC op Polygon, POL of Litecoin, naar een adres dat je intypt. ProxyBase betaalt de netwerkkosten."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "Inkomsten worden opgebouwd op het ProxyBase-ACCOUNT waar het toegangstoken bij hoort, en worden op aanvraag via het dashboard opgenomen. De peerclient bevat geen wallet en de container bewaart geen status -- docker.volumes is leeg. Niet te verwarren met proxybase-xyz (ProxyBase Markets, dezelfde organisatie), dat wél een lokale wallet aanmaakt en die als kritiek volume aangeeft."
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
