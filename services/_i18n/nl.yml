  source: "3571c2e99729"
proxybase.docker.env.NAME.description:
  text: "Een willekeurige naam (zonder spaties) om dit apparaat in je ProxyBase-dashboard te herkennen"
  source: "906ebedecbc7"
proxybase.docker.health_signals.0.means:
  text: "ProxyBase heeft zijn relay al minstens een halfuur niet bereikt, dus verdient hij niets. Een herstart lost dit op; blijft het na een herstart, controleer dan of deze machine het internet kan bereiken."
  source: "cbe6b5ef771f"
proxybase.earnings.notes:
