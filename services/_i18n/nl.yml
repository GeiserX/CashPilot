  source: "9f5177f749d7"
proxybase.rating.cons.1.text:
  text: "ProxyBase is in 2026 overgestapt op andere peerclients en heeft de oude backend uitgeschakeld, waardoor containers met de oude image bleven draaien maar niets meer verdienden."
  source: "452b38e35357"
proxybase.rating.cons.2.text:
  text: "Alleen crypto, als USDC op Polygon, POL of Litecoin, zonder fiatmethode. Het minimum is $0.20 en ProxyBase betaalt de netwerkkosten."
  source: "2f15ff41b14c"
proxybase.rating.pros.0.text:
  text: "Onze opname van minder dan $1 kwam in oktober 2026 door."
  source: "00e8781a2252"
proxybase.rating.pros.1.text:
  text: "Voor een opname is alleen een adres nodig dat je in de aanvraag typt."
  source: "985d03ae1755"
proxybase.rating.pros.2.text:
  text: "ProxyBase publiceert een eigen image voor de peerclient en ondersteunt IP-adressen van datacenters."
  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets is een marktplaats voor SOCKS5-proxy's, gebouwd voor AI-agents. Verkopers draaien een lichtgewicht Rust-CLI-daemon die via WebSocket verbinding maakt om verkeer van kopers via hun internetverbinding door te sturen, en verdienen per verkochte GB USDC op Tempo Chain. Ondersteunt zowel de modus direct (eigen bandbreedte) als upstream (externe proxy's doorverkopen), met automatisch opnieuw verbinden. Kopers kopen proxysessies per land, internetprovider en bandbreedte. Betalingen lopen via het Machine Payments Protocol (MPP) op Tempo Chain. De verwijzingslink is voor kopers: een koper die de console via deze link opent, krijgt 10% extra op de eerste storting.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - SOCKS5-marktplaats voor AI-agents, uitbetaling in USDC. Maakt een wallet aan waarvan het volume de enige kopie van de sleutel bevat"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "Backend-API-URL"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "Overschrijf de URL van de backend-API (standaard https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "De container richt zichzelf in bij de eerste start: hij maakt een secp256k1-wallet aan (BIP-39), authenticeert via ECDSA-challenge-response en begint bandbreedte te verkopen in de modus alleen direct. Alle status (wallet, sessietoken, verkopersconfiguratie) wordt bewaard in het volume <code>proxybase-data</code>. Bekijk bij de eerste start de containerlogboeken voor het walletadres. Gebruik <code>--upstream</code> om externe proxy's voor doorverkoop toe te voegen.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "Het sleutelbestand van de aangemaakte wallet. Dit volume IS het geld: er is geen kopie op de server, dus als je het verwijdert, vernietig je het tegoed mee."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Inkomsten op basis van verkochte GB tegen marktprijzen. IP-adressen van VPS'en/datacenters verdienen minder dan residentiële. De modus met meerdere upstreams kan je eigen bandbreedte combineren met externe proxy's."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Zet inkomsten vast met <code>proxybase-cli seller payout create</code>; je ontvangt ze als USDC op Tempo Chain (Tempo MPP). Betaalt uit naar elk EVM-adres waarvan jij de sleutel hebt (Tempo is een EVM-chain), zonder dat je iets hoeft te ondertekenen; voeg het Tempo-netwerk aan de wallet toe om de USDC te zien. Toont een wallet het dan nog steeds niet, voeg dan de Tempo-USDC-token met de hand toe: importeer hem via het contractadres dat Proxybase opgeeft, en controleer dat adres voordat je het saldo vertrouwt."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "De client maakt bij de eerste start een eigen wallet aan."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "15% van elke storting die een doorverwezen koper doet, als tegoed voor je eigen proxysessies"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "+10% op de eerste storting van een koper"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "Bandbreedte, als SOCKS5-proxy die aan kopers op de ProxyBase-marktplaats wordt verkocht."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Ja. Kopers sturen hun verkeer via je verbinding — dat is precies wat er wordt verkocht."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Een walletadres dat op je machine wordt aangemaakt, plus de hoeveelheid verkeer die je doorstuurt."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Reëel, en het geldt direct voor thuisverbindingen. Proxyverkeer van onbekende kopers gaat naar buiten onder jouw IP-adres, dus misbruikklachten komen bij jou terecht. Niets in deze catalogus beperkt de dienst tot datacenteradressen, en residentiële IP-adressen verdienen meer, dus de prikkel wijst hier de verkeerde kant op: lees de voorwaarden van je internetprovider voordat je het thuis draait."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "onbekend - de aanbieder publiceert geen apparaatlimiet per account of per IP-adres, en de catalogus vermeldt er ook geen."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "Uitbetalingen zijn in USDC op Tempo Chain, naar elk EVM-adres waarvan jij de sleutel hebt."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "Je verbinding wordt als SOCKS5-proxy aan kopers op de marktplaats verkocht; we vonden geen beschrijving van hoe kopers worden gecontroleerd."
  source: "2dec55ca610f"
proxybase-xyz.rating.pros.0.text:
  text: "Volgens de titel van de eigen verdienpagina is er geen KYC nodig, met een uitbetaling vanaf $1."
  source: "25b6dc3b4608"
proxybase-xyz.rating.pros.1.text:
  text: "ProxyBase publiceert een eigen client-image en accepteert datacenterverbindingen."
  source: "ae81d006093f"
