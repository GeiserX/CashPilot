srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash voor Pearl, progpow_zano voor Zano, kawpow voor Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.earnings.notes:
  text: "Bruto schatting vóór stroomkosten. Op 2026-11-25 schatte hashrate.no ongeveer $2.45 per dag op Pearl voor een RTX 4070 die ongeveer 142 W verbruikt. We hebben het niet gemeten. Pearl is een nieuwe munt, en de prijs en moeilijkheid veranderen snel. Controleer het stroomverbruik van je GPU en je stroomprijs om te zien of het loont."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Wanneer de pooldrempel is bereikt"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "De pool betaalt uit naar je adres wanneer je saldo je drempel bereikt. De pool houdt het saldo aan totdat hij je uitbetaalt."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, een NVIDIA-GPU en de NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Deze machine meldt een hostingverbinding. Controleer de voorwaarden van je provider voordat je gaat minen. Sommige providers, waaronder Hetzner Cloud, verbieden het. Controleer je werkelijke stroomkosten voordat je op een winstschatting vertrouwt."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "De minerkosten van 2% gelden voor pearlhash. SRBMiner-Multi houdt 0.85% in bij progpow_zano en kawpow. HeroMiners, de standaardpool voor Pearl, rekent 1% poolkosten. Het controleert uitbetalingen elk uur en betaalt vanaf 1 PRL. Andere pools hanteren hun eigen tarieven en drempels."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "rekenkracht"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "Nee. De miner stuurt werk naar de pool die je kiest."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Je uitbetalingsadres, workernaam en IP-adres gaan naar de pool. Bij de eerste start wordt de miner van GitHub gedownload."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Sommige netwerken en DNS-resolvers blokkeren verbindingen met miningpools."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "De meeste pools herkennen je aan je openbare uitbetalingsadres."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "De miner houdt 2% van de hashtijd in bij Pearl en 0.85% bij Zano en Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Sommige hostingproviders verbieden het minen van cryptocurrency."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "De miner is closed source, dus niemand buiten de ontwikkelaar kan controleren wat hij uitvoert."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "De stroom voor de GPU kan meer kosten dan de verdiende munten, en de prijs van Pearl verandert snel."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "De miner stuurt werk naar de pool en geeft geen verkeer van anderen door."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Je kunt Pearl minen op HeroMiners met een openbaar adres en zonder account."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj is een gedecentraliseerd netwerk voor cloudopslag waarop je verdient door je ongebruikte schijfruimte te verhuren. Draai de storagenode via Docker en krijg $1.35/TB per maand betaald voor opslag plus $1/TB voor egress (tarieven sinds 1 september 2026). Uitbetalingen gebeuren maandelijks in USDC, een stablecoin gekoppeld aan de Amerikaanse dollar, op het Ethereum-mainnet naar een wallet die jij beheert, zodra het saldo boven een minimum uitkomt dat van de transactiekosten afhangt (STORJ-token tot en met de uitbetaling van september 2026). Vereist minstens 550GB beschikbare schijfruimte en een stabiele internetverbinding. Geen account of aanmelding nodig -- nodes zijn sinds medio 2025 vrij toegankelijk. LET OP (oktober 2026): Storj Labs heeft op 26 juli 2026 Chapter 11 aangevraagd (US Bankruptcy Court, Northern District of West Virginia, zaak 5:26-bk-00512) om oude schulden te herstructureren. Het netwerk blijft draaien en Storj blijft actieve nodes betalen, maar node-inkomsten van vóór de aanvraag zijn bevroren totdat de rechtbank erover beslist. De STORJ-token staat ongeveer 98% lager dan zijn piek in 2021. Binance heeft hem op 3 september 2026 van de lijst gehaald, en Coinbase heeft de handel erin op 28 september 2026 opgeschort. Een nieuwe node houdt in zijn eerste negen maanden een deel van zijn inkomsten in en raakt alleen gevuld voor zover de vraag van klanten dat toelaat, dus wie er nu een start, bindt een lange terugverdientijd aan een bedrijf in herstructurering dat nog steeds kan worden opgeheven.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Gedecentraliseerde opslagnode - $1.35/TB opgeslagen + $1/TB egress"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Walletadres"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "E-mailadres"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "Extern adres"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Toegewezen opslag"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Identiteitsmap"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Opslagmap"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Ethereum-walletadres voor uitbetalingen in USDC (bijv. 0x1234...abcd). Moet een wallet in eigen beheer zijn (MetaMask, Ledger, enz.) -- gebruik nooit een adres van een exchange"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "E-mailadres voor meldingen aan de operator"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "DDNS-hostnaam met poort (bijv. mynode.ddns.net:28967) -- sterk aan te raden boven een vast IP-adres, waardoor de node onbereikbaar wordt op de dag dat je internetprovider je ongemerkt een nieuw adres geeft. Poort 28967 moet worden doorgestuurd (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Maximale schijfruimte om toe te wijzen (bijv. 2TB). Gebruik draaiende schijven (HDD), geen SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Pad op de host waar de identiteitsbestanden staan (moet ca.cert, ca.key, identity.cert en identity.key bevatten)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Pad op de host, op een draaiende schijf (HDD), voor de opslag van Storj-data. Er moet minstens 550GB vrij zijn"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Initialiseer vóór de eerste start de configuratie van de storagenode: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "De identiteit van de node. De ID is gebonden aan proof-of-work en het opnieuw aanmaken duurt uren, en hij kan niet uit een back-up van iets anders worden hersteld. Als je hem kwijtraakt, verlies je het ingehouden uitbetalingssaldo."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Opgeslagen klantdata en het ingehouden bedrag van de node. Als je die kwijtraakt, wordt de node gediskwalificeerd en verlies je het ingehouden saldo."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Het Storj-netwerk kan je node niet terugbellen op het opgegeven ADDRESS, dus satellieten tellen hem als offline: er komt geen nieuwe data meer binnen, de egress-inkomsten vallen stil en langdurige offline tijd leidt tot schorsing. Controleer of ADDRESS overeenkomt met je HUIDIGE openbare IP-adres (gebruik een DDNS-hostnaam, geen vast IP-adres, zodat een nieuw adres van je internetprovider de node niet onbereikbaar kan maken) en of poort 28967 TCP+UDP naar deze machine wordt doorgestuurd."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB opgeslagen + $1/TB egress + $1/TB audit/reparatie sinds 1 september 2026. De inkomsten groeien met de opgeslagen data en de leeftijd van de node. In de eerste 9 maanden wordt 75%, daarna 50% en daarna 25% van de inkomsten ingehouden; de helft van het ingehouden bedrag komt terug in maand 16 en de rest bij een graceful exit. Poort 28967 moet worden doorgestuurd."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4x de Ethereum-transactiekosten, kleinere saldi schuiven door"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Maandelijks"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Maandelijks uitbetaald in USDC op het Ethereum-mainnet zodra het walletsaldo minstens vier keer de actuele transactiekosten is; kleinere saldi schuiven door naar de volgende maand. STORJ-token tot en met de uitbetaling van september 2026. Dashboard op poort 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Maandelijks uitbetaald in USDC op het Ethereum-mainnet naar het adres in WALLET zodra het saldo boven het minimum uitkomt dat van de transactiekosten afhangt. STORJ-token tot en met de uitbetaling van september 2026; uitbetalingen via zkSync Era zijn op 1 september 2026 gestopt."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "De URL van het nodedashboard op poort 14002, met het LAN-IP-adres van de server in plaats van localhost, bijvoorbeeld <b>http://192.168.1.10:14002</b>. Bij meerdere nodes geef je hun URL's op, gescheiden door komma's: CashPilot telt ze bij elkaar op."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Storj-nodes in hetzelfde /24-subnet delen de datatoewijzing, wat de inkomsten per node verlaagt."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps upload"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Schijfruimte en de bandbreedte om die te leveren."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Nee. Je slaat versleutelde fragmenten van klantdata op, met erasure coding. Andere mensen sturen hun eigen verkeer niet via je IP-adres."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "De identiteit van de node, je walletadres, het e-mailadres dat de node vereist voor meldingen aan de operator, en je IP-adres en poort, die bereikbaar moeten zijn zodat de node data kan leveren."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "Vooral een kwestie van datalimieten, niet van aansprakelijkheid: een node levert en ontvangt voortdurend klantdata, wat echt langdurig verkeer op je lijn is. Anders dan bij een proxy of relay is het echter geen geanonimiseerd verkeer van derden dat aan jou als bron wordt toegeschreven, dus het trekt niet de misbruikklachten aan die die wel krijgen."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Onbeperkt aantal nodes, maar nodes in hetzelfde /24-subnet delen de toewijzing, dus meerdere nodes op één verbinding verdienen elk minder."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk meldde op 27 juli 2026 dat Storj Labs faillissementsbescherming onder Chapter 11 had aangevraagd."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Betalingen aan node-operators van vóór de aanvraag zijn in de procedure voor faillissementsvorderingen terechtgekomen."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "Bij een nieuwe node wordt in de eerste negen maanden 75%, daarna 50% en daarna 25% van de inkomsten ingehouden; de helft komt terug in maand 16 en de rest pas bij een graceful exit."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Klanten slaan versleutelde bestandsfragmenten op en niemand stuurt verkeer via je IP-adres, maar we hebben niet gevonden waar Storj zegt wie de klanten zijn of hoe ze worden gecontroleerd."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "De software van de storagenode is open source onder de AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj publiceert een eigen Docker-image, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Geen account: een walletadres en een e-mailadres voor meldingen aan de operator."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Actieve nodes werden na de aanvraag gewoon verder betaald."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR is een Monero-miningpool zonder account: je miner logt in met je Monero-adres als gebruikersnaam, en de pool betaalt naar dat adres. CashPilot draait hier geen miner. Het leest het saldo uit dat SupportXMR voor je adres aanhoudt, zodat je ziet wat je CPU-miner heeft verdiend, naast je andere inkomsten. Het saldo is verdiend maar nog niet ontvangen: de pool betaalt het uit zodra het je uitbetalingsdrempel overschrijdt.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Monero-miningpool, gevolgd via je uitbetalingsadres"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (automatisch), 0.01 XMR op aanvraag"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Wanneer je saldo je drempel overschrijdt, of op aanvraag"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR betaalt uit naar je adres zodra het saldo je drempel bereikt (standaard 0.1 XMR). Op de site kun je ook een directe uitbetaling aanvragen vanaf 0.01 XMR, tegen 0.001 XMR kosten."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Het saldo is verdiend maar niet ontvangen totdat SupportXMR het naar dit adres uitbetaalt. Monero-saldi zijn on-chain niet uit te lezen zonder een private view key, waar CashPilot nooit om vraagt, dus je bevestigt elke uitbetaling zelf."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Je Monero-uitbetalingsadres: de gebruikersnaam die je miner op SupportXMR gebruikt, zonder een eventueel deel <b>.workername</b> of <b>+difficulty</b>. Het is openbaar en geeft geen toegang tot tegoed."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Vereist een Monero-miner (XMRig) die naar pool.supportxmr.com wijst"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "rekenkracht"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Nee. Je miner stuurt hashes naar de pool; niemand stuurt verkeer via je verbinding."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Je Monero-adres, de workernamen die je kiest, je hashrate en het IP-adres van je miner zoals de pool dat ziet."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Een miner houdt één verbinding met de pool open en gebruikt weinig bandbreedte. De kosten waar je op moet letten zijn de stroomkosten, niet je internetprovider."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Er is geen account. Het adres is de identiteit, en iedereen kan de statistieken ervan op supportxmr.com bekijken."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Alleen uitbetaald in Monero, met 0.6% poolkosten en een standaarddrempel van 0.1 XMR vóór een automatische uitbetaling."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot draait geen miner voor SupportXMR: je laat je eigen miner naar de pool wijzen, en CashPilot leest alleen het saldo uit."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol geeft AI-agents toegang tot het live web via een netwerk van Beacons. De Teneo Beacon is de eigen app van Teneo voor Android, iOS, macOS, Windows en Linux, met een opdrachtregelversie voor servers en een Raspberry Pi. Hij deelt je ongebruikte bandbreedte nadat je het toestemmingsscherm hebt geaccepteerd, en verdient Teneo Protocol Points en Fragments zolang hij online is. Fragments tellen mee voor seizoensgebonden trekkingen die in USDC worden uitbetaald (de Beacon Drop). Volgens Teneo verdient de Beacon twee keer zoveel punten als de oudere browserextensie. Per internetverbinding verdient één Beacon. Andere apparaten op dezelfde verbinding staan stand-by. Meld je aan in de Expedition Hub met de verwijzingslink of code PSA3BHPJ en log daarna in op de Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "DePIN-bandbreedte-app (Beacon) - Fragments voor seizoenstrekkingen in USDC, +100 Fragments met een verwijzingslink"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Verdient Teneo Points en Fragments. Fragments tellen mee voor seizoenstrekkingen in USDC, dus een seizoen levert een prijs op, geen vast tarief. Volgens Teneo verdient de Beacon twee keer zoveel punten als de browserextensie. Claim de boost elke 8 uur voor tot 3x Fragments; mis je een periode, dan daalt de vermenigvuldiger."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Seizoenstrekking (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Prijzen van de Beacon Drop worden in USDC uitbetaald naar een wallet die je in de Expedition Hub koppelt. De Hub toont hoeveel dagen je hebt om er een te koppelen; een prijs waarvoor niet op tijd een wallet is gekoppeld, vervalt."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Koppel een wallet in de Expedition Hub voordat de prijzen van een seizoen worden uitbetaald; de Hub laat een prijs vervallen als de wallet niet op tijd is gekoppeld."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% van de Fragments van elke doorverwezen vriend en 2% van de Fragments van hun doorverwijzingen, zodra de vriend zich binnen 7 dagen aanmeldt en 480 Fragments verdient"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments bij aanmelding, en nog eens +150 zodra je 480 Fragments bereikt"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "Per internetverbinding verdient één Beacon. Machines in een datacenter verdienen alleen bij hostingproviders die Teneo heeft toegelaten, met de helft van de Fragments en zonder punten of verwijzingsbonus. VPN-verbindingen verdienen nooit."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "De Fragments van de Beacon leveren alleen USDC op als prijzen in seizoenstrekkingen, dus het draaien ervan levert geen vast bedrag op."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Volgens Teneo worden punten samengevoegd tot $AGENTIC, een niet-overdraagbare beloningstoken, en niet tot de $TENEO-token."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "In november 2026 was er nog geen lanceringsdatum, toewijzing of claimprocedure voor $TENEO bevestigd, nadat een eerder doel van het tweede kwartaal van 2026 was verstreken."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot draait Teneo niet: je installeert de eigen Beacon-app van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Volgens Teneo komt het verkeer van gecontroleerde zakelijke klanten en blokkeert het privéadressen en poorten die gevoelig zijn voor misbruik, maar het zegt niet hoe het die klanten controleert."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network is een gevestigd gedecentraliseerd netwerk voor videolevering en AI-rekenkracht (sinds 2018). Gebruikers draaien Edge Nodes die bandbreedte, opslag en rekenkracht delen. Grote contentpartnerschappen. Verdient TFUEL-tokens.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "Gedecentraliseerd CDN + AI-rekenkracht - beloningen in TFUEL, gevestigd project"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Alleen desktopapp. De inkomsten hangen af van de resources en de locatie. Grote partnerschappen, genoteerd op alle exchanges."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Doorlopend"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot draait Theta Edge niet: je gebruikt de eigen desktopapp van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "893de938ed14"
titan.description:
  text: "Titan Network is een DePIN-platform dat je IP-adres, opslag en bandbreedte deelt in ruil voor beloningen in TNT-tokens. Beschikbaar voor Windows, Mac en Android. Nodes dragen bij aan een gedecentraliseerde CDN- en opslaglaag. Gangbare inkomsten liggen tussen $5-30/maand, afhankelijk van de gedeelde resources en de geografische locatie.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN, deelt IP-adres, opslag, bandbreedte - $5-30/maand"
  source: "799e68401067"
titan.earnings.notes:
  text: "Deelt IP-adres, opslag en bandbreedte. De inkomsten hangen af van de bijgedragen resources en de regio. Meer toegewezen opslag levert hogere beloningen op."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Per epoch"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Volgens de eigen helppagina's van Titan garandeert een draaiende node geen inkomsten: zonder toegewezen taak verdient hij niets, en beloningen zijn in de TNT-token."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot draait Titan niet: je gebruikt de eigen app of extensie van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer laat je geld verdienen aan je internetverkeer door bandbreedte te delen met geverifieerde bedrijven. Een van de weinige diensten voor het delen van bandbreedte die naast residentiële verbindingen ook goed werkt op IP-adressen van VPS'en en datacenters. Gebruikt een eenvoudige authenticatie met een token, doorgegeven via opdrachtregelargumenten. Ondersteunt ARM-architecturen voor Raspberry Pi en vergelijkbare apparaten.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Bandbreedte delen - werkt op VPS, authenticatie met token"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Token"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Apparaatnaam"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Log in op <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, druk op F12 → Application → Local Storage → klik op <code>https://app.traffmonetizer.io</code> → kopieer de waarde van <code>authToken</code> (ongeveer 54 tekens: cijfers, een <code>|</code>, en dan letters en cijfers)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Naam die in het dashboard wordt getoond voor het beheer van apparaten"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "IP-adressen van VPS'en en datacenters verdienen minder dan residentiële. Locaties in de VS/EU verdienen meer. Meerdere IP-adressen worden ondersteund via Docker-netwerken."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Minimum $10. PayPal wordt niet meer aangeboden. Sla eerst één uitbetalingsmethode op in je profiel: USDT op Solana of TON (laagste kosten), Arbitrum (lage kosten) of Tron TRC20 (hoge netwerkkosten), of een bankoverschrijving vanaf $1.000. Het eerste adres dat je opslaat, geldt meteen; het later wijzigen vereist een bevestiging per e-mail. Het dashboard kan vóór de eerste opname om een contact via een messenger vragen (WhatsApp, Telegram of Skype). Een aanvraag betaalt hele dollars uit en de centen blijven in het saldo staan."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT op de chain die in de uitbetalingsinstellingen van het profiel is opgeslagen (Solana, TON, Arbitrum of Tron), of een bankoverschrijving. Het adres staat in de instellingen van Traffmonetizer, niet in de container."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Log in op <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, druk op F12 → Application → Local Storage → waarde van <b>authToken</b> (ongeveer 54 tekens: cijfers, een <code>|</code>, en dan letters en cijfers)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% van elke uitbetaling die zij aanvragen"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "De gebruiksvoorwaarden van Traffmonetizer vereisen een residentieel IP-adres, maar in de praktijk worden VPS-nodes geaccepteerd."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot geeft een 1.9; reviewers van 2023 tot november 2026 melden uitbetalingen die wekenlang in behandeling blijven, of die als voltooid zijn gemarkeerd zonder bijbehorende transactie."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Dezelfde reviewers melden dat support via livechat en e-mail niet reageert, soms wekenlang."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Alleen crypto of een bankoverschrijving vanaf $1.000; PayPal is verdwenen, en een aanvraag betaalt alleen hele dollars uit."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "De voorwaarden van Traffmonetizer vereisen een residentieel IP-adres, dus een server op een hostingverbinding valt erbuiten."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Vier Trustpilot-reviewers melden van 2023 tot 2025 zeer trage inkomsten, zoals één cent per dag over vier apparaten, of bijna twee jaar om $10 te bereiken."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Voor een uitbetaling is alleen een opgeslagen crypto-adres nodig dat per e-mail is bevestigd; het dashboard kan om een contact via een messenger vragen."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer publiceert een eigen Docker-image, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Mine met je CPU en word betaald in de munt die je kiest, zoals SHIB, DOGE of XMR. CashPilot draait XMRig tegen de RandomX-pool van unMineable, en unMineable zet de Monero die je CPU minet om in jouw munt. Het betaalt uit naar je openbare adres zodra je saldo de betalingsdrempel van de munt bereikt. Elke worker die CashPilot uitrolt, bevat de unMineable-verwijzingscode van CashPilot, waardoor je platformkosten dalen van 1% naar 0.75%. De stroom kan meer kosten dan je verdient."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Mine met je CPU en word betaald in de munt die je kiest"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "Uitbetalingsmunt"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "Uitbetalingsadres"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "Workernaam"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "Max. CPU-threads (%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "RandomX-modus"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "Ticker van een munt die unMineable uitbetaalt, zoals SHIB, DOGE of XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "Je openbare adres voor die munt. Munten die een memo of tag nodig hebben, worden niet ondersteund."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Bruto schatting vóór stroomkosten, uitbetaald in jouw munt tegen de omrekenkoers van unMineable. Op 2026-11-25 was 1 kH/s RandomX ongeveer $1 per maand waard. Een desktop-CPU op de helft van zijn threads kan 30 tot 50 W extra verbruiken. Controleer je werkelijke verbruik en je stroomprijs om te zien of het loont."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "Per munt vastgesteld door unMineable (0.03 XMR op 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Wanneer de betalingsdrempel van de munt is bereikt"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable betaalt uit naar je adres zodra je saldo de betalingsdrempel van de munt bereikt. De drempels verschillen per munt en netwerk; CashPilot leest de drempel uit die unMineable voor je adres opgeeft."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Het saldo is verdiend maar niet ontvangen totdat unMineable het naar dit adres uitbetaalt. De chain hangt af van de munt die je kiest."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "Hetzelfde uitbetalingsadres en dezelfde ticker waarmee je de miner hebt uitgerold, bijvoorbeeld <b>XMR</b>. Vul alleen het adres in, zonder de munt, de workernaam of de verwijzingscode. Het is openbaar en geeft geen toegang tot tegoed."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% van de miningbeloningen van elke doorverwezen miner"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Platformkosten verlaagd van 1% naar 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Deze machine meldt een hostingverbinding. Controleer de voorwaarden van je provider voordat je gaat minen. Sommige providers, waaronder Hetzner Cloud, verbieden het. Controleer je werkelijke stroomkosten voordat je op een winstschatting vertrouwt."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable rekent 1% platformkosten. CashPilot voegt zijn verwijzingscode (#awk6-j1z0) toe achter elke workernaam, waardoor je kosten dalen naar 0.75%. unMineable betaalt de maintainer van CashPilot dan 0.25% van je miningbeloningen; jij houdt 99.25%. Elke munt heeft een eigen betalingsdrempel, bijvoorbeeld 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "rekenkracht"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "Nee. De miner stuurt werk naar de pool van unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "Je uitbetalingsadres, munt, workernaam, hashrate en IP-adres gaan naar unMineable."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "Sommige netwerken en DNS-resolvers blokkeren verbindingen met miningpools."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "Er is geen account nodig. Het adres en de munt zijn de identiteit, en iedereen kan de statistieken ervan op unmineable.com bekijken."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "unMineable houdt met de verwijzingscode 0.75% platformkosten in en betaalt pas uit vanaf de drempel van elke munt."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "Sommige hostingproviders verbieden het minen van cryptocurrency."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "De extra stroom kan meer kosten dan de verdiende munten."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "De statistieken van een adres, inclusief het saldo, zijn openbaar voor iedereen die het adres kent."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "De miner stuurt hashes naar de pool en geeft geen verkeer van anderen door."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Je kunt naar een openbaar adres minen in de munt die je kiest, zonder een account aan te maken."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock is een DePIN-platform (Decentralized Physical Infrastructure Network) waarmee je cryptocurrency verdient door je internetverbinding te delen. Onderdeel van het bredere Web3-ecosysteem. Er zijn Docker-images uit de community beschikbaar, maar geen officiële image. De browserextensie is de belangrijkste interface.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "DePIN, internet delen - uitbetaling in crypto, vooral via browserextensie"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Inkomsten in crypto/tokens. Geen officiële Docker-image — de browserextensie is de belangrijkste client."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
uprock.cashout.notes:
  text: "UPT-tokens, op te nemen naar een Solana-wallet vanaf 250 UPT, met tweestapsverificatie ingeschakeld. Er gelden opnamekosten."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "Volgens het helpcentrum van UpRock zijn opnames UPT-tokens naar een Solana-wallet, met een minimum van 250 UPT."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "Beloningen zijn UPT-tokens; reviewers en een review van een derde partij zeggen dat hun waarde zeer laag is."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot draait UpRock niet: je gebruikt de eigen app of extensie van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork is een gedecentraliseerd netwerk voor VPN en het delen van bandbreedte. Je verdient door als communityprovider bandbreedte te leveren. Het providerprogramma authenticeert zichzelf met het e-mailadres en wachtwoord van je account (het subcommando auth-provide) en bewaart de resulterende sessie-JWT in het datavolume. Officiële Docker-image van BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "Gedecentraliseerde VPN/bandbreedte - inloggen met e-mail+wachtwoord, JWT-sessie in volume"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "E-mailadres"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Wachtwoord"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "Het e-mailadres van je URnetwork-account (de login die je op <a href=\"https://ur.io\" target=\"_blank\">ur.io</a> gebruikt). Voor accounts die via inloggen met Google/Apple zijn aangemaakt, moet je eerst een wachtwoord instellen. Nog geen account? Meld je aan via <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "Het wachtwoord van je URnetwork-account (zonder spaties). Wordt gebruikt door de auth-provide-login van de provider; daarna blijft de sessie in het datavolume bewaard."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Werkt op VPS en residentieel. Sinds 2026-10-06 uitbetaald in SN25α (Bittensor-subnet 25) per wekelijkse epoch. Ondersteunt een proxymodus voor opstellingen met meerdere IP-adressen."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "Per epoch"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Stel een Bittensor-coldkey in op ur.io/app/account/earnings (ondertekend met Talisman, TAO.com of een WalletConnect-wallet) en claim daarna elke afgeronde epoch. Een claim betaalt gas in TAO vanuit een EVM-gassleutel. NIET-GECLAIMDE EPOCHS VERLOPEN, en de oude USDC-uitbetalingen werden geannuleerd als er niet binnen 30 dagen een wallet was gekoppeld."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB gratis UR-data per dag per vriend, tot 20 vrienden (data, geen geld)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB gratis UR-data per dag zodra je binnen 90 dagen na aanmelding op 2 dagen minstens 10 MiB via de app gebruikt; anders vervalt de doorverwijzing"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Niet-geclaimde epochs verlopen, en de oude USDC-uitbetalingen werden geannuleerd voor netwerken waaraan niet binnen 30 dagen een wallet was gekoppeld."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "Sinds oktober 2026 worden beloningen betaald in SN25α, een token van een Bittensor-subnet, en elke claim kost gas in TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork heette vroeger BringYour; de gearchiveerde whitepaper draagt nog de oude naam."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork publiceert de broncode van zijn providerclient."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork publiceert een eigen Docker-image, bringyour/community-provider, en werkt op VPS- en residentiële verbindingen."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Voor een claim is alleen een Bittensor-wallet nodig die jij beheert."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai is een marktplaats voor GPU-cloud waarop je je NVIDIA-GPU verhuurt aan AI/ML-onderzoekers en -ontwikkelaars. Een platform dat volledig op Docker is gebouwd, waarop je je eigen uurprijzen instelt. Een RTX 3090 verdient bij verhuur meestal $0.20-0.40/uur. Vereist een NVIDIA-GPU met recente drivers en een stabiele internetverbinding. De opbrengst hangt sterk af van het GPU-model, je prijsstrategie en de vraag op de markt.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "GPU-marktplaats - stel je eigen prijzen in, RTX 3090 ~$0.20-0.40/uur"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "API-sleutel"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "Host-API-sleutel van Vast.ai uit het dashboard"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/uur, RTX 4090 ~$0.40-0.80/uur bij verhuur. De bezettingsgraad wisselt. Vereist een NVIDIA-GPU, een Linux-host, Docker en nvidia-container-toolkit. Stel je eigen prijzen in."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Wekelijks (vrijdag)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "Inkomsten worden opgebouwd in je Vast.ai-saldo. Opnemen via Wise, PayPal of Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% van wat doorverwezen huurders uitgeven, zolang hun account bestaat, als verwijzingstegoed; tot 75% kan worden uitbetaald vanaf een apart verwijzingsaccount"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Een host verdient alleen zolang hij verhuurd is, en de eigen cijfers van Vast voor een consumenten-GPU hangen af van het type verhuur en de betrouwbaarheidsscore."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot draait Vast.ai niet: je installeert de hostsoftware van Vast op je eigen GPU-machine, dus CashPilot kan die niet voor je uitrollen of bijwerken. Vast bouwt hosting rond Docker op een Linux-host."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Volgens Vast is het tarief dat een host instelt ook het tarief dat hij ontvangt, zonder ingehouden kosten."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "Uitbetalingen gaan via Wise, PayPal of Stripe vanaf een minimum van $20, wekelijks gefactureerd; een kleiner saldo schuift door naar de volgende week."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter is een platform voor het delen van bandbreedte, beschikbaar voor Windows, Mac, Linux en Android. Het beweert tot $1/GB gedeelde bandbreedte te betalen, met een minimale uitbetalingsdrempel van $20. Het platform werkt vergelijkbaar met traditionele apps voor het delen van bandbreedte en stuurt legitiem verkeer via residentiële verbindingen.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Bandbreedte delen - beweert tot $1/GB, min. uitbetaling $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Beweert tot $1/GB, maar de inkomsten in de praktijk zijn lager. Minimale uitbetaling $20. De inkomsten verschillen sterk per locatie en vraag."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter heeft geen webdashboard. Open de desktop- of telefoonapp van Wipter, log in en vraag daar de uitbetaling aan zodra het saldo $20 bereikt. Wipter betaalt alleen in USDT op BNB Smart Chain (BEP20), naar de wallet die je in het onderdeel Payments van de app instelt; er is geen PayPal-optie."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% van hun verkeersinkomsten zodra ze het uitbetalingsminimum bereiken, voor zoveel vrienden als je doorverwijst"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "$5 aanmeldbonus"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot draait Wipter niet: je gebruikt de eigen desktop- of telefoonapp van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "fa32942c6b4f"
xmrig.description:
  text: "Mine Monero met je CPU. CashPilot draait XMRig, en de pool die je kiest, betaalt Monero uit naar je openbare uitbetalingsadres. XMRig gebruikt 1% van de hashtijd om zijn ontwikkelaars te steunen. De stroom kan meer kosten dan de XMR die je verdient."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "Mine Monero met je CPU en een pool naar keuze"
  source: "67b33077256d"
