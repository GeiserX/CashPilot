  text: "De client van ProxyRack kan niet draaien op deze kopie, dus die verdient niets. Meestal antwoordt de updateserver van ProxyRack niet, en zonder die server kan de client niet starten. De kopie probeert het elke 5 minuten opnieuw en start vanzelf zodra de server antwoordt. Je hoeft niets te herstellen."
