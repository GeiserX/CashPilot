proxybase.description:
  text: "ProxyBase is een platform voor het delen van bandbreedte dat gebruikers in cryptocurrency betaalt voor het delen van hun ongebruikte internetverbinding. Je authenticeert de peerclient met een toegangstoken uit je dashboard. Residentiële IP-adressen verdienen het meest, maar IP-adressen van datacenters worden ook ondersteund. Officiële multi-arch Docker-image (amd64/arm64/armv7).\n"
