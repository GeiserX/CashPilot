  source: "0a2ee4b478b2"
proxyrack.device_link.steps:
  text: "Log in bij ProxyRack, open Devices, kies Add device en plak deze UUID. Zolang het apparaat niet op je account staat, verdient het voor niemand. Als je een API-sleutel hebt ingevuld, registreert de container zichzelf: controleer of het apparaat daar in de lijst staat."
  source: "54c4041903b5"
proxyrack.earnings.notes:
  text: "Residentiële IP-adressen verdienen meer dan die van datacenters. Het dashboard achter Cloudflare kan geautomatiseerde toegang lastig maken."
  source: "b6e36d751afd"
proxyrack.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
proxyrack.cashout.notes:
  text: "Vraag de uitbetaling aan op het dashboard. ProxyRack beoordeelt die binnen 72 uur, waarna Tremendous je een beloning mailt die je kunt inwisselen als PayPal, een cadeaukaart of een bankoverschrijving. Er is geen crypto-optie."
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "Het saldo wordt door ProxyRack aangehouden; opgenomen op aanvraag."
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "Log in op <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, druk op F12 → Network, zoek een willekeurig API-verzoek en kopieer de waarde van de header <b>Api-Key</b>. Nog geen account? Meld je aan via <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "Proxyrack documenteert een limiet van 500 apparaten per ACCOUNT en geen limiet per IP-adres. IP-adressen van datacenters worden geaccepteerd, maar ingedeeld in een lager tarief."
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "Volgens het helpcentrum van ProxyRack verdwijnen de inkomsten van een apparaat van je account als je dat apparaat verwijdert, en komen ze alleen terug als hetzelfde apparaat opnieuw wordt toegevoegd."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack publiceert een eigen Docker-image, proxyrack/pop, en accepteert IP-adressen van datacenters tegen een lager tarief."
  source: "278541f81053"
repocket.description:
  text: "Met Repocket verdien je passief inkomen door je ongebruikte internetbandbreedte te delen. Residentiële IP-adressen verdienen het meest; IP-adressen van VPS'en/datacenters worden geaccepteerd tegen lagere tarieven. Max. 5 apparaten en 5 actieve sessies per account. De Docker-container authenticeert met het e-mailadres van je account en een API-sleutel uit het Repocket-dashboard (niet je wachtwoord).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Bandbreedte delen - max. 5 apparaten, authenticatie met API-sleutel"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "E-mailadres"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "API-sleutel (UUIDv4, niet je wachtwoord)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "Het e-mailadres van je Repocket-account"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Je Repocket-API-sleutel — log in op <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> en kopieer de API-sleutel die op de pagina bandwidth-earnings staat (dit is NIET het wachtwoord van je account). Nog geen account? Meld je aan via <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "Residentiële IP-adressen verdienen meer. IP-adressen van VPS'en/datacenters worden geaccepteerd, maar tegen lagere tarieven."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 na de eerste uitbetaling)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket stelt het minimum per account vast: in oktober 2026 $4 vóór de eerste uitbetaling en $2 daarna, ver onder de $20 die het vroeger noemde. Methoden: Tremendous (naar je e-mailadres) of USDT op Polygon. Elke aanvraag bevestig je binnen 2 uur via een gemailde link, en er kan maar één aanvraag tegelijk openstaan. In oktober 2026 weigerde Repocket een Tremendous-aanvraag met \"Please, message support\", terwijl USDT op Polygon wel doorkwam."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Het saldo wordt door Repocket aangehouden; opgenomen op aanvraag."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Gebruik het e-mailadres en wachtwoord van je Repocket-account (dezelfde als op <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Nog geen account? Meld je aan via <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2 zodra de doorverwezen gebruiker $7 heeft verdiend, daarna levenslang 5% van hun inkomsten"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "$2 walletbonus bij aanmelding"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket documenteert een limiet van vijf apparaten per ACCOUNT, maar publiceert geen apparaatlimiet per IP-adres. Het getal '2 apparaten per IP-adres' dat op reviewsites wordt herhaald, heeft geen bron bij de aanbieder, dus CashPilot neemt het niet over."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Laat een Repocket-apparaat delen, of neem je saldo op"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Na 12 maanden zonder login, uitbetaling of het delen van bandbreedte kan Repocket het onbetaalde saldo laten vervallen."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Laat een apparaat delen, log in, of neem op. Als je stopt met Repocket, neem dan eerst op."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Verschillende Trustpilot-reviewers melden geannuleerde uitbetalingen en saldi die op nul zijn gezet; één zegt dat support onregelmatige bandbreedte-inkomsten als reden gaf. De pagina geeft Repocket een 2.7 en vermeldt dat het niet op negatieve reviews heeft gereageerd."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Reviewers melden afgewezen opnames en dat ze achter hun betaling aan moesten."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Het betalingsbeleid van Repocket staat toe dat het inkomsten terugdraait, annuleert of definitief laat vervallen wanneer het vermoedt dat ze ongeldig zijn, en dat het de onbetaalde inkomsten van een slapend account laat vervallen."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "Hetzelfde beleid staat Repocket toe om op elk moment zonder aankondiging uitbetalingsmethoden toe te voegen, te verwijderen of te vervangen; PayPal is verwijderd."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Volgens de voorwaarden kan Repocket op elk moment om verificatie van identiteit of account vragen, en hangt het recht op uitbetaling daarvan af."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Volgens de voorwaarden gebruiken Repocket en zijn partners de netwerkcapaciteit, maar er staat niet wie de partners zijn of hoe ze worden gecontroleerd."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot vermeldt dat Repocket niet op negatieve reviews heeft gereageerd, en reviewers zeggen dat berichten worden genegeerd."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "De huidige voorwaarden noemen Repocket Pte. Ltd. in Singapore; oudere voorwaarden noemden geen bedrijf."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket publiceert een eigen Docker-image, repocket/repocket, en de voorwaarden staan containers toe die van jou zijn."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Het minimum is laag: $4 vóór de eerste uitbetaling en $2 daarna."
  source: "ff8121a15aeb"
salad.description:
  text: "Met Salad.io deel je je GPU voor gespreide AI-workloads en verdien je Salad-saldo dat je kunt inwisselen voor cadeaukaarten, games of geld. Alleen Windows, met een native desktopapplicatie. Vereist een aparte GPU (NVIDIA of AMD). Het platform stuurt AI-inferentie, rendering en andere rekentaken naar je machine wanneer die niet in gebruik is. Een van de gebruiksvriendelijkere platforms voor het delen van GPU's.\n"
  source: "09335baccea6"
salad.short_description:
  text: "GPU delen voor AI - alleen Windows, uitbetaling als cadeaukaart of geld"
  source: "4665796e0965"
salad.earnings.notes:
  text: "De inkomsten hangen af van het GPU-model en het beschikbare werk. RTX 3060 ~$1-3/dag. Alleen Windows. Native app, geen Docker-ondersteuning. In te wisselen voor cadeaukaarten, games of PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal of cadeaukaarten via de Salad-winkel."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Alleen PayPal en cadeaukaarten, nooit crypto. Er bestaat geen walletadres, dus CashPilot heeft geen on-chain saldo om te tonen."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Log in op <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, druk op F12 → Application → Cookies en kopieer de waarde van de cookie <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Verdien wat Salad Reward Points, of besteed je saldo"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Als een account 12 maanden achter elkaar geen Reward Points verdient, kan het niet-ingewisselde saldo verlopen."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Laat de Salad-app draaien totdat hij verdient, of besteed het hele saldo in de Salad Storefront. Als je maar een deel uitgeeft, begint de periode van 12 maanden niet opnieuw."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot draait Salad niet: je gebruikt de eigen desktopapp van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Verschillende Trustpilot-reviewers melden in oktober en november 2026 dat PayPal-uitbetalingen snel binnenkomen, bij sommigen meer dan eens; één reviewer zegt in dezelfde periode dat herhaalde pogingen tot uitbetaling mislukten."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel is een Layer 1-blockchain op Cosmos voor gedecentraliseerde VPN. Node-operators verkopen bandbreedte aan VPN-gebruikers met flexibele prijzen (per GB of per uur). Er is een officiële handleiding voor uitrollen met Docker. Project dat al lang loopt, met een actieve community.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "Gedecentraliseerde VPN op Cosmos - node-operators verkopen bandbreedte"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Operators stellen hun eigen prijzen in, per GB of per uur. De inkomsten hangen af van de vraag van VPN-gebruikers in jouw regio."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Per sessie"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Betalingen zijn in de P2P-token, en 20% van elke bandbreedtebetaling gaat naar stakers in plaats van naar de host van de node."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "De token is in 2021 hernoemd van SENT naar DVPN en in 2025 van DVPN naar P2P."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot draait Sentinel niet: je gebruikt de eigen nodesoftware van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel publiceert de broncode van zijn node onder een eigen opensourcelicentie."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia is een gedecentraliseerde marktplaats voor opslag, beheerd door de Sia Foundation (een Zwitserse non-profitorganisatie), die sinds 2015 actief is. Draai de officiële hostd-node van de Foundation om vrije schijfruimte te verhuren en Siacoin te verdienen met opslag- en bandbreedtecontracten. Je moet eerst wat Siacoin kopen voordat de node kan verdienen: hosts zetten onderpand vast voor elk contract en betalen kosten voor elk opslagbewijs. Het onderpand komt terug als een contract is afgerond en wordt verbrand als de node offline gaat of data kwijtraakt, dus er is een machine nodig die altijd aan staat (Sia noemt minstens 95% uptime). De inkomsten hangen af van hoeveel data huurders echt opslaan; Sia raadt een prijs aan van $1 per TB per maand voor opslag, dus het past bij machines met grote vrije schijven en niet bij kleine VPS'en.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Opslagnode van de Sia Foundation - officiële Docker-image, verdien Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Herstelzin van de wallet"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Dashboardwachtwoord"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Opslagmap"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "BIP-39-herstelzin die de Siacoin-wallet van de host beheert. Maak er een aan met `docker run --rm ghcr.io/siafoundation/hostd seed` en maak er een back-up van -- het is de ENIGE manier om bij de inkomsten te komen"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Wachtwoord voor de web-UI en de lokale API van hostd (BasicAuth). Elke lange wachtwoordzin volstaat"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Pad op de host, op je grootste schijf, waar de data van huurders wordt opgeslagen (bijv. /srv/sia). Er moet minstens 256GB vrij zijn"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Bij het uitrollen maakt CashPilot een nieuwe wallet aan op de machine waarop de node draait en toont de herstelzin één keer: schrijf die op. Wil je een wallet gebruiken die je al hebt, plak dan in plaats daarvan de herstelzin daarvan. Stuur na het uitrollen wat Siacoin naar de wallet van de node voor onderpand en kosten, voeg daarna in het dashboard de opslagmap (/storage) toe, stel prijzen in en kondig de host aan.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "De herstelzin van de wallet (hostd.yml), de walletdatabase, de hostinstellingen en de contractstatus. Als je die kwijtraakt, verlies je de identiteit van de node en het bijhouden van de contractopbrengsten; de herstelzin die je hebt opgeschreven is dan de enige manier om het tegoed terug te krijgen."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Opgeslagen data van huurders. Als je die kwijtraakt, mislukken de opslagbewijzen en verlies je het onderpand dat voor die contracten is vastgezet."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Hosts stellen hun eigen prijzen in. Sia raadt $1 per opgeslagen TB per maand aan en meer dan $5 per gedownloade TB, en 3.9% van elke contractuitbetaling gaat naar Siafund-houders. Het inkomen groeit met de hoeveelheid huurdersdata die op de node terechtkomt; die begint bij nul en groeit met uptime en prijs. Onderpand (Sia stelt 2x de opslagprijs voor) wordt per contract vastgezet en na een geslaagde afronding teruggegeven.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Inkomsten worden opgebouwd in de eigen Siacoin-wallet van de host (beheerd met de herstelzin). Wissel SC om op een exchange en neem van daaruit op naar je bank of kaart; er is geen uitbetalingsaanvraag bij de aanbieder.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Het tegoed staat in de Sia-wallet in de node, die met de herstelzin wordt beheerd. De herstelzin staat alleen in het datavolume van hostd op de machine waarop het draait; CashPilot slaat hem nooit op. De zin die je opschrijft wanneer de wallet wordt aangemaakt, is de enige manier om hem te herstellen.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Een stabiel openbaar adres met de poorten 9981 (TCP, consensus) en 9984 (TCP en UDP, huurderscontracten) doorgestuurd. Hosting in een datacenter of op een VPS is gebruikelijk op Sia. De wallet heeft Siacoin nodig voordat de node contracten kan aannemen."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Schijfruimte en de bandbreedte om die te leveren."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Nee. Huurders slaan versleutelde bestandsfragmenten op je schijf op en halen ze weer op. Andere mensen sturen geen willekeurig verkeer via je IP-adres."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Je Sia-walletadres, de openbare sleutel van de host en het openbare IP:poort dat de node aankondigt zodat huurders hem kunnen bereiken."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Langdurig upload- en downloadverkeer op de lijn, net als bij elke andere opslagserver; er wordt geen geanonimiseerd webverkeer van derden aan jou toegeschreven."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Vrij toegankelijk: geen aanmelding of account. Onderpand wordt verbrand als de node opslagbewijzen mist doordat hij offline gaat of data kwijtraakt."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Inkomsten zijn Siacoin in je eigen wallet: er is geen uitbetaling naar een bank, dus je verkoopt zelf op een exchange."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "Onderpand wordt per contract vastgezet en verbrand als de host opslagbewijzen mist doordat hij offline gaat of data kwijtraakt."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Slechts ongeveer 30% van de opslag die op het netwerk wordt aangeboden, is in gebruik, dus een nieuwe host concurreert om weinig vraag."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Huurders slaan versleutelde bestandsfragmenten op en niemand stuurt verkeer via je IP-adres, maar we hebben niet gevonden waar Sia zegt wie de huurders zijn of hoe ze worden gecontroleerd."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd wordt sinds 2022 openlijk ontwikkeld door de Sia Foundation."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd is open source onder de MIT-licentie."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "De Sia Foundation publiceert hostd als container-image."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Vrij toegankelijk: geen aanmelding of account."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide is een dienst voor het delen van bandbreedte waarmee je geld verdient aan ongebruikte internetbandbreedte. Gebruikt een optionele machine-ID om het apparaat te volgen. Beschikbaar via Docker-images uit de community van het project income-generator.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Bandbreedte delen - op basis van machine-ID"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "Machine-ID"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "Machine-ID van een bestaand apparaat dat al is geregistreerd (wordt automatisch aangemaakt als je dit leeg laat)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Weinig informatie beschikbaar. De inkomsten hangen af van de locatie."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "Op aanvraag"
  source: "be820103712e"
spide.payout.notes:
  text: "Nog niet vastgesteld: CashPilot heeft nog niet nagekeken waar deze dienst je inkomsten bewaart."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% van hun inkomsten"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "$5 aanmeldbonus"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "Verkeer via één openbaar IP-adres wordt verdeeld over de apparaten die het delen, dus een tweede apparaat op dezelfde verbinding voegt niets toe."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot draait Spide niet: je gebruikt de eigen app van de aanbieder, dus CashPilot kan die niet voor je uitrollen of bijwerken. De voorwaarden zijn niet gecontroleerd op containers."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Mine Pearl, Zano of Ravencoin met één NVIDIA-GPU. CashPilot downloadt bij de eerste start de officiële release van SRBMiner-Multi en controleert de SHA-256. De pool die je kiest, betaalt uit naar je openbare uitbetalingsadres. SRBMiner-Multi houdt 2% van de hashtijd in bij Pearl en 0.85% bij de andere twee. De stroom kan meer kosten dan de munten die je verdient."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Mine Pearl en andere GPU-munten op een NVIDIA-GPU"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Uitbetalingsadres"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "Workernaam"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "Algoritme"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "Pool (host:poort)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "Poolverbinding versleutelen (TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "Je openbare Pearl-adres (prl1...). Voor Zano of Ravencoin vul je het adres van die munt in en een pool daarvoor."
