packetstream.description:
  text: "PacketStream is een peer-to-peer-marktplaats voor bandbreedte waarop je je ongebruikte bandbreedte kunt verkopen. Het drijft een residentieel proxynetwerk aan dat wordt gebruikt voor marktonderzoek, SEO-monitoring en advertentieverificatie. Eenvoudige Docker-installatie waarvoor alleen een CID (Client ID) nodig is. Let op: een login met CAPTCHA-beveiliging kan het geautomatiseerd uitlezen van inkomsten lastig maken.\n"
