  source: "70db8167d5bc"
passiveapp.description:
  text: "PassiveApp is een DePIN-platform waarmee je crypto- en PayPal-beloningen verdient door ongebruikte bandbreedte en rekenkracht te delen. In de praktijk alleen Windows: de eigen downloadpagina van de leverancier vermeldt Android, iOS en Linux al sinds minstens februari 2025 ongewijzigd als \"coming soon\", en er bestaat geen macOS-versie — ondanks marketingteksten op dezelfde site die bredere ondersteuning beloven. Geen Docker-image.\n"
