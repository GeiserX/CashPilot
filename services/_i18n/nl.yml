proxyrack.description:
  text: "Met het Peer-programma van ProxyRack verdien je door je bandbreedte te delen als onderdeel van hun proxynetwerk. Elk apparaat heeft een unieke hexadecimale UUID van 64 tekens nodig en optioneel een API-sleutel om het apparaat automatisch te registreren. Werkt op zowel residentiële als VPS-/datacenterverbindingen. Het dashboard zit achter Cloudflare, waardoor je de API-sleutel mogelijk handmatig via de browser moet ophalen.\n"
