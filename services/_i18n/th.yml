clore-ai.description:
  text: "Clore.ai เป็นตลาด GPU แบบเพียร์ทูเพียร์ ลงประกาศเครื่อง Linux ที่มี GPU NVIDIA ตั้งราคาแบบ spot และแบบ on-demand เอง แล้วผู้เช่าจะเรียกใช้คอนเทนเนอร์ Docker ของตนบนเครื่องนั้น ได้รับเงินเฉพาะนาทีที่มีการเช่า เป็น CLORE, BTC, USDT หรือ USDC การเป็นโฮสต์ต้องใช้เครื่อง x86_64 ที่ใช้ Ubuntu 22.04 ขึ้นไป (หรือ HiveOS) ไดรเวอร์ NVIDIA ที่ใช้งานได้ และความเร็วอัปโหลดและดาวน์โหลดอย่างน้อย 100 Mbps ไม่รองรับ GPU ของ AMD\n"
  source: "d4817118c773"
clore-ai.short_description:
