uprock.description:
  text: "Uprock เป็นแพลตฟอร์ม DePIN (Decentralized Physical Infrastructure Network) ที่ให้รับคริปโตจากการแชร์การเชื่อมต่ออินเทอร์เน็ต เป็นส่วนหนึ่งของระบบนิเวศ Web3 ที่กว้างกว่า มีอิมเมจ Docker จากชุมชนแต่ไม่มีอิมเมจทางการ ส่วนขยายเบราว์เซอร์เป็นอินเทอร์เฟซหลัก\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "แชร์อินเทอร์เน็ต DePIN - จ่ายเป็นคริปโต ส่วนขยายเบราว์เซอร์เป็นหลัก"
  source: "8a2d46191a56"
