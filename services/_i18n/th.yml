  text: "ID ของโหนด EarnApp: sdk-node- ตามด้วยอักขระฐานสิบหกตัวพิมพ์เล็ก 32 ตัว ตามที่ 'earnapp showid' แสดง หลังติดตั้งใช้งาน ให้ลิงก์หนึ่งครั้งโดยเปิด https://earnapp.com/r/ ตามด้วย UUID นี้ ขณะที่เข้าสู่ระบบ EarnApp อยู่ โหนดที่ยังไม่ได้ลิงก์จะมีรายได้ แต่จะไม่เข้ายอดคงเหลือเลย"
