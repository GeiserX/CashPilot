  text: "ชื่อโฮสต์ DDNS พร้อมพอร์ต (เช่น mynode.ddns.net:28967) -- ดีกว่า IP ตรงๆ มาก เพราะ IP ตรงๆ จะทำให้โหนดเข้าถึงไม่ได้ในวันที่ ISP เปลี่ยน IP โดยไม่แจ้ง ต้องส่งต่อพอร์ต 28967 (TCP+UDP)"
