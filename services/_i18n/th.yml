mysterium.disclosure.sells:
  text: "แบนด์วิดท์ การเชื่อมต่อนี้ถูกใช้เป็นโหนดทางออกของเครือข่าย Mysterium ซึ่งขายบริการ VPN พร็อกซี และการเก็บข้อมูลเว็บ ทราฟฟิกการเก็บข้อมูลเว็บที่ออกจาก IP ที่อยู่อาศัยเป็นการใช้งานที่มีแนวโน้มถูกร้องเรียนมากที่สุด และเลือกไม่ได้ว่าโหนดจะรับส่งแบบใดในสามแบบนี้"
