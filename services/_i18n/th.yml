  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "พื้นที่ดิสก์และแบนด์วิดท์สำหรับให้บริการข้อมูล"
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "ไม่ เครื่องจะเก็บชิ้นส่วนข้อมูลของลูกค้าที่เข้ารหัสและเข้ารหัสแบบ erasure-coding ไว้ ผู้อื่นไม่ได้ส่งทราฟฟิกของตนผ่าน IP นี้"
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "ข้อมูลระบุตัวตนของโหนด ที่อยู่กระเป๋าเงิน ที่อยู่อีเมลที่โหนดต้องใช้สำหรับการแจ้งเตือนผู้ดูแล และ IP กับพอร์ตซึ่งต้องเข้าถึงได้เพื่อให้โหนดให้บริการข้อมูลได้"
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "ส่วนใหญ่เป็นเรื่องโควตาข้อมูลมากกว่าเรื่องความรับผิด: โหนดให้บริการและรับข้อมูลลูกค้าอย่างต่อเนื่อง ซึ่งเป็นทราฟฟิกจริงที่ต่อเนื่องบนสาย แต่ต่างจากพร็อกซีหรือรีเลย์ เพราะไม่ใช่ทราฟฟิกนิรนามของบุคคลที่สามที่ถูกระบุว่ามาจากสายนี้ จึงไม่ถูกร้องเรียนเรื่องการใช้งานในทางที่ผิดแบบที่บริการเหล่านั้นเจอ"
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "ไม่จำกัดจำนวนโหนด แต่โหนดบนซับเน็ต /24 เดียวกันจะแบ่งการจัดสรรกัน หลายโหนดบนการเชื่อมต่อเดียวจึงได้น้อยลงต่อโหนด"
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk รายงานเมื่อวันที่ 27 กรกฎาคม 2026 ว่า Storj Labs ยื่นขอความคุ้มครองการล้มละลายตาม Chapter 11"
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "เงินที่ค้างจ่ายให้ผู้ดูแลโหนดก่อนการยื่นเข้าสู่กระบวนการยื่นคำร้องในคดีล้มละลาย"
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "โหนดใหม่ถูกหักรายได้ไว้ 75% จากนั้น 50% แล้ว 25% ในเก้าเดือนแรก ครึ่งหนึ่งจะคืนในเดือนที่ 16 และส่วนที่เหลือจะคืนเฉพาะเมื่อออกจากเครือข่ายอย่างถูกวิธี"
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "ลูกค้าเก็บชิ้นส่วนไฟล์ที่เข้ารหัสไว้ และไม่มีใครส่งทราฟฟิกผ่าน IP นี้ แต่เราไม่พบว่า Storj ระบุไว้ที่ใดว่าลูกค้าเป็นใครหรือตรวจสอบอย่างไร"
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "ซอฟต์แวร์โหนดพื้นที่จัดเก็บเป็นโอเพนซอร์สภายใต้ AGPL-3.0"
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj เผยแพร่อิมเมจ Docker ของตนเอง คือ storjlabs/storagenode"
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "ไม่มีบัญชี ใช้เพียงที่อยู่กระเป๋าเงินและอีเมลสำหรับการแจ้งเตือนผู้ดูแล"
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "โหนดที่ใช้งานอยู่ยังได้รับเงินต่อหลังการยื่น"
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR เป็นพูลขุด Monero ที่ไม่ต้องมีบัญชี เครื่องขุดเข้าสู่ระบบโดยใช้ที่อยู่ Monero เป็นชื่อผู้ใช้ และพูลจะจ่ายเงินเข้าที่อยู่นั้น CashPilot ไม่ได้เรียกใช้เครื่องขุดที่นี่ แต่จะอ่านยอดคงเหลือที่ SupportXMR เก็บไว้ให้ที่อยู่นี้ เพื่อให้เห็นว่าเครื่องขุดด้วย CPU ทำรายได้ได้เท่าไรเทียบกับรายได้อื่น ยอดคงเหลือคือรายได้ที่ได้มาแล้วแต่ยังไม่ได้รับ พูลจะจ่ายเมื่อยอดเกินเกณฑ์การจ่ายเงิน\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "พูลขุด Monero ติดตามด้วยที่อยู่รับเงิน"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (อัตโนมัติ), 0.01 XMR เมื่อร้องขอ"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "เมื่อยอดคงเหลือเกินเกณฑ์ หรือเมื่อร้องขอ"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR จ่ายเงินเข้าที่อยู่เมื่อยอดคงเหลือถึงเกณฑ์ (ค่าเริ่มต้น 0.1 XMR) บนเว็บไซต์ยังขอจ่ายเงินทันทีได้ตั้งแต่ 0.01 XMR โดยมีค่าธรรมเนียม 0.001 XMR"
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "ยอดคงเหลือคือรายได้ที่ได้มาแล้วแต่ยังไม่ได้รับ จนกว่า SupportXMR จะจ่ายเข้าที่อยู่นี้ ยอดคงเหลือของ Monero อ่านบนเชนไม่ได้หากไม่มี private view key ซึ่ง CashPilot ไม่เคยขอ จึงต้องยืนยันการจ่ายเงินแต่ละครั้งเอง"
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "ที่อยู่รับเงิน Monero: ชื่อผู้ใช้ที่เครื่องขุดใช้บน SupportXMR โดยไม่มีส่วน <b>.workername</b> หรือ <b>+difficulty</b> ที่อยู่นี้เป็นสาธารณะและใช้เข้าถึงเงินไม่ได้"
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "ต้องมีเครื่องขุด Monero (XMRig) ที่ชี้ไปที่ pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "การประมวลผล"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "ไม่ เครื่องขุดส่งแฮชไปยังพูล ไม่มีใครส่งทราฟฟิกผ่านการเชื่อมต่อนี้"
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "ที่อยู่ Monero ชื่อเวิร์กเกอร์ที่เลือก อัตราแฮช และที่อยู่ IP ของเครื่องขุดตามที่พูลเห็น"
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "เครื่องขุดเปิดการเชื่อมต่อไปยังพูลไว้หนึ่งเส้นและใช้แบนด์วิดท์น้อย ต้นทุนที่ต้องระวังคือค่าไฟ ไม่ใช่ ISP"
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "ไม่มีบัญชี ที่อยู่คือข้อมูลระบุตัวตน และทุกคนอ่านสถิติได้ที่ supportxmr.com"
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "จ่ายเป็น Monero เท่านั้น ค่าธรรมเนียมพูล 0.6% และเกณฑ์ค่าเริ่มต้น 0.1 XMR ก่อนการจ่ายเงินอัตโนมัติ"
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot ไม่ได้เรียกใช้เครื่องขุดสำหรับ SupportXMR ต้องชี้เครื่องขุดของตนเองไปที่พูล และ CashPilot ทำได้เพียงอ่านยอดคงเหลือ"
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol ให้เอเจนต์ AI เข้าถึงเว็บแบบเรียลไทม์ผ่านเครือข่าย Beacon โดย Teneo Beacon เป็นแอปของ Teneo เองสำหรับ Android, iOS, macOS, Windows และ Linux พร้อมเวอร์ชันบรรทัดคำสั่งสำหรับเซิร์ฟเวอร์และ Raspberry Pi แอปจะแชร์แบนด์วิดท์ที่ไม่ได้ใช้หลังยอมรับหน้าจอขอความยินยอม และได้รับ Teneo Protocol Points และ Fragments ขณะออนไลน์ Fragments นับรวมในการจับรางวัลประจำฤดูกาลที่จ่ายเป็น USDC (Beacon Drop) Teneo ระบุว่า Beacon ได้คะแนนเป็นสองเท่าของส่วนขยายเบราว์เซอร์รุ่นเก่า มี Beacon เพียงตัวเดียวที่มีรายได้ต่อการเชื่อมต่ออินเทอร์เน็ตหนึ่งเส้น อุปกรณ์อื่นบนการเชื่อมต่อเดียวกันจะอยู่ในสถานะสแตนด์บาย สมัครที่ Expedition Hub ด้วยลิงก์หรือรหัสแนะนำ PSA3BHPJ แล้วเข้าสู่ระบบ Beacon\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "แอปแบนด์วิดท์ DePIN (Beacon) - Fragments สำหรับจับรางวัล USDC ประจำฤดูกาล +100 Fragments เมื่อใช้ลิงก์แนะนำ"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "ได้รับ Teneo Points และ Fragments โดย Fragments นับรวมในการจับรางวัล USDC ประจำฤดูกาล แต่ละฤดูกาลจึงจ่ายเป็นรางวัล ไม่ใช่อัตราคงที่ Teneo ระบุว่า Beacon ได้คะแนนเป็นสองเท่าของส่วนขยายเบราว์เซอร์ เคลมบูสต์ทุก 8 ชั่วโมงเพื่อรับ Fragments สูงสุด 3 เท่า หากพลาดรอบ ตัวคูณจะลดลง"
  source: "7a9714079893"
teneo.payment.frequency:
  text: "จับรางวัลประจำฤดูกาล (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "รางวัล Beacon Drop จ่ายเป็น USDC เข้ากระเป๋าเงินที่ผูกไว้ใน Expedition Hub โดย Hub จะแสดงจำนวนวันที่เหลือสำหรับผูกกระเป๋าเงิน รางวัลที่ไม่ได้ผูกกระเป๋าเงินทันเวลาจะถูกริบ"
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "ผูกกระเป๋าเงินใน Expedition Hub ก่อนที่รางวัลของฤดูกาลจะจ่าย Hub จะริบรางวัลที่ไม่ได้ผูกกระเป๋าเงินทันเวลา"
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% ของ Fragments ของเพื่อนที่แนะนำแต่ละคน และ 2% ของ Fragments ของผู้ที่เพื่อนแนะนำต่อ เมื่อเพื่อนสมัครภายใน 7 วันและได้รับ 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments เมื่อสมัคร และเพิ่มอีก +150 เมื่อได้ถึง 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "มี Beacon เพียงตัวเดียวที่มีรายได้ต่อการเชื่อมต่ออินเทอร์เน็ตหนึ่งเส้น เครื่องในศูนย์ข้อมูลมีรายได้เฉพาะบนผู้ให้บริการโฮสติ้งที่ Teneo เปิดให้ ได้ Fragments ครึ่งหนึ่ง และไม่มีคะแนนหรือโบนัสการแนะนำ การเชื่อมต่อผ่าน VPN จะไม่มีรายได้เลย"
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Fragments ของ Beacon จ่าย USDC ในรูปรางวัลจากการจับรางวัลประจำฤดูกาลเท่านั้น การรันจึงไม่ได้รายได้ในจำนวนที่แน่นอน"
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo ระบุว่าคะแนนจะถูกรวมเป็น $AGENTIC ซึ่งเป็นโทเค็นรางวัลที่โอนไม่ได้ ไม่ใช่โทเค็น $TENEO"
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "จนถึงเดือนพฤศจิกายน 2026 ยังไม่มีการยืนยันวันเปิดตัว การจัดสรร หรือขั้นตอนการเคลม $TENEO หลังจากเป้าหมายเดิมในไตรมาสที่สองของปี 2026 ผ่านไปแล้ว"
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot ไม่ได้เรียกใช้ Teneo ต้องติดตั้งแอป Beacon ของผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ ยังไม่ได้ตรวจสอบข้อกำหนดเรื่องคอนเทนเนอร์"
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo ระบุว่าทราฟฟิกมาจากลูกค้าธุรกิจที่ผ่านการตรวจสอบ และบล็อกที่อยู่ส่วนตัวและพอร์ตที่เสี่ยงต่อการใช้งานในทางที่ผิด แต่ไม่ได้บอกว่าตรวจสอบลูกค้าเหล่านั้นอย่างไร"
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network เป็นเครือข่ายส่งวิดีโอและประมวลผล AI แบบกระจายศูนย์ที่มีมานาน (ตั้งแต่ปี 2018) ผู้ใช้เรียกใช้ Edge Node ที่แชร์แบนด์วิดท์ พื้นที่จัดเก็บ และพลังประมวลผล มีพันธมิตรด้านเนื้อหารายใหญ่ ได้รับโทเค็น TFUEL\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "CDN แบบกระจายศูนย์ + การประมวลผล AI - รางวัล TFUEL โครงการที่มีมานาน"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "แอปเดสก์ท็อปเท่านั้น รายได้ขึ้นอยู่กับทรัพยากรและตำแหน่งที่ตั้ง มีพันธมิตรรายใหญ่ และมีซื้อขายบนกระดานเทรดทุกแห่ง"
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "ต่อเนื่อง"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "ยังไม่ได้ระบุ: CashPilot ยังไม่ได้ตรวจสอบว่าบริการนี้เก็บรายได้ของคุณไว้ที่ใด"
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot ไม่ได้เรียกใช้ Theta Edge ต้องใช้แอปเดสก์ท็อปของผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ ยังไม่ได้ตรวจสอบข้อกำหนดเรื่องคอนเทนเนอร์"
  source: "893de938ed14"
titan.description:
  text: "Titan Network เป็นแพลตฟอร์ม DePIN ที่แชร์ที่อยู่ IP พื้นที่จัดเก็บ และแบนด์วิดท์ เพื่อแลกกับรางวัลเป็นโทเค็น TNT มีให้ใช้บน Windows, Mac และ Android โหนดมีส่วนร่วมใน CDN และชั้นพื้นที่จัดเก็บแบบกระจายศูนย์ รายได้ทั่วไปอยู่ที่ $5-30/เดือน ขึ้นอยู่กับทรัพยากรที่แชร์และตำแหน่งทางภูมิศาสตร์\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN แชร์ IP พื้นที่จัดเก็บ แบนด์วิดท์ - $5-30/เดือน"
  source: "799e68401067"
titan.earnings.notes:
  text: "แชร์ IP พื้นที่จัดเก็บ และแบนด์วิดท์ รายได้ขึ้นอยู่กับทรัพยากรที่ให้และภูมิภาค การจัดสรรพื้นที่จัดเก็บมากขึ้นจะได้รางวัลมากขึ้น"
