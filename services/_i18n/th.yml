unmineable.description:
  text: "ขุดด้วย CPU และรับเงินเป็นเหรียญที่เลือก เช่น SHIB, DOGE หรือ XMR CashPilot เรียกใช้ XMRig กับพูล RandomX ของ unMineable และ unMineable จะแปลง Monero ที่ CPU ขุดได้เป็นเหรียญที่เลือก แล้วจ่ายเข้าที่อยู่สาธารณะเมื่อยอดคงเหลือถึงเกณฑ์การจ่ายเงินของเหรียญนั้น เวิร์กเกอร์ทุกตัวที่ CashPilot ติดตั้งใช้งานจะมีรหัสแนะนำ unMineable ของ CashPilot ซึ่งลดค่าธรรมเนียมแพลตฟอร์มจาก 1% เหลือ 0.75% ค่าไฟอาจสูงกว่ารายได้ที่ได้"
