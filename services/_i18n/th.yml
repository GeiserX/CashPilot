  text: "จ่ายเป็นคริปโตเท่านั้น (CLORE, BTC, USDT หรือ USDC) และ Clore หักเพิ่ม 15% จากการเช่าที่ผู้เช่าจ่ายเป็น BTC, USDT หรือ USDC เว้นแต่โฮสต์จะล็อก CLORE ไว้เพื่อลดส่วนนี้"
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "โฮสต์ได้รับเงินเฉพาะนาทีที่มีการเช่า และตัวเลขของ Clore สำหรับ RTX 4090 เป็นเพดาน (\"up to ~$490/month\") สำหรับการ์ดเพียงใบเดียว"
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "การใช้งานพื้นฐานไม่ต้องทำ KYC แต่ Clore อาจขอยืนยันตัวตนสำหรับการถอนจำนวนมากหรือกรณีด้านการปฏิบัติตามกฎระเบียบ"
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "ผู้เช่าเรียกใช้อิมเมจ Docker สาธารณะใดก็ได้บนเครื่องนี้ ข้อกำหนดระบุการใช้งานที่ต้องห้าม (มัลแวร์, DDoS, CSAM และอื่นๆ) แต่เราไม่พบคำอธิบายว่าตรวจสอบผู้เช่าอย่างไร"
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot ไม่ได้เรียกใช้ Clore.ai ต้องติดตั้งเอเจนต์โฮสต์ของ Clore บนเครื่อง GPU ของตนเอง (Ubuntu 22.04 ขึ้นไป หรือ HiveOS) CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้"
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Clore หัก 5% จากการเช่าแบบ on-demand (1.25% สำหรับ spot) เมื่อผู้เช่าจ่ายเป็น CLORE โดยไม่มีค่าธรรมเนียมเพิ่ม"
  source: "699adf0a2179"
