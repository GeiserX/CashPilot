2miners-etc.description:
  text: "ติดตามยอดคงเหลือ Ethereum Classic ที่ยังไม่ได้จ่ายซึ่ง 2Miners เก็บไว้ให้ที่อยู่รับเงิน ETC สาธารณะ เรียกใช้เครื่องขุดของตนเองและชี้ไปที่พูล CashPilot จะอ่านยอดคงเหลือและขอให้ยืนยันการจ่ายเงินเมื่อยอดคงเหลือลดลง\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "พูลขุด Ethereum Classic ติดตามด้วยที่อยู่รับเงิน"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (ปรับได้)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "พูลตรวจสอบเกณฑ์การจ่ายเงินทุกสองชั่วโมง"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners จ่ายเงินเข้าที่อยู่โดยอัตโนมัติเมื่อถึงเกณฑ์ที่เลือกไว้ เกณฑ์ต่ำสุดสำหรับการจ่าย ETC คือ 0.1 ETC\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "ยอดคงเหลือที่ยังไม่ได้จ่ายจะสะสมอยู่ที่ 2Miners ส่วนยอดคงเหลือในกระเป๋าเงินเป็นการอ่านแยกต่างหากจาก Ethereum Classic ตรวจสอบจำนวนที่ได้รับในกระเป๋าเงินก่อนยืนยันการจ่ายเงินใน CashPilot\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "ป้อนที่อยู่รับเงิน Ethereum Classic สาธารณะที่เครื่องขุดใช้บน 2Miners ซึ่งขึ้นต้นด้วย <b>0x</b> ไม่ต้องใส่ชื่อเวิร์กเกอร์\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "ต้องมีเครื่องขุด ETCHash ที่ชี้ไปที่ 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "การประมวลผล"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "ไม่ เครื่องขุดส่งงานขุดไปยังพูล"
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "พูลใช้ที่อยู่รับเงิน ชื่อเวิร์กเกอร์ที่เลือก และที่อยู่ IP ของเครื่องขุด"
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "ทุกคนดูสถิติได้จากที่อยู่รับเงิน พูลจะขอให้ยืนยัน IP ของเวิร์กเกอร์ก่อนเปลี่ยนเกณฑ์"
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "พูลเก็บค่าธรรมเนียม 1% และระงับการจ่ายเงินไว้จนกว่าจะถึงเกณฑ์"
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (เดิมชื่อ ATOR) เป็นเครือข่ายความเป็นส่วนตัวแบบกระจายศูนย์ที่ใช้การกำหนดเส้นทางแบบหัวหอม (onion routing) ผู้ดูแลโหนดเรียกใช้โหนดรีเลย์และได้รับโทเค็น ANYONE ตามแบนด์วิดท์ที่ให้ ลองนึกถึง \"Tor ที่มีสิ่งจูงใจ\" CashPilot เรียกใช้จากอิมเมจของตนเองซึ่งสร้างจากแพ็กเกจ Debian ที่ลงนามแล้วของโครงการ สำหรับ amd64 และ arm64 การตั้งค่าทำผ่านไฟล์ anonrc ที่เมานต์เข้าไปในคอนเทนเนอร์ (Nickname, ContactInfo, ORPort ฯลฯ) รีเลย์จะไม่มีรายได้จนกว่าจะล็อก 100 ANYONE ไว้ให้เป็นเวลาอย่างน้อย 180 วัน และต้องเคลมรางวัลด้วยการลงนามในกระเป๋าเงิน รีเลย์ยังเผยแพร่ IP สาธารณะในไดเรกทอรีรีเลย์ของเครือข่ายด้วย ซึ่งอาจทำให้ชื่อเสียงของ IP ที่แอปแบนด์วิดท์แบบ IP ที่อยู่อาศัยจ่ายเงินให้เสียหายได้\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "การกำหนดเส้นทางแบบหัวหอมแบบกระจายศูนย์ - โหนดรีเลย์ Tor ที่มีสิ่งจูงใจ"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "คีย์ข้อมูลระบุตัวตน ed25519 ของรีเลย์ หากทำลายคีย์นี้ ชื่อเสียงของรีเลย์จะหายไปและประวัติรายได้จะเริ่มใหม่จากศูนย์"
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "จ่ายเงินเฉพาะเมื่อล็อก 100 ANYONE ต่อรีเลย์ไว้อย่างน้อย 180 วัน และมีการเคลมรางวัลที่ลงนามในกระเป๋าเงินแล้ว หากไม่มีการสเตก รีเลย์จะไม่มีรายได้ หากมี รายได้จะขึ้นอยู่กับแบนด์วิดท์ที่ให้และเวลาที่ออนไลน์"
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "ตามรอบ Epoch"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "ตั้งเป็น ContactInfo ใน anonrc โดยขึ้นต้นด้วย '@anon:0x...'"
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "ลายนิ้วมือ (fingerprint) ของรีเลย์ คั่นด้วยเครื่องหมายจุลภาค ค่านี้ไม่มีในแดชบอร์ดเว็บ ให้รัน <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> บนเครื่องที่เรียกใช้รีเลย์\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "แบนด์วิดท์ ในฐานะรีเลย์ในเครือข่าย Anyone (ซึ่งแยกมาจาก Tor)"
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "ใช่ รีเลย์ส่งต่อทราฟฟิกของผู้อื่น IP นี้จะเป็นจุดสุดท้ายหรือไม่ขึ้นอยู่กับว่ารีเลย์ตั้งค่าเป็นทางออก (exit) หรือไม่"
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "คีย์ข้อมูลระบุตัวตนสาธารณะของรีเลย์ IP และพอร์ต และสถิติเวลาที่ออนไลน์ ทั้งหมดนี้เผยแพร่ในไดเรกทอรีของเครือข่ายโดยการออกแบบ หากตั้ง ContactInfo ใน anonrc ค่านี้จะถูกเผยแพร่ที่นั่นด้วย และจะถูกจัดทำดัชนีแบบสาธารณะอย่างถาวร โดยมักเป็นที่อยู่อีเมล จึงควรเว้นว่างไว้ เว้นแต่ต้องการให้เป็นสาธารณะ"
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "มีจริง ทราฟฟิกของรีเลย์จะถูกระบุว่ามาจากการเชื่อมต่อนี้ โดยเฉพาะรีเลย์ทางออกมักถูกร้องเรียนเรื่องการใช้งานในทางที่ผิด ISP สำหรับผู้ใช้ทั่วไปหลายรายห้ามใช้งาน"
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "ไม่มีบัญชีให้สมัคร จึงไม่มีอะไรให้จำกัดต่อบัญชี แต่การจะมีรายได้ยังต้องมีกระเป๋าเงิน Ethereum ที่ล็อก 100 ANYONE ไว้ต่อรีเลย์เป็นเวลาอย่างน้อย 180 วัน และ CashPilot ต้องใช้ลายนิ้วมือของรีเลย์เพื่ออ่านรางวัล โครงการไม่ได้เผยแพร่ขีดจำกัดจำนวนรีเลย์ต่อ IP และแคตตาล็อกก็ไม่ได้ระบุไว้"
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "รีเลย์จะไม่มีรายได้เลย เว้นแต่จะล็อก 100 ANYONE ไว้ให้อย่างน้อย 180 วัน และการเคลมรางวัลแต่ละครั้งต้องลงนามในกระเป๋าเงิน"
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "ส่งต่อทราฟฟิกของผู้อื่นโดยการออกแบบ โดยไม่มีการตรวจสอบว่าเป็นใคร รีเลย์ทางออกมักถูกร้องเรียนเรื่องการใช้งานในทางที่ผิด"
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "ข้อมูลระบุตัวตน IP และเวลาที่ออนไลน์ของรีเลย์ถูกเผยแพร่ในไดเรกทอรีของเครือข่าย และ ContactInfo ที่ตั้งไว้จะเป็นสาธารณะตลอดไป"
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "ไม่มีบัญชีให้สมัคร รีเลย์ต้องการแค่กระเป๋าเงิน โดยไม่มีการยืนยันตัวตน"
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "ซอฟต์แวร์รีเลย์เป็น Tor ฉบับแยกที่เผยแพร่แล้ว ภายใต้สัญญาอนุญาตของ Tor"
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot สร้างอิมเมจของตนเองจากซอฟต์แวร์รีเลย์ที่ Anyone เผยแพร่ ซึ่งไม่ต้องใช้บัญชี"
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping เป็นแพลตฟอร์มตรวจสอบเครือข่ายแบบกระจายศูนย์ที่จ่ายเงินให้สำหรับการเรียกใช้โหนด โหนดจะตรวจสอบเว็บไซต์ ทดสอบความหน่วง และตรวจคุณภาพเครือข่ายให้ลูกค้าของ Bitping ใช้ได้ทั้งการเชื่อมต่อแบบที่อยู่อาศัยและ VPS อิมเมจ Docker จะเข้าสู่ระบบด้วยตัวแปรสภาพแวดล้อม BITPING_EMAIL และ BITPING_PASSWORD ในการเริ่มครั้งแรก (\"Attempting login with environment variables\" ในบันทึกของอิมเมจเอง) จากนั้นจะเก็บเซสชันไว้ในวอลุ่มที่เมานต์ไว้ การรีสตาร์ทจึงไม่ต้องยืนยันตัวตนใหม่\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "แชร์แบนด์วิดท์ - ตรวจสอบเครือข่ายแบบกระจายศูนย์ ใช้บน VPS ได้"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "อีเมล"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "รหัสผ่าน"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "อีเมลบัญชี Bitping (ใช้เข้าสู่ระบบเดียวกับ <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "รหัสผ่านบัญชี Bitping ใช้เพียงครั้งเดียวเพื่อสร้างเซสชันของโหนด ซึ่งจะถูกเก็บไว้ในวอลุ่มข้อมูลต่อไป"
  source: "acb49b137850"
bitping.earnings.notes:
  text: "รายได้ขึ้นอยู่กับคุณภาพเครือข่ายและความต้องการการตรวจสอบจากตำแหน่งที่ตั้ง รับโหนดบน VPS"
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "เมื่อร้องขอ"
  source: "be820103712e"
bitping.cashout.notes:
  text: "รายได้ของโหนดอยู่ที่ nodes.bitping.com ส่วน app.bitping.com เป็นแดชบอร์ดสำหรับลูกค้า API ถอนได้เป็น SOL เท่านั้น เมื่อยอดคงเหลือที่ยังไม่ได้จ่ายเกิน $0.05 ให้พิมพ์ที่อยู่ Solana ลงในคำขอ ซึ่งจะดำเนินการภายใน 24 ชั่วโมง กระเป๋าเงิน Solana ใหม่หรือว่างเปล่าต้องมี SOL ประมาณ 0.001 SOL ก่อน เพื่อให้ถึงค่าเช่าขั้นต่ำของเครือข่าย"
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "ตอนนี้รองรับ Solana เท่านั้น และพิมพ์ที่อยู่ในขณะถอนเงิน แทนที่จะบันทึกไว้"
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "ใช้อีเมลและรหัสผ่านบัญชี Bitping (เหมือนกับ <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)"
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "ถอนยอดคงเหลือ Bitping"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping อาจริบรายได้ที่ไม่ได้เคลมนานกว่า 12 เดือน หลังแจ้งทางอีเมลล่วงหน้า 30 วัน"
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "ส่งคำขอถอน SOL บน nodes.bitping.com และพิมพ์ที่อยู่ Solana ลงในคำขอ"
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "การถอนจ่ายเป็น Solana (SOL) ไปยังที่อยู่ที่พิมพ์ลงในคำขอแต่ละครั้ง"
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "ศูนย์ช่วยเหลือของ Bitping ระบุว่าการถอนไปยังกระเป๋าเงิน Solana ใหม่ที่ว่างเปล่าอาจล้มเหลว จนกว่าจะเติม SOL เล็กน้อยเข้ากระเป๋าเงินนั้นเอง"
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "ศูนย์ช่วยเหลือของ Bitping ระบุว่ารองรับเซิร์ฟเวอร์และคอนเทนเนอร์ Docker"
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "การถอนต้องการเพียงที่อยู่ Solana ที่พิมพ์ลงในคำขอ"
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit เป็นบริการแชร์แบนด์วิดท์ที่จ่ายเงินผ่าน PayPal และ Stripe ไม่มีอิมเมจ Docker อย่างเป็นทางการ ไคลเอนต์คือแอปเดสก์ท็อป Windows และแอป Android บริการอยู่ที่ bytebenefit.io -- โดเมนเก่า bytebenefit.com ถูกทิ้งและถูกพักไว้ในตลาดซื้อขายโดเมน จึงเคยถูกทำเครื่องหมายว่าเลิกให้บริการไว้ที่นี่\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "แชร์แบนด์วิดท์ - จ่ายผ่าน PayPal/Stripe แอปเดสก์ท็อป/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "ไม่มีอิมเมจ Docker มีเฉพาะแอปเดสก์ท็อป Windows และแอป Android"
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "เมื่อร้องขอ"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "ยังไม่ได้ระบุ: CashPilot ยังไม่ได้ตรวจสอบว่าบริการนี้เก็บรายได้ของคุณไว้ที่ใด"
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% ของรายได้จากทราฟฟิกของผู้ที่ได้รับการแนะนำ"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
