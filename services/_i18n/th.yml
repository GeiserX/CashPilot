  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "เมื่อร้องขอ"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "ขั้นต่ำ $10 ไม่มี PayPal อีกต่อไป ให้บันทึกช่องทางรับเงินหนึ่งช่องทางในโปรไฟล์ก่อน: USDT บน Solana หรือ TON (ค่าธรรมเนียมต่ำสุด), Arbitrum (ค่าธรรมเนียมต่ำ) หรือ Tron TRC20 (ค่าธรรมเนียมเครือข่ายสูง) หรือโอนผ่านธนาคารตั้งแต่ $1,000 ที่อยู่แรกที่บันทึกจะมีผลทันที การเปลี่ยนภายหลังต้องยืนยันทางอีเมล แดชบอร์ดอาจขอช่องทางติดต่อทางแอปแชต (WhatsApp, Telegram หรือ Skype) ก่อนการถอนครั้งแรก คำขอจะจ่ายเป็นจำนวนดอลลาร์เต็ม ส่วนเศษเซนต์จะคงอยู่ในยอดคงเหลือ"
  source: "0bf13220a706"
traffmonetizer.payout.notes:
