  text: "คอนเทนเนอร์จะตั้งค่าตัวเองในการเริ่มครั้งแรก: สร้างกระเป๋าเงิน secp256k1 (BIP-39) ยืนยันตัวตนด้วย ECDSA challenge-response และเริ่มขายแบนด์วิดท์ในโหมด direct เท่านั้น สถานะทั้งหมด (กระเป๋าเงิน โทเค็นเซสชัน การตั้งค่าผู้ขาย) จะเก็บไว้ในวอลุ่ม <code>proxybase-data</code> ตรวจสอบบันทึกของคอนเทนเนอร์ในการรันครั้งแรกเพื่อดูที่อยู่กระเป๋าเงิน ใช้ <code>--upstream</code> เพื่อเพิ่มเส้นทางขายต่อพร็อกซีภายนอก\n"
