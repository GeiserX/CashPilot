  source: "1d44e028b43d"
golem.description:
  text: "Golem Network เป็นตลาดการประมวลผลแบบกระจายศูนย์ที่แชร์ทรัพยากร CPU และ GPU เพื่อแลกกับโทเค็น GLM ผู้ให้บริการเรียกใช้เอเจนต์ Yagna ซึ่งจัดการการรันงานในสภาพแวดล้อมแบบแซนด์บ็อกซ์ เป็นหนึ่งในโครงการประมวลผลแบบกระจายศูนย์ที่เก่าแก่ที่สุด (ก่อตั้งปี 2016) รองรับงาน CPU การเรนเดอร์ด้วย GPU และการประมวลผลทั่วไป จ่ายเงินผ่าน Polygon L2\n"
  source: "9a6843f56459"
golem.short_description:
  text: "ตลาดการประมวลผลแบบกระจายศูนย์ - โทเค็น GLM ผ่านเอเจนต์ Yagna"
  source: "88f817c25848"
golem.earnings.notes:
  text: "รายได้ขึ้นอยู่กับฮาร์ดแวร์ ราคา และความต้องการงาน โหนดที่มีแค่ CPU ได้น้อยกว่า โหนด GPU ได้มากกว่าแต่ต้องใช้ NVIDIA เรียกใช้เอเจนต์ผู้ให้บริการ Yagna (ไม่ใช่อิมเมจ Docker) จ่ายเงินบน Polygon เป็นโทเค็น GLM"
  source: "07287d437d51"
golem.payment.frequency:
  text: "ต่องานที่เสร็จ"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "ได้รับโทเค็น GLM ตั้งค่ากระเป๋าเงินรับเงินในการตั้งค่าผู้ให้บริการ"
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "ยังไม่ได้ระบุ: CashPilot ยังไม่ได้ตรวจสอบว่าบริการนี้เก็บรายได้ของคุณไว้ที่ใด"
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot ไม่ได้เรียกใช้ Golem ต้องติดตั้งเอเจนต์ผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ Golem มีเอกสารวิธีรันผู้ให้บริการในอิมเมจ Docker ของตนเอง"
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "เอเจนต์ผู้ให้บริการ yagna เป็นโอเพนซอร์สภายใต้ GPL-3.0"
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "ไม่มีบัญชี เพียงตั้งกระเป๋าเงินรับเงินในการตั้งค่าผู้ให้บริการ"
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "เครือข่ายดำเนินการมาประมาณสิบปีแล้ว"
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "นโยบายความเป็นส่วนตัวของ Golem ระบุผู้ดำเนินการคือ Golem Factory GmbH ในเมือง Zug ประเทศสวิตเซอร์แลนด์"
  source: "bae79b651923"
grass.description:
  text: "Grass เป็นเครือข่ายแบบกระจายศูนย์ที่ให้ขายแบนด์วิดท์ที่ไม่ได้ใช้เพื่อเป็นข้อมูลฝึก AI ทำงานเป็นส่วนขยายเบราว์เซอร์และแอปเดสก์ท็อป โดยส่งคำขอเก็บข้อมูลเว็บ (web scraping) ผ่านการเชื่อมต่อนี้เพื่อสร้างชุดข้อมูลที่มีโครงสร้าง มีผู้ใช้มากกว่า 8.5M ราย เป็นหนึ่งในเครือข่ายแบนด์วิดท์ DePIN ที่ใหญ่ที่สุด ได้รับโทเค็น GRASS บนบล็อกเชน Solana\n"
  source: "046951d812f9"
grass.short_description:
  text: "แชร์แบนด์วิดท์ DePIN สำหรับข้อมูล AI - ได้รับโทเค็น GRASS"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "โทเค็นการเข้าถึง"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "เข้าสู่ระบบที่ <a href=\"https://app.grass.io\">app.grass.io</a> กด F12 → Application → Local Storage → คลิก <code>https://app.grass.io</code> → คัดลอกค่า <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "ได้รับ Grass Points ที่แปลงเป็นโทเค็น GRASS ผ่านแอร์ดรอป มูลค่าจริงเป็น USD ขึ้นอยู่กับราคาโทเค็น ต้องใช้ส่วนขยายเบราว์เซอร์หรือแอปเดสก์ท็อป"
  source: "da61137319f8"
grass.payment.frequency:
  text: "แอร์ดรอปตามรอบ Epoch"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "รางวัลมาในรูปการแจกเป็นระยะที่ต้องเคลมบนแดชบอร์ด Grass การแจกของ Stage 2 (กิจกรรมตั้งแต่ตุลาคม 2024 ถึงมิถุนายน 2026) จ่ายเป็น USDC ให้เคลมที่ app.grass.io/dashboard ไม่เกินวันที่ 22 มกราคม 2027 หรือเร็วกว่านั้นหากมีการเคลมส่วนแบ่งครบทั้งหมดก่อน Grass จะเก็บรางวัลที่ไม่ได้เคลมไว้"
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "สะสมเป็น POINTS ส่วน GRASS จะเคลมได้จากแดชบอร์ด Grass ในช่วงแอร์ดรอปเป็นระยะ"
  source: "14879f750890"
grass.collector.credential_hint:
  text: "เข้าสู่ระบบที่ <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a> กด F12 → Application → Local Storage แล้วคัดลอกค่า <b>accessToken</b>"
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% ของคะแนนเวลาออนไลน์ของผู้ที่แนะนำโดยตรง 10% ในระดับที่สอง และ 5% ในระดับที่สาม"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "เคลม USDC ของ Grass Stage 2"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Grass จะเก็บส่วนแบ่ง Stage 2 ทั้งหมดที่ยังไม่ได้เคลมเมื่อสิ้นวันที่ 22 ม.ค. 2027 และช่วงเวลาอาจปิดเร็วกว่านั้นเมื่อมีการเคลมส่วนแบ่งครบทั้งหมดแล้ว"
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "เข้าสู่ระบบ app.grass.io ด้วยบัญชีที่ใช้ใน Stage 2 เปิดใช้งาน Grass Wallet เปิดแท็บ Allocation แล้วยืนยัน เคลมที่ app.grass.io เท่านั้น ไม่มีคะแนน Stage 2 ใช่ไหม เลือก ไม่เกี่ยวข้อง"
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "รางวัลมาเฉพาะช่วงฤดูกาลแอร์ดรอป ผู้ดูแลโหนดที่ใช้งานมานานรายงานว่าประมาณการของฤดูกาล 2 อยู่ที่หลักหน่วยถึงหลักสิบต้นๆ ดอลลาร์"
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "รางวัลฤดูกาล 2 ที่ยังไม่ได้เคลมเมื่อสิ้นวันที่ 22 มกราคม 2027 จะหายไปถาวร"
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "แอร์ดรอปครั้งแรกถูกวิจารณ์อย่างหนักเรื่องรางวัลต่อคะแนนที่น้อย ซึ่งถูกเฉลี่ยให้ผู้ใช้มากกว่าสองล้านราย"
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot ไม่ได้เรียกใช้ Grass ต้องใช้แอปหรือส่วนขยายของผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ ยังไม่ได้ตรวจสอบข้อกำหนดเรื่องคอนเทนเนอร์"
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "แอร์ดรอปครั้งแรกไปถึงที่อยู่ที่เคลมเกือบ 1.5 ล้านที่อยู่"
  source: "a4c55e10affa"
helium.description:
  text: "Helium เป็นเครือข่ายไร้สายแบบกระจายศูนย์ที่มีมานาน เริ่มจากฮอตสปอต LoRaWAN และขยายไปสู่ 5G แล้ว ต้องใช้ฮาร์ดแวร์เฉพาะ ($500+) ได้รับโทเค็น HNT/MOBILE ผลตอบแทนการลงทุนลดลงมาก โดยทั่วไปอยู่ที่ $4-8/เดือน\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "เครือข่ายไร้สายแบบกระจายศูนย์ - ต้องใช้ฮาร์ดแวร์ โทเค็น HNT"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "ต้องซื้อฮาร์ดแวร์ราคา $500+ ผลตอบแทนการลงทุนลดลงมาก มีขั้นตอนอนุมัติสำหรับผู้ดูแลรายใหม่"
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "ตามรอบ Epoch"
  source: "75743e03bad2"
helium.payout.notes:
  text: "ยังไม่ได้ระบุ: CashPilot ยังไม่ได้ตรวจสอบว่าบริการนี้เก็บรายได้ของคุณไว้ที่ใด"
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149 ยกเลิกรางวัล Proof-of-Coverage เมื่อวันที่ 6 กรกฎาคม 2026 ตอนนี้ฮอตสปอต IoT ได้รับรางวัลเฉพาะข้อมูลที่รับส่ง และมีมากกว่า 114,000 เครื่องที่ไม่ได้รับส่งข้อมูลเลย"
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "รูปแบบรางวัลของ Helium เปลี่ยนตามการโหวตหลายครั้ง CEO ลาออก และ HNT ลดลงประมาณ 96%"
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot ไม่ได้เรียกใช้ Helium ต้องใช้ฮาร์ดแวร์ฮอตสปอตของผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ ยังไม่ได้ตรวจสอบข้อกำหนดเรื่องคอนเทนเนอร์"
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "ซอฟต์แวร์เกตเวย์ของฮอตสปอตเป็นโอเพนซอร์สภายใต้สัญญาอนุญาต Apache-2.0"
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "ติดตามยอดคงเหลือ Kaspa ที่ยังไม่ได้จ่ายซึ่ง HeroMiners เก็บไว้ให้ที่อยู่รับเงินสาธารณะ เรียกใช้เครื่องขุด Kaspa ของตนเองและชี้ไปที่พูล CashPilot จะอ่านยอดคงเหลือในพูลและขอให้ยืนยันการจ่ายเงินเมื่อยอดคงเหลือลดลง\n"
  source: "d27cc4c96f02"
