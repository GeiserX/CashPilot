  source: "92c5784dcf30"
herominers-kas.payment.minimum_payout:
  text: "1 KAS (ปรับได้)"
  source: "d33ca7065ff9"
herominers-kas.payment.frequency:
  text: "พูลตรวจสอบเกณฑ์การจ่ายเงินทุกชั่วโมง"
  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "HeroMiners จ่ายเงินเข้าที่อยู่โดยอัตโนมัติเมื่อถึงเกณฑ์ที่เลือกไว้ เกณฑ์ต่ำสุดคือ 1 KAS\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "ยอดคงเหลือสะสมอยู่ที่ HeroMiners ตรวจสอบจำนวนที่ได้รับในกระเป๋าเงินก่อนยืนยันการจ่ายเงินใน CashPilot\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "ป้อนที่อยู่รับเงิน Kaspa สาธารณะแบบเต็มที่เครื่องขุดใช้บน HeroMiners รวมคำนำหน้า <b>kaspa:</b> และไม่ต้องใส่ชื่อเวิร์กเกอร์\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "ต้องมีเครื่องขุด Kaspa ที่ชี้ไปที่ HeroMiners"
  source: "898e36e7a701"
