  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "ได้รับเงินเฉพาะนาทีที่มีการเช่า ตามราคาที่ตั้งไว้ ค่าสูงสุดของช่วง $490 คือเพดานที่ Clore ระบุเองสำหรับ RTX 4090 หนึ่งใบที่ลงประกาศแบบรายนาที ('up to ~$490/month') การ์ดที่เล็กกว่าจะได้น้อยกว่า และการ์ดที่ว่างจะไม่มีรายได้ Clore หัก 5% (on-demand) หรือ 1.25% (spot) จากการเช่าแต่ละครั้ง และหักเพิ่ม 15% เมื่อผู้เช่าจ่ายเป็น BTC, USDT หรือ USDC แทน CLORE"
  source: "d13b02266fce"
