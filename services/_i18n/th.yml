titan.rating.cons.0.text:
  text: "ศูนย์ช่วยเหลือของ Titan เองระบุว่าโหนดที่ทำงานอยู่ไม่ได้รับประกันรายได้ หากไม่มีงานมอบหมายก็จะไม่มีรายได้ และรางวัลเป็นโทเค็น TNT"
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot ไม่ได้เรียกใช้ Titan ต้องใช้แอปหรือส่วนขยายของผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ ยังไม่ได้ตรวจสอบข้อกำหนดเรื่องคอนเทนเนอร์"
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer สร้างรายได้จากทราฟฟิกอินเทอร์เน็ตโดยแชร์แบนด์วิดท์กับธุรกิจที่ผ่านการตรวจสอบ เป็นหนึ่งในบริการแชร์แบนด์วิดท์ไม่กี่รายที่ทำงานได้ดีบน IP ของ VPS และศูนย์ข้อมูล นอกเหนือจากการเชื่อมต่อแบบที่อยู่อาศัย ใช้การยืนยันตัวตนด้วยโทเค็นแบบง่ายที่ส่งผ่านอาร์กิวเมนต์บรรทัดคำสั่ง รองรับสถาปัตยกรรม ARM สำหรับ Raspberry Pi และอุปกรณ์ที่คล้ายกัน\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "แชร์แบนด์วิดท์ - ใช้บน VPS ได้ ยืนยันตัวตนด้วยโทเค็น"
