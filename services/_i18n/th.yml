  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "รางวัล NODL สำหรับผู้ใช้ใหม่ที่ใช้งานจริงแต่ละรายที่เข้าร่วมผ่านคำเชิญ (Nodle ไม่ได้เผยแพร่จำนวน)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "ผู้รีวิวรายหนึ่งรายงานว่าได้ประมาณ $3 ในเวลาสามถึงสี่ปี รายอื่นรายงานว่ารายได้ต่อวันลดลงอย่างมาก"
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot ไม่ได้เรียกใช้ Nodle ต้องใช้แอปโทรศัพท์ของผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ ยังไม่ได้ตรวจสอบข้อกำหนดเรื่องคอนเทนเนอร์"
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana เป็นตลาดการประมวลผลด้วย GPU แบบกระจายศูนย์ที่สร้างบน Solana เชื่อมเจ้าของ GPU กับความต้องการงาน AI และจ่ายเป็นโทเค็น NOS RTX 3060 ได้ประมาณ $0.048/ชม. แพลตฟอร์มเน้นงาน AI inference และใช้บล็อกเชน Solana จัดตารางงานและชำระเงิน โหนดรันงานในคอนเทนเนอร์ผ่าน Nosana CLI\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "การประมวลผล GPU บน Solana - โทเค็น NOS, RTX 3060 ~$0.048/ชม."
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/ชม. GPU ระดับสูงกว่าได้มากกว่า รายได้ขึ้นอยู่กับงานที่มีและรุ่น GPU ต้องใช้ GPU NVIDIA, Linux, Docker และ Nosana CLI จ่ายเป็นโทเค็น NOS บน Solana"
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "ต่องานที่เสร็จ"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "ได้รับโทเค็น NOS บน Solana จ่ายเข้ากระเป๋าเงินที่ตั้งค่าไว้"
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "โดยค่าเริ่มต้น Nosana จะสร้างกระเป๋าเงิน Solana ขึ้นมา ผู้ใช้ส่วนใหญ่จึงไม่เคยเห็นที่อยู่ของกระเป๋าเงินนี้"
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "โฮสต์แต่ละรายต้องล็อก NOS เป็นสเตกตามราคารายชั่วโมงของ GPU"
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "โฮสต์ได้รับเงินเป็น NOS รายได้เป็นดอลลาร์จึงขึ้นลงตามโทเค็นและความต้องการการ์ดของตน"
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot ไม่ได้เรียกใช้ Nosana ต้องใช้ซอฟต์แวร์โฮสต์ของผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ ยังไม่ได้ตรวจสอบข้อกำหนดเรื่องคอนเทนเนอร์"
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN เป็นพูลขุด Bitcoin ที่ไม่ต้องมีบัญชี เครื่องขุดเข้าสู่ระบบโดยใช้ที่อยู่ Bitcoin เป็นชื่อผู้ใช้ และพูลจะจ่ายเงินเข้าที่อยู่นั้น CashPilot ไม่ได้เรียกใช้เครื่องขุดที่นี่ แต่จะอ่านยอดคงเหลือที่ยังไม่ได้จ่ายซึ่ง OCEAN เก็บไว้ให้ที่อยู่นี้ เพื่อให้เห็นว่า ASIC (Bitaxe, Antminer) ทำรายได้ได้เท่าไรเทียบกับรายได้อื่น ยอดที่ยังไม่ได้จ่ายคือรายได้ที่ได้มาแล้วแต่ยังไม่ได้รับ OCEAN จะจ่ายบนเชนเมื่อยอดเกินเกณฑ์การจ่ายเงิน\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "พูลขุด Bitcoin ติดตามด้วยที่อยู่รับเงิน"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "เมื่อบล็อกที่ขุดได้ทำให้ยอดคงเหลือเกินเกณฑ์"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN จ่ายบนเชนเข้าที่อยู่เมื่อยอดคงเหลือที่ยังไม่ได้จ่ายถึงเกณฑ์ CashPilot ตรวจไม่พบการจ่ายผ่าน Lightning (เลือกเปิดเอง, BOLT12)"
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "ยอดที่ยังไม่ได้จ่ายคือรายได้ที่ได้มาแล้วแต่ยังไม่ได้รับ จนกว่า OCEAN จะจ่ายบนเชนเข้าที่อยู่นี้ เว้นแต่จะเปิดการจ่ายผ่าน Lightning ไว้"
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "ที่อยู่รับเงิน BTC: ชื่อผู้ใช้ที่เครื่องขุดใช้บน OCEAN โดยไม่มีส่วน <b>.workername</b> ที่อยู่นี้เป็นสาธารณะและใช้เข้าถึงเงินไม่ได้"
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "ต้องมีเครื่องขุด ASIC สำหรับ Bitcoin (Bitaxe, Antminer) ที่ชี้ไปที่ mine.ocean.xyz:3334"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "การประมวลผล"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
  text: "ไม่ เครื่องขุดส่งแฮชไปยังพูล ไม่มีใครส่งทราฟฟิกผ่านการเชื่อมต่อนี้"
  source: "7239118f749a"
ocean.disclosure.data_collected:
  text: "ที่อยู่ Bitcoin ชื่อเวิร์กเกอร์ที่เลือก อัตราแฮช และที่อยู่ IP ของเครื่องขุดตามที่พูลเห็น"
  source: "22282404721c"
ocean.disclosure.isp_risk:
  text: "เครื่องขุดเปิดการเชื่อมต่อไปยังพูลไว้หนึ่งเส้นและใช้แบนด์วิดท์น้อย ต้นทุนที่ต้องระวังคือค่าไฟ ไม่ใช่ ISP"
  source: "7bf5f9f6b028"
ocean.disclosure.account_rules:
  text: "ไม่มีบัญชี ที่อยู่คือข้อมูลระบุตัวตน และทุกคนอ่านสถิติได้ที่ ocean.xyz"
  source: "e3c8fd5863c1"
ocean.rating.cons.0.text:
  text: "จ่ายเป็น Bitcoin เท่านั้น และจะไม่จ่ายบนเชนเลยจนกว่ายอดคงเหลือจะถึง 0.01048576 BTC"
  source: "9c9981f2fbd5"
ocean.rating.cons.1.text:
  text: "ค่าธรรมเนียมพูล 2% หรือ 1% เมื่อสร้างเทมเพลตบล็อกเองด้วย DATUM"
  source: "497f4f1ec62e"
ocean.rating.cons.2.text:
  text: "CashPilot ไม่ได้เรียกใช้เครื่องขุดสำหรับ OCEAN ต้องชี้ฮาร์ดแวร์ของตนเองไปที่พูล และ CashPilot ทำได้เพียงอ่านยอดคงเหลือ"
  source: "eccc0b4b47ae"
ocean.rating.pros.0.text:
  text: "ไม่มีบัญชีและไม่มีการยืนยันตัวตน OCEAN ขอเพียงที่อยู่ Bitcoin ที่จะจ่ายเงินเข้า"
  source: "38c4a7764846"
packetstream.description:
  text: "PacketStream เป็นตลาดแบนด์วิดท์แบบเพียร์ทูเพียร์ที่ให้ขายแบนด์วิดท์ที่ไม่ได้ใช้ เป็นฐานของเครือข่ายพร็อกซีแบบ IP ที่อยู่อาศัยที่ใช้สำหรับการวิจัยตลาด การตรวจสอบ SEO และการยืนยันโฆษณา ตั้งค่า Docker ง่ายๆ ต้องการเพียง CID (Client ID) โปรดทราบว่าการเข้าสู่ระบบที่มี CAPTCHA อาจทำให้การเก็บข้อมูลรายได้อัตโนมัติทำได้ยาก\n"
  source: "ee363f486228"
packetstream.short_description:
  text: "แชร์แบนด์วิดท์ - ตั้งค่าง่ายด้วย CID"
  source: "583d6cb0e210"
packetstream.docker.env.CID.label:
  text: "Client ID"
  source: "8726db013948"
packetstream.docker.env.CID.description:
  text: "เข้าสู่ระบบที่ <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> → คลิก Setup ในแถบด้านข้าง → CID จะแสดงอยู่ในคำสั่ง Docker"
  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream ปฏิเสธที่อยู่ IP ของสำเนานี้เพราะไม่ใช่ IP ที่อยู่อาศัย จึงไม่มีรายได้ ให้รันบนเครื่องที่ใช้อินเทอร์เน็ตบ้าน หรือลบสำเนานี้"
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "PacketStream มีไคลเอนต์อื่นบนที่อยู่ IP นี้อยู่แล้ว และจ่ายเงินให้เพียงหนึ่งไคลเอนต์ต่อ IP ให้ลบสำเนานี้ หรือลบอีกสำเนาที่ใช้ IP เดียวกัน"
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "จ่าย $0.10/GB สำหรับแบนด์วิดท์ที่แชร์ รายได้ขึ้นอยู่กับความต้องการในตำแหน่งที่ตั้งของ IP เป็นอย่างมาก"
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "เมื่อร้องขอ"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "PayPal เท่านั้น ขั้นต่ำ $5 ค่าธรรมเนียม 3% แสดงก่อนยืนยัน การถอนครั้งแรกจะบันทึกอีเมล PayPal ไว้ การเปลี่ยนภายหลังต้องยืนยันทางอีเมลและรอ 7 วัน จึงควรตรวจสอบที่อยู่ก่อนยืนยัน คำขอจะถูกตรวจสอบและส่งภายใน 7 วัน ยกเลิกคำขอได้ขณะรอ และส่งคำขอใหม่ได้เมื่อคำขอเดิมจ่ายแล้วเท่านั้น"
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "PacketStream เก็บยอดคงเหลือไว้ ถอนได้เมื่อร้องขอ"
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "เข้าสู่ระบบที่ <a href='https://packetstream.io' target='_blank'>packetstream.io</a> กด F12 → Application → Cookies แล้วคัดลอกค่าคุกกี้ <b>auth</b> (เป็น JWT)"
  source: "15bae9d455f5"
packetstream.referral.bonus.referrer:
  text: "20% ของรายได้จากแบนด์วิดท์ของผู้ที่ได้รับการแนะนำ (โบนัส Packeter ช่วงเวลาจำกัด)"
