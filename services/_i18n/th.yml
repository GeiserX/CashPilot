mysterium.description:
  text: "MystNodes (Mysterium Network) เป็นเครือข่าย VPN และพร็อกซีแบบกระจายศูนย์ที่สร้างบนเทคโนโลยีบล็อกเชน ได้รับโทเค็น MYST จากการเรียกใช้โหนดที่ให้บริการ VPN พร็อกซี และการเก็บข้อมูลเว็บแก่ผู้ใช้ ต้องมีสิทธิ์ NET_ADMIN, SETUID และ SETGID และอุปกรณ์ TUN ซึ่งใช้ภายใน network namespace ของตนเองบนบริดจ์ของแอปหารายได้ที่มีรั้วกั้น มีเว็บ UI ในตัวสำหรับจัดการโหนด ใช้ได้ทั้งการเชื่อมต่อแบบที่อยู่อาศัยและ VPS แต่โบนัสการแนะนำจะจ่ายเฉพาะโหนดที่ใช้ IP ที่อยู่อาศัย\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "โหนด VPN แบบกระจายศูนย์ - ใช้บล็อกเชน ใช้บน VPS ได้"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "ที่อยู่ WebUI"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "ช่วงพอร์ต UDP"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "ที่อยู่ของโฮสต์ที่เผยแพร่ WebUI ของโหนด (พอร์ต 4449) 127.0.0.1 จำกัดให้อยู่บนเครื่องนี้เท่านั้น หากต้องการเข้าถึงผ่านรีเวิร์สพร็อกซี ให้เพิ่มที่อยู่ที่พร็อกซีเชื่อมต่อเข้ามา คั่นด้วยเครื่องหมายจุลภาคโดยไม่มีช่องว่าง: 127.0.0.1,172.18.0.1"
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "พอร์ต UDP ที่โหนดใช้สำหรับเซสชัน VPN ในรูปแบบ start:end ให้ส่งต่อพอร์ตช่วงเดียวกันนี้บนเราเตอร์ แต่ละเซสชันใช้ประมาณสองพอร์ต ค่าเริ่มต้น 30 พอร์ตจึงรองรับได้ประมาณ 15 เซสชันพร้อมกัน ซึ่งมากกว่าที่โหนดในบ้านจะได้รับ ช่วงที่กว้างขึ้นไม่ได้แก้ปัญหาอะไรและมีต้นทุนมากขึ้น: ทุกพอร์ตที่เผยแพร่ทำให้การเริ่มและการลบโหนดช้าลง (300 พอร์ตใช้เวลาเริ่มประมาณ 12 s) CashPilot รับได้สูงสุด 300 พอร์ต และเมื่อใช้ userland proxy ค่าเริ่มต้นของ Docker แต่ละพอร์ตยังใช้หน่วยความจำประมาณ 2.5 MB ด้วย หากเซสชันล้มเหลวทั้งหมด เป็นปัญหาที่เราเตอร์ ไม่ใช่พอร์ตน้อยเกินไป ดู \"Routers that rewrite UDP source ports\" ในคู่มือ Mysterium ให้อยู่ต่ำกว่า 32768: พอร์ต 32768-60999 เป็นช่วง ephemeral ของ Linux ซึ่งโปรแกรมใดบนโฮสต์ก็อาจจองไว้ชั่วขณะ และหากมีพอร์ตเดียวถูกใช้อยู่ การเริ่มโหนดจะล้มเหลว โหนดที่มีช่วงพอร์ตอยู่แล้วจะใช้ช่วงเดิมต่อไป"
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "คีย์สโตร์ข้อมูลระบุตัวตนของโหนด หากทำลาย จะได้ข้อมูลระบุตัวตนใหม่ทั้งหมด โหนดจะสูญเสียชื่อเสียงและรายได้ที่ยังถูกระงับไว้กับข้อมูลระบุตัวตนเดิม"
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "โหนดรัน sudo ภายในคอนเทนเนอร์ไม่ได้ จึงตั้งค่าอินเทอร์เฟซ VPN หรือไฟร์วอลล์ไม่ได้ และทุกเซสชันล้มเหลวตอนตั้งค่า โหนดดูเหมือนออนไลน์แต่ไม่มีรายได้ คอนเทนเนอร์ถูกสร้างโดยไม่มีสิทธิ์ SETUID และ SETGID ให้อัปเดต CashPilot และเวิร์กเกอร์ที่เรียกใช้โหนดนี้ แล้วติดตั้งใช้งาน Mysterium ใหม่จากแดชบอร์ด ข้อมูลระบุตัวตนของโหนดอยู่ในวอลุ่มข้อมูลและจะถูกเก็บไว้"
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "ในช่วง 6 ชั่วโมงที่ผ่านมาไม่มีเซสชัน VPN ใดเข้าถึงโหนดนี้ได้โดยตรง ทุกเซสชันต้องใช้ hole punching แทน และผู้ซื้อจำนวนมากเชื่อมต่อแบบนั้นไม่สำเร็จ โหนดจึงได้น้อยลง พอร์ต UDP ของโหนดเข้าถึงไม่ได้จากอินเทอร์เน็ต บนเราเตอร์ ให้ส่งต่อช่วงพอร์ต UDP ${UDP_PORTS} (start:end ช่วงเดียวกันทั้งสองฝั่ง) ไปยัง ${HOST_ADDRESS} สถานะนี้จะหายไปเองเมื่อมีเซสชันเชื่อมต่อได้โดยตรง"
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "ระบบตรวจสอบของ Mysterium ทำเครื่องหมายว่าโหนดบน ${WORKER_NAME} ล้มเหลว โหนดจึงไม่อยู่ในรายการโหนดที่ผู้ซื้อส่วนใหญ่เลือกใช้ แม้การตรวจสอบของโหนดเองจะบอกว่าทุกพอร์ตเข้าถึงได้ ก่อนอื่นให้ตรวจสอบว่าโหนดมี /dev/net/tun และ SETUID/SETGID เพราะหากขาดสิ่งเหล่านี้จะล้มเหลวแบบเดียวกัน: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 เมื่อมีครบแล้ว สาเหตุที่พบบ่อยคือเราเตอร์ที่อยู่หน้า ${WORKER_NAME} เขียนพอร์ตต้นทาง UDP ของคำตอบจากโหนดใหม่ หลังจากมีแพ็กเก็ตจากภายนอกมาถึงพอร์ตนั้นแล้ว ดูวิธีทดสอบในคู่มือ: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "เซสชัน VPN ห้าครั้งล่าสุดของโหนดบน ${WORKER_NAME} แต่ละครั้งจบลงหลังจากประมาณหนึ่งนาทีโดยไม่มีการรับส่งข้อมูล โหนดจึงไม่มีรายได้ทั้งที่ดูเหมือนออนไลน์ สาเหตุที่น่าจะเป็นคือเราเตอร์ที่อยู่หน้า ${WORKER_NAME}: เมื่อแพ็กเก็ตจากภายนอกมาถึงพอร์ตหนึ่ง เราเตอร์จะเขียนพอร์ตต้นทางของคำตอบหลังจากนั้นของโหนดจากพอร์ตนั้นใหม่ และทุกเซสชันเริ่มด้วยแพ็กเก็ตแบบนั้น (การตรวจพอร์ตของโหนดเอง) ผู้ซื้อจึงทิ้งคำตอบของโหนด ช่วงพอร์ตที่กว้างขึ้นไม่ช่วย ดูวิธีทดสอบและวิธีแก้ในคู่มือ: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports สถานะนี้จะหายไปเมื่อมีเซสชันรับส่งข้อมูลได้"
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "รายได้เป็นโทเค็น MYST IP ที่อยู่อาศัยได้มากกว่าอย่างเห็นได้ชัด WebUI ของโหนดอยู่ที่พอร์ต 4449 สำหรับการจัดการ และโดยค่าเริ่มต้นจะเผยแพร่เฉพาะบนเครื่องที่รันอยู่ (127.0.0.1) หากต้องการเข้าจากเครื่องอื่น ให้เปิด SSH tunnel ก่อน (ssh -L 14449:127.0.0.1:4449 ตามด้วยที่อยู่ของเครื่องที่รันโหนด แล้วเปิด http://127.0.0.1:14449 พอร์ตในเครื่อง 14449 จะไม่ชนกับโหนดบนเครื่องของตนเอง) หรือเพิ่มที่อยู่ใน UI_ADDRESS (ดู WebUI address ในคู่มือ Mysterium) รับ VPS แนะนำอย่างยิ่งให้ส่งต่อพอร์ต UDP 23000-23029 (ค่าเริ่มต้นของ UDP_PORTS) -- หากไม่ทำ โหนดจะได้สถานะ Strict NAT และเซสชัน VPN จำนวนมากจะล้มเหลว ทำให้รายได้ลดลงอย่างมาก สำคัญ: หลังรันครั้งแรก ให้ตั้งกระเป๋าเงินผู้รับประโยชน์ (settlement) ผ่าน WebUI หรือ CLI ของโหนดให้ตรงกับบัญชี mystnodes.com -- เพื่อเชื่อมรายได้บนเชนเข้ากับแดชบอร์ดบนคลาวด์"
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "ชำระบนเชนโดยอัตโนมัติทุกครั้งที่โหนดมี MYST ที่ยังไม่ได้ชำระครบ 5 MYST"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "ไม่มีปุ่มให้กด แต่ละโหนดจะชำระบน Polygon เองเมื่อมี MYST ที่ยังไม่ได้ชำระครบ 5 MYST และประมาณ 21% จะเสียไปกับค่าธรรมเนียม (ค่าธรรมเนียม Hermes 20% บวกค่าธรรมเนียมธุรกรรมเล็กน้อย) ในการชำระแต่ละครั้งจึงมีประมาณ 3.9 MYST เข้ากระเป๋าเงินผู้รับประโยชน์ TequilAPI ของแต่ละโหนดแสดงรายการชำระที่ /transactor/settle/history ตัวเลข \"total earnings\" บน MystNodes ครอบคลุมเฉพาะ 30 วันล่าสุด ไม่ใช่ยอดคงเหลือหรือยอดรวมตลอดอายุ MYST โบนัสจากโปรแกรมรางวัลของ MystNodes จะไม่ชำระเอง ต้องเคลมที่หน้า Rewards ภายใน 30 วันหลังการแจก ตามศูนย์ช่วยเหลือของ MystNodes"
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "กระเป๋าเงินผู้รับประโยชน์ตั้งค่าหลังการติดตั้งใช้งาน ผ่าน TequilAPI หรือ WebUI ของโหนด -- ไม่ได้ตั้งผ่านตัวแปรสภาพแวดล้อม จึงอ่านจากสเปกของคอนเทนเนอร์ไม่ได้"
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
