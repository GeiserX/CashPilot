noderr.description:
  text: "Noderr Micronodes เป็นระดับเริ่มต้นแบบฟรีของ Noderr Protocol ซึ่งเป็นโครงการ DeFi บน Base L2 ไมโครโหนดคือเอเจนต์ขนาดเล็กบนโทรศัพท์ Android เครื่องสำรอง PC ที่ใช้ Windows เครื่อง Mac หรือเบราว์เซอร์ Chromium บน Android จะแชร์การเชื่อมต่อมือถือของโทรศัพท์: ทราฟฟิกอื่นของ Noderr จะออกผ่าน IP ของผู้ให้บริการเครือข่ายมือถือ จึงต้องมี SIM ที่มีอินเทอร์เน็ตมือถือ บน PC หรือในเบราว์เซอร์ จะรันงานอัตโนมัติให้โปรโตคอลด้วยพลังประมวลผลที่เหลือ รางวัลออกแบบให้จ่ายเป็น NODR โดยปรับตามคะแนนเวลาออนไลน์และความน่าเชื่อถือบนเชน แต่ระหว่างช่วงเบต้าเครือข่ายอยู่บนเทสต์เน็ต Base Sepolia: รางวัลของโหนดยังไม่มีเงินทุนรองรับและยังไม่เคยจ่ายเลย\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "ไมโครโหนดฟรี (แชร์การเชื่อมต่อบน Android, Windows, Mac, เบราว์เซอร์) - เทสต์เน็ต รางวัลยังไม่มีเงินทุนรองรับ"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "เบต้าบนเทสต์เน็ต: รางวัลของโหนดยังไม่มีเงินทุนรองรับและยังไม่เคยจ่ายเลย APY 5-10% บนเว็บไซต์เป็นเป้าหมายการออกแบบ ให้กลับมาดูอีกครั้งเมื่อเครือข่ายออกจาก Base Sepolia"
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "เมื่อร้องขอ"
  source: "be820103712e"
noderr.cashout.notes:
  text: "รางวัลสะสมในกระเป๋าเงินของโหนดเอง และเคลมได้จากแอปหรือ dApp ระหว่างช่วงเบต้าเป็นโทเค็นเทสต์เน็ต Base Sepolia ที่ไม่มีมูลค่าในตลาด"
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "แอปสร้างกระเป๋าเงินของโหนดเมื่อเปิดครั้งแรก และมินต์ Utility NFT แบบ soulbound ให้ฟรี สำรองกระเป๋าเงินจากแอปไว้: หากอุปกรณ์หาย ข้อมูลระบุตัวตนของโหนดจะหายไปด้วย ระหว่างช่วงเบต้ารางวัลอยู่บน Base Sepolia (เทสต์เน็ต)"
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android ต้องมี SIM ที่มีอินเทอร์เน็ตมือถือ ไคลเอนต์เดสก์ท็อปและเบราว์เซอร์ไม่ได้ระบุข้อกำหนดเรื่อง IP"
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "ขึ้นอยู่กับอุปกรณ์ โทรศัพท์ Android ขายการเชื่อมต่อมือถือ: ทราฟฟิกอื่นของ Noderr ออกผ่านที่อยู่ IP ของผู้ให้บริการเครือข่ายมือถือและนับรวมในแพ็กเกจข้อมูล PC ที่ใช้ Windows, Mac หรือเบราว์เซอร์ขายพลังประมวลผลที่เหลือสำหรับสิ่งที่ผู้ให้บริการเรียกว่างานอัตโนมัติด้านโซเชียลมีเดียและเนื้อหา"
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "ใช่ บน Android ทราฟฟิกอื่นของ Noderr ออกผ่านที่อยู่ IP มือถือของโทรศัพท์ แอปจะขอความยินยอมที่บันทึกไว้ก่อนเริ่ม และหยุดแชร์ได้จากหน้าจอเดียวกัน สำหรับไคลเอนต์ Windows, Mac และเบราว์เซอร์ ผู้ให้บริการอธิบายว่าเป็นงานอัตโนมัติ และไม่ได้บอกว่างานเหล่านั้นรับส่งทราฟฟิกของผู้อื่นหรือไม่"
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "ที่อยู่กระเป๋าเงินของโหนด ตัวเลขเวลาออนไลน์และงานที่ทำเสร็จจะถูกบันทึกบนเชนเป็นคะแนนชื่อเสียง (TrustFingerprint) ผู้ให้บริการระบุว่างานถูกทำให้เป็นนิรนาม รันในแซนด์บ็อกซ์ และคีย์กระเป๋าเงินไม่เคยออกจากอุปกรณ์ ไม่มีการเผยแพร่รายละเอียดมากกว่านี้"
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "บน Android การเชื่อมต่อที่แชร์คือแพ็กเกจมือถือของผู้ให้บริการเครือข่าย เอกสารของผู้ให้บริการเองเตือนว่าการแชร์อาจไม่ได้รับอนุญาตตามนโยบายการใช้งานที่ยอมรับได้ของผู้ให้บริการเครือข่ายบางราย และทราฟฟิกที่แชร์จะใช้ปริมาณข้อมูลของแพ็กเกจ สำหรับไคลเอนต์เดสก์ท็อปและเบราว์เซอร์ ผู้ให้บริการไม่ได้กล่าวถึงข้อกำหนดของ ISP"
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "หนึ่งโหนดต่ออุปกรณ์ แต่ละโหนดมี Utility NFT แบบ soulbound ของตนเอง อนุญาตและสนับสนุนให้ใช้หลายอุปกรณ์ ไม่มีการเผยแพร่ขีดจำกัดต่อ IP ไม่มีบัญชีในความหมายทั่วไป ข้อมูลระบุตัวตนคือกระเป๋าเงินที่แอปสร้างขึ้นเมื่อเปิดครั้งแรก"
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "รางวัลของโหนดเป็นโทเค็นเทสต์เน็ตที่ยังไม่มีเงินทุนรองรับและไม่มีมูลค่าในตลาด และยังไม่เคยจ่ายเลย APY 5 ถึง 10% บนเว็บไซต์เป็นเป้าหมายการออกแบบ"
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "สำหรับไคลเอนต์เดสก์ท็อปและเบราว์เซอร์ Noderr อธิบายว่าเป็นงานอัตโนมัติ และไม่ได้บอกว่ารับส่งทราฟฟิกของผู้อื่นหรือไม่"
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "ผู้ให้บริการระบุว่างานถูกทำให้เป็นนิรนามและรันในแซนด์บ็อกซ์ แต่ไม่ได้เผยแพร่รายละเอียดมากกว่านี้"
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "ยังเป็นเบต้าบนเทสต์เน็ต Base Sepolia"
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot ไม่ได้เรียกใช้ Noderr ต้องใช้แอปหรือส่วนขยายของผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ ยังไม่ได้ตรวจสอบข้อกำหนดเรื่องคอนเทนเนอร์"
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "ไม่มีบัญชี แอปสร้างกระเป๋าเงินเมื่อเปิดครั้งแรก"
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle ใช้ Bluetooth ของสมาร์ทโฟนสร้างโครงสร้างพื้นฐาน IoT แอปจะตรวจจับและส่งต่อข้อมูลจากอุปกรณ์ IoT ใกล้เคียงแบบพาสซีฟ และได้รับโทเค็น NODL เคยได้ลง Forbes และมีความร่วมมือระดับองค์กรกับ Vivendi และ Hayden AI ใช้บนมือถือเท่านั้น (iOS และ Android)\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "ส่งต่อข้อมูล IoT ผ่าน Bluetooth - แอปมือถือ รางวัลเป็นโทเค็น NODL"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "รายได้ต่ำมาก แอปโทรศัพท์ทำงานเบื้องหลังโดยใช้ Bluetooth การเชื่อมต่อกระเป๋าเงินอาจไม่เสถียร"
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "ต่อเนื่อง"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL อยู่ในกระเป๋าเงินของแอปบน ZKsync Era ตรวจสอบได้ในแอปหรือใน block explorer ของ ZKsync Era Nodle ออกจาก parachain บน Polkadot แล้ว และบริดจ์จาก Polkadot ไป ZKsync ปิดเมื่อวันที่ 31 ธันวาคม 2025 NODL ที่ยังอยู่ฝั่ง Polkadot จึงย้ายไป ZKsync ไม่ได้อีกต่อไป"
