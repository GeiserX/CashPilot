storj.docker.setup:
  text: "ก่อนรันครั้งแรก ให้เริ่มต้นการตั้งค่าโหนดพื้นที่จัดเก็บ: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "ข้อมูลระบุตัวตนของโหนด ID ผูกกับ proof-of-work และใช้เวลาหลายชั่วโมงในการสร้างใหม่ และสร้างขึ้นใหม่จากข้อมูลสำรองของสิ่งอื่นไม่ได้ หากสูญหาย ยอดเงินที่ถูกหักเก็บไว้จะถูกริบ"
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "ข้อมูลของลูกค้าที่จัดเก็บไว้และยอดที่ถูกหักเก็บไว้ของโหนด หากสูญหาย โหนดจะถูกตัดสิทธิ์และยอดที่ถูกหักเก็บไว้จะถูกริบ"
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "เครือข่าย Storj เชื่อมต่อกลับมายังโหนดที่ ADDRESS ที่ประกาศไว้ไม่ได้ ดาวเทียม (satellite) จึงนับว่าโหนดออฟไลน์: ข้อมูลใหม่หยุดเข้ามา รายได้ขาออกหยุดนิ่ง และหากออฟไลน์ต่อเนื่องจะถูกระงับ ตรวจสอบว่า ADDRESS ตรงกับ IP สาธารณะปัจจุบัน (ใช้ชื่อโฮสต์ DDNS ไม่ใช่ IP ตรงๆ เพื่อไม่ให้โหนดเข้าถึงไม่ได้เมื่อ ISP เปลี่ยน IP) และส่งต่อพอร์ต 28967 TCP+UDP มายังเครื่องนี้แล้ว"
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB ที่จัดเก็บ + $1/TB ขาออก + $1/TB สำหรับการตรวจสอบ/ซ่อมแซม ตั้งแต่ 1 กันยายน 2026 รายได้เพิ่มตามข้อมูลที่จัดเก็บและอายุของโหนด ใน 9 เดือนแรกจะหักรายได้ไว้ 75% จากนั้น 50% แล้ว 25% ครึ่งหนึ่งของยอดที่หักไว้จะคืนในเดือนที่ 16 และส่วนที่เหลือเมื่อออกจากเครือข่ายอย่างถูกวิธี (graceful exit) ต้องส่งต่อพอร์ต 28967"
  source: "c2edb0df32bc"
