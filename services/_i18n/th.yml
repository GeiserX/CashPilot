  text: "ที่อยู่ Monero ชื่อเวิร์กเกอร์ และที่อยู่ IP จะส่งไปยังพูล"
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "เครือข่ายและตัวแปลง DNS บางแห่งบล็อกการเชื่อมต่อกับพูลขุด"
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "พูล Monero ส่วนใหญ่ระบุตัวผู้ใช้จากที่อยู่รับเงินสาธารณะ"
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "การจ่ายเงินต้องมี XMR มากพอให้ถึงเกณฑ์ของพูล"
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "ผู้ให้บริการโฮสติ้งบางรายห้ามการขุดคริปโต"
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "ค่าไฟที่เพิ่มขึ้นอาจสูงกว่ามูลค่า XMR ที่ได้"
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "เครื่องขุดส่งแฮชไปยังพูลและไม่ได้ส่งต่อทราฟฟิกของผู้อื่น"
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "เครื่องขุดเป็นโอเพนซอร์ส และอิมเมจตรึงรุ่นต้นทางที่ลงนามแล้ว"
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "ขุดด้วยที่อยู่ Monero สาธารณะได้โดยไม่ต้องเปิดเผยชื่อตัวเอง"
  source: "752cbb728aac"
