  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "เข้าสู่ระบบที่ <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a> กด F12 → Application → Local Storage → ค่า <b>authToken</b> (ประมาณ 54 อักขระ: ตัวเลข ตามด้วย <code>|</code> แล้วตามด้วยตัวอักษรและตัวเลข)"
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
