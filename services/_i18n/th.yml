  text: "ไม่ เครื่องขุดส่งงานขุดไปยังพูล"
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "สถิติสาธารณะของพูลแสดงที่อยู่รับเงินแต่ละที่อยู่และกิจกรรมการขุด"
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "พูลใช้ที่อยู่รับเงินแทนบัญชี"
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "พูลเก็บค่าธรรมเนียม 0.9% และระงับการจ่ายเงินไว้จนกว่าจะถึงเกณฑ์"
  source: "7eb2950589fa"
honeygain.description:
  text: "แชร์แบนด์วิดท์อินเทอร์เน็ตที่ไม่ได้ใช้เพื่อสร้างรายได้แบบพาสซีฟ Honeygain ส่งทราฟฟิกข่าวกรองเว็บ การส่งเนื้อหา และการวิจัยตลาดผ่านการเชื่อมต่อนี้ เป็นหนึ่งในแพลตฟอร์มแชร์แบนด์วิดท์ที่มีมานานที่สุด มีผู้ใช้มากกว่า 12M ราย และจ่ายเงินสำเร็จแล้วมากกว่า 1M ครั้ง\n"
