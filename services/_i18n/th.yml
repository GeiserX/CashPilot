  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "ผู้รีวิวบน Trustpilot ในปี 2025 และ 2026 รายงานว่าเงินมาช้าหรือไม่มาเลย และผู้ใช้ระยะยาวรายหนึ่งบอกว่าการจ่ายเงินช้าลงแล้วหยุดไป ส่วนรายอื่นในปี 2026 รายงานว่าได้รับเงิน"
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "PayPal เท่านั้น ค่าธรรมเนียมการถอน 3% ผู้ใช้ในประเทศที่ PayPal ไม่ให้บริการไม่มีช่องทางอื่น"
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "ข้อกำหนดให้ PacketStream ระงับ ย้อนกลับ หรือทำให้รายได้ที่เชื่อมโยงกับการฉ้อโกง การบิดเบือน หรือกิจกรรมต้องห้ามเป็นโมฆะได้"
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
  text: "ข้อกำหนดระบุว่าลูกค้าพร็อกซีและ PacketStream เองส่งทราฟฟิกผ่านการเชื่อมต่อนี้ โดยไม่ได้อธิบายการตรวจสอบผู้ซื้อทั่วไป"
  source: "fd4707690d2b"
packetstream.rating.cons.4.text:
  text: "Trustpilot ระบุว่า PacketStream ไม่ได้ตอบรีวิวเชิงลบ ผู้รีวิวรายงานว่าอีเมลไม่ได้รับคำตอบ"
  source: "4885bceb8df9"
packetstream.rating.pros.0.text:
  text: "PacketStream เผยแพร่อิมเมจ Docker ของตนเอง คือ packetstream/psclient"
  source: "b358af0b3419"
packetstream.rating.pros.1.text:
  text: "ข้อกำหนดต้องการเพียงอุปกรณ์และการเชื่อมต่อที่เป็นของตนเองหรือมีสิทธิ์ใช้"
  source: "bde1b5ad5a6a"
packetstream.rating.pros.2.text:
  text: "ข้อกำหนดไม่ได้กล่าวถึงการยืนยันตัวตน การจ่ายเงินต้องใช้ที่อยู่ PayPal"
  source: "a05886b55edc"
packetstream.rating.pros.3.text:
  text: "ข้อกำหนดระบุชื่อ PacketStream Inc. ภายใต้กฎหมายแคลิฟอร์เนีย"
  source: "7966bde559dd"
packetstream.rating.pros.4.text:
  text: "PacketStream ดำเนินการมาตั้งแต่ปี 2018"
  source: "70db8167d5bc"
passiveapp.description:
  text: "PassiveApp เป็นแพลตฟอร์ม DePIN ที่ให้รับรางวัลเป็นคริปโตและ PayPal จากการแชร์แบนด์วิดท์และทรัพยากรประมวลผลที่ไม่ได้ใช้ ในทางปฏิบัติใช้ได้เฉพาะ Windows: หน้าดาวน์โหลดของผู้จำหน่ายเองแสดง Android, iOS และ Linux เป็น \"coming soon\" โดยไม่เปลี่ยนแปลงมาตั้งแต่อย่างน้อยกุมภาพันธ์ 2025 และไม่มีเวอร์ชัน macOS — แม้ข้อความโฆษณาบนเว็บไซต์เดียวกันจะอ้างว่ารองรับมากกว่านั้น ไม่มีอิมเมจ Docker\n"
  source: "e0f069b6b6e0"
passiveapp.short_description:
  text: "แบนด์วิดท์/การประมวลผล DePIN - Windows เท่านั้น จ่ายเป็นคริปโตและ PayPal"
  source: "e23871afdcd9"
passiveapp.earnings.notes:
  text: "แอปเดสก์ท็อป Windows เท่านั้น (v1.0.x) ผู้จำหน่ายประกาศ Android/iOS/Linux ว่า 'coming soon' มาตั้งแต่ต้นปี 2025 และไม่เคยออกมาเลย ไม่มีอิมเมจ Docker อย่างเป็นทางการ"
