salad.obligations.earn-within-12-months.loss:
  text: "หากบัญชีไม่ได้รับ Reward Points เลยติดต่อกัน 12 เดือน ยอดคงเหลือที่ยังไม่ได้แลกอาจหมดอายุ"
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "รันแอป Salad จนกว่าจะได้รับคะแนน หรือใช้ยอดคงเหลือทั้งหมดใน Salad Storefront การใช้เพียงบางส่วนไม่ได้รีเซ็ตระยะ 12 เดือน"
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot ไม่ได้เรียกใช้ Salad ต้องใช้แอปเดสก์ท็อปของผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ ยังไม่ได้ตรวจสอบข้อกำหนดเรื่องคอนเทนเนอร์"
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "ผู้รีวิวบน Trustpilot หลายรายในเดือนตุลาคมและพฤศจิกายน 2026 รายงานว่าการถอนเงินทาง PayPal ได้รับเร็ว บางรายได้มากกว่าหนึ่งครั้ง ผู้รีวิวรายหนึ่งในช่วงเดียวกันบอกว่าพยายามถอนเงินหลายครั้งแต่ไม่สำเร็จ"
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel เป็นบล็อกเชน Layer 1 บน Cosmos สำหรับ VPN แบบกระจายศูนย์ ผู้ดูแลโหนดขายแบนด์วิดท์ให้ผู้ใช้ VPN ด้วยราคาที่ยืดหยุ่น (ต่อ GB หรือรายชั่วโมง) มีคู่มือการติดตั้งใช้งานด้วย Docker อย่างเป็นทางการ เป็นโครงการที่ดำเนินมานานและมีชุมชนที่ยังเคลื่อนไหวอยู่\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "VPN แบบกระจายศูนย์บน Cosmos - ผู้ดูแลโหนดขายแบนด์วิดท์"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "ผู้ดูแลตั้งราคาเองต่อ GB หรือรายชั่วโมง รายได้ขึ้นอยู่กับความต้องการของผู้ใช้ VPN ในภูมิภาค"
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "ต่อเซสชัน"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "ยังไม่ได้ระบุ: CashPilot ยังไม่ได้ตรวจสอบว่าบริการนี้เก็บรายได้ของคุณไว้ที่ใด"
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "จ่ายเป็นโทเค็น P2P และ 20% ของการจ่ายค่าแบนด์วิดท์ทุกครั้งไปให้ผู้สเตก ไม่ใช่โฮสต์โหนด"
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "โทเค็นเปลี่ยนชื่อจาก SENT เป็น DVPN ในปี 2021 และจาก DVPN เป็น P2P ในปี 2025"
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot ไม่ได้เรียกใช้ Sentinel ต้องใช้ซอฟต์แวร์โหนดของผู้ให้บริการเอง CashPilot จึงติดตั้งใช้งานหรืออัปเดตให้ไม่ได้ ยังไม่ได้ตรวจสอบข้อกำหนดเรื่องคอนเทนเนอร์"
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel เผยแพร่ซอร์สโค้ดของโหนดภายใต้สัญญาอนุญาตโอเพนซอร์สของตนเอง"
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia เป็นตลาดพื้นที่จัดเก็บแบบกระจายศูนย์ที่ดำเนินการโดย Sia Foundation (องค์กรไม่แสวงผลกำไรในสวิตเซอร์แลนด์) มาตั้งแต่ปี 2015 เรียกใช้โหนด hostd อย่างเป็นทางการของมูลนิธิเพื่อปล่อยเช่าพื้นที่ดิสก์ที่เหลือ และได้รับ Siacoin จากสัญญาพื้นที่จัดเก็บและแบนด์วิดท์ ต้องซื้อ Siacoin จำนวนหนึ่งก่อนที่โหนดจะมีรายได้: โฮสต์ต้องล็อกหลักประกันไว้กับทุกสัญญาและจ่ายค่าธรรมเนียมสำหรับการพิสูจน์การจัดเก็บแต่ละครั้ง หลักประกันจะได้คืนเมื่อสัญญาเสร็จสมบูรณ์ และจะถูกเผาทิ้งหากโหนดออฟไลน์หรือข้อมูลสูญหาย จึงต้องใช้เครื่องที่เปิดตลอดเวลา (Sia กำหนดเวลาออนไลน์อย่างน้อย 95%) รายได้ขึ้นอยู่กับปริมาณข้อมูลที่ผู้เช่าจัดเก็บจริง Sia แนะนำให้ตั้งราคาพื้นที่จัดเก็บที่ $1 ต่อ TB ต่อเดือน จึงเหมาะกับเครื่องที่มีดิสก์ว่างขนาดใหญ่มากกว่า VPS ขนาดเล็ก\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "โหนดพื้นที่จัดเก็บของ Sia Foundation - อิมเมจ Docker อย่างเป็นทางการ ได้รับ Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "วลีกู้คืนของกระเป๋าเงิน"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "รหัสผ่านแดชบอร์ด"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "ไดเรกทอรีพื้นที่จัดเก็บ"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "วลีกู้คืน BIP-39 ที่ควบคุมกระเป๋าเงิน Siacoin ของโฮสต์ สร้างด้วย `docker run --rm ghcr.io/siafoundation/hostd seed` และสำรองไว้ -- นี่คือทางเดียวที่จะเข้าถึงรายได้"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "รหัสผ่านสำหรับเว็บ UI และ API ในเครื่องของ hostd (BasicAuth) ใช้วลีรหัสผ่านยาวๆ ใดก็ได้"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "พาธบนโฮสต์ในดิสก์ที่ใหญ่ที่สุดซึ่งใช้เก็บข้อมูลของผู้เช่า (เช่น /srv/sia) ต้องมีพื้นที่ว่างอย่างน้อย 256GB"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "เมื่อติดตั้งใช้งาน CashPilot จะสร้างกระเป๋าเงินใหม่บนเครื่องที่รันโหนด และแสดงวลีกู้คืนเพียงครั้งเดียว: ให้จดไว้ หากต้องการใช้กระเป๋าเงินที่มีอยู่แล้ว ให้วางวลีกู้คืนของกระเป๋าเงินนั้นแทน หลังติดตั้งใช้งาน ให้ส่ง Siacoin จำนวนหนึ่งไปยังกระเป๋าเงินของโหนดสำหรับหลักประกันและค่าธรรมเนียม จากนั้นเพิ่มโฟลเดอร์พื้นที่จัดเก็บ (/storage) ตั้งราคา และประกาศโฮสต์ในแดชบอร์ด\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "วลีกู้คืนของกระเป๋าเงิน (hostd.yml) ฐานข้อมูลกระเป๋าเงิน การตั้งค่าโฮสต์ และสถานะสัญญา หากสูญหาย โหนดจะเสียข้อมูลระบุตัวตนและการติดตามรายได้จากสัญญา วลีกู้คืนที่จดไว้จะเป็นทางเดียวในการกู้คืนเงินทุน"
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "ข้อมูลของผู้เช่าที่จัดเก็บไว้ หากสูญหาย การพิสูจน์การจัดเก็บจะล้มเหลวและหลักประกันที่ล็อกไว้กับสัญญาเหล่านั้นจะถูกริบ"
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "โฮสต์ตั้งราคาเอง Sia แนะนำ $1 ต่อ TB ที่จัดเก็บต่อเดือน และมากกว่า $5 ต่อ TB ที่ดาวน์โหลด และ 3.9% ของการจ่ายเงินจากสัญญาทุกครั้งไปให้ผู้ถือ Siafund รายได้เพิ่มตามปริมาณข้อมูลของผู้เช่าที่มาอยู่บนโหนด ซึ่งเริ่มจากศูนย์และเพิ่มขึ้นตามเวลาออนไลน์และราคา หลักประกัน (Sia แนะนำ 2 เท่าของราคาพื้นที่จัดเก็บ) จะล็อกไว้ต่อสัญญาและได้คืนเมื่อสัญญาเสร็จสมบูรณ์\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "เมื่อร้องขอ"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "รายได้สะสมในกระเป๋าเงิน Siacoin ของโฮสต์เอง (ควบคุมด้วยวลีกู้คืน) แปลง SC บนกระดานเทรดแล้วถอนเข้าบัญชีธนาคาร/บัตรจากที่นั่น ไม่มีการขอจ่ายเงินจากฝั่งผู้ให้บริการ\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "เงินทุนอยู่ในกระเป๋าเงิน Sia ภายในโหนดที่ควบคุมด้วยวลีกู้คืน วลีกู้คืนอยู่เฉพาะในวอลุ่มข้อมูลของ hostd บนเครื่องที่รันเท่านั้น CashPilot ไม่เคยเก็บไว้ วลีที่จดไว้ตอนสร้างกระเป๋าเงินเป็นทางเดียวในการกู้คืน\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "ที่อยู่สาธารณะที่คงที่ พร้อมส่งต่อพอร์ต 9981 (TCP, consensus) และ 9984 (TCP และ UDP, สัญญาของผู้เช่า) การโฮสต์บนศูนย์ข้อมูล/VPS เป็นเรื่องปกติบน Sia กระเป๋าเงินต้องมี Siacoin ก่อนที่โหนดจะรับสัญญาได้"
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "พื้นที่ดิสก์และแบนด์วิดท์สำหรับให้บริการข้อมูล"
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "ไม่ ผู้เช่าเก็บชิ้นส่วนไฟล์ที่เข้ารหัสไว้บนดิสก์และดึงกลับไป ผู้อื่นไม่ได้ส่งทราฟฟิกใดๆ ผ่าน IP นี้"
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "ที่อยู่กระเป๋าเงิน Sia คีย์สาธารณะของโฮสต์ และ IP:พอร์ต สาธารณะที่โหนดประกาศเพื่อให้ผู้เช่าเข้าถึงได้"
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "มีทราฟฟิกอัปโหลด/ดาวน์โหลดต่อเนื่องบนสาย เช่นเดียวกับการรันเซิร์ฟเวอร์พื้นที่จัดเก็บทั่วไป ไม่มีทราฟฟิกเว็บแบบนิรนามของบุคคลที่สามถูกระบุว่ามาจากสายนี้"
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "ไม่ต้องขออนุญาต: ไม่ต้องสมัครหรือมีบัญชี หลักประกันจะถูกเผาทิ้งหากโหนดพลาดการพิสูจน์การจัดเก็บ เพราะออฟไลน์หรือข้อมูลสูญหาย"
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "รายได้เป็น Siacoin ในกระเป๋าเงินของตนเอง ไม่มีการจ่ายเข้าบัญชีธนาคาร ต้องขายบนกระดานเทรดเอง"
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "หลักประกันถูกล็อกไว้ต่อสัญญา และจะถูกเผาทิ้งหากโฮสต์พลาดการพิสูจน์การจัดเก็บเพราะออฟไลน์หรือข้อมูลสูญหาย"
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "มีการใช้พื้นที่จัดเก็บที่เสนอในเครือข่ายเพียงประมาณ 30% โฮสต์รายใหม่จึงต้องแข่งกันในความต้องการที่มีน้อย"
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "ผู้เช่าเก็บชิ้นส่วนไฟล์ที่เข้ารหัสไว้ และไม่มีใครส่งทราฟฟิกผ่าน IP นี้ แต่เราไม่พบว่า Sia ระบุไว้ที่ใดว่าผู้เช่าเป็นใครหรือตรวจสอบอย่างไร"
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd พัฒนาแบบเปิดโดย Sia Foundation มาตั้งแต่ปี 2022"
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd เป็นโอเพนซอร์สภายใต้สัญญาอนุญาต MIT"
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Sia Foundation เผยแพร่ hostd เป็นอิมเมจคอนเทนเนอร์"
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "ไม่ต้องขออนุญาต: ไม่ต้องสมัครหรือมีบัญชี"
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide เป็นบริการแชร์แบนด์วิดท์ที่ให้สร้างรายได้จากแบนด์วิดท์อินเทอร์เน็ตที่ไม่ได้ใช้ ใช้ machine ID (ไม่บังคับ) สำหรับติดตามอุปกรณ์ มีให้ใช้ผ่านอิมเมจ Docker ของชุมชนจากโครงการ income-generator\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "แชร์แบนด์วิดท์ - อิงตาม machine ID"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "Machine ID"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "Machine ID ของอุปกรณ์ที่ลงทะเบียนไว้แล้ว (สร้างอัตโนมัติหากเว้นว่าง)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "มีข้อมูลจำกัด รายได้ขึ้นอยู่กับตำแหน่งที่ตั้ง"
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "เมื่อร้องขอ"
  source: "be820103712e"
spide.payout.notes:
  text: "ยังไม่ได้ระบุ: CashPilot ยังไม่ได้ตรวจสอบว่าบริการนี้เก็บรายได้ของคุณไว้ที่ใด"
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% ของรายได้ของผู้ที่ได้รับการแนะนำ"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "โบนัสสมัคร $5"
  source: "ed267fc12fb2"
spide.requirements.note:
