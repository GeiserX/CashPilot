storj.description:
  text: "Storj เป็นเครือข่ายพื้นที่จัดเก็บบนคลาวด์แบบกระจายศูนย์ที่สร้างรายได้จากการปล่อยเช่าพื้นที่ดิสก์ที่ไม่ได้ใช้ เรียกใช้โหนดพื้นที่จัดเก็บผ่าน Docker และรับ $1.35/TB ที่จัดเก็บต่อเดือน บวก $1/TB สำหรับข้อมูลขาออก (อัตราตั้งแต่ 1 กันยายน 2026) จ่ายเงินรายเดือนเป็น USDC ซึ่งเป็น stablecoin สกุลดอลลาร์สหรัฐ บน Ethereum mainnet เข้ากระเป๋าเงินที่ควบคุมเอง เมื่อยอดคงเหลือเกินขั้นต่ำที่คิดตามค่าธรรมเนียม (เป็นโทเค็น STORJ จนถึงการจ่ายเงินเดือนกันยายน 2026) ต้องมีพื้นที่ดิสก์ว่างอย่างน้อย 550GB และการเชื่อมต่ออินเทอร์เน็ตที่เสถียร ไม่ต้องมีบัญชีหรือสมัคร -- โหนดไม่ต้องขออนุญาตตั้งแต่กลางปี 2025 ข้อควรระวัง (ตุลาคม 2026): Storj Labs ยื่นขอ Chapter 11 เมื่อวันที่ 26 กรกฎาคม 2026 (US Bankruptcy Court, Northern District of West Virginia, คดี 5:26-bk-00512) เพื่อปรับโครงสร้างหนี้เดิม เครือข่ายยังทำงานต่อและ Storj ยังจ่ายเงินให้โหนดที่ใช้งานอยู่ แต่รายได้ของโหนดก่อนการยื่นถูกระงับไว้จนกว่าศาลจะมีคำตัดสิน โทเค็น STORJ ลดลงประมาณ 98% จากจุดสูงสุดในปี 2021 Binance ถอดออกจากรายการเมื่อวันที่ 3 กันยายน 2026 และ Coinbase ระงับการซื้อขายเมื่อวันที่ 28 กันยายน 2026 โหนดใหม่จะถูกหักรายได้บางส่วนไว้ในเก้าเดือนแรก และจะมีข้อมูลเต็มเท่าที่ความต้องการของลูกค้าเอื้ออำนวยเท่านั้น การเริ่มโหนดตอนนี้จึงเป็นการผูกระยะคืนทุนที่ยาวนานไว้กับบริษัทที่กำลังปรับโครงสร้างและอาจยังปิดกิจการได้\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "โหนดพื้นที่จัดเก็บแบบกระจายศูนย์ - $1.35/TB ที่จัดเก็บ + $1/TB ขาออก"
