  text: "ทั้งข้อกำหนดและนโยบายความเป็นส่วนตัวไม่ได้ระบุนิติบุคคล และข้อกำหนดปล่อยเรื่องเขตอำนาจศาลที่ใช้บังคับไว้ให้เวอร์ชันถัดไป"
  source: "4085fd9eadf6"
