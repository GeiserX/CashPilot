  text: "พอร์ตขาเข้าต้องเข้าถึงได้จากอินเทอร์เน็ต (ค่าเริ่มต้นคือ 22, 8080 และ 3000-4000) และงานของคนแปลกหน้าจะรันบนสายนี้ คู่มือเครือข่ายของ Clore เองระบุว่า ISP บางรายบล็อกการโฮสต์"
