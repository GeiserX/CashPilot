proxybase-xyz.description:
  text: "ProxyBase Markets เป็นตลาดพร็อกซี SOCKS5 ที่สร้างมาสำหรับเอเจนต์ AI ผู้ขายเรียกใช้ daemon แบบ CLI ขนาดเล็กที่เขียนด้วย Rust ซึ่งเชื่อมต่อผ่าน WebSocket เพื่อส่งต่อทราฟฟิกของผู้ซื้อผ่านการเชื่อมต่ออินเทอร์เน็ตของผู้ขาย และได้รับ USDC บน Tempo Chain ต่อ GB ที่ขาย รองรับทั้งโหมด direct (แบนด์วิดท์ของตนเอง) และ upstream (ขายต่อพร็อกซีภายนอก) พร้อมการเชื่อมต่อใหม่อัตโนมัติ ผู้ซื้อซื้อเซสชันพร็อกซีตามประเทศ ISP และแบนด์วิดท์ การชำระเงินผ่าน Machine Payments Protocol (MPP) บน Tempo Chain ลิงก์แนะนำมีไว้สำหรับผู้ซื้อ: ผู้ซื้อที่เปิดคอนโซลผ่านลิงก์นี้จะได้รับเพิ่ม 10% ในการฝากเงินครั้งแรก\n"
  source: "f130fd8beea7"
