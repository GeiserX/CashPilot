proxyrack.description:
  text: "Il programma Peer di ProxyRack ti permette di guadagnare condividendo la tua banda come parte della sua rete di proxy. Ogni dispositivo richiede un UUID esadecimale univoco di 64 caratteri e, facoltativamente, una chiave API per registrare il dispositivo in automatico. Funziona sia su connessioni residenziali sia su VPS/data center. La dashboard è protetta da Cloudflare, quindi può essere necessario recuperare la chiave API a mano dal browser.\n"
