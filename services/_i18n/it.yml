  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "Tieni un dispositivo che condivide, oppure richiedi un pagamento. In modalità JumpTask è normale che il saldo resti fermo, quindi scegli Non fa per me."
