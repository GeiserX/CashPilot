proxybase.description:
  text: "ProxyBase è una piattaforma di condivisione di banda che paga gli utenti in criptovalute per condividere la connessione internet che non usano. Autentichi il client peer con un Access Token preso dalla tua dashboard. Gli IP residenziali guadagnano di più, ma sono supportati anche gli IP di data center. Immagine Docker ufficiale multi-architettura (amd64/arm64/armv7).\n"
  source: "7a558682be11"
proxybase.short_description:
  text: "proxybase.org - condivisione di banda, pagamenti in criptovalute, accesso con Access Token. Non viene generato alcun wallet"
  source: "5224bb16fee4"
proxybase.docker.env.ID.label:
  text: "Access Token"
  source: "f9db72ced1ee"
proxybase.docker.env.NAME.label:
  text: "Nome del dispositivo"
  source: "6415f86bc24f"
proxybase.docker.env.ID.description:
  text: "Accedi a <a href=\"https://peer.proxybase.org/dashboard/login?referral=nXzS3c6iTO\">peer.proxybase.org/dashboard</a> → copia il tuo Access Token (mostrato nel comando Docker nella pagina di configurazione)"
  source: "3571c2e99729"
proxybase.docker.env.NAME.description:
  text: "Un nome qualsiasi (senza spazi) per identificare questo dispositivo nella tua dashboard di ProxyBase"
  source: "906ebedecbc7"
proxybase.docker.health_signals.0.means:
  text: "ProxyBase non raggiunge il suo relay da almeno mezz'ora, quindi non guadagna nulla. Un riavvio risolve il problema; se persiste dopo il riavvio, controlla che questa macchina riesca a raggiungere internet."
  source: "cbe6b5ef771f"
proxybase.earnings.notes:
  text: "Pagamenti in criptovalute. I guadagni dipendono dalla zona e dall'uso della banda."
  source: "39229c292994"
proxybase.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
proxybase.cashout.notes:
  text: "Il sito indica un minimo di $0.20, e a ottobre 2026 una richiesta sotto $1 è andata a buon fine. Una richiesta preleva sempre l'intero saldo, in USDC su Polygon, POL o Litecoin, verso un indirizzo che inserisci tu. ProxyBase copre la commissione di rete."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "I guadagni maturano sull'ACCOUNT ProxyBase a cui appartiene l'Access Token, e si prelevano dalla dashboard su richiesta. Il client peer non contiene alcun wallet e il container non conserva alcuno stato: docker.volumes è vuoto. Da non confondere con proxybase-xyz (ProxyBase Markets, stessa organizzazione), che invece crea davvero un wallet locale e lo dichiara come volume critico."
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
  text: "La stessa ProxyBase ha scritto ad agosto 2025 di essere nuova e di non essere ancora il posto giusto per massimizzare i guadagni."
  source: "9f5177f749d7"
proxybase.rating.cons.1.text:
  text: "Nel 2026 ProxyBase ha cambiato client peer e ha spento il vecchio backend, quindi i container con la vecchia immagine hanno continuato a girare ma hanno smesso di guadagnare."
  source: "452b38e35357"
proxybase.rating.cons.2.text:
  text: "Solo criptovalute, in USDC su Polygon, POL o Litecoin, senza metodi in valuta tradizionale. Il minimo è $0.20 e ProxyBase paga la commissione di rete."
  source: "2f15ff41b14c"
proxybase.rating.pros.0.text:
  text: "Il nostro prelievo di meno di $1 è andato a buon fine a ottobre 2026."
  source: "00e8781a2252"
proxybase.rating.pros.1.text:
  text: "Per un prelievo basta inserire un indirizzo nella richiesta."
  source: "985d03ae1755"
proxybase.rating.pros.2.text:
  text: "ProxyBase pubblica una propria immagine del client peer e supporta gli IP di data center."
  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets è un marketplace di proxy SOCKS5 pensato per gli agenti AI. I venditori eseguono un leggero daemon CLI in Rust che si connette tramite WebSocket per inoltrare il traffico degli acquirenti attraverso la loro connessione internet, guadagnando USDC su Tempo Chain per ogni GB venduto. Supporta sia la modalità diretta (la tua banda) sia quella upstream (rivendita di proxy esterni), con riconnessione automatica. Gli acquirenti comprano sessioni proxy per paese, ISP e banda. I pagamenti passano per il Machine Payments Protocol (MPP) su Tempo Chain. Il link referral è per gli acquirenti: un acquirente che apre la console tramite questo link riceve il 10% in più sul primo deposito.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - marketplace SOCKS5 per agenti AI, pagamenti in USDC. Genera un wallet il cui volume contiene l'unica copia della chiave"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "URL dell'API di backend"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "Sostituisce l'URL dell'API di backend (predefinito: https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "Al primo avvio il container si configura da solo: genera un wallet secp256k1 (BIP-39), si autentica con un challenge-response ECDSA e inizia a vendere banda in modalità solo diretta. Tutto lo stato (wallet, token di sessione, configurazione del venditore) viene conservato nel volume <code>proxybase-data</code>. Al primo avvio controlla i log del container per trovare l'indirizzo del wallet. Usa <code>--upstream</code> per aggiungere percorsi di rivendita tramite proxy esterni.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "Il file della chiave del wallet generato. Questo volume SONO i soldi: non esiste una copia sul server, quindi se lo elimini distruggi anche i fondi."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Guadagni basati sui GB venduti a prezzi di mercato. Gli IP di VPS/data center guadagnano meno di quelli residenziali. La modalità multi-upstream può combinare la tua banda con proxy esterni."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Blocca i guadagni con <code>proxybase-cli seller payout create</code>, che arrivano come USDC su Tempo Chain (Tempo MPP). Paga qualsiasi indirizzo EVM di cui possiedi la chiave (Tempo è una chain EVM), senza nulla da firmare; aggiungi la rete Tempo al wallet per vedere gli USDC. Se un wallet continua a non mostrarli, devi aggiungere a mano il token USDC di Tempo: importalo con l'indirizzo del contratto fornito da Proxybase, e controlla quell'indirizzo prima di fidarti del saldo."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "Al primo avvio il client crea il proprio wallet."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "15% di ogni deposito fatto da un acquirente invitato, come credito per le tue sessioni proxy"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "+10% sul primo deposito di un acquirente"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "Banda, come proxy SOCKS5 venduto agli acquirenti del marketplace ProxyBase."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Sì. Gli acquirenti fanno passare il loro traffico dalla tua connessione: è esattamente ciò che viene venduto."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Un indirizzo di wallet generato sulla tua macchina, più il volume di traffico che inoltri."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Reale, e riguarda direttamente le connessioni domestiche. Il traffico proxy di acquirenti sconosciuti esce con il tuo IP, quindi le segnalazioni di abuso arrivano a te. Nulla in questo catalogo limita il servizio agli indirizzi di data center, e gli IP residenziali guadagnano di più, quindi qui l'incentivo spinge nella direzione sbagliata: leggi i termini del tuo ISP prima di eseguirlo a casa."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "sconosciuto - il fornitore non pubblica un limite di dispositivi per account o per IP, e il catalogo non ne dichiara uno."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "I pagamenti sono in USDC su Tempo Chain, verso qualsiasi indirizzo EVM di cui possiedi la chiave."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "La tua connessione viene venduta come proxy SOCKS5 agli acquirenti del marketplace; non abbiamo trovato alcuna descrizione di come vengano verificati gli acquirenti."
  source: "2dec55ca610f"
proxybase-xyz.rating.pros.0.text:
  text: "La sua stessa pagina sui guadagni dichiara nel titolo che non serve KYC, con un pagamento da $1."
  source: "25b6dc3b4608"
proxybase-xyz.rating.pros.1.text:
  text: "ProxyBase pubblica una propria immagine del client e accetta connessioni da data center."
  source: "ae81d006093f"
