proxyrack.docker.env.API_KEY.description:
  text: "Accedi a <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> → la API Key è mostrata nella pagina principale della dashboard (se la fornisci, il dispositivo si registra in automatico). Ti serve un account? Registrati con <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
