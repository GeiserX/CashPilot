  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "I guadagni restano validi per 24 mesi dopo aver raggiunto il minimo di $20. Dopo, Honeygain può cancellare ciò che non è stato pagato."
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
