proxyrack.docker.health_signals.0.means:
  text: "Il client di ProxyRack non riesce a funzionare su questa copia, quindi non guadagna nulla. Di solito il server degli aggiornamenti di ProxyRack non risponde, e il client non può avviarsi senza. La copia riprova ogni 5 minuti e si avvia da sola appena il server risponde. Non devi correggere nulla."
  source: "0df8b8cfac10"
proxyrack.docker.health_signals.1.means:
  text: "Il client di ProxyRack non è stato scaricato all'avvio di questa copia, perché il server degli aggiornamenti di ProxyRack non era raggiungibile, quindi la copia è in esecuzione ma non guadagna nulla. CashPilot la riavvia ogni 6 ore per riprovare. Ridistribuiscila per darle l'avvio proprio di CashPilot, che conserva il client e riprova da solo ogni 5 minuti."
  source: "0a2ee4b478b2"
proxyrack.device_link.steps:
  text: "Accedi a ProxyRack, apri Devices, scegli Add device e incolla questo UUID. Finché il dispositivo non è nel tuo account, non guadagna per nessuno. Se hai inserito una chiave API, il container si registra da solo: controlla che il dispositivo sia elencato lì."
  source: "54c4041903b5"
proxyrack.earnings.notes:
  text: "Gli IP residenziali guadagnano più di quelli di data center. La dashboard protetta da Cloudflare può complicare l'accesso automatico."
  source: "b6e36d751afd"
proxyrack.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
proxyrack.cashout.notes:
  text: "Richiedi il pagamento dalla dashboard. ProxyRack lo controlla entro 72 ore, poi Tremendous ti invia via email una ricompensa da riscattare come PayPal, buono regalo o bonifico bancario. Non c'è un'opzione in criptovalute."
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "Saldo conservato da ProxyRack; prelevato su richiesta."
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "Accedi a <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a>, premi F12 → Network, trova una qualsiasi richiesta API e copia il valore dell'header <b>Api-Key</b>. Ti serve un account? Registrati con <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "Proxyrack documenta un limite di 500 dispositivi per ACCOUNT e nessun limite per IP. Gli IP di data center sono accettati ma riclassificati a una tariffa più bassa."
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "Il centro assistenza di ProxyRack dice che rimuovere un dispositivo toglie dal tuo account i guadagni di quel dispositivo, e che tornano solo se lo stesso dispositivo viene aggiunto di nuovo."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack pubblica una propria immagine Docker, proxyrack/pop, e accetta gli IP di data center a una tariffa più bassa."
  source: "278541f81053"
repocket.description:
  text: "Repocket ti permette di guadagnare un reddito passivo condividendo la banda internet che non usi. Gli IP residenziali guadagnano di più; gli IP di VPS/data center sono accettati a tariffe più basse. Massimo 5 dispositivi e 5 sessioni attive per account. Il container Docker si autentica con l'email del tuo account e una chiave API presa dalla dashboard di Repocket (non la tua password).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Condivisione di banda - massimo 5 dispositivi, accesso con chiave API"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "Chiave API (UUIDv4, non la password)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "L'email del tuo account Repocket"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "La tua chiave API di Repocket: accedi a <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> e copia la chiave API mostrata nella pagina bandwidth-earnings (NON è la password del tuo account). Ti serve un account? Registrati con <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "Gli IP residenziali guadagnano di più. Gli IP di VPS/data center sono accettati ma a tariffe più basse."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 dopo il primo pagamento)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket fissa il minimo per ogni account: a ottobre 2026 era $4 prima del primo pagamento e $2 dopo, molto meno dei $20 che pubblicizzava in passato. Metodi: Tremendous (alla tua email) o USDT su Polygon. Ogni richiesta va confermata da un link inviato via email entro 2 ore, e può esserci una sola richiesta in attesa alla volta. A ottobre 2026 Repocket ha rifiutato una richiesta Tremendous con \"Please, message support\", mentre quella in USDT su Polygon è andata a buon fine."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Saldo conservato da Repocket; prelevato su richiesta."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Usa l'email e la password del tuo account Repocket (le stesse di <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Ti serve un account? Registrati con <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2 quando la persona invitata ha guadagnato $7, poi il 5% dei suoi guadagni a vita"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "Bonus di $2 nel wallet alla registrazione"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket documenta un limite di cinque dispositivi per ACCOUNT ma non pubblica alcun limite di dispositivi per IP. La cifra di '2 dispositivi per IP' ripetuta sui siti di recensioni non ha una fonte del fornitore, quindi CashPilot non la riporta come certa."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Tieni attivo un dispositivo Repocket che condivide, oppure preleva il tuo saldo"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Dopo 12 mesi senza accessi, pagamenti o condivisione di banda, Repocket può annullare il saldo non pagato."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Tieni un dispositivo che condivide, accedi o preleva. Se smetti di usare Repocket, preleva prima."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Diversi recensori su Trustpilot segnalano pagamenti annullati e saldi azzerati; uno dice che l'assistenza ha citato guadagni di banda irregolari. La pagina dà a Repocket un voto di 2.7 e nota che non ha risposto alle recensioni negative."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "I recensori segnalano prelievi rifiutati e di aver dovuto sollecitare il pagamento."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "La politica di pagamento di Repocket le permette di stornare, annullare o far perdere definitivamente i guadagni ogni volta che sospetta che non siano validi, e di annullare i guadagni non pagati di un account inattivo."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "La stessa politica permette a Repocket di aggiungere, rimuovere o sostituire i metodi di pagamento in qualsiasi momento senza preavviso; PayPal è stato rimosso."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "I termini dicono che Repocket può richiedere in qualsiasi momento una verifica dell'identità o dell'account, e che il diritto al pagamento dipende da questa."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "I termini dicono che Repocket e i suoi partner usano la capacità di rete, ma non dicono chi siano i partner né come vengano verificati."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot nota che Repocket non ha risposto alle recensioni negative, e i recensori dicono che i messaggi vengono ignorati."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "I termini attuali indicano Repocket Pte. Ltd. a Singapore; i termini precedenti non indicavano alcuna società."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket pubblica una propria immagine Docker, repocket/repocket, e i suoi termini consentono i container di tua proprietà."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Il minimo è basso: $4 prima del primo pagamento e $2 dopo."
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io ti permette di condividere la tua GPU per carichi di lavoro AI distribuiti e guadagnare saldo Salad riscattabile in buoni regalo, giochi o denaro. Solo Windows, con un'applicazione desktop nativa. Richiede una GPU dedicata (NVIDIA o AMD). Quando la macchina è inattiva, la piattaforma le invia attività di inferenza AI, rendering e altro calcolo. È una delle piattaforme di condivisione GPU più facili da usare.\n"
  source: "09335baccea6"
salad.short_description:
  text: "Condivisione GPU per l'AI - solo Windows, pagamento in buoni regalo o denaro"
  source: "4665796e0965"
salad.earnings.notes:
  text: "I guadagni dipendono dal modello di GPU e dalla disponibilità di lavoro. RTX 3060 ~$1-3/giorno. Solo Windows. App nativa, nessun supporto Docker. Riscattabile in buoni regalo, giochi o PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal o buoni regalo tramite lo store di Salad."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Solo PayPal e buoni regalo, mai criptovalute. Non esiste un indirizzo di wallet, quindi CashPilot non ha alcun saldo on-chain da mostrare."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Accedi a <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, premi F12 → Application → Cookies, copia il valore del cookie <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Guadagna qualche Salad Reward Point, oppure spendi il tuo saldo"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Se un account non guadagna Reward Points per 12 mesi di fila, il suo saldo non riscattato può scadere."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Esegui l'app Salad finché non guadagna, oppure spendi l'intero saldo nel Salad Storefront. Spenderne solo una parte non azzera i 12 mesi."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot non esegue Salad: usi l'app desktop del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Diversi recensori su Trustpilot a ottobre e novembre 2026 riferiscono prelievi PayPal arrivati rapidamente, alcuni più di una volta; un recensore nello stesso periodo dice che ripetuti tentativi di prelievo sono falliti."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel è una blockchain Layer 1 su Cosmos per una VPN decentralizzata. Chi gestisce un nodo vende banda agli utenti VPN con prezzi flessibili (per GB o all'ora). È disponibile una guida ufficiale alla distribuzione con Docker. Progetto attivo da tempo, con una community attiva.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "VPN decentralizzata su Cosmos - chi gestisce un nodo vende banda"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Chi gestisce il nodo fissa i propri prezzi per GB o all'ora. I guadagni dipendono dalla domanda degli utenti VPN nella tua zona."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Per sessione"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "I pagamenti sono nel token P2P, e il 20% di ogni pagamento per la banda va a chi fa staking invece che a chi ospita il nodo."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "Il token è stato rinominato da SENT a DVPN nel 2021 e da DVPN a P2P nel 2025."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot non esegue Sentinel: usi il software di nodo del fornitore, quindi CashPilot non può distribuirlo né aggiornarlo per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel pubblica il codice sorgente del nodo con una propria licenza open source."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia è un marketplace di archiviazione decentralizzato gestito dalla Sia Foundation (un'organizzazione no profit svizzera) e attivo dal 2015. Esegui il nodo ufficiale hostd della Foundation per affittare lo spazio su disco che non usi e guadagnare Siacoin da contratti di archiviazione e banda. Prima che il nodo possa guadagnare devi comprare un po' di Siacoin: gli host bloccano una garanzia per ogni contratto e pagano una commissione per ogni prova di archiviazione. La garanzia viene restituita quando un contratto si conclude e viene bruciata se il nodo va offline o perde dati, quindi serve una macchina sempre accesa (Sia indica almeno il 95% di tempo di attività). I guadagni dipendono da quanti dati gli affittuari archiviano davvero; Sia consiglia di prezzare l'archiviazione a $1 per TB al mese, quindi è adatto a macchine con dischi grandi e liberi più che a piccole VPS.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Nodo di archiviazione della Sia Foundation - immagine Docker ufficiale, guadagna Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Frase seed del wallet"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Password della dashboard"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Cartella di archiviazione"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "Frase seed BIP-39 che controlla il wallet Siacoin dell'host. Generane una con `docker run --rm ghcr.io/siafoundation/hostd seed` e fanne un backup: è l'UNICO modo per accedere ai guadagni"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Password per l'interfaccia web di hostd e l'API locale (BasicAuth). Una qualsiasi passphrase lunga"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Percorso sulla macchina, sul tuo disco più grande, dove vengono archiviati i dati degli affittuari (es. /srv/sia). Servono almeno 256GB liberi"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Durante la distribuzione, CashPilot crea un nuovo wallet sulla macchina che esegue il nodo e ne mostra la frase seed una sola volta: annotala. Per usare un wallet che hai già, incolla invece la sua frase seed. Dopo la distribuzione, invia un po' di Siacoin al wallet del nodo per la garanzia e le commissioni, poi aggiungi la cartella di archiviazione (/storage), imposta i prezzi e annuncia l'host dalla dashboard.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "La frase seed del wallet (hostd.yml), il database del wallet, le impostazioni dell'host e lo stato dei contratti. Se lo perdi, perdi l'identità del nodo e il tracciamento delle entrate dei contratti; a quel punto la frase seed che hai annotato è l'unico modo per recuperare i fondi."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "I dati archiviati degli affittuari. Se li perdi, le prove di archiviazione falliscono e perdi la garanzia bloccata per quei contratti."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Gli host fissano i propri prezzi. Sia consiglia $1 per TB archiviato al mese e più di $5 per TB scaricato, e il 3.9% di ogni pagamento dei contratti va ai detentori di Siafund. Le entrate crescono con la quantità di dati degli affittuari che arriva sul nodo, che parte da zero e cresce con il tempo di attività e il prezzo. La garanzia (Sia suggerisce 2 volte il prezzo dell'archiviazione) viene bloccata per ogni contratto e restituita quando il contratto si conclude con successo.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "I guadagni maturano nel wallet Siacoin dell'host (controllato dalla frase seed). Converti gli SC su un exchange e da lì preleva su conto bancario o carta; non esiste una richiesta di pagamento presso il fornitore.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "I fondi si trovano nel wallet Sia controllato dalla frase seed, all'interno del nodo. La frase seed si trova solo nel volume dei dati di hostd sulla macchina che lo esegue; CashPilot non la salva mai. La frase che annoti quando viene creato il wallet è l'unico modo per recuperarli.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Un indirizzo pubblico stabile con le porte 9981 (TCP, consenso) e 9984 (TCP e UDP, contratti con gli affittuari) inoltrate. Su Sia l'hosting in data center/VPS è comune. Il wallet ha bisogno di Siacoin prima che il nodo possa accettare contratti."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Spazio su disco e la banda per servirlo."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "No. Gli affittuari archiviano frammenti di file cifrati sul tuo disco e li recuperano. Altre persone non fanno passare traffico arbitrario dal tuo IP."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "L'indirizzo del tuo wallet Sia, la chiave pubblica dell'host e l'IP:porta pubblico che il nodo annuncia perché gli affittuari possano raggiungerlo."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Traffico costante in upload e download sulla linea, come per qualsiasi server di archiviazione; non ti viene attribuito alcun traffico web anonimo di terzi."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Senza permessi: nessuna registrazione né account. La garanzia viene bruciata se il nodo manca le prove di archiviazione, perché va offline o perde dati."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "I guadagni sono Siacoin nel tuo wallet: non c'è un pagamento su conto bancario, quindi devi venderli tu su un exchange."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "La garanzia viene bloccata per ogni contratto e bruciata se l'host manca le prove di archiviazione perché va offline o perde dati."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Solo circa il 30% dello spazio offerto sulla rete è in uso, quindi un nuovo host compete per una domanda scarsa."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Gli affittuari archiviano frammenti di file cifrati e nessuno fa passare traffico dal tuo IP, ma non abbiamo trovato dove Sia dica chi sono gli affittuari o come vengono verificati."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd è sviluppato in modo pubblico dalla Sia Foundation, dal 2022."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd è open source con licenza MIT."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "La Sia Foundation pubblica hostd come immagine container."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Senza permessi: nessuna registrazione né account."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide è un servizio di condivisione di banda che ti permette di monetizzare la banda internet che non usi. Usa un ID macchina facoltativo per tracciare il dispositivo. Disponibile tramite immagini Docker della community del progetto income-generator.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Condivisione di banda - basato sull'ID macchina"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "ID macchina"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "ID macchina di un dispositivo già registrato (generato in automatico se vuoto)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Informazioni disponibili limitate. I guadagni dipendono dalla zona."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
spide.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% dei loro guadagni"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "Bonus di registrazione di $5"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "Il traffico che passa da un IP pubblico viene diviso tra i dispositivi che lo condividono, quindi un secondo dispositivo sulla stessa connessione non aggiunge nulla."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot non esegue Spide: usi l'app del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Mina Pearl, Zano o Ravencoin con una GPU NVIDIA. Al primo avvio CashPilot scarica la release ufficiale di SRBMiner-Multi e ne verifica lo SHA-256. Il pool che scegli paga il tuo indirizzo pubblico di pagamento. SRBMiner-Multi trattiene il 2% del tempo di hashing su Pearl e lo 0.85% sulle altre due. L'elettricità può costare più delle monete che guadagni."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Mina Pearl e altre monete per GPU su una GPU NVIDIA"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Indirizzo di pagamento"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
