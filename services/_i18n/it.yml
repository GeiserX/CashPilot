  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "Gli indirizzi della macchina su cui viene pubblicata la WebUI del nodo (porta 4449). 127.0.0.1 la mantiene su questa macchina. Per raggiungerla tramite un reverse proxy, aggiungi l'indirizzo a cui si connette il proxy, separato da una virgola e senza spazi: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "Le porte UDP che il nodo usa per le sessioni VPN, nel formato inizio:fine. Inoltra questo stesso intervallo sul tuo router. Ogni sessione occupa circa due porte, quindi le 30 predefinite gestiscono circa 15 sessioni contemporanee, più di quante ne riceva un nodo domestico. Un intervallo più ampio non risolve nulla e costa di più: ogni porta pubblicata rallenta l'avvio e la rimozione del nodo (con 300 porte l'avvio richiede circa 12 s), CashPilot ne accetta al massimo 300, e con il proxy userland predefinito di Docker ogni porta occupa anche circa 2.5 MB di memoria. Se tutte le sessioni falliscono, il problema è il router, non il numero di porte: vedi \"Routers that rewrite UDP source ports\" nella guida di Mysterium. Resta sotto 32768: le porte 32768-60999 sono l'intervallo effimero di Linux, dove qualsiasi programma sulla macchina può occuparne una per un momento, e una sola porta occupata fa fallire l'avvio del nodo. Un nodo che ha già un intervallo lo mantiene."
  source: "530524e2e718"
mysterium.docker.runtime_reason:
  text: "gVisor non gli fornisce né iptables-nft né il WireGuard del kernel, che gli servono per trasportare il traffico."
  source: "d8a72a275579"
mysterium.docker.critical_volumes.0.holds:
  text: "Keystore dell'identità del nodo. Se lo distruggi, viene creata un'identità completamente nuova: il nodo perde la sua reputazione e tutti i guadagni ancora legati a quella vecchia."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "Il nodo non può eseguire sudo dentro il suo container, quindi non può configurare la sua interfaccia VPN né il firewall, e ogni sessione fallisce durante la configurazione: sembra online ma non guadagna nulla. Il container è stato creato senza le capability SETUID e SETGID. Aggiorna CashPilot e il worker che esegue questo nodo, poi ridistribuisci Mysterium dalla dashboard; l'identità del nodo si trova nel suo volume dei dati e viene conservata."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "Nelle ultime 6 ore nessuna sessione VPN ha raggiunto questo nodo direttamente. Tutte sono ripiegate sull'hole punching, e molti acquirenti non riescono a connettersi in quel modo, quindi il nodo guadagna meno. Le sue porte UDP non sono raggiungibili da internet. Sul tuo router, inoltra l'intervallo di porte UDP ${UDP_PORTS} (inizio:fine, lo stesso intervallo da entrambi i lati) verso ${HOST_ADDRESS}. L'avviso sparisce da solo appena una sessione si connette direttamente."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Il monitoraggio di Mysterium segna come guasto il nodo su ${WORKER_NAME}, quindi viene escluso dall'elenco di nodi da cui sceglie la maggior parte degli acquirenti, anche quando il suo stesso controllo dice che tutte le porte sono raggiungibili. Per prima cosa assicurati che il nodo abbia /dev/net/tun e SETUID/SETGID, la cui mancanza lo fa fallire allo stesso modo: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Se questi ci sono, una causa comune è il router davanti a ${WORKER_NAME}, che riscrive la porta UDP di origine delle risposte del nodo dopo che un pacchetto dall'esterno ha raggiunto quella porta. Vedi il test nella guida: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "Le ultime cinque sessioni VPN del nodo su ${WORKER_NAME} sono terminate ciascuna dopo circa un minuto senza aver trasferito dati, quindi non guadagna nulla pur sembrando online. La causa probabile è il router davanti a ${WORKER_NAME}: dopo che un pacchetto dall'esterno raggiunge una porta, riscrive la porta di origine delle risposte successive del nodo da quella porta, e ogni sessione inizia proprio con un pacchetto del genere (il controllo delle porte del nodo stesso), quindi gli acquirenti scartano le risposte del nodo. Un intervallo di porte più ampio non aiuta. Vedi il test e le soluzioni nella guida: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports L'avviso sparisce appena una sessione trasferisce dati."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Guadagni in token MYST. Gli IP residenziali guadagnano molto di più. La WebUI del nodo per la gestione è sulla porta 4449 e per impostazione predefinita è pubblicata solo sulla macchina su cui gira (127.0.0.1); da un'altra macchina apri prima un tunnel SSH (ssh -L 14449:127.0.0.1:4449 seguito dall'indirizzo della macchina del nodo, poi apri http://127.0.0.1:14449 nel browser; la porta locale 14449 evita conflitti con un nodo sulla tua stessa macchina), oppure aggiungi un indirizzo a UI_ADDRESS (vedi WebUI address nella guida di Mysterium). VPS accettati. L'inoltro delle porte UDP 23000-23029 (il valore predefinito di UDP_PORTS) è fortemente consigliato: senza, i nodi finiscono in stato Strict NAT e molte sessioni VPN falliscono, riducendo molto i guadagni. Importante: dopo il primo avvio, imposta il wallet beneficiario (di settlement) dalla WebUI del nodo o dalla CLI in modo che corrisponda al tuo account mystnodes.com: così i guadagni on-chain vengono collegati alla tua dashboard cloud."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Settlement on-chain automatico ogni volta che un nodo accumula 5 MYST non ancora liquidati"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Non c'è nessun pulsante da premere. Ogni nodo esegue da solo il settlement su Polygon appena accumula 5 MYST non liquidati, e circa il 21% se ne va in commissioni (la commissione Hermes del 20% più una piccola commissione di transazione), quindi a ogni settlement arrivano al wallet beneficiario circa 3.9 MYST. La TequilAPI di ogni nodo elenca i suoi settlement in /transactor/settle/history. La cifra \"total earnings\" su MystNodes copre solo gli ultimi 30 giorni; non è né un saldo né un totale complessivo. I MYST bonus del programma di ricompense di MystNodes non vengono liquidati da soli: riscuotili nella pagina Rewards, entro 30 giorni dalla distribuzione secondo il centro assistenza di MystNodes."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "Il wallet beneficiario si imposta DOPO la distribuzione, tramite TequilAPI o la WebUI del nodo, non con una variabile d'ambiente, quindi non si può leggere dalla specifica del container."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Usa l'email e la password del tuo account MystNodes (le stesse di <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST per ogni amico il cui nodo guadagna 5 MYST (solo IP residenziali)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST quando il tuo nodo guadagna i suoi primi 5 MYST (IP residenziale, nodo associato su mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Riscuoti le ricompense MystNodes del mese scorso"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Le ricompense non riscosse entro 30 giorni dalla distribuzione mensile vanno perse e tornano nel pool del mese successivo."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Apri la pagina Rewards e converti i tuoi punti in MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Banda. La tua connessione viene usata come nodo di uscita della rete Mysterium, che vende servizi di VPN, proxy E raccolta di dati (scraping). Il traffico di scraping che esce da un IP residenziale è l'uso che più probabilmente attira segnalazioni, e non puoi scegliere quale dei tre trasporta il tuo nodo."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Sì. Persone sconosciute fanno passare il loro traffico dal tuo indirizzo IP: è proprio questo il prodotto."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "L'identità del nodo (un indirizzo blockchain), il tuo IP e la posizione approssimativa (paese/città/ISP), che il nodo pubblica nella rete perché gli acquirenti possano sceglierlo."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Reale, e vale la pena capirlo. Il traffico di altre persone esce dalla tua connessione attribuito a te, quindi tutto ciò che fanno sembra partire dalla tua linea. Molti contratti degli ISP domestici lo vietano. Controlla il tuo prima di eseguirlo."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Dispositivi illimitati per account e per IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Circa il 21% di ogni settlement se ne va in commissioni, la commissione Hermes del 20% più una commissione di transazione, e i guadagni sono pagati nel token MYST."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Il tuo nodo fa da uscita per i clienti di VPN, proxy e scraping di Mysterium, e non puoi scegliere quali di questi trasporta."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "Il software del nodo è open source con licenza GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium pubblica una propria immagine Docker, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "Il settlement va a un wallet di tua proprietà; non servono numero di telefono né documento d'identità."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "Il progetto del nodo è attivo dal 2017."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Il sito di Mysterium dice che la rete è sviluppata da Blockdev AG, Zugo, Svizzera."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay è una rete DePIN che ricompensa gli utenti che condividono banda tramite un'estensione per browser. La piattaforma è protetta da Cloudflare, il che può complicare l'accesso automatico. Gli utenti guadagnano Nodepay Points tenendo attiva l'estensione. La rete si concentra sulla fornitura di infrastruttura per i dati di addestramento dell'AI.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "Condivisione di banda DePIN per l'AI - estensione per browser"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Guadagna Nodepay Points; i punti degli utenti che superano i controlli di idoneità di Nodepay vengono convertiti nel token NC. La protezione Cloudflare può bloccare la raccolta automatica. Serve l'estensione per browser."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Airdrop del token NC (tempistica non confermata)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Sistema a punti. I punti degli utenti che superano i controlli di idoneità di Nodepay vengono convertiti nel token NC, lanciato a gennaio 2025."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "Nella revisione della prima stagione Nodepay ha rimosso più di 300.000 account che ha giudicato bot e ha annullato 17 miliardi di punti."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Le ricompense sono punti convertiti nel token NC, quindi il loro valore dipende dal token."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot non esegue Nodepay: usi l'estensione per browser del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes è il livello di ingresso gratuito del Noderr Protocol, un progetto DeFi su Base L2. Un micronodo è un piccolo agente su un telefono Android inutilizzato, un PC Windows, un Mac o un browser Chromium. Su Android condivide la connessione mobile del telefono: altro traffico Noderr esce dall'IP dell'operatore del telefono, quindi serve una SIM con dati mobili. Su un PC o nel browser esegue attività di automazione per il protocollo con la potenza di calcolo inutilizzata. Le ricompense sono pensate per essere pagate in NODR, in proporzione a un punteggio on-chain di tempo di attività e affidabilità, ma durante la beta la rete è sulla testnet Base Sepolia: le ricompense dei nodi non sono finanziate e finora non ne è stata pagata nessuna.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Micronodo gratuito (condivisione della connessione su Android, Windows, Mac, browser) - testnet, ricompense finora non finanziate"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Beta su testnet: le ricompense dei nodi non sono finanziate e finora non ne è stata pagata nessuna. L'APY del 5-10% indicato sul sito è un obiettivo di progetto. Da ricontrollare quando la rete lascerà Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Le ricompense maturano nel wallet del nodo e si riscuotono dall'app o dalla dApp. Durante la beta sono token della testnet Base Sepolia senza valore di mercato."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "Al primo avvio l'app crea il wallet del nodo e vi conia gratuitamente un Utility NFT soulbound. Fai il backup del wallet dall'app: se perdi il dispositivo, perdi l'identità del nodo. Durante la beta le ricompense sono su Base Sepolia (testnet)."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android richiede una SIM con dati mobili; per i client desktop e browser non è indicato alcun requisito di IP."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Dipende dal dispositivo. Un telefono Android vende la sua connessione mobile: altro traffico Noderr esce dall'indirizzo IP dell'operatore del telefono e consuma il suo piano dati. Un PC Windows, un Mac o un browser vende potenza di calcolo inutilizzata per quelle che il fornitore chiama attività di automazione per social media e contenuti."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Sì. Su Android, altro traffico Noderr esce dall'indirizzo IP mobile del tuo telefono; prima di iniziare l'app chiede un consenso che viene registrato, e puoi interrompere la condivisione dalla stessa schermata. Per i client Windows, Mac e browser il fornitore descrive attività di automazione e non dice se trasportino traffico per altre persone."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "L'indirizzo del wallet del nodo e i suoi dati di tempo di attività e di attività completate finiscono on-chain come punteggio di reputazione (il TrustFingerprint). Il fornitore dice che le attività sono anonimizzate, vengono eseguite in una sandbox e che le chiavi del wallet non lasciano mai il dispositivo. Non è pubblicato nulla di più specifico."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Su Android la connessione condivisa è un piano mobile dell'operatore: la documentazione dello stesso fornitore avverte che la condivisione potrebbe non essere consentita dalle condizioni d'uso di alcuni operatori, e il traffico condiviso consuma i dati del piano. Per i client desktop e browser il fornitore non dice nulla sui termini degli ISP."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Un nodo per dispositivo, ciascuno con il proprio Utility NFT soulbound; usare più dispositivi è consentito e incoraggiato. Non è pubblicato alcun limite per IP. Non c'è un account nel senso abituale: l'identità è un wallet che l'app genera al primo avvio."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Le ricompense dei nodi sono token di testnet non finanziati e senza valore di mercato, e finora non ne è stata pagata nessuna; l'APY dal 5 al 10% sul suo sito è un obiettivo di progetto."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Per i client desktop e browser Noderr descrive attività di automazione e non dice se trasportino il traffico di altre persone."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Il fornitore dice che le attività sono anonimizzate ed eseguite in sandbox, ma non pubblica nulla di più specifico."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "È ancora una beta su testnet, su Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot non esegue Noderr: usi l'app o l'estensione del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Nessun account: l'app genera un wallet al primo avvio."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle usa il Bluetooth degli smartphone per creare un'infrastruttura IoT. L'app rileva e inoltra in modo passivo i dati dei dispositivi IoT vicini, guadagnando token NODL. Citata da Forbes, con partnership aziendali con Vivendi e Hayden AI. Solo mobile (iOS e Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Relay IoT via Bluetooth - app mobile, ricompense in token NODL"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Guadagni molto bassi. App per telefono in background che usa il Bluetooth. Il collegamento del wallet può essere instabile."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Continuo"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "I NODL si trovano nel wallet dell'app su ZKsync Era; controllali nell'app o su un block explorer di ZKsync Era. Nodle ha lasciato la sua parachain Polkadot, e il bridge da Polkadot a ZKsync ha chiuso il 31 dicembre 2025, quindi i NODL rimasti sul lato Polkadot non possono più passare a ZKsync."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "I tuoi NODL si trovano nel wallet proprio dell'app Nodle, su ZKsync Era. CashPilot non può vedere l'indirizzo di quel wallet."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "Una ricompensa in NODL per ogni nuovo utente attivo che si unisce tramite l'invito (Nodle non pubblica l'importo)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Un recensore riferisce di aver guadagnato circa $3 in tre-quattro anni; altri riferiscono un forte calo dei guadagni giornalieri."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot non esegue Nodle: usi l'app per telefono del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana è un marketplace decentralizzato di calcolo GPU basato su Solana. Mette in contatto i proprietari di GPU con la domanda di carichi di lavoro AI, e paga in token NOS. Una RTX 3060 guadagna circa $0.048/ora. La piattaforma si concentra sui carichi di lavoro di inferenza AI e usa la blockchain Solana per la pianificazione dei lavori e il settlement dei pagamenti. I nodi eseguono carichi di lavoro in container tramite la Nosana CLI.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Calcolo GPU su Solana - token NOS, RTX 3060 ~$0.048/ora"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/ora, le GPU di fascia più alta guadagnano di più. I guadagni dipendono dalla disponibilità di lavori e dal modello di GPU. Richiede GPU NVIDIA, Linux, Docker e Nosana CLI. Pagamenti nel token NOS su Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "A ogni lavoro completato"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Si guadagnano token NOS su Solana. Pagamento al wallet configurato."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Per impostazione predefinita Nosana crea un wallet Solana, quindi la maggior parte degli utenti non ne ha mai visto l'indirizzo."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Ogni host deve bloccare uno stake di NOS proporzionato al prezzo orario della sua GPU."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Gli host vengono pagati in NOS, quindi i guadagni in dollari variano con il token e con la domanda per la loro scheda."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot non esegue Nosana: usi il software host del fornitore, quindi CashPilot non può distribuirlo né aggiornarlo per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN è un pool di mining Bitcoin senza account: il tuo miner accede usando il tuo indirizzo Bitcoin come nome utente, e il pool paga quell'indirizzo. Qui CashPilot non esegue alcun miner. Legge il saldo non pagato che OCEAN conserva per il tuo indirizzo, così vedi quanto ha guadagnato il tuo ASIC (un Bitaxe, un Antminer) accanto alle tue altre entrate. Il saldo non pagato è guadagnato ma non ancora ricevuto: OCEAN lo paga on-chain quando supera la soglia di pagamento.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Pool di mining Bitcoin, monitorato tramite il tuo indirizzo di pagamento"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Quando un blocco porta il tuo saldo oltre la soglia"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN paga on-chain il tuo indirizzo appena il saldo non pagato raggiunge la soglia. I pagamenti Lightning (da attivare, BOLT12) non vengono rilevati da CashPilot."
  source: "2d0f3e2d7422"
ocean.payout.notes:
