# Italian translations of the catalog strings in en.yml, keyed <slug>.<path>.
# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/it.yml --restamp '<key>'
2miners-etc.description:
  text: "Tieni traccia del saldo Ethereum Classic non ancora pagato che 2Miners conserva per il tuo indirizzo pubblico di pagamento ETC. Esegui il tuo miner e puntalo verso il pool. CashPilot legge il saldo e ti chiede di confermare i pagamenti quando il saldo scende.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Pool di mining Ethereum Classic, monitorato tramite il tuo indirizzo di pagamento"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (regolabile)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "Il pool controlla la tua soglia di pagamento ogni due ore"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners paga automaticamente il tuo indirizzo appena raggiungi la soglia che hai scelto. La soglia più bassa per i pagamenti ETC è 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Il saldo non pagato matura su 2Miners. Il saldo del wallet è una lettura separata dalla rete Ethereum Classic. Controlla nel tuo wallet l'importo ricevuto prima di confermare un pagamento in CashPilot.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Inserisci l'indirizzo pubblico di pagamento Ethereum Classic che il tuo miner usa su 2Miners, che inizia con <b>0x</b>. Non aggiungere il nome del worker.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Richiede un miner ETCHash puntato su 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "calcolo"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "No. Il tuo miner invia al pool il lavoro di mining."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "Il pool usa il tuo indirizzo di pagamento, i nomi dei worker che scegli e l'indirizzo IP del tuo miner."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Chiunque può vedere le statistiche di un indirizzo di pagamento. Per cambiare la soglia, il pool chiede di confermare l'IP del worker."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "Il pool trattiene una commissione dell'1% e non paga finché non raggiungi la tua soglia."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (prima ATOR) è una rete decentralizzata per la privacy basata sull'onion routing. Chi gestisce un nodo esegue nodi relay e guadagna token ANYONE per la banda che mette a disposizione. In pratica, «Tor con incentivi». CashPilot lo esegue con una propria immagine, costruita dal pacchetto Debian firmato del progetto, per amd64 e arm64. La configurazione si fa tramite un file anonrc montato nel container (Nickname, ContactInfo, ORPort, ecc.). Un relay non guadagna nulla finché non vengono bloccati 100 ANYONE per lui per almeno 180 giorni, e le ricompense si riscuotono firmando nel tuo wallet. Il relay inoltre pubblica il tuo IP pubblico nell'elenco dei relay della rete, e questo può danneggiare la reputazione dell'IP, che è proprio ciò per cui pagano le app di banda residenziale.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Onion routing decentralizzato - nodi relay Tor con incentivi"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Chiave di identità ed25519 del relay. Se la distruggi, la reputazione del relay va persa e il suo storico di guadagni riparte da zero."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Paga solo con 100 ANYONE bloccati per ogni relay per almeno 180 giorni e una richiesta di ricompensa firmata nel tuo wallet. Senza lo stake un relay non guadagna nulla. Con lo stake, i guadagni dipendono dalla banda fornita e dal tempo di attività."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Per epoca"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Impostato come ContactInfo in anonrc, con il prefisso '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Impronte dei relay separate da virgole. Nessuna dashboard online le mostra. Per il relay che CashPilot esegue, esegui <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> sulla macchina dove gira. Per un relay hardware, apri il suo Relay Control Panel su <b>http://relayup.local</b> e leggi Fingerprint nella pagina Home.\n"
  source: "ffa5be0d4953"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Banda, come relay nella rete Anyone (un fork di Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Sì. Inoltra il traffico di altre persone. Se il tuo IP sia o meno l'ultimo salto dipende da come è configurato il relay, cioè se fa da nodo di uscita."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "La chiave di identità pubblica del relay, il tuo IP e la porta, e le statistiche di attività, tutti pubblicati per scelta di progetto nell'elenco della rete. Se imposti ContactInfo nel tuo anonrc, anche quello viene pubblicato lì e resta indicizzato pubblicamente per sempre: di solito è un indirizzo email, quindi lascialo vuoto a meno che tu non voglia renderlo pubblico."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Reale. Il traffico del relay viene attribuito alla tua connessione. I relay di uscita in particolare attirano segnalazioni di abuso; molti ISP domestici li vietano."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Non c'è un account a cui registrarsi, quindi non c'è nulla da limitare per account. Per guadagnare ti serve comunque un wallet Ethereum con 100 ANYONE bloccati per ogni relay per almeno 180 giorni, e CashPilot ha bisogno delle impronte dei relay per leggere le ricompense. Il progetto non pubblica un limite di relay per IP, e il catalogo non ne dichiara uno."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Un relay non guadagna nulla se non vengono bloccati 100 ANYONE per lui per almeno 180 giorni, e ogni richiesta di ricompensa va firmata nel tuo wallet."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Per come è progettato, inoltra il traffico di altre persone senza verificare chi siano; i relay di uscita attirano segnalazioni di abuso."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "Identità, IP e tempo di attività del relay vengono pubblicati nell'elenco della rete, e qualsiasi ContactInfo che imposti resta pubblico per sempre."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Non c'è un account a cui registrarsi. A un relay basta un wallet, senza verifica dell'identità."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "Il software del relay è un fork pubblico di Tor, con la licenza di Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot costruisce la propria immagine dal software relay pubblicato da Anyone, che non richiede alcun account."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping è una piattaforma decentralizzata di monitoraggio della rete che ti paga per eseguire un nodo. Il tuo nodo esegue monitoraggio di siti web, test di latenza e controlli della qualità della rete per i clienti di Bitping. Funziona sia su connessioni residenziali sia su VPS. Al primo avvio l'immagine Docker effettua l'accesso con le variabili d'ambiente BITPING_EMAIL e BITPING_PASSWORD («Attempting login with environment variables» nel suo log), poi conserva la sessione nel volume montato, così i riavvii non richiedono una nuova autenticazione.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Condivisione di banda - monitoraggio di rete decentralizzato, funziona su VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Password"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "L'email del tuo account Bitping (stesso accesso di <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "La password del tuo account Bitping. Viene usata una sola volta per creare la sessione del nodo, che poi resta salvata nel volume dei dati."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "I guadagni dipendono dalla qualità della rete e dalla richiesta di monitoraggio dalla tua zona. I nodi su VPS sono accettati."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
bitping.cashout.notes:
  text: "I guadagni dei nodi si trovano su nodes.bitping.com; app.bitping.com è la dashboard per i clienti delle API. I prelievi sono solo in SOL: quando il saldo non pagato supera $0.05, inserisci l'indirizzo Solana nella richiesta, che viene elaborata entro 24 ore. Un wallet Solana nuovo o vuoto deve prima contenere circa 0.001 SOL, per il minimo di rent della rete."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Ora solo Solana, e l'indirizzo si inserisce AL MOMENTO DEL PRELIEVO invece di essere salvato."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Usa l'email e la password del tuo account Bitping (le stesse di <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Preleva il tuo saldo Bitping"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping può annullare i guadagni non riscossi da più di 12 mesi, dopo un preavviso di 30 giorni via email."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Richiedi un prelievo in SOL su nodes.bitping.com e inserisci il tuo indirizzo Solana nella richiesta."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "I prelievi vengono pagati in Solana (SOL), a un indirizzo che inserisci in ogni richiesta."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Secondo l'assistenza di Bitping, un prelievo verso un wallet Solana nuovo e vuoto può non andare a buon fine finché non carichi tu stesso un po' di SOL su quel wallet."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Secondo l'assistenza di Bitping, server e container Docker sono supportati."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Per un prelievo basta inserire un indirizzo Solana nella richiesta."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit è un servizio di condivisione di banda che paga tramite PayPal e Stripe. Non esiste un'immagine Docker ufficiale; i client sono l'app desktop per Windows e l'app Android. Il servizio si trova su bytebenefit.io: il vecchio dominio bytebenefit.com è stato abbandonato ed è parcheggiato su un marketplace, ed è per questo che qui era stato segnato come chiuso.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Condivisione di banda - pagamenti PayPal/Stripe, app desktop/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Nessuna immagine Docker disponibile. Solo app desktop per Windows e app Android."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% dei guadagni dal traffico dei referral"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "Bonus di benvenuto di $1 (10.000 Coins)"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "La scheda dell'app su Google Play dice che il tuo traffico serve richieste di web intelligence dei clienti di Infatica, senza dire chi siano né come vengano verificati."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "L'app Android è stata rimossa da Google Play ad aprile 2026, dopo 17 mesi."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot non esegue ByteBenefit: usi l'app del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir ti permette di guadagnare un reddito passivo condividendo la banda internet che non usi. Supporta solo Windows e Android: le FAQ ufficiali dicono che non è previsto un client per Linux o Docker, iOS non è supportato e macOS non è disponibile. I guadagni dipendono molto dalla zona. Per il monitoraggio c'è la dashboard web su dash.bytelixir.com. Nessuna immagine Docker disponibile.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Condivisione di banda - solo Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Cookie di sessione"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Cookie Remember Web"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "Token XSRF"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Accedi a <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, premi F12 → Application → espandi <b>Cookies</b> nella barra laterale sinistra → fai clic sulla voce <code>https://dash.bytelixir.com</code> → nell'elenco dei cookie a destra, trova <code>bytelixir_session</code> → copia il suo Value (un lungo JWT che inizia con eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Stessa posizione (Cookies → <code>https://dash.bytelixir.com</code>) → trova il cookie chiamato <code>remember_web_...</code> → copia il suo Value (facoltativo, allunga la durata della sessione)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Stessa posizione → trova <code>XSRF-TOKEN</code> → copia il suo Value (facoltativo)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "I guadagni variano in base alla zona ($2-50/mese). Nessuna immagine Docker. Serve l'app desktop o l'app Android."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Solo criptovalute. Il minimo dipende dalla moneta: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Inserisci l'indirizzo in ogni richiesta. Le richieste vengono gestite in orario lavorativo, entro 24 ore."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Il saldo è conservato da Bytelixir; l'indirizzo del wallet si inserisce in ogni richiesta di pagamento e non viene mai salvato nel container."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Accedi a <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>spuntando Remember Me</b>, premi F12 → Application → espandi <b>Cookies</b> nella barra laterale sinistra → fai clic su <code>https://dash.bytelixir.com</code>, poi copia tre valori: <b>bytelixir_session</b>, <b>remember_web_…</b> (quello lungo che inizia con questo prefisso) e <b>XSRF-TOKEN</b>. Il solo cookie di sessione scade circa due ore dopo averlo copiato, quindi la raccolta si ferma il pomeriggio stesso; il cookie remember_web dura un anno ed è quello che la mantiene attiva."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50% del loro profitto a vita"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "Bonus di benvenuto di $1"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Solo criptovalute, e il minimo dipende dalla moneta, da $5 per USDT a $250 per Bitcoin."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot non esegue Bytelixir: usi l'app del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Su Trustpilot ha un voto di 4.6 da 283 recensioni, la maggior parte delle quali loda i pagamenti in criptovalute; alcune segnalano pagamenti mai arrivati."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Per un pagamento basta inserire un indirizzo crypto nella richiesta."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai è un marketplace peer-to-peer di GPU. Metti a disposizione una macchina Linux con GPU NVIDIA, fissi i tuoi prezzi spot e on-demand, e chi noleggia esegue i propri container Docker su di essa. Vieni pagato solo per i minuti di noleggio, in CLORE, BTC, USDT o USDC. Per fare da host serve una macchina x86_64 con Ubuntu 22.04 o successivo (oppure HiveOS), un driver NVIDIA funzionante e almeno 100 Mbps in upload e download. Le GPU AMD non sono supportate.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "Marketplace di GPU - noleggia le tue GPU NVIDIA, pagato in CLORE, BTC o stablecoin in USD"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Vieni pagato solo per i minuti di noleggio, al prezzo che fissi tu. Il massimo della forbice, $490, è il tetto indicato dalla stessa Clore per una RTX 4090 messa a noleggio al minuto ('up to ~$490/month'); le schede più piccole guadagnano meno e una scheda inattiva non guadagna nulla. Clore trattiene il 5% (on-demand) o l'1.25% (spot) di ogni noleggio, più il 15% quando chi noleggia paga in BTC, USDT o USDC invece che in CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Preleva da Account > Billing verso il tuo wallet: CLORE (ERC-20, minimo 200, commissione di circa $0.50), BTC (minimo 0.0001, commissione 0.00005 BTC) oppure USDT/USDC su Ethereum o BNB Chain (minimo $10, commissione $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore conserva il saldo (CLORE, BTC e un unico saldo in USD per USDT/USDC) finché non prelevi. La chain si sceglie a ogni prelievo: Ethereum per CLORE, Bitcoin per BTC, Ethereum o BNB Chain per USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (livello standard) delle commissioni della piattaforma pagate dagli host e da chi noleggia che inviti, su ogni noleggio; il codice non scade mai; pagato nella valuta del noleggio (CLORE, BTC o USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps in upload e download"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "Tempo di calcolo GPU sulla tua macchina."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Sì. Chi noleggia esegue i propri container Docker sulla tua macchina, e il loro traffico esce dalla tua connessione; le porte SSH e delle applicazioni vengono inoltrate verso internet."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "L'informativa sulla privacy di Clore riguarda i dati dell'account e il tuo indirizzo IP con una posizione approssimativa; i documenti di identità solo se Clore chiede il KYC."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Le porte in ingresso devono essere raggiungibili da internet (22, 8080 e 3000-4000 per impostazione predefinita) e sulla tua linea girano carichi di lavoro di sconosciuti. La guida di rete della stessa Clore dice che alcuni ISP bloccano l'hosting."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "Almeno 18 anni, e non trovarsi in un paese sotto sanzioni. Clore può sospendere o chiudere un account a sua esclusiva discrezione, e un uso vietato può costare i fondi."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Né i termini né l'informativa sulla privacy indicano una persona giuridica, e i termini rimandano a una versione futura la scelta della giurisdizione applicabile."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore può sospendere o chiudere un account a sua esclusiva discrezione, e un uso vietato può portare alla perdita dei fondi."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "I pagamenti sono solo in criptovalute (CLORE, BTC, USDT o USDC), e Clore trattiene un ulteriore 15% di un noleggio che chi noleggia paga in BTC, USDT o USDC, a meno che l'host non blocchi CLORE per ridurlo."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Un host viene pagato solo per i minuti di noleggio, e la cifra di Clore per una RTX 4090 è un tetto («up to ~$490/month») per una singola scheda."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "L'uso di base non richiede KYC, ma Clore può chiedere una verifica dell'identità per prelievi elevati o per casi di conformità."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Chi noleggia può eseguire qualsiasi immagine Docker pubblica sulla tua macchina. I termini elencano gli usi vietati (malware, DDoS, CSAM e altro), ma non abbiamo trovato alcuna descrizione di come vengano verificati gli affittuari."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot non esegue Clore.ai: installi l'agente di hosting di Clore sulla tua macchina con GPU (Ubuntu 22.04 o successivo, oppure HiveOS), quindi CashPilot non può distribuirlo né aggiornarlo per te."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Clore trattiene il 5% di un noleggio on-demand (1.25% sullo spot) quando chi noleggia paga in CLORE, senza commissioni aggiuntive."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN gestisce una rete di validatori che verifica banda e copertura per l'infrastruttura AI finanziata tramite il protocollo DAWN. L'estensione per browser DAWN Validator partecipa a queste verifiche di banda (proof-of-bandwidth) e di copertura e guadagna ricompense DAWN mentre è attiva. Le ricompense non hanno ancora un valore in denaro definito. Crea l'account nell'estensione e inserisci il codice referral 2QLQV97F quando te lo chiede.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "Validatore DePIN - l'estensione per browser guadagna punti DAWN"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Guadagna Dawn Points prima del lancio del token. Il valore reale dipende dal prezzo futuro del token. Il dispositivo hardware guadagna più dell'estensione per browser."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Airdrop di token (da annunciare)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "L'estensione funziona ma è ancora acerba. È stato annunciato l'hardware Black Box. Da ricontrollare in futuro."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "L'estensione guadagna punti; a ottobre 2026 non era stata confermata alcuna distribuzione di token a chi gestisce i nodi."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "I punti non hanno un valore definito finché non viene lanciato un token e non ne viene annunciata la conversione."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot non esegue Dawn: usi l'estensione per browser del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network è un progetto di VPN decentralizzata e infrastruttura web3. Richiede principalmente dispositivi hardware proprietari Deeper Connect. Moken è una piattaforma collegata per mining e staking. Non è solo software.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "VPN decentralizzata - richiede un dispositivo hardware proprietario"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Richiede l'hardware Deeper Connect ($200-500). Piattaforma Moken per mining e staking. Non è solo software."
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "Continuo"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "Commissione sulla vendita del dispositivo"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "5% di sconto sul dispositivo Deeper Connect con il coupon SERGIO"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "Le ricompense di mining sono in DPR e dipendono da un punteggio di credito che cresce lentamente o facendo staking di DPR."
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot non esegue Deeper Network: usi il router hardware del fornitore, quindi CashPilot non può distribuirlo né aggiornarlo per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "b1ba1636070f"
earnapp.description:
  text: "EarnApp di Bright Data ti permette di vendere la banda che non usi per ottenere un reddito passivo. Bright Data è la più grande rete di proxy al mondo e alimenta la raccolta di dati per aziende di Fortune 500. CashPilot lo esegue con una propria immagine, che al primo avvio scarica dalla CDN di Bright Data la build di EarnApp fissata, ne verifica lo sha256 e la esegue in modalità lite con il solo UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Condivisione di banda - sostenuto da Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "UUID del nodo"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "L'ID del tuo nodo EarnApp: sdk-node- seguito da 32 caratteri esadecimali minuscoli, come lo mostra 'earnapp showid'. Dopo la distribuzione, collegalo una volta aprendo https://earnapp.com/r/ seguito da questo UUID con l'accesso a EarnApp effettuato; un nodo non collegato guadagna, ma nulla arriva al tuo saldo"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp continua a non riuscire a raggiungere i suoi server e a riavviarsi, quindi guadagna poco o nulla. Riavvia questa copia; se continua a succedere, controlla la connessione internet di questa macchina."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Apri questo link con l'accesso a EarnApp effettuato per aggiungere il nodo al tuo account. Finché non lo fai, il nodo guadagna ma nulla arriva al tuo saldo."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Dipende molto dalla zona. Gli IP di USA e UE guadagnano di più. I guadagni crescono con la banda consumata."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Su richiesta (riscatto automatico disponibile: PayPal minimo $10, Wise minimo $10, Amazon minimo $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Attiva una volta il riscatto automatico ed EarnApp paga da solo ogni volta che il saldo raggiunge il minimo del metodo: PayPal $10, Wise $10, Amazon $50. I pagamenti PayPal arrivano da Bright Data Ltd. A ottobre 2026 un pagamento PayPal è arrivato circa il 2% sotto il saldo riscattato."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Saldo conservato da EarnApp; riscattato su Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Accedi a <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, premi F12 → Application → Cookies, copia il valore di <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% dei loro guadagni a vita, pagato in aggiunta ai loro"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "Il centro assistenza di EarnApp dice che installarlo in container Docker, macchine virtuali, servizi di hosting o server domestici è severamente vietato, ed è proprio così che CashPilot lo esegue."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "Lo stesso articolo dell'assistenza dice che un account trovato a usarlo in questo modo viene chiuso senza preavviso e i suoi pagamenti in sospeso vengono annullati."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Il nostro pagamento PayPal è arrivato a ottobre 2026, circa il 2% sotto il saldo riscattato."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "Un minimo di $10 per PayPal e Wise, con riscatto automatico che paga da solo."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp appartiene a Bright Data, e i suoi pagamenti PayPal arrivano da Bright Data Ltd., un'azienda con un nome preciso."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm ti paga per condividere la tua banda internet. Il collettore dei guadagni usa l'autenticazione con email e password tramite Supabase. Immagine Docker leggera con una distribuzione semplice (il client Docker usa un token UUID separato).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "Condivisione di banda - accesso con email/password, client leggero"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "Chiave API"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "Accedi a <a href=\"https://app.earn.fm\">app.earn.fm</a> → fai clic sull'icona del profilo (in alto a destra) → Account Settings → copia la API Key (formato UUID)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "Piattaforma relativamente nuova. I guadagni variano in base alla zona e alla banda disponibile."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "Minimo $15. Metodi: USDT su BEP20 o Polygon (commissione $1) o TRC20 (commissione $3), PayPal, buoni regalo Amazon o Starbucks da $15, oppure un bonifico bancario da $1.000 con le spese di trasferimento detratte. Prima del primo pagamento compili un profilo di fatturazione (nome legale e indirizzo), usato per le ricevute dei pagamenti."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "Saldo conservato da Earn.fm; prelevato su richiesta."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Usa l'email e la password del tuo account Earn.fm (le stesse dell'accesso a <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10% dei loro guadagni a vita"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "Saldo iniziale di $5"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "Un minimo di $15, una commissione da $1 a $3 su USDT, e il bonifico bancario solo da $1.000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Prima del primo pagamento compili un profilo di fatturazione con il tuo nome legale e indirizzo."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Nel 2025 alcuni recensori segnalano che l'assistenza via email e Discord non risponde; Trustpilot nota che Earn.fm non ha risposto alle recensioni negative."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
