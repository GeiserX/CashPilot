helium.rating.cons.2.text:
  text: "CashPilot non esegue Helium: usi l'hardware hotspot del fornitore, quindi CashPilot non può distribuirlo né aggiornarlo per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "4828f2a97494"
