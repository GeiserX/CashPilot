  source: "4885bceb8df9"
packetstream.rating.pros.0.text:
  text: "PacketStream pubblica una propria immagine Docker, packetstream/psclient."
  source: "b358af0b3419"
packetstream.rating.pros.1.text:
  text: "I termini richiedono solo un dispositivo e una connessione di tua proprietà o che puoi usare."
  source: "bde1b5ad5a6a"
packetstream.rating.pros.2.text:
  text: "I termini non descrivono alcuna verifica dell'identità; per un pagamento serve un indirizzo PayPal."
  source: "a05886b55edc"
packetstream.rating.pros.3.text:
