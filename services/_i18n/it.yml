honeygain.earnings.notes:
  text: "Varia in base alla zona. Gli IP di USA e UE guadagnano di più. Massimo 10 dispositivi per account."
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "Minimo $20 (20.000 crediti). Due opzioni: PayPal tramite Tipalti, con circa il 15% di commissione, oppure crediti JumpTask senza commissione, versati in un wallet JumpTask. Una richiesta richiede un codice di 6 cifre inviato via email. Il primo pagamento PayPal resta in stato \"waiting for details\" finché non ti registri su Tipalti dal link che ti inviano via email. Quel link funziona una sola volta, quindi aprilo quando puoi finire tutto in una volta e hai il telefono a portata di mano: dopo aver impostato una password, Tipalti ti fa confermare un numero di cellulare via SMS (i codici scadono in pochi minuti), poi chiede nome, indirizzo, paese e data di nascita, e il tuo indirizzo PayPal. Tipalti addebita $2.02 per ogni pagamento; scegli USD per evitare la sua commissione di conversione valuta dell'1.9-3%. Il pagamento arriva entro 2 giorni lavorativi. Il saldo esce dal tuo account appena fai la richiesta, anche mentre il pagamento aspetta Tipalti. Ogni accesso successivo a Tipalti invia un nuovo codice SMS, a meno che non spunti l'opzione per ricordare il dispositivo per 30 giorni. A ottobre 2026 Tipalti non ha chiesto un modulo fiscale a un beneficiario in Spagna."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Saldo conservato da Honeygain; prelevato su richiesta."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Usa l'email e la password del tuo account Honeygain (le stesse di <a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a>)."
  source: "fd0be22aeb14"
honeygain.referral.bonus.referrer:
