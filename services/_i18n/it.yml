herominers-kas.disclosure.sells:
  text: "calcolo"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "No. Il tuo miner invia al pool il lavoro di mining."
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "Le statistiche pubbliche del pool mostrano ogni indirizzo di pagamento e la sua attività di mining."
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "Il pool usa il tuo indirizzo di pagamento al posto di un account."
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "Il pool trattiene una commissione dello 0.9% e non paga finché non raggiungi la tua soglia."
  source: "7eb2950589fa"
honeygain.description:
  text: "Condividi la banda internet che non usi e guadagna un reddito passivo. Honeygain fa passare dalla tua connessione traffico di web intelligence, distribuzione di contenuti e ricerche di mercato. È una delle piattaforme di condivisione di banda più consolidate, con oltre 12M di utenti e più di 1M di pagamenti completati.\n"
