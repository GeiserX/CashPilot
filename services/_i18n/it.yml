  text: "Il proprietario del sito è nascosto nei dati di registrazione del dominio, e non abbiamo trovato alcuna società con un nome dietro di esso."
  source: "7aa89b3713f9"
proxylite.rating.pros.0.text:
  text: "Un minimo di $5, in criptovalute o PayPal."
