srbminer-multi.docker.env.WALLET.description:
  text: "Il tuo indirizzo pubblico Pearl (prl1...). Per Zano o Ravencoin, inserisci l'indirizzo di quella moneta e un pool adatto."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash per Pearl, progpow_zano per Zano, kawpow per Ravencoin."
