mysterium.description:
  text: "MystNodes (Mysterium Network) è una rete decentralizzata di VPN e proxy basata sulla tecnologia blockchain. Guadagni token MYST eseguendo un nodo che fornisce agli utenti servizi di VPN, proxy e raccolta di dati (scraping). Richiede le capability NET_ADMIN, SETUID e SETGID e un dispositivo TUN, che usa all'interno del proprio namespace di rete sul bridge delle app di guadagno protetto dalla barriera. Include un'interfaccia web integrata per gestire il nodo. Funziona sia su connessioni residenziali sia su VPS, ma il bonus referral viene pagato solo per i nodi su un IP residenziale.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Nodo VPN decentralizzato - basato su blockchain, funziona su VPS"
  source: "ad1413ac81fa"
