  source: "0bfd3d74c093"
herominers-kas.description:
  text: "Tieni traccia del saldo Kaspa non ancora pagato che HeroMiners conserva per il tuo indirizzo pubblico di pagamento. Esegui il tuo miner Kaspa e puntalo verso il pool. CashPilot legge il saldo del pool e ti chiede di confermare i pagamenti quando il saldo scende.\n"
