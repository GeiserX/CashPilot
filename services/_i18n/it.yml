srbminer-multi.docker.runtime_reason:
  text: "gVisor non può passargli la GPU."
  source: "302a2b5c988f"
srbminer-multi.earnings.notes:
  text: "Stima lorda prima dell'elettricità. Il 2026-11-25 hashrate.no stimava circa $2.45 al giorno su Pearl per una RTX 4070 che assorbe circa 142 W. Non l'abbiamo misurato. Pearl è una moneta nuova, e il suo prezzo e la difficoltà cambiano rapidamente. Controlla il consumo della tua GPU e il prezzo della tua elettricità per capire se conviene."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Quando viene raggiunta la soglia del pool"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "Il pool paga il tuo indirizzo quando il tuo saldo raggiunge la soglia. Il pool conserva il saldo finché non ti paga."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, una GPU NVIDIA e NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Questa macchina risulta su una connessione di hosting. Controlla i termini del tuo fornitore prima di minare. Alcuni fornitori, tra cui Hetzner Cloud, lo vietano. Controlla i tuoi costi reali dell'elettricità prima di fidarti di una stima di profitto."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "La commissione del miner del 2% vale per pearlhash. SRBMiner-Multi trattiene lo 0.85% su progpow_zano e kawpow. HeroMiners, il pool Pearl predefinito, applica una commissione del pool dell'1%. Controlla i pagamenti ogni ora e paga da 1 PRL. Gli altri pool fissano le proprie tariffe e soglie."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "calcolo"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "No. Il miner invia il lavoro al pool che scegli."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Il tuo indirizzo di pagamento, il nome del worker e l'indirizzo IP vanno al pool. Al primo avvio il miner viene scaricato da GitHub."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Alcune reti e alcuni resolver DNS bloccano le connessioni ai pool di mining."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "La maggior parte dei pool ti identifica tramite il tuo indirizzo pubblico di pagamento."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "Il miner trattiene il 2% del tempo di hashing su Pearl e lo 0.85% su Zano e Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Alcuni fornitori di hosting vietano il mining di criptovalute."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "Il miner è closed source, quindi nessuno al di fuori del suo sviluppatore può verificare cosa esegue."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "L'elettricità della GPU può costare più delle monete guadagnate, e il prezzo di Pearl cambia rapidamente."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "Il miner invia il lavoro al pool e non inoltra il traffico di nessun altro."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Puoi minare Pearl su HeroMiners con un indirizzo pubblico e senza account."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj è una rete di archiviazione cloud decentralizzata in cui guadagni affittando lo spazio su disco che non usi. Esegui il nodo di archiviazione con Docker e vieni pagato $1.35/TB archiviato al mese più $1/TB di traffico in uscita (tariffe dal 1 settembre 2026). I pagamenti sono mensili in USDC, una stablecoin in dollari USA, su Ethereum mainnet verso un wallet che controlli tu, quando il saldo supera un minimo che dipende dalle commissioni (in token STORJ fino al pagamento di settembre 2026). Richiede almeno 550GB di spazio su disco disponibile e una connessione internet stabile. Non servono account né registrazione: dalla metà del 2025 i nodi sono senza permessi. ATTENZIONE (ottobre 2026): il 26 luglio 2026 Storj Labs ha presentato istanza di Chapter 11 (US Bankruptcy Court, Northern District of West Virginia, caso 5:26-bk-00512) per ristrutturare il debito pregresso. La rete continua a funzionare e Storj continua a pagare i nodi attivi, ma i guadagni dei nodi precedenti all'istanza sono congelati finché il tribunale non decide su di essi. Il token STORJ ha perso circa il 98% rispetto al picco del 2021. Binance lo ha rimosso dalle quotazioni il 3 settembre 2026, e Coinbase ne ha sospeso le negoziazioni il 28 settembre 2026. Un nuovo nodo trattiene parte dei guadagni durante i primi nove mesi e si riempie solo quanto la domanda dei clienti permette, quindi avviarne uno ora lega un lungo periodo di rientro a un'azienda in ristrutturazione che potrebbe ancora chiudere.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Nodo di archiviazione decentralizzato - $1.35/TB archiviato + $1/TB in uscita"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Indirizzo del wallet"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "Indirizzo esterno"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Spazio assegnato"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Cartella dell'identità"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Cartella di archiviazione"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Indirizzo del wallet Ethereum per i pagamenti in USDC (es. 0x1234...abcd). Deve essere un wallet in autocustodia (MetaMask, Ledger, ecc.): non usare mai l'indirizzo di un exchange"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "Indirizzo email per le notifiche all'operatore"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "Nome host DDNS con porta (es. mynode.ddns.net:28967): è molto meglio di un IP scritto a mano, che lascia il nodo irraggiungibile il giorno in cui il tuo ISP lo cambia senza avvisare. La porta 28967 deve essere inoltrata (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Spazio su disco massimo da assegnare (es. 2TB). Usa dischi meccanici (HDD), non SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Percorso sulla macchina dove sono salvati i file dell'identità (deve contenere ca.cert, ca.key, identity.cert, identity.key)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Percorso sulla macchina, su un disco meccanico (HDD), per i dati di Storj. Servono almeno 550GB liberi"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Prima del primo avvio, inizializza la configurazione del nodo di archiviazione: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Identità del nodo. Il suo ID è legato a una proof-of-work e richiede ore per essere rigenerato, e non si può ricreare dal backup di nient'altro. Se la perdi, perdi il saldo dei pagamenti trattenuti."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "I dati archiviati dei clienti e l'importo trattenuto del nodo. Se li perdi, il nodo viene squalificato e perdi il saldo trattenuto."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "La rete Storj non riesce a ricontattare il tuo nodo all'ADDRESS che annuncia, quindi i satelliti lo considerano offline: smettono di arrivare nuovi dati, le entrate dal traffico in uscita si fermano, e un periodo offline prolungato porta alla sospensione. Controlla che ADDRESS corrisponda al tuo IP pubblico ATTUALE (usa un nome host DDNS, non un IP scritto a mano, così un cambio di IP da parte dell'ISP non lascia il nodo irraggiungibile) e che la porta 28967 TCP+UDP sia inoltrata a questa macchina."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB archiviato + $1/TB in uscita + $1/TB per audit/riparazione dal 1 settembre 2026. I guadagni crescono con i dati archiviati e l'età del nodo. Nei primi 9 mesi viene trattenuto il 75%, poi il 50%, poi il 25% dei guadagni; metà dell'importo trattenuto viene restituita al mese 16 e il resto con un'uscita regolare (graceful exit). La porta 28967 deve essere inoltrata."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "4 volte la commissione di transazione Ethereum, i saldi più piccoli passano al mese successivo"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Mensile"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Pagato ogni mese in USDC su Ethereum mainnet quando il saldo del wallet è almeno quattro volte la commissione di transazione attuale; i saldi più piccoli passano al mese successivo. In token STORJ fino al pagamento di settembre 2026. Dashboard sulla porta 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Pagato ogni mese in USDC su Ethereum mainnet all'indirizzo in WALLET quando il saldo supera il minimo che dipende dalle commissioni. In token STORJ fino al pagamento di settembre 2026; i pagamenti su zkSync Era sono terminati il 1 settembre 2026."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "L'URL della dashboard del nodo sulla porta 14002, con l'IP LAN del server invece di localhost, per esempio <b>http://192.168.1.10:14002</b>. Per più nodi, elenca i loro URL separati da virgole: CashPilot li somma."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "I nodi Storj sulla stessa sottorete /24 si dividono l'assegnazione dei dati, riducendo i guadagni di ogni nodo."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps in upload"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Spazio su disco e la banda per servirlo."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "No. Archivi frammenti cifrati e codificati con erasure coding dei dati dei clienti. Altre persone non fanno passare il loro traffico dal tuo IP."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "L'identità del nodo, l'indirizzo del tuo wallet, l'indirizzo email che il nodo richiede per le notifiche all'operatore, e il tuo IP e la porta, che devono essere raggiungibili perché il nodo possa servire i dati."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "È soprattutto una questione di limiti di traffico più che di responsabilità: un nodo serve e riceve dati dei clienti di continuo, quindi c'è traffico reale e costante sulla tua linea. A differenza di un proxy o di un relay, però, non è traffico anonimo di terzi attribuito a te come origine, quindi non attira le segnalazioni di abuso che attirano quelli."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Nodi illimitati, ma i nodi sulla stessa sottorete /24 si dividono l'assegnazione, quindi se ne hai diversi su una sola connessione ciascuno guadagna meno."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk ha riportato il 27 luglio 2026 che Storj Labs aveva presentato istanza di protezione fallimentare Chapter 11."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "I pagamenti agli operatori dei nodi precedenti all'istanza sono finiti nella procedura dei crediti fallimentari."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "A un nuovo nodo viene trattenuto il 75%, poi il 50%, poi il 25% dei guadagni nei primi nove mesi; metà viene restituita al mese 16 e il resto solo con un'uscita regolare."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "I clienti archiviano frammenti di file cifrati e nessuno fa passare traffico dal tuo IP, ma non abbiamo trovato dove Storj dica chi sono i clienti o come vengono verificati."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "Il software del nodo di archiviazione è open source con licenza AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj pubblica una propria immagine Docker, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Nessun account: un indirizzo di wallet e un'email per gli avvisi all'operatore."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "I nodi attivi hanno continuato a essere pagati dopo l'istanza."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR è un pool di mining Monero senza account: il tuo miner accede usando il tuo indirizzo Monero come nome utente, e il pool paga quell'indirizzo. Qui CashPilot non esegue alcun miner. Legge il saldo che SupportXMR conserva per il tuo indirizzo, così vedi quanto ha guadagnato il tuo miner CPU accanto alle tue altre entrate. Il saldo è guadagnato ma non ancora ricevuto: il pool lo paga quando supera la tua soglia di pagamento.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Pool di mining Monero, monitorato tramite il tuo indirizzo di pagamento"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (automatico), 0.01 XMR su richiesta"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Quando il tuo saldo supera la soglia, o su richiesta"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR paga il tuo indirizzo quando il saldo raggiunge la tua soglia (0.1 XMR per impostazione predefinita). Sul suo sito puoi anche richiedere un pagamento immediato da 0.01 XMR, con una commissione di 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Il saldo è guadagnato ma non ricevuto finché SupportXMR non lo paga a questo indirizzo. I saldi Monero non si possono leggere on-chain senza una chiave di visualizzazione privata, che CashPilot non chiede mai, quindi confermi tu ogni pagamento."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Il tuo indirizzo di pagamento Monero: il nome utente che il tuo miner usa su SupportXMR, senza alcuna parte <b>.workername</b> o <b>+difficulty</b>. È pubblico e non dà accesso ad alcun fondo."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Richiede un miner Monero (XMRig) puntato su pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "calcolo"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "No. Il tuo miner invia hash al pool; nessuno fa passare traffico dalla tua connessione."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Il tuo indirizzo Monero, i nomi dei worker che scegli, il tuo hashrate e l'indirizzo IP del tuo miner così come lo vede il pool."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Un miner tiene aperta una sola connessione verso il pool e usa poca banda. Il costo da tenere d'occhio è l'elettricità, non il tuo ISP."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Non c'è un account. L'indirizzo è l'identità, e chiunque può leggerne le statistiche su supportxmr.com."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Paga solo in Monero, con una commissione del pool dello 0.6% e una soglia predefinita di 0.1 XMR prima di un pagamento automatico."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot non esegue un miner per SupportXMR: punti il tuo miner verso il pool, e CashPilot legge solo il saldo."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol dà agli agenti AI accesso al web in tempo reale tramite una rete di Beacon. Il Teneo Beacon è l'app di Teneo per Android, iOS, macOS, Windows e Linux, con una versione a riga di comando per server e Raspberry Pi. Condivide la banda che non usi dopo che hai accettato la sua schermata di consenso, e guadagna Teneo Protocol Points e Fragments mentre è online. I Fragments contano per le estrazioni stagionali pagate in USDC (la Beacon Drop). Teneo dice che il Beacon guadagna il doppio dei punti della sua vecchia estensione per browser. Guadagna un solo Beacon per ogni connessione internet. Gli altri dispositivi sulla stessa connessione restano in attesa. Registrati nell'Expedition Hub con il link referral o il codice PSA3BHPJ, poi accedi al Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "App di banda DePIN (Beacon) - Fragments per le estrazioni stagionali in USDC, +100 Fragments con un link referral"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Guadagna Teneo Points e Fragments. I Fragments contano per le estrazioni stagionali in USDC, quindi una stagione paga un premio, non una tariffa. Teneo dice che il Beacon guadagna il doppio dei punti dell'estensione per browser. Riscuoti il boost ogni 8 ore per avere fino a 3 volte i Fragments; se salti una finestra, il moltiplicatore scende."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Estrazione stagionale (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "I premi della Beacon Drop vengono pagati in USDC a un wallet che colleghi nell'Expedition Hub. L'Hub mostra quanti giorni hai per collegarne uno; un premio senza un wallet collegato in tempo va perso."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Collega un wallet nell'Expedition Hub prima che vengano pagati i premi di una stagione; l'Hub annulla un premio il cui wallet non è stato collegato in tempo."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% dei Fragments di ogni amico invitato e 2% dei Fragments dei suoi referral, quando l'amico si registra entro 7 giorni e guadagna 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments alla registrazione, e altri +150 quando raggiungi 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "Guadagna un solo Beacon per ogni connessione internet. Le macchine in data center guadagnano solo sui fornitori di hosting abilitati da Teneo, con la metà dei Fragments e senza punti né bonus referral. Le connessioni VPN non guadagnano mai."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "I Fragments del Beacon pagano USDC solo come premi nelle estrazioni stagionali, quindi eseguirlo non fa guadagnare un importo fisso."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo dice che i punti verranno consolidati in $AGENTIC, un token di ricompensa non trasferibile, non nel token $TENEO."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "A novembre 2026 non erano stati confermati data di lancio, assegnazione né procedura di riscossione di $TENEO, dopo che un obiettivo precedente, il secondo trimestre del 2026, era passato."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot non esegue Teneo: installi l'app Beacon del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo dice che il traffico arriva da clienti aziendali verificati e che blocca gli indirizzi privati e le porte soggette ad abusi, ma non dice come verifica quei clienti."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network è una rete decentralizzata consolidata per la distribuzione di video e il calcolo AI (dal 2018). Gli utenti eseguono Edge Node che condividono banda, archiviazione e potenza di calcolo. Ha importanti partnership per i contenuti. Guadagna token TFUEL.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "CDN decentralizzata + calcolo AI - ricompense in TFUEL, progetto consolidato"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Solo app desktop. I guadagni dipendono dalle risorse e dalla zona. Partnership importanti, quotato su tutti gli exchange."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Continuo"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot non esegue Theta Edge: usi l'app desktop del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "893de938ed14"
titan.description:
  text: "Titan Network è una piattaforma DePIN che condivide il tuo indirizzo IP, l'archiviazione e la banda in cambio di ricompense in token TNT. Disponibile su Windows, Mac e Android. I nodi contribuiscono a una CDN e a un livello di archiviazione decentralizzati. I guadagni tipici vanno da $5-30/mese a seconda delle risorse condivise e della posizione geografica.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN che condivide IP, archiviazione e banda - $5-30/mese"
  source: "799e68401067"
titan.earnings.notes:
  text: "Condivide IP, archiviazione e banda. I guadagni dipendono dalle risorse fornite e dalla regione. Più spazio di archiviazione assegnato dà ricompense più alte."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Per epoca"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "La stessa assistenza di Titan dice che un nodo attivo non garantisce guadagni: senza un'attività assegnata non guadagna nulla, e le ricompense sono nel token TNT."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot non esegue Titan: usi l'app o l'estensione del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer ti permette di monetizzare il tuo traffico internet condividendo la banda con aziende verificate. È uno dei pochi servizi di condivisione di banda che funziona bene su IP di VPS e data center oltre che su connessioni residenziali. Usa una semplice autenticazione con token passato tramite argomenti da riga di comando. Supporta le architetture ARM per Raspberry Pi e dispositivi simili.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Condivisione di banda - funziona su VPS, accesso con token"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Token"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Nome del dispositivo"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Accedi a <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, premi F12 → Application → Local Storage → fai clic su <code>https://app.traffmonetizer.io</code> → copia il valore di <code>authToken</code> (circa 54 caratteri: cifre, un <code>|</code>, poi lettere e cifre)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Nome mostrato nella dashboard per gestire il dispositivo"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "Gli IP di VPS e data center guadagnano meno di quelli residenziali. Le zone di USA e UE guadagnano di più. Più IP supportati tramite reti Docker."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Minimo $10. PayPal non è più disponibile. Prima salva un metodo di pagamento nel profilo: USDT su Solana o TON (commissioni più basse), Arbitrum (commissioni basse) o Tron TRC20 (commissioni di rete alte), oppure un bonifico bancario da $1.000. Il primo indirizzo che salvi vale subito; cambiarlo in seguito richiede una conferma via email. Prima del primo prelievo la dashboard può chiedere un contatto di messaggistica (WhatsApp, Telegram o Skype). Una richiesta paga solo dollari interi e i centesimi restano nel saldo."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT sulla chain salvata nelle impostazioni di pagamento del profilo (Solana, TON, Arbitrum o Tron), oppure un bonifico bancario. L'indirizzo si trova nelle impostazioni di Traffmonetizer, non nel container."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Accedi a <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, premi F12 → Application → Local Storage → valore di <b>authToken</b> (circa 54 caratteri: cifre, un <code>|</code>, poi lettere e cifre)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% di ogni pagamento che richiedono"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "I termini di servizio di Traffmonetizer richiedono un IP residenziale, ma in pratica i nodi su VPS vengono accettati."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Su Trustpilot ha un voto di 1.9; recensori dal 2023 a novembre 2026 segnalano pagamenti in sospeso per settimane, o segnati come completati senza una transazione corrispondente."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Gli stessi recensori segnalano che la chat dal vivo e l'assistenza via email non rispondono, a volte per settimane."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Solo criptovalute o un bonifico bancario da $1.000; PayPal non c'è più, e una richiesta paga solo dollari interi."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "I termini di Traffmonetizer richiedono un IP residenziale, quindi un server su una connessione di hosting ne è escluso."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Quattro recensori su Trustpilot dal 2023 al 2025 segnalano guadagni molto lenti, come un centesimo al giorno su quattro dispositivi, o quasi due anni per arrivare a $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Per un pagamento basta un indirizzo crypto salvato e confermato via email; la dashboard può chiedere un contatto di messaggistica."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer pubblica una propria immagine Docker, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Mina con la tua CPU e ricevi il pagamento nella moneta che scegli, come SHIB, DOGE o XMR. CashPilot esegue XMRig verso il pool RandomX di unMineable, e unMineable converte i Monero minati dalla tua CPU nella tua moneta. Paga il tuo indirizzo pubblico quando il saldo raggiunge la soglia di pagamento della moneta. Ogni worker che CashPilot distribuisce porta il codice referral unMineable di CashPilot, che abbassa la tua commissione della piattaforma dall'1% allo 0.75%. L'elettricità può costare più di quanto guadagni."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Mina con la tua CPU e ricevi il pagamento nella moneta che scegli"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "Moneta di pagamento"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "Indirizzo di pagamento"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "Nome del worker"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "Thread CPU massimi (%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "Modalità RandomX"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "Ticker di una moneta che unMineable paga, come SHIB, DOGE o XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "Il tuo indirizzo pubblico per quella moneta. Le monete che richiedono un memo o un tag non sono supportate."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Stima lorda prima dell'elettricità, pagata nella tua moneta al tasso di conversione di unMineable. Il 2026-11-25, 1 kH/s di RandomX valeva circa $1 al mese. Una CPU desktop a metà dei suoi thread può assorbire da 30 a 50 W in più. Controlla il tuo consumo reale e il prezzo dell'elettricità per capire se conviene."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "Fissato per ogni moneta da unMineable (0.03 XMR il 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Quando viene raggiunta la soglia di pagamento della moneta"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable paga il tuo indirizzo quando il saldo raggiunge la soglia di pagamento della moneta. Le soglie cambiano in base alla moneta e alla rete; CashPilot legge quella che unMineable riporta per il tuo indirizzo."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Il saldo è guadagnato ma non ricevuto finché unMineable non lo paga a questo indirizzo. La chain dipende dalla moneta che scegli."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "Lo stesso indirizzo di pagamento e lo stesso ticker della moneta con cui hai distribuito il miner, per esempio <b>XMR</b>. Inserisci solo l'indirizzo, senza moneta, nome del worker o codice referral. È pubblico e non dà accesso ad alcun fondo."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% delle ricompense di mining di ogni miner invitato"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Commissione della piattaforma ridotta dall'1% allo 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Questa macchina risulta su una connessione di hosting. Controlla i termini del tuo fornitore prima di minare. Alcuni fornitori, tra cui Hetzner Cloud, lo vietano. Controlla i tuoi costi reali dell'elettricità prima di fidarti di una stima di profitto."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable applica una commissione della piattaforma dell'1%. CashPilot aggiunge il suo codice referral (#awk6-j1z0) dopo ogni nome di worker, e questo abbassa la tua commissione allo 0.75%. unMineable poi paga al maintainer di CashPilot lo 0.25% delle tue ricompense di mining; tu tieni il 99.25%. Ogni moneta ha la sua soglia di pagamento, per esempio 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "calcolo"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "No. Il miner invia il lavoro al pool di unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "Il tuo indirizzo di pagamento, la moneta, il nome del worker, l'hashrate e l'indirizzo IP vanno a unMineable."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "Alcune reti e alcuni resolver DNS bloccano le connessioni ai pool di mining."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "Non serve un account. L'indirizzo e la moneta sono l'identità, e chiunque può leggerne le statistiche su unmineable.com."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "unMineable trattiene una commissione della piattaforma dello 0.75% con il codice referral e paga solo a partire dalla soglia di ogni moneta."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "Alcuni fornitori di hosting vietano il mining di criptovalute."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "L'elettricità in più può costare più delle monete guadagnate."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "Le statistiche dell'indirizzo, compreso il saldo, sono pubbliche per chiunque conosca l'indirizzo."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "Il miner invia hash al pool e non inoltra il traffico di nessun altro."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Puoi minare verso un indirizzo pubblico nella moneta che scegli senza creare un account."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock è una piattaforma DePIN (Decentralized Physical Infrastructure Network, rete decentralizzata di infrastrutture fisiche) che ti permette di guadagnare criptovalute condividendo la tua connessione internet. Fa parte del più ampio ecosistema Web3. Sono disponibili immagini Docker della community ma non un'immagine ufficiale. L'interfaccia principale è l'estensione per browser.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "Condivisione di internet DePIN - pagamenti in criptovalute, principalmente estensione per browser"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Guadagni in criptovalute/token. Nessuna immagine Docker ufficiale: il client principale è l'estensione per browser."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
uprock.cashout.notes:
  text: "Token UPT, prelevati su un wallet Solana da 250 UPT, con l'autenticazione a due fattori attiva. Si applica una commissione di prelievo."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "Il centro assistenza di UpRock dice che i prelievi sono in token UPT verso un wallet Solana, con un minimo di 250 UPT."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "Le ricompense sono token UPT; i recensori e una recensione di terzi dicono che il loro valore è molto basso."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot non esegue UpRock: usi l'app o l'estensione del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork è una rete decentralizzata di VPN e condivisione di banda. Guadagni fornendo banda come provider della community. Il binario del provider si autentica con l'email e la password del tuo account (il suo sottocomando auth-provide) e salva il JWT di sessione ottenuto nel volume dei dati. Immagine Docker ufficiale di BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "VPN/banda decentralizzata - accesso con email+password, sessione JWT nel volume"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "Email"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Password"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "L'email del tuo account URnetwork (quella con cui accedi a <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Per gli account creati con l'accesso Google/Apple bisogna prima impostare una password. Ti serve un account? Registrati con <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "La password del tuo account URnetwork (senza spazi). Viene usata per l'accesso auth-provide del provider; poi la sessione resta salvata nel volume dei dati."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Funziona su VPS e connessioni residenziali. Dal 2026-10-06 paga in SN25α (subnet 25 di Bittensor) per ogni epoca settimanale. Supporta la modalità proxy per configurazioni con più IP."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "Per epoca"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Imposta una coldkey Bittensor su ur.io/app/account/earnings (firmata con Talisman, TAO.com o un wallet WalletConnect), poi riscuoti ogni epoca conclusa. Una riscossione paga il gas in TAO da una chiave gas EVM. LE EPOCHE NON RISCOSSE SCADONO, e i vecchi pagamenti in USDC sono stati annullati quando nessun wallet era stato collegato entro 30 giorni."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB al giorno di dati UR gratuiti per ogni amico, fino a 20 amici (dati, non denaro)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB al giorno di dati UR gratuiti quando usi almeno 10 MiB tramite l'app in 2 giorni entro 90 giorni dall'iscrizione; altrimenti il referral termina"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Le epoche non riscosse scadono, e i vecchi pagamenti in USDC sono stati annullati per le reti senza un wallet collegato entro 30 giorni."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "Da ottobre 2026 le ricompense sono pagate in SN25α, un token di subnet di Bittensor, e ogni riscossione costa gas in TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork in passato si chiamava BringYour; il suo whitepaper archiviato porta il vecchio nome."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork pubblica il codice sorgente del suo client provider."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork pubblica una propria immagine Docker, bringyour/community-provider, e funziona su VPS e connessioni residenziali."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Per una riscossione basta un wallet Bittensor che controlli tu."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai è un marketplace cloud di GPU in cui noleggi la tua GPU NVIDIA a ricercatori e sviluppatori di AI/ML. È una piattaforma nativa per Docker in cui fissi i tuoi prezzi orari. Una RTX 3090 di solito guadagna $0.20-0.40/ora quando è noleggiata. Richiede una GPU NVIDIA con driver recenti e una connessione internet stabile. Le entrate dipendono molto dal modello di GPU, dalla strategia di prezzo e dalla domanda del mercato.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "Marketplace di GPU - fissi tu i prezzi, RTX 3090 ~$0.20-0.40/ora"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "Chiave API"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "Chiave API host di Vast.ai presa dalla dashboard"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/ora, RTX 4090 ~$0.40-0.80/ora quando è noleggiata. L'utilizzo varia. Richiede GPU NVIDIA, una macchina Linux, Docker e nvidia-container-toolkit. Fissi tu i prezzi."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Settimanale (il venerdì)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "I guadagni si accumulano nel saldo di Vast.ai. Preleva tramite Wise, PayPal o Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% di quanto spendono gli affittuari invitati, per tutta la vita del loro account, come crediti referral; fino al 75% si può prelevare da un account referral dedicato"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Un host guadagna solo mentre è noleggiato, e le cifre della stessa Vast per una GPU consumer dipendono dal tipo di noleggio e dal punteggio di affidabilità."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot non esegue Vast.ai: installi il software host di Vast sulla tua macchina con GPU, quindi CashPilot non può distribuirlo né aggiornarlo per te. Vast basa l'hosting su Docker su una macchina Linux."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Vast dice che la tariffa fissata da un host è quella che riceve, senza commissioni detratte."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "I pagamenti avvengono tramite Wise, PayPal o Stripe da un minimo di $20, fatturati ogni settimana; un saldo più piccolo passa alla settimana successiva."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter è una piattaforma di condivisione di banda disponibile su Windows, Mac, Linux e Android. Dichiara di pagare fino a $1/GB di banda condivisa, con una soglia minima di pagamento di $20. La piattaforma funziona in modo simile alle classiche app di condivisione di banda, facendo passare traffico legittimo dalle connessioni residenziali.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Condivisione di banda - dichiara fino a $1/GB, pagamento minimo $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Dichiara fino a $1/GB ma i guadagni reali sono più bassi. Pagamento minimo $20. I guadagni variano molto in base alla zona e alla domanda."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter non ha una dashboard web. Apri l'app desktop o per telefono di Wipter, accedi e richiedi lì il pagamento quando il saldo raggiunge $20. Wipter paga solo in USDT su BNB Smart Chain (BEP20), al wallet che imposti nella sezione Payments dell'app; non c'è l'opzione PayPal."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% dei loro guadagni dal traffico quando raggiungono il pagamento minimo, per tutti gli amici che inviti"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "Bonus di registrazione di $5"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot non esegue Wipter: usi l'app desktop o per telefono del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "fa32942c6b4f"
xmrig.description:
  text: "Mina Monero con la tua CPU. CashPilot esegue XMRig, e il pool che scegli paga Monero al tuo indirizzo pubblico di pagamento. XMRig usa l'1% del tempo di hashing per sostenere i suoi sviluppatori. L'elettricità può costare più degli XMR che guadagni."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "Mina Monero con la tua CPU e il pool che preferisci"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Indirizzo Monero"
  source: "a888ebb3ae9b"
xmrig.docker.env.POOL_URL.label:
  text: "Pool"
  source: "f13024272c38"
xmrig.docker.env.WORKER_NAME.label:
  text: "Nome del worker"
  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "Thread CPU massimi (%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "Modalità RandomX"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "Stima lorda prima dell'elettricità. Il 2026-11-25, 1 kH/s valeva circa $1 al mese al prezzo di XMR e alla difficoltà di rete osservati. Una CPU desktop a metà dei suoi thread può assorbire da 30 a 50 W in più. Controlla il tuo consumo reale e il prezzo dell'elettricità per capire se conviene."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, dopo averlo abbassato)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Quando viene raggiunta la soglia del pool"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "Il pool paga il tuo indirizzo Monero quando il tuo saldo raggiunge la soglia. Il pool conserva il saldo finché non ti paga."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Questa macchina risulta su una connessione di hosting. Controlla i termini del tuo fornitore prima di minare. Alcuni fornitori, tra cui Hetzner Cloud, lo vietano. Controlla i tuoi costi reali dell'elettricità prima di fidarti di una stima di profitto."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "MoneroOcean, il pool predefinito, applica una commissione di mining dello 0%. La soglia di pagamento predefinita è 0.3 XMR, e puoi abbassarla a 0.003 XMR. I pagamenti sotto i 4 XMR possono costare fino a 0.0004 XMR. Gli altri pool fissano le proprie tariffe e soglie."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "calcolo"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "No. Il miner invia il lavoro ai pool di mining."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Il tuo indirizzo Monero, il nome del worker e l'indirizzo IP vanno al pool."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "Alcune reti e alcuni resolver DNS bloccano le connessioni ai pool di mining."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "La maggior parte dei pool Monero ti identifica tramite il tuo indirizzo pubblico di pagamento."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Un pagamento richiede abbastanza XMR da raggiungere la soglia del tuo pool."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "Alcuni fornitori di hosting vietano il mining di criptovalute."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "L'elettricità in più può costare più degli XMR guadagnati."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "Il miner invia hash ai pool e non inoltra il traffico di nessun altro."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "Il miner è open source e l'immagine fissa una release upstream firmata."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Puoi minare con un indirizzo Monero pubblico senza identificarti per nome."
  source: "752cbb728aac"
