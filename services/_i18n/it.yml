helium.short_description:
  text: "Rete wireless decentralizzata - richiede hardware, token HNT"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "Richiede l'acquisto di hardware da $500+. Il ritorno sull'investimento è calato molto. C'è una procedura di approvazione per i nuovi operatori."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "Per epoca"
  source: "75743e03bad2"
helium.payout.notes:
