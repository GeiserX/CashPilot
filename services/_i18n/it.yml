honeygain.rating.cons.0.text:
  text: "I termini permettono a Honeygain di cancellare i guadagni che hanno raggiunto la soglia di $20 e non sono stati pagati entro 24 mesi, e di considerare scaduti i guadagni dopo sei mesi senza utilizzo."
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "Il minimo è $20, e i pagamenti PayPal passano per Tipalti, che addebita $2.02 per ogni pagamento."
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "I termini permettono a Honeygain di sospendere un account e trattenere o cancellare i guadagni che ritiene accumulati con l'inganno."
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "Prima del primo pagamento PayPal, Tipalti ti fa confermare un numero di cellulare via SMS e fornire nome, indirizzo e data di nascita."
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "I termini dicono che i clienti aziendali usano il traffico per raccogliere dati web pubblicamente disponibili, ma non nominano alcun cliente, e non puoi sapere quale cliente usa la tua connessione."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "Nelle risposte di Honeygain alle recensioni sui guadagni bassi si dice che i guadagni dipendono dalla domanda della rete e dalla zona; i recensori riferiscono di aver impiegato moltissimo tempo per raggiungere il minimo di $20."
  source: "634fb331e65b"
honeygain.rating.pros.0.text:
  text: "Honeygain pubblica una propria immagine Docker, honeygain/honeygain."
  source: "ea44bd3c855c"
honeygain.rating.pros.1.text:
  text: "I termini indicano il gestore, Honeygain UAB, registrata a Vilnius, in Lituania."
  source: "579a169fcf35"
honeygain.rating.pros.2.text:
