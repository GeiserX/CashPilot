ebesucher.short_description:
  text: "Surfbar per lo scambio di traffico - estensione per browser"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "Guadagni in punti BTP convertibili in EUR. Solo estensione per browser."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "Pagamento in euro tramite PayPal o bonifico bancario."
  source: "abf928e1d583"
ebesucher.payout.notes:
