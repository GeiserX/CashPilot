iproyal.docker.health_signals.0.means:
  text: "IPRoyal Pawns ha disattivato questo account."
  source: "a3a68b67f1aa"
iproyal.docker.health_signals.1.means:
  text: "Pawns vede un altro dispositivo attivo su questo indirizzo IP e ne paga solo uno per IP, quindi questa copia gira ma non condivide nulla e non guadagna nulla. Ferma ogni altra app Pawns su questo IP, che sia su un'altra macchina, un PC o un telefono. Se non ce ne sono, aspetta che Pawns rimuova il vecchio dispositivo, oppure chiedi all'assistenza di Pawns di liberarlo."
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "I guadagni dipendono dalla zona e dall'uso della banda. Gli IP residenziali di USA e UE guadagnano di più."
  source: "424261bf08d4"
iproyal.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "Minimo $5. Seleziona prima il tuo paese; i metodi dipendono da quello. Dalla Spagna (ottobre 2026): PayPal 4% con una commissione minima di $0.25, pagato tramite Tremendous, che ti invia via email un link dove inserire nome e indirizzo PayPal; USDT (BEP20, ERC20, TRC20) o USDC (BEP20, ERC20) con una commissione di rete di $1; Bitcoin con una commissione minima di $2; buoni regalo senza commissione. Il primo pagamento richiede una verifica una tantum del numero di telefono via SMS: la apre Withdraw, e il numero va inserito con il prefisso internazionale. Ogni pagamento poi chiede un codice inviato all'email del tuo account e viene controllato per un massimo di 72 ore prima dell'invio."
  source: "0430fae34eb5"
iproyal.payout.notes:
  text: "Saldo conservato da IPRoyal Pawns; prelevato su richiesta."
  source: "e11da90d5216"
iproyal.collector.credential_hint:
  text: "Usa l'email e la password del tuo account IPRoyal Pawns (le stesse di <a href='https://pawns.app' target='_blank'>pawns.app</a>)."
  source: "b9dcb3a01d17"
iproyal.referral.bonus.referrer:
  text: "$1 su ciascuno dei loro primi tre pagamenti, fino a $3, se ognuno arriva entro la sua finestra di 1-3 settimane"
  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "$1 su ciascuno dei tuoi primi tre pagamenti, fino a $3; se manchi una finestra di 1-3 settimane, il resto scade"
  source: "619d5960686c"
iproyal.rating.cons.0.text:
  text: "I termini dicono che un account può essere bloccato senza preavviso per abuso delle condizioni di prelievo o per account multipli, e che in quel caso i suoi guadagni potrebbero non essere pagati."
  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "I termini dicono che Pawns non consente server, VPN o servizi proxy per la condivisione del traffico, e un solo dispositivo per IP."
  source: "449c1cdf793f"
iproyal.rating.cons.2.text:
  text: "PayPal costa il 4% (almeno $0.25) tramite Tremendous, e ogni pagamento viene controllato per un massimo di 72 ore."
  source: "56449f2db6ce"
iproyal.rating.cons.3.text:
  text: "Il primo pagamento richiede una verifica del numero di telefono via SMS, e ogni pagamento un codice inviato via email."
  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "L'informativa sulla privacy indica il gestore, Pawns.App Ltd (società 16043795 in Inghilterra e Galles), che secondo Companies House è stata costituita il 28 ottobre 2024, meno di tre anni fa."
  source: "a7fcb7aea980"
iproyal.rating.cons.5.text:
  text: "I termini dicono che Pawns e i suoi clienti aziendali fanno passare traffico dal tuo dispositivo, e che non puoi sapere quale cliente lo usa."
  source: "ca979ac10720"
