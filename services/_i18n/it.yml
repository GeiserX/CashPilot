  source: "38c4a7764846"
packetstream.description:
  text: "PacketStream è un marketplace peer-to-peer di banda in cui puoi vendere la banda che non usi. Alimenta una rete di proxy residenziali usata per ricerche di mercato, monitoraggio SEO e verifica degli annunci pubblicitari. Configurazione Docker semplice: serve solo un CID (Client ID). Tieni presente che l'accesso protetto da CAPTCHA può rendere difficile la raccolta automatica dei guadagni.\n"
  source: "ee363f486228"
packetstream.short_description:
  text: "Condivisione di banda - configurazione semplice basata sul CID"
  source: "583d6cb0e210"
packetstream.docker.env.CID.label:
  text: "Client ID"
  source: "8726db013948"
packetstream.docker.env.CID.description:
  text: "Accedi a <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> → fai clic su Setup nella barra laterale → il tuo CID è mostrato nel comando Docker"
  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream rifiuta l'indirizzo IP di questa copia perché non residenziale, quindi non guadagna nulla. Eseguila su una macchina la cui connessione internet sia una linea domestica, oppure rimuovi questa copia."
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "PacketStream ha già un altro client su questo indirizzo IP, e ne paga solo uno per IP. Rimuovi questa copia, oppure l'altra che condivide il suo IP."
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "Paga $0.10/GB per la banda condivisa. I guadagni dipendono molto dalla domanda per la zona del tuo IP."
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "Su richiesta"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "Solo PayPal, minimo $5, con una commissione del 3% mostrata prima della conferma. Il primo prelievo salva la tua email PayPal; cambiarla in seguito richiede una conferma via email e un'attesa di 7 giorni, quindi controlla l'indirizzo prima di confermare. Le richieste vengono controllate e inviate entro 7 giorni; puoi annullarne una mentre è in attesa, e se ne può fare una nuova solo dopo che è stata pagata."
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "Saldo conservato da PacketStream; prelevato su richiesta."
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "Accedi a <a href='https://packetstream.io' target='_blank'>packetstream.io</a>, premi F12 → Application → Cookies, copia il valore del cookie <b>auth</b> (è un JWT)."
  source: "15bae9d455f5"
packetstream.referral.bonus.referrer:
  text: "20% dei loro guadagni dalla banda (bonus Packeter a tempo limitato)"
  source: "964a44bb9e65"
packetstream.referral.bonus.referee:
  text: "Credito bonus del 10% sul tuo primo deposito con carta o PayPal (clienti proxy)"
  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "Nel 2025 e 2026 alcuni recensori su Trustpilot segnalano pagamenti arrivati in ritardo o mai arrivati, e un utente di lunga data dice che i pagamenti hanno rallentato e poi si sono fermati; altri nel 2026 riferiscono di essere stati pagati."
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "Solo PayPal, con una commissione di prelievo del 3%; chi vive in paesi non serviti da PayPal non ha altri metodi."
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "I termini permettono a PacketStream di trattenere, stornare o invalidare i guadagni che collega a frodi, manipolazioni o attività vietate."
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
  text: "I termini dicono che i clienti proxy e la stessa PacketStream fanno passare traffico dalla tua connessione; non descrivono alcuna verifica degli acquirenti comuni."
  source: "fd4707690d2b"
packetstream.rating.cons.4.text:
