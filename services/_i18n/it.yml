  source: "70db8167d5bc"
passiveapp.description:
  text: "PassiveApp è una piattaforma DePIN che ti permette di guadagnare ricompense in criptovalute e PayPal condividendo banda e risorse di calcolo che non usi. In pratica solo Windows: la pagina di download dello stesso produttore indica Android, iOS e Linux come \"coming soon\", senza cambiamenti almeno da febbraio 2025, e non esiste una versione per macOS, nonostante i testi promozionali sullo stesso sito parlino di un supporto più ampio. Nessuna immagine Docker.\n"
