  source: "1d44e028b43d"
golem.description:
  text: "Golem Network è un marketplace di calcolo decentralizzato in cui condividi risorse CPU e GPU in cambio di token GLM. I fornitori eseguono l'agente Yagna, che gestisce l'esecuzione dei carichi di lavoro in ambienti isolati (sandbox). È uno dei progetti di calcolo decentralizzato più vecchi (fondato nel 2016). Supporta attività su CPU, rendering su GPU e calcolo generico. Pagamenti tramite Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Marketplace di calcolo decentralizzato - token GLM tramite l'agente Yagna"
  source: "88f817c25848"
golem.earnings.notes:
  text: "I guadagni dipendono dall'hardware, dai prezzi e dalla domanda di attività. I nodi solo CPU guadagnano meno. I nodi GPU guadagnano di più ma richiedono NVIDIA. Esegui l'agente provider Yagna (non un'immagine Docker). Pagamenti su Polygon in token GLM."
  source: "07287d437d51"
golem.payment.frequency:
  text: "A ogni attività completata"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "Si guadagnano token GLM. Configura il wallet di pagamento nella configurazione del provider."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Non ancora determinato: CashPilot non ha ancora verificato dove questo servizio conserva i tuoi guadagni."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot non esegue Golem: installi tu l'agente provider, quindi CashPilot non può distribuirlo né aggiornarlo per te. Golem documenta come eseguire il provider con una propria immagine Docker."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "L'agente provider, yagna, è open source con licenza GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Nessun account: imposti un wallet di pagamento nella configurazione del provider."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "La rete è attiva da circa dieci anni."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "L'informativa sulla privacy di Golem indica il gestore, Golem Factory GmbH a Zugo, in Svizzera."
  source: "bae79b651923"
grass.description:
  text: "Grass è una rete decentralizzata che ti permette di vendere la banda che non usi per dati di addestramento dell'AI. Funziona come estensione per browser e app desktop, e fa passare dalla tua connessione richieste di web scraping per costruire dataset strutturati. Con oltre 8.5M di utenti, è una delle più grandi reti DePIN di banda. Guadagna token GRASS sulla blockchain Solana.\n"
  source: "046951d812f9"
grass.short_description:
  text: "Condivisione di banda DePIN per dati AI - guadagna token GRASS"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Token di accesso"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Accedi a <a href=\"https://app.grass.io\">app.grass.io</a>, premi F12 → Application → Local Storage → fai clic su <code>https://app.grass.io</code> → copia il valore di <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Guadagna Grass Points convertibili in token GRASS tramite airdrop. Il valore reale in USD dipende dal prezzo del token. Serve l'estensione per browser o l'app desktop."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Airdrop per epoca"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Le ricompense arrivano come distribuzioni periodiche da riscuotere sulla dashboard di Grass. La distribuzione della Stage 2 (attività da ottobre 2024 a giugno 2026) è pagata in USDC: riscuotila su app.grass.io/dashboard entro il 22 gennaio 2027, o prima se tutte le assegnazioni vengono riscosse prima. Grass trattiene le ricompense non riscosse."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "Accumula PUNTI; GRASS si riscuote dalla dashboard di Grass durante gli airdrop periodici."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Accedi a <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, premi F12 → Application → Local Storage, copia il valore di <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% dei punti di attività dei referral diretti, 10% al secondo livello, 5% al terzo"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Riscuoti i tuoi USDC della Stage 2 di Grass"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Grass trattiene ogni assegnazione della Stage 2 non riscossa entro il 22 gen 2027, e la finestra può chiudersi prima, appena tutte le assegnazioni sono state riscosse."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Accedi su app.grass.io con l'account che hai usato nella Stage 2, attiva il Grass Wallet, apri la scheda Allocation e conferma. Riscuoti solo su app.grass.io. Nessun punto della Stage 2? Scegli Non fa per me."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Le ricompense arrivano solo con le stagioni di airdrop. Chi gestisce nodi da molto tempo ha riportato stime per la stagione 2 nell'ordine di poche unità o poche decine di dollari."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "Le ricompense della stagione 2 non riscosse entro il 22 gennaio 2027 sono perse per sempre."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "Il primo airdrop ha suscitato proteste per le ricompense basse per punto, diluite tra più di due milioni di utenti."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot non esegue Grass: usi l'app o l'estensione del fornitore, quindi CashPilot non può distribuirla né aggiornarla per te. I suoi termini non sono stati verificati per l'uso in container."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "Il primo airdrop ha raggiunto quasi 1.5 milioni di indirizzi che hanno riscosso."
  source: "a4c55e10affa"
helium.description:
  text: "Helium è una rete wireless decentralizzata consolidata. In origine erano hotspot LoRaWAN, ora si è estesa al 5G. Richiede hardware dedicato ($500+). Guadagna token HNT/MOBILE. Il ritorno sull'investimento è calato molto: in genere $4-8/mese.\n"
