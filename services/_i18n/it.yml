  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "Inserisci l'indirizzo pubblico completo di pagamento Kaspa che il tuo miner usa su HeroMiners. Includi il prefisso <b>kaspa:</b> e ometti il nome del worker.\n"
