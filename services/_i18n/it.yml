helium.rating.cons.0.text:
  text: "La HIP 149 ha eliminato le ricompense Proof-of-Coverage il 6 luglio 2026; ora gli hotspot IoT guadagnano solo per i dati che trasportano, e più di 114.000 di loro non ne hanno trasportato nessuno."
  source: "e05c0111696f"
helium.rating.cons.1.text:
