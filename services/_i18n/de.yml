ebesucher.short_description:
  text: "Traffic-Exchange-Surfbar - Browsererweiterung"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "Einnahmen in BTP-Punkten, die in EUR umgetauscht werden können. Nur Browsererweiterung."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
ebesucher.cashout.notes:
