flux.short_description:
  text: "Dezentrale Rechenleistung - erfordert einen Einsatz von FLUX-Token"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "Erfordert einen Einsatz von 1.000+ FLUX (~$50-500 je nach Kurs). Höhere Stufen brauchen mehr Sicherheiten, verdienen aber mehr."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "Block-Belohnungen"
  source: "590433237f8a"
flux.payout.notes:
