  source: "1d44e028b43d"
golem.description:
  text: "Golem Network ist ein dezentraler Marktplatz für Rechenleistung, auf dem du CPU- und GPU-Ressourcen gegen GLM-Token teilst. Anbieter betreiben den Yagna-Agenten, der die Ausführung der Workloads in abgeschotteten Umgebungen verwaltet. Eines der ältesten Projekte für dezentrale Rechenleistung (gegründet 2016). Unterstützt CPU-Aufgaben, GPU-Rendering und allgemeine Rechenleistung. Zahlungen über Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Dezentraler Marktplatz für Rechenleistung - GLM-Token über den Yagna-Agenten"
  source: "88f817c25848"
golem.earnings.notes:
  text: "Die Einnahmen hängen von Hardware, Preisgestaltung und Nachfrage nach Aufgaben ab. Nodes nur mit CPU verdienen weniger. GPU-Nodes verdienen mehr, brauchen aber NVIDIA. Betreibe den Yagna-Provider-Agenten (kein Docker-Image). Zahlungen auf Polygon in GLM-Token."
  source: "07287d437d51"
golem.payment.frequency:
  text: "Pro abgeschlossener Aufgabe"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "Es werden GLM-Token verdient. Lege die Auszahlungs-Wallet in der Provider-Einrichtung fest."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot betreibt Golem nicht: Du installierst den Provider-Agenten selbst, daher kann CashPilot ihn nicht für dich bereitstellen oder aktualisieren. Golem dokumentiert, wie man den Provider in seinem eigenen Docker-Image betreibt."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "Der Provider-Agent, yagna, ist Open Source unter der GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Kein Konto: Du legst eine Auszahlungs-Wallet in der Provider-Einrichtung fest."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
