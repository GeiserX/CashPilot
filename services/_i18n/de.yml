iproyal.docker.health_signals.0.means:
  text: "IPRoyal Pawns hat dieses Konto deaktiviert."
  source: "a3a68b67f1aa"
iproyal.docker.health_signals.1.means:
  text: "Pawns sieht ein anderes aktives Gerät mit dieser IP-Adresse und bezahlt nur eines pro IP. Diese Kopie läuft also, teilt aber nichts und verdient nichts. Stoppe jede andere Pawns-App mit dieser IP, auf einem anderen Rechner, einem PC oder einem Handy. Gibt es keine, warte, bis Pawns das alte Gerät entfernt, oder bitte den Pawns-Support, es freizugeben."
  source: "64e79b0e73b4"
iproyal.earnings.notes:
  text: "Die Einnahmen hängen vom Standort und von der Bandbreitennutzung ab. Residential-IPs aus den USA/der EU verdienen mehr."
  source: "424261bf08d4"
iproyal.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
iproyal.cashout.notes:
  text: "Minimum $5. Wähle zuerst dein Land; die Methoden hängen davon ab. Aus Spanien (Oktober 2026): PayPal 4% mit einer Mindestgebühr von $0.25, ausgezahlt über Tremendous, das dir per E-Mail einen Link schickt, unter dem du deinen Namen und deine PayPal-Adresse eingibst; USDT (BEP20, ERC20, TRC20) oder USDC (BEP20, ERC20) mit $1 Netzwerkgebühr; Bitcoin mit einer Mindestgebühr von $2; Gutscheine ohne Gebühr. Die erste Auszahlung erfordert eine einmalige SMS-Prüfung deiner Telefonnummer: Withdraw öffnet sie, und die Nummer wird mit Ländervorwahl eingegeben. Danach fragt jede Auszahlung nach einem Code, der an die E-Mail-Adresse deines Kontos gesendet wird, und wird bis zu 72 Stunden lang geprüft, bevor sie verschickt wird."
  source: "0430fae34eb5"
iproyal.payout.notes:
  text: "Das Guthaben hält IPRoyal Pawns; Abhebung auf Anfrage."
  source: "e11da90d5216"
iproyal.collector.credential_hint:
  text: "Verwende die E-Mail-Adresse und das Passwort deines IPRoyal-Pawns-Kontos (dieselben wie bei <a href='https://pawns.app' target='_blank'>pawns.app</a>)."
  source: "b9dcb3a01d17"
iproyal.referral.bonus.referrer:
  text: "$1 auf jede ihrer ersten drei Auszahlungen, bis zu $3, wenn jede innerhalb ihres Fensters von 1-3 Wochen erfolgt"
  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "$1 auf jede deiner ersten drei Auszahlungen, bis zu $3; verpasst du ein Fenster von 1-3 Wochen, verfällt der Rest"
  source: "619d5960686c"
iproyal.rating.cons.0.text:
  text: "Laut den Nutzungsbedingungen kann ein Konto bei Missbrauch der Auszahlungsbedingungen oder bei mehreren Konten ohne Vorankündigung gesperrt werden, und seine Einnahmen werden dann möglicherweise nicht ausgezahlt."
  source: "85027b205641"
iproyal.rating.cons.1.text:
  text: "Laut den Nutzungsbedingungen erlaubt Pawns keine Server, VPNs oder Proxy-Dienste zum Teilen von Datenverkehr und nur ein Gerät pro IP."
  source: "449c1cdf793f"
iproyal.rating.cons.2.text:
  text: "PayPal kostet 4% (mindestens $0.25) über Tremendous, und jede Auszahlung wird bis zu 72 Stunden lang geprüft."
  source: "56449f2db6ce"
iproyal.rating.cons.3.text:
  text: "Die erste Auszahlung erfordert eine SMS-Prüfung deiner Telefonnummer, und jede Auszahlung einen per E-Mail gesendeten Code."
  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "Die Datenschutzerklärung nennt den Betreiber, Pawns.App Ltd (Unternehmen 16043795 in England und Wales), das laut Companies House am 28. Oktober 2024 gegründet wurde, vor weniger als drei Jahren."
  source: "a7fcb7aea980"
iproyal.rating.cons.5.text:
  text: "Laut den Nutzungsbedingungen leiten Pawns und seine Geschäftskunden Datenverkehr über dein Gerät, und du kannst nicht feststellen, welcher Kunde es nutzt."
  source: "ca979ac10720"
iproyal.rating.pros.0.text:
  text: "Ein Minimum von $5, mit Gutscheinen ohne Gebühr."
  source: "0fa4f89bbd63"
