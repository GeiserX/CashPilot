  text: "Rechenleistung"
  source: "b04a12f6483e"
kryptex-pearl.disclosure.third_party_traffic:
  text: "Nein. KRig sendet Mining-Arbeit an Kryptex Pool."
  source: "c5718af09746"
kryptex-pearl.disclosure.data_collected:
  text: "Kryptex sieht die E-Mail-Adresse deines Kontos, den Worker-Namen, die Hashrate und die IP-Adresse."
  source: "0a932e1163a6"
kryptex-pearl.disclosure.isp_risk:
  text: "Manche Netzwerke und DNS-Resolver blockieren Verbindungen zu Mining-Pools."
  source: "6e2ea365730d"
kryptex-pearl.disclosure.account_rules:
  text: "Bestätige die E-Mail-Adresse deines Kryptex-Kontos, bevor du darauf minest."
  source: "1990183a5b00"
kryptex-pearl.rating.cons.0.text:
  text: "Kryptex kann inaktive Konten nach sechs Monaten sperren und nach einem Jahr löschen."
  source: "1a40d04b07ad"
kryptex-pearl.rating.cons.1.text:
  text: "Mindestbeträge und Gebühren für Abhebungen hängen von der Methode ab."
  source: "05d8f85527c7"
kryptex-pearl.rating.pros.0.text:
  text: "Die Lizenz von KRig erlaubt es, das Release herunterzuladen und aus Mining-Software heraus auszuführen."
  source: "c710f405be6f"
kryptex-pearl.rating.pros.1.text:
  text: "KRig verwendet einen veröffentlichten TLS-Endpunkt, um Pearl-Shares an Kryptex Pool zu senden."
  source: "fd21819f191a"
mysterium.description:
  text: "MystNodes (Mysterium Network) ist ein dezentrales VPN- und Proxy-Netzwerk auf Blockchain-Basis. Du verdienst MYST-Token, indem du einen Node betreibst, der Nutzern VPN-, Proxy- und Data-Scraping-Dienste anbietet. Benötigt die Capabilities NET_ADMIN, SETUID und SETGID sowie ein TUN-Gerät, das er in seinem eigenen Netzwerk-Namespace auf der abgesperrten Bridge für Verdienst-Apps nutzt. Enthält eine eingebaute Web-Oberfläche zur Node-Verwaltung. Funktioniert sowohl mit privaten Anschlüssen als auch mit VPS, aber der Empfehlungsbonus wird nur für Nodes mit Residential-IP gezahlt.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Dezentraler VPN-Node - blockchainbasiert, funktioniert auf VPS"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "WebUI-Adresse"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "UDP-Portbereich"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "Die Host-Adressen, unter denen die WebUI des Nodes (Port 4449) veröffentlicht wird. 127.0.0.1 hält sie auf diesem Rechner. Um sie über einen Reverse Proxy zu erreichen, füge die Adresse hinzu, mit der sich der Proxy verbindet, kommagetrennt ohne Leerzeichen: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "Die UDP-Ports, die der Node für VPN-Sitzungen nutzt, als start:end. Leite genau diesen Bereich in deinem Router weiter. Jede Sitzung belegt etwa zwei Ports, die standardmäßigen 30 tragen also etwa 15 Sitzungen gleichzeitig, mehr als ein Heim-Node bekommt. Ein breiterer Bereich behebt nichts und kostet mehr: Jeder veröffentlichte Port verlangsamt Start und Entfernen des Nodes (300 Ports brauchen etwa 12 s zum Starten), CashPilot akzeptiert höchstens 300, und mit dem standardmäßigen Userland-Proxy von Docker belegt jeder Port außerdem etwa 2.5 MB Arbeitsspeicher. Wenn alle Sitzungen fehlschlagen, ist das ein Router-Problem, nicht zu wenige Ports: siehe \"Routers that rewrite UDP source ports\" in der Mysterium-Anleitung. Bleib unter 32768: Die Ports 32768-60999 sind der ephemere Bereich von Linux, in dem jedes Programm auf dem Host kurzzeitig einen Port belegen kann, und ein belegter Port lässt den Start des Nodes fehlschlagen. Ein Node, der bereits einen Bereich hat, behält ihn."
  source: "530524e2e718"
mysterium.docker.critical_volumes.0.holds:
  text: "Keystore der Node-Identität. Wird er gelöscht, entsteht eine völlig neue Identität: Der Node verliert seinen Ruf und alle Einnahmen, die noch für die alte Identität gehalten werden."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "Der Node kann in seinem Container kein sudo ausführen, daher kann er weder seine VPN-Schnittstelle noch seine Firewall konfigurieren, und jede Sitzung scheitert bei der Einrichtung: Er wirkt online und verdient nichts. Der Container wurde ohne die Capabilities SETUID und SETGID erstellt. Aktualisiere CashPilot und den Worker, der diesen Node betreibt, und stelle Mysterium dann über das Dashboard neu bereit; die Node-Identität liegt in seinem Daten-Volume und bleibt erhalten."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "In den letzten 6 Stunden hat keine VPN-Sitzung diesen Node direkt erreicht. Jede ist auf Hole Punching zurückgefallen, und viele Käufer können sich auf diesem Weg nicht verbinden, daher verdient der Node weniger. Seine UDP-Ports sind aus dem Internet nicht erreichbar. Leite in deinem Router den UDP-Portbereich ${UDP_PORTS} (start:end, auf beiden Seiten derselbe Bereich) an ${HOST_ADDRESS} weiter. Die Meldung verschwindet von selbst, sobald sich eine Sitzung direkt verbindet."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Das Monitoring von Mysterium markiert den Node auf ${WORKER_NAME} als fehlgeschlagen, daher fehlt er in der Node-Liste, aus der die meisten Käufer wählen, selbst wenn seine eigene Prüfung sagt, dass jeder Port erreichbar ist. Stelle zuerst sicher, dass der Node /dev/net/tun und SETUID/SETGID hat, deren Fehlen ihn auf die gleiche Weise scheitern lässt: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Ist das vorhanden, ist eine häufige Ursache, dass der Router vor ${WORKER_NAME} den UDP-Quellport der Antworten des Nodes umschreibt, sobald ein Paket von außen diesen Port erreicht hat. Siehe den Test in der Anleitung: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "Die letzten fünf VPN-Sitzungen des Nodes auf ${WORKER_NAME} endeten jeweils nach etwa einer Minute, ohne Daten zu übertragen, daher verdient er nichts, obwohl er online wirkt. Die wahrscheinliche Ursache ist der Router vor ${WORKER_NAME}: Sobald ein Paket von außen einen Port erreicht, schreibt er den Quellport der späteren Antworten des Nodes von diesem Port um, und jede Sitzung beginnt mit einem solchen Paket (der eigenen Portprüfung des Nodes), also verwerfen Käufer die Antworten des Nodes. Ein breiterer Portbereich hilft nicht. Siehe den Test und die Lösungen in der Anleitung: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Die Meldung verschwindet, sobald eine Sitzung Daten überträgt."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Einnahmen in MYST-Token. Residential-IPs verdienen deutlich mehr. Die Node-WebUI zur Verwaltung läuft auf Port 4449 und ist standardmäßig nur auf dem Rechner veröffentlicht, auf dem sie läuft (127.0.0.1); öffne von einem anderen Rechner aus zuerst einen SSH-Tunnel (ssh -L 14449:127.0.0.1:4449 gefolgt von der Adresse des Rechners, auf dem der Node läuft, dann http://127.0.0.1:14449 im Browser aufrufen; der lokale Port 14449 kann nicht mit einem Node auf deinem eigenen Rechner kollidieren), oder füge eine Adresse zu UI_ADDRESS hinzu (siehe WebUI address in der Mysterium-Anleitung). VPS wird akzeptiert. Portweiterleitung für UDP 23000-23029 (der Standard von UDP_PORTS) wird dringend empfohlen -- ohne sie bekommen Nodes den Status Strict NAT, und viele VPN-Sitzungen scheitern, was die Einnahmen stark verringert. Wichtig: Lege nach dem ersten Start über die Node-WebUI oder die CLI deine Beneficiary-Wallet (Settlement-Wallet) passend zu deinem mystnodes.com-Konto fest -- das verknüpft die On-Chain-Einnahmen mit deinem Cloud-Dashboard."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Automatisches On-Chain-Settlement, sobald ein Node 5 MYST unabgerechnet hält"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Kein Knopf zu drücken. Jeder Node rechnet auf Polygon von selbst ab, sobald er 5 MYST unabgerechnet hält, und etwa 21% gehen für Gebühren drauf (die Hermes-Gebühr von 20% plus eine kleine Transaktionsgebühr), sodass pro Settlement ungefähr 3.9 MYST in der Beneficiary-Wallet ankommen. Die TequilAPI jedes Nodes listet seine Settlements unter /transactor/settle/history auf. Der Wert \"total earnings\" auf MystNodes umfasst nur die letzten 30 Tage; er ist weder ein Guthaben noch eine Gesamtsumme seit Beginn. Bonus-MYST aus dem MystNodes-Belohnungsprogramm wird nicht von selbst abgerechnet: Hol es auf der Seite Rewards ab, laut Hilfecenter von MystNodes innerhalb von 30 Tagen nach der Ausschüttung."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "Die Beneficiary-Wallet wird NACH dem Bereitstellen über TequilAPI oder die Node-WebUI festgelegt -- nicht über eine Umgebungsvariable, daher lässt sie sich nicht aus der Container-Spezifikation auslesen."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Verwende die E-Mail-Adresse und das Passwort deines MystNodes-Kontos (dieselben wie bei <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST pro Freund, dessen Node 5 MYST verdient (nur Residential-IPs)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST, sobald dein Node seine ersten 5 MYST verdient (Residential-IP, Node auf mystnodes.com beansprucht)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Hol die MystNodes-Belohnungen des letzten Monats ab"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Belohnungen, die nicht innerhalb von 30 Tagen nach der monatlichen Ausschüttung abgeholt werden, verfallen und gehen zurück in den Pool des nächsten Monats."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Öffne die Seite Rewards und tausche deine Punkte gegen MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Bandbreite. Dein Anschluss wird als Exit-Node für das Mysterium-Netzwerk genutzt, das VPN-, Proxy- UND Data-Scraping-Dienste verkauft. Scraping-Verkehr, der eine Residential-IP verlässt, ist die Nutzung, die am ehesten Beschwerden auslöst, und du kannst nicht wählen, welche der drei dein Node überträgt."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Ja. Fremde leiten ihren Datenverkehr über deine IP-Adresse — genau das ist das Produkt."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "Node-Identität (eine Blockchain-Adresse), deine IP und dein ungefährer Standort (Land/Stadt/Internetanbieter), die der Node im Netzwerk veröffentlicht, damit Käufer ihn auswählen können."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Real und es lohnt sich, das zu verstehen. Datenverkehr anderer Personen verlässt deinen Anschluss und wird dir zugeordnet, sodass alles, was sie tun, scheinbar von deinem Anschluss ausgeht. Viele Verträge von Internetanbietern für Privatkunden verbieten das. Prüfe deinen, bevor du es betreibst."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Unbegrenzt viele Geräte pro Konto und pro IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Etwa 21% jedes Settlements gehen für Gebühren drauf, die Hermes-Gebühr von 20% plus eine Transaktionsgebühr, und die Einnahmen werden im MYST-Token ausgezahlt."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Dein Node ist ein Exit für die VPN-, Proxy- und Data-Scraping-Kunden von Mysterium, und du kannst nicht wählen, welche davon er überträgt."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "Die Node-Software ist Open Source unter der GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium veröffentlicht ein eigenes Docker-Image, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "Das Settlement geht an eine Wallet, die dir gehört; keine Telefonnummer und kein Ausweis nötig."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "Das Node-Projekt läuft seit 2017."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Laut der Website von Mysterium wird das Netzwerk von der Blockdev AG, Zug, Schweiz, entwickelt."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay ist ein DePIN-Netzwerk, das Nutzer dafür belohnt, dass sie über eine Browsererweiterung Bandbreite teilen. Die Plattform liegt hinter einem Cloudflare-Schutz, der automatisierten Zugriff erschweren kann. Nutzer verdienen Nodepay Points, indem sie die Erweiterung aktiv halten. Das Netzwerk konzentriert sich auf Infrastruktur für KI-Trainingsdaten.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "DePIN-Bandbreite teilen für KI - Browsererweiterung"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Verdient Nodepay Points; die Punkte von Nutzern, die die Berechtigungsprüfungen von Nodepay bestehen, werden in den NC-Token umgewandelt. Der Cloudflare-Schutz kann die automatische Erfassung blockieren. Browsererweiterung erforderlich."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Airdrop des NC-Tokens (Zeitpunkt unbestätigt)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Punktebasiertes System. Die Punkte von Nutzern, die die Berechtigungsprüfungen von Nodepay bestehen, werden in den NC-Token umgewandelt, der im Januar 2025 gestartet ist."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "Bei der Prüfung der ersten Saison entfernte Nodepay mehr als 300.000 Konten, die es für Bots hielt, und strich 17 Milliarden Punkte."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Belohnungen sind Punkte, die in den NC-Token umgewandelt werden, ihr Wert hängt also am Token."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot betreibt Nodepay nicht: Du verwendest die eigene Browsererweiterung des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes ist die kostenlose Einstiegsstufe des Noderr Protocol, eines DeFi-Projekts auf Base L2. Ein Micronode ist ein kleiner Agent auf einem ungenutzten Android-Handy, einem Windows-PC, einem Mac oder in einem Chromium-Browser. Auf Android teilt er die Mobilfunkverbindung des Handys: Anderer Noderr-Datenverkehr verlässt das Netz über die Mobilfunk-IP des Handys, daher braucht er eine SIM-Karte mit mobilen Daten. Auf einem PC oder im Browser führt er mit ungenutzter Rechenleistung Automatisierungsaufgaben für das Protokoll aus. Belohnungen sollen in NODR ausgezahlt werden, gewichtet nach einem On-Chain-Wert für Betriebszeit und Zuverlässigkeit, aber das Netzwerk läuft während seiner Beta im Base-Sepolia-Testnet: Node-Belohnungen sind nicht finanziert, und bisher wurde nichts ausgezahlt.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Kostenloser Micronode (Android-Verbindung teilen, Windows, Mac, Browser) - Testnet, Belohnungen bisher nicht finanziert"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Testnet-Beta: Node-Belohnungen sind nicht finanziert, und bisher wurde nichts ausgezahlt. Die 5-10% APY auf der Website sind ein Planungsziel. Erneut prüfen, wenn das Netzwerk Base Sepolia verlässt."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Belohnungen sammeln sich in der eigenen Wallet des Nodes und werden in der App oder der dApp abgeholt. Während der Beta sind es Base-Sepolia-Testnet-Token ohne Marktwert."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "Die App erstellt die Node-Wallet beim ersten Start und prägt dafür ein kostenloses, nicht übertragbares (soulbound) Utility NFT. Sichere die Wallet aus der App heraus: Wenn du das Gerät verlierst, verlierst du die Node-Identität. Während der Beta liegen die Belohnungen auf Base Sepolia (Testnet)."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android braucht eine SIM-Karte mit mobilen Daten; für die Desktop- und Browser-Clients ist keine IP-Anforderung veröffentlicht."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Hängt vom Gerät ab. Ein Android-Handy verkauft seine Mobilfunkverbindung: Anderer Noderr-Datenverkehr verlässt das Netz über die Mobilfunk-IP-Adresse des Handys und wird auf das Datenvolumen angerechnet. Ein Windows-PC, ein Mac oder ein Browser verkauft ungenutzte Rechenleistung für das, was der Anbieter Automatisierungsaufgaben für soziale Medien und Inhalte nennt."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Ja. Auf Android verlässt anderer Noderr-Datenverkehr das Netz über die mobile IP-Adresse deines Handys; die App fragt vor dem Start nach einer aufgezeichneten Zustimmung, und du kannst das Teilen auf demselben Bildschirm beenden. Für die Windows-, Mac- und Browser-Clients beschreibt der Anbieter Automatisierungsaufgaben und sagt nicht, ob dabei Datenverkehr für andere Personen übertragen wird."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "Die Wallet-Adresse des Nodes sowie seine Zahlen zu Betriebszeit und erledigten Aufgaben werden als Reputationswert (der TrustFingerprint) on-chain gespeichert. Laut Anbieter werden Aufgaben anonymisiert und in einer Sandbox ausgeführt, und die Wallet-Schlüssel verlassen nie das Gerät. Genaueres ist nicht veröffentlicht."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Auf Android ist die geteilte Verbindung ein Mobilfunktarif: Die eigene Dokumentation des Anbieters warnt, dass das Teilen nach den Nutzungsrichtlinien mancher Mobilfunkanbieter nicht erlaubt sein könnte, und geteilter Datenverkehr verbraucht das Datenvolumen des Tarifs. Für die Desktop- und Browser-Clients sagt der Anbieter nichts zu den Bedingungen der Internetanbieter."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Ein Node pro Gerät, jeder mit seinem eigenen soulbound Utility NFT; mehrere Geräte zu betreiben ist erlaubt und erwünscht. Es ist kein Limit pro IP veröffentlicht. Es gibt kein Konto im üblichen Sinn: Die Identität ist eine Wallet, die die App beim ersten Start erzeugt."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Node-Belohnungen sind nicht finanzierte Testnet-Token ohne Marktwert, und es wurde nichts ausgezahlt; die 5 bis 10% APY auf der Website sind ein Planungsziel."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Für die Desktop- und Browser-Clients beschreibt Noderr Automatisierungsaufgaben und sagt nicht, ob dabei Datenverkehr anderer Personen übertragen wird."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Laut Anbieter werden Aufgaben anonymisiert und in einer Sandbox ausgeführt, aber er veröffentlicht nichts Genaueres."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Noch eine Testnet-Beta auf Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot betreibt Noderr nicht: Du verwendest die eigene App oder Erweiterung des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Kein Konto: Die App erzeugt beim ersten Start eine Wallet."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle nutzt das Bluetooth von Smartphones, um IoT-Infrastruktur aufzubauen. Die App erkennt passiv IoT-Geräte in der Nähe, leitet ihre Daten weiter und verdient dafür NODL-Token. Bekannt aus Forbes, Unternehmenspartnerschaften mit Vivendi und Hayden AI. Nur mobil (iOS und Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Bluetooth-IoT-Relay - mobile App, Belohnungen in NODL-Token"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Sehr geringe Einnahmen. Handy-App im Hintergrund, die Bluetooth nutzt. Die Wallet-Verbindung kann unzuverlässig sein."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Laufend"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL liegt in der eigenen Wallet der App auf ZKsync Era; prüfe es in der App oder in einem Block-Explorer für ZKsync Era. Nodle hat seine Polkadot-Parachain verlassen, und die Bridge von Polkadot zu ZKsync wurde am 31. Dezember 2025 geschlossen, sodass NODL, das noch auf der Polkadot-Seite liegt, nicht mehr zu ZKsync übertragen werden kann."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "Deine NODL liegen in der eigenen Wallet der Nodle-App auf ZKsync Era. CashPilot kann die Adresse dieser Wallet nicht sehen."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "Eine NODL-Belohnung für jeden neuen aktiven Nutzer, der über die Einladung beitritt (Nodle veröffentlicht den Betrag nicht)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Ein Rezensent berichtet von etwa $3 Einnahmen in drei bis vier Jahren; andere berichten, dass die täglichen Einnahmen stark gesunken sind."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot betreibt Nodle nicht: Du verwendest die eigene Handy-App des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana ist ein dezentraler Marktplatz für GPU-Rechenleistung auf Solana. Er bringt GPU-Besitzer mit der Nachfrage nach KI-Workloads zusammen und zahlt in NOS-Token. Eine RTX 3060 verdient etwa $0.048/Std. Die Plattform konzentriert sich auf KI-Inferenz-Workloads und nutzt die Solana-Blockchain für die Auftragsplanung und die Abrechnung der Zahlungen. Nodes führen containerisierte Workloads über die Nosana-CLI aus.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "GPU-Rechenleistung auf Solana - NOS-Token, RTX 3060 ~$0.048/Std."
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/Std., stärkere GPUs verdienen mehr. Die Einnahmen hängen von verfügbaren Aufträgen und vom GPU-Modell ab. Benötigt eine NVIDIA-GPU, Linux, Docker und die Nosana-CLI. Zahlungen im NOS-Token auf Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "Pro abgeschlossenem Auftrag"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Es werden NOS-Token auf Solana verdient. Auszahlung an die konfigurierte Wallet."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Nosana erzeugt standardmäßig eine Solana-Wallet, daher haben die meisten Nutzer ihre Adresse nie gesehen."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Jeder Host muss einen NOS-Einsatz sperren, dessen Höhe sich nach dem Stundenpreis seiner GPU richtet."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Hosts werden in NOS bezahlt, daher schwanken die Einnahmen in Dollar mit dem Token und mit der Nachfrage nach ihrer Karte."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot betreibt Nosana nicht: Du verwendest die eigene Host-Software des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN ist ein Bitcoin-Mining-Pool ohne Konto: Dein Miner meldet sich mit deiner Bitcoin-Adresse als Benutzernamen an, und der Pool zahlt an diese Adresse. CashPilot betreibt hier keinen Miner. Es liest das nicht ausgezahlte Guthaben aus, das OCEAN für deine Adresse hält, damit du neben deinen anderen Einnahmen siehst, was dein ASIC (ein Bitaxe, ein Antminer) verdient hat. Das nicht ausgezahlte Guthaben ist verdient, aber noch nicht erhalten: OCEAN zahlt es on-chain aus, sobald es die Auszahlungsschwelle überschreitet.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Bitcoin-Mining-Pool, verfolgt über deine Auszahlungsadresse"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Wenn ein Block dein Guthaben über die Schwelle bringt"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN zahlt on-chain an deine Adresse aus, sobald dein nicht ausgezahltes Guthaben die Schwelle erreicht. Lightning-Auszahlungen (optional, BOLT12) erkennt CashPilot nicht."
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "Nicht ausgezahlt heißt verdient, aber nicht erhalten, bis OCEAN es on-chain an diese Adresse auszahlt, außer du hast Lightning-Auszahlungen eingeschaltet."
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "Deine BTC-Auszahlungsadresse: der Benutzername, den dein Miner bei OCEAN verwendet, ohne den Teil <b>.workername</b>. Sie ist öffentlich und gibt keinen Zugriff auf Guthaben."
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "Benötigt einen Bitcoin-ASIC-Miner (einen Bitaxe, einen Antminer), der auf mine.ocean.xyz:3334 ausgerichtet ist"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "Rechenleistung"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
  text: "Nein. Dein Miner sendet Hashes an den Pool; niemand leitet Datenverkehr über deinen Anschluss."
  source: "7239118f749a"
ocean.disclosure.data_collected:
  text: "Deine Bitcoin-Adresse, die von dir gewählten Worker-Namen, deine Hashrate und die IP-Adresse deines Miners, wie der Pool sie sieht."
  source: "22282404721c"
ocean.disclosure.isp_risk:
  text: "Ein Miner hält eine Verbindung zum Pool offen und braucht wenig Bandbreite. Achten musst du auf die Stromkosten, nicht auf deinen Internetanbieter."
  source: "7bf5f9f6b028"
ocean.disclosure.account_rules:
  text: "Es gibt kein Konto. Die Adresse ist die Identität, und jeder kann ihre Statistiken auf ocean.xyz einsehen."
  source: "e3c8fd5863c1"
ocean.rating.cons.0.text:
  text: "Bezahlt wird nur in Bitcoin, und on-chain wird nichts ausgezahlt, bis dein Guthaben 0.01048576 BTC erreicht."
  source: "9c9981f2fbd5"
ocean.rating.cons.1.text:
  text: "Eine Pool-Gebühr von 2%, oder 1%, wenn du mit DATUM deine eigenen Block-Templates baust."
  source: "497f4f1ec62e"
ocean.rating.cons.2.text:
  text: "CashPilot betreibt keinen Miner für OCEAN: Du richtest deine eigene Hardware auf den Pool aus, und CashPilot liest nur das Guthaben aus."
  source: "eccc0b4b47ae"
ocean.rating.pros.0.text:
  text: "Kein Konto und keine Identitätsprüfung. OCEAN fragt nur nach der Bitcoin-Adresse, an die es zahlt."
  source: "38c4a7764846"
packetstream.description:
  text: "PacketStream ist ein Peer-to-Peer-Marktplatz für Bandbreite, auf dem du deine ungenutzte Bandbreite verkaufen kannst. Er betreibt ein Residential-Proxy-Netzwerk, das für Marktforschung, SEO-Überwachung und Werbeprüfung genutzt wird. Einfache Docker-Einrichtung, nur eine CID (Client ID) ist nötig. Beachte, dass die durch CAPTCHA geschützte Anmeldung die automatische Erfassung der Einnahmen erschweren kann.\n"
  source: "ee363f486228"
packetstream.short_description:
  text: "Bandbreite teilen - einfache Einrichtung per CID"
  source: "583d6cb0e210"
packetstream.docker.env.CID.label:
  text: "Client-ID"
  source: "8726db013948"
packetstream.docker.env.CID.description:
  text: "Melde dich bei <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> an → klicke in der Seitenleiste auf Setup → deine CID wird im Docker-Befehl angezeigt"
  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream lehnt die IP-Adresse dieser Kopie als nicht residential ab, daher verdient sie nichts. Betreibe sie auf einem Rechner, dessen Internetverbindung ein privater Heimanschluss ist, oder entferne diese Kopie."
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "PacketStream hat bereits einen anderen Client mit dieser IP-Adresse und zahlt nur einen pro IP. Entferne diese Kopie oder die andere, die sich die IP mit ihr teilt."
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "Zahlt $0.10/GB für geteilte Bandbreite. Die Einnahmen hängen stark von der Nachfrage nach dem Standort deiner IP ab."
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "Nur PayPal, Minimum $5, die Gebühr von 3% wird vor dem Bestätigen angezeigt. Die erste Abhebung speichert deine PayPal-E-Mail-Adresse; sie später zu ändern erfordert eine Bestätigung per E-Mail und 7 Tage Wartezeit, also prüfe die Adresse, bevor du bestätigst. Anfragen werden geprüft und innerhalb von 7 Tagen verschickt; du kannst eine stornieren, solange sie wartet, und eine neue kannst du erst stellen, wenn die vorherige ausgezahlt ist."
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "Das Guthaben hält PacketStream; Abhebung auf Anfrage."
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "Melde dich bei <a href='https://packetstream.io' target='_blank'>packetstream.io</a> an, drücke F12 → Application → Cookies und kopiere den Wert des Cookies <b>auth</b> (es ist ein JWT)."
  source: "15bae9d455f5"
packetstream.referral.bonus.referrer:
  text: "20% ihrer Einnahmen aus Bandbreite (zeitlich begrenzter Packeter-Bonus)"
  source: "964a44bb9e65"
packetstream.referral.bonus.referee:
  text: "10% Bonusguthaben auf deine erste Einzahlung per Karte oder PayPal (Proxy-Kunden)"
  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "Rezensenten auf Trustpilot berichten 2025 und 2026 von Auszahlungen, die spät oder gar nicht ankommen, und ein langjähriger Nutzer sagt, die Auszahlungen seien langsamer geworden und dann ausgeblieben; andere berichten 2026, dass sie bezahlt wurden."
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "Nur PayPal, mit einer Auszahlungsgebühr von 3%; Nutzer in Ländern, die PayPal nicht bedient, haben keine andere Methode."
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "Die Nutzungsbedingungen erlauben PacketStream, Einnahmen einzubehalten, zurückzubuchen oder für ungültig zu erklären, die es mit Betrug, Manipulation oder verbotenen Aktivitäten in Verbindung bringt."
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
  text: "Laut den Nutzungsbedingungen leiten Proxy-Kunden und PacketStream selbst Datenverkehr über deinen Anschluss; eine Prüfung gewöhnlicher Käufer beschreiben sie nicht."
  source: "fd4707690d2b"
packetstream.rating.cons.4.text:
  text: "Trustpilot vermerkt, dass PacketStream nicht auf negative Bewertungen geantwortet hat; Rezensenten berichten von unbeantworteten E-Mails."
  source: "4885bceb8df9"
packetstream.rating.pros.0.text:
  text: "PacketStream veröffentlicht ein eigenes Docker-Image, packetstream/psclient."
  source: "b358af0b3419"
packetstream.rating.pros.1.text:
  text: "Die Nutzungsbedingungen verlangen nur ein Gerät und einen Anschluss, die dir gehören oder die du nutzen darfst."
  source: "bde1b5ad5a6a"
packetstream.rating.pros.2.text:
  text: "Die Nutzungsbedingungen beschreiben keine Identitätsprüfung; eine Auszahlung braucht eine PayPal-Adresse."
  source: "a05886b55edc"
packetstream.rating.pros.3.text:
  text: "Die Nutzungsbedingungen nennen PacketStream Inc. nach kalifornischem Recht."
  source: "7966bde559dd"
packetstream.rating.pros.4.text:
  text: "PacketStream gibt es seit 2018."
  source: "70db8167d5bc"
passiveapp.description:
  text: "PassiveApp ist eine DePIN-Plattform, mit der du Krypto- und PayPal-Belohnungen verdienst, indem du ungenutzte Bandbreite und Rechenressourcen teilst. In der Praxis nur Windows: Die eigene Download-Seite des Herstellers führt Android, iOS und Linux seit mindestens Februar 2025 unverändert als \"coming soon\", und eine macOS-Version gibt es nicht — obwohl Werbetexte auf derselben Website eine breitere Unterstützung behaupten. Kein Docker-Image.\n"
  source: "e0f069b6b6e0"
passiveapp.short_description:
  text: "DePIN-Bandbreite/-Rechenleistung - nur Windows, Auszahlung in Krypto und per PayPal"
  source: "e23871afdcd9"
passiveapp.earnings.notes:
  text: "Nur Windows-Desktop-App (v1.0.x); Android/iOS/Linux kündigt der Hersteller seit Anfang 2025 als 'coming soon' an, erschienen sind sie nie. Kein offizielles Docker-Image."
  source: "57f5891e1772"
passiveapp.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
passiveapp.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
passiveapp.referral.bonus.referrer:
  text: "10% ihrer Einnahmen, lebenslang"
  source: "f0262d54b65c"
passiveapp.rating.cons.0.text:
  text: "CashPilot betreibt PassiveApp nicht: Du verwendest die eigene Desktop-App des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "2b27df807548"
passiveapp.rating.pros.0.text:
  text: "Die Website von PassiveApp nennt PayPal, Krypto und Gutscheine ab einem Minimum von $3."
  source: "5fb04eb0efdc"
proxybase.description:
  text: "ProxyBase ist eine Plattform zum Teilen von Bandbreite, die Nutzer in Kryptowährung dafür bezahlt, dass sie ihre ungenutzte Internetverbindung teilen. Du authentifizierst den Peer-Client mit einem Access Token aus deinem Dashboard. Residential-IPs verdienen am meisten, aber Rechenzentrums-IPs werden ebenfalls unterstützt. Offizielles Multi-Arch-Docker-Image (amd64/arm64/armv7).\n"
  source: "7a558682be11"
proxybase.short_description:
  text: "proxybase.org - Bandbreite teilen, Auszahlung in Krypto, Anmeldung per Access Token. Es wird keine Wallet erzeugt"
  source: "5224bb16fee4"
proxybase.docker.env.ID.label:
  text: "Access Token"
  source: "f9db72ced1ee"
proxybase.docker.env.NAME.label:
  text: "Gerätename"
  source: "6415f86bc24f"
proxybase.docker.env.ID.description:
  text: "Melde dich bei <a href=\"https://peer.proxybase.org/dashboard/login?referral=nXzS3c6iTO\">peer.proxybase.org/dashboard</a> an → kopiere deinen Access Token (wird auf der Setup-Seite im Docker-Befehl angezeigt)"
  source: "3571c2e99729"
proxybase.docker.env.NAME.description:
  text: "Ein beliebiger Name (ohne Leerzeichen), um dieses Gerät in deinem ProxyBase-Dashboard zu erkennen"
  source: "906ebedecbc7"
proxybase.docker.health_signals.0.means:
  text: "ProxyBase hat sein Relay seit mindestens einer halben Stunde nicht erreicht, daher verdient es nichts. Ein Neustart behebt das; bleibt es nach einem Neustart bestehen, prüfe, ob dieser Rechner das Internet erreicht."
  source: "cbe6b5ef771f"
proxybase.earnings.notes:
  text: "Auszahlungen in Krypto. Die Einnahmen hängen vom Standort und von der Bandbreitennutzung ab."
  source: "39229c292994"
proxybase.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
proxybase.cashout.notes:
  text: "Die Website nennt ein Minimum von $0.20, und eine Anfrage unter $1 ging im Oktober 2026 durch. Eine Anfrage hebt immer das gesamte Guthaben ab, als USDC auf Polygon, POL oder Litecoin, an eine Adresse, die du eingibst. ProxyBase übernimmt die Netzwerkgebühr."
  source: "940e2e26e26b"
proxybase.payout.notes:
  text: "Die Einnahmen sammeln sich im ProxyBase-KONTO an, zu dem der Access Token gehört, und werden auf Anfrage im Dashboard abgehoben. Der Peer-Client hält keine Wallet, und der Container speichert keinen Zustand -- docker.volumes ist leer. Nicht zu verwechseln mit proxybase-xyz (ProxyBase Markets, gleiche Organisation), das tatsächlich eine lokale Wallet erzeugt und sie als kritisches Volume angibt."
  source: "3b630846bb51"
proxybase.rating.cons.0.text:
  text: "ProxyBase schrieb im August 2025 selbst, dass es neu ist und noch nicht der Ort, um die Einnahmen zu maximieren."
  source: "9f5177f749d7"
proxybase.rating.cons.1.text:
  text: "ProxyBase hat 2026 die Peer-Clients gewechselt und das alte Backend abgeschaltet, sodass Container mit dem alten Image weiterliefen und nichts mehr verdienten."
  source: "452b38e35357"
proxybase.rating.cons.2.text:
  text: "Nur Krypto, als USDC auf Polygon, POL oder Litecoin, ohne Fiat-Methode. Das Minimum ist $0.20, und ProxyBase zahlt die Netzwerkgebühr."
  source: "2f15ff41b14c"
proxybase.rating.pros.0.text:
  text: "Unsere Abhebung von unter $1 ging im Oktober 2026 durch."
  source: "00e8781a2252"
proxybase.rating.pros.1.text:
  text: "Eine Abhebung braucht nur eine Adresse, die du in die Anfrage eingibst."
  source: "985d03ae1755"
proxybase.rating.pros.2.text:
  text: "ProxyBase veröffentlicht ein eigenes Image für den Peer-Client und unterstützt Rechenzentrums-IPs."
  source: "cf916eded5f1"
proxybase-xyz.description:
  text: "ProxyBase Markets ist ein SOCKS5-Proxy-Marktplatz für KI-Agenten. Verkäufer betreiben einen schlanken Rust-CLI-Daemon, der sich per WebSocket verbindet, um den Datenverkehr von Käufern über ihre Internetverbindung weiterzuleiten, und dafür pro verkauftem GB USDC auf Tempo Chain verdient. Unterstützt sowohl den direkten Modus (eigene Bandbreite) als auch den Upstream-Modus (externe Proxys weiterverkaufen), mit automatischer Wiederverbindung. Käufer kaufen Proxy-Sitzungen nach Land, Internetanbieter und Bandbreite. Zahlungen laufen über das Machine Payments Protocol (MPP) auf Tempo Chain. Der Empfehlungslink ist für Käufer: Ein Käufer, der die Konsole darüber öffnet, bekommt 10% extra auf seine erste Einzahlung.\n"
  source: "f130fd8beea7"
proxybase-xyz.short_description:
  text: "proxybase.xyz - SOCKS5-Marktplatz für KI-Agenten, Auszahlung in USDC. Erzeugt eine Wallet, deren Volume die einzige Kopie des Schlüssels enthält"
  source: "818327893d5b"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.label:
  text: "Backend-API-URL"
  source: "b5e52c6b16d5"
proxybase-xyz.docker.env.PROXYBASE_BACKEND.description:
  text: "Überschreibt die Backend-API-URL (Standard ist https://api.proxybase.xyz)"
  source: "c86a425db04b"
proxybase-xyz.docker.setup:
  text: "Der Container richtet sich beim ersten Start selbst ein: Er erzeugt eine secp256k1-Wallet (BIP-39), authentifiziert sich per ECDSA-Challenge-Response und beginnt im reinen Direktmodus, Bandbreite zu verkaufen. Der gesamte Zustand (Wallet, Sitzungstoken, Verkäuferkonfiguration) wird im Volume <code>proxybase-data</code> gespeichert. Schau beim ersten Start in die Container-Protokolle, um die Wallet-Adresse zu finden. Mit <code>--upstream</code> fügst du Wege zum Weiterverkauf externer Proxys hinzu.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "Die Schlüsseldatei der erzeugten Wallet. Dieses Volume IST das Geld: Es gibt keine Kopie auf einem Server, wer es löscht, vernichtet das Guthaben mit."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Die Einnahmen richten sich nach den verkauften GB zu Marktpreisen. VPS-/Rechenzentrums-IPs verdienen weniger als Residential-IPs. Der Multi-Upstream-Modus kann deine eigene Bandbreite mit externen Proxys kombinieren."
  source: "a18f27f3f0dd"
proxybase-xyz.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
proxybase-xyz.cashout.notes:
  text: "Sichere die Einnahmen mit <code>proxybase-cli seller payout create</code>, ausgezahlt als USDC auf Tempo Chain (Tempo MPP). Zahlt an jede EVM-Adresse, deren Schlüssel du besitzt (Tempo ist eine EVM-Chain), ohne dass du etwas signieren musst; füge das Tempo-Netzwerk zur Wallet hinzu, um die USDC zu sehen. Eine Wallet, die sie dann immer noch nicht anzeigt, braucht den Tempo-USDC-Token von Hand: Importiere ihn über die Vertragsadresse, die Proxybase angibt, und prüfe diese Adresse, bevor du dem Guthaben vertraust."
  source: "c3daffcb3fa4"
proxybase-xyz.payout.notes:
  text: "Der Client erzeugt beim ersten Start seine eigene Wallet."
  source: "e4a9ee1e1f5c"
proxybase-xyz.referral.bonus.referrer:
  text: "15% jeder Einzahlung eines geworbenen Käufers, als Guthaben für deine eigenen Proxy-Sitzungen"
  source: "572fc74d91cd"
proxybase-xyz.referral.bonus.referee:
  text: "+10% auf die erste Einzahlung eines Käufers"
  source: "6bae1a2e30d6"
proxybase-xyz.disclosure.sells:
  text: "Bandbreite, als SOCKS5-Proxy, der an Käufer auf dem ProxyBase-Marktplatz verkauft wird."
  source: "515b89c5bf43"
proxybase-xyz.disclosure.third_party_traffic:
  text: "Ja. Käufer leiten ihren Datenverkehr über deinen Anschluss — genau das wird verkauft."
  source: "4b867536efdb"
proxybase-xyz.disclosure.data_collected:
  text: "Eine auf deinem Rechner erzeugte Wallet-Adresse sowie die Menge des Datenverkehrs, den du weiterleitest."
  source: "1434152ba77c"
proxybase-xyz.disclosure.isp_risk:
  text: "Real, und es betrifft direkt Heimanschlüsse. Proxy-Verkehr unbekannter Käufer verlässt das Netz unter deiner IP, Missbrauchsbeschwerden landen also bei dir. Nichts in diesem Katalog beschränkt den Dienst auf Rechenzentrumsadressen, und Residential-IPs verdienen mehr, der Anreiz zeigt hier also in die falsche Richtung: Lies die Bedingungen deines Internetanbieters, bevor du ihn zu Hause betreibst."
  source: "686837157681"
proxybase-xyz.disclosure.account_rules:
  text: "unbekannt - der Anbieter veröffentlicht kein Gerätelimit pro Konto oder pro IP, und der Katalog gibt keines an."
  source: "761e9afbecd3"
proxybase-xyz.rating.cons.0.text:
  text: "Auszahlungen erfolgen in USDC auf Tempo Chain, an jede EVM-Adresse, deren Schlüssel du besitzt."
  source: "349f93fcfa2b"
proxybase-xyz.rating.cons.1.text:
  text: "Dein Anschluss wird als SOCKS5-Proxy an Käufer auf dem Marktplatz verkauft; wir haben keine Beschreibung gefunden, wie Käufer geprüft werden."
  source: "2dec55ca610f"
proxybase-xyz.rating.pros.0.text:
  text: "Die eigene Verdienstseite wirbt im Titel damit, dass kein KYC nötig ist, mit einer Auszahlung ab $1."
  source: "25b6dc3b4608"
proxybase-xyz.rating.pros.1.text:
  text: "ProxyBase veröffentlicht ein eigenes Client-Image und akzeptiert Rechenzentrumsanschlüsse."
  source: "ae81d006093f"
proxylite.description:
  text: "ProxyLite macht deinen Internetverkehr zu Geld, indem es Bandbreite mit geprüften Organisationen teilt. Funktioniert sowohl mit privaten Anschlüssen als auch mit VPS-/Rechenzentrumsanschlüssen. Einfache Einrichtung, nur eine User-ID aus dem Dashboard ist nötig. Bietet eine großzügige lebenslange Empfehlungsprovision von 15%.\n"
  source: "9d0fe8c60b32"
proxylite.short_description:
  text: "Bandbreite teilen - 15% lebenslange Empfehlungsprovision, funktioniert auf VPS"
  source: "25e7184f582e"
