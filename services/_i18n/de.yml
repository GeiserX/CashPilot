proxyrack.description:
  text: "Mit dem Peer-Programm von ProxyRack verdienst du, indem du deine Bandbreite als Teil seines Proxy-Netzwerks teilst. Jedes Gerät braucht eine eindeutige 64-stellige Hex-UUID und optional einen API-Schlüssel, um das Gerät automatisch zu registrieren. Funktioniert sowohl mit privaten Anschlüssen als auch mit VPS-/Rechenzentrumsanschlüssen. Das Dashboard liegt hinter Cloudflare, daher musst du den API-Schlüssel eventuell von Hand im Browser auslesen.\n"
  source: "16b74380bb2a"
proxyrack.short_description:
  text: "Bandbreite teilen - UUID pro Gerät, funktioniert auf VPS"
  source: "7c899dc1ba2d"
proxyrack.docker.env.UUID.label:
  text: "Geräte-UUID"
  source: "dff993a2511b"
proxyrack.docker.env.API_KEY.label:
  text: "API-Schlüssel"
  source: "23189d55f697"
proxyrack.docker.env.DEVICE_NAME.label:
  text: "Gerätename"
  source: "155106be1173"
proxyrack.docker.env.UUID.description:
  text: "Eindeutige 64-stellige Hex-ID pro Gerät. Erzeugen mit: cat /dev/urandom | tr -dc 'a-f0-9' | fold -w 64 | head -n 1"
  source: "5de5d7264318"
proxyrack.docker.env.API_KEY.description:
  text: "Melde dich bei <a href=\"https://peer.proxyrack.com\">peer.proxyrack.com</a> an → der API Key wird auf der Hauptseite des Dashboards angezeigt (registriert das Gerät automatisch, wenn angegeben). Noch kein Konto? Registriere dich über <a href=\"https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn\">peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>"
  source: "96df71a6ca26"
proxyrack.docker.env.DEVICE_NAME.description:
  text: "Anzeigename des Geräts im Dashboard"
  source: "df01af60b81c"
proxyrack.docker.health_signals.0.means:
  text: "Der ProxyRack-Client kann auf dieser Kopie nicht laufen, daher verdient sie nichts. Meist antwortet der Update-Server von ProxyRack nicht, und ohne ihn kann der Client nicht starten. Die Kopie versucht es alle 5 Minuten erneut und startet von selbst, sobald der Server antwortet. Du musst nichts reparieren."
  source: "0df8b8cfac10"
proxyrack.docker.health_signals.1.means:
  text: "Der ProxyRack-Client wurde beim Start dieser Kopie nicht heruntergeladen, weil der Update-Server von ProxyRack nicht erreichbar war. Die Kopie läuft daher, verdient aber nichts. CashPilot startet sie alle 6 Stunden neu, um es erneut zu versuchen. Stelle sie neu bereit, damit sie den eigenen Start von CashPilot bekommt, der den Client behält und es alle 5 Minuten von selbst erneut versucht."
  source: "0a2ee4b478b2"
proxyrack.device_link.steps:
  text: "Melde dich bei ProxyRack an, öffne Devices, wähle Add device und füge diese UUID ein. Solange das Gerät nicht in deinem Konto ist, verdient es für niemanden. Wenn du einen API-Schlüssel eingegeben hast, registriert sich der Container selbst: Prüfe, ob das Gerät dort aufgeführt ist."
  source: "54c4041903b5"
proxyrack.earnings.notes:
  text: "Residential-IPs verdienen mehr als Rechenzentrums-IPs. Das Dashboard hinter Cloudflare kann automatisierten Zugriff erschweren."
  source: "b6e36d751afd"
proxyrack.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
proxyrack.cashout.notes:
  text: "Beantrage die Auszahlung im Dashboard. ProxyRack prüft sie innerhalb von 72 Stunden, dann schickt dir Tremendous per E-Mail eine Prämie, die du als PayPal, Gutschein oder Banküberweisung einlösen kannst. Eine Krypto-Option gibt es nicht."
  source: "6201d57f50be"
proxyrack.payout.notes:
  text: "Das Guthaben hält ProxyRack; Abhebung auf Anfrage."
  source: "08371935705e"
proxyrack.collector.credential_hint:
  text: "Melde dich bei <a href='https://peer.proxyrack.com' target='_blank'>peer.proxyrack.com</a> an, drücke F12 → Network, suche eine beliebige API-Anfrage und kopiere den Wert des Headers <b>Api-Key</b>. Noch kein Konto? Registriere dich über <a href='https://peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn' target='_blank'>peer.proxyrack.com/ref/mpwiok3xlaxeycnn5znqlg7ipjeutxyxr6xl7vmn</a>."
  source: "8f7aa2aa70be"
proxyrack.requirements.note:
  text: "Proxyrack dokumentiert ein Limit von 500 Geräten pro KONTO und kein Limit pro IP. Rechenzentrums-IPs werden akzeptiert, aber auf einen niedrigeren Satz herabgestuft."
  source: "7825f1f0ee9e"
proxyrack.rating.cons.0.text:
  text: "Laut dem Hilfecenter von ProxyRack werden beim Entfernen eines Geräts dessen Einnahmen von deinem Konto abgezogen, und sie kommen nur zurück, wenn dasselbe Gerät wieder hinzugefügt wird."
  source: "72de83fdde0e"
proxyrack.rating.pros.0.text:
  text: "ProxyRack veröffentlicht ein eigenes Docker-Image, proxyrack/pop, und akzeptiert Rechenzentrums-IPs zu einem niedrigeren Satz."
  source: "278541f81053"
repocket.description:
  text: "Mit Repocket verdienst du passives Einkommen, indem du deine ungenutzte Internet-Bandbreite teilst. Residential-IPs verdienen am meisten; VPS-/Rechenzentrums-IPs werden zu niedrigeren Sätzen akzeptiert. Max. 5 Geräte und 5 aktive Sitzungen pro Konto. Der Docker-Container authentifiziert sich mit der E-Mail-Adresse deines Kontos und einem API-Schlüssel aus dem Repocket-Dashboard (nicht deinem Passwort).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Bandbreite teilen - max. 5 Geräte, Anmeldung per API-Schlüssel"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "E-Mail"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "API-Schlüssel (UUIDv4, nicht dein Passwort)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "Die E-Mail-Adresse deines Repocket-Kontos"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Dein Repocket-API-Schlüssel — melde dich bei <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> an und kopiere den API-Schlüssel, der auf der Seite bandwidth-earnings angezeigt wird (das ist NICHT das Passwort deines Kontos). Noch kein Konto? Registriere dich über <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "Residential-IPs verdienen mehr. VPS-/Rechenzentrums-IPs werden akzeptiert, aber zu niedrigeren Sätzen."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 nach der ersten Auszahlung)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket legt das Minimum pro Konto fest: im Oktober 2026 $4 vor der ersten Auszahlung und $2 danach, weit unter den $20, die es früher angegeben hat. Methoden: Tremendous (an deine E-Mail-Adresse) oder USDT auf Polygon. Jede Anfrage wird innerhalb von 2 Stunden über einen per E-Mail gesendeten Link bestätigt, und es kann immer nur eine Anfrage gleichzeitig offen sein. Im Oktober 2026 hat Repocket eine Tremendous-Anfrage mit \"Please, message support\" abgelehnt, während USDT auf Polygon durchging."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Das Guthaben hält Repocket; Abhebung auf Anfrage."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Verwende die E-Mail-Adresse und das Passwort deines Repocket-Kontos (dieselben wie bei <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Noch kein Konto? Registriere dich über <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2, sobald der Geworbene $7 verdient hat, danach 5% seiner Einnahmen, lebenslang"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "$2 Wallet-Bonus bei der Registrierung"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket dokumentiert ein Limit von fünf Geräten pro KONTO, veröffentlicht aber kein Gerätelimit pro IP. Die auf Bewertungsseiten wiederholte Angabe '2 Geräte pro IP' hat keine Quelle beim Anbieter, daher behauptet CashPilot sie nicht."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Lass ein Repocket-Gerät teilen oder heb dein Guthaben ab"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Nach 12 Monaten ohne Anmeldung, Auszahlung oder geteilte Bandbreite kann Repocket das nicht ausgezahlte Guthaben einbehalten."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Lass ein Gerät teilen, melde dich an oder heb ab. Wenn du Repocket nicht mehr nutzt, heb vorher ab."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Mehrere Rezensenten auf Trustpilot berichten von stornierten Auszahlungen und auf null zurückgesetzten Guthaben; einer sagt, der Support habe unregelmäßige Bandbreiteneinnahmen angeführt. Die Seite bewertet Repocket mit 2.7 und vermerkt, dass es nicht auf negative Bewertungen geantwortet hat."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Rezensenten berichten von abgelehnten Abhebungen und davon, ihrer Zahlung hinterherlaufen zu müssen."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Die Zahlungsrichtlinie von Repocket erlaubt, Einnahmen zurückzubuchen, zu stornieren oder dauerhaft einzubehalten, wann immer es sie für ungültig hält, und die nicht ausgezahlten Einnahmen eines inaktiven Kontos einzubehalten."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "Dieselbe Richtlinie erlaubt Repocket, Auszahlungsmethoden jederzeit ohne Vorankündigung hinzuzufügen, zu entfernen oder zu ersetzen; PayPal wurde entfernt."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Laut den Nutzungsbedingungen kann Repocket jederzeit eine Identitäts- oder Kontoprüfung verlangen, und die Berechtigung zur Auszahlung hängt davon ab."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Laut den Nutzungsbedingungen nutzen Repocket und seine Partner die Netzwerkkapazität, sie sagen aber nicht, wer die Partner sind oder wie sie geprüft werden."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot vermerkt, dass Repocket nicht auf negative Bewertungen geantwortet hat, und Rezensenten sagen, dass Nachrichten ignoriert werden."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "Die aktuellen Nutzungsbedingungen nennen Repocket Pte. Ltd. in Singapur; ältere Bedingungen nannten kein Unternehmen."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket veröffentlicht ein eigenes Docker-Image, repocket/repocket, und seine Nutzungsbedingungen erlauben Container, die dir gehören."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Das Minimum ist niedrig: $4 vor der ersten Auszahlung und $2 danach."
  source: "ff8121a15aeb"
salad.description:
  text: "Mit Salad.io teilst du deine GPU für verteilte KI-Workloads und verdienst Salad-Guthaben, das du gegen Gutscheine, Spiele oder Geld einlösen kannst. Nur Windows, mit einer nativen Desktop-Anwendung. Benötigt eine dedizierte GPU (NVIDIA oder AMD). Die Plattform leitet KI-Inferenz, Rendering und andere Rechenaufgaben an deinen Rechner, wenn er ungenutzt ist. Eine der benutzerfreundlicheren Plattformen zum Teilen von GPUs.\n"
  source: "09335baccea6"
salad.short_description:
  text: "GPU teilen für KI - nur Windows, Auszahlung als Gutschein oder Geld"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Die Einnahmen hängen vom GPU-Modell und von der verfügbaren Arbeit ab. RTX 3060 ~$1-3/Tag. Nur Windows. Native App, keine Docker-Unterstützung. Einlösbar gegen Gutscheine, Spiele oder PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal oder Gutscheine über den Salad-Shop."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Nur PayPal und Gutscheine, nie Krypto. Es gibt keine Wallet-Adresse, daher hat CashPilot kein On-Chain-Guthaben anzuzeigen."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Melde dich bei <a href='https://app.salad.io' target='_blank'>app.salad.io</a> an, drücke F12 → Application → Cookies und kopiere den Wert des Cookies <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Verdiene ein paar Salad Reward Points oder gib dein Guthaben aus"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Wenn ein Konto 12 Monate lang ununterbrochen keine Reward Points verdient, kann sein nicht eingelöstes Guthaben verfallen."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Lass die Salad-App laufen, bis sie etwas verdient, oder gib das gesamte Guthaben im Salad Storefront aus. Wenn du nur einen Teil ausgibst, beginnen die 12 Monate nicht neu."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot betreibt Salad nicht: Du verwendest die eigene Desktop-App des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Mehrere Rezensenten auf Trustpilot berichten im Oktober und November 2026, dass PayPal-Auszahlungen schnell ankommen, bei manchen mehr als einmal; ein Rezensent sagt im selben Zeitraum, dass wiederholte Auszahlungsversuche fehlgeschlagen sind."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel ist eine Layer-1-Blockchain auf Cosmos für dezentrales VPN. Node-Betreiber verkaufen Bandbreite an VPN-Nutzer mit flexibler Preisgestaltung (pro GB oder pro Stunde). Eine offizielle Anleitung für die Bereitstellung mit Docker ist verfügbar. Langjähriges Projekt mit aktiver Community.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "Dezentrales VPN auf Cosmos - Node-Betreiber verkaufen Bandbreite"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Betreiber legen ihre eigenen Preise pro GB oder pro Stunde fest. Die Einnahmen hängen von der Nachfrage der VPN-Nutzer in deiner Region ab."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Pro Sitzung"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Zahlungen erfolgen im P2P-Token, und 20% jeder Bandbreitenzahlung gehen an Staker statt an den Node-Host."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "Der Token wurde 2021 von SENT in DVPN und 2025 von DVPN in P2P umbenannt."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot betreibt Sentinel nicht: Du verwendest die eigene Node-Software des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel veröffentlicht den Quellcode seines Nodes unter einer eigenen Open-Source-Lizenz."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia ist ein dezentraler Marktplatz für Speicher, betrieben von der Sia Foundation (einer gemeinnützigen Organisation in der Schweiz), der seit 2015 läuft. Betreibe den offiziellen hostd-Node der Foundation, um ungenutzten Speicherplatz zu vermieten und Siacoin aus Speicher- und Bandbreitenverträgen zu verdienen. Du musst etwas Siacoin kaufen, bevor der Node verdienen kann: Hosts sperren für jeden Vertrag Sicherheiten und zahlen für jeden Speichernachweis eine Gebühr. Die Sicherheit kommt zurück, wenn ein Vertrag abgeschlossen ist, und wird vernichtet, wenn der Node offline geht oder Daten verliert. Er braucht also einen ständig laufenden Rechner (laut Sia mindestens 95% Betriebszeit). Die Einnahmen hängen davon ab, wie viele Daten Mieter tatsächlich speichern; Sia empfiehlt einen Speicherpreis von $1 pro TB und Monat, daher eignet es sich eher für Rechner mit großen freien Festplatten als für kleine VPS.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Speicher-Node der Sia Foundation - offizielles Docker-Image, verdient Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Seed-Phrase der Wallet"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Dashboard-Passwort"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Speicherverzeichnis"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "BIP-39-Seed-Phrase, die die Siacoin-Wallet des Hosts kontrolliert. Erzeuge eine mit `docker run --rm ghcr.io/siafoundation/hostd seed` und sichere sie -- sie ist der EINZIGE Weg an die Einnahmen"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Passwort für die hostd-Weboberfläche und die lokale API (BasicAuth). Eine beliebige lange Passphrase"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Host-Pfad auf deiner größten Festplatte, unter dem die Daten der Mieter gespeichert werden (z. B. /srv/sia). Braucht mindestens 256GB freien Platz"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Beim Bereitstellen erstellt CashPilot eine neue Wallet auf dem Rechner, auf dem der Node läuft, und zeigt ihre Seed-Phrase einmal an: Schreib sie auf. Wenn du eine Wallet verwenden willst, die du schon hast, füge stattdessen ihre Seed-Phrase ein. Schick nach dem Bereitstellen etwas Siacoin an die Wallet des Nodes für Sicherheiten und Gebühren, füge dann im Dashboard den Speicherordner (/storage) hinzu, lege die Preise fest und kündige den Host an.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "Die Seed-Phrase der Wallet (hostd.yml), die Wallet-Datenbank, die Host-Einstellungen und der Vertragsstatus. Geht es verloren, verliert der Node seine Identität und die Verfolgung der Vertragseinnahmen; die Seed-Phrase, die du aufgeschrieben hast, ist dann der einzige Weg, das Guthaben wiederherzustellen."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Gespeicherte Daten der Mieter. Gehen sie verloren, scheitern die Speichernachweise, und die für diese Verträge gesperrten Sicherheiten verfallen."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Hosts legen ihre eigenen Preise fest. Sia empfiehlt $1 pro gespeichertem TB und Monat und über $5 pro heruntergeladenem TB, und 3.9% jeder Vertragsauszahlung gehen an Siafund-Inhaber. Die Einnahmen steigen mit der Menge an Mieterdaten, die auf dem Node landen; sie beginnt bei null und wächst mit Betriebszeit und Preis. Sicherheiten (Sia schlägt das 2-Fache des Speicherpreises vor) werden pro Vertrag gesperrt und bei erfolgreichem Abschluss zurückgegeben.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Die Einnahmen sammeln sich in der eigenen Siacoin-Wallet des Hosts (über die Seed-Phrase kontrolliert). Tausche SC an einer Börse um und heb von dort auf dein Bankkonto oder deine Karte ab; eine Auszahlungsanfrage beim Anbieter gibt es nicht.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Das Guthaben liegt in der über die Seed-Phrase kontrollierten Sia-Wallet im Node. Die Seed-Phrase liegt nur im Daten-Volume von hostd auf dem Rechner, auf dem er läuft; CashPilot speichert sie nie. Die Phrase, die du beim Erstellen der Wallet aufschreibst, ist der einzige Weg zur Wiederherstellung.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Eine stabile öffentliche Adresse mit weitergeleiteten Ports 9981 (TCP, Konsens) und 9984 (TCP und UDP, Mieterverträge). Hosting im Rechenzentrum/auf VPS ist bei Sia üblich. Die Wallet braucht Siacoin, bevor der Node Verträge annehmen kann."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Speicherplatz und die Bandbreite, um ihn bereitzustellen."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Nein. Mieter speichern verschlüsselte Dateifragmente auf deiner Festplatte und holen sie wieder ab. Andere Personen leiten keinen beliebigen Datenverkehr über deine IP."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Deine Sia-Wallet-Adresse, der öffentliche Schlüssel des Hosts und die öffentliche IP:Port, die der Node ankündigt, damit Mieter ihn erreichen."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Dauerhafter Upload-/Download-Verkehr auf der Leitung, ähnlich wie bei jedem Speicherserver; kein anonymisierter Web-Datenverkehr Dritter wird dir zugeordnet."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Ohne Genehmigung: keine Registrierung, kein Konto. Sicherheiten werden vernichtet, wenn der Node Speichernachweise verpasst, weil er offline geht oder Daten verliert."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Die Einnahmen sind Siacoin in deiner eigenen Wallet: Es gibt keine Auszahlung auf ein Bankkonto, du verkaufst also selbst an einer Börse."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "Sicherheiten werden pro Vertrag gesperrt und vernichtet, wenn der Host Speichernachweise verpasst, weil er offline geht oder Daten verliert."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Nur etwa 30% des im Netzwerk angebotenen Speichers wird genutzt, ein neuer Host konkurriert also um wenig Nachfrage."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Mieter speichern verschlüsselte Dateifragmente, und niemand leitet Datenverkehr über deine IP, aber wir haben nicht gefunden, wo Sia sagt, wer die Mieter sind oder wie sie geprüft werden."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd wird seit 2022 offen von der Sia Foundation entwickelt."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd ist Open Source unter der MIT-Lizenz."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Die Sia Foundation veröffentlicht hostd als Container-Image."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Ohne Genehmigung: keine Registrierung, kein Konto."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide ist ein Dienst zum Teilen von Bandbreite, mit dem du ungenutzte Internet-Bandbreite zu Geld machst. Verwendet eine optionale Machine ID, um Geräte zu verfolgen. Verfügbar über Community-Docker-Images aus dem Projekt income-generator.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Bandbreite teilen - basiert auf einer Machine ID"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "Machine ID"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "Machine ID eines bereits registrierten Geräts (wird automatisch erzeugt, wenn leer)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Nur wenige Informationen verfügbar. Die Einnahmen hängen vom Standort ab."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
spide.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% ihrer Einnahmen"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "$5 Registrierungsbonus"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "Der Datenverkehr über eine öffentliche IP wird auf die Geräte aufgeteilt, die sie gemeinsam nutzen, ein zweites Gerät am selben Anschluss bringt also nichts."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot betreibt Spide nicht: Du verwendest die eigene App des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Mine Pearl, Zano oder Ravencoin mit einer NVIDIA-GPU. CashPilot lädt beim ersten Start das offizielle Release von SRBMiner-Multi herunter und prüft seine SHA-256. Der von dir gewählte Pool zahlt an deine öffentliche Auszahlungsadresse. SRBMiner-Multi behält 2% der Hashing-Zeit bei Pearl und 0.85% bei den anderen beiden ein. Der Strom kann mehr kosten als die Coins, die du verdienst."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Pearl und andere GPU-Coins auf einer NVIDIA-GPU minen"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Auszahlungsadresse"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "Worker-Name"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "Algorithmus"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "Pool (host:port)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "Pool-Verbindung verschlüsseln (TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "Deine öffentliche Pearl-Adresse (prl1...). Für Zano oder Ravencoin gib die Adresse dieser Coin und einen passenden Pool an."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash für Pearl, progpow_zano für Zano, kawpow für Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.earnings.notes:
  text: "Bruttoschätzung vor Stromkosten. Am 2026-11-25 schätzte hashrate.no für eine RTX 4070 mit etwa 142 W Leistungsaufnahme etwa $2.45 pro Tag bei Pearl. Wir haben das nicht gemessen. Pearl ist eine neue Coin, und ihr Preis und ihre Schwierigkeit ändern sich schnell. Prüfe die Leistungsaufnahme deiner GPU und deinen Strompreis, um zu sehen, ob es sich lohnt."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Wenn die Pool-Schwelle erreicht ist"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "Der Pool zahlt an deine Adresse, wenn dein Guthaben deine Schwelle erreicht. Bis dahin hält der Pool das Guthaben."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, eine NVIDIA-GPU und das NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Dieser Rechner meldet einen Hosting-Anschluss. Prüfe vor dem Mining die Nutzungsbedingungen deines Anbieters. Manche Anbieter, darunter Hetzner Cloud, verbieten es. Prüfe deine tatsächlichen Stromkosten, bevor du dich auf eine Gewinnschätzung verlässt."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "Die Miner-Gebühr von 2% gilt für pearlhash. Bei progpow_zano und kawpow behält SRBMiner-Multi 0.85% ein. HeroMiners, der Standard-Pool für Pearl, berechnet eine Pool-Gebühr von 1%. Er prüft Auszahlungen stündlich und zahlt ab 1 PRL. Andere Pools legen ihre eigenen Sätze und Schwellen fest."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "Rechenleistung"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "Nein. Der Miner sendet Arbeit an den Pool, den du wählst."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Deine Auszahlungsadresse, der Worker-Name und die IP-Adresse gehen an den Pool. Beim ersten Start wird der Miner von GitHub heruntergeladen."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Manche Netzwerke und DNS-Resolver blockieren Verbindungen zu Mining-Pools."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "Die meisten Pools erkennen dich an deiner öffentlichen Auszahlungsadresse."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "Der Miner behält 2% der Hashing-Zeit bei Pearl und 0.85% bei Zano und Ravencoin ein."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Manche Hosting-Anbieter verbieten das Mining von Kryptowährungen."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "Der Miner ist Closed Source, daher kann niemand außer seinem Entwickler prüfen, was er ausführt."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "Der Strom der GPU kann mehr kosten als die verdienten Coins, und der Preis von Pearl ändert sich schnell."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "Der Miner sendet Arbeit an den Pool und leitet keinen fremden Datenverkehr weiter."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Du kannst Pearl auf HeroMiners mit einer öffentlichen Adresse und ohne Konto minen."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj ist ein dezentrales Cloud-Speichernetzwerk, in dem du verdienst, indem du ungenutzten Speicherplatz vermietest. Betreibe den Storage Node über Docker und erhalte $1.35/TB gespeicherte Daten pro Monat plus $1/TB Egress (Sätze seit 1. September 2026). Auszahlungen erfolgen monatlich in USDC, einem an den US-Dollar gekoppelten Stablecoin, im Ethereum-Mainnet an eine Wallet, die du kontrollierst, sobald das Guthaben ein gebührenabhängiges Minimum überschreitet (bis zur Auszahlung im September 2026 im STORJ-Token). Benötigt mindestens 550GB verfügbaren Speicherplatz und eine stabile Internetverbindung. Kein Konto und keine Registrierung nötig -- Nodes brauchen seit Mitte 2025 keine Genehmigung. VORSICHT (Oktober 2026): Storj Labs hat am 26. Juli 2026 Insolvenz nach Chapter 11 beantragt (US Bankruptcy Court, Northern District of West Virginia, Verfahren 5:26-bk-00512), um Altschulden umzustrukturieren. Das Netzwerk läuft weiter und Storj bezahlt aktive Nodes weiterhin, aber Node-Einnahmen aus der Zeit vor dem Antrag sind eingefroren, bis das Gericht darüber entscheidet. Der STORJ-Token liegt etwa 98% unter seinem Höchststand von 2021. Binance hat ihn am 3. September 2026 delistet, und Coinbase hat den Handel damit am 28. September 2026 ausgesetzt. Ein neuer Node behält in seinen ersten neun Monaten einen Teil seiner Einnahmen ein und füllt sich nur so schnell, wie die Kundennachfrage es zulässt. Wer jetzt einen startet, bindet also eine lange Amortisationszeit an ein Unternehmen in der Restrukturierung, das noch abgewickelt werden könnte.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Dezentraler Speicher-Node - $1.35/TB gespeichert + $1/TB Egress"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Wallet-Adresse"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "E-Mail"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "Externe Adresse"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Zugewiesener Speicher"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Identitätsverzeichnis"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Speicherverzeichnis"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Ethereum-Wallet-Adresse für USDC-Auszahlungen (z. B. 0x1234...abcd). Muss eine selbstverwahrte Wallet sein (MetaMask, Ledger usw.) -- verwende nie die Adresse einer Börse"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "E-Mail-Adresse für Benachrichtigungen an den Betreiber"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "DDNS-Hostname mit Port (z. B. mynode.ddns.net:28967) -- einer festen IP klar vorzuziehen, denn mit einer festen IP ist der Node an dem Tag nicht mehr erreichbar, an dem dein Internetanbieter sie stillschweigend neu vergibt. Port 28967 muss weitergeleitet sein (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Maximaler Speicherplatz, der zugewiesen wird (z. B. 2TB). Verwende Festplatten (HDD), keine SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Host-Pfad, unter dem die Identitätsdateien gespeichert sind (muss ca.cert, ca.key, identity.cert, identity.key enthalten)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Host-Pfad auf einer Festplatte (HDD) für die Storj-Daten. Braucht mindestens 550GB freien Platz"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Initialisiere vor dem ersten Start die Konfiguration des Storage Node: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Node-Identität. Ihre ID ist an einen Proof-of-Work gebunden, die Neuerzeugung dauert Stunden, und sie lässt sich nicht aus einer Sicherung von etwas anderem wiederherstellen. Geht sie verloren, verfällt das einbehaltene Auszahlungsguthaben."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Gespeicherte Kundendaten und der einbehaltene Betrag des Nodes. Gehen sie verloren, wird der Node disqualifiziert und das einbehaltene Guthaben verfällt."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Das Storj-Netzwerk kann deinen Node unter seiner angegebenen ADDRESS nicht zurückrufen, daher zählen die Satelliten ihn als offline: Es kommen keine neuen Daten mehr an, die Egress-Einnahmen stocken, und längere Offline-Zeit führt zur Sperrung. Prüfe, ob ADDRESS zu deiner AKTUELLEN öffentlichen IP passt (verwende einen DDNS-Hostnamen, keine feste IP, damit eine Neuvergabe durch den Internetanbieter den Node nicht abschneidet) und ob Port 28967 TCP+UDP an diesen Rechner weitergeleitet ist."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB gespeichert + $1/TB Egress + $1/TB Audit/Reparatur seit 1. September 2026. Die Einnahmen steigen mit der gespeicherten Datenmenge und dem Alter des Nodes. In den ersten 9 Monaten werden 75%, dann 50%, dann 25% der Einnahmen einbehalten; die Hälfte des einbehaltenen Betrags kommt im 16. Monat zurück, der Rest beim geordneten Ausstieg (Graceful Exit). Port 28967 muss weitergeleitet sein."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "Das 4-Fache der Ethereum-Transaktionsgebühr, kleinere Guthaben werden übertragen"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Monatlich"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Monatliche Auszahlung in USDC im Ethereum-Mainnet, sobald das Wallet-Guthaben mindestens das Vierfache der aktuellen Transaktionsgebühr beträgt; kleinere Guthaben werden in den nächsten Monat übertragen. Bis zur Auszahlung im September 2026 im STORJ-Token. Dashboard auf Port 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Monatliche Auszahlung in USDC im Ethereum-Mainnet an die Adresse in WALLET, sobald das Guthaben das gebührenabhängige Minimum überschreitet. Bis zur Auszahlung im September 2026 im STORJ-Token; Auszahlungen über zkSync Era endeten am 1. September 2026."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "Die URL des Node-Dashboards auf Port 14002, mit der LAN-IP des Servers statt localhost, zum Beispiel <b>http://192.168.1.10:14002</b>. Bei mehreren Nodes gib ihre URLs kommagetrennt an: CashPilot zählt sie zusammen."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Storj-Nodes im selben /24-Subnetz teilen sich die Datenzuteilung, was die Einnahmen pro Node verringert."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps Upload"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Speicherplatz und die Bandbreite, um ihn bereitzustellen."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Nein. Du speicherst verschlüsselte, per Erasure Coding aufgeteilte Fragmente von Kundendaten. Andere Personen leiten ihren eigenen Datenverkehr nicht über deine IP."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "Node-Identität, deine Wallet-Adresse, die E-Mail-Adresse, die der Node für Benachrichtigungen an den Betreiber verlangt, sowie deine IP und dein Port, die erreichbar sein müssen, damit der Node Daten bereitstellen kann."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "Vor allem eine Frage des Datenvolumens, weniger der Haftung: Ein Node liefert und empfängt ständig Kundendaten, was echten dauerhaften Datenverkehr auf deiner Leitung bedeutet. Anders als bei einem Proxy oder einem Relay ist es aber kein anonymisierter Datenverkehr Dritter, der dir als Ursprung zugeordnet wird, daher zieht er nicht die Missbrauchsbeschwerden an, die diese anziehen."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Unbegrenzt viele Nodes, aber Nodes im selben /24-Subnetz teilen sich die Zuteilung, mehrere an einem Anschluss verdienen also jeweils weniger."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk berichtete am 27. Juli 2026, dass Storj Labs Gläubigerschutz nach Chapter 11 beantragt hatte."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Zahlungen an Node-Betreiber aus der Zeit vor dem Antrag sind in das Verfahren für Insolvenzforderungen eingegangen."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "Bei einem neuen Node werden in den ersten neun Monaten 75%, dann 50%, dann 25% seiner Einnahmen einbehalten; die Hälfte kommt im 16. Monat zurück, der Rest nur beim geordneten Ausstieg (Graceful Exit)."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Kunden speichern verschlüsselte Dateifragmente, und niemand leitet Datenverkehr über deine IP, aber wir haben nicht gefunden, wo Storj sagt, wer die Kunden sind oder wie sie geprüft werden."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "Die Software des Storage Node ist Open Source unter der AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj veröffentlicht ein eigenes Docker-Image, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Kein Konto: eine Wallet-Adresse und eine E-Mail-Adresse für Hinweise an den Betreiber."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Aktive Nodes wurden nach dem Antrag weiter bezahlt."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR ist ein Monero-Mining-Pool ohne Konto: Dein Miner meldet sich mit deiner Monero-Adresse als Benutzernamen an, und der Pool zahlt an diese Adresse. CashPilot betreibt hier keinen Miner. Es liest das Guthaben aus, das SupportXMR für deine Adresse hält, damit du neben deinen anderen Einnahmen siehst, was dein CPU-Miner verdient hat. Das Guthaben ist verdient, aber noch nicht erhalten: Der Pool zahlt es aus, sobald es deine Auszahlungsschwelle überschreitet.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Monero-Mining-Pool, verfolgt über deine Auszahlungsadresse"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (automatisch), 0.01 XMR auf Anfrage"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Wenn dein Guthaben deine Schwelle überschreitet, oder auf Anfrage"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR zahlt an deine Adresse aus, sobald das Guthaben deine Schwelle erreicht (standardmäßig 0.1 XMR). Auf seiner Website kannst du außerdem ab 0.01 XMR eine sofortige Auszahlung beantragen, gegen eine Gebühr von 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Das Guthaben ist verdient, aber nicht erhalten, bis SupportXMR es an diese Adresse auszahlt. Monero-Guthaben lassen sich ohne privaten View Key nicht on-chain auslesen, und CashPilot fragt nie danach, daher bestätigst du jede Auszahlung selbst."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Deine Monero-Auszahlungsadresse: der Benutzername, den dein Miner bei SupportXMR verwendet, ohne einen Teil <b>.workername</b> oder <b>+difficulty</b>. Sie ist öffentlich und gibt keinen Zugriff auf Guthaben."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Benötigt einen Monero-Miner (XMRig), der auf pool.supportxmr.com ausgerichtet ist"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "Rechenleistung"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Nein. Dein Miner sendet Hashes an den Pool; niemand leitet Datenverkehr über deinen Anschluss."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Deine Monero-Adresse, die von dir gewählten Worker-Namen, deine Hashrate und die IP-Adresse deines Miners, wie der Pool sie sieht."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Ein Miner hält eine Verbindung zum Pool offen und braucht wenig Bandbreite. Achten musst du auf die Stromkosten, nicht auf deinen Internetanbieter."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Es gibt kein Konto. Die Adresse ist die Identität, und jeder kann ihre Statistiken auf supportxmr.com einsehen."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Bezahlt wird nur in Monero, mit einer Pool-Gebühr von 0.6% und einer Standardschwelle von 0.1 XMR vor einer automatischen Auszahlung."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot betreibt keinen Miner für SupportXMR: Du richtest deinen eigenen Miner auf den Pool aus, und CashPilot liest nur das Guthaben aus."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol gibt KI-Agenten über ein Netzwerk von Beacons Zugriff auf das Live-Web. Der Teneo Beacon ist Teneos eigene App für Android, iOS, macOS, Windows und Linux, mit einer Kommandozeilenversion für Server und einen Raspberry Pi. Er teilt deine ungenutzte Bandbreite, nachdem du seinem Zustimmungsbildschirm zugestimmt hast, und verdient Teneo Protocol Points und Fragments, solange er online ist. Fragments zählen für saisonale Verlosungen, die in USDC ausgezahlt werden (der Beacon Drop). Laut Teneo verdient der Beacon doppelt so viele Punkte wie die ältere Browsererweiterung. Pro Internetanschluss verdient ein Beacon. Andere Geräte am selben Anschluss stehen in Bereitschaft. Registriere dich im Expedition Hub mit dem Empfehlungslink oder dem Code PSA3BHPJ und melde dich dann im Beacon an.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "DePIN-Bandbreiten-App (Beacon) - Fragments für saisonale USDC-Verlosungen, +100 Fragments mit einem Empfehlungslink"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Verdient Teneo Points und Fragments. Fragments zählen für saisonale USDC-Verlosungen, eine Saison zahlt also einen Preis aus, keinen festen Satz. Laut Teneo verdient der Beacon doppelt so viele Punkte wie die Browsererweiterung. Hol alle 8 Stunden den Boost ab, um bis zu 3x Fragments zu bekommen; ein verpasstes Zeitfenster senkt den Multiplikator."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Saisonale Verlosung (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Preise aus dem Beacon Drop werden in USDC an eine Wallet ausgezahlt, die du im Expedition Hub verknüpfst. Der Hub zeigt, wie viele Tage du dafür Zeit hast; ein Preis, für den nicht rechtzeitig eine Wallet verknüpft wurde, verfällt."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Verknüpfe im Expedition Hub eine Wallet, bevor die Preise einer Saison ausgezahlt werden; der Hub lässt einen Preis verfallen, dessen Wallet nicht rechtzeitig verknüpft ist."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% der Fragments jedes geworbenen Freundes und 2% der Fragments von dessen Empfehlungen, sobald sich der Freund innerhalb von 7 Tagen registriert und 480 Fragments verdient"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments bei der Registrierung und weitere +150, sobald du 480 Fragments erreichst"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "Pro Internetanschluss verdient ein Beacon. Rechenzentrumsrechner verdienen nur bei Hosting-Anbietern, die Teneo freigeschaltet hat, mit halben Fragments und ohne Punkte oder Empfehlungsbonus. VPN-Verbindungen verdienen nie."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Die Fragments des Beacons zahlen USDC nur als Preise in saisonalen Verlosungen, der Betrieb bringt also keinen festen Betrag."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Laut Teneo werden Punkte in $AGENTIC zusammengeführt, einen nicht übertragbaren Belohnungstoken, nicht in den $TENEO-Token."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "Bis November 2026 waren weder ein Startdatum für $TENEO noch eine Zuteilung oder ein Abholverfahren bestätigt, nachdem ein früheres Ziel im zweiten Quartal 2026 verstrichen war."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot betreibt Teneo nicht: Du installierst die eigene Beacon-App des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Laut Teneo kommt der Datenverkehr von geprüften Geschäftskunden, und private Adressen sowie missbrauchsanfällige Ports werden blockiert, aber Teneo sagt nicht, wie es diese Kunden prüft."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network ist ein etabliertes dezentrales Netzwerk für Videoauslieferung und KI-Rechenleistung (seit 2018). Nutzer betreiben Edge Nodes, die Bandbreite, Speicher und Rechenleistung teilen. Große Content-Partnerschaften. Verdient TFUEL-Token.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "Dezentrales CDN + KI-Rechenleistung - TFUEL-Belohnungen, etabliertes Projekt"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Nur Desktop-App. Die Einnahmen hängen von Ressourcen und Standort ab. Große Partnerschaften, an allen Börsen gelistet."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Laufend"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot betreibt Theta Edge nicht: Du verwendest die eigene Desktop-App des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "893de938ed14"
titan.description:
  text: "Titan Network ist eine DePIN-Plattform, die deine IP-Adresse, deinen Speicher und deine Bandbreite gegen Belohnungen in TNT-Token teilt. Verfügbar für Windows, Mac und Android. Nodes tragen zu einem dezentralen CDN und einer Speicherschicht bei. Typische Einnahmen liegen bei $5-30/Monat, je nach geteilten Ressourcen und geografischem Standort.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN teilt IP, Speicher, Bandbreite - $5-30/Monat"
  source: "799e68401067"
titan.earnings.notes:
  text: "Teilt IP, Speicher und Bandbreite. Die Einnahmen hängen von den bereitgestellten Ressourcen und der Region ab. Mehr zugewiesener Speicher bringt höhere Belohnungen."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Pro Epoche"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Laut Titans eigener Hilfe garantiert ein laufender Node keine Einnahmen: Ohne zugewiesene Aufgabe verdient er nichts, und die Belohnungen gibt es im TNT-Token."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot betreibt Titan nicht: Du verwendest die eigene App oder Erweiterung des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Mit Traffmonetizer machst du deinen Internetverkehr zu Geld, indem du Bandbreite mit geprüften Unternehmen teilst. Einer der wenigen Dienste zum Teilen von Bandbreite, die neben privaten Anschlüssen auch gut mit VPS- und Rechenzentrums-IPs funktionieren. Verwendet eine einfache tokenbasierte Authentifizierung, die über Kommandozeilenargumente übergeben wird. Unterstützt ARM-Architekturen für Raspberry Pi und ähnliche Geräte.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Bandbreite teilen - funktioniert auf VPS, Anmeldung per Token"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Token"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Gerätename"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Melde dich bei <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a> an, drücke F12 → Application → Local Storage → klicke auf <code>https://app.traffmonetizer.io</code> → kopiere den Wert von <code>authToken</code> (etwa 54 Zeichen: Ziffern, ein <code>|</code>, dann Buchstaben und Ziffern)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Name, der im Dashboard zur Geräteverwaltung angezeigt wird"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "VPS- und Rechenzentrums-IPs verdienen weniger als Residential-IPs. Standorte in den USA/der EU verdienen mehr. Mehrere IPs werden über Docker-Netzwerke unterstützt."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Minimum $10. PayPal wird nicht mehr angeboten. Speichere zuerst eine Auszahlungsmethode im Profil: USDT auf Solana oder TON (niedrigste Gebühren), Arbitrum (niedrige Gebühren) oder Tron TRC20 (hohe Netzwerkgebühren), oder eine Banküberweisung ab $1.000. Die erste Adresse, die du speicherst, gilt sofort; sie später zu ändern erfordert eine Bestätigung per E-Mail. Das Dashboard kann vor der ersten Abhebung nach einem Messenger-Kontakt fragen (WhatsApp, Telegram oder Skype). Eine Anfrage zahlt ganze Dollar aus, die Cents bleiben im Guthaben."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT auf der Chain, die in den Auszahlungseinstellungen des Profils gespeichert ist (Solana, TON, Arbitrum oder Tron), oder eine Banküberweisung. Die Adresse liegt in den Einstellungen von Traffmonetizer, nicht im Container."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Melde dich bei <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a> an, drücke F12 → Application → Local Storage → Wert von <b>authToken</b> (etwa 54 Zeichen: Ziffern, ein <code>|</code>, dann Buchstaben und Ziffern)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% jeder Auszahlung, die sie beantragen"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Die Nutzungsbedingungen von Traffmonetizer verlangen eine Residential-IP, in der Praxis werden aber VPS-Nodes akzeptiert."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot bewertet es mit 1.9; Rezensenten berichten von 2023 bis November 2026 von Auszahlungen, die wochenlang ausstehen oder als abgeschlossen markiert sind, ohne dass eine passende Transaktion existiert."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Dieselben Rezensenten berichten, dass Live-Chat und E-Mail-Support nicht antworten, manchmal wochenlang."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Nur Krypto oder eine Banküberweisung ab $1.000; PayPal gibt es nicht mehr, und eine Anfrage zahlt nur ganze Dollar aus."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Die Nutzungsbedingungen von Traffmonetizer verlangen eine Residential-IP, ein Server mit Hosting-Anschluss fällt also nicht darunter."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Vier Rezensenten auf Trustpilot berichten von 2023 bis 2025 von sehr langsamen Einnahmen, etwa einem Cent pro Tag mit vier Geräten oder fast zwei Jahren bis zu $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Eine Auszahlung braucht nur eine gespeicherte Krypto-Adresse, die per E-Mail bestätigt wurde; das Dashboard kann nach einem Messenger-Kontakt fragen."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer veröffentlicht ein eigenes Docker-Image, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Mine mit deiner CPU und lass dich in der Coin bezahlen, die du wählst, etwa SHIB, DOGE oder XMR. CashPilot betreibt XMRig mit dem RandomX-Pool von unMineable, und unMineable wandelt das Monero, das deine CPU mint, in deine Coin um. Es zahlt an deine öffentliche Adresse, sobald dein Guthaben die Zahlungsschwelle der Coin erreicht. Jeder Worker, den CashPilot bereitstellt, trägt den unMineable-Empfehlungscode von CashPilot, der deine Plattformgebühr von 1% auf 0.75% senkt. Der Strom kann mehr kosten, als du verdienst."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Mit deiner CPU minen und in der Coin deiner Wahl bezahlt werden"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "Auszahlungs-Coin"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "Auszahlungsadresse"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "Worker-Name"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "Max. CPU-Threads (%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "RandomX-Modus"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "Ticker einer Coin, in der unMineable zahlt, etwa SHIB, DOGE oder XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "Deine öffentliche Adresse für diese Coin. Coins, die ein Memo oder einen Tag brauchen, werden nicht unterstützt."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Bruttoschätzung vor Stromkosten, ausgezahlt in deiner Coin zum Umrechnungskurs von unMineable. Am 2026-11-25 war 1 kH/s RandomX etwa $1 pro Monat wert. Eine Desktop-CPU mit der Hälfte ihrer Threads kann 30 bis 50 W zusätzlich verbrauchen. Prüfe deinen tatsächlichen Verbrauch und deinen Strompreis, um zu sehen, ob es sich lohnt."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "Von unMineable pro Coin festgelegt (0.03 XMR am 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Wenn die Zahlungsschwelle der Coin erreicht ist"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable zahlt an deine Adresse, sobald dein Guthaben die Zahlungsschwelle der Coin erreicht. Die Schwellen unterscheiden sich je nach Coin und Netzwerk; CashPilot liest die Schwelle aus, die unMineable für deine Adresse meldet."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Das Guthaben ist verdient, aber nicht erhalten, bis unMineable es an diese Adresse auszahlt. Die Chain hängt von der Coin ab, die du wählst."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "Dieselbe Auszahlungsadresse und derselbe Coin-Ticker, mit denen du den Miner bereitgestellt hast, zum Beispiel <b>XMR</b>. Gib nur die Adresse ein, ohne Coin, Worker-Namen oder Empfehlungscode. Sie ist öffentlich und gibt keinen Zugriff auf Guthaben."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% der Mining-Belohnungen jedes geworbenen Miners"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Plattformgebühr von 1% auf 0.75% gesenkt"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Dieser Rechner meldet einen Hosting-Anschluss. Prüfe vor dem Mining die Nutzungsbedingungen deines Anbieters. Manche Anbieter, darunter Hetzner Cloud, verbieten es. Prüfe deine tatsächlichen Stromkosten, bevor du dich auf eine Gewinnschätzung verlässt."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable berechnet eine Plattformgebühr von 1%. CashPilot hängt seinen Empfehlungscode (#awk6-j1z0) an jeden Worker-Namen an, was deine Gebühr auf 0.75% senkt. unMineable zahlt dann dem Maintainer von CashPilot 0.25% deiner Mining-Belohnungen; du behältst 99.25%. Jede Coin hat ihre eigene Zahlungsschwelle, zum Beispiel 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "Rechenleistung"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "Nein. Der Miner sendet Arbeit an den Pool von unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "Deine Auszahlungsadresse, Coin, Worker-Name, Hashrate und IP-Adresse gehen an unMineable."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "Manche Netzwerke und DNS-Resolver blockieren Verbindungen zu Mining-Pools."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "Es ist kein Konto nötig. Adresse und Coin sind die Identität, und jeder kann ihre Statistiken auf unmineable.com einsehen."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "unMineable behält mit dem Empfehlungscode eine Plattformgebühr von 0.75% ein und zahlt erst ab der Schwelle der jeweiligen Coin aus."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "Manche Hosting-Anbieter verbieten das Mining von Kryptowährungen."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "Der zusätzliche Strom kann mehr kosten als die verdienten Coins."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "Die Statistiken einer Adresse, einschließlich des Guthabens, sind für jeden öffentlich, der die Adresse kennt."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "Der Miner sendet Hashes an den Pool und leitet keinen fremden Datenverkehr weiter."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Du kannst ohne Konto an eine öffentliche Adresse in der Coin deiner Wahl minen."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock ist eine DePIN-Plattform (Decentralized Physical Infrastructure Network), mit der du Kryptowährung verdienst, indem du deine Internetverbindung teilst. Teil des breiteren Web3-Ökosystems. Community-Docker-Images sind verfügbar, aber kein offizielles Image. Die Browsererweiterung ist die wichtigste Oberfläche.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "DePIN-Internet teilen - Auszahlung in Krypto, hauptsächlich Browsererweiterung"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Einnahmen in Krypto/Token. Kein offizielles Docker-Image — die Browsererweiterung ist der wichtigste Client."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
uprock.cashout.notes:
  text: "UPT-Token, abgehoben an eine Solana-Wallet ab 250 UPT, mit eingeschalteter Zwei-Faktor-Authentifizierung. Es fällt eine Abhebungsgebühr an."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "Laut dem Hilfecenter von UpRock erfolgen Abhebungen in UPT-Token an eine Solana-Wallet, mit einem Minimum von 250 UPT."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "Belohnungen sind UPT-Token; Rezensenten und ein unabhängiger Testbericht sagen, dass ihr Wert sehr gering ist."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot betreibt UpRock nicht: Du verwendest die eigene App oder Erweiterung des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork ist ein dezentrales Netzwerk für VPN und das Teilen von Bandbreite. Du verdienst, indem du als Community-Provider Bandbreite bereitstellst. Das Provider-Programm authentifiziert sich selbst mit der E-Mail-Adresse und dem Passwort deines Kontos (über seinen Unterbefehl auth-provide) und speichert das daraus entstehende Sitzungs-JWT im Daten-Volume. Offizielles Docker-Image von BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "Dezentrales VPN/Bandbreite - Anmeldung per E-Mail+Passwort, JWT-Sitzung im Volume"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "E-Mail"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Passwort"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "Die E-Mail-Adresse deines URnetwork-Kontos (die Anmeldung, die du auf <a href=\"https://ur.io\" target=\"_blank\">ur.io</a> verwendest). Für Konten, die über die Anmeldung mit Google/Apple erstellt wurden, musst du zuerst ein Passwort festlegen. Noch kein Konto? Registriere dich über <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "Das Passwort deines URnetwork-Kontos (ohne Leerzeichen). Wird für die Anmeldung über auth-provide des Providers verwendet; die Sitzung bleibt danach im Daten-Volume gespeichert."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Funktioniert auf VPS und an privaten Anschlüssen. Seit 2026-10-06 Auszahlung in SN25α (Bittensor-Subnetz 25) pro wöchentlicher Epoche. Unterstützt einen Proxy-Modus für Setups mit mehreren IPs."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "Pro Epoche"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Lege auf ur.io/app/account/earnings einen Bittensor-Coldkey fest (signiert mit Talisman, TAO.com oder einer WalletConnect-Wallet) und hol dann jede abgeschlossene Epoche ab. Eine Abholung bezahlt Gas in TAO über einen EVM-Gas-Key. NICHT ABGEHOLTE EPOCHEN VERFALLEN, und die alten USDC-Auszahlungen wurden storniert, wenn nicht innerhalb von 30 Tagen eine Wallet verknüpft wurde."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB pro Tag kostenlose UR-Daten pro Freund, bis zu 20 Freunde (Daten, kein Geld)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB pro Tag kostenlose UR-Daten, sobald du innerhalb von 90 Tagen nach dem Beitritt an 2 Tagen mindestens 10 MiB über die App nutzt; sonst endet die Empfehlung"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Nicht abgeholte Epochen verfallen, und die alten USDC-Auszahlungen wurden für Netzwerke storniert, die nicht innerhalb von 30 Tagen eine Wallet verknüpft hatten."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "Seit Oktober 2026 werden Belohnungen in SN25α ausgezahlt, einem Token eines Bittensor-Subnetzes, und jede Abholung kostet Gas in TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork hieß früher BringYour; sein archiviertes Whitepaper trägt noch den alten Namen."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork veröffentlicht den Quellcode seines Provider-Clients."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork veröffentlicht ein eigenes Docker-Image, bringyour/community-provider, und funktioniert auf VPS und an privaten Anschlüssen."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Eine Abholung braucht nur eine Bittensor-Wallet, die du kontrollierst."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai ist ein GPU-Cloud-Marktplatz, auf dem du deine NVIDIA-GPU an KI-/ML-Forscher und Entwickler vermietest. Docker-native Plattform, auf der du deine eigenen Stundenpreise festlegst. Eine RTX 3090 verdient vermietet typischerweise $0.20-0.40/Std. Benötigt eine NVIDIA-GPU mit aktuellen Treibern und eine stabile Internetverbindung. Die Einnahmen hängen stark vom GPU-Modell, der Preisstrategie und der Marktnachfrage ab.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "GPU-Marktplatz - eigene Preise festlegen, RTX 3090 ~$0.20-0.40/Std."
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "API-Schlüssel"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "Host-API-Schlüssel von Vast.ai aus dem Dashboard"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/Std., RTX 4090 ~$0.40-0.80/Std., wenn vermietet. Die Auslastung schwankt. Benötigt eine NVIDIA-GPU, einen Linux-Host, Docker und nvidia-container-toolkit. Du legst deine eigenen Preise fest."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Wöchentlich (freitags)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "Die Einnahmen sammeln sich im Vast.ai-Guthaben. Abhebung über Wise, PayPal oder Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% dessen, was geworbene Mieter ausgeben, für die gesamte Lebensdauer ihres Kontos, als Empfehlungsguthaben; bis zu 75% können über ein eigenes Empfehlungskonto ausgezahlt werden"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Ein Host verdient nur, solange er vermietet ist, und Vasts eigene Zahlen für eine Consumer-GPU hängen von der Mietart und dem Zuverlässigkeitswert ab."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot betreibt Vast.ai nicht: Du installierst die Host-Software von Vast auf deinem eigenen GPU-Rechner, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Vast baut das Hosting auf Docker auf einem Linux-Host auf."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Laut Vast erhält ein Host genau den Satz, den er festlegt, ohne Abzug einer Gebühr."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "Auszahlungen erfolgen per Wise, PayPal oder Stripe ab einem Minimum von $20, wöchentlich abgerechnet; ein kleineres Guthaben wird in die nächste Woche übertragen."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter ist eine Plattform zum Teilen von Bandbreite für Windows, Mac, Linux und Android. Sie gibt an, bis zu $1/GB geteilter Bandbreite zu zahlen, mit einer Mindestauszahlung von $20. Die Plattform funktioniert ähnlich wie klassische Apps zum Teilen von Bandbreite und leitet legitimen Datenverkehr über private Anschlüsse.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Bandbreite teilen - angeblich bis zu $1/GB, Mindestauszahlung $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Gibt bis zu $1/GB an, die tatsächlichen Einnahmen sind aber niedriger. Mindestauszahlung $20. Die Einnahmen schwanken stark je nach Standort und Nachfrage."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter hat kein Web-Dashboard. Öffne die Desktop- oder Handy-App von Wipter, melde dich an und beantrage dort die Auszahlung, sobald das Guthaben $20 erreicht. Wipter zahlt nur in USDT auf BNB Smart Chain (BEP20) aus, an die Wallet, die du im Bereich Payments der App festlegst; eine PayPal-Option gibt es nicht."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% ihrer Einnahmen aus Datenverkehr, sobald sie das Auszahlungsminimum erreichen, für beliebig viele geworbene Freunde"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "$5 Registrierungsbonus"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot betreibt Wipter nicht: Du verwendest die eigene Desktop- oder Handy-App des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "fa32942c6b4f"
xmrig.description:
  text: "Mine Monero mit deiner CPU. CashPilot betreibt XMRig, und der von dir gewählte Pool zahlt Monero an deine öffentliche Auszahlungsadresse. XMRig verwendet 1% der Hashing-Zeit, um seine Entwickler zu unterstützen. Der Strom kann mehr kosten als das XMR, das du verdienst."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "Monero mit deiner CPU und einem Pool deiner Wahl minen"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Monero-Adresse"
  source: "a888ebb3ae9b"
xmrig.docker.env.POOL_URL.label:
  text: "Pool"
  source: "f13024272c38"
xmrig.docker.env.WORKER_NAME.label:
  text: "Worker-Name"
  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "Max. CPU-Threads (%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "RandomX-Modus"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "Bruttoschätzung vor Stromkosten. Am 2026-11-25 war 1 kH/s beim beobachteten XMR-Preis und der beobachteten Netzwerkschwierigkeit etwa $1 pro Monat wert. Eine Desktop-CPU mit der Hälfte ihrer Threads kann 30 bis 50 W zusätzlich verbrauchen. Prüfe deinen tatsächlichen Verbrauch und deinen Strompreis, um zu sehen, ob es sich lohnt."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, nachdem du die Schwelle gesenkt hast)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Wenn die Pool-Schwelle erreicht ist"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "Der Pool zahlt an deine Monero-Adresse, wenn dein Guthaben deine Schwelle erreicht. Bis dahin hält der Pool das Guthaben."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Dieser Rechner meldet einen Hosting-Anschluss. Prüfe vor dem Mining die Nutzungsbedingungen deines Anbieters. Manche Anbieter, darunter Hetzner Cloud, verbieten es. Prüfe deine tatsächlichen Stromkosten, bevor du dich auf eine Gewinnschätzung verlässt."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "MoneroOcean, der Standard-Pool, berechnet 0% Mining-Gebühr. Die standardmäßige Auszahlungsschwelle liegt bei 0.3 XMR, und du kannst sie auf 0.003 XMR senken. Auszahlungen unter 4 XMR können bis zu 0.0004 XMR kosten. Andere Pools legen ihre eigenen Sätze und Schwellen fest."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "Rechenleistung"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "Nein. Der Miner sendet Arbeit an Mining-Pools."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Deine Monero-Adresse, der Worker-Name und die IP-Adresse gehen an den Pool."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "Manche Netzwerke und DNS-Resolver blockieren Verbindungen zu Mining-Pools."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "Die meisten Monero-Pools erkennen dich an deiner öffentlichen Auszahlungsadresse."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Eine Auszahlung setzt genug XMR voraus, um die Schwelle deines Pools zu erreichen."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "Manche Hosting-Anbieter verbieten das Mining von Kryptowährungen."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "Der zusätzliche Strom kann mehr kosten als das verdiente XMR."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "Der Miner sendet Hashes an Pools und leitet keinen fremden Datenverkehr weiter."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "Der Miner ist Open Source, und das Image ist auf ein signiertes Upstream-Release festgelegt."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Du kannst mit einer öffentlichen Monero-Adresse minen, ohne dich mit Namen zu identifizieren."
  source: "752cbb728aac"
