kryptex-pearl.cashout.notes:
  text: "Kryptex wandelt Pearl-Belohnungen in BTC um und hält das Guthaben in deinem Konto. Beantrage eine Abhebung bei Kryptex. Jede Methode hat ihr eigenes Minimum und ihre eigene Gebühr. Das Minimum für Bitcoin Lightning ist 0.00001 BTC."
