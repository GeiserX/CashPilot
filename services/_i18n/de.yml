helium.description:
  text: "Helium ist ein etabliertes dezentrales Funknetzwerk. Ursprünglich LoRaWAN-Hotspots, inzwischen auf 5G erweitert. Benötigt eigene Hardware ($500+). Verdient HNT/MOBILE-Token. Die Rendite ist deutlich gesunken - typisch $4-8/Monat.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "Dezentrales Funknetzwerk - benötigt Hardware, HNT-Token"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "Erfordert den Kauf von Hardware für $500+. Die Rendite ist deutlich gesunken. Genehmigungsverfahren für neue Betreiber."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "Pro Epoche"
  source: "75743e03bad2"
helium.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149 hat die Proof-of-Coverage-Belohnungen am 6. Juli 2026 abgeschafft; IoT-Hotspots verdienen jetzt nur noch für Daten, die sie übertragen, und mehr als 114.000 von ihnen haben keine übertragen."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Das Belohnungsmodell von Helium wurde mehrmals per Abstimmung geändert, sein CEO ist zurückgetreten, und HNT ist um etwa 96% gefallen."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot betreibt Helium nicht: Du verwendest die eigene Hotspot-Hardware des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "Die Gateway-Software des Hotspots ist Open Source unter der Apache-2.0-Lizenz."
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "Verfolge das noch nicht ausgezahlte Kaspa-Guthaben, das HeroMiners für deine öffentliche Auszahlungsadresse hält. Betreibe deinen eigenen Kaspa-Miner und richte ihn auf den Pool aus. CashPilot liest das Pool-Guthaben aus und bittet dich, Auszahlungen zu bestätigen, wenn das Guthaben sinkt.\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
  text: "Kaspa-Mining-Pool, verfolgt über deine Auszahlungsadresse"
  source: "92c5784dcf30"
herominers-kas.payment.minimum_payout:
  text: "1 KAS (einstellbar)"
  source: "d33ca7065ff9"
herominers-kas.payment.frequency:
  text: "Der Pool prüft deine Auszahlungsschwelle stündlich"
  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "HeroMiners zahlt automatisch an deine Adresse aus, sobald du deine gewählte Schwelle erreichst. Die niedrigste Schwelle ist 1 KAS.\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "Das Guthaben sammelt sich bei HeroMiners an. Prüfe in deiner Wallet den erhaltenen Betrag, bevor du eine Auszahlung in CashPilot bestätigst.\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "Gib die vollständige öffentliche Kaspa-Auszahlungsadresse ein, die dein Miner bei HeroMiners verwendet. Gib das Präfix <b>kaspa:</b> mit an und lass den Worker-Namen weg.\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "Benötigt einen Kaspa-Miner, der auf HeroMiners ausgerichtet ist"
  source: "898e36e7a701"
herominers-kas.disclosure.sells:
  text: "Rechenleistung"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "Nein. Dein Miner sendet Mining-Arbeit an den Pool."
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "Die öffentlichen Statistiken des Pools zeigen jede Auszahlungsadresse und ihre Mining-Aktivität."
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "Der Pool verwendet deine Auszahlungsadresse anstelle eines Kontos."
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "Der Pool berechnet eine Gebühr von 0.9% und hält Auszahlungen zurück, bis deine Schwelle erreicht ist."
  source: "7eb2950589fa"
honeygain.description:
  text: "Teile deine ungenutzte Internet-Bandbreite und verdiene passives Einkommen. Honeygain leitet Datenverkehr für Web Intelligence, Content Delivery und Marktforschung über deinen Anschluss. Eine der etabliertesten Plattformen zum Teilen von Bandbreite mit 12M+ Nutzern und über 1M abgeschlossenen Auszahlungen.\n"
  source: "b219f969ba34"
honeygain.short_description:
  text: "Bandbreite teilen - die etablierteste Plattform"
  source: "c0542c471f29"
honeygain.docker.env.HONEYGAIN_EMAIL.label:
  text: "E-Mail"
  source: "969ccbd3cf63"
honeygain.docker.env.HONEYGAIN_PASSWORD.label:
  text: "Passwort"
  source: "e7cf3ef4f17c"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.label:
  text: "Gerätename"
  source: "155106be1173"
honeygain.docker.env.HONEYGAIN_EMAIL.description:
  text: "Die E-Mail-Adresse deines Honeygain-Kontos"
  source: "482869cea18f"
honeygain.docker.env.HONEYGAIN_PASSWORD.description:
  text: "Das Passwort deines Honeygain-Kontos"
  source: "f3ba1584b384"
honeygain.docker.env.HONEYGAIN_DEVICE_NAME.description:
  text: "Name, der in deinem Honeygain-Dashboard angezeigt wird"
  source: "a3ba173cae35"
honeygain.earnings.notes:
  text: "Unterschiedlich je nach Standort. IPs aus den USA/der EU verdienen mehr. Max. 10 Geräte pro Konto."
  source: "63596c227cd4"
honeygain.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
honeygain.cashout.notes:
  text: "Minimum $20 (20.000 Credits). Zwei Optionen: PayPal über Tipalti mit etwa 15% Gebühr, oder JumpTask-Credits ohne Gebühr, gutgeschrieben in einer JumpTask-Wallet. Eine Anfrage braucht einen 6-stelligen Code, der per E-Mail gesendet wird. Die erste PayPal-Auszahlung bleibt auf \"waiting for details\", bis du dich über den Link, den sie dir per E-Mail schicken, bei Tipalti registrierst. Dieser Link funktioniert nur einmal, also öffne ihn, wenn du alles in einem Durchgang erledigen kannst und dein Handy griffbereit hast: Nachdem du ein Passwort festgelegt hast, musst du bei Tipalti eine Handynummer per SMS bestätigen (die Codes laufen innerhalb von Minuten ab), dann fragt Tipalti nach Name, Adresse, Land und Geburtsdatum sowie deiner PayPal-Adresse. Tipalti berechnet $2.02 pro Zahlung; wähle USD, um die Währungsumrechnungsgebühr von 1.9-3% zu vermeiden. Die Zahlung folgt innerhalb von 2 Werktagen. Das Guthaben verlässt dein Konto, sobald du die Anfrage stellst, auch während die Auszahlung noch auf Tipalti wartet. Jede spätere Anmeldung bei Tipalti sendet einen neuen SMS-Code, außer du setzt den Haken, das Gerät 30 Tage lang zu merken. Im Oktober 2026 hat Tipalti einen Zahlungsempfänger in Spanien nicht nach einem Steuerformular gefragt."
  source: "553463d96535"
honeygain.payout.notes:
  text: "Das Guthaben hält Honeygain; Abhebung auf Anfrage."
  source: "cd21f1bead11"
honeygain.collector.credential_hint:
  text: "Verwende die E-Mail-Adresse und das Passwort deines Honeygain-Kontos (dieselben wie bei <a href='https://dashboard.honeygain.com' target='_blank'>dashboard.honeygain.com</a>)."
  source: "fd0be22aeb14"
honeygain.referral.bonus.referrer:
  text: "Bis zu 25% der Einnahmen jedes geworbenen Freundes im Honeygain-Modus"
  source: "30385153a66b"
honeygain.referral.bonus.referee:
  text: "$3 Registrierungsbonus mit diesem Link"
  source: "9ee5d2215305"
honeygain.obligations.withdraw-before-24-month-write-off.title:
  text: "Heb dein Honeygain-Guthaben ab"
  source: "0868662c5a12"
honeygain.obligations.keep-active-6-months.title:
  text: "Lass ein Honeygain-Gerät teilen oder beantrage eine Auszahlung"
  source: "936e03475b32"
honeygain.obligations.withdraw-before-24-month-write-off.loss:
  text: "Einnahmen bleiben 24 Monate gültig, nachdem sie das Minimum von $20 erreicht haben. Danach kann Honeygain abschreiben, was nicht ausgezahlt wurde."
  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
  text: "Wird die App länger als 6 Monate nicht genutzt, betrachtet Honeygain das nicht ausgezahlte Guthaben als verfallen, auch unter $20."
  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "Lass ein Gerät teilen oder beantrage eine Auszahlung. Im JumpTask-Modus ist ein gleichbleibendes Guthaben normal, wähle dann Nicht für mich."
  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "Die Nutzungsbedingungen erlauben Honeygain, Einnahmen abzuschreiben, die die Schwelle von $20 erreicht haben und nicht innerhalb von 24 Monaten ausgezahlt wurden, und Einnahmen nach sechs Monaten ohne Nutzung als verfallen zu betrachten."
  source: "de362cb2d239"
honeygain.rating.cons.1.text:
  text: "Das Minimum liegt bei $20, und PayPal-Auszahlungen laufen über Tipalti, das $2.02 pro Zahlung berechnet."
  source: "bb6affb086a6"
honeygain.rating.cons.2.text:
  text: "Die Nutzungsbedingungen erlauben Honeygain, ein Konto zu sperren und Einnahmen einzubehalten oder abzuschreiben, die es als unter falschen Voraussetzungen angesammelt ansieht."
  source: "d3b629e06af3"
honeygain.rating.cons.3.text:
  text: "Vor der ersten PayPal-Auszahlung musst du bei Tipalti eine Handynummer per SMS bestätigen und deinen Namen, deine Adresse und dein Geburtsdatum angeben."
  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "Laut den Nutzungsbedingungen verwenden Geschäftskunden den Datenverkehr, um öffentlich verfügbare Webdaten zu sammeln, sie nennen aber keinen Kunden, und du kannst nicht wissen, welcher Kunde deinen Anschluss nutzt."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "Honeygains eigene Antworten auf Bewertungen über geringe Einnahmen sagen, dass die Einnahmen von der Nachfrage im Netzwerk und vom Standort abhängen; Rezensenten berichten, dass es sehr lange dauert, das Minimum von $20 zu erreichen."
  source: "634fb331e65b"
honeygain.rating.pros.0.text:
  text: "Honeygain veröffentlicht ein eigenes Docker-Image, honeygain/honeygain."
  source: "ea44bd3c855c"
honeygain.rating.pros.1.text:
  text: "Die Nutzungsbedingungen nennen den Betreiber, Honeygain UAB, eingetragen in Vilnius, Litauen."
  source: "579a169fcf35"
honeygain.rating.pros.2.text:
  text: "Laut der Presseseite von Honeygain wurde es 2019 gegründet."
  source: "a3bfbdb33f54"
ionet.description:
  text: "io.net ist ein dezentrales GPU-Netzwerk für KI-/ML-Workloads. Es bündelt ungenutzte GPUs von Privatnutzern und Rechenzentren. Für nennenswerte Einnahmen ist eine NVIDIA-GPU mit 8GB+ VRAM nötig. Containerbasierte Bereitstellungen werden unterstützt.\n"
  source: "5d017f77f0ac"
ionet.short_description:
  text: "Dezentrales GPU-Netzwerk für KI - NVIDIA-GPU erforderlich"
  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "Benötigt eine NVIDIA-GPU mit 8GB+ VRAM. Für eine RTX 4090 werden $500-1000/Monat behauptet (in der Praxis wahrscheinlich weniger)."
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "Pro Epoche"
  source: "75743e03bad2"
ionet.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "Die Belohnungen für Anbieter wurden aus Token-Emissionen gezahlt, unabhängig von bezahlten Aufträgen, und GPU-Besitzer berichten, dass ihre GPUs die meiste Zeit ungenutzt bleiben."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "Belohnungen gibt es im IO-Token, und das Auszahlungsmodell wurde 2026 auf ein an den Dollar gekoppeltes System umgestellt."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "Im April 2024 versuchten etwa 1.8 Millionen gefälschte GPUs, über ein geleaktes Authentifizierungstoken beizutreten, und der CEO trat später noch vor dem Token-Start zurück."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "CashPilot betreibt io.net nicht: Du verwendest die eigene Worker-Software des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "1cac289c99ad"
iproyal.description:
  text: "Mit IPRoyal Pawns verdienst du, indem du deine ungenutzte Bandbreite teilst. IPRoyal ist ein etablierter Proxy-Anbieter, und Pawns ist sein Bereich zum Teilen von Residential-Bandbreite. Das CLI-Docker-Image nimmt die Zugangsdaten über Kommandozeilen-Flags entgegen. Ein neuer Nutzer, der sich über einen Empfehlungslink registriert, bekommt $1 auf jede seiner ersten drei Auszahlungen, bis zu $3. Jede Auszahlung muss innerhalb eines Zeitfensters von einer bis drei Wochen erfolgen, das vom Standort abhängt. Das Fenster beginnt bei der Registrierung und beginnt nach jeder Auszahlung neu. Schließt ein Fenster vorher, verfallen die restlichen Boni.\n"
  source: "b12878d5917a"
iproyal.short_description:
  text: "Bandbreite teilen - bis zu $3 Bonus auf deine ersten Auszahlungen"
  source: "20091c7b26ed"
