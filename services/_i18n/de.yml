flux.rating.cons.2.text:
  text: "CashPilot betreibt Flux nicht: Du verwendest die eigene Node-Software des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
