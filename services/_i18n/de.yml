# Each entry holds the text and the hash of the English it translates
# (scripts/i18n_check.py documents the format). A key whose English changed
# since shows English until it is updated here. To fix a translation, edit
# its text and run:
#   python scripts/i18n_check.py services/_i18n/en.yml services/_i18n/de.yml --restamp '<key>'
2miners-etc.description:
  text: "Verfolge das noch nicht ausgezahlte Ethereum-Classic-Guthaben, das 2Miners für deine öffentliche ETC-Auszahlungsadresse hält. Betreibe deinen eigenen Miner und richte ihn auf den Pool aus. CashPilot liest das Guthaben aus und bittet dich, Auszahlungen zu bestätigen, wenn das Guthaben sinkt.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Ethereum-Classic-Mining-Pool, verfolgt über deine Auszahlungsadresse"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (einstellbar)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "Der Pool prüft deine Auszahlungsschwelle alle zwei Stunden"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners zahlt automatisch an deine Adresse aus, sobald du deine gewählte Schwelle erreichst. Die niedrigste Schwelle für ETC-Auszahlungen ist 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Das nicht ausgezahlte Guthaben sammelt sich bei 2Miners an. Das Wallet-Guthaben wird separat aus Ethereum Classic ausgelesen. Prüfe in deiner Wallet den erhaltenen Betrag, bevor du eine Auszahlung in CashPilot bestätigst.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Gib die öffentliche Ethereum-Classic-Auszahlungsadresse ein, die dein Miner bei 2Miners verwendet. Sie beginnt mit <b>0x</b>. Lass einen Worker-Namen weg.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Benötigt einen ETCHash-Miner, der auf 2Miners ausgerichtet ist"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "Rechenleistung"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Nein. Dein Miner sendet Mining-Arbeit an den Pool."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "Der Pool verwendet deine Auszahlungsadresse, die von dir gewählten Worker-Namen und die IP-Adresse deines Miners."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Jeder kann die Statistiken anhand der Auszahlungsadresse einsehen. Um die Schwelle zu ändern, verlangt der Pool eine Bestätigung der Worker-IP."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "Der Pool berechnet eine Gebühr von 1% und hält Auszahlungen zurück, bis deine Schwelle erreicht ist."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (früher ATOR) ist ein dezentrales Privatsphäre-Netzwerk mit Onion-Routing. Node-Betreiber betreiben Relay-Nodes und verdienen ANYONE-Token für die bereitgestellte Bandbreite. Man kann es sich als „Tor mit Belohnung“ vorstellen. CashPilot betreibt es mit einem eigenen Image, das aus dem signierten Debian-Paket des Projekts gebaut wird, für amd64 und arm64. Die Konfiguration erfolgt über eine anonrc-Datei, die in den Container eingebunden wird (Nickname, ContactInfo, ORPort usw.). Ein Relay verdient nichts, bis 100 ANYONE für mindestens 180 Tage dafür gesperrt sind, und Belohnungen werden abgeholt, indem du in deiner Wallet signierst. Das Relay führt außerdem deine öffentliche IP im Relay-Verzeichnis des Netzwerks auf. Das kann dem IP-Ruf schaden, für den Bandbreiten-Apps mit Residential-IPs bezahlen.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Dezentrales Onion-Routing - Tor-Relay-Nodes mit Belohnung"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Ed25519-Identitätsschlüssel des Relays. Wird er gelöscht, verliert das Relay seinen Ruf und seine Verdiensthistorie beginnt wieder bei null."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Zahlt nur, wenn pro Relay 100 ANYONE für mindestens 180 Tage gesperrt sind und eine Belohnungsabholung in deiner Wallet signiert wird. Ohne den Einsatz verdient ein Relay nichts. Mit ihm hängen die Einnahmen von der bereitgestellten Bandbreite und der Betriebszeit ab."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Pro Epoche"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Wird als ContactInfo in anonrc gesetzt, mit dem Präfix '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Kommagetrennte Relay-Fingerprints. Diesen Wert gibt es in keinem Web-Dashboard: Führe <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> auf dem Host aus, auf dem das Relay läuft.\n"
  source: "9b5c068c9636"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Bandbreite, als Relay im Anyone-Netzwerk (einem Tor-Fork)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Ja. Es leitet den Datenverkehr anderer Personen weiter. Ob deine IP der letzte Hop ist, hängt davon ab, ob das Relay als Exit konfiguriert ist."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "Der öffentliche Identitätsschlüssel des Relays, deine IP und dein Port sowie Statistiken zur Betriebszeit, alles absichtlich im Netzwerkverzeichnis veröffentlicht. Wenn du ContactInfo in deiner anonrc setzt, wird es dort ebenfalls veröffentlicht und dauerhaft öffentlich indexiert. Meist ist es eine E-Mail-Adresse, also lass es leer, außer du willst sie öffentlich machen."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Real. Der Relay-Verkehr wird deinem Anschluss zugeordnet. Besonders Exit-Relays ziehen Missbrauchsbeschwerden an; viele Internetanbieter für Privatkunden verbieten sie."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Es gibt kein Konto, für das du dich registrieren musst, also gibt es nichts pro Konto zu begrenzen. Um zu verdienen, brauchst du trotzdem eine Ethereum-Wallet mit 100 ANYONE, die für jedes Relay mindestens 180 Tage gesperrt sind, und CashPilot braucht die Relay-Fingerprints, um die Belohnungen auszulesen. Das Projekt veröffentlicht kein Relay-Limit pro IP, und der Katalog gibt keines an."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Ein Relay verdient nichts, solange nicht 100 ANYONE für mindestens 180 Tage dafür gesperrt sind, und jede Belohnungsabholung wird in deiner Wallet signiert."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Es leitet absichtlich den Datenverkehr anderer Personen weiter, ohne zu prüfen, wer sie sind; Exit-Relays ziehen Missbrauchsbeschwerden an."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "Identität, IP und Betriebszeit des Relays werden im Netzwerkverzeichnis veröffentlicht, und jede ContactInfo, die du setzt, bleibt für immer öffentlich."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Es gibt kein Konto, für das du dich registrieren musst. Ein Relay braucht nur eine Wallet, ohne Identitätsprüfung."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "Die Relay-Software ist ein veröffentlichter Fork von Tor, unter der Lizenz von Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot baut sein eigenes Image aus der veröffentlichten Relay-Software von Anyone, die kein Konto braucht."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping ist eine dezentrale Plattform zur Netzwerküberwachung, die dich für den Betrieb eines Nodes bezahlt. Dein Node führt für die Kunden von Bitping Website-Überwachung, Latenztests und Prüfungen der Netzwerkqualität durch. Funktioniert sowohl mit privaten Anschlüssen als auch mit VPS. Das Docker-Image meldet sich beim ersten Start mit den Umgebungsvariablen BITPING_EMAIL und BITPING_PASSWORD an (\"Attempting login with environment variables\" in seinem eigenen Log) und speichert die Sitzung dann im eingebundenen Volume, sodass Neustarts keine erneute Anmeldung brauchen.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Bandbreite teilen - dezentrale Netzwerküberwachung, funktioniert auf VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "E-Mail"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Passwort"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "Die E-Mail-Adresse deines Bitping-Kontos (dieselbe Anmeldung wie bei <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Das Passwort deines Bitping-Kontos. Wird einmal verwendet, um die Node-Sitzung zu erstellen, die dann im Daten-Volume gespeichert bleibt."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Die Einnahmen hängen von der Netzwerkqualität und der Nachfrage nach Überwachung von deinem Standort aus ab. VPS-Nodes werden akzeptiert."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Node-Einnahmen liegen auf nodes.bitping.com; app.bitping.com ist das Dashboard für API-Kunden. Abhebungen gibt es nur in SOL: Sobald das nicht ausgezahlte Guthaben über $0.05 liegt, gibst du die Solana-Adresse in die Anfrage ein, die innerhalb von 24 Stunden bearbeitet wird. Eine neue oder leere Solana-Wallet braucht zuerst etwa 0.001 SOL für das Rent-Minimum des Netzwerks."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Inzwischen nur Solana, und die Adresse wird ERST BEI DER ABHEBUNG eingegeben statt gespeichert."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Verwende die E-Mail-Adresse und das Passwort deines Bitping-Kontos (dieselben wie bei <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Heb dein Bitping-Guthaben ab"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping kann Einnahmen, die länger als 12 Monate nicht abgeholt wurden, nach 30 Tagen Vorankündigung per E-Mail einbehalten."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Beantrage auf nodes.bitping.com eine SOL-Abhebung und gib deine Solana-Adresse in die Anfrage ein."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Abhebungen werden in Solana (SOL) ausgezahlt, an eine Adresse, die du in jede Anfrage eingibst."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Laut der Hilfe von Bitping kann eine Abhebung an eine neue, leere Solana-Wallet fehlschlagen, bis du diese Wallet selbst mit etwas SOL auflädst."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Laut der Hilfe von Bitping werden Server und Docker-Container unterstützt."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Eine Abhebung braucht nur eine Solana-Adresse, die du in die Anfrage eingibst."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit ist ein Dienst zum Teilen von Bandbreite, der über PayPal und Stripe auszahlt. Es gibt kein offizielles Docker-Image; die Clients sind die Windows-Desktop-App und die Android-App. Der Dienst ist unter bytebenefit.io erreichbar -- die alte Domain bytebenefit.com wurde aufgegeben und wird auf einem Marktplatz geparkt. Deshalb war er hier früher als eingestellt markiert.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Bandbreite teilen - Auszahlung per PayPal/Stripe, Desktop-/Android-App"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Kein Docker-Image verfügbar. Nur Windows-Desktop- und Android-Apps."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% der Einnahmen aus dem Datenverkehr der Empfehlungen"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "$1 (10.000 Coins) Willkommensbonus"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "Laut dem Google-Play-Eintrag der App bedient dein Datenverkehr Web-Intelligence-Anfragen von Kunden von Infatica, ohne zu sagen, wer sie sind oder wie sie geprüft werden."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Die Android-App ist im April 2026 nach 17 Monaten aus Google Play verschwunden."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot betreibt ByteBenefit nicht: Du verwendest die eigene App des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "550e4508aba2"
bytelixir.description:
  text: "Mit Bytelixir verdienst du passives Einkommen, indem du ungenutzte Internet-Bandbreite teilst. Unterstützt nur Windows und Android — laut offiziellem FAQ ist kein Linux- oder Docker-Client geplant, iOS wird nicht unterstützt und macOS wird nicht angeboten. Die Einnahmen hängen stark vom Standort ab. Web-Dashboard unter dash.bytelixir.com zur Verfolgung. Kein Docker-Image verfügbar.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Bandbreite teilen - nur Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Sitzungs-Cookie"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Remember-Web-Cookie"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "XSRF-Token"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Melde dich bei <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a> an, drücke F12 → Application → klappe in der linken Seitenleiste <b>Cookies</b> auf → klicke auf den Untereintrag <code>https://dash.bytelixir.com</code> → suche in der Cookie-Liste rechts <code>bytelixir_session</code> → kopiere seinen Value (ein langes JWT, das mit eyJ beginnt)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Gleiche Stelle (Cookies → <code>https://dash.bytelixir.com</code>) → suche das Cookie namens <code>remember_web_...</code> → kopiere seinen Value (optional, verlängert die Sitzungsdauer)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Gleiche Stelle → suche <code>XSRF-TOKEN</code> → kopiere seinen Value (optional)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Die Einnahmen schwanken je nach Standort ($2-50/Monat). Kein Docker-Image. Desktop-App oder Android-App erforderlich."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Nur Krypto. Das Minimum hängt von der Coin ab: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Du gibst die Adresse in jede Anfrage ein. Anfragen werden während der Arbeitszeiten innerhalb von 24 Stunden bearbeitet."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Das Guthaben hält Bytelixir; die Wallet-Adresse wird in jede Auszahlungsanfrage eingegeben und nie im Container gespeichert."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Melde dich bei <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> an und <b>setze den Haken bei Remember Me</b>, drücke F12 → Application → klappe in der linken Seitenleiste <b>Cookies</b> auf → klicke auf <code>https://dash.bytelixir.com</code> und kopiere dann drei Werte: <b>bytelixir_session</b>, <b>remember_web_…</b> (das lange Cookie, das mit diesem Präfix beginnt) und <b>XSRF-TOKEN</b>. Das Sitzungs-Cookie allein läuft etwa zwei Stunden nach dem Kopieren ab, sodass die Erfassung noch am selben Nachmittag stoppt; das remember_web-Cookie hält ein Jahr und sorgt dafür, dass es weiter funktioniert."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50% ihres Gewinns, lebenslang"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "$1 Begrüßungsbonus"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
  text: "Nur Krypto, und das Minimum hängt von der Coin ab, von $5 für USDT bis $250 für Bitcoin."
  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot betreibt Bytelixir nicht: Du verwendest die eigene App des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Trustpilot bewertet es mit 4.6 aus 283 Bewertungen, die meisten loben die Krypto-Auszahlungen; einige berichten von Auszahlungen, die nicht ankommen."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Eine Auszahlung braucht nur eine Krypto-Adresse, die du in die Anfrage eingibst."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai ist ein Peer-to-Peer-Marktplatz für GPUs. Du bietest einen Linux-Rechner mit NVIDIA-GPUs an, legst deine eigenen Spot- und On-Demand-Preise fest, und Mieter führen darauf ihre eigenen Docker-Container aus. Bezahlt wirst du nur für die Minuten, in denen er gemietet ist, in CLORE, BTC, USDT oder USDC. Zum Hosten brauchst du einen x86_64-Rechner mit Ubuntu 22.04 oder neuer (oder HiveOS), einen funktionierenden NVIDIA-Treiber und mindestens 100 Mbps im Up- und Download. AMD-GPUs werden nicht unterstützt.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "GPU-Marktplatz - NVIDIA-GPUs vermieten, Bezahlung in CLORE, BTC oder USD-Stablecoins"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Bezahlt werden nur gemietete Minuten, zu dem Preis, den du festlegst. Das obere Ende der Spanne, $490, ist Clores eigene Obergrenze für eine einzelne RTX 4090, die minutenweise angeboten wird ('up to ~$490/month'); kleinere Karten verdienen weniger, und eine ungenutzte Karte verdient nichts. Clore behält 5% (On-Demand) oder 1.25% (Spot) jeder Vermietung ein, plus 15%, wenn der Mieter in BTC, USDT oder USDC statt in CLORE bezahlt."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Heb unter Account > Billing an deine eigene Wallet ab: CLORE (ERC-20, Minimum 200, Gebühr etwa $0.50), BTC (Minimum 0.0001, Gebühr 0.00005 BTC) oder USDT/USDC auf Ethereum oder BNB Chain (Minimum $10, Gebühr $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore hält das Guthaben (CLORE, BTC und ein USD-Guthaben für USDT/USDC), bis du abhebst. Die Chain wählst du bei jeder Abhebung: Ethereum für CLORE, Bitcoin für BTC, Ethereum oder BNB Chain für USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (Standardstufe) der Plattformgebühren, die die von dir geworbenen Hosts und Mieter zahlen, bei jeder Vermietung; der Code läuft nie ab; Auszahlung in der Währung der Vermietung (CLORE, BTC oder USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps im Up- und Download"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "GPU-Rechenzeit auf deinem Rechner."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Ja. Mieter führen ihre eigenen Docker-Container auf deinem Rechner aus, und ihr Datenverkehr verlässt deinen Anschluss; SSH- und Anwendungsports werden ins Internet weitergeleitet."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Die Datenschutzerklärung von Clore umfasst Kontodaten und deine IP-Adresse mit ungefährem Standort; Ausweisdokumente nur, wenn Clore ein KYC verlangt."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Eingehende Ports müssen aus dem Internet erreichbar sein (standardmäßig 22, 8080 und 3000-4000), und fremde Workloads laufen über deinen Anschluss. Clores eigene Netzwerkanleitung sagt, dass manche Internetanbieter Hosting blockieren."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "Ab 18 Jahren, nicht in einem sanktionierten Land. Clore kann ein Konto nach eigenem Ermessen sperren oder schließen, und eine verbotene Nutzung kann das Guthaben kosten."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Weder die Nutzungsbedingungen noch die Datenschutzerklärung nennen eine juristische Person, und die Nutzungsbedingungen überlassen das anwendbare Recht einer späteren Version."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore kann ein Konto nach eigenem Ermessen sperren oder schließen, und eine verbotene Nutzung kann zum Verlust des Guthabens führen."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Auszahlungen gibt es nur in Krypto (CLORE, BTC, USDT oder USDC), und Clore nimmt zusätzlich 15% einer Vermietung, die der Mieter in BTC, USDT oder USDC bezahlt, außer der Host sperrt CLORE, um das zu senken."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Ein Host wird nur für gemietete Minuten bezahlt, und Clores Zahl für eine RTX 4090 ist eine Obergrenze (\"up to ~$490/month\") für eine einzelne Karte."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "Für die normale Nutzung ist kein KYC nötig, aber Clore kann bei großen Abhebungen oder Compliance-Fällen eine Identitätsprüfung verlangen."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Mieter führen beliebige öffentliche Docker-Images auf deinem Rechner aus. Die Nutzungsbedingungen nennen verbotene Nutzungen (Malware, DDoS, CSAM und mehr), aber wir haben keine Beschreibung gefunden, wie Mieter geprüft werden."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot betreibt Clore.ai nicht: Du installierst den Hosting-Agenten von Clore auf deinem eigenen GPU-Rechner (Ubuntu 22.04 oder neuer, oder HiveOS), daher kann CashPilot ihn nicht für dich bereitstellen oder aktualisieren."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Clore behält 5% einer On-Demand-Vermietung ein (1.25% bei Spot), wenn der Mieter in CLORE bezahlt, ohne zusätzliche Gebühr."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN betreibt ein Validator-Netzwerk, das Bandbreite und Abdeckung für die über das DAWN-Protokoll finanzierte KI-Infrastruktur prüft. Die Browsererweiterung DAWN Validator nimmt an diesen Proof-of-Bandwidth- und Abdeckungsprüfungen teil und verdient DAWN-Belohnungen, solange sie läuft. Die Belohnungen haben noch keinen festen Geldwert. Erstelle das Konto in der Erweiterung und gib den Empfehlungscode 2QLQV97F ein, wenn sie danach fragt.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "DePIN-Validator - Browsererweiterung verdient DAWN-Punkte"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Verdient Dawn Points vor dem Token-Start. Der tatsächliche Wert hängt vom künftigen Token-Preis ab. Ein Hardware-Gerät verdient mehr als die Browsererweiterung."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Token-Airdrop (noch offen)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "Die Erweiterung funktioniert, ist aber unausgereift. Black-Box-Hardware wurde angekündigt. Später erneut prüfen."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "Die Erweiterung verdient Punkte; bis Oktober 2026 war keine Token-Verteilung an Node-Betreiber bestätigt."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "Punkte haben keinen festen Wert, bis ein Token startet und seine Umrechnung angekündigt wird."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot betreibt Dawn nicht: Du verwendest die eigene Browsererweiterung des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network ist ein Projekt für dezentrales VPN und Web3-Infrastruktur. Es benötigt in erster Linie proprietäre Deeper-Connect-Hardwaregeräte. Moken ist eine zugehörige Mining-/Staking-Plattform. Nicht rein softwarebasiert.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "Dezentrales VPN - benötigt ein proprietäres Hardwaregerät"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
  text: "Benötigt Deeper-Connect-Hardware ($200-500). Moken-Plattform für Mining/Staking. Nicht rein softwarebasiert."
  source: "ce760f192baa"
deeper-network.payment.frequency:
  text: "Laufend"
  source: "04f13cecbc50"
deeper-network.payout.notes:
  text: "Noch nicht ermittelt: CashPilot hat noch nicht geprüft, wo dieser Dienst deine Einnahmen aufbewahrt."
  source: "8d61a71de590"
deeper-network.referral.bonus.referrer:
  text: "Provision auf den Geräteverkauf"
  source: "571e7524161f"
deeper-network.referral.bonus.referee:
  text: "5% Rabatt auf das Deeper-Connect-Gerät mit dem Gutscheincode SERGIO"
  source: "5ad6de87c70a"
deeper-network.rating.cons.0.text:
  text: "Mining-Belohnungen gibt es in DPR, und sie hängen von einem Credit Score ab, der langsam oder durch Staking von DPR wächst."
  source: "69856242403f"
deeper-network.rating.cons.1.text:
  text: "CashPilot betreibt Deeper Network nicht: Du verwendest die eigene Router-Hardware des Anbieters, daher kann CashPilot sie nicht für dich bereitstellen oder aktualisieren. Die Nutzungsbedingungen wurden nicht auf Container geprüft."
  source: "b1ba1636070f"
earnapp.description:
  text: "Mit EarnApp von Bright Data verkaufst du deine ungenutzte Bandbreite für passives Einkommen. Bright Data ist das größte Proxy-Netzwerk der Welt und versorgt Fortune-500-Unternehmen mit Datenerfassung. CashPilot betreibt es mit einem eigenen Image, das beim ersten Start den festgelegten EarnApp-Build vom CDN von Bright Data herunterlädt, seine sha256 prüft und ihn im Lite-Modus nur mit einer UUID ausführt.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Bandbreite teilen - unterstützt von Bright Data"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "Node-UUID"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "Deine EarnApp-Node-ID: sdk-node- gefolgt von 32 Hex-Zeichen in Kleinbuchstaben, so wie 'earnapp showid' sie ausgibt. Verknüpfe sie nach dem Bereitstellen einmal, indem du https://earnapp.com/r/ gefolgt von dieser UUID öffnest, während du bei EarnApp angemeldet bist; ein nicht verknüpfter Node verdient, aber nichts davon landet in deinem Guthaben"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp erreicht seine Server immer wieder nicht und startet neu, daher verdient es wenig oder nichts. Starte diese Kopie neu; wenn es weiter passiert, prüfe die Internetverbindung dieses Rechners."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Öffne diesen Link, während du bei EarnApp angemeldet bist, um den Node zu deinem Konto hinzuzufügen. Bis du das tust, verdient der Node, aber nichts davon landet in deinem Guthaben."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Stark standortabhängig. IPs aus den USA/der EU verdienen am meisten. Die Einnahmen steigen mit der genutzten Bandbreite."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Auf Anfrage (automatisches Einlösen verfügbar: PayPal mind. $10, Wise mind. $10, Amazon mind. $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Schalte das automatische Einlösen einmal ein, und EarnApp zahlt von selbst aus, sobald das Guthaben das Minimum der Methode erreicht: PayPal $10, Wise $10, Amazon $50. PayPal-Zahlungen kommen von Bright Data Ltd. Im Oktober 2026 kam eine PayPal-Zahlung etwa 2% unter dem eingelösten Guthaben an."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Das Guthaben hält EarnApp; eingelöst über Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Melde dich bei <a href='https://earnapp.com' target='_blank'>earnapp.com</a> an, drücke F12 → Application → Cookies und kopiere den Wert von <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% ihrer Einnahmen, lebenslang, zusätzlich zu ihren eigenen gezahlt"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "Laut dem Hilfecenter von EarnApp ist die Installation in Docker-Containern, virtuellen Maschinen, Hosting-Diensten oder Heimservern strikt verboten – genau so betreibt CashPilot es."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "Derselbe Hilfeartikel sagt, dass ein Konto, das so betrieben wird, ohne Vorankündigung gekündigt wird und seine ausstehenden Zahlungen storniert werden."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Unsere PayPal-Auszahlung kam im Oktober 2026 an, etwa 2% unter dem eingelösten Guthaben."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "Ein Minimum von $10 für PayPal und Wise, mit automatischem Einlösen, das von selbst auszahlt."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp gehört zu Bright Data, und seine PayPal-Zahlungen kommen von Bright Data Ltd., einem namentlich bekannten Unternehmen."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm bezahlt dich dafür, dass du deine Internet-Bandbreite teilst. Der Einnahmen-Collector meldet sich per E-Mail/Passwort über Supabase an. Schlankes Docker-Image mit unkomplizierter Bereitstellung (der Docker-Client verwendet ein separates UUID-Token).\n"
  source: "1a3ca938fc72"
earnfm.short_description:
  text: "Bandbreite teilen - Anmeldung per E-Mail/Passwort, schlanker Client"
  source: "d74693321b51"
earnfm.docker.env.EARNFM_TOKEN.label:
  text: "API-Schlüssel"
  source: "23189d55f697"
earnfm.docker.env.EARNFM_TOKEN.description:
  text: "Melde dich bei <a href=\"https://app.earn.fm\">app.earn.fm</a> an → klicke auf dein Profilsymbol (oben rechts) → Account Settings → kopiere den API Key (UUID-Format)"
  source: "ffda6d89eec7"
earnfm.earnings.notes:
  text: "Relativ neue Plattform. Die Einnahmen schwanken je nach Standort und verfügbarer Bandbreite."
  source: "8fc36f3ab110"
earnfm.payment.frequency:
  text: "Auf Anfrage"
  source: "be820103712e"
earnfm.cashout.notes:
  text: "Minimum $15. Methoden: USDT auf BEP20 oder Polygon ($1 Gebühr) oder TRC20 ($3 Gebühr), PayPal, Amazon- oder Starbucks-Gutscheine ab $15 oder eine Banküberweisung ab $1.000 abzüglich Überweisungsgebühren. Vor der ersten Auszahlung füllst du ein Rechnungsprofil aus (vollständiger Name und Adresse), das für die Auszahlungsbelege verwendet wird."
  source: "3df5624c8702"
earnfm.payout.notes:
  text: "Das Guthaben hält Earn.fm; Abhebung auf Anfrage."
  source: "a4456fdb2585"
earnfm.collector.credential_hint:
  text: "Verwende die E-Mail-Adresse und das Passwort deines Earn.fm-Kontos (dieselben wie bei der Anmeldung auf <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>)."
  source: "cd2a625dffa6"
earnfm.referral.bonus.referrer:
  text: "10% ihrer Einnahmen, lebenslang"
  source: "f0262d54b65c"
earnfm.referral.bonus.referee:
  text: "$5 Startguthaben"
  source: "fb8d2b82e1e7"
earnfm.rating.cons.0.text:
  text: "Ein Minimum von $15, eine Gebühr von $1 bis $3 auf USDT und eine Banküberweisung erst ab $1.000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Vor der ersten Auszahlung füllst du ein Rechnungsprofil mit deinem vollständigen Namen und deiner Adresse aus."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Rezensenten berichten 2025, dass der Support per E-Mail und Discord nicht antwortet; Trustpilot vermerkt, dass Earn.fm nicht auf negative Bewertungen geantwortet hat."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Earn.fm veröffentlicht ein eigenes Docker-Image, earnfm/earnfm-client."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher ist eine Traffic-Exchange-Plattform, auf der du Credits verdienst, indem du über eine automatische Surfbar Websites besuchst. Läuft als Browsererweiterung/Add-on. Kein klassischer Dienst zum Teilen von Bandbreite — er erzeugt Datenverkehr, indem er automatisch Websites aufruft.\n"
