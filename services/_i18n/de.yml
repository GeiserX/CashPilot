  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Die Datenschutzerklärung von Golem nennt den Betreiber, die Golem Factory GmbH in Zug, Schweiz."
  source: "bae79b651923"
grass.description:
  text: "Grass ist ein dezentrales Netzwerk, über das du deine ungenutzte Bandbreite für KI-Trainingsdaten verkaufst. Es läuft als Browsererweiterung und Desktop-App und leitet Web-Scraping-Anfragen über deinen Anschluss, um strukturierte Datensätze aufzubauen. Mit 8.5M+ Nutzern ist es eines der größten DePIN-Bandbreitennetzwerke. Verdient GRASS-Token auf der Solana-Blockchain.\n"
  source: "046951d812f9"
grass.short_description:
  text: "DePIN-Bandbreite teilen für KI-Daten - verdient GRASS-Token"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Zugriffstoken"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Melde dich bei <a href=\"https://app.grass.io\">app.grass.io</a> an, drücke F12 → Application → Local Storage → klicke auf <code>https://app.grass.io</code> → kopiere den Wert von <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Verdient Grass Points, die über Airdrops in GRASS-Token umgewandelt werden können. Der tatsächliche Wert in USD hängt vom Token-Preis ab. Browsererweiterung oder Desktop-App erforderlich."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Airdrop pro Epoche"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Belohnungen kommen als regelmäßige Ausschüttungen, die du im Grass-Dashboard abholst. Die Ausschüttung von Stage 2 (Aktivität von Oktober 2024 bis Juni 2026) wird in USDC gezahlt: Hol sie auf app.grass.io/dashboard bis zum 22. Januar 2027 ab, oder früher, falls vorher alle Zuteilungen abgeholt sind. Nicht abgeholte Belohnungen behält Grass."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "Sammelt PUNKTE an; GRASS wird bei den regelmäßigen Airdrops im Grass-Dashboard abgeholt."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Melde dich bei <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a> an, drücke F12 → Application → Local Storage und kopiere den Wert von <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% der Uptime-Punkte direkter Empfehlungen, 10% auf der zweiten Ebene, 5% auf der dritten"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Hol deine Grass-Stage-2-USDC ab"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Grass behält jede Stage-2-Zuteilung, die nicht bis zum 22. Jan. 2027 abgeholt wurde, und das Zeitfenster kann früher schließen, sobald alle Zuteilungen abgeholt sind."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Melde dich auf app.grass.io mit dem Konto an, das du in Stage 2 verwendet hast, aktiviere die Grass Wallet, öffne den Tab Allocation und bestätige. Hol nur auf app.grass.io ab. Keine Stage-2-Punkte? Wähle Nicht für mich."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Belohnungen gibt es nur über Airdrop-Saisons. Langjährige Node-Betreiber berichteten Schätzungen für Saison 2 im einstelligen bis niedrigen zweistelligen Dollarbereich."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "Belohnungen aus Saison 2, die nicht bis zum 22. Januar 2027 abgeholt werden, sind endgültig verloren."
  source: "2498f2f59530"
grass.rating.cons.2.text:
