kryptex-pearl.mining.pool_fee_note:
  text: "KRig berechnet auf Kryptex Pool 0% Miner-Gebühr. Kryptex nennt eine separate Pool-Gebühr von 3% für Pearl PPS+. Die Abhebungsgebühren hängen von der Methode ab."
