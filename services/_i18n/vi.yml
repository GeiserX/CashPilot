proxybase-xyz.disclosure.isp_risk:
  text: "Có thật, và áp dụng trực tiếp cho kết nối gia đình. Lưu lượng proxy từ người mua không rõ danh tính đi ra dưới IP của bạn, nên khiếu nại lạm dụng sẽ tìm đến bạn. Danh mục này không giới hạn dịch vụ ở địa chỉ trung tâm dữ liệu, và IP dân cư kiếm nhiều hơn, nên động lực ở đây lại đi sai hướng: hãy đọc điều khoản của ISP trước khi chạy tại nhà."
