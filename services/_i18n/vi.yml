  source: "862333dc3a50"
iproyal.rating.cons.4.text:
  text: "Chính sách quyền riêng tư nêu tên đơn vị vận hành, Pawns.App Ltd (công ty số 16043795 tại Anh và xứ Wales), mà Companies House cho thấy được thành lập ngày 28 tháng 10 năm 2024, chưa đầy ba năm trước."
