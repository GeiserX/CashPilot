proxybase-xyz.docker.setup:
  text: "Container tự khởi tạo ở lần khởi động đầu tiên: tạo một ví secp256k1 (BIP-39), xác thực bằng cơ chế challenge-response ECDSA, và bắt đầu bán băng thông ở chế độ chỉ trực tiếp. Toàn bộ trạng thái (ví, token phiên, cấu hình người bán) được lưu trong volume <code>proxybase-data</code>. Hãy xem nhật ký container ở lần chạy đầu để biết địa chỉ ví. Dùng <code>--upstream</code> để thêm đường bán lại proxy bên ngoài.\n"
  source: "687c4243b292"
proxybase-xyz.docker.critical_volumes.0.holds:
  text: "Tệp khóa của ví được tạo. Volume này CHÍNH LÀ tiền: không có bản sao nào phía máy chủ, nên xóa nó là mất luôn số tiền."
  source: "e068cfb775cf"
proxybase-xyz.earnings.notes:
  text: "Thu nhập dựa trên số GB bán được theo giá thị trường. IP VPS/trung tâm dữ liệu kiếm ít hơn IP dân cư. Chế độ nhiều upstream có thể kết hợp băng thông của bạn với proxy bên ngoài."
