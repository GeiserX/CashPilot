  text: "Mức tối thiểu $15, phí USDT từ $1 đến $3, và chuyển khoản ngân hàng chỉ từ $1.000."
  source: "1e1a5493f40f"
earnfm.rating.cons.1.text:
  text: "Trước lần thanh toán đầu tiên, bạn phải điền hồ sơ thanh toán với họ tên pháp lý và địa chỉ."
  source: "bec69b884da2"
earnfm.rating.cons.2.text:
  text: "Các đánh giá năm 2025 cho biết bộ phận hỗ trợ qua email và Discord không trả lời; Trustpilot ghi nhận Earn.fm chưa phản hồi các đánh giá tiêu cực."
  source: "cb53e3b66c35"
earnfm.rating.pros.0.text:
  text: "Earn.fm phát hành image Docker riêng, earnfm/earnfm-client."
  source: "0be7297e2539"
ebesucher.description:
  text: "Ebesucher là một nền tảng trao đổi lưu lượng, nơi bạn kiếm điểm bằng cách truy cập website qua một surfbar tự động. Chạy dưới dạng tiện ích/add-on trình duyệt. Đây không phải dịch vụ chia sẻ băng thông thông thường — nó tạo lưu lượng bằng cách tự động duyệt web.\n"
  source: "d634f4bfa5b6"
ebesucher.short_description:
  text: "Surfbar trao đổi lưu lượng - tiện ích trình duyệt"
  source: "a1396a23b7e4"
ebesucher.earnings.notes:
  text: "Thu nhập bằng điểm BTP quy đổi được sang EUR. Chỉ có tiện ích trình duyệt."
  source: "0fc656e16790"
ebesucher.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
ebesucher.cashout.notes:
  text: "Thanh toán bằng euro qua PayPal hoặc chuyển khoản ngân hàng."
  source: "abf928e1d583"
ebesucher.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
ebesucher.rating.cons.0.text:
  text: "CashPilot không chạy eBesucher: đây là tiện ích trình duyệt, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "5dd331c10c14"
ebesucher.rating.pros.0.text:
  text: "Thanh toán từ 2 euro qua PayPal hoặc SEPA, ít nhất mỗi tuần một lần, không mất phí."
  source: "8513a736559f"
ebesucher.rating.pros.1.text:
  text: "eBesucher hoạt động từ năm 2002."
  source: "8cd95da74eec"
ebesucher.rating.pros.2.text:
  text: "Trang thông tin pháp lý nêu tên đơn vị vận hành, TurboAd GmbH, đăng ký tại Berlin-Charlottenburg (HRB 160730 B)."
  source: "84cbddd4330b"
flux.description:
  text: "Flux là một hạ tầng điện toán phân tán toàn cầu. Người vận hành nút stake token FLUX và cung cấp tài nguyên máy chủ. Ba hạng: Cumulus (1.000 FLUX), Nimbus (12.500 FLUX), Stratus (40.000 FLUX). Có image Docker chính thức.\n"
  source: "02dfc13a22fc"
flux.short_description:
  text: "Điện toán phi tập trung - cần stake token FLUX"
  source: "ba2bca8449db"
flux.earnings.notes:
  text: "Cần stake 1.000+ FLUX (~$50-500 tùy giá). Hạng cao hơn cần nhiều tài sản thế chấp hơn nhưng kiếm nhiều hơn."
  source: "a8f6679daf85"
flux.payment.frequency:
  text: "Phần thưởng khối"
  source: "590433237f8a"
flux.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
flux.requirements.min_bandwidth:
  text: "25 Mbps"
  source: "414c5c9be937"
flux.requirements.min_storage:
  text: "220GB"
  source: "fd0df44a57f5"
flux.rating.cons.0.text:
  text: "Hạng nút nhỏ nhất cần khóa 1.000 FLUX làm tài sản thế chấp."
  source: "a69f2d39e25d"
flux.rating.cons.1.text:
  text: "Phần thưởng khối giảm 10% mỗi năm, và một hướng dẫn năm 2026 nhận thấy phần thưởng của hạng nhỏ khá thấp nếu tính bằng đô la."
  source: "1d37f3333e5f"
flux.rating.cons.2.text:
  text: "CashPilot không chạy Flux: bạn dùng phần mềm nút riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "202359e2fa37"
flux.rating.pros.0.text:
  text: "Daemon Flux là mã nguồn mở theo giấy phép MIT."
  source: "1d44e028b43d"
golem.description:
  text: "Golem Network là một chợ điện toán phi tập trung, nơi bạn chia sẻ tài nguyên CPU và GPU để đổi lấy token GLM. Nhà cung cấp chạy agent Yagna, agent này quản lý việc thực thi công việc trong môi trường sandbox. Một trong những dự án điện toán phi tập trung lâu đời nhất (thành lập năm 2016). Hỗ trợ tác vụ CPU, render bằng GPU và điện toán đa dụng. Thanh toán qua Polygon L2.\n"
  source: "9a6843f56459"
golem.short_description:
  text: "Chợ điện toán phi tập trung - token GLM qua agent Yagna"
  source: "88f817c25848"
golem.earnings.notes:
  text: "Thu nhập phụ thuộc vào phần cứng, giá đặt và nhu cầu tác vụ. Nút chỉ có CPU kiếm ít hơn. Nút GPU kiếm nhiều hơn nhưng cần NVIDIA. Chạy agent nhà cung cấp Yagna (không phải image Docker). Thanh toán trên Polygon bằng token GLM."
  source: "07287d437d51"
golem.payment.frequency:
  text: "Mỗi khi hoàn thành tác vụ"
  source: "1036d0c453bb"
golem.cashout.notes:
  text: "Kiếm được token GLM. Cấu hình ví nhận thanh toán trong phần thiết lập nhà cung cấp."
  source: "b796f82bcc3a"
golem.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
golem.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
golem.requirements.min_storage:
  text: "20GB"
  source: "f889bc49e99f"
golem.rating.cons.0.text:
  text: "CashPilot không chạy Golem: bạn tự cài agent nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Golem có tài liệu hướng dẫn chạy nhà cung cấp trong image Docker riêng của họ."
  source: "f3276e47b782"
golem.rating.pros.0.text:
  text: "Agent nhà cung cấp, yagna, là mã nguồn mở theo GPL-3.0."
  source: "bcacb899db4f"
golem.rating.pros.1.text:
  text: "Không cần tài khoản: bạn đặt ví nhận thanh toán trong phần thiết lập nhà cung cấp."
  source: "46c47cc22b05"
golem.rating.pros.2.text:
  text: "Mạng đã hoạt động khoảng mười năm."
  source: "c2cf7bd5f171"
golem.rating.pros.3.text:
  text: "Chính sách quyền riêng tư của Golem nêu tên đơn vị vận hành, Golem Factory GmbH tại Zug, Thụy Sĩ."
  source: "bae79b651923"
grass.description:
  text: "Grass là một mạng phi tập trung cho phép bạn bán băng thông chưa dùng để làm dữ liệu huấn luyện AI. Nó hoạt động dưới dạng tiện ích trình duyệt và ứng dụng desktop, định tuyến các yêu cầu thu thập dữ liệu web qua kết nối của bạn để xây dựng bộ dữ liệu có cấu trúc. Với hơn 8.5M người dùng, đây là một trong những mạng băng thông DePIN lớn nhất. Kiếm token GRASS trên blockchain Solana.\n"
  source: "046951d812f9"
grass.short_description:
  text: "Chia sẻ băng thông DePIN cho dữ liệu AI - kiếm token GRASS"
  source: "75e8627ac8ff"
grass.docker.env.GRASS_ACCESS_TOKEN.label:
  text: "Token truy cập"
  source: "f9db72ced1ee"
grass.docker.env.GRASS_ACCESS_TOKEN.description:
  text: "Đăng nhập tại <a href=\"https://app.grass.io\">app.grass.io</a>, nhấn F12 → Application → Local Storage → nhấp <code>https://app.grass.io</code> → sao chép giá trị <code>token</code>"
  source: "635dbccffc75"
grass.earnings.notes:
  text: "Kiếm Grass Points quy đổi được sang token GRASS qua các đợt airdrop. Giá trị USD thực tế phụ thuộc vào giá token. Cần tiện ích trình duyệt hoặc ứng dụng desktop."
  source: "da61137319f8"
grass.payment.frequency:
  text: "Airdrop theo epoch"
  source: "4feb7a217efd"
grass.cashout.notes:
  text: "Phần thưởng đến dưới dạng các đợt phân phối định kỳ, nhận trên bảng điều khiển Grass. Đợt phân phối Stage 2 (hoạt động từ tháng 10 năm 2024 đến tháng 6 năm 2026) được trả bằng USDC: hãy nhận trên app.grass.io/dashboard chậm nhất vào ngày 22 tháng 1 năm 2027, hoặc sớm hơn nếu toàn bộ phần phân bổ đã được nhận hết trước đó. Grass giữ lại các phần thưởng không được nhận."
  source: "b46ff0a210b4"
grass.payout.notes:
  text: "Tích lũy ĐIỂM; GRASS được nhận từ bảng điều khiển Grass trong các đợt airdrop định kỳ."
  source: "14879f750890"
grass.collector.credential_hint:
  text: "Đăng nhập tại <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, nhấn F12 → Application → Local Storage, sao chép giá trị <b>accessToken</b>."
  source: "67fc88ee45fb"
grass.referral.bonus.referrer:
  text: "20% điểm thời gian hoạt động của người được giới thiệu trực tiếp, 10% ở cấp thứ hai, 5% ở cấp thứ ba"
  source: "6f5f70c2d5cd"
grass.obligations.claim-stage2-usdc.title:
  text: "Nhận USDC Stage 2 của Grass"
  source: "da0c06c48ac0"
grass.obligations.claim-stage2-usdc.loss:
  text: "Grass giữ lại mọi phần phân bổ Stage 2 chưa được nhận khi hết ngày 22/01/2027, và thời hạn có thể kết thúc sớm hơn khi toàn bộ phần phân bổ đã được nhận."
  source: "bd617e4fca90"
grass.obligations.claim-stage2-usdc.how:
  text: "Đăng nhập app.grass.io bằng tài khoản bạn đã dùng trong Stage 2, kích hoạt Grass Wallet, mở tab Allocation và xác nhận. Chỉ nhận trên app.grass.io. Không có điểm Stage 2? Chọn Không dành cho tôi."
  source: "803f5486c467"
grass.rating.cons.0.text:
  text: "Phần thưởng chỉ đến qua các mùa airdrop. Những người vận hành nút lâu năm cho biết ước tính mùa 2 chỉ ở mức vài đô la đến vài chục đô la."
  source: "ebf2e9c97963"
grass.rating.cons.1.text:
  text: "Phần thưởng mùa 2 chưa được nhận khi hết ngày 22 tháng 1 năm 2027 sẽ mất vĩnh viễn."
  source: "2498f2f59530"
grass.rating.cons.2.text:
  text: "Đợt airdrop đầu tiên vấp phải phản ứng gay gắt vì phần thưởng trên mỗi điểm quá ít, bị chia nhỏ cho hơn hai triệu người dùng."
  source: "9ff2dd4985d5"
grass.rating.cons.3.text:
  text: "CashPilot không chạy Grass: bạn dùng ứng dụng hoặc tiện ích riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "d318e920488a"
grass.rating.pros.0.text:
  text: "Đợt airdrop đầu tiên có gần 1.5 triệu địa chỉ nhận thưởng."
  source: "a4c55e10affa"
helium.description:
  text: "Helium là một mạng không dây phi tập trung đã có tên tuổi. Ban đầu là các hotspot LoRaWAN, nay mở rộng sang 5G. Cần phần cứng chuyên dụng ($500+). Kiếm token HNT/MOBILE. Tỷ suất hoàn vốn đã giảm mạnh - thường $4-8/tháng.\n"
  source: "18a56f04dce4"
helium.short_description:
  text: "Mạng không dây phi tập trung - cần phần cứng, token HNT"
  source: "d0736e0a0920"
helium.earnings.notes:
  text: "Cần mua phần cứng $500+. Tỷ suất hoàn vốn đã giảm mạnh. Có quy trình phê duyệt cho người vận hành mới."
  source: "08f96e23aa20"
helium.payment.frequency:
  text: "Theo epoch"
  source: "75743e03bad2"
helium.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
helium.rating.cons.0.text:
  text: "HIP 149 đã bỏ phần thưởng Proof-of-Coverage vào ngày 6 tháng 7 năm 2026; hotspot IoT giờ chỉ kiếm tiền từ dữ liệu chúng truyền, và hơn 114.000 hotspot không truyền chút dữ liệu nào."
  source: "e05c0111696f"
helium.rating.cons.1.text:
  text: "Mô hình phần thưởng của Helium đã thay đổi qua bỏ phiếu nhiều lần, CEO đã từ chức, và HNT giảm khoảng 96%."
  source: "4a7f931ec013"
helium.rating.cons.2.text:
  text: "CashPilot không chạy Helium: bạn dùng phần cứng hotspot riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "4828f2a97494"
helium.rating.pros.0.text:
  text: "Phần mềm gateway của hotspot là mã nguồn mở theo giấy phép Apache-2.0."
  source: "0bfd3d74c093"
herominers-kas.description:
  text: "Theo dõi số dư Kaspa chưa thanh toán mà HeroMiners đang giữ cho địa chỉ nhận thanh toán công khai của bạn. Hãy tự chạy máy đào Kaspa và trỏ nó tới pool. CashPilot đọc số dư của pool và yêu cầu bạn xác nhận khoản thanh toán khi số dư giảm.\n"
  source: "d27cc4c96f02"
herominers-kas.short_description:
  text: "Pool đào Kaspa, theo dõi qua địa chỉ nhận thanh toán của bạn"
  source: "92c5784dcf30"
herominers-kas.payment.minimum_payout:
  text: "1 KAS (có thể điều chỉnh)"
  source: "d33ca7065ff9"
herominers-kas.payment.frequency:
  text: "Pool kiểm tra ngưỡng thanh toán của bạn mỗi giờ"
  source: "eb78dff751e8"
herominers-kas.cashout.notes:
  text: "HeroMiners tự động thanh toán vào địa chỉ của bạn khi bạn đạt ngưỡng đã chọn. Ngưỡng thấp nhất là 1 KAS.\n"
  source: "ec7d597521ec"
herominers-kas.payout.notes:
  text: "Số dư được tích lũy tại HeroMiners. Hãy kiểm tra số tiền đã nhận trong ví trước khi xác nhận khoản thanh toán trong CashPilot.\n"
  source: "547b95fc6f1f"
herominers-kas.collector.credential_hint:
  text: "Nhập đầy đủ địa chỉ nhận thanh toán Kaspa công khai mà máy đào của bạn dùng trên HeroMiners. Bao gồm tiền tố <b>kaspa:</b> và bỏ tên worker.\n"
  source: "11b04c49529a"
herominers-kas.requirements.note:
  text: "Cần một máy đào Kaspa trỏ tới HeroMiners"
  source: "898e36e7a701"
herominers-kas.disclosure.sells:
  text: "điện toán"
  source: "b04a12f6483e"
herominers-kas.disclosure.third_party_traffic:
  text: "Không. Máy đào của bạn gửi công việc đào tới pool."
  source: "2e13888ee2d6"
herominers-kas.disclosure.data_collected:
  text: "Thống kê công khai của pool hiển thị từng địa chỉ nhận thanh toán và hoạt động đào của nó."
  source: "672cec455360"
herominers-kas.disclosure.account_rules:
  text: "Pool dùng địa chỉ nhận thanh toán của bạn thay cho tài khoản."
  source: "93ed10865cd2"
herominers-kas.rating.cons.0.text:
  text: "Pool thu phí 0.9% và giữ khoản thanh toán cho đến khi bạn đạt ngưỡng."
  source: "7eb2950589fa"
honeygain.description:
  text: "Chia sẻ băng thông internet chưa dùng và kiếm thu nhập thụ động. Honeygain định tuyến lưu lượng thu thập dữ liệu web, phân phối nội dung và nghiên cứu thị trường qua kết nối của bạn. Một trong những nền tảng chia sẻ băng thông lâu đời nhất với hơn 12M người dùng và hơn 1M khoản thanh toán đã hoàn tất.\n"
  source: "b219f969ba34"
honeygain.short_description:
  text: "Chia sẻ băng thông - nền tảng lâu đời nhất"
  source: "c0542c471f29"
