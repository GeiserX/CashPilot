proxybase-xyz.description:
  text: "ProxyBase Markets là một chợ proxy SOCKS5 dành cho AI agent. Người bán chạy một daemon CLI nhẹ viết bằng Rust, kết nối qua WebSocket để chuyển tiếp lưu lượng của người mua qua kết nối internet của họ, kiếm USDC trên Tempo Chain theo mỗi GB bán được. Hỗ trợ cả chế độ trực tiếp (băng thông của chính bạn) và upstream (bán lại proxy bên ngoài) với tự động kết nối lại. Người mua mua phiên proxy theo quốc gia, ISP và băng thông. Thanh toán đi qua Machine Payments Protocol (MPP) trên Tempo Chain. Liên kết giới thiệu dành cho người mua: người mua mở console qua liên kết này được thêm 10% cho lần nạp đầu tiên.\n"
