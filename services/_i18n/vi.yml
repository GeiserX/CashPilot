iproyal.rating.cons.0.text:
  text: "Điều khoản cho biết tài khoản có thể bị khóa mà không báo trước nếu lạm dụng điều kiện rút tiền hoặc dùng nhiều tài khoản, và khi đó thu nhập có thể không được thanh toán."
  source: "85027b205641"
iproyal.rating.cons.1.text:
