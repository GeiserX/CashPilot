iproyal.docker.health_signals.1.means:
  text: "Pawns thấy một thiết bị khác đang hoạt động trên địa chỉ IP này và chỉ trả cho một thiết bị mỗi IP, nên bản sao này vẫn chạy nhưng không chia sẻ gì và không kiếm được gì. Hãy dừng mọi ứng dụng Pawns khác trên IP này, dù ở máy khác, PC hay điện thoại. Nếu không có cái nào, hãy chờ Pawns gỡ thiết bị cũ, hoặc nhờ bộ phận hỗ trợ của Pawns giải phóng nó."
  source: "64e79b0e73b4"
