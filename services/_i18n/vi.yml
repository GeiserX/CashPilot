2miners-etc.description:
  text: "Theo dõi số dư Ethereum Classic chưa thanh toán mà 2Miners đang giữ cho địa chỉ nhận thanh toán ETC công khai của bạn. Hãy tự chạy máy đào và trỏ nó tới pool. CashPilot đọc số dư và yêu cầu bạn xác nhận khoản thanh toán khi số dư giảm.\n"
  source: "747461faaaff"
2miners-etc.short_description:
  text: "Pool đào Ethereum Classic, theo dõi qua địa chỉ nhận thanh toán của bạn"
  source: "9a19622426b4"
2miners-etc.payment.minimum_payout:
  text: "0.1 ETC (có thể điều chỉnh)"
  source: "81237ec07067"
2miners-etc.payment.frequency:
  text: "Pool kiểm tra ngưỡng thanh toán của bạn mỗi hai giờ"
  source: "0db320b4148d"
2miners-etc.cashout.notes:
  text: "2Miners tự động thanh toán vào địa chỉ của bạn khi bạn đạt ngưỡng đã chọn. Ngưỡng thấp nhất cho khoản thanh toán ETC là 0.1 ETC.\n"
  source: "67ca63927abf"
2miners-etc.payout.notes:
  text: "Số dư chưa thanh toán được tích lũy tại 2Miners. Số dư ví là một lần đọc riêng từ Ethereum Classic. Hãy kiểm tra số tiền đã nhận trong ví trước khi xác nhận khoản thanh toán trong CashPilot.\n"
  source: "72e95aebfc18"
2miners-etc.collector.credential_hint:
  text: "Nhập địa chỉ nhận thanh toán Ethereum Classic công khai mà máy đào của bạn dùng trên 2Miners, bắt đầu bằng <b>0x</b>. Không thêm tên worker.\n"
  source: "70b5e684377a"
2miners-etc.requirements.note:
  text: "Cần một máy đào ETCHash trỏ tới 2Miners"
  source: "259f94834811"
2miners-etc.disclosure.sells:
  text: "điện toán"
  source: "b04a12f6483e"
2miners-etc.disclosure.third_party_traffic:
  text: "Không. Máy đào của bạn gửi công việc đào tới pool."
  source: "2e13888ee2d6"
2miners-etc.disclosure.data_collected:
  text: "Pool sử dụng địa chỉ nhận thanh toán, tên worker bạn chọn và địa chỉ IP của máy đào."
  source: "1bae14e78937"
2miners-etc.disclosure.account_rules:
  text: "Bất kỳ ai cũng có thể xem thống kê theo địa chỉ nhận thanh toán. Để đổi ngưỡng, pool yêu cầu xác nhận IP của worker."
  source: "d2a40ebb0088"
2miners-etc.rating.cons.0.text:
  text: "Pool thu phí 1% và giữ khoản thanh toán cho đến khi bạn đạt ngưỡng."
  source: "b47e2ed1a2ed"
anyone-protocol.description:
  text: "Anyone Protocol (trước đây là ATOR) là một mạng riêng tư định tuyến onion phi tập trung. Người vận hành nút chạy các nút relay và nhận token ANYONE cho băng thông đóng góp. Có thể hình dung là \"Tor có thưởng\". CashPilot chạy nó từ image riêng, được build từ gói Debian đã ký của dự án, cho amd64 và arm64. Cấu hình dựa trên tệp, qua tệp anonrc được gắn vào container (Nickname, ContactInfo, ORPort, v.v.). Một relay không kiếm được gì cho đến khi có 100 ANYONE được khóa cho nó trong ít nhất 180 ngày, và phần thưởng được nhận bằng cách ký trong ví của bạn. Relay cũng đưa IP công khai của bạn vào danh bạ relay của mạng, điều này có thể làm giảm uy tín IP mà các ứng dụng băng thông dân cư trả tiền cho.\n"
  source: "386991ed6f0d"
anyone-protocol.short_description:
  text: "Định tuyến onion phi tập trung - nút relay Tor có thưởng"
  source: "08395b97ce31"
anyone-protocol.docker.critical_volumes.0.holds:
  text: "Khóa danh tính ed25519 của relay. Xóa nó sẽ chấm dứt uy tín của relay và đưa lịch sử thu nhập về con số không."
  source: "f299f20448cf"
anyone-protocol.earnings.notes:
  text: "Chỉ trả khi có 100 ANYONE được khóa cho mỗi relay trong ít nhất 180 ngày và một yêu cầu nhận thưởng được ký trong ví của bạn. Không có khoản stake này, relay không kiếm được gì. Khi có, thu nhập phụ thuộc vào băng thông đóng góp và thời gian hoạt động."
  source: "543e9f06e1be"
anyone-protocol.payment.frequency:
  text: "Theo epoch"
  source: "75743e03bad2"
anyone-protocol.payout.notes:
  text: "Đặt làm ContactInfo trong anonrc, với tiền tố '@anon:0x...'."
  source: "c1a9df600b29"
anyone-protocol.collector.credential_hint:
  text: "Các fingerprint của relay, phân tách bằng dấu phẩy. Không bảng điều khiển trực tuyến nào hiển thị chúng. Với relay do CashPilot chạy, hãy chạy <b>docker exec cashpilot-anyone-protocol cat /var/lib/anon/fingerprint</b> trên máy chủ đang chạy nó. Với relay phần cứng, hãy mở Relay Control Panel của nó tại <b>http://relayup.local</b> và xem Fingerprint trên trang Home.\n"
  source: "ffa5be0d4953"
anyone-protocol.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
anyone-protocol.disclosure.sells:
  text: "Băng thông, với vai trò relay trong mạng Anyone (một bản fork của Tor)."
  source: "87745f627646"
anyone-protocol.disclosure.third_party_traffic:
  text: "Có. Nó chuyển tiếp lưu lượng của người khác. IP của bạn có phải là chặng cuối hay không tùy vào việc relay có được cấu hình làm nút thoát hay không."
  source: "2f0ad3858a2b"
anyone-protocol.disclosure.data_collected:
  text: "Khóa danh tính công khai của relay, IP và cổng của bạn, cùng thống kê thời gian hoạt động, tất cả đều được công bố lên danh bạ của mạng theo thiết kế. Nếu bạn đặt ContactInfo trong anonrc, giá trị đó cũng được công bố ở đó và được lập chỉ mục công khai vĩnh viễn — thường đó là một địa chỉ email, nên hãy để trống trừ khi bạn muốn nó công khai."
  source: "df790fb50263"
anyone-protocol.disclosure.isp_risk:
  text: "Có thật. Lưu lượng relay được quy cho kết nối của bạn. Đặc biệt các relay thoát hay bị khiếu nại lạm dụng; nhiều ISP dân dụng cấm chúng."
  source: "d459ba0e209d"
anyone-protocol.disclosure.account_rules:
  text: "Không có tài khoản nào để đăng ký, nên không có gì để giới hạn theo tài khoản. Để kiếm tiền, bạn vẫn cần một ví Ethereum có 100 ANYONE được khóa cho mỗi relay trong ít nhất 180 ngày, và CashPilot cần fingerprint của relay để đọc phần thưởng. Dự án không công bố giới hạn relay theo IP, và danh mục cũng không khai báo giới hạn nào."
  source: "291f7428f6a2"
anyone-protocol.rating.cons.0.text:
  text: "Một relay không kiếm được gì trừ khi có 100 ANYONE được khóa cho nó trong ít nhất 180 ngày, và mỗi lần nhận thưởng đều phải ký trong ví của bạn."
  source: "28f5fad0e47d"
anyone-protocol.rating.cons.1.text:
  text: "Theo thiết kế, nó chuyển tiếp lưu lượng của người khác mà không kiểm tra họ là ai; các relay thoát hay bị khiếu nại lạm dụng."
  source: "4627257ae65e"
anyone-protocol.rating.cons.2.text:
  text: "Danh tính, IP và thời gian hoạt động của relay được công bố lên danh bạ của mạng, và mọi ContactInfo bạn đặt sẽ công khai vĩnh viễn."
  source: "adb751a90cda"
anyone-protocol.rating.pros.0.text:
  text: "Không có tài khoản nào để đăng ký. Một relay chỉ cần một ví, không cần xác minh danh tính."
  source: "7a5284c217e4"
anyone-protocol.rating.pros.1.text:
  text: "Phần mềm relay là một bản fork công khai của Tor, theo giấy phép của Tor."
  source: "0574b7d829b6"
anyone-protocol.rating.pros.2.text:
  text: "CashPilot tự build image từ phần mềm relay mà Anyone công bố, không cần tài khoản."
  source: "2e36c9093df6"
bitping.description:
  text: "Bitping là một nền tảng giám sát mạng phi tập trung trả tiền cho bạn khi chạy một nút. Nút của bạn giám sát website, đo độ trễ và kiểm tra chất lượng mạng cho khách hàng của Bitping. Hoạt động trên cả kết nối dân cư lẫn VPS. Image Docker đăng nhập bằng các biến môi trường BITPING_EMAIL và BITPING_PASSWORD ở lần khởi động đầu tiên (\"Attempting login with environment variables\" trong nhật ký của chính nó), sau đó lưu phiên trong volume được gắn để các lần khởi động lại không phải xác thực lại.\n"
  source: "6da6f3949103"
bitping.short_description:
  text: "Chia sẻ băng thông - giám sát mạng phi tập trung, chạy được trên VPS"
  source: "9ed1674242c5"
bitping.docker.env.BITPING_EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
bitping.docker.env.BITPING_PASSWORD.label:
  text: "Mật khẩu"
  source: "e7cf3ef4f17c"
bitping.docker.env.BITPING_EMAIL.description:
  text: "Email tài khoản Bitping của bạn (cùng thông tin đăng nhập với <a href='https://app.bitping.com' target='_blank'>app.bitping.com</a>)"
  source: "3b8f428e73bc"
bitping.docker.env.BITPING_PASSWORD.description:
  text: "Mật khẩu tài khoản Bitping của bạn. Chỉ dùng một lần để tạo phiên cho nút, sau đó phiên được lưu trong volume dữ liệu."
  source: "acb49b137850"
bitping.earnings.notes:
  text: "Thu nhập phụ thuộc vào chất lượng mạng và nhu cầu giám sát từ vị trí của bạn. Chấp nhận nút VPS."
  source: "4f1c5f96b80e"
bitping.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
bitping.cashout.notes:
  text: "Thu nhập của nút nằm trên nodes.bitping.com; app.bitping.com là bảng điều khiển cho khách hàng API. Chỉ rút được bằng SOL: khi số dư chưa thanh toán vượt $0.05, hãy nhập địa chỉ Solana vào yêu cầu, được xử lý trong vòng 24 giờ. Một ví Solana mới hoặc trống cần có sẵn khoảng 0.001 SOL trước, cho mức tiền thuê tối thiểu của mạng."
  source: "fdc63e6d572b"
bitping.payout.notes:
  text: "Hiện chỉ dùng Solana, và địa chỉ được nhập VÀO LÚC RÚT TIỀN thay vì được lưu sẵn."
  source: "e34576107a98"
bitping.collector.credential_hint:
  text: "Dùng email và mật khẩu tài khoản Bitping của bạn (giống với <a href='https://nodes.bitping.com' target='_blank'>nodes.bitping.com</a>)."
  source: "e7173a122598"
bitping.obligations.withdraw-before-12-month-forfeit.title:
  text: "Rút số dư Bitping của bạn"
  source: "469c2e1bdbef"
bitping.obligations.withdraw-before-12-month-forfeit.loss:
  text: "Bitping có thể tịch thu thu nhập không được nhận trong hơn 12 tháng, sau khi báo trước 30 ngày qua email."
  source: "4bb16828d6be"
bitping.obligations.withdraw-before-12-month-forfeit.how:
  text: "Gửi yêu cầu rút SOL trên nodes.bitping.com và nhập địa chỉ Solana của bạn vào yêu cầu."
  source: "e3b5db7e604b"
bitping.rating.cons.0.text:
  text: "Tiền rút được trả bằng Solana (SOL), vào địa chỉ bạn nhập trong mỗi yêu cầu."
  source: "e339ed3b3d01"
bitping.rating.cons.1.text:
  text: "Trang trợ giúp của Bitping cho biết việc rút về một ví Solana mới, trống có thể thất bại cho đến khi bạn tự nạp một ít SOL vào ví đó."
  source: "c805fc86ffe4"
bitping.rating.pros.0.text:
  text: "Trang trợ giúp của Bitping cho biết máy chủ và container Docker đều được hỗ trợ."
  source: "e472a4936057"
bitping.rating.pros.1.text:
  text: "Một lần rút chỉ cần một địa chỉ Solana nhập vào yêu cầu."
  source: "57f0e1d81433"
bytebenefit.description:
  text: "Bytebenefit là dịch vụ chia sẻ băng thông trả tiền qua PayPal và Stripe. Không có image Docker chính thức; ứng dụng desktop Windows và ứng dụng Android là các client. Dịch vụ nằm tại bytebenefit.io -- tên miền cũ bytebenefit.com đã bị bỏ và đang được rao bán trên một chợ tên miền, đó là lý do nó từng bị đánh dấu là đã ngừng ở đây.\n"
  source: "bd969b0c277e"
bytebenefit.short_description:
  text: "Chia sẻ băng thông - thanh toán qua PayPal/Stripe, ứng dụng desktop/Android"
  source: "db7c950262ba"
bytebenefit.earnings.notes:
  text: "Không có image Docker. Chỉ có ứng dụng desktop Windows và Android."
  source: "981d492a84fb"
bytebenefit.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
bytebenefit.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
bytebenefit.referral.bonus.referrer:
  text: "20% thu nhập từ lưu lượng của người được giới thiệu"
  source: "096a1e669ce2"
bytebenefit.referral.bonus.referee:
  text: "Thưởng chào mừng $1 (10.000 Coins)"
  source: "e51d68265bf4"
bytebenefit.rating.cons.0.text:
  text: "Trang Google Play của ứng dụng cho biết lưu lượng của bạn phục vụ các yêu cầu thu thập dữ liệu web của khách hàng Infatica, mà không nói họ là ai hay được kiểm tra thế nào."
  source: "2d17935e1e6c"
bytebenefit.rating.cons.1.text:
  text: "Ứng dụng Android đã rời Google Play vào tháng 4 năm 2026, sau 17 tháng."
  source: "1dc7dddf70fe"
bytebenefit.rating.cons.2.text:
  text: "CashPilot không chạy ByteBenefit: bạn dùng ứng dụng riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "550e4508aba2"
bytelixir.description:
  text: "Bytelixir giúp bạn kiếm thu nhập thụ động bằng cách chia sẻ băng thông internet chưa dùng đến. Chỉ hỗ trợ Windows và Android — FAQ chính thức cho biết không có kế hoạch làm client Linux hay Docker, iOS không được hỗ trợ và macOS không được cung cấp. Thu nhập phụ thuộc nhiều vào vị trí. Bảng điều khiển web tại dash.bytelixir.com để theo dõi. Không có image Docker.\n"
  source: "2ec58eb10494"
bytelixir.short_description:
  text: "Chia sẻ băng thông - chỉ Windows + Android"
  source: "071f817595d7"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.label:
  text: "Cookie phiên"
  source: "63d68f7e128e"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.label:
  text: "Cookie Remember Web"
  source: "12b9a9c2a4eb"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.label:
  text: "Token XSRF"
  source: "a40b4091608e"
bytelixir.docker.env.BYTELIXIR_SESSION_COOKIE.description:
  text: "Đăng nhập tại <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, nhấn F12 → Application → mở rộng <b>Cookies</b> ở thanh bên trái → nhấp mục con <code>https://dash.bytelixir.com</code> → trong danh sách cookie bên phải, tìm <code>bytelixir_session</code> → sao chép Value của nó (một JWT dài bắt đầu bằng eyJ)"
  source: "e555d739498a"
bytelixir.docker.env.BYTELIXIR_REMEMBER_WEB.description:
  text: "Cùng vị trí (Cookies → <code>https://dash.bytelixir.com</code>) → tìm cookie có tên <code>remember_web_...</code> → sao chép Value của nó (không bắt buộc, kéo dài thời gian phiên)"
  source: "af3d0da7126a"
bytelixir.docker.env.BYTELIXIR_XSRF_TOKEN.description:
  text: "Cùng vị trí → tìm <code>XSRF-TOKEN</code> → sao chép Value của nó (không bắt buộc)"
  source: "e638c59de75d"
bytelixir.earnings.notes:
  text: "Thu nhập thay đổi theo vị trí ($2-50/tháng). Không có image Docker. Cần ứng dụng desktop hoặc ứng dụng Android."
  source: "9c8718533f05"
bytelixir.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
bytelixir.cashout.notes:
  text: "Chỉ crypto. Mức tối thiểu tùy theo đồng coin: USDT $5, USDC $5, TON $8, LTC $10, ETH $40, BTC $250. Bạn nhập địa chỉ trong mỗi yêu cầu. Yêu cầu được xử lý trong giờ làm việc, trong vòng 24 giờ."
  source: "41145f17bdd1"
bytelixir.payout.notes:
  text: "Số dư do Bytelixir giữ; địa chỉ ví được nhập vào mỗi yêu cầu thanh toán, không bao giờ được lưu trong container."
  source: "58e23889cb05"
bytelixir.collector.credential_hint:
  text: "Đăng nhập tại <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>và đánh dấu Remember Me</b>, nhấn F12 → Application → mở rộng <b>Cookies</b> ở thanh bên trái → nhấp <code>https://dash.bytelixir.com</code>, rồi sao chép ba giá trị: <b>bytelixir_session</b>, <b>remember_web_…</b> (cookie dài bắt đầu bằng tiền tố đó) và <b>XSRF-TOKEN</b>. Riêng cookie phiên sẽ hết hạn khoảng hai giờ sau khi bạn sao chép, nên việc thu thập dừng ngay trong buổi chiều đó; cookie remember_web có hiệu lực một năm và chính nó giữ cho việc thu thập hoạt động."
  source: "5a3362c1c9fa"
bytelixir.referral.bonus.referrer:
  text: "50% lợi nhuận của họ trọn đời"
  source: "04db04d249f2"
bytelixir.referral.bonus.referee:
  text: "Thưởng chào mừng $1"
  source: "0fc234cbd148"
bytelixir.rating.cons.0.text:
