  source: "c710f405be6f"
kryptex-pearl.rating.pros.1.text:
  text: "KRig dùng một endpoint TLS công khai để gửi share Pearl tới Kryptex Pool."
  source: "fd21819f191a"
mysterium.description:
  text: "MystNodes (Mysterium Network) là một mạng VPN và proxy phi tập trung xây dựng trên công nghệ blockchain. Bạn kiếm token MYST bằng cách chạy một nút cung cấp dịch vụ VPN, proxy và thu thập dữ liệu cho người dùng. Cần các quyền NET_ADMIN, SETUID và SETGID cùng một thiết bị TUN, mà nó dùng bên trong network namespace riêng trên bridge có hàng rào dành cho ứng dụng kiếm tiền. Có sẵn giao diện web để quản lý nút. Chạy được trên cả kết nối dân cư lẫn VPS, nhưng thưởng giới thiệu chỉ được trả cho nút dùng IP dân cư.\n"
  source: "7d3687f6edbd"
mysterium.short_description:
  text: "Nút VPN phi tập trung - dựa trên blockchain, chạy được trên VPS"
  source: "ad1413ac81fa"
mysterium.docker.env.UI_ADDRESS.label:
  text: "Địa chỉ WebUI"
  source: "785ea576cfed"
mysterium.docker.env.UDP_PORTS.label:
  text: "Dải cổng UDP"
  source: "531a2e328ce3"
mysterium.docker.env.UI_ADDRESS.description:
  text: "Các địa chỉ trên máy chủ mà WebUI của nút (cổng 4449) được công bố. 127.0.0.1 giữ nó chỉ trên máy này. Để truy cập qua reverse proxy, hãy thêm địa chỉ mà proxy kết nối tới, phân tách bằng dấu phẩy và không có khoảng trắng: 127.0.0.1,172.18.0.1."
  source: "45c712be523e"
mysterium.docker.env.UDP_PORTS.description:
  text: "Các cổng UDP mà nút dùng cho phiên VPN, theo dạng bắt_đầu:kết_thúc. Hãy chuyển tiếp đúng dải này trên router. Mỗi phiên dùng khoảng hai cổng, nên 30 cổng mặc định phục vụ được khoảng 15 phiên cùng lúc, nhiều hơn số phiên một nút tại nhà nhận được. Dải rộng hơn không sửa được gì mà còn tốn hơn: mỗi cổng được công bố làm chậm việc khởi động và gỡ bỏ nút (300 cổng mất khoảng 12 s để khởi động), CashPilot chấp nhận tối đa 300, và với userland proxy mặc định của Docker, mỗi cổng còn tốn khoảng 2.5 MB bộ nhớ. Nếu mọi phiên đều thất bại thì đó là vấn đề của router, không phải do thiếu cổng: xem \"Routers that rewrite UDP source ports\" trong hướng dẫn Mysterium. Hãy giữ dưới 32768: các cổng 32768-60999 là dải cổng tạm của Linux, nơi bất kỳ chương trình nào trên máy chủ cũng có thể chiếm một cổng trong giây lát, và chỉ một cổng bị chiếm là nút không khởi động được. Nút đã có dải cổng sẽ giữ nguyên dải đó."
  source: "530524e2e718"
mysterium.docker.runtime_reason:
  text: "gVisor không cung cấp iptables-nft và WireGuard của nhân, những thứ dịch vụ cần để truyền lưu lượng."
  source: "d8a72a275579"
mysterium.docker.critical_volumes.0.holds:
  text: "Kho khóa danh tính của nút. Xóa nó sẽ tạo một danh tính hoàn toàn mới: nút mất uy tín và mọi thu nhập còn đang được giữ theo danh tính cũ."
  source: "97272764fec0"
mysterium.docker.health_signals.0.means:
  text: "Nút không chạy được sudo bên trong container, nên không thể cấu hình giao diện VPN hay tường lửa và mọi phiên đều thất bại ngay khi thiết lập: nó trông như đang trực tuyến nhưng không kiếm được gì. Container đã được tạo mà không có quyền SETUID và SETGID. Hãy cập nhật CashPilot và worker đang chạy nút này, rồi triển khai lại Mysterium từ bảng điều khiển; danh tính của nút nằm trong volume dữ liệu và được giữ nguyên."
  source: "8b06c9deb5fd"
mysterium.docker.health_signals.1.means:
  text: "Trong 6 giờ qua không có phiên VPN nào kết nối trực tiếp tới nút này. Tất cả đều phải dùng hole punching, và nhiều người mua không kết nối được theo cách đó, nên nút kiếm được ít hơn. Các cổng UDP của nút không truy cập được từ internet. Trên router, hãy chuyển tiếp dải cổng UDP ${UDP_PORTS} (bắt_đầu:kết_thúc, cùng một dải ở cả hai phía) tới ${HOST_ADDRESS}. Cảnh báo này tự biến mất khi có một phiên kết nối trực tiếp."
  source: "86ff9f3ffbb4"
mysterium.docker.health_probe.checks.0.means:
  text: "Hệ thống giám sát của Mysterium đánh dấu nút trên ${WORKER_NAME} là thất bại, nên nút bị loại khỏi danh sách nút mà hầu hết người mua chọn, kể cả khi lần kiểm tra của chính nút cho biết mọi cổng đều truy cập được. Trước tiên hãy đảm bảo nút có /dev/net/tun và SETUID/SETGID, vì thiếu chúng cũng gây lỗi y như vậy: https://geiserx.github.io/CashPilot/guides/mysterium/#running-but-not-earning-monitoring-failed-quality-0 Khi đã có những thứ đó, nguyên nhân thường gặp là router phía trước ${WORKER_NAME} ghi đè cổng nguồn UDP trong các phản hồi của nút sau khi một gói tin từ bên ngoài đã tới cổng đó. Xem bài kiểm tra trong hướng dẫn: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports"
  source: "f73f26fa929b"
mysterium.docker.health_probe.checks.1.means:
  text: "Năm phiên VPN gần nhất của nút trên ${WORKER_NAME} đều kết thúc sau khoảng một phút mà không truyền dữ liệu nào, nên nút không kiếm được gì dù trông như đang trực tuyến. Nguyên nhân có thể là router phía trước ${WORKER_NAME}: khi một gói tin từ bên ngoài tới một cổng, nó ghi đè cổng nguồn trong các phản hồi sau đó của nút từ cổng này, và mọi phiên đều bắt đầu bằng một gói tin như vậy (lần kiểm tra cổng của chính nút), nên người mua bỏ qua các phản hồi của nút. Dải cổng rộng hơn không giúp được gì. Xem bài kiểm tra và cách khắc phục trong hướng dẫn: https://geiserx.github.io/CashPilot/guides/mysterium/#routers-that-rewrite-udp-source-ports Cảnh báo này biến mất khi có một phiên truyền dữ liệu."
  source: "bfb5d5c77bf3"
mysterium.earnings.notes:
  text: "Thu nhập bằng token MYST. IP dân cư kiếm nhiều hơn đáng kể. WebUI của nút ở cổng 4449 để quản lý, mặc định chỉ được công bố trên chính máy chạy nó (127.0.0.1); từ máy khác, hãy mở đường hầm SSH trước (ssh -L 14449:127.0.0.1:4449 theo sau là địa chỉ máy chạy nút, rồi truy cập http://127.0.0.1:14449; cổng cục bộ 14449 để không xung đột với một nút trên máy của chính bạn), hoặc thêm một địa chỉ vào UI_ADDRESS (xem WebUI address trong hướng dẫn Mysterium). Chấp nhận VPS. Rất nên chuyển tiếp cổng UDP 23000-23029 (giá trị mặc định của UDP_PORTS) -- nếu không, nút bị gán trạng thái Strict NAT và nhiều phiên VPN thất bại, làm thu nhập giảm mạnh. Quan trọng: sau lần chạy đầu tiên, hãy đặt ví thụ hưởng (ví quyết toán) qua WebUI hoặc CLI của nút cho khớp với tài khoản mystnodes.com của bạn -- việc này liên kết thu nhập on-chain với bảng điều khiển đám mây của bạn."
  source: "d969069dbae3"
mysterium.payment.minimum_payout:
  text: "5 MYST"
  source: "6295c6ec8d64"
mysterium.payment.frequency:
  text: "Tự động quyết toán on-chain mỗi khi một nút giữ 5 MYST chưa quyết toán"
  source: "a30a1b9140d0"
mysterium.cashout.notes:
  text: "Không có nút nào để bấm. Mỗi nút tự quyết toán trên Polygon khi giữ 5 MYST chưa quyết toán, và khoảng 21% bị trừ phí (20% phí Hermes cộng một khoản phí giao dịch nhỏ), nên mỗi lần quyết toán khoảng 3.9 MYST về tới ví thụ hưởng. TequilAPI của mỗi nút liệt kê các lần quyết toán tại /transactor/settle/history. Con số \"total earnings\" trên MystNodes chỉ tính 30 ngày gần nhất; nó không phải số dư cũng không phải tổng từ trước đến nay. MYST thưởng từ chương trình phần thưởng MystNodes không tự quyết toán: hãy nhận nó trên trang Rewards, trong vòng 30 ngày kể từ khi phân phối theo trung tâm trợ giúp MystNodes."
  source: "35e2f300cdf3"
mysterium.payout.notes:
  text: "Ví thụ hưởng được đặt SAU khi triển khai, qua TequilAPI hoặc WebUI của nút -- không phải qua biến môi trường, nên không thể đọc nó từ cấu hình container."
  source: "1f9c67dc895a"
mysterium.collector.credential_hint:
  text: "Dùng email và mật khẩu tài khoản MystNodes của bạn (giống với <a href='https://my.mystnodes.com' target='_blank'>my.mystnodes.com</a>)."
  source: "33e956b7b9ad"
mysterium.referral.bonus.referrer:
  text: "5 MYST cho mỗi người bạn có nút kiếm được 5 MYST (chỉ IP dân cư)"
  source: "5b851641f2a7"
mysterium.referral.bonus.referee:
  text: "5 MYST khi nút của bạn kiếm được 5 MYST đầu tiên (IP dân cư, nút đã được nhận trên mystnodes.com)"
  source: "0368a5944c49"
mysterium.obligations.claim-monthly-rewards-pool.title:
  text: "Nhận phần thưởng MystNodes của tháng trước"
  source: "2d467a0c60a5"
mysterium.obligations.claim-monthly-rewards-pool.loss:
  text: "Phần thưởng không được nhận trong vòng 30 ngày kể từ đợt phân phối hằng tháng sẽ bị tịch thu và quay về quỹ thưởng của tháng sau."
  source: "e98e4c5a604b"
mysterium.obligations.claim-monthly-rewards-pool.how:
  text: "Mở trang Rewards và đổi điểm của bạn lấy MYST."
  source: "305cc1650e77"
mysterium.disclosure.sells:
  text: "Băng thông. Kết nối của bạn được dùng làm nút thoát cho mạng Mysterium, mạng này bán dịch vụ VPN, proxy VÀ thu thập dữ liệu. Lưu lượng thu thập dữ liệu đi ra từ IP dân cư là loại dễ bị khiếu nại nhất, và bạn không thể chọn nút của mình chuyển loại nào trong ba loại đó."
  source: "004fea96f9af"
mysterium.disclosure.third_party_traffic:
  text: "Có. Người lạ định tuyến lưu lượng của họ qua địa chỉ IP của bạn — đó chính là sản phẩm."
  source: "7ba94dcdb6fd"
mysterium.disclosure.data_collected:
  text: "Danh tính nút (một địa chỉ blockchain), IP của bạn và vị trí tương đối (quốc gia/thành phố/ISP), được nút công bố lên mạng để người mua có thể chọn."
  source: "4a84822767e1"
mysterium.disclosure.isp_risk:
  text: "Có thật và đáng tìm hiểu kỹ. Lưu lượng của người khác đi ra từ kết nối của bạn và được quy cho bạn, nên mọi việc họ làm đều trông như xuất phát từ đường truyền của bạn. Nhiều hợp đồng ISP dân dụng cấm việc này. Hãy kiểm tra hợp đồng của bạn trước khi chạy."
  source: "cc0999704d14"
mysterium.disclosure.account_rules:
  text: "Không giới hạn số thiết bị theo tài khoản và theo IP."
  source: "04181838cbbc"
mysterium.rating.cons.0.text:
  text: "Khoảng 21% của mỗi lần quyết toán bị trừ phí, gồm 20% phí Hermes cộng phí giao dịch, và thu nhập được trả bằng token MYST."
  source: "b1995e485858"
mysterium.rating.cons.1.text:
  text: "Nút của bạn là điểm thoát cho khách hàng VPN, proxy và thu thập dữ liệu của Mysterium, và bạn không thể chọn nó chuyển lưu lượng của ai."
  source: "fec2996bf4fe"
mysterium.rating.pros.0.text:
  text: "Phần mềm nút là mã nguồn mở theo GPL-3.0."
  source: "35cdbfdd396b"
mysterium.rating.pros.1.text:
  text: "Mysterium phát hành image Docker riêng, mysteriumnetwork/myst."
  source: "9d195a76812c"
mysterium.rating.pros.2.text:
  text: "Tiền quyết toán về ví do bạn sở hữu; không cần số điện thoại hay giấy tờ tùy thân."
  source: "5de52ab5bcc5"
mysterium.rating.pros.3.text:
  text: "Dự án nút đã hoạt động từ năm 2017."
  source: "f4e75acc2227"
mysterium.rating.pros.4.text:
  text: "Website của Mysterium cho biết mạng được phát triển bởi Blockdev AG, Zug, Thụy Sĩ."
  source: "7764b2d4ac85"
nodepay.description:
  text: "Nodepay là một mạng DePIN thưởng cho người dùng chia sẻ băng thông qua tiện ích trình duyệt. Nền tảng được bảo vệ bởi Cloudflare, điều này có thể gây khó cho việc truy cập tự động. Người dùng kiếm Nodepay Points bằng cách giữ tiện ích hoạt động. Mạng tập trung vào cung cấp hạ tầng dữ liệu huấn luyện AI.\n"
  source: "1fce773d6b34"
nodepay.short_description:
  text: "Chia sẻ băng thông DePIN cho AI - tiện ích trình duyệt"
  source: "7aa93479e001"
nodepay.earnings.notes:
  text: "Kiếm Nodepay Points; điểm của người dùng vượt qua kiểm tra điều kiện của Nodepay được quy đổi sang token NC. Bảo vệ Cloudflare có thể chặn việc thu thập tự động. Cần tiện ích trình duyệt."
  source: "6a4c4b37179f"
nodepay.payment.frequency:
  text: "Airdrop token NC (chưa xác nhận thời gian)"
  source: "a52193cf5e1e"
nodepay.cashout.notes:
  text: "Hệ thống dựa trên điểm. Điểm của người dùng vượt qua kiểm tra điều kiện của Nodepay được quy đổi sang token NC, ra mắt vào tháng 1 năm 2025."
  source: "2ecac5788681"
nodepay.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
nodepay.rating.cons.0.text:
  text: "Trong đợt rà soát mùa đầu tiên, Nodepay đã xóa hơn 300.000 tài khoản mà họ cho là bot và hủy 17 tỷ điểm."
  source: "d97fddce3502"
nodepay.rating.cons.1.text:
  text: "Phần thưởng là điểm quy đổi sang token NC, nên giá trị của chúng phụ thuộc vào token."
  source: "6c1338a876e7"
nodepay.rating.cons.2.text:
  text: "CashPilot không chạy Nodepay: bạn dùng tiện ích trình duyệt riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "08a3715c74a3"
noderr.description:
  text: "Noderr Micronodes là hạng miễn phí đầu vào của Noderr Protocol, một dự án DeFi trên Base L2. Một micronode là một agent nhỏ chạy trên điện thoại Android không dùng đến, PC Windows, Mac hoặc trình duyệt Chromium. Trên Android, nó chia sẻ kết nối di động của điện thoại: lưu lượng Noderr khác đi ra qua IP nhà mạng của điện thoại, nên cần SIM có dữ liệu di động. Trên PC hoặc trong trình duyệt, nó chạy các tác vụ tự động hóa cho giao thức bằng sức mạnh tính toán còn dư. Phần thưởng được thiết kế để trả bằng NODR, điều chỉnh theo điểm thời gian hoạt động và độ tin cậy on-chain, nhưng mạng đang ở testnet Base Sepolia trong giai đoạn beta: phần thưởng cho nút chưa được cấp vốn và chưa có khoản nào được trả.\n"
  source: "47989c8074a3"
noderr.short_description:
  text: "Micronode miễn phí (chia sẻ kết nối Android, Windows, Mac, trình duyệt) - testnet, phần thưởng hiện chưa được cấp vốn"
  source: "0bce4476102f"
noderr.earnings.notes:
  text: "Beta trên testnet: phần thưởng cho nút chưa được cấp vốn và chưa có khoản nào được trả. Mức APY 5-10% trên website là mục tiêu thiết kế. Hãy xem lại khi mạng rời Base Sepolia."
  source: "83c78063f5b8"
noderr.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
noderr.cashout.notes:
  text: "Phần thưởng tích lũy vào ví riêng của nút và được nhận từ ứng dụng hoặc dApp. Trong giai đoạn beta, đó là token testnet Base Sepolia không có giá trị thị trường."
  source: "f7a6be9551ae"
noderr.payout.notes:
  text: "Ứng dụng tạo ví của nút ở lần khởi chạy đầu tiên và mint miễn phí một Utility NFT soulbound vào ví đó. Hãy sao lưu ví từ ứng dụng: mất thiết bị là mất danh tính của nút. Phần thưởng ở trên Base Sepolia (testnet) trong giai đoạn beta."
  source: "f12d6a765740"
noderr.requirements.note:
  text: "Android cần SIM có dữ liệu di động; client desktop và trình duyệt không công bố yêu cầu nào về IP."
  source: "f822611224eb"
noderr.disclosure.sells:
  text: "Tùy thiết bị. Điện thoại Android bán kết nối di động của nó: lưu lượng Noderr khác đi ra qua địa chỉ IP nhà mạng của điện thoại và bị trừ vào gói dữ liệu. PC Windows, Mac hoặc trình duyệt bán sức mạnh tính toán còn dư cho thứ mà nhà cung cấp gọi là tác vụ tự động hóa mạng xã hội và nội dung."
  source: "52166304a81f"
noderr.disclosure.third_party_traffic:
  text: "Có. Trên Android, lưu lượng Noderr khác đi ra qua địa chỉ IP di động của điện thoại; ứng dụng yêu cầu bạn đồng ý (có ghi lại) trước khi bắt đầu và bạn có thể dừng chia sẻ ngay trên màn hình đó. Với client Windows, Mac và trình duyệt, nhà cung cấp mô tả các tác vụ tự động hóa và không nói chúng có chuyển lưu lượng cho người khác hay không."
  source: "3b72c625497c"
noderr.disclosure.data_collected:
  text: "Địa chỉ ví của nút cùng số liệu thời gian hoạt động và tác vụ đã hoàn thành được ghi on-chain dưới dạng điểm uy tín (TrustFingerprint). Nhà cung cấp nói các tác vụ được ẩn danh, chạy trong sandbox và khóa ví không bao giờ rời khỏi thiết bị. Không có thông tin cụ thể hơn được công bố."
  source: "1e3b0b7fb15d"
noderr.disclosure.isp_risk:
  text: "Trên Android, kết nối được chia sẻ là gói di động của nhà mạng: chính tài liệu của nhà cung cấp cảnh báo việc chia sẻ có thể không được phép theo chính sách sử dụng của một số nhà mạng, và lưu lượng chia sẻ dùng vào dung lượng của gói. Với client desktop và trình duyệt, nhà cung cấp không nói gì về điều khoản của ISP."
  source: "9b1b4ea7d939"
noderr.disclosure.account_rules:
  text: "Mỗi thiết bị một nút, mỗi nút có Utility NFT soulbound riêng; chạy nhiều thiết bị được cho phép và khuyến khích. Không có giới hạn theo IP nào được công bố. Không có tài khoản theo nghĩa thông thường: danh tính là một ví do ứng dụng tạo ở lần khởi chạy đầu tiên."
  source: "a5eb4c84d09b"
noderr.rating.cons.0.text:
  text: "Phần thưởng cho nút là token testnet chưa được cấp vốn, không có giá trị thị trường, và chưa có khoản nào được trả; mức APY 5 đến 10% trên website là mục tiêu thiết kế."
  source: "88ac818edde1"
noderr.rating.cons.1.text:
  text: "Với client desktop và trình duyệt, Noderr mô tả các tác vụ tự động hóa và không nói chúng có chuyển lưu lượng của người khác hay không."
  source: "1baf89e17ec3"
noderr.rating.cons.2.text:
  text: "Nhà cung cấp nói các tác vụ được ẩn danh và chạy trong sandbox nhưng không công bố gì cụ thể hơn."
  source: "27ee8e7619b9"
noderr.rating.cons.3.text:
  text: "Vẫn là bản beta trên testnet Base Sepolia."
  source: "72109abffaf2"
noderr.rating.cons.4.text:
  text: "CashPilot không chạy Noderr: bạn dùng ứng dụng hoặc tiện ích riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "77c0f8f36c93"
noderr.rating.pros.0.text:
  text: "Không cần tài khoản: ứng dụng tạo một ví ở lần khởi chạy đầu tiên."
  source: "bf85f2f80b20"
nodle.description:
  text: "Nodle dùng Bluetooth của điện thoại thông minh để tạo hạ tầng IoT. Ứng dụng âm thầm phát hiện và chuyển tiếp dữ liệu từ các thiết bị IoT gần đó, kiếm token NODL. Từng xuất hiện trên Forbes, có quan hệ đối tác doanh nghiệp với Vivendi và Hayden AI. Chỉ trên di động (iOS và Android).\n"
  source: "1bdb28d21b76"
nodle.short_description:
  text: "Chuyển tiếp IoT qua Bluetooth - ứng dụng di động, thưởng token NODL"
  source: "23e023813fc6"
nodle.earnings.notes:
  text: "Thu nhập rất thấp. Ứng dụng điện thoại chạy nền dùng Bluetooth. Kết nối ví có thể không ổn định."
  source: "720e2341faa8"
nodle.payment.frequency:
  text: "Liên tục"
  source: "04f13cecbc50"
nodle.cashout.notes:
  text: "NODL nằm trong ví riêng của ứng dụng trên ZKsync Era; hãy kiểm tra trong ứng dụng hoặc trên một block explorer của ZKsync Era. Nodle đã rời parachain Polkadot, và cầu nối Polkadot sang ZKsync đã đóng vào ngày 31 tháng 12 năm 2025, nên NODL còn ở phía Polkadot không thể chuyển sang ZKsync nữa."
  source: "cd2b7f7914f7"
nodle.payout.notes:
  text: "NODL của bạn nằm trong ví riêng của ứng dụng Nodle trên ZKsync Era. CashPilot không thể xem địa chỉ của ví đó."
  source: "796d67192f5f"
nodle.referral.bonus.referrer:
  text: "Một phần thưởng NODL cho mỗi người dùng mới hoạt động tham gia qua lời mời (Nodle không công bố số tiền)"
  source: "03308fe33661"
nodle.rating.cons.0.text:
  text: "Một người đánh giá cho biết kiếm được khoảng $3 trong ba đến bốn năm; những người khác cho biết thu nhập hằng ngày giảm mạnh."
  source: "70cce6bcf8bc"
nodle.rating.cons.1.text:
  text: "CashPilot không chạy Nodle: bạn dùng ứng dụng điện thoại riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "6b6132c859c2"
nosana.description:
  text: "Nosana là một chợ điện toán GPU phi tập trung xây dựng trên Solana. Nó kết nối chủ GPU với nhu cầu tác vụ AI, trả bằng token NOS. Một RTX 3060 kiếm khoảng $0.048/giờ. Nền tảng tập trung vào tác vụ suy luận AI và dùng blockchain Solana để lên lịch công việc và quyết toán thanh toán. Các nút chạy tác vụ dạng container qua Nosana CLI.\n"
  source: "6767fa2885ea"
nosana.short_description:
  text: "Điện toán GPU trên Solana - token NOS, RTX 3060 ~$0.048/giờ"
  source: "317724b762f3"
nosana.earnings.notes:
  text: "RTX 3060 ~$0.048/giờ, GPU cao cấp hơn kiếm nhiều hơn. Thu nhập phụ thuộc vào lượng công việc có sẵn và mẫu GPU. Cần GPU NVIDIA, Linux, Docker và Nosana CLI. Thanh toán bằng token NOS trên Solana."
  source: "77a9ba8e9b73"
nosana.payment.frequency:
  text: "Mỗi khi hoàn thành công việc"
  source: "4d299a0eeedb"
nosana.cashout.notes:
  text: "Kiếm token NOS trên Solana. Thanh toán về ví đã cấu hình."
  source: "ac23db0b1896"
nosana.payout.notes:
  text: "Theo mặc định, Nosana tạo một ví Solana, nên hầu hết người dùng chưa bao giờ thấy địa chỉ của ví."
  source: "07691c7278fc"
nosana.requirements.min_bandwidth:
  text: "50 Mbps"
  source: "9da58f1eb55e"
nosana.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
nosana.rating.cons.0.text:
  text: "Mỗi chủ máy phải khóa một khoản stake NOS tương ứng với giá theo giờ của GPU."
  source: "6271b4473eff"
nosana.rating.cons.1.text:
  text: "Chủ máy được trả bằng NOS, nên thu nhập tính bằng đô la biến động theo token và theo nhu cầu với card của họ."
  source: "f8836492f010"
nosana.rating.cons.2.text:
  text: "CashPilot không chạy Nosana: bạn dùng phần mềm chủ máy riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "1a3ea3856a00"
ocean.description:
  text: "OCEAN là một pool đào Bitcoin không cần tài khoản: máy đào của bạn đăng nhập bằng địa chỉ Bitcoin làm tên người dùng, và pool trả tiền vào địa chỉ đó. CashPilot không chạy máy đào ở đây. Nó đọc số dư chưa thanh toán mà OCEAN đang giữ cho địa chỉ của bạn, để bạn thấy ASIC của mình (Bitaxe, Antminer) đã kiếm được bao nhiêu bên cạnh các nguồn thu nhập khác. Số dư chưa thanh toán là đã kiếm được nhưng chưa nhận: OCEAN trả nó on-chain khi vượt ngưỡng thanh toán.\n"
  source: "5d25f28a3de5"
ocean.short_description:
  text: "Pool đào Bitcoin, theo dõi qua địa chỉ nhận thanh toán của bạn"
  source: "7fb9a12a78b2"
ocean.payment.minimum_payout:
  text: "0.01048576 BTC"
  source: "882384c2d99e"
ocean.payment.frequency:
  text: "Khi một khối đưa số dư của bạn vượt ngưỡng"
  source: "8e74f0cc80ec"
ocean.cashout.notes:
  text: "OCEAN trả on-chain vào địa chỉ của bạn khi số dư chưa thanh toán đạt ngưỡng. Thanh toán qua Lightning (tùy chọn bật, BOLT12) không được CashPilot phát hiện."
  source: "2d0f3e2d7422"
ocean.payout.notes:
  text: "Số chưa thanh toán là đã kiếm được nhưng chưa nhận cho đến khi OCEAN trả on-chain vào địa chỉ này, trừ khi bạn đã bật thanh toán qua Lightning."
  source: "ede2765fcbdd"
ocean.collector.credential_hint:
  text: "Địa chỉ nhận thanh toán BTC của bạn: tên người dùng mà máy đào dùng trên OCEAN, không có phần <b>.workername</b>. Địa chỉ này công khai và không mở khóa được tiền."
  source: "53cb5da14daf"
ocean.requirements.note:
  text: "Cần một máy đào ASIC Bitcoin (Bitaxe, Antminer) trỏ tới mine.ocean.xyz:3334"
  source: "e2e956c27e48"
ocean.disclosure.sells:
  text: "điện toán"
  source: "b04a12f6483e"
ocean.disclosure.third_party_traffic:
  text: "Không. Máy đào của bạn gửi hash tới pool; không ai định tuyến lưu lượng qua kết nối của bạn."
  source: "7239118f749a"
ocean.disclosure.data_collected:
  text: "Địa chỉ Bitcoin của bạn, tên worker bạn chọn, hashrate và địa chỉ IP của máy đào theo những gì pool thấy."
  source: "22282404721c"
ocean.disclosure.isp_risk:
  text: "Máy đào giữ một kết nối mở tới pool và dùng rất ít băng thông. Chi phí cần để ý là tiền điện, không phải ISP."
  source: "7bf5f9f6b028"
ocean.disclosure.account_rules:
  text: "Không có tài khoản. Địa chỉ chính là danh tính, và bất kỳ ai cũng có thể xem thống kê của nó trên ocean.xyz."
  source: "e3c8fd5863c1"
ocean.rating.cons.0.text:
  text: "Chỉ trả bằng Bitcoin, và không có gì được trả on-chain cho đến khi số dư đạt 0.01048576 BTC."
  source: "9c9981f2fbd5"
ocean.rating.cons.1.text:
  text: "Phí pool 2%, hoặc 1% khi bạn tự tạo block template bằng DATUM."
  source: "497f4f1ec62e"
ocean.rating.cons.2.text:
  text: "CashPilot không chạy máy đào cho OCEAN: bạn tự trỏ phần cứng của mình tới pool, và CashPilot chỉ đọc số dư."
  source: "eccc0b4b47ae"
ocean.rating.pros.0.text:
  text: "Không cần tài khoản và không xác minh danh tính. OCEAN chỉ yêu cầu địa chỉ Bitcoin mà nó trả tiền vào."
  source: "38c4a7764846"
packetstream.description:
  text: "PacketStream là một chợ băng thông ngang hàng, nơi bạn có thể bán băng thông chưa dùng. Nó vận hành một mạng proxy dân cư dùng cho nghiên cứu thị trường, theo dõi SEO và xác minh quảng cáo. Cài đặt Docker đơn giản, chỉ cần một CID (Client ID). Lưu ý rằng trang đăng nhập có CAPTCHA có thể gây khó cho việc tự động thu thập thu nhập.\n"
  source: "ee363f486228"
packetstream.short_description:
  text: "Chia sẻ băng thông - cài đặt đơn giản dựa trên CID"
  source: "583d6cb0e210"
packetstream.docker.env.CID.label:
  text: "Client ID"
  source: "8726db013948"
packetstream.docker.env.CID.description:
  text: "Đăng nhập tại <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> → nhấp Setup ở thanh bên → CID của bạn hiển thị trong lệnh Docker"
  source: "98b278da2ff7"
packetstream.docker.health_signals.0.means:
  text: "PacketStream từ chối địa chỉ IP của bản sao này vì không phải IP dân cư, nên nó không kiếm được gì. Hãy chạy nó trên một máy có kết nối internet là đường truyền gia đình, hoặc gỡ bản sao này."
  source: "fd7c962a931b"
packetstream.docker.health_signals.1.means:
  text: "PacketStream đã có một client khác trên địa chỉ IP này, và chỉ trả cho một client mỗi IP. Hãy gỡ bản sao này, hoặc bản còn lại đang dùng chung IP."
  source: "ff7bc9892ef4"
packetstream.earnings.notes:
  text: "Trả $0.10/GB băng thông chia sẻ. Thu nhập phụ thuộc nhiều vào nhu cầu đối với vị trí IP của bạn."
  source: "426cb6a734ee"
packetstream.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
packetstream.cashout.notes:
  text: "Chỉ PayPal, tối thiểu $5, phí 3% hiển thị trước khi bạn xác nhận. Lần rút đầu tiên lưu email PayPal của bạn; đổi email sau này cần xác nhận qua email và chờ 7 ngày, nên hãy kiểm tra địa chỉ trước khi xác nhận. Yêu cầu được xem xét và gửi trong vòng 7 ngày; bạn có thể hủy một yêu cầu khi nó đang chờ, và chỉ có thể tạo yêu cầu mới khi yêu cầu trước đã được trả."
  source: "ca9e35054ffd"
packetstream.payout.notes:
  text: "Số dư do PacketStream giữ; rút theo yêu cầu."
  source: "cf5fc7ddda3b"
packetstream.collector.credential_hint:
  text: "Đăng nhập tại <a href='https://packetstream.io' target='_blank'>packetstream.io</a>, nhấn F12 → Application → Cookies, sao chép giá trị cookie <b>auth</b> (đó là một JWT)."
  source: "15bae9d455f5"
packetstream.referral.bonus.referrer:
  text: "20% thu nhập băng thông của họ (thưởng Packeter có thời hạn)"
  source: "964a44bb9e65"
packetstream.referral.bonus.referee:
  text: "Tín dụng thưởng 10% cho lần nạp tiền đầu tiên bằng thẻ hoặc PayPal (khách hàng proxy)"
  source: "b3485c0e6eef"
packetstream.rating.cons.0.text:
  text: "Người đánh giá trên Trustpilot năm 2025 và 2026 cho biết tiền về chậm hoặc không về, và một người dùng lâu năm nói thanh toán chậm dần rồi dừng hẳn; những người khác năm 2026 cho biết đã được trả."
  source: "2d4eefe9c2a2"
packetstream.rating.cons.1.text:
  text: "Chỉ PayPal, với phí rút 3%; người dùng ở quốc gia PayPal không phục vụ không có phương thức nào khác."
  source: "f31b2ebf4935"
packetstream.rating.cons.2.text:
  text: "Điều khoản cho phép PacketStream giữ lại, đảo ngược hoặc vô hiệu hóa thu nhập mà họ cho là liên quan đến gian lận, thao túng hoặc hoạt động bị cấm."
  source: "f9be9a406341"
packetstream.rating.cons.3.text:
  text: "Điều khoản cho biết khách hàng proxy và chính PacketStream định tuyến lưu lượng qua kết nối của bạn; không mô tả việc kiểm tra người mua thông thường."
  source: "fd4707690d2b"
packetstream.rating.cons.4.text:
  text: "Trustpilot ghi nhận PacketStream chưa phản hồi các đánh giá tiêu cực; người đánh giá cho biết email không được trả lời."
  source: "4885bceb8df9"
packetstream.rating.pros.0.text:
  text: "PacketStream phát hành image Docker riêng, packetstream/psclient."
  source: "b358af0b3419"
packetstream.rating.pros.1.text:
  text: "Điều khoản chỉ yêu cầu thiết bị và kết nối mà bạn sở hữu hoặc được phép dùng."
  source: "bde1b5ad5a6a"
packetstream.rating.pros.2.text:
  text: "Điều khoản không mô tả việc xác minh danh tính nào; một khoản thanh toán cần địa chỉ PayPal."
  source: "a05886b55edc"
packetstream.rating.pros.3.text:
  text: "Điều khoản nêu tên PacketStream Inc., theo luật California."
  source: "7966bde559dd"
packetstream.rating.pros.4.text:
  text: "PacketStream hoạt động từ năm 2018."
  source: "70db8167d5bc"
passiveapp.description:
  text: "PassiveApp là một nền tảng DePIN cho phép bạn kiếm phần thưởng crypto và PayPal bằng cách chia sẻ băng thông và tài nguyên tính toán chưa dùng. Thực tế chỉ có trên Windows: trang tải xuống của chính nhà phát hành ghi Android, iOS và Linux là \"coming soon\" không đổi từ ít nhất tháng 2 năm 2025, và không có phiên bản macOS — dù nội dung quảng cáo trên cùng website nói hỗ trợ rộng hơn. Không có image Docker.\n"
  source: "e0f069b6b6e0"
passiveapp.short_description:
  text: "Băng thông/điện toán DePIN - chỉ Windows, thanh toán crypto và PayPal"
  source: "e23871afdcd9"
passiveapp.earnings.notes:
  text: "Chỉ có ứng dụng desktop Windows (v1.0.x); Android/iOS/Linux được nhà phát hành thông báo 'coming soon' từ đầu năm 2025 và chưa bao giờ ra mắt. Không có image Docker chính thức."
  source: "57f5891e1772"
passiveapp.payment.frequency:
  text: "Theo yêu cầu"
