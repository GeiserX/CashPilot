proxybase-xyz.cashout.notes:
  text: "Chốt thu nhập bằng <code>proxybase-cli seller payout create</code>, nhận dưới dạng USDC trên Tempo Chain (Tempo MPP). Trả vào bất kỳ địa chỉ EVM nào mà bạn giữ khóa (Tempo là một chuỗi EVM), không cần ký gì; hãy thêm mạng Tempo vào ví để thấy USDC. Nếu ví vẫn không hiển thị, cần thêm thủ công token USDC của Tempo: nhập nó bằng địa chỉ hợp đồng mà Proxybase cung cấp, và kiểm tra địa chỉ đó trước khi tin vào số dư."
