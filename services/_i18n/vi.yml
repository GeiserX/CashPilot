  source: "6a5d724f3154"
honeygain.obligations.keep-active-6-months.loss:
  text: "Nếu ứng dụng không được dùng trong hơn 6 tháng, Honeygain coi số dư chưa thanh toán là đã hết hạn, kể cả khi dưới $20."
  source: "1ef249cfc7e2"
honeygain.obligations.keep-active-6-months.how:
  text: "Giữ một thiết bị đang chia sẻ, hoặc gửi yêu cầu rút tiền. Ở chế độ JumpTask, số dư không đổi là bình thường, nên hãy chọn Không dành cho tôi."
  source: "dc9f336970db"
honeygain.rating.cons.0.text:
  text: "Điều khoản cho phép Honeygain xóa thu nhập đã đạt ngưỡng $20 mà không được thanh toán trong vòng 24 tháng, và coi thu nhập là hết hạn sau sáu tháng không sử dụng."
