  source: "be820103712e"
honeygain.cashout.notes:
  text: "Tối thiểu $20 (20.000 credit). Hai lựa chọn: PayPal qua Tipalti, phí khoảng 15%, hoặc credit JumpTask không mất phí, trả vào ví JumpTask. Mỗi yêu cầu cần một mã 6 chữ số gửi qua email. Khoản thanh toán PayPal đầu tiên ở trạng thái \"waiting for details\" cho đến khi bạn đăng ký trên Tipalti qua liên kết họ gửi email. Liên kết đó chỉ dùng được một lần, nên hãy mở khi bạn có thể làm xong trong một lượt và có điện thoại bên cạnh: sau khi đặt mật khẩu, Tipalti yêu cầu bạn xác nhận số di động qua SMS (mã hết hạn trong vài phút), rồi hỏi họ tên, địa chỉ, quốc gia và ngày sinh, cùng địa chỉ PayPal của bạn. Tipalti thu $2.02 mỗi khoản thanh toán; hãy chọn USD để tránh phí quy đổi tiền tệ 1.9-3% của họ. Tiền đến trong vòng 2 ngày làm việc. Số dư rời khỏi tài khoản ngay khi bạn gửi yêu cầu, kể cả khi khoản thanh toán còn đang chờ Tipalti. Mỗi lần đăng nhập Tipalti sau đó đều gửi mã SMS mới, trừ khi bạn đánh dấu tùy chọn ghi nhớ thiết bị trong 30 ngày. Vào tháng 10 năm 2026, Tipalti không yêu cầu biểu mẫu thuế với một người nhận ở Tây Ban Nha."
  source: "553463d96535"
