iproyal.cashout.notes:
  text: "Tối thiểu $5. Hãy chọn quốc gia trước; phương thức thanh toán phụ thuộc vào đó. Từ Tây Ban Nha (tháng 10 năm 2026): PayPal 4% với phí tối thiểu $0.25, trả qua Tremendous, nơi gửi email một liên kết để bạn nhập họ tên và địa chỉ PayPal; USDT (BEP20, ERC20, TRC20) hoặc USDC (BEP20, ERC20) với phí mạng $1; Bitcoin với phí tối thiểu $2; thẻ quà tặng không mất phí. Lần thanh toán đầu tiên cần xác minh số điện thoại một lần qua SMS: nút Withdraw sẽ mở bước này, và số điện thoại được nhập kèm mã quốc gia. Sau đó mỗi lần thanh toán đều yêu cầu một mã gửi tới email tài khoản và được xem xét tối đa 72 giờ trước khi gửi."
