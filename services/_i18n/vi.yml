  source: "d63d0b15c13d"
bytelixir.rating.cons.1.text:
  text: "CashPilot không chạy Bytelixir: bạn dùng ứng dụng riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "afea7eb7cc1f"
bytelixir.rating.pros.0.text:
  text: "Trustpilot chấm 4.6 từ 283 đánh giá, phần lớn khen khoản thanh toán crypto; một số ít báo cáo không nhận được tiền."
  source: "7ebaccd91dfd"
bytelixir.rating.pros.1.text:
  text: "Một khoản thanh toán chỉ cần một địa chỉ crypto nhập vào yêu cầu."
  source: "89f36ce9e779"
clore-ai.description:
  text: "Clore.ai là một chợ GPU ngang hàng. Bạn đăng một máy Linux có GPU NVIDIA, tự đặt giá spot và giá theo yêu cầu, và người thuê chạy container Docker của họ trên đó. Bạn chỉ được trả tiền cho số phút máy được thuê, bằng CLORE, BTC, USDT hoặc USDC. Việc cho thuê cần một máy x86_64 chạy Ubuntu 22.04 trở lên (hoặc HiveOS), driver NVIDIA hoạt động tốt và tốc độ ít nhất 100 Mbps cả tải lên lẫn tải xuống. GPU AMD không được hỗ trợ.\n"
  source: "d4817118c773"
clore-ai.short_description:
  text: "Chợ GPU - cho thuê GPU NVIDIA, nhận CLORE, BTC hoặc stablecoin USD"
  source: "a124538d51cc"
clore-ai.earnings.notes:
  text: "Chỉ trả cho số phút được thuê, theo giá bạn đặt. Mức cao nhất của khoảng, $490, là mức trần do chính Clore đưa ra cho một RTX 4090 cho thuê theo phút ('up to ~$490/month'); card yếu hơn kiếm ít hơn và card nhàn rỗi không kiếm được gì. Clore giữ lại 5% (theo yêu cầu) hoặc 1.25% (spot) của mỗi lượt thuê, cộng thêm 15% khi người thuê trả bằng BTC, USDT hoặc USDC thay vì CLORE."
  source: "d13b02266fce"
clore-ai.payment.minimum_payout:
  text: "200 CLORE"
  source: "c1424a955e0e"
clore-ai.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
clore-ai.cashout.notes:
  text: "Rút từ Account > Billing về ví của chính bạn: CLORE (ERC-20, tối thiểu 200, phí khoảng $0.50), BTC (tối thiểu 0.0001, phí 0.00005 BTC) hoặc USDT/USDC trên Ethereum hay BNB Chain (tối thiểu $10, phí $1)."
  source: "7b54a2467799"
clore-ai.payout.notes:
  text: "Clore giữ số dư (CLORE, BTC và một số dư USD cho USDT/USDC) cho đến khi bạn rút. Chuỗi được chọn cho từng lần rút: Ethereum cho CLORE, Bitcoin cho BTC, Ethereum hoặc BNB Chain cho USDT/USDC."
  source: "1922639107be"
clore-ai.referral.bonus.referrer:
  text: "15% (hạng tiêu chuẩn) phí nền tảng mà các chủ máy và người thuê do bạn giới thiệu trả, trên mọi lượt thuê; mã không bao giờ hết hạn; trả bằng loại tiền của lượt thuê (CLORE, BTC hoặc USD)"
  source: "1d7bd3513d42"
clore-ai.requirements.min_bandwidth:
  text: "100 Mbps cả tải lên lẫn tải xuống"
  source: "7a2496f19e72"
clore-ai.requirements.min_storage:
  text: "32GB"
  source: "bf24550293d5"
clore-ai.disclosure.sells:
  text: "Thời gian điện toán GPU trên máy của bạn."
  source: "502ae194879a"
clore-ai.disclosure.third_party_traffic:
  text: "Có. Người thuê chạy container Docker của họ trên máy bạn, và lưu lượng của họ đi ra từ kết nối của bạn; các cổng SSH và cổng ứng dụng được chuyển tiếp ra internet."
  source: "5b8b36ea210e"
clore-ai.disclosure.data_collected:
  text: "Chính sách quyền riêng tư của Clore bao gồm dữ liệu tài khoản và địa chỉ IP của bạn cùng vị trí gần đúng; giấy tờ tùy thân chỉ khi Clore yêu cầu KYC."
  source: "c17be18a1dd4"
clore-ai.disclosure.isp_risk:
  text: "Các cổng đến phải truy cập được từ internet (mặc định là 22, 8080 và 3000-4000) và công việc của người lạ chạy trên đường truyền của bạn. Chính hướng dẫn mạng của Clore cho biết một số ISP chặn việc cho thuê máy."
  source: "e46ffae26d51"
clore-ai.disclosure.account_rules:
  text: "Từ 18 tuổi trở lên, không ở quốc gia bị trừng phạt. Clore có thể tạm ngưng hoặc đóng tài khoản theo toàn quyền quyết định của mình, và việc sử dụng bị cấm có thể khiến bạn mất tiền."
  source: "8bd6f65077a2"
clore-ai.rating.cons.0.text:
  text: "Cả điều khoản lẫn chính sách quyền riêng tư đều không nêu tên một pháp nhân, và điều khoản để luật áp dụng cho một phiên bản sau này."
  source: "4085fd9eadf6"
clore-ai.rating.cons.1.text:
  text: "Clore có thể tạm ngưng hoặc đóng tài khoản theo toàn quyền quyết định của mình, và việc sử dụng bị cấm có thể dẫn đến tịch thu tiền."
  source: "951c5c13d3bd"
clore-ai.rating.cons.2.text:
  text: "Chỉ thanh toán bằng crypto (CLORE, BTC, USDT hoặc USDC), và Clore lấy thêm 15% của lượt thuê mà người thuê trả bằng BTC, USDT hoặc USDC, trừ khi chủ máy khóa CLORE để giảm khoản này."
  source: "3c92c0ec25bd"
clore-ai.rating.cons.3.text:
  text: "Chủ máy chỉ được trả cho số phút được thuê, và con số Clore đưa ra cho một RTX 4090 là mức trần (\"up to ~$490/month\") cho một card."
  source: "7c9e0446e764"
clore-ai.rating.cons.4.text:
  text: "Sử dụng cơ bản không cần KYC, nhưng Clore có thể yêu cầu xác minh danh tính cho các lần rút lớn hoặc trường hợp tuân thủ."
  source: "273c4f99bf2e"
clore-ai.rating.cons.5.text:
  text: "Người thuê chạy bất kỳ image Docker công khai nào trên máy của bạn. Điều khoản liệt kê các mục đích bị cấm (mã độc, DDoS, CSAM và nhiều thứ khác), nhưng chúng tôi không tìm thấy mô tả nào về cách người thuê được kiểm tra."
  source: "a6bf958765ab"
clore-ai.rating.cons.6.text:
  text: "CashPilot không chạy Clore.ai: bạn cài agent cho thuê của Clore trên máy GPU của chính bạn (Ubuntu 22.04 trở lên, hoặc HiveOS), nên CashPilot không thể triển khai hay cập nhật nó cho bạn."
  source: "705e4c68172b"
clore-ai.rating.pros.0.text:
  text: "Clore giữ lại 5% của lượt thuê theo yêu cầu (1.25% với spot) khi người thuê trả bằng CLORE, không có phí thêm."
  source: "699adf0a2179"
dawn.description:
  text: "DAWN vận hành một mạng validator kiểm tra băng thông và vùng phủ cho hạ tầng AI được tài trợ qua giao thức DAWN. Tiện ích trình duyệt DAWN Validator tham gia vào các lần kiểm tra bằng chứng băng thông và vùng phủ này, và kiếm phần thưởng DAWN khi đang chạy. Phần thưởng này chưa có giá trị tiền mặt xác định. Hãy tạo tài khoản trong tiện ích và nhập mã giới thiệu 2QLQV97F khi được hỏi.\n"
  source: "bea38e2849d6"
dawn.short_description:
  text: "Validator DePIN - tiện ích trình duyệt kiếm điểm DAWN"
  source: "3cf2793b3b2a"
dawn.earnings.notes:
  text: "Kiếm Dawn Points trước khi ra mắt token. Giá trị thực phụ thuộc vào giá token trong tương lai. Thiết bị phần cứng kiếm nhiều hơn tiện ích trình duyệt."
  source: "607d3b0c3f7c"
dawn.payment.frequency:
  text: "Airdrop token (sẽ thông báo sau)"
  source: "73bb8600bb37"
dawn.cashout.notes:
  text: "Tiện ích chạy được nhưng còn dở dang. Phần cứng Black Box đã được công bố. Hãy kiểm tra lại sau."
  source: "45ccbe07d490"
dawn.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
dawn.rating.cons.0.text:
  text: "Tiện ích kiếm điểm; tính đến tháng 10 năm 2026 chưa có xác nhận nào về việc phân phối token cho người vận hành nút."
  source: "136c9d15219e"
dawn.rating.cons.1.text:
  text: "Điểm chưa có giá trị xác định cho đến khi token ra mắt và tỷ lệ quy đổi được công bố."
  source: "5ecb8c0c7382"
dawn.rating.cons.2.text:
  text: "CashPilot không chạy Dawn: bạn dùng tiện ích trình duyệt riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "8232c9563c84"
deeper-network.description:
  text: "Deeper Network là một dự án VPN phi tập trung và hạ tầng web3. Chủ yếu yêu cầu thiết bị phần cứng độc quyền Deeper Connect. Moken là một nền tảng đào/stake liên quan. Không chỉ là phần mềm.\n"
  source: "12f422cc2aa8"
deeper-network.short_description:
  text: "VPN phi tập trung - cần thiết bị phần cứng độc quyền"
  source: "c1e7f82b138f"
deeper-network.earnings.notes:
