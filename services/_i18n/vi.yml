ionet.description:
  text: "io.net là một mạng GPU phi tập trung cho các tác vụ AI/ML. Tập hợp GPU nhàn rỗi từ người dùng cá nhân và trung tâm dữ liệu. Cần GPU NVIDIA có 8GB+ VRAM để có thu nhập đáng kể. Hỗ trợ triển khai dựa trên container.\n"
  source: "5d017f77f0ac"
ionet.short_description:
  text: "Mạng GPU phi tập trung cho AI - cần GPU NVIDIA"
  source: "fe3c9f266aaf"
ionet.earnings.notes:
  text: "Cần GPU NVIDIA có 8GB+ VRAM. Có quảng cáo $500-1000/tháng cho RTX 4090 (thực tế có lẽ thấp hơn)."
  source: "758e456cefa1"
ionet.payment.frequency:
  text: "Theo epoch"
  source: "75743e03bad2"
ionet.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
ionet.rating.cons.0.text:
  text: "Phần thưởng cho nhà cung cấp được trả từ lượng token phát hành bất kể có công việc trả phí hay không, và chủ GPU cho biết máy nhàn rỗi phần lớn thời gian."
  source: "177f8e83c339"
ionet.rating.cons.1.text:
  text: "Phần thưởng là token IO và mô hình thanh toán đã chuyển sang cơ chế neo theo đô la vào năm 2026."
  source: "dfc046680d1d"
ionet.rating.cons.2.text:
  text: "Vào tháng 4 năm 2024, khoảng 1.8 triệu GPU giả đã cố gia nhập qua một token xác thực bị rò rỉ, và sau đó CEO từ chức trước khi ra mắt token."
  source: "570b7951f0b2"
ionet.rating.cons.3.text:
  text: "CashPilot không chạy io.net: bạn dùng phần mềm worker riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "1cac289c99ad"
iproyal.description:
  text: "IPRoyal Pawns giúp bạn kiếm tiền bằng cách chia sẻ băng thông chưa dùng. IPRoyal là một nhà cung cấp proxy lâu năm, và Pawns là nhánh chia sẻ băng thông dân cư của họ. Image Docker CLI nhận thông tin đăng nhập qua các cờ dòng lệnh. Người dùng mới đăng ký qua liên kết giới thiệu được nhận $1 cho mỗi khoản trong ba khoản thanh toán đầu tiên, tối đa $3. Mỗi khoản thanh toán phải diễn ra trong một khoảng thời gian từ một đến ba tuần, tùy theo vị trí. Khoảng thời gian bắt đầu từ lúc đăng ký và bắt đầu lại sau mỗi khoản thanh toán. Nếu khoảng thời gian kết thúc trước, các khoản thưởng còn lại sẽ mất.\n"
  source: "b12878d5917a"
iproyal.short_description:
  text: "Chia sẻ băng thông - thưởng tới $3 cho các khoản thanh toán đầu tiên"
