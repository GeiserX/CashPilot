  text: "ProxyRack phát hành image Docker riêng, proxyrack/pop, và chấp nhận IP trung tâm dữ liệu với mức trả thấp hơn."
  source: "278541f81053"
repocket.description:
  text: "Repocket giúp bạn kiếm thu nhập thụ động bằng cách chia sẻ băng thông internet chưa dùng. IP dân cư kiếm nhiều nhất; IP VPS/trung tâm dữ liệu được chấp nhận với mức trả thấp hơn. Tối đa 5 thiết bị và 5 phiên hoạt động mỗi tài khoản. Container Docker xác thực bằng email tài khoản và một khóa API từ bảng điều khiển Repocket (không phải mật khẩu).\n"
  source: "23f07d968c4a"
repocket.short_description:
  text: "Chia sẻ băng thông - tối đa 5 thiết bị, xác thực bằng khóa API"
  source: "5851a7eb5769"
repocket.docker.env.RP_EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
repocket.docker.env.RP_API_KEY.label:
  text: "Khóa API (UUIDv4, không phải mật khẩu)"
  source: "97ec806e0e5a"
repocket.docker.env.RP_EMAIL.description:
  text: "Email tài khoản Repocket của bạn"
  source: "24f7b113af79"
repocket.docker.env.RP_API_KEY.description:
  text: "Khóa API Repocket của bạn — đăng nhập tại <a href=\"https://app.repocket.com/bandwidth-earnings\">app.repocket.com</a> và sao chép khóa API hiển thị trên trang bandwidth-earnings (đây KHÔNG phải mật khẩu tài khoản). Cần tài khoản? Đăng ký tại <a href=\"https://link.repocket.com/b1zM\">link.repocket.com/b1zM</a>"
  source: "aee9c20af748"
repocket.earnings.notes:
  text: "IP dân cư kiếm nhiều hơn. IP VPS/trung tâm dữ liệu được chấp nhận nhưng với mức trả thấp hơn."
  source: "aca747392709"
repocket.payment.minimum_payout:
  text: "$4 ($2 sau lần thanh toán đầu tiên)"
  source: "7e4440ec5ec8"
repocket.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
repocket.cashout.notes:
  text: "Repocket đặt mức tối thiểu theo từng tài khoản: $4 trước lần thanh toán đầu tiên và $2 sau đó vào tháng 10 năm 2026, thấp hơn nhiều so với mức $20 từng quảng cáo. Phương thức: Tremendous (gửi tới email) hoặc USDT trên Polygon. Mỗi yêu cầu được xác nhận qua liên kết gửi email trong vòng 2 giờ, và mỗi lúc chỉ có một yêu cầu đang chờ. Vào tháng 10 năm 2026, Repocket từ chối một yêu cầu Tremendous với thông báo \"Please, message support\", trong khi USDT trên Polygon thì thành công."
  source: "4257bc89db22"
repocket.payout.notes:
  text: "Số dư do Repocket giữ; rút theo yêu cầu."
  source: "433a8673024f"
repocket.collector.credential_hint:
  text: "Dùng email và mật khẩu tài khoản Repocket của bạn (giống với <a href='https://app.repocket.com' target='_blank'>app.repocket.com</a>). Cần tài khoản? Đăng ký tại <a href='https://link.repocket.com/b1zM' target='_blank'>link.repocket.com/b1zM</a>."
  source: "3512375c4c8d"
repocket.referral.bonus.referrer:
  text: "$2 khi người được giới thiệu kiếm được $7, sau đó 5% thu nhập của họ trọn đời"
  source: "cac3b7365190"
repocket.referral.bonus.referee:
  text: "Thưởng $2 vào ví khi đăng ký"
  source: "0227076a427a"
repocket.requirements.note:
  text: "Repocket ghi nhận giới hạn năm thiết bị mỗi TÀI KHOẢN nhưng không công bố giới hạn thiết bị theo IP. Con số '2 thiết bị mỗi IP' được nhắc lại trên các trang đánh giá không có nguồn từ nhà cung cấp, nên CashPilot không khẳng định điều đó."
  source: "cab1a64a99de"
repocket.obligations.avoid-12-month-dormancy.title:
  text: "Giữ một thiết bị Repocket đang chia sẻ, hoặc rút số dư"
  source: "3f73daf88013"
repocket.obligations.avoid-12-month-dormancy.loss:
  text: "Sau 12 tháng không đăng nhập, không rút tiền và không chia sẻ băng thông, Repocket có thể tịch thu số dư chưa thanh toán."
  source: "7a34159de0a3"
repocket.obligations.avoid-12-month-dormancy.how:
  text: "Giữ một thiết bị đang chia sẻ, đăng nhập, hoặc rút tiền. Nếu bạn ngừng dùng Repocket, hãy rút tiền trước."
  source: "9a9c90982c1f"
repocket.rating.cons.0.text:
  text: "Nhiều người đánh giá trên Trustpilot cho biết khoản thanh toán bị hủy và số dư bị đặt về 0; một người nói bộ phận hỗ trợ viện lý do thu nhập băng thông bất thường. Trang này chấm Repocket 2.7 và ghi nhận họ chưa phản hồi các đánh giá tiêu cực."
  source: "9c914f1442de"
repocket.rating.cons.1.text:
  text: "Người đánh giá cho biết yêu cầu rút tiền bị từ chối và phải đòi mãi mới được trả."
  source: "5a1bec3c2b0a"
repocket.rating.cons.2.text:
  text: "Chính sách thanh toán của Repocket cho phép họ đảo ngược, hủy hoặc tịch thu vĩnh viễn thu nhập bất cứ khi nào họ nghi ngờ thu nhập không hợp lệ, và tịch thu thu nhập chưa thanh toán của tài khoản không hoạt động."
  source: "e8734ecbadca"
repocket.rating.cons.3.text:
  text: "Cũng chính sách đó cho phép Repocket thêm, bỏ hoặc thay phương thức thanh toán bất cứ lúc nào mà không báo trước; PayPal đã bị bỏ."
  source: "ea94189515f8"
repocket.rating.cons.4.text:
  text: "Điều khoản cho biết Repocket có thể yêu cầu xác minh danh tính hoặc tài khoản bất cứ lúc nào, và quyền nhận thanh toán phụ thuộc vào việc đó."
  source: "2b636ca32b29"
repocket.rating.cons.5.text:
  text: "Điều khoản cho biết Repocket và các đối tác sử dụng dung lượng mạng, nhưng không nói đối tác là ai hay được kiểm tra thế nào."
  source: "914de00dcae8"
repocket.rating.cons.6.text:
  text: "Trustpilot ghi nhận Repocket chưa phản hồi các đánh giá tiêu cực, và người đánh giá nói tin nhắn bị phớt lờ."
  source: "d0919ce86cd1"
repocket.rating.cons.7.text:
  text: "Điều khoản hiện tại nêu tên Repocket Pte. Ltd. tại Singapore; điều khoản cũ không nêu tên công ty nào."
  source: "c5446659b3fd"
repocket.rating.pros.0.text:
  text: "Repocket phát hành image Docker riêng, repocket/repocket, và điều khoản cho phép container do bạn sở hữu."
  source: "251ccf7350a1"
repocket.rating.pros.1.text:
  text: "Mức tối thiểu thấp: $4 trước lần thanh toán đầu tiên và $2 sau đó."
  source: "ff8121a15aeb"
salad.description:
  text: "Salad.io cho phép bạn chia sẻ GPU cho các tác vụ AI phân tán và kiếm số dư Salad có thể đổi lấy thẻ quà tặng, game hoặc tiền mặt. Chỉ trên Windows với ứng dụng desktop gốc. Cần GPU rời (NVIDIA hoặc AMD). Nền tảng chuyển các tác vụ suy luận AI, render và tính toán khác tới máy của bạn khi máy nhàn rỗi. Một trong những nền tảng chia sẻ GPU dễ dùng hơn cả.\n"
  source: "09335baccea6"
salad.short_description:
  text: "Chia sẻ GPU cho AI - chỉ Windows, thanh toán bằng thẻ quà tặng hoặc tiền mặt"
  source: "4665796e0965"
salad.earnings.notes:
  text: "Thu nhập phụ thuộc vào mẫu GPU và lượng công việc có sẵn. RTX 3060 ~$1-3/ngày. Chỉ Windows. Ứng dụng gốc, không hỗ trợ Docker. Đổi được lấy thẻ quà tặng, game hoặc PayPal."
  source: "7d2dd00d66b6"
salad.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
salad.cashout.notes:
  text: "PayPal hoặc thẻ quà tặng qua cửa hàng Salad."
  source: "5128232e4f57"
salad.payout.notes:
  text: "Chỉ PayPal và thẻ quà tặng, không bao giờ có crypto. Không có địa chỉ ví nào, nên CashPilot không có số dư on-chain để hiển thị."
  source: "202ba88e23ba"
salad.collector.credential_hint:
  text: "Đăng nhập tại <a href='https://app.salad.io' target='_blank'>app.salad.io</a>, nhấn F12 → Application → Cookies, sao chép giá trị cookie <b>auth</b>."
  source: "06866b08538f"
salad.obligations.earn-within-12-months.title:
  text: "Kiếm một ít Salad Reward Points, hoặc tiêu số dư của bạn"
  source: "8be6d7f8e071"
salad.obligations.earn-within-12-months.loss:
  text: "Nếu một tài khoản không kiếm được Reward Points nào trong 12 tháng liên tiếp, số dư chưa đổi của nó có thể hết hạn."
  source: "d5d6383270a0"
salad.obligations.earn-within-12-months.how:
  text: "Chạy ứng dụng Salad cho đến khi nó kiếm được điểm, hoặc tiêu toàn bộ số dư trong Salad Storefront. Chỉ tiêu một phần không đặt lại mốc 12 tháng."
  source: "7f3ce451f908"
salad.rating.cons.0.text:
  text: "CashPilot không chạy Salad: bạn dùng ứng dụng desktop riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "1cd8e42748e0"
salad.rating.pros.0.text:
  text: "Nhiều người đánh giá trên Trustpilot vào tháng 10 và tháng 11 năm 2026 cho biết rút tiền qua PayPal về nhanh, một số người rút hơn một lần; một người đánh giá trong cùng thời gian nói các lần thử rút tiền liên tục thất bại."
  source: "b3e38d8e84a9"
sentinel-dvpn.description:
  text: "Sentinel là một blockchain Layer 1 trên Cosmos dành cho VPN phi tập trung. Người vận hành nút bán băng thông cho người dùng VPN với giá linh hoạt (theo GB hoặc theo giờ). Có hướng dẫn triển khai Docker chính thức. Dự án lâu năm với cộng đồng năng động.\n"
  source: "579e4912549d"
sentinel-dvpn.short_description:
  text: "VPN phi tập trung trên Cosmos - người vận hành nút bán băng thông"
  source: "d67d845ed44c"
sentinel-dvpn.earnings.notes:
  text: "Người vận hành tự đặt giá theo GB hoặc theo giờ. Thu nhập phụ thuộc vào nhu cầu của người dùng VPN trong khu vực của bạn."
  source: "81a547302ace"
sentinel-dvpn.payment.frequency:
  text: "Theo phiên"
  source: "02466db591a8"
sentinel-dvpn.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
sentinel-dvpn.requirements.min_bandwidth:
  text: "10 Mbps"
  source: "9941480e122c"
sentinel-dvpn.rating.cons.0.text:
  text: "Thanh toán bằng token P2P, và 20% mỗi khoản thanh toán băng thông được chuyển cho người stake thay vì chủ nút."
  source: "8f438c673bed"
sentinel-dvpn.rating.cons.1.text:
  text: "Token đã được đổi tên từ SENT sang DVPN vào năm 2021 và từ DVPN sang P2P vào năm 2025."
  source: "fe00f1052e84"
sentinel-dvpn.rating.cons.2.text:
  text: "CashPilot không chạy Sentinel: bạn dùng phần mềm nút riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "e15d3cbbb7f0"
sentinel-dvpn.rating.pros.0.text:
  text: "Sentinel công bố mã nguồn nút theo giấy phép mã nguồn mở riêng của họ."
  source: "1ec84f6772aa"
sia-hostd.description:
  text: "Sia là một chợ lưu trữ phi tập trung do Sia Foundation (một tổ chức phi lợi nhuận tại Thụy Sĩ) vận hành từ năm 2015. Hãy chạy nút hostd chính thức của Foundation để cho thuê dung lượng đĩa còn trống và kiếm Siacoin từ các hợp đồng lưu trữ và băng thông. Bạn phải mua một ít Siacoin trước khi nút có thể kiếm tiền: chủ máy khóa tài sản thế chấp cho mỗi hợp đồng và trả phí cho mỗi bằng chứng lưu trữ. Tài sản thế chấp được hoàn lại khi hợp đồng hoàn tất và bị đốt nếu nút ngoại tuyến hoặc mất dữ liệu, nên cần một máy luôn bật (Sia nói ít nhất 95% thời gian hoạt động). Thu nhập phụ thuộc vào lượng dữ liệu người thuê thực sự lưu; Sia khuyên đặt giá lưu trữ $1 mỗi TB mỗi tháng, nên phù hợp với máy có ổ đĩa trống lớn hơn là các gói VPS nhỏ.\n"
  source: "fbf5a0d9cc23"
sia-hostd.short_description:
  text: "Nút lưu trữ của Sia Foundation - image Docker chính thức, kiếm Siacoin"
  source: "b0ced885ebf3"
sia-hostd.docker.env.HOSTD_WALLET_SEED.label:
  text: "Cụm từ khôi phục ví"
  source: "8dd38106e7a8"
sia-hostd.docker.env.HOSTD_API_PASSWORD.label:
  text: "Mật khẩu bảng điều khiển"
  source: "0d698d17c770"
sia-hostd.docker.env.SIA_STORAGE_DIR.label:
  text: "Thư mục lưu trữ"
  source: "e5e630e5c8d5"
sia-hostd.docker.env.HOSTD_WALLET_SEED.description:
  text: "Cụm từ khôi phục BIP-39 kiểm soát ví Siacoin của chủ máy. Tạo một cụm bằng `docker run --rm ghcr.io/siafoundation/hostd seed` và sao lưu nó -- đó là cách DUY NHẤT để lấy được thu nhập"
  source: "b6567587dec1"
sia-hostd.docker.env.HOSTD_API_PASSWORD.description:
  text: "Mật khẩu cho giao diện web và API cục bộ của hostd (BasicAuth). Một cụm mật khẩu dài bất kỳ"
  source: "8008360c6e3f"
sia-hostd.docker.env.SIA_STORAGE_DIR.description:
  text: "Đường dẫn trên máy chủ, trên ổ đĩa lớn nhất của bạn, nơi lưu dữ liệu của người thuê (ví dụ /srv/sia). Cần trống ít nhất 256GB"
  source: "f6d6275a3a95"
sia-hostd.docker.setup:
  text: "Khi triển khai, CashPilot tạo một ví mới trên máy chạy nút và hiển thị cụm từ khôi phục của nó một lần: hãy ghi lại. Để dùng ví bạn đã có, hãy dán cụm từ khôi phục của ví đó vào. Sau khi triển khai, gửi một ít Siacoin vào ví của nút cho tài sản thế chấp và phí, rồi thêm thư mục lưu trữ (/storage), đặt giá và công bố chủ máy trên bảng điều khiển.\n"
  source: "63ba7c0d2fe1"
sia-hostd.docker.critical_volumes.0.holds:
  text: "Cụm từ khôi phục ví (hostd.yml), cơ sở dữ liệu ví, cài đặt chủ máy và trạng thái hợp đồng. Mất nó là mất danh tính của nút và việc theo dõi doanh thu hợp đồng; khi đó cụm từ khôi phục bạn đã ghi lại là cách duy nhất để lấy lại tiền."
  source: "d4893e66d686"
sia-hostd.docker.critical_volumes.1.holds:
  text: "Dữ liệu đã lưu của người thuê. Mất nó sẽ làm thất bại các bằng chứng lưu trữ và mất tài sản thế chấp đã khóa cho các hợp đồng đó."
  source: "27609c8f3b56"
sia-hostd.earnings.notes:
  text: "Chủ máy tự đặt giá. Sia khuyên $1 mỗi TB lưu trữ mỗi tháng và trên $5 mỗi TB tải xuống, và 3.9% mỗi khoản thanh toán hợp đồng được chuyển cho người nắm giữ Siafund. Thu nhập tăng theo lượng dữ liệu người thuê đặt trên nút, bắt đầu từ con số không và tăng dần theo thời gian hoạt động và giá. Tài sản thế chấp (Sia gợi ý gấp 2 lần giá lưu trữ) được khóa theo từng hợp đồng và hoàn lại khi hợp đồng hoàn tất thành công.\n"
  source: "c75b5ef120a2"
sia-hostd.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
sia-hostd.cashout.notes:
  text: "Thu nhập tích lũy trong ví Siacoin riêng của chủ máy (được kiểm soát bằng cụm từ khôi phục). Hãy đổi SC trên sàn giao dịch và rút về ngân hàng/thẻ từ đó; không có yêu cầu thanh toán phía nhà cung cấp.\n"
  source: "d7cd78aecc51"
sia-hostd.payout.notes:
  text: "Tiền nằm trong ví Sia được kiểm soát bằng cụm từ khôi phục, bên trong nút. Cụm từ khôi phục chỉ nằm trong volume dữ liệu của hostd trên máy chạy nó; CashPilot không bao giờ lưu nó. Cụm từ bạn ghi lại khi tạo ví là cách khôi phục duy nhất.\n"
  source: "1ebb53c82965"
sia-hostd.requirements.note:
  text: "Một địa chỉ công khai ổn định với các cổng 9981 (TCP, đồng thuận) và 9984 (TCP và UDP, hợp đồng người thuê) được chuyển tiếp. Thuê máy chủ ở trung tâm dữ liệu/VPS là phổ biến trên Sia. Ví cần có Siacoin trước khi nút nhận được hợp đồng."
  source: "c703c483d7de"
sia-hostd.requirements.min_storage:
  text: "256GB"
  source: "713d8025cf43"
sia-hostd.disclosure.sells:
  text: "Dung lượng đĩa và băng thông để phục vụ nó."
  source: "feb277d10fc3"
sia-hostd.disclosure.third_party_traffic:
  text: "Không. Người thuê lưu các mảnh tệp đã mã hóa trên đĩa của bạn và tải chúng về lại. Người khác không định tuyến lưu lượng tùy ý qua IP của bạn."
  source: "b382f0dedda8"
sia-hostd.disclosure.data_collected:
  text: "Địa chỉ ví Sia của bạn, khóa công khai của chủ máy và IP:cổng công khai mà nút công bố để người thuê kết nối tới."
  source: "ed668332f74c"
sia-hostd.disclosure.isp_risk:
  text: "Lưu lượng tải lên/tải xuống liên tục trên đường truyền, giống như chạy bất kỳ máy chủ lưu trữ nào; không có lưu lượng web ẩn danh nào của bên thứ ba bị quy cho bạn."
  source: "5667d9bb1bbd"
sia-hostd.disclosure.account_rules:
  text: "Không cần cấp phép: không đăng ký, không tài khoản. Tài sản thế chấp bị đốt nếu nút bỏ lỡ bằng chứng lưu trữ, do ngoại tuyến hoặc mất dữ liệu."
  source: "b397ece8c8b1"
sia-hostd.rating.cons.0.text:
  text: "Thu nhập là Siacoin trong ví của chính bạn: không có thanh toán về ngân hàng, nên bạn phải tự bán trên sàn giao dịch."
  source: "deab002c0c25"
sia-hostd.rating.cons.1.text:
  text: "Tài sản thế chấp được khóa theo từng hợp đồng và bị đốt nếu chủ máy bỏ lỡ bằng chứng lưu trữ do ngoại tuyến hoặc mất dữ liệu."
  source: "bba604ff84a8"
sia-hostd.rating.cons.2.text:
  text: "Chỉ khoảng 30% dung lượng lưu trữ được cung cấp trên mạng đang được dùng, nên chủ máy mới phải cạnh tranh trong khi nhu cầu thấp."
  source: "9d6e510fc17d"
sia-hostd.rating.cons.3.text:
  text: "Người thuê lưu các mảnh tệp đã mã hóa và không ai định tuyến lưu lượng qua IP của bạn, nhưng chúng tôi không tìm thấy nơi Sia nói người thuê là ai hay được kiểm tra thế nào."
  source: "7c08211baa39"
sia-hostd.rating.pros.0.text:
  text: "hostd được Sia Foundation phát triển công khai từ năm 2022."
  source: "fc5085d984bd"
sia-hostd.rating.pros.1.text:
  text: "hostd là mã nguồn mở theo giấy phép MIT."
  source: "a1f7384689ac"
sia-hostd.rating.pros.2.text:
  text: "Sia Foundation phát hành hostd dưới dạng image container."
  source: "9bff2e45b3d5"
sia-hostd.rating.pros.3.text:
  text: "Không cần cấp phép: không đăng ký, không tài khoản."
  source: "f1f8d4114f1e"
spide.description:
  text: "Spide là dịch vụ chia sẻ băng thông giúp bạn kiếm tiền từ băng thông internet chưa dùng. Dùng một machine ID tùy chọn để theo dõi thiết bị. Có sẵn qua các image Docker cộng đồng từ dự án income-generator.\n"
  source: "d8baa5c2cd58"
spide.short_description:
  text: "Chia sẻ băng thông - dựa trên machine ID"
  source: "d991c5cf3130"
spide.docker.env.SPIDE_MACHINE_ID.label:
  text: "Machine ID"
  source: "ef6727e4053f"
spide.docker.env.SPIDE_MACHINE_ID.description:
  text: "Machine ID của thiết bị đã đăng ký từ trước (tự tạo nếu để trống)"
  source: "748bd7895b01"
spide.earnings.notes:
  text: "Có ít thông tin. Thu nhập phụ thuộc vào vị trí."
  source: "5f1a99c2e9aa"
spide.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
spide.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
spide.referral.bonus.referrer:
  text: "10% thu nhập của họ"
  source: "4a3b60ba9934"
spide.referral.bonus.referee:
  text: "Thưởng đăng ký $5"
  source: "ed267fc12fb2"
spide.requirements.note:
  text: "Lưu lượng qua một IP công khai được chia cho các thiết bị dùng chung IP đó, nên thiết bị thứ hai trên cùng kết nối không thêm được gì."
  source: "20f95ea262c7"
spide.rating.cons.0.text:
  text: "CashPilot không chạy Spide: bạn dùng ứng dụng riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "5e58a2dc6f66"
srbminer-multi.description:
  text: "Đào Pearl, Zano hoặc Ravencoin bằng một GPU NVIDIA. CashPilot tải bản phát hành chính thức của SRBMiner-Multi ở lần khởi động đầu tiên và kiểm tra SHA-256. Pool bạn chọn trả tiền vào địa chỉ nhận thanh toán công khai của bạn. SRBMiner-Multi giữ 2% thời gian băm trên Pearl và 0.85% trên hai đồng còn lại. Tiền điện có thể cao hơn số coin bạn kiếm được."
  source: "a32202ef76d4"
srbminer-multi.short_description:
  text: "Đào Pearl và các coin GPU khác trên GPU NVIDIA"
  source: "21ebe0c11493"
srbminer-multi.docker.env.WALLET.label:
  text: "Địa chỉ nhận thanh toán"
  source: "a611868d7f79"
srbminer-multi.docker.env.WORKER_NAME.label:
  text: "Tên worker"
  source: "73f1a739a9a5"
srbminer-multi.docker.env.ALGO.label:
  text: "Thuật toán"
  source: "d704d8af25be"
srbminer-multi.docker.env.POOL_URL.label:
  text: "Pool (host:cổng)"
  source: "ab1c82ce8afb"
srbminer-multi.docker.env.POOL_TLS.label:
  text: "Mã hóa kết nối tới pool (TLS)"
  source: "4e0bd161c5ae"
srbminer-multi.docker.env.WALLET.description:
  text: "Địa chỉ Pearl công khai của bạn (prl1...). Với Zano hoặc Ravencoin, hãy nhập địa chỉ của đồng đó và một pool cho nó."
  source: "2a587f09956a"
srbminer-multi.docker.env.ALGO.description:
  text: "pearlhash cho Pearl, progpow_zano cho Zano, kawpow cho Ravencoin."
  source: "31c8ee0aa660"
srbminer-multi.docker.runtime_reason:
  text: "gVisor không thể chuyển GPU cho dịch vụ này."
  source: "302a2b5c988f"
srbminer-multi.earnings.notes:
  text: "Ước tính gộp trước tiền điện. Ngày 2026-11-25, hashrate.no ước tính khoảng $2.45 mỗi ngày trên Pearl cho một RTX 4070 tiêu thụ khoảng 142 W. Chúng tôi chưa đo con số này. Pearl là đồng coin mới, giá và độ khó thay đổi nhanh. Hãy kiểm tra công suất GPU và giá điện của bạn để xem có lãi không."
  source: "e7b856e43825"
srbminer-multi.payment.minimum_payout:
  text: "1 PRL (HeroMiners)"
  source: "4b77c18046d5"
srbminer-multi.payment.frequency:
  text: "Khi đạt ngưỡng của pool"
  source: "6c6d28b5c7e0"
srbminer-multi.cashout.notes:
  text: "Pool trả tiền vào địa chỉ của bạn khi số dư đạt ngưỡng của bạn. Pool giữ số dư cho đến khi trả cho bạn."
  source: "8e034725e268"
srbminer-multi.requirements.note:
  text: "Linux amd64, một GPU NVIDIA và NVIDIA Container Toolkit"
  source: "97ce03b75cdb"
srbminer-multi.requirements.hosting_note:
  text: "Máy này báo cáo là kết nối máy chủ thuê. Hãy kiểm tra điều khoản của nhà cung cấp trước khi đào. Một số nhà cung cấp, bao gồm Hetzner Cloud, cấm việc này. Hãy kiểm tra chi phí điện thực tế trước khi dựa vào ước tính lợi nhuận."
  source: "8896f33e3cc8"
srbminer-multi.mining.pool_fee_note:
  text: "Phí thợ đào 2% áp dụng cho pearlhash. SRBMiner-Multi giữ 0.85% trên progpow_zano và kawpow. HeroMiners, pool Pearl mặc định, thu phí pool 1%. Pool kiểm tra thanh toán mỗi giờ và trả từ 1 PRL. Các pool khác tự đặt mức phí và ngưỡng."
  source: "86701ce10f63"
srbminer-multi.disclosure.sells:
  text: "điện toán"
  source: "b04a12f6483e"
srbminer-multi.disclosure.third_party_traffic:
  text: "Không. Máy đào gửi công việc tới pool bạn chọn."
  source: "110e9ac94486"
srbminer-multi.disclosure.data_collected:
  text: "Địa chỉ nhận thanh toán, tên worker và địa chỉ IP của bạn được gửi tới pool. Lần khởi động đầu tiên tải máy đào từ GitHub."
  source: "a6331cbbb4b5"
srbminer-multi.disclosure.isp_risk:
  text: "Một số mạng và trình phân giải DNS chặn kết nối tới pool đào."
  source: "6e2ea365730d"
srbminer-multi.disclosure.account_rules:
  text: "Hầu hết các pool nhận diện bạn qua địa chỉ nhận thanh toán công khai."
  source: "5669141a44b8"
srbminer-multi.rating.cons.0.text:
  text: "Máy đào giữ 2% thời gian băm trên Pearl và 0.85% trên Zano và Ravencoin."
  source: "2472255145fc"
srbminer-multi.rating.cons.1.text:
  text: "Một số nhà cung cấp máy chủ cấm đào tiền mã hóa."
  source: "75c328007375"
srbminer-multi.rating.cons.2.text:
  text: "Máy đào là mã nguồn đóng, nên không ai ngoài nhà phát triển có thể kiểm tra nó chạy gì."
  source: "b2aef0ab418e"
srbminer-multi.rating.cons.3.text:
  text: "Tiền điện của GPU có thể cao hơn số coin kiếm được, và giá Pearl biến động nhanh."
  source: "5a93bbb42b19"
srbminer-multi.rating.pros.0.text:
  text: "Máy đào gửi công việc tới pool và không chuyển tiếp lưu lượng của ai khác."
  source: "148c3c69025e"
srbminer-multi.rating.pros.1.text:
  text: "Bạn có thể đào Pearl trên HeroMiners với một địa chỉ công khai và không cần tài khoản."
  source: "1844ccbbc00a"
storj.description:
  text: "Storj là một mạng lưu trữ đám mây phi tập trung, nơi bạn kiếm tiền bằng cách cho thuê dung lượng đĩa chưa dùng. Chạy nút lưu trữ qua Docker và nhận $1.35/TB lưu trữ mỗi tháng cộng $1/TB lưu lượng ra (mức giá từ ngày 1 tháng 9 năm 2026). Thanh toán hằng tháng bằng USDC, một stablecoin đô la Mỹ, trên Ethereum mainnet vào ví do bạn kiểm soát, khi số dư vượt mức tối thiểu dựa trên phí (token STORJ cho đến kỳ thanh toán tháng 9 năm 2026). Cần ít nhất 550GB dung lượng đĩa trống và kết nối internet ổn định. Không cần tài khoản hay đăng ký -- các nút không cần cấp phép từ giữa năm 2025. LƯU Ý (tháng 10 năm 2026): Storj Labs đã nộp đơn theo Chapter 11 vào ngày 26 tháng 7 năm 2026 (US Bankruptcy Court, Northern District of West Virginia, vụ 5:26-bk-00512) để tái cơ cấu khoản nợ cũ. Mạng vẫn chạy và Storj vẫn trả tiền cho các nút đang hoạt động, nhưng thu nhập của nút từ trước ngày nộp đơn bị đóng băng cho đến khi tòa án ra phán quyết. Token STORJ đã giảm khoảng 98% so với đỉnh năm 2021. Binance đã hủy niêm yết nó vào ngày 3 tháng 9 năm 2026, và Coinbase tạm ngưng giao dịch nó vào ngày 28 tháng 9 năm 2026. Một nút mới giữ lại một phần thu nhập trong chín tháng đầu và chỉ được lấp đầy theo nhu cầu của khách hàng, nên khởi chạy một nút lúc này nghĩa là gắn một thời gian hoàn vốn dài với một công ty đang tái cơ cấu và vẫn có thể giải thể.\n"
  source: "491c6a4d439a"
storj.short_description:
  text: "Nút lưu trữ phi tập trung - $1.35/TB lưu trữ + $1/TB lưu lượng ra"
  source: "c68d5964b002"
storj.docker.env.WALLET.label:
  text: "Địa chỉ ví"
  source: "5c498d0d2aff"
storj.docker.env.EMAIL.label:
  text: "Email"
  source: "969ccbd3cf63"
storj.docker.env.ADDRESS.label:
  text: "Địa chỉ bên ngoài"
  source: "bf3e83d766cb"
storj.docker.env.STORAGE.label:
  text: "Dung lượng cấp phát"
  source: "c1b56c2a43dc"
storj.docker.env.IDENTITY_DIR.label:
  text: "Thư mục danh tính"
  source: "529f308c099f"
storj.docker.env.STORAGE_DIR.label:
  text: "Thư mục lưu trữ"
  source: "e5e630e5c8d5"
storj.docker.env.WALLET.description:
  text: "Địa chỉ ví Ethereum để nhận thanh toán USDC (ví dụ 0x1234...abcd). Phải là ví tự lưu ký (MetaMask, Ledger, v.v.) -- không bao giờ dùng địa chỉ sàn giao dịch"
  source: "5301b6030345"
storj.docker.env.EMAIL.description:
  text: "Địa chỉ email để nhận thông báo dành cho người vận hành"
  source: "7ff1fa835a7b"
storj.docker.env.ADDRESS.description:
  text: "Tên máy DDNS kèm cổng (ví dụ mynode.ddns.net:28967) -- rất nên dùng thay cho IP cố định, vì IP cố định sẽ khiến nút mất kết nối vào ngày ISP âm thầm cấp lại IP. Cổng 28967 phải được chuyển tiếp (TCP+UDP)"
  source: "408df4211220"
storj.docker.env.STORAGE.description:
  text: "Dung lượng đĩa tối đa cấp phát (ví dụ 2TB). Dùng ổ cứng cơ (HDD), không dùng SSD"
  source: "9cb4ccc405fd"
storj.docker.env.IDENTITY_DIR.description:
  text: "Đường dẫn trên máy chủ nơi lưu các tệp danh tính (phải chứa ca.cert, ca.key, identity.cert, identity.key)"
  source: "160329f11576"
storj.docker.env.STORAGE_DIR.description:
  text: "Đường dẫn trên máy chủ, trên ổ cứng cơ (HDD), để lưu dữ liệu Storj. Cần trống ít nhất 550GB"
  source: "71bbe07a51d1"
storj.docker.setup:
  text: "Trước lần chạy đầu tiên, hãy khởi tạo cấu hình nút lưu trữ: docker run --rm -e SETUP=\"true\" --user $(id -u):$(id -g) --mount type=bind,source=\"<IDENTITY_DIR>\",destination=/app/identity --mount type=bind,source=\"<STORAGE_DIR>\",destination=/app/config --name storagenode storjlabs/storagenode:latest\n"
  source: "8dbddeb01bd7"
storj.docker.critical_volumes.0.holds:
  text: "Danh tính của nút. ID của nó gắn với proof-of-work và mất hàng giờ để tạo lại, và không thể tạo lại từ bản sao lưu của bất kỳ thứ gì khác. Mất nó là mất số dư thanh toán đang bị giữ."
  source: "23b24ee72d12"
storj.docker.critical_volumes.1.holds:
  text: "Dữ liệu khách hàng đã lưu và khoản tiền bị giữ của nút. Mất nó khiến nút bị loại và mất số dư đang bị giữ."
  source: "82eec0646b75"
storj.docker.health_signals.0.means:
  text: "Mạng Storj không kết nối ngược lại được tới nút của bạn tại ADDRESS đã công bố, nên các satellite coi nó là ngoại tuyến: dữ liệu mới ngừng đến, thu nhập từ lưu lượng ra đứng yên, và ngoại tuyến kéo dài sẽ dẫn đến bị tạm ngưng. Hãy kiểm tra ADDRESS khớp với IP công khai HIỆN TẠI của bạn (dùng tên máy DDNS, không dùng IP cố định, để việc ISP cấp lại IP không làm nút mất kết nối) và cổng 28967 TCP+UDP được chuyển tiếp tới máy này."
  source: "dae57f7f1fd0"
storj.earnings.notes:
  text: "$1.35/TB lưu trữ + $1/TB lưu lượng ra + $1/TB kiểm tra/sửa chữa từ ngày 1 tháng 9 năm 2026. Thu nhập tăng theo dữ liệu lưu trữ và tuổi của nút. Trong 9 tháng đầu, 75%, rồi 50%, rồi 25% thu nhập bị giữ lại; một nửa khoản bị giữ được trả lại vào tháng thứ 16 và phần còn lại khi rời mạng đúng quy trình. Cổng 28967 phải được chuyển tiếp."
  source: "c2edb0df32bc"
storj.payment.minimum_payout:
  text: "Gấp 4 lần phí giao dịch Ethereum, số dư nhỏ hơn được chuyển sang kỳ sau"
  source: "29ecc25530cd"
storj.payment.frequency:
  text: "Hằng tháng"
  source: "9b11f6b707d2"
storj.cashout.notes:
  text: "Trả hằng tháng bằng USDC trên Ethereum mainnet khi số dư ví đạt ít nhất bốn lần phí giao dịch hiện tại; số dư nhỏ hơn được chuyển sang tháng sau. Token STORJ cho đến kỳ thanh toán tháng 9 năm 2026. Bảng điều khiển ở cổng 14002."
  source: "6208f04947d2"
storj.payout.notes:
  text: "Trả hằng tháng bằng USDC trên Ethereum mainnet vào địa chỉ trong WALLET khi số dư vượt mức tối thiểu dựa trên phí. Token STORJ cho đến kỳ thanh toán tháng 9 năm 2026; thanh toán qua zkSync Era đã kết thúc ngày 1 tháng 9 năm 2026."
  source: "40cd2cdd19a1"
storj.collector.credential_hint:
  text: "URL bảng điều khiển của nút ở cổng 14002, dùng IP LAN của máy chủ thay vì localhost, ví dụ <b>http://192.168.1.10:14002</b>. Với nhiều nút, hãy liệt kê URL của chúng, phân tách bằng dấu phẩy: CashPilot sẽ cộng chúng lại."
  source: "e582f1e74baa"
storj.requirements.note:
  text: "Các nút Storj cùng một subnet /24 chia sẻ lượng dữ liệu được phân bổ, làm giảm thu nhập của mỗi nút."
  source: "02fc05656d59"
storj.requirements.min_bandwidth:
  text: "5 Mbps tải lên"
  source: "0ad43a8f48e5"
storj.requirements.min_storage:
  text: "550GB"
  source: "23e6bd08c411"
storj.disclosure.sells:
  text: "Dung lượng đĩa và băng thông để phục vụ nó."
  source: "feb277d10fc3"
storj.disclosure.third_party_traffic:
  text: "Không. Bạn lưu các mảnh dữ liệu khách hàng đã được mã hóa và mã hóa xóa (erasure coding). Người khác không định tuyến lưu lượng riêng của họ qua IP của bạn."
  source: "717aab4d790c"
storj.disclosure.data_collected:
  text: "Danh tính nút, địa chỉ ví của bạn, địa chỉ email mà nút yêu cầu để gửi thông báo cho người vận hành, cùng IP và cổng của bạn, vốn phải truy cập được để nút phục vụ dữ liệu."
  source: "866fddd1e24e"
storj.disclosure.isp_risk:
  text: "Chủ yếu là vấn đề giới hạn dữ liệu hơn là trách nhiệm pháp lý: một nút liên tục gửi và nhận dữ liệu khách hàng, đó là lưu lượng thật và liên tục trên đường truyền của bạn. Tuy nhiên, khác với proxy hay relay, đây không phải lưu lượng ẩn danh của bên thứ ba bị quy cho bạn là nguồn gốc, nên nó không bị khiếu nại lạm dụng như các loại đó."
  source: "8ea3292ea827"
storj.disclosure.account_rules:
  text: "Không giới hạn số nút, nhưng các nút cùng subnet /24 chia sẻ phần phân bổ, nên nhiều nút trên một kết nối sẽ kiếm ít hơn mỗi nút."
  source: "ff520ffe859f"
storj.rating.cons.0.text:
  text: "CoinDesk đưa tin ngày 27 tháng 7 năm 2026 rằng Storj Labs đã nộp đơn xin bảo hộ phá sản theo Chapter 11."
  source: "64be355f8a0c"
storj.rating.cons.1.text:
  text: "Các khoản thanh toán cho người vận hành nút từ trước ngày nộp đơn đã đi vào quy trình yêu cầu bồi hoàn phá sản."
  source: "57fc1c448578"
storj.rating.cons.2.text:
  text: "Một nút mới bị giữ 75%, rồi 50%, rồi 25% thu nhập trong chín tháng đầu; một nửa được trả lại vào tháng thứ 16 và phần còn lại chỉ khi rời mạng đúng quy trình."
  source: "73c15c028e81"
storj.rating.cons.3.text:
  text: "Khách hàng lưu các mảnh tệp đã mã hóa và không ai định tuyến lưu lượng qua IP của bạn, nhưng chúng tôi không tìm thấy nơi Storj nói khách hàng là ai hay được kiểm tra thế nào."
  source: "7dec7f83c580"
storj.rating.pros.0.text:
  text: "Phần mềm nút lưu trữ là mã nguồn mở theo AGPL-3.0."
  source: "4f72f917d7ad"
storj.rating.pros.1.text:
  text: "Storj phát hành image Docker riêng, storjlabs/storagenode."
  source: "4446ff097b44"
storj.rating.pros.2.text:
  text: "Không cần tài khoản: một địa chỉ ví và một email để nhận thông báo cho người vận hành."
  source: "223370a666dc"
storj.rating.pros.3.text:
  text: "Các nút đang hoạt động vẫn tiếp tục được trả tiền sau khi nộp đơn."
  source: "4fe86a05f5b4"
supportxmr.description:
  text: "SupportXMR là một pool đào Monero không cần tài khoản: máy đào của bạn đăng nhập bằng địa chỉ Monero làm tên người dùng, và pool trả tiền vào địa chỉ đó. CashPilot không chạy máy đào ở đây. Nó đọc số dư mà SupportXMR đang giữ cho địa chỉ của bạn, để bạn thấy máy đào CPU của mình đã kiếm được bao nhiêu bên cạnh các nguồn thu nhập khác. Số dư là đã kiếm được nhưng chưa nhận: pool trả nó khi vượt ngưỡng thanh toán của bạn.\n"
  source: "46775dea0e78"
supportxmr.short_description:
  text: "Pool đào Monero, theo dõi qua địa chỉ nhận thanh toán của bạn"
  source: "9addded0c933"
supportxmr.payment.minimum_payout:
  text: "0.1 XMR (tự động), 0.01 XMR theo yêu cầu"
  source: "766cf858f810"
supportxmr.payment.frequency:
  text: "Khi số dư vượt ngưỡng của bạn, hoặc theo yêu cầu"
  source: "a7d739013f98"
supportxmr.cashout.notes:
  text: "SupportXMR trả tiền vào địa chỉ của bạn khi số dư đạt ngưỡng (mặc định 0.1 XMR). Trên website, bạn cũng có thể yêu cầu thanh toán ngay từ 0.01 XMR, với phí 0.001 XMR."
  source: "f3c8eaa23884"
supportxmr.payout.notes:
  text: "Số dư là đã kiếm được nhưng chưa nhận cho đến khi SupportXMR trả vào địa chỉ này. Không thể đọc số dư Monero on-chain nếu không có private view key, thứ mà CashPilot không bao giờ hỏi, nên bạn tự xác nhận từng khoản thanh toán."
  source: "cef087f09264"
supportxmr.collector.credential_hint:
  text: "Địa chỉ nhận thanh toán Monero của bạn: tên người dùng mà máy đào dùng trên SupportXMR, không có phần <b>.workername</b> hay <b>+difficulty</b>. Địa chỉ này công khai và không mở khóa được tiền."
  source: "aa51d0d3b25f"
supportxmr.requirements.note:
  text: "Cần một máy đào Monero (XMRig) trỏ tới pool.supportxmr.com"
  source: "f5cc305b8e5e"
supportxmr.disclosure.sells:
  text: "điện toán"
  source: "b04a12f6483e"
supportxmr.disclosure.third_party_traffic:
  text: "Không. Máy đào của bạn gửi hash tới pool; không ai định tuyến lưu lượng qua kết nối của bạn."
  source: "7239118f749a"
supportxmr.disclosure.data_collected:
  text: "Địa chỉ Monero của bạn, tên worker bạn chọn, hashrate và địa chỉ IP của máy đào theo những gì pool thấy."
  source: "996b8412a2a2"
supportxmr.disclosure.isp_risk:
  text: "Máy đào giữ một kết nối mở tới pool và dùng rất ít băng thông. Chi phí cần để ý là tiền điện, không phải ISP."
  source: "7bf5f9f6b028"
supportxmr.disclosure.account_rules:
  text: "Không có tài khoản. Địa chỉ chính là danh tính, và bất kỳ ai cũng có thể xem thống kê của nó trên supportxmr.com."
  source: "6435e3dd0df8"
supportxmr.rating.cons.0.text:
  text: "Chỉ trả bằng Monero, với phí pool 0.6% và ngưỡng mặc định 0.1 XMR trước khi thanh toán tự động."
  source: "77a1f0ce4c3b"
supportxmr.rating.cons.1.text:
  text: "CashPilot không chạy máy đào cho SupportXMR: bạn tự trỏ máy đào của mình tới pool, và CashPilot chỉ đọc số dư."
  source: "dfddab40ccc1"
teneo.description:
  text: "Teneo Protocol cho phép AI agent truy cập web theo thời gian thực qua một mạng lưới Beacon. Teneo Beacon là ứng dụng riêng của Teneo cho Android, iOS, macOS, Windows và Linux, có bản dòng lệnh cho máy chủ và Raspberry Pi. Nó chia sẻ băng thông chưa dùng của bạn sau khi bạn chấp nhận màn hình đồng ý, và kiếm Teneo Protocol Points cùng Fragments khi đang trực tuyến. Fragments được tính vào các đợt rút thăm theo mùa trả bằng USDC (Beacon Drop). Teneo cho biết Beacon kiếm gấp đôi điểm so với tiện ích trình duyệt cũ. Mỗi kết nối internet chỉ một Beacon kiếm tiền. Các thiết bị khác trên cùng kết nối ở chế độ chờ. Hãy đăng ký trong Expedition Hub bằng liên kết giới thiệu hoặc mã PSA3BHPJ, rồi đăng nhập vào Beacon.\n"
  source: "99fa3c58ed09"
teneo.short_description:
  text: "Ứng dụng băng thông DePIN (Beacon) - Fragments cho các đợt rút thăm USDC theo mùa, +100 Fragments với liên kết giới thiệu"
  source: "611b2fe95a62"
teneo.earnings.notes:
  text: "Kiếm Teneo Points và Fragments. Fragments được tính vào các đợt rút thăm USDC theo mùa, nên mỗi mùa trả giải thưởng, không phải theo mức giá cố định. Teneo cho biết Beacon kiếm gấp đôi điểm so với tiện ích trình duyệt. Nhận boost mỗi 8 giờ để có tới 3x Fragments; bỏ lỡ một lượt sẽ giảm hệ số nhân."
  source: "7a9714079893"
teneo.payment.frequency:
  text: "Rút thăm theo mùa (Beacon Drop)"
  source: "5e2e1da9e1ad"
teneo.cashout.notes:
  text: "Giải thưởng Beacon Drop được trả bằng USDC vào ví bạn liên kết trong Expedition Hub. Hub hiển thị số ngày bạn còn để liên kết ví; giải thưởng không có ví được liên kết kịp thời sẽ bị mất."
  source: "4edbb3f949fe"
teneo.payout.notes:
  text: "Hãy liên kết ví trong Expedition Hub trước khi giải thưởng của mùa được trả; Hub hủy giải thưởng nếu ví không được liên kết kịp thời."
  source: "4657ddd2fc8f"
teneo.referral.bonus.referrer:
  text: "8% Fragments của mỗi người bạn được giới thiệu và 2% Fragments của những người họ giới thiệu, khi người bạn đăng ký trong vòng 7 ngày và kiếm được 480 Fragments"
  source: "17fa3888054e"
teneo.referral.bonus.referee:
  text: "+100 Fragments khi đăng ký, và thêm +150 khi bạn đạt 480 Fragments"
  source: "6a12fe8e4754"
teneo.requirements.note:
  text: "Mỗi kết nối internet chỉ một Beacon kiếm tiền. Máy ở trung tâm dữ liệu chỉ kiếm được trên các nhà cung cấp máy chủ mà Teneo đã cho phép, với một nửa Fragments và không có điểm hay thưởng giới thiệu. Kết nối VPN không bao giờ kiếm được."
  source: "f567880b8f24"
teneo.rating.cons.0.text:
  text: "Fragments của Beacon chỉ trả USDC dưới dạng giải thưởng trong các đợt rút thăm theo mùa, nên chạy nó không mang lại một khoản cố định."
  source: "aa946d8317c0"
teneo.rating.cons.1.text:
  text: "Teneo cho biết điểm sẽ được gộp vào $AGENTIC, một token thưởng không chuyển nhượng được, chứ không phải token $TENEO."
  source: "70349aaccbb0"
teneo.rating.cons.2.text:
  text: "Tính đến tháng 11 năm 2026, chưa có ngày ra mắt, phân bổ hay quy trình nhận $TENEO nào được xác nhận, sau khi mục tiêu trước đó là quý 2 năm 2026 đã trôi qua."
  source: "77717754fe10"
teneo.rating.cons.3.text:
  text: "CashPilot không chạy Teneo: bạn cài ứng dụng Beacon riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "e13c3bdfca7b"
teneo.rating.cons.4.text:
  text: "Teneo cho biết lưu lượng đến từ khách hàng doanh nghiệp đã được thẩm định và chặn các địa chỉ riêng cùng các cổng dễ bị lạm dụng, nhưng không nói họ thẩm định các khách hàng đó thế nào."
  source: "b3d1634ab7a1"
theta-edge.description:
  text: "Theta Network là một mạng phân phối video và điện toán AI phi tập trung đã có tên tuổi (từ năm 2018). Người dùng chạy Edge Node chia sẻ băng thông, lưu trữ và sức mạnh tính toán. Có các quan hệ đối tác nội dung lớn. Kiếm token TFUEL.\n"
  source: "6d74a9520fd5"
theta-edge.short_description:
  text: "CDN phi tập trung + điện toán AI - thưởng TFUEL, dự án lâu năm"
  source: "aa7432c1c003"
theta-edge.earnings.notes:
  text: "Chỉ có ứng dụng desktop. Thu nhập phụ thuộc vào tài nguyên và vị trí. Có đối tác lớn, được niêm yết trên mọi sàn giao dịch."
  source: "bc452e52af4f"
theta-edge.payment.frequency:
  text: "Liên tục"
  source: "04f13cecbc50"
theta-edge.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
theta-edge.rating.cons.0.text:
  text: "CashPilot không chạy Theta Edge: bạn dùng ứng dụng desktop riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "893de938ed14"
titan.description:
  text: "Titan Network là một nền tảng DePIN chia sẻ địa chỉ IP, dung lượng lưu trữ và băng thông của bạn để đổi lấy phần thưởng token TNT. Có trên Windows, Mac và Android. Các nút đóng góp cho một CDN và lớp lưu trữ phi tập trung. Thu nhập thông thường từ $5-30/tháng tùy tài nguyên chia sẻ và vị trí địa lý.\n"
  source: "0025b1c985a4"
titan.short_description:
  text: "DePIN chia sẻ IP, lưu trữ, băng thông - $5-30/tháng"
  source: "799e68401067"
titan.earnings.notes:
  text: "Chia sẻ IP, lưu trữ và băng thông. Thu nhập phụ thuộc vào tài nguyên đóng góp và khu vực. Cấp phát nhiều dung lượng lưu trữ hơn sẽ được thưởng nhiều hơn."
  source: "2e57fac7ce05"
titan.payment.frequency:
  text: "Theo epoch"
  source: "75743e03bad2"
titan.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
titan.requirements.min_storage:
  text: "50GB"
  source: "f017c0207e78"
titan.rating.cons.0.text:
  text: "Chính trang trợ giúp của Titan nói một nút đang chạy không đảm bảo có thu nhập: không được giao tác vụ thì không kiếm được gì, và phần thưởng là token TNT."
  source: "bc5de572a095"
titan.rating.cons.1.text:
  text: "CashPilot không chạy Titan: bạn dùng ứng dụng hoặc tiện ích riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "c5b81574c185"
traffmonetizer.description:
  text: "Traffmonetizer giúp bạn kiếm tiền từ lưu lượng internet bằng cách chia sẻ băng thông với các doanh nghiệp đã được xác minh. Một trong số ít dịch vụ chia sẻ băng thông chạy tốt trên IP VPS và trung tâm dữ liệu ngoài kết nối dân cư. Dùng xác thực đơn giản bằng token truyền qua tham số dòng lệnh. Hỗ trợ kiến trúc ARM cho Raspberry Pi và các thiết bị tương tự.\n"
  source: "16b119637b0e"
traffmonetizer.short_description:
  text: "Chia sẻ băng thông - chạy được trên VPS, xác thực bằng token"
  source: "d935a03e99a8"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.label:
  text: "Token"
  source: "d2089be67295"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.label:
  text: "Tên thiết bị"
  source: "155106be1173"
traffmonetizer.docker.env.TRAFFMONETIZER_TOKEN.description:
  text: "Đăng nhập tại <a href=\"https://app.traffmonetizer.io/sign-in?aff=2111758\">app.traffmonetizer.io</a>, nhấn F12 → Application → Local Storage → nhấp <code>https://app.traffmonetizer.io</code> → sao chép giá trị <code>authToken</code> (khoảng 54 ký tự: chữ số, một dấu <code>|</code>, rồi chữ cái và chữ số)"
  source: "94912e2bae8a"
traffmonetizer.docker.env.TRAFFMONETIZER_DEVICE_NAME.description:
  text: "Tên hiển thị trên bảng điều khiển để quản lý thiết bị"
  source: "89a674907060"
traffmonetizer.earnings.notes:
  text: "IP VPS và trung tâm dữ liệu kiếm ít hơn IP dân cư. Vị trí ở Mỹ/EU kiếm nhiều hơn. Hỗ trợ nhiều IP qua mạng Docker."
  source: "6063df4f9b02"
traffmonetizer.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
traffmonetizer.cashout.notes:
  text: "Tối thiểu $10. Không còn PayPal. Trước tiên hãy lưu một phương thức thanh toán trong hồ sơ: USDT trên Solana hoặc TON (phí thấp nhất), Arbitrum (phí thấp) hoặc Tron TRC20 (phí mạng cao), hoặc chuyển khoản ngân hàng từ $1.000. Địa chỉ đầu tiên bạn lưu có hiệu lực ngay; đổi địa chỉ sau này cần xác nhận qua email. Bảng điều khiển có thể yêu cầu một liên hệ nhắn tin (WhatsApp, Telegram hoặc Skype) trước lần rút đầu tiên. Mỗi yêu cầu chỉ trả số đô la chẵn và phần xu còn lại trong số dư."
  source: "0bf13220a706"
traffmonetizer.payout.notes:
  text: "USDT trên chuỗi đã lưu trong cài đặt thanh toán của hồ sơ (Solana, TON, Arbitrum hoặc Tron), hoặc chuyển khoản ngân hàng. Địa chỉ nằm trong cài đặt của Traffmonetizer, không nằm trong container."
  source: "d0692ca0a738"
traffmonetizer.collector.credential_hint:
  text: "Đăng nhập tại <a href='https://app.traffmonetizer.io/sign-in?aff=2111758' target='_blank'>app.traffmonetizer.io</a>, nhấn F12 → Application → Local Storage → giá trị <b>authToken</b> (khoảng 54 ký tự: chữ số, một dấu <code>|</code>, rồi chữ cái và chữ số)."
  source: "8e328668bca3"
traffmonetizer.referral.bonus.referrer:
  text: "10% mỗi khoản thanh toán họ yêu cầu"
  source: "5f4e86916609"
traffmonetizer.requirements.note:
  text: "Điều khoản dịch vụ của Traffmonetizer yêu cầu IP dân cư, nhưng thực tế các nút VPS vẫn được chấp nhận."
  source: "d6ae5ddd33c1"
traffmonetizer.rating.cons.0.text:
  text: "Trustpilot chấm 1.9; người đánh giá từ 2023 đến tháng 11 năm 2026 cho biết khoản thanh toán chờ hàng tuần, hoặc được đánh dấu hoàn tất mà không có giao dịch tương ứng."
  source: "67ac54d8eec2"
traffmonetizer.rating.cons.1.text:
  text: "Cũng những người đánh giá đó cho biết live chat và hỗ trợ qua email không trả lời, có khi hàng tuần."
  source: "514323fc7b1f"
traffmonetizer.rating.cons.2.text:
  text: "Chỉ crypto hoặc chuyển khoản ngân hàng từ $1.000; PayPal không còn, và mỗi yêu cầu chỉ trả số đô la chẵn."
  source: "ad8194944e13"
traffmonetizer.rating.cons.3.text:
  text: "Điều khoản của Traffmonetizer yêu cầu IP dân cư, nên máy chủ trên kết nối máy chủ thuê nằm ngoài phạm vi điều khoản."
  source: "c247994b3fe3"
traffmonetizer.rating.cons.4.text:
  text: "Bốn người đánh giá trên Trustpilot từ 2023 đến 2025 cho biết thu nhập rất chậm, chẳng hạn một xu mỗi ngày trên bốn thiết bị, hoặc gần hai năm mới đạt $10."
  source: "16701da2a495"
traffmonetizer.rating.pros.0.text:
  text: "Một khoản thanh toán chỉ cần một địa chỉ crypto đã lưu và được xác nhận qua email; bảng điều khiển có thể yêu cầu một liên hệ nhắn tin."
  source: "8e85bb227772"
traffmonetizer.rating.pros.1.text:
  text: "Traffmonetizer phát hành image Docker riêng, traffmonetizer/cli_v2."
  source: "007cb0d9fa02"
unmineable.description:
  text: "Đào bằng CPU và nhận thanh toán bằng đồng coin bạn chọn, như SHIB, DOGE hoặc XMR. CashPilot chạy XMRig trên pool RandomX của unMineable, và unMineable quy đổi số Monero mà CPU của bạn đào được sang đồng coin của bạn. Nó trả tiền vào địa chỉ công khai của bạn khi số dư đạt ngưỡng thanh toán của đồng coin. Mỗi worker mà CashPilot triển khai đều mang mã giới thiệu unMineable của CashPilot, giúp giảm phí nền tảng của bạn từ 1% xuống 0.75%. Tiền điện có thể cao hơn số bạn kiếm được."
  source: "a91a1a6282bd"
unmineable.short_description:
  text: "Đào bằng CPU và nhận thanh toán bằng đồng coin bạn chọn"
  source: "03bd0d4f2004"
unmineable.docker.env.PAYOUT_COIN.label:
  text: "Coin nhận thanh toán"
  source: "1df0eef6b4db"
unmineable.docker.env.WALLET.label:
  text: "Địa chỉ nhận thanh toán"
  source: "a611868d7f79"
unmineable.docker.env.WORKER_NAME.label:
  text: "Tên worker"
  source: "73f1a739a9a5"
unmineable.docker.env.CPU_PERCENT.label:
  text: "Số luồng CPU tối đa (%)"
  source: "be64e751afbf"
unmineable.docker.env.RANDOMX_MODE.label:
  text: "Chế độ RandomX"
  source: "bbfb4f45c178"
unmineable.docker.env.PAYOUT_COIN.description:
  text: "Mã của một đồng coin mà unMineable trả, như SHIB, DOGE hoặc XMR"
  source: "219728b39fdb"
unmineable.docker.env.WALLET.description:
  text: "Địa chỉ công khai của bạn cho đồng coin đó. Không hỗ trợ các đồng coin cần memo hoặc tag."
  source: "8f546391732c"
unmineable.earnings.notes:
  text: "Ước tính gộp trước tiền điện, trả bằng đồng coin của bạn theo tỷ giá quy đổi của unMineable. Ngày 2026-11-25, 1 kH/s RandomX trị giá khoảng $1 mỗi tháng. Một CPU máy bàn chạy một nửa số luồng có thể tiêu thụ thêm 30 đến 50 W. Hãy kiểm tra mức tiêu thụ thực tế và giá điện để xem có lãi không."
  source: "cfe83489865c"
unmineable.payment.minimum_payout:
  text: "unMineable đặt theo từng đồng coin (0.03 XMR vào ngày 2026-11-26)"
  source: "490f58bdea80"
unmineable.payment.frequency:
  text: "Khi đạt ngưỡng thanh toán của đồng coin"
  source: "6132dc539a14"
unmineable.cashout.notes:
  text: "unMineable trả tiền vào địa chỉ của bạn khi số dư đạt ngưỡng thanh toán của đồng coin. Ngưỡng khác nhau theo đồng coin và mạng; CashPilot đọc ngưỡng mà unMineable báo cho địa chỉ của bạn."
  source: "119caa81a181"
unmineable.payout.notes:
  text: "Số dư là đã kiếm được nhưng chưa nhận cho đến khi unMineable trả vào địa chỉ này. Chuỗi phụ thuộc vào đồng coin bạn chọn."
  source: "25091c7aca36"
unmineable.collector.credential_hint:
  text: "Cùng địa chỉ nhận thanh toán và mã coin mà bạn đã dùng khi triển khai máy đào, ví dụ <b>XMR</b>. Chỉ nhập địa chỉ, không kèm coin, tên worker hay mã giới thiệu. Địa chỉ này công khai và không mở khóa được tiền."
  source: "420da7e418d8"
unmineable.referral.bonus.referrer:
  text: "0.25% phần thưởng đào của mỗi thợ đào được giới thiệu"
  source: "92d54e25b9de"
unmineable.referral.bonus.referee:
  text: "Phí nền tảng giảm từ 1% xuống 0.75%"
  source: "cd671ac34b5a"
unmineable.requirements.hosting_note:
  text: "Máy này báo cáo là kết nối máy chủ thuê. Hãy kiểm tra điều khoản của nhà cung cấp trước khi đào. Một số nhà cung cấp, bao gồm Hetzner Cloud, cấm việc này. Hãy kiểm tra chi phí điện thực tế trước khi dựa vào ước tính lợi nhuận."
  source: "8896f33e3cc8"
unmineable.mining.pool_fee_note:
  text: "unMineable thu phí nền tảng 1%. CashPilot thêm mã giới thiệu của mình (#awk6-j1z0) sau mỗi tên worker, giúp giảm phí của bạn xuống 0.75%. Sau đó unMineable trả cho người duy trì CashPilot 0.25% phần thưởng đào của bạn; bạn giữ 99.25%. Mỗi đồng coin có ngưỡng thanh toán riêng, ví dụ 0.03 XMR."
  source: "009c367f43f9"
unmineable.disclosure.sells:
  text: "điện toán"
  source: "b04a12f6483e"
unmineable.disclosure.third_party_traffic:
  text: "Không. Máy đào gửi công việc tới pool của unMineable."
  source: "8aebee2ead40"
unmineable.disclosure.data_collected:
  text: "Địa chỉ nhận thanh toán, coin, tên worker, hashrate và địa chỉ IP của bạn được gửi tới unMineable."
  source: "93b1e63a16f9"
unmineable.disclosure.isp_risk:
  text: "Một số mạng và trình phân giải DNS chặn kết nối tới pool đào."
  source: "6e2ea365730d"
unmineable.disclosure.account_rules:
  text: "Không cần tài khoản. Địa chỉ và coin chính là danh tính, và bất kỳ ai cũng có thể xem thống kê của chúng trên unmineable.com."
  source: "1e3669950a46"
unmineable.rating.cons.0.text:
  text: "unMineable giữ phí nền tảng 0.75% khi có mã giới thiệu và chỉ trả từ ngưỡng của mỗi đồng coin."
  source: "e1316430b7c0"
unmineable.rating.cons.1.text:
  text: "Một số nhà cung cấp máy chủ cấm đào tiền mã hóa."
  source: "75c328007375"
unmineable.rating.cons.2.text:
  text: "Tiền điện tăng thêm có thể cao hơn số coin kiếm được."
  source: "a64eb19765e6"
unmineable.rating.cons.3.text:
  text: "Thống kê của địa chỉ, kể cả số dư, công khai với bất kỳ ai biết địa chỉ đó."
  source: "59719921c793"
unmineable.rating.pros.0.text:
  text: "Máy đào gửi hash tới pool và không chuyển tiếp lưu lượng của ai khác."
  source: "717be3799617"
unmineable.rating.pros.1.text:
  text: "Bạn có thể đào vào một địa chỉ công khai bằng đồng coin bạn chọn mà không cần tạo tài khoản."
  source: "c0b45001dc5c"
uprock.description:
  text: "Uprock là một nền tảng DePIN (Mạng Hạ tầng Vật lý Phi tập trung) cho phép bạn kiếm tiền mã hóa bằng cách chia sẻ kết nối internet. Là một phần của hệ sinh thái Web3 rộng lớn hơn. Có image Docker cộng đồng nhưng không có image chính thức. Tiện ích trình duyệt là giao diện chính.\n"
  source: "10af70251bd4"
uprock.short_description:
  text: "Chia sẻ internet DePIN - thanh toán crypto, chủ yếu qua tiện ích trình duyệt"
  source: "8a2d46191a56"
uprock.earnings.notes:
  text: "Thu nhập dựa trên crypto/token. Không có image Docker chính thức — tiện ích trình duyệt là client chính."
  source: "efc9c728dbb6"
uprock.payment.minimum_payout:
  text: "250 UPT"
  source: "3a851670634a"
uprock.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
uprock.cashout.notes:
  text: "Token UPT, rút về ví Solana từ 250 UPT, với xác thực hai yếu tố được bật. Có áp dụng phí rút."
  source: "9a70ab978908"
uprock.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
uprock.rating.cons.0.text:
  text: "Trung tâm trợ giúp của UpRock cho biết tiền rút là token UPT về ví Solana, với mức tối thiểu 250 UPT."
  source: "0e76003a78e8"
uprock.rating.cons.1.text:
  text: "Phần thưởng là token UPT; người đánh giá và một bài đánh giá độc lập nói giá trị của chúng rất thấp."
  source: "15e178a37580"
uprock.rating.cons.2.text:
  text: "CashPilot không chạy UpRock: bạn dùng ứng dụng hoặc tiện ích riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "51f68f082425"
urnetwork.description:
  text: "URnetwork là một mạng VPN và chia sẻ băng thông phi tập trung. Bạn kiếm tiền bằng cách cung cấp băng thông với tư cách nhà cung cấp cộng đồng. Tệp thực thi của nhà cung cấp tự xác thực bằng email và mật khẩu tài khoản của bạn (lệnh con auth-provide) và lưu JWT phiên nhận được vào volume dữ liệu. Image Docker chính thức từ BringYour, Inc.\n"
  source: "b2d9fdade2ff"
urnetwork.short_description:
  text: "VPN/băng thông phi tập trung - xác thực email+mật khẩu, phiên JWT trong volume"
  source: "ee8666358a75"
urnetwork.docker.env.UR_USER_AUTH.label:
  text: "Email"
  source: "969ccbd3cf63"
urnetwork.docker.env.UR_PASSWORD.label:
  text: "Mật khẩu"
  source: "e7cf3ef4f17c"
urnetwork.docker.env.UR_USER_AUTH.description:
  text: "Email tài khoản URnetwork của bạn (thông tin đăng nhập bạn dùng tại <a href=\"https://ur.io\" target=\"_blank\">ur.io</a>). Tài khoản tạo bằng đăng nhập Google/Apple cần đặt mật khẩu trước. Cần tài khoản? Đăng ký tại <a href=\"https://ur.io/c?bonus=1Q3G19\" target=\"_blank\">ur.io/c?bonus=1Q3G19</a>"
  source: "d3842d2e50db"
urnetwork.docker.env.UR_PASSWORD.description:
  text: "Mật khẩu tài khoản URnetwork của bạn (không có khoảng trắng). Được dùng cho bước đăng nhập auth-provide của nhà cung cấp; sau đó phiên được lưu trong volume dữ liệu."
  source: "e8c9783f68ce"
urnetwork.earnings.notes:
  text: "Chạy được trên VPS và kết nối dân cư. Trả bằng SN25α (Bittensor subnet 25) theo mỗi epoch hằng tuần từ ngày 2026-10-06. Hỗ trợ chế độ proxy cho thiết lập nhiều IP."
  source: "0a7ce0725f33"
urnetwork.payment.frequency:
  text: "Theo epoch"
  source: "75743e03bad2"
urnetwork.payout.notes:
  text: "Đặt một coldkey Bittensor trên ur.io/app/account/earnings (ký bằng Talisman, TAO.com hoặc một ví WalletConnect), rồi nhận thưởng cho từng epoch đã chốt. Mỗi lần nhận thưởng trả gas bằng TAO từ một khóa gas EVM. CÁC EPOCH KHÔNG ĐƯỢC NHẬN SẼ HẾT HẠN, và các khoản thanh toán USDC cũ đã bị hủy khi không có ví nào được liên kết trong vòng 30 ngày."
  source: "3b2d56971147"
urnetwork.referral.bonus.referrer:
  text: "3 GiB dữ liệu UR miễn phí mỗi ngày cho mỗi người bạn, tối đa 20 người (là dữ liệu, không phải tiền)"
  source: "30d98f243d0b"
urnetwork.referral.bonus.referee:
  text: "3 GiB dữ liệu UR miễn phí mỗi ngày khi bạn dùng ít nhất 10 MiB qua ứng dụng trong 2 ngày trong vòng 90 ngày kể từ khi tham gia; nếu không, việc giới thiệu sẽ kết thúc"
  source: "a1453cf73091"
urnetwork.rating.cons.0.text:
  text: "Các epoch không được nhận sẽ hết hạn, và các khoản thanh toán USDC cũ đã bị hủy với những mạng không liên kết ví trong vòng 30 ngày."
  source: "8df4496c47ef"
urnetwork.rating.cons.1.text:
  text: "Từ tháng 10 năm 2026, phần thưởng được trả bằng SN25α, một token subnet của Bittensor, và mỗi lần nhận thưởng tốn gas bằng TAO."
  source: "f335a63825dc"
urnetwork.rating.cons.2.text:
  text: "URnetwork trước đây là BringYour; whitepaper đã lưu trữ của họ vẫn mang tên cũ."
  source: "117e18fed61e"
urnetwork.rating.pros.0.text:
  text: "URnetwork công bố mã nguồn client nhà cung cấp của họ."
  source: "c4d03ce2f3f7"
urnetwork.rating.pros.1.text:
  text: "URnetwork phát hành image Docker riêng, bringyour/community-provider, và chạy được trên kết nối VPS lẫn dân cư."
  source: "ded39ac96493"
urnetwork.rating.pros.2.text:
  text: "Nhận thưởng chỉ cần một ví Bittensor do bạn kiểm soát."
  source: "0810fa9d3a2e"
vast-ai.description:
  text: "Vast.ai là một chợ cloud GPU, nơi bạn cho các nhà nghiên cứu và nhà phát triển AI/ML thuê GPU NVIDIA của mình. Nền tảng gốc Docker, nơi bạn tự đặt giá theo giờ. Một RTX 3090 thường kiếm $0.20-0.40/giờ khi được thuê. Cần GPU NVIDIA với driver mới và kết nối internet ổn định. Doanh thu phụ thuộc nhiều vào mẫu GPU, chiến lược giá và nhu cầu thị trường.\n"
  source: "27599d9c6362"
vast-ai.short_description:
  text: "Chợ GPU - tự đặt giá, RTX 3090 ~$0.20-0.40/giờ"
  source: "74bf0bdf465f"
vast-ai.docker.env.VAST_API_KEY.label:
  text: "Khóa API"
  source: "23189d55f697"
vast-ai.docker.env.VAST_API_KEY.description:
  text: "Khóa API chủ máy Vast.ai lấy từ bảng điều khiển"
  source: "434902a5680d"
vast-ai.earnings.notes:
  text: "RTX 3090 ~$0.20-0.40/giờ, RTX 4090 ~$0.40-0.80/giờ khi được thuê. Mức sử dụng thay đổi. Cần GPU NVIDIA, máy chủ Linux, Docker và nvidia-container-toolkit. Tự đặt giá."
  source: "feb21f77d17e"
vast-ai.payment.frequency:
  text: "Hằng tuần (thứ Sáu)"
  source: "08d2916f2ff6"
vast-ai.cashout.notes:
  text: "Thu nhập tích lũy trong số dư Vast.ai. Rút qua Wise, PayPal hoặc Stripe."
  source: "4fd2a1b89e19"
vast-ai.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
vast-ai.referral.bonus.referrer:
  text: "3% số tiền người thuê được giới thiệu chi tiêu, trong suốt thời gian tồn tại tài khoản của họ, dưới dạng tín dụng giới thiệu; tối đa 75% có thể rút ra từ một tài khoản giới thiệu riêng"
  source: "a52e6fabeaac"
vast-ai.requirements.min_bandwidth:
  text: "100 Mbps"
  source: "c21afb7c4c51"
vast-ai.requirements.min_storage:
  text: "100GB"
  source: "2003463b0a63"
vast-ai.rating.cons.0.text:
  text: "Chủ máy chỉ kiếm tiền khi được thuê, và số liệu của chính Vast cho GPU phổ thông phụ thuộc vào loại thuê và điểm độ tin cậy."
  source: "e9c6b2047b24"
vast-ai.rating.cons.1.text:
  text: "CashPilot không chạy Vast.ai: bạn cài phần mềm chủ máy của Vast trên máy GPU của chính bạn, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Vast xây dựng việc cho thuê dựa trên Docker trên máy chủ Linux."
  source: "115860055e8e"
vast-ai.rating.pros.0.text:
  text: "Vast cho biết mức giá chủ máy đặt chính là mức họ nhận được, không bị trừ phí."
  source: "ebd16d43c26a"
vast-ai.rating.pros.1.text:
  text: "Thanh toán qua Wise, PayPal hoặc Stripe từ mức tối thiểu $20, lập hóa đơn hằng tuần; số dư nhỏ hơn được chuyển sang tuần sau."
  source: "1f51b1d2ddac"
wipter.description:
  text: "Wipter là một nền tảng chia sẻ băng thông có trên Windows, Mac, Linux và Android. Họ tuyên bố trả tới $1/GB băng thông chia sẻ với ngưỡng thanh toán tối thiểu $20. Nền tảng hoạt động tương tự các ứng dụng chia sẻ băng thông truyền thống, định tuyến lưu lượng hợp pháp qua các kết nối dân cư.\n"
  source: "4c6a5b747327"
wipter.short_description:
  text: "Chia sẻ băng thông - tuyên bố tới $1/GB, thanh toán tối thiểu $20"
  source: "01d7d7fa2c7d"
wipter.earnings.notes:
  text: "Tuyên bố tới $1/GB nhưng thu nhập thực tế thấp hơn. Thanh toán tối thiểu $20. Thu nhập thay đổi nhiều theo vị trí và nhu cầu."
  source: "2be529de3995"
wipter.payment.frequency:
  text: "Theo yêu cầu"
  source: "be820103712e"
wipter.cashout.notes:
  text: "Wipter không có bảng điều khiển web. Hãy mở ứng dụng Wipter trên máy tính hoặc điện thoại, đăng nhập, và gửi yêu cầu thanh toán ở đó khi số dư đạt $20. Wipter chỉ trả bằng USDT trên BNB Smart Chain (BEP20), vào ví bạn đặt trong mục Payments của ứng dụng; không có lựa chọn PayPal."
  source: "80cc5b3e017b"
wipter.payout.notes:
  text: "Chưa xác định: CashPilot chưa kiểm tra dịch vụ này giữ thu nhập của bạn ở đâu."
  source: "8d61a71de590"
wipter.referral.bonus.referrer:
  text: "10% thu nhập lưu lượng của họ khi họ đạt mức thanh toán tối thiểu, áp dụng cho mọi người bạn bạn giới thiệu"
  source: "1626bbf63745"
wipter.referral.bonus.referee:
  text: "Thưởng đăng ký $5"
  source: "ed267fc12fb2"
wipter.rating.cons.0.text:
  text: "CashPilot không chạy Wipter: bạn dùng ứng dụng máy tính hoặc điện thoại riêng của nhà cung cấp, nên CashPilot không thể triển khai hay cập nhật nó cho bạn. Điều khoản của nó chưa được kiểm tra đối với container."
  source: "fa32942c6b4f"
xmrig.description:
  text: "Đào Monero bằng CPU. CashPilot chạy XMRig, và pool bạn chọn trả Monero vào địa chỉ nhận thanh toán công khai của bạn. XMRig dùng 1% thời gian băm để ủng hộ các nhà phát triển. Tiền điện có thể cao hơn số XMR bạn kiếm được."
  source: "a578c826aa2d"
xmrig.short_description:
  text: "Đào Monero bằng CPU với pool bạn chọn"
  source: "67b33077256d"
xmrig.docker.env.WALLET.label:
  text: "Địa chỉ Monero"
  source: "a888ebb3ae9b"
xmrig.docker.env.POOL_URL.label:
  text: "Pool"
  source: "f13024272c38"
xmrig.docker.env.WORKER_NAME.label:
  text: "Tên worker"
  source: "73f1a739a9a5"
xmrig.docker.env.CPU_PERCENT.label:
  text: "Số luồng CPU tối đa (%)"
  source: "be64e751afbf"
xmrig.docker.env.RANDOMX_MODE.label:
  text: "Chế độ RandomX"
  source: "bbfb4f45c178"
xmrig.earnings.notes:
  text: "Ước tính gộp trước tiền điện. Ngày 2026-11-25, 1 kH/s trị giá khoảng $1 mỗi tháng theo giá XMR và độ khó mạng quan sát được. Một CPU máy bàn chạy một nửa số luồng có thể tiêu thụ thêm 30 đến 50 W. Hãy kiểm tra mức tiêu thụ thực tế và giá điện để xem có lãi không."
  source: "917ca0ef4712"
xmrig.payment.minimum_payout:
  text: "0.003 XMR (MoneroOcean, sau khi bạn hạ ngưỡng)"
  source: "69f37901c92d"
xmrig.payment.frequency:
  text: "Khi đạt ngưỡng của pool"
  source: "6c6d28b5c7e0"
xmrig.cashout.notes:
  text: "Pool trả tiền vào địa chỉ Monero của bạn khi số dư đạt ngưỡng của bạn. Pool giữ số dư cho đến khi trả cho bạn."
  source: "50ba1d778c7d"
xmrig.requirements.hosting_note:
  text: "Máy này báo cáo là kết nối máy chủ thuê. Hãy kiểm tra điều khoản của nhà cung cấp trước khi đào. Một số nhà cung cấp, bao gồm Hetzner Cloud, cấm việc này. Hãy kiểm tra chi phí điện thực tế trước khi dựa vào ước tính lợi nhuận."
  source: "8896f33e3cc8"
xmrig.mining.pool_fee_note:
  text: "MoneroOcean, pool mặc định, thu phí đào 0%. Ngưỡng thanh toán mặc định là 0.3 XMR, và bạn có thể hạ xuống 0.003 XMR. Các khoản thanh toán dưới 4 XMR có thể tốn tới 0.0004 XMR. Các pool khác tự đặt mức phí và ngưỡng."
  source: "0a5db026488f"
xmrig.disclosure.sells:
  text: "điện toán"
  source: "b04a12f6483e"
xmrig.disclosure.third_party_traffic:
  text: "Không. Máy đào gửi công việc tới các pool đào."
  source: "a74a269d9be1"
xmrig.disclosure.data_collected:
  text: "Địa chỉ Monero, tên worker và địa chỉ IP của bạn được gửi tới pool."
  source: "bd3caa18d6e2"
xmrig.disclosure.isp_risk:
  text: "Một số mạng và trình phân giải DNS chặn kết nối tới pool đào."
  source: "6e2ea365730d"
xmrig.disclosure.account_rules:
  text: "Hầu hết các pool Monero nhận diện bạn qua địa chỉ nhận thanh toán công khai."
  source: "c27e407843d1"
xmrig.rating.cons.0.text:
  text: "Một khoản thanh toán cần đủ XMR để đạt ngưỡng của pool."
  source: "4c765903b56d"
xmrig.rating.cons.1.text:
  text: "Một số nhà cung cấp máy chủ cấm đào tiền mã hóa."
  source: "75c328007375"
xmrig.rating.cons.2.text:
  text: "Tiền điện tăng thêm có thể cao hơn số XMR kiếm được."
  source: "e2c2f6aed230"
xmrig.rating.pros.0.text:
  text: "Máy đào gửi hash tới các pool và không chuyển tiếp lưu lượng của ai khác."
  source: "342d4fa7dcfd"
xmrig.rating.pros.1.text:
  text: "Máy đào là mã nguồn mở và image ghim một bản phát hành upstream đã ký."
  source: "d673694451d2"
xmrig.rating.pros.2.text:
  text: "Bạn có thể đào bằng một địa chỉ Monero công khai mà không cần xưng danh tính."
  source: "752cbb728aac"
