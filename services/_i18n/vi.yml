  text: "$1 cho mỗi khoản trong ba khoản thanh toán đầu tiên của họ, tối đa $3, nếu mỗi khoản diễn ra trong khoảng 1-3 tuần của nó"
  source: "ef642a125d1d"
iproyal.referral.bonus.referee:
  text: "$1 cho mỗi khoản trong ba khoản thanh toán đầu tiên của bạn, tối đa $3; lỡ một khoảng 1-3 tuần thì phần còn lại hết hạn"
