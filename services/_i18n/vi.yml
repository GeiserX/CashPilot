  source: "10ee30dd6977"
honeygain.rating.cons.4.text:
  text: "Điều khoản cho biết khách hàng doanh nghiệp dùng lưu lượng để thu thập dữ liệu web công khai, nhưng không nêu tên khách hàng nào, và bạn không thể biết khách hàng nào đang dùng kết nối của mình."
  source: "afddb18119bc"
honeygain.rating.cons.5.text:
  text: "Chính các phản hồi của Honeygain với đánh giá về thu nhập thấp nói rằng thu nhập phụ thuộc vào nhu cầu của mạng và vị trí; người đánh giá cho biết mất rất lâu mới đạt mức tối thiểu $20."
