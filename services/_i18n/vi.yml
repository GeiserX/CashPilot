  source: "b1ba1636070f"
earnapp.description:
  text: "EarnApp của Bright Data cho phép bạn bán băng thông chưa dùng để có thu nhập thụ động. Bright Data là mạng proxy lớn nhất thế giới, phục vụ thu thập dữ liệu cho các công ty trong Fortune 500. CashPilot chạy nó từ image riêng, image này tải bản EarnApp đã ghim phiên bản từ CDN của Bright Data ở lần khởi động đầu, kiểm tra sha256 và chạy ở chế độ lite chỉ với một UUID.\n"
  source: "ae6a864e8bbb"
earnapp.short_description:
  text: "Chia sẻ băng thông - được Bright Data hậu thuẫn"
  source: "1b9f049172c9"
earnapp.docker.env.EARNAPP_UUID.label:
  text: "UUID của nút"
  source: "085ebaea0cd9"
earnapp.docker.env.EARNAPP_UUID.description:
  text: "ID nút EarnApp của bạn: sdk-node- theo sau là 32 ký tự hex viết thường, giống như 'earnapp showid' in ra. Sau khi triển khai, hãy liên kết nó một lần bằng cách mở https://earnapp.com/r/ theo sau là UUID này khi đang đăng nhập EarnApp; nút chưa liên kết vẫn kiếm tiền nhưng không có gì vào số dư của bạn"
  source: "8338c981f36e"
earnapp.docker.health_signals.0.means:
  text: "EarnApp liên tục không kết nối được tới máy chủ của nó và khởi động lại, nên kiếm được rất ít hoặc không kiếm được gì. Hãy khởi động lại bản sao này; nếu vẫn tiếp diễn, hãy kiểm tra kết nối internet của máy này."
  source: "5a0ef895b7d5"
earnapp.device_link.steps:
  text: "Mở liên kết này khi đang đăng nhập EarnApp để thêm nút vào tài khoản của bạn. Cho đến khi bạn làm vậy, nút vẫn kiếm tiền nhưng không có gì vào số dư của bạn."
  source: "61827aa4281b"
earnapp.earnings.notes:
  text: "Phụ thuộc rất nhiều vào vị trí. IP ở Mỹ/EU kiếm nhiều nhất. Thu nhập tăng theo băng thông được sử dụng."
  source: "460beb388888"
earnapp.payment.frequency:
  text: "Theo yêu cầu (có tự động đổi thưởng: PayPal tối thiểu $10, Wise tối thiểu $10, Amazon tối thiểu $50)"
  source: "31879a4f4518"
earnapp.cashout.notes:
  text: "Bật tự động đổi thưởng một lần và EarnApp sẽ tự thanh toán mỗi khi số dư đạt mức tối thiểu của phương thức: PayPal $10, Wise $10, Amazon $50. Khoản thanh toán PayPal đến từ Bright Data Ltd. Vào tháng 10 năm 2026, một khoản thanh toán PayPal đến thấp hơn số dư đã đổi khoảng 2%."
  source: "a409f6b02e58"
earnapp.payout.notes:
  text: "Số dư do EarnApp giữ; đổi thưởng sang Amazon/Wise/PayPal."
  source: "7694deaf42b8"
earnapp.collector.credential_hint:
  text: "Đăng nhập tại <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, nhấn F12 → Application → Cookies, sao chép giá trị <b>oauth-refresh-token</b>."
  source: "9058ca90793f"
earnapp.referral.bonus.referrer:
  text: "10% thu nhập của họ trọn đời, trả thêm ngoài phần của họ"
  source: "981b8c4109b7"
earnapp.rating.cons.0.text:
  text: "Trung tâm trợ giúp của EarnApp cho biết việc cài nó trong container Docker, máy ảo, dịch vụ hosting hoặc máy chủ tại nhà bị nghiêm cấm, mà đó lại chính là cách CashPilot chạy nó."
  source: "f37a60bfdb30"
earnapp.rating.cons.1.text:
  text: "Cũng bài trợ giúp đó cho biết tài khoản bị phát hiện chạy theo cách này sẽ bị chấm dứt mà không báo trước và các khoản thanh toán đang chờ sẽ bị hủy."
  source: "a800fa42ea79"
earnapp.rating.pros.0.text:
  text: "Khoản thanh toán PayPal của chúng tôi đã đến vào tháng 10 năm 2026, thấp hơn số dư đã đổi khoảng 2%."
  source: "8f3b4f399fe9"
earnapp.rating.pros.1.text:
  text: "Mức tối thiểu $10 cho PayPal và Wise, với tính năng tự động đổi thưởng tự thanh toán."
  source: "9c8d5c20bc05"
earnapp.rating.pros.2.text:
  text: "EarnApp thuộc Bright Data, và khoản thanh toán PayPal đến từ Bright Data Ltd., một công ty có tên rõ ràng."
  source: "ead3e8e87bba"
earnfm.description:
  text: "Earn.fm trả tiền cho bạn khi chia sẻ băng thông internet. Bộ thu thập thu nhập xác thực bằng email/mật khẩu qua Supabase. Image Docker nhẹ, triển khai đơn giản (client Docker dùng một token UUID riêng).\n"
