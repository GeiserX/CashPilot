# The CashPilot glossary: one chosen word per product term, per locale.
#
# Every surface (web UI, Desktop, Android, cashpilot.club, the docs, the
# service catalog) uses these words, so the same thing has the same name
# everywhere. Translators read it before they translate.
#
# Shape: terms.<id>.{en, kind, note, <19 locales>}. Every value is a
# double-quoted string, so scripts/i18n_check.py's YAML parser and PyYAML
# both read it. kind is "term" (translate it with the word below) or
# "brand" (a name: keep the English word in every locale).
#
# Provider and product names (Honeygain, Pawns, Grass, Mysterium, Storj,
# Tailscale...) are never translated and are not listed here, unless the
# provider itself uses a local name.
#
# The word below is the base form. Inflect it as the sentence needs
# (plural, case, a button's imperative) and keep its stem.
#
# To change a word: change it here first, then in every locale file that
# uses it, in the same PR.

