{% extends "base.html" %}

{% block title %}{{ t('catalog.title') }}{% endblock %}
{% block page %}catalog{% endblock %}
{% block topbar_title %}{{ t('catalog.heading') }}{% endblock %}

{% block content %}
<!-- Filter Bar -->
<div class="filter-bar">
  <div class="filter-tabs">
    <button class="filter-tab active" data-category="all">{{ t('catalog.filter.all') }}</button>
    <button class="filter-tab" data-category="bandwidth">{{ t('catalog.filter.bandwidth') }}</button>
    <button class="filter-tab" data-category="depin">{{ t('catalog.filter.depin') }}</button>
    <button class="filter-tab" data-category="storage">{{ t('catalog.filter.storage') }}</button>
    <button class="filter-tab" data-category="compute">{{ t('catalog.filter.compute') }}</button>
    <button class="filter-tab" data-category="mining">{{ t('catalog.filter.mining') }}</button>
  </div>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="form-input" type="search" id="catalog-search" placeholder="{{ t('catalog.search') }}" aria-keyshortcuts="/">
    <kbd class="search-kbd">/</kbd>
  </div>
</div>

<!-- The user's own services, added from an image reference (filled by CP.loadCustomServices) -->
<div class="custom-services" id="custom-services"></div>

<!-- Service Grid -->
<div class="catalog-list table-scroll" id="catalog-grid">
  <div class="loading-line"><div class="spinner"></div> {{ t('catalog.loading') }}</div>
</div>
<p class="referral-note">{{ t('catalog.referral_note') }}</p>
{% endblock %}
