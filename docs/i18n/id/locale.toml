# Site strings for the id docs build (.github/scripts/docs-i18n.py).

[notices]
# On an English page shown in this locale because it has no translation yet.
untranslated = "Halaman ini belum diterjemahkan. Anda sedang membaca versi bahasa Inggris."
# On a page that stays English on purpose (docs/i18n/config.toml).
english_only = "Halaman ini hanya tersedia dalam bahasa Inggris."
# On a translation made from an older English page. {url} is the English page.
stale = "Versi bahasa Inggris halaman ini lebih baru. [Baca versi bahasa Inggris]({url})."

