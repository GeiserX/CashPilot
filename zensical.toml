[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
variant = "modern"
logo = "images/logo.svg"
favicon = "images/icon.svg"
font = false
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "content.code.copy",
  "content.action.edit",
  "search.highlight",
  "toc.follow",
  "navigation.instant",
  "navigation.instant.progress",
  "content.action.copy",
]
icon.repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/GeiserX/CashPilot"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/drumsergio/cashpilot"

[project.plugins.search]

# Renamed pages keep their old URLs alive (README-STANDARD 3.8). Built in.
[project.plugins.redirects.redirect_maps]
"architecture.md" = "how-it-works.md"
"contributing.md" = "development.md"
"ecosystem.md" = "related.md"

[project.plugins.llmstxt.sections]
Documentation = ["*.md", "*/*.md"]

# A preview image per page for links shared on chat apps and social sites
# (og:image and twitter:image). The card takes the site's own colours from
# docs/stylesheets/theme.css: the banner sky #000010 and the wordmark rose
# #fb7185; the logo is theme.logo. The font comes from Google Fonts at build
# time, which is why the docs workflow retries a failed font download.
[project.plugins.social]
cards_layout_options.background_color = "#000010"
cards_layout_options.color = "#fb7185"

[project.markdown_extensions]
admonition = {}
"pymdownx.details" = {}
"pymdownx.superfences".custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed".alternate_style = true
"pymdownx.highlight".anchor_linenums = true
"pymdownx.inlinehilite" = {}
# base_path reaches the repo ROOT so a docs page can include a real shipped
# file verbatim: the quickstart includes docker-compose.yml, so it cannot
# drift from what actually ships. A hand-copied one did: it published the
# worker's Docker-socket API on every interface and pinned :latest, both of
# which security-defaults.md forbids. check_paths makes a missing include
# FAIL the build instead of rendering an empty block.
"pymdownx.snippets".base_path = [".", "docs"]
"pymdownx.snippets".check_paths = true
"pymdownx.mark" = {}
attr_list = {}
md_in_html = {}
# Renders :material-xxx: shortcodes as real icons. Without this the feature
# cards on the home page print the literal shortcode text instead.
"pymdownx.emoji".emoji_index = "zensical.extensions.emoji.twemoji"
"pymdownx.emoji".emoji_generator = "zensical.extensions.emoji.to_svg"
tables = {}
toc.permalink = true
