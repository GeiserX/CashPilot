# Generated from mkdocs.yml by mkdocs-to-zensical.py; the why of every block is in
# new-repo/templates/zensical.toml. Edit this file, not mkdocs.yml, which is gone.

[project]
site_name = "CashPilot"
site_url = "https://geiserx.github.io/CashPilot/"
site_description = "Self-hosted passive income platform. Deploy, monitor and track 39 active services (50 catalogued) from one dashboard."
site_author = "Sergio Fernandez"
copyright = "Copyright &copy; 2026 Sergio Fernandez"
repo_url = "https://github.com/GeiserX/CashPilot"
repo_name = "GeiserX/CashPilot"
edit_uri = "edit/main/docs/"
strict = true
extra_css = ["stylesheets/theme.css"]
# Files that live under docs/ but must NEVER be published.
#
# Zensical builds EVERY file in docs/, whether or not it appears in nav, as
# MkDocs did. Agent working files once sat there and were live on the public
# site (/GOAL/ and /AUTOPILOT-WORKLOG/ answered HTTP 200): they published this
# project's internal planning, quoted the maintainer directly and printed a
# real Mysterium node identity address. The strict build does not catch a page
# left out of the nav; .github/scripts/site-check.py does, after the build.
# This list is what keeps these files off the site.
exclude_docs = """
# Any name with a capital letter is a repo-facing note, never a page
# (ROADMAP.md, CHANGELOG.md). design/ and notes/ hold material read on
# GitHub. research/ is NOT excluded: its pages are listed in the nav below.
[A-Z]*.md
design/
notes/
requirements-docs.txt
GOAL.md
AUTOPILOT-WORKLOG.md
DEFERRED-QUESTIONS.md
# The changelog and its archive are deliberately NOT part of the docs site.
# They belong beside the code, where someone comparing the version they run
# against the one they are about to pull will actually look, and their links
# are written relative to the REPOSITORY root (../CHANGELOG.md,
# docs/guides/proxybase.md) rather than to the site tree — which is also why
# --strict fails on them if they are published.
changelog-0.x-handwritten.md
"""
