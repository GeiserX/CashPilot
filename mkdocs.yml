site_name: CashPilot
site_url: https://geiserx.github.io/CashPilot/
site_description: Self-hosted passive income platform. Deploy, monitor and track 39 active services (50 catalogued) from one dashboard.
site_author: Sergio Fernandez
repo_url: https://github.com/GeiserX/CashPilot
repo_name: GeiserX/CashPilot
edit_uri: edit/main/docs/

# A warning is a broken link, a missing page or a page nobody can reach. All of
# them fail the build, locally and in CI, so nobody has to remember --strict.
strict: true

copyright: Copyright &copy; 2026 Sergio Fernandez

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/icon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# MkDocs reports most link problems as `info`, which --strict ignores. Every
# line here promotes one of them to a warning so the build fails on it:
#   nav.omitted_files   a Markdown file under docs/ that is in no nav entry and
#                       not in exclude_docs (a page nobody can reach, published
#                       at a public URL anyway);
#   nav.not_found       a nav entry whose file does not exist;
#   links.not_found     a relative link to a page or file that does not exist;
#   links.anchors       a link to a heading that does not exist;
#   links.absolute_links  a link written as /path/ (breaks under the /CashPilot/
#                       prefix of the site);
#   links.unrecognized_links  a relative link that leaves docs/ (../README.md).
#                       Repo files are linked by absolute GitHub URL instead.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  # Renamed pages keep their old URLs alive (README-STANDARD 3.8).
  - redirects:
      redirect_maps:
        architecture.md: how-it-works.md
        contributing.md: development.md
        ecosystem.md: related.md
        guides/README.md: guides/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # base_path reaches the repo ROOT so a docs page can include a real shipped
  # file verbatim -- the quickstart includes docker-compose.yml, so it cannot
  # drift from what actually ships. A hand-copied one did: it published the
  # worker's Docker-socket API on every interface and pinned :latest, both of
  # which security-defaults.md forbids.
  #
  # check_paths makes a missing include FAIL the build instead of rendering an
  # empty block, which would look like a quickstart with no compose file.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  # Renders :material-xxx: shortcodes as real icons. Without this the feature
  # cards on the home page print the literal shortcode text instead.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GeiserX/CashPilot
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/drumsergio/cashpilot

extra_css:
  - stylesheets/theme.css

# Files that live under docs/ but must NEVER be published.
#
# MkDocs builds EVERY file in docs_dir, whether or not it appears in nav — so
# these three were live on the public site despite being in no menu:
#   /GOAL/                -> HTTP 200
#   /AUTOPILOT-WORKLOG/   -> HTTP 200
# They are agent working files. Between them they published this project's
# internal planning verbatim, quoted the maintainer directly, and printed a
# real Mysterium node identity address, which links this public repository to a
# specific earning node.
#
# `mkdocs build --strict` does not catch this by default, because
# validation.nav.omitted_files defaults to `info`. Setting it to `warn` makes
# the strict build fail on any page left out of nav (files listed below are
# exempt). This list is what keeps these files off the site.
exclude_docs: |
  # Any name with a capital letter is a repo-facing note, never a page
  # (ROADMAP.md, CHANGELOG.md). design/ and notes/ hold material read on
  # GitHub. research/ is NOT excluded: its pages are listed in the nav below.
  [A-Z]*.md
  design/
  notes/
  requirements-docs.txt
  GOAL.md
  AUTOPILOT-WORKLOG.md
  DEFERRED-QUESTIONS.md
  # The changelog and its archive are deliberately NOT part of the docs site.
  # They belong beside the code, where someone comparing the version they run
  # against the one they are about to pull will actually look, and their links
  # are written relative to the REPOSITORY root (../CHANGELOG.md,
  # docs/guides/proxybase.md) rather than to the site tree — which is also why
  # --strict fails on them if they are published.
  changelog-0.x-handwritten.md

