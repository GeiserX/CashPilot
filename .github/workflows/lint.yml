name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"

      # The lockfile's ruff, so this gate and release.yml's cannot reach
      # different verdicts about the same commit.
      - name: Install uv
        run: pip install uv

      - name: Sync from the lockfile
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # It runs as root on the user's host, so a quoting slip is a real bug.
      - name: Shellcheck the Secure VM installer
        run: shellcheck scripts/cashpilot-vm
