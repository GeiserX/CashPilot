name: Docker Hub Description

on:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/dockerhub-description.yml]
  workflow_dispatch:

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Sync UI Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: drumsergio/cashpilot
          short-description: "Self-hosted dashboard that runs passive-income services in Docker and tracks what they earn"

      - name: Sync worker Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: drumsergio/cashpilot-worker
          short-description: "CashPilot worker: deploys and monitors the passive-income containers for the cashpilot UI"
