name: Catalog Check

# A new service should be one YAML file plus an optional collector. This is the
# fast feedback that makes that true: it validates the entry with the same
# strict loader the app uses, and proves the README tables still match the
# catalog. The README used to be hand-maintained and drifted — it kept
# publishing a per-IP device limit for weeks after the catalog dropped it.
#
# Deliberately separate from the full test job so a first-time contributor gets
# an answer in seconds rather than waiting on the whole suite.

on:
  pull_request:
    paths:
      - "services/**"
      - "README.md"
      - "scripts/generate_readme_tables.py"
      - ".github/workflows/catalog-check.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    # Public repo: GitHub-hosted runners are free, unlimited and ephemeral, and
    # a fork PR cannot reach the self-hosted fleet from here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install the minimum needed to read the catalog
        run: pip install pyyaml

      - name: Every service entry loads under the strict validator
        run: |
          python - <<'PY'
          import sys
          from app import catalog

          services = catalog.get_services()
          if not services:
              sys.exit("The catalog loaded ZERO services — an invalid entry is silently dropped at load.")
          print(f"{len(services)} service(s) loaded and valid.")
          PY

      - name: README service tables match the catalog
        run: python scripts/generate_readme_tables.py --check

      - name: Every service has a guide
        run: |
          python - <<'PY'
          import pathlib
          import sys

          from app import catalog

          missing = [
              s["slug"]
              for s in catalog.get_services()
              if not pathlib.Path(f"docs/guides/{s['slug']}.md").exists()
          ]
          if missing:
              sys.exit(
                  f"No guide for: {missing}\n"
                  "Generate a stub with: python scripts/new_service_stub.py <slug>"
              )
          print("Every catalogued service has a guide.")
          PY
