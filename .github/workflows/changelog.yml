name: Changelog

# Regenerates CHANGELOG.md from commit history after a release.
#
# WHY A PULL REQUEST AND NOT A PUSH
# ---------------------------------
# `main` requires a pull request (verified: required_pull_request_reviews is set
# and enforce_admins is false), so a job cannot push a regenerated file to it. It
# therefore opens a PR onto a FIXED branch — `chore/changelog` — which
# create-pull-request UPDATES in place rather than opening a new one each time.
# Without the fixed branch this would file a pull request per release.
#
# WHY MERGING IT DOES NOT CAUSE ANOTHER RELEASE
# --------------------------------------------
# release.yml runs once a day and releases only when one of these changed since
# the last tag: Dockerfile, entrypoint.sh, Dockerfile.worker, pyproject.toml,
# uv.lock, app/**, services/**, Dockerfile.tunnel, tunnel/**.
# CHANGELOG.md, cliff.toml and docs/** are all outside that list, so merging this
# PR cannot start a release loop. If you ever add CHANGELOG.md to that list,
# this workflow becomes a release loop; do not.
#
# WHY RELEASE.YML DISPATCHES THIS, AND WHY THIS DISPATCHES THE CHECKS
# -------------------------------------------------------------------
# release.yml pushes its tags with GITHUB_TOKEN, and events made with that token
# start no workflows, so the tag trigger below never fired for an automatic
# release and CHANGELOG.md sat at 1.13.0 for months. workflow_dispatch is the
# one event GITHUB_TOKEN may start, so release.yml dispatches this workflow
# after it publishes. The PR this opens is made with the same token, so GitHub
# holds its workflow runs at "action_required" until someone approves them, and
# the required checks (`test`, `build (strict)`) never report. The last step
# approves those runs and turns on auto-merge, so the PR merges itself once they
# pass.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # To approve the PR's own workflow runs (see the last step).
      actions: write
    steps:
      # Full history AND tags: git-cliff walks the tag graph, and a shallow
      # clone silently produces a changelog containing only the newest release
      # rather than failing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      # The generator can produce an empty or truncated file when the tag graph
      # is incomplete, and committing that would silently delete the changelog.
      # Refuse rather than open a PR that erases it.
      - name: Refuse to commit a truncated changelog
        run: |
          set -euo pipefail
          lines=$(wc -l < CHANGELOG.md)
          releases=$(grep -c '^## \[' CHANGELOG.md || true)
          echo "CHANGELOG.md: ${lines} lines, ${releases} release sections"
          if [ "${releases}" -lt 100 ]; then
            echo "::error::Only ${releases} release sections; the tag graph looks incomplete. Refusing."
            exit 1
          fi
          if ! grep -q 'UPGRADING.md' CHANGELOG.md; then
            echo "::error::The header lost its link to UPGRADING.md."
            exit 1
          fi

      - name: Open or update the changelog pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/changelog
          # Rebuilt from main each run: without this the branch accumulates
          # every past regeneration as a separate commit.
          delete-branch: false
          add-paths: CHANGELOG.md
          commit-message: 'docs: regenerate CHANGELOG.md'
          title: 'docs: regenerate CHANGELOG.md'
          body: |
            Regenerated from commit history by `.github/workflows/changelog.yml`.

            This PR is **updated in place** after each release rather than
            reopened, so it is normal for it to sit open and keep changing.

            `CHANGELOG.md` is not one of the files `release.yml` releases for,
            so merging this does not cause another release.

            What changed here is only ever a re-render of commits that are
            already on `main` — but read it before merging anyway: the grouping
            rules in `cliff.toml` are what decide whether a commit lands under
            **Fixes**, **Features** or **Other**, and a subject that lands in the
            wrong section is worth correcting there.

      # The PR above is opened with GITHUB_TOKEN, so GitHub holds the runs its
      # push started at "action_required" and the required checks never report.
      # Approve those runs (they only build and test CHANGELOG.md on a branch
      # this job just wrote) and let auto-merge land the PR once they pass.
      # Nothing to do when the changelog was already current and no PR exists.
      - name: Approve the PR's checks and queue the merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          # The runs appear a few seconds after the push; wait for them.
          for _ in $(seq 1 12); do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&status=action_required" --jq '.workflow_runs[].id')
            [ -n "$ids" ] && break
            sleep 10
          done
          for id in $ids; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
          done
          echo "approved: ${ids:-none}"
          gh pr merge "$PR" --auto --squash
